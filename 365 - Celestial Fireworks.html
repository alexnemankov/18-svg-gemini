<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>365 - Celestial Fireworks Matrix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    #canv {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    #canv:active {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
        "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="canv"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for Standalone Execution)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      fragColor = vec4(vec3(col * (1.0 / 6.0) * atten * maxDensity), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + smoothWidth, lum);
      fragColor = vec4(color.rgb * factor, color.a);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform int samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 accum = vec4(0.0);
      float totalWeight = 0.0;
      float fSamples = float(samples);
      float radius = (0.05 + bloomRadius * 0.45);

      for (int i = 0; i < 128; i++) {
        if (float(i) >= fSamples) break;
        float offset = (float(i) / (fSamples - 1.0) - 0.5) * 2.0;
        float weight = 1.0 - abs(offset);
        weight = weight * weight;
        vec2 sampleUv = vUv + vec2(offset * radius, 0.0);
        sampleUv.x = clamp(sampleUv.x, 0.0, 1.0);
        accum += texture(inputTexture, sampleUv) * weight;
        totalWeight += weight;
      }

      vec4 blurColor = (accum / max(totalWeight, 0.0001)) * intensity;
      fragColor = vec4(blurColor.rgb * tintColor, blurColor.a);
    }
    `;

    const finalPassFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform vec2 resolution;

    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;

    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;

    in vec2 vUv;
    out vec4 fragColor;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453123);
    }

    void main() {
      vec4 baseColor = texture(inputTexture, vUv);
      vec4 bloom = vec4(0.0);

      if (bloomEnabled) {
        bloom += texture(blur0Texture, vUv) * 0.5;
        bloom += texture(blur1Texture, vUv) * 0.3;
        bloom += texture(blur2Texture, vUv) * 0.15;
        bloom += texture(blur3Texture, vUv) * 0.07;
        bloom += texture(blur4Texture, vUv) * 0.03;
        bloom *= bloomStrength;
      }

      vec3 result = baseColor.rgb + bloom.rgb;

      if (raysEnabled) {
        vec3 rays = texture(raysTexture, vUv).rgb * raysColor * raysStrength;
        result += rays;
      }

      if (anamorphicEnabled) {
        vec3 flare = texture(anamorphicTexture, vUv).rgb;
        result += flare;
      }

      vec2 coord = (vUv - 0.5) * (resolution.x / max(resolution.y, 1.0));
      float rf = sqrt(dot(coord, coord)) * vignetteReduction;
      float rf2_1 = rf * rf + 1.0;
      float e = 1.0 / (rf2_1 * rf2_1);
      result *= clamp(e * vignetteBoost, 0.0, 1.0);

      if (noiseIntensity > 0.0001) {
        float grain = hash(vUv * resolution + vec2(time)) * 2.0 - 1.0;
        result += grain * noiseIntensity;
      }

      fragColor = vec4(result, baseColor.a);
    }
    `;

    const rgbPassFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float chromaticAberrationAmount;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float exposure;
    uniform float gammaLevel;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionGain;
    uniform float nightVisionNoise;
    uniform float crtIntensity;
    uniform float time;

    in vec2 vUv;
    out vec4 fragColor;

    vec2 applyFisheye(vec2 uv, float str, float rad) {
      if (abs(str) < 0.001) return uv;
      vec2 coord = (uv - 0.5) * 2.0;
      float r = length(coord);
      float rNorm = r / max(rad, 0.001);
      float factor = 1.0 + str * (rNorm * rNorm);
      coord = coord * factor;
      return coord * 0.5 + 0.5;
    }

    vec4 chromaticAberration(sampler2D tex, vec2 uv, float amount, vec2 dir) {
      if (amount <= 0.0001) return texture(tex, uv);
      float l = length(dir);
      vec2 d = l > 0.0001 ? (dir / l) : vec2(0.0);
      vec2 offset = d * amount * l;
      float r = texture(tex, uv - offset).r;
      float g = texture(tex, uv).g;
      float b = texture(tex, uv + offset).b;
      float a = texture(tex, uv).a;
      return vec4(r, g, b, a);
    }

    vec3 ACESFilmicToneMapping(vec3 x) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }

    vec3 finalLevels(vec3 col, vec3 inMin, vec3 inGamma, vec3 inMax) {
      vec3 res = clamp((col - inMin) / max(inMax - inMin, vec3(0.0001)), 0.0, 1.0);
      return pow(res, 1.0 / max(inGamma, vec3(0.0001)));
    }

    float hashNV(vec2 p) {
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453123);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float t, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float n = (hashNV(uv * 1000.0 + t * 15.0) - 0.5) * noiseAmt;
      lum = clamp((lum + n) * gain, 0.0, 1.0);
      vec3 nv = lum * vec3(0.15, 1.0, 0.25);
      if (crt > 0.0) {
        float scanline = sin(uv.y * resolution.y * 1.5) * 0.5 + 0.5;
        nv *= (1.0 - crt * (1.0 - scanline));
      }
      return nv;
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.0, 0.0, 0.0);
      vec3 c1 = vec3(0.15, 0.0, 0.4);
      vec3 c2 = vec3(0.8, 0.1, 0.3);
      vec3 c3 = vec3(0.98, 0.6, 0.05);
      vec3 c4 = vec3(1.0, 1.0, 0.85);

      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.5)  return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.5) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(pow(lum, 1.0 / max(sensitivity, 0.1)), 0.0, 1.0);
      if (crt > 0.0) {
        float scan = sin(uv.y * resolution.y * 1.2) * 0.5 + 0.5;
        heat *= (1.0 - crt * 0.5 * (1.0 - scan));
      }
      if (whiteHot) {
        return vec3(pow(heat, 0.85));
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 1.2, radius = 0.6, threshold = 0.15, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class InlinePostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.2,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.15,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.7,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xffbb44),
          raysColorHex: params.raysColorHex || '#ffbb44',

          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.3,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 48,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0xff88aa),
          anamorphicColorHex: params.anamorphicColorHex || '#ff88aa',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.012,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.1,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.6,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.01,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.5, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },

        });

          format: THREE.RGBAFormat,

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {

          new THREE.RawShaderMaterial({

      setSize(width, height, dpr = 1.0) {
        const w = Math.max(1, Math.round(width * dpr));
        const h = Math.max(1, Math.round(height * dpr));
        this.sceneTarget.setSize(w, h);
        this.copyPass.setSize(w, h);
        this.bloomPass.setSize(w, h);
        this.godRaysMaskPass.setSize(w, h);
        this.godRaysPingPong.setSize(w, h);
        this.anamorphicBrightPass.setSize(w, h);
        this.anamorphicBlurPass.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.rgbPass.setSize(w, h);

        this.finalPass.shader.uniforms.resolution.value.set(w, h);
        this.rgbPass.shader.uniforms.resolution.value.set(w, h);
        this.anamorphicBlurShader.uniforms.resolution.value.set(w, h);
      }

      renderScene(scene, camera) {
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        const f = this.finalPass.shader.uniforms;
        f.bloomEnabled.value = this.settings.bloomEnabled;
        f.bloomStrength.value = this.settings.bloomStrength;
        f.raysEnabled.value = this.settings.raysEnabled;
        f.raysStrength.value = this.settings.raysStrength;
        f.raysColor.value.copy(this.settings.raysColor);
        f.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        f.vignetteBoost.value = this.settings.vignetteBoost;
        f.vignetteReduction.value = this.settings.vignetteReduction;
        f.noiseIntensity.value = this.settings.noiseIntensity;

        const r = this.rgbPass.shader.uniforms;
        r.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        r.fisheyeStrength.value = this.settings.fisheyeStrength;
        r.fisheyeRadius.value = this.settings.fisheyeRadius;
        r.exposure.value = this.settings.exposure;
        r.gammaLevel.value = this.settings.gamma;
        r.minInputLevel.value = this.settings.minInputLevel;
        r.maxInputLevel.value = this.settings.maxInputLevel;
        r.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] || 0;
        r.thermalSensitivity.value = this.settings.thermalSensitivity;
        r.nightVisionGain.value = this.settings.nightVisionGain;
        r.nightVisionNoise.value = this.settings.nightVisionNoise;
        r.crtIntensity.value = this.settings.crtIntensity;
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Bloom Pass
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 10000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.shader.uniforms.inputTexture.value = this.finalPass.texture;
        this.rgbPass.render(this.renderer, true);
      }

        lens.add(this.settings, "chromaticAberration", 0, 0.1, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());

        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());

        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }

      light3Color: '#aaddff',
      light3PosX: -3.0,
      light3PosY: -2.0,
      light3PosZ: 4.0
    };

    // =========================================================================================
    // THREE.JS SETUP & SHADER PIPELINE
    // =========================================================================================
    const canvas = document.getElementById('canv');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const postProcessor = new PostProcessor(renderer);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const vertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const fragmentShader = `
    precision highp float;

    uniform vec2 uResolution;
    uniform float uTime;
    uniform vec2 uOffset;
    uniform vec2 uRot;
    uniform float uZoom;

    // Geometric Parameters
    uniform float uParticleCount;
    uniform float uBurstSpeed;
    uniform float uBurstScale;
    uniform float uDispersion;
    uniform float uSparkSharpness;
    uniform float uGlowFalloff;
    uniform float uFadeRate;
    uniform float uLiftScale;

    // Color Parameters
    uniform int uSchemeType;
    uniform vec3 uColorBase;
    uniform vec3 uColorGlow;
    uniform vec3 uColorHighlight;
    uniform vec3 uColorAccent;
    uniform vec3 uColorBg;
    uniform float uHueOffset;
    uniform float uInvertAchromatic;
    uniform float uIsGreenScreen;

    // Lighting Parameters
    uniform float uExposure;
    uniform float uLight1Intensity;
    uniform vec3 uLight1Color;
    uniform float uLight2Intensity;
    uniform vec3 uLight2Color;
    uniform vec3 uLight2Pos;
    uniform float uLight3Intensity;
    uniform vec3 uLight3Color;
    uniform vec3 uLight3Pos;

    // Antialias Setting
    uniform float uAntialias;

    in vec2 vUv;
    out vec4 fragColor;

    vec3 hsv(float h, float s, float v) {
      vec3 rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
      return v * mix(vec3(1.0), rgb, clamp(abs(s), 0.0, 1.0));
    }

    vec3 sampleColor(float R, float u, float i) {
      if (uSchemeType == 0) {
        return hsv(fract(R + uHueOffset), u, 1.0);
      } else if (uSchemeType == 1) {
        float gray = mix(0.55, 1.0, abs(u));
        if (uInvertAchromatic > 0.5) {
          return vec3(1.0 - gray * 0.85);
        }
        return vec3(gray);
      } else if (uSchemeType == 2) {
        if (mod(i, 6.0) < 1.0 || R > 0.8) {
          return uColorAccent;
        }
        float gray = mix(0.55, 1.0, abs(u));
        if (uInvertAchromatic > 0.5) {
          return vec3(1.0 - gray * 0.85);
        }
        return vec3(gray);
      } else if (uSchemeType == 3) {
        vec3 neutral = (R < 0.5) ? mix(uColorBase, uColorGlow, R * 2.0) : mix(uColorGlow, uColorHighlight, (R - 0.5) * 2.0);
        if (mod(i, 5.0) < 1.0 || R > 0.75) {
          return uColorAccent;
        }
        return mix(neutral, vec3(1.0), (1.0 - abs(u)) * 0.25);
      } else {
        vec3 col;
        if (R < 0.333) {
          col = mix(uColorBase, uColorGlow, R * 3.0);
        } else if (R < 0.666) {
          col = mix(uColorGlow, uColorHighlight, (R - 0.333) * 3.0);
        } else {
          col = mix(uColorHighlight, uColorAccent, (R - 0.666) * 3.0);
        }
        col = mix(col, vec3(1.0), (1.0 - abs(u)) * 0.35);
        return col;
      }
    }

    vec4 renderPass(vec2 fc) {
      vec2 p = (fc * 5.0 - uResolution * 2.5) / uResolution.y;
      p = p / max(uZoom, 0.01) - uOffset;

      mat2 rot2D = mat2(cos(uRot.x), -sin(uRot.x), sin(uRot.x), cos(uRot.x));
      p = rot2D * p;

      vec3 accumulatedSparks = vec3(0.0);
      float cp = cos(uRot.y);
      float sp = sin(uRot.y);

      for (float i = 1.0; i < 1200.0; i += 1.0) {
        if (i > uParticleCount) break;

        float g = ceil(i / 80.0);
        float T = fract(uTime * 0.3 * uBurstSpeed + g * 0.3 - mod(i, 9.0) * 0.003) * 5.0;
        float e = max(T - 1.0, 0.0);
        float u = fract(i / 40.0) * 2.0 - 1.0;
        float R = (e / (e + 0.5)) * uBurstScale;

        float theta = i * 2.4;
        float sinPhi = u;
        float cosPhi = sqrt(max(0.0, 1.0 - u * u));

        vec3 pos3 = vec3(
          R * cosPhi * cos(theta),
          R * sinPhi + (sqrt(max(0.0, T - e)) * 2.5 - 2.0) * uLiftScale,
          R * cosPhi * sin(theta)
        );

        pos3.yz = mat2(cp, -sp, sp, cp) * pos3.yz;

        vec2 center = cos(g * vec2(2.0, 4.0)) * uDispersion;
        vec2 delta = p + center - pos3.xy;

        float distSq = dot(delta, delta);
        if (distSq > 0.025) continue;

        float dist = sqrt(distSq);
        float l = dist * uSparkSharpness;
        float sparkIntensity = exp(uGlowFalloff - e * uFadeRate - l);

        vec3 lightFactor = uLight1Color * uLight1Intensity;

        vec3 toKey = normalize(uLight2Pos - vec3(delta, pos3.z));
        float keyDiff = max(0.0, dot(normalize(vec3(-delta * 2.0, 1.0)), toKey));
        lightFactor += uLight2Color * (uLight2Intensity * (0.35 + 0.65 * keyDiff));

        vec3 toRim = normalize(uLight3Pos - vec3(delta, pos3.z));
        float rimDiff = max(0.0, dot(normalize(vec3(delta * 2.0, 1.0)), toRim));
        lightFactor += uLight3Color * (uLight3Intensity * (0.25 + 0.75 * rimDiff));

        vec3 sparkColor = sampleColor(R / max(uBurstScale, 0.01), u, i);
        accumulatedSparks += sparkColor * (sparkIntensity * lightFactor * uExposure);
      }

      vec3 bg = uColorBg;
      if (uIsGreenScreen > 0.5) {
        bg = vec3(0.0, 1.0, 0.0);
        float sparkStrength = clamp(max(accumulatedSparks.r, max(accumulatedSparks.g, accumulatedSparks.b)), 0.0, 1.0);
        return vec4(mix(bg, accumulatedSparks, sparkStrength), 1.0);
      }

      if (uInvertAchromatic > 0.5 && (uSchemeType == 1 || uSchemeType == 2)) {
        bg = vec3(1.0);
        float sparkLum = clamp(dot(accumulatedSparks, vec3(0.333)), 0.0, 1.0);
        return vec4(mix(bg, accumulatedSparks, sparkLum), 1.0);
      }

      return vec4(bg + accumulatedSparks, 1.0);
    }

    void main() {
      if (uAntialias > 0.5) {
        vec4 col1 = renderPass(gl_FragCoord.xy + vec2(-0.25, 0.25));
        vec4 col2 = renderPass(gl_FragCoord.xy + vec2(0.25, -0.25));
        fragColor = (col1 + col2) * 0.5;
      } else {
        fragColor = renderPass(gl_FragCoord.xy);
      }
    }
    `;

    const uniforms = {
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uTime: { value: 0.0 },
      uOffset: { value: new THREE.Vector2(0.0, 0.0) },
      uRot: { value: new THREE.Vector2(0.0, 0.0) },
      uZoom: { value: 1.0 },

      uParticleCount: { value: params.particleCount },
      uBurstSpeed: { value: params.burstSpeed },
      uBurstScale: { value: params.burstScale },
      uDispersion: { value: params.dispersion },
      uSparkSharpness: { value: params.sparkSharpness },
      uGlowFalloff: { value: params.glowFalloff },
      uFadeRate: { value: params.fadeRate },
      uLiftScale: { value: params.liftScale },

      uSchemeType: { value: 0 },
      uColorBase: { value: new THREE.Color(params.colorBase) },
      uColorGlow: { value: new THREE.Color(params.colorGlow) },
      uColorHighlight: { value: new THREE.Color(params.colorHighlight) },
      uColorAccent: { value: new THREE.Color(params.colorAccent) },
      uColorBg: { value: new THREE.Color(params.colorBg) },
      uHueOffset: { value: params.hueOffset },
      uInvertAchromatic: { value: 0.0 },
      uIsGreenScreen: { value: 0.0 },

      uExposure: { value: params.exposure },
      uLight1Intensity: { value: params.light1Intensity },
      uLight1Color: { value: new THREE.Color(params.light1Color) },
      uLight2Intensity: { value: params.light2Intensity },
      uLight2Color: { value: new THREE.Color(params.light2Color) },
      uLight2Pos: { value: new THREE.Vector3(params.light2PosX, params.light2PosY, params.light2PosZ) },
      uLight3Intensity: { value: params.light3Intensity },
      uLight3Color: { value: new THREE.Color(params.light3Color) },
      uLight3Pos: { value: new THREE.Vector3(params.light3PosX, params.light3PosY, params.light3PosZ) },

      uAntialias: { value: 1.0 }
    };

    const material = new THREE.RawShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms,
      glslVersion: THREE.GLSL3
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    // =========================================================================================
    // STATE & PALETTE MANAGEMENT
    // =========================================================================================
    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;

      params.colorScheme = name;
      uniforms.uSchemeType.value = scheme.type;

      params.colorBase = scheme.base;
      params.colorGlow = scheme.glow;
      params.colorHighlight = scheme.highlight;
      params.colorAccent = scheme.accent;
      params.colorBg = scheme.bg;

      params.light1Color = scheme.light1Color;
      params.light2Color = scheme.light2Color;
      params.light3Color = scheme.light3Color;

      uniforms.uColorBase.value.set(params.colorBase);
      uniforms.uColorGlow.value.set(params.colorGlow);
      uniforms.uColorHighlight.value.set(params.colorHighlight);
      uniforms.uColorAccent.value.set(params.colorAccent);

      uniforms.uLight1Color.value.set(params.light1Color);
      uniforms.uLight2Color.value.set(params.light2Color);
      uniforms.uLight3Color.value.set(params.light3Color);

      if (!params.greenScreen) {
        uniforms.uColorBg.value.set(params.colorBg);
        document.body.style.backgroundColor = params.colorBg;
        renderer.setClearColor(params.colorBg, 1.0);
      }
    }

    function applyGreenScreen(enabled) {
      params.greenScreen = enabled;
      uniforms.uIsGreenScreen.value = enabled ? 1.0 : 0.0;
      if (enabled) {
        document.body.style.backgroundColor = '#00ff00';
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        document.body.style.backgroundColor = params.colorBg;
        renderer.setClearColor(params.colorBg, 1.0);
      }
    }

    function updateLighting() {
      uniforms.uExposure.value = params.exposure;
      uniforms.uLight1Intensity.value = params.light1Intensity;
      uniforms.uLight1Color.value.set(params.light1Color);

      uniforms.uLight2Intensity.value = params.light2Intensity;
      uniforms.uLight2Color.value.set(params.light2Color);
      uniforms.uLight2Pos.value.set(params.light2PosX, params.light2PosY, params.light2PosZ);

      uniforms.uLight3Intensity.value = params.light3Intensity;
      uniforms.uLight3Color.value.set(params.light3Color);
      uniforms.uLight3Pos.value.set(params.light3PosX, params.light3PosY, params.light3PosZ);
    }

    function updateUniforms() {
      uniforms.uParticleCount.value = params.particleCount;
      uniforms.uBurstSpeed.value = params.burstSpeed;
      uniforms.uBurstScale.value = params.burstScale;
      uniforms.uDispersion.value = params.dispersion;
      uniforms.uSparkSharpness.value = params.sparkSharpness;
      uniforms.uGlowFalloff.value = params.glowFalloff;
      uniforms.uFadeRate.value = params.fadeRate;
      uniforms.uLiftScale.value = params.liftScale;
      uniforms.uHueOffset.value = params.hueOffset;
      uniforms.uInvertAchromatic.value = params.invertAchromatic ? 1.0 : 0.0;
      uniforms.uAntialias.value = params.antialias ? 1.0 : 0.0;
      updateLighting();
    }

    // =========================================================================================
    // INTERACTION CONTROLS (Drag, Pan, Zoom)
    // =========================================================================================
    const targetOffset = new THREE.Vector2(0, 0);
    const targetRotation = new THREE.Vector2(0, 0);
    let targetZoom = 1.0;

    let isDragging = false;
    let isRotating = false;
    let dragStartPos = { x: 0, y: 0 };
    let lastMousePos = { x: 0, y: 0 };
    let didMoveSignificant = false;

    const PAN_SENSITIVITY = 0.0035;
    const ROTATION_SENSITIVITY = 0.005;

    // Procedural Scene Randomization (Excludes PostProcessor settings)
    function randomizeScene() {
      if (!params.clickToRandomize) return;

      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const movingPresets = ANIMATION_PRESETS.filter(p => p !== 'Static (No Movement)');

      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.animationPreset = movingPresets[Math.floor(Math.random() * movingPresets.length)];

      params.particleCount = Math.floor(650 + Math.random() * 450);
      params.burstScale = +(0.7 + Math.random() * 0.9).toFixed(2);
      params.burstSpeed = +(0.7 + Math.random() * 0.7).toFixed(2);
      params.dispersion = +(0.7 + Math.random() * 0.8).toFixed(2);
      params.sparkSharpness = Math.floor(100 + Math.random() * 70);
      params.glowFalloff = +(2.5 + Math.random() * 1.0).toFixed(2);
      params.fadeRate = +(0.7 + Math.random() * 0.7).toFixed(2);
      params.liftScale = +(0.7 + Math.random() * 0.7).toFixed(2);

      params.animSpeed = +(0.7 + Math.random() * 0.7).toFixed(2);
      params.rotationSpeed = +(0.6 + Math.random() * 0.8).toFixed(2);

      params.exposure = +(0.8 + Math.random() * 0.5).toFixed(2);
      params.light1Intensity = +(0.6 + Math.random() * 0.6).toFixed(2);
      params.light2Intensity = +(0.8 + Math.random() * 0.7).toFixed(2);
      params.light3Intensity = +(0.6 + Math.random() * 0.6).toFixed(2);

      applyColorScheme(params.colorScheme);
      updateUniforms();

      // PostProcessor settings are strictly preserved
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    function onPointerDown(e) {
      if (e.target.closest && e.target.closest('.lil-gui')) return;

      dragStartPos = { x: e.clientX, y: e.clientY };
      lastMousePos = { x: e.clientX, y: e.clientY };
      didMoveSignificant = false;

      if (e.button === 2 || e.shiftKey || e.button === 1) {
        isRotating = true;
      } else if (e.button === 0) {
        isDragging = true;
      }
    }

    function onPointerMove(e) {
      if (!isDragging && !isRotating) return;

      const deltaX = e.clientX - lastMousePos.x;
      const deltaY = e.clientY - lastMousePos.y;
      const totalDist = Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y);

      if (totalDist > 5) {
        didMoveSignificant = true;
      }

      if (isDragging) {
        targetOffset.x += (deltaX * PAN_SENSITIVITY * 5.0) / Math.max(targetZoom, 0.1);
        targetOffset.y -= (deltaY * PAN_SENSITIVITY * 5.0) / Math.max(targetZoom, 0.1);
      } else if (isRotating) {
        targetRotation.x += deltaX * ROTATION_SENSITIVITY;
        targetRotation.y += deltaY * ROTATION_SENSITIVITY;
      }

      lastMousePos = { x: e.clientX, y: e.clientY };
    }

    function onPointerUp(e) {
      if (!didMoveSignificant && params.clickToRandomize) {
        if (!(e.target.closest && e.target.closest('.lil-gui'))) {
          randomizeScene();
        }
      }
      isDragging = false;
      isRotating = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('contextmenu', (e) => {
      if (!(e.target.closest && e.target.closest('.lil-gui'))) {
        e.preventDefault();
      }
    });

    window.addEventListener('wheel', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomDelta = e.deltaY * -0.0015;
      targetZoom = THREE.MathUtils.clamp(targetZoom * (1.0 + zoomDelta), 0.15, 8.0);
    }, { passive: false });

    // Touch Support for Mobile / Tablet Devices
    let initialPinchDist = null;
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      if (e.touches.length === 1) {
        onPointerDown({
          clientX: e.touches[0].clientX,
          clientY: e.touches[0].clientY,
          button: 0,
          shiftKey: false,
          target: e.target
        });
      } else if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        isDragging = true;
        isRotating = false;
        dragStartPos = {
          x: (e.touches[0].clientX + e.touches[1].clientX) * 0.5,
          y: (e.touches[0].clientY + e.touches[1].clientY) * 0.5
        };
        lastMousePos = { ...dragStartPos };
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        onPointerMove({
          clientX: e.touches[0].clientX,
          clientY: e.touches[0].clientY
        });
      } else if (e.touches.length === 2 && initialPinchDist) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const zoomFactor = currentDist / Math.max(initialPinchDist, 1.0);
        targetZoom = THREE.MathUtils.clamp(targetZoom * (1.0 + (zoomFactor - 1.0) * 0.1), 0.15, 8.0);
        initialPinchDist = currentDist;

        const centerPos = {
          x: (e.touches[0].clientX + e.touches[1].clientX) * 0.5,
          y: (e.touches[0].clientY + e.touches[1].clientY) * 0.5
        };
        const deltaX = centerPos.x - lastMousePos.x;
        const deltaY = centerPos.y - lastMousePos.y;
        targetOffset.x += (deltaX * PAN_SENSITIVITY * 5.0) / Math.max(targetZoom, 0.1);
        targetOffset.y -= (deltaY * PAN_SENSITIVITY * 5.0) / Math.max(targetZoom, 0.1);
        lastMousePos = centerPos;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        onPointerUp({ target: e.target });
        initialPinchDist = null;
      }
    });

    // Keyboard Controls: 'H' key toggles lil-gui
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Window Resize Handling
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height);
      postProcessor.setSize(width, height, params.dpr);
      uniforms.uResolution.value.set(width * params.dpr, height * params.dpr);
    });

    // =========================================================================================
    // LIL-GUI SETUP
    // =========================================================================================
    const gui = new GUI({ title: 'Celestial Fireworks Matrix' });

    // 1. General & Quality
    const folderGeneral = gui.addFolder('General & Quality');
    folderGeneral.add(params, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      uniforms.uResolution.value.set(window.innerWidth * v, window.innerHeight * v);
    });
    folderGeneral.add(params, 'antialias').name('Three.js Antialiasing').onChange(v => {
      uniforms.uAntialias.value = v ? 1.0 : 0.0;
    });
    folderGeneral.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(applyGreenScreen);
    folderGeneral.add(params, 'clickToRandomize').name('Click Scene to Randomize');

    // 2. Animation & Motion
    const folderAnim = gui.addFolder('Animation & Motion');
    folderAnim.add(params, 'animationPreset', ANIMATION_PRESETS).name('Animation Style');
    folderAnim.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Global Speed');
    folderAnim.add(params, 'burstSpeed', 0.1, 3.0, 0.05).name('Burst Speed').onChange(v => uniforms.uBurstSpeed.value = v);
    folderAnim.add(params, 'rotationSpeed', 0.0, 3.0, 0.05).name('Auto Rotation');

    // 3. Geometry & Particle Fireworks
    const folderGeo = gui.addFolder('Geometry & Particle Fireworks');
    folderGeo.add(params, 'particleCount', 200, 1150, 10).name('Particle Count').onChange(v => uniforms.uParticleCount.value = v);
    folderGeo.add(params, 'burstScale', 0.2, 3.0, 0.05).name('Explosion Scale').onChange(v => uniforms.uBurstScale.value = v);
    folderGeo.add(params, 'dispersion', 0.2, 2.5, 0.05).name('Cluster Dispersion').onChange(v => uniforms.uDispersion.value = v);
    folderGeo.add(params, 'sparkSharpness', 40.0, 300.0, 1.0).name('Spark Sharpness').onChange(v => uniforms.uSparkSharpness.value = v);
    folderGeo.add(params, 'glowFalloff', 1.0, 5.0, 0.1).name('Glow Core Radius').onChange(v => uniforms.uGlowFalloff.value = v);
    folderGeo.add(params, 'fadeRate', 0.2, 3.0, 0.05).name('Fade Rate').onChange(v => uniforms.uFadeRate.value = v);
    folderGeo.add(params, 'liftScale', 0.2, 3.0, 0.05).name('Rocket Lift').onChange(v => uniforms.uLiftScale.value = v);

    // 4. Color Harmonies & Palettes
    const folderColor = gui.addFolder('Color Harmonies & Palettes');
    folderColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
    folderColor.add(params, 'invertAchromatic').name('Invert Achromatic (White BG)').onChange(v => {
      uniforms.uInvertAchromatic.value = v ? 1.0 : 0.0;
      applyColorScheme(params.colorScheme);
    });
    folderColor.add(params, 'hueOffset', 0.0, 1.0, 0.01).name('Original Hue Offset').onChange(v => uniforms.uHueOffset.value = v);
    folderColor.addColor(params, 'colorBase').name('Base Color').onChange(v => uniforms.uColorBase.value.set(v));
    folderColor.addColor(params, 'colorGlow').name('Glow Color').onChange(v => uniforms.uColorGlow.value.set(v));
    folderColor.addColor(params, 'colorHighlight').name('Highlight Color').onChange(v => uniforms.uColorHighlight.value.set(v));
    folderColor.addColor(params, 'colorAccent').name('Accent Color').onChange(v => uniforms.uColorAccent.value.set(v));
    folderColor.addColor(params, 'colorBg').name('Background Color').onChange(v => {
      if (!params.greenScreen) {
        uniforms.uColorBg.value.set(v);
        document.body.style.backgroundColor = v;
        renderer.setClearColor(params.colorBg, 1.0);
      }
    });

    // 5. Lighting & Exposure
    const folderLight = gui.addFolder('Lighting & Exposure');
    folderLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(v => uniforms.uExposure.value = v);
    folderLight.add(params, 'light1Intensity', 0.0, 3.0, 0.05).name('Light 1: Ambient').onChange(v => uniforms.uLight1Intensity.value = v);
    folderLight.addColor(params, 'light1Color').name('Light 1 Color').onChange(v => uniforms.uLight1Color.value.set(v));
    folderLight.add(params, 'light2Intensity', 0.0, 3.0, 0.05).name('Light 2: Key Light').onChange(v => uniforms.uLight2Intensity.value = v);
    folderLight.addColor(params, 'light2Color').name('Light 2 Color').onChange(v => uniforms.uLight2Color.value.set(v));
    folderLight.add(params, 'light2PosX', -10.0, 10.0, 0.5).name('Key Light X').onChange(updateLighting);
    folderLight.add(params, 'light2PosY', -10.0, 10.0, 0.5).name('Key Light Y').onChange(updateLighting);
    folderLight.add(params, 'light2PosZ', -10.0, 10.0, 0.5).name('Key Light Z').onChange(updateLighting);
    folderLight.add(params, 'light3Intensity', 0.0, 3.0, 0.05).name('Light 3: Rim Light').onChange(v => uniforms.uLight3Intensity.value = v);
    folderLight.addColor(params, 'light3Color').name('Light 3 Color').onChange(v => uniforms.uLight3Color.value.set(v));
    folderLight.add(params, 'light3PosX', -10.0, 10.0, 0.5).name('Rim Light X').onChange(updateLighting);
    folderLight.add(params, 'light3PosY', -10.0, 10.0, 0.5).name('Rim Light Y').onChange(updateLighting);
    folderLight.add(params, 'light3PosZ', -10.0, 10.0, 0.5).name('Rim Light Z').onChange(updateLighting);

    // 6. Post-Processing Suite Integration
    postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');

    // Initialize System State
    renderer.setPixelRatio(params.dpr);
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    uniforms.uResolution.value.set(window.innerWidth * params.dpr, window.innerHeight * params.dpr);
    applyColorScheme(params.colorScheme);
    updateUniforms();

    // =========================================================================================
    // MAIN ANIMATION LOOP (Auto Infinite Animation)
    // =========================================================================================
    const clock = new THREE.Clock();
    let virtualTime = 0.0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const animSpeed = params.animSpeed;
      virtualTime += delta * animSpeed;

      const preset = params.animationPreset;
      if (preset === 'Celestial Orbit (Default)') {
        targetRotation.x += delta * 0.15 * params.rotationSpeed * animSpeed;
        targetRotation.y = Math.sin(virtualTime * 0.25) * 0.12;
        targetOffset.x = Math.sin(virtualTime * 0.2) * 0.08;
      } else if (preset === 'Harmonic Pulse') {
        const breath = Math.sin(virtualTime * 0.6) * 0.12;
        uniforms.uBurstScale.value = params.burstScale * (1.0 + breath);
        targetRotation.x += delta * 0.08 * params.rotationSpeed * animSpeed;
        targetRotation.y = Math.cos(virtualTime * 0.3) * 0.08;
      } else if (preset === 'Ethereal Float') {
        targetOffset.x = Math.sin(virtualTime * 0.25) * 0.15;
        targetOffset.y = Math.cos(virtualTime * 0.35) * 0.12;
        targetRotation.x = Math.sin(virtualTime * 0.18) * 0.15;
        targetRotation.y = Math.cos(virtualTime * 0.22) * 0.08;
      } else if (preset === 'Zenith Glide') {
        targetOffset.x = Math.sin(virtualTime * 0.2) * 0.25;
        targetRotation.x += delta * 0.1 * params.rotationSpeed * animSpeed;
        targetRotation.y = 0.15 + Math.sin(virtualTime * 0.2) * 0.06;
      } else if (preset === 'Cosmic Figure-8') {
        targetRotation.x = Math.sin(virtualTime * 0.25) * 0.22;
        targetRotation.y = Math.sin(virtualTime * 0.5) * 0.12;
        targetOffset.x = Math.sin(virtualTime * 0.2) * 0.12;
        targetOffset.y = Math.cos(virtualTime * 0.4) * 0.08;
      } else if (preset === 'Starlight Pendulum') {
        targetRotation.x = Math.sin(virtualTime * 0.35) * 0.28;
        targetRotation.y = Math.abs(Math.sin(virtualTime * 0.35)) * 0.1;
        targetOffset.y = Math.sin(virtualTime * 0.25) * 0.1;
      } else if (preset === 'Deep Space Swell') {
        targetRotation.x += delta * 0.06 * params.rotationSpeed * animSpeed;
        targetRotation.y = Math.sin(virtualTime * 0.15) * 0.18;
        targetOffset.x = Math.cos(virtualTime * 0.18) * 0.1;
        targetOffset.y = Math.sin(virtualTime * 0.22) * 0.06;
      } else if (preset === 'Static (No Movement)') {
        // Zero camera or offset movement
      }

      // Smooth interpolation / damping for controls
      uniforms.uRot.value.x += (targetRotation.x - uniforms.uRot.value.x) * 0.08;
      uniforms.uRot.value.y += (targetRotation.y - uniforms.uRot.value.y) * 0.08;
      uniforms.uOffset.value.x += (targetOffset.x - uniforms.uOffset.value.x) * 0.08;
      uniforms.uOffset.value.y += (targetOffset.y - uniforms.uOffset.value.y) * 0.08;
      uniforms.uZoom.value += (targetZoom - uniforms.uZoom.value) * 0.08;

      uniforms.uTime.value = virtualTime;

      // Render through PostProcessor pipeline
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
</html>
