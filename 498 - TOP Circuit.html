<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F4F5F7;
    }

    canvas#canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #F4F5F7;
      cursor: grab;
      touch-action: none;
    }

    canvas#canvas:active {
      cursor: grabbing;
    }

    div#controller {
      position: absolute;
      bottom: 1.6rem;
      left: 0;
      width: 100%;
      z-index: 10;
      pointer-events: auto;
    }

    div#controller > p > input#rangeMax {
      width: 90%;
      margin: 0 5%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas">Canvas not supported.</canvas>
  <div id="controller">
    <p><input id="rangeMax" type="range" min="0" max="360" value="360"></p>
  </div>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    /*
    * File Name / circuit.js
    * Created Date / July 07, 2020
    * Author / Toshiya Marukubo
    * Twitter / https://twitter.com/toshiyamarukubo
    */

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min);
    }

    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function hexToHsl(hex) {
      const { r, g, b } = hexToRgb(hex);
      const rNorm = r / 255, gNorm = g / 255, bNorm = b / 255;
      const max = Math.max(rNorm, gNorm, bNorm), min = Math.min(rNorm, gNorm, bNorm);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case rNorm: h = ((gNorm - bNorm) / d + (gNorm < bNorm ? 6 : 0)) * 60; break;
          case gNorm: h = ((bNorm - rNorm) / d + 2) * 60; break;
          case bNorm: h = ((rNorm - gNorm) / d + 4) * 60; break;
        }
      }
      return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function isColorDark(hex) {
      const { r, g, b } = hexToRgb(hex);
      const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      return luma < 128;
    }

    const PALETTES = {
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        background: '#220901',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        background: '#000000',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000']
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        background: '#0D001D',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12']
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        background: '#061210',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        background: '#05140A',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        background: '#0E0618',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        background: '#090612',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        background: '#05020F',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      }
    };

    const NEUTRALS = [
      '#f5f5f4', '#e7e5e4', '#d6d3d1', '#a8a29e', '#78716c', '#57534e', '#44403c',
      '#cbd5e1', '#94a3b8', '#64748b', '#475569', '#334155', '#1e293b',
      '#d7cfc7', '#c2b69d', '#9e9282', '#6b6155'
    ];

    const COLOR_SCHEMES = [
      'Original',
      'Monochromatic',
      'Analogous',
      'Complementary',
      'Split-complementary',
      'Triadic',
      'Tetradic',
      'Double split-complementary',
      'Achromatic',
      'Achromatic + Accent',
      'Neutral + accent',
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)',
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)'
    ];

    const params = {
      // Background & Screen
      greenscreen: false,
      backgroundColor: '#F4F5F7',
      blendMode: 'source-over',

      // Color Theme
      colorScheme: 'Original',
      primaryColor: '#0077ff',
      accentColor: '#ff1744',
      baseHue: 200,
      rangeMax: 360,
      saturation: 80,
      lightness: 60,
      opacity: 1.0,
      glow: 0,

      // Geometry & Circuit
      dist: 20,
      lineWidth: 10,
      lineCap: 'round',

      // Motion
      speed: 1.0,
      waveFreq: 10,

      // Procedural Variation
      clickToRandomize: true
    };

    const transform = {
      x: 0,
      y: 0,
      scale: 1.0
    };

    const controllers = {};
    let canvas, ctx, rangeMaxInput, controllerDiv;
    let X, Y, shapes = [];
    let gui;

    function getShapeStroke(shape) {
      const scheme = params.colorScheme;
      const osc = Math.sin(shape.rad * params.waveFreq);
      const t = (osc + 1) * 0.5;
      const opacity = params.opacity;

      if (PALETTES[scheme]) {
        const pal = PALETTES[scheme].colors;
        const idx = (shape.paletteOffset + Math.floor(t * (pal.length - 1))) % pal.length;
        const hex = pal[idx];
        const { r, g, b } = hexToRgb(hex);
        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
      }

      const baseH = (params.baseHue + hexToHsl(params.primaryColor).h) % 360;

      switch (scheme) {
        case 'Original': {
          const hue = Math.abs((osc * shape.color) % 360);
          return `hsla(${hue}, ${params.saturation}%, ${params.lightness}%, ${opacity})`;
        }

        case 'Monochromatic': {
          const l = 30 + t * 45;
          const s = Math.max(20, params.saturation * (0.6 + 0.4 * (1 - Math.abs(osc))));
          return `hsla(${baseH}, ${s}%, ${l}%, ${opacity})`;
        }

        case 'Analogous': {
          const h = (baseH + osc * 35 + 360) % 360;
          const l = 45 + t * 25;
          return `hsla(${h}, ${params.saturation}%, ${l}%, ${opacity})`;
        }

        case 'Complementary': {
          const targetH = shape.typeVariant % 2 === 0 ? baseH : (baseH + 180) % 360;
          const h = (targetH + osc * 15 + 360) % 360;
          return `hsla(${h}, ${params.saturation}%, ${params.lightness}%, ${opacity})`;
        }

        case 'Split-complementary': {
          const angles = [baseH, (baseH + 150) % 360, (baseH + 210) % 360];
          const h = (angles[shape.typeVariant % 3] + osc * 12 + 360) % 360;
          return `hsla(${h}, ${params.saturation}%, ${params.lightness}%, ${opacity})`;
        }

        case 'Triadic': {
          const angles = [baseH, (baseH + 120) % 360, (baseH + 240) % 360];
          const h = (angles[shape.typeVariant % 3] + osc * 12 + 360) % 360;
          return `hsla(${h}, ${params.saturation}%, ${params.lightness}%, ${opacity})`;
        }

        case 'Tetradic': {
          const angles = [baseH, (baseH + 90) % 360, (baseH + 180) % 360, (baseH + 270) % 360];
          const h = (angles[shape.typeVariant % 4] + osc * 10 + 360) % 360;
          return `hsla(${h}, ${params.saturation}%, ${params.lightness}%, ${opacity})`;
        }

        case 'Double split-complementary': {
          const angles = [
            (baseH - 30 + 360) % 360,
            (baseH + 30) % 360,
            (baseH + 150) % 360,
            (baseH + 210) % 360
          ];
          const h = (angles[shape.typeVariant % 4] + osc * 10 + 360) % 360;
          return `hsla(${h}, ${params.saturation}%, ${params.lightness}%, ${opacity})`;
        }

        case 'Achromatic': {
          const activeBg = params.greenscreen ? '#00ff00' : params.backgroundColor;
          const isDark = isColorDark(activeBg);
          const l = isDark ? (25 + t * 70) : (10 + (1 - t) * 65);
          return `hsla(0, 0%, ${l}%, ${opacity})`;
        }

        case 'Achromatic + Accent': {
          if (shape.isAccent) {
            const { r, g, b } = hexToRgb(params.accentColor);
            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
          }
          const activeBg = params.greenscreen ? '#00ff00' : params.backgroundColor;
          const isDark = isColorDark(activeBg);
          const l = isDark ? (20 + t * 75) : (10 + (1 - t) * 70);
          return `hsla(0, 0%, ${l}%, ${opacity})`;
        }

        case 'Neutral + accent': {
          if (shape.isAccent) {
            const { r, g, b } = hexToRgb(params.accentColor);
            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
          }
          const neutralHex = NEUTRALS[shape.neutralIndex % NEUTRALS.length];
          const { r, g, b } = hexToRgb(neutralHex);
          return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }

        default:
          return `hsla(${(osc * shape.color + 360) % 360}, ${params.saturation}%, ${params.lightness}%, ${opacity})`;
      }
    }

    function Shape(context, x, y, i, j) {
      this.ctx = context;
      this.init(x, y, i, j);
    }

    Shape.prototype.init = function(x, y, i, j) {
      this.x = x;
      this.y = y;
      this.i = i;
      this.j = j !== undefined ? j : i;
      this.v = { x: 0, y: 0 };
      this.num = rand(0, 1);
      this.a = i * 0.1;
      this.rad = this.a * Math.PI / 180;
      this.color = rand(0, params.rangeMax);
      this.paletteOffset = rand(0, 10);
      this.typeVariant = rand(0, 11);
      this.isAccent = Math.random() < 0.22;
      this.neutralIndex = rand(0, NEUTRALS.length - 1);
      this.par = 1;
    };

    Shape.prototype.draw = function() {
      const c = this.ctx;
      c.save();
      c.lineWidth = params.lineWidth;
      c.lineCap = params.lineCap;

      const stroke = getShapeStroke(this);
      if (params.glow > 0) {
        c.shadowBlur = params.glow;
        c.shadowColor = stroke;
      }

      c.strokeStyle = stroke;
      c.beginPath();
      if (this.num === 0) {
        c.moveTo(this.x, this.y);
        c.lineTo(this.x + params.dist, this.y + params.dist);
      } else {
        c.moveTo(this.x, this.y + params.dist);
        c.lineTo(this.x + params.dist, this.y);
      }
      c.stroke();
      c.restore();
    };

    Shape.prototype.changeColor = function() {
      this.color = rand(0, params.rangeMax);
      this.paletteOffset = rand(0, 10);
      this.typeVariant = rand(0, 11);
      this.isAccent = Math.random() < 0.22;
      this.neutralIndex = rand(0, NEUTRALS.length - 1);
    };

    Shape.prototype.updateParams = function() {
      this.a += 0.1 * params.speed;
      this.rad = this.a * Math.PI / 180;
    };

    Shape.prototype.render = function() {
      this.updateParams();
      this.draw();
    };

    function initShapes() {
      shapes = [];
      const dist = params.dist;
      const cols = Math.ceil(X / dist);
      const rows = Math.ceil(Y / dist);
      const padX = Math.min(25, Math.ceil(cols * 0.4));
      const padY = Math.min(25, Math.ceil(rows * 0.4));

      for (let i = -padX; i <= cols + padX; i++) {
        for (let j = -padY; j <= rows + padY; j++) {
          const s = new Shape(ctx, i * dist, j * dist, i, j);
          shapes.push(s);
        }
      }
    }

    function rerollGridPattern() {
      for (let i = 0; i < shapes.length; i++) {
        shapes[i].num = rand(0, 1);
      }
    }

    function applyScheme(schemeName) {
      params.colorScheme = schemeName;
      if (PALETTES[schemeName]) {
        params.backgroundColor = PALETTES[schemeName].background;
      } else if (schemeName === 'Original') {
        params.backgroundColor = '#F4F5F7';
        params.saturation = 80;
        params.lightness = 60;
      } else if (schemeName === 'Achromatic') {
        params.backgroundColor = '#121212';
        params.saturation = 0;
      } else if (schemeName === 'Achromatic + Accent') {
        params.backgroundColor = '#101014';
        params.accentColor = '#ff1744';
      } else if (schemeName === 'Neutral + accent') {
        params.backgroundColor = '#18181b';
        params.accentColor = '#ff9100';
      }

      controllers.backgroundColor?.updateDisplay();
      controllers.saturation?.updateDisplay();
      controllers.lightness?.updateDisplay();
      controllers.accentColor?.updateDisplay();

      for (let i = 0; i < shapes.length; i++) {
        shapes[i].changeColor();
      }
    }

    function resetView() {
      transform.x = 0;
      transform.y = 0;
      transform.scale = 1.0;
      controllers.zoom?.updateDisplay();
      controllers.panX?.updateDisplay();
      controllers.panY?.updateDisplay();
    }

    function randomizeScene() {
      params.colorScheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];

      if (!params.greenscreen) {
        if (PALETTES[params.colorScheme]) {
          params.backgroundColor = PALETTES[params.colorScheme].background;
        } else if (params.colorScheme === 'Achromatic') {
          params.backgroundColor = Math.random() < 0.5 ? '#111111' : '#f5f5f7';
        } else if (params.colorScheme === 'Original') {
          params.backgroundColor = '#F4F5F7';
        } else if (params.colorScheme === 'Neutral + accent') {
          params.backgroundColor = Math.random() < 0.6 ? '#18181b' : '#f5f5f0';
        } else {
          params.backgroundColor = Math.random() < 0.75 ? '#090a10' : '#f0f3f6';
        }
      }

      params.primaryColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      params.accentColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      params.baseHue = rand(0, 360);
      params.rangeMax = rand(120, 360);
      params.saturation = rand(65, 100);
      params.lightness = rand(40, 75);
      params.opacity = +(Math.random() * 0.35 + 0.65).toFixed(2);
      params.glow = Math.random() < 0.35 ? rand(6, 18) : 0;
      params.blendMode = Math.random() < 0.25 ? 'lighter' : 'source-over';

      params.dist = rand(14, 32);
      params.lineWidth = Math.max(2, +(params.dist * (Math.random() * 0.35 + 0.25)).toFixed(1));
      params.lineCap = ['round', 'square', 'butt'][rand(0, 2)];

      params.speed = +(Math.random() * 2.2 + 0.5).toFixed(2);
      params.waveFreq = rand(5, 25);

      if (rangeMaxInput) {
        rangeMaxInput.value = params.rangeMax;
      }

      initShapes();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function setupGUI() {
      gui = new GUI({ title: 'Circuit Settings' });

      // Background & Greenscreen
      const folderBg = gui.addFolder('Background & Greenscreen');
      controllers.greenscreen = folderBg.add(params, 'greenscreen').name('Greenscreen (#00ff00)');
      controllers.backgroundColor = folderBg.addColor(params, 'backgroundColor').name('Background Color');
      controllers.blendMode = folderBg.add(params, 'blendMode', ['source-over', 'lighter', 'screen']).name('Blend Mode');

      // Color Theme
      const folderColor = gui.addFolder('Color Schemes & Appearance');
      controllers.colorScheme = folderColor.add(params, 'colorScheme', COLOR_SCHEMES).name('Scheme').onChange(applyScheme);
      controllers.primaryColor = folderColor.addColor(params, 'primaryColor').name('Primary Color');
      controllers.accentColor = folderColor.addColor(params, 'accentColor').name('Accent Color');
      controllers.baseHue = folderColor.add(params, 'baseHue', 0, 360, 1).name('Base Hue');
      controllers.rangeMax = folderColor.add(params, 'rangeMax', 0, 360, 1).name('Hue Range (Spread)').onChange((val) => {
        if (rangeMaxInput) rangeMaxInput.value = val;
        for (let i = 0; i < shapes.length; i++) shapes[i].changeColor();
      });
      controllers.saturation = folderColor.add(params, 'saturation', 0, 100, 1).name('Saturation (%)');
      controllers.lightness = folderColor.add(params, 'lightness', 10, 90, 1).name('Lightness (%)');
      controllers.opacity = folderColor.add(params, 'opacity', 0.1, 1.0, 0.05).name('Line Opacity');
      controllers.glow = folderColor.add(params, 'glow', 0, 30, 1).name('Glow Blur');

      // Geometry & Circuit
      const folderGeo = gui.addFolder('Geometry & Circuit');
      controllers.dist = folderGeo.add(params, 'dist', 8, 60, 1).name('Grid Spacing').onChange(() => {
        initShapes();
      });
      controllers.lineWidth = folderGeo.add(params, 'lineWidth', 1, 30, 0.5).name('Line Width');
      controllers.lineCap = folderGeo.add(params, 'lineCap', ['round', 'square', 'butt']).name('Line Cap');
      folderGeo.add({ reroll: rerollGridPattern }, 'reroll').name('Re-roll Diagonals');

      // Motion & Speed
      const folderMotion = gui.addFolder('Motion & Dynamics');
      controllers.speed = folderMotion.add(params, 'speed', 0.0, 4.0, 0.05).name('Animation Speed');
      controllers.waveFreq = folderMotion.add(params, 'waveFreq', 1, 40, 1).name('Wave Frequency');

      // Camera & Navigation
      const folderCamera = gui.addFolder('Zoom & Pan');
      controllers.zoom = folderCamera.add(transform, 'scale', 0.1, 8.0, 0.01).name('Zoom (Wheel)').listen();
      controllers.panX = folderCamera.add(transform, 'x', -window.innerWidth * 2, window.innerWidth * 2, 1).name('Pan X').listen();
      controllers.panY = folderCamera.add(transform, 'y', -window.innerHeight * 2, window.innerHeight * 2, 1).name('Pan Y').listen();
      folderCamera.add({ reset: resetView }, 'reset').name('Reset View');

      // Procedural Variation
      const folderProcedural = gui.addFolder('Procedural Variations');
      controllers.clickToRandomize = folderProcedural.add(params, 'clickToRandomize').name('Click Scene to Re-roll');
      folderProcedural.add({ randomize: randomizeScene }, 'randomize').name('Generate New Variation');

      // Keyboard toggle for UI
      let isGuiVisible = true;
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          isGuiVisible = !isGuiVisible;
          if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
            isGuiVisible ? gui.show() : gui.hide();
          } else {
            gui.domElement.style.display = isGuiVisible ? '' : 'none';
          }
          if (controllerDiv) {
            controllerDiv.style.display = isGuiVisible ? '' : 'none';
          }
        }
      });
    }

    function setupInteractions() {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let startTransformX = 0;
      let startTransformY = 0;
      let dragDist = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest && (e.target.closest('.lil-gui') || e.target.closest('#controller'))) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startTransformX = transform.x;
        startTransformY = transform.y;
        dragDist = 0;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        dragDist = Math.hypot(dx, dy);
        transform.x = startTransformX + dx;
        transform.y = startTransformY + dy;
        controllers.panX?.updateDisplay();
        controllers.panY?.updateDisplay();
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (dragDist < 6 && (!e.target.closest || (!e.target.closest('.lil-gui') && !e.target.closest('#controller')))) {
          if (params.clickToRandomize) {
            randomizeScene();
          } else {
            rerollGridPattern();
          }
        }
      });

      window.addEventListener('wheel', (e) => {
        if (e.target.closest && (e.target.closest('.lil-gui') || e.target.closest('#controller'))) return;
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const minScale = 0.1;
        const maxScale = 8.0;
        const newScale = Math.min(Math.max(transform.scale * zoomFactor, minScale), maxScale);

        transform.x = mouseX - (mouseX - transform.x) * (newScale / transform.scale);
        transform.y = mouseY - (mouseY - transform.y) * (newScale / transform.scale);
        transform.scale = newScale;

        controllers.zoom?.updateDisplay();
        controllers.panX?.updateDisplay();
        controllers.panY?.updateDisplay();
      }, { passive: false });
    }

    function onResize() {
      X = canvas.width = window.innerWidth;
      Y = canvas.height = window.innerHeight;
      if (X < 768 && params.dist === 20) {
        params.dist = 10;
        params.lineWidth = 5;
        controllers.dist?.updateDisplay();
        controllers.lineWidth?.updateDisplay();
      }
      initShapes();
    }

    function render() {
      ctx.clearRect(0, 0, X, Y);
      const activeBg = params.greenscreen ? '#00ff00' : params.backgroundColor;
      ctx.fillStyle = activeBg;
      ctx.fillRect(0, 0, X, Y);

      ctx.save();
      ctx.globalCompositeOperation = params.blendMode;
      ctx.translate(transform.x, transform.y);
      ctx.scale(transform.scale, transform.scale);

      const margin = (params.lineWidth + params.glow + 12) * transform.scale;
      const screenDist = params.dist * transform.scale;

      for (let i = 0; i < shapes.length; i++) {
        const s = shapes[i];
        s.updateParams();

        const screenX = transform.x + s.x * transform.scale;
        const screenY = transform.y + s.y * transform.scale;

        if (
          screenX + screenDist >= -margin &&
          screenX <= X + margin &&
          screenY + screenDist >= -margin &&
          screenY <= Y + margin
        ) {
          s.draw();
        }
      }

      ctx.restore();
      requestAnimationFrame(render);
    }

    window.addEventListener('load', function() {
      canvas = document.getElementById('canvas');
      if (!canvas || !canvas.getContext) return;

      ctx = canvas.getContext('2d');
      X = canvas.width = window.innerWidth;
      Y = canvas.height = window.innerHeight;

      if (X < 768) {
        params.dist = 10;
        params.lineWidth = 5;
      }

      rangeMaxInput = document.getElementById('rangeMax');
      controllerDiv = document.getElementById('controller');

      if (rangeMaxInput) {
        rangeMaxInput.value = params.rangeMax;
        rangeMaxInput.addEventListener('input', function() {
          params.rangeMax = parseInt(this.value, 10);
          for (let i = 0; i < shapes.length; i++) {
            shapes[i].changeColor();
          }
          controllers.rangeMax?.updateDisplay();
        });
      }

      initShapes();
      setupGUI();
      setupInteractions();

      window.addEventListener('resize', onResize);

      render();
    });

    console.log('File Name / circuit.js\nCreated Date / July 07, 2020\nAuthor / Toshiya Marukubo\nTwitter / https://twitter.com/toshiyamarukubo');
  </script>
