<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Tri-Grid Noise Visualization</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }

    #canvas:active {
      cursor: grabbing;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    function App() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let width = window.innerWidth;
      let height = window.innerHeight;

      let rows = [];
      let nCols = 0, nRows = 0;
      const simplex = new SimplexNoise();
      const pix2 = Math.PI * 2;

      // Color Presets
      const colorPresets = {
        'Cosmic Neon': { c1: '#ffffff', c2: '#4c5ebc', c3: '#f91742', composite: 'lighter', bg: '#000000' },
        'Cyberpunk Synth': { c1: '#00ffff', c2: '#ff007f', c3: '#7000ff', composite: 'lighter', bg: '#090014' },
        'Sunset Glow': { c1: '#ffea00', c2: '#ff6d00', c3: '#d50000', composite: 'source-over', bg: '#1a0500' },
        'Emerald Matrix': { c1: '#00ff66', c2: '#00b359', c3: '#003311', composite: 'source-over', bg: '#001108' },
        'Monochrome Luxury': { c1: '#ffffff', c2: '#888888', c3: '#111111', composite: 'lighter', bg: '#050505' }
      };

      // App Settings & Parameters
      const params = {
        colorScheme: 'Cosmic Neon',
        greenScreen: false,
        bgColor: '#000000',
        color1: '#ffffff',
        color2: '#4c5ebc',
        color3: '#f91742',
        composite: 'lighter',
        animationPreset: 'Organic Wave',
        animSpeed: 1.0,
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        tSize: 40,
        tNoise: 10,
        tCircle: 40,
        lineWidth: 1.5,
        xyCoef: 0.002,
        timeCoef: 0.0002,
        timeCoef1: 1.5,
        resetView: () => {
          zoom = 1.0;
          offsetX = 0;
          offsetY = 0;
        },
        randomGrid: () => randomGrid()
      };

      let cscale = chroma.scale([params.color1, params.color2, params.color3]);

      // View Transform State (Pan & Zoom)
      let zoom = 1.0;
      let offsetX = 0;
      let offsetY = 0;
      let isDragging = false;
      let startX = 0, startY = 0;
      let dragMoved = false;

      // Time tracking for animation
      let lastTime = performance.now();
      let animTime = 0;

      let gui;

      init();

      function init() {
        setupGUI();
        setupEvents();
        onResize();
        requestAnimationFrame(animate);
      }

      function updateColorScale() {
        cscale = chroma.scale([params.color1, params.color2, params.color3]);
      }

      function setupGUI() {
        gui = new GUI({ title: 'Scene Controls' });

        // Preset Color Schemes
        const fColors = gui.addFolder('Colors & Background');
        fColors.add(params, 'colorScheme', Object.keys(colorPresets)).name('Preset Palette').onChange((val) => {
          const p = colorPresets[val];
          params.color1 = p.c1;
          params.color2 = p.c2;
          params.color3 = p.c3;
          params.composite = p.composite;
          if (!params.greenScreen) {
            params.bgColor = p.bg;
            document.body.style.background = p.bg;
          }
          updateColorScale();
          gui.controllers.forEach(c => c.updateDisplay());
        });

        fColors.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange((val) => {
          const bg = val ? '#00ff00' : params.bgColor;
          document.body.style.background = bg;
        });

        fColors.addColor(params, 'bgColor').name('Background Color').onChange((val) => {
          if (!params.greenScreen) {
            document.body.style.background = val;
          }
        });

        fColors.addColor(params, 'color1').name('Color 1').onChange(updateColorScale);
        fColors.addColor(params, 'color2').name('Color 2').onChange(updateColorScale);
        fColors.addColor(params, 'color3').name('Color 3').onChange(updateColorScale);
        fColors.add(params, 'composite', ['lighter', 'darker', 'source-over', 'screen', 'multiply']).name('Blend Mode');

        // Animation Settings
        const fAnim = gui.addFolder('Animation');
        fAnim.add(params, 'animationPreset', [
          'Organic Wave',
          'Static Pulse (No Movement)',
          'Breathing Flow',
          'Cosmic Drift',
          'Harmonic Ripple'
        ]).name('Animation Style');

        fAnim.add(params, 'animSpeed', 0.0, 3.0, 0.1).name('Speed');

        // Display & View Settings
        const fDisplay = gui.addFolder('Display & Grid');
        fDisplay.add(params, 'dpr', [0.5, 1.0, 1.5, 2.0, 3.0]).name('DPR (Pixel Ratio)').onChange(onResize);
        fDisplay.add(params, 'tSize', 15, 80, 1).name('Tile Size').onChange(initGrid);
        fDisplay.add(params, 'tNoise', 0, 40, 0.5).name('Noise Distortion');
        fDisplay.add(params, 'tCircle', 1, 50, 0.5).name('Circle Radius');
        fDisplay.add(params, 'lineWidth', 0.2, 5.0, 0.1).name('Line Width');
        fDisplay.add(params, 'resetView').name('Reset Zoom & Pan');
        fDisplay.add(params, 'randomGrid').name('Randomize Grid');
      }

      function setupEvents() {
        window.addEventListener('resize', onResize, false);

        // Hide/Show UI with "H" key
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            if (gui._hidden) {
              gui.show();
            } else {
              gui.hide();
            }
          }
        });

        // Zoom with wheel
        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
          zoom = Math.min(Math.max(0.1, zoom * zoomFactor), 10.0);
        }, { passive: false });

        // Pan with drag
        canvas.addEventListener('pointerdown', (e) => {
          isDragging = true;
          startX = e.clientX - offsetX;
          startY = e.clientY - offsetY;
          dragMoved = false;
        });

        canvas.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          const dx = e.clientX - (startX + offsetX);
          const dy = e.clientY - (startY + offsetY);
          if (Math.hypot(dx, dy) > 3) {
            dragMoved = true;
          }
          offsetX = e.clientX - startX;
          offsetY = e.clientY - startY;
        });

        window.addEventListener('pointerup', () => {
          if (isDragging && !dragMoved) {
            randomGrid();
          }
          isDragging = false;
        });
      }

      function randomGrid() {
        if (Math.random() > 0.5) {
          params.color1 = 0x000000;
          params.color2 = chroma.random().hex();
          params.color3 = chroma.random().hex();
          params.bgColor = '#000000';
          if (!params.greenScreen) document.body.style.background = '#000';
          params.composite = 'lighter';
        } else {
          params.color1 = 0xffffff;
          params.color2 = chroma.random().hex();
          params.color3 = chroma.random().hex();
          params.bgColor = '#ffffff';
          if (!params.greenScreen) document.body.style.background = '#fff';
          params.composite = Math.random() > 0.5 ? 'darker' : 'lighter';
        }

        updateColorScale();
        params.tSize = rnd(20, 50);
        params.tNoise = rnd(5, 20);
        params.tCircle = rnd(1, params.tSize);
        params.lineWidth = rnd(0.5, 2);
        params.xyCoef = rnd(0.001, 0.05);
        params.timeCoef = rnd(0.00005, 0.0003);
        gui.controllers.forEach(c => c.updateDisplay());
        initGrid();
      }

      function initGrid() {
        const w = params.tSize, h = w * Math.sqrt(3) / 2;
        rows = [];
        nCols = Math.floor(width / w) + 2;
        nRows = Math.floor(height / h) + 2;
        const mx = (width - ((nCols - 0.5) * w)) / 2;
        const my = (height - ((nRows - 1) * h)) / 2;
        for (let i = 0; i < nRows; i++) {
          const x0 = mx + (i % 2) * (w / 2);
          const y0 = my + i * h;
          const row = [];
          for (let j = 0; j < nCols; j++) {
            const x = x0 + j * w, y = y0;
            row.push({ x, y, ox: x, oy: y, i: 0.5 });
          }
          rows.push(row);
        }
      }

      function updateGrid(time) {
        for (let i = 0; i < nRows; i++) {
          for (let j = 0; j < nCols; j++) {
            const p = rows[i][j];
            const ox = p.ox * params.xyCoef;
            const oy = p.oy * params.xyCoef;

            switch (params.animationPreset) {
              case 'Static Pulse (No Movement)': {
                p.x = p.ox;
                p.y = p.oy;
                p.i = (Math.sin(ox * 10 + oy * 10 + time * 3) + 1) / 2 * 0.8 + 0.2;
                break;
              }

              case 'Breathing Flow': {
                const breath = Math.sin(time * 0.8) * 0.5 + 0.5;
                const nx = simplex.noise3D(ox, oy, Math.sin(time * 0.5));
                const ny = simplex.noise3D(oy, ox, Math.cos(time * 0.5));
                p.x = p.ox + nx * params.tNoise * (0.3 + 0.7 * breath);
                p.y = p.oy + ny * params.tNoise * (0.3 + 0.7 * breath);
                p.i = (nx + ny + 2) / 4;
                break;
              }

              case 'Cosmic Drift': {
                const nx = simplex.noise3D(ox + time * 0.3, oy, time * 0.3);
                const ny = simplex.noise3D(oy + time * 0.3, ox, time * 0.3);
                p.x = p.ox + nx * params.tNoise;
                p.y = p.oy + ny * params.tNoise;
                p.i = (nx + ny + 2) / 4;
                break;
              }

              case 'Harmonic Ripple': {
                const dx = (p.ox - width / 2) * 0.005;
                const dy = (p.oy - height / 2) * 0.005;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const nx = simplex.noise3D(ox, oy, dist - time * 0.5);
                const ny = simplex.noise3D(oy, ox, dist - time * 0.5);
                p.x = p.ox + nx * params.tNoise;
                p.y = p.oy + ny * params.tNoise;
                p.i = (Math.sin(dist * 10 - time * 2) + 1) / 2 * 0.6 + (nx + ny + 2) / 8;
                break;
              }

              case 'Organic Wave':
              default: {
                const nx = simplex.noise3D(ox, oy, Math.cos(time) * params.timeCoef1);
                const ny = simplex.noise3D(oy, ox, Math.sin(time) * params.timeCoef1);
                p.x = p.ox + nx * params.tNoise;
                p.y = p.oy + ny * params.tNoise;
                p.i = (nx + ny + 2) / 4;
                break;
              }
            }
          }
        }
      }

      function drawGrid() {
        for (let i = 0; i < nRows; i++) {
          for (let j = 0; j < nCols - 1; j++) {
            drawLine(rows[i][j], rows[i][j + 1]);
          }
        }

        for (let j = 0; j < nCols; j++) {
          for (let i = 0; i < nRows - 1; i++) {
            drawLine(rows[i][j], rows[i + 1][j]);
          }
        }

        for (let j = 1; j < nCols; j++) {
          for (let i = 0; i < nRows - 1; i++) {
            const i1 = i + 1;
            drawLine(rows[i][j - (i % 2)], rows[i1][j - (i1 % 2)]);
          }
        }

        for (let i = 0; i < nRows; i++) {
          for (let j = 0; j < nCols; j++) {
            const p = rows[i][j];
            ctx.fillStyle = cscale(1).alpha(p.i).css();
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.i * params.tCircle, 0, pix2);
            ctx.fill();
          }
        }
      }

      function drawLine(p1, p2) {
        ctx.strokeStyle = cscale((p1.i + p2.i) / 2).css();
        ctx.lineWidth = (p1.i + p2.i) * params.lineWidth;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      function animate(now) {
        requestAnimationFrame(animate);

        const delta = (now - lastTime) / 1000;
        lastTime = now;

        // Advance animation time smoothly using speed factor
        animTime += delta * params.animSpeed;
        const calcTime = animTime * 1000 * params.timeCoef;

        const dpr = Number(params.dpr);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        // Background handling
        const currentBg = params.greenScreen ? '#00ff00' : params.bgColor;
        ctx.fillStyle = currentBg;
        ctx.fillRect(0, 0, width, height);

        // Apply Viewport Pan & Zoom
        ctx.save();
        ctx.translate(width / 2 + offsetX, height / 2 + offsetY);
        ctx.scale(zoom, zoom);
        ctx.translate(-width / 2, -height / 2);

        ctx.globalCompositeOperation = params.composite;
        updateGrid(calcTime);
        drawGrid();

        ctx.restore();
      }

      function onResize() {
        width = window.innerWidth;
        height = window.innerHeight;
        const dpr = Number(params.dpr);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        initGrid();
      }

      function rnd(min, max) {
        if (min === undefined) { min = 0; }
        if (max === undefined) { max = 1; }
        return Math.random() * (max - min) + min;
      }
    }

    App();
  </script>
</body>
</html>
