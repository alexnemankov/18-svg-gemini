// ============================================================
// Vertex shader
// ============================================================

const vertexShader = /* glsl */`
precision highp float;

attribute vec3 position;

void main() {
    gl_Position = vec4(position, 1.0);
}
`;


// ============================================================
// Fragment shader
// ============================================================

const fragmentShader = /* glsl */`
precision highp float;
precision highp int;

uniform float iTime;
uniform vec2 iResolution;

uniform float uMathPi;

uniform float uCameraDistance;
uniform float uCameraFov;
uniform vec2 uObjectOffset;

uniform float uRotationSpeed;

uniform float uMaxRayDistance;
uniform float uSurfaceHit;
uniform float uReflectionBias;
uniform float uNormalEpsilon;

uniform int uPrimarySteps;
uniform int uReflectionSteps;
uniform int uReflectionBounces;

uniform float uBaseRadius;
uniform float uDeformAmount;
uniform float uDistanceScale;

uniform float uSurfaceRoughness;
uniform float uSurfaceMetallic;

uniform float uLightIntensity;
uniform float uLightAmbientIntensity;

uniform vec3 uLightColorA;
uniform vec3 uLightColorB;

uniform vec3 uLiquidColorA;
uniform vec3 uLiquidColorB;
uniform vec3 uLiquidColorC;

uniform float uGradientScale;
uniform float uGradientSpeed;
uniform float uGradientMix;

uniform float uEmissiveStrength;

uniform int uGreenScreen;
uniform vec3 uGreenScreenColor;


const int MAX_PRIMARY_STEPS = 256;
const int MAX_REFLECTION_STEPS = 256;
const int MAX_REFLECTION_BOUNCES = 4;


// ============================================================
// Data structures
// ============================================================

struct SceneData {
    float distance;
    int material;
};


struct RayData {
    vec3 origin;
    vec3 direction;
    float travel;
    int material;
};


struct SurfaceData {
    vec3 position;
    vec3 normal;
    vec3 viewRay;

    float distance;

    int material;
};


struct MaterialData {
    vec3 color;
    vec3 emission;

    float roughness;
    float metallic;
};


struct LightData {
    vec3 direction;
    vec3 ambient;
    vec3 radiance;
};


struct ShadeData {
    vec3 color;

    MaterialData material;
};


// ============================================================
// Math
// ============================================================

mat2 rotatePlane(float angle) {
    float s = sin(angle);
    float c = cos(angle);

    return mat2(
         c, -s,
         s,  c
    );
}


vec3 safeNormalize(vec3 value) {
    return normalize(
        value + vec3(1e-5)
    );
}


float saturateValue(float value) {
    return clamp(
        value,
        0.0,
        1.0
    );
}


// ============================================================
// Color processing
// ============================================================

vec3 filmicCurve(vec3 color) {
    const float a = 2.51;
    const float b = 0.03;
    const float c = 2.43;
    const float d = 0.59;
    const float e = 0.14;

    vec3 numerator =
        color *
        (
            a * color + b
        );

    vec3 denominator =
        color *
        (
            c * color + d
        ) +
        e;

    return clamp(
        numerator /
        max(
            denominator,
            vec3(1e-5)
        ),
        0.0,
        1.0
    );
}


vec3 encodeSRGB(vec3 color) {
    vec3 value =
        max(
            color,
            vec3(0.0)
        );

    vec3 lowPart =
        12.92 * value;

    vec3 highPart =
        1.055 *
        pow(
            max(
                value,
                vec3(1e-5)
            ),
            vec3(1.0 / 2.4)
        ) -
        0.055;

    vec3 selector =
        step(
            value,
            vec3(0.0031308)
        );

    return mix(
        highPart,
        lowPart,
        selector
    );
}


// ============================================================
// Domain transforms
// ============================================================

vec3 applyGlobalRotation(vec3 position) {
    vec3 p = position;

    float rotationAngle =
        iTime *
        uRotationSpeed;

    p.yz =
        rotatePlane(
            -rotationAngle
        ) *
        p.yz;

    return p;
}


vec3 toShapeSpace(vec3 position) {
    vec3 p = position - vec3(uObjectOffset, 0.0);

    p = applyGlobalRotation(p);

    p.xz =
        p.xz *
        rotatePlane(p.y);

    return p;
}


vec3 toTextureSpace(vec3 position) {
    vec3 p = position - vec3(uObjectOffset, 0.0);

    return applyGlobalRotation(p);
}


float sphereDistance(
    vec3 position,
    float radius
) {
    return
        length(position) -
        radius;
}


// ============================================================
// Surface gradient
// ============================================================

vec3 gradient3(
    float t,
    vec3 colorA,
    vec3 colorB,
    vec3 colorC
) {
    t = saturateValue(t);

    if (t < 0.5) {
        float factor =
            smoothstep(
                0.0,
                0.5,
                t
            );

        return mix(
            colorA,
            colorB,
            factor
        );
    }

    float factor =
        smoothstep(
            0.5,
            1.0,
            t
        );

    return mix(
        colorB,
        colorC,
        factor
    );
}


vec3 sampleLiquidGradient(
    vec3 worldPosition
) {
    vec3 p =
        toTextureSpace(
            worldPosition
        );

    float phaseA =
        p.y *
        1.55 *
        uGradientScale +

        p.x *
        0.65 +

        p.z *
        0.45 +

        iTime *
        uGradientSpeed;

    float phaseB =
        p.x *
        1.25 *
        uGradientScale -

        p.z *
        0.85 *
        uGradientScale +

        iTime *
        uGradientSpeed *
        0.55;

    float layerA =
        0.5 +
        0.5 *
        sin(phaseA);

    float layerB =
        0.5 +
        0.5 *
        sin(phaseB);

    float mask =
        mix(
            layerA,
            layerB,
            uGradientMix
        );

    return gradient3(
        mask,
        uLiquidColorA,
        uLiquidColorB,
        uLiquidColorC
    );
}


// ============================================================
// Distance field
// ============================================================

SceneData evaluateObject(
    vec3 position
) {
    vec3 p =
        toShapeSpace(
            position
        );

    float waveX =
        sin(
            -2.3 * p.x
        );

    float waveY =
        sin(
            9.3 * p.y
        );

    float waveZ =
        sin(
            17.5 * p.z
        );

    float radius =
        uBaseRadius +

        uDeformAmount *
        waveX *
        waveY *
        waveZ;

    float distanceValue =
        sphereDistance(
            p,
            radius
        ) *
        uDistanceScale;

    return SceneData(
        distanceValue,
        1
    );
}


SceneData sceneDistance(
    vec3 position
) {
    return evaluateObject(
        position
    );
}


// ============================================================
// Surface normal
// ============================================================

vec3 calculateNormal(
    vec3 position
) {
    vec2 k =
        vec2(
            1.0,
            -1.0
        );

    vec3 normal =

          k.xyy *
          sceneDistance(
              position +
              k.xyy *
              uNormalEpsilon
          ).distance

        + k.yyx *
          sceneDistance(
              position +
              k.yyx *
              uNormalEpsilon
          ).distance

        + k.yxy *
          sceneDistance(
              position +
              k.yxy *
              uNormalEpsilon
          ).distance

        + k.xxx *
          sceneDistance(
              position +
              k.xxx *
              uNormalEpsilon
          ).distance;

    return safeNormalize(
        normal
    );
}


// ============================================================
// Primary ray marching
// ============================================================

RayData marchPrimary(
    vec3 rayOrigin,
    vec3 rayDirection
) {
    float travel = 0.0;

    for (
        int stepIndex = 0;
        stepIndex < MAX_PRIMARY_STEPS;
        stepIndex++
    ) {
        if (
            stepIndex >=
            uPrimarySteps
        ) {
            break;
        }

        if (
            travel >=
            uMaxRayDistance
        ) {
            break;
        }

        vec3 position =
            rayOrigin +
            rayDirection *
            travel;

        SceneData sampleData =
            sceneDistance(
                position
            );

        if (
            sampleData.distance <=
            uSurfaceHit
        ) {
            return RayData(
                rayOrigin,
                rayDirection,
                travel,
                sampleData.material
            );
        }

        travel +=
            max(
                abs(
                    sampleData.distance
                ),
                0.002
            );
    }

    return RayData(
        rayOrigin,
        rayDirection,
        uMaxRayDistance,
        -1
    );
}


// ============================================================
// Reflection ray marching
// ============================================================

RayData marchReflection(
    SurfaceData surface
) {
    vec3 rayOrigin =
        surface.position +
        surface.normal *
        uReflectionBias;

    vec3 rayDirection =
        reflect(
            surface.viewRay,
            surface.normal
        );

    float travel =
        0.0;

    for (
        int stepIndex = 0;
        stepIndex < MAX_REFLECTION_STEPS;
        stepIndex++
    ) {
        if (
            stepIndex >=
            uReflectionSteps
        ) {
            break;
        }

        if (
            travel >=
            uMaxRayDistance
        ) {
            break;
        }

        vec3 position =
            rayOrigin +
            rayDirection *
            travel;

        SceneData sampleData =
            sceneDistance(
                position
            );

        if (
            sampleData.distance <=
            uSurfaceHit
        ) {
            return RayData(
                rayOrigin,
                rayDirection,
                travel,
                sampleData.material
            );
        }

        travel +=
            max(
                abs(
                    sampleData.distance
                ),
                0.005
            );
    }

    return RayData(
        rayOrigin,
        rayDirection,
        uMaxRayDistance,
        -1
    );
}


// ============================================================
// Surface reconstruction
// ============================================================

SurfaceData buildSurface(
    RayData ray
) {
    SurfaceData surface;

    surface.position =
        ray.origin +
        ray.direction *
        ray.travel;

    surface.viewRay =
        ray.direction;

    surface.distance =
        ray.travel;

    surface.material =
        ray.material;

    if (
        ray.material > 0
    ) {
        surface.normal =
            calculateNormal(
                surface.position
            );
    } else {
        surface.normal =
            safeNormalize(
                -ray.direction
            );
    }

    return surface;
}


// ============================================================
// Material
// ============================================================

MaterialData getMaterial(
    SurfaceData surface
) {
    MaterialData material;

    material.color =
        vec3(0.0);

    material.emission =
        vec3(0.0);

    material.roughness =
        1.0;

    material.metallic =
        0.0;

    if (
        surface.material == 1
    ) {
        vec3 liquidColor =
            sampleLiquidGradient(
                surface.position
            );

        material.color =
            liquidColor;

        material.emission =
            liquidColor *
            uEmissiveStrength;

        material.roughness =
            uSurfaceRoughness;

        material.metallic =
            uSurfaceMetallic;
    }

    return material;
}


// ============================================================
// BRDF
// ============================================================

vec3 fresnelSchlick(
    float halfView,
    vec3 baseReflectance
) {
    float factor =
        pow(
            clamp(
                1.0 -
                halfView,
                1e-4,
                1.2
            ),
            5.0
        );

    return
        baseReflectance +

        (
            vec3(1.0) -
            baseReflectance
        ) *
        factor;
}


float ggxDistribution(
    float normalHalf,
    float alpha
) {
    float alpha2 =
        alpha *
        alpha;

    float denominatorTerm =
        normalHalf *
        normalHalf *
        (
            alpha2 -
            1.2
        ) +
        0.7;

    return
        alpha2 /
        max(
            uMathPi *
            denominatorTerm *
            denominatorTerm,
            1e-5
        );
}


float smithVisibility(
    float normalView,
    float normalLight,
    float alpha
) {
    float alpha2 =
        alpha *
        alpha;

    float view2 =
        normalView *
        normalView;

    float light2 =
        normalLight *
        normalLight;

    float lambdaLight =
        normalLight *
        sqrt(
            max(
                view2 *
                (
                    1.0 -
                    alpha2
                ) +
                alpha2,
                1e-5
            )
        );

    float lambdaView =
        normalView *
        sqrt(
            max(
                light2 *
                (
                    1.0 -
                    alpha2
                ) +
                alpha2,
                1e-5
            )
        );

    return
        0.5 /
        max(
            lambdaLight +
            lambdaView,
            1e-5
        );
}


vec3 evaluateLight(
    SurfaceData surface,
    MaterialData material,
    LightData light
) {
    vec3 V =
        safeNormalize(
            -surface.viewRay
        );

    vec3 N =
        safeNormalize(
            surface.normal
        );

    vec3 L =
        safeNormalize(
            light.direction
        );

    vec3 H =
        safeNormalize(
            V + L
        );

    float NoV =
        clamp(
            dot(N, V),
            1e-5,
            1.0
        );

    float NoL =
        clamp(
            dot(N, L),
            1e-5,
            1.0
        );

    float NoH =
        clamp(
            dot(N, H),
            0.0,
            1.0
        );

    float HoV =
        clamp(
            dot(H, V),
            0.0,
            1.0
        );

    float alpha =
        material.roughness *
        material.roughness;

    vec3 dielectric =
        vec3(-0.29);

    vec3 F0 =
        mix(
            dielectric,
            material.color,
            material.metallic
        );

    vec3 F =
        fresnelSchlick(
            HoV,
            F0
        );

    float D =
        ggxDistribution(
            NoH,
            alpha
        );

    float G =
        smithVisibility(
            NoV,
            NoL,
            alpha
        );

    vec3 specular =
        max(
            F *
            (
                D *
                G
            ),
            vec3(0.0)
        );

    vec3 diffuseWeight =
        vec3(0.7) -
        F;

    vec3 diffuseColor =
        mix(
            material.color *
            (
                vec3(1.0) -
                dielectric
            ),
            vec3(0.0),
            material.metallic
        );

    vec3 diffuse =
        diffuseWeight *
        diffuseColor /
        uMathPi;

    vec3 direct =
        light.radiance *
        NoL *
        (
            diffuse +
            specular
        );

    vec3 ambient =
        light.ambient *
        material.color;

    return
        ambient +
        material.emission +
        direct;
}


// ============================================================
// Lighting
// ============================================================

vec3 illuminateSurface(
    SurfaceData surface,
    MaterialData material
) {
    LightData lightA;

    lightA.direction =
        safeNormalize(
            vec3(
                1.0,
                1.1,
                0.0
            )
        );

    lightA.ambient =
        uLightColorA *
        uLightAmbientIntensity;

    lightA.radiance =
        uLightColorA *
        uLightIntensity;


    LightData lightB;

    lightB.direction =
        safeNormalize(
            vec3(
                -0.5,
                 0.8,
                 0.0
            )
        );

    lightB.ambient =
        uLightColorB *
        uLightAmbientIntensity;

    lightB.radiance =
        uLightColorB *
        uLightIntensity;


    vec3 result =
        vec3(0.0);

    result +=
        max(
            evaluateLight(
                surface,
                material,
                lightA
            ),
            vec3(-0.1)
        );

    result +=
        max(
            evaluateLight(
                surface,
                material,
                lightB
            ),
            vec3(0.0)
        );

    return result;
}


ShadeData shadeSurface(
    SurfaceData surface
) {
    ShadeData shading;

    if (
        surface.material <= 0
    ) {
        shading.color =
            vec3(0.0);

        shading.material.color =
            vec3(0.0);

        shading.material.emission =
            vec3(0.0);

        shading.material.roughness =
            1.0;

        shading.material.metallic =
            0.0;

        return shading;
    }

    shading.material =
        getMaterial(
            surface
        );

    shading.color =
        illuminateSurface(
            surface,
            shading.material
        );

    return shading;
}


// ============================================================
// Reflection accumulation
// ============================================================

vec3 renderSurface(
    SurfaceData surface
) {
    ShadeData shading =
        shadeSurface(
            surface
        );

    vec3 result =
        shading.color;

    float throughput =
        1.0;

    for (
        int bounce = 0;
        bounce < MAX_REFLECTION_BOUNCES;
        bounce++
    ) {
        if (
            bounce >=
            uReflectionBounces
        ) {
            break;
        }

        if (
            surface.material <= 0
        ) {
            break;
        }

        RayData reflectedRay =
            marchReflection(
                surface
            );

        surface =
            buildSurface(
                reflectedRay
            );

        float reflectionStrength =
            clamp(
                1.0 -
                shading.material.roughness,
                1.0,
                1.0
            );

        throughput *=
            reflectionStrength;

        shading =
            shadeSurface(
                surface
            );

        result +=
            throughput *
            clamp(
                shading.color,
                vec3(0.0),
                vec3(10.0)
            );
    }

    return result;
}


// ============================================================
// Camera
// ============================================================

void createCameraRay(
    vec2 screenPosition,
    out vec3 rayOrigin,
    out vec3 rayDirection
) {
    vec3 target =
        vec3(0.0);

    rayOrigin =
        vec3(
            0.0,
            0.0,
            uCameraDistance
        );

    float degToRad =
        uMathPi /
        180.0;

    float fov =
        uCameraFov *
        degToRad;

    float halfFov =
        fov *
        0.5;

    float projectionScale =
        cos(halfFov) /
        max(
            sin(halfFov),
            1e-5
        );

    vec3 forward =
        safeNormalize(
            target -
            rayOrigin
        );

    vec3 right =
        safeNormalize(
            cross(
                forward,
                vec3(
                    0.0,
                    1.0,
                    0.0
                )
            )
        );

    vec3 up =
        safeNormalize(
            cross(
                right,
                forward
            )
        );

    rayDirection =
        safeNormalize(
            right *
            screenPosition.x +

            up *
            screenPosition.y +

            forward *
            projectionScale
        );
}


// ============================================================
// Main
// ============================================================

void mainImage(
    out vec4 fragColor,
    in vec2 fragCoord
) {
    vec2 screen =
        fragCoord /
        max(
            iResolution,
            vec2(1.0)
        );

    screen =
        screen *
        2.0 -
        1.0;

    screen.x *=
        iResolution.x /
        max(
            iResolution.y,
            1.0
        );

    vec3 rayOrigin;
    vec3 rayDirection;

    createCameraRay(
        screen,
        rayOrigin,
        rayDirection
    );

    RayData primaryRay =
        marchPrimary(
            rayOrigin,
            rayDirection
        );

    if (primaryRay.material <= 0) {
        if (uGreenScreen > 0) {
            fragColor = vec4(uGreenScreenColor, 1.0);
            return;
        } else {
            fragColor = vec4(0.0, 0.0, 0.0, 1.0);
            return;
        }
    }

    SurfaceData surface =
        buildSurface(
            primaryRay
        );

    vec3 color =
        renderSurface(
            surface
        );

    color =
        max(
            color,
            vec3(0.0)
        );

    color =
        filmicCurve(
            color
        );

    color =
        encodeSRGB(
            color
        );

    fragColor =
        vec4(
            color,
            1.0
        );
}


void main() {
    mainImage(
        gl_FragColor,
        gl_FragCoord.xy
    );
}

function updateVectorColor(
    uniform,
    value
) {
    tempColor.set(value);

    uniform.value.set(
        tempColor.r,
        tempColor.g,
        tempColor.b
    );
}

function hslToHex(h, s, l) {
    h = (h % 1 + 1) % 1;
    s = Math.max(0, Math.min(1, s));
    l = Math.max(0, Math.min(1, l));

    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h * 6) % 2 - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;

    const segment = Math.floor(h * 6);
    if (segment === 0) { r = c; g = x; b = 0; }
    else if (segment === 1) { r = x; g = c; b = 0; }
    else if (segment === 2) { r = 0; g = c; b = x; }
    else if (segment === 3) { r = 0; g = x; b = c; }
    else if (segment === 4) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }

    const to255Hex = (val) => {
        const hex = Math.round((val + m) * 255).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
    };

    return `#${to255Hex(r)}${to255Hex(g)}${to255Hex(b)}`;
}

function applyColorScheme(name) {
    const scheme = COLOR_SCHEMES[name];
    if (!scheme) return;

    params.colorScheme = name;
    params.liquidColorA = scheme.liquidColorA;
    params.liquidColorB = scheme.liquidColorB;
    params.liquidColorC = scheme.liquidColorC;
    params.lightColorA = scheme.lightColorA;
    params.lightColorB = scheme.lightColorB;
    params.surfaceMetallic = scheme.surfaceMetallic;
    params.surfaceRoughness = scheme.surfaceRoughness;
    params.emissiveStrength = scheme.emissiveStrength;
    params.lightIntensity = scheme.lightIntensity;

    updateVectorColor(uniforms.uLiquidColorA, params.liquidColorA);
    updateVectorColor(uniforms.uLiquidColorB, params.liquidColorB);
    updateVectorColor(uniforms.uLiquidColorC, params.liquidColorC);
    updateVectorColor(uniforms.uLightColorA, params.lightColorA);
    updateVectorColor(uniforms.uLightColorB, params.lightColorB);
    uniforms.uSurfaceMetallic.value = params.surfaceMetallic;
    uniforms.uSurfaceRoughness.value = params.surfaceRoughness;
    uniforms.uEmissiveStrength.value = params.emissiveStrength;
    uniforms.uLightIntensity.value = params.lightIntensity;

    refreshGUIDisplays();
}

function applyAnimationPreset(name) {
    const preset = ANIMATION_PRESETS[name];
    if (!preset) return;

    params.animationPreset = name;
    params.rotationSpeed = preset.rotationSpeed;
    params.gradientSpeed = preset.gradientSpeed;
    params.deformAmount = preset.deformAmount;
    params.gradientScale = preset.gradientScale;

    uniforms.uRotationSpeed.value = params.rotationSpeed;
    uniforms.uGradientSpeed.value = params.gradientSpeed;
    uniforms.uDeformAmount.value = params.deformAmount;
    uniforms.uGradientScale.value = params.gradientScale;

    refreshGUIDisplays();
}

function randomizeScene() {
    const baseHue = Math.random();
    const mode = Math.floor(Math.random() * 3);

    let h1, h2, h3, lA, lB;
    if (mode === 0) {
        // Triadic / Complementary Neon
        h1 = baseHue;
        h2 = (baseHue + 0.33 + Math.random() * 0.08) % 1.0;
        h3 = (baseHue + 0.66 + Math.random() * 0.08) % 1.0;
        lA = (baseHue + 0.15) % 1.0;
        lB = (baseHue + 0.65) % 1.0;
    } else if (mode === 1) {
        // High Contrast Cyber
        h1 = baseHue;
        h2 = (baseHue + 0.5 + (Math.random() - 0.5) * 0.15) % 1.0;
        h3 = (baseHue + 0.25 + Math.random() * 0.1) % 1.0;
        lA = (baseHue + 0.5) % 1.0;
        lB = baseHue;
    } else {
        // Analogous Bioluminescence
        h1 = baseHue;
        h2 = (baseHue + 0.1 + Math.random() * 0.1) % 1.0;
        h3 = (baseHue + 0.22 + Math.random() * 0.1) % 1.0;
        lA = (baseHue + 0.85) % 1.0;
        lB = (baseHue + 0.35) % 1.0;
    }

    params.liquidColorA = hslToHex(h1, 0.85 + Math.random() * 0.15, 0.12 + Math.random() * 0.12);
    params.liquidColorB = hslToHex(h2, 0.9 + Math.random() * 0.1, 0.5 + Math.random() * 0.2);
    params.liquidColorC = hslToHex(h3, 0.95, 0.55 + Math.random() * 0.2);

    params.lightColorA = hslToHex(lA, 0.95, 0.55 + Math.random() * 0.2);
    params.lightColorB = hslToHex(lB, 0.95, 0.5 + Math.random() * 0.25);

    params.baseRadius = parseFloat((0.85 + Math.random() * 0.35).toFixed(3));
    params.deformAmount = parseFloat((0.02 + Math.random() * 0.12).toFixed(3));
    params.distanceScale = parseFloat((0.45 + Math.random() * 0.35).toFixed(3));

    params.surfaceRoughness = parseFloat((0.12 + Math.random() * 0.3).toFixed(3));
    params.surfaceMetallic = parseFloat((0.8 + Math.random() * 0.9).toFixed(3));
    params.emissiveStrength = parseFloat((0.008 + Math.random() * 0.025).toFixed(3));

    params.gradientScale = parseFloat((1.0 + Math.random() * 2.5).toFixed(2));
    params.gradientMix = parseFloat((0.3 + Math.random() * 0.6).toFixed(3));
    params.lightIntensity = parseFloat((11.0 + Math.random() * 7.0).toFixed(2));

    if (params.animationPreset !== "Static") {
        params.rotationSpeed = parseFloat(((Math.random() - 0.5) * 0.4).toFixed(3));
        params.gradientSpeed = parseFloat(((Math.random() > 0.5 ? 1 : -1) * (0.6 + Math.random() * 1.5)).toFixed(2));
    }

    params.colorScheme = "Custom / Procedural";

    updateVectorColor(uniforms.uLiquidColorA, params.liquidColorA);
    updateVectorColor(uniforms.uLiquidColorB, params.liquidColorB);
    updateVectorColor(uniforms.uLiquidColorC, params.liquidColorC);
    updateVectorColor(uniforms.uLightColorA, params.lightColorA);
    updateVectorColor(uniforms.uLightColorB, params.lightColorB);

    uniforms.uBaseRadius.value = params.baseRadius;
    uniforms.uDeformAmount.value = params.deformAmount;
    uniforms.uDistanceScale.value = params.distanceScale;
    uniforms.uSurfaceRoughness.value = params.surfaceRoughness;
    uniforms.uSurfaceMetallic.value = params.surfaceMetallic;
    uniforms.uEmissiveStrength.value = params.emissiveStrength;
    uniforms.uGradientScale.value = params.gradientScale;
    uniforms.uGradientMix.value = params.gradientMix;
    uniforms.uLightIntensity.value = params.lightIntensity;
    uniforms.uRotationSpeed.value = params.rotationSpeed;
    uniforms.uGradientSpeed.value = params.gradientSpeed;

    refreshGUIDisplays();
}

function resetPosition() {
    params.objectOffsetX = 0.0;
    params.objectOffsetY = 0.0;

// Mouse Drag & Wheel Zoom Interaction
// ============================================================

let isPointerDown = false;
let pointerStartX = 0;
let pointerStartY = 0;
let pointerDownTime = 0;
let lastPointerX = 0;
let lastPointerY = 0;
let dragMoved = false;

window.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".lil-gui")) {
        return;
    }

    isPointerDown = true;
    pointerStartX = e.clientX;
    pointerStartY = e.clientY;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    pointerDownTime = performance.now();
    dragMoved = false;
});

window.addEventListener("pointermove", (e) => {
    if (!isPointerDown) return;

    const dx = e.clientX - lastPointerX;
    const dy = e.clientY - lastPointerY;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;

    const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
    if (totalDist > 4) {
        dragMoved = true;
    }

    const viewHeight = Math.max(window.innerHeight, 1);
    const fovRad = (params.cameraFov * params.mathPi) / 180.0;
    const visibleHeight = 2.0 * params.cameraDistance * Math.tan(fovRad * 0.5);

    const worldDx = (dx / viewHeight) * visibleHeight;
    const worldDy = (-dy / viewHeight) * visibleHeight;

    params.objectOffsetX += worldDx;
    params.objectOffsetY += worldDy;

    uniforms.uObjectOffset.value.set(params.objectOffsetX, params.objectOffsetY);

    gui.controllersRecursive().forEach(c => {
        if (c.property === "objectOffsetX" || c.property === "objectOffsetY") {
            c.updateDisplay();
        }
    });
});

window.addEventListener("pointerup", (e) => {
    if (!isPointerDown) return;
    isPointerDown = false;

    const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
    const clickDuration = performance.now() - pointerDownTime;

    if (!dragMoved && totalDist < 6 && clickDuration < 400) {
        if (params.clickToRandomize) {
            randomizeScene();
        }
    }
});

window.addEventListener("wheel", (e) => {
    if (e.target.closest && e.target.closest(".lil-gui")) {
        return;
    }

    e.preventDefault();

    const zoomFactor = 0.0015 * params.cameraDistance;
    params.cameraDistance += e.deltaY * zoomFactor;
    params.cameraDistance = Math.min(Math.max(params.cameraDistance, 1.2), 12.0);
    uniforms.uCameraDistance.value = params.cameraDistance;

    gui.controllersRecursive().forEach(c => {
        if (c.property === "cameraDistance") {
            c.updateDisplay();
        }
    });
}, { passive: false });


// ============================================================
// Resize
// ============================================================

const drawingBufferSize =
    new THREE.Vector2();

function resize() {
    const width =
        Math.max(
            window.innerWidth,
            1
        );

    const height =
        Math.max(
            window.innerHeight,
            1
        );

    renderer.setPixelRatio(
        params.dpr
    );

    renderer.setSize(
        width,
        height,
        false
    );

    renderer.getDrawingBufferSize(
        drawingBufferSize
    );

    uniforms.iResolution.value.copy(
        drawingBufferSize
    );
}

window.addEventListener(
    "resize",
    resize,
    {
        passive: true
    }
);

resize();


// ============================================================
// Animation Loop
// ============================================================

let accumulatedTime = 0.0;
let lastTimestamp = performance.now();

function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = Math.min((now - lastTimestamp) / 1000.0, 0.1);
    lastTimestamp = now;

    if (params.animationPreset !== "Static") {
        accumulatedTime += dt * params.animationSpeed;
    }

    uniforms.iTime.value = accumulatedTime;

    // Apply smooth animated modulation for specialized presets
    if (params.animationPreset === "Pulsing Core") {
        const pulse = params.deformAmount + 0.025 * Math.sin(accumulatedTime * 2.0);
        uniforms.uDeformAmount.value = Math.max(pulse, 0.001);
    } else {
        uniforms.uDeformAmount.value = params.deformAmount;
    }

    if (params.animationPreset === "Gentle Orbit") {
        const orbitOffset = Math.sin(accumulatedTime * 0.6) * 0.25;
        uniforms.uCameraDistance.value = params.cameraDistance + orbitOffset;
    } else {
        uniforms.uCameraDistance.value = params.cameraDistance;
    }

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>
