<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Collection - 196</title>
  <style>
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .collection {
      position: fixed;
      bottom: 20px;
      right: 20px;
      margin: 0;
      z-index: 10;
      font-family: sans-serif;
    }

    .collection a {
      color: #fff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <p class="collection">
    <a href="https://codepen.io/collection/AGZywR" target="_blank">WebGL Collection</a>
  </p>

  <script type="module">
    import {
      Color,
      DodecahedronBufferGeometry,
      InstancedBufferAttribute,
      InstancedMesh,
      MathUtils,
      Object3D,
      PointLight,
      Scene,
      ShaderChunk,
      ShaderLib,
      ShaderMaterial,
      UniformsUtils,
      Vector2,
      Vector3,
      PerspectiveCamera,
      WebGLRenderer,
      Raycaster,
      Plane,
    } from 'https://cdn.jsdelivr.net/npm/three@0.125.0/build/three.module.js';

    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.125.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.125.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.125.0/examples/jsm/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.125.0/examples/jsm/postprocessing/ShaderPass.js';
    import { FXAAShader } from 'https://cdn.jsdelivr.net/npm/three@0.125.0/examples/jsm/shaders/FXAAShader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.125.0/examples/jsm/controls/OrbitControls.js';

    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    App();

    function App() {
      let three, scene, composer, iMesh, aaPass;
      let pointLight;
      let gui;
      let material;

      const COLOR_SCHEMES = {
        'Crimson Cobalt': ['#dd3e1b', '#0b509c'],
        'Cyberpunk Neon': ['#00f0ff', '#ff0077', '#7000ff'],
        'Emerald Abyss': ['#00ff87', '#60efff', '#0b3c5d'],
        'Golden Sunset': ['#ff3b00', '#ffaa00', '#4a0e4e'],
        'Amethyst Aurora': ['#9d4edd', '#ff758f', '#3a0ca3']
      };

      const ANIM_PRESETS = [
        'Static (No Camera Move)',
        'Gentle Orbit',
        'Breathing Float',
        'Cosmic Figure-8',
        'Spiral Flythrough'
      ];

      const conf = {
        greenscreen: false,
        bgColor: '#050508',
        colorScheme: 'Crimson Cobalt',
        pointLightColor: '#FFC0C0',
        thicknessColor: '#808080',
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        animPreset: 'Gentle Orbit',
        animSpeed: 1.0,
      };

      let cscale = chroma.scale(COLOR_SCHEMES[conf.colorScheme]);

      const NUM_INSTANCES = 5000;
      const instances = [];

      const target = new Vector3();
      const dummy = new Object3D();
      const dummyV = new Vector3();

      const { randFloat: rnd, randFloatSpread: rndFS } = MathUtils;

      let animTime = 0;
      let lastTime = performance.now();

      init();

      function init() {
        three = useThree().init({
          canvas: document.getElementById('canvas'),
          antialias: false,
          mouse_move: true,
          mouse_raycast: true,
          camera_ctrl: {
            enableDamping: true,
            dampingFactor: 0.05,
          },
          camera_fov: 50,
          camera_pos: new Vector3(0, 0, 250),
        });

        initScene();
        initPostprocessing();
        initGUI();
        setupEvents();
        animate();
      }

      function initScene() {
        scene = new Scene();
        updateBackground();

        pointLight = new PointLight(new Color(conf.pointLightColor));
        scene.add(pointLight);

        const geometry = new DodecahedronBufferGeometry(5);
        material = SubSurfaceMaterial();
        material.uniforms.thicknessColor.value.set(conf.thicknessColor);

        iMesh = new InstancedMesh(geometry, material, NUM_INSTANCES);
        scene.add(iMesh);

        for (let i = 0; i < NUM_INSTANCES; i++) {
          instances.push({
            position: new Vector3(rndFS(200), rndFS(200), rndFS(200)),
            scale: rnd(0.2, 1),
            velocity: new Vector3(rndFS(2), rndFS(2), rndFS(2)),
            attraction: 0.0025 + rnd(0, 0.01),
            vlimit: 0.3 + rnd(0, 0.2),
          });
        }

        for (let i = 0; i < NUM_INSTANCES; i++) {
          const { position, scale } = instances[i];
          dummy.position.copy(position);
          dummy.scale.set(scale, scale, scale);
          dummy.updateMatrix();
          iMesh.setMatrixAt(i, dummy.matrix);
        }
        iMesh.instanceMatrix.needsUpdate = true;

        updateColors();
      }

      function updateBackground() {
        if (conf.greenscreen) {
          scene.background = new Color(0x00ff00);
          three.renderer.setClearColor(0x00ff00, 1.0);
          document.body.style.backgroundColor = '#00ff00';
        } else {
          scene.background = new Color(conf.bgColor);
          three.renderer.setClearColor(new Color(conf.bgColor), 1.0);
          document.body.style.backgroundColor = conf.bgColor;
        }
      }

      function applyColorScheme(schemeName) {
        if (COLOR_SCHEMES[schemeName]) {
          cscale = chroma.scale(COLOR_SCHEMES[schemeName]);
          updateColors();
        }
      }

      function randomColors() {
        const c1 = chroma.random(), c2 = chroma.random();
        cscale = chroma.scale([c1, c2]);
        updateColors();
      }

      function updateColors() {
        const colors = [];
        for (let i = 0; i < NUM_INSTANCES; i++) {
          const color = new Color(cscale(rnd(0, 1)).hex());
          colors.push(color.r, color.g, color.b);
        }
        iMesh.geometry.setAttribute('color', new InstancedBufferAttribute(new Float32Array(colors), 3));
        iMesh.geometry.attributes.color.needsUpdate = true;
      }

      function initPostprocessing() {
        composer = new EffectComposer(three.renderer);

        const renderPass = new RenderPass(scene, three.camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(new Vector2(three.size.width, three.size.height), 0.5, 0, 0);
        composer.addPass(bloomPass);

        aaPass = new ShaderPass(FXAAShader);
        composer.addPass(aaPass);
        aaPass.material.uniforms.resolution.value.set(1 / three.size.width, 1 / three.size.height);

        three.onAfterResize(() => {
          composer.setSize(three.size.width, three.size.height);
          aaPass.material.uniforms.resolution.value.set(1 / three.size.width, 1 / three.size.height);
        });
      }

      function initGUI() {
        gui = new GUI({ title: 'Settings' });

        const fDisplay = gui.addFolder('Display & Background');
        fDisplay.add(conf, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);
        fDisplay.addColor(conf, 'bgColor').name('Background Color').onChange(updateBackground);
        fDisplay.add(conf, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
          three.renderer.setPixelRatio(val);
          composer.setSize(three.size.width, three.size.height);
          aaPass.material.uniforms.resolution.value.set(1 / three.size.width, 1 / three.size.height);
        });

        const fColor = gui.addFolder('Color Settings');
        fColor.add(conf, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Palette').onChange(applyColorScheme);
        fColor.addColor(conf, 'pointLightColor').name('Light Color').onChange((val) => {
          pointLight.color.set(val);
        });
        fColor.addColor(conf, 'thicknessColor').name('Subsurface Glow').onChange((val) => {
          material.uniforms.thicknessColor.value.set(val);
        });
        fColor.add({ randomize: randomColors }, 'randomize').name('Randomize Colors');

        const fAnim = gui.addFolder('Animation & Motion');
        fAnim.add(conf, 'animPreset', ANIM_PRESETS).name('Camera Animation');
        fAnim.add(conf, 'animSpeed', 0.0, 3.0, 0.1).name('Animation Speed');

        const fCam = gui.addFolder('Camera & View');
        fCam.add({ reset: () => {
          three.camera.position.set(0, 0, 250);
          three.camera.lookAt(0, 0, 0);
          if (three.cameraCtrl) three.cameraCtrl.target.set(0, 0, 0);
        }}, 'reset').name('Reset Camera');
      }

      function setupEvents() {
        document.body.addEventListener('click', (e) => {
          if (e.target.closest('.lil-gui')) return;
          randomColors();
        });

        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            if (gui) {
              gui._hidden ? gui.show() : gui.hide();
            }
          }
        });
      }

      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const delta = (now - lastTime) * 0.001;
        lastTime = now;

        animTime += delta * conf.animSpeed;

        const { camera, cameraCtrl } = three;

        target.copy(three.mouseV3);
        pointLight.position.copy(target);

        for (let i = 0; i < NUM_INSTANCES; i++) {
          const { position, scale, velocity, attraction, vlimit } = instances[i];

          dummyV.copy(target).sub(position).normalize().multiplyScalar(attraction);
          velocity.add(dummyV).clampScalar(-vlimit, vlimit);
          position.add(velocity);

          dummy.position.copy(position);
          dummy.scale.set(scale, scale, scale);
          dummy.lookAt(dummyV.copy(position).add(velocity));
          dummy.updateMatrix();
          iMesh.setMatrixAt(i, dummy.matrix);
        }
        iMesh.instanceMatrix.needsUpdate = true;

        // Apply camera animation preset
        switch (conf.animPreset) {
          case 'Gentle Orbit': {
            const r = 250;
            camera.position.x = Math.sin(animTime * 0.2) * r;
            camera.position.z = Math.cos(animTime * 0.2) * r;
            camera.position.y = Math.sin(animTime * 0.1) * 40;
            camera.lookAt(0, 0, 0);
            break;
          }
          case 'Breathing Float': {
            camera.position.x = Math.sin(animTime * 0.15) * 50;
            camera.position.y = Math.cos(animTime * 0.18) * 60;
            camera.position.z = 250 + Math.sin(animTime * 0.12) * 40;
            camera.lookAt(0, 0, 0);
            break;
          }
          case 'Cosmic Figure-8': {
            camera.position.x = Math.sin(animTime * 0.18) * 140;
            camera.position.y = Math.sin(animTime * 0.36) * 50;
            camera.position.z = 250 + Math.cos(animTime * 0.18) * 50;
            camera.lookAt(0, 0, 0);
            break;
          }
          case 'Spiral Flythrough': {
            const rad = 200 + Math.sin(animTime * 0.08) * 50;
            camera.position.x = Math.cos(animTime * 0.15) * rad;
            camera.position.y = Math.sin(animTime * 0.15) * rad;
            camera.position.z = Math.cos(animTime * 0.1) * 100 + 180;
            camera.lookAt(0, 0, 0);
            break;
          }
          case 'Static (No Camera Move)':
          default:
            break;
        }

        if (cameraCtrl) cameraCtrl.update();
        composer.render();
      }
    }

    function useThree() {
      return {
        init(options) {
          const canvas = options.canvas;
          const renderer = new WebGLRenderer({
            canvas,
            antialias: options.antialias || false,
            alpha: true,
          });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

          const camera = new PerspectiveCamera(
            options.camera_fov || 50,
            window.innerWidth / window.innerHeight,
            0.1,
            2000
          );
          if (options.camera_pos) {
            camera.position.copy(options.camera_pos);
          } else {
            camera.position.set(0, 0, 250);
          }

          let cameraCtrl = null;
          if (options.camera_ctrl) {
            cameraCtrl = new OrbitControls(camera, renderer.domElement);
            if (options.camera_ctrl.enableDamping) {
              cameraCtrl.enableDamping = true;
              cameraCtrl.dampingFactor = options.camera_ctrl.dampingFactor || 0.05;
            }
            cameraCtrl.enableZoom = true;
            cameraCtrl.enablePan = true;
            cameraCtrl.enableRotate = true;
          }

          const size = { width: window.innerWidth, height: window.innerHeight };
          const resizeCallbacks = [];

          window.addEventListener('resize', () => {
            size.width = window.innerWidth;
            size.height = window.innerHeight;
            camera.aspect = size.width / size.height;
            camera.updateProjectionMatrix();
            renderer.setSize(size.width, size.height);
            resizeCallbacks.forEach((cb) => cb());
          });

          const mouseV3 = new Vector3();
          const raycaster = new Raycaster();
          const mouse = new Vector2();
          const plane = new Plane(new Vector3(0, 0, 1), 0);

          window.addEventListener('pointermove', (e) => {
            mouse.x = (e.clientX / size.width) * 2 - 1;
            mouse.y = -(e.clientY / size.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            raycaster.ray.intersectPlane(plane, mouseV3);
          });

          return {
            renderer,
            camera,
            cameraCtrl,
            size,
            mouseV3,
            onAfterResize(cb) {
              resizeCallbacks.push(cb);
            },
          };
        },
      };
    }

    /**
     * Subsurface Scattering shader
     * Based on three/examples/jsm/shaders/SubsurfaceScatteringShader.js
    */
    function SubSurfaceMaterial() {
      const meshphongFragHead = ShaderChunk.meshphong_frag.slice(0, ShaderChunk.meshphong_frag.indexOf('void main() {'));
      const meshphongFragBody = ShaderChunk.meshphong_frag.slice(ShaderChunk.meshphong_frag.indexOf('void main() {'));

      return new ShaderMaterial({
        lights: true,
        vertexColors: true,
        flatShading: true,
        uniforms: UniformsUtils.merge([
          ShaderLib.phong.uniforms,
          {
            thicknessColor: { value: new Color(0x808080) },
            thicknessDistortion: { value: 0.4 },
            thicknessAmbient: { value: 0.01 },
            thicknessAttenuation: { value: 0.7 },
            thicknessPower: { value: 2.0 },
            thicknessScale: { value: 4.0 },
          },
        ]),

        vertexShader: `
          #define USE_UV
          ${ShaderChunk.meshphong_vert}
        `,

        fragmentShader: `
          #define USE_UV
          #define SUBSURFACE

          ${meshphongFragHead}

          uniform float thicknessPower;
          uniform float thicknessScale;
          uniform float thicknessDistortion;
          uniform float thicknessAmbient;
          uniform float thicknessAttenuation;
          uniform vec3 thicknessColor;

          void RE_Direct_Scattering(const in IncidentLight directLight, const in vec2 uv, const in GeometricContext geometry, inout ReflectedLight reflectedLight) {
            #ifdef USE_COLOR
              vec3 thickness = vColor * thicknessColor;
            #else
              vec3 thickness = thicknessColor;
            #endif
            vec3 scatteringHalf = normalize(directLight.direction + (geometry.normal * thicknessDistortion));
            float scatteringDot = pow(saturate(dot(geometry.viewDir, -scatteringHalf)), thicknessPower) * thicknessScale;
            vec3 scatteringIllu = (scatteringDot + thicknessAmbient) * thickness;
            reflectedLight.directDiffuse += scatteringIllu * thicknessAttenuation * directLight.color;
          }
        ` + meshphongFragBody.replace(
          '#include <lights_fragment_begin>',
          replaceAll(
            ShaderChunk.lights_fragment_begin,
            'RE_Direct( directLight, geometry, material, reflectedLight );',
            `
              RE_Direct( directLight, geometry, material, reflectedLight );
              #if defined( SUBSURFACE ) && defined( USE_UV )
                RE_Direct_Scattering(directLight, vUv, geometry, reflectedLight);
              #endif
            `
          )
        ),
      });

      function replaceAll(string, find, replace) {
        return string.split(find).join(replace);
      }
    }
  </script>
</body>
</html>
