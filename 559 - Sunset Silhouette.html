      controls.target.set(3.5, 1.2, 0.0);

      // Initialize PostProcessor Suite from postprocessing/PostProcessor.js
      postProcessor = new PostProcessor(renderer, {
        enabled: true,
        antialias: settings.antialias,
        bloomEnabled: true,
        bloomStrength: 1.1,
        bloomRadius: 0.65,
        bloomThreshold: 0.18,
        anamorphicEnabled: false, // Anamorphic default is OFF as requested
        raysEnabled: true,
        raysStrength: 0.85,
        raysColor: new THREE.Color(settings.sunColor),
        chromaticAberration: 0.015,
        vignetteBoost: 1.1,
        vignetteReduction: 0.6,
        noiseIntensity: 0.012,
        exposure: 1.0
      });
      postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);

      // Lights
      ambientLight = new THREE.AmbientLight(new THREE.Color(settings.ambientColor), settings.ambientIntensity);
      scene.add(ambientLight);

      dirLight = new THREE.DirectionalLight(new THREE.Color(settings.sunColor), settings.sunIntensity);
      dirLight.position.set(settings.sunPosX, settings.sunPosY, settings.sunPosZ);
      scene.add(dirLight);

      // Build Visuals
      createSkyDome();
      createMist();
      createClouds();
      createArchitecture(false);
      createBirds();

      // UI
      buildGUI();

      // Events
      window.addEventListener('resize', onWindowResize);
      setupInteractions();

      // Start Loop
      animate();
    }

    function initRenderer() {
      if (renderer) {
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }
      renderer = new THREE.WebGLRenderer({
        antialias: settings.antialias,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(settings.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);
      }
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = settings.exposure;
      container.appendChild(renderer.domElement);
    }

    // --- Shaders & Materials ---

    // 1. Sky Dome Shader
    const skyShader = {
      uniforms: {
        uHorizonColor: { value: new THREE.Color(settings.skyHorizon) },
        uMidColor: { value: new THREE.Color(settings.skyMid) },
        uZenithColor: { value: new THREE.Color(settings.skyZenith) },
        uSunColor: { value: new THREE.Color(settings.sunColor) },
        uSunPos: { value: new THREE.Vector3(settings.sunPosX, settings.sunPosY, settings.sunPosZ) },
        uGreenScreen: { value: 0.0 },
        uExposure: { value: settings.exposure }
      },
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uHorizonColor;
        uniform vec3 uMidColor;
        uniform vec3 uZenithColor;
        uniform vec3 uSunColor;
        uniform vec3 uSunPos;
        uniform float uGreenScreen;
        uniform float uExposure;
        varying vec3 vWorldPos;

        void main() {
          if (uGreenScreen > 0.5) {
            gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
            return;
          }

          vec3 dir = normalize(vWorldPos);
          // Map vertical angle to gradient factor (low horizon -> 2/3 sky)
          float h = clamp(dir.y * 2.4 + 0.1, 0.0, 1.0);

          vec3 sky;
          if (h < 0.38) {
            float t = h / 0.38;
            sky = mix(uHorizonColor, uMidColor, smoothstep(0.0, 1.0, t));
          } else {
            float t = (h - 0.38) / 0.62;
            sky = mix(uMidColor, uZenithColor, smoothstep(0.0, 1.0, t));
          }

          // Atmospheric Sun Halo & Corona along the sunset horizon
          vec3 sunDir = normalize(uSunPos);
          float sunCos = max(dot(dir, sunDir), 0.0);
          float sunGlow = pow(sunCos, 12.0) * 0.8 + pow(sunCos, 48.0) * 1.6;
          float sunDisc = smoothstep(0.9982, 0.9996, sunCos) * 2.2;

          sky += uSunColor * (sunGlow + sunDisc);
          sky *= uExposure;

          gl_FragColor = vec4(sky, 1.0);
        }
      `
    };

    function createSkyDome() {
      const geo = new THREE.SphereGeometry(900, 36, 24);
      const mat = new THREE.ShaderMaterial({
        uniforms: skyShader.uniforms,
        vertexShader: skyShader.vertexShader,
        fragmentShader: skyShader.fragmentShader,
        side: THREE.BackSide,
        depthWrite: false
      });
      skyMesh = new THREE.Mesh(geo, mat);
      scene.add(skyMesh);
    }

    // 2. Silhouette Architecture Material with Golden Rim Light
    let silhouetteUniforms = {
      uColor: { value: new THREE.Color(settings.silhouetteColor) },
      uRimColor: { value: new THREE.Color(settings.rimColor) },
      uRimPower: { value: settings.rimPower },
      uRimIntensity: { value: settings.rimIntensity },
      uSunPos: { value: new THREE.Vector3(settings.sunPosX, settings.sunPosY, settings.sunPosZ) },
      uExposure: { value: settings.exposure }
    };

    const silhouetteMaterial = new THREE.ShaderMaterial({
      uniforms: silhouetteUniforms,
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec3 vWorldPos;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          vNormal = normalize(normalMatrix * normal);
          vViewDir = normalize(cameraPosition - worldPos.xyz);
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform vec3 uRimColor;
        uniform float uRimPower;
        uniform float uRimIntensity;
        uniform vec3 uSunPos;
        uniform float uExposure;
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec3 vWorldPos;

        void main() {
          vec3 normal = normalize(vNormal);
          vec3 viewDir = normalize(vViewDir);

          // Fresnel contour edge
          float NdotV = clamp(dot(normal, viewDir), 0.0, 1.0);
          float fresnel = pow(1.0 - NdotV, uRimPower);

          // Directional backlight bias from sunset sun
          vec3 sunDir = normalize(uSunPos - vWorldPos);
          float sunBias = smoothstep(-0.35, 0.9, dot(normal, sunDir));
          float upBias = smoothstep(-0.2, 1.0, normal.y);

          // Thin golden rim highlighting tops of domes, spires, balconies and towers
          float rim = fresnel * (sunBias * 0.75 + upBias * 0.35 + 0.15) * uRimIntensity;

          vec3 finalCol = uColor + uRimColor * rim;
          finalCol *= uExposure;

          gl_FragColor = vec4(finalCol, 1.0);
        }
      `
    });

    // 3. Window Twinkling Light Material
    let windowUniforms = {
      uWindowColor: { value: new THREE.Color(settings.windowColor) },
      uWindowIntensity: { value: settings.windowIntensity },
      uTime: { value: 0 },
      uExposure: { value: settings.exposure }
    };

    const windowMaterial = new THREE.ShaderMaterial({
      uniforms: windowUniforms,
      vertexShader: `
        attribute float aPhase;
        varying float vPhase;
        void main() {
          vPhase = aPhase;
          gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uWindowColor;
        uniform float uWindowIntensity;
        uniform float uTime;
        uniform float uExposure;
        varying float vPhase;

        void main() {
          // Subtle warm flickering of window lights
          float flicker = 0.85 + 0.15 * sin(uTime * 3.5 + vPhase * 12.0)
                        + 0.08 * sin(uTime * 8.2 + vPhase * 29.0);
          vec3 col = uWindowColor * uWindowIntensity * flicker * uExposure;
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });

    // 4. Ground Mist Shader
    let mistUniforms = {
      uMistColor: { value: new THREE.Color(settings.mistColor) },
      uMistDensity: { value: settings.mistDensity },
      uTime: { value: 0 },
      uExposure: { value: settings.exposure },
      uGreenScreen: { value: 0.0 }
    };

    const mistMaterial = new THREE.ShaderMaterial({
      uniforms: mistUniforms,
      transparent: true,
      depthWrite: false,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uMistColor;
        uniform float uMistDensity;
        uniform float uTime;
        uniform float uExposure;
        uniform float uGreenScreen;
        varying vec2 vUv;

        void main() {
          if (uGreenScreen > 0.5) {
            discard;
          }
          // Soft vertical distribution hovering low over the horizon
          float vertFade = sin(vUv.y * 3.14159);
          vertFade = pow(vertFade, 1.8);

          // Horizontal drift wave
          float wave = sin(vUv.x * 8.0 + uTime * 0.18) * 0.15 + 0.85;
          float alpha = vertFade * wave * uMistDensity * 0.45;

          vec3 col = uMistColor * uExposure;
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    // 5. Thin Clouds Shader
    let cloudUniforms = {
      uCloudColor: { value: new THREE.Color(settings.cloudColor) },
      uSkyColor: { value: new THREE.Color(settings.skyMid) },
      uTime: { value: 0 },
      uExposure: { value: settings.exposure },
      uGreenScreen: { value: 0.0 }
    };

    const cloudMaterial = new THREE.ShaderMaterial({
      uniforms: cloudUniforms,
      transparent: true,
      depthWrite: false,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uCloudColor;
        uniform vec3 uSkyColor;
        uniform float uTime;
        uniform float uExposure;
        uniform float uGreenScreen;
        varying vec2 vUv;

        void main() {
          if (uGreenScreen > 0.5) {
            discard;
          }

          // Underside lit by sunset (vUv.y near 0 is underside catching warm light)
          float lightFromBelow = 1.0 - smoothstep(0.0, 0.85, vUv.y);
          vec3 col = mix(uSkyColor * 0.7, uCloudColor * 1.3, lightFromBelow);

          // Soft wispy horizontal cloud shape
          float shapeX = smoothstep(0.0, 0.25, vUv.x) * (1.0 - smoothstep(0.75, 1.0, vUv.x));
          float shapeY = smoothstep(0.0, 0.45, vUv.y) * (1.0 - smoothstep(0.55, 1.0, vUv.y));
          
          float wave = sin(vUv.x * 14.0 + uTime * 0.1) * 0.1 + 0.9;
          float alpha = shapeX * shapeY * wave * 0.65;

          gl_FragColor = vec4(col * uExposure, alpha);
        }
      `
    });

    // --- Procedural Geometry Generators ---

    // Elegant Eastern Onion Dome
    function createOnionDomeGeometry(radius, height, segments = 36) {
      const points = [];
      const count = 36;
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        let r = Math.sin(t * Math.PI) * radius;
        if (t < 0.65) {
          r *= Math.pow(t, 0.42) * 1.38;
        } else {
          const b = (t - 0.65) / 0.35;
          r = (radius * 0.88) * (1.0 - b * 0.28);
        }
        const y = (1.0 - t) * height;
        points.push(new THREE.Vector2(Math.max(0.001, r), y));
      }
      return new THREE.LatheGeometry(points, segments);
    }

    // Finial with spire, beads and crescent moon
    function createFinial(spireHeight = 1.2, baseRadius = 0.08) {
      const finialGroup = new THREE.Group();

      const needleGeo = new THREE.ConeGeometry(baseRadius, spireHeight, 16);
      needleGeo.translate(0, spireHeight / 2, 0);
      const needleMesh = new THREE.Mesh(needleGeo, silhouetteMaterial);
      finialGroup.add(needleMesh);

      // Gold beads
      const bead1 = new THREE.Mesh(new THREE.SphereGeometry(baseRadius * 1.8, 12, 12), silhouetteMaterial);
      bead1.position.y = spireHeight * 0.35;
      finialGroup.add(bead1);

      const bead2 = new THREE.Mesh(new THREE.SphereGeometry(baseRadius * 1.3, 12, 12), silhouetteMaterial);
      bead2.position.y = spireHeight * 0.65;
      finialGroup.add(bead2);

      // Crescent Moon at apex
      const crescentShape = new THREE.Shape();
      crescentShape.absarc(0, 0, baseRadius * 2.8, -Math.PI * 0.7, Math.PI * 0.7, false);
      crescentShape.absarc(baseRadius * 0.9, 0, baseRadius * 2.2, Math.PI * 0.65, -Math.PI * 0.65, true);
      const crescentGeo = new THREE.ShapeGeometry(crescentShape);
      const crescentMesh = new THREE.Mesh(crescentGeo, silhouetteMaterial);
      crescentMesh.position.y = spireHeight + baseRadius * 1.5;
      crescentMesh.rotation.y = Math.PI / 4;
      finialGroup.add(crescentMesh);

      return finialGroup;
    }

    // Assemble Dome with Drum, Finial, and Arched Windows
    function createDomeComplex(radius, height, windowList) {
      const domeGroup = new THREE.Group();

      // Onion dome
      const domeGeo = createOnionDomeGeometry(radius, height);
      const domeMesh = new THREE.Mesh(domeGeo, silhouetteMaterial);
      domeMesh.position.y = height * 0.45;
      domeGroup.add(domeMesh);

      // Spire Finial
      const finial = createFinial(height * 0.45, radius * 0.07);
      finial.position.y = height * 1.45;
      domeGroup.add(finial);

      // Drum base (16-sided cylinder)
      const drumHeight = height * 0.45;
      const drumGeo = new THREE.CylinderGeometry(radius * 0.85, radius * 0.92, drumHeight, 20);
      drumGeo.translate(0, drumHeight / 2, 0);
      const drumMesh = new THREE.Mesh(drumGeo, silhouetteMaterial);
      domeGroup.add(drumMesh);

      // Windows around drum
      const numWin = 6;
      for (let i = 0; i < numWin; i++) {
        const ang = (i / numWin) * Math.PI * 2;
        const wx = Math.sin(ang) * (radius * 0.87);
        const wz = Math.cos(ang) * (radius * 0.87);
        const wy = drumHeight * 0.55;
        windowList.push({
          pos: new THREE.Vector3(wx, wy, wz),
          parent: domeGroup,
          rotY: ang,
          w: radius * 0.18,
          h: drumHeight * 0.45
        });
      }

      return domeGroup;
    }

    // Slender Minaret with Balconies (sherefe), Columns & Spire
    function createMinaret(height, baseRadius, balconiesCount, windowList) {
      const minaretGroup = new THREE.Group();

      // Lower pedestal
      const pedHeight = height * 0.12;
      const pedGeo = new THREE.CylinderGeometry(baseRadius * 1.25, baseRadius * 1.4, pedHeight, 16);
      pedGeo.translate(0, pedHeight / 2, 0);
      minaretGroup.add(new THREE.Mesh(pedGeo, silhouetteMaterial));

      // Tapered shaft
      const shaftHeight = height * 0.72;
      const topRadius = baseRadius * 0.65;
      const shaftGeo = new THREE.CylinderGeometry(topRadius, baseRadius, shaftHeight, 20);
      shaftGeo.translate(0, pedHeight + shaftHeight / 2, 0);
      minaretGroup.add(new THREE.Mesh(shaftGeo, silhouetteMaterial));

      // Balconies along height
      for (let b = 1; b <= balconiesCount; b++) {
        const t = (b / (balconiesCount + 0.35));
        const by = pedHeight + shaftHeight * t;
        const currentShaftRad = THREE.MathUtils.lerp(baseRadius, topRadius, t);
        const balRad = currentShaftRad * 1.7;

        // Corbel bracket (inverted cone)
        const corbelGeo = new THREE.CylinderGeometry(balRad, currentShaftRad, height * 0.03, 16);
        corbelGeo.translate(0, by, 0);
        minaretGroup.add(new THREE.Mesh(corbelGeo, silhouetteMaterial));

        // Balustrade ring
        const balGeo = new THREE.CylinderGeometry(balRad, balRad, height * 0.025, 16);
        balGeo.translate(0, by + height * 0.02, 0);
        minaretGroup.add(new THREE.Mesh(balGeo, silhouetteMaterial));

        // Window on balcony
        windowList.push({
          pos: new THREE.Vector3(0, by + height * 0.045, currentShaftRad * 1.05),
          parent: minaretGroup,
          rotY: 0,
          w: baseRadius * 0.45,
          h: height * 0.05
        });
      }

      // Upper open pavilion / lantern
      const lanternY = pedHeight + shaftHeight;
      const lanternHeight = height * 0.07;
      const lanternGeo = new THREE.CylinderGeometry(topRadius * 0.9, topRadius, lanternHeight, 12);
      lanternGeo.translate(0, lanternY + lanternHeight / 2, 0);
      minaretGroup.add(new THREE.Mesh(lanternGeo, silhouetteMaterial));

      // Conical Spire
      const spireHeight = height * 0.15;
      const spireGeo = new THREE.ConeGeometry(topRadius * 0.9, spireHeight, 16);
      spireGeo.translate(0, lanternY + lanternHeight + spireHeight / 2, 0);
      minaretGroup.add(new THREE.Mesh(spireGeo, silhouetteMaterial));

      // Finial
      const finial = createFinial(height * 0.08, topRadius * 0.15);
      finial.position.y = lanternY + lanternHeight + spireHeight;
      minaretGroup.add(finial);

      return minaretGroup;
    }

    // Crenellated Battlement Parapet
    function createCrenellations(length, y, z, parent) {
      const toothWidth = 0.28;
      const toothHeight = 0.28;
      const count = Math.floor(length / (toothWidth * 2.2));
      const step = length / count;

      const group = new THREE.Group();
      for (let i = 0; i < count; i++) {
        const geo = new THREE.BoxGeometry(toothWidth, toothHeight, 0.25);
        const mesh = new THREE.Mesh(geo, silhouetteMaterial);
        mesh.position.set(-length / 2 + i * step + step / 2, y + toothHeight / 2, z);
        group.add(mesh);
      }
      parent.add(group);
    }

    // Horseshoe Arched Colonnade
    function createColonnade(length, height, parent, windowList) {
      const numArches = Math.floor(length / 1.5);
      const step = length / numArches;

      for (let i = 0; i < numArches; i++) {
        const x = -length / 2 + (i + 0.5) * step;
        windowList.push({
          pos: new THREE.Vector3(x, height * 0.42, 0.2),
          parent: parent,
          rotY: 0,
          w: step * 0.45,
          h: height * 0.55
        });
      }
    }

    // --- Procedural Generation Helpers ---
    function generateRandomDomes(roofY) {
      const count = 3 + Math.floor(Math.random() * 4); // 3 to 6 domes
      const domes = [];
      // Grand central dome
      domes.push({
        x: 0.3 + (Math.random() - 0.5) * 1.5,
        y: roofY,
        z: -0.4 + (Math.random() - 0.5) * 0.8,
        r: 2.1 + Math.random() * 0.6,
        h: 3.2 + Math.random() * 0.9
      });
      // Flanking domes
      for (let i = 1; i < count; i++) {
        const side = (i % 2 === 0 ? 1 : -1);
        const dist = 2.2 + Math.floor(i / 2) * 2.6 + (Math.random() - 0.5) * 1.0;
        domes.push({
          x: side * dist,
          y: roofY - 1.2 - Math.random() * 0.8,
          z: (Math.random() - 0.5) * 2.5,
          r: 1.2 + Math.random() * 0.7,
          h: 1.8 + Math.random() * 1.2
        });
      }
      return domes;
    }

    function generateRandomMinarets() {
      const count = 4 + Math.floor(Math.random() * 5); // 4 to 8 minarets
      const minarets = [];
      const xSlots = [-6.5, -4.2, -1.8, 1.8, 3.8, 6.2, 8.5, 10.2];
      const shuffled = xSlots.sort(() => Math.random() - 0.5).slice(0, count);

      shuffled.forEach(x => {
        const isMain = Math.abs(x) < 4.0 && Math.random() > 0.4;
        const h = isMain ? (12.5 + Math.random() * 3.5) : (8.5 + Math.random() * 4.0);
        const r = 0.26 + Math.random() * 0.16;
        const b = isMain ? (2 + Math.floor(Math.random() * 2)) : (1 + Math.floor(Math.random() * 2));
        const z = (Math.random() - 0.5) * 5.0;
        minarets.push({ x, z, h, r, b });
      });
      return minarets;
    }

    // --- Build Full Architecture Group ---
    let windowInstancesMesh = null;

    function createArchitecture(isRandom = false) {
      if (architectureGroup) {
        scene.remove(architectureGroup);
        architectureGroup.traverse(child => {
          if (child.geometry) child.geometry.dispose();
        });
      }

      architectureGroup = new THREE.Group();
      // Keep composition: silhouette shifted to the right, low horizon, open sky on the left
      const groupX = 3.8 + (isRandom ? (Math.random() - 0.5) * 1.0 : 0.0);
      const groupY = -2.0;
      architectureGroup.position.set(groupX, groupY, 0.0);

      const windowList = [];

      // Base Terraces
      const baseWidth = isRandom ? (14.0 + Math.random() * 4.0) : 16.0;
      const baseHeight = isRandom ? (2.2 + Math.random() * 0.8) : 2.6;
      const baseMainGeo = new THREE.BoxGeometry(baseWidth, baseHeight, 5.0);
      baseMainGeo.translate(0, baseHeight / 2, 0);
      const baseMainMesh = new THREE.Mesh(baseMainGeo, silhouetteMaterial);
      architectureGroup.add(baseMainMesh);
      createCrenellations(baseWidth - 0.2, baseHeight, 2.5, architectureGroup);
      createColonnade(baseWidth - 2.0, baseHeight, architectureGroup, windowList);

      // Stepped upper terrace
      const upperWidth = baseWidth * 0.72;
      const upperHeight = isRandom ? (1.5 + Math.random() * 0.6) : 1.8;
      const upperY = baseHeight + upperHeight / 2;
      const baseUpperGeo = new THREE.BoxGeometry(upperWidth, upperHeight, 4.2);
      baseUpperGeo.translate(0.5, upperY, -0.4);
      const baseUpperMesh = new THREE.Mesh(baseUpperGeo, silhouetteMaterial);
      architectureGroup.add(baseUpperMesh);
      createCrenellations(upperWidth - 0.3, baseHeight + upperHeight, 1.7, architectureGroup);

      // Foreground rampart
      const rampWidth = isRandom ? (6.0 + Math.random() * 3.0) : 7.5;
      const rampHeight = isRandom ? (1.2 + Math.random() * 0.6) : 1.6;
      const rampartGeo = new THREE.BoxGeometry(rampWidth, rampHeight, 3.0);
      rampartGeo.translate(5.5, rampHeight / 2, 2.0);
      architectureGroup.add(new THREE.Mesh(rampartGeo, silhouetteMaterial));
      createCrenellations(rampWidth - 0.3, rampHeight, 3.5, architectureGroup);

      // Domes
      const roofLevel = baseHeight + upperHeight;
      const domeConfigs = isRandom ? generateRandomDomes(roofLevel) : [
        { x: 0.5, y: 4.4, z: -0.4, r: 2.35, h: 3.6 },
        { x: -2.8, y: 2.6, z: 0.5, r: 1.65, h: 2.7 },
        { x: 3.8, y: 2.6, z: 0.2, r: 1.85, h: 2.9 },
        { x: 6.8, y: 1.6, z: 1.2, r: 1.3, h: 2.0 },
        { x: -5.6, y: 1.3, z: -1.0, r: 1.15, h: 1.8 }
      ];

      domeConfigs.forEach(d => {
        const dome = createDomeComplex(d.r, d.h, windowList);
        dome.position.set(d.x, d.y, d.z);
        architectureGroup.add(dome);
      });

      // Minarets
      const minaretConfigs = isRandom ? generateRandomMinarets() : [
        { x: -3.8, z: 1.2, h: 12.5, r: 0.38, b: 3 },
        { x: 2.4, z: -1.8, h: 14.8, r: 0.42, b: 3 },
        { x: 5.6, z: 0.8, h: 11.8, r: 0.35, b: 2 },
        { x: 8.5, z: -0.5, h: 9.6, r: 0.28, b: 2 },
        { x: -1.2, z: -3.2, h: 13.2, r: 0.34, b: 2 },
        { x: 4.4, z: -3.5, h: 10.5, r: 0.3, b: 2 },
        { x: -6.8, z: -2.5, h: 7.2, r: 0.24, b: 1 }
      ];

      minaretConfigs.forEach(m => {
        const minaret = createMinaret(m.h, m.r, m.b, windowList);
        minaret.position.set(m.x, 0, m.z);
        architectureGroup.add(minaret);
      });

      // Instanced Glowing Windows
      if (windowList.length > 0) {
        const baseWinGeo = new THREE.PlaneGeometry(1, 1);
        windowInstancesMesh = new THREE.InstancedMesh(baseWinGeo, windowMaterial, windowList.length);

        const dummy = new THREE.Object3D();
        const phases = new Float32Array(windowList.length);

        for (let i = 0; i < windowList.length; i++) {
          const w = windowList[i];
          dummy.position.copy(w.pos);
          dummy.rotation.set(0, w.rotY || 0, 0);
          dummy.scale.set(w.w, w.h, 1);
          dummy.updateMatrix();

          const worldMat = dummy.matrix.clone();
          if (w.parent) {
            w.parent.updateMatrixWorld(true);
            worldMat.premultiply(w.parent.matrix);
          }
          windowInstancesMesh.setMatrixAt(i, worldMat);
          phases[i] = Math.random() * Math.PI * 2;
        }

        windowInstancesMesh.instanceMatrix.needsUpdate = true;
        baseWinGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));
        architectureGroup.add(windowInstancesMesh);
      }

      scene.add(architectureGroup);
    }

    // --- Ground Mist & Horizon Haze ---
    function createMist() {
      mistGroup = new THREE.Group();
      const planeCount = 5;

      for (let i = 0; i < planeCount; i++) {
        const geo = new THREE.PlaneGeometry(90, 4.2);
        const mesh = new THREE.Mesh(geo, mistMaterial);
        mesh.position.set(0, -1.8 + i * 0.45, -12 + i * 5);
        mistGroup.add(mesh);
      }

      scene.add(mistGroup);
    }

    // --- Thin Backlit Sunset Clouds ---
    function createClouds() {
      if (cloudGroup) {
        scene.remove(cloudGroup);
        cloudGroup.traverse(child => {
          if (child.geometry) child.geometry.dispose();
        });
      }

      cloudGroup = new THREE.Group();
      const count = 7;

      for (let i = 0; i < count; i++) {
        const width = 45 + Math.random() * 45;
        const height = 1.6 + Math.random() * 2.2;
        const geo = new THREE.PlaneGeometry(width, height);
        const mesh = new THREE.Mesh(geo, cloudMaterial);

        const y = 3.5 + i * 1.5 + (Math.random() - 0.5) * 0.8;
        const z = -25 - i * 4;
        const x = (Math.random() - 0.5) * 50;

        mesh.position.set(x, y, z);
        mesh.userData = {
          speed: 0.15 + Math.random() * 0.25,
          baseX: x,
          width: width
        };
        cloudGroup.add(mesh);
      }

      scene.add(cloudGroup);
    }

    // --- Distant Flock of Birds in Sunset Sky ---
    function createBirds() {
      const birdCount = 48;

      // 3D V-wing Geometry
      const birdGeo = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        // Left Wing
        0, 0, 0,
        -0.45, 0, 0.12,
        -0.1, 0, -0.25,
        // Right Wing
        0, 0, 0,
        0.1, 0, -0.25,
        0.45, 0, 0.12
      ]);
      birdGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      birdGeo.computeVertexNormals();

      const birdMat = new THREE.ShaderMaterial({
        uniforms: {
          uBirdColor: { value: new THREE.Color(settings.silhouetteColor) },
          uRimColor: { value: new THREE.Color(settings.rimColor) },
          uTime: { value: 0 },
          uExposure: { value: settings.exposure },
          uGreenScreen: { value: 0.0 }
        },
        vertexShader: `
          attribute float aPhase;
          attribute float aSpeed;
          attribute float aScale;
          uniform float uTime;
          varying vec3 vNormal;
          varying vec3 vViewDir;

          void main() {
            vec3 pos = position;
            // Realistic flapping
            float flap = sin(uTime * aSpeed + aPhase);
            pos.y += abs(pos.x) * flap * 0.65;

            vec4 worldPos = modelMatrix * vec4(pos * aScale, 1.0);
            vNormal = normalize(normalMatrix * normal);
            vViewDir = normalize(cameraPosition - worldPos.xyz);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uBirdColor;
          uniform vec3 uRimColor;
          uniform float uExposure;
          uniform float uGreenScreen;
          varying vec3 vNormal;
          varying vec3 vViewDir;

          void main() {
            if (uGreenScreen > 0.5) {
              gl_FragColor = vec4(0.04, 0.04, 0.04, 1.0);
              return;
            }
            float fresnel = pow(1.0 - max(dot(vNormal, vViewDir), 0.0), 2.5);
            vec3 col = mix(uBirdColor, uRimColor, fresnel * 0.45) * uExposure;
            gl_FragColor = vec4(col, 1.0);
          }
        `,
        side: THREE.DoubleSide
      });

      const instancedBirdGeo = new THREE.InstancedBufferGeometry();
      instancedBirdGeo.index = birdGeo.index;
      instancedBirdGeo.attributes.position = birdGeo.attributes.position;
      instancedBirdGeo.attributes.normal = birdGeo.attributes.normal;

      const phases = new Float32Array(birdCount);
      const speeds = new Float32Array(birdCount);
      const scales = new Float32Array(birdCount);

      birdFlock = new THREE.InstancedMesh(instancedBirdGeo, birdMat, birdCount);

      const birdData = [];
      const dummy = new THREE.Object3D();

      for (let i = 0; i < birdCount; i++) {
        phases[i] = Math.random() * Math.PI * 2;
        speeds[i] = 7.0 + Math.random() * 4.0;
        scales[i] = 0.6 + Math.random() * 0.55;

        // V-formation offsets in open sky on the left
        const leadX = (i % 2 === 0 ? 1 : -1) * Math.floor(i / 2) * 0.65;
        const leadY = -Math.floor(i / 2) * 0.22;
        const leadZ = -Math.floor(i / 2) * 0.45;

        birdData.push({
          relX: leadX + (Math.random() - 0.5) * 0.4,
          relY: leadY + (Math.random() - 0.5) * 0.3,
          relZ: leadZ + (Math.random() - 0.5) * 0.4,
          scale: scales[i]
        });

        dummy.position.set(0, 0, 0);
        dummy.updateMatrix();
        birdFlock.setMatrixAt(i, dummy.matrix);
      }

      instancedBirdGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));
      instancedBirdGeo.setAttribute('aSpeed', new THREE.InstancedBufferAttribute(speeds, 1));
      instancedBirdGeo.setAttribute('aScale', new THREE.InstancedBufferAttribute(scales, 1));

      birdFlock.userData = {
        birdData: birdData,
        dummy: dummy,
        baseAngle: 0
      };

      scene.add(birdFlock);
    }

    // --- Update Bird Flock Dynamics ---
    function updateBirds(time) {
      if (!birdFlock) return;
      birdFlock.material.uniforms.uTime.value = time;

      const dummy = birdFlock.userData.dummy;
      const bData = birdFlock.userData.birdData;

      // Flock center traverses a sweeping loop across open sunset sky
      const pathT = time * 0.18;
      const flockCenterX = Math.sin(pathT) * 14.0 - 5.0; // predominantly on open left side
      const flockCenterY = 7.5 + Math.cos(pathT * 1.5) * 2.2;
      const flockCenterZ = -14.0 + Math.sin(pathT * 0.7) * 8.0;

      // Tangent / flight heading
      const nextPathT = pathT + 0.05;
      const nextX = Math.sin(nextPathT) * 14.0 - 5.0;
      const nextY = 7.5 + Math.cos(nextPathT * 1.5) * 2.2;
      const nextZ = -14.0 + Math.sin(nextPathT * 0.7) * 8.0;

      const flightDir = new THREE.Vector3(nextX - flockCenterX, nextY - flockCenterY, nextZ - flockCenterZ).normalize();

      for (let i = 0; i < birdFlock.count; i++) {
        const b = bData[i];
        dummy.position.set(
          flockCenterX + b.relX,
          flockCenterY + b.relY,
          flockCenterZ + b.relZ
        );

        dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), flightDir);
        // Bank into turns
        dummy.rotateZ(Math.sin(pathT * 2.0) * 0.25);
        dummy.scale.setScalar(b.scale);
        dummy.updateMatrix();

        birdFlock.setMatrixAt(i, dummy.matrix);
      }
      birdFlock.instanceMatrix.needsUpdate = true;
    }

    // --- Apply Color Scheme ---
    function applyColorScheme(schemeName, animateDuration = 1.0) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      settings.colorScheme = schemeName;
      settings.bgColor = scheme.bg;
      settings.skyHorizon = scheme.skyHorizon;
      settings.skyMid = scheme.skyMid;
      settings.skyZenith = scheme.skyZenith;
      settings.silhouetteColor = scheme.silhouette;
      settings.rimColor = scheme.rim;
      settings.windowColor = scheme.window;
      settings.mistColor = scheme.mist;
      settings.cloudColor = scheme.cloud;
      settings.sunColor = scheme.sun;

      if (animateDuration > 0 && typeof gsap !== 'undefined') {
        const targetBg = new THREE.Color(scheme.bg);
        const targetHoriz = new THREE.Color(scheme.skyHorizon);
        const targetMid = new THREE.Color(scheme.skyMid);
        const targetZen = new THREE.Color(scheme.skyZenith);
        const targetSil = new THREE.Color(scheme.silhouette);
        const targetRim = new THREE.Color(scheme.rim);
        const targetWin = new THREE.Color(scheme.window);
        const targetMist = new THREE.Color(scheme.mist);
        const targetCloud = new THREE.Color(scheme.cloud);
        const targetSun = new THREE.Color(scheme.sun);

        if (!settings.greenScreen) {
          gsap.to(scene.background, { r: targetBg.r, g: targetBg.g, b: targetBg.b, duration: animateDuration });
        }
        gsap.to(skyShader.uniforms.uHorizonColor.value, { r: targetHoriz.r, g: targetHoriz.g, b: targetHoriz.b, duration: animateDuration });
        gsap.to(skyShader.uniforms.uMidColor.value, { r: targetMid.r, g: targetMid.g, b: targetMid.b, duration: animateDuration });
        gsap.to(skyShader.uniforms.uZenithColor.value, { r: targetZen.r, g: targetZen.g, b: targetZen.b, duration: animateDuration });
        gsap.to(skyShader.uniforms.uSunColor.value, { r: targetSun.r, g: targetSun.g, b: targetSun.b, duration: animateDuration });

        gsap.to(silhouetteUniforms.uColor.value, { r: targetSil.r, g: targetSil.g, b: targetSil.b, duration: animateDuration });
        gsap.to(silhouetteUniforms.uRimColor.value, { r: targetRim.r, g: targetRim.g, b: targetRim.b, duration: animateDuration });

        gsap.to(windowUniforms.uWindowColor.value, { r: targetWin.r, g: targetWin.g, b: targetWin.b, duration: animateDuration });
        gsap.to(mistUniforms.uMistColor.value, { r: targetMist.r, g: targetMist.g, b: targetMist.b, duration: animateDuration });
        gsap.to(cloudUniforms.uCloudColor.value, { r: targetCloud.r, g: targetCloud.g, b: targetCloud.b, duration: animateDuration });
        gsap.to(cloudUniforms.uSkyColor.value, { r: targetMid.r, g: targetMid.g, b: targetMid.b, duration: animateDuration });

        if (birdFlock && birdFlock.material.uniforms) {
          gsap.to(birdFlock.material.uniforms.uBirdColor.value, { r: targetSil.r, g: targetSil.g, b: targetSil.b, duration: animateDuration });
          gsap.to(birdFlock.material.uniforms.uRimColor.value, { r: targetRim.r, g: targetRim.g, b: targetRim.b, duration: animateDuration });
        }
      } else {
        if (!settings.greenScreen) scene.background.set(scheme.bg);
        skyShader.uniforms.uHorizonColor.value.set(scheme.skyHorizon);
        skyShader.uniforms.uMidColor.value.set(scheme.skyMid);
        skyShader.uniforms.uZenithColor.value.set(scheme.skyZenith);
        skyShader.uniforms.uSunColor.value.set(scheme.sun);

        silhouetteUniforms.uColor.value.set(scheme.silhouette);
        silhouetteUniforms.uRimColor.value.set(scheme.rim);

        windowUniforms.uWindowColor.value.set(scheme.window);
        mistUniforms.uMistColor.value.set(scheme.mist);
        cloudUniforms.uCloudColor.value.set(scheme.cloud);
        cloudUniforms.uSkyColor.value.set(scheme.skyMid);

        if (birdFlock && birdFlock.material.uniforms) {
          birdFlock.material.uniforms.uBirdColor.value.set(scheme.silhouette);
          birdFlock.material.uniforms.uRimColor.value.set(scheme.rim);
        }
      }

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // --- Green Screen Toggle ---
    function updateGreenScreen() {
      const gs = settings.greenScreen ? 1.0 : 0.0;
      skyShader.uniforms.uGreenScreen.value = gs;
      mistUniforms.uGreenScreen.value = gs;
      cloudUniforms.uGreenScreen.value = gs;
      if (birdFlock && birdFlock.material.uniforms) {
        birdFlock.material.uniforms.uGreenScreen.value = gs;
      }
      if (settings.greenScreen) {
        scene.background = new THREE.Color(0x00ff00);
      } else {
        scene.background = new THREE.Color(settings.bgColor);
      }
    }

    // --- Procedural Scene Randomizer ---
    function randomizeScene() {
      // NOTE: When clicking to randomize scene, do NOT shuffle or change Postprocessing settings!
      // All postProcessor.settings remain strictly preserved as configured by the user.
      // Pick random color scheme
      const keys = Object.keys(COLOR_SCHEMES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randomKey, 1.2);

      // Randomize sun and lighting parameters
      settings.sunIntensity = 1.6 + Math.random() * 1.5;
      settings.rimIntensity = 2.0 + Math.random() * 1.8;
      settings.rimPower = 2.5 + Math.random() * 2.5;
      settings.exposure = 0.85 + Math.random() * 0.45;
      settings.animationSpeed = 0.6 + Math.random() * 0.9;

      dirLight.intensity = settings.sunIntensity;
      renderer.toneMappingExposure = settings.exposure;
      skyShader.uniforms.uExposure.value = settings.exposure;
      silhouetteUniforms.uExposure.value = settings.exposure;
      silhouetteUniforms.uRimIntensity.value = settings.rimIntensity;
      silhouetteUniforms.uRimPower.value = settings.rimPower;
      windowUniforms.uExposure.value = settings.exposure;
      mistUniforms.uExposure.value = settings.exposure;
      cloudUniforms.uExposure.value = settings.exposure;

      // Re-roll geometric architecture variation
      createArchitecture(true);

      // Re-roll clouds
      createClouds();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // --- Antialias Toggle Support ---
    function updateAntialias() {
      const curCamPos = camera.position.clone();
      const curTarget = controls.target.clone();

      initRenderer();

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.minDistance = 6;
      controls.maxDistance = 75;
      controls.maxPolarAngle = Math.PI / 2 + 0.04;
      controls.target.copy(curTarget);
      camera.position.copy(curCamPos);

      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);
      }
    }

    // --- Camera Animation Engine ---
    // Smooth, slow animations that preserve user wheel zoom & drag angles!
    let lastAnimPreset = settings.animationPreset;

    function updateCameraAnimation(dt) {
      const speed = settings.animationSpeed;
      animTime += dt * speed;

      // Handle Preset Changes
      if (settings.animationPreset !== lastAnimPreset) {
        if (settings.animationPreset === 'Sunset Orbit') {
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.65 * speed;
        } else {
          controls.autoRotate = false;
        }
        lastAnimPreset = settings.animationPreset;
      }

      // 1. Sunset Orbit: OrbitControls handles continuous rotation natively,
      // letting the user zoom in/out with the wheel and adjust polar angle freely without snapping back!
      if (settings.animationPreset === 'Sunset Orbit') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.65 * speed;
        return;
      }

      controls.autoRotate = false;

      if (settings.animationPreset === 'Static (No Movement)') {
        return;
      }

      // Delta-based offset application:
      // By adding delta to BOTH controls.target and camera.position,
      // the camera-to-target distance vector is 100% preserved!
      // The user can wheel zoom in or out, and rotate angle, and it NEVER snaps back!
      const t = animTime;
      const prevT = animTime - dt * speed;

      switch (settings.animationPreset) {
        case 'Gentle Horizon Drift': {
          const curVal = Math.sin(t * 0.22) * 2.2;
          const prevVal = Math.sin(prevT * 0.22) * 2.2;
          const delta = curVal - prevVal;

          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          right.y = 0;
          right.normalize();

          controls.target.addScaledVector(right, delta);
          camera.position.addScaledVector(right, delta);
          break;
        }

        case 'Twilight Crane': {
          const curVal = Math.sin(t * 0.2) * 1.6;
          const prevVal = Math.sin(prevT * 0.2) * 1.6;
          const delta = curVal - prevVal;

          controls.target.y += delta;
          camera.position.y += delta;
          break;
        }

        case 'Breathing Silhouette': {
          const curVal = Math.sin(t * 0.28) * 1.5;
          const prevVal = Math.sin(prevT * 0.28) * 1.5;
          const delta = curVal - prevVal;

          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
          forward.y = 0;
          forward.normalize();

          controls.target.addScaledVector(forward, delta);
          camera.position.addScaledVector(forward, delta);
          break;
        }

        case 'Celestial Arc': {
          const curX = Math.sin(t * 0.2) * 2.0;
          const prevX = Math.sin(prevT * 0.2) * 2.0;
          const curY = Math.cos(t * 0.35) * 0.9;
          const prevY = Math.cos(prevT * 0.35) * 0.9;

          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          right.y = 0;
          right.normalize();

          controls.target.addScaledVector(right, curX - prevX);
          camera.position.addScaledVector(right, curX - prevX);

          controls.target.y += curY - prevY;
          camera.position.y += curY - prevY;
          break;
        }

        case 'Mystical Sway': {
          const curX = Math.sin(t * 0.25) * 1.8;
          const prevX = Math.sin(prevT * 0.25) * 1.8;
          const curY = Math.sin(t * 0.5) * 0.5;
          const prevY = Math.sin(prevT * 0.5) * 0.5;

          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          right.y = 0;
          right.normalize();

          controls.target.addScaledVector(right, curX - prevX);
          camera.position.addScaledVector(right, curX - prevX);

          controls.target.y += curY - prevY;
          camera.position.y += curY - prevY;
          break;
        }

        case 'Distant Flight Follow': {
          const curX = Math.sin(t * 0.18) * 2.8;
          const prevX = Math.sin(prevT * 0.18) * 2.8;
          const curY = Math.cos(t * 0.25) * 1.0;
          const prevY = Math.cos(prevT * 0.25) * 1.0;

          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          right.y = 0;
          right.normalize();

          controls.target.addScaledVector(right, curX - prevX);
          camera.position.addScaledVector(right, curX - prevX);

          controls.target.y += curY - prevY;
          camera.position.y += curY - prevY;
          break;
        }
      }
    }

    // --- Build GUI with lil-gui ---
    function buildGUI() {
      gui = new GUI({ title: 'Sunset Silhouette Settings' });

      // 1. Scene & Themes Folder
      const themeFolder = gui.addFolder('Palette & Visual Theme');
      themeFolder.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => {
        applyColorScheme(v, 1.0);
      });
      themeFolder.add(settings, 'greenScreen').name('Green Screen (#00ff00)').onChange(updateGreenScreen);
      themeFolder.addColor(settings, 'bgColor').name('Background Color').onChange(v => {
        if (!settings.greenScreen) scene.background.set(v);
      });
      themeFolder.add(settings, 'clickRandomize').name('Click Scene to Randomize');
      themeFolder.add({ randomize: () => randomizeScene() }, 'randomize').name('Randomize Scene Now');

      // 2. Camera & Animation Folder
      const animFolder = gui.addFolder('Camera & Animation');
      animFolder.add(settings, 'animationPreset', ANIMATION_PRESETS).name('Animation Mode');
      animFolder.add(settings, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      animFolder.add(settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
        renderer.setPixelRatio(v);
        if (postProcessor) {
          postProcessor.setSize(window.innerWidth, window.innerHeight, v);
        }
      });
      animFolder.add(settings, 'antialias').name('Antialias (default ON)').onChange(updateAntialias);
      animFolder.add({ resetCam: () => {
        camera.position.set(3.5, 2.2, 25.0);
        controls.target.set(3.5, 1.2, 0.0);
      }}, 'resetCam').name('Reset Camera View');

      // 3. Lighting & Exposure Folder
      const lightFolder = gui.addFolder('Lighting & Exposure');
      lightFolder.add(settings, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(v => {
        renderer.toneMappingExposure = v;
        skyShader.uniforms.uExposure.value = v;
        silhouetteUniforms.uExposure.value = v;
        windowUniforms.uExposure.value = v;
        mistUniforms.uExposure.value = v;
        cloudUniforms.uExposure.value = v;
        if (birdFlock) birdFlock.material.uniforms.uExposure.value = v;
      });

      // Directional Sun Backlight
      const sunFolder = lightFolder.addFolder('Sun / Backlight');
      sunFolder.add(settings, 'sunIntensity', 0.0, 6.0, 0.1).name('Sun Intensity').onChange(v => {
        dirLight.intensity = v;
      });
      sunFolder.addColor(settings, 'sunColor').name('Sun Color').onChange(v => {
        dirLight.color.set(v);
        skyShader.uniforms.uSunColor.value.set(v);
      });
      sunFolder.add(settings, 'sunPosX', -50, 50, 0.5).name('Sun X').onChange(v => {
        dirLight.position.x = v;
        skyShader.uniforms.uSunPos.value.x = v;
        silhouetteUniforms.uSunPos.value.x = v;
      });
      sunFolder.add(settings, 'sunPosY', -10, 20, 0.5).name('Sun Y').onChange(v => {
        dirLight.position.y = v;
        skyShader.uniforms.uSunPos.value.y = v;
        silhouetteUniforms.uSunPos.value.y = v;
      });
      sunFolder.add(settings, 'sunPosZ', -60, -5, 0.5).name('Sun Z').onChange(v => {
        dirLight.position.z = v;
        skyShader.uniforms.uSunPos.value.z = v;
        silhouetteUniforms.uSunPos.value.z = v;
      });

      // Ambient Light
      const ambientFolder = lightFolder.addFolder('Ambient Light');
      ambientFolder.add(settings, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Intensity').onChange(v => {
        ambientLight.intensity = v;
      });
      ambientFolder.addColor(settings, 'ambientColor').name('Ambient Color').onChange(v => {
        ambientLight.color.set(v);
      });

      // Golden Rim Light on Silhouettes
      const rimFolder = lightFolder.addFolder('Silhouette Golden Rim');
      rimFolder.add(settings, 'rimIntensity', 0.0, 6.0, 0.1).name('Rim Intensity').onChange(v => {
        silhouetteUniforms.uRimIntensity.value = v;
      });
      rimFolder.add(settings, 'rimPower', 1.0, 8.0, 0.1).name('Rim Sharpness').onChange(v => {
        silhouetteUniforms.uRimPower.value = v;
      });
      rimFolder.addColor(settings, 'rimColor').name('Rim Color').onChange(v => {
        silhouetteUniforms.uRimColor.value.set(v);
        if (birdFlock) birdFlock.material.uniforms.uRimColor.value.set(v);
      });

      // Window Lights
      const winFolder = lightFolder.addFolder('Window Lights');
      winFolder.add(settings, 'windowIntensity', 0.0, 6.0, 0.1).name('Window Intensity').onChange(v => {
        windowUniforms.uWindowIntensity.value = v;
      });
      winFolder.addColor(settings, 'windowColor').name('Window Color').onChange(v => {
        windowUniforms.uWindowColor.value.set(v);
      });

      // Ground Mist & Atmosphere
      const mistFolder = lightFolder.addFolder('Ground Mist');
      mistFolder.add(settings, 'mistDensity', 0.0, 2.5, 0.05).name('Mist Density').onChange(v => {
        mistUniforms.uMistDensity.value = v;
      });
      mistFolder.addColor(settings, 'mistColor').name('Mist Color').onChange(v => {
        mistUniforms.uMistColor.value.set(v);
      });

      // 4. Custom Individual Colors Folder
      const colorsFolder = gui.addFolder('Palette Colors Customizer');
      colorsFolder.addColor(settings, 'skyHorizon').name('Sky Horizon').onChange(v => {
        skyShader.uniforms.uHorizonColor.value.set(v);
      });
      colorsFolder.addColor(settings, 'skyMid').name('Sky Mid').onChange(v => {
        skyShader.uniforms.uMidColor.value.set(v);
        cloudUniforms.uSkyColor.value.set(v);
      });
      colorsFolder.addColor(settings, 'skyZenith').name('Sky Zenith').onChange(v => {
        skyShader.uniforms.uZenithColor.value.set(v);
      });
      colorsFolder.addColor(settings, 'silhouetteColor').name('Silhouette Body').onChange(v => {
        silhouetteUniforms.uColor.value.set(v);
        if (birdFlock) birdFlock.material.uniforms.uBirdColor.value.set(v);
      });
      colorsFolder.addColor(settings, 'cloudColor').name('Cloud Underside').onChange(v => {
        cloudUniforms.uCloudColor.value.set(v);
      });

      colorsFolder.close();
      ambientFolder.close();
      winFolder.close();
      mistFolder.close();

      // Post-Processing Suite Folder from postprocessing/PostProcessor.js
      postProcessor.attachGUI(gui, "Post-Processing Suite");
    }

    // --- User Interactions (Click Randomize, Keyboard 'H' to toggle UI) ---
    function setupInteractions() {
      let pointerDownX = 0;
      let pointerDownY = 0;
      let pointerDownTime = 0;

      window.addEventListener('pointerdown', (e) => {
        pointerDownX = e.clientX;
        pointerDownY = e.clientY;
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointerup', (e) => {
        // Disregard if clicked inside lil-gui
        if (e.target.closest('.lil-gui')) return;

        const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
        const duration = performance.now() - pointerDownTime;

        // If it was a quick click without dragging
        if (dist < 6 && duration < 320) {
          if (settings.clickRandomize) {
            randomizeScene();
          }
        }
      });

      // Press 'H' to hide/show UI
      window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
          if (gui && gui.domElement) {
            const isHidden = gui.domElement.style.display === 'none';
            gui.domElement.style.display = isHidden ? '' : 'none';
          }
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Main Animation Render Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      accumulatedTime += dt * settings.animationSpeed;
      const time = accumulatedTime;

      // Update shader uniforms
      windowUniforms.uTime.value = time;
      mistUniforms.uTime.value = time;
      cloudUniforms.uTime.value = time;

      // Animate drifting clouds
      if (cloudGroup) {
        cloudGroup.children.forEach(cloud => {
          cloud.position.x += cloud.userData.speed * dt * settings.animationSpeed;
          if (cloud.position.x > 50) {
            cloud.position.x = -50 - cloud.userData.width;
          }
        });
      }

      // Animate distant bird flock
      updateBirds(time);

      // Camera Animation (allows uninterrupted wheel zoom & drag angles)
      updateCameraAnimation(dt);

      controls.update();

      // Render via PostProcessor Suite
      if (postProcessor) {
        postProcessor.setMoonScreenPosition(camera, dirLight.position);
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // Run
    init();
  </script>
</body>
</html>
