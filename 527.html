<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Wave Geometry - Dave Whyte Particle Wave</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-size: 62.5%;
      background: #000;
      overflow: hidden;
      color: #FFF;
      font-family: sans-serif;
      overscroll-behavior: none;
    }
    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
      pointer-events: auto;
    }
    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }
    #loading.loaded {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    #container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      outline: none;
    }
    canvas.dragging {
      cursor: grabbing;
    }
    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"></script>
</head>

    // ============================================================
    // 8 Preconfigured Camera Animations
    // ============================================================
    const ANIMATION_MODES = [
      'Static (No Movement)',
      'Gentle Orbit (Slow 360°)',
      'Pulsing Float & Tilt',
      'Breathing Dolly Drift',
      'Low Horizon Sweep',
      'Spiral Helix Orbit',
      'Pendulum Arc Swing',
      'Cosmic Drift & Roll'
    ];

    // ============================================================
    // Application Parameters
    // ============================================================
    const PARAMS = {
      // Color Scheme & Background
      colorScheme: 'Original',
      greenScreen: false,
      backgroundColor: '#000000',
      c1: '#ffffff',
      c2: '#ffffff',
      c3: '#ffffff',
      c4: '#ffffff',
      c5: '#ffffff',
      colorCycle: 1.0,
      colorOffset: 0.0,

      // Navigation & Camera
      camDistance: 1.35,
      camTheta: 0.0,
      camPhi: Math.PI * 0.5, // Look straight at disc
      panX: 0.0,
      panY: 0.0,
      fov: 70,

      // Animation
      animationMode: 'Gentle Orbit (Slow 360°)',
      animationSpeed: 1.0,
      paused: false,

      // Geometric Wave Parameters (Dave Whyte wave recreation)
      waveDelta: 0.1,
      waveAmp: 0.3,
      waveFreq: 0.25,
      waveDistFactor: 0.5,
      waveZHeight: 0.12,
      twist: 0.0,
      pointSizeBase: 26.0,
      pointSizeWave: 10.0,
      sizeAttenuation: true,

      // Lighting & Exposure
      exposure: 1.0,
      masterLightIntensity: 1.0,
      shading3D: 0.5, // 0 = flat graphic discs, 1 = 3D shaded spheres
      light1Color: '#ffffff',
      light1Intensity: 1.0,
      light1PosX: 100.0,
      light1PosY: 200.0,
      light1PosZ: 150.0,
      light2Color: '#ffffff',
      light2Intensity: 1.0,
      light2PosX: 0.0,
      light2PosY: 300.0,
      light2PosZ: 100.0,
      ambientColor: '#ffffff',
      ambientIntensity: 1.0,

      // Post-Processing & Rendering Quality
      antialias: true,
      postProcessing: true,
      rgbShift: 0.005,
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      blending: 'Normal', // 'Normal' or 'Additive'

      // Procedural Variation on Click
      clickRandomize: true
    };

    let savedBgColor = PARAMS.backgroundColor;

    // ============================================================
    // Shaders
    // ============================================================
    const vertexShader = /* glsl */ `
      attribute float aRandom;
      uniform float uTime;
      uniform float uWaveDelta;
      uniform float uWaveAmp;
      uniform float uWaveFreq;
      uniform float uWaveDistFactor;
      uniform float uWaveZHeight;
      uniform float uTwist;
      uniform float uPointSizeBase;
      uniform float uPointSizeWave;
      uniform float uSizeAttenuation;

      varying vec3 vWorldPos;
      varying float vWave;
      varying float vDist;
      varying float vRandom;

      float PI = 3.14159265359;

      float roundedSquareWave(float t, float delta, float a, float f) {
        return ((2.0 * a) / PI) * atan(sin(2.0 * PI * t * f) / delta);
      }

      void main() {
        vec3 pos = position;
        float dist = length(pos.xy);
        
        float wave = roundedSquareWave(uTime - dist * uWaveDistFactor, uWaveDelta, 1.0, uWaveFreq);
        float scale = 1.0 + wave * uWaveAmp;
        
        // Dynamic spiral twist
        if (abs(uTwist) > 0.0001) {
          float ang = atan(pos.y, pos.x) + wave * uTwist * (dist / 1.2);
          pos.x = cos(ang) * dist;
          pos.y = sin(ang) * dist;
        }
        
        pos.xy *= scale;
        pos.z += wave * uWaveZHeight;
        
        vec4 worldPos = modelMatrix * vec4(pos, 1.0);
        vWorldPos = worldPos.xyz;
        
        vec4 mvPosition = viewMatrix * worldPos;
        
        float pSize = uPointSizeBase + uPointSizeWave * wave;
        if (uSizeAttenuation > 0.5) {
          pSize *= (1.2 / max(0.2, -mvPosition.z));
        }
        gl_PointSize = pSize;
        gl_Position = projectionMatrix * mvPosition;
        
        vWave = wave;
        vDist = dist;
        vRandom = aRandom;
      }
    `;

    const fragmentShader = /* glsl */ `
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec3 uColor4;
      uniform vec3 uColor5;
      uniform float uColorCycle;
      uniform float uColorOffset;

      uniform vec3 uDirLightColor;
      uniform float uDirLightIntensity;
      uniform vec3 uDirLightPos;

      uniform vec3 uPointLightColor;
      uniform float uPointLightIntensity;
      uniform vec3 uPointLightPos;

      uniform vec3 uAmbientColor;
      uniform float uAmbientIntensity;

      uniform float uExposure;
      uniform float uMasterIntensity;
      uniform float uShading3D;

      varying vec3 vWorldPos;
      varying float vWave;
      varying float vDist;
      varying float vRandom;

      vec3 getPaletteColor(float t) {
        t = clamp(t, 0.0, 1.0) * 4.0;
        if (t < 1.0) return mix(uColor1, uColor2, t);
        if (t < 2.0) return mix(uColor2, uColor3, t - 1.0);
        if (t < 3.0) return mix(uColor3, uColor4, t - 2.0);
        return mix(uColor4, uColor5, t - 3.0);
      }

      void main() {
        vec2 coord = gl_PointCoord - vec2(0.5);
        float r = length(coord);
        
        // Circular point with smooth edge
        if (r > 0.48) discard;
        float alpha = 1.0 - smoothstep(0.43, 0.48, r);
        
        // Color mapping along concentric waves
        float t = fract((vDist / 1.25) * uColorCycle + (vWave * 0.5 + 0.5) * 0.25 + uColorOffset + vRandom * 0.05);
        vec3 baseColor = getPaletteColor(t);
        
        // Simulated 3D sphere surface normal
        float nz = sqrt(max(0.0, 1.0 - (r / 0.48) * (r / 0.48)));
        vec3 N = normalize(vec3(coord.x / 0.48, -coord.y / 0.48, nz));
        
        // Directional Light
        vec3 Ldir = normalize(uDirLightPos);
        float diffDir = max(dot(N, Ldir), 0.0);
        vec3 dirContrib = uDirLightColor * (diffDir * uDirLightIntensity);
        
        // Spot / Point Light
        vec3 Lpoint = normalize(uPointLightPos - vWorldPos);
        float diffPoint = max(dot(N, Lpoint), 0.0);
        float specPoint = pow(max(dot(N, normalize(Lpoint + vec3(0.0, 0.0, 1.0))), 0.0), 16.0);
        vec3 pointContrib = uPointLightColor * ((diffPoint + specPoint * 0.4) * uPointLightIntensity);
        
        // Ambient Light
        vec3 ambientContrib = uAmbientColor * uAmbientIntensity;
        
        // Shading blend between flat graphic discs and illuminated 3D pearls
        vec3 litColor = baseColor * (ambientContrib + dirContrib + pointContrib);
        vec3 finalColor = mix(baseColor, litColor, uShading3D);
        
        // Exposure & Master Lighting
        finalColor *= uExposure * uMasterIntensity;
        
        gl_FragColor = vec4(finalColor, alpha);
      }
    `;

    // ============================================================
    // Sketch Application Class
    // ============================================================
    class Sketch {
      constructor() {
        this.container = document.getElementById('container');
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.time = new THREE.Clock(true);

        this.animPhase = 0.0;
        this.animDistOffset = 0.0;
        this.animThetaOffset = 0.0;
        this.animPhiOffset = 0.0;

        this.target = new THREE.Vector3(0, 0, 0);

        this.initRenderer();
        this.statsInit();
        this.setupScene();
        this.setupLights();
        this.setupShape();
        this.setupEffect();
        this.setupControls();
        this.setupGui();
        this.setupEvents();

        this.render = this.render.bind(this);
        this.render();
      }

      initRenderer() {
        if (this.renderer) {
          if (this.renderer.domElement && this.renderer.domElement.parentNode) {
            this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
          }
          this.renderer.dispose();
        }

        this.renderer = new THREE.WebGLRenderer({
          antialias: PARAMS.antialias,
          alpha: true,
          powerPreference: 'high-performance'
        });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(PARAMS.dpr);
        this.renderer.setClearColor(PARAMS.greenScreen ? 0x00ff00 : new THREE.Color(PARAMS.backgroundColor), 1.0);

        this.canvas = this.renderer.domElement;
        this.container.appendChild(this.canvas);
      }

      statsInit() {
        if (typeof Stats !== 'undefined') {
          this.stats = new Stats();
          this.stats.setMode(0);
          this.stats.domElement.style.position = 'absolute';
          this.stats.domElement.style.left = '0';
          this.stats.domElement.style.top = '0';
          this.stats.domElement.style.zIndex = '100';
          this.container.appendChild(this.stats.domElement);
        }
      }

      setupScene() {
        this.scene = new THREE.Scene();
        this.updateBackgroundColor();

        const fovRadian = (PARAMS.fov / 2) * (Math.PI / 180);
        this.dist = (this.height / 2) / Math.tan(fovRadian);

        this.camera = new THREE.PerspectiveCamera(PARAMS.fov, this.width / this.height, 0.01, 100.0);
        this.updateCameraPosition();
        this.scene.add(this.camera);
      }

      setupLights() {
        this.directionalLight = new THREE.DirectionalLight(PARAMS.light1Color, PARAMS.light1Intensity);
        this.directionalLight.position.set(PARAMS.light1PosX, PARAMS.light1PosY, PARAMS.light1PosZ);
        this.scene.add(this.directionalLight);

        this.spotLight = new THREE.SpotLight(PARAMS.light2Color, PARAMS.light2Intensity);
        this.spotLight.position.set(PARAMS.light2PosX, PARAMS.light2PosY, PARAMS.light2PosZ);
        this.scene.add(this.spotLight);

        this.ambientLight = new THREE.AmbientLight(PARAMS.ambientColor, PARAMS.ambientIntensity);
        this.scene.add(this.ambientLight);
      }

      setupShape() {
        // Hexagonal concentric rings of particles: 60 rings = 10,980 points
        this.count = 10980;
        this.geometry = new THREE.BufferGeometry();
        this.vertices = new Float32Array(this.count * 3);
        this.numbers = new Float32Array(this.count);

        let index = 0;
        for (let i = 1; i <= 60; i++) {
          for (let j = 0; j < i * 6; j++) {
            const angle = ((Math.PI * 2) / (6 * i)) * j;
            const radius = 0.1 * 0.2 * i; // 0.02 * i
            this.vertices[index * 3 + 0] = Math.cos(angle) * radius;
            this.vertices[index * 3 + 1] = Math.sin(angle) * radius;
            this.vertices[index * 3 + 2] = 0.0;
            index++;
          }
        }

        for (let i = 0; i < this.count; i++) {
          this.numbers[i] = Math.random() * 0.1;
        }

        this.geometry.setAttribute('position', new THREE.BufferAttribute(this.vertices, 3));
        this.geometry.setAttribute('aRandom', new THREE.BufferAttribute(this.numbers, 1));

        this.uniforms = {
          uTime: { value: 0 },
          uWaveDelta: { value: PARAMS.waveDelta },
          uWaveAmp: { value: PARAMS.waveAmp },
          uWaveFreq: { value: PARAMS.waveFreq },
          uWaveDistFactor: { value: PARAMS.waveDistFactor },
          uWaveZHeight: { value: PARAMS.waveZHeight },
          uTwist: { value: PARAMS.twist },
          uPointSizeBase: { value: PARAMS.pointSizeBase },
          uPointSizeWave: { value: PARAMS.pointSizeWave },
          uSizeAttenuation: { value: PARAMS.sizeAttenuation ? 1.0 : 0.0 },

          uColor1: { value: new THREE.Color(PARAMS.c1) },
          uColor2: { value: new THREE.Color(PARAMS.c2) },
          uColor3: { value: new THREE.Color(PARAMS.c3) },
          uColor4: { value: new THREE.Color(PARAMS.c4) },
          uColor5: { value: new THREE.Color(PARAMS.c5) },
          uColorCycle: { value: PARAMS.colorCycle },
          uColorOffset: { value: PARAMS.colorOffset },

          uDirLightColor: { value: new THREE.Color(PARAMS.light1Color) },
          uDirLightIntensity: { value: PARAMS.light1Intensity },
          uDirLightPos: { value: new THREE.Vector3(PARAMS.light1PosX, PARAMS.light1PosY, PARAMS.light1PosZ) },

          uPointLightColor: { value: new THREE.Color(PARAMS.light2Color) },
          uPointLightIntensity: { value: PARAMS.light2Intensity },
          uPointLightPos: { value: new THREE.Vector3(PARAMS.light2PosX, PARAMS.light2PosY, PARAMS.light2PosZ) },

          uAmbientColor: { value: new THREE.Color(PARAMS.ambientColor) },
          uAmbientIntensity: { value: PARAMS.ambientIntensity },

          uExposure: { value: PARAMS.exposure },
          uMasterIntensity: { value: PARAMS.masterLightIntensity },
          uShading3D: { value: PARAMS.shading3D }
        };

        this.material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: this.uniforms,
          blending: PARAMS.blending === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending,
          transparent: true,
          depthWrite: false,
          vertexShader: vertexShader,
          fragmentShader: fragmentShader
        });

        this.mesh = new THREE.Points(this.geometry, this.material);
        this.mesh.position.set(PARAMS.panX, PARAMS.panY, 0);
        this.scene.add(this.mesh);
      }

      setupEffect() {
        this.composer = new EffectComposer(this.renderer);
        this.renderPass = new RenderPass(this.scene, this.camera);
        this.composer.addPass(this.renderPass);

        this.rgbShiftPass = new ShaderPass(RGBShiftShader);
        this.rgbShiftPass.uniforms['amount'].value = PARAMS.rgbShift;
        this.composer.addPass(this.rgbShiftPass);

        this.composer.setSize(this.width, this.height);
        this.composer.setPixelRatio(PARAMS.dpr);
      }

      setupControls() {
        // OrbitControls available as fallback/extension
        this.orbitControls = new OrbitControls(this.camera, this.renderer.domElement);
        this.orbitControls.enabled = false; // We use our smooth integrated controller for non-resetting zoom & angle
      }

      updateBackgroundColor() {
        const bgHex = PARAMS.greenScreen ? '#00ff00' : PARAMS.backgroundColor;
        const col = new THREE.Color(bgHex);
        if (this.scene) this.scene.background = col;
        if (this.renderer) this.renderer.setClearColor(col, 1.0);
        document.body.style.background = bgHex;
      }

      updateCameraPosition() {
        const effectiveDist = Math.max(0.1, PARAMS.camDistance + this.animDistOffset);
        const effectiveTheta = PARAMS.camTheta + this.animThetaOffset;
        const effectivePhi = THREE.MathUtils.clamp(PARAMS.camPhi + this.animPhiOffset, 0.05, Math.PI - 0.05);

        this.camera.position.x = this.target.x + effectiveDist * Math.sin(effectivePhi) * Math.sin(effectiveTheta);
        this.camera.position.y = this.target.y + effectiveDist * Math.cos(effectivePhi);
        this.camera.position.z = this.target.z + effectiveDist * Math.sin(effectivePhi) * Math.cos(effectiveTheta);
        this.camera.lookAt(this.target);

        this.camera.fov = PARAMS.fov;
        this.camera.updateProjectionMatrix();
      }

      syncUniforms() {
        const u = this.uniforms;
        u.uWaveDelta.value = PARAMS.waveDelta;
        u.uWaveAmp.value = PARAMS.waveAmp;
        u.uWaveFreq.value = PARAMS.waveFreq;
        u.uWaveDistFactor.value = PARAMS.waveDistFactor;
        u.uWaveZHeight.value = PARAMS.waveZHeight;
        u.uTwist.value = PARAMS.twist;
        u.uPointSizeBase.value = PARAMS.pointSizeBase;
        u.uPointSizeWave.value = PARAMS.pointSizeWave;
        u.uSizeAttenuation.value = PARAMS.sizeAttenuation ? 1.0 : 0.0;

        u.uColor1.value.set(PARAMS.c1);
        u.uColor2.value.set(PARAMS.c2);
        u.uColor3.value.set(PARAMS.c3);
        u.uColor4.value.set(PARAMS.c4);
        u.uColor5.value.set(PARAMS.c5);
        u.uColorCycle.value = PARAMS.colorCycle;
        u.uColorOffset.value = PARAMS.colorOffset;

        u.uDirLightColor.value.set(PARAMS.light1Color);
        u.uDirLightIntensity.value = PARAMS.light1Intensity;
        u.uDirLightPos.value.set(PARAMS.light1PosX, PARAMS.light1PosY, PARAMS.light1PosZ);
        this.directionalLight.color.set(PARAMS.light1Color);
        this.directionalLight.intensity = PARAMS.light1Intensity;
        this.directionalLight.position.set(PARAMS.light1PosX, PARAMS.light1PosY, PARAMS.light1PosZ);

        u.uPointLightColor.value.set(PARAMS.light2Color);
        u.uPointLightIntensity.value = PARAMS.light2Intensity;
        u.uPointLightPos.value.set(PARAMS.light2PosX, PARAMS.light2PosY, PARAMS.light2PosZ);
        this.spotLight.color.set(PARAMS.light2Color);
        this.spotLight.intensity = PARAMS.light2Intensity;
        this.spotLight.position.set(PARAMS.light2PosX, PARAMS.light2PosY, PARAMS.light2PosZ);

        u.uAmbientColor.value.set(PARAMS.ambientColor);
        u.uAmbientIntensity.value = PARAMS.ambientIntensity;
        this.ambientLight.color.set(PARAMS.ambientColor);
        this.ambientLight.intensity = PARAMS.ambientIntensity;

        u.uExposure.value = PARAMS.exposure;
        u.uMasterIntensity.value = PARAMS.masterLightIntensity;
        u.uShading3D.value = PARAMS.shading3D;

        if (this.mesh) {
          this.mesh.position.set(PARAMS.panX, PARAMS.panY, 0);
          this.material.blending = PARAMS.blending === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending;
          this.material.needsUpdate = true;
        }

        if (this.rgbShiftPass) {
          this.rgbShiftPass.uniforms['amount'].value = PARAMS.rgbShift;
        }
      }

      applyColorScheme(name) {
        const s = COLOR_SCHEMES[name];
        if (!s) return;
        PARAMS.colorScheme = name;
        if (!PARAMS.greenScreen) {
          PARAMS.backgroundColor = s.backgroundColor;
          savedBgColor = s.backgroundColor;
        }
        PARAMS.c1 = s.c1;
        PARAMS.c2 = s.c2;
        PARAMS.c3 = s.c3;
        PARAMS.c4 = s.c4;
        PARAMS.c5 = s.c5;
        PARAMS.light1Color = s.light1Color;
        PARAMS.light1Intensity = s.light1Intensity;
        PARAMS.light2Color = s.light2Color;
        PARAMS.light2Intensity = s.light2Intensity;
        PARAMS.ambientColor = s.ambientColor;
        PARAMS.ambientIntensity = s.ambientIntensity;

        this.updateBackgroundColor();
        this.syncUniforms();
        this.updateGuiDisplay();
      }

      randomizeScene() {
        // 1. Pick a random color scheme from the 19 schemes
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        this.applyColorScheme(randomScheme);

        // 2. Re-roll geometric wave parameters
        PARAMS.waveDelta = +(0.03 + Math.random() * 0.22).toFixed(3);
        PARAMS.waveAmp = +(0.15 + Math.random() * 0.45).toFixed(3);
        PARAMS.waveFreq = +(0.12 + Math.random() * 0.35).toFixed(3);
        PARAMS.waveDistFactor = +(0.25 + Math.random() * 0.65).toFixed(3);
        PARAMS.waveZHeight = +(0.04 + Math.random() * 0.28).toFixed(3);
        PARAMS.twist = +(Math.random() > 0.4 ? (Math.random() * 1.8 - 0.9) : 0.0).toFixed(3);
        PARAMS.pointSizeBase = +(18.0 + Math.random() * 22.0).toFixed(1);
        PARAMS.pointSizeWave = +(6.0 + Math.random() * 16.0).toFixed(1);
        PARAMS.shading3D = +(Math.random() * 0.8).toFixed(2);

        // 3. Re-roll motion parameters
        PARAMS.animationMode = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
        PARAMS.animationSpeed = +(0.6 + Math.random() * 0.9).toFixed(2);

        // 4. Re-roll lighting accents
        PARAMS.exposure = +(0.85 + Math.random() * 0.45).toFixed(2);
        PARAMS.masterLightIntensity = +(0.8 + Math.random() * 0.5).toFixed(2);
        PARAMS.rgbShift = +(0.002 + Math.random() * 0.007).toFixed(4);

        this.syncUniforms();
        this.updateGuiDisplay();
      }

      updateAnimation(dt) {
        if (!PARAMS.paused) {
          this.animPhase += dt * PARAMS.animationSpeed;
        }

        const t = this.animPhase;

        switch (PARAMS.animationMode) {
          case 'Static (No Movement)':
            this.animDistOffset = 0.0;
            this.animThetaOffset = 0.0;
            this.animPhiOffset = 0.0;
            break;

          case 'Gentle Orbit (Slow 360°)':
            this.animDistOffset = 0.0;
            this.animThetaOffset = t * 0.25;
            this.animPhiOffset = 0.0;
            break;

          case 'Pulsing Float & Tilt':
            this.animDistOffset = Math.sin(t * 0.6) * 0.12;
            this.animThetaOffset = t * 0.15;
            this.animPhiOffset = Math.sin(t * 0.45) * 0.22;
            break;

          case 'Breathing Dolly Drift':
            this.animDistOffset = Math.sin(t * 0.5) * 0.28;
            this.animThetaOffset = Math.sin(t * 0.25) * 0.18;
            this.animPhiOffset = 0.0;
            break;

          case 'Low Horizon Sweep':
            this.animDistOffset = -0.15;
            this.animThetaOffset = t * 0.2;
            this.animPhiOffset = 0.55 + Math.sin(t * 0.3) * 0.15; // Grazing edge angle
            break;

          case 'Spiral Helix Orbit':
            this.animDistOffset = Math.cos(t * 0.4) * 0.18;
            this.animThetaOffset = t * 0.35;
            this.animPhiOffset = Math.sin(t * 0.35) * 0.35;
            break;

          case 'Pendulum Arc Swing':
            this.animDistOffset = 0.0;
            this.animThetaOffset = Math.sin(t * 0.5) * 0.65;
            this.animPhiOffset = Math.cos(t * 0.5) * 0.15;
            break;

          case 'Cosmic Drift & Roll':
            this.animDistOffset = Math.sin(t * 0.4) * 0.2;
            this.animThetaOffset = t * 0.18 + Math.cos(t * 0.3) * 0.2;
            this.animPhiOffset = Math.sin(t * 0.35) * 0.25;
            break;
        }

        this.updateCameraPosition();
      }

      setupGui() {
        this.gui = new GUI({ title: 'Scene Settings' });

        // Procedural generator trigger
        this.gui.add(PARAMS, 'clickRandomize').name('Click Scene to Randomize');
        this.gui.add(this, 'randomizeScene').name('🎲 Randomize Scene Now');

        // Color Schemes & Background
        const fColors = this.gui.addFolder('Colors & Themes');
        fColors.add(PARAMS, 'colorScheme', Object.keys(COLOR_SCHEMES))
          .name('Color Scheme (19)')
          .onChange((v) => this.applyColorScheme(v));

        fColors.add(PARAMS, 'greenScreen')
          .name('Green Screen (#00ff00)')
          .onChange((v) => {
            if (v) {
              savedBgColor = PARAMS.backgroundColor;
              PARAMS.backgroundColor = '#00ff00';
            } else {
              PARAMS.backgroundColor = savedBgColor || '#000000';
            }
            this.updateBackgroundColor();
            this.updateGuiDisplay();
          });

        fColors.addColor(PARAMS, 'backgroundColor')
          .name('Background Color')
          .onChange((v) => {
            PARAMS.greenScreen = (v.toLowerCase() === '#00ff00');
            savedBgColor = v;
            this.updateBackgroundColor();
            this.updateGuiDisplay();
          });

        const fPalette = fColors.addFolder('Palette Colors (Editable)');
        fPalette.addColor(PARAMS, 'c1').name('Color 1').onChange(() => this.syncUniforms());
        fPalette.addColor(PARAMS, 'c2').name('Color 2').onChange(() => this.syncUniforms());
        fPalette.addColor(PARAMS, 'c3').name('Color 3').onChange(() => this.syncUniforms());
        fPalette.addColor(PARAMS, 'c4').name('Color 4').onChange(() => this.syncUniforms());
        fPalette.addColor(PARAMS, 'c5').name('Color 5').onChange(() => this.syncUniforms());
        fPalette.add(PARAMS, 'colorCycle', 0.2, 5.0, 0.1).name('Color Cycle Freq').onChange(() => this.syncUniforms());
        fPalette.add(PARAMS, 'colorOffset', 0.0, 1.0, 0.01).name('Color Flow Offset').onChange(() => this.syncUniforms());

        // Camera & Drag Interaction
        const fCam = this.gui.addFolder('Camera & View');
        this.ctrlDist = fCam.add(PARAMS, 'camDistance', 0.2, 6.0, 0.01).name('Distance / Zoom').onChange(() => this.updateCameraPosition());
        this.ctrlTheta = fCam.add(PARAMS, 'camTheta', -Math.PI * 2, Math.PI * 2, 0.01).name('Camera Azimuth (Theta)').onChange(() => this.updateCameraPosition());
        this.ctrlPhi = fCam.add(PARAMS, 'camPhi', 0.05, Math.PI - 0.05, 0.01).name('Camera Elevation (Phi)').onChange(() => this.updateCameraPosition());
        this.ctrlPanX = fCam.add(PARAMS, 'panX', -3.0, 3.0, 0.01).name('Pan X (Right / Shift Drag)').onChange(() => this.syncUniforms());
        this.ctrlPanY = fCam.add(PARAMS, 'panY', -3.0, 3.0, 0.01).name('Pan Y (Right / Shift Drag)').onChange(() => this.syncUniforms());
        fCam.add(PARAMS, 'fov', 20, 100, 1).name('Field of View').onChange(() => {
          this.camera.fov = PARAMS.fov;
          this.camera.updateProjectionMatrix();
        });
        fCam.add({ reset: () => this.resetCamera() }, 'reset').name('Reset Camera & Pan');

        // Animation Settings
        const fAnim = this.gui.addFolder('Animation');
        fAnim.add(PARAMS, 'animationMode', ANIMATION_MODES).name('Animation Mode (8)');
        fAnim.add(PARAMS, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
        fAnim.add(PARAMS, 'paused').name('Pause Motion');

        // Geometric Wave Parameters
        const fGeom = this.gui.addFolder('Geometric Wave');
        fGeom.add(PARAMS, 'waveDelta', 0.01, 0.5, 0.005).name('Wave Edge Sharpness').onChange(() => this.syncUniforms());
        fGeom.add(PARAMS, 'waveAmp', 0.0, 0.8, 0.01).name('Wave Scale Amplitude').onChange(() => this.syncUniforms());
        fGeom.add(PARAMS, 'waveFreq', 0.05, 1.0, 0.01).name('Wave Frequency').onChange(() => this.syncUniforms());
        fGeom.add(PARAMS, 'waveDistFactor', 0.1, 1.5, 0.01).name('Wave Spread Rate').onChange(() => this.syncUniforms());
        fGeom.add(PARAMS, 'waveZHeight', 0.0, 0.5, 0.01).name('3D Ripple Height (Z)').onChange(() => this.syncUniforms());
        fGeom.add(PARAMS, 'twist', -2.0, 2.0, 0.02).name('Spiral Twist').onChange(() => this.syncUniforms());
        fGeom.add(PARAMS, 'pointSizeBase', 6.0, 50.0, 0.5).name('Point Size Base').onChange(() => this.syncUniforms());
        fGeom.add(PARAMS, 'pointSizeWave', 0.0, 30.0, 0.5).name('Point Pulse Size').onChange(() => this.syncUniforms());
        fGeom.add(PARAMS, 'sizeAttenuation').name('Perspective Size Atten').onChange(() => this.syncUniforms());

        // Lighting & Exposure
        const fLight = this.gui.addFolder('Lighting & Exposure');
        fLight.add(PARAMS, 'exposure', 0.1, 3.0, 0.02).name('Scene Exposure').onChange(() => this.syncUniforms());
        fLight.add(PARAMS, 'masterLightIntensity', 0.0, 3.0, 0.02).name('Master Light Intensity').onChange(() => this.syncUniforms());
        fLight.add(PARAMS, 'shading3D', 0.0, 1.0, 0.02).name('3D Shading Spheres').onChange(() => this.syncUniforms());

        const fL1 = fLight.addFolder('Key Light (Directional)');
        fL1.addColor(PARAMS, 'light1Color').name('Color').onChange(() => this.syncUniforms());
        fL1.add(PARAMS, 'light1Intensity', 0.0, 3.0, 0.05).name('Intensity').onChange(() => this.syncUniforms());
        fL1.add(PARAMS, 'light1PosX', -300, 300, 10).name('Pos X').onChange(() => this.syncUniforms());
        fL1.add(PARAMS, 'light1PosY', -300, 300, 10).name('Pos Y').onChange(() => this.syncUniforms());
        fL1.add(PARAMS, 'light1PosZ', -300, 300, 10).name('Pos Z').onChange(() => this.syncUniforms());

        const fL2 = fLight.addFolder('Fill / Spot Light');
        fL2.addColor(PARAMS, 'light2Color').name('Color').onChange(() => this.syncUniforms());
        fL2.add(PARAMS, 'light2Intensity', 0.0, 3.0, 0.05).name('Intensity').onChange(() => this.syncUniforms());
        fL2.add(PARAMS, 'light2PosX', -300, 300, 10).name('Pos X').onChange(() => this.syncUniforms());
        fL2.add(PARAMS, 'light2PosY', -300, 300, 10).name('Pos Y').onChange(() => this.syncUniforms());
        fL2.add(PARAMS, 'light2PosZ', -300, 300, 10).name('Pos Z').onChange(() => this.syncUniforms());

        const fAmb = fLight.addFolder('Ambient Light');
        fAmb.addColor(PARAMS, 'ambientColor').name('Color').onChange(() => this.syncUniforms());
        fAmb.add(PARAMS, 'ambientIntensity', 0.0, 2.5, 0.05).name('Intensity').onChange(() => this.syncUniforms());

        // Post-Processing & Rendering Quality
        const fQuality = this.gui.addFolder('Rendering & Antialias');
        fQuality.add(PARAMS, 'antialias').name('Three.js Antialias').onChange((v) => {
          this.initRenderer();
          this.setupEffect();
          this.setupEvents();
        });
        fQuality.add(PARAMS, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange((v) => {
          this.renderer.setPixelRatio(v);
          this.composer.setPixelRatio(v);
          this.onResize();
        });
        fQuality.add(PARAMS, 'postProcessing').name('Enable PostProcessing');
        fQuality.add(PARAMS, 'rgbShift', 0.0, 0.02, 0.0005).name('RGB Shift Aberration').onChange(() => this.syncUniforms());
        fQuality.add(PARAMS, 'blending', ['Normal', 'Additive']).name('Blending Mode').onChange(() => this.syncUniforms());

        this.gui.close();
      }

      updateGuiDisplay() {
        if (this.gui) {
          this.gui.controllersRecursive().forEach((c) => c.updateDisplay());
        }
      }

      resetCamera() {
        PARAMS.camDistance = 1.35;
        PARAMS.camTheta = 0.0;
        PARAMS.camPhi = Math.PI * 0.5;
        PARAMS.panX = 0.0;
        PARAMS.panY = 0.0;
        PARAMS.fov = 70;
        this.target.set(0, 0, 0);
        this.syncUniforms();
        this.updateCameraPosition();
        this.updateGuiDisplay();
      }

      setupEvents() {
        this.pointer = {
          down: false,
          panning: false,
          rotating: false,
          startX: 0,
          startY: 0,
          startTime: 0,
          lastX: 0,
          lastY: 0
        };

        const onPointerDown = (e) => {
          this.pointer.down = true;
          this.pointer.startX = e.clientX;
          this.pointer.startY = e.clientY;
          this.pointer.lastX = e.clientX;
          this.pointer.lastY = e.clientY;
          this.pointer.startTime = performance.now();

          // Right click, middle click, or shift key drags object across screen
          if (e.button === 2 || e.button === 1 || e.shiftKey) {
            this.pointer.panning = true;
            this.pointer.rotating = false;
          } else if (e.button === 0) {
            this.pointer.rotating = true;
            this.pointer.panning = false;
          }

          this.canvas.classList.add('dragging');
        };

        const onPointerMove = (e) => {
          if (!this.pointer.down) return;
          const dx = e.clientX - this.pointer.lastX;
          const dy = e.clientY - this.pointer.lastY;
          this.pointer.lastX = e.clientX;
          this.pointer.lastY = e.clientY;

          if (this.pointer.panning) {
            // Drag object across screen (Pan)
            const fovRad = (PARAMS.fov * Math.PI) / 180;
            const visibleH = 2.0 * Math.max(PARAMS.camDistance, 0.2) * Math.tan(fovRad * 0.5);
            const scale = visibleH / Math.max(window.innerHeight, 1);
            PARAMS.panX += dx * scale;
            PARAMS.panY -= dy * scale;
            this.syncUniforms();
            if (this.ctrlPanX) this.ctrlPanX.updateDisplay();
            if (this.ctrlPanY) this.ctrlPanY.updateDisplay();
          } else if (this.pointer.rotating) {
            // Change camera angle during orbit
            PARAMS.camTheta -= dx * 0.006;
            PARAMS.camPhi = THREE.MathUtils.clamp(PARAMS.camPhi - dy * 0.006, 0.05, Math.PI - 0.05);
            this.updateCameraPosition();
            if (this.ctrlTheta) this.ctrlTheta.updateDisplay();
            if (this.ctrlPhi) this.ctrlPhi.updateDisplay();
          }
        };

        const onPointerUp = (e) => {
          if (!this.pointer.down) return;
          const elapsed = performance.now() - this.pointer.startTime;
          const distMoved = Math.hypot(e.clientX - this.pointer.startX, e.clientY - this.pointer.startY);
          const wasRotating = this.pointer.rotating;

          this.pointer.down = false;
          this.pointer.panning = false;
          this.pointer.rotating = false;
          this.canvas.classList.remove('dragging');

          // Clean click detection on scene (negligible movement & short duration)
          if (wasRotating && distMoved < 6 && elapsed < 320 && e.button === 0 && !e.shiftKey) {
            if (PARAMS.clickRandomize) {
              this.randomizeScene();
            }
          }
        };

        const onWheel = (e) => {
          e.preventDefault();
          // Zoom in/out without returning to predefined animation zoom
          const zoomMultiplier = 1.0 + e.deltaY * 0.001;
          PARAMS.camDistance = THREE.MathUtils.clamp(PARAMS.camDistance * zoomMultiplier, 0.25, 8.0);
          this.updateCameraPosition();
          if (this.ctrlDist) this.ctrlDist.updateDisplay();
        };

        this.canvas.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
        this.canvas.addEventListener('wheel', onWheel, { passive: false });
        this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        window.addEventListener('resize', this.onResize.bind(this));

        // Toggle UI with "H" key
        let isGuiVisible = true;
        window.addEventListener('keydown', (e) => {
          if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
            isGuiVisible = !isGuiVisible;
            if (this.gui) this.gui.show(isGuiVisible);
            if (this.stats && this.stats.domElement) {
              this.stats.domElement.style.display = isGuiVisible ? 'block' : 'none';
            }
          }
        });
      }

      onResize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();

        this.renderer.setSize(this.width, this.height);
        this.composer.setSize(this.width, this.height);
      }

      render() {
        if (this.stats) this.stats.begin();

        const dt = THREE.MathUtils.clamp(this.time.getDelta(), 0.001, 0.1);
        const elapsedTime = this.time.getElapsedTime();

        // Update wave uniform and camera animation
        this.uniforms.uTime.value = elapsedTime * PARAMS.animationSpeed;
        this.updateAnimation(dt);

        // Render via EffectComposer or WebGLRenderer
        if (PARAMS.postProcessing && this.composer) {
          this.composer.render();
        } else {
          this.renderer.render(this.scene, this.camera);
        }

        if (this.stats) this.stats.end();

        requestAnimationFrame(this.render);
      }
    }

    // Initialize application when loaded
    window.addEventListener('load', () => {
      console.clear();
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('loaded');
      }
      new Sketch();
    });
  </script>
</body>
</html>
