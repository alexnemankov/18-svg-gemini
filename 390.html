<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Premium 3D Countdown Overlay &amp; Happy New Year Fireworks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POSTPROCESSOR SUITE (from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0
    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);
      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));
      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);
      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }
      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);
      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }
      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }
      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }
      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      vec3 exposedColor = finalCol * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(rend, toScreen = false) {
        if (!toScreen) rend.setRenderTarget(this.fbo);
        rend.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) rend.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(rend) {
        rend.setRenderTarget(this.fbos[1 - this.currentFBO]);
        rend.render(this.orthoScene, this.orthoCamera);
        rend.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 1.2, radius = 0.6, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, bloomThreshold: { value: this.threshold } },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, direction: { value: new THREE.Vector2(0, 1) } },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType }));
        }
      }
      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }
      set source(texture) { this.brightShader.uniforms.inputTexture.value = texture; }
      render(rend) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(rend);
        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;
        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);
          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(rend);
          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(rend);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, customParams = {}) {
        this.renderer = renderer;
        this.settings = {
          enabled: customParams.enabled !== undefined ? customParams.enabled : true,
          antialias: customParams.antialias !== undefined ? customParams.antialias : true,
          bloomEnabled: customParams.bloomEnabled !== undefined ? customParams.bloomEnabled : true,
          bloomStrength: customParams.bloomStrength !== undefined ? customParams.bloomStrength : 1.25,
          bloomRadius: customParams.bloomRadius !== undefined ? customParams.bloomRadius : 0.65,
          bloomThreshold: customParams.bloomThreshold !== undefined ? customParams.bloomThreshold : 0.2,
          raysEnabled: customParams.raysEnabled !== undefined ? customParams.raysEnabled : false,
          raysStrength: customParams.raysStrength !== undefined ? customParams.raysStrength : 0.6,
          raysDensity: 1.0,
          raysMaxDensity: 0.5,
          raysDistanceAttenuation: 2.0,
          raysThreshold: 0.15,
          raysColor: new THREE.Color(0xf6aa1c),
          raysColorHex: '#f6aa1c',
          // Anamorphic default is explicitly OFF as requested
          anamorphicEnabled: customParams.anamorphicEnabled !== undefined ? customParams.anamorphicEnabled : false,
          anamorphicIntensity: 5.0,
          anamorphicThreshold: 0.3,
          anamorphicSamples: 64,
          anamorphicRadius: 0.0,
          anamorphicSmoothWidth: 0.05,
          anamorphicColor: new THREE.Color(0x7a8aff),
          anamorphicColorHex: '#7a8aff',
          fisheyeStrength: 0.0,
          fisheyeRadius: 1.0,
          chromaticAberration: customParams.chromaticAberration !== undefined ? customParams.chromaticAberration : 0.012,
          vignetteBoost: customParams.vignetteBoost !== undefined ? customParams.vignetteBoost : 1.1,
          vignetteReduction: customParams.vignetteReduction !== undefined ? customParams.vignetteReduction : 0.65,
          noiseIntensity: customParams.noiseIntensity !== undefined ? customParams.noiseIntensity : 0.015,
          gamma: 1.0,
          minInputLevel: 0.0,
          maxInputLevel: 1.0,
          exposure: customParams.exposure !== undefined ? customParams.exposure : 1.15,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });

        this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);
        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.raysThreshold } },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(null);
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskPass.render(this.renderer);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);
          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightPass.render(this.renderer);
          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurPass.render(this.renderer);
          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(guiInstance, title = "Post-Processing Suite") {
        const root = guiInstance.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const anamorphic = root.addFolder("Anamorphic Lens Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });
        anamorphic.close();

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "chromaticAberration", 0, 0.15, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.08, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.close();

        return root;
      }
    }

    // --- PROCEDURAL STUDIO ENVIRONMENT MAP ---
    function createStudioEnvironment(rend) {
      const pmremGenerator = new THREE.PMREMGenerator(rend);
      pmremGenerator.compileEquirectangularShader();

      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#1c202a');
      grad.addColorStop(0.5, '#0b0d12');
      grad.addColorStop(1, '#050608');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 512);

      function drawLight(x, y, rx, ry, colInner, colOuter) {
        const radGrad = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
        radGrad.addColorStop(0, colInner);
        radGrad.addColorStop(0.5, colInner);
        radGrad.addColorStop(1, colOuter);
        ctx.fillStyle = radGrad;
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawLight(250, 180, 160, 100, 'rgba(255, 250, 235, 1)', 'rgba(255, 230, 190, 0)');
      drawLight(760, 170, 180, 110, 'rgba(230, 245, 255, 0.9)', 'rgba(160, 210, 255, 0)');
      drawLight(512, 60, 350, 45, 'rgba(255, 255, 255, 0.85)', 'rgba(255, 255, 255, 0)');
      drawLight(512, 430, 450, 70, 'rgba(120, 140, 180, 0.25)', 'rgba(0, 0, 0, 0)');

      const texture = new THREE.CanvasTexture(canvas);
      texture.mapping = THREE.EquirectangularReflectionMapping;
      const envMap = pmremGenerator.fromEquirectangular(texture).texture;
      pmremGenerator.dispose();
      texture.dispose();
      return envMap;
    }

    let studioEnvMap = createStudioEnvironment(renderer);

    // --- BACKGROUND PLANE ---
    let bgTexture = null;
    const bgGeo = new THREE.PlaneGeometry(45, 32);

    bgMesh.position.z = -9;

    function updateBackground() {
      if (params.greenscreen) {
        scene.background = new THREE.Color(0x00ff00);
        bgMesh.visible = false;
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        scene.background = null;
        bgMesh.visible = true;
        const currentPal = colorPalettes[params.colorScheme] || colorPalettes["Original (Gold & Crystal)"];
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 340);
        grad.addColorStop(0, currentPal.bgLight);
        grad.addColorStop(1, currentPal.bgDark);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 512);

        if (bgTexture) bgTexture.dispose();
        bgTexture = new THREE.CanvasTexture(canvas);
        bgMesh.material.map = bgTexture;
        bgMesh.material.needsUpdate = true;
        renderer.setClearColor(new THREE.Color(currentPal.bgDark), 1.0);
      }
    }

    line2.forEach(item => totalWidth += item.w);

    let penX = -totalWidth / 2;
    line2.forEach(item => {
      if (item.c !== ' ') {
        const shape = getLetterShape(item.c);
        const geo = new THREE.ExtrudeGeometry(shape, textExtrudeSettings);
        geo.center();
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, goldCelebrationMaterial);
        mesh.position.x = penX + item.w / 2;
        newYearGroup.add(mesh);
      }
      penX += item.w;
    });
    // Set line 2 comfortably below line 1 (-1.15) -> Generous 0.8 unit gap!
    newYearGroup.position.y = -1.15;

    // =========================================================================
    // VIBRANT 3D FIREWORKS SYSTEM (HIGH-INTENSITY GLOWING PARTICLES & ROCKETS)

    const FIREWORK_COLORS = [
      0xffd700, // 24K Brilliant Gold
      0xff1744, // Vivid Crimson Red
      0x00f0ff, // Electric Cyan
      0x00e676, // Emerald Green
      0xff9100, // Neon Orange

      0xffffff, // Diamond White
      0xff2a85, // Radiant Hot Pink

    ];

    // Procedural glowing radial spark texture for soft additive bloom halos
    function createFireworkGlowTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      g.addColorStop(0.18, 'rgba(255, 255, 255, 0.95)');
      g.addColorStop(0.45, 'rgba(255, 240, 200, 0.6)');
      g.addColorStop(0.75, 'rgba(255, 180, 60, 0.18)');
      g.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      const tex = new THREE.CanvasTexture(c);
      tex.generateMipmaps = false;
      tex.minFilter = THREE.LinearFilter;
      return tex;
    }
    const fwGlowTexture = createFireworkGlowTexture();

    // 2500 high-performance glowing spark particles
    const MAX_FIREWORK_SPARKS = 2500;
    const fwPositions = new Float32Array(MAX_FIREWORK_SPARKS * 3);
    const fwColors = new Float32Array(MAX_FIREWORK_SPARKS * 3);

    for (let i = 0; i < MAX_FIREWORK_SPARKS; i++) {
      fwPositions[i * 3 + 0] = 0;
      fwPositions[i * 3 + 1] = -999;
      fwPositions[i * 3 + 2] = 0;
      fwColors[i * 3 + 0] = 0;
      fwColors[i * 3 + 1] = 0;
      fwColors[i * 3 + 2] = 0;
    }

    const fwPointsGeo = new THREE.BufferGeometry();
    fwPointsGeo.setAttribute('position', new THREE.BufferAttribute(fwPositions, 3));
    fwPointsGeo.setAttribute('color', new THREE.BufferAttribute(fwColors, 3));

    const fwPointsMat = new THREE.PointsMaterial({
      size: 0.52,
      map: fwGlowTexture,

      transparent: true,
      blending: THREE.AdditiveBlending,

    });
    const fwPointsMesh = new THREE.Points(fwPointsGeo, fwPointsMat);
    fwPointsMesh.frustumCulled = false;
    scene.add(fwPointsMesh);

    const fwDummy = new THREE.Object3D();
    const fwSparks = [];

      fwSparks.push({

      });

    // Ascending rockets
    const activeRockets = [];

    const rocketGeo = new THREE.SphereGeometry(0.24, 12, 12);
    const rocketMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,

    });
    const rocketMesh = new THREE.InstancedMesh(rocketGeo, rocketMat, MAX_ROCKETS);
    rocketMesh.frustumCulled = false;

    function launchRocket(customX = null, customTargetY = null, customColor = null) {
      const rx = (customX !== null) ? customX : (Math.random() - 0.5) * 11.0;
      const rz = (Math.random() - 0.5) * 2.5;
      const targetY = (customTargetY !== null) ? customTargetY : (1.6 + Math.random() * 3.4);
      const color = customColor || FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];

      activeRockets.push({
        pos: new THREE.Vector3(rx, -5.5, rz),
        vel: new THREE.Vector3((Math.random() - 0.5) * 1.8, 12.0 + Math.random() * 4.0, (Math.random() - 0.5) * 1.5),
        targetY: targetY,
        color: color,
        life: 0
      });
    }

    function detonateFirework(origin, color, count = 130, burstType = 0) {
      let allocated = 0;
      const colorObj = new THREE.Color(color);
      const secondaryColor = new THREE.Color(FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)]);

      for (let i = 0; i < MAX_FIREWORK_SPARKS && allocated < count; i++) {
        const s = fwSparks[i];
        if (!s.active) {
          s.active = true;
          s.pos.copy(origin);
          s.life = 0;

          if (burstType === 1) {
            // Willow / Golden Waterfall: High gravity, long life, slower initial blast
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 2 - 1);
            const spd = 3.0 + Math.random() * 4.5;
            s.vel.set(
              Math.sin(phi) * Math.cos(theta) * spd,
              Math.sin(phi) * Math.sin(theta) * spd + 1.5,
              Math.cos(phi) * spd
            );
            s.maxLife = 1.8 + Math.random() * 0.8;
            s.gravity = 5.2;
            s.drag = 0.982;
            s.baseColor.copy(colorObj);
          } else if (burstType === 2) {
            // Ring Burst: Cylindrical ring tilted in 3D
            const theta = Math.random() * Math.PI * 2;
            const spd = 5.5 + Math.random() * 2.0;
            const tilt = 0.4;
            s.vel.set(
              Math.cos(theta) * spd,
              Math.sin(theta) * spd * Math.cos(tilt) + 0.8,
              Math.sin(theta) * spd * Math.sin(tilt)
            );
            s.maxLife = 1.3 + Math.random() * 0.5;
            s.gravity = 3.6;
            s.drag = 0.972;
            s.baseColor.copy(colorObj);
          } else if (burstType === 3) {
            // Two-tone burst: inner core one color, outer shell another color
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 2 - 1);
            const isCore = Math.random() < 0.35;
            const spd = isCore ? (2.5 + Math.random() * 3.0) : (6.0 + Math.random() * 4.0);
            s.vel.set(
              Math.sin(phi) * Math.cos(theta) * spd,
              Math.sin(phi) * Math.sin(theta) * spd + 1.2,
              Math.cos(phi) * spd
            );
            s.maxLife = 1.4 + Math.random() * 0.6;
            s.gravity = 3.8;
            s.drag = 0.974;
            s.baseColor.copy(isCore ? secondaryColor : colorObj);
          } else {
            // Classic Spherical Starburst Peony
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 2 - 1);
            const spd = 5.0 + Math.random() * 6.5;
            s.vel.set(
              Math.sin(phi) * Math.cos(theta) * spd,
              Math.sin(phi) * Math.sin(theta) * spd + 1.2,
              Math.cos(phi) * spd
            );
            s.maxLife = 1.4 + Math.random() * 0.6;
            s.gravity = 3.8;
            s.drag = 0.974;
            s.baseColor.copy(colorObj);
          }

          allocated++;
        }
      }

      // Real-time colored flash illuminating the 3D scene
      fireworksLight.position.copy(origin);
      fireworksLight.color.set(color);
      fireworksLight.intensity = 35.0 * params.masterLight;
    }

    // --- CONCENTRIC CHRONOGRAPH GYRO RINGS ---
    const ringsAssembly = new THREE.Group();
    scene.add(ringsAssembly);

    const ring1Group = new THREE.Group();
    const ring1Geo = new THREE.TorusGeometry(2.95, 0.035, 16, 90);

    // --- INSTANCED MICRO-BURST CONFETTI SYSTEM ---
    const confettiCount = 350;
    const dummyObj = new THREE.Object3D();
    const confettiGeo = new THREE.OctahedronGeometry(0.09, 0);
    const confettiMat = new THREE.MeshPhysicalMaterial({
      metalness: 0.92,

    const confettiMesh = new THREE.InstancedMesh(confettiGeo, confettiMat, confettiCount);

    confettiMesh.instanceColor = new THREE.InstancedBufferAttribute(confettiInitColors, 3);

    function triggerConfettiBurst(count = 160, power = 1.0) {
      if (!params.confettiBursts) return;
      const curPalette = colorPalettes[params.colorScheme] || colorPalettes["Original (Gold & Crystal)"];
      const colors = curPalette.particles;
      let triggered = 0;

      for (let i = 0; i < confettiCount && triggered < count; i++) {
        const p = particles[i];
        if (!p.active) {
          p.active = true;
          p.pos.set((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5);
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(Math.random() * 2 - 1);
          const spd = (3.5 + Math.random() * 5.5) * power;

          p.vel.set(
            Math.sin(phi) * Math.cos(theta) * spd,
            Math.sin(phi) * Math.sin(theta) * spd + 1.2,
            Math.cos(phi) * spd
          );
          p.rot.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          p.rotVel.set((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16);
          p.scale = (0.7 + Math.random() * 0.7) * power;
          p.life = 0;
          p.maxLife = 1.2 + Math.random() * 0.8;

          const col = new THREE.Color(colors[Math.floor(Math.random() * colors.length)]);
          confettiMesh.setColorAt(i, col);
          triggered++;
        }
      }
      if (confettiMesh.instanceColor) confettiMesh.instanceColor.needsUpdate = true;
    }

    // --- TRANSITION ANIMATIONS FOR DIGITS ---
    function applyTransition(mesh, subProg, style) {
      if (style === "Kinetic Fall & Bounce") {
        if (subProg < 0.28) {
          const t = subProg / 0.28;
          const s = 1.70158;
          const t1 = t - 1;
          const easeOut = (t1 * t1 * ((s + 1) * t1 + s) + 1);
          mesh.position.y = (1 - easeOut) * 3.8;
          mesh.position.z = 0;
          mesh.scale.setScalar(0.75 + easeOut * 0.25);
          mesh.rotation.x = (1 - t) * -0.6;
          mesh.rotation.y = 0;
        } else if (subProg < 0.78) {
          const t = (subProg - 0.28) / 0.50;
          mesh.position.y = Math.sin(t * Math.PI) * 0.08;
          mesh.position.z = 0;
          mesh.scale.setScalar(1.0 + Math.sin(t * Math.PI) * 0.04);
          mesh.rotation.x = 0;
          mesh.rotation.y = Math.sin(t * Math.PI * 2) * 0.12;
        } else {
          const t = (subProg - 0.78) / 0.22;
          mesh.position.y = -t * t * 3.2;
          mesh.position.z = t * 1.5;
          mesh.scale.setScalar(1.0 - t * 0.2);
          mesh.rotation.x = t * 0.4;
          mesh.rotation.y = 0;
        }
      } else if (style === "Explosive Burst") {
        if (subProg < 0.25) {
          const t = subProg / 0.25;
          mesh.position.y = 0;
          mesh.position.z = (1 - t) * 4.0;
          mesh.scale.setScalar(t * 1.05);
          mesh.rotation.set((1 - t) * 1.2, (1 - t) * 2.0, 0);
        } else if (subProg < 0.8) {
          const t = (subProg - 0.25) / 0.55;
          mesh.position.set(0, Math.sin(t * Math.PI) * 0.05, 0);
          mesh.scale.setScalar(1.0 + Math.sin(t * Math.PI) * 0.06);
          mesh.rotation.set(0, Math.sin(t * Math.PI) * 0.15, 0);
        } else {
          const t = (subProg - 0.8) / 0.2;
          mesh.position.z = -t * 3.0;
          mesh.scale.setScalar(1.0 + t * 0.6);
          mesh.rotation.set(0, 0, t * 0.3);
        }
      } else if (style === "Diamond Spin & Snap") {
        if (subProg < 0.3) {
          const t = subProg / 0.3;
          const spin = (1 - t) * Math.PI * 2;
          mesh.position.set(0, 0, 0);
          mesh.scale.setScalar(t);
          mesh.rotation.set(0, spin, 0);
        } else if (subProg < 0.75) {
          const t = (subProg - 0.3) / 0.45;
          mesh.position.set(0, Math.sin(t * Math.PI) * 0.06, 0);
          mesh.scale.setScalar(1.0);
          mesh.rotation.set(0, Math.sin(t * Math.PI * 2) * 0.15, 0);
        } else {
          const t = (subProg - 0.75) / 0.25;
          mesh.scale.setScalar(1.0 - t);
          mesh.rotation.set(0, t * Math.PI * 2, 0);
        }
      } else {
        const t = subProg;
        mesh.position.y = Math.sin(t * Math.PI) * 0.14;
        mesh.position.z = 0;
        mesh.scale.setScalar(0.92 + Math.sin(t * Math.PI) * 0.12);
        mesh.rotation.set(Math.sin(t * Math.PI) * 0.06, Math.sin(t * Math.PI * 2) * 0.1, 0);
      }
    }

    // --- APPLY COLOR SCHEME ---
    function applyColorScheme(schemeName) {
      const pal = colorPalettes[schemeName];
      if (!pal) return;
      params.colorScheme = schemeName;
      params.primaryColor = pal.primary;
      params.accentColor = pal.accent;
      params.flashColor = pal.flash;
      params.flashLightColor = pal.flash;

      updateMaterialProperties();
      updateBackground();

      beadMat.color.set(pal.accent);
      sectorMarkers.forEach(m => m.material.color.set(pal.accent));
    }

    // --- 8 PRECONFIGURED CAMERA ANIMATIONS ---
    function updateCameraMotion(time) {
      const mode = params.cameraAnimation;
      const target = controls.target;

      if (mode === "Static (No Camera Motion)") {
        // Handled purely by controls
      } else if (mode === "Slow Cinematic Orbit") {
        const ang = time * 0.25;
        const radius = 8.5;
        camera.position.x = target.x + Math.sin(ang) * radius;
        camera.position.y = target.y + Math.sin(time * 0.35) * 0.75;
        camera.position.z = target.z + Math.cos(ang) * radius;
        camera.lookAt(target);
      } else if (mode === "Gentle Floating Swell") {
        camera.position.x = target.x + Math.sin(time * 0.4) * 1.5;
        camera.position.y = target.y + Math.cos(time * 0.5) * 1.2;
        camera.position.z = target.z + 8.5 + Math.sin(time * 0.3) * 0.8;
        camera.lookAt(target);
      } else if (mode === "Subtle Horizon Drift") {
        const pan = Math.sin(time * 0.3) * 2.8;
        camera.position.x = target.x + pan;
        camera.position.y = target.y + Math.cos(time * 0.4) * 0.4;
        camera.position.z = target.z + 8.5;
        camera.lookAt(target.x, target.y, target.z);
      } else if (mode === "Soft Breathing Dolly") {
        const dist = 8.5 + Math.sin(time * 0.45) * 2.2;
        camera.position.x = target.x + Math.sin(time * 0.2) * 0.5;
        camera.position.y = target.y + Math.cos(time * 0.25) * 0.4;
        camera.position.z = target.z + dist;
        camera.lookAt(target);
      } else if (mode === "Elegance Spiral Glide") {
        const ang = time * 0.3;
        const radius = 8.2;
        const elev = Math.sin(time * 0.25) * 2.2;
        camera.position.x = target.x + Math.sin(ang) * radius;
        camera.position.y = target.y + elev;
        camera.position.z = target.z + Math.cos(ang) * radius;
        camera.lookAt(target.x, target.y + elev * 0.2, target.z);
      } else if (mode === "Dynamic Low-Angle Sweep") {
        const ang = time * 0.28;
        const radius = 8.0;
        camera.position.x = target.x + Math.sin(ang) * radius;
        camera.position.y = target.y - 2.2 + Math.sin(time * 0.35) * 0.6;
        camera.position.z = target.z + Math.cos(ang) * radius;
        camera.lookAt(target.x, target.y + 0.5, target.z);
      } else if (mode === "Minimal Parallax Sway") {
        camera.position.x = target.x + Math.sin(time * 0.45) * 2.2;
        camera.position.y = target.y + Math.cos(time * 0.35) * 0.8;
        camera.position.z = target.z + 8.2 + Math.sin(time * 0.5) * 1.0;
        camera.lookAt(target);
      }
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZER (NEVER TOUCHES POSTPROCESSING SETTINGS)
    // =========================================================================
    function randomizeScene() {
      // 1. Random Palette from the 21 presets
      const palKeys = Object.keys(colorPalettes);
      const chosenPalette = palKeys[Math.floor(Math.random() * palKeys.length)];
      params.colorScheme = chosenPalette;
      applyColorScheme(chosenPalette);

      // 2. Random Material Style
      const styles = ["Faceted Glass", "Polished Gold", "Faceted Gold", "Frosted Crystal", "Obsidian Glass", "Titanium Chrome"];
      const chosenStyle = styles[Math.floor(Math.random() * styles.length)];
      params.materialStyle = chosenStyle;
      applyMaterialPreset(chosenStyle);

      // 3. Random Camera Animation
      const anims = [
        "Static (No Camera Motion)",
        "Slow Cinematic Orbit",
        "Gentle Floating Swell",
        "Subtle Horizon Drift",
        "Soft Breathing Dolly",
        "Elegance Spiral Glide",
        "Dynamic Low-Angle Sweep",
        "Minimal Parallax Sway"
      ];
      params.cameraAnimation = anims[Math.floor(Math.random() * anims.length)];

      // 4. Random Transition
      const transStyles = ["Kinetic Fall & Bounce", "Explosive Burst", "Diamond Spin & Snap", "Smooth Hypnotic Float"];
      params.transitionStyle = transStyles[Math.floor(Math.random() * transStyles.length)];

      // 5. Random Lighting (Post-processing settings are strictly preserved)
      params.keyIntensity = +(1.8 + Math.random() * 1.6).toFixed(2);
      params.rimIntensity = +(2.4 + Math.random() * 2.5).toFixed(2);
      updateLights();

      // 6. Flash & Confetti Burst
      flashTimer = 1.0;
      triggerConfettiBurst(220, 1.4);

      // 7. Update non-postprocessing GUI controllers
      updateSceneGuiDisplays();
    }

    // --- RECREATE RENDERER FOR ANTIALIAS SWITCH ---
    function rebuildRenderer() {
      const oldDom = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      container.replaceChild(renderer.domElement, oldDom);
      controls.domElement = renderer.domElement;
      controls.update();

      postProcessor.renderer = renderer;
      postProcessor.setAntialias(params.antialias);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

      if (studioEnvMap) studioEnvMap.dispose();
      studioEnvMap = createStudioEnvironment(renderer);
      scene.environment = studioEnvMap;

      setupInteractionEvents();
    }

    // --- POINTER INTERACTION & DRAG MODES ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    function setupInteractionEvents() {
      const dom = renderer.domElement;
      dom.addEventListener('pointerdown', (e) => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = performance.now();
      });

      dom.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const time = performance.now() - pointerDownTime;
        if (dist < 7 && time < 350 && params.clickRandomize) {
          randomizeScene();
        }
      });
    }
    setupInteractionEvents();

    function updateDragMode() {
      if (params.dragMode === "Drag Object (Left Click)") {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.PAN,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.ROTATE
        };
      } else {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.ROTATE,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN
        };
      }
    }
    updateDragMode();

    // =========================================================================
    // LIL-GUI INITIALIZATION
    // =========================================================================
    const gui = new GUI({ title: "3D Countdown & Celebration" });

    // 1. Countdown & Celebration Folder
    const fCountdown = gui.addFolder("Countdown & Celebration");
    fCountdown.add(params, "speed", 0.2, 3.0, 0.05).name("Countdown Speed");
    fCountdown.add(params, "celebrationDuration", 5.0, 30.0, 1.0).name("Celebration Time (s)");
    fCountdown.add(params, "transitionStyle", [
      "Kinetic Fall & Bounce",
      "Explosive Burst",
      "Diamond Spin & Snap",
      "Smooth Hypnotic Float"
    ]).name("Transition Style");
    fCountdown.add(params, "showRings").name("Show Dial Rings").onChange(v => ringsAssembly.visible = v);
    fCountdown.add(params, "confettiBursts").name("Confetti Bursts");
    fCountdown.add({ triggerCelebration: () => startCelebration() }, "triggerCelebration").name("Trigger Happy New Year!");

    // 2. Visual Theme & Colors Folder
    const fColors = gui.addFolder("Theme & Colors");
    fColors.add(params, "colorScheme", Object.keys(colorPalettes)).name("Color Palette").onChange(applyColorScheme);
    fColors.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(updateBackground);
    fColors.addColor(params, "primaryColor").name("Primary Color").onChange(updateMaterialProperties);
    fColors.addColor(params, "accentColor").name("Accent Color").onChange(updateMaterialProperties);
    fColors.addColor(params, "flashColor").name("Flash Light Color").onChange(v => {
      params.flashLightColor = v;
      flashLight.color.set(v);
    });

    // 3. Material Optics Folder
    const fMaterial = gui.addFolder("Faceted Optics & Material");
    fMaterial.add(params, "materialStyle", [
      "Faceted Glass",
      "Polished Gold",
      "Faceted Gold",
      "Frosted Crystal",
      "Obsidian Glass",
      "Titanium Chrome"
    ]).name("Material Preset").onChange(applyMaterialPreset);
    fMaterial.add(params, "transmission", 0.0, 1.0, 0.01).name("Transmission").onChange(updateMaterialProperties);
    fMaterial.add(params, "roughness", 0.0, 1.0, 0.01).name("Roughness").onChange(updateMaterialProperties);
    fMaterial.add(params, "metalness", 0.0, 1.0, 0.01).name("Metalness").onChange(updateMaterialProperties);
    fMaterial.add(params, "ior", 1.0, 2.5, 0.02).name("IOR").onChange(updateMaterialProperties);
    fMaterial.add(params, "clearcoat", 0.0, 1.0, 0.01).name("Clearcoat").onChange(updateMaterialProperties);
    fMaterial.add(params, "flatShading").name("Faceted Shading").onChange(updateMaterialProperties);

    // 4. Camera & Navigation Folder
    const fCamera = gui.addFolder("Camera & Navigation");
    fCamera.add(params, "cameraAnimation", [
      "Static (No Camera Motion)",
      "Slow Cinematic Orbit",
      "Gentle Floating Swell",
      "Subtle Horizon Drift",
      "Soft Breathing Dolly",
      "Elegance Spiral Glide",
      "Dynamic Low-Angle Sweep",
      "Minimal Parallax Sway"
    ]).name("Camera Motion");
    fCamera.add(params, "dragMode", ["Orbit (Right Click to Pan)", "Drag Object (Left Click)"]).name("Mouse Drag Action").onChange(updateDragMode);
    fCamera.add({ reset: () => {
      controls.target.set(0, 0, 0);
      camera.position.set(0, 0, 8.5);
      controls.update();
    }}, "reset").name("Reset Position");

    // 5. Lighting & Exposure Folder
    const fLighting = gui.addFolder("Lighting & Exposure");
    fLighting.add(params, "exposure", 0.1, 3.0, 0.05).name("Scene Exposure").onChange(v => {
      renderer.toneMappingExposure = v;
      postProcessor.settings.exposure = v;
      postProcessor.updateSettings();
    });
    fLighting.add(params, "masterLight", 0.1, 3.0, 0.05).name("Master Light Level").onChange(updateLights);

    const fKey = fLighting.addFolder("Key Light");
    fKey.add(params, "keyIntensity", 0.0, 6.0, 0.1).name("Intensity").onChange(updateLights);
    fKey.addColor(params, "keyColor").name("Color").onChange(updateLights);
    fKey.add(params, "keyPosX", -10, 10, 0.5).name("Position X").onChange(updateLights);
    fKey.add(params, "keyPosY", -10, 10, 0.5).name("Position Y").onChange(updateLights);
    fKey.add(params, "keyPosZ", -10, 10, 0.5).name("Position Z").onChange(updateLights);
    fKey.close();

    const fRim = fLighting.addFolder("Rim Light");
    fRim.add(params, "rimIntensity", 0.0, 8.0, 0.1).name("Intensity").onChange(updateLights);
    fRim.addColor(params, "rimColor").name("Color").onChange(updateLights);
    fRim.add(params, "rimPosX", -10, 10, 0.5).name("Position X").onChange(updateLights);
    fRim.add(params, "rimPosY", -10, 10, 0.5).name("Position Y").onChange(updateLights);
    fRim.add(params, "rimPosZ", -10, 10, 0.5).name("Position Z").onChange(updateLights);
    fRim.close();

    const fFill = fLighting.addFolder("Fill Light");
    fFill.add(params, "fillIntensity", 0.0, 4.0, 0.1).name("Intensity").onChange(updateLights);
    fFill.addColor(params, "fillColor").name("Color").onChange(updateLights);
    fFill.close();

    const fFlash = fLighting.addFolder("Flash Burst Light");
    fFlash.add(params, "flashPeakIntensity", 0.0, 30.0, 0.5).name("Peak Intensity");
    fFlash.addColor(params, "flashLightColor").name("Burst Color").onChange(v => flashLight.color.set(v));
    fFlash.close();

    const fAmbient = fLighting.addFolder("Ambient Light");
    fAmbient.add(params, "ambientIntensity", 0.0, 2.0, 0.05).name("Intensity").onChange(updateLights);
    fAmbient.addColor(params, "ambientColor").name("Color").onChange(updateLights);
    fAmbient.close();

    // 6. Post-Processor Suite Folder
    postProcessor.attachGUI(gui, "Post-Processing Suite");

    // 7. System Settings Folder
    const fSystem = gui.addFolder("System & Interaction");
    fSystem.add(params, "antialias").name("Antialias (Scene)").onChange(rebuildRenderer);
    fSystem.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fSystem.add(params, "clickRandomize").name("Click Scene to Randomize");
    fSystem.add({ randomize: randomizeScene }, "randomize").name("Randomize Scene Now");

    function updateSceneGuiDisplays() {
      // Updates only the scene folders without touching the Post-Processing Suite
      [fCountdown, fColors, fMaterial, fCamera, fLighting, fSystem].forEach(folder => {
        if (folder.controllers) folder.controllers.forEach(c => c.updateDisplay());
        if (folder.folders) folder.folders.forEach(sub => {
          if (sub.controllers) sub.controllers.forEach(c => c.updateDisplay());
        });
      });
    }

    // --- HIDE/SHOW UI WITH "H" KEY ---
    let uiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        uiVisible = !uiVisible;
        if (uiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    // =========================================================================
    // STATE MACHINE: COUNTDOWN & 15-SECOND "HAPPY NEW YEAR!" FIREWORKS
    // =========================================================================
    let currentPhase = 'COUNTDOWN'; // 'COUNTDOWN' | 'CELEBRATION'
    let countdownClock = 0;
    let celebrationTimer = 0;
    let lastSecondInt = -1;
    let flashTimer = 0;
    let fireworkSpawnTimer = 0;

    function startCelebration() {
      currentPhase = 'CELEBRATION';
      celebrationTimer = 0;
      fireworkSpawnTimer = 0;

      // Hide countdown numbers, show Happy New Year text
      numbersGroup.visible = false;
      celebrationGroup.visible = true;
      celebrationGroup.position.set(0, 0, 0);
      celebrationGroup.rotation.set(0, 0, 0);
      celebrationGroup.scale.set(0.01, 0.01, 0.01);

      // Mega celebratory burst
      flashTimer = 1.0;
      triggerConfettiBurst(320, 1.8);

      // Instantly detonate 5 massive fireworks spread across the sky!
      detonateFirework(new THREE.Vector3(-4.5, 2.8, 0.5), 0xff1744, 150, 0); // Vivid Crimson (left)
      detonateFirework(new THREE.Vector3(0.0, 4.2, -0.5), 0xffd700, 160, 1);  // 24K Gold Willow (center-top)
      detonateFirework(new THREE.Vector3(4.5, 3.0, 0.5), 0x00f0ff, 150, 0);  // Electric Cyan (right)
      detonateFirework(new THREE.Vector3(-2.2, 4.0, 0.2), 0x00e676, 140, 2); // Emerald Green (top-left)
      detonateFirework(new THREE.Vector3(2.2, 3.8, 0.2), 0xd500f9, 140, 3);  // Royal Violet (top-right)

      // Launch 4 rising rockets right away
      launchRocket(-3.5, 3.2, 0xff9100);
      launchRocket(-1.2, 4.5, 0xffffff);
      launchRocket(1.2, 4.2, 0xff2a85);
      launchRocket(3.5, 3.5, 0xffff00);
    }

    function resetToCountdown() {
      currentPhase = 'COUNTDOWN';
      countdownClock = 0;
      lastSecondInt = -1;
      celebrationGroup.visible = false;
      celebrationGroup.position.set(0, 0, 0);
      celebrationGroup.rotation.set(0, 0, 0);
      celebrationGroup.scale.set(0.01, 0.01, 0.01);
      numbersGroup.visible = true;
      flashTimer = 1.0;
      triggerConfettiBurst(160, 1.0);
    }

    // =========================================================================
    // MAIN ANIMATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const totalTime = clock.getElapsedTime();

      if (currentPhase === 'COUNTDOWN') {
        // --- COUNTDOWN LOGIC (10 down to 1) ---
        countdownClock += delta * params.speed;
        const currentSecondInt = Math.floor(countdownClock);
        const subSecondProgress = countdownClock - currentSecondInt;

        // Rings scale smoothly back to standard countdown radius (1.0)
        ringsAssembly.scale.lerp(new THREE.Vector3(1.0, 1.0, 1.0), delta * 5.0);

        if (currentSecondInt >= 10) {
          // Reached the end: Trigger 15-second Happy New Year celebration!
          startCelebration();
        } else {
          const currentNumber = 10 - currentSecondInt;

          // Trigger per-second flash and confetti
          if (currentSecondInt !== lastSecondInt) {
            lastSecondInt = currentSecondInt;
            flashTimer = 1.0;
            const burstCount = (currentNumber === 1) ? 280 : 160;
            const burstPower = (currentNumber === 1) ? 1.5 : 1.0;
            triggerConfettiBurst(burstCount, burstPower);
          }

          // Update number visibility and kinetic entrance/exit
          for (let n = 1; n <= 10; n++) {
            const mesh = digitMeshes[n];
            if (n === currentNumber) {
              mesh.visible = true;
              applyTransition(mesh, subSecondProgress, params.transitionStyle);
            } else {
              mesh.visible = false;
            }
          }

          // Chronograph dials animation
          if (params.showRings) {
            ring1Group.rotation.z -= delta * 0.25;
            ring2Group.rotation.z += delta * 0.45;
            sweepGroup.rotation.z = -subSecondProgress * Math.PI * 2;

            for (let i = 0; i < 10; i++) {
              const marker = sectorMarkers[i];
              if (i < (10 - currentNumber)) {
                marker.scale.set(0.6, 0.6, 0.6);
                marker.material.opacity = 0.35;
              } else if (i === (10 - currentNumber)) {
                const pulse = 1.0 + Math.sin(subSecondProgress * Math.PI) * 0.4;
                marker.scale.set(pulse * 1.3, pulse * 1.3, pulse * 1.3);
                marker.material.opacity = 1.0;
              } else {
                marker.scale.set(1.0, 1.0, 1.0);
                marker.material.opacity = 0.85;
              }
            }
          }
        }
      } else if (currentPhase === 'CELEBRATION') {
        // --- 15-SECOND "HAPPY NEW YEAR!" & FIREWORKS CELEBRATION ---
        celebrationTimer += delta;

        // Smoothly expand the chronograph rings outward (scale ~1.48) so they frame the text gracefully!
        ringsAssembly.scale.lerp(new THREE.Vector3(1.48, 1.48, 1.48), delta * 4.0);
        if (params.showRings) {
          ring1Group.rotation.z -= delta * 0.4;
          ring2Group.rotation.z += delta * 0.6;
          sweepGroup.rotation.z += delta * 2.5;
          for (let i = 0; i < 10; i++) {
            sectorMarkers[i].scale.setScalar(1.2 + Math.sin(totalTime * 4.0 + i) * 0.3);
            sectorMarkers[i].material.opacity = 1.0;
          }
        }

        // Entrance scale and floating animation for "HAPPY NEW YEAR!" (Continuous C1 transition without any jump/shift)
        const baseScale = 0.85;
        if (celebrationTimer < 1.0) {
          const t = Math.min(1.0, celebrationTimer / 1.0);
          const s = 1.70158;
          const t1 = t - 1;
          const easeOut = (t1 * t1 * ((s + 1) * t1 + s) + 1);
          celebrationGroup.scale.setScalar(Math.max(0.01, easeOut * baseScale));
          celebrationGroup.position.set(0, 0, 0);
          celebrationGroup.rotation.set(0, (1.0 - t) * 0.35, 0);
        } else if (celebrationTimer < params.celebrationDuration - 1.0) {
          // Floating specular breathing in center - smooth continuous blend from t=1.0s
          const idleTime = celebrationTimer - 1.0;
          const blend = Math.min(1.0, idleTime / 1.2);
          const smoothBlend = 0.5 - 0.5 * Math.cos(blend * Math.PI);
          celebrationGroup.scale.setScalar(baseScale + Math.sin(idleTime * 2.0) * 0.02 * smoothBlend);
          celebrationGroup.position.set(
            0,
            Math.sin(idleTime * 1.5) * 0.07 * smoothBlend,
            0
          );
          celebrationGroup.rotation.set(
            Math.sin(idleTime * 0.8) * 0.02 * smoothBlend,
            Math.sin(idleTime * 1.0) * 0.04 * smoothBlend,
            0
          );
        } else {
          // Final dissolve/scale exit
          const t = (celebrationTimer - (params.celebrationDuration - 1.0)) / 1.0;
          const exitFactor = Math.max(0.001, 1.0 - t);
          celebrationGroup.scale.setScalar(baseScale * exitFactor);
          celebrationGroup.position.y *= exitFactor;
          celebrationGroup.rotation.y *= exitFactor;
          celebrationGroup.rotation.x *= exitFactor;
        }

        // Continuous launch of fireworks throughout the entire 15 seconds!
        fireworkSpawnTimer += delta;
        const isFinale = celebrationTimer > params.celebrationDuration - 4.5;
        const spawnInterval = isFinale ? 0.16 : 0.32; // Grand finale frenzy!
        if (fireworkSpawnTimer >= spawnInterval) {
          fireworkSpawnTimer = 0;
          launchRocket();
          if (isFinale) {
            launchRocket(); // Extra rockets during grand finale!
            if (Math.random() < 0.45) {
              // Occasional instant mid-air burst during finale
              const rx = (Math.random() - 0.5) * 10.0;
              const ry = 1.8 + Math.random() * 3.0;
              const rCol = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
              detonateFirework(new THREE.Vector3(rx, ry, (Math.random() - 0.5) * 2.0), rCol, 130, Math.floor(Math.random() * 4));
            }
          }
        }

        // End of 15 seconds: Run scene again!
        if (celebrationTimer >= params.celebrationDuration) {
          resetToCountdown();
        }
      }

      // --- FLASH DECAY ---
      if (flashTimer > 0) {
        flashTimer = Math.max(0, flashTimer - delta * 3.6);
        flashLight.intensity = Math.pow(flashTimer, 2.0) * params.flashPeakIntensity * params.masterLight;
      } else {
        flashLight.intensity = 0;
      }

      if (fireworksLight.intensity > 0) {
        fireworksLight.intensity = Math.max(0, fireworksLight.intensity - delta * 18.0);
      }

      // --- UPDATE ASCENDING FIREWORK ROCKETS & DETONATE ---
      let rocketMeshIdx = 0;
      for (let i = activeRockets.length - 1; i >= 0; i--) {
        const r = activeRockets[i];
        r.life += delta;
        r.pos.addScaledVector(r.vel, delta);
        r.vel.y -= 5.0 * delta;

        // Render visible ascending rocket head
        if (rocketMeshIdx < MAX_ROCKETS) {
          fwDummy.position.copy(r.pos);
          fwDummy.scale.set(1.0, 1.0, 1.0);
          fwDummy.updateMatrix();
          rocketMesh.setMatrixAt(rocketMeshIdx, fwDummy.matrix);
          rocketMesh.setColorAt(rocketMeshIdx, new THREE.Color(r.color));
          rocketMeshIdx++;
        }

        // Leave trailing fiery sparks behind the rising rocket
        for (let k = 0; k < MAX_FIREWORK_SPARKS; k++) {
          const sp = fwSparks[k];
          if (!sp.active) {
            sp.active = true;
            sp.pos.copy(r.pos);
            sp.vel.set((Math.random() - 0.5) * 0.8, -2.0 - Math.random() * 2.0, (Math.random() - 0.5) * 0.8);
            sp.baseColor.set(0xffa500); // Glowing fiery exhaust
            sp.life = 0;
            sp.maxLife = 0.35 + Math.random() * 0.25;
            sp.gravity = 2.0;
            sp.drag = 0.96;
            break;
          }
        }

        // Detonate at apex height or when velocity drops
        if (r.pos.y >= r.targetY || r.vel.y <= 0.8 || r.life > 1.25) {
          const bType = Math.floor(Math.random() * 4);
          detonateFirework(r.pos, r.color, 140, bType);
          activeRockets.splice(i, 1);
        }
      }

      // Hide unused rocket instances
      for (let j = rocketMeshIdx; j < MAX_ROCKETS; j++) {
        fwDummy.position.set(0, -999, 0);
        fwDummy.scale.set(0, 0, 0);
        fwDummy.updateMatrix();
        rocketMesh.setMatrixAt(j, fwDummy.matrix);
      }
      rocketMesh.instanceMatrix.needsUpdate = true;
      if (rocketMesh.instanceColor) rocketMesh.instanceColor.needsUpdate = true;

      // --- UPDATE FIREWORK SPARK PARTICLES (LUMINOUS WITH GRAVITY & TWINKLE) ---
      for (let i = 0; i < MAX_FIREWORK_SPARKS; i++) {
        const s = fwSparks[i];
        if (s.active) {
          s.life += delta;
          if (s.life >= s.maxLife) {
            s.active = false;
            fwPositions[i * 3 + 1] = -999;
            fwColors[i * 3 + 0] = 0;
            fwColors[i * 3 + 1] = 0;
            fwColors[i * 3 + 2] = 0;
          } else {
            s.vel.y -= s.gravity * delta; // Dynamic gravity
            s.vel.multiplyScalar(s.drag); // Air drag
            s.pos.addScaledVector(s.vel, delta);

            const lifeNorm = s.life / s.maxLife;
            // Shimmering twinkle modulation + exponential decay
            const fade = Math.pow(Math.max(0, 1.0 - lifeNorm), 1.2);
            const twinkle = 0.8 + Math.sin(s.life * 32.0 + i * 2.1) * 0.25;
            const intensity = fade * twinkle * 2.2; // HDR multiplier for glorious bloom

            fwPositions[i * 3 + 0] = s.pos.x;
            fwPositions[i * 3 + 1] = s.pos.y;
            fwPositions[i * 3 + 2] = s.pos.z;

            fwColors[i * 3 + 0] = s.baseColor.r * intensity;
            fwColors[i * 3 + 1] = s.baseColor.g * intensity;
            fwColors[i * 3 + 2] = s.baseColor.b * intensity;
            continue;
          }
        } else {
          fwPositions[i * 3 + 1] = -999;
          fwColors[i * 3 + 0] = 0;
          fwColors[i * 3 + 1] = 0;
          fwColors[i * 3 + 2] = 0;
        }
      }
      fwPointsGeo.attributes.position.needsUpdate = true;
      fwPointsGeo.attributes.color.needsUpdate = true;

      // --- UPDATE CONFETTI PARTICLES ---
      for (let i = 0; i < confettiCount; i++) {
        const p = particles[i];
        if (p.active) {
          p.life += delta;
          if (p.life >= p.maxLife) {
            p.active = false;
            p.scale = 0;
          } else {
            p.vel.y -= 7.0 * delta;
            p.vel.multiplyScalar(0.978);
            p.pos.addScaledVector(p.vel, delta);
            p.rot.x += p.rotVel.x * delta;
            p.rot.y += p.rotVel.y * delta;
            p.rot.z += p.rotVel.z * delta;

            const lifeRatio = p.life / p.maxLife;
            const currentScale = (lifeRatio > 0.65) ? p.scale * (1.0 - (lifeRatio - 0.65) / 0.35) : p.scale;

            dummyObj.position.copy(p.pos);
            dummyObj.rotation.copy(p.rot);
            dummyObj.scale.set(currentScale, currentScale, currentScale);
            dummyObj.updateMatrix();
            confettiMesh.setMatrixAt(i, dummyObj.matrix);
            continue;
          }
        }
        dummyObj.position.set(0, -999, 0);
        dummyObj.scale.set(0, 0, 0);
        dummyObj.updateMatrix();
        confettiMesh.setMatrixAt(i, dummyObj.matrix);
      }
      confettiMesh.instanceMatrix.needsUpdate = true;

      // --- CAMERA MOTION & CONTROLS ---
      updateCameraMotion(totalTime);
      controls.update();

      // --- RENDER SCENE THROUGH POSTPROCESSOR ---
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
