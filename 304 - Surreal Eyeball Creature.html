<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surreal Eyeball Creature - Wandering & Dilation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #13e60a;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      transition: background-color 0.25s ease;
    }
    body.dragging {
      cursor: grabbing;
    }
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="stage">
    <svg id="eyeballSvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Sclera 3D Sphere Shading -->
        <radialGradient id="scleraGrad" cx="44%" cy="38%" r="65%">
          <stop offset="0%" id="scleraStop0" stop-color="#ffffff" />
          <stop offset="50%" id="scleraStop1" stop-color="#e2ebf5" />
          <stop offset="78%" id="scleraStop2" stop-color="#9eb3c9" />
          <stop offset="100%" id="scleraStop3" stop-color="#556b82" />
        </radialGradient>

        <!-- Horn Blades Gradient -->
        <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" id="hornStop0" stop-color="#2c4259" />
          <stop offset="50%" id="hornStop1" stop-color="#192a3b" />
          <stop offset="100%" id="hornStop2" stop-color="#0e1824" />
        </linearGradient>

        <!-- Horn Edge Highlight Gradient -->
        <linearGradient id="hornHighlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3d5a7a" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#142130" stop-opacity="0.1" />
        </linearGradient>

        <!-- Iris Color Gradient -->
        <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" id="irisStop0" stop-color="#4ea3df" />
          <stop offset="35%" id="irisStop1" stop-color="#2a74b3" />
          <stop offset="72%" id="irisStop2" stop-color="#163654" />
          <stop offset="100%" id="irisStop3" stop-color="#0a1a2e" />
        </radialGradient>

        <!-- Pupil Abyss Gradient -->
        <radialGradient id="pupilGrad" cx="45%" cy="40%" r="60%">
          <stop offset="0%" id="pupilStop0" stop-color="#14141c" />
          <stop offset="70%" id="pupilStop1" stop-color="#030508" />
          <stop offset="100%" id="pupilStop2" stop-color="#000000" />
        </radialGradient>

        <!-- Fleshy Collar Gradient -->
        <linearGradient id="fleshGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" id="fleshStop0" stop-color="#991c36" />
          <stop offset="50%" id="fleshStop1" stop-color="#721427" />
          <stop offset="100%" id="fleshStop2" stop-color="#420814" />
        </linearGradient>

        <!-- Main Optic Nerve / Stalk Gradient -->
        <linearGradient id="stalkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" id="stalkStop0" stop-color="#73152a" />
          <stop offset="28%" id="stalkStop1" stop-color="#541a2e" />
          <stop offset="52%" id="stalkStop2" stop-color="#293d52" />
          <stop offset="80%" id="stalkStop3" stop-color="#1d2d3d" />
          <stop offset="100%" id="stalkStop4" stop-color="#131e29" />
        </linearGradient>

        <!-- Blood Puddle Outer Gradient -->
        <radialGradient id="puddleGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" id="puddleStop0" stop-color="#4d091a" />
          <stop offset="65%" id="puddleStop1" stop-color="#340612" />
          <stop offset="100%" id="puddleStop2" stop-color="#1f030a" />
        </radialGradient>

        <!-- Corneal Wet Specular Reflection Gradient -->
        <linearGradient id="corneaHighlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
          <stop offset="45%" stop-color="#ffffff" stop-opacity="0.38" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
        </linearGradient>

        <!-- Sclera Horizon Clip to contain Iris and Pupil -->
        <clipPath id="scleraClip">
          <circle cx="500" cy="400" r="172" />
        </clipPath>

        <!-- Soft Glow Filter for Veins and Fleshy Edges -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.2" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Ambient Shadow Filter -->
        <filter id="groundShadowBlur" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
          <feOffset dx="0" dy="10" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.6" />
          </feComponentTransfer>
          <feMerge>
            <feMergeNode />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Viewport Group for Smooth Pan and Zoom -->
      <g id="viewportGroup" transform="translate(0, 0) scale(1)">
        
        <!-- Ground Suspension System (Wide Ground Shadow & Blood Puddle) -->
        <g id="groundSystem">
          <!-- Outer Cast Ground Shadow (Dark Green Ellipse on Green Floor) -->
          <ellipse id="groundShadow" cx="500" cy="940" rx="245" ry="38" fill="#116b17" opacity="0.92" />
          
          <!-- Blood Puddle / Pool Nested on Ground -->
          <g id="bloodPuddleGroup">
            <!-- Main Blood Puddle Oval -->
            <ellipse id="bloodPuddleOuter" cx="498" cy="946" rx="76" ry="16" fill="url(#puddleGrad)" />
            <!-- Deep Abyss Core of Puddle -->
            <ellipse id="bloodPuddleInner" cx="498" cy="946" rx="50" ry="10" fill="#20030c" />
            <!-- Wet Surface Specular Sheen -->
            <ellipse cx="482" cy="943" rx="22" ry="4" fill="#6b1429" opacity="0.68" />
          </g>
        </g>

        <!-- Eyeball Motion Rig (GSAP floats, rotates, and saccades applied here) -->
        <g id="eyeballRig">

          <!-- 7 Dark Horn/Blade Spikes Radiating from Behind the Eyeball -->
          <g id="hornSpikes" fill="url(#hornGrad)" stroke="#0e1824" stroke-width="1.5">
            <!-- Horn 1: Top (~12 o'clock, slightly angled) -->
            <g id="horn0">
              <path d="M 464 235 C 472 170, 484 105, 495 45 C 508 105, 526 170, 536 235 Z" />
              <path d="M 495 45 C 502 110, 508 180, 510 234" stroke="url(#hornHighlightGrad)" stroke-width="2" fill="none" />
            </g>

            <!-- Horn 2: Top-Right (~1:30, ~40° above horizontal) -->
            <g id="horn1">
              <path d="M 598 258 C 640 215, 688 180, 742 155 C 712 215, 680 265, 642 305 Z" />
              <path d="M 742 155 C 695 210, 650 260, 620 282" stroke="url(#hornHighlightGrad)" stroke-width="2" fill="none" />
            </g>

            <!-- Horn 3: Middle-Right (~3 o'clock, ~5° horizontal fin) -->
            <g id="horn2">
              <path d="M 665 372 C 725 375, 785 385, 842 396 C 785 412, 725 422, 665 428 Z" />
              <path d="M 842 396 C 780 396, 720 398, 665 400" stroke="url(#hornHighlightGrad)" stroke-width="2" fill="none" />
            </g>

            <!-- Horn 4: Bottom-Right (~4:30, ~42° below horizontal) -->
            <g id="horn3">
              <path d="M 632 492 C 672 538, 705 588, 735 640 C 695 615, 650 580, 602 546 Z" />
              <path d="M 735 640 C 685 588, 640 545, 617 519" stroke="url(#hornHighlightGrad)" stroke-width="2" fill="none" />
            </g>

            <!-- Horn 5: Bottom-Left (~7:30, ~42° below horizontal left) -->
            <g id="horn4">
              <path d="M 398 546 C 350 580, 305 615, 265 640 C 295 588, 328 538, 368 492 Z" />
              <path d="M 265 640 C 315 588, 360 545, 383 519" stroke="url(#hornHighlightGrad)" stroke-width="2" fill="none" />
            </g>

            <!-- Horn 6: Middle-Left (~9 o'clock, ~5° horizontal fin) -->
            <g id="horn5">
              <path d="M 335 428 C 275 422, 215 412, 158 396 C 215 385, 275 375, 335 372 Z" />
              <path d="M 158 396 C 220 396, 280 398, 335 400" stroke="url(#hornHighlightGrad)" stroke-width="2" fill="none" />
            </g>

            <!-- Horn 7: Top-Left (~10:30, ~40° above horizontal left) -->
            <g id="horn6">
              <path d="M 358 305 C 320 265, 288 215, 258 155 C 312 180, 360 215, 402 258 Z" />
              <path d="M 258 155 C 305 210, 350 260, 380 282" stroke="url(#hornHighlightGrad)" stroke-width="2" fill="none" />
            </g>
          </g>

          <!-- Optic Nerve Stalk & Wrapping Tendrils (Behind Sclera, reaches down to ground puddle) -->
          <g id="stalkSystem">
            <!-- Central Muscular Stalk Trunk -->
            <path id="stalkTrunk" d="M 466 595 C 460 670, 462 760, 472 855 C 478 870, 488 880, 498 880 C 508 880, 520 870, 526 855 C 538 760, 542 670, 536 595 Z" fill="url(#stalkGrad)" />

            <!-- Vertical Muscle / Fiber Striations along Trunk -->
            <g id="stalkStriations" fill="none" opacity="0.8">
              <path d="M 474 610 Q 470 730 482 855" stroke="#141f2b" stroke-width="2.5" />
              <path d="M 486 605 Q 482 725 492 865" stroke="#36506d" stroke-width="1.8" />
              <path d="M 498 600 Q 500 730 502 875" stroke="#78182c" stroke-width="2.4" />
              <path d="M 512 605 Q 516 725 510 865" stroke="#36506d" stroke-width="1.8" />
              <path d="M 524 610 Q 528 730 520 855" stroke="#141f2b" stroke-width="2.5" />
            </g>

            <!-- Severed Bottom Cut Fleshy Drips -->
            <path id="stalkBottomCut" d="M 472 855 L 478 872 L 485 860 L 494 882 L 502 865 L 512 878 L 520 860 L 526 855 Z" fill="#521021" />

            <!-- Tendrils Wrapping Around Stalk & Free Dangling Strands (GSAP secondary sway) -->
            <g id="tendrilWraps" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <!-- Looping wrap across upper stalk -->
              <path id="wrap0" d="M 452 630 C 455 665, 478 695, 510 705 C 535 712, 546 695, 552 715" stroke="#8c152d" stroke-width="2.2" />
              <!-- Diagonal loop across mid stalk -->
              <path id="wrap1" d="M 460 725 C 475 750, 515 740, 532 765 C 542 780, 538 805, 534 825" stroke="#a31835" stroke-width="2.0" />
              <!-- Lower looping wrap -->
              <path id="wrap2" d="M 466 785 C 485 815, 518 805, 530 832" stroke="#8c152d" stroke-width="1.8" />

              <!-- Left Dangling Strand A (Reaches down with droplet) -->
              <path id="dangleStrand0" d="M 444 615 C 438 680, 442 760, 446 840 C 447 865, 448 885, 448 900" stroke="#8c152d" stroke-width="2.4" />
              <!-- Left Dangling Strand B (Longest strand near puddle) -->
              <path id="dangleStrand1" d="M 458 640 C 452 710, 458 790, 462 870 C 463 895, 465 915, 466 928" stroke="#a31835" stroke-width="2.2" />
              <!-- Right Dangling Strand A (Mid height droplet) -->
              <path id="dangleStrand2" d="M 552 625 C 560 665, 556 710, 552 748" stroke="#8c152d" stroke-width="2.2" />
              <!-- Right Dangling Strand B (Reaches down right) -->
              <path id="dangleStrand3" d="M 536 765 C 544 815, 540 855, 536 885" stroke="#a31835" stroke-width="2.0" />
              <!-- Center dripping strand -->
              <path id="dangleStrand4" d="M 502 880 Q 502 910 502 935" stroke="#8c152d" stroke-width="2.2" />
            </g>

            <!-- Severed Droplet Bulbs / Nodes on Tendril Tips -->
            <g id="tendrilDrops" fill="#8c152d">
              <circle id="drop0" cx="448" cy="900" r="3.4" />
              <circle id="drop1" cx="466" cy="928" r="3.2" />
              <circle id="drop2" cx="552" cy="748" r="3.0" />
              <circle id="drop3" cx="536" cy="885" r="3.2" />
              <circle id="drop4" cx="502" cy="935" r="3.6" />
            </g>
          </g>

          <!-- Sclera (Main Eyeball Sphere) -->
          <circle id="scleraSphere" cx="500" cy="400" r="172" fill="url(#scleraGrad)" stroke="#1a2736" stroke-width="3.2" />

          <!-- Sclera Incision / Segment Seam Lines (Stylized Facets from Reference) -->
          <g id="scleraSeams" stroke="#384f66" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85">
            <!-- Vertical Top Seam -->
            <path d="M 498 228 L 476 335" />
            <!-- Upper-Left Diagonal Seam -->
            <path d="M 395 260 L 438 360" />
            <!-- Horizontal Left Seam -->
            <path d="M 328 400 L 430 400" />
            <!-- Lower-Left Diagonal Seam -->
            <path d="M 378 522 L 452 445" />
            <!-- Vertical Bottom Seam (Down to mini-eye collar) -->
            <path d="M 500 472 L 500 572" />
            <!-- Horizontal Right Seam -->
            <path d="M 570 400 L 672 400" />
            <!-- Upper-Right Diagonal Seam -->
            <path d="M 618 275 L 560 348" />
          </g>

          <!-- Bloodshot Vein Network (Crimson & Slate Blue from Reference) -->
          <g id="veinNetwork" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
            <!-- Upper-Left Crimson Branch -->
            <path class="vein-stem" d="M 432 238 Q 425 270 410 295" stroke="#751329" stroke-width="2.4" />
            <path class="vein-sub" d="M 410 295 Q 380 305 348 318" stroke="#751329" stroke-width="1.6" />
            <path class="vein-cap" d="M 380 305 Q 365 290 340 285" stroke="#991c38" stroke-width="1.0" />
            <path class="vein-sub" d="M 410 295 Q 425 320 435 342" stroke="#751329" stroke-width="1.5" />

            <!-- Left Equatorial Crimson Branch -->
            <path class="vein-stem" d="M 334 380 Q 365 372 390 380" stroke="#751329" stroke-width="2.0" />
            <path class="vein-cap" d="M 365 372 Q 380 350 405 340" stroke="#991c38" stroke-width="1.1" />

            <!-- Lower-Left Crimson Branch -->
            <path class="vein-stem" d="M 425 540 Q 415 500 395 480" stroke="#751329" stroke-width="2.2" />
            <path class="vein-sub" d="M 395 480 Q 368 475 342 485" stroke="#751329" stroke-width="1.5" />
            <path class="vein-cap" d="M 395 480 Q 410 455 425 435" stroke="#991c38" stroke-width="1.0" />

            <!-- Upper-Right Crimson Branch -->
            <path class="vein-stem" d="M 565 248 Q 575 285 590 310" stroke="#751329" stroke-width="2.2" />
            <path class="vein-sub" d="M 590 310 Q 618 320 648 310" stroke="#751329" stroke-width="1.6" />
            <path class="vein-cap" d="M 590 310 Q 582 335 595 362" stroke="#991c38" stroke-width="1.1" />

            <!-- Lower-Right Distinct Slate-Blue Branch (Reference Specific Detail) -->
            <path class="vein-blue" d="M 670 415 Q 635 430 610 455 T 575 490" stroke="#405d7d" stroke-width="2.2" />
            <path class="vein-blue-sub" d="M 635 430 Q 645 460 660 480" stroke="#405d7d" stroke-width="1.4" />
            <path class="vein-blue-cap" d="M 610 455 Q 585 465 565 460" stroke="#54779e" stroke-width="1.0" />

            <!-- Lower-Right Crimson Capillaries -->
            <path class="vein-stem" d="M 615 530 Q 638 490 645 450" stroke="#751329" stroke-width="2.0" />
            <path class="vein-cap" d="M 638 490 Q 660 500 668 525" stroke="#991c38" stroke-width="1.0" />
          </g>

          <!-- Clipped Sclera Region containing Moving Iris and Pupil -->
          <g clip-path="url(#scleraClip)">
            
            <!-- Iris Group (Translates along figure-eight & sharp darts) -->
            <g id="irisRig" transform="translate(500, 400)">
              
              <!-- Outer Limbal Ring (Dark crisp border around iris) -->
              <circle id="limbalRing" cx="0" cy="0" r="74" fill="#091421" />

              <!-- Iris Primary Body -->
              <circle id="irisDisc" cx="0" cy="0" r="71" fill="url(#irisGrad)" />

              <!-- Intricate Radial Iris Striae / Needles (Procedural spokes) -->
              <g id="irisSpokes" stroke="#4ea3df" stroke-linecap="round" opacity="0.55"></g>

              <!-- Concentric Woven Furrows & Diamond Striae -->
              <circle cx="0" cy="0" r="56" fill="none" stroke="#68baf0" stroke-width="1.0" stroke-dasharray="2 4" opacity="0.45" />
              <circle cx="0" cy="0" r="45" fill="none" stroke="#12283e" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.6" />
              <circle cx="0" cy="0" r="35" fill="none" stroke="#78c9ff" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4" />
              
              <!-- Pupillary Zone Ring (Inner Collarette) -->
              <circle id="collarette" cx="0" cy="0" r="30" fill="none" stroke="#193754" stroke-width="2.6" opacity="0.75" />

              <!-- Pupil (Expands & Contracts dynamically on saccade) -->
              <g id="pupilRig">
                <circle id="pupilAperture" cx="0" cy="0" r="24" fill="url(#pupilGrad)" />
                <!-- Deep central jet-black core -->
                <circle id="pupilCore" cx="0" cy="0" r="16" fill="#000000" />
              </g>
            </g>
          </g>

          <!-- Wet Corneal Specular Highlights (Positioned OVER iris for 3D depth) -->
          <g id="cornealHighlights" pointer-events="none">
            <!-- Gloss Crescent on Upper-Left of Sclera -->
            <path d="M 408 275 C 428 250, 465 240, 505 250 C 478 270, 442 285, 408 275 Z" fill="url(#corneaHighlightGrad)" />
            
            <!-- Sharp Pinpoint Light Glints -->
            <circle cx="438" cy="270" r="6.0" fill="#ffffff" opacity="0.95" />
            <circle cx="454" cy="262" r="3.0" fill="#ffffff" opacity="0.85" />

            <!-- Secondary Soft Rim Reflection (Lower-Right) -->
            <ellipse cx="585" cy="495" rx="30" ry="12" transform="rotate(-30 585 495)" fill="#ffffff" opacity="0.15" />
          </g>

          <!-- Fleshy Collar at Junction with 6 Staring Mini-Eyes -->
          <g id="miniEyeCollar">
            <!-- Organic Fleshy Socket Pad -->
            <path id="fleshBase" d="M 432 570 C 440 556, 470 550, 500 550 C 530 550, 560 556, 568 570 C 576 588, 566 612, 546 626 C 530 634, 510 630, 500 632 C 490 630, 470 634, 454 626 C 434 612, 424 588, 432 570 Z" fill="url(#fleshGrad)" stroke="#380612" stroke-width="2" />
            
            <!-- Fleshy Crevices & Folds -->
            <g stroke="#380612" stroke-width="1.5" fill="none" stroke-linecap="round">
              <path d="M 445 595 Q 458 608 475 605" />
              <path d="M 525 605 Q 542 608 555 595" />
              <path d="M 488 618 Q 500 622 512 618" />
            </g>

            <!-- 6 Mini-Eyes Embedded in Flesh (React to gaze & saccades) -->
            <g id="miniEyesGroup">
              <!-- Mini-Eye 0 (Far Left) -->
              <g id="miniEye0" transform="translate(448, 574)">
                <ellipse cx="0" cy="0" rx="9.5" ry="6.0" fill="#e4edf5" stroke="#480a18" stroke-width="1.3" transform="rotate(-18)" />
                <g class="mini-pupil-rig">
                  <circle cx="0" cy="0" r="3.2" fill="#142b44" />
                  <circle cx="0" cy="0" r="1.8" fill="#000000" />
                  <circle cx="-0.8" cy="-0.8" r="0.7" fill="#ffffff" opacity="0.8" />
                </g>
              </g>

              <!-- Mini-Eye 1 (Mid Left) -->
              <g id="miniEye1" transform="translate(472, 568)">
                <ellipse cx="0" cy="0" rx="10.5" ry="6.8" fill="#eef4fa" stroke="#480a18" stroke-width="1.3" transform="rotate(-8)" />
                <g class="mini-pupil-rig">
                  <circle cx="0" cy="0" r="3.5" fill="#142b44" />
                  <circle cx="0" cy="0" r="2.0" fill="#000000" />
                  <circle cx="-0.8" cy="-0.8" r="0.8" fill="#ffffff" opacity="0.8" />
                </g>
              </g>

              <!-- Mini-Eye 2 (Mid Right) -->
              <g id="miniEye2" transform="translate(502, 568)">
                <ellipse cx="0" cy="0" rx="10.5" ry="6.8" fill="#eef4fa" stroke="#480a18" stroke-width="1.3" transform="rotate(5)" />
                <g class="mini-pupil-rig">
                  <circle cx="0" cy="0" r="3.5" fill="#142b44" />
                  <circle cx="0" cy="0" r="2.0" fill="#000000" />
                  <circle cx="-0.8" cy="-0.8" r="0.8" fill="#ffffff" opacity="0.8" />
                </g>
              </g>

              <!-- Mini-Eye 3 (Far Right) -->
              <g id="miniEye3" transform="translate(528, 574)">
                <ellipse cx="0" cy="0" rx="9.5" ry="6.0" fill="#e4edf5" stroke="#480a18" stroke-width="1.3" transform="rotate(18)" />
                <g class="mini-pupil-rig">
                  <circle cx="0" cy="0" r="3.2" fill="#142b44" />
                  <circle cx="0" cy="0" r="1.8" fill="#000000" />
                  <circle cx="-0.8" cy="-0.8" r="0.7" fill="#ffffff" opacity="0.8" />
                </g>
              </g>

              <!-- Mini-Eye 4 (Lower Left) -->
              <g id="miniEye4" transform="translate(464, 588)">
                <ellipse cx="0" cy="0" rx="9.0" ry="5.8" fill="#e4edf5" stroke="#480a18" stroke-width="1.3" transform="rotate(-10)" />
                <g class="mini-pupil-rig">
                  <circle cx="0" cy="0" r="3.0" fill="#142b44" />
                  <circle cx="0" cy="0" r="1.6" fill="#000000" />
                  <circle cx="-0.7" cy="-0.7" r="0.6" fill="#ffffff" opacity="0.8" />
                </g>
              </g>

              <!-- Mini-Eye 5 (Lower Right) -->
              <g id="miniEye5" transform="translate(512, 588)">
                <ellipse cx="0" cy="0" rx="9.0" ry="5.8" fill="#e4edf5" stroke="#480a18" stroke-width="1.3" transform="rotate(10)" />
                <g class="mini-pupil-rig">
                  <circle cx="0" cy="0" r="3.0" fill="#142b44" />
                  <circle cx="0" cy="0" r="1.6" fill="#000000" />
                  <circle cx="-0.7" cy="-0.7" r="0.6" fill="#ffffff" opacity="0.8" />
                </g>
              </g>
            </g>
          </g>

        </g>
      </g>
    </svg>
  </div>

  <!-- Module Script with GSAP Animation and lil-gui Controls -->
  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // ==========================================
    // 19 PRECONFIGURED COLOR SCHEMES
    // (First is the Exact Reference Creature)
    // ==========================================
    const PALETTES = {
      'Creature (Reference)': {
        bg: '#13e60a',
        groundShadow: '#116b17',
        puddle: '#3d0716',
        sclera0: '#ffffff',
        sclera1: '#e2ebf5',
        sclera2: '#9eb3c9',
        sclera3: '#556b82',
        horn0: '#2c4259',
        horn1: '#192a3b',
        horn2: '#0e1824',
        seams: '#384f66',
        veins: '#751329',
        veinCap: '#991c38',
        veinBlue: '#405d7d',
        iris0: '#4ea3df',
        iris1: '#2a74b3',
        iris2: '#163654',
        iris3: '#0a1a2e',
        pupil: '#030508',
        flesh: '#721427',
        stalkTop: '#73152a',
        stalkBottom: '#1d2d3d',

    // ==========================================
    // INITIALIZE SVG DETAILS (Intricate Iris Needles)
    // ==========================================
    const irisSpokesGroup = document.getElementById('irisSpokes');
    const totalSpokes = 84;
    for (let i = 0; i < totalSpokes; i++) {
      const angle = (i / totalSpokes) * Math.PI * 2;
      const isLong = (i % 3 === 0);
      const isShort = (i % 2 === 0);
      const rInner = isLong ? 26 : (isShort ? 32 : 36);
      const rOuter = isLong ? 69 : 62;
      const x1 = Math.cos(angle) * rInner;
      const y1 = Math.sin(angle) * rInner;
      const x2 = Math.cos(angle) * rOuter;
      const y2 = Math.sin(angle) * rOuter;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1.toFixed(1));
      line.setAttribute('y1', y1.toFixed(1));
      line.setAttribute('x2', x2.toFixed(1));
      line.setAttribute('y2', y2.toFixed(1));
      line.setAttribute('stroke-width', isLong ? '1.5' : (isShort ? '0.9' : '0.6'));
      line.setAttribute('stroke', isLong ? '#ffffff' : (isShort ? '#5eb8f5' : '#2b6ea6'));
      line.setAttribute('opacity', isLong ? '0.6' : '0.45');
      irisSpokesGroup.appendChild(line);
    }

    // ==========================================
    // THEME & COLOR LOGIC
    // ==========================================
    function applyPalette(palKey) {
      const pal = PALETTES[palKey] || PALETTES['Creature (Reference)'];
      params.bgColor = pal.bg;
      params.groundShadowColor = pal.groundShadow;
      params.puddleColor = pal.puddle;
      params.scleraColor = pal.sclera1;
      params.hornColor = pal.horn0;
      params.irisColor = pal.iris0;
      params.pupilColor = pal.pupil;
      params.veinColor = pal.veins;
      params.fleshColor = pal.flesh;
      params.stalkColor = pal.stalkBottom;
      params.tendrilColor = pal.tendrils;

      updateDOMColors(pal);
    }

    function updateDOMColors(customPal) {
      const body = document.body;
      if (params.greenscreen) {
        body.style.backgroundColor = '#00ff00';
      } else {
        body.style.backgroundColor = params.bgColor;
      }

      // Ground shadow & Puddle
      const groundShadow = document.getElementById('groundShadow');
      if (groundShadow) groundShadow.setAttribute('fill', params.groundShadowColor);
      
      const pStop0 = document.getElementById('puddleStop0');
      const pStop1 = document.getElementById('puddleStop1');
      if (pStop0) pStop0.setAttribute('stop-color', params.puddleColor);
      if (pStop1 && customPal) pStop1.setAttribute('stop-color', customPal.puddle);

      // Sclera stops
      document.getElementById('scleraStop1').setAttribute('stop-color', params.scleraColor);
      if (customPal) {
        document.getElementById('scleraStop0').setAttribute('stop-color', customPal.sclera0);
        document.getElementById('scleraStop2').setAttribute('stop-color', customPal.sclera2);
        document.getElementById('scleraStop3').setAttribute('stop-color', customPal.sclera3);
      }

      // Horns
      const hornStop0 = document.getElementById('hornStop0');
      const hornStop1 = document.getElementById('hornStop1');
      const hornStop2 = document.getElementById('hornStop2');
      if (hornStop0) hornStop0.setAttribute('stop-color', params.hornColor);
      if (customPal) {
        if (hornStop1) hornStop1.setAttribute('stop-color', customPal.horn1 || customPal.horn0);
        if (hornStop2) hornStop2.setAttribute('stop-color', customPal.horn2 || '#000000');
      }

      // Sclera Seam Lines
      const seamLines = document.getElementById('scleraSeams');
      if (seamLines && customPal && customPal.seams) {
        seamLines.setAttribute('stroke', customPal.seams);
      }

      // Iris stops
      document.getElementById('irisStop0').setAttribute('stop-color', params.irisColor);
      if (customPal) {
        document.getElementById('irisStop1').setAttribute('stop-color', customPal.iris1);
        document.getElementById('irisStop2').setAttribute('stop-color', customPal.iris2);
        document.getElementById('irisStop3').setAttribute('stop-color', customPal.iris3);
      }

      // Pupil stop
      document.getElementById('pupilStop1').setAttribute('stop-color', params.pupilColor);

      // Vein elements
      const veinStems = document.querySelectorAll('.vein-stem');
      veinStems.forEach(el => el.setAttribute('stroke', params.veinColor));
      const veinSubs = document.querySelectorAll('.vein-sub');
      veinSubs.forEach(el => el.setAttribute('stroke', params.veinColor));
      const veinCaps = document.querySelectorAll('.vein-cap');
      veinCaps.forEach(el => el.setAttribute('stroke', customPal ? customPal.veinCap : params.veinColor));

      // Slate-blue veins
      const veinBlues = document.querySelectorAll('.vein-blue, .vein-blue-sub');
      veinBlues.forEach(el => el.setAttribute('stroke', customPal && customPal.veinBlue ? customPal.veinBlue : params.veinColor));

      // Flesh Collar & Mini-Eyes
      const fleshStop0 = document.getElementById('fleshStop0');
      const fleshStop1 = document.getElementById('fleshStop1');
      if (fleshStop0) fleshStop0.setAttribute('stop-color', params.fleshColor);
      if (fleshStop1 && customPal) fleshStop1.setAttribute('stop-color', customPal.flesh);

      // Stalk Gradient
      const stalkStop0 = document.getElementById('stalkStop0');
      const stalkStop3 = document.getElementById('stalkStop3');
      if (stalkStop0) stalkStop0.setAttribute('stop-color', customPal ? customPal.stalkTop : params.fleshColor);
      if (stalkStop3) stalkStop3.setAttribute('stop-color', params.stalkColor);

      // Tendril wraps & drops
      const wraps = document.querySelectorAll('#tendrilWraps path');
      wraps.forEach(el => el.setAttribute('stroke', params.tendrilColor));
      const drops = document.querySelectorAll('#tendrilDrops circle');
      drops.forEach(el => el.setAttribute('fill', params.tendrilColor));
    }

    // ==========================================
    // PAN, ZOOM, DRAG INTERACTION
    // ==========================================
    let panX = 0;
    let panY = 0;
    let zoom = 1.0;
    let isDragging = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let dragDist = 0;

    const viewportGroup = document.getElementById('viewportGroup');

    function updateViewportTransform() {
      viewportGroup.setAttribute(
        'transform',
        'translate(' + (panX + 500 * (1 - zoom)) + ', ' + (panY + 400 * (1 - zoom)) + ') scale(' + zoom + ')'
      );
    }

    function resetViewport() {
      gsap.to({ x: panX, y: panY, z: zoom }, {
        x: 0,
        y: 0,
        z: 1.0,
        duration: 0.6,
        ease: 'power3.out',
        onUpdate: function() {
          panX = this.targets()[0].x;
          panY = this.targets()[0].y;
          zoom = this.targets()[0].z;
          params.zoom = zoom;
          updateViewportTransform();
          zoomController.updateDisplay();
        }
      });
    }

    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = Math.exp(-e.deltaY * 0.0018);
      zoom = Math.max(0.3, Math.min(4.5, zoom * zoomFactor));
      params.zoom = zoom;
      updateViewportTransform();
      zoomController.updateDisplay();
    }, { passive: false });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isDragging = true;
      startPointerX = e.clientX - panX;
      startPointerY = e.clientY - panY;
      dragDist = 0;
      document.body.classList.add('dragging');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - (startPointerX + panX);
      const dy = e.clientY - (startPointerY + panY);
      dragDist += Math.hypot(dx, dy);

      panX = e.clientX - startPointerX;
      panY = e.clientY - startPointerY;
      updateViewportTransform();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      document.body.classList.remove('dragging');

      if (dragDist < 6 && !e.target.closest('.lil-gui')) {
        if (params.clickToMutate) {
          mutateScene();
        }
      }
    });

    // ==========================================
    // PROCEDURAL MUTATION (Click to Randomize)
    // ==========================================
    function mutateScene(force = false) {
      const palKeys = Object.keys(PALETTES);
      const randomPal = palKeys[Math.floor(Math.random() * palKeys.length)];
      params.palette = randomPal;
      applyPalette(randomPal);

      if (Math.random() > 0.4 || force) {
        const animIdx = Math.floor(Math.random() * ANIMATION_PRESETS.length);
        params.animation = ANIMATION_PRESETS[animIdx];
      }

      params.speed = Number(gsap.utils.random(0.7, 1.5, 0.05).toFixed(2));
      params.pupilDilation = Number(gsap.utils.random(0.75, 1.4, 0.05).toFixed(2));
      params.dartFrequency = Number(gsap.utils.random(0.6, 1.6, 0.1).toFixed(2));
      params.floatIntensity = Number(gsap.utils.random(0.6, 1.4, 0.1).toFixed(2));
      params.tendrilSway = Number(gsap.utils.random(0.7, 1.5, 0.1).toFixed(2));

      setupAnimationPreset();
      triggerDartSaccade(true);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // ==========================================
    // GSAP ANIMATION RIG & TRACKING SYSTEM
    // ==========================================
    const eyeballRig = document.getElementById('eyeballRig');
    const irisRig = document.getElementById('irisRig');
    const pupilAperture = document.getElementById('pupilAperture');
    const pupilCore = document.getElementById('pupilCore');
    const groundShadow = document.getElementById('groundShadow');
    const miniPupils = document.querySelectorAll('.mini-pupil-rig');

    // Tracking state
    let trackingPhase = 0;
    const dartOffset = { x: 0, y: 0 };
    const pupilState = { scale: 1.0 };
    let nextDartTimer = null;

    // Tendril Base Definitions for Dynamic Sway
    const tendrilBases = [
      { id: 'dangleStrand0', dropId: 'drop0', x0: 444, y0: 615, L: 285, amp: 14, phase: 0 },
      { id: 'dangleStrand1', dropId: 'drop1', x0: 458, y0: 640, L: 288, amp: 18, phase: 1.2 },
      { id: 'dangleStrand2', dropId: 'drop2', x0: 552, y0: 625, L: 123, amp: 11, phase: 2.1 },

    // Main Floating & Sway Timeline
    let mainFloatTl = null;

    function setupAnimationPreset() {
      if (mainFloatTl) {
        mainFloatTl.kill();
      }

      gsap.set(eyeballRig, { x: 0, y: 0, rotation: 0, scale: 1 });
      gsap.set(groundShadow, { scaleX: 1, scaleY: 1, opacity: 0.92 });

      const mode = params.animation;

      if (mode === 'Static / Fixed Gaze') {
        mainFloatTl = gsap.timeline();
      } else if (mode === 'Hypnotic Loom') {
        mainFloatTl = gsap.timeline({ repeat: -1, yoyo: true })
          .to(eyeballRig, {
            scale: 1.06 * params.floatIntensity,
            y: -14 * params.floatIntensity,
            duration: 4.8 / params.speed,
            ease: 'sine.inOut'
          })
          .to(groundShadow, {
            scaleX: 0.92,
            opacity: 0.82,
            duration: 4.8 / params.speed,
            ease: 'sine.inOut'
          }, 0);
      } else if (mode === 'Paranoid Saccades') {
        mainFloatTl = gsap.timeline({ repeat: -1, yoyo: true })
          .to(eyeballRig, {
            y: -8 * params.floatIntensity,
            rotation: 1.2 * params.floatIntensity,
            duration: 1.6 / params.speed,
            ease: 'power1.inOut'
          });
      } else if (mode === 'Deep Dream Drift') {
        mainFloatTl = gsap.timeline({ repeat: -1, yoyo: true })
          .to(eyeballRig, {
            x: 20 * params.floatIntensity,
            y: -20 * params.floatIntensity,
            rotation: 2.8 * params.floatIntensity,
            duration: 7.0 / params.speed,
            ease: 'sine.inOut'
          });
      } else if (mode === 'Tremor & Focus') {
        mainFloatTl = gsap.timeline({ repeat: -1, yoyo: true })
          .to(eyeballRig, {
            y: -10 * params.floatIntensity,
            duration: 2.8 / params.speed,
            ease: 'sine.inOut'
          });
      } else if (mode === 'Oceanic Levitation') {
        mainFloatTl = gsap.timeline({ repeat: -1, yoyo: true })
          .to(eyeballRig, {
            y: -28 * params.floatIntensity,
            duration: 4.5 / params.speed,
            ease: 'sine.inOut'
          })
          .to(groundShadow, {
            scaleX: 0.88,
            opacity: 0.78,
            duration: 4.5 / params.speed,
            ease: 'sine.inOut'
          }, 0);
      } else if (mode === 'Stalker Orbit') {
        mainFloatTl = gsap.timeline({ repeat: -1 })
          .to(eyeballRig, {
            x: 16 * params.floatIntensity,
            y: -12 * params.floatIntensity,
            duration: 3.2 / params.speed,
            ease: 'sine.inOut'
          })
          .to(eyeballRig, {
            x: -16 * params.floatIntensity,
            y: 8 * params.floatIntensity,
            duration: 3.2 / params.speed,
            ease: 'sine.inOut'
          });
      } else {
        // Wandering Figure-8 (Classic)
        mainFloatTl = gsap.timeline({ repeat: -1, yoyo: true })
          .to(eyeballRig, {
            y: -16 * params.floatIntensity,
            rotation: 1.8 * params.floatIntensity,
            duration: 3.5 / params.speed,
            ease: 'sine.inOut'
          })
          .to(groundShadow, {
            scaleX: 0.94,
            opacity: 0.85,
            duration: 3.5 / params.speed,
            ease: 'sine.inOut'
          }, 0);
      }

      scheduleNextDart();
    }

    // ==========================================
    // SACCADIC DART & APEX DILATION
    // ==========================================
    function triggerDartSaccade(instant = false) {
      const mode = params.animation;
      const spd = Math.max(0.1, params.speed);

      const angle = Math.random() * Math.PI * 2;
      const dartDist = (mode === 'Paranoid Saccades' ? 62 : 46) * gsap.utils.random(0.75, 1.25);
      const targetX = Math.cos(angle) * dartDist;
      const targetY = Math.sin(angle) * dartDist * 0.65;

      const snapDuration = (instant ? 0.08 : 0.12) / spd;
      const holdDuration = gsap.utils.random(0.25, 0.55) / spd;
      const returnDuration = 0.42 / spd;

      gsap.to(dartOffset, {
        x: targetX,
        y: targetY,
        duration: snapDuration,
        ease: 'power4.out',
        onComplete: () => {
          gsap.to(dartOffset, {
            x: 0,
            y: 0,
            duration: returnDuration,
            delay: holdDuration,
            ease: 'power2.inOut'
          });
        }
      });

      const isConstrictMode = (mode === 'Tremor & Focus' && Math.random() > 0.4);
      const apexDilation = isConstrictMode
        ? 0.68 * params.pupilDilation
        : 1.45 * params.pupilDilation;

      const postApex = isConstrictMode
        ? 1.12 * params.pupilDilation
        : 0.88 * params.pupilDilation;

      gsap.timeline()
        .to(pupilState, {
          scale: apexDilation,
          duration: snapDuration,
          ease: 'power2.out'
        })
        .to(pupilState, {
          scale: postApex,
          duration: 0.22 / spd,
          ease: 'power2.inOut'
        })
        .to(pupilState, {
          scale: 1.0 * params.pupilDilation,
          duration: 0.38 / spd,
          ease: 'power2.out'
        });
    }

    function scheduleNextDart() {
      if (nextDartTimer) clearTimeout(nextDartTimer);

      const mode = params.animation;
      let baseDelay = gsap.utils.random(2.4, 4.2);
      if (mode === 'Paranoid Saccades') baseDelay = gsap.utils.random(1.1, 2.2);
      if (mode === 'Deep Dream Drift') baseDelay = gsap.utils.random(4.5, 7.5);

      const actualDelay = (baseDelay / (params.speed * params.dartFrequency)) * 1000;

      nextDartTimer = setTimeout(() => {
        triggerDartSaccade();
        scheduleNextDart();
      }, actualDelay);
    }

    // ==========================================
    // GSAP TICKER: FIGURE-8 TRACKING & PHYSICS
    // ==========================================
    let clockTime = 0;

    gsap.ticker.add((time, deltaTime) => {
      const dt = Math.min(deltaTime / 1000, 0.1);
      const spd = params.speed;
      clockTime += dt * spd;

      // 1. Compute Base Figure-8 Trajectory (Lemniscate)
      trackingPhase += dt * spd * 1.15;
      const fig8A = 50;
      const fig8B = 25;
      let f8X = Math.sin(trackingPhase) * fig8A;
      let f8Y = Math.sin(trackingPhase * 2) * fig8B;

      if (params.animation === 'Hypnotic Loom') {
        f8X = Math.cos(trackingPhase * 0.8) * 36;
        f8Y = Math.sin(trackingPhase * 0.8) * 36;
      } else if (params.animation === 'Oceanic Levitation') {
        f8X = Math.sin(trackingPhase * 0.7) * 55;
        f8Y = Math.cos(trackingPhase * 1.4) * 12;
      } else if (params.animation === 'Stalker Orbit') {
        f8X = Math.cos(trackingPhase * 0.6) * 52;
        f8Y = Math.sin(trackingPhase * 0.6) * 42;
      }

      // Total Iris Position (Figure-8 + Saccade Dart Offset)
      const currentIrisX = 500 + f8X + dartOffset.x;
      const currentIrisY = 400 + f8Y + dartOffset.y;

      // Subtle 3D perspective foreshortening as iris looks toward periphery
      const dxFromCenter = (currentIrisX - 500) / 172;
      const dyFromCenter = (currentIrisY - 400) / 172;
      const persScaleX = 1 - Math.abs(dxFromCenter) * 0.14;
      const persScaleY = 1 - Math.abs(dyFromCenter) * 0.10;

      irisRig.setAttribute(
        'transform',
        'translate(' + currentIrisX.toFixed(2) + ', ' + currentIrisY.toFixed(2) + ') scale(' + persScaleX.toFixed(3) + ', ' + persScaleY.toFixed(3) + ')'
      );

      // Pupil Dilation Update
      let currentPupilScale = pupilState.scale;
      if (params.animation === 'Hypnotic Loom') {
        currentPupilScale *= 1 + Math.sin(clockTime * 2.2) * 0.22;
      }

      pupilAperture.setAttribute('transform', 'scale(' + currentPupilScale.toFixed(3) + ')');
      pupilCore.setAttribute('transform', 'scale(' + currentPupilScale.toFixed(3) + ')');

      // 2. Mini-Eyes Tracking: All 6 mini-eyes subtly follow the main gaze!
      const miniOffsetX = Math.max(-2.2, Math.min(2.2, dxFromCenter * 2.2));
      const miniOffsetY = Math.max(-1.6, Math.min(1.6, dyFromCenter * 1.6));
      miniPupils.forEach((pupilEl, idx) => {
        const microJitterX = Math.sin(clockTime * 4 + idx) * 0.25;
        const microJitterY = Math.cos(clockTime * 3.5 + idx) * 0.2;
        pupilEl.setAttribute(
          'transform',
          'translate(' + (miniOffsetX + microJitterX).toFixed(2) + ', ' + (miniOffsetY + microJitterY).toFixed(2) + ') scale(' + Math.min(1.25, Math.max(0.85, currentPupilScale * 0.95)).toFixed(2) + ')'
        );
      });

      // 3. Dangling Tendrils Fluid Secondary Sway
      const swayAmp = params.tendrilSway;
      tendrilBases.forEach((tb) => {
        const strandEl = document.getElementById(tb.id);
        const dropEl = document.getElementById(tb.dropId);
        if (!strandEl || !dropEl) return;

        const phase = clockTime * 2.2 + tb.phase;
        const s1 = Math.sin(phase) * tb.amp * swayAmp * 0.35;
        const s2 = Math.sin(phase - 0.7) * tb.amp * swayAmp * 0.85;
        const s3 = Math.sin(phase - 1.4) * tb.amp * swayAmp * 1.35;

        const p1x = tb.x0 + s1;
        const p1y = tb.y0 + tb.L * 0.35;
        const p2x = tb.x0 + s2;
        const p2y = tb.y0 + tb.L * 0.70;
        const p3x = tb.x0 + s3;
        const p3y = tb.y0 + tb.L;

        strandEl.setAttribute(
          'd',
          'M ' + tb.x0 + ' ' + tb.y0 + ' C ' + p1x.toFixed(1) + ' ' + p1y.toFixed(1) + ', ' + p2x.toFixed(1) + ' ' + p2y.toFixed(1) + ', ' + p3x.toFixed(1) + ' ' + p3y.toFixed(1)
        );

        dropEl.setAttribute('cx', p3x.toFixed(1));
        dropEl.setAttribute('cy', p3y.toFixed(1));
      });

      // 4. Stalk Trunk Subtle Breathing Sway
      const trunkSway = Math.sin(clockTime * 1.6 - 0.4) * 8 * swayAmp;
      const trunkEl = document.getElementById('stalkTrunk');
      if (trunkEl) {
        trunkEl.setAttribute(
          'd',
          'M 466 595 C ' + (460 + trunkSway * 0.3) + ' 670, ' + (462 + trunkSway * 0.7) + ' 760, ' + (472 + trunkSway) + ' 855 C ' + (478 + trunkSway) + ' 870, ' + (488 + trunkSway) + ' 880, ' + (498 + trunkSway) + ' 880 C ' + (508 + trunkSway) + ' 880, ' + (520 + trunkSway) + ' 870, ' + (526 + trunkSway) + ' 855 C ' + (538 + trunkSway * 0.7) + ' 760, ' + (542 + trunkSway * 0.3) + ' 670, 536 595 Z'
        );
      }
    });

    // ==========================================
    // DPR (PIXEL RATIO) SETTING
    // ==========================================
    function applyDPR() {
      const dpr = params.dpr;
      const filterRes = Math.round(512 * Math.min(dpr, 2.5));
      document.querySelectorAll('filter').forEach(f => {
        f.setAttribute('filterRes', `${filterRes} ${filterRes}`);
      });
      const svg = document.getElementById('eyeballSvg');
      svg.style.imageRendering = dpr < 1 ? 'pixelated' : 'auto';
    }

    // ==========================================
    // LIL-GUI SETUP (Default styling, no alteration)
    // ==========================================
    const gui = new GUI({ title: 'Eyeball Creature Controls' });

    // Palette & Colors Folder
    const fTheme = gui.addFolder('Theme & Colors');
    fTheme.add(params, 'palette', Object.keys(PALETTES)).name('Color Scheme').onChange(val => {
      applyPalette(val);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });

    fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
      updateDOMColors();
    });

    fTheme.addColor(params, 'bgColor').name('Background').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'groundShadowColor').name('Ground Shadow').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'puddleColor').name('Blood Puddle').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'scleraColor').name('Sclera Base').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'hornColor').name('Horn Blades').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'irisColor').name('Iris Base').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'pupilColor').name('Pupil Core').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'veinColor').name('Crimson Veins').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'fleshColor').name('Fleshy Collar').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'stalkColor').name('Stalk Trunk').onChange(() => updateDOMColors());
    fTheme.addColor(params, 'tendrilColor').name('Tendrils & Drops').onChange(() => updateDOMColors());

    // Animation & Motion Folder
    const fAnim = gui.addFolder('Animation & Motion');
    fAnim.add(params, 'animation', ANIMATION_PRESETS).name('Preset').onChange(() => {
      setupAnimationPreset();
    });
    fAnim.add(params, 'speed', 0.1, 3.0, 0.05).name('Speed').onChange(val => {
      if (mainFloatTl) mainFloatTl.timeScale(val);
    });
    fAnim.add(params, 'pupilDilation', 0.5, 2.2, 0.05).name('Pupil Dilation');
    fAnim.add(params, 'dartFrequency', 0.2, 3.0, 0.1).name('Dart Frequency');
    fAnim.add(params, 'floatIntensity', 0.0, 2.5, 0.1).name('Float Amplitude').onChange(() => {
      setupAnimationPreset();
    });
    fAnim.add(params, 'tendrilSway', 0.0, 2.5, 0.1).name('Tendril Sway');

    // View & Display Folder
    const fView = gui.addFolder('View & DPR');
    fView.add(params, 'dpr', [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0]).name('DPR (Pixel Ratio)').onChange(() => applyDPR());
    const zoomController = fView.add(params, 'zoom', 0.3, 3.5, 0.05).name('Zoom').listen().onChange(val => {
      zoom = val;
      updateViewportTransform();
    });
    fView.add(params, 'resetView').name('Reset View');

    // Procedural Mutation Folder
    const fProcedural = gui.addFolder('Procedural Mutation');
    fProcedural.add(params, 'clickToMutate').name('Click Scene to Mutate');
    fProcedural.add(params, 'randomizeNow').name('Randomize Now');

    // ==========================================
    // HIDE / SHOW UI WITH "H" KEY
    // ==========================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const isHidden = gui.domElement.style.display === 'none';
        gui.domElement.style.display = isHidden ? '' : 'none';
      }
    });

    // ==========================================
    // INITIALIZATION
    // ==========================================
    applyPalette(params.palette);
    applyDPR();
    setupAnimationPreset();
    updateViewportTransform();

  </script>
</body>
</html>
