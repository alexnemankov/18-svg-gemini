    // --- REFINED PROCEDURAL FEATHER GEOMETRY ---
    function createFeatherGeometry() {
      const geom = new THREE.BufferGeometry();
      const segmentsLength = 10;
      const segmentsWidth = 4;
      const vertices = [];
      const normals = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= segmentsLength; i++) {
        const u = i / segmentsLength; // 0 (quill base) to 1 (tip)
        // Clean aerodynamic feather profile
        const widthEnvelope = Math.pow(Math.sin(u * Math.PI), 0.7) * (1.0 - u * 0.2) * 0.22;
        const yOffset = u * 1.0;
        const zArch = -Math.sin(u * Math.PI) * 0.08;

        for (let j = 0; j <= segmentsWidth; j++) {
          const v = (j / segmentsWidth) * 2.0 - 1.0; // -1 to +1
          const xOffset = v * widthEnvelope;
          const zCup = -(1.0 - Math.pow(Math.abs(v), 2.0)) * 0.025 * (1.0 - u * 0.3);

          vertices.push(xOffset, yOffset, zArch + zCup);
          normals.push(0, 0, 1);
          uvs.push(u, v);
        }
      }

      for (let i = 0; i < segmentsLength; i++) {
        for (let j = 0; j < segmentsWidth; j++) {
          const a = i * (segmentsWidth + 1) + j;
          const b = (i + 1) * (segmentsWidth + 1) + j;
          const c = (i + 1) * (segmentsWidth + 1) + (j + 1);
          const d = i * (segmentsWidth + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    // --- ANATOMICALLY LAYERED CHICKEN PLUMAGE GENERATOR ---
    function generateChickenPlumage() {
      const positions = [];
      const quaternions = [];
      const scales = [];
      const data = []; // x: partId, y: phase, z: flexibility, w: colorVariation
      const colors = [];

      const tempQ = new THREE.Quaternion();
      const tempM = new THREE.Matrix4();
      const tempUp = new THREE.Vector3();
      const tempNormal = new THREE.Vector3();
      const tempRight = new THREE.Vector3();

      function addFeather(pos, dir, normal, scale, partId, flex, colorVar) {
        positions.push(pos.x, pos.y, pos.z);

        tempUp.copy(dir).normalize();
        tempNormal.copy(normal).normalize();
        tempNormal.addScaledVector(tempUp, -tempNormal.dot(tempUp)).normalize();
        tempRight.crossVectors(tempUp, tempNormal).normalize();
        tempM.makeBasis(tempRight, tempUp, tempNormal);
        tempQ.setFromRotationMatrix(tempM);

        quaternions.push(tempQ.x, tempQ.y, tempQ.z, tempQ.w);
        scales.push(scale.x, scale.y, scale.z);
        data.push(partId, Math.random(), flex, colorVar);
        colors.push(1, 1, 1);
      }

      // 1. LAYERED BODY & BREAST PLUMAGE (~6,000 smoothly shingled feathers)
      const bodyRings = 40;
      const feathersPerRing = 140;
      for (let r = 0; r < bodyRings; r++) {
        const u = (r + 0.5) / bodyRings; // 0 (rump) to 1 (chest)
        const xCenter = -0.75 + u * 1.55;
        
        // Torso profile radius
        const rx = 0.85;
        const ry = 0.55 * Math.sin(u * Math.PI) * (1.0 + 0.25 * u);
        const rz = 0.42 * Math.sin(u * Math.PI) * (1.0 - 0.15 * u);

        if (ry < 0.05) continue;

        for (let f = 0; f < feathersPerRing; f++) {
          const theta = (f / feathersPerRing) * Math.PI * 2 + (r % 2) * (Math.PI / feathersPerRing);
          
          const y = (ry * Math.sin(theta)) - 0.05 + (u > 0.6 ? (u - 0.6) * 0.4 : 0);
          const z = rz * Math.cos(theta);
          const x = xCenter + (Math.random() - 0.5) * 0.03;

          const pos = new THREE.Vector3(x, y, z);
          const norm = new THREE.Vector3(
            (u - 0.5) * 0.4,
            Math.sin(theta),
            Math.cos(theta) * 1.2
          ).normalize();

          // Flow direction: lies flat along the body contour pointing towards the tail
          const dir = new THREE.Vector3(-0.92, -0.15 + (Math.sin(theta) > 0 ? -0.1 : 0.1), z * -0.3).normalize();
          // Angle feather slightly outward from surface for shingled plumage
          dir.lerp(norm, 0.18).normalize();

          const baseScale = 0.28 + Math.sin(u * Math.PI) * 0.12;
          const scale = new THREE.Vector3(baseScale * 0.85, baseScale * 1.15, baseScale * 0.85);

          addFeather(pos, dir, norm, scale, 0.0, 0.35, Math.random() * 0.3);
        }
      }

      // 2. NECK HACKLES / CAPE (~3,500 cascading pointed lanceolate feathers)
      const hackleLevels = 30;
      const hacklesPerLevel = 110;
      for (let l = 0; l < hackleLevels; l++) {
        const t = l / (hackleLevels - 1); // 0 (shoulder) to 1 (head base)
        
        // Curved neck spine
        const neckX = 0.45 + t * 0.55;
        const neckY = 0.25 + t * 1.15;
        const radius = (0.28 - t * 0.12);

        for (let h = 0; h < hacklesPerLevel; h++) {
          const phi = (h / hacklesPerLevel) * Math.PI * 2 + (l % 2) * (Math.PI / hacklesPerLevel);
          
          const x = neckX + Math.sin(phi) * radius * 0.6;
          const y = neckY + (Math.random() - 0.5) * 0.02;
          const z = Math.cos(phi) * radius * 0.95;

          const pos = new THREE.Vector3(x, y, z);
          const norm = new THREE.Vector3(Math.sin(phi) * 0.7, 0.2, Math.cos(phi)).normalize();
          
          // Hackles drape backwards and downwards over mantle
          const dir = new THREE.Vector3(-0.65 - t * 0.25, -0.7 + t * 0.3, z * -0.35).normalize();
          dir.lerp(norm, 0.15).normalize();

          const len = (0.35 + (1.0 - t) * 0.25 + Math.random() * 0.08);
          const scale = new THREE.Vector3(len * 0.6, len * 1.35, len * 0.6);

          addFeather(pos, dir, norm, scale, 1.0, 0.75, Math.random() * 0.35);
        }
      }

      // 3. HEAD, COMB, BEAK, WATTLE (~2,200 feathers)
      const headCenter = new THREE.Vector3(1.05, 1.5, 0.0);
      const headCount = 1000;
      for (let i = 0; i < headCount; i++) {
        const u = Math.acos(1 - 2 * Math.random());
        const v = Math.random() * Math.PI * 2;
        const r = 0.2;

        const pos = new THREE.Vector3(
          headCenter.x + r * Math.sin(u) * Math.cos(v) * 1.05,
          headCenter.y + r * Math.sin(u) * Math.sin(v),
          headCenter.z + r * Math.cos(u) * 0.75
        );
        const norm = new THREE.Vector3().subVectors(pos, headCenter).normalize();
        const dir = new THREE.Vector3(-0.6, 0.2, 0).normalize();
        const sc = 0.15 + Math.random() * 0.05;

        addFeather(pos, dir, norm, new THREE.Vector3(sc, sc * 1.1, sc), 0.0, 0.2, Math.random() * 0.2);
      }

      // Rooster Comb (Serrated tall crest)
      const combCount = 700;
      for (let i = 0; i < combCount; i++) {
        const t = Math.random(); // 0 to 1 along head top
        const x = 0.8 + t * 0.5;
        const spikes = Math.max(0.0, Math.sin(t * Math.PI * 5.0));
        const h = 0.08 + Math.sin(t * Math.PI) * 0.18 + spikes * 0.18;
        const y = 1.62 + Math.random() * h;
        const z = (Math.random() - 0.5) * 0.06;

        const pos = new THREE.Vector3(x, y, z);
        const dir = new THREE.Vector3(-0.1 + (t - 0.5) * 0.3, 0.95, 0).normalize();
        const norm = new THREE.Vector3(0, 0, z >= 0 ? 1 : -1);
        const sc = 0.14 + Math.random() * 0.06;

        addFeather(pos, dir, norm, new THREE.Vector3(sc * 0.7, sc * 1.2, sc * 0.6), 4.0, 0.2, 0.85);
      }

      // Wattle & Beak Accents
      const wattleCount = 450;
      for (let i = 0; i < wattleCount; i++) {
        const side = Math.random() > 0.5 ? 1 : -1;
        const t = Math.random();
        const pos = new THREE.Vector3(
          1.08 + (Math.random() - 0.5) * 0.08,
          1.32 - t * 0.22,
          side * (0.03 + Math.random() * 0.05)
        );
        const dir = new THREE.Vector3(-0.2, -0.95, 0).normalize();
        const norm = new THREE.Vector3(0, 0, side);
        const sc = 0.13 + Math.random() * 0.05;

        addFeather(pos, dir, norm, new THREE.Vector3(sc * 0.7, sc * 1.1, sc * 0.7), 4.0, 0.3, 0.9);
      }

      // 4. WINGS (Left & Right Flanks, ~3,600 feathers)
      const wingCountPerSide = 1800;
      [-1, 1].forEach(side => {
        for (let i = 0; i < wingCountPerSide; i++) {
          const u = Math.random(); // along wing length
          const v = Math.random(); // vertical row

          const wx = 0.35 - u * 0.95;
          const wy = 0.2 - v * 0.45 - u * 0.15;
          const wz = side * (0.36 + (1.0 - u) * 0.14 + v * 0.06);

          const pos = new THREE.Vector3(wx, wy, wz);
          const norm = new THREE.Vector3(0.1, 0.1, side * 0.95).normalize();
          const dir = new THREE.Vector3(-0.92, -0.15 - u * 0.15, side * (0.1 + u * 0.25)).normalize();
          dir.lerp(norm, 0.12).normalize();

          const len = (0.28 + u * 0.35 + Math.random() * 0.08);
          const scale = new THREE.Vector3(len * 0.65, len * 1.25, len * 0.65);

          addFeather(pos, dir, norm, scale, 3.0, 0.5, Math.random() * 0.3);
        }
      });

      // 5. MAJESTIC SICKLE & TAIL PLUMES (~4,800 feathers)
      const sickleArcs = 20;
      for (let a = 0; a < sickleArcs; a++) {
        const arcProgress = a / (sickleArcs - 1);
        const arcSpreadZ = (arcProgress - 0.5) * 0.55;
        const arcHeight = 1.65 + (1.0 - Math.abs(arcProgress - 0.5) * 1.4) * 0.55 + (Math.random() - 0.5) * 0.2;
        const arcLength = 1.9 + (1.0 - Math.abs(arcProgress - 0.5)) * 0.7 + (Math.random() - 0.5) * 0.3;

        const p0 = new THREE.Vector3(-0.55, 0.15 + (Math.random() - 0.5) * 0.1, arcSpreadZ * 0.3);
        const p1 = new THREE.Vector3(-0.95, arcHeight * 0.95, arcSpreadZ * 0.8);
        const p2 = new THREE.Vector3(-1.55, arcHeight, arcSpreadZ * 1.1);
        const p3 = new THREE.Vector3(-arcLength, -0.1 + Math.random() * 0.4, arcSpreadZ * 1.4);

        const curve = new THREE.CubicBezierCurve3(p0, p1, p2, p3);
        const countInArc = 240;

        for (let j = 0; j < countInArc; j++) {
          const t = j / countInArc;
          const pos = curve.getPoint(t);
          pos.x += (Math.random() - 0.5) * 0.05;
          pos.y += (Math.random() - 0.5) * 0.05;
          pos.z += (Math.random() - 0.5) * 0.05;

          const tangent = curve.getTangent(t).normalize();
          const norm = new THREE.Vector3(0, 1, (arcProgress - 0.5) * 0.8).normalize();

          const len = (0.42 + Math.sin(t * Math.PI) * 0.28 + Math.random() * 0.12);
          const scale = new THREE.Vector3(len * 0.65, len * 1.4, len * 0.65);

          addFeather(pos, tangent, norm, scale, 2.0, 1.25, Math.random() * 0.4);
        }
      }

      // 6. CONTROLLED AMBIENT DRIFTING PLUMES (~900 floating feathers)
      const ambientCount = 900;
      for (let i = 0; i < ambientCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        // Kept within safe boundary around bird
        const dist = 1.3 + Math.random() * 1.8;

        const pos = new THREE.Vector3(
          dist * Math.sin(phi) * Math.cos(theta),
          dist * Math.sin(phi) * Math.sin(theta) + 0.3,
          dist * Math.cos(phi) * 0.85
        );

        const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
        const norm = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
        const sc = 0.18 + Math.random() * 0.1;

        addFeather(pos, dir, norm, new THREE.Vector3(sc * 0.8, sc * 1.2, sc * 0.8), 5.0, 1.1, Math.random());
      }

      return {
        count: positions.length / 3,
        positions: new Float32Array(positions),
        quaternions: new Float32Array(quaternions),
        scales: new Float32Array(scales),
        data: new Float32Array(data),
        colors: new Float32Array(colors)
      };
    }

    // --- REFINED GLSL SHADERS (NO STRETCHING / NO EXAGGERATED SCALING) ---
    const vertexShader = `
      attribute vec3 aInstancePosition;
      attribute vec4 aInstanceQuaternion;
      attribute vec3 aInstanceScale;
      attribute vec4 aInstanceData; // x: partId, y: phase, z: flex, w: colorVar
      attribute vec3 aInstanceColor;

      uniform float uTime;
      uniform float uAnimationSpeed;
      uniform vec3 uMousePos;
      uniform float uMouseRadius;
      uniform float uMouseStrength;
      uniform vec3 uWindDirection;
      uniform float uWindTurbulence;
      uniform float uFlutterIntensity;
      uniform float uBreathingIntensity;
      uniform float uGlobalFeatherScale;
      uniform float uAmbientPlumesVisible;
      uniform int uAnimationMode;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      varying vec3 vViewPosition;
      varying vec4 vInstanceData;
      varying float vDisplacement;

      // Rotate vector by quaternion
      vec3 rotateVectorByQuat(vec3 v, vec4 q) {
        return v + 2.0 * cross(q.xyz, cross(q.xyz, v) + q.w * v);
      }

      // Simplex 3D Noise
      vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

      float snoise(vec3 v){
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + 1.0 * C.xxx;
        vec3 x2 = x0 - i2 + 2.0 * C.xxx;
        vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;

        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(
                   i.z + vec4(0.0, i1.z, i2.z, 1.0))
                 + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                 + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 0.142857142857;
        vec3  ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      void main() {
        vUv = uv;
        vInstanceData = aInstanceData;

        float partId = aInstanceData.x;
        float phase = aInstanceData.y;
        float flex = aInstanceData.z;

        // Ambient plumes visibility toggle
        if (partId > 4.5 && uAmbientPlumesVisible < 0.5) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          return;
        }

        float t = uTime * uAnimationSpeed;

        // Controlled local vertex scaling (keeps feather proportions intact)
        vec3 localPos = position * aInstanceScale * uGlobalFeatherScale;

        // Natural bend along feather shaft (UV.x)
        float shaftBend = pow(uv.x, 1.7) * flex;

        // Subtle micro-flutter vibration (wind rustle)
        float flutter = sin(t * 6.0 + phase * 25.0 + aInstancePosition.x * 2.0) * 0.025 * uFlutterIntensity * shaftBend;
        localPos.z += flutter;

        // Sickle tail flowing wave dynamics
        if (partId > 1.5 && partId < 2.5) {
          float tailWave = sin(t * 2.4 + aInstancePosition.y * 2.5 + phase * 4.0) * 0.08 * shaftBend;
          localPos.y += tailWave;
          localPos.z += cos(t * 1.8 + aInstancePosition.x * 2.0) * 0.06 * shaftBend;
        }

        // Plumage Cascade Wave (Animation Mode 5)
        if (uAnimationMode == 5) {
          float cascade = sin(t * 3.0 - (aInstancePosition.x * 2.5 + aInstancePosition.y * 2.0)) * 0.05 * shaftBend;
          localPos.z += cascade;
        }

        // Breathing & Heartbeat Pulse
        vec3 breathOffset = vec3(0.0);
        float breath = sin(t * 1.6) * 0.025 * uBreathingIntensity;
        if (uAnimationMode == 3) {
          float hb = pow(max(0.0, sin(t * 2.8)), 6.0) * 0.04;
          breath += hb * uBreathingIntensity;
        }
        if (partId < 1.5) {
          breathOffset = normalize(aInstancePosition + vec3(0.0, -0.2, 0.0)) * breath;
        }

        // Ambient Drifting Plumes Motion
        vec3 ambientDrift = vec3(0.0);
        if (partId > 4.5) {
          float driftTime = t * 0.3 + phase * 15.0;
          ambientDrift.x = sin(driftTime * 1.1) * 0.35;
          ambientDrift.y = cos(driftTime * 0.8) * 0.25;
          ambientDrift.z = sin(driftTime * 0.9 + 1.2) * 0.35;
        }

        // Rotate local vertex by instance orientation quaternion
        vec3 rotatedPos = rotateVectorByQuat(localPos, aInstanceQuaternion);
        vec3 worldPos = aInstancePosition + breathOffset + ambientDrift + rotatedPos;

        // Ambient Wind Displacement
        vec3 noiseCoord = worldPos * 0.4 + uWindDirection * (t * 0.3);
        float windNoise = snoise(noiseCoord);
        vec3 windDisp = uWindDirection * (windNoise * 0.09 + 0.05) * flex * shaftBend * uWindTurbulence;
        worldPos += windDisp;

        // --- FIXED MOUSE HOVER INTERACTION (NO SCALING/STRETCHING) ---
        // Mouse force displaces feather instance gently and curves feather tip naturally
        vec3 instanceOrigin = aInstancePosition + breathOffset + ambientDrift;
        vec3 toMouse = instanceOrigin - uMousePos;
        float distToMouse = length(toMouse);
        float mouseInfluence = smoothstep(uMouseRadius, 0.0, distToMouse);

        if (mouseInfluence > 0.0) {
          vec3 pushDir = normalize(toMouse + vec3(0.001, 0.08, 0.001));
          vec3 swirlDir = cross(pushDir, vec3(0.0, 1.0, 0.0));
          
          // Subtle instance translation (max ~0.15 units)
          vec3 instanceDisplacement = (pushDir * 0.75 + swirlDir * 0.25) * mouseInfluence * uMouseStrength * (0.2 + flex * 0.35);
          
          // Feather tip bend (subtle angular bend, NOT scaling geometry)
          vec3 tipBend = instanceDisplacement * (0.6 * shaftBend);
          
          worldPos += instanceDisplacement * 0.4 + tipBend;
        }

        vDisplacement = length(windDisp) + mouseInfluence * 0.5;

        vec3 rotatedNormal = rotateVectorByQuat(normal, aInstanceQuaternion);
        vNormal = normalize(normalMatrix * rotatedNormal);
        vWorldPosition = worldPos;

        vec4 mvPosition = modelViewMatrix * vec4(worldPos, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const fragmentShader = `
      uniform vec3 uColorBase;
      uniform vec3 uColorHackle;
      uniform vec3 uColorTail;
      uniform vec3 uColorComb;
      uniform vec3 uColorIridescence;
      uniform vec3 uLightPos;
      uniform vec3 uLightColor;
      uniform vec3 uAmbientColor;
      uniform float uIridescenceStrength;
      uniform float uTranslucency;
      uniform int uGreenscreen;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      varying vec3 vViewPosition;
      varying vec4 vInstanceData;
      varying float vDisplacement;

      void main() {
        float x = vUv.x; // 0 base -> 1 tip
        float y = abs(vUv.y); // 0 spine -> 1 edge

        // Feather silhouette shape
        float featherWidth = pow(sin(x * 3.14159265), 0.7) * 0.96 + 0.04;
        if (y > featherWidth) {
          discard;
        }

        // Clean subtle barb filaments (45-degree angle towards quill)
        float barbCoord = vUv.x * 45.0 - abs(vUv.y) * 25.0;
        float barbPattern = sin(barbCoord);
        float barbAlpha = smoothstep(-0.8, 0.8, barbPattern) * 0.18 + 0.82;

        // Feather edge softness
        float edgeAlpha = smoothstep(featherWidth, featherWidth - 0.1, y);

        // Quill spine
        float isQuill = 1.0 - smoothstep(0.0, 0.07, y);

        // Palette assignment by body region
        float partId = vInstanceData.x;
        float colorVar = vInstanceData.w;

        vec3 partColor = uColorBase;
        if (partId > 0.5 && partId < 1.5) {
          partColor = uColorHackle;
        } else if (partId > 1.5 && partId < 2.5) {
          partColor = uColorTail;
        } else if (partId > 2.5 && partId < 3.5) {
          partColor = mix(uColorBase, uColorHackle, 0.35);
        } else if (partId > 3.5 && partId < 4.5) {
          partColor = uColorComb;
        } else if (partId > 4.5) {
          partColor = mix(uColorHackle, uColorTail, colorVar);
        }

        // Shimmer gradient towards tip
        vec3 tipShimmer = mix(partColor, uColorIridescence, 0.3 + colorVar * 0.2);
        vec3 featherColor = mix(partColor * (0.9 + colorVar * 0.2), tipShimmer, pow(x, 1.2));

        // Quill spine tone
        vec3 quillColor = mix(featherColor, vec3(0.92, 0.90, 0.82), 0.6);
        featherColor = mix(featherColor, quillColor, isQuill * 0.75);

        // Lighting
        vec3 N = normalize(vNormal);
        vec3 V = normalize(vViewPosition);
        vec3 L = normalize(uLightPos - vWorldPosition);
        vec3 H = normalize(L + V);

        // Subsurface wrap diffuse
        float wrap = 0.45;
        float NdotL = max(0.0, (dot(N, L) + wrap) / (1.0 + wrap));
        vec3 diffuse = uLightColor * NdotL;

        // Specular sheen
        float NdotH = max(0.0, dot(N, H));
        float specular = pow(NdotH, 24.0) * 0.35;

        // Iridescent sheen
        float NdotV = max(0.0, dot(N, V));
        float fresnel = pow(1.0 - NdotV, 3.0);
        vec3 iriHue = mix(
          uColorIridescence,
          vec3(1.0 - uColorIridescence.b, uColorIridescence.r, 1.0 - uColorIridescence.g),
          sin(NdotV * 6.28318 + x * 2.5 + vDisplacement * 1.5) * 0.5 + 0.5
        );
        vec3 iridescence = iriHue * fresnel * uIridescenceStrength;

        // Backlight translucency
        float backLight = max(0.0, dot(-V, L)) * uTranslucency * (1.0 - isQuill);
        vec3 translucencyColor = featherColor * backLight * 1.4;

        // Final composition
        vec3 finalColor = featherColor * (uAmbientColor + diffuse) + (specular * uLightColor) + iridescence + translucencyColor;
        finalColor *= barbAlpha;

        gl_FragColor = vec4(finalColor, edgeAlpha);
      }
    `;

    // --- INSTANCED MESH INITIALIZATION ---
    const featherGeometry = createFeatherGeometry();
    const plumageData = generateChickenPlumage();

    const featherMaterial = new THREE.ShaderMaterial({
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      uniforms: {
        uTime: { value: 0 },
        uAnimationSpeed: { value: params.animationSpeed },
        uMousePos: { value: new THREE.Vector3(999, 999, 999) },
        uMouseRadius: { value: params.mouseRadius },
        uMouseStrength: { value: params.mouseWindForce },
        uWindDirection: { value: new THREE.Vector3(1.0, 0.15, 0.4).normalize() },
        uWindTurbulence: { value: params.windTurbulence },
        uFlutterIntensity: { value: params.featherFlutter },
        uBreathingIntensity: { value: params.breathingIntensity },
        uGlobalFeatherScale: { value: params.featherScale },
        uAmbientPlumesVisible: { value: params.showAmbientPlumes ? 1.0 : 0.0 },
        uAnimationMode: { value: ANIMATION_MODES.indexOf(params.animationMode) },

        uColorBase: { value: new THREE.Color(params.baseColor) },
        uColorHackle: { value: new THREE.Color(params.hackleColor) },
        uColorTail: { value: new THREE.Color(params.tailColor) },
        uColorComb: { value: new THREE.Color(params.combColor) },
        uColorIridescence: { value: new THREE.Color(params.iridescenceColor) },

        uLightPos: { value: new THREE.Vector3(4.0, 7.0, 5.0) },
        uLightColor: { value: new THREE.Color(0xffffff) },
        uAmbientColor: { value: new THREE.Color(0x282834) },
        uIridescenceStrength: { value: params.iridescenceStrength },
        uTranslucency: { value: params.subsurfaceTranslucency },
        uGreenscreen: { value: params.greenscreen ? 1 : 0 }
      },
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: true
    });

    const instancedMesh = new THREE.InstancedMesh(featherGeometry, featherMaterial, plumageData.count);
    instancedMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);

    instancedMesh.geometry.setAttribute('aInstancePosition', new THREE.InstancedBufferAttribute(plumageData.positions, 3));
    instancedMesh.geometry.setAttribute('aInstanceQuaternion', new THREE.InstancedBufferAttribute(plumageData.quaternions, 4));
    instancedMesh.geometry.setAttribute('aInstanceScale', new THREE.InstancedBufferAttribute(plumageData.scales, 3));
    instancedMesh.geometry.setAttribute('aInstanceData', new THREE.InstancedBufferAttribute(plumageData.data, 4));
    instancedMesh.geometry.setAttribute('aInstanceColor', new THREE.InstancedBufferAttribute(plumageData.colors, 3));

    scene.add(instancedMesh);

    // --- LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaee, 1.6);
    dirLight.position.set(4.0, 7.0, 5.0);
    scene.add(dirLight);

    const backRimLight = new THREE.DirectionalLight(0x7090ff, 1.1);
    backRimLight.position.set(-5.0, 4.0, -4.0);
    scene.add(backRimLight);

    // --- COLOR SCHEME HANDLERS ---
    function applyColorScheme(schemeName) {
      const palette = PALETTES.find(p => p.name === schemeName) || PALETTES[0];
      params.colorScheme = palette.name;
      params.baseColor = palette.base;
      params.hackleColor = palette.hackle;
      params.tailColor = palette.tail;
      params.combColor = palette.comb;
      params.iridescenceColor = palette.iridescence;

      updateShaderColors();
      updateBackgroundColor(palette.bg);
    }

    function updateShaderColors() {
      featherMaterial.uniforms.uColorBase.value.set(params.baseColor);
      featherMaterial.uniforms.uColorHackle.value.set(params.hackleColor);
      featherMaterial.uniforms.uColorTail.value.set(params.tailColor);
      featherMaterial.uniforms.uColorComb.value.set(params.combColor);
      featherMaterial.uniforms.uColorIridescence.value.set(params.iridescenceColor);
      featherMaterial.uniforms.uIridescenceStrength.value = params.iridescenceStrength;
      featherMaterial.uniforms.uTranslucency.value = params.subsurfaceTranslucency;
    }

    function updateBackgroundColor(bgHex) {
      if (params.greenscreen) {
        scene.background = new THREE.Color(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        const bg = new THREE.Color(bgHex || PALETTES.find(p => p.name === params.colorScheme)?.bg || '#050508');
        scene.background = bg;
        renderer.setClearColor(bg, 1.0);
      }
    }

    applyColorScheme(params.colorScheme);

    // --- LIL-GUI CONTROL PANEL ---
    const gui = new GUI({ title: 'Feather Particle Controls' });

    // 1. Color & Appearance Folder
    const fColor = gui.addFolder('Color & Appearance');
    const colorSchemeController = fColor.add(params, 'colorScheme', PALETTES.map(p => p.name)).name('Palette Preset').onChange(applyColorScheme);
    const greenscreenController = fColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(val => {
      featherMaterial.uniforms.uGreenscreen.value = val ? 1 : 0;
      updateBackgroundColor();
    });
    const baseColorCtrl = fColor.addColor(params, 'baseColor').name('Base Feather').onChange(updateShaderColors);
    const hackleColorCtrl = fColor.addColor(params, 'hackleColor').name('Hackle / Cape').onChange(updateShaderColors);
    const tailColorCtrl = fColor.addColor(params, 'tailColor').name('Sickle Tail').onChange(updateShaderColors);
    const combColorCtrl = fColor.addColor(params, 'combColor').name('Comb & Accent').onChange(updateShaderColors);
    const iriColorCtrl = fColor.addColor(params, 'iridescenceColor').name('Iridescence').onChange(updateShaderColors);
    const iriStrCtrl = fColor.add(params, 'iridescenceStrength', 0.0, 2.5, 0.05).name('Iridescent Sheen').onChange(updateShaderColors);
    const transCtrl = fColor.add(params, 'subsurfaceTranslucency', 0.0, 2.0, 0.05).name('Translucency').onChange(updateShaderColors);

    // 2. Animation & Dynamics Folder
    const fAnim = gui.addFolder('Animation & Wind');
    const animModeController = fAnim.add(params, 'animationMode', ANIMATION_MODES).name('Animation Mode').onChange(mode => {
      featherMaterial.uniforms.uAnimationMode.value = ANIMATION_MODES.indexOf(mode);
      if (mode === 'Gentle Roost (Static Camera)') {
        camera.position.set(0.0, 0.4, 5.8);
        controls.target.set(0, 0.25, 0);
        controls.update();
      }
    });
    const animSpeedCtrl = fAnim.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Animation Speed').onChange(val => {
      featherMaterial.uniforms.uAnimationSpeed.value = val;
    });
    const windTurbCtrl = fAnim.add(params, 'windTurbulence', 0.0, 2.5, 0.05).name('Wind Turbulence').onChange(val => {
      featherMaterial.uniforms.uWindTurbulence.value = val;
    });
    const flutterCtrl = fAnim.add(params, 'featherFlutter', 0.0, 3.0, 0.05).name('Feather Flutter').onChange(val => {
      featherMaterial.uniforms.uFlutterIntensity.value = val;
    });
    const breathCtrl = fAnim.add(params, 'breathingIntensity', 0.0, 2.0, 0.05).name('Breathing Pulse').onChange(val => {
      featherMaterial.uniforms.uBreathingIntensity.value = val;
    });

    // 3. Interaction & Physics Folder
    const fInteract = gui.addFolder('Interaction');
    const mouseForceCtrl = fInteract.add(params, 'mouseWindForce', 0.0, 2.5, 0.05).name('Mouse Wind Force').onChange(val => {
      featherMaterial.uniforms.uMouseStrength.value = val;
    });
    const mouseRadCtrl = fInteract.add(params, 'mouseRadius', 0.5, 3.5, 0.1).name('Wind Radius').onChange(val => {
      featherMaterial.uniforms.uMouseRadius.value = val;
    });
    const randOnClickCtrl = fInteract.add(params, 'randomizeOnClick').name('Randomize on Click');

    // 4. Quality & Display Folder
    const fRender = gui.addFolder('Quality & Display');
    const dprCtrl = fRender.add(params, 'pixelRatio', 0.5, 2.5, 0.25).name('Pixel Ratio (DPR)').onChange(val => {
      renderer.setPixelRatio(val);
    });
    const scaleCtrl = fRender.add(params, 'featherScale', 0.6, 1.5, 0.05).name('Feather Scale').onChange(val => {
      featherMaterial.uniforms.uGlobalFeatherScale.value = val;
    });
    const ambientPlumesCtrl = fRender.add(params, 'showAmbientPlumes').name('Ambient Plumes').onChange(val => {
      featherMaterial.uniforms.uAmbientPlumesVisible.value = val ? 1.0 : 0.0;
    });
    fRender.add(params, 'resetCamera').name('Reset Camera');

    // --- HIDE/SHOW UI ON 'H' KEY ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // --- MOUSE TRACKING & CONTROLLED HOVER FORCE ---
    const raycaster = new THREE.Raycaster();
    const mouseVec2 = new THREE.Vector2(-999, -999);
    const targetMouse3D = new THREE.Vector3(999, 999, 999);
    const currentMouse3D = new THREE.Vector3(999, 999, 999);
    const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;

    window.addEventListener('pointermove', (e) => {
      mouseVec2.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseVec2.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouseVec2, camera);
      const intersection = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(planeZ, intersection)) {
        // Clamp hover z/coordinates to the bird's volume
        targetMouse3D.copy(intersection);
      }
    });

    window.addEventListener('pointerleave', () => {
      targetMouse3D.set(999, 999, 999);
    });

    window.addEventListener('pointerdown', (e) => {
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
      const duration = performance.now() - pointerDownTime;

      // Detect clean click
      if (dist < 6 && duration < 350 && params.randomizeOnClick) {
        if (e.target.closest('.lil-gui')) return;
        randomizeThemeAndParameters();
      }
    });

    // --- PROCEDURAL RE-ROLL & THEME GENERATOR ---
    function randomizeThemeAndParameters() {
      const randomPalette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      applyColorScheme(randomPalette.name);

      if (Math.random() > 0.45) {
        const randomMode = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
        params.animationMode = randomMode;
        featherMaterial.uniforms.uAnimationMode.value = ANIMATION_MODES.indexOf(randomMode);
      }

      params.windTurbulence = +(0.35 + Math.random() * 0.8).toFixed(2);
      params.featherFlutter = +(0.4 + Math.random() * 0.9).toFixed(2);
      params.breathingIntensity = +(0.35 + Math.random() * 0.6).toFixed(2);
      params.iridescenceStrength = +(0.5 + Math.random() * 1.2).toFixed(2);
      params.subsurfaceTranslucency = +(0.4 + Math.random() * 0.8).toFixed(2);
      params.featherScale = +(0.85 + Math.random() * 0.3).toFixed(2);

      featherMaterial.uniforms.uWindTurbulence.value = params.windTurbulence;
      featherMaterial.uniforms.uFlutterIntensity.value = params.featherFlutter;
      featherMaterial.uniforms.uBreathingIntensity.value = params.breathingIntensity;
      featherMaterial.uniforms.uIridescenceStrength.value = params.iridescenceStrength;
      featherMaterial.uniforms.uTranslucency.value = params.subsurfaceTranslucency;
      featherMaterial.uniforms.uGlobalFeatherScale.value = params.featherScale;

      colorSchemeController.updateDisplay();
      animModeController.updateDisplay();
      baseColorCtrl.updateDisplay();
      hackleColorCtrl.updateDisplay();
      tailColorCtrl.updateDisplay();
      combColorCtrl.updateDisplay();
      iriColorCtrl.updateDisplay();
      iriStrCtrl.updateDisplay();
      transCtrl.updateDisplay();
      windTurbCtrl.updateDisplay();
      flutterCtrl.updateDisplay();
      breathCtrl.updateDisplay();
      scaleCtrl.updateDisplay();
    }

    // --- WINDOW RESIZE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      featherMaterial.uniforms.uTime.value = elapsedTime;

      // Smooth mouse wind tracking
      currentMouse3D.lerp(targetMouse3D, 0.12);
      featherMaterial.uniforms.uMousePos.value.copy(currentMouse3D);

      const modeIndex = ANIMATION_MODES.indexOf(params.animationMode);
      const speed = params.animationSpeed;

      // Camera motion based on animation mode
      if (modeIndex === 1) {
        // Majestic Slow Orbit
        const angle = elapsedTime * 0.2 * speed;
        const radius = 5.6;
        camera.position.x = Math.sin(angle) * radius;
        camera.position.z = Math.cos(angle) * radius;
        camera.position.y = 0.4 + Math.sin(elapsedTime * 0.15 * speed) * 0.3;
        controls.target.set(0, 0.25, 0);
      } else if (modeIndex === 2) {
        // Wind Vortex & Swirl
        const vortexAngle = elapsedTime * 0.7 * speed;
        featherMaterial.uniforms.uWindDirection.value.set(
          Math.cos(vortexAngle),
          Math.sin(elapsedTime * 0.35 * speed) * 0.3,
          Math.sin(vortexAngle)
        ).normalize();
      } else if (modeIndex === 4) {
        // Floating Silhouette (Cinematic Crane)
        camera.position.y = 0.3 + Math.sin(elapsedTime * 0.3 * speed) * 0.7;
        camera.position.x = Math.cos(elapsedTime * 0.15 * speed) * 1.2;
        controls.target.set(0, 0.25 + Math.sin(elapsedTime * 0.3 * speed) * 0.15, 0);
      } else if (modeIndex === 6) {
        // Turbulent Breeze
        const gust = Math.sin(elapsedTime * 1.0 * speed) * 0.3 + Math.cos(elapsedTime * 2.2 * speed) * 0.2;
        featherMaterial.uniforms.uWindDirection.value.set(1.0 + gust, 0.15 + gust * 0.2, 0.4 - gust * 0.15).normalize();
      } else if (modeIndex === 7) {
        // Dramatic Low Angle
        camera.position.set(0.6 + Math.sin(elapsedTime * 0.12 * speed) * 0.3, -0.7, 4.2);
        controls.target.set(0, 0.5, 0);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
