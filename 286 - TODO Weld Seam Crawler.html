<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weld Seam Crawler</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #040200;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        canvas:active {
            cursor: grabbing;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff9d00;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">CALIBRATING WELD SEAM CRAWLER...</div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

        // 18 Preconfigured Color Schemes
        const COLOR_SCHEMES = {

            },
            'Complementary (Amber & X-Ray Cyan)': {

            },
            'Split-complementary (Amber, Teal & Violet)': {

            },
            'Triadic (Infrared, Amber & Emerald)': {

            },

            },
            'Double split-complementary (Dual Radiography)': {

            },

            },
            'Achromatic (White and Black)': {
                color1: '#d8d8d8',
                color2: '#888888',
                color3: '#2b2b2b',
                color4: '#000000',
                bgColor: '#ffffff'
            },
            'Neutral + accent (Slate & Electric Amber)': {
                color1: '#1c2430',
                color2: '#425066',
                color3: '#ff5500',
                color4: '#ffcc00',
                bgColor: '#06080c'
            },
            'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
                color1: '#941B0C',
                color2: '#BC3908',
                color3: '#F6AA1C',
                color4: '#FFD780',
                bgColor: '#220901'
            },
            'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
                color1: '#0B132B',
                color2: '#4BAD9E',
                color3: '#5BC0BE',
                color4: '#63D1CF',
                bgColor: '#000000'
            },
            'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
                color1: '#0D001D',
                color2: '#AA60C8',
                color3: '#C9A3C6',
                color4: '#D69ADE',
                bgColor: '#120A12'
            },
            'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
                color1: '#00474D',
                color2: '#008189',
                color3: '#FFBA00',
                color4: '#FEF1BE',
                bgColor: '#061210'
            },
            'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
                color1: '#0A3322',
                color2: '#00B894',
                color3: '#7FFF00',
                color4: '#D4FFB0',
                bgColor: '#05140A'
            },
            'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
                color1: '#3D1050',
                color2: '#C7501A',
                color3: '#FF8C00',
                color4: '#FFE8CC',
                bgColor: '#0E0618'
            },
            'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
                color1: '#1A1250',
                color2: '#6A3DE8',
                color3: '#B38FFF',
                color4: '#E8E0FF',
                bgColor: '#090612'
            },
            'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
                color1: '#1E0A3D',
                color2: '#D40078',
                color3: '#00F0FF',
                color4: '#E0FBFF',
                bgColor: '#05020F'
            }
        };

        const ANIMATION_MODES = [
            'Static (Inspection Mode)',
            'Axial Bore Crawl',
            'Orbital Circumferential Scan',
            'Helical Crawler Survey',
            'Oscillating Seam Focus',
            'Breathing Radiograph',
            'Wide Panoramic Sweep',
            'Weld Joint Macro Tracking'
        ];

        const scene = new THREE.Scene();

        const defaultScheme = 'Achromatic (Black and White)';
        const initialPalette = COLOR_SCHEMES[defaultScheme];

        const SETTINGS = {
            // Presets & Modes
            colorScheme: defaultScheme,
            animationMode: 'Static (Inspection Mode)',
            randomizeOnClick: true,
            animSpeedMultiplier: 1.7,

            // Pipe & Weld Geometry
            curveSoftness: 7.78,
            curveWidth: 2.5375,
            curveDepth: 2.2881,
            height: 3.0,
            fov: 107.58,
            wallTilt: 0.0,
            ringPitch: 10.9,
            beadWidthFactor: 0.16,
            particleSize: 4.344,

            // Radiography & Film Shading
            grainScale: 1.1,
            grainFreq: 1.51,
            defectIntensity: 1.54,
            exposure: 3.0,
            compression: 0.2,
            fresnelExp: 1.1,
            edgeDarkness: 0.13,

            // Motion & Crawler
            speed: 5.1,
            crawlerSpeed: 4.6,
            scanSpeed: 3.6,
            cameraSpinSpeed: 0.2,
            cameraY: 0.0,

            // Transform & Zoom
            zoom: 0.344823,
            objectX: 5.54181,
            objectY: 6.9366,

            // Post-Processing
            bloomStrength: 1.95,
            bloomRadius: 1.45,
            chromaticAberration: 0.013,
            edgeBlurStrength: 0.019,
            dpr: 1.5,

            // Colors & Greenscreen
            color1: initialPalette.color1,
            color2: initialPalette.color2,
            color3: initialPalette.color3,
            color4: initialPalette.color4,
            bgColor: initialPalette.bgColor,
            greenScreen: false,
            greenScreenColor: '#00ff00'
        };

        scene.fog = new THREE.FogExp2(SETTINGS.bgColor, 0.002);
        scene.background = new THREE.Color(SETTINGS.bgColor);

        const camera = new THREE.PerspectiveCamera(SETTINGS.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, SETTINGS.cameraY, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(SETTINGS.dpr);
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);

        const wallVertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            varying vec3 vWorldNormal;
            varying vec3 vViewPosition;
            uniform float uCurveSoftness;

            void main() {
                vUv = uv;
                vec3 pos = position;

                float angle = atan(pos.z, pos.x);
                float normX = cos(angle);
                float n = uCurveSoftness;

                float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * 100.0;
                pos.z = sign(sin(angle)) * absZ;

                vPosition = pos;
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vViewPosition = -mvPosition.xyz;

                vec3 norm = normalize(vec3(-cos(angle), 0.0, -sin(angle)));
                vWorldNormal = normalize((modelViewMatrix * vec4(norm, 0.0)).xyz);

                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const wallFragmentShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            varying vec3 vWorldNormal;
            varying vec3 vViewPosition;

            uniform float uTime;
            uniform float uSpeed;
            uniform float uRingPitch;
            uniform float uBeadWidthFactor;
            uniform float uGrainScale;
            uniform float uGrainFreq;
            uniform float uDefectIntensity;
            uniform float uExposure;
            uniform float uCompression;
            uniform float uFresnelExp;
            uniform float uEdgeDarkness;
            uniform float uCrawlerSpeed;
            uniform float uScanSpeed;

            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColor4;
            uniform vec3 uBgColor;

            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
            }

            float noise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }

            // Anisotropic procedural noise field (stretched along angular axis, compressed radially)
            float getAnisotropicNoise(float angle, float y, float t) {
                float normAngle = (angle + 3.14159265) / 6.2831853;
                
                vec2 uv1 = vec2(normAngle * 24.0 * uGrainFreq, y * 3.2 * uGrainFreq);
                vec2 uv2 = vec2(normAngle * 80.0 * uGrainFreq, y * 11.0 * uGrainFreq + t * 0.03);
                vec2 uvFine = vec2(normAngle * 400.0 * uGrainFreq, y * 55.0 * uGrainFreq);
                
                float n1 = noise(uv1);
                float n2 = noise(uv2);
                float nFine = noise(uvFine);
                
                // Micro-porosity streaks along circumferential seam
                float streak = pow(noise(vec2(normAngle * 180.0, floor(y * 1.8))), 3.5) * 0.45;
                
                return (n1 * 0.42 + n2 * 0.36 + nFine * 0.22 + streak) * uGrainScale;
            }

            // Discrete weld-bead rings with per-ring random activation
            float getWeldBeads(vec3 pos, float angle, float t, out float outDefects) {
                float pitch = max(1.0, uRingPitch);
                float ringId = floor((pos.y + 40.0) / pitch);
                float ringCenter = -40.0 + (ringId + 0.5) * pitch;
                float distY = abs(pos.y - ringCenter);
                
                // Per-ring random activation
                float ringActive = random(vec2(ringId, 19.84));
                if (ringActive > 0.88) {
                    outDefects = 0.0;
                    return 0.0;
                }
                
                float ringVar = random(vec2(ringId, 7.31));
                float beadWidth = pitch * uBeadWidthFactor * mix(0.75, 1.25, ringVar);
                
                // Weld puddle ripple pattern (solidified weld weave)
                float rippleFreq = mix(35.0, 75.0, random(vec2(ringId, 4.12)));
                float weldRipple = sin(angle * rippleFreq + noise(vec2(angle * 8.0, ringId)) * 3.5) * 0.09 * beadWidth;
                float effDist = distY + weldRipple;
                
                // Profile of the crown & toe of the weld seam
                float beadProfile = smoothstep(beadWidth, beadWidth * 0.2, effDist);
                float beadCap = smoothstep(beadWidth * 0.4, 0.0, effDist);
                
                // Defect anomalies (voids, tungsten inclusions, micro-cracks along weld toe)
                float defectSeed = noise(vec2(angle * 26.0 + ringId * 8.5, ringId * 15.2));
                float defectSpot = step(0.78, defectSeed) * pow((defectSeed - 0.78) / 0.22, 2.2);
                outDefects = beadCap * defectSpot * uDefectIntensity * step(0.15, ringActive);
                
                return beadProfile * (0.65 + 0.45 * beadCap);
            }

            // Continuous 2-stop / 4-color ramp LUT
            vec3 evaluateLUT(float l) {
                vec3 col;
                if (l < 0.25) {
                    col = mix(uBgColor, uColor1, l / 0.25);
                } else if (l < 0.60) {
                    col = mix(uColor1, uColor2, (l - 0.25) / 0.35);
                } else if (l < 0.85) {
                    col = mix(uColor2, uColor3, (l - 0.60) / 0.25);
                } else {
                    col = mix(uColor3, uColor4, clamp((l - 0.85) / 0.15, 0.0, 1.0));
                }
                return col;
            }

            float getLuminance(vec3 pos, float isReflection) {
                float angle = atan(pos.z, pos.x);
                float currentAngle = angle + uTime * uSpeed * 0.015;
                
                // 1. Procedural Anisotropic Noise (Film Grain)
                float grain = getAnisotropicNoise(currentAngle, pos.y, uTime);
                
                // 2. Discrete Weld-Bead Rings
                float defectSignal = 0.0;
                float beadLuma = getWeldBeads(pos, currentAngle, uTime, defectSignal);
                
                // 3. Crawler Scanner & Laser Beam
                float crawlerY = sin(uTime * uCrawlerSpeed * 0.4) * 32.0;
                float crawlerDistY = abs(pos.y - crawlerY);
                float crawlerBand = exp(-pow(crawlerDistY * 0.26, 2.0));
                
                float scanAngle = mod(uTime * uScanSpeed * 2.2, 6.2831853);
                float scanDistAng = abs(mod(currentAngle - scanAngle + 3.14159265, 6.2831853) - 3.14159265);
                float laserBeam = exp(-pow(scanDistAng * 16.0, 2.0)) * crawlerBand;
                
                // Base pipe metal radiographic density + beads + scanner + anomalies
                float metalBase = 0.05 + 0.16 * grain;
                float rawL = metalBase + beadLuma * 0.70 + crawlerBand * 0.22 + laserBeam * 0.90 + defectSignal * 4.8;
                
                if (isReflection == 1.0) {
                    float fade = smoothstep(-35.0, -12.0, pos.y);
                    rawL *= 0.35 * fade;
                } else {
                    float fade = smoothstep(40.0, 20.0, pos.y);
                    rawL *= fade;
                }
                
                return rawL;
            }

            void main() {
                float floorLevel = -12.0;
                float rawL = 0.0;
                
                if (vPosition.y > floorLevel) {
                    rawL = getLuminance(vPosition, 0.0);
                } else {
                    vec3 reflectedPos = vPosition;
                    reflectedPos.y = floorLevel + (floorLevel - vPosition.y);
                    rawL = getLuminance(reflectedPos, 1.0);
                }
                
                // Fresnel-style view-angle falloff (X-Ray radiographic wall thickness attenuation)
                vec3 viewDir = normalize(vViewPosition);
                vec3 norm = normalize(vWorldNormal);
                float NdotV = clamp(abs(dot(norm, viewDir)), 0.001, 1.0);
                float xRayTransmission = pow(NdotV, uFresnelExp);
                float edgeDarkening = mix(uEdgeDarkness, 1.0, xRayTransmission);
                
                // Apply exposure and edge darkening
                float luma = rawL * uExposure * edgeDarkening;
                
                // Horizon glow
                float horizonGlow = smoothstep(0.6, 0.0, abs(vPosition.y - floorLevel));
                luma += horizonGlow * 0.15;
                
                // Dynamic-range compression (filmic tone mapping response)
                float compressed = luma / (1.0 + luma * uCompression);
                compressed = clamp(compressed, 0.0, 1.0);
                
                // Map luminance through LUT
                vec3 finalColor = evaluateLUT(compressed);
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const uniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.speed },
            uRingPitch: { value: SETTINGS.ringPitch },
            uBeadWidthFactor: { value: SETTINGS.beadWidthFactor },
            uGrainScale: { value: SETTINGS.grainScale },
            uGrainFreq: { value: SETTINGS.grainFreq },
            uDefectIntensity: { value: SETTINGS.defectIntensity },
            uExposure: { value: SETTINGS.exposure },
            uCompression: { value: SETTINGS.compression },
            uFresnelExp: { value: SETTINGS.fresnelExp },
            uEdgeDarkness: { value: SETTINGS.edgeDarkness },
            uCrawlerSpeed: { value: SETTINGS.crawlerSpeed },
            uScanSpeed: { value: SETTINGS.scanSpeed },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uColor1: { value: new THREE.Color(SETTINGS.color1) },
            uColor2: { value: new THREE.Color(SETTINGS.color2) },
            uColor3: { value: new THREE.Color(SETTINGS.color3) },
            uColor4: { value: new THREE.Color(SETTINGS.color4) },
            uBgColor: { value: new THREE.Color(SETTINGS.bgColor) }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: wallVertexShader,
            fragmentShader: wallFragmentShader,
            uniforms,
            side: THREE.BackSide,
            transparent: false
        });

        const geometry = new THREE.CylinderGeometry(100, 100, 80, 128, 1, true);
        const wall = new THREE.Mesh(geometry, material);
        tunnelGroup.add(wall);

        // Crawler dust / scintillator particle system
        const particleCount = 1800;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 98.5 + Math.random() * 1.0;
            const y = -11.0 + Math.random() * 48.0;

            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
            particleSpeeds[i] = 0.5 + Math.random() * 2.0;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeeds, 1));

        const particleUniforms = {
            uTime: { value: 0 },
            uSpeed: { value: SETTINGS.speed },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uParticleSize: { value: SETTINGS.particleSize }
        };

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: particleUniforms,
            vertexShader: `
                uniform float uTime;
                uniform float uSpeed;
                uniform float uCurveSoftness;
                uniform float uParticleSize;
                attribute float aSpeed;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;

                    float angle = atan(pos.z, pos.x);
                    float radius = length(pos.xz);
                    float currentAngle = angle - uTime * uSpeed * 0.015 * aSpeed;

                    float normX = cos(currentAngle);
                    float n = uCurveSoftness;
                    float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * radius;

                    pos.x = cos(currentAngle) * radius;
                    pos.z = sign(sin(currentAngle)) * absZ;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (10.0 * uParticleSize / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = smoothstep(38.0, 25.0, pos.y) * smoothstep(-12.0, -6.0, pos.y);
                }
            `,
            fragmentShader: `
                varying float vAlpha;

                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float ll = length(xy);
                    if (ll > 0.5) discard;

                    float glow = 1.0 - (ll * 2.0);
                    gl_FragColor = vec4(1.0, 0.9, 0.7, vAlpha * glow * 0.85);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        tunnelGroup.add(particles);

        tunnelGroup.scale.set(SETTINGS.curveWidth, SETTINGS.height, SETTINGS.curveDepth);
        tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        tunnelGroup.position.set(SETTINGS.objectX, SETTINGS.objectY, 0);

        // Composer & Post-Processing
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const PeripheralBlurShader = {
            uniforms: {
                tDiffuse: { value: null },
                uStrength: { value: SETTINGS.edgeBlurStrength },
                uAspect: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uStrength;
                uniform float uAspect;
                varying vec2 vUv;

                void main() {
                    vec2 center = vec2(0.5, 0.5);
                    vec2 uvCorrection = vec2(uAspect, 1.0);
                    float dist = length((vUv - center) * uvCorrection);

                    float blurMask = smoothstep(0.15, 0.75, dist);

                    if (blurMask <= 0.0) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }

                    const int SAMPLES = 32;
                    const float GOLDEN_ANGLE = 2.39996323;
                    vec4 color = vec4(0.0);
                    float radius = uStrength * blurMask;

                    for (int i = 0; i < SAMPLES; i++) {
                        float r = sqrt(float(i) + 0.5) / sqrt(float(SAMPLES));
                        float theta = float(i) * GOLDEN_ANGLE;
                        vec2 offset = vec2(cos(theta), sin(theta)) * r * radius;
                        offset.x /= uAspect;
                        color += texture2D(tDiffuse, vUv + offset);
                    }
                    gl_FragColor = color / float(SAMPLES);
                }
            `
        };
        const peripheralBlurPass = new ShaderPass(PeripheralBlurShader);
        composer.addPass(peripheralBlurPass);

        const ChromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uAmount: { value: SETTINGS.chromaticAberration }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAmount;
                varying vec2 vUv;

                void main() {
                    vec2 offset = uAmount * (vec2(0.5) - vUv);
                    vec4 cr = texture2D(tDiffuse, vUv + offset);
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);
        composer.addPass(caPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            SETTINGS.bloomStrength,
            SETTINGS.bloomRadius,
            0.1
        );
        composer.addPass(bloomPass);

        const updateBackground = () => {
            const activeBg = SETTINGS.greenScreen ? SETTINGS.greenScreenColor : SETTINGS.bgColor;
            uniforms.uBgColor.value.set(activeBg);
            scene.background.set(activeBg);
            scene.fog.color.set(activeBg);
            document.body.style.backgroundColor = activeBg;
        };

        const updateColors = () => {
            uniforms.uColor1.value.set(SETTINGS.color1);
            uniforms.uColor2.value.set(SETTINGS.color2);
            uniforms.uColor3.value.set(SETTINGS.color3);
            uniforms.uColor4.value.set(SETTINGS.color4);
            updateBackground();
        };

        const applyColorScheme = (schemeKey) => {
            const pal = COLOR_SCHEMES[schemeKey];
            if (!pal) return;
            SETTINGS.color1 = pal.color1;
            SETTINGS.color2 = pal.color2;
            SETTINGS.color3 = pal.color3;
            SETTINGS.color4 = pal.color4;
            SETTINGS.bgColor = pal.bgColor;
            updateColors();
            gui.controllersRecursive().forEach(c => {
                if (['color1', 'color2', 'color3', 'color4', 'bgColor'].includes(c.property)) {
                    c.updateDisplay();
                }
            });
        };

        const updateObjectTransform = () => {
            tunnelGroup.position.x = SETTINGS.objectX;
            tunnelGroup.position.y = SETTINGS.objectY;
            tunnelGroup.scale.set(
                SETTINGS.curveWidth * SETTINGS.zoom,
                SETTINGS.height * SETTINGS.zoom,
                SETTINGS.curveDepth * SETTINGS.zoom
            );
        };

        const randomizeScene = () => {
            // Pick random color scheme
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            SETTINGS.colorScheme = randomScheme;
            applyColorScheme(randomScheme);

            // Re-roll geometric & motion parameters
            SETTINGS.curveSoftness = parseFloat((2.5 + Math.random() * 6.5).toFixed(2));
            SETTINGS.curveWidth = parseFloat((0.24 + Math.random() * 0.35).toFixed(4));
            SETTINGS.curveDepth = parseFloat((0.75 + Math.random() * 0.55).toFixed(4));
            SETTINGS.height = parseFloat((0.9 + Math.random() * 0.7).toFixed(4));
            SETTINGS.wallTilt = parseFloat((-35 + Math.random() * 70).toFixed(1));
            SETTINGS.ringPitch = parseFloat((4.5 + Math.random() * 9.5).toFixed(2));
            SETTINGS.beadWidthFactor = parseFloat((0.22 + Math.random() * 0.28).toFixed(2));
            SETTINGS.grainFreq = parseFloat((0.7 + Math.random() * 1.5).toFixed(2));
            SETTINGS.defectIntensity = parseFloat((0.6 + Math.random() * 1.4).toFixed(2));
            SETTINGS.fresnelExp = parseFloat((1.0 + Math.random() * 2.0).toFixed(2));
            SETTINGS.edgeDarkness = parseFloat((0.05 + Math.random() * 0.25).toFixed(2));

            SETTINGS.speed = parseFloat((2.5 + Math.random() * 6.0).toFixed(1));
            SETTINGS.crawlerSpeed = parseFloat((0.6 + Math.random() * 2.0).toFixed(2));
            SETTINGS.scanSpeed = parseFloat((0.6 + Math.random() * 2.0).toFixed(2));
            SETTINGS.bloomStrength = parseFloat((0.15 + Math.random() * 0.45).toFixed(2));

            // Sync uniforms
            uniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            uniforms.uRingPitch.value = SETTINGS.ringPitch;
            uniforms.uBeadWidthFactor.value = SETTINGS.beadWidthFactor;
            uniforms.uGrainFreq.value = SETTINGS.grainFreq;
            uniforms.uDefectIntensity.value = SETTINGS.defectIntensity;
            uniforms.uFresnelExp.value = SETTINGS.fresnelExp;
            uniforms.uEdgeDarkness.value = SETTINGS.edgeDarkness;
            uniforms.uSpeed.value = SETTINGS.speed;
            uniforms.uCrawlerSpeed.value = SETTINGS.crawlerSpeed;
            uniforms.uScanSpeed.value = SETTINGS.scanSpeed;
            particleUniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            particleUniforms.uSpeed.value = SETTINGS.speed;
            bloomPass.strength = SETTINGS.bloomStrength;

            updateObjectTransform();
            tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        // GUI Setup
        const gui = new GUI({ title: 'Weld Seam Crawler' });

        const fPresets = gui.addFolder('Presets & Generation');
        fPresets.add(SETTINGS, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => applyColorScheme(v));
        fPresets.add(SETTINGS, 'animationMode', ANIMATION_MODES).name('Animation Mode');
        fPresets.add(SETTINGS, 'randomizeOnClick').name('Randomize on Click');
        fPresets.add({ randomize: randomizeScene }, 'randomize').name('⚡ Procedural Re-Roll');

        const fGeometry = gui.addFolder('Pipe & Weld Seam Geometry');
        fGeometry.add(SETTINGS, 'ringPitch', 2.0, 20.0, 0.1).name('Ring Pitch (Joints)').onChange(v => uniforms.uRingPitch.value = v);
        fGeometry.add(SETTINGS, 'beadWidthFactor', 0.1, 0.8, 0.01).name('Bead Width').onChange(v => uniforms.uBeadWidthFactor.value = v);
        fGeometry.add(SETTINGS, 'curveSoftness', 1.0, 10.0).name('Bore Curve Softness').onChange(v => {
            uniforms.uCurveSoftness.value = v;
            particleUniforms.uCurveSoftness.value = v;
        });
        fGeometry.add(SETTINGS, 'curveWidth', 0.1, 3.0).name('Pipe Width').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'curveDepth', 0.1, 3.0).name('Pipe Depth').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'height', 0.2, 3.0).name('Wall Height').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'zoom', 0.15, 5.0).name('Zoom').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectX', -100.0, 100.0).name('Object X').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectY', -60.0, 60.0).name('Object Y').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'wallTilt', -180, 180).name('Wall Tilt (deg)').onChange(v => {
            tunnelGroup.rotation.z = v * Math.PI / 180;
        });
        fGeometry.add(SETTINGS, 'fov', 30, 140).name('Camera FOV').onChange(v => {
            camera.fov = v;
            camera.updateProjectionMatrix();
        });
        fGeometry.add(SETTINGS, 'particleSize', 1.0, 25.0).name('Scintillator Size').onChange(v => {
            particleUniforms.uParticleSize.value = v;
        });

        const fRadiography = gui.addFolder('Radiography & Film Response');
        fRadiography.add(SETTINGS, 'exposure', 0.1, 3.0, 0.05).name('X-Ray Exposure').onChange(v => uniforms.uExposure.value = v);
        fRadiography.add(SETTINGS, 'compression', 0.0, 2.5, 0.05).name('Dynamic Range Comp').onChange(v => uniforms.uCompression.value = v);
        fRadiography.add(SETTINGS, 'fresnelExp', 0.2, 5.0, 0.1).name('Edge Falloff (Fresnel)').onChange(v => uniforms.uFresnelExp.value = v);
        fRadiography.add(SETTINGS, 'edgeDarkness', 0.0, 0.8, 0.01).name('Thickness Darkening').onChange(v => uniforms.uEdgeDarkness.value = v);
        fRadiography.add(SETTINGS, 'grainScale', 0.0, 3.0, 0.05).name('Anisotropic Grain Scale').onChange(v => uniforms.uGrainScale.value = v);
        fRadiography.add(SETTINGS, 'grainFreq', 0.2, 4.0, 0.05).name('Grain Frequency').onChange(v => uniforms.uGrainFreq.value = v);
        fRadiography.add(SETTINGS, 'defectIntensity', 0.0, 4.0, 0.1).name('Defect Anomaly Hotness').onChange(v => uniforms.uDefectIntensity.value = v);

        const fMotion = gui.addFolder('Motion & Crawler Controls');
        fMotion.add(SETTINGS, 'animSpeedMultiplier', 0.0, 5.0, 0.1).name('Animation Speed Mult');
        fMotion.add(SETTINGS, 'speed', 0.0, 10.0, 0.1).name('Stream Drift Speed').onChange(v => {
            uniforms.uSpeed.value = v;
            particleUniforms.uSpeed.value = v;
        });
        fMotion.add(SETTINGS, 'crawlerSpeed', 0.0, 5.0, 0.1).name('Crawler Axial Speed').onChange(v => uniforms.uCrawlerSpeed.value = v);
        fMotion.add(SETTINGS, 'scanSpeed', 0.0, 5.0, 0.1).name('Laser Scan Speed').onChange(v => uniforms.uScanSpeed.value = v);
        fMotion.add(SETTINGS, 'cameraSpinSpeed', -2.0, 2.0, 0.05).name('Camera Spin (Pan)');
        fMotion.add(SETTINGS, 'cameraY', -10.0, 10.0, 0.1).name('Camera Vertical Y');

        const fEffects = gui.addFolder('Post-Processing & DPR');
        fEffects.add(SETTINGS, 'dpr', 0.25, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => {
            renderer.setPixelRatio(v);
            composer.setPixelRatio(v);
        });
        fEffects.add(SETTINGS, 'bloomStrength', 0.0, 3.0, 0.05).name('Defect Bloom Strength').onChange(v => bloomPass.strength = v);
        fEffects.add(SETTINGS, 'bloomRadius', 0.0, 2.0, 0.05).name('Bloom Radius').onChange(v => bloomPass.radius = v);
        fEffects.add(SETTINGS, 'chromaticAberration', 0.0, 0.04, 0.001).name('Chromatic Aberration').onChange(v => caPass.uniforms.uAmount.value = v);
        fEffects.add(SETTINGS, 'edgeBlurStrength', 0.0, 0.05, 0.001).name('Peripheral Blur').onChange(v => {
            peripheralBlurPass.uniforms.uStrength.value = v;
        });

        const fColors = gui.addFolder('Palette Colors & Greenscreen');
        fColors.addColor(SETTINGS, 'color1').name('Stop 1 (Dark Film)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'color2').name('Stop 2 (Mid Metal)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'color3').name('Stop 3 (Warm Amber)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'color4').name('Stop 4 (Peak Defect)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'bgColor').name('Background Color').onChange(updateColors);
        fColors.add(SETTINGS, 'greenScreen').name('Green Screen').onChange(updateBackground);
        fColors.addColor(SETTINGS, 'greenScreenColor').name('Green Color').onChange(updateBackground);

        gui.close();

        // Keyboard Shortcut: H to Toggle UI
        window.addEventListener('keydown', event => {
            if (event.key === 'h' || event.key === 'H') {
                if (gui._hidden) {
                    gui.show();
                } else {
                    gui.hide();
                }
            }
        });

        // Mouse & Touch Dragging and Wheel Zoom
        const dragState = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            initialObjectX: 0,
            initialObjectY: 0,
            hasDragged: false
        };

        renderer.domElement.addEventListener('wheel', event => {
            event.preventDefault();
            const zoomFactor = event.deltaY > 0 ? 0.92 : 1.08;
            SETTINGS.zoom = THREE.MathUtils.clamp(SETTINGS.zoom * zoomFactor, 0.15, 5.0);
            updateObjectTransform();
            gui.controllersRecursive().find(controller => controller.property === 'zoom')?.updateDisplay();
        }, { passive: false });

        renderer.domElement.addEventListener('pointerdown', event => {
            if (event.button !== 0) return;
            dragState.active = true;
            dragState.pointerId = event.pointerId;
            dragState.startX = event.clientX;
            dragState.startY = event.clientY;
            dragState.initialObjectX = SETTINGS.objectX;
            dragState.initialObjectY = SETTINGS.objectY;
            dragState.hasDragged = false;
            renderer.domElement.setPointerCapture(event.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', event => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const deltaX = event.clientX - dragState.startX;
            const deltaY = event.clientY - dragState.startY;
            if (Math.hypot(deltaX, deltaY) > 5) {
                dragState.hasDragged = true;
            }
            const worldUnitsPerPixel = 0.12 / SETTINGS.zoom;
            SETTINGS.objectX = dragState.initialObjectX + deltaX * worldUnitsPerPixel;
            SETTINGS.objectY = dragState.initialObjectY - deltaY * worldUnitsPerPixel;
            updateObjectTransform();
        });

        const endDrag = event => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            
            // If user clicked without dragging, trigger procedural randomization if enabled
            if (!dragState.hasDragged && SETTINGS.randomizeOnClick) {
                randomizeScene();
            }

            dragState.active = false;
            dragState.pointerId = null;
            renderer.domElement.releasePointerCapture(event.pointerId);
            gui.controllersRecursive().forEach(controller => {
                if (controller.property === 'objectX' || controller.property === 'objectY') {
                    controller.updateDisplay();
                }
            });
        };

        renderer.domElement.addEventListener('pointerup', endDrag);
        renderer.domElement.addEventListener('pointercancel', endDrag);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();
            const t = elapsed * SETTINGS.animSpeedMultiplier;

            uniforms.uTime.value = t;
            particleUniforms.uTime.value = t;

            // Camera Animations
            const mode = SETTINGS.animationMode;
            if (mode === 'Static (Inspection Mode)') {
                camera.position.set(0, SETTINGS.cameraY, 0);
                camera.rotation.set(0, 0, 0);
            } else if (mode === 'Axial Bore Crawl') {
                camera.position.set(0, SETTINGS.cameraY + Math.sin(t * 0.3) * 6.5, 0);
                camera.rotation.set(0, Math.sin(t * 0.15) * 0.15 + t * SETTINGS.cameraSpinSpeed, 0);
            } else if (mode === 'Orbital Circumferential Scan') {
                camera.position.set(0, SETTINGS.cameraY + Math.sin(t * 0.2) * 1.5, 0);
                camera.rotation.set(0, t * 0.12 + t * SETTINGS.cameraSpinSpeed, 0);
            } else if (mode === 'Helical Crawler Survey') {
                camera.position.set(0, SETTINGS.cameraY + Math.sin(t * 0.2) * 5.0, 0);
                camera.rotation.set(0, t * 0.09 + t * SETTINGS.cameraSpinSpeed, Math.sin(t * 0.12) * 0.03);
            } else if (mode === 'Oscillating Seam Focus') {
                camera.position.set(0, SETTINGS.cameraY, 0);
                camera.rotation.set(Math.sin(t * 0.25) * 0.08, Math.cos(t * 0.2) * 0.35 + t * SETTINGS.cameraSpinSpeed, 0);
            } else if (mode === 'Breathing Radiograph') {
                camera.position.set(0, SETTINGS.cameraY + Math.sin(t * 0.35) * 2.5, 0);
                camera.rotation.set(Math.sin(t * 0.15) * 0.04, Math.sin(t * 0.18) * 0.12 + t * SETTINGS.cameraSpinSpeed, 0);
            } else if (mode === 'Wide Panoramic Sweep') {
                camera.position.set(0, SETTINGS.cameraY + Math.cos(t * 0.15) * 3.5, 0);
                camera.rotation.set(0, Math.sin(t * 0.14) * 0.85 + t * SETTINGS.cameraSpinSpeed, 0);
            } else if (mode === 'Weld Joint Macro Tracking') {
                const crawlerY = Math.sin(t * SETTINGS.crawlerSpeed * 0.4) * 32.0;
                camera.position.set(0, SETTINGS.cameraY + crawlerY * 0.25, 0);
                camera.rotation.set(Math.sin(t * 0.1) * 0.05, Math.sin(t * 0.08) * 0.2 + t * SETTINGS.cameraSpinSpeed, 0);
            }

            composer.render();
        }

        updateBackground();
        updateObjectTransform();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            peripheralBlurPass.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
        });
    </script>
</body>
</html>
