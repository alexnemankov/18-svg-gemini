<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attraction Cursor Visualizer</title>
  <style>
    body, html, #app {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      touch-action: none;
      background: #080b14;
      overflow: hidden;
      cursor: none;
    }

    #app {
      height: 100%;
      font-family: "Montserrat", serif;
      cursor: none;
    }

    #canvas {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow: hidden;
      cursor: none;
    }

    .lil-gui, .lil-gui * {
      cursor: auto !important;
    }

    .buttons {
      position: fixed;
      width: 100%;
      bottom: 15px;
      z-index: 2;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    button, a {
      color: black;
      font-family: "Montserrat", serif;
      font-size: 12px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 5px;
      border: 1px solid grey;
      padding: 4px 8px;
      cursor: pointer !important;
      user-select: none;
    }

    button:hover, a:hover {
      background: rgba(255, 255, 255, 0.8);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="app">
  <canvas id="canvas"></canvas>
  <div class="buttons" id="ui-buttons">
    <button type="button" id="colors-btn">
      Random colors
    </button>
    <a href="https://www.framer.com/@kevin-levron/" target="_blank">
      Framer Component
    </a>
  </div>
</div>

<input type="file" id="svg-upload" accept=".svg" style="display: none;" />

<script type="module">
  import AttractionCursor from "https://cdn.jsdelivr.net/npm/threejs-components@0.0.26/build/cursors/attraction1.min.js";
  import GUI from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";

  const canvasEl = document.getElementById('canvas');
  
  // Initialize AttractionCursor app
  const app = AttractionCursor(canvasEl, {
    particles: {
      attractionIntensity: 0.75,
      size: 1.5,
    },
  });

  // Color schemes definition
  const colorPresets = {
    "Neon Cyber": {
      light1: "#00f3ff",
      light2: "#ff0055",
      particle: "#00e1ff",
      bg: "#080b14"
    },
    "Sunset Gold": {
      light1: "#ffaa00",
      light2: "#ff2a5f",
      particle: "#ffd700",
      bg: "#120917"
    },
    "Emerald Aurora": {
      light1: "#00ffaa",
      light2: "#7928ca",
      particle: "#50ffb1",
      bg: "#041217"
    },
    "Cosmic Nebula": {
      light1: "#7b00ff",
      light2: "#ffea00",
      particle: "#b555ff",
      bg: "#0b0914"
    },
    "Monochrome Luxe": {
      light1: "#ffffff",
      light2: "#888888",
      particle: "#e0e0e0",
      bg: "#050505"
    }
  };

  // Default Settings State
  const settings = {
    greenScreen: false,
    colorScheme: "Neon Cyber",
    light1Color: colorPresets["Neon Cyber"].light1,
    light2Color: colorPresets["Neon Cyber"].light2,
    particleColor: colorPresets["Neon Cyber"].particle,
    bgColor: colorPresets["Neon Cyber"].bg,
    dpr: Math.min(window.devicePixelRatio || 1, 2),
    animationSpeed: 1.0,
    animationPreset: "Orbital Float",
    uploadSvg: () => document.getElementById('svg-upload').click(),
    resetSvg: () => resetSvgForm()
  };

  // Store particle position buffers for SVG morphing
  let originalPositions = null;
  let targetPositions = null;
  let isSvgActive = false;
  let particlesMesh = null;

  // Zoom & Drag states
  let zoomLevel = 1.0;
  let dragOffset = { x: 0, y: 0 };
  let isDragging = false;
  let lastPointerPos = { x: 0, y: 0 };

  // Setup initial Three.js adjustments when available
  function initParticleReferences() {
    if (app && app.particles) {
      applyColorScheme(settings.colorScheme);
      
      // Try finding the particle geometry position attribute
      let geom = app.particles.geometry;
      if (!geom && app.particles.mesh) {
        geom = app.particles.mesh.geometry;
        particlesMesh = app.particles.mesh;
      } else {
        particlesMesh = app.particles;
      }

      if (geom && geom.attributes && geom.attributes.position) {
        const posArr = geom.attributes.position.array;
        originalPositions = new Float32Array(posArr);
        targetPositions = new Float32Array(posArr.length);
      }
    }
  }

  // Color application function
  function applyColorScheme(schemeName) {
    const preset = colorPresets[schemeName];
    if (!preset) return;

    settings.colorScheme = schemeName;
    settings.light1Color = preset.light1;
    settings.light2Color = preset.light2;
    settings.particleColor = preset.particle;
    if (!settings.greenScreen) {
      settings.bgColor = preset.bg;
      updateBackgroundColor();
    }

    updateLightAndParticleColors();
    if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
  }

  function updateLightAndParticleColors() {
    if (!app || !app.particles) return;

    if (app.particles.light1 && app.particles.light1.color) {
      app.particles.light1.color.set(settings.light1Color);
    }
    if (app.particles.light2 && app.particles.light2.color) {
      app.particles.light2.color.set(settings.light2Color);
    }
    if (app.particles.material && app.particles.material.color) {
      app.particles.material.color.set(settings.particleColor);
    } else if (app.particles.color) {
      app.particles.color.set(settings.particleColor);
    }
  }

  function updateBackgroundColor() {
    const targetBg = settings.greenScreen ? "#00ff00" : settings.bgColor;
    document.body.style.background = targetBg;
    if (app && app.renderer) {
      app.renderer.setClearColor(targetBg, 1);
    }
  }

  // lil-gui Setup
  const gui = new GUI({ title: "Settings" });

  const bgFolder = gui.addFolder("Background & Colors");
  bgFolder.add(settings, "greenScreen").name("Green Screen (#00ff00)").onChange(() => {
    updateBackgroundColor();
  });
  
  bgFolder.add(settings, "colorScheme", Object.keys(colorPresets)).name("Color Preset").onChange((val) => {
    applyColorScheme(val);
  });

  bgFolder.addColor(settings, "light1Color").name("Light 1 Color").onChange(() => {
    updateLightAndParticleColors();
  });

  bgFolder.addColor(settings, "light2Color").name("Light 2 Color").onChange(() => {
    updateLightAndParticleColors();
  });

  bgFolder.addColor(settings, "particleColor").name("Particles Color").onChange(() => {
    updateLightAndParticleColors();
  });

  bgFolder.addColor(settings, "bgColor").name("Background Color").onChange(() => {
    if (!settings.greenScreen) updateBackgroundColor();
  });

  const renderFolder = gui.addFolder("Rendering & Speed");
  renderFolder.add(settings, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange((val) => {
    if (app && app.renderer) {
      app.renderer.setPixelRatio(val);
    }
  });

  renderFolder.add(settings, "animationSpeed", 0.0, 3.0, 0.1).name("Animation Speed");

  renderFolder.add(settings, "animationPreset", [
    "Static (No Motion)",
    "Orbital Float",
    "Breathing Wave",
    "Infinity Loop",
    "Spiral Elevation"
  ]).name("Camera Animation");

  const svgFolder = gui.addFolder("SVG Custom Shape");
  svgFolder.add(settings, "uploadSvg").name("Upload SVG Form");
  svgFolder.add(settings, "resetSvg").name("Reset Shape");

  // Random colors button
  const button1 = document.getElementById('colors-btn');
  button1.addEventListener('click', () => {
    const r1 = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
    const r2 = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
    settings.light1Color = r1;
    settings.light2Color = r2;
    updateLightAndParticleColors();
    gui.controllersRecursive().forEach(c => c.updateDisplay());
  });

  // UI Hide/Show toggle with "H" key
  let uiVisible = true;
  const uiButtons = document.getElementById('ui-buttons');

  window.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') {
      uiVisible = !uiVisible;
      gui.show(uiVisible);
      uiButtons.style.display = uiVisible ? 'flex' : 'none';
    }
  });

  // Drag & Zoom Controls Implementation
  window.addEventListener('wheel', (e) => {
    zoomLevel += e.deltaY * -0.001 * settings.animationSpeed;
    zoomLevel = Math.max(0.2, Math.min(5.0, zoomLevel));
  }, { passive: true });

  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.lil-gui') || e.target.closest('.buttons')) return;
    isDragging = true;
    lastPointerPos = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastPointerPos.x;
    const dy = e.clientY - lastPointerPos.y;
    dragOffset.x += dx * 0.01;
    dragOffset.y -= dy * 0.01;
    lastPointerPos = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('pointerup', () => {
    isDragging = false;
  });

  // SVG Parser Implementation
  const svgFileInput = document.getElementById('svg-upload');
  svgFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      parseAndApplySVG(event.target.result);
    };
    reader.readAsText(file);
  });

  async function parseAndApplySVG(svgText) {
    if (!originalPositions) return;
    const particleCount = originalPositions.length / 3;

    // Try path sampling first
    let points = parseSVGPaths(svgText, particleCount);
    if (!points || points.length === 0) {
      // Fallback to raster sampling
      points = await parseSVGRaster(svgText, particleCount);
    }

    if (points && points.length > 0) {
      targetPositions = new Float32Array(originalPositions.length);
      for (let i = 0; i < particleCount; i++) {
        const pt = points[i % points.length];
        targetPositions[i * 3] = pt.x;
        targetPositions[i * 3 + 1] = pt.y;
        targetPositions[i * 3 + 2] = pt.z;
      }
      isSvgActive = true;
    }
  }

  function parseSVGPaths(svgText, count) {
    try {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, "image/svg+xml");
      const pathEls = doc.querySelectorAll("path");
      if (pathEls.length === 0) return null;

      const tempContainer = document.createElement("div");
      tempContainer.style.position = "absolute";
      tempContainer.style.visibility = "hidden";
      tempContainer.appendChild(doc.documentElement.cloneNode(true));
      document.body.appendChild(tempContainer);

      const sampled = [];
      const livePaths = tempContainer.querySelectorAll("path");
      livePaths.forEach(p => {
        const len = p.getTotalLength();
        if (len > 0) {
          const numSamples = Math.max(30, Math.floor(len / 2));
          for (let i = 0; i < numSamples; i++) {
            const pt = p.getPointAtLength((i / numSamples) * len);
            sampled.push({ x: pt.x, y: pt.y });
          }
        }
      });

      document.body.removeChild(tempContainer);

      if (sampled.length === 0) return null;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      sampled.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });

      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const scale = 5.0 / (Math.max(maxX - minX, maxY - minY) || 1);

      const result = [];
      for (let i = 0; i < count; i++) {
        const p = sampled[i % sampled.length];
        result.push({
          x: (p.x - cx) * scale + (Math.random() - 0.5) * 0.05,
          y: -(p.y - cy) * scale + (Math.random() - 0.5) * 0.05,
          z: (Math.random() - 0.5) * 0.2
        });
      }
      return result;
    } catch(err) {
      return null;
    }
  }

  function parseSVGRaster(svgText, count) {
    return new Promise((resolve) => {
      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 300;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);

        const imgData = ctx.getImageData(0, 0, size, size).data;
        const pts = [];
        for (let y = 0; y < size; y += 2) {
          for (let x = 0; x < size; x += 2) {
            const idx = (y * size + x) * 4;
            const avg = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
            if (avg < 230 || imgData[idx+3] < 200) {
              pts.push({
                x: ((x / size) - 0.5) * 6.0,
                y: -((y / size) - 0.5) * 6.0,
                z: (Math.random() - 0.5) * 0.2
              });
            }
          }
        }

        const finalPts = [];
        if (pts.length > 0) {
          for (let i = 0; i < count; i++) {
            finalPts.push(pts[i % pts.length]);
          }
        }
        resolve(finalPts);
      };
      img.src = url;
    });
  }

  function resetSvgForm() {
    isSvgActive = false;
  }

  // Animation Loop
  let clockTime = 0;
  let lastTimestamp = performance.now();

  function animate(timestamp) {
    requestAnimationFrame(animate);

    const delta = (timestamp - lastTimestamp) * 0.001;
    lastTimestamp = timestamp;

    clockTime += delta * settings.animationSpeed;

    // Apply Drag & Zoom to Scene or Particle Container
    if (app && app.particles) {
      const obj = app.particles.mesh || app.particles;
      if (obj && obj.position && obj.scale) {
        obj.position.x = dragOffset.x;
        obj.position.y = dragOffset.y;
        obj.scale.set(zoomLevel, zoomLevel, zoomLevel);
      }
    }

    // Apply Camera Presets
    if (app && app.camera) {
      const cam = app.camera;
      const radius = 5.0;

      switch (settings.animationPreset) {
        case "Static (No Motion)":
          cam.position.set(0, 0, radius);
          cam.lookAt(0, 0, 0);
          break;

        case "Orbital Float":
          cam.position.x = Math.sin(clockTime * 0.3) * radius;
          cam.position.z = Math.cos(clockTime * 0.3) * radius;
          cam.position.y = Math.sin(clockTime * 0.15) * 1.0;
          cam.lookAt(0, 0, 0);
          break;

        case "Breathing Wave":
          const breatheZoom = radius + Math.sin(clockTime * 0.8) * 1.2;
          cam.position.set(
            Math.sin(clockTime * 0.2) * 0.5,
            Math.cos(clockTime * 0.3) * 0.5,
            breatheZoom
          );
          cam.lookAt(0, 0, 0);
          break;

        case "Infinity Loop":
          cam.position.x = Math.sin(clockTime * 0.4) * 2.5;
          cam.position.y = Math.sin(clockTime * 0.8) * 1.2;
          cam.position.z = radius;
          cam.lookAt(0, 0, 0);
          break;

        case "Spiral Elevation":
          cam.position.x = Math.cos(clockTime * 0.3) * radius;
          cam.position.z = Math.sin(clockTime * 0.3) * radius;
          cam.position.y = Math.sin(clockTime * 0.6) * 1.8;
          cam.lookAt(0, 0, 0);
          break;
      }
    }

    // Morph SVG particles if active
    if (originalPositions && app.particles) {
      let geom = app.particles.geometry;
      if (!geom && app.particles.mesh) geom = app.particles.mesh.geometry;

      if (geom && geom.attributes && geom.attributes.position) {
        const posAttr = geom.attributes.position;
        const currentArr = posAttr.array;
        const targetArr = isSvgActive ? targetPositions : originalPositions;

        if (targetArr) {
          let lerpFactor = 0.05 * settings.animationSpeed;
          if (lerpFactor > 1.0) lerpFactor = 1.0;
          for (let i = 0; i < currentArr.length; i++) {
            currentArr[i] += (targetArr[i] - currentArr[i]) * lerpFactor;
          }
          posAttr.needsUpdate = true;
        }
      }
    }
  }

  // Initialize and start loop
  setTimeout(() => {
    initParticleReferences();
    if (app && app.renderer) {
      app.renderer.setPixelRatio(settings.dpr);
    }
  }, 100);

  requestAnimationFrame(animate);
</script>
</body>
</html>
