<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tunnel Effect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body, html, #app {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      touch-action: none;
      background-color: #000000;
      cursor: none;
    }

    #app {
      height: 100%;
      font-family: "Montserrat", serif;
    }

    #app a {
      text-decoration: none;
      color: #fff;
    }

    .hero {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    h1, h2, p {
      margin: 0;
      padding: 0;
      color: white;
      text-shadow: 0 0 20px rgba(0, 0, 0, 1);
      line-height: 100%;
      user-select: none;
    }

    h1 {
      font-size: 80px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h2 {
      font-size: 60px;
      font-weight: 500;
      text-transform: uppercase;
    }

    #canvas {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow: hidden;
      cursor: none;
    }

    /* Restore default cursor when hovering over settings UI */
    .lil-gui, .lil-gui * {
      cursor: auto !important;
    }
  </style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  
</div>

<input type="file" id="svgInput" accept=".svg" style="display: none;" />

<script type="module">
  import TunnelComponent from 'https://cdn.jsdelivr.net/npm/threejs-components@0.0.30/build/backgrounds/tunnel1.min.js';
  import { GUI } from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

  const canvas = document.getElementById('canvas');
  const hero = document.getElementById('hero');
  const app = TunnelComponent(canvas, {});

  // 5 Presetupped popular & original color schemes
  const colorPresets = {
    'Warm Sunset': ['#dda474', '#d54803', '#cc539c', '#c41f10', '#eb2d0e'],
    'Cyberpunk Neon': ['#00f0ff', '#7000ff', '#ff007b', '#390099', '#9e0059'],
    'Emerald Abyss': ['#00f5d4', '#00bbf9', '#028090', '#05b2dc', '#03045e'],
    'Golden Luxe': ['#ffe5ec', '#ffb703', '#fb8500', '#d4af37', '#e76f51'],
    'Cosmic Vapor': ['#ff70a6', '#ff9770', '#ffd670', '#e9ff70', '#70d6ff']
  };

  const settings = {
    greenscreen: false,
    colorScheme: 'Warm Sunset',
    color0: '#dda474',
    color1: '#d54803',
    color2: '#cc539c',
    color3: '#c41f10',
    color4: '#eb2d0e',
    dpr: Math.min(window.devicePixelRatio || 1, 2),
    speed: 1.0,
    animation: 'Smooth Flow',
    uploadSVG: () => document.getElementById('svgInput').click()
  };

  // Set initial colors and noise thresholds
  app.tunnel.setColors([settings.color0, settings.color1, settings.color2, settings.color3, settings.color4]);
  app.tunnel.uniforms.uNoiseScaleX.value = 2.0;
  app.tunnel.uniforms.uNoiseTresholds.value[0] = 1 - 0.496041406596456;
  app.tunnel.uniforms.uNoiseTresholds.value[1] = 1 - 0.17835484130314838;
  app.tunnel.uniforms.uNoiseTresholds.value[2] = 1 - 0.40281655839303965;
  app.tunnel.uniforms.uNoiseTresholds.value[3] = 1 - 0.4460903073277931;
  app.tunnel.uniforms.uNoiseTresholds.value[4] = 1 - 0.47434758220851125;

  // Zoom & Drag State
  let isDragging = false;
  let previousMousePosition = { x: 0, y: 0 };
  let tunnelPos = { x: 0, y: 0 };
  let currentZoom = 1.0;

  // Wheel Zoom
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
    currentZoom = Math.max(0.3, Math.min(5.0, currentZoom * zoomFactor));
    app.tunnel.scale.set(currentZoom, currentZoom, currentZoom);
    if (svgMesh) svgMesh.scale.set(currentZoom, currentZoom, currentZoom);
  }, { passive: false });

  // Drag Object Across Screen
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.lil-gui')) return;
    isDragging = true;
    previousMousePosition = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMousePosition.x;
    const deltaY = e.clientY - previousMousePosition.y;
    previousMousePosition = { x: e.clientX, y: e.clientY };

    tunnelPos.x += deltaX * 0.01;
    tunnelPos.y -= deltaY * 0.01;
    app.tunnel.position.x = tunnelPos.x;
    app.tunnel.position.y = tunnelPos.y;
    if (svgMesh) {
      svgMesh.position.x = tunnelPos.x;
      svgMesh.position.y = tunnelPos.y;
    }
  });

  window.addEventListener('pointerup', () => { isDragging = false; });
  window.addEventListener('pointercancel', () => { isDragging = false; });

  // SVG Form Upload Handling
  let svgMesh = null;
  const svgInput = document.getElementById('svgInput');

  svgInput.addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      createSVGForm(e.target.result);
    };
    reader.readAsText(file);
  });

  function createSVGForm(svgText) {
    const img = new Image();
    const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    img.onload = () => {
      const canvas2d = document.createElement('canvas');
      canvas2d.width = 512;
      canvas2d.height = 512;
      const ctx = canvas2d.getContext('2d');
      ctx.clearRect(0, 0, 512, 512);
      ctx.drawImage(img, 0, 0, 512, 512);
      URL.revokeObjectURL(url);

      const texture = new THREE.CanvasTexture(canvas2d);
      texture.needsUpdate = true;

      if (svgMesh) {
        app.three.scene.remove(svgMesh);
        if (svgMesh.geometry) svgMesh.geometry.dispose();
        if (svgMesh.material) svgMesh.material.dispose();
      }

      const geometry = new THREE.PlaneGeometry(3, 3);
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        side: THREE.DoubleSide,
        depthTest: false
      });
      svgMesh = new THREE.Mesh(geometry, material);
      svgMesh.position.set(tunnelPos.x, tunnelPos.y, -2);
      svgMesh.scale.set(currentZoom, currentZoom, currentZoom);
      app.three.scene.add(svgMesh);
    };
    img.src = url;
  }

  // Animation presets & Infinite Loop Handler
  let animTime = 0;
  const originalOnBeforeRender = app.three.onBeforeRender;

  app.three.onBeforeRender = (timeData) => {
    if (originalOnBeforeRender) originalOnBeforeRender(timeData);

    const speed = settings.speed;
    animTime += (timeData.delta || 0.016) * speed;

    if (app.tunnel && app.tunnel.uniforms && app.tunnel.uniforms.uSpeed) {
      app.tunnel.uniforms.uSpeed.value = speed;
    }

    switch (settings.animation) {
      case 'Smooth Flow':
        app.tunnel.rotation.z = Math.sin(animTime * 0.5) * 0.15;
        app.tunnel.rotation.x = Math.cos(animTime * 0.3) * 0.1;
        break;
      case 'Gentle Sway':
        app.tunnel.rotation.z = Math.sin(animTime * 0.8) * 0.3;
        app.tunnel.rotation.y = Math.cos(animTime * 0.6) * 0.2;
        break;
      case 'Spiral Orbit':
        app.tunnel.rotation.z = animTime * 0.2;
        app.tunnel.rotation.x = Math.sin(animTime * 0.4) * 0.25;
        break;
      case 'Breathing Pulse':
        const pulseScale = currentZoom * (1 + Math.sin(animTime * 1.2) * 0.08);
        app.tunnel.scale.set(pulseScale, pulseScale, pulseScale);
        if (svgMesh) svgMesh.scale.set(pulseScale, pulseScale, pulseScale);
        break;
      case 'Static':
        app.tunnel.rotation.set(0, 0, 0);
        app.tunnel.scale.set(currentZoom, currentZoom, currentZoom);
        if (svgMesh) svgMesh.scale.set(currentZoom, currentZoom, currentZoom);
        break;
    }

    if (settings.animation !== 'Breathing Pulse' && settings.animation !== 'Static') {
      app.tunnel.scale.set(currentZoom, currentZoom, currentZoom);
      if (svgMesh) svgMesh.scale.set(currentZoom, currentZoom, currentZoom);
    }
  };

  // lil-gui Setup
  const gui = new GUI({ title: 'Settings' });

  // Greenscreen (#00ff00)
  gui.add(settings, 'greenscreen').name('Greenscreen').onChange((val) => {
    if (val) {
      document.body.style.backgroundColor = '#00ff00';
      canvas.style.backgroundColor = '#00ff00';
      if (app.three && app.three.renderer) {
        app.three.renderer.setClearColor(0x00ff00, 1);
      }
      hero.style.opacity = '0';
    } else {
      document.body.style.backgroundColor = '#000000';
      canvas.style.backgroundColor = 'transparent';
      if (app.three && app.three.renderer) {
        app.three.renderer.setClearColor(0x000000, 0);
      }
      hero.style.opacity = '1';
    }
  });

  // DPR (Pixel Ratio)
  gui.add(settings, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange((val) => {
    if (app.three && app.three.renderer) {
      app.three.renderer.setPixelRatio(val);
    }
  });

  // Animation Speed
  gui.add(settings, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');

  // 5 Presetupped Animations Dropdown
  gui.add(settings, 'animation', [
    'Smooth Flow',
    'Gentle Sway',
    'Spiral Orbit',
    'Breathing Pulse',
    'Static'
  ]).name('Animation');

  // 5 Presetupped Color Schemes Dropdown
  gui.add(settings, 'colorScheme', Object.keys(colorPresets)).name('Color Scheme').onChange((presetName) => {
    const colors = colorPresets[presetName];
    if (colors) {
      settings.color0 = colors[0];
      settings.color1 = colors[1];
      settings.color2 = colors[2];
      settings.color3 = colors[3];
      settings.color4 = colors[4];
      c0Ctrl.updateDisplay();
      c1Ctrl.updateDisplay();
      c2Ctrl.updateDisplay();
      c3Ctrl.updateDisplay();
      c4Ctrl.updateDisplay();
      updateColors();
    }
  });

  // Individual Color Controllers
  const colorFolder = gui.addFolder('Custom Colors');
  function updateColors() {
    app.tunnel.setColors([settings.color0, settings.color1, settings.color2, settings.color3, settings.color4]);
  }
  const c0Ctrl = colorFolder.addColor(settings, 'color0').name('Color 1').onChange(updateColors);
  const c1Ctrl = colorFolder.addColor(settings, 'color1').name('Color 2').onChange(updateColors);
  const c2Ctrl = colorFolder.addColor(settings, 'color2').name('Color 3').onChange(updateColors);
  const c3Ctrl = colorFolder.addColor(settings, 'color3').name('Color 4').onChange(updateColors);
  const c4Ctrl = colorFolder.addColor(settings, 'color4').name('Color 5').onChange(updateColors);

  // Upload SVG Form
  gui.add(settings, 'uploadSVG').name('Upload SVG Form');

  // Hide / Show UI with 'H' key
  window.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') {
      gui._hidden ? gui.show() : gui.hide();
    }
  });
</script>
</body>
</html>
