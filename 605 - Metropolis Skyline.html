       CSS Reset & Full Viewport UX
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      outline: none;
      border: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

       lil-gui Custom Glassmorphic Dark Aesthetic
       ============================================================ */

      backdrop-filter: blur(20px) !important;

      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65) !important;

    // ============================================================
    // Global Settings & Interactive Parameters

      // 19 Curated Color Schemes
      colorScheme: 'Original',

      // Architecture & Geometry
      NUM: 9,
      shearAngle: 0.14,
      heightMult: 1.0,
      widthMult: 1.0,
      subdivisionChance: 0.5,
      facadeStyle: 'Silhouette (Original)', // 'Silhouette (Original)' or 'Architectural Shading'

      // Animation & Atmosphere
      animSpeed: 1.0,
      isPlaying: true,
      showSearchlights: true,
      searchlightCount: 9,
      beamOrigin: 'Central (Original)', // 'Central (Original)' or 'Distributed'
      beamWidthMult: 1.0,
      windowTwinkle: true,
      spireBeacons: true,
      dustMotes: true,

      // Interaction
      randomizeOnClick: true,
      zoom: 1.0,

      // Action Handlers
      regenerate: () => generateCity(),
      randomizeScene: () => randomizeAll(),
      resetCamera: () => resetView(),
      saveImage: () => saveCanvas('metropolis_skyline_' + Date.now(), 'png')
    };

    // Current Theme Object
    let currentTheme = COLOR_SCHEMES['Original'];

    // Core Metropolis Layout Variables
    let S, cx, cy;
    let buildings = [];
    let searchlights = [];
    let dustParticles = [];
    let animClock = 0;

    // Interactive Pan & Zoom State
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoomLevel = 1.0, targetZoom = 1.0;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let totalDragDist = 0;

    let gui = null;
    let zoomController = null;

    // ============================================================
    // Searchlight & Atmosphere Generators
    // ============================================================
    function initSearchlights() {
      searchlights = [];
      const count = settings.searchlightCount;
      const isCentral = settings.beamOrigin.startsWith('Central');

      for (let i = 0; i < count; i++) {
        searchlights.push({
          originRatio: isCentral ? 0.5 : (i + 0.5) / count,
          baseAngle: map(i, 0, Math.max(1, count - 1), -0.85, 0.85) + random(-0.1, 0.1),
          sweepRange: random(0.12, 0.38),
          sweepFreq: random(0.4, 1.2),
          phase: random(TWO_PI),
          weightFrac: random(0.04, 0.095),
          colorIdx: i % currentTheme.beamColors.length,
          noiseSeed: random(1000)
        });
      }
    }

    function initDustParticles() {
      dustParticles = [];
      for (let i = 0; i < 65; i++) {
        dustParticles.push({
          x: random(width),
          y: random(height),
          vx: random(-0.25, 0.25),
          vy: random(-0.45, -0.12),
          size: random(1.5, 3.5),
          alpha: random(0.12, 0.45),
          phase: random(TWO_PI)
        });
      }
    }

    // ============================================================
    // Building Procedural Class
    // Preserves the author's isometric shear math and structure
    // ============================================================
    class Building {
      constructor(x = 0, y = 0, w = 0) {
        this.x = x || ~~(random(-0.1, 1.1) * width);
        this.y = y || ~~(randomGaussian(cy, S / 4));
        this.w = w || ~~(random(0.1, 0.2) * S * 0.5 * settings.widthMult) * 2;
        this.h = ~~max(random(0.5, 1.5) * height * settings.heightMult, height - this.y);

        // Precompute facade fills based on the current theme
        const randomFacade = random(currentTheme.facadeFills);
        const depthTone = color(currentTheme.isDark ? '#020208' : '#141424');
        this.fillClr = lerpColor(color(randomFacade), depthTone, constrain(this.y / height, 0, 1));
        this.fillClrDark = lerpColor(this.fillClr, color(0), 0.3);

        this.tx = ~~random(4, 15 + 1);
        this.ty = ~~random(5, 11 + 1);
        this.dx = ~~random(3, 8 + 1);
        this.dy = ~~random(3, 8 + 1);
        this.numX = Math.max(1, ~~((this.w - this.dx) / (this.tx + this.dx)));
        this.numY = Math.max(1, ~~((this.h - this.dy) / (this.ty + this.dy)));
        this.ox = this.dx + ~~((this.w - this.dx - this.numX * (this.tx + this.dx)) / 2);
        this.oy = this.dy;

        // Unique procedural seed for deterministic window activity
        this.seed = random(5000);

        // Pre-roll stable architectural horizontal bands for both faces
        this.rowBands = [[], []];
        for (let face = 0; face < 2; face++) {
          for (let j = 0; j < this.numY; j++) {
            this.rowBands[face][j] = (random() < 0.15);
          }
        }

        // Rooftop antenna spire & aviation warning beacon
        this.hasSpire = (this.w > 30) && (random() < 0.42);
        this.spireHeight = random(18, 55);
        this.beaconPhase = random(TWO_PI);
        this.beaconFreq = random(2.5, 4.5);
      }

      recolor() {
        const randomFacade = random(currentTheme.facadeFills);
        const depthTone = color(currentTheme.isDark ? '#020208' : '#141424');
        this.fillClr = lerpColor(color(randomFacade), depthTone, constrain(this.y / height, 0, 1));
        this.fillClrDark = lerpColor(this.fillClr, color(0), 0.3);
      }

      draw(t) {
        push();
        translate(this.x, this.y);

        // Rooftop antenna spire and pulsing aviation warning beacon at the apex (0, 0)
        if (this.hasSpire) {
          push();
          stroke(currentTheme.fg);
          strokeWeight(1.5);
          line(0, 0, 0, -this.spireHeight);

          if (settings.spireBeacons) {
            const blink = sin(t * this.beaconFreq * settings.animSpeed + this.beaconPhase);
            if (blink > 0.25) {
              noStroke();
              fill(currentTheme.beaconColor);
              const sz = map(blink, 0.25, 1.0, 3, 5.5);
              circle(0, -this.spireHeight, sz);

              // Soft beacon halo
              const haloCol = color(currentTheme.beaconColor);
              haloCol.setAlpha(65);
              fill(haloCol);
              circle(0, -this.spireHeight, sz * 2.4);
            }
          }
          pop();
        }

        const sh = settings.shearAngle;

        for (let face = 0; face < 2; face++) {
          noStroke();

          // Silhouette (Original) uses background color mask, Architectural uses deep depth tones
          if (settings.facadeStyle === 'Architectural Shading') {
            fill(face === 0 ? this.fillClr : this.fillClrDark);
          } else {
            fill(currentTheme.bg);
          }

          stroke(currentTheme.fg);
          strokeWeight(2);

          if (face === 0) {
            scale(-0.5, 1);
            shearY(2 * sh);
            rect(0, 0, this.w, this.h);

            line(this.w + 4, this.ty, this.w + 4, this.h);
            stroke(currentTheme.bg);
            line(this.w + 2, this.ty, this.w + 2, this.h);
          } else {
            scale(-2, 1);
            shearY(7.5 * sh);
            rect(0, 0, this.w, this.h);

            line(this.w + 4, this.ty, this.w + 4, this.h);
            stroke(currentTheme.bg);
            line(this.w + 2, this.ty, this.w + 2, this.h);
          }

          noStroke();

          // Render windows grid
          for (let j = 0, yPos = this.oy; j < this.numY; j++, yPos += this.ty + this.dy) {
            const isBand = this.rowBands[face][j];

            for (let k = 0, xPos = this.ox; k < this.numX; k++, xPos += this.tx + this.dx) {
              const ns = noise(xPos, yPos);
              let isLit = (ns >= 0.35);

              // Subtle procedural window lighting activity
              if (settings.windowTwinkle && settings.animSpeed > 0) {
                const twinkle = noise(xPos * 0.08 + this.seed, yPos * 0.08 + this.seed, t * 0.35 * settings.animSpeed);
                if (twinkle > 0.73) {
                  isLit = !isLit;
                }
              }

              if (isLit) {
                if (currentTheme.accentColor && ns > 0.65) {
                  fill(currentTheme.accentColor);
                } else {
                  fill(currentTheme.fg);
                }
              } else {
                fill(currentTheme.windowDark || currentTheme.bg);
              }

              if (ns < 0.2) stroke(currentTheme.fg);

              // Continuous floor stripe band
              if (k === 0 && isBand) {
                rect(xPos, yPos, this.numX * (this.tx + this.dx) - this.dx, this.ty);
              }

              rect(xPos, yPos, this.tx, this.ty);
              noStroke();
            }
          }

          shearY(3 * sh);
        }

        pop();
      }
    }

    // ============================================================
    // Metropolis Generation Engine
    // ============================================================
    function generateCity() {
      buildings = [];
      const numClusters = settings.NUM;

      for (let i = 0; i < numClusters; i++) {
        let b = new Building();
        buildings.push(b);

        // Tiered skyscraper setbacks
        while (random() < settings.subdivisionChance) {
          b = new Building(b.x + b.w / 8, b.y - S / 5, b.w / 2);
          buildings.push(b);
        }
      }

      // Sort back-to-front depth
      buildings.sort((a, b) => a.y - b.y);

      initSearchlights();
      initDustParticles();
    }

    function applyColorScheme(schemeKey, recolorExisting = true) {
      if (!COLOR_SCHEMES[schemeKey]) return;
      settings.colorScheme = schemeKey;
      currentTheme = COLOR_SCHEMES[schemeKey];

      if (recolorExisting) {
        for (const b of buildings) {
          b.recolor();
        }
      }

      initSearchlights();
    }

    function randomizeAll() {
      // 1. Pick a random color scheme from the 19 curated options
      const keys = Object.keys(COLOR_SCHEMES);
      const chosenKey = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(chosenKey, false);

      // 2. Re-roll geometric & motion parameters
      settings.NUM = Math.floor(random(6, 15));
      settings.shearAngle = +(random(0.09, 0.21).toFixed(3));
      settings.heightMult = +(random(0.75, 1.45).toFixed(2));
      settings.widthMult = +(random(0.75, 1.35).toFixed(2));
      settings.subdivisionChance = +(random(0.35, 0.65).toFixed(2));
      settings.searchlightCount = Math.floor(random(5, 14));
      settings.animSpeed = +(random(0.6, 1.6).toFixed(2));

      // 3. Update all lil-gui controllers dynamically
      if (gui) {
        gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
      }

      // 4. Generate new city architecture
      generateCity();
    }

    function resetView() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
      settings.zoom = 1.0;
      if (zoomController) zoomController.updateDisplay();
    }

    // ============================================================
    // p5.js Setup
    // ============================================================
    function setup() {
      const cnv = createCanvas(windowWidth, windowHeight);
      cnv.parent('canvas-container');

      S = min(width, height);
      cx = width / 2;
      cy = height / 2;

      applyColorScheme(settings.colorScheme, false);
      generateCity();
      initGUI();
      initEvents();
    }

    // ============================================================
    // p5.js Main Render Loop
    // ============================================================
    function draw() {
      // Advance clock
      if (settings.isPlaying && settings.animSpeed > 0) {
        animClock += (deltaTime / 1000) * settings.animSpeed;
      }

      // Smooth camera interpolation
      panX = lerp(panX, targetPanX, 0.15);
      panY = lerp(panY, targetPanY, 0.15);
      zoomLevel = lerp(zoomLevel, targetZoom, 0.15);

      background(currentTheme.bg);

      push();
      // Apply pan & zoom centered transformation
      translate(width / 2 + panX, height / 2 + panY);
      scale(zoomLevel);
      translate(-width / 2, -height / 2);

      // 1. Draw Sweeping Searchlights in the night sky
      if (settings.showSearchlights) {
        push();
        strokeCap(PROJECT);

        for (let i = 0; i < searchlights.length; i++) {
          const sl = searchlights[i];
          const ox = sl.originRatio * width;
          const oy = height;

          const sweep = sin(animClock * sl.sweepFreq * settings.animSpeed + sl.phase) * sl.sweepRange;
          const wander = (noise(sl.noiseSeed + animClock * 0.12 * settings.animSpeed) - 0.5) * 0.22;
          const angle = sl.baseAngle + sweep + wander;

          const beamLen = height * 2.8;
          const vx = sin(angle) * beamLen;
          const vy = -cos(angle) * beamLen;

          const w = sl.weightFrac * S * settings.beamWidthMult;
          strokeWeight(w);

          const col = currentTheme.beamColors[sl.colorIdx % currentTheme.beamColors.length];
          stroke(col);
          line(ox, oy, ox + vx, oy + vy);
        }
        pop();
      }

      // 2. Draw Generative Metropolis Buildings
      for (let i = 0; i < buildings.length; i++) {
        buildings[i].draw(animClock);
      }

      // 3. Draw Floating Atmospheric Motes
      if (settings.dustMotes) {
        push();
        noStroke();
        for (let i = 0; i < dustParticles.length; i++) {
          const p = dustParticles[i];
          if (settings.isPlaying && settings.animSpeed > 0) {
            p.x += p.vx * settings.animSpeed;
            p.y += p.vy * settings.animSpeed;
            if (p.y < 0) { p.y = height; p.x = random(width); }
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
          }
          const pulse = 0.5 + 0.5 * sin(animClock * 2.5 + p.phase);
          const c = color(currentTheme.fg);
          c.setAlpha(p.alpha * pulse * 255);
          fill(c);
          circle(p.x, p.y, p.size);
        }
        pop();
      }

      pop();
    }

    // ============================================================
    // Responsive Canvas Resizing
    // ============================================================
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      S = min(width, height);
      cx = width / 2;
      cy = height / 2;
    }

    // ============================================================
    // Pan & Zoom Event Handlers
    // ============================================================
    function initEvents() {
      const container = document.getElementById('canvas-container');

      // Wheel Zoom centered on cursor
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();

        const zoomFactor = e.deltaY < 0 ? 1.12 : 0.893;
        const newZoom = constrain(targetZoom * zoomFactor, 0.25, 7.0);

        // Maintain cursor world position
        const mouseWorldX = (mouseX - (width / 2 + targetPanX)) / targetZoom;
        const mouseWorldY = (mouseY - (height / 2 + targetPanY)) / targetZoom;

        targetPanX = mouseX - width / 2 - mouseWorldX * newZoom;
        targetPanY = mouseY - height / 2 - mouseWorldY * newZoom;
        targetZoom = newZoom;

        settings.zoom = targetZoom;
        if (zoomController) zoomController.updateDisplay();
      }, { passive: false });

      // Mouse drag handlers
      window.addEventListener('mousedown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        if (e.button === 0) {
          isDragging = true;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          startPanX = targetPanX;
          startPanY = targetPanY;
          totalDragDist = 0;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const dx = e.clientX - dragStartX;
          const dy = e.clientY - dragStartY;
          totalDragDist = Math.hypot(dx, dy);
          targetPanX = startPanX + dx;
          targetPanY = startPanY + dy;
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (isDragging) {
          isDragging = false;
          // Click detection: only if drag distance was minimal (< 5px)
          if (totalDragDist < 5) {
            if (settings.randomizeOnClick) {
              randomizeAll();
            }
          }
        }
      });

      // Mobile touch support (touch pan & pinch)
      let touchStartDist = 0;
      let touchStartZoom = 1.0;

      container.addEventListener('touchstart', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        if (e.touches.length === 1) {
          isDragging = true;
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          startPanX = targetPanX;
          startPanY = targetPanY;
          totalDragDist = 0;
        } else if (e.touches.length === 2) {
          isDragging = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          touchStartZoom = targetZoom;
        }
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          const dx = e.touches[0].clientX - dragStartX;
          const dy = e.touches[0].clientY - dragStartY;
          totalDragDist = Math.hypot(dx, dy);
          targetPanX = startPanX + dx;
          targetPanY = startPanY + dy;
        } else if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (touchStartDist > 0) {
            const factor = dist / touchStartDist;
            targetZoom = constrain(touchStartZoom * factor, 0.25, 7.0);
            settings.zoom = targetZoom;
            if (zoomController) zoomController.updateDisplay();
          }
        }
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        if (isDragging) {
          isDragging = false;
          if (totalDragDist < 5 && settings.randomizeOnClick) {
            randomizeAll();
          }
        }
      }, { passive: true });

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        // Spacebar to reseed / randomize
        if (e.code === 'Space') {
          e.preventDefault();
          randomizeAll();
        }
        // 'R' to reset pan & zoom
        if (e.code === 'KeyR') {
          resetView();
        }
        // 'H' to toggle GUI
        if (e.code === 'KeyH') {
          if (gui) {
            gui._hidden ? gui.show() : gui.hide();
          }
        }
        // 'P' to toggle play / pause
        if (e.code === 'KeyP') {
          settings.isPlaying = !settings.isPlaying;
        }
      });
    }

    // ============================================================
    // lil-gui Interactive Control Panel
    // ============================================================
    function initGUI() {
      gui = new lil.GUI({ title: 'Metropolis Skyline' });

      // 1. Color Palette Folder
      const fColors = gui.addFolder('Palette & Style');
      fColors.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Color Scheme')
        .onChange(v => applyColorScheme(v));
      fColors.add(settings, 'facadeStyle', ['Silhouette (Original)', 'Architectural Shading'])
        .name('Facade Style');

      // 2. Metropolis Architecture Folder
      const fArch = gui.addFolder('Metropolis Architecture');
      fArch.add(settings, 'NUM', 4, 20, 1).name('Tower Clusters').onChange(() => generateCity());
      fArch.add(settings, 'shearAngle', 0.05, 0.30, 0.01).name('Shear Angle');
      fArch.add(settings, 'heightMult', 0.4, 2.2, 0.05).name('Height Scale').onChange(() => generateCity());
      fArch.add(settings, 'widthMult', 0.5, 2.0, 0.05).name('Width Scale').onChange(() => generateCity());
      fArch.add(settings, 'subdivisionChance', 0.1, 0.85, 0.05).name('Setback Steps').onChange(() => generateCity());

      // 3. Motion & Atmosphere Folder
      const fAnim = gui.addFolder('Motion & Atmosphere');
      fAnim.add(settings, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      fAnim.add(settings, 'isPlaying').name('Play Animation');
      fAnim.add(settings, 'showSearchlights').name('Searchlights');
      fAnim.add(settings, 'searchlightCount', 3, 20, 1).name('Beam Count').onChange(() => initSearchlights());
      fAnim.add(settings, 'beamOrigin', ['Central (Original)', 'Distributed']).name('Beam Origin').onChange(() => initSearchlights());
      fAnim.add(settings, 'beamWidthMult', 0.3, 2.5, 0.05).name('Beam Width');
      fAnim.add(settings, 'windowTwinkle').name('Window Activity');
      fAnim.add(settings, 'spireBeacons').name('Rooftop Beacons');
      fAnim.add(settings, 'dustMotes').name('Atmospheric Dust');

      // 4. Interaction & Camera Folder
      const fNav = gui.addFolder('Navigation & Actions');
      fNav.add(settings, 'randomizeOnClick').name('Randomize on Click');
      zoomController = fNav.add(settings, 'zoom', 0.3, 6.0, 0.05).name('Zoom Level').onChange(v => { targetZoom = v; });
      fNav.add(settings, 'resetCamera').name('Reset View (Pan/Zoom)');
      fNav.add(settings, 'randomizeScene').name('Randomize Scene (Space)');
      fNav.add(settings, 'regenerate').name('Rebuild Architecture');
      fNav.add(settings, 'saveImage').name('Save Image');

      // Default state: Keep open
      fColors.open();
      fArch.open();
    }
  </script>
