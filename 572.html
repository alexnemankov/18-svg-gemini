<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>572 - Beautiful Burnout (Earth from Space)</title>
  
  <style>
    /* ==========================================================================
       RESET & BASE FULLSCREEN VIEWPORT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0a0e;
      color: #edeaf0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 50%, #15131c 0%, #08070b 100%);
      cursor: crosshair;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    /* ==========================================================================
       MINIMALIST ELEGANT HUD
       ========================================================================== */
    .hud {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 16, 24, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 16px;
      border-radius: 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65), 0 0 1px rgba(255, 255, 255, 0.2);
      z-index: 100;
      transition: opacity 0.35s ease, transform 0.35s ease;
      opacity: 0.95;
    }

    .hud.idle {
      opacity: 0.18;
      transform: translate(-50%, 4px);
    }

    .hud:hover {
      opacity: 1 !important;
      transform: translate(-50%, 0) !important;
    }

    .hud-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 6px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff781e;
      box-shadow: 0 0 10px #ff781e;
      transition: background 0.3s ease, box-shadow 0.3s ease;
      animation: pulse-dot 2s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.8; }
    }

    .status-dot.unburning {
      background: #00d2ff;
      box-shadow: 0 0 12px #00d2ff;
    }

    .status-dot.paused {
      background: #f7ba3e;
      box-shadow: 0 0 10px #f7ba3e;
      animation: none;
    }

    .status-dot.restored {
      background: #4ade80;
      box-shadow: 0 0 12px #4ade80;
    }

    .hud-text {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #f5f2f8;
      white-space: nowrap;
      min-width: 130px;
    }

    .hud-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.14);
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #dedbe4;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      white-space: nowrap;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .hud-btn:active {
      transform: scale(0.96) translateY(0);
    }

    .hud-key {
      font-size: 9.5px;
      background: rgba(255, 255, 255, 0.12);
      padding: 1.5px 5.5px;
      border-radius: 4px;
      color: #bbb6c2;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.5px;
    }

    /* ==========================================================================
       FLOATING TOAST NOTIFICATION
       ========================================================================= */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(18, 16, 26, 0.9);
      border: 1px solid rgba(255, 120, 30, 0.4);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 120, 30, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #toast.toast-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==========================================================================
       HINT BADGE (BOTTOM-LEFT)
       ========================================================================== */
    #hint-badge {
      position: fixed;
      bottom: 24px;
      left: 24px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      background: rgba(18, 16, 24, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 20px;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #hint-badge span.key {
      color: #ff9d54;
      font-weight: 600;
    }

    /* ==========================================================================
       LIL-GUI STYLING
       ========================================================================== */
    .lil-gui.root {
      --background-color: rgba(18, 16, 24, 0.88);
      --text-color: #edeaf0;
      --title-background-color: rgba(28, 24, 38, 0.95);
      --widget-color: rgba(36, 32, 48, 0.85);
      --hover-color: rgba(56, 50, 74, 0.9);
      --focus-color: rgba(255, 120, 30, 0.85);
      --number-color: #ff9d54;
      --string-color: #79d2ff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      --font-size: 11px;
      --folder-indent: 8px;

      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    body.hidden-ui .lil-gui.root,
    body.hidden-ui .hud,
    body.hidden-ui #hint-badge {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Hidden file input for custom image upload */
    #file-input {
      display: none;
    }
  </style>

<body>

  <!-- Minimalist HUD -->
  <div class="hud" id="hud">
    <div class="hud-status">
      <span class="status-dot" id="status-dot"></span>
      <span class="hud-text" id="status-text">🔥 Burning • 0%</span>

  <!-- Toast Notification -->
  <div id="toast">
    <span id="toast-icon">🔥</span>

  <!-- Hint Badge -->
  <div id="hint-badge">
    <span>Click scene to <span class="key">Randomize</span></span>
    <span>•</span>

    <span>•</span>
    <span><span class="key">H</span> Hide UI</span>

  <!-- ==========================================================================
       MAIN JAVASCRIPT APPLICATION
       ========================================================================== -->
  <script>
// For the #WCCChallenge, theme: "beautiful burnout".
// Image: https://commons.wikimedia.org/wiki/Category:Earth_from_space#/media/File:Meteosat-12-fci-march-equinox-2025-noon.jpg

/**
 * PRODUCTION-READY FULLSCREEN PING-PONG GENERATIVE BURNOUT
 * Enhanced with:
 * - 100% Self-Contained Procedural Planetary Synthesis (Zero external asset dependence)
 * - True Bidirectional Ping-Pong (Burn outward -> Savor ash -> Unburn / Phoenix revival -> Repeat)
 * - Canvas 2D Dynamic Clipping & Scorch Preservation Architecture
 * - Full Responsive Fullscreen Viewport Handling
 * - Procedural Theme Randomization & lil-gui Parameter Binding
 * - Custom Image Upload Support (Drag & Drop or GUI button)
 */

// ============================================================================
// SIMULATION & CONTROL PARAMETERS
// ============================================================================
const params = {
  // Ping-Pong & Animation
  pingPong: true,
  direction: 1, // 1 = forward (burn), -1 = reverse (unburn), 0 = paused
  speed: 1.2,
  progress: 0.0,
  holdDuration: 1.5, // seconds to hold at full burnout and full restoration
  burnTarget: 'Entire Photograph', // 'Entire Photograph' or 'Earth Disk Only'
  newOriginOnLoop: true,
  randomizeOnLoop: false,
  
  // Visual Theme & Planet
  theme: 'Meteosat Earth',
  paperAspectRatio: 'Square (1:1)',
  paperTint: 210,
  paperGrain: 30,
  burnHole: true,
  scorchWidth: 32,
  scorchDarkness: 110,
  
  // Fire & Particles
  particleDensity: 1.0,
  driftForce: 1.0,
  particleLife: 1.0,
  emberPalette: 'Classic Fiery',
  phoenixSparksInReverse: true,
  
  // Randomization & Interactivity
  randomizeOnClick: true,
  clickAction: 'Randomize Variation', // 'Randomize Variation' or 'Set Ignition Point'
  
  // Actions
  reRoll: () => triggerRandomize(),
  reIgnite: () => resetBurn(),
  toggleReverse: () => toggleBurnDirection(),
  uploadImage: () => document.getElementById('file-input').click(),
  saveImage: () => saveCanvasSnapshot()
};

// Available Themes
const THEMES = [
  'Meteosat Earth',
  'Earth at Night',
  'Solar Flare',
  'Red Planet Mars',
  'Emerald Gaia',
  'Neptune Azure',
  'Cyberpunk Grid',
  'Antique Parchment',
  'Molten Magma'
];

// Available Ember Color Schemes
const PALETTES = [
  'Classic Fiery',
  'Solar Gold',
  'Phoenix Celestial',
  'Emerald Biofire',
  'Cyber Neon',
  'Infernal Crimson'
];

// Core Runtime State
let particles = [];
let paper;          // Active composited graphics buffer
let cleanPaper;     // Pristine unburned photograph master
let singeBuffer;    // Singe marks accumulator
let planetImg;      // Generated or uploaded planetary image
let start;          // Ignition vector relative to paper center
let r = -2;         // Flame perimeter radius
let maxRadius = 300; // Calculated based on paper bounds
let burnState = 'BURNING'; // 'BURNING', 'BURNOUT_HOLD', 'UNBURNING', 'RESTORED_HOLD'
let holdTimer = 0;
let lastProgress = 0;
let gui;
let progressController;
let directionController;
let isDraggingProgress = false;
let customImageLoaded = false;

// Idle HUD fade timer
let hudIdleTimer = null;

// ============================================================================
// P5.JS LIFECYCLE HOOKS
// ============================================================================

function preload() {
  // In the original snippet: img = loadImage('earth.jpg');
  // For 100% self-contained resilience, we procedurally generate
  // high-detail planetary textures. Custom images can also be dropped.
}

function setup() {
  const c = createCanvas(windowWidth, windowHeight);
  c.parent('canvas-container');
  imageMode(CENTER);
  pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

  // Generate planet texture & initialize papers
  regeneratePlanetTexture();
  initializePaper();
  
  // Start ignition
  resetBurn();

  // Initialize interactive lil-gui panel
  setupGUI();

  // Wire DOM event listeners
  setupDOMListeners();

  showToast('🔥 Burnout initiated • Press Space to re-ignite');
}

function draw() {
  // Deep cosmic charcoal/black background with subtle starry dust
  background(14, 12, 18);
  drawDeepSpaceAmbience();

  // Ping-pong & Radius updates
  updateBurnState();

  // Draw composited photograph with procedural burn cutouts & singe rim
  renderCompositedPaper();

  // Center coordinate space for paper and particles
  push();
  translate(width / 2, height / 2);

  // Draw paper
  image(paper, 0, 0);

  // Update and draw glowing ember particles
  particles = particles.filter(p => p.alive);
  for (let p of particles) {
    if (p.f < 40) p.alive = false;
    p.show();
  }
  pop();

  // Sync HUD and GUI displays
  updateHUD();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  // Re-scale paper dimensions while smoothly preserving burn progression
  const savedProgress = params.progress;
  initializePaper();
  params.progress = savedProgress;
  r = map(params.progress, 0, 1, -2, maxRadius);
}

function keyPressed() {
  if (keyCode === 32) { // Spacebar: Re-ignite / Regenerate
    resetBurn();
    showToast('⟲ Re-ignited photograph');
    return false;
  }
  if (key === 'p' || key === 'P') { // P: Pause / Resume
    togglePlayPause();
    return false;
  }
  if (key === 'r' || key === 'R') { // R: Reverse direction
    toggleBurnDirection();
    return false;
  }
  if (key === 'c' || key === 'C') { // C: Random procedural variation
    triggerRandomize();
    return false;
  }
  if (key === 's' || key === 'S') { // S: Save HD PNG
    saveCanvasSnapshot();
    return false;
  }
  if (key === 'f' || key === 'F') { // F: Toggle Fullscreen
    toggleFullscreen();
    return false;
  }
  if (key === 'h' || key === 'H') { // H: Hide / Show UI
    document.body.classList.toggle('hidden-ui');
    return false;
  }
}

// ============================================================================
// PAPER & PLANET INITIALIZATION
// ============================================================================

function getPaperDimensions() {
  let pw, ph;
  const marginFactor = 0.84;
  const maxW = windowWidth * marginFactor;
  const maxH = windowHeight * marginFactor;

  switch (params.paperAspectRatio) {
    case 'Portrait (4:5)':
      ph = Math.min(maxH, maxW * 1.25);
      pw = ph * 0.8;
      break;
    case 'Widescreen (16:9)':
      pw = Math.min(maxW, maxH * 1.777);
      ph = pw * (9 / 16);
      break;
    case 'Full Bleed':
      pw = windowWidth;
      ph = windowHeight;
      break;
    case 'Square (1:1)':
    default:
      const side = Math.min(maxW, maxH);
      pw = side;
      ph = side;
      break;
  }
  return { pw: Math.round(pw), ph: Math.round(ph) };
}

function initializePaper() {
  const { pw, ph } = getPaperDimensions();

  // Create buffers
  paper = createGraphics(pw, ph);
  cleanPaper = createGraphics(pw, ph);
  singeBuffer = createGraphics(pw, ph);

  // Set modes
  paper.imageMode(CENTER);
  cleanPaper.imageMode(CENTER);
  singeBuffer.imageMode(CENTER);

  // Render pristine unburned photograph onto cleanPaper
  cleanPaper.background(220, 218, 224); // Gainsboro fine tone

  // Draw planet image
  const imgSize = Math.min(pw, ph) * 0.82;
  cleanPaper.push();
  cleanPaper.tint(255, params.paperTint);
  cleanPaper.image(planetImg, pw / 2, ph / 2, imgSize, imgSize);
  cleanPaper.pop();

  // Authentic paper scan lines / grain from original code
  for (let y = 0; y < ph; y += random(1, 3)) {
    cleanPaper.stroke(0, noise(y / 100) * params.paperGrain);
    cleanPaper.line(0, y, pw, y);
  }

  // Calculate maximum reach from center/corners for complete burnout
  calculateMaxRadius();
}

function calculateMaxRadius() {
  if (!start) {
    start = createVector(0, 0);
  }
  const hw = paper.width / 2;
  const hh = paper.height / 2;
  const d1 = dist(start.x, start.y, -hw, -hh);
  const d2 = dist(start.x, start.y, hw, -hh);
  const d3 = dist(start.x, start.y, -hw, hh);
  const d4 = dist(start.x, start.y, hw, hh);
  maxRadius = Math.max(d1, d2, d3, d4) + 60;
}

function resetBurn(customStart = null) {
  particles = [];
  singeBuffer.clear();
  
  if (customStart) {
    start = customStart;
  } else {
    // Pick start point (original code: random(-paper.height/2, paper.height/2))
    const bound = Math.min(paper.width, paper.height) * 0.35;
    start = createVector(random(-bound, bound), random(-bound, bound));
  }

  calculateMaxRadius();
  r = -2;
  params.progress = 0;
  params.direction = 1;
  burnState = 'BURNING';
  holdTimer = 0;

  if (progressController) progressController.updateDisplay();
  if (directionController) directionController.updateDisplay();
}

// ============================================================================
// PING-PONG STATE MACHINE & BURN PROGRESSION
// ============================================================================

function updateBurnState() {
  const step = (params.speed * (paper.height / 1400)) / maxRadius;

  if (params.direction === 0) {
    burnState = 'PAUSED';
    return;
  }

  if (burnState === 'BURNING') {
    params.progress += step;
    if (params.progress >= 1.0) {
      params.progress = 1.0;
      burnState = 'BURNOUT_HOLD';
      holdTimer = Math.round(params.holdDuration * 60);
    }
  } else if (burnState === 'BURNOUT_HOLD') {
    holdTimer--;
    if (holdTimer <= 0) {
      if (params.pingPong) {
        burnState = 'UNBURNING';
        params.direction = -1;
        if (directionController) directionController.updateDisplay();
        showToast('✨ Unburning • Phoenix revival');
      } else {
        onCycleComplete();
      }
    }
  } else if (burnState === 'UNBURNING') {
    params.progress -= step;
    if (params.progress <= 0.0) {
      params.progress = 0.0;
      burnState = 'RESTORED_HOLD';
      holdTimer = Math.round(params.holdDuration * 60);
    }
  } else if (burnState === 'RESTORED_HOLD') {
    holdTimer--;
    if (holdTimer <= 0) {
      onCycleComplete();
    }
  }

  // Map progress to radius r
  r = map(params.progress, 0, 1, -2, maxRadius);

  // Spawn active embers along the flame perimeter
  if ((burnState === 'BURNING' || burnState === 'UNBURNING') && r > 2) {
    spawnParticles();
  }

  if (progressController && !isDraggingProgress) {
    progressController.updateDisplay();
  }
}

function onCycleComplete() {
  if (params.randomizeOnLoop) {
    triggerRandomize();
    return;
  }

  if (params.newOriginOnLoop) {
    resetBurn();
  } else {
    r = -2;
    params.progress = 0;
    params.direction = 1;
    burnState = 'BURNING';
    singeBuffer.clear();
  }
  
  if (directionController) directionController.updateDisplay();
  showToast('🔥 Re-igniting photograph');
}

function togglePlayPause() {
  if (params.direction !== 0) {
    params.lastDirection = params.direction;
    params.direction = 0;
    showToast('⏸ Simulation paused');
  } else {
    params.direction = params.lastDirection || 1;
    showToast('▶ Resumed');
  }
  if (directionController) directionController.updateDisplay();
}

function toggleBurnDirection() {
  if (params.direction === 0) {
    params.direction = 1;
  } else {
    params.direction = -params.direction;
  }
  burnState = params.direction > 0 ? 'BURNING' : 'UNBURNING';
  if (directionController) directionController.updateDisplay();
  showToast(params.direction > 0 ? '🔥 Direction: Burning forward' : '✨ Direction: Unburning (Reverse)');
}

// ============================================================================
// PARTICLE EMITTER & ACCUMULATIVE SINGE MARKS
// ============================================================================

function spawnParticles() {
  // Density adjustment
  const interval = map(r, 0, 300, TAU / (90 * params.particleDensity), TAU / (480 * params.particleDensity), true);

  for (let a = 0; a <= TAU; a += interval) {
    // Exact noise formula from the source snippet:
    let x = cos(a) * r * (1 + noise(2 * TAU + a * sin(a), frameCount / 80));
    let y = sin(a) * r * (1 + noise(TAU + a * sin(2 * a), frameCount / 80));
    let sw = random(paper.height / 80, paper.height / 180);
    x = start.x + x + random(-sw / 2, sw / 2);
    y = start.y + y + random(-sw / 2, sw / 2);

    // Filter by burn boundary
    if (params.burnTarget === 'Earth Disk Only') {
      const earthRadius = Math.min(paper.width, paper.height) * 0.41;
      if (dist(x, y, 0, 0) > earthRadius) continue;
    } else {
      // Burn entire photograph
      if (abs(x) > paper.width / 2 || abs(y) > paper.height / 2) continue;
    }

    let pos = createVector(x, y);
    let f = random(180, 255);
    let isReverse = (burnState === 'UNBURNING');
    let p = new Particle(pos, f, sw, isReverse);
    particles.push(p);

    // Singe the paper along the flame front
    if (burnState === 'BURNING') {
      p.singe();
    }
  }
}

class Particle {
  constructor(pos, f, sw, isReverse = false) {
    this.pos = pos;
    this.f = f;
    this.alive = true;
    this.type = random([0, 0, 0, 1, 1, 2]);
    this.sw = sw;
    this.isReverse = isReverse;
  }

  show() {
    // Exact source snippet noise drift formula:
    let drift = createVector(
      noise(width + this.pos.x / 50, height + this.pos.y / 50, frameCount / 100) / 2,
      noise(height + this.pos.y / 50, width + this.pos.x / 50, frameCount / 10)
    ).mult(random(-8, -1) * noise(frameCount / 30) * (height / 400) * params.driftForce);

    if (this.isReverse && params.phoenixSparksInReverse) {
      // Elegant phoenix spiraling upward drift in reverse
      drift.y *= 1.35;
      drift.x += sin(frameCount * 0.1 + this.pos.y * 0.05) * 1.5;
    }

    this.pos.add(drift);
    this.f *= (0.9 / params.particleLife);

    push();
    translate(this.pos);

    // Render particle based on selected ember palette & direction
    this.renderColor();

    strokeWeight(this.sw);
    point(0, 0);
    pop();
  }

  renderColor() {
    const f = this.f;

    if (this.isReverse && params.phoenixSparksInReverse) {
      // Celestial phoenix spark palette during unburn/revival
      if (this.type === 0) stroke(140, 220, 255, 2.2 * f); // Ethereal cyan/diamond
      else if (this.type === 1) stroke(255, 195, 60, 2.0 * f); // Warm revival gold
      else stroke(60, 100, 180, f * 0.8); // Deep lapis ash
      return;
    }

    switch (params.emberPalette) {
      case 'Solar Gold':
        if (this.type === 0) stroke(255, 220, 80, 2.2 * f);
        else if (this.type === 1) stroke(255, 140, 20, 2.0 * f);
        else stroke(40, 20, 0, f * 0.9);
        break;

      case 'Phoenix Celestial':
        if (this.type === 0) stroke(80, 210, 255, 2.2 * f);
        else if (this.type === 1) stroke(240, 140, 255, 2.0 * f);
        else stroke(20, 10, 40, f * 0.9);
        break;

      case 'Emerald Biofire':
        if (this.type === 0) stroke(120, 255, 150, 2.2 * f);
        else if (this.type === 1) stroke(40, 200, 120, 2.0 * f);
        else stroke(10, 40, 20, f * 0.9);
        break;

      case 'Cyber Neon':
        if (this.type === 0) stroke(0, 255, 240, 2.2 * f);
        else if (this.type === 1) stroke(255, 0, 128, 2.0 * f);
        else stroke(15, 10, 30, f * 0.9);
        break;

      case 'Infernal Crimson':
        if (this.type === 0) stroke(255, 60, 20, 2.2 * f);
        else if (this.type === 1) stroke(220, 20, 50, 2.0 * f);
        else stroke(0, f);
        break;

      case 'Classic Fiery':
      default:
        // Exact original source coloring:
        if (this.type === 0) stroke(1.5 * f, f / 2, 12, 2 * f);
        else if (this.type === 1) stroke(f, f / 2, 12, 2 * f);
        else stroke(0, f);
        break;
    }
  }

  singe() {
    // Exact singe mark logic preserved onto singeBuffer:
    singeBuffer.push();
    singeBuffer.strokeWeight(paper.height / 60);
    singeBuffer.translate(paper.width / 2, paper.height / 2);
    singeBuffer.translate(this.pos);
    singeBuffer.stroke(20, random(params.scorchDarkness * 0.6, params.scorchDarkness * 1.2));
    singeBuffer.point(0, 0);
    singeBuffer.pop();
  }
}

// ============================================================================
// COMPOSITED PAPER RENDERING (BURNOUT HOLE & BIDIRECTIONAL MASK)
// ============================================================================

function renderCompositedPaper() {
  paper.clear();

  // 1. Base unburned photograph
  paper.image(cleanPaper, paper.width / 2, paper.height / 2);

  // If burn hasn't started or has fully shrunk back, return pristine
  if (r <= 0) return;

  const ctx = paper.drawingContext;
  const pw = paper.width;
  const ph = paper.height;
  const cx = pw / 2 + start.x;
  const cy = ph / 2 + start.y;

  // 2. Build the jagged flame perimeter polygon
  const steps = 140;
  const outerPoly = [];
  const innerPoly = [];
  const holeRadiusOffset = params.burnHole ? params.scorchWidth : 0;

  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const nOuterX = 1 + noise(2 * TAU + a * sin(a), frameCount / 80);
    const nOuterY = 1 + noise(TAU + a * sin(2 * a), frameCount / 80);

    const ox = cx + cos(a) * r * nOuterX;
    const oy = cy + sin(a) * r * nOuterY;
    outerPoly.push({ x: ox, y: oy });

    if (params.burnHole) {
      const innerR = Math.max(0, r - holeRadiusOffset);
      const ix = cx + cos(a) * innerR * nOuterX;
      const iy = cy + sin(a) * innerR * nOuterY;
      innerPoly.push({ x: ix, y: iy });
    }
  }

  // 3. Cut out the burned void hole (reveals dark space beneath paper)
  if (params.burnHole && r > holeRadiusOffset) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(innerPoly[0].x, innerPoly[0].y);
    for (let i = 1; i < innerPoly.length; i++) {
      ctx.lineTo(innerPoly[i].x, innerPoly[i].y);
    }
    ctx.closePath();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#000000';
    ctx.fill();
    ctx.restore();
  }

  // 4. Draw singe buffer masked to current radius r
  // This ensures ping-pong unburn cleanly reveals clean paper as r shrinks!
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(outerPoly[0].x, outerPoly[0].y);
  for (let i = 1; i < outerPoly.length; i++) {
    ctx.lineTo(outerPoly[i].x, outerPoly[i].y);
  }
  ctx.closePath();
  ctx.clip(); // Mask to current flame radius

  // Composite singe marks
  ctx.drawImage(singeBuffer.canvas, 0, 0);

  // Add scorched charred edge gradient
  ctx.lineWidth = Math.max(3, params.scorchWidth * 0.4);
  ctx.strokeStyle = 'rgba(28, 14, 8, 0.75)';
  ctx.stroke();

  // Subtle glowing ember rim along the flame front
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = (burnState === 'UNBURNING') ? 'rgba(100, 200, 255, 0.8)' : 'rgba(255, 140, 20, 0.85)';
  ctx.stroke();

  ctx.restore();
}

function drawDeepSpaceAmbience() {
  // Delicate ambient space dust outside the photograph
  push();
  stroke(255, 255, 255, 30);
  strokeWeight(1);
  for (let i = 0; i < 35; i++) {
    const sx = (noise(i * 12.3, frameCount * 0.001) * width);
    const sy = (noise(i * 45.6, frameCount * 0.001) * height);
    point(sx, sy);
  }
  pop();
}

// ============================================================================
// PROCEDURAL PLANETARY TEXTURE GENERATOR
// ============================================================================

function regeneratePlanetTexture() {
  const size = 640;
  const pg = createGraphics(size, size);
  pg.pixelDensity(1);
  pg.imageMode(CENTER);

  const cx = size / 2;
  const cy = size / 2;
  const R = size * 0.44;

  // 1. Soft atmospheric Rayleigh limb glow
  const grad = pg.drawingContext.createRadialGradient(cx, cy, R * 0.95, cx, cy, R * 1.06);
  getAtmosphereGlowColors(grad);
  pg.drawingContext.fillStyle = grad;
  pg.noStroke();
  pg.circle(cx, cy, R * 2.12);

  // 2. High-performance procedural pixel synthesis for the planetary disk
  pg.loadPixels();
  const d = pg.pixelDensity();
  const totalPixels = 4 * (size * d) * (size * d);
  const pixels = pg.pixels;

  // Sun directional light vector (upper-left)
  const lx = -0.42;
  const ly = -0.52;
  const lz = 0.74;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nx = (x - cx) / R;
      const ny = (y - cy) / R;
      const distSq = nx * nx + ny * ny;

      if (distSq > 1.0) continue; // Outside planet sphere

      const nz = Math.sqrt(1.0 - distSq); // Spherical 3D surface normal

      // Diffuse sunlight calculation
      const dotL = Math.max(0.04, nx * lx + ny * ly + nz * lz);

      // Specular ocean sun glint
      const hx = lx;
      const hy = ly;
      const hz = lz + 1.0;
      const hLen = Math.sqrt(hx * hx + hy * hy + hz * hz);
      const dotH = Math.max(0.0, (nx * hx + ny * hy + nz * hz) / hLen);
      const specular = Math.pow(dotH, 20);

      // Procedural color mapping by theme
      const col = evaluatePlanetPixel(nx, ny, nz, dotL, specular, distSq);

      const idx = 4 * (y * size + x);
      pixels[idx]     = col.r;
      pixels[idx + 1] = col.g;
      pixels[idx + 2] = col.b;
      pixels[idx + 3] = 255;
    }
  }
  pg.updatePixels();

  planetImg = pg;
}

function getAtmosphereGlowColors(grad) {
  switch (params.theme) {
    case 'Solar Flare':
      grad.addColorStop(0, 'rgba(255, 120, 20, 0.6)');
      grad.addColorStop(0.5, 'rgba(255, 60, 0, 0.3)');
      grad.addColorStop(1, 'rgba(200, 20, 0, 0)');
      break;
    case 'Red Planet Mars':
      grad.addColorStop(0, 'rgba(220, 100, 60, 0.45)');
      grad.addColorStop(0.5, 'rgba(160, 60, 40, 0.2)');
      grad.addColorStop(1, 'rgba(100, 30, 20, 0)');
      break;
    case 'Emerald Gaia':
      grad.addColorStop(0, 'rgba(50, 230, 160, 0.5)');
      grad.addColorStop(0.5, 'rgba(20, 160, 100, 0.25)');
      grad.addColorStop(1, 'rgba(10, 80, 50, 0)');
      break;
    case 'Neptune Azure':
      grad.addColorStop(0, 'rgba(40, 140, 255, 0.6)');
      grad.addColorStop(0.5, 'rgba(10, 80, 220, 0.3)');
      grad.addColorStop(1, 'rgba(0, 30, 120, 0)');
      break;
    case 'Cyberpunk Grid':
      grad.addColorStop(0, 'rgba(0, 240, 255, 0.5)');
      grad.addColorStop(0.5, 'rgba(255, 0, 180, 0.25)');
      grad.addColorStop(1, 'rgba(120, 0, 200, 0)');
      break;
    case 'Antique Parchment':
      grad.addColorStop(0, 'rgba(180, 140, 90, 0.35)');
      grad.addColorStop(1, 'rgba(80, 60, 40, 0)');
      break;
    case 'Molten Magma':
      grad.addColorStop(0, 'rgba(255, 90, 10, 0.6)');
      grad.addColorStop(1, 'rgba(80, 10, 0, 0)');
      break;
    case 'Meteosat Earth':
    case 'Earth at Night':
    default:
      // Iconic Meteosat-12 Sapphire blue atmosphere limb
      grad.addColorStop(0, 'rgba(64, 160, 255, 0.55)');
      grad.addColorStop(0.5, 'rgba(24, 90, 220, 0.28)');
      grad.addColorStop(1, 'rgba(10, 40, 160, 0)');
      break;
  }
}

function evaluatePlanetPixel(nx, ny, nz, dotL, specular, distSq) {
  const limbDarkening = Math.pow(nz, 0.65);
  const theme = params.theme;

  // 1. Meteosat-12 Earth from Space (Equinox Noon)
  if (theme === 'Meteosat Earth') {
    // 3D Spherical continent elevation noise
    const elev = noise(nx * 2.8 + 20, ny * 2.8 + 20, nz * 2.8 + 20) +
                 0.4 * noise(nx * 6.5 + 40, ny * 6.5 + 40, nz * 6.5 + 40);

    // Weather & Cloud band noise
    const cloud = noise(nx * 3.4 + 80, ny * 3.4 + 80, nz * 3.4 + 80) +
                  0.35 * noise(nx * 8.0 + 120, ny * 8.0 + 120, nz * 8.0 + 120);

    let r, g, b;

    if (elev < 0.54) {
      // Ocean (Deep blue with coastal turquoise shelf)
      const shelf = map(elev, 0.48, 0.54, 0, 1, true);
      r = lerp(12, 26, shelf);
      g = lerp(55, 120, shelf);
      b = lerp(125, 155, shelf);

      // Add specular glint to water
      r += specular * 180;
      g += specular * 200;
      b += specular * 230;
    } else {
      // Landmass (Lush green, savannah ochre, desert sand, snow mountains)
      const landFrac = (elev - 0.54) / 0.46;
      if (Math.abs(ny) > 0.82) {
        // Polar ice caps
        r = 230; g = 240; b = 250;
      } else if (landFrac < 0.35) {
        // Coastal vegetation
        r = 45; g = 105; b = 48;
      } else if (landFrac < 0.65) {
        // Savannah / Desert
        r = 158; g = 135; b = 82;
      } else {
        // Mountain rock & snow summits
        r = 195; g = 198; b = 205;
      }
    }

    // Apply cloud layers & shadows
    if (cloud > 0.56) {
      const cDense = map(cloud, 0.56, 0.88, 0.1, 1.0, true);
      r = lerp(r, 245, cDense);
      g = lerp(g, 248, cDense);
      b = lerp(b, 255, cDense);
    }

    // Atmospheric limb scattering
    const atmosphereLimb = Math.pow(1.0 - nz, 3.2);
    r = lerp(r * dotL, 90, atmosphereLimb);
    g = lerp(g * dotL, 170, atmosphereLimb);
    b = lerp(b * dotL, 255, atmosphereLimb);

    return {
      r: Math.min(255, Math.max(0, Math.round(r))),
      g: Math.min(255, Math.max(0, Math.round(g))),
      b: Math.min(255, Math.max(0, Math.round(b)))
    };
  }

  // 2. Earth at Night
  if (theme === 'Earth at Night') {
    const elev = noise(nx * 2.8 + 20, ny * 2.8 + 20, nz * 2.8 + 20);
    const cityNoise = noise(nx * 14.0 + 30, ny * 14.0 + 30, nz * 14.0 + 30);
    let r = 8, g = 14, b = 28;

    if (elev >= 0.54 && cityNoise > 0.58) {
      // Clustering golden city lights
      const intensity = map(cityNoise, 0.58, 0.85, 0.3, 1.0, true);
      r = 255 * intensity;
      g = 190 * intensity;
      b = 80 * intensity;
    }
    return {
      r: Math.min(255, Math.max(0, Math.round(r))),
      g: Math.min(255, Math.max(0, Math.round(g))),
      b: Math.min(255, Math.max(0, Math.round(b)))
    };
  }

  // 3. Solar Flare
  if (theme === 'Solar Flare') {
    const plasma = noise(nx * 5.0 + frameCount * 0.01, ny * 5.0, nz * 5.0) +
                   0.5 * noise(nx * 12.0, ny * 12.0, nz * 12.0);
    const r = map(plasma, 0.4, 1.2, 210, 255, true);
    const g = map(plasma, 0.4, 1.2, 40, 220, true);
    const b = map(plasma, 0.4, 1.2, 5, 40, true);
    return {
      r: Math.min(255, Math.max(0, Math.round(r))),
      g: Math.min(255, Math.max(0, Math.round(g))),
      b: Math.min(255, Math.max(0, Math.round(b)))
    };
  }

  // 4. Red Planet Mars
  if (theme === 'Red Planet Mars') {
    const elev = noise(nx * 3.5 + 50, ny * 3.5 + 50, nz * 3.5 + 50);
    if (Math.abs(ny) > 0.86) return { r: 240, g: 240, b: 248 }; // Dry ice cap
    const r = lerp(160, 230, elev) * dotL;
    const g = lerp(60, 110, elev) * dotL;
    const b = lerp(35, 65, elev) * dotL;
    return {
      r: Math.min(255, Math.max(0, Math.round(r))),
      g: Math.min(255, Math.max(0, Math.round(g))),
      b: Math.min(255, Math.max(0, Math.round(b)))
    };
  }

  // 5. Emerald Gaia
  if (theme === 'Emerald Gaia') {
    const elev = noise(nx * 3.2 + 10, ny * 3.2 + 10, nz * 3.2 + 10);
    let r, g, b;
    if (elev < 0.52) {
      r = 10 * dotL; g = 80 * dotL; b = 110 * dotL; // Bioluminescent ocean
    } else {
      r = 25 * dotL; g = 180 * dotL; b = 80 * dotL; // Alien viridian canopy
    }
    return {
      r: Math.min(255, Math.max(0, Math.round(r))),
      g: Math.min(255, Math.max(0, Math.round(g))),
      b: Math.min(255, Math.max(0, Math.round(b)))
    };
  }

  // 6. Neptune Azure
  if (theme === 'Neptune Azure') {
    const bands = noise(ny * 12.0 + 20, nx * 2.0);
    const r = (15 + bands * 25) * dotL;
    const g = (60 + bands * 75) * dotL;
    const b = (170 + bands * 85) * dotL;
    return {
      r: Math.min(255, Math.max(0, Math.round(r))),
      g: Math.min(255, Math.max(0, Math.round(g))),
      b: Math.min(255, Math.max(0, Math.round(b)))
    };
  }

  // 7. Cyberpunk Grid
  if (theme === 'Cyberpunk Grid') {
    const gridLat = Math.abs(Math.sin(ny * 25.0));
    const gridLon = Math.abs(Math.sin(Math.atan2(nx, nz) * 16.0));
    const isLine = (gridLat > 0.94 || gridLon > 0.94);
    if (isLine) return { r: 0, g: 240, b: 255 };
    const elev = noise(nx * 3.0, ny * 3.0, nz * 3.0);
    if (elev > 0.58) return { r: 180, g: 0, b: 140 };
    return { r: 10, g: 14, b: 28 };
  }

  // 8. Antique Parchment
  if (theme === 'Antique Parchment') {
    const elev = noise(nx * 3.0 + 30, ny * 3.0 + 30, nz * 3.0 + 30);
    if (elev > 0.54) return { r: 198, g: 172, b: 130 }; // Old paper land
    return { r: 154, g: 134, b: 98 }; // Stippled sea
  }

  // 9. Molten Magma
  if (theme === 'Molten Magma') {
    const cracks = noise(nx * 9.0 + 8, ny * 9.0 + 8, nz * 9.0 + 8);
    if (cracks > 0.62) return { r: 255, g: 160, b: 20 }; // Lava rivers
    return { r: 35 * dotL, g: 22 * dotL, b: 20 * dotL }; // Basalt crust
  }

  return { r: 120, g: 120, b: 120 };
}

// ============================================================================
// RANDOMIZATION ENGINE (Requirement 6)
// ============================================================================

function triggerRandomize() {
  // Re-roll visual theme
  const otherThemes = THEMES.filter(t => t !== params.theme);
  params.theme = random(otherThemes);

  // Re-roll geometric and motion parameters
  params.speed = random([0.8, 1.0, 1.2, 1.5, 1.8]);
  params.scorchWidth = Math.round(random(20, 50));
  params.driftForce = random(0.6, 1.6);
  params.particleDensity = random(0.7, 1.5);
  params.emberPalette = random(PALETTES);

  // Regenerate planet texture & paper
  regeneratePlanetTexture();
  initializePaper();
  resetBurn();

  // Synchronize lil-gui controllers so UI reflects new procedural state
  if (gui) {
    gui.controllersRecursive().forEach(c => c.updateDisplay());
  }

  showToast(`🎲 Procedural Variation: ${params.theme}`);
}

// ============================================================================
// DOM EVENTS, CLICK HANDLING & HUD INTERACTIVITY
// ============================================================================

function setupDOMListeners() {
  const container = document.getElementById('canvas-container');

  // Click on scene interaction
  container.addEventListener('pointerdown', (e) => {
    // Ignore clicks on HUD or GUI
    if (e.target.closest('#hud') || e.target.closest('.lil-gui')) return;

    if (params.randomizeOnClick && params.clickAction === 'Randomize Variation') {
      triggerRandomize();
    } else {
      // Set ignition point right at mouse coordinates
      const rect = container.getBoundingClientRect();
      const mouseCanvasX = e.clientX - rect.left - width / 2;
      const mouseCanvasY = e.clientY - rect.top - height / 2;

      // Bound within paper
      const hw = paper.width / 2;
      const hh = paper.height / 2;
      if (Math.abs(mouseCanvasX) <= hw && Math.abs(mouseCanvasY) <= hh) {
        resetBurn(createVector(mouseCanvasX, mouseCanvasY));
        showToast('🔥 Ignition point set at click');
      } else {
        triggerRandomize();
      }
    }
  });

  // HUD Buttons
  document.getElementById('btn-playpause').addEventListener('click', togglePlayPause);
  document.getElementById('btn-reverse').addEventListener('click', toggleBurnDirection);
  document.getElementById('btn-randomize').addEventListener('click', triggerRandomize);
  document.getElementById('btn-regen').addEventListener('click', () => {
    resetBurn();
    showToast('⟲ Re-ignited');
  });
  document.getElementById('btn-save').addEventListener('click', saveCanvasSnapshot);
  document.getElementById('btn-fs').addEventListener('click', toggleFullscreen);

  // File upload handler
  const fileInput = document.getElementById('file-input');
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      loadImage(event.target.result, (loaded) => {
        planetImg = loaded;
        customImageLoaded = true;
        initializePaper();
        resetBurn();
        showToast(`📷 Custom photograph loaded: ${file.name}`);
      });
    };
    reader.readAsDataURL(file);
  });

  // Drag & drop support
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      const file = e.dataTransfer.files[0];
      const reader = new FileReader();
      reader.onload = (event) => {
        loadImage(event.target.result, (loaded) => {
          planetImg = loaded;
          customImageLoaded = true;
          initializePaper();
          resetBurn();
          showToast(`📷 Dropped photograph loaded`);
        });
      };
      reader.readAsDataURL(file);
    }
  });

  // HUD Idle fade handling
  const resetIdleTimer = () => {
    const hud = document.getElementById('hud');
    hud.classList.remove('idle');
    clearTimeout(hudIdleTimer);
    hudIdleTimer = setTimeout(() => hud.classList.add('idle'), 3500);
  };
  window.addEventListener('pointermove', resetIdleTimer);
  resetIdleTimer();
}

function updateHUD() {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  const playBtnText = document.getElementById('btn-playpause-text');
  const pct = Math.round(params.progress * 100);

  playBtnText.innerText = (params.direction === 0) ? 'Play' : 'Pause';

  dot.className = 'status-dot';

  if (params.direction === 0) {
    dot.classList.add('paused');
    txt.innerText = `⏸ Paused • ${pct}%`;
  } else if (burnState === 'BURNING') {
    txt.innerText = `🔥 Burning • ${pct}%`;
  } else if (burnState === 'BURNOUT_HOLD') {
    txt.innerText = `⏳ Burnout complete`;
  } else if (burnState === 'UNBURNING') {
    dot.classList.add('unburning');
    txt.innerText = `✨ Unburning • ${pct}%`;
  } else if (burnState === 'RESTORED_HOLD') {
    dot.classList.add('restored');
    txt.innerText = `✨ Restored pristine`;
  }
}

// ============================================================================
// TOAST NOTIFICATIONS & UTILITIES
// ============================================================================

let toastTimeout = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toast-msg');
  toastMsg.innerText = msg;
  toast.classList.add('toast-visible');

  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('toast-visible');
  }, 2400);
}

function saveCanvasSnapshot() {
  saveCanvas(`beautiful-burnout-${Date.now()}`, 'png');
  showToast('💾 High-resolution snapshot saved');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    showToast('⛶ Fullscreen enabled');
  } else {
    document.exitFullscreen().catch(() => {});
    showToast('⛶ Exited fullscreen');
  }
}
  </script>
