        // --- APPLICATION PARAMETERS ---
        const params = {

            animSpeed: 1.0,

            pulseColor: COLOR_SCHEMES['Original'].pulse,
            foliageColor: COLOR_SCHEMES['Original'].foliage,
            branchColor: COLOR_SCHEMES['Original'].branch,
            rockColor: COLOR_SCHEMES['Original'].rock,

            // Lighting & Atmosphere
            exposure: 1.0,
            sceneLightIntensity: 1.0,
            ambientIntensity: 0.45,
            ambientColor: COLOR_SCHEMES['Original'].ambient,
            dirIntensity: 0.85,
            dirColor: COLOR_SCHEMES['Original'].dir,
            dirPosX: 35.0,
            dirPosY: 50.0,
            dirPosZ: 25.0,
            pulseLightIntensity: 2.2,
            pulseLightColor: COLOR_SCHEMES['Original'].pulseLight,
            pulseLightDistance: 90.0,
            fillLightIntensity: 0.4,
            fillLightColor: COLOR_SCHEMES['Original'].fillLight,

            // Procedural Forest & Scanner
            pointSize: 3.5,
            noiseIntensity: 1.6,
            pulseSpeed: 1.0,
            pulseWidth: 3.2,
            maxRadius: 75.0,
            treeCount: 14,
            rockCount: 12,
            terrainResolution: 65,
            undergrowthCount: 7500
        };

        // --- CORE THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.2, 800);
        camera.position.set(0, 18, 44);

        let renderer = new THREE.WebGLRenderer({
            antialias: params.antialias,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(params.dpr);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = params.exposure;
        document.body.appendChild(renderer.domElement);

        // --- SCENE ROOT CONTAINER ---
        const forestRoot = new THREE.Group();
        scene.add(forestRoot);

        // --- LIGHT SOURCES ---
        const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity * params.sceneLightIntensity);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(params.dirColor, params.dirIntensity * params.sceneLightIntensity);
        dirLight.position.set(params.dirPosX, params.dirPosY, params.dirPosZ);
        scene.add(dirLight);

        const pulsePointLight = new THREE.PointLight(
            params.pulseLightColor,
            params.pulseLightIntensity * params.sceneLightIntensity,
            params.pulseLightDistance
        );
        pulsePointLight.position.set(0, 5, 0);
        scene.add(pulsePointLight);

        const fillLight = new THREE.PointLight(
            params.fillLightColor,
            params.fillLightIntensity * params.sceneLightIntensity,
            70
        );
        fillLight.position.set(-25, 12, -20);
        scene.add(fillLight);

        // --- SHADER UNIFORMS ---
        const shaderUniforms = {
            u_time: { value: 0.0 },
            u_pointSize: { value: params.pointSize },
            u_pulseCenter: { value: new THREE.Vector3(0, 4, 0) },
            u_pulseRadius: { value: 0.0 },
            u_pulseWidth: { value: params.pulseWidth },
            u_pulseEnvelope: { value: 0.0 },
            u_noiseIntensity: { value: params.noiseIntensity },
            u_pulseColor: { value: new THREE.Color(params.pulseColor) },
            u_unscannedColor: { value: new THREE.Color(params.unscannedColor) },
            u_lightIntensity: { value: params.sceneLightIntensity },
            u_exposure: { value: params.exposure }
        };

        // --- PROCEDURAL GLSL SHADERS ---
        // Points Shader: vertex points perturbed by noise when outside sonic pulse; within pulse, sharp & warm gold
        const pointsVertexShader = `
            uniform float u_time;
            uniform float u_pointSize;
            uniform vec3 u_pulseCenter;
            uniform float u_pulseRadius;
            uniform float u_pulseWidth;
            uniform float u_pulseEnvelope;
            uniform float u_noiseIntensity;

            attribute vec3 a_customColor;
            attribute float a_type; // 0=foliage, 1=trunk/bark, 2=ground, 3=rock, 4=air dust

            varying vec3 vWorldPos;
            varying vec3 vColor;
            varying float vDistToPulse;
            varying float vInside;
            varying float vType;

            // Fast high-quality 3D hash
            float hash3(vec3 p) {
                p = fract(p * 0.3183099 + 0.1);
                p *= 17.0;
                return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }

            void main() {
                vType = a_type;
                vColor = a_customColor;
                vec3 pos = position;

                // Spherical sonic distance from pulse center
                float dist = length(pos - u_pulseCenter);
                vDistToPulse = dist;

                // Inside sphere illumination factor: smoothly modulated by u_pulseEnvelope
                float rawInside = smoothstep(u_pulseRadius + 1.5, u_pulseRadius - 4.5, dist);
                float inside = rawInside * u_pulseEnvelope;
                vInside = inside;

                // Outside pulse: forest dissolves into loose, dim field of noise
                if (inside < 0.999) {
                    float noiseWeight = (1.0 - inside) * u_noiseIntensity;
                    vec3 noiseOffset = vec3(
                        hash3(pos + vec3(1.13, 2.37, 3.71)) - 0.5,
                        hash3(pos + vec3(4.81, 5.19, 6.43)) - 0.5,
                        hash3(pos + vec3(7.27, 8.65, 9.09)) - 0.5
                    ) * noiseWeight;
                    pos += noiseOffset;
                }

                // Gentle natural foliage sway
                if (a_type < 0.5) {
                    pos.x += sin(u_time * 1.6 + pos.y * 0.6 + pos.z * 0.2) * 0.12;
                    pos.z += cos(u_time * 1.3 + pos.x * 0.5 + pos.y * 0.3) * 0.12;
                } else if (a_type > 3.5) { // airborne dust drifting
                    pos.y += sin(u_time * 0.8 + pos.x) * 0.4;
                    pos.x += cos(u_time * 0.6 + pos.z) * 0.4;
                }

                vec4 worldPos = modelMatrix * vec4(pos, 1.0);
                vWorldPos = worldPos.xyz;

                vec4 mvPosition = viewMatrix * worldPos;
                gl_Position = projectionMatrix * mvPosition;

                // Anti-aliased point size attenuation with distance
                float pSize = u_pointSize * (150.0 / max(-mvPosition.z, 0.1));

                // Pulsing wavefront expansion modulated by envelope
                float waveDist = abs(dist - u_pulseRadius);
                float wave = exp(-pow(waveDist / u_pulseWidth, 2.0)) * u_pulseEnvelope;
                pSize *= (1.0 + wave * 0.6);

                if (a_type < 0.5) pSize *= 0.85;
                else if (a_type > 3.5) pSize *= 0.65;

                gl_PointSize = clamp(pSize, 1.2, 20.0);
            }
        `;

        const pointsFragmentShader = `
            uniform vec3 u_pulseColor;
            uniform vec3 u_unscannedColor;
            uniform float u_pulseRadius;
            uniform float u_pulseWidth;
            uniform float u_pulseEnvelope;
            uniform float u_lightIntensity;
            uniform float u_exposure;

            varying vec3 vWorldPos;
            varying vec3 vColor;
            varying float vDistToPulse;
            varying float vInside;
            varying float vType;

            void main() {
                // Circular lidar point sprite
                vec2 pt = gl_PointCoord - vec2(0.5);
                float r = length(pt);
                if (r > 0.5) discard;
                float circleAlpha = smoothstep(0.5, 0.22, r);

                // Spherical sonic pulse wavefront smoothly attenuated by envelope
                float waveDist = abs(vDistToPulse - u_pulseRadius);
                float wave = exp(-pow(waveDist / u_pulseWidth, 2.0)) * u_pulseEnvelope;

                // Subtle harmonic ripple echoes within active wave
                float ripple = sin(vDistToPulse * 0.7 - u_pulseRadius * 0.5) * 0.5 + 0.5;
                wave += ripple * 0.12 * vInside;

                // Color interpolation: outside is loose dim unscanned noise, inside is crisp rich foliage/tree color
                vec3 baseColor = mix(u_unscannedColor, vColor, vInside);

                // Wavefront glows with sonic pulse color
                vec3 finalColor = mix(baseColor, u_pulseColor, wave);
                finalColor += u_pulseColor * (wave * 1.5);

                // Illumination scale
                finalColor *= (0.35 + vInside * 0.65 + wave * 1.3) * u_lightIntensity * u_exposure;

                // Alpha modulation: dim noise outside, detailed solid points inside
                float alpha = mix(0.20, 0.95, vInside);
                alpha = max(alpha, wave);
                alpha *= circleAlpha;

                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        // Lines Shader: renders the structural connected branches and rock wireframes
        const linesVertexShader = `
            uniform float u_time;
            uniform vec3 u_pulseCenter;
            uniform float u_pulseRadius;
            uniform float u_pulseWidth;
            uniform float u_pulseEnvelope;
            uniform float u_noiseIntensity;

            attribute vec3 a_customColor;
            attribute float a_type;

            varying vec3 vWorldPos;
            varying vec3 vColor;
            varying float vDistToPulse;
            varying float vInside;

            float hash3(vec3 p) {
                p = fract(p * 0.3183099 + 0.1);
                p *= 17.0;
                return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }

            void main() {
                vColor = a_customColor;
                vec3 pos = position;

                float dist = length(pos - u_pulseCenter);
                vDistToPulse = dist;

                float rawInside = smoothstep(u_pulseRadius + 1.5, u_pulseRadius - 4.5, dist);
                float inside = rawInside * u_pulseEnvelope;
                vInside = inside;

                if (inside < 0.999) {
                    float noiseWeight = (1.0 - inside) * u_noiseIntensity;
                    vec3 noiseOffset = vec3(
                        hash3(pos + vec3(1.13, 2.37, 3.71)) - 0.5,
                        hash3(pos + vec3(4.81, 5.19, 6.43)) - 0.5,
                        hash3(pos + vec3(7.27, 8.65, 9.09)) - 0.5
                    ) * noiseWeight;
                    pos += noiseOffset;
                }

                vec4 worldPos = modelMatrix * vec4(pos, 1.0);
                vWorldPos = worldPos.xyz;

                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `;

        const linesFragmentShader = `
            uniform vec3 u_pulseColor;
            uniform vec3 u_unscannedColor;
            uniform float u_pulseRadius;
            uniform float u_pulseWidth;
            uniform float u_pulseEnvelope;
            uniform float u_lightIntensity;
            uniform float u_exposure;

            varying vec3 vWorldPos;
            varying vec3 vColor;
            varying float vDistToPulse;
            varying float vInside;

            void main() {
                float waveDist = abs(vDistToPulse - u_pulseRadius);
                float wave = exp(-pow(waveDist / u_pulseWidth, 2.0)) * u_pulseEnvelope;

                vec3 baseColor = mix(u_unscannedColor * 0.8, vColor, vInside);
                vec3 finalColor = mix(baseColor, u_pulseColor, wave);
                finalColor += u_pulseColor * (wave * 1.5);

                finalColor *= (0.35 + vInside * 0.65 + wave * 1.3) * u_lightIntensity * u_exposure;
                float alpha = mix(0.18, 0.90, vInside);
                alpha = max(alpha, wave);

                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        // Create Materials
        const pointsMaterial = new THREE.ShaderMaterial({
            vertexShader: pointsVertexShader,
            fragmentShader: pointsFragmentShader,
            uniforms: shaderUniforms,
            transparent: true,
            depthWrite: false,
            blending: THREE.NormalBlending
        });

        const linesMaterial = new THREE.ShaderMaterial({
            vertexShader: linesVertexShader,
            fragmentShader: linesFragmentShader,
            uniforms: shaderUniforms,
            transparent: true,
            depthWrite: false,
            blending: THREE.NormalBlending
        });

        // --- PROCEDURAL GENERATOR ---
        let pointsMesh = null;
        let linesMesh = null;

        // Deterministic Pseudo-Random Number Generator with seed
        let seed = 12345;
        function random() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }

        function randomRange(min, max) {
            return min + random() * (max - min);
        }

        // Terrain height mathematical synthesis
        function getTerrainHeight(x, z) {
            const h1 = Math.sin(x * 0.06) * Math.cos(z * 0.06) * 3.6;
            const h2 = Math.sin(x * 0.14 + z * 0.1) * 1.5;
            const h3 = Math.cos(x * 0.25 - z * 0.22) * 0.6;
            const mound = Math.exp(-((x * x + z * z) * 0.0006)) * 2.0;
            return h1 + h2 + h3 + mound - 2.5;
        }

        // Procedural Forest Generation
        function buildProceduralForest() {
            if (pointsMesh) forestRoot.remove(pointsMesh);
            if (linesMesh) forestRoot.remove(linesMesh);

            const pointPositions = [];
            const pointColors = [];
            const pointTypes = [];

            const linePositions = [];
            const lineColors = [];
            const lineTypes = [];

            const foliageCol = new THREE.Color(params.foliageColor);
            const branchCol = new THREE.Color(params.branchColor);
            const rockCol = new THREE.Color(params.rockColor);

            // 1. TERRAIN & GROUND LIDAR POINTS
            const res = params.terrainResolution;
            const extent = 50.0;
            const step = (extent * 2.0) / (res - 1);

            for (let i = 0; i < res; i++) {
                const x = -extent + i * step;
                for (let j = 0; j < res; j++) {
                    const z = -extent + j * step;
                    const y = getTerrainHeight(x, z);

                    pointPositions.push(x, y, z);
                    const shade = 0.7 + (y + 5.0) * 0.05;
                    pointColors.push(rockCol.r * shade, rockCol.g * shade, rockCol.b * shade);
                    pointTypes.push(2.0); // ground type

                    // Terrain wireframe connection
                    if (i < res - 1) {
                        const xNext = x + step;
                        const yNext = getTerrainHeight(xNext, z);
                        linePositions.push(x, y, z, xNext, yNext, z);
                        lineColors.push(rockCol.r * 0.5, rockCol.g * 0.5, rockCol.b * 0.5, rockCol.r * 0.5, rockCol.g * 0.5, rockCol.b * 0.5);
                        lineTypes.push(2.0, 2.0);
                    }
                    if (j < res - 1) {
                        const zNext = z + step;
                        const yNext = getTerrainHeight(x, zNext);
                        linePositions.push(x, y, z, x, yNext, zNext);
                        lineColors.push(rockCol.r * 0.5, rockCol.g * 0.5, rockCol.b * 0.5, rockCol.r * 0.5, rockCol.g * 0.5, rockCol.b * 0.5);
                        lineTypes.push(2.0, 2.0);
                    }
                }
            }

            // 2. PROCEDURAL UNDERGROWTH / FERNS / GRASS
            for (let i = 0; i < params.undergrowthCount; i++) {
                const x = randomRange(-extent * 0.9, extent * 0.9);
                const z = randomRange(-extent * 0.9, extent * 0.9);
                const yBase = getTerrainHeight(x, z);
                const ugHeight = randomRange(0.2, 1.8);

                pointPositions.push(x + randomRange(-0.2, 0.2), yBase + ugHeight, z + randomRange(-0.2, 0.2));
                const cVar = randomRange(0.85, 1.25);
                pointColors.push(foliageCol.r * cVar, foliageCol.g * cVar, foliageCol.b * cVar);
                pointTypes.push(0.0); // foliage
            }

            // 3. FRACTALLY GENERATED 3D TREES
            // Recursive Branch Generator
            function generateBranch(start, dir, length, depth, maxDepth) {
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, length);

                // Add branch wireframe line
                linePositions.push(start.x, start.y, start.z, end.x, end.y, end.z);
                lineColors.push(branchCol.r, branchCol.g, branchCol.b, branchCol.r, branchCol.g, branchCol.b);
                lineTypes.push(1.0, 1.0);

                // Add points along branch to simulate lidar bark cross-sections
                const segments = Math.max(3, Math.floor(length * 2.2));
                for (let s = 0; s <= segments; s++) {
                    const t = s / segments;
                    const p = new THREE.Vector3().lerpVectors(start, end, t);
                    const radius = (maxDepth - depth + 1) * 0.08;

                    // Ring points around trunk
                    const ringCount = depth === 0 ? 6 : 3;
                    for (let k = 0; k < ringCount; k++) {
                        const angle = (k / ringCount) * Math.PI * 2.0;
                        const perpX = Math.cos(angle) * radius;
                        const perpZ = Math.sin(angle) * radius;
                        pointPositions.push(p.x + perpX, p.y, p.z + perpZ);
                        pointColors.push(branchCol.r * 0.9, branchCol.g * 0.9, branchCol.b * 0.9);
                        pointTypes.push(1.0); // trunk bark
                    }
                }

                // If terminal or high branch, generate lush fractal foliage points
                if (depth >= maxDepth - 2) {
                    const foliageClusterCount = Math.floor(randomRange(25, 65));
                    for (let f = 0; f < foliageClusterCount; f++) {
                        const spread = (depth / maxDepth) * 2.2;
                        const fx = end.x + (random() - 0.5) * spread;
                        const fy = end.y + (random() - 0.4) * spread;
                        const fz = end.z + (random() - 0.5) * spread;

                        pointPositions.push(fx, fy, fz);
                        const varColor = randomRange(0.8, 1.25);
                        pointColors.push(foliageCol.r * varColor, foliageCol.g * varColor, foliageCol.b * varColor);
                        pointTypes.push(0.0); // foliage
                    }
                }

                // Terminal branch exit
                if (depth >= maxDepth) return;

                // Split into 2 to 4 fractal child branches
                const branchSplits = Math.floor(randomRange(2, 4));
                for (let b = 0; b < branchSplits; b++) {
                    const pitch = randomRange(0.4, 0.85);
                    const yaw = (b / branchSplits) * Math.PI * 2.0 + randomRange(-0.3, 0.3);

                    const newDir = new THREE.Vector3(
                        dir.x + Math.sin(yaw) * Math.sin(pitch),
                        dir.y + Math.cos(pitch) * 0.7,
                        dir.z + Math.cos(yaw) * Math.sin(pitch)
                    ).normalize();

                    const newLength = length * randomRange(0.68, 0.78);
                    generateBranch(end, newDir, newLength, depth + 1, maxDepth);
                }
            }

            // Scatter trees across landscape
            const treeCount = params.treeCount;
            for (let t = 0; t < treeCount; t++) {
                const angle = (t / treeCount) * Math.PI * 2.0 + randomRange(-0.2, 0.2);
                const radius = randomRange(8.0, extent * 0.8);
                const tx = Math.cos(angle) * radius;
                const tz = Math.sin(angle) * radius;
                const ty = getTerrainHeight(tx, tz);

                const treeHeight = randomRange(8.5, 17.0);
                const start = new THREE.Vector3(tx, ty, tz);
                const dir = new THREE.Vector3(randomRange(-0.06, 0.06), 1.0, randomRange(-0.06, 0.06)).normalize();

                generateBranch(start, dir, treeHeight * 0.35, 0, 4);
            }

            // 4. PROCEDURAL CRAGGY ROCKS & BOULDERS
            const rockCount = params.rockCount;
            for (let r = 0; r < rockCount; r++) {
                const rx = randomRange(-extent * 0.75, extent * 0.75);
                const rz = randomRange(-extent * 0.75, extent * 0.75);
                const ry = getTerrainHeight(rx, rz) + 0.3;
                const rockRadius = randomRange(1.8, 5.2);

                const rockGeom = new THREE.IcosahedronGeometry(rockRadius, 1);
                const posAttr = rockGeom.attributes.position;

                // Deform icosahedron into craggy geological boulder
                for (let v = 0; v < posAttr.count; v++) {
                    const vx = posAttr.getX(v);
                    const vy = posAttr.getY(v);
                    const vz = posAttr.getZ(v);

                    const disp = 1.0 + (random() - 0.5) * 0.45;
                    const finalX = rx + vx * disp;
                    const finalY = ry + vy * disp * 0.75;
                    const finalZ = rz + vz * disp;

                    posAttr.setXYZ(v, finalX, finalY, finalZ);

                    pointPositions.push(finalX, finalY, finalZ);
                    pointColors.push(rockCol.r * 1.1, rockCol.g * 1.1, rockCol.b * 1.1);
                    pointTypes.push(3.0); // rock
                }

                // Add boulder wireframe edges
                const wireGeom = new THREE.WireframeGeometry(rockGeom);
                const wirePosAttr = wireGeom.attributes.position;
                for (let w = 0; w < wirePosAttr.count; w += 2) {
                    linePositions.push(
                        wirePosAttr.getX(w), wirePosAttr.getY(w), wirePosAttr.getZ(w),
                        wirePosAttr.getX(w + 1), wirePosAttr.getY(w + 1), wirePosAttr.getZ(w + 1)
                    );
                    lineColors.push(rockCol.r, rockCol.g, rockCol.b, rockCol.r, rockCol.g, rockCol.b);
                    lineTypes.push(3.0, 3.0);
                }
            }

            // 5. AIRBORNE DRIFTING LIDAR DUST PARTICLES
            const dustCount = 2200;
            for (let d = 0; d < dustCount; d++) {
                const dx = randomRange(-extent * 0.8, extent * 0.8);
                const dy = randomRange(1.0, 26.0);
                const dz = randomRange(-extent * 0.8, extent * 0.8);

                pointPositions.push(dx, dy, dz);
                pointColors.push(foliageCol.r * 1.4, foliageCol.g * 1.4, foliageCol.b * 1.4);
                pointTypes.push(4.0); // dust
            }

            // Construct Buffer Geometries
            const pointsGeometry = new THREE.BufferGeometry();
            pointsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(pointPositions, 3));
            pointsGeometry.setAttribute('a_customColor', new THREE.Float32BufferAttribute(pointColors, 3));
            pointsGeometry.setAttribute('a_type', new THREE.Float32BufferAttribute(pointTypes, 1));

            pointsMesh = new THREE.Points(pointsGeometry, pointsMaterial);
            forestRoot.add(pointsMesh);

            const linesGeometry = new THREE.BufferGeometry();
            linesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            linesGeometry.setAttribute('a_customColor', new THREE.Float32BufferAttribute(lineColors, 3));
            linesGeometry.setAttribute('a_type', new THREE.Float32BufferAttribute(lineTypes, 1));

            linesMesh = new THREE.LineSegments(linesGeometry, linesMaterial);
            forestRoot.add(linesMesh);
        }

        // --- THEME & BACKGROUND UPDATER ---
        function updateCanvasBackground() {
            const color = params.greenScreen ? params.greenScreenColor : params.bgColor;
            document.body.style.backgroundColor = color;
            renderer.setClearColor(color, 1.0);
        }

        function applyColorScheme(schemeName) {
            const scheme = COLOR_SCHEMES[schemeName];
            if (!scheme) return;

            params.colorScheme = schemeName;
            params.bgColor = scheme.bg;
            params.pulseColor = scheme.pulse;
            params.foliageColor = scheme.foliage;
            params.branchColor = scheme.branch;
            params.rockColor = scheme.rock;
            params.unscannedColor = scheme.unscanned;

            params.ambientColor = scheme.ambient;
            params.dirColor = scheme.dir;
            params.pulseLightColor = scheme.pulseLight;
            params.fillLightColor = scheme.fillLight;

            updateColorsInScene();
        }

        function updateColorsInScene() {
            updateCanvasBackground();

            shaderUniforms.u_pulseColor.value.set(params.pulseColor);
            shaderUniforms.u_unscannedColor.value.set(params.unscannedColor);

            ambientLight.color.set(params.ambientColor);
            dirLight.color.set(params.dirColor);
            pulsePointLight.color.set(params.pulseLightColor);
            fillLight.color.set(params.fillLightColor);

            // Regenerate geometry colors with current theme
            buildProceduralForest();
        }

        // --- REBUILD RENDERER FOR ANTIALIAS SETTING ---
        function applyAntialiasSetting(antialiasValue) {
            const oldCanvas = renderer.domElement;
            renderer.dispose();

            renderer = new THREE.WebGLRenderer({
                antialias: antialiasValue,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(params.dpr);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = params.exposure;

            oldCanvas.replaceWith(renderer.domElement);
            attachPointerEvents(renderer.domElement);
            updateCanvasBackground();
        }

        // --- RANDOM PROCEDURAL VARIATION ON CLICK ---
        function randomizeProceduralScene() {
            // Pick random color scheme
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

            // Randomize geometric & motion parameters
            seed = Math.floor(Math.random() * 999999);
            params.treeCount = Math.floor(randomRange(10, 20));
            params.rockCount = Math.floor(randomRange(8, 16));
            params.pulseSpeed = randomRange(0.6, 1.8);
            params.pulseWidth = randomRange(2.2, 5.0);
            params.noiseIntensity = randomRange(0.9, 2.5);
            params.pointSize = randomRange(2.5, 4.8);

            // Apply selected theme
            applyColorScheme(randomScheme);

            // Update lil-gui controls dynamically
            gui.controllersRecursive().forEach(controller => controller.updateDisplay());
        }

        // --- VIEW CONTROLS: ZOOM & PAN ---
        function setPan(x, y) {
            params.panX = x;
            params.panY = y;
            forestRoot.position.x = params.panX * 0.04;
            forestRoot.position.y = params.panY * 0.04;
        }

        function setZoom(val) {
            params.zoom = THREE.MathUtils.clamp(val, 0.2, 5.0);
            camera.zoom = params.zoom;
            camera.updateProjectionMatrix();
        }

        // --- POINTER & DRAG/ZOOM EVENTS ---
        let isDragging = false;
        let lastPointerX = 0;
        let lastPointerY = 0;
        let pointerDownX = 0;
        let pointerDownY = 0;
        let pointerDownTime = 0;

        function attachPointerEvents(domElem) {
            domElem.addEventListener('pointerdown', event => {
                if (event.target.closest('.lil-gui')) return;

                isDragging = true;
                lastPointerX = event.clientX;
                lastPointerY = event.clientY;
                pointerDownX = event.clientX;
                pointerDownY = event.clientY;
                pointerDownTime = performance.now();

                document.body.classList.add('dragging');
                domElem.setPointerCapture(event.pointerId);
            });

            domElem.addEventListener('pointermove', event => {
                if (!isDragging) return;

                const deltaX = event.clientX - lastPointerX;
                const deltaY = lastPointerY - event.clientY;

                setPan(params.panX + deltaX, params.panY + deltaY);

                lastPointerX = event.clientX;
                lastPointerY = event.clientY;
            });

            function endDrag(event) {
                if (!isDragging) return;
                isDragging = false;
                document.body.classList.remove('dragging');

                if (event && domElem.hasPointerCapture(event.pointerId)) {
                    domElem.releasePointerCapture(event.pointerId);
                }

                // Check if this was a quick click rather than drag
                const elapsed = performance.now() - pointerDownTime;
                const moveDist = Math.hypot(event.clientX - pointerDownX, event.clientY - pointerDownY);

                if (elapsed < 280 && moveDist < 6.0 && params.randomizeOnClick) {
                    randomizeProceduralScene();
                }
            }

            domElem.addEventListener('pointerup', endDrag);
            domElem.addEventListener('pointercancel', endDrag);
            domElem.addEventListener('lostpointercapture', endDrag);

            domElem.addEventListener('wheel', event => {
                event.preventDefault();
                const zoomFactor = Math.exp(-event.deltaY * 0.0012);
                setZoom(params.zoom * zoomFactor);
            }, { passive: false });
        }

        attachPointerEvents(renderer.domElement);

        // --- KEYBOARD LISTENER (H KEY TO HIDE/SHOW GUI) ---
        window.addEventListener('keydown', event => {
            if (event.key === 'h' || event.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // --- WINDOW RESIZE HANDLING ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
            renderer.setPixelRatio(params.dpr);
        });

        // --- LIL-GUI CONFIGURATION ---
        const gui = new GUI({ title: 'Lidar Forest Controls' });

        // System Folder
        const fSystem = gui.addFolder('System & Display');
        fSystem.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
        });
        fSystem.add(params, 'antialias').name('Antialias').onChange(v => {
            applyAntialiasSetting(v);
        });
        fSystem.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
        fSystem.add(params, 'randomizeOnClick').name('Click Scene to Re-roll');
        fSystem.add(params, 'animationMode', [
            'Static (No camera movement)',
            'Gentle Orbit',
            'Canopy Drift',
            'Deep Sonar Dive',
            'Spiral Ascent',
            'Breathing Parallax',
            'Panoramic Sweep',
            'Echo Fly-Through'
        ]).name('Camera Animation');

        // View Controls Folder
        const fView = gui.addFolder('View & Navigation');
        fView.add(params, 'zoom', 0.2, 5.0, 0.01).name('Zoom').listen().onChange(setZoom);
        fView.add(params, 'panX', -800.0, 800.0, 1.0).name('Pan X').listen().onChange(v => setPan(v, params.panY));
        fView.add(params, 'panY', -800.0, 800.0, 1.0).name('Pan Y').listen().onChange(v => setPan(params.panX, v));
        fView.add({ reset: () => { setPan(0, 0); setZoom(1.0); } }, 'reset').name('Reset View');

        // Color Schemes Folder
        const fColor = gui.addFolder('Color Themes');
        fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Theme').onChange(applyColorScheme);
        fColor.addColor(params, 'bgColor').name('Background').onChange(updateCanvasBackground);
        fColor.addColor(params, 'pulseColor').name('Scanner Pulse').onChange(v => {
            shaderUniforms.u_pulseColor.value.set(v);
        });
        fColor.addColor(params, 'foliageColor').name('Foliage Points').onChange(buildProceduralForest);
        fColor.addColor(params, 'branchColor').name('Branch Lines').onChange(buildProceduralForest);
        fColor.addColor(params, 'rockColor').name('Rocks & Terrain').onChange(buildProceduralForest);
        fColor.addColor(params, 'unscannedColor').name('Dim Field Noise').onChange(v => shaderUniforms.u_unscannedColor.value.set(v));

        // Green Screen Folder
        const fGreen = gui.addFolder('Green Screen');
        fGreen.add(params, 'greenScreen').name('Enable Green Screen').onChange(updateCanvasBackground);
        fGreen.addColor(params, 'greenScreenColor').name('Key Color').onChange(updateCanvasBackground);

        // Lighting & Exposure Folder
        const fLight = gui.addFolder('Lighting & Exposure');
        fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(v => {
            renderer.toneMappingExposure = v;
            shaderUniforms.u_exposure.value = v;
        });
        fLight.add(params, 'sceneLightIntensity', 0.1, 3.0, 0.05).name('Master Intensity').onChange(v => {
            shaderUniforms.u_lightIntensity.value = v;
            ambientLight.intensity = params.ambientIntensity * v;
            dirLight.intensity = params.dirIntensity * v;
            pulsePointLight.intensity = params.pulseLightIntensity * v;
            fillLight.intensity = params.fillLightIntensity * v;
        });
        fLight.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Light').onChange(v => ambientLight.intensity = v * params.sceneLightIntensity);
        fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(v => ambientLight.color.set(v));
        fLight.add(params, 'dirIntensity', 0.0, 2.0, 0.05).name('Sun/Moon Light').onChange(v => dirLight.intensity = v * params.sceneLightIntensity);
        fLight.addColor(params, 'dirColor').name('Sun/Moon Color').onChange(v => dirLight.color.set(v));
        fLight.add(params, 'dirPosX', -100, 100, 1).name('Sun Pos X').onChange(v => dirLight.position.x = v);
        fLight.add(params, 'dirPosY', 10, 100, 1).name('Sun Pos Y').onChange(v => dirLight.position.y = v);
        fLight.add(params, 'dirPosZ', -100, 100, 1).name('Sun Pos Z').onChange(v => dirLight.position.z = v);
        fLight.add(params, 'pulseLightIntensity', 0.0, 5.0, 0.1).name('Pulse Point Light').onChange(v => pulsePointLight.intensity = v * params.sceneLightIntensity);
        fLight.addColor(params, 'pulseLightColor').name('Pulse Light Color').onChange(v => pulsePointLight.color.set(v));
        fLight.add(params, 'fillLightIntensity', 0.0, 2.0, 0.05).name('Fill Light').onChange(v => fillLight.intensity = v * params.sceneLightIntensity);
        fLight.addColor(params, 'fillLightColor').name('Fill Light Color').onChange(v => fillLight.color.set(v));

        // Procedural & Scanner Folder
        const fLidar = gui.addFolder('Lidar & Scanner');
        fLidar.add(params, 'pointSize', 1.0, 8.0, 0.1).name('Point Size').onChange(v => shaderUniforms.u_pointSize.value = v);
        fLidar.add(params, 'noiseIntensity', 0.0, 4.0, 0.1).name('Noise Scatter').onChange(v => shaderUniforms.u_noiseIntensity.value = v);
        fLidar.add(params, 'pulseSpeed', 0.1, 3.0, 0.1).name('Sonar Ping Speed');
        fLidar.add(params, 'pulseWidth', 0.5, 8.0, 0.1).name('Wavefront Width').onChange(v => shaderUniforms.u_pulseWidth.value = v);
        fLidar.add(params, 'treeCount', 6, 24, 1).name('Tree Density').onChange(buildProceduralForest);
        fLidar.add(params, 'rockCount', 4, 20, 1).name('Rock Density').onChange(buildProceduralForest);
        fLidar.add({ reseed: randomizeProceduralScene }, 'reseed').name('Re-roll Scene');

        gui.close();

        // --- INITIALIZE SCENE ---
        updateCanvasBackground();
        buildProceduralForest();

        // --- INFINITE ANIMATION LOOP ---
        const clock = new THREE.Clock();
        let totalAnimTime = 0.0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            totalAnimTime += delta * params.animSpeed;
            shaderUniforms.u_time.value = totalAnimTime;

            // Sonic pulse smooth spherical expansion and graceful fade-out
            const cycleDuration = 6.8;
            const activeDuration = 5.2; // expansion & fade duration
            const cycleTime = (totalAnimTime * params.pulseSpeed) % cycleDuration;

            let pulseRadius = 0.0;
            let pulseEnvelope = 0.0;

            if (cycleTime < activeDuration) {
                const progress = cycleTime / activeDuration; // 0.0 -> 1.0
                // Ease-out so the ping quickly blossoms at center and glides smoothly through the canopy
                const easeProgress = Math.pow(progress, 0.85);
                pulseRadius = easeProgress * params.maxRadius;

                // Smooth bell-shaped envelope:
                // Smooth fade-in at emergence (progress: 0.0 -> 0.12)
                // Smooth fade-out at distance (progress: 0.55 -> 1.0)
                const fadeIn = THREE.MathUtils.smoothstep(progress, 0.0, 0.12);
                const fadeOut = 1.0 - THREE.MathUtils.smoothstep(progress, 0.55, 1.0);
                pulseEnvelope = fadeIn * fadeOut;
            } else {
                // Resting interval between pulses: wave has completely dissipated
                pulseRadius = params.maxRadius + 10.0;
                pulseEnvelope = 0.0;
            }

            shaderUniforms.u_pulseRadius.value = pulseRadius;
            shaderUniforms.u_pulseEnvelope.value = pulseEnvelope;

            // Pulse point light follows the expanding wave and smoothly dims to 0
            pulsePointLight.position.copy(shaderUniforms.u_pulseCenter.value);
            pulsePointLight.intensity = params.pulseLightIntensity * params.sceneLightIntensity * pulseEnvelope;
            pulsePointLight.distance = Math.max(pulseRadius * 1.4, 8.0);

            // 8 PRECONFIGURED CAMERA ANIMATIONS
            const t = totalAnimTime;
            switch (params.animationMode) {
                case 'Static (No camera movement)':
                    camera.position.set(0, 18, 44);
                    camera.lookAt(0, 6, 0);
                    break;
                case 'Gentle Orbit':
                    const orbitAngle = t * 0.12;
                    camera.position.x = Math.sin(orbitAngle) * 44.0;
                    camera.position.z = Math.cos(orbitAngle) * 44.0;
                    camera.position.y = 17.0 + Math.sin(t * 0.1) * 3.5;
                    camera.lookAt(0, 6.5, 0);
                    break;
                case 'Canopy Drift':
                    camera.position.x = Math.sin(t * 0.11) * 22.0;
                    camera.position.y = 21.0 + Math.cos(t * 0.15) * 4.0;
                    camera.position.z = 36.0 + Math.sin(t * 0.13) * 8.0;
                    camera.lookAt(Math.sin(t * 0.07) * 7.0, 7.5, 0);
                    break;
                case 'Deep Sonar Dive':
                    const diveT = (Math.sin(t * 0.1) + 1.0) * 0.5;
                    camera.position.x = Math.cos(t * 0.08) * 26.0;
                    camera.position.y = THREE.MathUtils.lerp(4.5, 30.0, diveT);
                    camera.position.z = THREE.MathUtils.lerp(20.0, 46.0, diveT);
                    camera.lookAt(0, THREE.MathUtils.lerp(2.5, 8.0, diveT), 0);
                    break;
                case 'Spiral Ascent':
                    const spiralAngle = t * 0.13;
                    const spiralH = 7.0 + (Math.sin(t * 0.09) + 1.0) * 11.0;
                    camera.position.x = Math.sin(spiralAngle) * 38.0;
                    camera.position.z = Math.cos(spiralAngle) * 38.0;
                    camera.position.y = spiralH;
                    camera.lookAt(0, 6.0, 0);
                    break;
                case 'Breathing Parallax':
                    camera.position.x = Math.sin(t * 0.16) * 18.0;
                    camera.position.y = 15.0 + Math.sin(t * 0.32) * 3.0;
                    camera.position.z = 41.0 + Math.cos(t * 0.16) * 6.0;
                    camera.lookAt(0, 5.5, 0);
                    break;
                case 'Panoramic Sweep':
                    camera.position.set(Math.sin(t * 0.09) * 32.0, 16.0, 39.0);
                    camera.lookAt(Math.sin(t * 0.09 + 0.5) * 22.0, 6.5, -10.0);
                    break;
                case 'Echo Fly-Through':
                    const flyZ = 42.0 - ((t * 3.5) % 48.0);
                    camera.position.set(Math.sin(t * 0.14) * 10.0, 11.0 + Math.sin(t * 0.2) * 2.2, flyZ);
                    camera.lookAt(Math.sin(t * 0.14 + 0.3) * 8.0, 7.5, flyZ - 20.0);
                    break;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
