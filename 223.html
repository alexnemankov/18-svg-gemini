<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Vortex Scene</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    #canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="x-shader/x-fragment" id="fragmentShader">#version 300 es
  precision highp float;
  out vec4 O;

  uniform float u_time;
  uniform vec2 u_resolution;
  uniform vec2 u_offset;
  uniform float u_zoom;
  uniform float u_rotation;
  uniform float u_symmetry;
  uniform float u_scale;
  uniform float u_warp;
  uniform float u_density;
  uniform vec3 u_colorA;
  uniform vec3 u_colorB;
  uniform vec3 u_colorC;
  uniform vec3 u_colorD;
  uniform vec3 u_tintPrimary;
  uniform vec3 u_tintSecondary;
  uniform float u_saturation;
  uniform float u_brightness;
  uniform vec3 u_bgColor;
  uniform int u_greenScreen;

  #define FC gl_FragCoord.xy
  #define R u_resolution
  #define T u_time

  float rnd(float a) {
    vec2 p = fract(a * vec2(12.9898, 78.233));
    p += dot(p, p * 345.0);
    return fract(p.x * p.y);
  }

  vec3 cosinePalette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
    return a + b * cos(6.2831853 * (c * t + d));
  }

  vec3 pattern(vec2 uv) {
    vec3 col = vec3(0.0);
    for (float i = 0.0; i < 20.0; i += 1.0) {
      float a = rnd(i + 1.0);
      vec2 n = vec2(a, fract(a * 34.56));
      vec2 p = sin(n * (T + 7.0) + T * 0.5);
      float d = dot(uv - p, uv - p);
      d = max(d, 0.00005);

      vec3 pal = cosinePalette(dot(uv, uv) + (i + 1.0) * 0.125 + T, u_colorA, u_colorB, u_colorC, u_colorD);
      vec3 colSample = mix(pal * u_tintPrimary, u_tintSecondary, 0.25 * (sin((i + 1.0) * 0.5 + T) * 0.5 + 0.5));

      float gray = dot(colSample, vec3(0.299, 0.587, 0.114));
      colSample = mix(vec3(gray), colSample, u_saturation);

      col += (u_density / d) * colSample;
    }
    return col;
  }

  void main(void) {
    vec2 uv = (FC - 0.5 * R) / min(R.x, R.y);

    // Camera pan offset
    uv -= u_offset;

    // Camera rotation
    float cR = cos(u_rotation);
    float sR = sin(u_rotation);
    uv = vec2(uv.x * cR - uv.y * sR, uv.x * sR + uv.y * cR);

    // Zoom
    uv /= max(u_zoom, 0.001);

    float b = length(uv);
    float a = atan(uv.x, uv.y);

    // Polar tunnel coordinates
    float safeTan = tan(max(b, 0.0001));
    if (abs(safeTan) < 0.00001) {
      safeTan = 0.00001;
    }

    uv = vec2(a * u_symmetry / 6.2831853, (u_warp / safeTan) + T);
    uv = fract(uv) - 0.5;

    vec3 col = pattern(uv * u_scale);
    col *= u_brightness;

    if (u_greenScreen == 1) {
      // Greenscreen #00ff00 chroma background
      vec3 greenBg = vec3(0.0, 1.0, 0.0);
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      float alpha = clamp(lum * 1.8, 0.0, 1.0);
      O = vec4(mix(greenBg, col, alpha), 1.0);
    } else {
      vec3 finalCol = u_bgColor + col;
      O = vec4(finalCol, 1.0);
    }
  }
  </script>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 5 Distinct, rich color palettes
    const COLOR_PRESETS = {
      'Cosmic Neon': {
        colorA: [0.6, 0.6, 0.6],
        colorB: [0.6, 0.6, 0.6],
        colorC: [1.0, 1.0, 1.0],
        colorD: [0.0, 0.21, 0.34],
        primaryTint: '#ffffff',
        secondaryTint: '#9966ff',
        saturation: 1.0,
        brightness: 1.0
      },
      'Solar Flare': {
        colorA: [0.8, 0.5, 0.2],
        colorB: [0.6, 0.4, 0.2],
        colorC: [1.0, 1.0, 1.0],
        colorD: [0.0, 0.1, 0.2],
        primaryTint: '#ffaa44',
        secondaryTint: '#ff2200',
        saturation: 1.2,
        brightness: 1.1
      },
      'Bioluminescence': {
        colorA: [0.2, 0.7, 0.6],
        colorB: [0.2, 0.5, 0.5],
        colorC: [1.0, 1.0, 1.0],
        colorD: [0.5, 0.75, 0.95],
        primaryTint: '#00ffee',
        secondaryTint: '#00ff77',
        saturation: 1.1,
        brightness: 1.0
      },
      'Synthwave Cyber': {
        colorA: [0.6, 0.3, 0.7],
        colorB: [0.5, 0.4, 0.5],
        colorC: [1.0, 1.0, 1.0],
        colorD: [0.8, 0.3, 0.6],
        primaryTint: '#ff00aa',
        secondaryTint: '#00ddff',
        saturation: 1.3,
        brightness: 1.05
      },
      'Royal Amethyst': {
        colorA: [0.5, 0.4, 0.8],
        colorB: [0.5, 0.4, 0.6],
        colorC: [1.0, 0.8, 1.0],
        colorD: [0.6, 0.2, 0.8],
        primaryTint: '#c084fc',
        secondaryTint: '#38bdf8',
        saturation: 1.1,
        brightness: 1.0
      }
    };

    // 5 Smooth, slow animation presets
    const ANIMATION_PRESETS = [
      'Static (No Movement)',
      'Gentle Cosmic Drift',
      'Hypnotic Spiral',
      'Harmonic Pendulum',
      'Deep Hyperspace Dive'
    ];

    function hexToRgb(hex) {
      const c = hex.replace('#', '');
      const bigint = parseInt(c, 16);
      if (c.length === 6) {
        return [
          ((bigint >> 16) & 255) / 255,
          ((bigint >> 8) & 255) / 255,
          (bigint & 255) / 255
        ];
      }
      return [1, 1, 1];
    }

    let currentColorA = [...COLOR_PRESETS['Cosmic Neon'].colorA];
    let currentColorB = [...COLOR_PRESETS['Cosmic Neon'].colorB];
    let currentColorC = [...COLOR_PRESETS['Cosmic Neon'].colorC];
    let currentColorD = [...COLOR_PRESETS['Cosmic Neon'].colorD];

    const params = {
      // Animation & Flow
      animationPreset: 'Gentle Cosmic Drift',
      speed: 1.0,

      // Tunnel & Geometry
      symmetry: 5.0,
      scale: 2.4,
      warp: 0.05,
      density: 0.00125,

      // Color & Lighting
      colorScheme: 'Cosmic Neon',
      primaryTint: '#ffffff',
      secondaryTint: '#9966ff',
      saturation: 1.0,
      brightness: 1.0,
      greenScreen: false,
      bgColor: '#000000',

      // Camera & Transform
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,
      rotation: 0.0,
      resetCamera: () => {
        params.zoom = 1.0;
        params.panX = 0.0;
        params.panY = 0.0;
        params.rotation = 0.0;
        updateAllGuiDisplays();
      },

      // System & Settings
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      clickToRandomize: true,
      randomize: () => {
        randomizeParameters();
      },
      resetDefaults: () => {
        resetToDefaults();
      }
    };

    class Renderer {
      #vertexSrc = `#version 300 es
precision highp float;
in vec4 position;
void main(){
  gl_Position = position;
}`;

      #vertices = [-1, 1, -1, -1, 1, 1, 1, -1];

      constructor(canvas) {
        this.canvas = canvas;
        this.gl = canvas.getContext('webgl2', { alpha: false, antialias: true, powerPreference: 'high-performance' });
        if (!this.gl) {
          console.error('WebGL2 not supported');
        }
      }

      compile(shader, source) {
        const gl = this.gl;
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(shader));
        }
      }

      setup(fragSource) {
        const gl = this.gl;
        this.vs = gl.createShader(gl.VERTEX_SHADER);
        this.fs = gl.createShader(gl.FRAGMENT_SHADER);
        this.compile(this.vs, this.#vertexSrc);
        this.compile(this.fs, fragSource);
        this.program = gl.createProgram();
        gl.attachShader(this.program, this.vs);
        gl.attachShader(this.program, this.fs);
        gl.linkProgram(this.program);
        if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) {
          console.error(gl.getProgramInfoLog(this.program));
        }

        this.buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.#vertices), gl.STATIC_DRAW);
        const position = gl.getAttribLocation(this.program, 'position');
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        this.uLocs = {
          time: gl.getUniformLocation(this.program, 'u_time'),
          resolution: gl.getUniformLocation(this.program, 'u_resolution'),
          offset: gl.getUniformLocation(this.program, 'u_offset'),
          zoom: gl.getUniformLocation(this.program, 'u_zoom'),
          rotation: gl.getUniformLocation(this.program, 'u_rotation'),
          symmetry: gl.getUniformLocation(this.program, 'u_symmetry'),
          scale: gl.getUniformLocation(this.program, 'u_scale'),
          warp: gl.getUniformLocation(this.program, 'u_warp'),
          density: gl.getUniformLocation(this.program, 'u_density'),
          colorA: gl.getUniformLocation(this.program, 'u_colorA'),
          colorB: gl.getUniformLocation(this.program, 'u_colorB'),
          colorC: gl.getUniformLocation(this.program, 'u_colorC'),
          colorD: gl.getUniformLocation(this.program, 'u_colorD'),
          tintPrimary: gl.getUniformLocation(this.program, 'u_tintPrimary'),
          tintSecondary: gl.getUniformLocation(this.program, 'u_tintSecondary'),
          saturation: gl.getUniformLocation(this.program, 'u_saturation'),
          brightness: gl.getUniformLocation(this.program, 'u_brightness'),
          bgColor: gl.getUniformLocation(this.program, 'u_bgColor'),
          greenScreen: gl.getUniformLocation(this.program, 'u_greenScreen')
        };
      }

      render(state) {
        const { gl, program, buffer, canvas, uLocs } = this;
        if (!program) return;

        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

        gl.uniform1f(uLocs.time, state.time);
        gl.uniform2f(uLocs.resolution, canvas.width, canvas.height);
        gl.uniform2f(uLocs.offset, state.offsetX, state.offsetY);
        gl.uniform1f(uLocs.zoom, state.zoom);
        gl.uniform1f(uLocs.rotation, state.rotation);
        gl.uniform1f(uLocs.symmetry, state.symmetry);
        gl.uniform1f(uLocs.scale, state.scale);
        gl.uniform1f(uLocs.warp, state.warp);
        gl.uniform1f(uLocs.density, state.density);

        gl.uniform3fv(uLocs.colorA, state.colorA);
        gl.uniform3fv(uLocs.colorB, state.colorB);
        gl.uniform3fv(uLocs.colorC, state.colorC);
        gl.uniform3fv(uLocs.colorD, state.colorD);
        gl.uniform3fv(uLocs.tintPrimary, state.tintPrimary);
        gl.uniform3fv(uLocs.tintSecondary, state.tintSecondary);
        gl.uniform1f(uLocs.saturation, state.saturation);
        gl.uniform1f(uLocs.brightness, state.brightness);

        gl.uniform3fv(uLocs.bgColor, state.bgColor);
        gl.uniform1i(uLocs.greenScreen, state.greenScreen ? 1 : 0);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
    }

    const canvas = document.getElementById('canvas');
    const renderer = new Renderer(canvas);
    const shaderSource = document.getElementById('fragmentShader').textContent;
    renderer.setup(shaderSource);

    const resize = () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = Math.max(1, Math.floor(width * params.dpr));
      canvas.height = Math.max(1, Math.floor(height * params.dpr));
    };

    window.addEventListener('resize', resize);
    resize();

    // lil-gui setup
    const gui = new GUI({ title: 'Scene Settings' });

    const fAnim = gui.addFolder('Animation & Flow');
    fAnim.add(params, 'animationPreset', ANIMATION_PRESETS).name('Motion Preset');
    fAnim.add(params, 'speed', 0.0, 3.0, 0.05).name('Anim Speed');
    fAnim.open();

    const fGeo = gui.addFolder('Tunnel & Geometry');
    fGeo.add(params, 'symmetry', 2.0, 12.0, 1.0).name('Facets / Symmetry');
    fGeo.add(params, 'scale', 0.5, 6.0, 0.1).name('Pattern Scale');
    fGeo.add(params, 'warp', 0.01, 0.2, 0.005).name('Tunnel Warp');
    fGeo.add(params, 'density', 0.0002, 0.004, 0.0001).name('Glow Density');
    fGeo.open();

    const fCol = gui.addFolder('Color & Lighting');
    fCol.add(params, 'colorScheme', Object.keys(COLOR_PRESETS)).name('Color Scheme').onChange(name => {
      applyColorScheme(name);
    });
    fCol.addColor(params, 'primaryTint').name('Primary Tint');
    fCol.addColor(params, 'secondaryTint').name('Secondary Tint');
    fCol.add(params, 'saturation', 0.0, 2.5, 0.05).name('Saturation');
    fCol.add(params, 'brightness', 0.1, 3.0, 0.05).name('Brightness');
    fCol.add(params, 'greenScreen').name('Green Screen (#00ff00)');
    fCol.addColor(params, 'bgColor').name('Background Color');
    fCol.open();

    const fCam = gui.addFolder('Camera & Transform');
    fCam.add(params, 'zoom', 0.1, 5.0, 0.01).name('Zoom');
    fCam.add(params, 'panX', -3.0, 3.0, 0.01).name('Pan X');
    fCam.add(params, 'panY', -3.0, 3.0, 0.01).name('Pan Y');
    fCam.add(params, 'rotation', -Math.PI, Math.PI, 0.01).name('Rotation');
    fCam.add(params, 'resetCamera').name('Reset Camera');
    fCam.close();

    const fSet = gui.addFolder('System & Interactivity');
    fSet.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(() => resize());
    fSet.add(params, 'clickToRandomize').name('Click to Randomize');
    fSet.add(params, 'randomize').name('Randomize Now');
    fSet.add(params, 'resetDefaults').name('Reset Defaults');
    fSet.close();

    function updateAllGuiDisplays() {
      const updateFolder = (folder) => {
        if (folder.controllers) {
          folder.controllers.forEach(c => c.updateDisplay());
        }
        if (folder.folders) {
          folder.folders.forEach(f => updateFolder(f));
        }
      };
      updateFolder(gui);
    }

    function applyColorScheme(name) {
      const p = COLOR_PRESETS[name];
      if (!p) return;
      currentColorA = [...p.colorA];
      currentColorB = [...p.colorB];
      currentColorC = [...p.colorC];
      currentColorD = [...p.colorD];
      params.primaryTint = p.primaryTint;
      params.secondaryTint = p.secondaryTint;
      params.saturation = p.saturation;
      params.brightness = p.brightness;
      updateAllGuiDisplays();
    }

    function randomizeParameters() {
      const schemeKeys = Object.keys(COLOR_PRESETS);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = randomScheme;
      applyColorScheme(randomScheme);

      // Re-roll geometric & motion parameters
      params.symmetry = Math.floor(Math.random() * 7) + 3; // 3 to 9
      params.scale = Number((Math.random() * 2.5 + 1.2).toFixed(2));
      params.warp = Number((Math.random() * 0.08 + 0.02).toFixed(3));
      params.density = Number((Math.random() * 0.0018 + 0.0006).toFixed(5));
      params.speed = Number((Math.random() * 1.2 + 0.5).toFixed(2));
      params.saturation = Number((Math.random() * 0.8 + 0.8).toFixed(2));
      params.brightness = Number((Math.random() * 0.6 + 0.8).toFixed(2));

      const randomAnim = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.animationPreset = randomAnim;

      updateAllGuiDisplays();
    }

    function resetToDefaults() {
      params.animationPreset = 'Gentle Cosmic Drift';
      params.speed = 1.0;
      params.symmetry = 5.0;
      params.scale = 2.4;
      params.warp = 0.05;
      params.density = 0.00125;
      params.colorScheme = 'Cosmic Neon';
      params.greenScreen = false;
      params.bgColor = '#000000';
      params.zoom = 1.0;
      params.panX = 0.0;
      params.panY = 0.0;
      params.rotation = 0.0;
      params.dpr = Math.min(window.devicePixelRatio || 1, 2);
      params.clickToRandomize = true;
      applyColorScheme('Cosmic Neon');
      resize();
      updateAllGuiDisplays();
    }

    // Toggle UI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden !== undefined) {
          gui.show(gui._hidden);
        } else {
          gui.domElement.style.display = gui.domElement.style.display === 'none' ? '' : 'none';
        }
      }
    });

    // Zoom with wheel
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      params.zoom = Math.min(Math.max(params.zoom * zoomFactor, 0.1), 10.0);
      updateAllGuiDisplays();
    }, { passive: false });

    // Drag object across screen
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let dragStartTime = 0;
    let hasMoved = false;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      dragStartTime = performance.now();
      hasMoved = false;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.hypot(dx, dy) > 4) {
        hasMoved = true;
      }
      const minDim = Math.min(window.innerWidth, window.innerHeight);
      params.panX += (dx / minDim) * (1.0 / params.zoom);
      params.panY -= (dy / minDim) * (1.0 / params.zoom);
      startX = e.clientX;
      startY = e.clientY;
      updateAllGuiDisplays();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const dragDuration = performance.now() - dragStartTime;
      // Quick click on scene triggers procedural randomization if enabled
      if (!hasMoved && dragDuration < 350) {
        if (!e.target.closest('.lil-gui') && params.clickToRandomize) {
          randomizeParameters();
        }
      }
    });

    // Auto infinite animation loop
    let lastTime = performance.now();
    let accumulatedTime = 0;

    const renderLoop = (now) => {
      const dt = Math.min((now - lastTime) * 0.001, 0.1);
      lastTime = now;
      accumulatedTime += dt * params.speed;

      let animOffsetX = 0;
      let animOffsetY = 0;
      let animZoom = 1.0;
      let animRot = 0;
      const aT = accumulatedTime;

      switch (params.animationPreset) {
        case 'Gentle Cosmic Drift':
          animOffsetX = Math.sin(aT * 0.4) * 0.15;
          animOffsetY = Math.cos(aT * 0.3) * 0.12;
          animZoom = 1.0 + Math.sin(aT * 0.25) * 0.15;
          animRot = Math.sin(aT * 0.2) * 0.08;
          break;
        case 'Hypnotic Spiral':
          animOffsetX = Math.sin(aT * 0.5) * 0.08;
          animOffsetY = Math.cos(aT * 0.5) * 0.08;
          animZoom = 1.0 + Math.sin(aT * 0.4) * 0.2;
          animRot = aT * 0.15;
          break;
        case 'Harmonic Pendulum':
          animOffsetX = Math.sin(aT * 0.6) * 0.25;
          animOffsetY = Math.sin(aT * 1.2) * 0.08;
          animZoom = 1.0 + Math.cos(aT * 0.5) * 0.1;
          animRot = Math.sin(aT * 0.6) * 0.15;
          break;
        case 'Deep Hyperspace Dive':
          animOffsetX = Math.sin(aT * 0.2) * 0.06;
          animOffsetY = Math.cos(aT * 0.25) * 0.06;
          animZoom = 1.0 + Math.sin(aT * 0.7) * 0.4;
          animRot = Math.sin(aT * 0.15) * 0.05;
          break;
        case 'Static (No Movement)':
        default:
          animOffsetX = 0;
          animOffsetY = 0;
          animZoom = 1.0;
          animRot = 0;
          break;
      }

      const finalOffsetX = params.panX + animOffsetX;
      const finalOffsetY = params.panY + animOffsetY;
      const finalZoom = Math.max(0.01, params.zoom * animZoom);
      const finalRotation = params.rotation + animRot;

      renderer.render({
        time: accumulatedTime,
        offsetX: finalOffsetX,
        offsetY: finalOffsetY,
        zoom: finalZoom,
        rotation: finalRotation,
        symmetry: params.symmetry,
        scale: params.scale,
        warp: params.warp,
        density: params.density,
        colorA: currentColorA,
        colorB: currentColorB,
        colorC: currentColorC,
        colorD: currentColorD,
        tintPrimary: hexToRgb(params.primaryTint),
        tintSecondary: hexToRgb(params.secondaryTint),
        saturation: params.saturation,
        brightness: params.brightness,
        bgColor: hexToRgb(params.bgColor),
        greenScreen: params.greenScreen
      });

      requestAnimationFrame(renderLoop);
    };

    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
