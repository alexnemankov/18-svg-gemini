<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Escape the Coop - Isometric Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b132b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>

  <!-- Import maps polyfill and Three.js + lil-gui module resolution -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

      'Palette (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {

      'Palette (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {

      },
      'Palette (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {

      },
      'Palette (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {

      },
      'Palette (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        sky: '#0e0618',

        hay: '#ff8c00',
        chickenBody: '#ffe8cc',
        chickenAccent: '#ff8c00',
        chickenBeak: '#e67e22',
        barn: '#160424',
        particles: ['#ffe8cc', '#ff8c00', '#c7501a']
      },
      'Palette (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        sky: '#090612',
        ground: '#1a1250',
        groundAlt: '#6a3de8',
        wood: '#110a36',
        hay: '#b38fff',
        chickenBody: '#e8e0ff',
        chickenAccent: '#b38fff',
        chickenBeak: '#f1c40f',
        barn: '#06030c',
        particles: ['#e8e0ff', '#b38fff', '#6a3de8']
      },
      'Palette (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        sky: '#05020f',
        ground: '#1e0a3d',
        groundAlt: '#d40078',
        wood: '#120426',
        hay: '#00f0ff',
        chickenBody: '#e0fbff',
        chickenAccent: '#d40078',
        chickenBeak: '#00f0ff',
        barn: '#080117',
        particles: ['#e0fbff', '#00f0ff', '#d40078']
      }
    };

    // --- 8 PRECONFIGURED ANIMATION CHOREOGRAPHIES ---
    const ANIMATION_PRESETS = [
      'Static Isometric',
      'Gentle Drone Hover',
      'Dynamic Side-Track',
      'Cinematic Chase',
      'Low-Angle Hero Arc',
      'Overhead Tactical Tilt',
      'Rhythm Bounce',
      'Panoramic Wide Dolly'
    ];

    // --- GAMEPLAY STATE & CONTROL STRUCTURE ---
    const gameState = {
      mode: 'Playable Game', // 'Playable Game' or 'Showcase (Auto-Run)'
      status: 'PLAYING',     // 'PLAYING', 'GAME OVER', 'SHOWCASE'
      score: 0,
      highScore: 0,
      lives: 3,
      livesDisplay: '❤️❤️❤️',
      invulnerableTimer: 0,
      lane: 0,               // -1: Left, 0: Center, 1: Right
      targetLaneX: 0,
      laneX: 0,
      y: 0.4,
      vy: 0,
      isGrounded: true,
      isJumping: false,
      isDucking: false,
      duckTimer: 0,
      runCycle: 0,
      wingFlapAngle: 0,
      totalDistance: 0
    };

    const LANE_SPACING = 2.8;

    // --- SETTINGS OBJECT FOR GUI ---
    const settings = {
      // Game Mode & Playing
      gameMode: 'Playable Game',
      gameStatus: 'PLAYING',
      livesDisplay: '❤️❤️❤️',
      scoreDisplay: 0,
      highScoreDisplay: 0,
      startGame: () => { restartGame(); },
      moveLeft: () => { shiftLane(-1); },
      moveRight: () => { shiftLane(1); },
      jumpAction: () => { playerJump(); },
      duckAction: () => { playerDuck(); },

      // Color & Visual Theme
      colorScheme: 'Palette (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
      greenscreen: false,
      skyColor: '#0b132b',
      groundColor: '#4bad9e',
      groundAltColor: '#5bc0be',
      woodColor: '#1c2541',
      hayColor: '#63d1cf',
      chickenBodyColor: '#f0ffff',
      chickenAccentColor: '#5bc0be',
      chickenBeakColor: '#ffc857',
      barnColor: '#070b19',

      // Camera & Animation
      animationPreset: 'Gentle Drone Hover',
      animSpeed: 1.0,
      runSpeed: 28.0,
      cameraZoom: 1.0,

      // Procedural & Interactivity
      clickToReroll: false,
      obstacleDensity: 1.0,

      // Render Options
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      shadows: true,
      wireframe: false,

      // Extra Actions
      triggerBurst: () => { spawnFeatherBurst(chickenGroup.position.x, chickenGroup.position.y + 1.2, chickenGroup.position.z, 40); },
      rerollNow: () => { rerollScene(); }
    };

    // --- SETUP THREE.JS SCENE, ORTHOGRAPHIC CAMERA & RENDERER ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    
    // Isometric aspect setup
    const aspect = window.innerWidth / window.innerHeight;
    const viewSize = 26;
    const camera = new THREE.OrthographicCamera(
      -viewSize * aspect / 2,
       viewSize * aspect / 2,
       viewSize / 2,
      -viewSize / 2,
      -200,
      500
    );

    // Initial Isometric Vantage (approx 35.264° elevation, 45° azimuth)
    const baseIsoPos = new THREE.Vector3(42, 46, 42);
    const cameraTarget = new THREE.Vector3(0, 1.5, 0);
    camera.position.copy(baseIsoPos);
    camera.lookAt(cameraTarget);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(settings.dpr);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // OrbitControls for Drag & Wheel Zoom across screen
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.copy(cameraTarget);
    controls.maxZoom = 4.0;
    controls.minZoom = 0.35;
    controls.screenSpacePanning = true;

    // --- LIGHTING ---
    const ambientLight = new THREE.HemisphereLight(0xffffff, 0x334455, 0.75);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.35);
    sunLight.position.set(45, 60, 25);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 160;
    const shadowD = 35;
    sunLight.shadow.camera.left = -shadowD;
    sunLight.shadow.camera.right = shadowD;
    sunLight.shadow.camera.top = shadowD;
    sunLight.shadow.camera.bottom = -shadowD;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0xaaddee, 0.45);
    rimLight.position.set(-30, 20, -30);
    scene.add(rimLight);

    // Fog for horizon depth
    scene.fog = new THREE.FogExp2(settings.skyColor, 0.012);

    // --- SHARED MATERIALS CACHE ---
    const materials = {
      ground: new THREE.MeshLambertMaterial({ color: settings.groundColor }),
      groundAlt: new THREE.MeshLambertMaterial({ color: settings.groundAltColor }),
      wood: new THREE.MeshLambertMaterial({ color: settings.woodColor }),
      hay: new THREE.MeshLambertMaterial({ color: settings.hayColor }),
      chickenBody: new THREE.MeshLambertMaterial({ color: settings.chickenBodyColor }),
      chickenAccent: new THREE.MeshLambertMaterial({ color: settings.chickenAccentColor }),
      chickenBeak: new THREE.MeshLambertMaterial({ color: settings.chickenBeakColor }),
      barn: new THREE.MeshLambertMaterial({ color: settings.barnColor }),
      eggGold: new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8 }),
      whiteGlow: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }),
      feather: new THREE.MeshLambertMaterial({ color: settings.chickenBodyColor, side: THREE.DoubleSide })
    };

    function updateMaterialsFromSettings() {
      const scheme = COLOR_SCHEMES[settings.colorScheme];
      if (scheme) {
        settings.skyColor = scheme.sky;
        settings.groundColor = scheme.ground;
        settings.groundAltColor = scheme.groundAlt;
        settings.woodColor = scheme.wood;
        settings.hayColor = scheme.hay;
        settings.chickenBodyColor = scheme.chickenBody;
        settings.chickenAccentColor = scheme.chickenAccent;
        settings.chickenBeakColor = scheme.chickenBeak;
        settings.barnColor = scheme.barn;
      }

      if (settings.greenscreen) {
        scene.background = new THREE.Color(0x00ff00);
        scene.fog.color.setHex(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        scene.background = new THREE.Color(settings.skyColor);
        scene.fog.color.set(settings.skyColor);
        renderer.setClearColor(settings.skyColor, 1.0);
      }

      materials.ground.color.set(settings.groundColor);
      materials.groundAlt.color.set(settings.groundAltColor);
      materials.wood.color.set(settings.woodColor);
      materials.hay.color.set(settings.hayColor);
      materials.chickenBody.color.set(settings.chickenBodyColor);
      materials.chickenAccent.color.set(settings.chickenAccentColor);
      materials.chickenBeak.color.set(settings.chickenBeakColor);
      materials.barn.color.set(settings.barnColor);
      materials.feather.color.set(settings.chickenBodyColor);

      // Ambient fill tone sync
      ambientLight.color.set(settings.chickenBodyColor);
      ambientLight.groundColor.set(settings.groundColor);

      // Wireframe toggle
      Object.values(materials).forEach(mat => {
        if (mat.wireframe !== undefined) mat.wireframe = settings.wireframe;
      });
    }

    // --- CHICKEN 3D CHARACTER MODEL (FACING FORWARD INTO ONCOMING TRACK +Z) ---
    const chickenGroup = new THREE.Group();
    chickenGroup.position.set(0, 0.4, 0);
    scene.add(chickenGroup);

    // Main Body Box/Plump Egg
    const bodyGeo = new THREE.BoxGeometry(1.3, 1.4, 1.6);
    const bodyMesh = new THREE.Mesh(bodyGeo, materials.chickenBody);
    bodyMesh.position.y = 0.9;
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    chickenGroup.add(bodyMesh);

    // Tail Feathers Group (Pointing backwards into -Z)
    const tailGroup = new THREE.Group();
    tailGroup.position.set(0, 1.2, -0.85);
    for (let i = -1; i <= 1; i++) {
      const tailFeatherGeo = new THREE.BoxGeometry(0.2, 0.7, 0.15);
      const tailFeather = new THREE.Mesh(tailFeatherGeo, materials.chickenAccent);
      tailFeather.position.set(i * 0.25, i === 0 ? 0.2 : 0, -0.1);
      tailFeather.rotation.x = -0.4;
      tailFeather.rotation.z = i * 0.25;
      tailFeather.castShadow = true;
      tailGroup.add(tailFeather);
    }
    chickenGroup.add(tailGroup);

    // Head & Crest Group (Pointing forward into +Z)
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 1.65, 0.55);

    const headGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
    const headMesh = new THREE.Mesh(headGeo, materials.chickenBody);
    headMesh.castShadow = true;
    headGroup.add(headMesh);

    // Rooster / Hen Comb on Head
    const combGroup = new THREE.Group();
    combGroup.position.set(0, 0.55, 0.05);
    for (let c = -1; c <= 1; c++) {
      const crownGeo = new THREE.BoxGeometry(0.16, 0.35 + (c === 0 ? 0.15 : 0), 0.28);
      const crownMesh = new THREE.Mesh(crownGeo, materials.chickenAccent);
      crownMesh.position.set(0, (c === 0 ? 0.08 : 0), c * 0.24);
      crownMesh.castShadow = true;
      combGroup.add(crownMesh);
    }
    headGroup.add(combGroup);

    // Wattle under Beak
    const wattleGeo = new THREE.BoxGeometry(0.18, 0.35, 0.2);
    const wattleMesh = new THREE.Mesh(wattleGeo, materials.chickenAccent);
    wattleMesh.position.set(0, -0.4, 0.4);
    wattleMesh.castShadow = true;
    headGroup.add(wattleMesh);

    // Beak pointing forward (+Z)
    const beakGeo = new THREE.ConeGeometry(0.22, 0.45, 4);
    beakGeo.rotateX(Math.PI / 2);
    const beakMesh = new THREE.Mesh(beakGeo, materials.chickenBeak);
    beakMesh.position.set(0, -0.05, 0.65);
    beakMesh.castShadow = true;
    headGroup.add(beakMesh);

    // Big expressive cartoon eyes
    const eyeWhiteGeo = new THREE.BoxGeometry(0.2, 0.24, 0.1);
    const eyePupilGeo = new THREE.BoxGeometry(0.1, 0.14, 0.12);
    const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const eyePupilMat = new THREE.MeshBasicMaterial({ color: 0x050505 });

    [-1, 1].forEach(side => {
      const eyeWhite = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
      eyeWhite.position.set(side * 0.46, 0.1, 0.2);
      eyeWhite.rotation.y = side * 0.2;
      const eyePupil = new THREE.Mesh(eyePupilGeo, eyePupilMat);
      eyePupil.position.set(side * 0.47, 0.1, 0.24);
      eyePupil.rotation.y = side * 0.2;
      headGroup.add(eyeWhite);
      headGroup.add(eyePupil);
    });

    chickenGroup.add(headGroup);

    // Left and Right Flapping Wings
    const wingGeo = new THREE.BoxGeometry(0.18, 0.6, 1.0);
    const leftWingGroup = new THREE.Group();
    leftWingGroup.position.set(0.72, 1.0, 0);
    const leftWing = new THREE.Mesh(wingGeo, materials.chickenBody);
    leftWing.position.set(0.08, -0.1, 0);
    leftWing.castShadow = true;
    leftWingGroup.add(leftWing);
    chickenGroup.add(leftWingGroup);

    const rightWingGroup = new THREE.Group();
    rightWingGroup.position.set(-0.72, 1.0, 0);
    const rightWing = new THREE.Mesh(wingGeo, materials.chickenBody);
    rightWing.position.set(-0.08, -0.1, 0);
    rightWing.castShadow = true;
    rightWingGroup.add(rightWing);
    chickenGroup.add(rightWingGroup);

    // Legs & Feet
    const legGeo = new THREE.BoxGeometry(0.12, 0.55, 0.12);
    const footGeo = new THREE.BoxGeometry(0.35, 0.08, 0.5);

    const leftLegGroup = new THREE.Group();
    leftLegGroup.position.set(0.35, 0.45, 0);
    const leftLegMesh = new THREE.Mesh(legGeo, materials.chickenBeak);
    leftLegMesh.position.y = -0.25;
    leftLegMesh.castShadow = true;
    const leftFootMesh = new THREE.Mesh(footGeo, materials.chickenBeak);
    leftFootMesh.position.set(0, -0.5, 0.15);
    leftFootMesh.castShadow = true;
    leftLegGroup.add(leftLegMesh);
    leftLegGroup.add(leftFootMesh);
    chickenGroup.add(leftLegGroup);

    const rightLegGroup = new THREE.Group();
    rightLegGroup.position.set(-0.35, 0.45, 0);
    const rightLegMesh = new THREE.Mesh(legGeo, materials.chickenBeak);
    rightLegMesh.position.y = -0.25;
    rightLegMesh.castShadow = true;
    const rightFootMesh = new THREE.Mesh(footGeo, materials.chickenBeak);
    rightFootMesh.position.set(0, -0.5, 0.15);
    rightFootMesh.castShadow = true;
    rightLegGroup.add(rightLegMesh);
    rightLegGroup.add(rightFootMesh);
    chickenGroup.add(rightLegGroup);

    // --- PARTICLE SYSTEMS (FEATHERS & DUST PUFFS) ---
    const MAX_FEATHERS = 180;
    const featherParticles = [];
    const featherGeo = new THREE.PlaneGeometry(0.35, 0.6);

    for (let i = 0; i < MAX_FEATHERS; i++) {
      const fMesh = new THREE.Mesh(featherGeo, materials.feather.clone());
      fMesh.visible = false;
      scene.add(fMesh);
      featherParticles.push({
        mesh: fMesh,
        vel: new THREE.Vector3(),
        rotVel: new THREE.Vector3(),
        life: 0,
        maxLife: 1.0,
        scale: 1.0
      });
    }

    function spawnFeatherBurst(x, y, z, count = 25) {
      let spawned = 0;
      const scheme = COLOR_SCHEMES[settings.colorScheme];
      const palette = scheme ? scheme.particles : ['#ffffff', '#ffaa00', '#ff3366'];

      for (let i = 0; i < featherParticles.length && spawned < count; i++) {
        const p = featherParticles[i];
        if (!p.mesh.visible || p.life <= 0) {
          p.mesh.position.set(
            x + (Math.random() - 0.5) * 0.8,
            y + (Math.random() - 0.5) * 0.8,
            z + (Math.random() - 0.5) * 0.8
          );
          const angle = Math.random() * Math.PI * 2;
          const speed = 4.0 + Math.random() * 8.0;
          const upSpeed = 3.0 + Math.random() * 9.0;
          p.vel.set(
            Math.cos(angle) * speed,
            upSpeed,
            Math.sin(angle) * speed - (settings.runSpeed * 0.3) // drift backwards (-Z)
          );
          p.rotVel.set(
            (Math.random() - 0.5) * 12,
            (Math.random() - 0.5) * 12,
            (Math.random() - 0.5) * 12
          );
          p.life = 1.0;
          p.maxLife = 0.8 + Math.random() * 0.8;
          p.scale = 0.6 + Math.random() * 0.7;

          // Pick random particle color from scheme
          const col = palette[Math.floor(Math.random() * palette.length)];
          p.mesh.material.color.set(col);

          p.mesh.scale.set(p.scale, p.scale, p.scale);
          p.mesh.visible = true;
          spawned++;
        }
      }
    }

    // Dust Puffs System
    const MAX_DUST = 60;
    const dustParticles = [];
    const dustGeo = new THREE.DodecahedronGeometry(0.3, 0);
    const dustMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });

    for (let i = 0; i < MAX_DUST; i++) {
      const dMesh = new THREE.Mesh(dustGeo, dustMat.clone());
      dMesh.visible = false;
      scene.add(dMesh);
      dustParticles.push({
        mesh: dMesh,
        vel: new THREE.Vector3(),
        life: 0,
        maxLife: 0.5,
        scale: 1.0
      });
    }

    function spawnDustPuff(x, y, z) {
      for (let i = 0; i < dustParticles.length; i++) {
        const d = dustParticles[i];
        if (!d.mesh.visible || d.life <= 0) {
          d.mesh.position.set(x, y + 0.1, z);
          d.vel.set((Math.random() - 0.5) * 1.5, Math.random() * 1.5 + 0.5, -settings.runSpeed * 0.4);
          d.life = 1.0;
          d.maxLife = 0.4 + Math.random() * 0.3;
          d.scale = 0.4 + Math.random() * 0.4;
          d.mesh.visible = true;
          d.mesh.material.opacity = 0.6;
          break;
        }
      }
    }

    // --- PROCEDURAL ENDLESS COURSE GENERATOR (SCROLLS FROM +Z IN FRONT TO -Z BEHIND) ---
    const CHUNK_LENGTH = 20;
    const NUM_CHUNKS = 9;
    const TRACK_WIDTH = 12;
    const chunks = [];
    const courseGroup = new THREE.Group();
    scene.add(courseGroup);

    function createChunkMesh(chunkIndex) {
      const chunk = new THREE.Group();
      // Chunks span from negative Z behind to positive Z in front (+Z = +60, +40, +20, 0, -20, -40...)
      chunk.position.z = (NUM_CHUNKS - 3 - chunkIndex) * CHUNK_LENGTH;

      // Ground terrain base (Checkered tiles)
      const tileRows = 4;
      const tileCols = 6;
      const tileW = TRACK_WIDTH / tileCols;
      const tileL = CHUNK_LENGTH / tileRows;
      const tileGeo = new THREE.BoxGeometry(tileW * 0.98, 0.8, tileL * 0.98);

      for (let r = 0; r < tileRows; r++) {
        for (let c = 0; c < tileCols; c++) {
          const isAlt = (r + c + chunkIndex * 2) % 2 === 0;
          const tile = new THREE.Mesh(tileGeo, isAlt ? materials.ground : materials.groundAlt);
          tile.position.set(
            (c - tileCols / 2 + 0.5) * tileW,
            -0.4,
            (r - tileRows / 2 + 0.5) * tileL
          );
          tile.receiveShadow = true;
          chunk.add(tile);
        }
      }

      // Outer scenic terrain edges (pasture ground extension)
      const edgeGeo = new THREE.BoxGeometry(22, 0.7, CHUNK_LENGTH);
      const leftEdge = new THREE.Mesh(edgeGeo, materials.ground);
      leftEdge.position.set(-TRACK_WIDTH / 2 - 11, -0.45, 0);
      leftEdge.receiveShadow = true;
      chunk.add(leftEdge);

      const rightEdge = new THREE.Mesh(edgeGeo, materials.ground);
      rightEdge.position.set(TRACK_WIDTH / 2 + 11, -0.45, 0);
      rightEdge.receiveShadow = true;
      chunk.add(rightEdge);

      // Wooden Side Fences
      const fencePostGeo = new THREE.BoxGeometry(0.35, 1.6, 0.35);
      const fenceRailGeo = new THREE.BoxGeometry(0.18, 0.22, CHUNK_LENGTH);

      [-TRACK_WIDTH / 2, TRACK_WIDTH / 2].forEach(sideX => {
        // Horizontal rails
        for (let h of [0.5, 1.1]) {
          const rail = new THREE.Mesh(fenceRailGeo, materials.wood);
          rail.position.set(sideX, h, 0);
          rail.castShadow = true;
          rail.receiveShadow = true;
          chunk.add(rail);
        }
        // Vertical posts
        const numPosts = 5;
        for (let p = 0; p < numPosts; p++) {
          const post = new THREE.Mesh(fencePostGeo, materials.wood);
          post.position.set(sideX, 0.8, (p / (numPosts - 1) - 0.5) * CHUNK_LENGTH);
          post.castShadow = true;
          post.receiveShadow = true;
          chunk.add(post);
        }
      });

      // Background Scenery Props (Windmill, Barns, Trees, Silos)
      if (chunkIndex % 2 === 0) {
        // Red Barn Silhouette / Silo on right
        const barnBuilding = new THREE.Group();
        barnBuilding.position.set(TRACK_WIDTH / 2 + 8 + Math.random() * 4, 0, (Math.random() - 0.5) * 6);
        const barnBaseGeo = new THREE.BoxGeometry(5, 5, 6);
        const barnBase = new THREE.Mesh(barnBaseGeo, materials.barn);
        barnBase.position.y = 2.5;
        barnBase.castShadow = true;
        barnBuilding.add(barnBase);

        const roofGeo = new THREE.ConeGeometry(4.2, 2.5, 4);
        roofGeo.rotateY(Math.PI / 4);
        const roof = new THREE.Mesh(roofGeo, materials.wood);
        roof.position.y = 6.2;
        roof.castShadow = true;
        barnBuilding.add(roof);
        chunk.add(barnBuilding);
      } else {
        // Windmill / Water Tower on left
        const windmill = new THREE.Group();
        windmill.position.set(-TRACK_WIDTH / 2 - 9 - Math.random() * 4, 0, (Math.random() - 0.5) * 6);
        const towerGeo = new THREE.CylinderGeometry(1.2, 2.0, 9, 6);
        const tower = new THREE.Mesh(towerGeo, materials.wood);
        tower.position.y = 4.5;
        tower.castShadow = true;
        windmill.add(tower);

        const bladesGroup = new THREE.Group();
        bladesGroup.position.set(0, 8.5, 1.4);
        const bladeGeo = new THREE.BoxGeometry(0.35, 7.5, 0.08);
        const blade1 = new THREE.Mesh(bladeGeo, materials.hay);
        const blade2 = new THREE.Mesh(bladeGeo, materials.hay);
        blade2.rotation.z = Math.PI / 2;
        bladesGroup.add(blade1);
        bladesGroup.add(blade2);
        bladesGroup.name = "windmillBlades";
        windmill.add(bladesGroup);
        chunk.add(windmill);
      }

      // Procedural Obstacles container for this chunk
      chunk.obstacles = [];
      populateChunkObstacles(chunk, chunkIndex);

      courseGroup.add(chunk);
      return chunk;
    }

    function populateChunkObstacles(chunk, chunkIndex) {
      // Clear previous dynamic obstacles if recycling
      if (chunk.obstacleContainer) {
        chunk.remove(chunk.obstacleContainer);
        chunk.obstacleContainer.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();
        });
      }
      chunk.obstacleContainer = new THREE.Group();
      chunk.obstacles = [];
      chunk.add(chunk.obstacleContainer);

      if (chunk.position.z < 10) return; // Leave chicken starting area clear

      const lanes = [-LANE_SPACING, 0, LANE_SPACING];
      const zPositions = [-CHUNK_LENGTH * 0.3, CHUNK_LENGTH * 0.25];

      zPositions.forEach(zPos => {
        if (Math.random() > 0.85 / settings.obstacleDensity) return;

        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        const obsType = Math.floor(Math.random() * 4);

        if (obsType === 0 || obsType === 1) {
          // Hay Bales (Jump Over)
          const hayBaleGroup = new THREE.Group();
          hayBaleGroup.position.set(lane, 0, zPos);
          const hayGeo = new THREE.CylinderGeometry(0.9, 0.9, 1.4, 10);
          hayGeo.rotateZ(Math.PI / 2);
          const hayMesh = new THREE.Mesh(hayGeo, materials.hay);
          hayMesh.position.y = 0.7;
          hayMesh.castShadow = true;
          hayMesh.receiveShadow = true;
          hayBaleGroup.add(hayMesh);

          if (obsType === 1) {
            // Stacked second bale
            const topHay = new THREE.Mesh(hayGeo, materials.hay);
            topHay.position.set(0, 1.9, 0);
            topHay.castShadow = true;
            hayBaleGroup.add(topHay);
          }
          chunk.obstacleContainer.add(hayBaleGroup);
          chunk.obstacles.push({
            type: 'hay',
            lane: lane,
            z: zPos,
            radius: 1.1,
            height: obsType === 1 ? 2.5 : 1.4,
            jumpRequired: true,
            meshGroup: hayBaleGroup,
            hit: false
          });
        } else if (obsType === 2) {
          // Low Wooden Beam Arch (Duck / Slide Under)
          const beamArch = new THREE.Group();
          beamArch.position.set(0, 0, zPos);

          const postG = new THREE.BoxGeometry(0.5, 3.5, 0.5);
          const leftP = new THREE.Mesh(postG, materials.wood);
          leftP.position.set(-TRACK_WIDTH * 0.42, 1.75, 0);
          leftP.castShadow = true;
          beamArch.add(leftP);

          const rightP = new THREE.Mesh(postG, materials.wood);
          rightP.position.set(TRACK_WIDTH * 0.42, 1.75, 0);
          rightP.castShadow = true;
          beamArch.add(rightP);

          // Low cross beam
          const beamG = new THREE.BoxGeometry(TRACK_WIDTH * 0.9, 0.7, 0.7);
          const crossB = new THREE.Mesh(beamG, materials.wood);
          crossB.position.set(0, 2.2, 0);
          crossB.castShadow = true;
          beamArch.add(crossB);

          chunk.obstacleContainer.add(beamArch);
          chunk.obstacles.push({
            type: 'beam',
            lane: lane,
            z: zPos,
            radius: 2.2,
            height: 2.2,
            duckRequired: true,
            meshGroup: beamArch,
            hit: false
          });
        } else if (obsType === 3) {
          // Wooden Hurdle Jump
          const hurdle = new THREE.Group();
          hurdle.position.set(lane, 0, zPos);
          const hGeo = new THREE.BoxGeometry(2.4, 0.9, 0.2);
          const hMesh = new THREE.Mesh(hGeo, materials.wood);
          hMesh.position.y = 0.55;
          hMesh.castShadow = true;
          hurdle.add(hMesh);
          chunk.obstacleContainer.add(hurdle);

          chunk.obstacles.push({
            type: 'hurdle',
            lane: lane,
            z: zPos,
            radius: 1.0,
            height: 0.9,
            jumpRequired: true,
            meshGroup: hurdle,
            hit: false
          });
        }

        // Floating Golden Bonus Egg
        if (Math.random() > 0.35) {
          const eggGroup = new THREE.Group();
          eggGroup.position.set(lane, 2.2 + (obsType === 1 ? 1.0 : 0), zPos);
          const eggGeo = new THREE.SphereGeometry(0.4, 12, 12);
          eggGeo.scale(1, 1.35, 1);
          const eggMesh = new THREE.Mesh(eggGeo, materials.eggGold);
          eggMesh.castShadow = true;
          eggGroup.add(eggMesh);
          eggGroup.name = "goldenEgg";
          chunk.obstacleContainer.add(eggGroup);

          chunk.obstacles.push({
            type: 'egg',
            lane: lane,
            z: zPos,
            radius: 1.2,
            meshGroup: eggGroup,
            collected: false
          });
        }
      });
    }

    // Initialize course chunks
    for (let i = 0; i < NUM_CHUNKS; i++) {
      chunks.push(createChunkMesh(i));
    }

    // --- GAMEPLAY CONTROL & PHYSICS ENGINE ---
    const GRAVITY = -58.0;
    const JUMP_FORCE = 16.5;

    function playerJump() {
      if (gameState.status === 'GAME OVER') {
        restartGame();
        return;
      }
      if (gameState.isGrounded) {
        gameState.vy = JUMP_FORCE;
        gameState.isGrounded = false;
        gameState.isJumping = true;
        spawnFeatherBurst(chickenGroup.position.x, chickenGroup.position.y + 0.8, chickenGroup.position.z, 20);
        spawnDustPuff(chickenGroup.position.x, 0, chickenGroup.position.z);
      }
    }

    function playerDuck() {
      if (gameState.status === 'GAME OVER') return;
      gameState.isDucking = true;
      gameState.duckTimer = 0.55;
    }

    function shiftLane(dir) {
      if (gameState.status === 'GAME OVER') return;
      gameState.lane = Math.max(-1, Math.min(1, gameState.lane + dir));
      gameState.targetLaneX = gameState.lane * LANE_SPACING;
      spawnDustPuff(chickenGroup.position.x, 0, chickenGroup.position.z);
    }

    function restartGame() {
      gameState.status = 'PLAYING';
      gameState.score = 0;
      gameState.lives = 3;
      gameState.livesDisplay = '❤️❤️❤️';
      gameState.invulnerableTimer = 0;
      gameState.lane = 0;
      gameState.targetLaneX = 0;
      gameState.laneX = 0;
      gameState.y = 0.4;
      gameState.vy = 0;
      gameState.isGrounded = true;
      gameState.isJumping = false;
      gameState.isDucking = false;
      chickenGroup.position.set(0, 0.4, 0);

      // Re-populate all chunks
      chunks.forEach((chunk, idx) => {
        populateChunkObstacles(chunk, idx + 1);
      });

      updateGuiDisplays();
      spawnFeatherBurst(0, 1.5, 0, 30);
    }

    function triggerCrash() {
      if (gameState.invulnerableTimer > 0) return;

      gameState.lives--;
      gameState.invulnerableTimer = 1.0;
      spawnFeatherBurst(chickenGroup.position.x, chickenGroup.position.y + 1.2, chickenGroup.position.z, 50);

      if (gameState.lives <= 0) {
        gameState.lives = 0;
        gameState.livesDisplay = '💀 GAME OVER';
        gameState.status = 'GAME OVER';
      } else if (gameState.lives === 2) {
        gameState.livesDisplay = '❤️❤️';
      } else if (gameState.lives === 1) {
        gameState.livesDisplay = '❤️';
      }

      updateGuiDisplays();
    }

    function updateGuiDisplays() {
      settings.gameStatus = gameState.status;
      settings.livesDisplay = gameState.livesDisplay;
      settings.scoreDisplay = Math.floor(gameState.score);
      settings.highScoreDisplay = Math.floor(gameState.highScore);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- RE-ROLL PROCEDURAL VARIATION ---
    function rerollScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      settings.colorScheme = randomScheme;

      const randomPreset = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      settings.animationPreset = randomPreset;

      settings.animSpeed = Number((0.8 + Math.random() * 0.5).toFixed(2));
      settings.runSpeed = Number((24.0 + Math.random() * 12.0).toFixed(1));

      updateMaterialsFromSettings();

      chunks.forEach((chunk, idx) => {
        populateChunkObstacles(chunk, idx + 1);
      });

      playerJump();
      spawnFeatherBurst(chickenGroup.position.x, chickenGroup.position.y + 1.2, chickenGroup.position.z, 45);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- USER INTERACTION LISTENERS (KEYBOARD & TOUCH/CLICK) ---
    window.addEventListener('keydown', (e) => {
      // Gameplay keys
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
        shiftLane(-1);
      } else if (e.code === 'KeyD' || e.code === 'ArrowRight') {
        shiftLane(1);
      } else if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
        playerJump();
      } else if (e.code === 'KeyS' || e.code === 'ArrowDown') {
        playerDuck();
      } else if (e.code === 'KeyR') {
        restartGame();
      }

      // 'H' key to toggle lil-gui visibility
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownTime;

      // Quick click / tap without dragging
      if (dist < 8 && elapsed < 350) {
        if (settings.clickToReroll && settings.gameMode === 'Showcase (Auto-Run)') {
          rerollScene();
        } else {
          // Playable tap controls: tap left half -> move left, right half -> move right, center -> jump
          const normalizedX = e.clientX / window.innerWidth;
          if (normalizedX < 0.35) {
            shiftLane(-1);
          } else if (normalizedX > 0.65) {
            shiftLane(1);
          } else {
            playerJump();
          }
        }
      }
    });

    // --- LIL-GUI SETUP (STANDARD, UNALTERED STYLING) ---
    const gui = new GUI({ title: 'Escape the Coop' });

    // 🎮 GAMEPLAY & PLAY NOW CONTROLLER
    const fGame = gui.addFolder('🎮 Play Game');
    fGame.add(settings, 'gameMode', ['Playable Game', 'Showcase (Auto-Run)']).name('Mode').onChange(v => {
      gameState.mode = v;
      if (v === 'Playable Game') {
        restartGame();
      } else {
        gameState.status = 'SHOWCASE';
        updateGuiDisplays();
      }
    });
    fGame.add(settings, 'startGame').name('▶ Start / Restart Game');
    fGame.add(settings, 'gameStatus').name('Status').listen().disable();
    fGame.add(settings, 'livesDisplay').name('Lives').listen().disable();
    fGame.add(settings, 'scoreDisplay').name('Score').listen().disable();
    fGame.add(settings, 'highScoreDisplay').name('High Score').listen().disable();
    fGame.add(settings, 'moveLeft').name('← Move Left (A / Left)');
    fGame.add(settings, 'moveRight').name('→ Move Right (D / Right)');
    fGame.add(settings, 'jumpAction').name('↑ Flap-Jump (Space / Up)');
    fGame.add(settings, 'duckAction').name('↓ Duck / Slide (S / Down)');
    fGame.open();

    const fTheme = gui.addFolder('Theme & Colors');
    fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange(updateMaterialsFromSettings);
    fTheme.add(settings, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateMaterialsFromSettings);
    fTheme.addColor(settings, 'skyColor').name('Sky / Fog Color').onChange(updateMaterialsFromSettings).listen();
    fTheme.addColor(settings, 'groundColor').name('Ground Color').onChange(updateMaterialsFromSettings).listen();
    fTheme.addColor(settings, 'groundAltColor').name('Ground Alt Color').onChange(updateMaterialsFromSettings).listen();
    fTheme.addColor(settings, 'woodColor').name('Wood / Fences').onChange(updateMaterialsFromSettings).listen();
    fTheme.addColor(settings, 'hayColor').name('Hay Bales').onChange(updateMaterialsFromSettings).listen();
    fTheme.addColor(settings, 'chickenBodyColor').name('Chicken Feathers').onChange(updateMaterialsFromSettings).listen();
    fTheme.addColor(settings, 'chickenAccentColor').name('Comb & Accent').onChange(updateMaterialsFromSettings).listen();
    fTheme.addColor(settings, 'chickenBeakColor').name('Beak & Legs').onChange(updateMaterialsFromSettings).listen();
    fTheme.addColor(settings, 'barnColor').name('Barn & Silo').onChange(updateMaterialsFromSettings).listen();

    const fAnim = gui.addFolder('Camera & Animation');
    fAnim.add(settings, 'animationPreset', ANIMATION_PRESETS).name('Camera Preset');
    fAnim.add(settings, 'animSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
    fAnim.add(settings, 'runSpeed', 10.0, 50.0, 1.0).name('Run Velocity');
    fAnim.add(settings, 'cameraZoom', 0.4, 2.5, 0.05).name('Isometric Zoom').onChange(v => {
      camera.zoom = v;
      camera.updateProjectionMatrix();
    });

    const fJuice = gui.addFolder('Juice & Procedural');
    fJuice.add(settings, 'clickToReroll').name('Click Scene to Re-roll (Showcase)');
    fJuice.add(settings, 'obstacleDensity', 0.2, 2.5, 0.1).name('Obstacle Density');
    fJuice.add(settings, 'triggerBurst').name('Burst Feathers');
    fJuice.add(settings, 'rerollNow').name('Re-roll Scene Now');

    const fRender = gui.addFolder('Render Quality');
    fRender.add(settings, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
    });
    fRender.add(settings, 'shadows').name('Cast Shadows').onChange(v => {
      renderer.shadowMap.enabled = v;
      sunLight.castShadow = v;
    });
    fRender.add(settings, 'wireframe').name('Wireframe Mode').onChange(updateMaterialsFromSettings);

    // Initial theme apply
    updateMaterialsFromSettings();
    updateGuiDisplays();

    // --- MAIN ANIMATION & RENDER LOOP ---
    const clock = new THREE.Clock();
    let globalTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const rawDelta = clock.getDelta();
      const delta = Math.min(rawDelta, 0.1) * settings.animSpeed;
      globalTime += delta;

      const isGameOver = gameState.status === 'GAME OVER';
      const effectiveRunSpeed = isGameOver ? 0 : settings.runSpeed;

      // 1. Endless Track Scrolling: Chunks move from +Z (front) to -Z (back)
      const scrollStep = effectiveRunSpeed * delta;
      if (!isGameOver) {
        gameState.totalDistance += scrollStep;
        gameState.score += scrollStep * 0.25;
        if (gameState.score > gameState.highScore) {
          gameState.highScore = gameState.score;
        }
        settings.scoreDisplay = Math.floor(gameState.score);
        settings.highScoreDisplay = Math.floor(gameState.highScore);
      }

      courseGroup.children.forEach(chunk => {
        chunk.position.z -= scrollStep;

        // Animate windmill blades on chunk
        const windmillBlades = chunk.getObjectByName("windmillBlades");
        if (windmillBlades) {
          windmillBlades.rotation.z += delta * 1.8;
        }

        // Animate floating golden eggs
        chunk.traverse(obj => {
          if (obj.name === "goldenEgg") {
            obj.rotation.y += delta * 3.0;
            obj.position.y = 2.2 + Math.sin(globalTime * 4.0 + chunk.id) * 0.25;
          }
        });

        // Recycle chunk when it scrolls past behind the chicken (-Z)
        if (chunk.position.z < -CHUNK_LENGTH * 3.0) {
          // Find the furthest forward chunk (+Z)
          let maxZ = 0;
          courseGroup.children.forEach(c => {
            if (c.position.z > maxZ) maxZ = c.position.z;
          });
          chunk.position.z = maxZ + CHUNK_LENGTH;
          populateChunkObstacles(chunk, Math.floor(chunk.position.z / CHUNK_LENGTH));
        }
      });

      // 2. Obstacle Proximity, Collision Detection & Showcase AI
      const isShowcase = settings.gameMode === 'Showcase (Auto-Run)';

      if (gameState.invulnerableTimer > 0) {
        gameState.invulnerableTimer -= delta;
      }

      courseGroup.children.forEach(chunk => {
        if (chunk.obstacles) {
          chunk.obstacles.forEach(obs => {
            const obsWorldZ = chunk.position.z + obs.z;
            const obsWorldX = obs.lane;

            // SHOWCASE AI AUTO-DODGE & JUMP
            if (isShowcase && !isGameOver) {
              // Obstacles approaching from +Z towards chicken at z = 0
              if (obsWorldZ < 6.0 && obsWorldZ > 1.0) {
                // If obstacle is in chicken's lane
                if (Math.abs(obsWorldX - gameState.laneX) < 1.5) {
                  if (obs.jumpRequired && gameState.isGrounded) {
                    playerJump();
                  } else if (obs.duckRequired && !gameState.isDucking) {
                    playerDuck();
                  }
                }
              }
            }

            // PLAYABLE GAME HIT & COLLECT DETECTION
            if (!isGameOver && Math.abs(obsWorldZ - 0) < 1.2) {
              const dx = Math.abs(obsWorldX - gameState.laneX);

              // Golden Egg Collection
              if (obs.type === 'egg' && !obs.collected && dx < 1.6) {
                obs.collected = true;
                obs.meshGroup.visible = false;
                gameState.score += 50;
                spawnFeatherBurst(gameState.laneX, 2.0, 0, 20);
                updateGuiDisplays();
              }

              // Hay / Hurdle Obstacle Collision
              if ((obs.type === 'hay' || obs.type === 'hurdle') && !obs.hit && dx < 1.3) {
                if (gameState.y < 1.1) { // Not high enough in jump
                  obs.hit = true;
                  triggerCrash();
                }
              }

              // Beam Arch Collision
              if (obs.type === 'beam' && !obs.hit) {
                if (!gameState.isDucking) { // Did not duck
                  obs.hit = true;
                  triggerCrash();
                }
              }
            }
          });
        }
      });

      // 3. Chicken Physics & Movement Interpolation
      // Smooth lane transition
      gameState.laneX += (gameState.targetLaneX - gameState.laneX) * Math.min(1.0, delta * 14.0);
      chickenGroup.position.x = gameState.laneX;

      // Invulnerability visual flicker
      if (gameState.invulnerableTimer > 0) {
        chickenGroup.visible = Math.floor(globalTime * 20) % 2 === 0;
      } else {
        chickenGroup.visible = true;
      }

      // Vertical jumping physics
      if (!gameState.isGrounded) {
        gameState.vy += GRAVITY * delta;
        gameState.y += gameState.vy * delta;

        if (gameState.y <= 0.4) {
          gameState.y = 0.4;
          gameState.vy = 0;
          gameState.isGrounded = true;
          gameState.isJumping = false;
          // Landing dust
          spawnDustPuff(chickenGroup.position.x - 0.3, 0, chickenGroup.position.z);
          spawnDustPuff(chickenGroup.position.x + 0.3, 0, chickenGroup.position.z);
        }
      }

      // Ducking timer
      if (gameState.isDucking) {
        gameState.duckTimer -= delta;
        if (gameState.duckTimer <= 0) {
          gameState.isDucking = false;
        }
      }

      // Chicken Running Cycle & Bobbing
      const runFreq = effectiveRunSpeed * 0.65;
      gameState.runCycle += delta * runFreq;

      const stride = Math.sin(gameState.runCycle);
      const hop = Math.abs(Math.cos(gameState.runCycle));

      chickenGroup.position.y = gameState.y + (gameState.isGrounded && !isGameOver ? hop * 0.22 : 0);

      // Ducking crouch deformation
      if (gameState.isDucking) {
        chickenGroup.scale.set(1.3, 0.55, 1.4);
        headGroup.position.y = 0.9;
        headGroup.position.z = 0.85;
      } else if (!gameState.isGrounded) {
        // Airborne stretch
        const jumpStretch = Math.min(Math.max(gameState.vy * 0.02, -0.2), 0.3);
        chickenGroup.scale.set(1.0 - jumpStretch * 0.5, 1.0 + jumpStretch, 1.0 - jumpStretch * 0.5);
        headGroup.position.y = 1.65;
        headGroup.position.z = 0.55;
      } else {
        // Normal stride
        chickenGroup.scale.set(1.0, 1.0, 1.0);
        headGroup.position.y = 1.65;
        headGroup.position.z = 0.55;
      }

      // Leg animations (counter-phase swing)
      if (gameState.isGrounded && !gameState.isDucking && !isGameOver) {
        leftLegGroup.rotation.x = stride * 0.8;
        rightLegGroup.rotation.x = -stride * 0.8;

        // Step dust on contact
        if (Math.sin(gameState.runCycle - delta * runFreq) < 0 && stride >= 0) {
          spawnDustPuff(chickenGroup.position.x + 0.35, 0, chickenGroup.position.z);
        }
        if (Math.sin(gameState.runCycle - delta * runFreq) > 0 && stride <= 0) {
          spawnDustPuff(chickenGroup.position.x - 0.35, 0, chickenGroup.position.z);
        }
      } else if (gameState.isDucking) {
        leftLegGroup.rotation.x = 1.2;
        rightLegGroup.rotation.x = 1.2;
      } else if (isGameOver) {
        leftLegGroup.rotation.x = 0;
        rightLegGroup.rotation.x = 0;
      } else {
        // Airborne legs tucked back
        leftLegGroup.rotation.x = 0.5;
        rightLegGroup.rotation.x = 0.5;
      }

      // Wing flapping (frantic flapping when airborne / smooth when running)
      if (!gameState.isGrounded) {
        gameState.wingFlapAngle = Math.sin(globalTime * 36.0) * 1.2;
      } else if (!isGameOver) {
        gameState.wingFlapAngle = Math.sin(gameState.runCycle * 2.0) * 0.25;
      } else {
        gameState.wingFlapAngle = 0;
      }
      leftWingGroup.rotation.z = -gameState.wingFlapAngle;
      rightWingGroup.rotation.z = gameState.wingFlapAngle;

      // Head & tail bobbing
      if (!isGameOver) {
        headGroup.rotation.x = Math.sin(gameState.runCycle) * 0.15;
        headGroup.rotation.y = Math.cos(gameState.runCycle * 0.5) * 0.08;
        tailGroup.rotation.x = Math.sin(gameState.runCycle * 2.0) * 0.2 - 0.2;
      }

      // 4. Update Particle Systems
      featherParticles.forEach(p => {
        if (p.mesh.visible && p.life > 0) {
          p.life -= delta / p.maxLife;
          if (p.life <= 0) {
            p.mesh.visible = false;
          } else {
            p.vel.y += GRAVITY * 0.25 * delta;
            p.vel.x *= 0.96;
            p.vel.z *= 0.96;
            p.mesh.position.addScaledVector(p.vel, delta);
            p.mesh.rotation.x += p.rotVel.x * delta;
            p.mesh.rotation.y += p.rotVel.y * delta;
            p.mesh.rotation.z += p.rotVel.z * delta;

            const sc = p.scale * Math.sin(p.life * Math.PI * 0.5);
            p.mesh.scale.set(sc, sc, sc);
          }
        }
      });

      dustParticles.forEach(d => {
        if (d.mesh.visible && d.life > 0) {
          d.life -= delta / d.maxLife;
          if (d.life <= 0) {
            d.mesh.visible = false;
          } else {
            d.mesh.position.addScaledVector(d.vel, delta);
            d.mesh.material.opacity = d.life * 0.6;
            const sc = d.scale * (1.0 + (1.0 - d.life) * 1.5);
            d.mesh.scale.set(sc, sc, sc);
          }
        }
      });

      // 5. Apply 8 Preconfigured Animation Choreographies
      const t = globalTime;
      const preset = settings.animationPreset;

      if (!controls.state || controls.state === -1) {
        if (preset === 'Static Isometric') {
          camera.position.set(baseIsoPos.x, baseIsoPos.y, baseIsoPos.z);
          cameraTarget.set(0, 1.5, 0);
        } else if (preset === 'Gentle Drone Hover') {
          const swayX = Math.sin(t * 0.6) * 3.5;
          const swayY = Math.cos(t * 0.8) * 2.5;
          const swayZ = Math.sin(t * 0.5) * 3.0;
          camera.position.set(baseIsoPos.x + swayX, baseIsoPos.y + swayY, baseIsoPos.z + swayZ);
          cameraTarget.set(0, 1.5 + Math.sin(t * 0.7) * 0.5, 0);
        } else if (preset === 'Dynamic Side-Track') {
          const angle = Math.PI / 4 + Math.sin(t * 0.4) * 0.55;
          const radius = 60;
          camera.position.set(Math.cos(angle) * radius, 42 + Math.cos(t * 0.5) * 4.0, Math.sin(angle) * radius);
          cameraTarget.set(0, 1.5, 0);
        } else if (preset === 'Cinematic Chase') {
          const chickenY = chickenGroup.position.y;
          camera.position.set(24 + gameState.laneX * 0.5, 28 + (chickenY - 0.4) * 0.8, 38);
          cameraTarget.set(gameState.laneX * 0.6, chickenY + 0.8, -2);
        } else if (preset === 'Low-Angle Hero Arc') {
          const heroAngle = Math.PI / 4 + Math.sin(t * 0.3) * 0.25;
          const heroRadius = 38;
          camera.position.set(Math.cos(heroAngle) * heroRadius, 14 + Math.sin(t * 0.5) * 2.0, Math.sin(heroAngle) * heroRadius);
          cameraTarget.set(gameState.laneX * 0.5, 3.2, -4);
        } else if (preset === 'Overhead Tactical Tilt') {
          camera.position.set(28, 68 + Math.sin(t * 0.5) * 3.0, 28);
          cameraTarget.set(gameState.laneX * 0.3, 0, -8);
        } else if (preset === 'Rhythm Bounce') {
          const camBob = hop * 1.2;
          camera.position.set(baseIsoPos.x, baseIsoPos.y + camBob, baseIsoPos.z);
          cameraTarget.set(0, 1.5 + camBob * 0.5, 0);
        } else if (preset === 'Panoramic Wide Dolly') {
          const dollyAngle = t * 0.15;
          const dollyRadius = 62;
          camera.position.set(Math.cos(dollyAngle) * dollyRadius, 45 + Math.sin(t * 0.3) * 5.0, Math.sin(dollyAngle) * dollyRadius);
          cameraTarget.set(0, 2.0, 0);
        }
      }

      controls.target.lerp(cameraTarget, 0.08);
      controls.update();

      // Render scene
      renderer.render(scene, camera);
    }

    // --- WINDOW RESIZING ---
    window.addEventListener('resize', onWindowResize);

    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const currentAspect = w / h;

      camera.left = -viewSize * currentAspect / 2;
      camera.right = viewSize * currentAspect / 2;
      camera.top = viewSize / 2;
      camera.bottom = -viewSize / 2;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);
    }

    // Start running the endless loop
    animate();
  </script>
</body>
</html>
