<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Golden Discount Cascade - % & 50% OFF</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0902;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
</head>
<body>
  <div id="webgl-container"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import GUI from "lil-gui";

    // =========================================================================
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      return whiteHot ? vec3(pow(heat, 0.85)) : ironbow(heat);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(rend, toScreen = false) {
        if (!toScreen) rend.setRenderTarget(this.fbo);
        rend.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) rend.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(rend) {
        rend.setRenderTarget(this.fbos[1 - this.currentFBO]);
        rend.render(this.orthoScene, this.orthoCamera);
        rend.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(rend) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(rend);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(rend);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(rend);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(rend, params = {}) {
        this.renderer = rend;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.1,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xf6aa1c),
          raysColorHex: params.raysColorHex || '#f6aa1c',

          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : true,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 2.5,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.28,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0xffda73),
          anamorphicColorHex: params.anamorphicColorHex || '#ffda73',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.018,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.08,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.65,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
        this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.raysThreshold } },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.anamorphicThreshold }, smoothWidth: { value: this.settings.anamorphicSmoothWidth } },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scn, cam) {
        if (!this.settings.enabled) {
          this.renderer.render(scn, cam);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scn, cam);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const anamorphic = root.addFolder("Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        const rays = root.addFolder("Light Rays (Godrays)");
        rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Density (Spread)").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysMaxDensity", 0.1, 1.0, 0.05).name("Max Density").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDistanceAttenuation", 0.5, 4.0, 0.1).name("Distance Atten").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysThreshold", 0.0, 0.8, 0.01).name("Threshold").onChange(() => this.updateSettings());
        rays.addColor(this.settings, "raysColorHex").name("Ray Color").onChange((v) => {
          this.settings.raysColor.set(v);
          this.updateSettings();
        });

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Gain").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Noise").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
        vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());

        bloom.close();
        anamorphic.close();
        rays.close();
        lens.close();
        vision.close();
        root.close();
        return root;
      }
    }

    // --- PROCEDURAL STUDIO ENVIRONMENT (PMREM) ---
    function buildStudioEnvironment(rend) {
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x0c0b0a);

      const panelGeom = new THREE.PlaneGeometry(16, 16);

      const p1 = new THREE.Mesh(panelGeom, new THREE.MeshBasicMaterial({ color: 0xffeed4 }));
      p1.position.set(16, 12, 12);
      p1.lookAt(0, 0, 0);
      envScene.add(p1);

      const p2 = new THREE.Mesh(panelGeom, new THREE.MeshBasicMaterial({ color: 0x99ccff }));
      p2.position.set(-16, 6, 10);
      p2.lookAt(0, 0, 0);
      envScene.add(p2);

      const stripGeom = new THREE.PlaneGeometry(30, 4);
      const p3 = new THREE.Mesh(stripGeom, new THREE.MeshBasicMaterial({ color: 0xffffff }));
      p3.position.set(0, 20, 0);
      p3.rotation.x = Math.PI / 2;
      envScene.add(p3);

      const p4 = new THREE.Mesh(new THREE.PlaneGeometry(35, 35), new THREE.MeshBasicMaterial({ color: 0x22170d }));
      p4.position.set(0, -18, 0);
      p4.rotation.x = -Math.PI / 2;
      envScene.add(p4);

      const pmremGenerator = new THREE.PMREMGenerator(rend);
      pmremGenerator.compileEquirectangularShader();
      const envMap = pmremGenerator.fromScene(envScene).texture;
      pmremGenerator.dispose();
      return envMap;
    }
    const studioEnvMap = buildStudioEnvironment(renderer);
    scene.environment = studioEnvMap;

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xfff1db, 2.2);
    dirLight1.position.set(15, 20, 18);
    dirLight1.castShadow = true;
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(settings.accentColor, 1.6);
    dirLight2.position.set(-18, -8, -10);

    const pointLight = new THREE.PointLight(settings.primaryColor, 2.8, 40);
    pointLight.position.set(0, 4, 6);

    // --- TEXTURE GENERATOR FOR "50% OFF" BADGES AND COINS ---
    function generate50OffCanvas(priHex, secHex, badHex) {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");

      const radGrad = ctx.createRadialGradient(512, 512, 40, 512, 512, 500);
      radGrad.addColorStop(0, priHex);
      radGrad.addColorStop(0.65, secHex);
      radGrad.addColorStop(1, badHex);
      ctx.fillStyle = radGrad;
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      ctx.lineWidth = 3;
      for (let r = 80; r <= 460; r += 32) {
        ctx.beginPath();
        ctx.arc(512, 512, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = priHex;
      ctx.lineWidth = 20;
      ctx.beginPath();
      ctx.arc(512, 512, 475, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(512, 512, 452, 0, Math.PI * 2);
      ctx.stroke();

      const numBeads = 40;
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      for (let i = 0; i < numBeads; i++) {
        const a = (i / numBeads) * Math.PI * 2;
        const bx = 512 + Math.cos(a) * 440;
        const by = 512 + Math.sin(a) * 440;
        ctx.beginPath();
        ctx.arc(bx, by, 7.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.font = "bold 44px 'Arial Black', sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
      ctx.shadowBlur = 14;
      ctx.fillText("★ SPECIAL DISCOUNT ★", 512, 220);
      ctx.restore();

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 240px 'Arial Black', 'Impact', sans-serif";

      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillText("50%", 512 + 6, 420 + 8);

      const textGrad = ctx.createLinearGradient(300, 300, 720, 560);
      textGrad.addColorStop(0, "#ffffff");
      textGrad.addColorStop(0.45, priHex);
      textGrad.addColorStop(1, "#fff8e0");
      ctx.fillStyle = textGrad;
      ctx.fillText("50%", 512, 420);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
      ctx.lineWidth = 6;
      ctx.strokeText("50%", 512, 420);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = badHex;
      ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
      ctx.shadowBlur = 22;
      const rx = 240, ry = 580, rw = 544, rh = 155, rad = 30;
      ctx.beginPath();
      ctx.moveTo(rx + rad, ry);
      ctx.lineTo(rx + rw - rad, ry);
      ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + rad);
      ctx.lineTo(rx + rw, ry + rh - rad);
      ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - rad, ry + rh);
      ctx.lineTo(rx + rad, ry + rh);
      ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - rad);
      ctx.lineTo(rx, ry + rad);
      ctx.quadraticCurveTo(rx, ry, rx + rad, ry);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = priHex;
      ctx.lineWidth = 8;
      ctx.stroke();

      ctx.font = "900 135px 'Arial Black', 'Impact', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
      ctx.shadowBlur = 10;
      ctx.fillText("OFF", 512, 655);
      ctx.restore();

      ctx.save();
      ctx.font = "bold 52px sans-serif";
      ctx.fillStyle = priHex;
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
      ctx.shadowBlur = 10;
      ctx.fillText("★ ★ ★ ★ ★", 512, 805);
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8;
      return tex;
    }

    let badgeCanvasTexture = generate50OffCanvas(settings.primaryColor, settings.secondaryColor, settings.badgeColor);

    // --- 3D GEOMETRIES CREATION ---
    function createPercentGeometry() {
      const slash = new THREE.Shape();
      const angle = 58 * (Math.PI / 180);
      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);
      const hw = 0.22;
      const hl = 1.85;

      const p1 = { x: -hl * cosA - hw * sinA, y: -hl * sinA + hw * cosA };
      const p2 = { x:  hl * cosA - hw * sinA, y:  hl * sinA + hw * cosA };
      const p3 = { x:  hl * cosA + hw * sinA, y:  hl * sinA - hw * cosA };
      const p4 = { x: -hl * cosA + hw * sinA, y: -hl * sinA - hw * cosA };

      slash.moveTo(p1.x, p1.y);
      slash.lineTo(p2.x, p2.y);
      slash.lineTo(p3.x, p3.y);
      slash.lineTo(p4.x, p4.y);
      slash.closePath();

      const c1 = new THREE.Shape();
      const cx1 = -1.0, cy1 = 0.92, ro = 0.58, ri = 0.26;
      c1.absarc(cx1, cy1, ro, 0, Math.PI * 2, false);
      const h1 = new THREE.Path();
      h1.absarc(cx1, cy1, ri, 0, Math.PI * 2, true);
      c1.holes.push(h1);

      const c2 = new THREE.Shape();
      const cx2 = 1.0, cy2 = -0.92;
      c2.absarc(cx2, cy2, ro, 0, Math.PI * 2, false);
      const h2 = new THREE.Path();
      h2.absarc(cx2, cy2, ri, 0, Math.PI * 2, true);
      c2.holes.push(h2);

      const geom = new THREE.ExtrudeGeometry([slash, c1, c2], {
        depth: 0.38,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.07,
        bevelOffset: 0,
        bevelSegments: 4,
        curveSegments: 26
      });
      geom.center();
      return geom;
    }

    function createBadgeGeometry() {
      const shape = new THREE.Shape();
      const w = 2.4, h = 3.1, r = 0.45;
      const x = -w / 2, y = -h / 2;

      shape.moveTo(x + r, y);
      shape.lineTo(x + w - r, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + r);
      shape.lineTo(x + w, y + h * 0.72);
      shape.lineTo(x + w * 0.75, y + h);
      shape.lineTo(x + w * 0.25, y + h);
      shape.lineTo(x, y + h * 0.72);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      shape.closePath();

      const hole = new THREE.Path();
      hole.absarc(0, y + h * 0.86, 0.2, 0, Math.PI * 2, true);
      shape.holes.push(hole);

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.18,
        bevelEnabled: true,
        bevelThickness: 0.08,
        bevelSize: 0.06,
        bevelSegments: 3,
        curveSegments: 22
      });
      geom.center();
      return geom;
    }

    function createCoinGeometry() {
      return new THREE.CylinderGeometry(1.4, 1.4, 0.22, 44, 1, false);
    }

    function createStarGeometry() {
      const shape = new THREE.Shape();
      const numPoints = 8;
      const outerR = 1.45;
      const innerR = 0.95;
      for (let i = 0; i < numPoints * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = (i / (numPoints * 2)) * Math.PI * 2 - Math.PI / 2;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) shape.moveTo(px, py);
        else shape.lineTo(px, py);
      }
      shape.closePath();

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.22,
        bevelEnabled: true,
        bevelThickness: 0.08,
        bevelSize: 0.06,
        bevelSegments: 3
      });
      geom.center();
      return geom;
    }

    const geomPercent = createPercentGeometry();
    const geomBadge = createBadgeGeometry();
    const geomCoin = createCoinGeometry();
    const geomStar = createStarGeometry();

    // --- MATERIALS ---
    const matGoldPrimary = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(settings.primaryColor),
      metalness: settings.metalness,
      roughness: settings.roughness,
      clearcoat: settings.clearcoat,
      clearcoatRoughness: 0.12,
      reflectivity: 0.95,
      envMap: studioEnvMap
    });

    const matGoldSecondary = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(settings.secondaryColor),
      metalness: settings.metalness,
      roughness: settings.roughness + 0.05,
      clearcoat: settings.clearcoat,
      clearcoatRoughness: 0.15,
      reflectivity: 0.95,
      envMap: studioEnvMap
    });

    const matBadgeEmbossed = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(settings.primaryColor),
      map: badgeCanvasTexture,
      metalness: 0.88,
      roughness: 0.22,
      clearcoat: 0.4,
      reflectivity: 0.9,
      envMap: studioEnvMap
    });

    // --- CASCADE SYMBOL OBJECTS POOL ---
    const NUM_SYMBOLS = 76;
    const symbols = [];
    const cascadeGroup = new THREE.Group();
    scene.add(cascadeGroup);

    for (let i = 0; i < NUM_SYMBOLS; i++) {
      const typeChoice = Math.random();
      let mesh;

      if (typeChoice < 0.45) {
        const useSecondary = Math.random() > 0.65;
        mesh = new THREE.Mesh(geomPercent, useSecondary ? matGoldSecondary : matGoldPrimary);
      } else if (typeChoice < 0.72) {
        mesh = new THREE.Mesh(geomCoin, matBadgeEmbossed);
      } else if (typeChoice < 0.88) {
        mesh = new THREE.Mesh(geomBadge, matBadgeEmbossed);
      } else {
        mesh = new THREE.Mesh(geomStar, matGoldPrimary);
      }

      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const scale = THREE.MathUtils.randFloat(0.65, 1.85);
      mesh.scale.set(scale, scale, scale);

      const objData = {
        mesh,
        baseX: THREE.MathUtils.randFloatSpread(26),
        baseY: THREE.MathUtils.randFloatSpread(20),
        z: THREE.MathUtils.randFloat(-65, 22),
        speedZ: THREE.MathUtils.randFloat(0.08, 0.16),
        rotSpeedX: THREE.MathUtils.randFloatSpread(0.016),
        rotSpeedY: THREE.MathUtils.randFloatSpread(0.024),
        rotSpeedZ: THREE.MathUtils.randFloatSpread(0.014),
        wobbleSpeedX: THREE.MathUtils.randFloat(0.8, 1.6),
        wobbleSpeedY: THREE.MathUtils.randFloat(0.7, 1.5),
        wobblePhase: Math.random() * Math.PI * 2,
        baseScale: scale
      };

      mesh.position.set(objData.baseX, objData.baseY, objData.z);
      mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);

      cascadeGroup.add(mesh);
      symbols.push(objData);
    }

    // --- FOREGROUND & BACKGROUND BOKEH PARTICLES ---
    function createBokehTexture() {
      const c = document.createElement("canvas");
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext("2d");
      const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, "rgba(255,255,255,1)");
      g.addColorStop(0.35, "rgba(255,240,200,0.85)");
      g.addColorStop(0.7, "rgba(255,200,120,0.25)");
      g.addColorStop(1, "rgba(255,200,100,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(64, 64, 64, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(c);
    }

    const bokehTex = createBokehTexture();
    const NUM_BOKEH = 320;
    const bokehGeom = new THREE.BufferGeometry();
    const bokehPositions = new Float32Array(NUM_BOKEH * 3);
    const bokehScales = new Float32Array(NUM_BOKEH);

    for (let i = 0; i < NUM_BOKEH; i++) {
      bokehPositions[i * 3 + 0] = THREE.MathUtils.randFloatSpread(40);
      bokehPositions[i * 3 + 1] = THREE.MathUtils.randFloatSpread(30);
      bokehPositions[i * 3 + 2] = THREE.MathUtils.randFloat(-70, 22);
      bokehScales[i] = THREE.MathUtils.randFloat(0.8, 3.2);
    }
    bokehGeom.setAttribute("position", new THREE.BufferAttribute(bokehPositions, 3));

    const bokehMat = new THREE.PointsMaterial({
      size: 2.2,
      map: bokehTex,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      color: new THREE.Color(settings.primaryColor)
    });
    const bokehPoints = new THREE.Points(bokehGeom, bokehMat);
    scene.add(bokehPoints);

    // --- INSTANTIATE POSTPROCESSOR SUITE (From postprocessing/PostProcessor.js) ---
    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      bloomEnabled: true,
      bloomStrength: 1.15,
      bloomRadius: 0.55,
      bloomThreshold: 0.18,
      chromaticAberration: 0.016,
      vignetteBoost: 1.08,
      vignetteReduction: 0.65,
      noiseIntensity: 0.012,
      raysEnabled: false,
      anamorphicEnabled: true,
      anamorphicIntensity: 2.4,
      anamorphicColorHex: "#ffda73",
      visionMode: 'Normal (Cinematic)'
    });
    postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);

    // --- COLOR APPLICATION ---
    function applyColors() {
      if (settings.greenScreen) {
        scene.background = new THREE.Color(0x00ff00);
        scene.fog.color.set(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
        bokehPoints.visible = false;
      } else {
        scene.background = new THREE.Color(settings.backgroundColor);
        scene.fog.color.set(settings.backgroundColor);
        renderer.setClearColor(settings.backgroundColor, 1.0);
        bokehPoints.visible = settings.bokehParticles;
      }

      matGoldPrimary.color.set(settings.primaryColor);
      matGoldSecondary.color.set(settings.secondaryColor);
      bokehMat.color.set(settings.primaryColor);
      pointLight.color.set(settings.primaryColor);
      dirLight2.color.set(settings.accentColor);

      badgeCanvasTexture.dispose();
      badgeCanvasTexture = generate50OffCanvas(settings.primaryColor, settings.secondaryColor, settings.badgeColor);
      matBadgeEmbossed.map = badgeCanvasTexture;
      matBadgeEmbossed.color.set(settings.primaryColor);
      matBadgeEmbossed.needsUpdate = true;
    }

    function selectColorScheme(schemeName) {
      const sc = COLOR_SCHEMES[schemeName];
      if (!sc) return;
      settings.colorScheme = schemeName;
      settings.primaryColor = sc.primary;
      settings.secondaryColor = sc.secondary;
      settings.accentColor = sc.accent;
      settings.badgeColor = sc.badge;
      settings.backgroundColor = sc.background;

      applyColors();
      if (gui) {
        fTheme.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // --- PROCEDURAL RANDOMIZER (DO NOT TOUCH POSTPROCESSING SETTINGS) ---
    function randomizeScene() {
      // 1. Re-roll visual color scheme from the 18 preconfigured schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      selectColorScheme(randomScheme);

      // 2. Re-roll camera animation mode from the 8 preconfigured animations
      const randomAnim = ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)];
      settings.cameraAnimation = randomAnim;

      // 3. Re-roll motion parameters
      settings.animationSpeed = THREE.MathUtils.randFloat(0.65, 1.6);
      settings.cascadeSpeed = THREE.MathUtils.randFloat(0.7, 1.8);
      settings.tumbleSpeed = THREE.MathUtils.randFloat(0.6, 2.0);
      settings.floatWobble = THREE.MathUtils.randFloat(0.4, 1.4);

      // 4. Re-roll geometric state of cascade symbols (positions, tumble velocities, scales)
      symbols.forEach(s => {
        s.baseX = THREE.MathUtils.randFloatSpread(26);
        s.baseY = THREE.MathUtils.randFloatSpread(20);
        s.speedZ = THREE.MathUtils.randFloat(0.08, 0.18);
        s.rotSpeedX = THREE.MathUtils.randFloatSpread(0.02);
        s.rotSpeedY = THREE.MathUtils.randFloatSpread(0.03);
        s.rotSpeedZ = THREE.MathUtils.randFloatSpread(0.02);
        const sc = THREE.MathUtils.randFloat(0.6, 1.9);
        s.mesh.scale.set(sc, sc, sc);
      });

      // NOTE: Postprocessing settings in postProcessor.settings are INTENTIONALLY PRESERVED and NEVER changed!

      // Update control panel displays for randomized parameters only
      if (gui) {
        fTheme.controllersRecursive().forEach(c => c.updateDisplay());
        fAnim.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // --- CLICK TO RANDOMIZE (DISCRIMINATING CLICKS FROM ORBIT DRAGS) ---
    let pointerStartX = 0;
    let pointerStartY = 0;
    let pointerStartTime = 0;

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".lil-gui")) return;
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
      pointerStartTime = performance.now();
    });

    window.addEventListener("pointerup", (e) => {
      if (e.target.closest(".lil-gui")) return;
      const dx = e.clientX - pointerStartX;
      const dy = e.clientY - pointerStartY;
      const dist = Math.hypot(dx, dy);
      const elapsed = performance.now() - pointerStartTime;

      if (dist < 6 && elapsed < 400 && settings.clickToRandomize) {
        randomizeScene();
      }
    });

    // --- H KEY TO TOGGLE ALL UI ---
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        if (gui) {
          gui._hidden ? gui.show() : gui.hide();
        }
      }
    });

    // --- LIL-GUI SETUP (DEFAULT UNTOUCHED STYLES) ---
    const gui = new GUI({ title: "Golden Cascade Settings" });

    // 1. Scene & Color Themes
    const fTheme = gui.addFolder("Color Theme & Greenscreen");
    fTheme.add(settings, "colorScheme", Object.keys(COLOR_SCHEMES)).name("Color Scheme").onChange(selectColorScheme);
    fTheme.add(settings, "greenScreen").name("Green Screen (#00ff00)").onChange(applyColors);
    fTheme.addColor(settings, "primaryColor").name("Primary Gold").onChange(applyColors);
    fTheme.addColor(settings, "secondaryColor").name("Secondary Gold").onChange(applyColors);
    fTheme.addColor(settings, "accentColor").name("Accent / Rim").onChange(applyColors);
    fTheme.addColor(settings, "badgeColor").name("Badge Plate").onChange(applyColors);
    fTheme.addColor(settings, "backgroundColor").name("Background").onChange(applyColors);

    // 2. Animation & Motion
    const fAnim = gui.addFolder("Animation & Cascade");
    fAnim.add(settings, "cameraAnimation", ANIMATIONS).name("Camera Animation");
    fAnim.add(settings, "animationSpeed", 0.1, 3.0, 0.05).name("Global Speed");
    fAnim.add(settings, "cascadeSpeed", 0.1, 3.0, 0.05).name("Cascade Flow");
    fAnim.add(settings, "tumbleSpeed", 0.1, 3.0, 0.05).name("Symbol Tumble");
    fAnim.add(settings, "floatWobble", 0.0, 2.5, 0.05).name("Float Wobble");
    fAnim.add(settings, "bokehParticles").name("Bokeh Sparkles").onChange(applyColors);

    // 3. PostProcessor Suite Auto-Attachment (From postprocessing/PostProcessor.js)
    postProcessor.attachGUI(gui, "Post-Processing Suite");

    // 4. Material Finish & Rendering
    const fMat = gui.addFolder("Material & Quality");
    fMat.add(settings, "metalness", 0.0, 1.0, 0.02).name("Metalness").onChange(v => {
      matGoldPrimary.metalness = v;
      matGoldSecondary.metalness = v;
    });
    fMat.add(settings, "roughness", 0.0, 1.0, 0.02).name("Roughness").onChange(v => {
      matGoldPrimary.roughness = v;
      matGoldSecondary.roughness = v;
    });
    fMat.add(settings, "clearcoat", 0.0, 1.0, 0.05).name("Clearcoat").onChange(v => {
      matGoldPrimary.clearcoat = v;

    });
    fMat.add(settings, "dpr", 0.5, 2.5, 0.1).name("Pixel Ratio (DPR)").onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });

    // 5. Procedural Variation Mode
    const fProc = gui.addFolder("Procedural Generator");
    fProc.add(settings, "clickToRandomize").name("Click Scene to Re-roll");
    fProc.add({ randomize: randomizeScene }, "randomize").name("🎲 Randomize Scene Now");

    fTheme.close();
    fAnim.open();
    fMat.close();
    fProc.open();

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function updateCameraMotion(elapsed) {
      if (controls.state !== -1) {
        return;
      }

      const t = elapsed * 0.25 * settings.animationSpeed;
      const mode = settings.cameraAnimation;

      if (mode === "Static Camera") {
        camera.position.lerp(new THREE.Vector3(0, 1.2, 17), 0.03);
        controls.target.lerp(new THREE.Vector3(0, 0, -4), 0.03);
      } else if (mode === "Slow Cinematic Drift") {
        const cx = Math.sin(t * 0.9) * 4.5;
        const cy = 1.2 + Math.cos(t * 0.7) * 2.0;
        const cz = 17.0 + Math.sin(t * 0.5) * 3.0;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.035);
        controls.target.lerp(new THREE.Vector3(Math.sin(t * 0.4) * 1.5, 0, -4), 0.035);
      } else if (mode === "Helical Vortex") {
        const radius = 16.0 + Math.sin(t * 0.6) * 3.0;
        const cx = Math.cos(t * 0.7) * radius;
        const cz = Math.sin(t * 0.7) * radius;
        const cy = 2.0 + Math.sin(t * 1.1) * 3.2;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.03);
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.03);
      } else if (mode === "Tunnel Fly-Through") {
        const cx = Math.sin(t * 0.8) * 1.8;
        const cy = Math.cos(t * 0.6) * 1.4;
        const cz = 11.5 + Math.sin(t * 0.4) * 5.5;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.035);
        controls.target.lerp(new THREE.Vector3(0, 0, -32), 0.035);
      } else if (mode === "Floating Wave Swell") {
        const cx = Math.sin(t * 0.7) * 4.2;
        const cy = 2.4 + Math.sin(t * 1.4) * 2.8;
        const cz = 17.5 + Math.cos(t * 0.7) * 2.5;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.035);
        controls.target.lerp(new THREE.Vector3(0, Math.sin(t) * 1.4, -4), 0.035);
      } else if (mode === "Panoramic Orbit") {
        const cx = Math.sin(t * 0.5) * 20.0;
        const cz = Math.cos(t * 0.5) * 20.0;
        const cy = 2.5 + Math.cos(t * 0.9) * 2.0;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.025);
        controls.target.lerp(new THREE.Vector3(0, 0, -2), 0.025);
      } else if (mode === "Diagonal Slalom Flow") {
        const cx = Math.sin(t * 0.8) * 7.5;
        const cy = -Math.sin(t * 0.8) * 2.8 + 1.2;
        const cz = 17.0 + Math.cos(t * 0.6) * 3.5;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.035);
        controls.target.lerp(new THREE.Vector3(Math.sin(t + 0.4) * 2.5, 0, -5), 0.035);
      } else if (mode === "Breathing Suspense") {
        const cx = Math.sin(t * 0.4) * 1.5;
        const cy = 1.0 + Math.cos(t * 0.3) * 1.1;
        const cz = 15.5 + Math.sin(t * 0.25) * 2.0;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.025);
        controls.target.lerp(new THREE.Vector3(0, 0, -4), 0.025);
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();
      const speedMult = settings.animationSpeed;

      controls.update();
      updateCameraMotion(elapsed);

      // Auto Infinite Cascade Animation
      const flow = settings.cascadeSpeed * speedMult;
      const tumble = settings.tumbleSpeed * speedMult;
      const wobble = settings.floatWobble;

      symbols.forEach(s => {
        s.z += s.speedZ * flow * 1.8;

        if (s.z > 24) {
          s.z = -68 + (s.z - 24);
          s.baseX = THREE.MathUtils.randFloatSpread(28);
          s.baseY = THREE.MathUtils.randFloatSpread(22);
        }

        const wx = Math.sin(elapsed * s.wobbleSpeedX + s.wobblePhase) * wobble * 1.3;
        const wy = Math.cos(elapsed * s.wobbleSpeedY + s.wobblePhase) * wobble * 1.1;

        s.mesh.position.set(s.baseX + wx, s.baseY + wy, s.z);

        s.mesh.rotation.x += s.rotSpeedX * tumble * 60 * delta;
        s.mesh.rotation.y += s.rotSpeedY * tumble * 60 * delta;
        s.mesh.rotation.z += s.rotSpeedZ * tumble * 60 * delta;
      });

      // Shimmer Bokeh Particles
      if (settings.bokehParticles && !settings.greenScreen) {
        const posArr = bokehGeom.attributes.position.array;
        for (let i = 0; i < NUM_BOKEH; i++) {
          posArr[i * 3 + 2] += flow * 0.14;
          if (posArr[i * 3 + 2] > 22) {
            posArr[i * 3 + 2] = -70;
            posArr[i * 3 + 0] = THREE.MathUtils.randFloatSpread(40);
            posArr[i * 3 + 1] = THREE.MathUtils.randFloatSpread(30);
          }
        }
        bokehGeom.attributes.position.needsUpdate = true;
      }

      // Render Pipeline
      if (settings.greenScreen) {
        renderer.render(scene, camera);
      } else {
        postProcessor.renderScene(scene, camera);
      }
    }

    // --- WINDOW RESIZE HANDLING ---
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(settings.dpr);
      postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);
    });

    // Start
    applyColors();
    animate();
  </script>
</body>
