    // -------------------------------------------------------------
    // 1. BEVELED ACADEMIC CAP & EXTERIOR DRAPING TASSEL
    // -------------------------------------------------------------
    function createMortarboard() {
      capGroup = new THREE.Group();

      const diag = 1.84; // Corner radius from center
      const boardThickness = 0.08;

      // 1. Top Diamond Board Plate
      // Corners directly at (+diag, 0), (0, +diag), (-diag, 0), (0, -diag)
      // Corner 1 (+diag, 0) is strictly on the RIGHT (+X), 1.0 unit outside skull cap!
      const capShape = new THREE.Shape();
      capShape.moveTo(diag, 0);
      capShape.lineTo(0, diag);
      capShape.lineTo(-diag, 0);
      capShape.lineTo(0, -diag);
      capShape.closePath();

      const extrudeSettings = {
        steps: 1,
        depth: boardThickness,
        bevelEnabled: true,
        bevelThickness: 0.04,
        bevelSize: 0.04,
        bevelOffset: 0,
        bevelSegments: 3
      };
      const boardGeo = new THREE.ExtrudeGeometry(capShape, extrudeSettings);
      boardGeo.center();
      boardGeo.rotateX(Math.PI * 0.5);

      const boardMesh = new THREE.Mesh(boardGeo, capMat);
      boardMesh.castShadow = true;
      boardMesh.receiveShadow = false;
      capGroup.add(boardMesh);

      // 2. Seamless Gold Edge Trim Frame around diamond perimeter
      const outerDiag = diag + 0.045;
      const innerDiag = diag - 0.035;
      const frameShape = new THREE.Shape();
      frameShape.moveTo(outerDiag, 0);
      frameShape.lineTo(0, outerDiag);
      frameShape.lineTo(-outerDiag, 0);
      frameShape.lineTo(0, -outerDiag);
      frameShape.closePath();

      const hole = new THREE.Path();
      hole.moveTo(innerDiag, 0);
      hole.lineTo(0, innerDiag);
      hole.lineTo(-innerDiag, 0);
      hole.lineTo(0, -innerDiag);
      hole.closePath();
      frameShape.holes.push(hole);

      const frameGeo = new THREE.ExtrudeGeometry(frameShape, {
        steps: 1,
        depth: boardThickness + 0.05,
        bevelEnabled: true,
        bevelThickness: 0.015,
        bevelSize: 0.015,
        bevelSegments: 2
      });
      frameGeo.center();
      frameGeo.rotateX(Math.PI * 0.5);

      const frameMesh = new THREE.Mesh(frameGeo, capTrimMat);
      capGroup.add(frameMesh);

      // 3. Hollow Faceted Skull Cap (Centered at 0, 0 with radius 0.80)
      const skullRadiusTop = 0.80;
      const skullRadiusBottom = 0.66;
      const skullHeight = 0.55;
      const skullSegments = 16;

      // Outer cone wall
      const outerWallGeo = new THREE.CylinderGeometry(
        skullRadiusBottom,
        skullRadiusTop,
        skullHeight,
        skullSegments,
        1,
        true
      );
      outerWallGeo.translate(0, -skullHeight * 0.5 - boardThickness * 0.5, 0);
      const outerWallMesh = new THREE.Mesh(outerWallGeo, capUnderMat);
      outerWallMesh.castShadow = true;
      capGroup.add(outerWallMesh);

      // Inner cone wall (hollow interior)
      const innerWallGeo = new THREE.CylinderGeometry(
        skullRadiusBottom - 0.04,
        skullRadiusTop - 0.04,
        skullHeight - 0.02,
        skullSegments,
        1,
        true
      );
      innerWallGeo.translate(0, -skullHeight * 0.5 - boardThickness * 0.5, 0);
      const innerWallMesh = new THREE.Mesh(innerWallGeo, capUnderMat);
      capGroup.add(innerWallMesh);

      // Dark ceiling inside
      const ceilingGeo = new THREE.CircleGeometry(skullRadiusTop - 0.04, skullSegments);
      ceilingGeo.rotateX(Math.PI * 0.5);
      ceilingGeo.translate(0, -boardThickness * 0.5 - 0.01, 0);
      const ceilingMesh = new THREE.Mesh(ceilingGeo, capUnderMat);
      capGroup.add(ceilingMesh);

      // Gold bottom rim ring
      const skullRimGeo = new THREE.TorusGeometry(skullRadiusBottom, 0.035, 10, skullSegments);
      skullRimGeo.rotateX(Math.PI * 0.5);
      skullRimGeo.translate(0, -skullHeight - boardThickness * 0.5, 0);
      const skullRimMesh = new THREE.Mesh(skullRimGeo, capTrimMat);
      capGroup.add(skullRimMesh);

      // 4. Center Top Gold Button
      const buttonBaseGeo = new THREE.CylinderGeometry(0.12, 0.14, 0.06, 24);
      buttonBaseGeo.translate(0, boardThickness * 0.5 + 0.03, 0);
      const buttonBaseMesh = new THREE.Mesh(buttonBaseGeo, tasselBeadMat);
      capGroup.add(buttonBaseMesh);

      const buttonDomeGeo = new THREE.SphereGeometry(0.12, 24, 14, 0, Math.PI * 2, 0, Math.PI * 0.5);
      buttonDomeGeo.translate(0, boardThickness * 0.5 + 0.06, 0);
      const buttonDomeMesh = new THREE.Mesh(buttonDomeGeo, tasselBeadMat);
      capGroup.add(buttonDomeMesh);

      // -------------------------------------------------------------
      // 5. EXTERIOR DRAPING TASSEL (HANGS FREELY TO THE RIGHT OF CAP)
      // -------------------------------------------------------------
      tasselGroup = new THREE.Group();
      tasselGroup.position.set(0, boardThickness * 0.5 + 0.04, 0);

      // Cord runs across the top surface from center (0,0) to right corner (+diag, 0)
      const cordPoints = [
        new THREE.Vector3(0, 0.03, 0),
        new THREE.Vector3(0.55, 0.03, 0.02),
        new THREE.Vector3(1.20, 0.02, 0.01),
        new THREE.Vector3(1.75, 0.01, 0.00),
        new THREE.Vector3(1.88, -0.12, 0.00)
      ];
      const cordCurve = new THREE.CatmullRomCurve3(cordPoints);
      const cordGeo = new THREE.TubeGeometry(cordCurve, 32, 0.022, 8, false);
      const cordMesh = new THREE.Mesh(cordGeo, tasselMat);
      tasselGroup.add(cordMesh);

      // Turned Golden Ferrule Bead hanging over the right edge
      const beadPivot = new THREE.Group();
      beadPivot.position.set(1.88, -0.15, 0.00);

      const beadGeo = new THREE.CylinderGeometry(0.045, 0.075, 0.22, 16);
      const beadMesh = new THREE.Mesh(beadGeo, tasselBeadMat);
      beadPivot.add(beadMesh);

      const ringGeo = new THREE.TorusGeometry(0.08, 0.024, 8, 16);
      ringGeo.rotateX(Math.PI * 0.5);
      const ringMesh = new THREE.Mesh(ringGeo, tasselBeadMat);
      beadPivot.add(ringMesh);

      // 32 Flowing Silk Strands flaring gracefully in open space
      const skirtGroup = new THREE.Group();
      skirtGroup.position.set(0, -0.11, 0);

      const strandCount = 32;
      const strandLen = 1.25;

      for (let i = 0; i < strandCount; i++) {
        const angle = (i / strandCount) * Math.PI * 2;
        const spreadR = 0.035 + (i % 4) * 0.015;
        const tipSpreadR = 0.18 + ((i * 7) % 10) * 0.015;

        // Elegant outward and gravity curve
        const p0 = new THREE.Vector3(Math.cos(angle) * spreadR, 0, Math.sin(angle) * spreadR);
        const p1 = new THREE.Vector3(
          Math.cos(angle) * (spreadR * 1.6) + 0.04,
          -strandLen * 0.45,
          Math.sin(angle) * (spreadR * 1.6)
        );
        const p2 = new THREE.Vector3(
          Math.cos(angle + 0.25) * tipSpreadR + 0.10,
          -strandLen,
          Math.sin(angle + 0.25) * tipSpreadR + 0.04
        );

        const strandCurve = new THREE.CatmullRomCurve3([p0, p1, p2]);
        const sGeo = new THREE.TubeGeometry(strandCurve, 14, 0.009, 5, false);
        const sMesh = new THREE.Mesh(sGeo, tasselMat);
        skirtGroup.add(sMesh);

        // Tiny gold bead at tip
        const tipGeo = new THREE.SphereGeometry(0.016, 6, 6);
        tipGeo.translate(p2.x, p2.y, p2.z);
        const tipMesh = new THREE.Mesh(tipGeo, tasselBeadMat);
        skirtGroup.add(tipMesh);
      }
      beadPivot.add(skirtGroup);
      tasselGroup.add(beadPivot);

      capGroup.add(tasselGroup);

      // Positioning & Tilt matching reference composition
      capGroup.position.set(0.0, 1.85, -0.3);
      capGroup.rotation.x = THREE.MathUtils.degToRad(state.capTiltAngle); // -22 deg: front lifted
      capGroup.rotation.y = THREE.MathUtils.degToRad(12);
      capGroup.rotation.z = THREE.MathUtils.degToRad(-10);

      mainGroup.add(capGroup);

      tasselPhysics = {
        beadPivot: beadPivot,
        skirtGroup: skirtGroup,
        angleX: 0,
        angleZ: 0,
        velX: 0,
        velZ: 0
      };
    }
    createMortarboard();

    // -------------------------------------------------------------
    // 2. FLOATING GRADUATION DIPLOMA / SCROLL (FRONT-FACING UVs)
    // -------------------------------------------------------------
    let scrollMesh, scrollBasePositions;

    function createGraduationScroll() {
      scrollGroup = new THREE.Group();

      const segU = 90;
      const segV = 32;
      const width = 4.4;
      const height = 2.3;

      const scrollGeo = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let j = 0; j <= segV; j++) {
        const v = j / segV;
        const y = (v - 0.5) * height;

        for (let i = 0; i <= segU; i++) {
          const u = i / segU;

          let x, z;
          if (u < 0.22) {
            // Tight spiral scroll roll on the left
            const rollTau = u / 0.22;
            const rollAngle = rollTau * Math.PI * 3.6 - Math.PI * 3.0;
            const rollRadius = 0.15 + rollTau * 0.17;
            x = -2.0 + Math.cos(rollAngle) * rollRadius;
            z = Math.sin(rollAngle) * rollRadius;
          } else {
            // Expansive sweeping 3D parchment sheet
            const sheetTau = (u - 0.22) / (1.0 - 0.22);
            x = -2.0 + 0.30 + sheetTau * (width - 0.30);
            z = Math.sin(sheetTau * Math.PI * 1.4) * 0.44 + Math.pow(sheetTau, 2.0) * 0.38;
          }

          // Subtle arch across height
          z += Math.pow((v - 0.5) * 2, 2) * 0.08;

          positions.push(x, y, z);
          // Correct UV orientation: left to right, bottom to top
          uvs.push(u, v);
        }
      }

      // WINDING ORDER: (a, d, b) and (d, c, b) ensures normal faces +Z (towards camera)
      // This ensures text is readable normally and NOT mirrored!
      for (let j = 0; j < segV; j++) {
        for (let i = 0; i < segU; i++) {
          const a = j * (segU + 1) + i;
          const b = (j + 1) * (segU + 1) + i;
          const c = (j + 1) * (segU + 1) + (i + 1);
          const d = j * (segU + 1) + (i + 1);
          indices.push(a, d, b);
          indices.push(d, c, b);
        }
      }

      scrollGeo.setIndex(indices);
      scrollGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      scrollGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      scrollGeo.computeVertexNormals();

      scrollBasePositions = positions.slice();

      scrollMesh = new THREE.Mesh(scrollGeo, scrollMat);
      scrollMesh.castShadow = true;
      scrollMesh.receiveShadow = false;
      scrollGroup.add(scrollMesh);

      // Position scroll floating gracefully below cap
      scrollGroup.position.set(-0.15, -1.05, 0.45);
      scrollGroup.rotation.x = THREE.MathUtils.degToRad(-10);
      scrollGroup.rotation.y = THREE.MathUtils.degToRad(14);
      scrollGroup.rotation.z = THREE.MathUtils.degToRad(4);

      mainGroup.add(scrollGroup);

      // Ornate Ribbon Bow & Medallion on FRONT of scroll
      createRibbonAssembly();
    }

    let ribbonTailsGroup, ribbonTailMesh1, ribbonTailMesh2;

    function createRibbonAssembly() {
      ribbonGroup = new THREE.Group();
      // Positioned cleanly in FRONT of the parchment surface (z = 0.68)
      ribbonGroup.position.set(0.20, 0.22, 0.68);

      // 1. Folded 3D Satin Ribbon Loops
      function createBowLoop(scaleX, rotZ, offX, offY, scaleAll) {
        const loopGeo = new THREE.TorusGeometry(0.36, 0.12, 14, 32, Math.PI * 1.35);
        loopGeo.scale(scaleX * scaleAll, 0.75 * scaleAll, 0.55 * scaleAll);
        const loopMesh = new THREE.Mesh(loopGeo, ribbonMat);
        loopMesh.position.set(offX, offY, 0.04);
        loopMesh.rotation.z = rotZ;
        loopMesh.rotation.y = THREE.MathUtils.degToRad(offX > 0 ? 18 : -18);
        loopMesh.castShadow = true;
        ribbonGroup.add(loopMesh);

        // Gold trim piping
        const trimGeo = new THREE.TorusGeometry(0.36, 0.016, 6, 32, Math.PI * 1.35);
        trimGeo.scale(scaleX * scaleAll * 1.02, 0.76 * scaleAll, 0.58 * scaleAll);
        const trimMesh = new THREE.Mesh(trimGeo, ribbonTrimMat);
        trimMesh.position.copy(loopMesh.position);
        trimMesh.rotation.copy(loopMesh.rotation);
        ribbonGroup.add(trimMesh);
      }
      createBowLoop(1.0, THREE.MathUtils.degToRad(26), 0.34, 0.06, 1.0);
      createBowLoop(-1.0, THREE.MathUtils.degToRad(-26), -0.34, 0.06, 1.0);
      createBowLoop(1.0, THREE.MathUtils.degToRad(42), 0.22, 0.10, 0.75);
      createBowLoop(-1.0, THREE.MathUtils.degToRad(-42), -0.22, 0.10, 0.75);

      // 2. Center Knot Wrap
      const knotGeo = new THREE.CylinderGeometry(0.18, 0.19, 0.26, 18);
      knotGeo.rotateZ(Math.PI * 0.5);
      const knotMesh = new THREE.Mesh(knotGeo, ribbonMat);
      knotMesh.position.set(0, 0.06, 0.06);
      ribbonGroup.add(knotMesh);

      // 3. Central Gold Medallion Seal
      const medallionGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.08, 36);
      medallionGeo.rotateX(Math.PI * 0.5);
      const medallionMesh = new THREE.Mesh(medallionGeo, sealMat);
      medallionMesh.position.set(0, 0.06, 0.18);
      medallionMesh.castShadow = true;
      ribbonGroup.add(medallionMesh);

      const medRingGeo = new THREE.TorusGeometry(0.34, 0.038, 12, 36);
      const medRingMesh = new THREE.Mesh(medRingGeo, tasselBeadMat);
      medRingMesh.position.set(0, 0.06, 0.19);
      ribbonGroup.add(medRingMesh);

      const starGeo = new THREE.RingGeometry(0.12, 0.24, 8);
      const starMesh = new THREE.Mesh(starGeo, ribbonTrimMat);
      starMesh.position.set(0, 0.06, 0.225);
      ribbonGroup.add(starMesh);

      // 4. Flowing Ribbon Tails on FRONT of Diploma
      ribbonTailsGroup = new THREE.Group();
      ribbonTailsGroup.position.set(0, 0, 0.12);

      function createRibbonTail(startX, length, angle, isRight) {
        const segs = 24;
        const tailGeo = new THREE.PlaneGeometry(0.32, length, 2, segs);
        tailGeo.translate(0, -length * 0.5, 0);

        const pos = tailGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const y = pos.getY(i);
          const t = -y / length;
          // Curved across the diploma with forward Z bias
          const curveZ = Math.sin(t * Math.PI * 0.9) * 0.16 + t * 0.08 + 0.04;
          const curveX = (isRight ? 1 : -0.7) * (Math.pow(t, 1.4) * 0.45);
          pos.setZ(i, curveZ);
          pos.setX(i, pos.getX(i) + curveX);

          // Swallowtail V-cut notch
          if (t > 0.86) {
            const notchFactor = (1 - Math.abs(pos.getX(i) / 0.16)) * 0.18;
            pos.setY(i, pos.getY(i) + notchFactor);
          }
        }
        tailGeo.computeVertexNormals();

        const tailMesh = new THREE.Mesh(tailGeo, ribbonMat);
        tailMesh.position.set(startX, 0, 0);
        tailMesh.rotation.z = angle;
        tailMesh.castShadow = true;
        return tailMesh;
      }

      ribbonTailMesh1 = createRibbonTail(0.14, 1.55, THREE.MathUtils.degToRad(-30), true);
      ribbonTailMesh2 = createRibbonTail(-0.10, 1.35, THREE.MathUtils.degToRad(16), false);

      ribbonTailsGroup.add(ribbonTailMesh1);
      ribbonTailsGroup.add(ribbonTailMesh2);
      ribbonGroup.add(ribbonTailsGroup);

      scrollGroup.add(ribbonGroup);
    }
    createGraduationScroll();

    // -------------------------------------------------------------
    // 3. ATMOSPHERIC LIBRARY ENVIRONMENT & PARTICLES
    // -------------------------------------------------------------
    function createAtmosphere() {
      const domeGeo = new THREE.SphereGeometry(38, 24, 16);
      const domeMat = new THREE.MeshBasicMaterial({
        color: state.bgColor,
        side: THREE.BackSide
      });
      backgroundDome = new THREE.Mesh(domeGeo, domeMat);
      scene.add(backgroundDome);

      const pCount = 280;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pSpeeds = new Float32Array(pCount);

      for (let i = 0; i < pCount; i++) {
        pPos[i * 3 + 0] = (Math.random() - 0.5) * 16;
        pPos[i * 3 + 1] = (Math.random() - 0.5) * 12;
        pPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
        pSpeeds[i] = 0.2 + Math.random() * 0.8;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64;
      pCanvas.height = 64;
      const pCtx = pCanvas.getContext('2d');
      const radGrad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
      radGrad.addColorStop(0, 'rgba(255, 235, 175, 1)');
      radGrad.addColorStop(0.3, 'rgba(255, 200, 80, 0.6)');
      radGrad.addColorStop(1, 'rgba(255, 180, 50, 0)');
      pCtx.fillStyle = radGrad;
      pCtx.fillRect(0, 0, 64, 64);

      const pTexture = new THREE.CanvasTexture(pCanvas);
      const pMat = new THREE.PointsMaterial({
        size: 0.14,
        map: pTexture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        color: state.tasselColor
      });

      dustParticles = new THREE.Points(pGeo, pMat);
      dustParticles.userData = { speeds: pSpeeds };
      scene.add(dustParticles);
    }
    createAtmosphere();

    // ==========================================
    // COLOR PALETTE & SCHEME APPLICATION
    // ==========================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      state.colorScheme = schemeName;

      state.capColor = scheme.cap;
      state.capTrimColor = scheme.capTrim;
      state.capUnderColor = scheme.capUnder;
      state.tasselColor = scheme.tassel;
      state.tasselBeadColor = scheme.tasselBead;
      state.scrollColor = scheme.scroll;
      state.scrollInkColor = scheme.scrollInk;
      state.ribbonColor = scheme.ribbon;
      state.ribbonTrimColor = scheme.ribbonTrim;
      state.sealColor = scheme.seal;
      state.bgColor = scheme.bg;

      state.ambientColor = scheme.ambient;
      state.keyLightColor = scheme.keyLight;
      state.fillLightColor = scheme.fillLight;
      state.rimLightColor = scheme.rimLight;
      state.candleColor = scheme.candleLight;

      updateAllVisuals();
    }

    function updateAllVisuals() {
      capMat.color.set(state.capColor);
      capTrimMat.color.set(state.capTrimColor);
      capUnderMat.color.set(state.capUnderColor);
      tasselMat.color.set(state.tasselColor);
      tasselBeadMat.color.set(state.tasselBeadColor);
      ribbonMat.color.set(state.ribbonColor);
      ribbonTrimMat.color.set(state.ribbonTrimColor);
      sealMat.color.set(state.sealColor);

      updateDiplomaCanvas();

      ambientLight.color.set(state.ambientColor);
      ambientLight.intensity = state.ambientIntensity * state.lightMaster;

      keyLight.color.set(state.keyLightColor);
      keyLight.intensity = state.keyLightIntensity * state.lightMaster;
      keyLight.position.set(state.keyLightPosX, state.keyLightPosY, state.keyLightPosZ);

      fillLight.color.set(state.fillLightColor);
      fillLight.intensity = state.fillLightIntensity * state.lightMaster;

      rimLight.color.set(state.rimLightColor);
      rimLight.intensity = state.rimLightIntensity * state.lightMaster;

      diplomaFillLight.intensity = 1.2 * state.lightMaster;

      candleLight1.color.set(state.candleColor);
      candleLight1.intensity = state.candleIntensity * state.lightMaster;
      candleLight2.color.set(state.candleColor);
      candleLight2.intensity = state.candleIntensity * 0.85 * state.lightMaster;

      if (dustParticles) {
        dustParticles.material.color.set(state.tasselColor);
      }

      if (state.greenScreen) {
        scene.background = new THREE.Color('#00ff00');
        if (backgroundDome) backgroundDome.visible = false;
        if (dustParticles) dustParticles.visible = false;
      } else {
        scene.background = new THREE.Color(state.bgColor);
        if (backgroundDome) {
          backgroundDome.visible = true;
          backgroundDome.material.color.set(state.bgColor);
        }
        if (dustParticles) dustParticles.visible = true;
      }

      renderer.toneMappingExposure = state.exposure;
    }

    function adjustBrightness(hex, percent) {
      const num = parseInt(hex.replace('#', ''), 16);
      let r = (num >> 16) + Math.round(255 * percent);
      let g = ((num >> 8) & 0x00FF) + Math.round(255 * percent);
      let b = (num & 0x0000FF) + Math.round(255 * percent);
      r = Math.min(255, Math.max(0, r));
      g = Math.min(255, Math.max(0, g));
      b = Math.min(255, Math.max(0, b));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZER (UPON SCENE CLICK)
    // REQUIREMENT: DO NOT shuffle or change Postprocessing settings on random!
    // =========================================================================
    function randomizeScene() {
      // 1. Pick a random color scheme from the 19+ preconfigured options
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      state.colorScheme = chosenScheme;
      applyColorScheme(chosenScheme);

      // 2. Re-roll geometric parameters (without touching post-processing!)
      state.capScale = +(0.88 + Math.random() * 0.24).toFixed(2);
      state.capTiltAngle = +(-18 - Math.random() * 10).toFixed(1);
      state.tasselSwayAmp = +(0.7 + Math.random() * 0.7).toFixed(2);
      state.scrollWaveSpeed = +(0.7 + Math.random() * 0.6).toFixed(2);
      state.scrollUnfurlAmp = +(0.7 + Math.random() * 0.6).toFixed(2);
      state.ribbonFlutterAmp = +(0.7 + Math.random() * 0.7).toFixed(2);

      capGroup.scale.set(state.capScale, state.capScale, state.capScale);
      capGroup.rotation.x = THREE.MathUtils.degToRad(state.capTiltAngle);

      // 3. Update scene controllers (excluding Post-processing folder)
      gui.controllersRecursive().forEach(c => {
        // Only update if not inside postprocessing folder
        if (!c.parent || c.parent._title !== "Post Processing") {
          c.updateDisplay();
        }
      });
    }

    // Click Detection
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (!state.clickToRandomize) return;
      if (e.target.closest('.lil-gui')) return;

      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownTime;

      if (dist < 5 && elapsed < 300) {
        randomizeScene();
      }
    });

    // ==========================================
    // LIL-GUI SETUP
    // ==========================================
    const gui = new GUI({ title: '🎓 Academic Mortarboard & Scroll' });

    // Presets & Color Schemes
    gui.add(state, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Color Scheme')
      .onChange((name) => {
        applyColorScheme(name);
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      });

    // Camera Animations (8 preconfigured options)
    const animOptions = [
      'Static (No Camera Motion)',
      'Gentle Orbit (Slow 360°)',
      'Cinematic Fly-Through',
      'Ceremonial Rise & Fall',
      'Scroll Focus (Low Angle)',
      'Mortarboard Showcase (High Angle)',
      'Ascending Spiral',
      'Candlelight Side Sway'
    ];
    gui.add(state, 'cameraAnimation', animOptions).name('Camera Mode');

    // General Controls
    gui.add(state, 'animSpeed', 0.0, 3.0, 0.05).name('Anim Speed');
    gui.add(state, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => updateAllVisuals());
    gui.add(state, 'clickToRandomize').name('Click to Randomize');

    // Attach PostProcessor suite into lil-gui
    postProcessor.attachGUI(gui, "Post Processing");

    // Render & Display Settings
    const fRender = gui.addFolder('Renderer & Display');
    fRender.add(state, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fRender.add(state, 'antialias').name('Antialiasing').onChange(() => {
      initRenderer();
      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.enablePan = true;
      controls.screenSpacePanning = true;
      controls.minDistance = 2.0;
      controls.maxDistance = 22.0;
      postProcessor.renderer = renderer;
      postProcessor.setAntialias(state.antialias);
      postProcessor.setSize(window.innerWidth, window.innerHeight, state.dpr);
      updateAllVisuals();
    });
    fRender.close();

    // Lighting & Exposure Settings
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(state, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(v => renderer.toneMappingExposure = v);
    fLight.add(state, 'lightMaster', 0.1, 3.0, 0.05).name('Master Light').onChange(() => updateAllVisuals());

    fLight.addColor(state, 'ambientColor').name('Ambient Color').onChange(() => updateAllVisuals());
    fLight.add(state, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Intensity').onChange(() => updateAllVisuals());

    fLight.addColor(state, 'keyLightColor').name('Key Light Color').onChange(() => updateAllVisuals());
    fLight.add(state, 'keyLightIntensity', 0.0, 5.0, 0.1).name('Key Intensity').onChange(() => updateAllVisuals());
    fLight.add(state, 'keyLightPosX', -10, 10, 0.5).name('Key Pos X').onChange(() => updateAllVisuals());
    fLight.add(state, 'keyLightPosY', 0, 15, 0.5).name('Key Pos Y').onChange(() => updateAllVisuals());
    fLight.add(state, 'keyLightPosZ', -10, 10, 0.5).name('Key Pos Z').onChange(() => updateAllVisuals());

    fLight.addColor(state, 'fillLightColor').name('Fill Light Color').onChange(() => updateAllVisuals());
    fLight.add(state, 'fillLightIntensity', 0.0, 4.0, 0.1).name('Fill Intensity').onChange(() => updateAllVisuals());

    fLight.addColor(state, 'rimLightColor').name('Rim Light Color').onChange(() => updateAllVisuals());
    fLight.add(state, 'rimLightIntensity', 0.0, 6.0, 0.1).name('Rim Intensity').onChange(() => updateAllVisuals());

    fLight.addColor(state, 'candleColor').name('Candlelight Color').onChange(() => updateAllVisuals());
    fLight.add(state, 'candleIntensity', 0.0, 5.0, 0.1).name('Candle Intensity').onChange(() => updateAllVisuals());
    fLight.add(state, 'candleFlickerSpeed', 0.0, 3.0, 0.1).name('Flicker Speed');
    fLight.close();

    // Individual Colors
    const fColor = gui.addFolder('Color Customization');
    fColor.addColor(state, 'capColor').name('Cap Board').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'capTrimColor').name('Cap Gold Trim').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'capUnderColor').name('Skull Cap Base').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'tasselColor').name('Tassel Cord').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'tasselBeadColor').name('Tassel Bead & Button').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'scrollColor').name('Diploma Parchment').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'scrollInkColor').name('Diploma Ink').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'ribbonColor').name('Ribbon Bow').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'ribbonTrimColor').name('Ribbon Gold Trim').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'sealColor').name('Medallion Seal').onChange(() => updateAllVisuals());
    fColor.addColor(state, 'bgColor').name('Atmosphere Background').onChange(() => updateAllVisuals());
    fColor.close();

    // Geometry & Procedural Dynamics
    const fGeo = gui.addFolder('Geometry & Dynamics');
    fGeo.add(state, 'capScale', 0.6, 1.6, 0.05).name('Cap Scale').onChange(v => capGroup.scale.set(v, v, v));
    fGeo.add(state, 'capTiltAngle', -45, 10, 1).name('Cap Tilt').onChange(v => {
      capGroup.rotation.x = THREE.MathUtils.degToRad(v);
    });
    fGeo.add(state, 'tasselSwayAmp', 0.0, 2.5, 0.05).name('Tassel Sway');
    fGeo.add(state, 'scrollWaveSpeed', 0.1, 3.0, 0.1).name('Scroll Wave Speed');
    fGeo.add(state, 'scrollUnfurlAmp', 0.0, 2.5, 0.05).name('Unfurl Wave');
    fGeo.add(state, 'ribbonFlutterAmp', 0.0, 2.5, 0.05).name('Ribbon Flutter');
    fGeo.close();

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyH') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // ==========================================
    // ANIMATION & RENDER LOOP
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime() * state.animSpeed;

      // 1. Floating & Tilting of the Cap
      if (capGroup) {
        const floatY = Math.sin(time * 1.5) * 0.07;
        const wobbleZ = Math.cos(time * 1.1) * 0.025;
        const wobbleX = Math.sin(time * 0.9) * 0.020;

        capGroup.position.y = 1.85 + floatY;
        capGroup.rotation.z = THREE.MathUtils.degToRad(-10) + wobbleZ;
        capGroup.rotation.x = THREE.MathUtils.degToRad(state.capTiltAngle) + wobbleX;
        capGroup.rotation.y = THREE.MathUtils.degToRad(12) + Math.sin(time * 0.5) * 0.05;

        // 2. Tassel Swinging Physics
        if (tasselPhysics && tasselPhysics.beadPivot) {
          const swayTargetX = Math.sin(time * 1.6) * 0.28 * state.tasselSwayAmp;
          const swayTargetZ = Math.cos(time * 1.3) * 0.24 * state.tasselSwayAmp;

          const stiffness = 8.0;
          const damping = 3.5;
          const accelX = (swayTargetX - tasselPhysics.angleX) * stiffness - tasselPhysics.velX * damping;
          const accelZ = (swayTargetZ - tasselPhysics.angleZ) * stiffness - tasselPhysics.velZ * damping;

          tasselPhysics.velX += accelX * delta;
          tasselPhysics.velZ += accelZ * delta;
          tasselPhysics.angleX += tasselPhysics.velX * delta;
          tasselPhysics.angleZ += tasselPhysics.velZ * delta;

          tasselPhysics.beadPivot.rotation.x = tasselPhysics.angleX;
          tasselPhysics.beadPivot.rotation.z = tasselPhysics.angleZ;
        }
      }

      // 3. Floating and Gentle Unfurl Wave of the Scroll
      if (scrollGroup && scrollMesh && scrollBasePositions) {
        const sFloatY = Math.sin(time * 1.3 - 0.7) * 0.06;
        const sRollX = Math.cos(time * 0.9) * 0.020;
        scrollGroup.position.y = -1.05 + sFloatY;
        scrollGroup.rotation.x = THREE.MathUtils.degToRad(-10) + sRollX;

        const posAttr = scrollMesh.geometry.attributes.position;
        const count = posAttr.count;
        const waveFreq = 2.2 * state.scrollWaveSpeed;
        const waveAmp = 0.045 * state.scrollUnfurlAmp;

        for (let i = 0; i < count; i++) {
          const bx = scrollBasePositions[i * 3 + 0];
          const by = scrollBasePositions[i * 3 + 1];
          const bz = scrollBasePositions[i * 3 + 2];

          const factor = Math.max(0, (bx + 1.2) / 3.2);
          const waveZ = Math.sin(bx * 2.0 - time * waveFreq + by * 0.7) * waveAmp * factor;

          posAttr.setZ(i, bz + waveZ);
        }
        posAttr.needsUpdate = true;
      }

      // 4. Ribbon Tails Flutter
      if (ribbonTailMesh1 && ribbonTailMesh2) {
        const flutter1 = Math.sin(time * 2.6) * 0.10 * state.ribbonFlutterAmp;
        const flutter2 = Math.cos(time * 2.3 + 0.3) * 0.12 * state.ribbonFlutterAmp;
        ribbonTailMesh1.rotation.x = flutter1;
        ribbonTailMesh2.rotation.x = flutter2;
      }

      // 5. Candlelight Flicker
      if (candleLight1 && candleLight2) {
        const fSpeed = state.candleFlickerSpeed;
        const flicker1 = (Math.sin(time * 8.5 * fSpeed) * 0.15 + Math.cos(time * 13.7 * fSpeed) * 0.1);
        const flicker2 = (Math.cos(time * 7.8 * fSpeed) * 0.15 + Math.sin(time * 11.4 * fSpeed) * 0.1);

        candleLight1.intensity = Math.max(0.2, (state.candleIntensity + flicker1) * state.lightMaster);
        candleLight2.intensity = Math.max(0.2, (state.candleIntensity * 0.85 + flicker2) * state.lightMaster);
      }

      // 6. Dust Motes Motion
      if (dustParticles && dustParticles.visible) {
        const pPositions = dustParticles.geometry.attributes.position.array;
        const speeds = dustParticles.userData.speeds;
        for (let i = 0; i < speeds.length; i++) {
          pPositions[i * 3 + 1] += speeds[i] * 0.007 * state.animSpeed;
          pPositions[i * 3 + 0] += Math.sin(time * 0.35 + i) * 0.003;
          if (pPositions[i * 3 + 1] > 6) {
            pPositions[i * 3 + 1] = -6;
          }
        }
        dustParticles.geometry.attributes.position.needsUpdate = true;
      }

      // 7. Camera Animations (Preserving user wheel zoom & drag angles)
      const camOffset = camera.position.clone().sub(controls.target);
      const currentDist = camOffset.length();
      let polarAngle = Math.acos(Math.max(-1, Math.min(1, camOffset.y / currentDist)));
      let azimuth = Math.atan2(camOffset.x, camOffset.z);

      const mode = state.cameraAnimation;

      if (mode === 'Static (No Camera Motion)') {
        controls.autoRotate = false;
        controls.target.y += (baseTargetY - controls.target.y) * 0.04;
      }
      else if (mode === 'Gentle Orbit (Slow 360°)') {
        controls.autoRotate = false;
        const dTheta = 0.25 * delta * state.animSpeed;
        azimuth += dTheta;
        camOffset.x = currentDist * Math.sin(polarAngle) * Math.sin(azimuth);
        camOffset.z = currentDist * Math.sin(polarAngle) * Math.cos(azimuth);
        camOffset.y = currentDist * Math.cos(polarAngle);
        camera.position.copy(controls.target).add(camOffset);
        controls.target.y += (baseTargetY - controls.target.y) * 0.04;
      }
      else if (mode === 'Cinematic Fly-Through') {
        controls.autoRotate = false;
        const dTheta = 0.20 * delta * state.animSpeed;
        azimuth += dTheta;
        camOffset.x = currentDist * Math.sin(polarAngle) * Math.sin(azimuth);
        camOffset.z = currentDist * Math.sin(polarAngle) * Math.cos(azimuth);
        camOffset.y = currentDist * Math.cos(polarAngle);
        camera.position.copy(controls.target).add(camOffset);

        const targetSway = Math.sin(time * 0.45) * 0.20;
        controls.target.y += (baseTargetY + targetSway - controls.target.y) * 0.05;
      }
      else if (mode === 'Ceremonial Rise & Fall') {
        controls.autoRotate = false;
        const dTheta = 0.16 * delta * state.animSpeed;
        azimuth += dTheta;
        camOffset.x = currentDist * Math.sin(polarAngle) * Math.sin(azimuth);
        camOffset.z = currentDist * Math.sin(polarAngle) * Math.cos(azimuth);
        camOffset.y = currentDist * Math.cos(polarAngle);
        camera.position.copy(controls.target).add(camOffset);

        const targetElevation = Math.sin(time * 0.6) * 0.40;
        controls.target.y += (baseTargetY + targetElevation - controls.target.y) * 0.04;
      }
      else if (mode === 'Scroll Focus (Low Angle)') {
        controls.autoRotate = false;
        const dTheta = 0.22 * delta * state.animSpeed;
        azimuth += dTheta;
        camOffset.x = currentDist * Math.sin(polarAngle) * Math.sin(azimuth);
        camOffset.z = currentDist * Math.sin(polarAngle) * Math.cos(azimuth);
        camOffset.y = currentDist * Math.cos(polarAngle);
        camera.position.copy(controls.target).add(camOffset);

        controls.target.y += (-0.85 - controls.target.y) * 0.04;
      }
      else if (mode === 'Mortarboard Showcase (High Angle)') {
        controls.autoRotate = false;
        const dTheta = 0.22 * delta * state.animSpeed;
        azimuth += dTheta;
        camOffset.x = currentDist * Math.sin(polarAngle) * Math.sin(azimuth);
        camOffset.z = currentDist * Math.sin(polarAngle) * Math.cos(azimuth);
        camOffset.y = currentDist * Math.cos(polarAngle);
        camera.position.copy(controls.target).add(camOffset);

        controls.target.y += (1.6 - controls.target.y) * 0.04;
      }
      else if (mode === 'Ascending Spiral') {
        controls.autoRotate = false;
        const dTheta = 0.32 * delta * state.animSpeed;
        azimuth += dTheta;
        camOffset.x = currentDist * Math.sin(polarAngle) * Math.sin(azimuth);
        camOffset.z = currentDist * Math.sin(polarAngle) * Math.cos(azimuth);
        camOffset.y = currentDist * Math.cos(polarAngle);
        camera.position.copy(controls.target).add(camOffset);

        const spiralHeight = Math.sin(time * 0.4) * 0.55;
        controls.target.y += (baseTargetY + spiralHeight - controls.target.y) * 0.04;
      }
      else if (mode === 'Candlelight Side Sway') {
        controls.autoRotate = false;
        const swayDelta = Math.cos(time * 0.75) * 0.25 * delta * state.animSpeed;
        azimuth += swayDelta;
        camOffset.x = currentDist * Math.sin(polarAngle) * Math.sin(azimuth);
        camOffset.z = currentDist * Math.sin(polarAngle) * Math.cos(azimuth);
        camOffset.y = currentDist * Math.cos(polarAngle);
        camera.position.copy(controls.target).add(camOffset);
        controls.target.y += (baseTargetY - controls.target.y) * 0.04;
      }

      controls.update();

      // Render through PostProcessor
      postProcessor.renderScene(scene, camera);
    }
    animate();

    // ==========================================
    // WINDOW RESIZE LISTENER
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, state.dpr);
    });
  </script>
</body>
</html>
