<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic Balancer and Dispatcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050711;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // --- 21 Preconfigured Color Schemes ---
    const COLOR_SCHEMES = {

      },
      'Monochromatic': {

        secondary: '#0077b6',
        accent: '#90e0ef',
        server: '#0b1b36',
        serverGlow: '#00b4d8',
        background: '#020914'
      },
      'Analogous': {
        primary: '#00f5d4',
        secondary: '#00bbf9',
        accent: '#38b000',
        server: '#0b2024',
        serverGlow: '#70e000',
        background: '#030f12'
      },
      'Complementary': {
        primary: '#00d2ff',
        secondary: '#ff9100',

      },
      'Split-complementary': {

      },
      'Triadic': {

      },
      'Tetradic': {

        serverGlow: '#ff3d00',
        background: '#090514'
      },
      'Double split-complementary': {

        secondary: '#673ab7',
        accent: '#ff9800',
        server: '#172129',
        serverGlow: '#ffc107',
        background: '#080c14'
      },
      'Achromatic (Black & White)': {
        primary: '#ffffff',
        secondary: '#b8b8b8',
        accent: '#e5e5e5',
        server: '#161616',
        serverGlow: '#ffffff',
        background: '#030303'
      },
      'Achromatic (White & Black)': {
        primary: '#141414',
        secondary: '#333333',
        accent: '#4f4f4f',
        server: '#d6d9e0',
        serverGlow: '#222222',
        background: '#eef1f6'
      },
      'Achromatic + Accent (B&W + Red)': {
        primary: '#ff1744',
        secondary: '#f0f0f0',
        accent: '#ff5252',
        server: '#181818',
        serverGlow: '#ff1744',
        background: '#050505'
      },
      'Achromatic + Accent (W&B + Red)': {
        primary: '#d50000',
        secondary: '#222222',
        accent: '#ff1744',
        server: '#dcdfe6',
        serverGlow: '#d50000',
        background: '#f2f4f8'
      },
      'Neutral + Accent': {
        primary: '#ffb703',
        secondary: '#8d99ae',
        accent: '#fb8500',
        server: '#27293d',
        serverGlow: '#ffb703',
        background: '#0e1017'
      },
      'Amber Blaze (#F6AA1C)': {
        primary: '#F6AA1C',
        secondary: '#BC3908',
        accent: '#941B0C',
        server: '#351206',
        serverGlow: '#F6AA1C',
        background: '#220901'
      },
      'Cyber Teal (#63D1CF)': {
        primary: '#63D1CF',
        secondary: '#5BC0BE',
        accent: '#4BAD9E',
        server: '#0B132B',
        serverGlow: '#63D1CF',
        background: '#000000'
      },
      'Amethyst Glow (#AA60C8)': {
        primary: '#AA60C8',
        secondary: '#D69ADE',
        accent: '#C9A3C6',
        server: '#1b0833',
        serverGlow: '#D69ADE',
        background: '#0D001D'
      },
      'Sunburst Matrix (#FEF1BE)': {
        primary: '#FFBA00',
        secondary: '#008189',
        accent: '#FEF1BE',
        server: '#00474D',
        serverGlow: '#FFBA00',
        background: '#061210'
      },
      'Neon Biohazard (#D4FFB0)': {
        primary: '#7FFF00',
        secondary: '#00B894',
        accent: '#D4FFB0',
        server: '#0A3322',
        serverGlow: '#7FFF00',
        background: '#05140A'
      },
      'Solar Ember (#FFE8CC)': {
        primary: '#FF8C00',
        secondary: '#C7501A',
        accent: '#FFE8CC',
        server: '#3D1050',
        serverGlow: '#FF8C00',
        background: '#0E0618'
      },
      'Deep Twilight (#E8E0FF)': {
        primary: '#B38FFF',
        secondary: '#6A3DE8',
        accent: '#E8E0FF',
        server: '#1A1250',
        serverGlow: '#6A3DE8',
        background: '#090612'
      },
      'Hyper Synth (#E0FBFF)': {
        primary: '#00F0FF',
        secondary: '#D40078',
        accent: '#E0FBFF',
        server: '#1E0A3D',
        serverGlow: '#00F0FF',
        background: '#05020F'
      }
    };

    // --- State & Parameters ---
    const params = {
      streamCount: 6,
      animationSpeed: 1.0,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true,
      clickToRandomize: true,

      colorScheme: 'Original',
      greenscreen: false,
      primaryColor: COLOR_SCHEMES['Original'].primary,
      secondaryColor: COLOR_SCHEMES['Original'].secondary,
      accentColor: COLOR_SCHEMES['Original'].accent,
      serverColor: COLOR_SCHEMES['Original'].server,
      serverGlowColor: COLOR_SCHEMES['Original'].serverGlow,
      bgColor: COLOR_SCHEMES['Original'].background,

      cameraAnimation: 'Slow Cinematic Orbit',

      exposure: 1.25,
      ambientIntensity: 0.8,
      ambientColor: '#ffffff',
      keyIntensity: 3.0,
      keyColor: '#edf6ff',
      keyPosX: 25,
      keyPosY: 40,
      keyPosZ: 30,
      prismLightIntensity: 5.0,
      prismLightColor: '#9d4edd',
      gatewayLightIntensity: 4.5,
      gatewayLightColor: '#00f0ff',
      serverRimLightIntensity: 2.5,
      serverRimLightColor: '#00ff88'
    };

    // --- Canvas & Renderer Setup ---
    const canvas = document.getElementById('webgl-canvas');
    let renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.pixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);
    scene.fog = new THREE.FogExp2(params.bgColor, 0.0055);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 500);
    camera.position.set(-20, 24, 52);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 160;
    controls.minDistance = 6;
    controls.screenSpacePanning = true;
    controls.target.set(6, 7, 0);

    const cameraTarget = new THREE.Vector3(6, 7, 0);

    // --- Lighting Setup ---
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(params.keyColor, params.keyIntensity);
    keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const prismPointLight = new THREE.PointLight(params.prismLightColor, params.prismLightIntensity, 50, 1.2);
    prismPointLight.position.set(0, 8.5, 0);
    scene.add(prismPointLight);

    const gatewayPointLight = new THREE.PointLight(params.gatewayLightColor, params.gatewayLightIntensity, 45, 1.2);
    gatewayPointLight.position.set(-36, 8.5, 0);
    scene.add(gatewayPointLight);

    const serverRimLight = new THREE.DirectionalLight(params.serverRimLightColor, params.serverRimLightIntensity);
    serverRimLight.position.set(-15, 20, -35);
    scene.add(serverRimLight);

    // --- Shaders Definition ---

    // 1. Perfectly Round Glowing Particle Shader
    const RoundParticleShader = {
      vertexShader: `
        uniform float uTime;
        uniform float uSize;
        attribute float aScale;
        attribute vec3 aColor;
        varying vec3 vColor;
        void main() {
          vColor = aColor;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = uSize * aScale * (320.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float dist = length(coord);
          if (dist > 0.5) discard;
          float core = smoothstep(0.18, 0.0, dist);
          float halo = smoothstep(0.5, 0.0, dist);
          float alpha = halo * 0.85 + core * 0.65;
          vec3 finalColor = mix(vColor, vec3(1.0), core * 0.85);
          gl_FragColor = vec4(finalColor, alpha);
        }
      `
    };

    // 2. High-Tech Holographic Cyber Ground Grid Shader
    const CyberFloorShader = {
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uGridColor;
        uniform vec3 uBgColor;
        uniform vec3 uAccentColor;
        uniform float uTime;
        uniform vec3 uCenterPos;
        varying vec3 vWorldPos;

        void main() {
          vec2 coord = vWorldPos.xz;
          
          // Main grid
          vec2 grid = abs(fract(coord * 0.25 - 0.5) - 0.5) / fwidth(coord * 0.25);
          float line = 1.0 - min(min(grid.x, grid.y), 1.0);

          // Sub fine grid
          vec2 subGrid = abs(fract(coord * 1.0 - 0.5) - 0.5) / fwidth(coord * 1.0);
          float subLine = (1.0 - min(min(subGrid.x, subGrid.y), 1.0)) * 0.35;

          // Expanding radar sweep ring from prism center
          float dist = length(vWorldPos.xz - uCenterPos.xz);
          float radar = sin(dist * 0.2 - uTime * 2.8);
          radar = smoothstep(0.88, 1.0, radar) * smoothstep(130.0, 0.0, dist);

          // Circuit bus line running from Gateway to Servers
          float mainBus = 1.0 - smoothstep(0.0, 0.8, abs(vWorldPos.z));
          float busPulse = sin(vWorldPos.x * 0.4 - uTime * 6.0);
          busPulse = smoothstep(0.6, 1.0, busPulse) * mainBus * step(-55.0, vWorldPos.x) * step(vWorldPos.x, 38.0);

          // Radial distance fade
          float fade = smoothstep(140.0, 20.0, dist);

          vec3 color = uBgColor;
          color += uGridColor * (line * 0.75 + subLine * 0.3) * fade;
          color += uAccentColor * radar * 0.9 * fade;
          color += mix(uGridColor, vec3(1.0), 0.7) * busPulse * 1.2;

          gl_FragColor = vec4(color, 1.0);
        }
      `
    };

    // 3. Volumetric Data Laser Beam Shader
    const DataBeamShader = {
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
          vViewPosition = -mvPos.xyz;
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform vec3 uCoreColor;
        uniform float uTime;
        uniform float uSpeed;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        void main() {
          vec3 normal = normalize(vNormal);
          vec3 viewDir = normalize(vViewPosition);
          float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 2.2);

          // Traveling high-velocity data wave pulses
          float wave1 = sin((vUv.x * 30.0 - uTime * 8.0 * uSpeed));
          float wave2 = cos((vUv.x * 60.0 - uTime * 16.0 * uSpeed));
          float pulse = (wave1 * 0.5 + 0.5) * 0.4 + (wave2 * 0.5 + 0.5) * 0.35;

          // Bright laser core luminescence
          float core = pow(max(1.0 - abs(vUv.y - 0.5) * 2.0, 0.0), 3.0);

          vec3 col = mix(uColor, uCoreColor, core * 0.8 + pulse * 0.3);
          col = mix(col, vec3(1.0), core * 0.6 + pulse * 0.4);
          float alpha = core * 0.85 + fresnel * 0.5 + pulse * 0.35;

          gl_FragColor = vec4(col, min(alpha, 1.0));
        }
      `
    };

    // 4. Balanced Data Stream Conduit Shader
    const StreamConduitShader = {
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
          vViewPosition = -mvPos.xyz;
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform vec3 uAccentColor;
        uniform float uTime;
        uniform float uSpeed;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        void main() {
          vec3 normal = normalize(vNormal);
          vec3 viewDir = normalize(vViewPosition);
          float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 2.0);

          // Multi-harmonic traveling data packets inside conduit
          float pulse1 = sin(vUv.x * 24.0 - uTime * 6.0 * uSpeed);
          float pulse2 = cos(vUv.x * 48.0 - uTime * 12.0 * uSpeed);
          float packet = smoothstep(0.4, 0.95, pulse1 * 0.6 + pulse2 * 0.4);

          // Laser dashes
          float dashes = step(0.45, fract(vUv.x * 35.0 - uTime * 3.0 * uSpeed));

          vec3 col = mix(uColor, uAccentColor, packet);
          col = mix(col, vec3(1.0), fresnel * 0.6 + packet * 0.5);
          float alpha = 0.3 + fresnel * 0.55 + packet * 0.5 + dashes * 0.15;

          gl_FragColor = vec4(col, min(alpha, 0.95));
        }
      `
    };

    // --- Scene Uniforms & Materials Setup ---
    const floorUniforms = {
      uGridColor: { value: new THREE.Color(params.primaryColor) },
      uBgColor: { value: new THREE.Color(params.bgColor) },
      uAccentColor: { value: new THREE.Color(params.accentColor) },
      uTime: { value: 0 },
      uCenterPos: { value: new THREE.Vector3(0, 0, 0) }
    };

    const beamUniforms = {
      uColor: { value: new THREE.Color(params.primaryColor) },
      uCoreColor: { value: new THREE.Color('#ffffff') },
      uTime: { value: 0 },
      uSpeed: { value: params.animationSpeed }
    };

    const streamUniforms = {
      uColor: { value: new THREE.Color(params.accentColor) },
      uAccentColor: { value: new THREE.Color(params.primaryColor) },
      uTime: { value: 0 },
      uSpeed: { value: params.animationSpeed }
    };

    const particleUniforms = {
      uTime: { value: 0 },
      uSize: { value: 16.0 }
    };

    const matCyberFloor = new THREE.ShaderMaterial({
      vertexShader: CyberFloorShader.vertexShader,
      fragmentShader: CyberFloorShader.fragmentShader,
      uniforms: floorUniforms,
      transparent: true,
      depthWrite: true
    });

    const matDataBeam = new THREE.ShaderMaterial({
      vertexShader: DataBeamShader.vertexShader,
      fragmentShader: DataBeamShader.fragmentShader,
      uniforms: beamUniforms,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const matStreamConduit = new THREE.ShaderMaterial({
      vertexShader: StreamConduitShader.vertexShader,
      fragmentShader: StreamConduitShader.fragmentShader,
      uniforms: streamUniforms,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const matRoundParticles = new THREE.ShaderMaterial({
      vertexShader: RoundParticleShader.vertexShader,
      fragmentShader: RoundParticleShader.fragmentShader,
      uniforms: particleUniforms,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const matPrimaryGlow = new THREE.MeshBasicMaterial({ color: params.primaryColor });
    const matSecondaryGlow = new THREE.MeshBasicMaterial({ color: params.secondaryColor });
    const matAccentGlow = new THREE.MeshBasicMaterial({ color: params.accentColor });
    const matServerGlow = new THREE.MeshBasicMaterial({ color: params.serverGlowColor });

    const matMetallicChassis = new THREE.MeshStandardMaterial({
      color: params.serverColor,
      metalness: 0.9,
      roughness: 0.22,
      envMapIntensity: 1.2
    });

    const matDarkFrame = new THREE.MeshStandardMaterial({
      color: 0x0f1422,
      metalness: 0.92,
      roughness: 0.28
    });

    const matPrismGlass = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: 0.88,
      opacity: 1.0,
      transparent: true,
      roughness: 0.05,
      ior: 1.68,
      thickness: 3.5,
      specularIntensity: 1.0,
      metalness: 0.08
    });

    // --- Scene Objects Construction ---
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // 1. High-Tech Cyber Floor Plane
    const floorSize = 220;
    const floorPlaneGeo = new THREE.PlaneGeometry(floorSize, floorSize, 1, 1);
    const floorPlane = new THREE.Mesh(floorPlaneGeo, matCyberFloor);
    floorPlane.rotation.x = -Math.PI / 2;
    floorPlane.position.y = -0.05;
    floorPlane.receiveShadow = true;
    worldGroup.add(floorPlane);

    // 2. Heavy Sci-Fi Ingress Gateway
    const gatewayGroup = new THREE.Group();
    gatewayGroup.position.set(-36, 8.5, 0);
    worldGroup.add(gatewayGroup);

    // Gateway Heavy Bulkhead Pedestal
    const gwBaseGeo = new THREE.BoxGeometry(8, 1.8, 18);
    const gwBase = new THREE.Mesh(gwBaseGeo, matDarkFrame);
    gwBase.position.y = -7.6;
    gwBase.castShadow = true;
    gatewayGroup.add(gwBase);

    // Foundation Angled Support Struts
    for (let s = -1; s <= 1; s += 2) {
      const strutGeo = new THREE.BoxGeometry(1.4, 7.5, 1.4);
      const strut = new THREE.Mesh(strutGeo, matDarkFrame);
      strut.position.set(0, -3.8, s * 7.5);
      strut.rotation.x = s * 0.18;
      gatewayGroup.add(strut);
    }

    // Outer Octagonal Heavy Portal Bulkhead
    const outerPortalGeo = new THREE.TorusGeometry(8.0, 1.25, 16, 8);
    const outerPortal = new THREE.Mesh(outerPortalGeo, matDarkFrame);
    outerPortal.rotation.y = Math.PI / 2;
    outerPortal.castShadow = true;
    gatewayGroup.add(outerPortal);

    // Dual Concentric Counter-Rotating Gear Rotor Rings
    const rotorGroup1 = new THREE.Group();
    const rotorGroup2 = new THREE.Group();
    gatewayGroup.add(rotorGroup1);
    gatewayGroup.add(rotorGroup2);

    const rotorRingGeo1 = new THREE.TorusGeometry(6.6, 0.35, 16, 48);
    const rotorMesh1 = new THREE.Mesh(rotorRingGeo1, matPrimaryGlow);
    rotorMesh1.rotation.y = Math.PI / 2;
    rotorGroup1.add(rotorMesh1);

    const rotorRingGeo2 = new THREE.TorusGeometry(5.4, 0.28, 16, 48);
    const rotorMesh2 = new THREE.Mesh(rotorRingGeo2, matSecondaryGlow);
    rotorMesh2.rotation.y = Math.PI / 2;
    rotorGroup2.add(rotorMesh2);

    // 12 Gear Teeth / Intake Stators
    for (let i = 0; i < 12; i++) {
      const toothGeo = new THREE.BoxGeometry(0.2, 1.4, 0.45);
      const tooth = new THREE.Mesh(toothGeo, matDarkFrame);
      const angle = (i / 12) * Math.PI * 2;
      tooth.position.set(0, Math.sin(angle) * 6.5, Math.cos(angle) * 6.5);
      tooth.rotation.x = angle;
      rotorGroup1.add(tooth);
    }

    // 8 High-Voltage Magnetic Induction Accelerator Coils
    for (let i = 0; i < 8; i++) {
      const coilGroup = new THREE.Group();
      const coilGeo = new THREE.CylinderGeometry(0.45, 0.7, 3.8, 10);
      const coil = new THREE.Mesh(coilGeo, matMetallicChassis);
      coilGroup.add(coil);

      const tipGeo = new THREE.SphereGeometry(0.55, 16, 16);
      const tip = new THREE.Mesh(tipGeo, matPrimaryGlow);
      tip.position.y = 2.0;
      coilGroup.add(tip);

      const angle = (i / 8) * Math.PI * 2;
      coilGroup.position.set(0, Math.sin(angle) * 9.2, Math.cos(angle) * 9.2);
      coilGroup.rotation.x = angle + Math.PI / 2;
      gatewayGroup.add(coilGroup);
    }

    // Swirling Energy Portal Event Horizon (Double-sided disc)
    const portalDiscGeo = new THREE.CircleGeometry(5.0, 32);
    const portalDiscMat = new THREE.MeshBasicMaterial({
      color: params.primaryColor,
      transparent: true,
      opacity: 0.35,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
    const portalDisc = new THREE.Mesh(portalDiscGeo, portalDiscMat);
    portalDisc.rotation.y = Math.PI / 2;
    gatewayGroup.add(portalDisc);

    // 3. Dense Incoming Data Beam (-105 to -36) & Post-Gateway Laser (-36 to 0)
    const beamLengthPre = 70;
    const preBeamGeo = new THREE.CylinderGeometry(1.0, 1.0, beamLengthPre, 32, 1, true);
    preBeamGeo.rotateZ(Math.PI / 2);
    const preBeamMesh = new THREE.Mesh(preBeamGeo, matDataBeam);
    preBeamMesh.position.set(-71, 8.5, 0);
    worldGroup.add(preBeamMesh);

    // Outer Helical Conduit Cords around incoming beam
    const helixGroup = new THREE.Group();
    helixGroup.position.set(-71, 8.5, 0);
    worldGroup.add(helixGroup);
    for (let h = 0; h < 3; h++) {
      const hCurvePoints = [];
      const hRadius = 2.4;
      for (let t = -35; t <= 35; t += 1.5) {
        const theta = (t * 0.35) + (h * Math.PI * 2 / 3);
        hCurvePoints.push(new THREE.Vector3(t, Math.sin(theta) * hRadius, Math.cos(theta) * hRadius));
      }
      const hCurve = new THREE.CatmullRomCurve3(hCurvePoints);
      const hGeo = new THREE.TubeGeometry(hCurve, 64, 0.12, 8, false);
      const hMesh = new THREE.Mesh(hGeo, matStreamConduit);
      helixGroup.add(hMesh);
    }

    // Compression Collars along incoming beam
    const compressionCollars = [];
    for (let i = 0; i < 6; i++) {
      const colGeo = new THREE.TorusGeometry(2.8, 0.22, 16, 32);
      colGeo.rotateY(Math.PI / 2);
      const col = new THREE.Mesh(colGeo, matPrimaryGlow);
      col.position.set(-95 + i * 11, 8.5, 0);
      worldGroup.add(col);
      compressionCollars.push(col);
    }

    // Focused Internal Data Laser (-36 to 0) connecting Gateway to Splitter Prism
    const postBeamLength = 36;
    const postBeamGeo = new THREE.CylinderGeometry(0.65, 0.65, postBeamLength, 32, 1, true);
    postBeamGeo.rotateZ(Math.PI / 2);
    const postBeamMesh = new THREE.Mesh(postBeamGeo, matDataBeam);
    postBeamMesh.position.set(-18, 8.5, 0);
    worldGroup.add(postBeamMesh);

    // 4. Central Splitter Mechanism & Multifaceted Refractive Prism
    const splitterGroup = new THREE.Group();
    splitterGroup.position.set(0, 8.5, 0);
    worldGroup.add(splitterGroup);

    // Splitter Levitation Pedestal
    const spBaseGeo = new THREE.CylinderGeometry(4.8, 6.0, 1.8, 32);
    const spBase = new THREE.Mesh(spBaseGeo, matDarkFrame);
    spBase.position.y = -7.6;
    spBase.castShadow = true;
    splitterGroup.add(spBase);

    // Concentric Energy Repulsion Rings on Pedestal
    for (let r = 0; r < 3; r++) {
      const repGeo = new THREE.TorusGeometry(2.2 + r * 1.2, 0.14, 12, 32);
      repGeo.rotateX(Math.PI / 2);
      const rep = new THREE.Mesh(repGeo, matSecondaryGlow);
      rep.position.y = -6.6;
      splitterGroup.add(rep);
    }

    // Vertical Magnetic Column
    const spColGeo = new THREE.CylinderGeometry(0.4, 0.4, 6.6, 16);
    const spColMat = new THREE.MeshBasicMaterial({
      color: params.secondaryColor,
      transparent: true,
      opacity: 0.55,
      blending: THREE.AdditiveBlending
    });
    const spCol = new THREE.Mesh(spColGeo, spColMat);
    spCol.position.y = -3.8;
    splitterGroup.add(spCol);

    // Triple Nested Gyroscopic Gimbal Rings
    const gimbal1Geo = new THREE.TorusGeometry(5.2, 0.28, 16, 48);
    const gimbal1 = new THREE.Mesh(gimbal1Geo, matMetallicChassis);
    splitterGroup.add(gimbal1);

    const gimbal2Geo = new THREE.TorusGeometry(4.2, 0.22, 16, 48);
    const gimbal2 = new THREE.Mesh(gimbal2Geo, matSecondaryGlow);
    splitterGroup.add(gimbal2);

    const gimbal3Geo = new THREE.TorusGeometry(3.3, 0.18, 16, 48);
    const gimbal3 = new THREE.Mesh(gimbal3Geo, matPrimaryGlow);
    splitterGroup.add(gimbal3);

    // Multifaceted Crystalline Prism
    const crystalGeo = new THREE.OctahedronGeometry(2.6, 0);
    const crystalMesh = new THREE.Mesh(crystalGeo, matPrismGlass);
    crystalMesh.castShadow = true;
    splitterGroup.add(crystalMesh);

    // Internal Quantum Core (Pulsing glowing icosahedron)
    const coreGeo = new THREE.IcosahedronGeometry(1.2, 1);
    const coreMesh = new THREE.Mesh(coreGeo, matSecondaryGlow);
    splitterGroup.add(coreMesh);

    // Shockwave Corona Ring at Front Strike Point
    const shockwaveGeo = new THREE.RingGeometry(0.25, 2.4, 32);
    const shockwaveMat = new THREE.MeshBasicMaterial({
      color: params.primaryColor,
      transparent: true,
      opacity: 0.8,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
    const shockwaveRing = new THREE.Mesh(shockwaveGeo, shockwaveMat);
    shockwaveRing.position.set(-2.0, 0, 0);
    shockwaveRing.rotation.y = Math.PI / 2;
    splitterGroup.add(shockwaveRing);

    // 5. Dynamic Balanced Streams & Monolithic Mainframe Server Blocks
    let streamObjects = [];
    let serverTowers = [];
    const streamsGroup = new THREE.Group();
    worldGroup.add(streamsGroup);

    const serversGroup = new THREE.Group();
    worldGroup.add(serversGroup);

    // Reusable Round Data Packet Particle System
    let streamParticleMesh = null;
    let streamParticleGeo = null;

    function rebuildStreamsAndServers() {
      // Clear previous elements
      while (streamsGroup.children.length > 0) {
        const obj = streamsGroup.children.pop();
        if (obj.geometry) obj.geometry.dispose();
      }
      while (serversGroup.children.length > 0) {
        const obj = serversGroup.children.pop();
        if (obj.geometry) obj.geometry.dispose();
      }

      streamObjects = [];
      serverTowers = [];

      const count = params.streamCount;
      const arcRadius = 40;
      const arcSpread = Math.PI * 0.52; // ~94 degree wide fan

      // Total round packets for all streams
      const packetsPerStream = 24;
      const totalPackets = count * packetsPerStream;

      streamParticleGeo = new THREE.BufferGeometry();
      const pPositions = new Float32Array(totalPackets * 3);
      const pScales = new Float32Array(totalPackets);
      const pColors = new Float32Array(totalPackets * 3);

      const accentCol = new THREE.Color(params.accentColor);
      const primaryCol = new THREE.Color(params.primaryColor);

      for (let i = 0; i < count; i++) {
        const norm = count === 1 ? 0.5 : i / (count - 1);
        const angle = -arcSpread / 2 + norm * arcSpread;

        // Distinct, imposing server location at downstream perimeter
        const sX = Math.cos(angle) * arcRadius + 2;
        const sZ = Math.sin(angle) * (arcRadius * 1.05);
        const sY = 0;

        // Build Monolithic Server Mainframe Tower
        const tower = createMonolithicServer(i, sX, sY, sZ, norm);
        serversGroup.add(tower.group);
        serverTowers.push(tower);

        // 3D Spline Path from Splitter Prism to Server Intake Funnel
        const startPt = new THREE.Vector3(1.8, 8.5 + (norm - 0.5) * 0.8, (norm - 0.5) * 1.8);
        const ctrl1 = new THREE.Vector3(14, 9.5 + Math.sin(norm * Math.PI) * 2.8, (norm - 0.5) * 18);
        const ctrl2 = new THREE.Vector3(sX - 12, 8.5, sZ * 0.88);
        const endPt = new THREE.Vector3(sX - 3.8, 8.5, sZ);

        const curve = new THREE.CatmullRomCurve3([startPt, ctrl1, ctrl2, endPt]);
        curve.tension = 0.38;

        // Outer Cybernetic Conduit Tube with Shader
        const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.28, 12, false);
        const tubeMesh = new THREE.Mesh(tubeGeo, matStreamConduit);
        streamsGroup.add(tubeMesh);

        // Inner Bright Laser Wire
        const innerCoreGeo = new THREE.TubeGeometry(curve, 64, 0.08, 8, false);
        const innerCoreMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending
        });
        const innerCoreMesh = new THREE.Mesh(innerCoreGeo, innerCoreMat);
        streamsGroup.add(innerCoreMesh);

        // Stream state & packet tracking
        const packetList = [];
        for (let p = 0; p < packetsPerStream; p++) {
          const globalIdx = i * packetsPerStream + p;
          const prog = (p / packetsPerStream);
          const pos = curve.getPointAt(prog);
          pPositions[globalIdx * 3] = pos.x;
          pPositions[globalIdx * 3 + 1] = pos.y;
          pPositions[globalIdx * 3 + 2] = pos.z;
          pScales[globalIdx] = 1.0;

          const mixedCol = accentCol.clone().lerp(primaryCol, (p % 3) * 0.3);
          pColors[globalIdx * 3] = mixedCol.r;
          pColors[globalIdx * 3 + 1] = mixedCol.g;
          pColors[globalIdx * 3 + 2] = mixedCol.b;

          packetList.push({
            globalIdx,
            progress: prog
          });
        }

        streamObjects.push({
          curve,
          packets: packetList,
          serverTower: tower
        });
      }

      streamParticleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
      streamParticleGeo.setAttribute('aScale', new THREE.BufferAttribute(pScales, 1));
      streamParticleGeo.setAttribute('aColor', new THREE.BufferAttribute(pColors, 3));

      streamParticleMesh = new THREE.Points(streamParticleGeo, matRoundParticles);
      streamsGroup.add(streamParticleMesh);
    }

    // High-Detail Monolithic Mainframe Server Tower
    function createMonolithicServer(index, x, y, z, norm) {
      const towerGroup = new THREE.Group();
      towerGroup.position.set(x, y, z);

      // Rotate tower to face toward the central splitter prism
      const lookAngle = Math.atan2(-z, -x);
      towerGroup.rotation.y = lookAngle;

      // Heavy Ground Pedestal Foundation
      const baseGeo = new THREE.BoxGeometry(6.4, 1.4, 5.2);
      const baseMesh = new THREE.Mesh(baseGeo, matDarkFrame);
      baseMesh.position.y = 0.7;
      baseMesh.castShadow = true;
      towerGroup.add(baseMesh);

      // Pedestal Hazard Strip / Perimeter Neon Light
      const hazardGeo = new THREE.BoxGeometry(6.5, 0.2, 5.3);
      const hazardMesh = new THREE.Mesh(hazardGeo, matPrimaryGlow);
      hazardMesh.position.y = 1.35;
      towerGroup.add(hazardMesh);

      // Main Tower Monolith Chassis (Tall and imposing!)
      const cabinetHeight = 15.0;
      const cabGeo = new THREE.BoxGeometry(5.2, cabinetHeight, 4.0);
      const cabMesh = new THREE.Mesh(cabGeo, matMetallicChassis);
      cabMesh.position.y = 0.7 + cabinetHeight / 2;
      cabMesh.castShadow = true;
      cabMesh.receiveShadow = true;
      towerGroup.add(cabMesh);

      // Corner Vertical Illumination Ribs
      for (let cx of [-2.65, 2.65]) {
        for (let cz of [-2.05, 2.05]) {
          const ribGeo = new THREE.BoxGeometry(0.18, cabinetHeight, 0.18);
          const ribMesh = new THREE.Mesh(ribGeo, matServerGlow);
          ribMesh.position.set(cx, 0.7 + cabinetHeight / 2, cz);
          towerGroup.add(ribMesh);
        }
      }

      // 10 Distinct Modular Rack Blades with Dense Animated LED Matrices
      const bladeCount = 10;
      const bladeH = 1.1;
      const ledMeshes = [];

      for (let b = 0; b < bladeCount; b++) {
        const bPosY = 2.2 + b * 1.3;
        // Blade face recessed shelf
        const shelfGeo = new THREE.BoxGeometry(0.4, bladeH * 0.85, 3.2);
        const shelfMesh = new THREE.Mesh(shelfGeo, matDarkFrame);
        shelfMesh.position.set(-2.62, bPosY, 0);
        towerGroup.add(shelfMesh);

        // Horizontal activity LED meter strip
        for (let l = 0; l < 8; l++) {
          const ledGeo = new THREE.BoxGeometry(0.12, 0.22, 0.26);
          const ledMesh = new THREE.Mesh(ledGeo, matServerGlow);
          ledMesh.position.set(-2.85, bPosY, -1.2 + l * 0.34);
          towerGroup.add(ledMesh);
          ledMeshes.push(ledMesh);
        }
      }

      // Large Conical Ingress Receiver Node / Collector Horn
      const hornGeo = new THREE.CylinderGeometry(1.2, 0.45, 1.4, 24);
      hornGeo.rotateZ(Math.PI / 2);
      const hornMesh = new THREE.Mesh(hornGeo, matMetallicChassis);
      hornMesh.position.set(-3.1, 8.5, 0);
      towerGroup.add(hornMesh);

      const receptorCoreGeo = new THREE.SphereGeometry(0.65, 16, 16);
      const receptorCore = new THREE.Mesh(receptorCoreGeo, matServerGlow);
      receptorCore.position.set(-3.2, 8.5, 0);
      towerGroup.add(receptorCore);

      // Receiver Absorption Ring
      const absRingGeo = new THREE.TorusGeometry(1.3, 0.12, 16, 32);
      absRingGeo.rotateY(Math.PI / 2);
      const absRing = new THREE.Mesh(absRingGeo, matPrimaryGlow);
      absRing.position.set(-3.7, 8.5, 0);
      towerGroup.add(absRing);

      // Top Roof Exhaust Turbine
      const turbineGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.8, 24);
      const turbine = new THREE.Mesh(turbineGeo, matDarkFrame);
      turbine.position.y = cabinetHeight + 1.1;
      towerGroup.add(turbine);

      const ventGlowGeo = new THREE.TorusGeometry(1.35, 0.15, 12, 24);
      ventGlowGeo.rotateX(Math.PI / 2);
      const ventGlow = new THREE.Mesh(ventGlowGeo, matServerGlow);
      ventGlow.position.y = cabinetHeight + 1.5;
      towerGroup.add(ventGlow);

      // Floating Holographic Load Balancer HUD (Dual nested rotating rings)
      const hudGroup = new THREE.Group();
      hudGroup.position.set(0, cabinetHeight + 3.8, 0);
      towerGroup.add(hudGroup);

      const hudOuterRingGeo = new THREE.RingGeometry(1.6, 1.95, 32);
      const hudOuterRingMat = new THREE.MeshBasicMaterial({
        color: params.serverGlowColor,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });
      const hudOuterRing = new THREE.Mesh(hudOuterRingGeo, hudOuterRingMat);
      hudOuterRing.rotation.y = -Math.PI / 2;
      hudGroup.add(hudOuterRing);

      const hudInnerGaugeGeo = new THREE.RingGeometry(1.1, 1.4, 24, 1, 0, Math.PI * 1.5);
      const hudInnerGaugeMat = new THREE.MeshBasicMaterial({
        color: params.accentColor,
        transparent: true,
        opacity: 0.9,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });
      const hudInnerGauge = new THREE.Mesh(hudInnerGaugeGeo, hudInnerGaugeMat);
      hudInnerGauge.rotation.y = -Math.PI / 2;
      hudGroup.add(hudInnerGauge);

      // Center Status Diamond
      const statusCoreGeo = new THREE.OctahedronGeometry(0.55);
      const statusCore = new THREE.Mesh(statusCoreGeo, matPrimaryGlow);
      hudGroup.add(statusCore);

      return {
        group: towerGroup,
        hudGroup,
        hudOuterRingMat,
        hudInnerGaugeMat,
        ledMeshes,
        absRing,
        loadPulse: 0,
        index
      };
    }

    rebuildStreamsAndServers();

    // 6. Ambient Round Dust Particles (Zero square particles!)
    const dustCount = 450;
    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(dustCount * 3);
    const dustScales = new Float32Array(dustCount);
    const dustColors = new Float32Array(dustCount * 3);

    const dustCol1 = new THREE.Color(params.primaryColor);
    const dustCol2 = new THREE.Color(params.secondaryColor);

    for (let i = 0; i < dustCount; i++) {
      dustPositions[i * 3] = (Math.random() - 0.5) * 180;
      dustPositions[i * 3 + 1] = Math.random() * 45;
      dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 140;
      dustScales[i] = THREE.MathUtils.randFloat(0.4, 1.4);

      const c = dustCol1.clone().lerp(dustCol2, Math.random());
      dustColors[i * 3] = c.r;
      dustColors[i * 3 + 1] = c.g;
      dustColors[i * 3 + 2] = c.b;
    }

    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    dustGeo.setAttribute('aScale', new THREE.BufferAttribute(dustScales, 1));
    dustGeo.setAttribute('aColor', new THREE.BufferAttribute(dustColors, 3));

    const dustParticles = new THREE.Points(dustGeo, matRoundParticles);
    worldGroup.add(dustParticles);

    // --- Color Management Function ---
    function applyColors() {
      // Update Uniforms
      floorUniforms.uGridColor.value.set(params.primaryColor);
      floorUniforms.uAccentColor.value.set(params.accentColor);
      beamUniforms.uColor.value.set(params.primaryColor);
      streamUniforms.uColor.value.set(params.accentColor);
      streamUniforms.uAccentColor.value.set(params.primaryColor);

      // Shared Materials
      matPrimaryGlow.color.set(params.primaryColor);
      matSecondaryGlow.color.set(params.secondaryColor);
      matAccentGlow.color.set(params.accentColor);
      matServerGlow.color.set(params.serverGlowColor);
      matMetallicChassis.color.set(params.serverColor);

      spColMat.color.set(params.secondaryColor);
      shockwaveMat.color.set(params.primaryColor);
      portalDiscMat.color.set(params.primaryColor);

      // Server HUDs
      serverTowers.forEach(t => {
        t.hudOuterRingMat.color.set(params.serverGlowColor);
        t.hudInnerGaugeMat.color.set(params.accentColor);
      });

      // Background / Greenscreen
      if (params.greenscreen) {
        scene.background.set('#00ff00');
        scene.fog.color.set('#00ff00');
        floorPlane.visible = false;
      } else {
        scene.background.set(params.bgColor);
        scene.fog.color.set(params.bgColor);
        floorUniforms.uBgColor.value.set(params.bgColor);
        floorPlane.visible = true;
      }

      // Lights Sync
      ambientLight.color.set(params.ambientColor);
      keyLight.color.set(params.keyColor);
      prismPointLight.color.set(params.prismLightColor);
      gatewayPointLight.color.set(params.gatewayLightColor);
      serverRimLight.color.set(params.serverRimLightColor);

      // Update Dust Particle Colors
      const dCols = dustGeo.attributes.aColor.array;
      const c1 = new THREE.Color(params.primaryColor);
      const c2 = new THREE.Color(params.secondaryColor);
      for (let i = 0; i < dustCount; i++) {
        const mc = c1.clone().lerp(c2, Math.random());
        dCols[i * 3] = mc.r;
        dCols[i * 3 + 1] = mc.g;
        dCols[i * 3 + 2] = mc.b;
      }
      dustGeo.attributes.aColor.needsUpdate = true;
    }

    function selectScheme(schemeName) {
      if (!COLOR_SCHEMES[schemeName]) return;
      const s = COLOR_SCHEMES[schemeName];
      params.colorScheme = schemeName;
      params.primaryColor = s.primary;
      params.secondaryColor = s.secondary;
      params.accentColor = s.accent;
      params.serverColor = s.server;
      params.serverGlowColor = s.serverGlow;
      params.bgColor = s.background;

      params.gatewayLightColor = s.primary;
      params.prismLightColor = s.secondary;
      params.serverRimLightColor = s.accent;

      applyColors();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- Antialiasing Context Toggle ---
    function setAntialias(enabled) {
      params.antialias = enabled;
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        canvas: oldCanvas,
        antialias: enabled,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      controls.dispose();
      const newControls = new OrbitControls(camera, renderer.domElement);
      newControls.enableDamping = true;
      newControls.dampingFactor = 0.05;
      newControls.maxDistance = 160;
      newControls.minDistance = 6;
      newControls.screenSpacePanning = true;
      newControls.target.copy(cameraTarget);
      Object.assign(controls, newControls);
    }

    // --- 8 Preconfigured Camera Animations ---
    const ANIMATION_MODES = [
      'Static (Manual Camera)',
      'Slow Cinematic Orbit',
      'Ingress Gateway Focus',
      'Prism Core Inspection',
      'Server Array Sweep',
      'Top-Down Tactical View',
      'Data Stream Follower',
      'Cinematic Drone Pan'
    ];

    let lastAnimMode = params.cameraAnimation;
    function updateCameraAnimation(delta, elapsedTime) {
      const mode = params.cameraAnimation;
      const spd = params.animationSpeed;

      if (mode !== lastAnimMode) {
        lastAnimMode = mode;
        controls.autoRotate = false;

        let desiredTarget = new THREE.Vector3(6, 7, 0);
        if (mode === 'Ingress Gateway Focus') {
          desiredTarget.set(-34, 8.5, 0);
        } else if (mode === 'Prism Core Inspection') {
          desiredTarget.set(0, 8.5, 0);
        } else if (mode === 'Server Array Sweep') {
          desiredTarget.set(36, 8.5, 0);
        } else if (mode === 'Top-Down Tactical View') {
          desiredTarget.set(6, 2, 0);
        }

        // Smoothly interpolate controls.target while preserving camera offset and zoom
        gsap.to(cameraTarget, {
          x: desiredTarget.x,
          y: desiredTarget.y,
          z: desiredTarget.z,
          duration: 1.6,
          ease: 'power2.inOut',
          onUpdate: () => {
            const offset = camera.position.clone().sub(controls.target);
            controls.target.copy(cameraTarget);
            camera.position.copy(controls.target).add(offset);
          }
        });
      }

      if (mode === 'Static (Manual Camera)') {
        controls.autoRotate = false;
      } else if (mode === 'Slow Cinematic Orbit') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.65 * spd;
      } else if (mode === 'Ingress Gateway Focus') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5 * spd;
      } else if (mode === 'Prism Core Inspection') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8 * spd;
      } else if (mode === 'Server Array Sweep') {
        controls.autoRotate = false;
        const targetZ = Math.sin(elapsedTime * 0.45 * spd) * 18;
        const targetY = 8.5 + Math.cos(elapsedTime * 0.35 * spd) * 1.5;
        const newTarget = new THREE.Vector3(36, targetY, targetZ);
        const shift = newTarget.clone().sub(controls.target).multiplyScalar(0.045);
        controls.target.add(shift);
        camera.position.add(shift);
      } else if (mode === 'Top-Down Tactical View') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.35 * spd;
      } else if (mode === 'Data Stream Follower') {
        controls.autoRotate = false;
        const trackCycle = (Math.sin(elapsedTime * 0.32 * spd) * 0.5 + 0.5);
        const curX = THREE.MathUtils.lerp(-32, 34, trackCycle);
        const curY = 8.5 + Math.sin(trackCycle * Math.PI) * 2.2;
        const curZ = Math.sin(elapsedTime * 0.28 * spd) * 10;
        const newTarget = new THREE.Vector3(curX, curY, curZ);
        const shift = newTarget.clone().sub(controls.target).multiplyScalar(0.04);
        controls.target.add(shift);
        camera.position.add(shift);
      } else if (mode === 'Cinematic Drone Pan') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.45 * spd;
        const offset = camera.position.clone().sub(controls.target);
        offset.y += Math.sin(elapsedTime * 0.75 * spd) * 0.035;
        camera.position.copy(controls.target).add(offset);
      }
    }

    // --- Procedural Scene Randomizer ---
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      selectScheme(chosenScheme);

      params.streamCount = THREE.MathUtils.randInt(4, 8);
      rebuildStreamsAndServers();

      params.animationSpeed = THREE.MathUtils.randFloat(0.7, 1.7);
      params.cameraAnimation = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];

      params.keyPosX = THREE.MathUtils.randFloat(-30, 45);
      params.keyPosY = THREE.MathUtils.randFloat(25, 55);
      params.keyPosZ = THREE.MathUtils.randFloat(15, 45);
      keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);

      params.exposure = THREE.MathUtils.randFloat(1.0, 1.45);
      renderer.toneMappingExposure = params.exposure;

      applyColors();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- Scene Click Detection (True Click vs Drag) ---
    let pointerStartTime = 0;
    let pointerStartX = 0;
    let pointerStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      pointerStartTime = performance.now();
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      const elapsed = performance.now() - pointerStartTime;
      const dist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
      if (elapsed < 320 && dist < 6) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // --- Lil-GUI Setup ---
    const gui = new GUI({ title: 'Traffic Balancer & Dispatcher' });

    const fPreset = gui.addFolder('Theme & Presets');
    fPreset.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => selectScheme(v));
    fPreset.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => applyColors());
    fPreset.add(params, 'clickToRandomize').name('Click Scene to Randomize');
    fPreset.add({ randomize: () => randomizeScene() }, 'randomize').name('Randomize Scene Now');

    const fColors = gui.addFolder('Custom Colors');
    fColors.addColor(params, 'primaryColor').name('Primary (Gateway/Core)').onChange(() => applyColors());
    fColors.addColor(params, 'secondaryColor').name('Secondary (Prism)').onChange(() => applyColors());
    fColors.addColor(params, 'accentColor').name('Accent (Data Streams)').onChange(() => applyColors());
    fColors.addColor(params, 'serverColor').name('Server Chassis').onChange(() => applyColors());
    fColors.addColor(params, 'serverGlowColor').name('Server LED/HUD').onChange(() => applyColors());
    fColors.addColor(params, 'bgColor').name('Background Color').onChange(() => applyColors());

    const fTraffic = gui.addFolder('Traffic & Balancing');
    fTraffic.add(params, 'streamCount', 4, 8, 1).name('Balanced Streams').onChange(() => rebuildStreamsAndServers());
    fTraffic.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Flow Speed');

    const fCamera = gui.addFolder('Camera & Animation');
    fCamera.add(params, 'cameraAnimation', ANIMATION_MODES).name('Camera Mode');

    const fLighting = gui.addFolder('Lighting & Exposure');
    fLighting.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });

    const fAmbient = fLighting.addFolder('Ambient Light');
    fAmbient.add(params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(v => ambientLight.intensity = v);
    fAmbient.addColor(params, 'ambientColor').name('Color').onChange(v => ambientLight.color.set(v));

    const fKey = fLighting.addFolder('Key Light');
    fKey.add(params, 'keyIntensity', 0.0, 6.0, 0.1).name('Intensity').onChange(v => keyLight.intensity = v);
    fKey.addColor(params, 'keyColor').name('Color').onChange(v => keyLight.color.set(v));
    fKey.add(params, 'keyPosX', -60, 60, 1).name('Pos X').onChange(v => keyLight.position.x = v);
    fKey.add(params, 'keyPosY', 5, 80, 1).name('Pos Y').onChange(v => keyLight.position.y = v);
    fKey.add(params, 'keyPosZ', -60, 60, 1).name('Pos Z').onChange(v => keyLight.position.z = v);

    const fSources = fLighting.addFolder('Accent Light Sources');
    fSources.add(params, 'prismLightIntensity', 0.0, 10.0, 0.1).name('Prism Light Int.').onChange(v => prismPointLight.intensity = v);
    fSources.addColor(params, 'prismLightColor').name('Prism Light Color').onChange(v => prismPointLight.color.set(v));
    fSources.add(params, 'gatewayLightIntensity', 0.0, 10.0, 0.1).name('Gateway Light Int.').onChange(v => gatewayPointLight.intensity = v);
    fSources.addColor(params, 'gatewayLightColor').name('Gateway Light Color').onChange(v => gatewayPointLight.color.set(v));
    fSources.add(params, 'serverRimLightIntensity', 0.0, 6.0, 0.1).name('Server Rim Int.').onChange(v => serverRimLight.intensity = v);
    fSources.addColor(params, 'serverRimLightColor').name('Server Rim Color').onChange(v => serverRimLight.color.set(v));

    const fGraphics = gui.addFolder('Graphics & Performance');
    fGraphics.add(params, 'pixelRatio', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => renderer.setPixelRatio(v));
    fGraphics.add(params, 'antialias').name('Antialiasing').onChange(v => setAntialias(v));

    fColors.close();
    fLighting.close();
    fAmbient.close();
    fKey.close();
    fSources.close();
    fGraphics.close();

    // Key 'H' to Hide/Show UI
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        if (isGuiVisible) gui.show();
        else gui.hide();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Main Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();
      const spd = params.animationSpeed;

      // 1. Shaders Uniform Updates
      floorUniforms.uTime.value = elapsedTime;
      beamUniforms.uTime.value = elapsedTime;
      beamUniforms.uSpeed.value = spd;
      streamUniforms.uTime.value = elapsedTime;
      streamUniforms.uSpeed.value = spd;
      particleUniforms.uTime.value = elapsedTime;

      // 2. Gateway Mechanics & Particle Vortex
      rotorGroup1.rotation.x += 1.2 * delta * spd;
      rotorGroup2.rotation.x -= 0.9 * delta * spd;
      outerPortal.rotation.x += 0.25 * delta * spd;
      portalDisc.material.opacity = 0.3 + Math.sin(elapsedTime * 5.0 * spd) * 0.12;

      // Helical cords rotation
      helixGroup.rotation.x += 0.8 * delta * spd;

      // Compression rings moving into gateway
      compressionCollars.forEach((ring, i) => {
        let xPos = -95 + ((i * 11 + elapsedTime * 20 * spd) % 66);
        if (xPos > -36) xPos -= 66;
        ring.position.x = xPos;
        const scale = 1.0 + Math.sin(elapsedTime * 6.0 + i) * 0.14;
        ring.scale.set(scale, scale, scale);
      });

      // 3. Central Splitter Gimbal Rings & Refraction Core
      gimbal1.rotation.y += 0.75 * delta * spd;
      gimbal1.rotation.z += 0.4 * delta * spd;
      gimbal2.rotation.x += 0.9 * delta * spd;
      gimbal2.rotation.y -= 0.6 * delta * spd;
      gimbal3.rotation.z += 1.1 * delta * spd;

      crystalMesh.rotation.y += 0.5 * delta * spd;
      crystalMesh.rotation.z += 0.3 * delta * spd;
      coreMesh.rotation.x -= 1.2 * delta * spd;
      coreMesh.rotation.y += 0.8 * delta * spd;

      const shockScale = 1.0 + Math.sin(elapsedTime * 9.0 * spd) * 0.28;
      shockwaveRing.scale.set(shockScale, shockScale, 1);
      shockwaveMat.opacity = 0.55 + Math.sin(elapsedTime * 9.0 * spd) * 0.25;

      // 4. Balanced Stream Round Particles Flow
      if (streamParticleGeo) {
        const pPos = streamParticleGeo.attributes.position.array;
        const pScales = streamParticleGeo.attributes.aScale.array;
        const flowRate = 0.38 * spd;

        streamObjects.forEach((stream) => {
          stream.packets.forEach(pItem => {
            pItem.progress = (pItem.progress + flowRate * delta) % 1.0;
            const pt = stream.curve.getPointAt(pItem.progress);
            const idx = pItem.globalIdx;

            pPos[idx * 3] = pt.x;
            pPos[idx * 3 + 1] = pt.y;
            pPos[idx * 3 + 2] = pt.z;

            // Packet scale pulse along conduit
            pScales[idx] = 1.0 + Math.sin(pItem.progress * Math.PI * 4) * 0.35;

            // Trigger server buffer pulse when packet arrives at intake horn
            if (pItem.progress > 0.95) {
              stream.serverTower.loadPulse = 1.0;
            }
          });
        });

        streamParticleGeo.attributes.position.needsUpdate = true;
        streamParticleGeo.attributes.aScale.needsUpdate = true;
      }

      // 5. Server Mainframe Activity & Holographic HUD Gauges
      serverTowers.forEach((tower, tIdx) => {
        if (tower.loadPulse > 0) {
          tower.loadPulse = Math.max(0, tower.loadPulse - delta * 2.8);
        }

        // Blinking LED matrix reflecting balanced server load
        tower.ledMeshes.forEach((led, ledIdx) => {
          const blink = Math.sin(elapsedTime * 12 + tIdx * 4 + ledIdx * 1.8) > 0.15;
          led.visible = blink || tower.loadPulse > 0.25;
        });

        // Absorption intake ring glow pulse
        tower.absRing.scale.setScalar(1.0 + tower.loadPulse * 0.35);

        // Holographic Load HUD rings rotation & dynamic pulsing
        tower.hudGroup.rotation.y += 0.7 * delta * spd;
        const baseScale = 1.0 + Math.sin(elapsedTime * 3.5 + tIdx) * 0.09;
        const finalScale = baseScale + tower.loadPulse * 0.35;
        tower.hudGroup.scale.set(finalScale, finalScale, finalScale);
        tower.hudOuterRingMat.opacity = 0.65 + tower.loadPulse * 0.35;
      });

      // 6. Ambient Round Dust Drift
      const dustPos = dustGeo.attributes.position.array;
      for (let i = 1; i < dustCount * 3; i += 3) {
        dustPos[i] += 1.4 * delta * spd;
        if (dustPos[i] > 45) dustPos[i] = 0.5;
      }
      dustGeo.attributes.position.needsUpdate = true;

      // 7. Camera Animations & OrbitControls Update
      updateCameraAnimation(delta, elapsedTime);
      controls.update();

      // 8. Render Scene
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
