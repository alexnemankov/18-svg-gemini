<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hexagonal Matrix Circuit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas#c {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    canvas#c:active {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for Standalone Execution)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.03,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens & Cinematic Effects");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    // =========================================================================================
    // MAIN SIMULATION & SCENE ENGINE
    // =========================================================================================
    const visibleCanvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({
      canvas: visibleCanvas,
      antialias: false,
      powerPreference: 'high-performance'
    });

    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      bloomEnabled: true,
      bloomStrength: 0.85,
      bloomRadius: 0.5,
      bloomThreshold: 0.15,
      chromaticAberration: 0.03,
      vignetteBoost: 1.0,
      vignetteReduction: 0.45,
      noiseIntensity: 0.015
    });

    // 2D Offscreen Canvas for Hexagonal Matrix Grid Simulation
    const offscreenCanvas = document.createElement('canvas');
    const ctx = offscreenCanvas.getContext('2d');
    const canvasTexture = new THREE.CanvasTexture(offscreenCanvas);
    canvasTexture.minFilter = THREE.LinearFilter;
    canvasTexture.magFilter = THREE.LinearFilter;
    canvasTexture.generateMipmaps = false;

    const COLOR_SCHEMES = [
      'Monochromatic',
      'Analogous',
      'Complementary',
      'Split-complementary',
      'Triadic',
      'Tetradic',
      'Double split-complementary',
      'Achromatic (White & Black)',
      'Achromatic (Black & White)',
      'Neutral + Accent'
    ];

    const ANIMATION_MODES = [
      'Static (No Camera Movement)',
      'Gentle Drift',
      'Cosmic Orbit',
      'Deep Pulse & Zoom',
      'Hexagonal Swirl',
      'Cinematic Pan',
      'Hypnotic Spiral',
      'Breathing Focus'
    ];

    const opts = {
      // Geometry & Simulation
      len: 20,
      count: 55,
      baseTime: 10,
      addedTime: 10,
      dieChance: 0.05,
      spawnChance: 1,
      sparkChance: 0.1,
      sparkDist: 10,
      sparkSize: 2,
      lineWidth: 2,

      // Light & Glow
      baseLight: 50,
      addedLight: 12,
      shadowToTimePropMult: 6,
      baseLightInputMultiplier: 0.01,
      addedLightInputMultiplier: 0.02,
      glowMultiplier: 1.0,

      // Color System
      colorScheme: 'Complementary',
      baseColor: '#00e5ff',
      baseHue: 187,
      saturation: 100,
      cycleHue: false,
      hueChange: 0.1,

      // Background & Screen
      greenScreen: false,
      bgColor: '#000000',
      repaintAlpha: 0.04,

      // Camera, Zoom & Pan
      zoom: 1.0,
      panX: 0,
      panY: 0,
      animationMode: 'Gentle Drift',
      speed: 1.0,
      dpr: Math.min(window.devicePixelRatio || 1, 2),

      // Procedural Click Randomize
      clickRandomize: true,

      // Methods
      resetView() {
        opts.zoom = 1.0;
        opts.panX = 0;
        opts.panY = 0;
        zoomController.updateDisplay();
        panXController.updateDisplay();
        panYController.updateDisplay();
      },
      randomize() {
        randomizeThemeAndParams();
      }
    };

    let w = window.innerWidth;
    let h = window.innerHeight;
    let lines = [];
    let tick = 0;
    let animTick = 0;
    const baseRad = (Math.PI * 2) / 6;

    // Helper Color Functions
    function hexToHsl(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const r = parseInt(hex.substring(0, 2), 16) / 255;
      const g = parseInt(hex.substring(2, 4), 16) / 255;
      const b = parseInt(hex.substring(4, 6), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let hVal = 0, sVal = 0, lVal = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        sVal = lVal > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: hVal = (g - b) / d + (g < b ? 6 : 0); break;
          case g: hVal = (b - r) / d + 2; break;
          case b: hVal = (r - g) / d + 4; break;
        }
        hVal *= 60;
      }
      return { h: Math.round(hVal), s: Math.round(sVal * 100), l: Math.round(lVal * 100) };
    }

    function hslToHex(hVal, sVal, lVal) {
      sVal /= 100;
      lVal /= 100;
      const c = (1 - Math.abs(2 * lVal - 1)) * sVal;
      const x = c * (1 - Math.abs(((hVal / 60) % 2) - 1));
      const m = lVal - c / 2;
      let r = 0, g = 0, b = 0;
      if (0 <= hVal && hVal < 60) { r = c; g = x; b = 0; }
      else if (60 <= hVal && hVal < 120) { r = x; g = c; b = 0; }
      else if (120 <= hVal && hVal < 180) { r = 0; g = c; b = x; }
      else if (180 <= hVal && hVal < 240) { r = 0; g = x; b = c; }
      else if (240 <= hVal && hVal < 300) { r = x; g = 0; b = c; }
      else if (300 <= hVal && hVal < 360) { r = c; g = 0; b = x; }
      const rHex = Math.round((r + m) * 255).toString(16).padStart(2, '0');
      const gHex = Math.round((g + m) * 255).toString(16).padStart(2, '0');
      const bHex = Math.round((b + m) * 255).toString(16).padStart(2, '0');
      return `#${rHex}${gHex}${bHex}`;
    }

    function hexToRgba(hex, alpha) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function generateLineColorScheme(scheme, baseH) {
      let hue = baseH;
      let sat = opts.saturation;
      let isAccent = false;
      let isNeutral = false;
      let isAchromaticWB = false;
      let isAchromaticBW = false;

      switch (scheme) {
        case 'Monochromatic':
          hue = baseH;
          break;
        case 'Analogous': {
          const angles = [-30, 0, 30];
          hue = (baseH + angles[Math.floor(Math.random() * angles.length)] + 360) % 360;
          break;
        }
        case 'Complementary': {
          const angles = [0, 180];
          hue = (baseH + angles[Math.floor(Math.random() * angles.length)] + 360) % 360;
          break;
        }
        case 'Split-complementary': {
          const angles = [0, 150, 210];
          hue = (baseH + angles[Math.floor(Math.random() * angles.length)] + 360) % 360;
          break;
        }
        case 'Triadic': {
          const angles = [0, 120, 240];
          hue = (baseH + angles[Math.floor(Math.random() * angles.length)] + 360) % 360;
          break;
        }
        case 'Tetradic': {
          const angles = [0, 90, 180, 270];
          hue = (baseH + angles[Math.floor(Math.random() * angles.length)] + 360) % 360;
          break;
        }
        case 'Double split-complementary': {
          const angles = [-30, 30, 150, 210];
          hue = (baseH + angles[Math.floor(Math.random() * angles.length)] + 360) % 360;
          break;
        }
        case 'Achromatic (White & Black)':
          sat = 0;
          isAchromaticWB = true;
          break;
        case 'Achromatic (Black & White)':
          sat = 0;
          isAchromaticBW = true;
          break;
        case 'Neutral + Accent':
          if (Math.random() < 0.25) {
            hue = baseH;
            sat = 100;
            isAccent = true;
          } else {
            hue = (baseH + 180) % 360;
            sat = 6;
            isNeutral = true;
          }
          break;
        default:
          hue = baseH;
      }

      return { hue, sat, isAccent, isNeutral, isAchromaticWB, isAchromaticBW };
    }

    function Line() {
      this.reset();
    }

    Line.prototype.reset = function() {
      this.x = 0;
      this.y = 0;
      this.addedX = 0;
      this.addedY = 0;
      this.rad = 0;

      this.lightInputMultiplier = opts.baseLightInputMultiplier + opts.addedLightInputMultiplier * Math.random();
      
      const colData = generateLineColorScheme(opts.colorScheme, opts.baseHue);
      this.hue = colData.hue;
      this.sat = colData.sat;
      this.isAccent = colData.isAccent;
      this.isNeutral = colData.isNeutral;
      this.isAchromaticWB = colData.isAchromaticWB;
      this.isAchromaticBW = colData.isAchromaticBW;

      this.cumulativeTime = 0;
      this.beginPhase();
    };

    Line.prototype.beginPhase = function() {
      this.x += this.addedX;
      this.y += this.addedY;

      this.time = 0;
      this.targetTime = Math.max(1, (opts.baseTime + opts.addedTime * Math.random()) | 0);

      this.rad += baseRad * (Math.random() < 0.5 ? 1 : -1);
      this.addedX = Math.cos(this.rad);
      this.addedY = Math.sin(this.rad);

      const dieBoundX = ((w / 2) / opts.len) / Math.max(opts.zoom, 0.1) * 1.6;
      const dieBoundY = ((h / 2) / opts.len) / Math.max(opts.zoom, 0.1) * 1.6;

      if (
        Math.random() < opts.dieChance ||
        this.x > dieBoundX ||
        this.x < -dieBoundX ||
        this.y > dieBoundY ||
        this.y < -dieBoundY
      ) {
        this.reset();
      }
    };

    Line.prototype.step = function() {
      ++this.time;
      ++this.cumulativeTime;

      if (this.time >= this.targetTime) {
        this.beginPhase();
      }

      const prop = this.time / this.targetTime;
      const wave = Math.sin((prop * Math.PI) / 2);
      const curAddedX = this.addedX * wave;
      const curAddedY = this.addedY * wave;

      ctx.shadowBlur = prop * opts.shadowToTimePropMult * opts.glowMultiplier;

      let hue = this.hue;
      if (opts.cycleHue && !this.isAchromaticWB && !this.isAchromaticBW) {
        hue = (hue + tick * opts.hueChange) % 360;
      }

      let light;
      let colorStr;

      if (this.isAchromaticWB) {
        light = Math.min(100, Math.max(45, 75 + 25 * Math.sin(this.cumulativeTime * this.lightInputMultiplier)));
        colorStr = `hsl(0, 0%, ${light}%)`;
      } else if (this.isAchromaticBW) {
        light = Math.min(25, Math.max(0, 10 + 10 * Math.sin(this.cumulativeTime * this.lightInputMultiplier)));
        colorStr = `hsl(0, 0%, ${light}%)`;
      } else if (this.isAccent) {
        light = opts.baseLight + opts.addedLight * Math.sin(this.cumulativeTime * this.lightInputMultiplier);
        colorStr = `hsl(${hue}, 100%, ${light}%)`;
      } else if (this.isNeutral) {
        light = 40 + 20 * Math.sin(this.cumulativeTime * this.lightInputMultiplier);
        colorStr = `hsl(${hue}, 8%, ${light}%)`;
      } else {
        light = opts.baseLight + opts.addedLight * Math.sin(this.cumulativeTime * this.lightInputMultiplier);
        colorStr = `hsl(${hue}, ${this.sat}%, ${light}%)`;
      }

      ctx.fillStyle = ctx.shadowColor = colorStr;

      const drawX = (this.x + curAddedX) * opts.len;
      const drawY = (this.y + curAddedY) * opts.len;
      const pSize = opts.lineWidth || 2;

      ctx.fillRect(drawX - pSize / 2, drawY - pSize / 2, pSize, pSize);

      if (Math.random() < opts.sparkChance) {
        const spX = drawX + (Math.random() - 0.5) * 2 * opts.sparkDist - opts.sparkSize / 2;
        const spY = drawY + (Math.random() - 0.5) * 2 * opts.sparkDist - opts.sparkSize / 2;
        ctx.fillRect(spX, spY, opts.sparkSize, opts.sparkSize);
      }
    };

    function clearOffscreenCanvas() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const bg = opts.greenScreen ? '#00ff00' : opts.bgColor;
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);
    }

    function updateCanvasSize() {
      w = window.innerWidth;
      h = window.innerHeight;

      // Offscreen 2D Buffer
      offscreenCanvas.width = Math.max(1, Math.round(w * opts.dpr));
      offscreenCanvas.height = Math.max(1, Math.round(h * opts.dpr));

      // WebGL Renderer & PostProcessor
      renderer.setPixelRatio(opts.dpr);
      renderer.setSize(w, h, false);
      postProcessor.setSize(w, h, opts.dpr);

      clearOffscreenCanvas();
    }

    function reseedLines() {
      lines = [];
      for (let i = 0; i < opts.count; i++) {
        lines.push(new Line());
      }
    }

    function refreshLineColors() {
      lines.forEach(line => {
        const colData = generateLineColorScheme(opts.colorScheme, opts.baseHue);
        line.hue = colData.hue;
        line.sat = colData.sat;
        line.isAccent = colData.isAccent;
        line.isNeutral = colData.isNeutral;
        line.isAchromaticWB = colData.isAchromaticWB;
        line.isAchromaticBW = colData.isAchromaticBW;
      });
    }

    function calculateAnimationOffsets(mode, t) {
      let animPanX = 0;
      let animPanY = 0;
      let animZoom = 1;
      let animRot = 0;

      switch (mode) {
        case 'Static (No Camera Movement)':
          break;
        case 'Gentle Drift':
          animPanX = Math.sin(t * 0.008) * 75;
          animPanY = Math.cos(t * 0.006) * 45;
          animZoom = 1 + Math.sin(t * 0.004) * 0.06;
          break;
        case 'Cosmic Orbit': {
          const r = 55;
          animPanX = Math.cos(t * 0.005) * r;
          animPanY = Math.sin(t * 0.005) * r;
          animZoom = 1 + Math.sin(t * 0.003) * 0.08;
          animRot = Math.sin(t * 0.002) * 0.08;
          break;
        }
        case 'Deep Pulse & Zoom':
          animPanX = Math.sin(t * 0.004) * 30;
          animPanY = Math.cos(t * 0.005) * 20;
          animZoom = 1 + Math.sin(t * 0.007) * 0.22;
          break;
        case 'Hexagonal Swirl': {
          const angle = Math.sin(t * 0.003) * Math.PI;
          animPanX = Math.cos(angle) * 70 * Math.sin(t * 0.005);
          animPanY = Math.sin(angle) * 70 * Math.sin(t * 0.005);
          animZoom = 1 + Math.cos(t * 0.004) * 0.12;
          animRot = Math.sin(t * 0.003) * 0.12;
          break;
        }
        case 'Cinematic Pan':
          animPanX = Math.sin(t * 0.004) * 140;
          animPanY = Math.cos(t * 0.003) * 50;
          animZoom = 1.04 + Math.sin(t * 0.005) * 0.08;
          animRot = Math.sin(t * 0.0015) * 0.03;
          break;
        case 'Hypnotic Spiral': {
          const rad = 40 + Math.sin(t * 0.006) * 25;
          animPanX = Math.cos(t * 0.007) * rad;
          animPanY = Math.sin(t * 0.007) * rad;
          animZoom = 1 + Math.sin(t * 0.005) * 0.15;
          animRot = (t * 0.0025) % (Math.PI * 2);
          break;
        }
        case 'Breathing Focus':
          animPanX = Math.sin(t * 0.005) * 20;
          animPanY = Math.sin(t * 0.006) * 35;
          animZoom = 1 + Math.sin(t * 0.008) * 0.28;
          animRot = Math.cos(t * 0.004) * 0.04;
          break;
      }

      return { animPanX, animPanY, animZoom, animRot };
    }

    function randomizeThemeAndParams() {
      opts.colorScheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
      opts.baseHue = Math.floor(Math.random() * 360);
      opts.baseColor = hslToHex(opts.baseHue, 100, 50);

      if (opts.colorScheme === 'Achromatic (Black & White)' && !opts.greenScreen) {
        opts.bgColor = '#ffffff';
      } else if (!opts.greenScreen && opts.bgColor === '#ffffff') {
        opts.bgColor = '#000000';
      }

      opts.len = Math.floor(12 + Math.random() * 22);
      opts.count = Math.floor(35 + Math.random() * 55);
      opts.baseTime = Math.floor(6 + Math.random() * 12);
      opts.addedTime = Math.floor(6 + Math.random() * 14);
      opts.dieChance = +(0.02 + Math.random() * 0.07).toFixed(3);
      opts.sparkChance = +(0.04 + Math.random() * 0.2).toFixed(3);
      opts.sparkDist = Math.floor(6 + Math.random() * 16);
      opts.sparkSize = +(1.5 + Math.random() * 2.5).toFixed(1);
      opts.repaintAlpha = +(0.025 + Math.random() * 0.06).toFixed(3);
      opts.glowMultiplier = +(0.8 + Math.random() * 1.4).toFixed(2);
      opts.speed = +(0.7 + Math.random() * 0.9).toFixed(2);
      opts.animationMode = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];

      // Sync GUI controllers
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());

      clearOffscreenCanvas();
      reseedLines();
    }

    // Build lil-gui Controls
    const gui = new GUI({ title: 'Scene Controls' });

    // Scene & Camera Folder
    const fScene = gui.addFolder('Camera & Animation');
    fScene.add(opts, 'animationMode', ANIMATION_MODES).name('Animation');
    fScene.add(opts, 'speed', 0.1, 4.0, 0.05).name('Speed');
    const zoomController = fScene.add(opts, 'zoom', 0.1, 8.0, 0.05).name('Zoom');
    const panXController = fScene.add(opts, 'panX', -1500, 1500, 1).name('Pan X');
    const panYController = fScene.add(opts, 'panY', -1500, 1500, 1).name('Pan Y');
    fScene.add(opts, 'resetView').name('Reset View');
    fScene.add(opts, 'dpr', 0.5, 3.0, 0.25).name('DPR (Pixel Ratio)').onChange(() => updateCanvasSize());

    // Color & Theme Folder
    const fColor = gui.addFolder('Colors & Theme');
    fColor.add(opts, 'colorScheme', COLOR_SCHEMES).name('Color Scheme').onChange(val => {
      if (val === 'Achromatic (Black & White)' && !opts.greenScreen) {
        opts.bgColor = '#ffffff';
        bgColorController.updateDisplay();
      } else if (opts.bgColor === '#ffffff' && !opts.greenScreen) {
        opts.bgColor = '#000000';
        bgColorController.updateDisplay();
      }
      clearOffscreenCanvas();
      refreshLineColors();
    });

    const baseColorController = fColor.addColor(opts, 'baseColor').name('Base Color').onChange(val => {
      const hsl = hexToHsl(val);
      opts.baseHue = hsl.h;
      baseHueController.updateDisplay();
      refreshLineColors();
    });

    const baseHueController = fColor.add(opts, 'baseHue', 0, 360, 1).name('Base Hue').onChange(val => {
      opts.baseColor = hslToHex(val, opts.saturation, 50);
      baseColorController.updateDisplay();
      refreshLineColors();
    });

    fColor.add(opts, 'saturation', 0, 100, 1).name('Saturation').onChange(() => refreshLineColors());
    fColor.add(opts, 'cycleHue').name('Auto Cycle Hue');
    fColor.add(opts, 'hueChange', 0.01, 1.0, 0.01).name('Hue Speed');
    fColor.add(opts, 'glowMultiplier', 0.1, 3.0, 0.05).name('Glow Multiplier');
    fColor.add(opts, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => clearOffscreenCanvas());
    const bgColorController = fColor.addColor(opts, 'bgColor').name('Background Color').onChange(() => clearOffscreenCanvas());
    fColor.add(opts, 'repaintAlpha', 0.005, 0.2, 0.005).name('Trail Fade Rate');

    // Geometry Folder
    const fGeometry = gui.addFolder('Geometry & Particles');
    fGeometry.add(opts, 'count', 10, 200, 1).name('Line Count').onChange(() => reseedLines());
    fGeometry.add(opts, 'len', 5, 60, 1).name('Line Length');
    fGeometry.add(opts, 'lineWidth', 1, 8, 0.5).name('Line Thickness');
    fGeometry.add(opts, 'baseTime', 2, 30, 1).name('Base Time');
    fGeometry.add(opts, 'addedTime', 2, 30, 1).name('Added Time');
    fGeometry.add(opts, 'dieChance', 0.001, 0.2, 0.005).name('Die Chance');
    fGeometry.add(opts, 'sparkChance', 0, 0.5, 0.01).name('Spark Chance');
    fGeometry.add(opts, 'sparkSize', 0.5, 8, 0.5).name('Spark Size');
    fGeometry.add(opts, 'sparkDist', 2, 30, 1).name('Spark Distance');

    // Post-Processing Suite Integration
    postProcessor.attachGUI(gui);

    // Interactivity Folder
    const fInteract = gui.addFolder('Interactivity');
    fInteract.add(opts, 'clickRandomize').name('Click Scene to Re-roll');
    fInteract.add(opts, 'randomize').name('Re-roll Now');

    // Interactive Dragging & Wheel Zoom
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPanX = 0;
    let initialPanY = 0;
    let hasMoved = false;

    visibleCanvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      hasMoved = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initialPanX = opts.panX;
      initialPanY = opts.panY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.hypot(dx, dy) > 4) {
        hasMoved = true;
      }
      opts.panX = initialPanX + dx;
      opts.panY = initialPanY + dy;
      panXController.updateDisplay();
      panYController.updateDisplay();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (!hasMoved && opts.clickRandomize) {
        randomizeThemeAndParams();
      }
    });

    visibleCanvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.909;
      opts.zoom = Math.min(Math.max(opts.zoom * zoomFactor, 0.1), 10.0);
      zoomController.updateDisplay();
    }, { passive: false });

    // Keyboard Shortcuts: 'H' to toggle UI
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    window.addEventListener('resize', () => {
      updateCanvasSize();
    });

    // Initialize System
    updateCanvasSize();
    reseedLines();

    // Main Render Loop (Auto Infinite Animation with Post-Processing)
    let lastTime = performance.now();
    let stepAccumulator = 0;

    function loop(currentTime) {
      window.requestAnimationFrame(loop);

      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      const simSpeed = opts.speed;
      animTick += simSpeed * dt * 60;
      stepAccumulator += simSpeed;

      const stepsToRun = Math.floor(stepAccumulator);
      stepAccumulator -= stepsToRun;

      // 1. Trail Fade Pass on Offscreen Canvas (Screen Space)
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = 0;

      const currentBg = opts.greenScreen ? '#00ff00' : opts.bgColor;
      ctx.fillStyle = hexToRgba(currentBg, opts.repaintAlpha);
      ctx.fillRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);

      // 2. Camera Animation & User Transform
      const { animPanX, animPanY, animZoom, animRot } = calculateAnimationOffsets(opts.animationMode, animTick);
      const totalZoom = opts.zoom * animZoom;
      const totalPanX = opts.panX + animPanX;
      const totalPanY = opts.panY + animPanY;

      // Set Blending Mode
      if (opts.colorScheme === 'Achromatic (Black & White)' && !opts.greenScreen) {
        ctx.globalCompositeOperation = 'multiply';
      } else {
        ctx.globalCompositeOperation = 'lighter';
      }

      ctx.save();
      ctx.scale(opts.dpr, opts.dpr);
      ctx.translate(w / 2 + totalPanX, h / 2 + totalPanY);
      ctx.rotate(animRot);
      ctx.scale(totalZoom, totalZoom);

      // 3. Step & Render Lines to 2D Buffer
      for (let s = 0; s < stepsToRun; s++) {
        ++tick;
        if (lines.length < opts.count && Math.random() < opts.spawnChance) {
          lines.push(new Line());
        }
        for (let i = 0; i < lines.length; i++) {
          lines[i].step();
        }
      }

      ctx.restore();

      // 4. Update CanvasTexture & Render Post-Processing Pipeline to Screen
      canvasTexture.needsUpdate = true;
      postProcessor.render(canvasTexture);
    }

    window.requestAnimationFrame(loop);
  </script>
</body>
