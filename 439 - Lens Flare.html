    function buildDiaphragm(sides, radius) {
      const group = new THREE.Group();
      const innerGroup = new THREE.Group();
      group.add(innerGroup);

      // Translucent additive diaphragm plane
      const geom = new THREE.PlaneGeometry(radius * 2, radius * 2, 1, 1);
      const mat = new THREE.ShaderMaterial({
        vertexShader: DiaphragmShader.vertexShader,
        fragmentShader: DiaphragmShader.fragmentShader,
        uniforms: {
          uColor: { value: new THREE.Color(params.diaphragmColor) },
          uChromaColor: { value: new THREE.Color(params.spectralFringeColor) },
          uOpacity: { value: params.diaphragmOpacity },
          uSides: { value: sides },
          uDispersion: { value: params.dispersionStrength },
          uTime: { value: 0 }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });

      const mesh = new THREE.Mesh(geom, mat);
      innerGroup.add(mesh);

      // Outer delicate polygonal rim border
      const outerBorderPts = [];
      for (let i = 0; i <= sides; i++) {
        const a = (i / sides) * Math.PI * 2;
        outerBorderPts.push(new THREE.Vector3(Math.cos(a) * radius * 0.98, Math.sin(a) * radius * 0.98, 0.01));
      }
      const borderGeom = new THREE.BufferGeometry().setFromPoints(outerBorderPts);
      const borderMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(params.irisRingColor),
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const borderLine = new THREE.Line(borderGeom, borderMat);
      innerGroup.add(borderLine);

      return {
        group,
        innerGroup,
        shaderMat: mat,
        borderMat,
        radius,
        sides
      };
    }

    function buildIrisRing(radius, options = {}) {
      const group = new THREE.Group();
      const innerGroup = new THREE.Group();
      group.add(innerGroup);

      const isTriple = options.triple || false;

      // Outer metallic chassis ring
      const ringGeom = new THREE.RingGeometry(radius * 0.96, radius, 96);
      const ringMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.irisRingColor),
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.88,
        blending: THREE.AdditiveBlending
      });
      const ringMesh = new THREE.Mesh(ringGeom, ringMat);
      innerGroup.add(ringMesh);

      // Concentric inner luminescent accent ring
      const innerRingGeom = new THREE.RingGeometry(radius * 0.89, radius * 0.92, 96);
      const innerRingMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.spectralFringeColor),
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
      const innerRingMesh = new THREE.Mesh(innerRingGeom, innerRingMat);
      innerGroup.add(innerRingMesh);

      // If triple ring, add 3rd concentric layer
      let thirdRingMat;
      if (isTriple) {
        const thirdRingGeom = new THREE.RingGeometry(radius * 0.78, radius * 0.81, 96);
        thirdRingMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(params.diaphragmColor),
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.7,
          blending: THREE.AdditiveBlending
        });
        const thirdRingMesh = new THREE.Mesh(thirdRingGeom, thirdRingMat);
        innerGroup.add(thirdRingMesh);
      }

      // Precision vernier radial tick marks
      const tickPts = [];
      const tickCount = 36;
      for (let i = 0; i < tickCount; i++) {
        const a = (i / tickCount) * Math.PI * 2;
        const len = (i % 6 === 0) ? radius * 0.08 : radius * 0.04;
        const r1 = radius - len;
        const r2 = radius;
        tickPts.push(new THREE.Vector3(Math.cos(a) * r1, Math.sin(a) * r1, 0.01));
        tickPts.push(new THREE.Vector3(Math.cos(a) * r2, Math.sin(a) * r2, 0.01));
      }
      const tickGeom = new THREE.BufferGeometry().setFromPoints(tickPts);
      const tickMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(params.spectralFringeColor),
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending
      });
      const tickLine = new THREE.LineSegments(tickGeom, tickMat);
      innerGroup.add(tickLine);

      return {
        group,
        innerGroup,
        ringMat,
        innerRingMat,
        thirdRingMat,
        tickMat,
        radius
      };
    }

    function buildHaloDisc(radius, haloType, options = {}) {
      const group = new THREE.Group();
      const innerGroup = new THREE.Group();
      group.add(innerGroup);

      const geom = new THREE.PlaneGeometry(radius * 2, radius * 2, 1, 1);
      const mat = new THREE.ShaderMaterial({
        vertexShader: HaloShader.vertexShader,
        fragmentShader: HaloShader.fragmentShader,
        uniforms: {
          uColor: { value: new THREE.Color(params.haloDiscColor) },
          uFringeColor: { value: new THREE.Color(params.spectralFringeColor) },
          uOpacity: { value: params.haloOpacity },
          uHaloType: { value: haloType },
          uTime: { value: 0 }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });

      const mesh = new THREE.Mesh(geom, mat);
      innerGroup.add(mesh);

      return {
        group,
        innerGroup,
        shaderMat: mat,
        radius,
        haloType
      };
    }

    // --- LIGHT SOURCE CORE & DIFFRACTION EMITTER ---
    let lightEmitterGroup;
    let starburstMesh;
    let streakMesh;

    function buildLightEmitter() {
      const group = new THREE.Group();
      const innerGroup = new THREE.Group();
      group.add(innerGroup);

      // Blinding Core Sphere
      const coreGeom = new THREE.SphereGeometry(0.8, 32, 32);
      const coreMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.primaryLightColor),
        blending: THREE.AdditiveBlending
      });
      const coreMesh = new THREE.Mesh(coreGeom, coreMat);
      innerGroup.add(coreMesh);

      // Radial Starburst Spikes (8-point diffraction star)
      const starGeom = new THREE.PlaneGeometry(12.0, 12.0);
      const starCanvas = document.createElement('canvas');
      starCanvas.width = 256;
      starCanvas.height = 256;
      const ctx = starCanvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.12, 'rgba(255, 255, 255, 0.85)');
      grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.25)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      // Draw 8 thin diffraction rays
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        const ang = (i / 4) * Math.PI;
        ctx.beginPath();
        ctx.moveTo(128 - Math.cos(ang) * 128, 128 - Math.sin(ang) * 128);
        ctx.lineTo(128 + Math.cos(ang) * 128, 128 + Math.sin(ang) * 128);
        ctx.stroke();
      }

      const starTex = new THREE.CanvasTexture(starCanvas);
      const starMat = new THREE.MeshBasicMaterial({
        map: starTex,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      starburstMesh = new THREE.Mesh(starGeom, starMat);
      innerGroup.add(starburstMesh);

      // Anamorphic Horizontal Flare Streak
      const streakGeom = new THREE.PlaneGeometry(38.0, 0.7);
      const streakCanvas = document.createElement('canvas');
      streakCanvas.width = 512;
      streakCanvas.height = 32;
      const sctx = streakCanvas.getContext('2d');
      const sgrad = sctx.createLinearGradient(0, 16, 512, 16);
      sgrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      sgrad.addColorStop(0.25, 'rgba(255, 255, 255, 0.35)');
      sgrad.addColorStop(0.5, 'rgba(255, 255, 255, 1.0)');
      sgrad.addColorStop(0.75, 'rgba(255, 255, 255, 0.35)');
      sgrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      sctx.fillStyle = sgrad;
      sctx.fillRect(0, 0, 512, 32);

      const streakTex = new THREE.CanvasTexture(streakCanvas);
      const streakMat = new THREE.MeshBasicMaterial({
        map: streakTex,
        color: new THREE.Color(params.streakColor),
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      streakMesh = new THREE.Mesh(streakGeom, streakMat);
      innerGroup.add(streakMesh);

      return {
        group,
        innerGroup,
        coreMat,
        starMat,
        streakMat
      };
    }

    // --- CONNECTING OPTICAL AXIS BEAM ---
    let opticalAxisBeam;
    function buildOpticalAxisBeam(length) {
      const geom = new THREE.CylinderGeometry(0.03, 0.05, length, 16, 1, true);
      // Align along optical vector
      geom.rotateX(Math.PI / 2);
      const mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.spectralFringeColor),
        transparent: true,
        opacity: 0.22,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      opticalAxisBeam = new THREE.Mesh(geom, mat);
      opticalAxisBeam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), opticalVector);
      return opticalAxisBeam;
    }

    // --- FLOATING OPTICAL BOKEH DUST PARTICLES ---
    let bokehParticleSystem;
    function buildBokehParticles() {
      const count = 160;
      const geom = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const scales = new Float32Array(count);

      // Coordinate axes perpendicular to optical vector
      const vZ = opticalVector.clone();
      const vUp = new THREE.Vector3(0, 1, 0);
      const vX = new THREE.Vector3().crossVectors(vZ, vUp).normalize();
      const vY = new THREE.Vector3().crossVectors(vX, vZ).normalize();

      for (let i = 0; i < count; i++) {
        const dist = THREE.MathUtils.randFloat(-32, 45);
        const rad = THREE.MathUtils.randFloat(0.3, 3.5);
        const theta = Math.random() * Math.PI * 2;

        const pos = opticalVector.clone().multiplyScalar(dist)
          .add(vX.clone().multiplyScalar(Math.cos(theta) * rad))
          .add(vY.clone().multiplyScalar(Math.sin(theta) * rad));

        positions[i * 3 + 0] = pos.x;
        positions[i * 3 + 1] = pos.y;
        positions[i * 3 + 2] = pos.z;

        scales[i] = THREE.MathUtils.randFloat(0.4, 2.0);
      }

      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geom.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64;
      pCanvas.height = 64;
      const pctx = pCanvas.getContext('2d');
      const pgrad = pctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      pgrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      pgrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.6)');
      pgrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      pctx.fillStyle = pgrad;
      pctx.fillRect(0, 0, 64, 64);
      const pTex = new THREE.CanvasTexture(pCanvas);

      const pMat = new THREE.PointsMaterial({
        size: 0.55,
        map: pTex,
        color: new THREE.Color(params.spectralFringeColor),
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      bokehParticleSystem = new THREE.Points(geom, pMat);
      return bokehParticleSystem;
    }

    // --- SOLAR ECLIPSE OCCULTING DISC ---
    let occultingDiscMesh;
    function buildOccultingDisc() {
      const geom = new THREE.SphereGeometry(1.6, 32, 32);
      const mat = new THREE.MeshBasicMaterial({
        color: 0x010204,
        transparent: true,
        opacity: 0.98
      });
      occultingDiscMesh = new THREE.Mesh(geom, mat);
      occultingDiscMesh.visible = false;
      return occultingDiscMesh;
    }

    // =========================================================================
    // POPULATE GHOST TRAIN ELEMENTS (GENEROUS SPACING & RICH GEOMETRY)
    // =========================================================================
    function assembleGhostTrain() {
      while (ghostTrainGroup.children.length > 0) {
        const obj = ghostTrainGroup.children[0];
        ghostTrainGroup.remove(obj);
      }
      trainElements.length = 0;

      // 1. Light Emitter at Head of Train
      lightEmitterGroup = buildLightEmitter();
      const emitterDist = -28.0;
      lightEmitterGroup.group.position.copy(opticalVector).multiplyScalar(emitterDist);
      ghostTrainGroup.add(lightEmitterGroup.group);
      trainElements.push({
        type: 'emitter',
        group: lightEmitterGroup.group,
        innerGroup: lightEmitterGroup.innerGroup,
        baseDist: emitterDist,
        currentDist: emitterDist,
        rotSpeed: 0.08,
        data: lightEmitterGroup
      });

      // 2. Optical Axis Beam
      const beam = buildOpticalAxisBeam(80);
      beam.visible = params.showBeam;
      ghostTrainGroup.add(beam);

      // 3. Bokeh Particle Corridor
      const particles = buildBokehParticles();
      particles.visible = params.showParticles;
      ghostTrainGroup.add(particles);

      // 4. Occulting Eclipse Disc
      const eclipseDisc = buildOccultingDisc();
      ghostTrainGroup.add(eclipseDisc);

      // 5. Linear Axis Array: Alternating Polygonal Diaphragms, Rings, and Halos
      // Generously and rhythmically spaced along the optical vector line
      const elementSequence = [
        { type: 'diaphragm', dist: -23.5, radius: 1.0, sides: 4 }, // Crisp small diamond
        { type: 'ring',      dist: -18.5, radius: 1.9, triple: false },
        { type: 'diaphragm', dist: -13.5, radius: 2.6, sides: 6 }, // Crisp Hexagon
        { type: 'halo',      dist: -8.5,  radius: 4.2, haloType: 1 }, // Rainbow Spectral Ring
        { type: 'ring',      dist: -3.5,  radius: 2.8, triple: false },
        { type: 'diaphragm', dist: 2.0,   radius: 3.5, sides: 8 }, // Crisp Octagon
        { type: 'halo',      dist: 7.5,   radius: 4.0, haloType: 3 }, // Anamorphic Oval Flare
        { type: 'diaphragm', dist: 13.0,  radius: 2.4, sides: 5 }, // Crisp Pentagon
        { type: 'ring',      dist: 18.5,  radius: 3.6, triple: true }, // Concentric Triple Ring
        { type: 'diaphragm', dist: 24.5,  radius: 4.5, sides: 7 }, // Crisp Heptagon
        { type: 'halo',      dist: 31.0,  radius: 6.0, haloType: 2 }, // Airy Diffraction Rings
        { type: 'diaphragm', dist: 38.0,  radius: 6.2, sides: 9 }, // Nonagon Diaphragm
        { type: 'ring',      dist: 45.0,  radius: 5.5, triple: false }, // Outer Barrel Retaining Ring
        { type: 'halo',      dist: 53.0,  radius: 12.0, haloType: 0 }  // Soft Atmospheric Wash
      ];

      elementSequence.forEach((cfg, idx) => {
        let el;
        const targetDist = cfg.dist * params.flareSpacing;

        if (cfg.type === 'diaphragm') {
          // Check if alternating geometric mode or uniform blade count
          let sides = cfg.sides;
          if (params.bladeShapeMode === 'Uniform Blades') {
            sides = params.bladeCount;
          }

          el = buildDiaphragm(sides, cfg.radius * params.overallScale);
          el.group.position.copy(opticalVector).multiplyScalar(targetDist);
          ghostTrainGroup.add(el.group);

          trainElements.push({
            type: 'diaphragm',
            group: el.group,
            innerGroup: el.innerGroup,
            baseDist: targetDist,
            currentDist: targetDist,
            rotSpeed: (idx % 2 === 0 ? 1 : -1) * (0.04 + (idx % 3) * 0.02),
            freq: 0.5 + idx * 0.06,
            phase: idx * 0.8,
            amp: 0.6 * params.driftAmplitude,
            data: el
          });
        } else if (cfg.type === 'ring') {
          el = buildIrisRing(cfg.radius * params.overallScale, { triple: cfg.triple });
          el.group.position.copy(opticalVector).multiplyScalar(targetDist);
          ghostTrainGroup.add(el.group);

          trainElements.push({
            type: 'ring',
            group: el.group,
            innerGroup: el.innerGroup,
            baseDist: targetDist,
            currentDist: targetDist,
            rotSpeed: (idx % 2 === 0 ? -1 : 1) * 0.025,
            freq: 0.45 + idx * 0.05,
            phase: idx * 0.7,
            amp: 0.5 * params.driftAmplitude,
            data: el
          });
        } else if (cfg.type === 'halo') {
          el = buildHaloDisc(cfg.radius * params.overallScale, cfg.haloType);
          el.group.position.copy(opticalVector).multiplyScalar(targetDist);
          ghostTrainGroup.add(el.group);

          trainElements.push({
            type: 'halo',
            group: el.group,
            innerGroup: el.innerGroup,
            baseDist: targetDist,
            currentDist: targetDist,
            rotSpeed: (idx % 2 === 0 ? 0.015 : -0.015),
            freq: 0.4 + idx * 0.04,
            phase: idx * 0.6,
            amp: 0.7 * params.driftAmplitude,
            data: el
          });
        }
      });
    }

    assembleGhostTrain();

    // =========================================================================
    // COLOR SCHEME UPDATE LOGIC
    // =========================================================================
    function applyColorScheme(schemeName) {
      const s = PALETTES[schemeName];
      if (!s) return;

      params.colorScheme = schemeName;
      params.bgColor = s.bg;
      params.diaphragmColor = s.diaphragms;
      params.irisRingColor = s.irisRings;
      params.haloDiscColor = s.haloDiscs;
      params.spectralFringeColor = s.spectralFringe;
      params.streakColor = s.streak;

      params.primaryLightColor = s.lightCore;
      params.fillLightColor = s.fillLight;
      params.rimLightColor = s.rimLight;
      params.ambientColor = s.ambient;

      updateSceneColors();
    }

    function updateSceneColors() {
      // Background / Green Screen
      if (params.greenScreen) {
        scene.background = new THREE.Color('#00ff00');
      } else {
        scene.background = new THREE.Color(params.bgColor);
      }

      // Lights
      primaryLight.color.set(params.primaryLightColor);
      primaryDirLight.color.set(params.primaryLightColor);
      fillLight.color.set(params.fillLightColor);
      rimLight.color.set(params.rimLightColor);
      ambientLight.color.set(params.ambientColor);

      // Light Emitter Meshes
      if (lightEmitterGroup) {
        lightEmitterGroup.coreMat.color.set(params.primaryLightColor);
        lightEmitterGroup.streakMat.color.set(params.streakColor);
      }

      // Optical Axis & Particles
      if (opticalAxisBeam) {
        opticalAxisBeam.material.color.set(params.spectralFringeColor);
      }
      if (bokehParticleSystem) {
        bokehParticleSystem.material.color.set(params.spectralFringeColor);
      }

      // Ghost Train Elements
      trainElements.forEach(el => {
        if (el.type === 'diaphragm') {
          el.data.shaderMat.uniforms.uColor.value.set(params.diaphragmColor);
          el.data.shaderMat.uniforms.uChromaColor.value.set(params.spectralFringeColor);
          el.data.shaderMat.uniforms.uOpacity.value = params.diaphragmOpacity;
          el.data.shaderMat.uniforms.uDispersion.value = params.dispersionStrength;
          el.data.borderMat.color.set(params.irisRingColor);
        } else if (el.type === 'ring') {
          el.data.ringMat.color.set(params.irisRingColor);
          el.data.innerRingMat.color.set(params.spectralFringeColor);
          if (el.data.thirdRingMat) el.data.thirdRingMat.color.set(params.diaphragmColor);
          el.data.tickMat.color.set(params.spectralFringeColor);
        } else if (el.type === 'halo') {
          el.data.shaderMat.uniforms.uColor.value.set(params.haloDiscColor);
          el.data.shaderMat.uniforms.uFringeColor.value.set(params.spectralFringeColor);
          el.data.shaderMat.uniforms.uOpacity.value = params.haloOpacity;
        }
      });
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZATION ON CLICK
    // =========================================================================
    function randomizeScene() {
      // 1. Pick random color scheme
      const keys = Object.keys(PALETTES);
      const randKey = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randKey);

      // 2. Randomize geometric parameters
      params.bladeCount = [5, 6, 7, 8, 9, 10, 12][Math.floor(Math.random() * 7)];
      params.flareSpacing = THREE.MathUtils.randFloat(1.15, 1.6);
      params.overallScale = THREE.MathUtils.randFloat(0.85, 1.25);
      params.dispersionStrength = THREE.MathUtils.randFloat(0.8, 2.0);
      params.driftAmplitude = THREE.MathUtils.randFloat(0.5, 1.2);

      // 3. Randomize motion parameters
      params.animationSpeed = THREE.MathUtils.randFloat(0.6, 1.5);
      params.pulseFrequency = THREE.MathUtils.randFloat(0.7, 1.5);

      // 4. Randomize light intensity & exposure
      params.exposure = THREE.MathUtils.randFloat(0.95, 1.35);
      renderer.toneMappingExposure = params.exposure;
      params.primaryLightIntensity = THREE.MathUtils.randFloat(3.0, 5.2);
      primaryLight.intensity = params.primaryLightIntensity;
      primaryDirLight.intensity = params.primaryLightIntensity * 0.7;

      // 5. Re-assemble scene elements
      assembleGhostTrain();
      updateSceneColors();

      // 6. Update GUI display: DO NOT shuffle or touch Postprocessing settings!
      if (gui) {
        gui.folders.forEach(folder => {
          if (folder._title && (folder._title.includes('Post-Processing') || folder._title.includes('PostProcessor'))) return;
          folder.controllersRecursive().forEach(ctrl => {
            if (ctrl.object && ctrl.object === postProcessor?.settings) return;
            ctrl.updateDisplay();
          });
        });
      }
    }

    // Pointer click vs drag tracking
    let pointerDownPos = { x: 0, y: 0, time: 0 };
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos = { x: e.clientX, y: e.clientY, time: performance.now() };
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const duration = performance.now() - pointerDownPos.time;

      if (dist < 6 && duration < 300) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    function resetCameraView() {
      const dist = camera.position.distanceTo(controls.target);
      camera.position.set(dist * 0.6, dist * 0.45, dist * 0.65);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    // =========================================================================
    // ANIMATION & CAMERA DYNAMICS
    // =========================================================================
    const clock = new THREE.Clock();
    let animTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const speed = params.animationSpeed;
      animTime += dt * speed;

      // --- CAMERA ANIMATIONS (PRESERVING USER ZOOM & ANGLES) ---
      const camOffset = camera.position.clone().sub(controls.target);

      if (params.animationMode === 'Orbital Sweep') {
        const dTheta = 0.12 * speed * dt;
        camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dTheta);
        camera.position.copy(controls.target).add(camOffset);
      } else if (params.animationMode === 'Drift & Pulse') {
        const swayY = Math.sin(animTime * 0.5) * 0.012 * speed;
        camOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), swayY);
        camera.position.copy(controls.target).add(camOffset);
      } else if (params.animationMode === 'Anamorphic Glide') {
        const glideX = Math.cos(animTime * 0.4) * 0.018 * speed;
        camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), glideX);
        camera.position.copy(controls.target).add(camOffset);
      } else if (params.animationMode === 'Spectral Dispersion') {
        const dTheta = 0.06 * speed * dt;
        camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dTheta);
        camera.position.copy(controls.target).add(camOffset);
      } else if (params.animationMode === 'Deep Dolly Zoom') {
        const dTheta = Math.sin(animTime * 0.3) * 0.008 * speed;
        camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dTheta);
        camera.position.copy(controls.target).add(camOffset);
      } else if (params.animationMode === 'Diaphragm Breathing') {
        const dTheta = 0.07 * speed * dt;
        camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dTheta);
        camera.position.copy(controls.target).add(camOffset);
      } else if (params.animationMode === 'Solar Eclipse Drift') {
        const dTheta = Math.sin(animTime * 0.25) * 0.01 * speed;
        camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dTheta);
        camera.position.copy(controls.target).add(camOffset);
      } else if (params.animationMode === 'Static') {
        // Pure manual camera
      }

      controls.update();

      // --- OCCULTING DISC BEHAVIOR (ECLIPSE ANIMATION) ---
      if (occultingDiscMesh) {
        if (params.animationMode === 'Solar Eclipse Drift') {
          occultingDiscMesh.visible = true;
          const progress = Math.sin(animTime * 0.4);
          const discPos = opticalVector.clone().multiplyScalar(-28.0)
            .add(new THREE.Vector3(progress * 2.8, Math.cos(animTime * 0.4) * 1.2, 0));
          occultingDiscMesh.position.copy(discPos);

          const proximity = Math.exp(-Math.pow(progress * 2.5, 2.0));
          if (starburstMesh) {
            starburstMesh.scale.setScalar(1.0 + proximity * 0.7);
          }
        } else {
          occultingDiscMesh.visible = false;
        }
      }

      // --- LIGHT EMITTER ANIMATIONS ---
      if (starburstMesh && streakMesh) {
        starburstMesh.rotation.z = animTime * 0.12;
        const shimmer = 0.96 + 0.08 * Math.sin(animTime * 3.0);
        starburstMesh.scale.set(shimmer, shimmer, 1.0);

        streakMesh.rotation.z = Math.PI / 12 + Math.sin(animTime * 0.5) * 0.04;
        const streakPulse = 1.0 + 0.12 * Math.sin(animTime * 2.2);
        streakMesh.scale.set(streakPulse, 1.0, 1.0);
      }

      // --- DRIFTING GHOST TRAIN ELEMENTS (BILLBOARDED TO CAMERA) ---
      trainElements.forEach((el, idx) => {
        // 1. Billboard element so it always faces camera directly:
        // This completely eliminates flat sheared cardboard cards and distorted polygons!
        el.group.quaternion.copy(camera.quaternion);

        if (el.type === 'emitter') return;

        // 2. Harmonic drift along optical vector line
        let driftOffset = 0;
        if (params.animationMode === 'Deep Dolly Zoom') {
          const zoomFactor = 1.0 + 0.35 * Math.sin(animTime * 0.6);
          el.currentDist = el.baseDist * zoomFactor;
        } else if (params.animationMode !== 'Static') {
          const freq = el.freq * params.pulseFrequency;
          driftOffset = Math.sin(animTime * freq + el.phase) * el.amp;
          el.currentDist = el.baseDist + driftOffset;
        }
        el.group.position.copy(opticalVector).multiplyScalar(el.currentDist);

        // 3. Individual element rotation and breathing
        if (el.innerGroup && params.animationMode !== 'Static') {
          el.innerGroup.rotation.z += el.rotSpeed * dt * speed;
        }

        if (el.type === 'diaphragm') {
          if (params.animationMode !== 'Static') {
            el.data.shaderMat.uniforms.uTime.value = animTime;

            if (params.animationMode === 'Spectral Dispersion') {
              const dispersionPulse = 1.0 + 0.6 * Math.sin(animTime * 2.0 + idx);
              el.data.shaderMat.uniforms.uDispersion.value = params.dispersionStrength * dispersionPulse;
            }
          }
        } else if (el.type === 'ring') {
          if (params.animationMode !== 'Static') {
            const ringPulse = 1.0 + 0.03 * Math.sin(animTime * 1.5 + el.phase);
            el.innerGroup.scale.set(ringPulse, ringPulse, 1.0);
          }
        } else if (el.type === 'halo') {
          if (params.animationMode !== 'Static') {
            el.data.shaderMat.uniforms.uTime.value = animTime;
            const haloScale = 1.0 + 0.05 * Math.cos(animTime * 1.0 + el.phase);
            el.innerGroup.scale.set(haloScale, haloScale, 1.0);
          }
        }
      });

      // --- FLOATING OPTICAL BOKEH PARTICLES DRIFT ---
      if (bokehParticleSystem && bokehParticleSystem.visible) {
        const posAttr = bokehParticleSystem.geometry.attributes.position;
        const count = posAttr.count;
        const driftStep = opticalVector.clone().multiplyScalar(0.4 * dt * speed);
        for (let i = 0; i < count; i++) {
          let px = posAttr.getX(i) + driftStep.x;
          let py = posAttr.getY(i) + driftStep.y;
          let pz = posAttr.getZ(i) + driftStep.z;

          // Wrap around along the optical vector corridor
          const currentVec = new THREE.Vector3(px, py, pz);
          const projDist = currentVec.dot(opticalVector);
          if (projDist > 55) {
            const resetVec = currentVec.sub(opticalVector.clone().multiplyScalar(85));
            px = resetVec.x; py = resetVec.y; pz = resetVec.z;
          }
          posAttr.setXYZ(i, px, py, pz);
        }
        posAttr.needsUpdate = true;
      }

      // Render through PostProcessor Suite
      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.setMoonScreenPosition(camera, primaryLight.position);
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();

    // =========================================================================
    // WINDOW RESIZE HANDLER
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    });

    // =========================================================================
    // H KEY LISTENER: HIDE / SHOW UI
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // =========================================================================
    // LIL-GUI CONTROL PANEL SETUP
    // =========================================================================
    const gui = new GUI({ title: 'Lens Flare Ghost Train' });

    // 1. Color Schemes & Appearance
    const fTheme = gui.addFolder('Color Scheme & Theme');

    fTheme.add(params, 'colorScheme', Object.keys(PALETTES)).name('Preset Scheme').onChange(val => {
      applyColorScheme(val);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });

    fTheme.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => {
      updateSceneColors();
    });

    fTheme.addColor(params, 'bgColor').name('Background Color').onChange(() => {
      if (!params.greenScreen) updateSceneColors();
    });

    fTheme.addColor(params, 'diaphragmColor').name('Diaphragms').onChange(() => updateSceneColors());
    fTheme.addColor(params, 'irisRingColor').name('Iris Rings').onChange(() => updateSceneColors());
    fTheme.addColor(params, 'haloDiscColor').name('Halo Discs').onChange(() => updateSceneColors());
    fTheme.addColor(params, 'spectralFringeColor').name('Spectral Fringe').onChange(() => updateSceneColors());
    fTheme.addColor(params, 'streakColor').name('Flare Streak').onChange(() => updateSceneColors());

    // 2. Animation Controls
    const fAnim = gui.addFolder('Animation & Motion');

    const ANIMATION_PRESETS = [
      'Drift & Pulse',
      'Orbital Sweep',
      'Anamorphic Glide',
      'Spectral Dispersion',
      'Deep Dolly Zoom',
      'Diaphragm Breathing',
      'Solar Eclipse Drift',
      'Static'
    ];

    fAnim.add(params, 'animationMode', ANIMATION_PRESETS).name('Animation Mode');
    fAnim.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    fAnim.add(params, 'driftAmplitude', 0.1, 2.5, 0.05).name('Drift Amplitude').onChange(() => {
      trainElements.forEach((el, idx) => {
        el.amp = (0.5 + (idx % 4) * 0.1) * params.driftAmplitude;
      });
    });
    fAnim.add(params, 'pulseFrequency', 0.2, 3.0, 0.1).name('Pulse Frequency');

    // 3. Camera & Interaction
    const fCam = gui.addFolder('Camera & Interaction');

    fCam.add(params, 'dragMode', ['Orbit (Right-click pan)', 'Pan (Left-click pan)']).name('Drag Mode').onChange(() => {
      updateDragMode();
    });
    fCam.add(params, 'resetCamera').name('Reset Camera Angle');

    // 4. Geometry & Optics
    const fOptics = gui.addFolder('Optics & Geometry');

    fOptics.add(params, 'bladeShapeMode', ['Alternating Geometric', 'Uniform Blades']).name('Shape Mode').onChange(() => {
      assembleGhostTrain();
      updateSceneColors();
    });

    fOptics.add(params, 'bladeCount', 3, 12, 1).name('Uniform Blade N-gon').onChange(() => {
      if (params.bladeShapeMode === 'Uniform Blades') {
        assembleGhostTrain();
        updateSceneColors();
      }
    });

    fOptics.add(params, 'flareSpacing', 0.8, 2.2, 0.05).name('Train Spacing').onChange(() => {
      assembleGhostTrain();
      updateSceneColors();
    });
    fOptics.add(params, 'overallScale', 0.5, 2.0, 0.05).name('Overall Scale').onChange(() => {
      assembleGhostTrain();
      updateSceneColors();
    });
    fOptics.add(params, 'dispersionStrength', 0.0, 3.0, 0.1).name('Chromatic Dispersion').onChange(() => {
      updateSceneColors();
    });
    fOptics.add(params, 'diaphragmOpacity', 0.1, 1.0, 0.05).name('Diaphragm Opacity').onChange(() => {
      updateSceneColors();
    });
    fOptics.add(params, 'haloOpacity', 0.1, 1.0, 0.05).name('Halo Opacity').onChange(() => {
      updateSceneColors();
    });
    fOptics.add(params, 'showBeam').name('Optical Axis Beam').onChange(v => {
      if (opticalAxisBeam) opticalAxisBeam.visible = v;
    });
    fOptics.add(params, 'showParticles').name('Bokeh Particles').onChange(v => {
      if (bokehParticleSystem) bokehParticleSystem.visible = v;
    });

    // 5. Lighting & Exposure
    const fLight = gui.addFolder('Lighting & Exposure');

    fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
      if (postProcessor && postProcessor.settings) postProcessor.settings.exposure = v;
    });
    fLight.add(params, 'sceneLightMultiplier', 0.1, 3.0, 0.1).name('Light Multiplier').onChange(v => {
      primaryLight.intensity = params.primaryLightIntensity * v;
      primaryDirLight.intensity = params.primaryLightIntensity * 0.7 * v;
      fillLight.intensity = params.fillLightIntensity * v;
      rimLight.intensity = params.rimLightIntensity * v;
      ambientLight.intensity = params.ambientIntensity * v;
    });

    const fPrimary = fLight.addFolder('Primary Light (Source Core)');
    fPrimary.add(params, 'primaryLightIntensity', 0.0, 8.0, 0.1).name('Intensity').onChange(v => {
      primaryLight.intensity = v * params.sceneLightMultiplier;
      primaryDirLight.intensity = v * 0.7 * params.sceneLightMultiplier;
    });
    fPrimary.addColor(params, 'primaryLightColor').name('Color').onChange(() => updateSceneColors());

    const fFill = fLight.addFolder('Fill Light (Counter)');
    fFill.add(params, 'fillLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => {
      fillLight.intensity = v * params.sceneLightMultiplier;
    });
    fFill.addColor(params, 'fillLightColor').name('Color').onChange(() => updateSceneColors());

    const fRim = fLight.addFolder('Rim Light (Optical Edge)');
    fRim.add(params, 'rimLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => {
      rimLight.intensity = v * params.sceneLightMultiplier;
    });
    fRim.addColor(params, 'rimLightColor').name('Color').onChange(() => updateSceneColors());

    const fAmb = fLight.addFolder('Ambient Light');
    fAmb.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(v => {
      ambientLight.intensity = v * params.sceneLightMultiplier;
    });
    fAmb.addColor(params, 'ambientColor').name('Color').onChange(() => updateSceneColors());

    // 6. Rendering & Randomization
    const fRender = gui.addFolder('Rendering & Generation');

    fRender.add(params, 'antialias').name('Scene Antialias').onChange(() => {
      createRenderer();
      updateSceneColors();
    });

    fRender.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      }
    });

    fRender.add(params, 'clickToRandomize').name('Click to Randomize');
    fRender.add(params, 'randomizeNow').name('Randomize Now');

    fRender.add({
      hideUI: () => gui.hide()
    }, 'hideUI').name('Hide UI (Press H)');

    // Attach Post-Processing Suite (PostProcessor.js)
    if (postProcessor) {
      postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');
    }

    fTheme.open();
    fAnim.open();
  </script>
</body>
</html>
