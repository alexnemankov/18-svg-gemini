  <!-- p5.js v2.3.3 from official CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

  <style>
    /* ============================================================

    /* lil-gui Custom Dark Glassmorphic Styling */

      --focus-color: #2a76d3 !important;
      --number-color: #38bdf8 !important;
      --string-color: #4ade80 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace !important;
      border-radius: 12px !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6) !important;
      margin-top: 14px;

    }

    .lil-gui .title {

    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    // ============================================================
    // By Roni Kaufman
    // https://ronikaufman.github.io
    //
    // Genuary prompt: One color, one shape.
    // Enhanced with infinite 60fps organic animations, pan & zoom,
    // borderless fullscreen responsiveness, procedural theme randomizer,
    // and 19 curated harmonious color schemes.
    // ============================================================

    let M, N, u, gap;
    let myWhite = "#fafafa", accentCol = "#2a76d3";

    let randInt = (a, b) => (floor(random(a, b))); 

    // 19 Curated Color Schemes Pattern
    const COLOR_SCHEMES = {
      'Original': {
        bg: '#fafafa',
        accent: '#2a76d3',
        colors: ['#fafafa', '#2a76d3', '#1b4d8c', '#5499ea', '#8cbcf3']
      },
      'Monochromatic': {
        bg: '#06131d',
        accent: '#0096ff',
        colors: ['#06131d', '#0c283d', '#114567', '#176798', '#208ecf', '#54b1eb', '#9ed5f7', '#e3f3fc']
      },
      'Analogous': {
        bg: '#1c0423',
        accent: '#ff4d6d',
        colors: ['#1c0423', '#3d0c3e', '#6b144a', '#a21e4a', '#d8315b', '#f95738', '#ff8c42', '#f4d06f']
      },
      'Complementary': {
        bg: '#02141a',
        accent: '#ee6c4d',
        colors: ['#02141a', '#083742', '#0f5a6b', '#1a8599', '#3dccc7', '#ee6c4d', '#f28482', '#ffb4a2']
      },
      'Split-complementary': {
        bg: '#081410',
        accent: '#f72585',
        colors: ['#081410', '#123d2b', '#226f54', '#43aa8b', '#3a0ca3', '#7209b7', '#b5179e', '#f72585']
      },
      'Triadic': {
        bg: '#04091a',
        accent: '#ff0054',
        colors: ['#04091a', '#0d3b66', '#0582ca', '#00f5d4', '#ff0054', '#ff5400', '#ffbd00', '#70e000']
      },
      'Tetradic': {
        bg: '#0e0d1f',
        accent: '#f77f00',
        colors: ['#0e0d1f', '#1c2541', '#3a86ff', '#06d6a0', '#ff006e', '#f77f00', '#ffd166', '#8338ec']
      },
      'Double split-complementary': {
        bg: '#0c1b2a',
        accent: '#ff9f1c',
        colors: ['#0c1b2a', '#1b3a4b', '#0077b6', '#00b4d8', '#e65100', '#ff9f1c', '#ffb703', '#7b2cbf']
      },
      'Achromatic (black and white)': {
        bg: '#000000',
        accent: '#ffffff',
        colors: ['#000000', '#181818', '#333333', '#555555', '#888888', '#b8b8b8', '#e0e0e0', '#ffffff']
      },
      'Achromatic + Accent (B&W + Red)': {
        bg: '#000000',
        accent: '#e60000',
        colors: ['#000000', '#1c1c1c', '#404040', '#737373', '#b3b3b3', '#ffffff', '#e60000', '#ff3333']
      },
      'Neutral + accent': {
        bg: '#181614',
        accent: '#ff9e00',
        colors: ['#181614', '#2c2722', '#48413a', '#786e63', '#b4a796', '#eee9e0', '#ff9e00', '#00e5ff']
      },
      'Palette 12: F6AA1C, BC3908, 941B0C': {
        bg: '#220901',
        accent: '#F6AA1C',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
      },
      'Palette 13: 63D1CF, 5BC0BE, 4BAD9E': {
        bg: '#000000',
        accent: '#63D1CF',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000']
      },
      'Palette 14: AA60C8, D69ADE, C9A3C6': {
        bg: '#0D001D',
        accent: '#AA60C8',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12']
      },
      'Palette 15: FEF1BE, FFBA00, 008189': {
        bg: '#061210',
        accent: '#FFBA00',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
      },
      'Palette 16: D4FFB0, 7FFF00, 00B894': {
        bg: '#05140A',
        accent: '#7FFF00',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
      },
      'Palette 17: FFE8CC, FF8C00, C7501A': {
        bg: '#0E0618',
        accent: '#FF8C00',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
      },
      'Palette 18: E8E0FF, B38FFF, 6A3DE8': {
        bg: '#090612',
        accent: '#6A3DE8',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
      },
      'Palette 19: E0FBFF, 00F0FF, D40078': {
        bg: '#05020F',
        accent: '#00F0FF',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      }
    };

    // ============================================================
    // Global Interactive State & Settings
    // ============================================================
    const settings = {
      // Color & Visual Theme
      colorScheme: 'Original',
      colorMode: 'Classic Binary',
      invertColors: false,

      // Animation Dynamics
      isPlaying: true,
      animSpeed: 1.0,
      animMode: 'Concentric Waves',
      waveFrequency: 0.1,
      waveSpeed: 2.0,
      pulseIntensity: 0.25,
      smoothRipple: true,
      cornerRadius: 0,
      animCorner: false,
      tileRotation: 0,
      floatIntensity: 0,

      // Geometry & Grid Generation
      gridSize: 32,
      gapRatio: 0.125,
      recursionDepth: 3,
      density: 1000,
      margin: 0,

      // UX & Camera Viewport
      zoom: 1.0,
      clickToRandomize: true,

      // Actions
      regenerate: () => generateScene(),
      randomize: () => randomizeAll(true),
      resetView: () => resetCamera(),
      savePNG: () => saveCanvas('roni_kaufman_602_' + Date.now(), 'png')
    };

    // Camera Pan & Zoom Transform State
    let panX = 0, panY = 0;
    let isDragging = false;
    let hasDragged = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;

    // Generated Scene Geometry Cache
    let sceneRectangles = [];
    let isRecording = false;

    let gui = null;
    let zoomController = null;

    // ============================================================
    // Setup & Initialization
    // ============================================================
    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
      noStroke();

      initGUI();
      generateScene();
    }

    // ============================================================
    // Procedural Scene Generation
    // ============================================================
    function generateScene() {
      sceneRectangles = [];
      isRecording = true;

      let margin = settings.margin;
      let availW = width - 2 * margin;
      let availH = height - 2 * margin;

      // Calculate square grid cell size u and grid dimensions M, N
      if (availW >= availH) {
        u = availH / settings.gridSize;
        N = settings.gridSize;
        M = Math.max(1, Math.round(availW / u));
      } else {
        u = availW / settings.gridSize;
        M = settings.gridSize;
        N = Math.max(1, Math.round(availH / u));
      }

      gap = u * settings.gapRatio;

      // Perfectly center grid if any subpixel remainder exists
      let totalW = M * u;
      let totalH = N * u;
      let startX = margin + (availW - totalW) / 2;
      let startY = margin + (availH - totalH) / 2;

      let iMin = 0, iMax = M, jMin = 0, jMax = N;
      let siMax = Math.min(M, N) - 1;
      let sjMax = siMax;

      let rectangles = createComposition(iMin, iMax, jMin, jMax, siMax, sjMax, settings.density);

      for (let recta of rectangles) {
        drawRectangle(recta, u, accentCol, startX, startY, 0);
        recta.depth = 0;

        let iMin1 = 4 * recta.i;
        let iMax1 = 4 * (recta.i + recta.si) - 1;
        let jMin1 = 4 * recta.j;
        let jMax1 = 4 * (recta.j + recta.sj) - 1;
        let siMax1 = 4 * recta.si - 1;
        let sjMax1 = 4 * recta.sj - 1;
        createSubcompo(iMin1, iMax1, jMin1, jMax1, siMax1, sjMax1, myWhite, startX, startY, settings.density, 1);
      }

      isRecording = false;
    }

    // creating the composition

    function createComposition(iMin, iMax, jMin, jMax, siMax, sjMax, nRects) {
      let rectangles = [];
      
      for (let i = 0; i < nRects; i++) {
        let newRecta = generateRectangle(rectangles, iMin, iMax, jMin, jMax, siMax, sjMax);
        if (newRecta.si > 1 && newRecta.sj > 1) {
          rectangles.push(newRecta);
        }
      }
      
      // fill the gaps
      for (let i = iMin; i < iMax; i++) {
        for (let j = jMin; j < jMax; j++) {
          let newRecta = {
            i: i,
            j: j,
            si: 1,
            sj: 1
          };
          let canAdd = true;
          for (let recta of rectangles) {
            if (rectanglesIntersect(newRecta, recta)) {
              canAdd = false;
              break;
            }
          }
          if (canAdd) {
            // make it as big as possible
            let s = determineSize(rectangles, i, j, iMin, iMax, jMin, jMax, siMax, sjMax);
            newRecta.si = s;
            newRecta.sj = s;
            rectangles.push(newRecta);
          }
        }
      }
      
      return rectangles;
    }

    function rectanglesIntersect(recta1, recta2) {
      return ((recta1.i <= recta2.i && recta1.i+recta1.si > recta2.i) || (recta2.i <= recta1.i && recta2.i+recta2.si > recta1.i)) && ((recta1.j <= recta2.j && recta1.j+recta1.sj > recta2.j) || (recta2.j <= recta1.j && recta2.j+recta2.sj > recta1.j));
    }

    function generateRectangle(rectangles, iMin, iMax, jMin, jMax, siMax, sjMax) {
      let i = randInt(iMin, iMax);
      let j = randInt(jMin, jMax);
      
      let s = determineSize(rectangles, i, j, iMin, iMax, jMin, jMax, siMax, sjMax);
      
      let recta = {
        i: i,
        j: j,
        si: s,
        sj: s
      };
      return recta;
    }

    function determineSize(rectangles, i, j, iMin, iMax, jMin, jMax, siMax, sjMax) {
      let si, sj;
      if (rectangles.length == 0) {
        si = min(siMax, iMax-i);
        sj = min(sjMax, jMax-j);
      } else {
        let si1 = biggestPossibleWidth(rectangles, iMax, siMax, i, j, 1, 1);
        let sj1 = biggestPossibleHeight(rectangles, jMax, sjMax, i, j, si1, 1);
        
        let sj2 = biggestPossibleHeight(rectangles, jMax, sjMax, i, j, 1, 1);
        let si2 = biggestPossibleWidth(rectangles, iMax, siMax, i, j, 1, sj2);
        
        if (min(si1, sj1) > min(si2, sj2)) {
          si = si1;
          sj = sj1;
        } else {
          si = si2;
          sj = sj2;
        }
      }
      
      let s = min(si, sj);
      return s;
    }

    function biggestPossibleWidth(rectangles, iMax, siMax, i, j, si, sj) {
      let s = si;
      let intersects = false;
      while (!intersects) {
        s++;
        for (let recta of rectangles) {
          if (i+s > iMax || s > siMax || rectanglesIntersect({i: i, j: j, si: s, sj: sj}, recta)) {
            intersects = true;
            break;
          }
        }
      }
      return s-1;
    }

    function biggestPossibleHeight(rectangles, jMax, sjMax, i, j, si, sj) {
      let s = sj;
      let intersects = false;
      while (!intersects) {
        s++;
        for (let recta of rectangles) {
          if (j+s > jMax || s > sjMax || rectanglesIntersect({i: i, j: j, si: si, sj: s}, recta)) {
            intersects = true;
            break;
          }
        }
      }
      return s-1;
    }

    // recursive part

    function createSubcompo(iMin1, iMax1, jMin1, jMax1, siMax1, sjMax1, col, xTranslate, yTranslate, nRects, depth = 1) {
      let subrectangles = createComposition(iMin1, iMax1, jMin1, jMax1, siMax1, sjMax1, nRects);
      let xSubTranslate = xTranslate + u/8;
      let ySubTranslate = yTranslate + u/8;
      for (let subrecta of subrectangles) {
        push();
        drawRectangle(subrecta, u/4, col, xSubTranslate, ySubTranslate, depth);
        if (subrecta.si > 1 && subrecta.sj > 1 && depth < settings.recursionDepth) {
          let iMin2 = subrecta.i;
          let iMax2 = iMin2 + subrecta.si - 1;
          let jMin2 = subrecta.j;
          let jMax2 = jMin2 + subrecta.sj - 1;
          let siMax2 = subrecta.si - 1;
          let sjMax2 = subrecta.sj - 1;
          let subCol = col == accentCol ? myWhite : accentCol;
          createSubcompo(iMin2, iMax2, jMin2, jMax2, siMax2, sjMax2, subCol, xSubTranslate, ySubTranslate, nRects, depth + 1);
        }
        pop();
      }
    }

    // drawing

    function drawRectangle(recta, s, col, xTranslate, yTranslate, depth = 0) {
      let x = recta.i*s + gap/2 + xTranslate, y = recta.j*s + gap/2 + yTranslate;
      let w = recta.si*s - gap, h = recta.sj*s - gap;
      let cx = x + w / 2;
      let cy = y + h / 2;
      let d = dist(cx, cy, width/2, height/2);
      let angle = atan2(cy - height/2, cx - width/2);

      if (isRecording) {
        sceneRectangles.push({
          i: recta.i,
          j: recta.j,
          si: recta.si,
          sj: recta.sj,
          s: s,
          col: col,
          xTranslate: xTranslate,
          yTranslate: yTranslate,
          x: x,
          y: y,
          w: w,
          h: h,
          cx: cx,
          cy: cy,
          d: d,
          angle: angle,
          depth: depth,
          isUnitSquare: (recta.si === 1 && recta.sj === 1),
          seed: random(1000)
        });
        return;
      }

      // fallback direct draw
      //if (d > 175) return;
      if (recta.si == 1 && recta.sj == 1 && sin(d/10) < 0) return; 
      fill(col);
      rect(x, y, w, h);
    }

    // ============================================================
    // Main 60 FPS Render Loop
    // ============================================================
    function draw() {
      let scheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      let activeBg = settings.invertColors ? scheme.accent : scheme.bg;
      let activeAccent = settings.invertColors ? scheme.bg : scheme.accent;
      let palColors = scheme.colors;

      background(activeBg);

      push();
      // Apply Camera Pan & Zoom Transformations
      translate(panX, panY);
      scale(settings.zoom);

      let t = settings.isPlaying ? (millis() * 0.001 * settings.animSpeed) : 0;
      let mouseWorldX = (mouseX - panX) / settings.zoom;
      let mouseWorldY = (mouseY - panY) / settings.zoom;

      let numRects = sceneRectangles.length;
      for (let k = 0; k < numRects; k++) {
        let item = sceneRectangles[k];

        // Base wave phase - matches Roni's sin(d/10) when animSpeed = 0 and freq = 0.1
        let phase;
        if (settings.animMode === 'Spiral Vortex') {
          phase = item.d * settings.waveFrequency + item.angle * 3.0 - t * settings.waveSpeed;
        } else if (settings.animMode === 'Mouse Ripple') {
          let dM = dist(item.cx, item.cy, mouseWorldX, mouseWorldY);
          phase = dM * settings.waveFrequency - t * settings.waveSpeed;
        } else {
          phase = item.d * settings.waveFrequency - t * settings.waveSpeed;
        }

        let waveVal = sin(phase);

        // Visibility check for 1x1 squares (Roni's signature optical ripple)
        let sFactor = 1.0;
        if (item.isUnitSquare) {
          if (settings.smoothRipple && settings.animSpeed > 0 && settings.isPlaying) {
            sFactor = constrain(map(waveVal, -0.28, 0.28, 0, 1), 0, 1);
            if (sFactor <= 0.001) continue;
          } else {
            if (waveVal < 0) continue;
          }
        }

        // Animation scale & position dynamics
        let scaleAnim = 1.0;
        let ox = 0, oy = 0;
        let rot = 0;

        if (settings.animMode === 'Concentric Waves') {
          scaleAnim = 1.0 + settings.pulseIntensity * 0.15 * sin(phase + item.depth * 0.5);
        } else if (settings.animMode === 'Breathing Grid') {
          scaleAnim = 1.0 + settings.pulseIntensity * 0.18 * sin(t * 2.2 + item.d * 0.006 + item.depth * 0.7);
        } else if (settings.animMode === 'Geometric Squircle') {
          scaleAnim = 1.0 + settings.pulseIntensity * 0.12 * sin(t * 1.8 + item.depth);
        } else if (settings.animMode === 'Kinetic Float') {
          scaleAnim = 1.0 + settings.pulseIntensity * 0.1 * sin(t * 1.5 + item.seed);
          ox = cos(t * 1.4 + item.d * 0.008 + item.depth * 1.1) * (item.depth + 1) * settings.floatIntensity;
          oy = sin(t * 1.4 + item.d * 0.008 + item.depth * 1.1) * (item.depth + 1) * settings.floatIntensity;
        } else if (settings.animMode === 'Spiral Vortex') {
          scaleAnim = 1.0 + settings.pulseIntensity * 0.16 * sin(phase + item.depth * 0.6);
        } else if (settings.animMode === 'Mouse Ripple') {
          scaleAnim = 1.0 + settings.pulseIntensity * 0.2 * sin(phase);
        }

        // Micro-rotation for small tiles
        if (settings.tileRotation > 0 && item.si <= 2 && item.sj <= 2) {
          rot = sin(t * 1.8 + item.d * 0.01 + item.depth * 0.8) * settings.tileRotation;
        }

        // Interactive Mouse Hover swell
        let dM = dist(item.cx, item.cy, mouseWorldX, mouseWorldY);
        if (dM < 240) {
          let mInfluence = (1.0 - dM / 240);
          scaleAnim *= (1.0 + mInfluence * 0.22);
        }

        // Color mapping according to active color scheme & mode
        let rectColor;
        if (settings.colorMode === 'Classic Binary') {
          rectColor = (item.col === accentCol) ? activeAccent : activeBg;
        } else if (settings.colorMode === 'Depth Hierarchy') {
          rectColor = palColors[(item.depth + (settings.invertColors ? 1 : 0)) % palColors.length];
        } else if (settings.colorMode === 'Spatial Wave') {
          let cIdx = floor(abs(item.d * 0.02 + item.depth + (settings.isPlaying ? t * 0.6 : 0))) % palColors.length;
          rectColor = palColors[cIdx];
        } else if (settings.colorMode === 'Multi-Color Mosaic') {
          let cIdx = floor(item.seed) % palColors.length;
          rectColor = palColors[cIdx];
        }

        // Corner radius (Squircle morph)
        let maxR = min(item.w, item.h) * 0.5;
        let cr = min(settings.cornerRadius, maxR);
        if (settings.animCorner && cr > 0) {
          cr *= (0.5 + 0.5 * sin(t * 1.6 + item.d * 0.008 + item.depth * 0.6));
        }

        // Draw animated rectangle
        push();
        translate(item.cx + ox, item.cy + oy);
        if (rot !== 0) rotate(rot);
        scale(scaleAnim * sFactor);
        fill(rectColor);
        rect(-item.w / 2, -item.h / 2, item.w, item.h, cr);
        pop();
      }

      pop();
    }

    // ============================================================
    // Procedural Theme & Parameter Randomizer
    // ============================================================
    function randomizeAll(updateGui = true) {
      // 1. Pick a random color scheme from all 19 curated schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = random(schemeKeys);

      // 2. Randomize color mode & inversion
      const modes = ['Classic Binary', 'Depth Hierarchy', 'Spatial Wave', 'Multi-Color Mosaic'];
      settings.colorMode = random(modes);
      settings.invertColors = random() > 0.65;

      // 3. Randomize animation dynamics
      const animModes = ['Concentric Waves', 'Breathing Grid', 'Geometric Squircle', 'Kinetic Float', 'Spiral Vortex', 'Mouse Ripple'];
      settings.animMode = random(animModes);
      settings.animSpeed = round(random(0.7, 1.8), 2);
      settings.waveFrequency = round(random(0.06, 0.16), 3);
      settings.waveSpeed = round(random(1.2, 3.2), 2);
      settings.pulseIntensity = round(random(0.12, 0.45), 2);
      settings.cornerRadius = random() > 0.4 ? round(random(4, 18)) : 0;
      settings.animCorner = random() > 0.5;
      settings.tileRotation = random() > 0.6 ? round(random(0.06, 0.28), 2) : 0;
      settings.floatIntensity = (settings.animMode === 'Kinetic Float') ? round(random(2, 8), 1) : 0;

      // 4. Randomize geometric resolution
      settings.gridSize = floor(random(24, 38));
      settings.gapRatio = round(random(0.06, 0.16), 3);
      settings.recursionDepth = floor(random(2, 4));

      // 5. Re-generate the entire scene
      generateScene();

      // 6. Synchronize lil-gui controls
      if (updateGui && gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetCamera() {
      panX = 0;
      panY = 0;
      settings.zoom = 1.0;
      if (zoomController) zoomController.updateDisplay();
    }

    // ============================================================
    // Viewport Resize & Window Event Handling
    // ============================================================
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      generateScene();
    }

    // ============================================================
    // Mouse Drag, Pan, Zoom & Click-to-Randomize Interaction
    // ============================================================
    function mouseWheel(event) {
      if (!event) return;
      let zoomFactor = event.deltaY < 0 ? 1.08 : 0.92;
      let oldZoom = settings.zoom;
      let newZoom = constrain(oldZoom * zoomFactor, 0.2, 10.0);

      // Smooth zoom centered towards mouse cursor
      let mouseWorldX = (mouseX - panX) / oldZoom;
      let mouseWorldY = (mouseY - panY) / oldZoom;

      panX = mouseX - mouseWorldX * newZoom;
      panY = mouseY - mouseWorldY * newZoom;
      settings.zoom = newZoom;

      if (zoomController) zoomController.updateDisplay();
      return false; // Prevent standard page scroll
    }

    function mousePressed(event) {
      // Ignore clicks originating inside GUI controls
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      isDragging = true;
      hasDragged = false;
      dragStartX = mouseX;
      dragStartY = mouseY;
      startPanX = panX;
      startPanY = panY;
    }

    function mouseDragged(event) {
      if (!isDragging) return;
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      let dx = mouseX - dragStartX;
      let dy = mouseY - dragStartY;
      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
        document.body.style.cursor = 'grabbing';
      }
      panX = startPanX + dx;
      panY = startPanY + dy;
    }

    function mouseReleased(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        isDragging = false;
        return;
      }
      document.body.style.cursor = 'grab';
      // If the user clicked without dragging, trigger randomization
      if (isDragging && !hasDragged) {
        if (settings.clickToRandomize) {
          randomizeAll(true);
        }
      }
      isDragging = false;
    }

    // Touch support for mobile / tablet devices
    function touchStarted(event) {
      if (touches && touches.length === 1) {
        mousePressed(event);
      }
      return true;
    }

    function touchMoved(event) {
      if (touches && touches.length === 1) {
        mouseDragged(event);
      }
      return false;
    }

    function touchEnded(event) {
      mouseReleased(event);
      return false;
    }

    // Spacebar to reseed/regenerate
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        randomizeAll(true);
        e.preventDefault();
      }
    });

    // ============================================================
    // Interactive lil-gui Setup
    // ============================================================
    function initGUI() {
      if (typeof lil === 'undefined' || !lil.GUI) return;
      gui = new lil.GUI({ title: 'Recursive Subdivisions' });

      // Color Schemes Folder
      const fColor = gui.addFolder('Palette & Color Schemes');
      fColor.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme');
      fColor.add(settings, 'colorMode', ['Classic Binary', 'Depth Hierarchy', 'Spatial Wave', 'Multi-Color Mosaic']).name('Color Mode');
      fColor.add(settings, 'invertColors').name('Invert Colors');

      // Animation & Motion Folder
      const fAnim = gui.addFolder('Animation & Dynamics');
      fAnim.add(settings, 'isPlaying').name('Play Animation');
      fAnim.add(settings, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      fAnim.add(settings, 'animMode', ['Concentric Waves', 'Breathing Grid', 'Geometric Squircle', 'Kinetic Float', 'Spiral Vortex', 'Mouse Ripple']).name('Motion Mode');
      fAnim.add(settings, 'waveFrequency', 0.02, 0.25, 0.005).name('Wave Frequency');
      fAnim.add(settings, 'waveSpeed', 0.5, 5.0, 0.1).name('Wave Speed');
      fAnim.add(settings, 'pulseIntensity', 0.0, 1.0, 0.02).name('Pulse Scale');
      fAnim.add(settings, 'smoothRipple').name('Smooth Wave Ripple');
      fAnim.add(settings, 'cornerRadius', 0, 24, 0.5).name('Corner Radius');
      fAnim.add(settings, 'animCorner').name('Morph Squircle');
      fAnim.add(settings, 'tileRotation', 0.0, 0.5, 0.01).name('Tile Spin');
      fAnim.add(settings, 'floatIntensity', 0.0, 12.0, 0.5).name('Float Parallax');

      // Geometry & Grid Folder
      const fGeom = gui.addFolder('Grid & Geometry');
      fGeom.add(settings, 'gridSize', 16, 48, 2).name('Grid Base Size').onChange(() => generateScene());
      fGeom.add(settings, 'gapRatio', 0.0, 0.35, 0.005).name('Gap Spacing').onChange(() => generateScene());
      fGeom.add(settings, 'recursionDepth', 1, 4, 1).name('Subdivision Depth').onChange(() => generateScene());
      fGeom.add(settings, 'margin', 0, 60, 5).name('Canvas Margin').onChange(() => generateScene());

      // Viewport & Interaction Folder
      const fView = gui.addFolder('Viewport & Camera');
      zoomController = fView.add(settings, 'zoom', 0.2, 5.0, 0.05).name('Zoom Level').listen();
      fView.add(settings, 'resetView').name('Reset Camera');
      fView.add(settings, 'clickToRandomize').name('Click to Randomize');
      fView.add(settings, 'regenerate').name('Re-roll Scene');
      fView.add(settings, 'randomize').name('Random Metamorphosis');
      fView.add(settings, 'savePNG').name('Save Image (PNG)');

      // Default folders open
      fColor.open();
      fAnim.open();
    }
  </script>
</body>
</html>
