<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Multi Holo Background</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
<script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
    import GUI from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";

    // ============================================================
    // Main scene parameters
    // ============================================================

    const params = {
        // Camera & Interaction
        cameraFov: 3.53,
        cameraHeight: 2.0,
        cameraDistance: -7.4,
        targetHeight: 0.25,
        targetDistance: 2.2,
        dragX: 0.0,
        dragY: 0.0,
        zoomOffset: 0.0,

        // Animation
        animationPreset: "Cosmic Glide",
        animationSpeed: -0.05,
        pauseAnimation: false,

        // Green Screen Background
        greenScreen: false,

        // Color Presets & Schemes
        colorScheme: "Cyber Neon",

        // Geometry
        landscapeScale: -0.09,
        landscapeHeight: 5.65,
        landscapeSlope: 0.86,

        fractalScale: -0.19,
        fractalVertical: 2.72,
        fractalThickness: 0.092,
        surfaceBand: 0.27,
        lateralWarpX: -0.06,
        lateralWarpZ: -0.43,

        // Material
        glowStrength: 0.002,
        outerGlowStrength: 0.085,
        baseGlow: -0.0118,

        // Exact original HDR tint multipliers
        coreTintR: 1.4,
        coreTintG: 2.1,
        coreTintB: 2.3,

        outerTintR: 0.8,
        outerTintG: 0.2,
        outerTintB: 0.9,

        // Color grading multipliers
        coreColor: "#00f0ff",
        outerColor: "#ff007f",

        // Post processing
        exposure: 3.02,
        toneCompression: 0.38,
        vignetteStrength: 0.34,
        gamma: 2.2,

        // Performance
        marchSteps: 71,
        maxDistance: 17.3,
        minStep: 0.014,
        stepScale: 1.07,
        maxStep: 0.79,

        dpr: window.devicePixelRatio || 1.0
    };

    // ============================================================
    // Renderer
    // ============================================================

    const renderer = new THREE.WebGLRenderer({
        antialias: false,
        alpha: false,
        depth: false,
        stencil: false,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(params.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(0x000000, 1);

    // The shader performs its own gamma conversion.
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    document.body.appendChild(renderer.domElement);

    // ============================================================
    // Scene
    // ============================================================

    const scene = new THREE.Scene();
    const camera = new THREE.Camera();

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            new Float32Array([
                -1.0, -1.0, 0.0,
                 3.0, -1.0, 0.0,
                -1.0,  3.0, 0.0
            ]),
            3
        )
    );

    // ============================================================
    // Color helpers
    // ============================================================

    const temporaryColor = new THREE.Color();

    function getRawColor(hexColor) {
        temporaryColor.setStyle(hexColor);

        return new THREE.Vector3(
            temporaryColor.r,
            temporaryColor.g,
            temporaryColor.b
        );
    }

    // ============================================================
    // Uniforms
    // ============================================================

    const uniforms = {
        uTime: {
            value: 0
        },

        uResolution: {
            value: new THREE.Vector2()
        },

        uCameraFov: {
            value: params.cameraFov
        },

        uCameraHeight: {
            value: params.cameraHeight
        },

        uCameraDistance: {
            value: params.cameraDistance
        },

        uTargetHeight: {
            value: params.targetHeight
        },

        uTargetDistance: {
            value: params.targetDistance
        },

        uDragOffset: {
            value: new THREE.Vector2(0.0, 0.0)
        },

        uZoomOffset: {
            value: 0.0
        },

        uGreenScreen: {
            value: 0.0
        },

        uAnimationSpeed: {
            value: params.animationSpeed
        },

        uLandscapeScale: {
            value: params.landscapeScale
        },

        uLandscapeHeight: {
            value: params.landscapeHeight
        },

        uLandscapeSlope: {
            value: params.landscapeSlope
        },

        uFractalScale: {
            value: params.fractalScale
        },

        uFractalVertical: {
            value: params.fractalVertical
        },

        uFractalThickness: {
            value: params.fractalThickness
        },

        uSurfaceBand: {
            value: params.surfaceBand
        },

        uLateralWarpX: {
            value: params.lateralWarpX
        },

        uLateralWarpZ: {
            value: params.lateralWarpZ
        },

        uGlowStrength: {
            value: params.glowStrength
        },

        uOuterGlowStrength: {
            value: params.outerGlowStrength
        },

        uBaseGlow: {
            value: params.baseGlow
        },

        uCoreTint: {
            value: new THREE.Vector3(
                params.coreTintR,
                params.coreTintG,
                params.coreTintB
            )
        },

        uOuterTint: {
            value: new THREE.Vector3(
                params.outerTintR,
                params.outerTintG,
                params.outerTintB
            )
        },

        uCoreColor: {
            value: getRawColor(params.coreColor)
        },

        uOuterColor: {
            value: getRawColor(params.outerColor)
        },

        uExposure: {
            value: params.exposure
        },

        uToneCompression: {
            value: params.toneCompression
        },

        uVignetteStrength: {
            value: params.vignetteStrength
        },

        uGamma: {
            value: params.gamma
        },

        uMarchSteps: {
            value: params.marchSteps
        },

        uMaxDistance: {
            value: params.maxDistance
        },

        uMinStep: {
            value: params.minStep
        },

        uStepScale: {
            value: params.stepScale
        },

        uMaxStep: {
            value: params.maxStep
        }
    };

    // ============================================================
    // Vertex shader
    // ============================================================

    const vertexShader = `
        precision highp float;

        attribute vec3 position;

        void main()
        {
            gl_Position = vec4(position, 1.0);
        }
    `;

    // ============================================================
    // Fragment shader
    // ============================================================

    const fragmentShader = `
        precision highp float;
        precision highp int;

        uniform float uTime;
        uniform vec2 uResolution;

        uniform float uCameraFov;
        uniform float uCameraHeight;
        uniform float uCameraDistance;
        uniform float uTargetHeight;
        uniform float uTargetDistance;

        uniform vec2 uDragOffset;
        uniform float uZoomOffset;
        uniform float uGreenScreen;

        uniform float uAnimationSpeed;

        uniform float uLandscapeScale;
        uniform float uLandscapeHeight;
        uniform float uLandscapeSlope;

        uniform float uFractalScale;
        uniform float uFractalVertical;
        uniform float uFractalThickness;
        uniform float uSurfaceBand;
        uniform float uLateralWarpX;
        uniform float uLateralWarpZ;

        uniform float uGlowStrength;
        uniform float uOuterGlowStrength;
        uniform float uBaseGlow;

        uniform vec3 uCoreTint;
        uniform vec3 uOuterTint;
        uniform vec3 uCoreColor;
        uniform vec3 uOuterColor;

        uniform float uExposure;
        uniform float uToneCompression;
        uniform float uVignetteStrength;
        uniform float uGamma;

        uniform int uMarchSteps;
        uniform float uMaxDistance;
        uniform float uMinStep;
        uniform float uStepScale;
        uniform float uMaxStep;

        const float PI = 3.14159265359;
        const float TAU = 6.28318530718;

        const int MAX_MARCH_STEPS = 128;

        float saturate(float value)
        {
            return clamp(value, 0.0, 1.0);
        }

        vec3 safeNormalize(vec3 value)
        {
            return value * inversesqrt(
                max(dot(value, value), 1e-8)
            );
        }

        void rotatePlane(inout vec2 position, float angle)
        {
            float sineAngle = sin(angle);
            float cosineAngle = cos(angle);

            position =
                cosineAngle * position +
                sineAngle * vec2(
                    position.y,
                    -position.x
                );
        }

        float smoothMaximum(
            float firstValue,
            float secondValue,
            float radius
        )
        {
            vec2 offset = max(
                vec2(
                    radius + firstValue,
                    radius + secondValue
                ),
                vec2(0.0)
            );

            return
                min(
                    -radius,
                    max(firstValue, secondValue)
                ) +
                length(offset);
        }

        vec3 palette(
            float value,
            vec3 offset,
            vec3 amplitude,
            vec3 frequency,
            vec3 phase
        )
        {
            return
                offset +
                amplitude *
                cos(
                    TAU *
                    (
                        frequency * value +
                        phase
                    )
                );
        }

        vec3 spectrum(float value)
        {
            return palette(
                value,
                vec3(0.5),
                vec3(0.5),
                vec3(1.0),
                vec3(0.0, 0.33, 0.67)
            );
        }

        float landscapeHeight(vec2 position)
        {
            vec2 p =
                position * uLandscapeScale;

            float broadWave =
                sin(
                    p.x * 0.74 +
                    sin(p.y * 0.31) * 0.55
                );

            float crossingWave =
                sin(
                    p.y * 0.53 -
                    sin(p.x * 0.27) * 0.48
                );

            float diagonalWave =
                sin(
                    p.x * 0.31 +
                    p.y * 0.38 +
                    sin(
                        p.x * 0.16 -
                        p.y * 0.19
                    ) * 0.65
                );

            float smallWave =
                sin(
                    p.x * 1.17 -
                    p.y * 0.83
                ) *
                sin(
                    p.y * 0.47 +
                    p.x * 0.22
                );

            float height =
                broadWave * 0.47 +
                crossingWave * 0.32 +
                diagonalWave * 0.18 +
                smallWave * 0.055;

            return height * uLandscapeHeight;
        }

        vec4 inverseStereographic(
            vec3 position,
            out float scaleFactor
        )
        {
            float denominator = max(
                1.0 + dot(position, position),
                1e-5
            );

            scaleFactor =
                2.0 / denominator;

            return vec4(
                scaleFactor * position,
                scaleFactor - 1.5
            );
        }

        float cliffordTorus(vec4 position)
        {
            float lengthXY = max(
                length(position.xy),
                1e-5
            );

            float lengthZW = max(
                length(position.zw),
                1e-5
            );

            float firstDistance =
                lengthXY / lengthZW -
                1.0;

            float secondDistance =
                lengthZW / lengthXY -
                1.0;

            float distanceValue =
                firstDistance < 0.0
                    ? -firstDistance
                    : secondDistance;

            return distanceValue / PI;
        }

        float correctStereographicDistance(
            float distanceValue,
            float scaleFactor
        )
        {
            float distanceSign =
                distanceValue < 0.0
                    ? -1.0
                    : 1.0;

            float absoluteDistance =
                abs(distanceValue);

            absoluteDistance =
                absoluteDistance /
                max(scaleFactor, 1e-5) *
                1.78;

            absoluteDistance =
                sqrt(
                    max(
                        absoluteDistance + 1.0,
                        0.0
                    )
                ) -
                1.0;

            return
                absoluteDistance *
                (5.0 / 3.0) *
                distanceSign;
        }

        float fractalLandscapeMap(
            vec3 worldPosition,
            float animationTime,
            out float terrainHeight,
            out float surfaceOffset
        )
        {
            terrainHeight =
                landscapeHeight(
                    worldPosition.xz
                );

            surfaceOffset =
                worldPosition.y -
                terrainHeight;

            vec3 fractalPosition;

            fractalPosition.x =
                worldPosition.x *
                uFractalScale;

            fractalPosition.y =
                surfaceOffset *
                uFractalVertical;

            fractalPosition.z =
                worldPosition.z *
                uFractalScale;

            fractalPosition.x +=
                sin(
                    worldPosition.z *
                    3.985
                ) *
                uLateralWarpX;

            fractalPosition.z +=
                sin(
                    worldPosition.x *
                    -0.397
                ) *
                uLateralWarpZ;

            float stereographicScale;

            vec4 position4D =
                inverseStereographic(
                    fractalPosition,
                    stereographicScale
                );

            float rotation =
                animationTime *
                -PI;

            rotatePlane(
                position4D.zy,
                rotation
            );

            rotatePlane(
                position4D.xw,
                rotation
            );

            float fractalDistance =
                cliffordTorus(position4D);

            fractalDistance =
                abs(fractalDistance) -
                uFractalThickness;

            fractalDistance =
                correctStereographicDistance(
                    fractalDistance,
                    stereographicScale
                );

            float landscapeLayer =
                abs(surfaceOffset) -
                uSurfaceBand;

            return smoothMaximum(
                fractalDistance,
                landscapeLayer,
                0.04
            );
        }

        mat3 createCameraMatrix(
            vec3 cameraPosition,
            vec3 cameraTarget
        )
        {
            vec3 forward =
                safeNormalize(
                    cameraTarget -
                    cameraPosition
                );

            vec3 right =
                safeNormalize(
                    cross(
                        forward,
                        vec3(0.0, 1.0, 0.0)
                    )
                );

            vec3 up =
                safeNormalize(
                    cross(right, forward)
                );

            return mat3(
                right,
                up,
                forward
            );
        }

        vec3 renderScene(
            vec3 rayOrigin,
            vec3 rayDirection,
            float animationTime
        )
        {
            float rayLength = 0.0;
            float previousDistance = 0.1;

            vec3 accumulatedColor =
                vec3(0.0);

            for (
                int stepIndex = 0;
                stepIndex < MAX_MARCH_STEPS;
                stepIndex++
            )
            {
                if (stepIndex >= uMarchSteps)
                {
                    break;
                }

                vec3 rayPosition =
                    rayOrigin +
                    rayDirection *
                    rayLength;

                float terrainHeight;
                float surfaceOffset;

                float distanceValue =
                    fractalLandscapeMap(
                        rayPosition,
                        animationTime,
                        terrainHeight,
                        surfaceOffset
                    );

                float absoluteDistance =
                    abs(distanceValue);

                float surfaceProximity =
                    exp(
                        -abs(surfaceOffset) *
                        3.64
                    );

                float coreGlow =
                    exp(
                        -absoluteDistance *
                        46.0
                    );

                float outerGlow =
                    exp(
                        -absoluteDistance *
                        10.5
                    );

                float distanceFade =
                    saturate(
                        1.0 -
                        rayLength /
                        uMaxDistance
                    );

                float palettePosition =
                    distanceFade * 6.0 -
                    0.6 +
                    rayPosition.x * 0.025 -
                    rayPosition.z * 0.018;

                vec3 spectralColor =
                    spectrum(
                        palettePosition
                    );

                // Exact HDR color calculations
                vec3 coreHDRTint =
                    uCoreTint *
                    uCoreColor;

                vec3 outerHDRTint =
                    uOuterTint *
                    uOuterColor;

                vec3 stepColor =
                    coreGlow *
                    coreHDRTint *
                    spectralColor *
                    uGlowStrength;

                stepColor +=
                    outerGlow *
                    outerHDRTint *
                    spectralColor *
                    uOuterGlowStrength;

                stepColor +=
                    outerHDRTint *
                    uBaseGlow *
                    surfaceProximity;

                stepColor *=
                    distanceFade *
                    surfaceProximity;

                accumulatedColor +=
                    stepColor;

                float marchDistance =
                    min(
                        absoluteDistance,
                        abs(surfaceOffset) *
                        uLandscapeSlope +
                        0.095
                    );

                float stepLength =
                    max(
                        uMinStep,
                        marchDistance *
                        uStepScale
                    );

                stepLength =
                    min(
                        stepLength,
                        uMaxStep
                    );

                if (
                    surfaceOffset <
                        -uSurfaceBand * 1.15 &&
                    previousDistance < 0.12
                )
                {
                    break;
                }

                previousDistance =
                    absoluteDistance;

                rayLength +=
                    stepLength;

                if (
                    rayLength >
                    uMaxDistance
                )
                {
                    break;
                }
            }

            return accumulatedColor;
        }

        vec3 postProcess(
            vec3 color,
            vec2 uv
        )
        {
            color *= uExposure;

            color =
                color /
                (
                    1.0 +
                    color *
                    uToneCompression
                );

            float vignette =
                1.0 -
                dot(
                    uv *
                    uVignetteStrength,
                    uv *
                    uVignetteStrength
                );

            color *=
                saturate(vignette);

            color =
                pow(
                    max(
                        color,
                        vec3(0.0)
                    ),
                    vec3(
                        1.0 /
                        max(uGamma, 0.001)
                    )
                );

            return color;
        }

        void main()
        {
            vec2 uv =
                (
                    2.0 *
                    gl_FragCoord.xy -
                    uResolution.xy
                ) /
                max(
                    uResolution.y,
                    1.0
                );

            float animationTime =
                mod(
                    uTime *
                    uAnimationSpeed,
                    1.0
                );

            // Integrate Drag and Zoom interaction offsets
            vec3 cameraPosition =
                vec3(
                    uDragOffset.x,
                    uCameraHeight + uDragOffset.y,
                    uCameraDistance + uZoomOffset
                );

            cameraPosition.y +=
                landscapeHeight(
                    cameraPosition.xz
                ) *
                0.12;

            vec3 cameraTarget =
                vec3(
                    uDragOffset.x * 0.8,
                    uTargetHeight + uDragOffset.y * 0.8,
                    uTargetDistance + uZoomOffset
                );

            cameraTarget.y +=
                landscapeHeight(
                    cameraTarget.xz
                ) *
                0.35;

            mat3 cameraMatrix =
                createCameraMatrix(
                    cameraPosition,
                    cameraTarget
                );

            vec3 rayDirection =
                safeNormalize(
                    cameraMatrix *
                    vec3(
                        uv,
                        uCameraFov
                    )
                );

            vec3 color =
                renderScene(
                    cameraPosition,
                    rayDirection,
                    animationTime
                );

            color =
                postProcess(
                    color,
                    uv
                );

            // Green Screen background replacement (#00ff00)
            if (uGreenScreen > 0.5)
            {
                float luminance = saturate(dot(color, vec3(0.299, 0.587, 0.114)) * 3.0);
                vec3 greenBackground = vec3(0.0, 1.0, 0.0);
                color = mix(greenBackground, color, luminance);
            }

            gl_FragColor =
                vec4(color, 1.0);
        }
    `;

    // ============================================================
    // Material
    // ============================================================

    const material = new THREE.RawShaderMaterial({
        uniforms,
        vertexShader,
        fragmentShader,
        depthTest: false,
        depthWrite: false,
        transparent: false
    });

    const fullscreenTriangle = new THREE.Mesh(
        geometry,
        material
    );

    fullscreenTriangle.frustumCulled = false;

    scene.add(fullscreenTriangle);

    // ============================================================
    // Color Schemes (5 Presets)
    // ============================================================

    const colorSchemes = {
        "Cyber Neon": {
            coreColor: "#00f0ff",
            outerColor: "#ff007f",
            coreTintR: 1.4, coreTintG: 2.1, coreTintB: 2.3,
            outerTintR: 0.8, outerTintG: 0.2, outerTintB: 0.9
        },
        "Gold Obsidian": {
            coreColor: "#ffaa00",
            outerColor: "#ff3300",
            coreTintR: 2.5, coreTintG: 1.8, coreTintB: 0.5,
            outerTintR: 1.5, outerTintG: 0.3, outerTintB: 0.1
        },
        "Emerald Matrix": {
            coreColor: "#00ff99",
            outerColor: "#0088ff",
            coreTintR: 0.5, coreTintG: 2.5, coreTintB: 1.2,
            outerTintR: 0.1, outerTintG: 0.8, outerTintB: 1.8
        },
        "Amethyst Nebula": {
            coreColor: "#e066ff",
            outerColor: "#330066",
            coreTintR: 2.0, coreTintG: 0.8, coreTintB: 2.5,
            outerTintR: 0.9, outerTintG: 0.1, outerTintB: 1.5
        },
        "Monochrome Horizon": {
            coreColor: "#ffffff",
            outerColor: "#7090b0",
            coreTintR: 2.0, coreTintG: 2.2, coreTintB: 2.4,
            outerTintR: 0.7, outerTintG: 0.9, outerTintB: 1.2
        }
    };

    function applyColorScheme(schemeName) {
        const scheme = colorSchemes[schemeName];
        if (!scheme) return;

        params.colorScheme = schemeName;
        params.coreColor = scheme.coreColor;
        params.outerColor = scheme.outerColor;
        params.coreTintR = scheme.coreTintR;
        params.coreTintG = scheme.coreTintG;
        params.coreTintB = scheme.coreTintB;
        params.outerTintR = scheme.outerTintR;
        params.outerTintG = scheme.outerTintG;
        params.outerTintB = scheme.outerTintB;

        uniforms.uCoreColor.value.copy(getRawColor(params.coreColor));
        uniforms.uOuterColor.value.copy(getRawColor(params.outerColor));
        updateCoreTint();
        updateOuterTint();

        gui.controllersRecursive().forEach((controller) => {
            controller.updateDisplay();
        });
    }

    // ============================================================
    // GUI helpers
    // ============================================================

    function bindUniform(
        folder,
        parameterName,
        uniformName,
        minimum,
        maximum,
        step,
        label
    ) {
        return folder
            .add(
                params,
                parameterName,
                minimum,
                maximum,
                step
            )
            .name(label)
            .onChange((value) => {
                uniforms[uniformName].value =
                    value;
            });
    }

    function updateCoreTint() {
        uniforms.uCoreTint.value.set(
            params.coreTintR,
            params.coreTintG,
            params.coreTintB
        );
    }

    function updateOuterTint() {
        uniforms.uOuterTint.value.set(
            params.outerTintR,
            params.outerTintG,
            params.outerTintB
        );
    }

    // ============================================================
    // lil-gui
    // ============================================================

    const gui = new GUI({
        title: "Holo Control Settings"
    });

    // Background & Green Screen Folder
    const backgroundFolder = gui.addFolder("Background");
    backgroundFolder
        .add(params, "greenScreen")
        .name("Green Screen (#00ff00)")
        .onChange((value) => {
            uniforms.uGreenScreen.value = value ? 1.0 : 0.0;
        });

    // Camera Folder
    const cameraFolder = gui.addFolder("Camera & Navigation");

    bindUniform(
        cameraFolder,
        "cameraFov",
        "uCameraFov",
        1.5,
        7.0,
        0.01,
        "FOV"
    );

    bindUniform(
        cameraFolder,
        "cameraHeight",
        "uCameraHeight",
        -2.0,
        8.0,
        0.01,
        "Height"
    );

    bindUniform(
        cameraFolder,
        "cameraDistance",
        "uCameraDistance",
        -16.0,
        2.0,
        0.01,
        "Distance"
    );

    bindUniform(
        cameraFolder,
        "targetHeight",
        "uTargetHeight",
        -4.0,
        5.0,
        0.01,
        "Target Height"
    );

    bindUniform(
        cameraFolder,
        "targetDistance",
        "uTargetDistance",
        -4.0,
        12.0,
        0.01,
        "Target Distance"
    );

    // Animation Folder
    const animationFolder = gui.addFolder("Animation");

    animationFolder
        .add(
            params,
            "animationPreset",
            [
                "Cosmic Glide",
                "Static Horizon",
                "Orbital Survey",
                "Deep Dive",
                "Serene Waves"
            ]
        )
        .name("Preset")
        .onChange(() => {
            // Preset updates smoothly inside the animation loop
        });

    bindUniform(
        animationFolder,
        "animationSpeed",
        "uAnimationSpeed",
        -0.5,
        0.5,
        0.001,
        "Speed"
    );

    animationFolder
        .add(params, "pauseAnimation")
        .name("Pause");

    // Colors & Presets Folder
    const colorsFolder = gui.addFolder("Color Schemes");

    colorsFolder
        .add(
            params,
            "colorScheme",
            [
                "Cyber Neon",
                "Gold Obsidian",
                "Emerald Matrix",
                "Amethyst Nebula",
                "Monochrome Horizon"
            ]
        )
        .name("Preset Schemes")
        .onChange((value) => {
            applyColorScheme(value);
        });

    colorsFolder
        .addColor(params, "coreColor")
        .name("Core Color")
        .onChange((value) => {
            uniforms.uCoreColor.value.copy(
                getRawColor(value)
            );
        });

    colorsFolder
        .addColor(params, "outerColor")
        .name("Outer Color")
        .onChange((value) => {
            uniforms.uOuterColor.value.copy(
                getRawColor(value)
            );
        });

    // Geometry Folder
    const geometryFolder = gui.addFolder("Geometry");

    bindUniform(
        geometryFolder,
        "landscapeScale",
        "uLandscapeScale",
        -0.5,
        0.5,
        0.001,
        "Landscape Scale"
    );

    bindUniform(
        geometryFolder,
        "landscapeHeight",
        "uLandscapeHeight",
        0.0,
        12.0,
        0.01,
        "Landscape Height"
    );

    bindUniform(
        geometryFolder,
        "landscapeSlope",
        "uLandscapeSlope",
        0.05,
        2.0,
        0.01,
        "Landscape Slope"
    );

    bindUniform(
        geometryFolder,
        "fractalScale",
        "uFractalScale",
        -0.8,
        0.8,
        0.001,
        "Fractal Scale"
    );

    bindUniform(
        geometryFolder,
        "fractalVertical",
        "uFractalVertical",
        0.1,
        8.0,
        0.01,
        "Vertical Scale"
    );

    bindUniform(
        geometryFolder,
        "fractalThickness",
        "uFractalThickness",
        0.005,
        0.3,
        0.001,
        "Thickness"
    );

    bindUniform(
        geometryFolder,
        "surfaceBand",
        "uSurfaceBand",
        0.02,
        1.0,
        0.001,
        "Surface Band"
    );

    bindUniform(
        geometryFolder,
        "lateralWarpX",
        "uLateralWarpX",
        -1.0,
        1.0,
        0.001,
        "Warp X"
    );

    bindUniform(
        geometryFolder,
        "lateralWarpZ",
        "uLateralWarpZ",
        -1.0,
        1.0,
        0.001,
        "Warp Z"
    );

    // Material Folder
    const materialFolder = gui.addFolder("Material Glow");

    bindUniform(
        materialFolder,
        "glowStrength",
        "uGlowStrength",
        0.0,
        0.02,
        0.0001,
        "Core Glow"
    );

    bindUniform(
        materialFolder,
        "outerGlowStrength",
        "uOuterGlowStrength",
        0.0,
        0.3,
        0.001,
        "Outer Glow"
    );

    bindUniform(
        materialFolder,
        "baseGlow",
        "uBaseGlow",
        -0.1,
        0.1,
        0.0001,
        "Base Glow"
    );

    // Post Processing Folder
    const postFolder = gui.addFolder("Post Processing");

    bindUniform(
        postFolder,
        "exposure",
        "uExposure",
        0.1,
        8.0,
        0.01,
        "Exposure"
    );

    bindUniform(
        postFolder,
        "toneCompression",
        "uToneCompression",
        0.0,
        2.0,
        0.01,
        "Tone Compression"
    );

    bindUniform(
        postFolder,
        "vignetteStrength",
        "uVignetteStrength",
        0.0,
        1.0,
        0.01,
        "Vignette"
    );

    bindUniform(
        postFolder,
        "gamma",
        "uGamma",
        1.0,
        3.0,
        0.01,
        "Gamma"
    );

    // Performance & DPR Folder
    const performanceFolder = gui.addFolder("Performance & Settings");

    performanceFolder
        .add(
            params,
            "marchSteps",
            24,
            128,
            1
        )
        .name("March Steps")
        .onChange((value) => {
            uniforms.uMarchSteps.value =
                Math.round(value);
        });

    bindUniform(
        performanceFolder,
        "maxDistance",
        "uMaxDistance",
        4.0,
        35.0,
        0.1,
        "Max Distance"
    );

    performanceFolder
        .add(params, "dpr", 0.5, 2.5, 0.1)
        .name("Pixel Ratio (DPR)")
        .onChange(() => {
            resize();
        });

    gui.close();

    // Initialize initial color scheme
    applyColorScheme("Cyber Neon");

    // ============================================================
    // Navigation Interaction (Drag & Scroll Wheel Zoom)
    // ============================================================

    let isDragging = false;
    let previousPointerX = 0;
    let previousPointerY = 0;

    window.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".lil-gui")) return;
        isDragging = true;
        previousPointerX = e.clientX;
        previousPointerY = e.clientY;
    });

    window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousPointerX;
        const deltaY = e.clientY - previousPointerY;
        previousPointerX = e.clientX;
        previousPointerY = e.clientY;

        params.dragX += deltaX * 0.008;
        params.dragY -= deltaY * 0.008;

        uniforms.uDragOffset.value.set(params.dragX, params.dragY);
    });

    window.addEventListener("pointerup", () => {
        isDragging = false;
    });

    window.addEventListener("pointercancel", () => {
        isDragging = false;
    });

    window.addEventListener("wheel", (e) => {
        params.zoomOffset += e.deltaY * 0.005;
        params.zoomOffset = Math.clamp
            ? Math.clamp(params.zoomOffset, -15.0, 15.0)
            : Math.min(Math.max(params.zoomOffset, -15.0), 15.0);

        uniforms.uZoomOffset.value = params.zoomOffset;
    }, { passive: true });

    // ============================================================
    // Toggle UI Visibility with "H" key
    // ============================================================

    window.addEventListener("keydown", (e) => {
        if (e.code === "KeyH" || e.key === "h" || e.key === "H") {
            if (gui.domElement.style.display === "none") {
                gui.show();
            } else {
                gui.hide();
            }
        }
    });

    // ============================================================
    // Resize
    // ============================================================

    function resize() {
        const width =
            window.innerWidth;

        const height =
            window.innerHeight;

        renderer.setPixelRatio(
            params.dpr
        );

        renderer.setSize(
            width,
            height,
            false
        );

        const drawingBufferSize =
            renderer.getDrawingBufferSize(
                uniforms.uResolution.value
            );

        uniforms.uResolution.value.copy(
            drawingBufferSize
        );
    }

    window.addEventListener(
        "resize",
        resize,
        {
            passive: true
        }
    );

    // ============================================================
    // Visibility
    // ============================================================

    let pageVisible =
        !document.hidden;

    document.addEventListener(
        "visibilitychange",
        () => {
            pageVisible =
                !document.hidden;

            previousTimestamp =
                performance.now();
        }
    );

    // ============================================================
    // Animation Loop
    // ============================================================

    let elapsedTime = 0;
    let previousTimestamp =
        performance.now();

    function animate(timestamp) {
        requestAnimationFrame(animate);

        const deltaTime = Math.min(
            Math.max(
                (
                    timestamp -
                    previousTimestamp
                ) *
                0.001,
                0.0
            ),
            0.05
        );

        previousTimestamp =
            timestamp;

        if (!pageVisible) {
            return;
        }

        // Handle animation presets
        if (!params.pauseAnimation) {
            if (params.animationPreset === "Static Horizon") {
                // Static: camera position stays fixed
            } else if (params.animationPreset === "Orbital Survey") {
                elapsedTime += deltaTime;
                const orbitAngle = elapsedTime * 0.2;
                uniforms.uDragOffset.value.set(
                    params.dragX + Math.sin(orbitAngle) * 1.5,
                    params.dragY + Math.cos(orbitAngle * 0.7) * 0.4
                );
            } else if (params.animationPreset === "Deep Dive") {
                elapsedTime += deltaTime;
                const altitudeSine = Math.sin(elapsedTime * 0.4) * 0.8;
                uniforms.uDragOffset.value.set(
                    params.dragX,
                    params.dragY + altitudeSine
                );
            } else if (params.animationPreset === "Serene Waves") {
                elapsedTime += deltaTime;
                const waveScale = params.landscapeHeight + Math.sin(elapsedTime * 0.6) * 0.8;
                uniforms.uLandscapeHeight.value = waveScale;
            } else {
                // Cosmic Glide (Default)
                elapsedTime += deltaTime;
            }
        }

        uniforms.uTime.value =
            elapsedTime;

        renderer.render(
            scene,
            camera
        );
    }

    resize();
    requestAnimationFrame(animate);

    // ============================================================
    // Cleanup
    // ============================================================

    window.addEventListener(
        "beforeunload",
        () => {
            geometry.dispose();
            material.dispose();
            renderer.dispose();
            gui.destroy();
        }
    );
</script>
</body>
</html>
