      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    }

    initRenderer();

    scene = new THREE.Scene();
    scene.background = new THREE.Color(params.greenscreen ? '#00ff00' : params.backgroundColor);

    // Frame composition:
    // Base of flame is at y = 0. Flame reaches y ~ 2.6 (center of view).
    // Target at (0, 1.4, 0), Camera at (0, 1.4, 5.2)
    const DEFAULT_TARGET = new THREE.Vector3(0, 1.4, 0);
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 1.4, 5.2);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.copy(DEFAULT_CAM_POS);

    controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.copy(DEFAULT_TARGET);
    controls.minDistance = 1.2;
    controls.maxDistance = 20.0;
    controls.screenSpacePanning = true;

    let isUserDragging = false;
    controls.addEventListener('start', () => { isUserDragging = true; });
    controls.addEventListener('end', () => { isUserDragging = false; });

    function resetCameraView() {
      gsap.to(camera.position, {
        x: DEFAULT_CAM_POS.x,
        y: DEFAULT_CAM_POS.y,
        z: DEFAULT_CAM_POS.z,
        duration: 1.2,
        ease: 'power2.out'
      });
      gsap.to(controls.target, {
        x: DEFAULT_TARGET.x,
        y: DEFAULT_TARGET.y,
        z: DEFAULT_TARGET.z,
        duration: 1.2,
        ease: 'power2.out',
        onUpdate: () => controls.update()
      });
    }

    // Initialize PostProcessor Suite (with Anamorphic Flare OFF by default)
    postProcessor = new PostProcessor(renderer, {
      enabled: true,
      antialias: params.antialias,
      bloomEnabled: true,
      bloomStrength: 1.05,
      bloomRadius: 0.55,
      bloomThreshold: 0.22,
      anamorphicEnabled: false, // Default is OFF as requested
      anamorphicIntensity: 4.0,
      anamorphicThreshold: 0.35,
      noiseIntensity: 0.012,
      chromaticAberration: 0.008,
      vignetteBoost: 1.05,
      vignetteReduction: 0.55,
      gamma: 1.0
    });
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

    // =========================================================================
    // LIGHTING SYSTEM
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(params.ambientLightColor, params.ambientLightIntensity);
    scene.add(ambientLight);

    const baseLight = new THREE.PointLight(params.baseLightColor, params.baseLightIntensity, 10, 1.5);
    baseLight.position.set(0, 0.3, 0.4);
    scene.add(baseLight);

    const coreLight = new THREE.PointLight(params.coreLightColor, params.coreLightIntensity, 12, 1.4);
    coreLight.position.set(0, 1.5, 0.2);
    scene.add(coreLight);

    const rimLight = new THREE.DirectionalLight(params.rimLightColor, params.rimLightIntensity);
    rimLight.position.set(3.0, 3.5, -2.5);
    scene.add(rimLight);

    // =========================================================================
    // SHADER CHUNKS (Simplex 3D Noise)
    // =========================================================================
    const NOISE_GLSL = /* glsl */`
      vec4 permute(vec4 x){ return mod(((x * 34.0) + 1.0) * x, 289.0); }
      vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v){
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + 1.0 * C.xxx;
        vec3 x2 = x0 - i2 + 2.0 * C.xxx;
        vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;

        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(
                   i.z + vec4(0.0, i1.z, i2.z, 1.0))
                 + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                 + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 0.142857142857;
        vec3  ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
      }
    `;

    // =========================================================================
    // ENHANCED PROCEDURAL FLAME ARCHITECTURE
    // =========================================================================
    const flameUniforms = {
      uTime: { value: 0 },
      uMode: { value: 0 }, // 0: continuous 10s cycle, 1: 2s burst flash
      uProgress: { value: 1.0 },
      uSpeed: { value: params.speed },
      uFlameHeight: { value: params.flameHeight },
      uBaseRadius: { value: params.baseRadius },
      uTurbulence: { value: params.turbulence },
      uTongueShredding: { value: params.tongueShredding },
      uCoreIntensity: { value: params.coreIntensity },
      uFlicker: { value: 0.0 },
      uColorCore: { value: new THREE.Color(params.coreColor) },
      uColorMid: { value: new THREE.Color(params.midColor) },
      uColorOuter: { value: new THREE.Color(params.outerColor) },
      uColorSmoke: { value: new THREE.Color(params.smokeColor) }
    };

    const flameTonguesVS = /* glsl */`
      ${NOISE_GLSL}

      uniform float uTime;
      uniform float uFlameHeight;
      uniform float uBaseRadius;
      uniform float uTurbulence;
      uniform float uProgress;
      uniform int uMode;

      varying vec3 vWorldPos;
      varying vec2 vUv;
      varying float vHeightRatio;
      varying float vDisplacement;

      void main() {
        vUv = uv;
        vec3 pos = position;

        float h = clamp(pos.y / uFlameHeight, 0.0, 1.25);
        vHeightRatio = h;

        float heightScale = 1.0;
        if (uMode == 1) { // 2s Burst Flash Envelope
          float p = uProgress;
          if (p < 0.25) {
            heightScale = smoothstep(0.0, 0.25, p) * 1.15;
          } else if (p < 0.6) {
            heightScale = 1.15 - (p - 0.25) * 0.15;
          } else {
            heightScale = max(0.01, 1.05 - smoothstep(0.6, 1.0, p) * 1.04);
          }
        } else { // 10s natural breathing cycle
          float cycle = sin(uTime * 0.6283) * 0.10;
          heightScale = 1.0 + cycle;
        }

        float taper = mix(uBaseRadius, uBaseRadius * 0.1, pow(h, 0.8));
        pos.xz *= (taper / uBaseRadius);

        vec3 nCoord1 = vec3(pos.x * 1.4, pos.y * 1.1 - uTime * 3.2, pos.z * 1.4);
        float disp1 = snoise(nCoord1) * uTurbulence * pow(h, 1.3);

        vec3 nCoord2 = vec3(pos.x * 2.8 + 19.3, pos.y * 2.0 - uTime * 5.0, pos.z * 2.8 + 7.5);
        float disp2 = snoise(nCoord2) * (uTurbulence * 0.5) * pow(h, 1.6);

        pos.x += (disp1 * 0.42 + disp2 * 0.26);
        pos.z += (disp1 * 0.42 - disp2 * 0.26);
        vDisplacement = disp1 + disp2;

        pos.y *= heightScale;

        vec4 worldPos = modelMatrix * vec4(pos, 1.0);
        vWorldPos = worldPos.xyz;

        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const flameTonguesFS = /* glsl */`
      ${NOISE_GLSL}

      uniform float uTime;
      uniform float uBaseRadius;
      uniform float uTurbulence;
      uniform float uTongueShredding;
      uniform float uCoreIntensity;
      uniform float uFlicker;
      uniform float uProgress;
      uniform int uMode;

      uniform vec3 uColorCore;
      uniform vec3 uColorMid;
      uniform vec3 uColorOuter;
      uniform vec3 uColorSmoke;

      varying vec3 vWorldPos;
      varying vec2 vUv;
      varying float vHeightRatio;
      varying float vDisplacement;

      void main() {
        float h = clamp(vHeightRatio, 0.0, 1.25);

        vec3 p1 = vec3(vWorldPos.x * 1.8, vWorldPos.y * 1.4 - uTime * 3.5, vWorldPos.z * 1.8);
        vec3 p2 = vec3(vWorldPos.x * 4.0, vWorldPos.y * 2.8 - uTime * 6.0, vWorldPos.z * 4.0);
        vec3 p3 = vec3(vWorldPos.x * 7.5, vWorldPos.y * 5.5 - uTime * 9.5, vWorldPos.z * 7.5);

        float n = snoise(p1) * 0.52 + snoise(p2) * 0.32 + snoise(p3) * 0.16;
        n = n * 0.5 + 0.5;

        float distFromAxis = length(vWorldPos.xz);
        float radiusAtH = mix(uBaseRadius, 0.12, pow(h, 0.85));
        float radialHeat = clamp(1.0 - (distFromAxis / (radiusAtH * 1.1)), 0.0, 1.0);
        float verticalHeat = clamp(1.0 - h * 0.85, 0.0, 1.0);

        float heat = radialHeat * 0.65 + verticalHeat * 0.35;
        heat += (n - 0.5) * 0.4;
        heat = clamp(heat, 0.0, 1.0);

        float erosionThresh = mix(0.18, 0.82, pow(h, 1.2) * uTongueShredding);
        if (uMode == 1 && uProgress > 0.4) {
          erosionThresh += smoothstep(0.4, 1.0, uProgress) * 0.7;
        }

        float alpha = smoothstep(erosionThresh, erosionThresh + 0.18, n * 0.65 + heat * 0.45);
        alpha *= smoothstep(1.1, 0.75, h);
        alpha *= smoothstep(0.0, 0.06, h);

        if (alpha < 0.02) discard;

        vec3 col = uColorOuter;
        col = mix(col, uColorMid, smoothstep(0.2, 0.55, heat));
        col = mix(col, uColorCore, smoothstep(0.55, 0.9, heat));

        float smokeMix = smoothstep(0.68, 1.05, h) * (1.0 - smoothstep(0.08, 0.42, heat));
        col = mix(col, uColorSmoke, smokeMix * 0.85);

        col *= (1.0 + uFlicker * 0.2);

        gl_FragColor = vec4(col, alpha);
      }
    `;

    // 1. Primary Outer Flame Shell
    const outerCylGeo = new THREE.CylinderGeometry(
      params.baseRadius * 0.12,
      params.baseRadius,
      params.flameHeight,
      80,
      112,
      true
    );
    outerCylGeo.translate(0, params.flameHeight * 0.5, 0);

    const outerFlameMat = new THREE.ShaderMaterial({
      vertexShader: flameTonguesVS,
      fragmentShader: flameTonguesFS,
      uniforms: flameUniforms,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const outerFlameMesh = new THREE.Mesh(outerCylGeo, outerFlameMat);
    scene.add(outerFlameMesh);

    // 2. Inner Glowing Core Flame Shell
    const coreCylGeo = new THREE.CylinderGeometry(
      params.baseRadius * 0.08,
      params.baseRadius * 0.52,
      params.flameHeight * 0.85,
      48,
      64,
      true
    );
    coreCylGeo.translate(0, (params.flameHeight * 0.85) * 0.5, 0);

    const coreUniforms = THREE.UniformsUtils.clone(flameUniforms);

    const coreFlameMat = new THREE.ShaderMaterial({
      vertexShader: flameTonguesVS,
      fragmentShader: /* glsl */`
        ${NOISE_GLSL}

        uniform float uTime;
        uniform float uFlicker;
        uniform float uCoreIntensity;
        uniform vec3 uColorCore;
        uniform vec3 uColorMid;

        varying vec3 vWorldPos;
        varying float vHeightRatio;

        void main() {
          float h = clamp(vHeightRatio, 0.0, 1.0);

          vec3 p = vec3(vWorldPos.x * 2.2, vWorldPos.y * 1.8 - uTime * 4.2, vWorldPos.z * 2.2);
          float n = snoise(p) * 0.5 + 0.5;

          float coreGlow = (1.0 - h * 0.9) * (0.6 + n * 0.4);
          coreGlow *= smoothstep(0.0, 0.08, h) * smoothstep(1.0, 0.7, h);

          vec3 col = mix(uColorMid, uColorCore, smoothstep(0.2, 0.75, coreGlow));
          col *= uCoreIntensity * (1.0 + uFlicker * 0.25);

          gl_FragColor = vec4(col, coreGlow * 0.75);
        }
      `,
      uniforms: coreUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });

    const coreFlameMesh = new THREE.Mesh(coreCylGeo, coreFlameMat);
    scene.add(coreFlameMesh);

    // 3. Crossed Interior Fluttering Ribbons
    const ribbonGroup = new THREE.Group();
    const ribbonPlaneGeo = new THREE.PlaneGeometry(params.baseRadius * 1.4, params.flameHeight, 36, 80);
    ribbonPlaneGeo.translate(0, params.flameHeight * 0.5, 0);

    for (let i = 0; i < 3; i++) {
      const ribbonMesh = new THREE.Mesh(ribbonPlaneGeo, outerFlameMat);
      ribbonMesh.rotation.y = (Math.PI / 3) * i;
      ribbonGroup.add(ribbonMesh);
    }
    scene.add(ribbonGroup);

    // =========================================================================
    // SPARKS & EMBERS SYSTEM
    // =========================================================================
    const SPARKS_MAX = 4500;
    const sparkPositions = new Float32Array(SPARKS_MAX * 3);
    const sparkVelocities = new Float32Array(SPARKS_MAX * 3);
    const sparkLifetimes = new Float32Array(SPARKS_MAX);
    const sparkMaxLives = new Float32Array(SPARKS_MAX);
    const sparkBaseSizes = new Float32Array(SPARKS_MAX);
    const sparkSeeds = new Float32Array(SPARKS_MAX);

    function initSpark(i, immediateSpread = false) {
      const r = Math.sqrt(Math.random()) * params.baseRadius * 0.8;
      const theta = Math.random() * Math.PI * 2;
      sparkPositions[i * 3 + 0] = Math.cos(theta) * r;
      sparkPositions[i * 3 + 1] = immediateSpread ? Math.random() * params.flameHeight * 1.3 : Math.random() * 0.15;
      sparkPositions[i * 3 + 2] = Math.sin(theta) * r;

      const angle = Math.random() * Math.PI * 2;
      const speedOut = (Math.random() - 0.5) * 0.45;
      sparkVelocities[i * 3 + 0] = Math.cos(angle) * speedOut;
      sparkVelocities[i * 3 + 1] = 1.6 + Math.random() * 2.4;
      sparkVelocities[i * 3 + 2] = Math.sin(angle) * speedOut;

      sparkLifetimes[i] = immediateSpread ? Math.random() * 1.8 : 0.0;
      sparkMaxLives[i] = 1.0 + Math.random() * 1.6;
      sparkBaseSizes[i] = 0.8 + Math.random() * 1.2;
      sparkSeeds[i] = Math.random() * 1000.0;
    }

    for (let i = 0; i < SPARKS_MAX; i++) {
      initSpark(i, true);
    }

    const sparksGeo = new THREE.BufferGeometry();
    sparksGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
    sparksGeo.setAttribute('aLife', new THREE.BufferAttribute(sparkLifetimes, 1));
    sparksGeo.setAttribute('aMaxLife', new THREE.BufferAttribute(sparkMaxLives, 1));
    sparksGeo.setAttribute('aBaseSize', new THREE.BufferAttribute(sparkBaseSizes, 1));
    sparksGeo.setAttribute('aSeed', new THREE.BufferAttribute(sparkSeeds, 1));

    const sparksUniforms = {
      uColorCore: flameUniforms.uColorCore,
      uColorMid: flameUniforms.uColorMid,
      uColorOuter: flameUniforms.uColorOuter,
      uColorSparks: { value: new THREE.Color(params.sparksColor) },
      uSparksSize: { value: params.sparksSize }
    };

    const sparksVS = /* glsl */`
      attribute float aLife;
      attribute float aMaxLife;
      attribute float aBaseSize;
      attribute float aSeed;

      uniform float uSparksSize;

      varying float vLifeRatio;
      varying float vSeed;

      void main() {
        vSeed = aSeed;
        float lifeRatio = clamp(aLife / aMaxLife, 0.0, 1.0);
        vLifeRatio = lifeRatio;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);

        float lifeScale = sin(lifeRatio * 3.14159);
        float pSize = aBaseSize * (uSparksSize / 8.0) * (65.0 / -mvPosition.z) * lifeScale;
        gl_PointSize = clamp(pSize, 1.5, 24.0);

        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const sparksFS = /* glsl */`
      uniform vec3 uColorCore;
      uniform vec3 uColorMid;
      uniform vec3 uColorOuter;
      uniform vec3 uColorSparks;

      varying float vLifeRatio;

      void main() {
        vec2 coord = gl_PointCoord - vec2(0.5);
        float dist = length(coord);
        if (dist > 0.5) discard;

        float alpha = smoothstep(0.5, 0.05, dist);

        vec3 col = uColorSparks;
        col = mix(col, uColorMid, smoothstep(0.25, 0.65, vLifeRatio));
        col = mix(col, uColorOuter, smoothstep(0.65, 0.95, vLifeRatio));

        col += uColorCore * pow(clamp(1.0 - dist * 3.0, 0.0, 1.0), 2.5) * 1.2;

        gl_FragColor = vec4(col, alpha);
      }
    `;

    const sparksMat = new THREE.ShaderMaterial({
      vertexShader: sparksVS,
      fragmentShader: sparksFS,
      uniforms: sparksUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const sparksMesh = new THREE.Points(sparksGeo, sparksMat);
    scene.add(sparksMesh);

    // =========================================================================
    // SMOKE PUFFS
    // =========================================================================
    const SMOKE_MAX = 350;
    const smokePositions = new Float32Array(SMOKE_MAX * 3);
    const smokeLifetimes = new Float32Array(SMOKE_MAX);
    const smokeMaxLives = new Float32Array(SMOKE_MAX);
    const smokeBaseSizes = new Float32Array(SMOKE_MAX);
    const smokeRotations = new Float32Array(SMOKE_MAX);

    function initSmoke(i, immediateSpread = false) {
      const angle = Math.random() * Math.PI * 2;
      const rad = Math.random() * params.baseRadius * 0.65;
      smokePositions[i * 3 + 0] = Math.cos(angle) * rad;
      smokePositions[i * 3 + 1] = immediateSpread ? (1.5 + Math.random() * (params.flameHeight * 0.8)) : 1.5;
      smokePositions[i * 3 + 2] = Math.sin(angle) * rad;

      smokeLifetimes[i] = immediateSpread ? Math.random() * 2.2 : 0.0;
      smokeMaxLives[i] = 1.8 + Math.random() * 2.0;
      smokeBaseSizes[i] = 1.0 + Math.random() * 1.5;
      smokeRotations[i] = Math.random() * Math.PI * 2;
    }

    for (let i = 0; i < SMOKE_MAX; i++) {
      initSmoke(i, true);
    }

    const smokeGeo = new THREE.BufferGeometry();
    smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePositions, 3));
    smokeGeo.setAttribute('aLife', new THREE.BufferAttribute(smokeLifetimes, 1));
    smokeGeo.setAttribute('aMaxLife', new THREE.BufferAttribute(smokeMaxLives, 1));
    smokeGeo.setAttribute('aBaseSize', new THREE.BufferAttribute(smokeBaseSizes, 1));
    smokeGeo.setAttribute('aRot', new THREE.BufferAttribute(smokeRotations, 1));

    const smokeUniforms = {
      uColorSmoke: flameUniforms.uColorSmoke,
      uSmokeDensity: { value: params.smokeDensity },
      uVisible: { value: params.smokePuffs ? 1.0 : 0.0 }
    };

    const smokeVS = /* glsl */`
      attribute float aLife;
      attribute float aMaxLife;
      attribute float aBaseSize;
      attribute float aRot;

      uniform float uSmokeDensity;

      varying float vLifeRatio;
      varying float vRot;

      void main() {
        vRot = aRot;
        float lifeRatio = clamp(aLife / aMaxLife, 0.0, 1.0);
        vLifeRatio = lifeRatio;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);

        float expand = 1.0 + lifeRatio * 1.6;
        float sSize = aBaseSize * (uSmokeDensity * 1.1) * (180.0 / -mvPosition.z) * expand;
        gl_PointSize = clamp(sSize, 6.0, 85.0);

        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const smokeFS = /* glsl */`
      uniform vec3 uColorSmoke;
      uniform float uSmokeDensity;
      uniform float uVisible;

      varying float vLifeRatio;
      varying float vRot;

      void main() {
        if (uVisible < 0.5) discard;

        vec2 coord = gl_PointCoord - vec2(0.5);
        float c = cos(vRot);
        float s = sin(vRot);
        coord = vec2(coord.x * c - coord.y * s, coord.x * s + coord.y * c);

        float dist = length(coord);
        if (dist > 0.5) discard;

        float puff = smoothstep(0.5, 0.0, dist);
        puff = pow(puff, 1.8);

        float lifeFade = sin(vLifeRatio * 3.14159);
        float alpha = puff * lifeFade * 0.38 * uSmokeDensity;

        gl_FragColor = vec4(uColorSmoke, alpha);
      }
    `;

    const smokeMat = new THREE.ShaderMaterial({
      vertexShader: smokeVS,
      fragmentShader: smokeFS,
      uniforms: smokeUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending
    });

    const smokeMesh = new THREE.Points(smokeGeo, smokeMat);
    scene.add(smokeMesh);

    // =========================================================================
    // WARM FRAME-EDGE ILLUMINATION
    // =========================================================================
    const edgeGlowGeo = new THREE.PlaneGeometry(2, 2);
    const edgeGlowUniforms = {
      uColorGlow: { value: new THREE.Color(params.glowColor) },
      uGlowIntensity: { value: params.edgeGlowIntensity },
      uFlicker: flameUniforms.uFlicker,
      uGreenscreen: { value: params.greenscreen ? 1.0 : 0.0 }
    };

    const edgeGlowMat = new THREE.ShaderMaterial({
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.9999, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform vec3 uColorGlow;
        uniform float uGlowIntensity;
        uniform float uFlicker;
        uniform float uGreenscreen;
        varying vec2 vUv;

        void main() {
          if (uGreenscreen > 0.5) {
            discard;
          }

          vec2 centered = vUv - vec2(0.5);
          float dist = length(centered);

          float edge = smoothstep(0.32, 0.92, dist);
          edge = pow(edge, 1.5);

          float bottomGlow = smoothstep(0.35, 0.0, vUv.y) * 0.25;

          float intensity = (edge * 0.75 + bottomGlow) * uGlowIntensity * (1.0 + uFlicker * 0.15);
          vec3 col = uColorGlow * intensity * 0.6;

          gl_FragColor = vec4(col, clamp(intensity * 0.5, 0.0, 1.0));
        }
      `,
      uniforms: edgeGlowUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const edgeGlowMesh = new THREE.Mesh(edgeGlowGeo, edgeGlowMat);
    edgeGlowMesh.frustumCulled = false;
    scene.add(edgeGlowMesh);

    // =========================================================================
    // GROUND HEARTH / SOOT BASE
    // =========================================================================
    const groundGeo = new THREE.PlaneGeometry(16, 16);
    const groundMat = new THREE.ShaderMaterial({
      vertexShader: /* glsl */`
        varying vec3 vWorldPos;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: /* glsl */`
        uniform vec3 uColorOuter;
        uniform vec3 uColorMid;
        uniform float uFlicker;
        varying vec3 vWorldPos;

        void main() {
          float dist = length(vWorldPos.xz);
          float emberGlow = smoothstep(2.2, 0.15, dist);
          emberGlow = pow(emberGlow, 2.4);

          vec3 baseCol = vec3(0.012, 0.008, 0.006);
          vec3 glowCol = mix(uColorOuter, uColorMid, 0.35) * (1.0 + uFlicker * 0.18);

          vec3 finalCol = mix(baseCol, glowCol, emberGlow * 0.38);
          float alpha = smoothstep(6.0, 0.8, dist);

          gl_FragColor = vec4(finalCol, alpha);
        }
      `,
      uniforms: {
        uColorOuter: flameUniforms.uColorOuter,
        uColorMid: flameUniforms.uColorMid,
        uFlicker: flameUniforms.uFlicker
      },
      transparent: true,
      depthWrite: false
    });

    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = 0.0;
    scene.add(groundMesh);

    // =========================================================================
    // FLASH & STEADY BURNING DYNAMICS
    // =========================================================================
    let flashTimeline = null;
    let burstFlashProgress = 0.0;

    function triggerBurstFlash() {
      if (flashTimeline) flashTimeline.kill();

      burstFlashProgress = 0.0;
      flameUniforms.uMode.value = 1;
      coreUniforms.uMode.value = 1;

      flashTimeline = gsap.timeline({
        onComplete: () => {
          if (params.mode === 'Burst Flash (2s)') {
            gsap.delayedCall(0.5, () => triggerBurstFlash());
          } else {
            flameUniforms.uMode.value = 0;
            coreUniforms.uMode.value = 0;
          }
        }
      });

      flashTimeline.to({ p: 0.0 }, {
        p: 1.0,
        duration: 2.0,
        ease: 'none',
        onUpdate: function() {
          burstFlashProgress = this.targets()[0].p;
          flameUniforms.uProgress.value = burstFlashProgress;
          coreUniforms.uProgress.value = burstFlashProgress;

          let lightBoost = 1.0;
          if (burstFlashProgress < 0.3) {
            lightBoost = 1.0 + smoothstep(0.0, 0.3, burstFlashProgress) * 1.8;
          } else {
            lightBoost = 1.0 + (1.0 - smoothstep(0.3, 1.0, burstFlashProgress)) * 1.8;
          }
          baseLight.intensity = params.baseLightIntensity * lightBoost;
          coreLight.intensity = params.coreLightIntensity * lightBoost;
        }
      });
    }

    function applyMode(mode) {
      params.mode = mode;
      if (mode === 'Burst Flash (2s)') {
        triggerBurstFlash();
      } else {
        if (flashTimeline) flashTimeline.kill();
        flameUniforms.uMode.value = 0;
        coreUniforms.uMode.value = 0;
        flameUniforms.uProgress.value = 1.0;
        coreUniforms.uProgress.value = 1.0;
        baseLight.intensity = params.baseLightIntensity;
        coreLight.intensity = params.coreLightIntensity;
      }
    }

    // =========================================================================
    // COLOR SCHEME UPDATE LOGIC
    // =========================================================================
    function applyColorScheme(schemeName) {
      const s = COLOR_SCHEMES[schemeName];
      if (!s) return;
      params.colorScheme = schemeName;
      params.coreColor = s.core;
      params.midColor = s.mid;
      params.outerColor = s.outer;
      params.smokeColor = s.smoke;
      params.sparksColor = s.sparks;
      params.glowColor = s.glow;
      params.backgroundColor = s.bg;

      syncColorsToShaders();
      updateGUIControllers();
    }

    function syncColorsToShaders() {
      const core = new THREE.Color(params.coreColor);
      const mid = new THREE.Color(params.midColor);
      const outer = new THREE.Color(params.outerColor);
      const smoke = new THREE.Color(params.smokeColor);
      const sparks = new THREE.Color(params.sparksColor);
      const glow = new THREE.Color(params.glowColor);

      flameUniforms.uColorCore.value.copy(core);
      flameUniforms.uColorMid.value.copy(mid);
      flameUniforms.uColorOuter.value.copy(outer);
      flameUniforms.uColorSmoke.value.copy(smoke);

      coreUniforms.uColorCore.value.copy(core);
      coreUniforms.uColorMid.value.copy(mid);
      coreUniforms.uColorOuter.value.copy(outer);
      coreUniforms.uColorSmoke.value.copy(smoke);

      sparksUniforms.uColorSparks.value.copy(sparks);
      smokeUniforms.uColorSmoke.value.copy(smoke);
      edgeGlowUniforms.uColorGlow.value.copy(glow);

      baseLight.color.copy(mid);
      coreLight.color.copy(core);
      rimLight.color.copy(outer);

      if (params.greenscreen) {
        scene.background.set('#00ff00');
        edgeGlowUniforms.uGreenscreen.value = 1.0;
      } else {
        scene.background.set(params.backgroundColor);
        edgeGlowUniforms.uGreenscreen.value = 0.0;
      }
    }

    // =========================================================================
    // CAMERA ANIMATIONS (8 Presets)
    // Preserves manual zoom and angle adjustments!
    // =========================================================================
    let animClockTime = 0.0;

    function updateCameraAnimation(effectiveDelta) {
      animClockTime += effectiveDelta;

      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      const spherical = new THREE.Spherical().setFromVector3(offset);

      if (isUserDragging) {
        return;
      }

      switch (params.cameraAnimation) {
        case 'Static View':
          break;

        case 'Slow Gentle Orbit':
          spherical.theta += 0.15 * effectiveDelta;
          break;

        case 'Low Angle Flame Rise':
          spherical.theta += 0.06 * effectiveDelta;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(animClockTime * 0.45) * 0.0018,
            0.45,
            Math.PI / 2 - 0.08
          );
          break;

        case 'Gentle Breathing Pulse':
          const pulse = Math.sin(animClockTime * 0.65) * 0.0016 * (effectiveDelta * 60.0);
          spherical.radius = THREE.MathUtils.clamp(spherical.radius * (1.0 + pulse), 1.5, 26.0);
          spherical.theta += 0.08 * effectiveDelta;
          break;

        case 'Side-to-Side Drift':
          const sway = Math.cos(animClockTime * 0.5) * 0.12 * effectiveDelta;
          spherical.theta += sway;
          break;

        case 'Dynamic Arc & Tilt':
          spherical.theta += 0.13 * effectiveDelta;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(animClockTime * 0.35) * 0.002,
            0.5,
            Math.PI / 2 - 0.12
          );
          break;

        case 'Dramatic Low Swoop':
          spherical.theta += 0.09 * effectiveDelta;
          spherical.phi = THREE.MathUtils.lerp(spherical.phi, Math.PI / 2 - 0.15, 0.02);
          break;

        case 'Top-Down Ember Spiral':
          spherical.theta += 0.18 * effectiveDelta;
          spherical.phi = THREE.MathUtils.lerp(spherical.phi, 0.78, 0.02);
          break;
      }

      offset.setFromSpherical(spherical);
      camera.position.copy(controls.target).add(offset);
    }

    // =========================================================================
    // GUI CONTROLLER REFRESH (Explicitly Skips Post-Processing)
    // =========================================================================
    function updateGUIControllers() {
      if (!gui) return;
      const refresh = (folder) => {
        // Strict guard: NEVER shuffle, touch or refresh Postprocessing settings on random click
        if (folder._title && (
          folder._title.includes('Post-Processing') ||
          folder._title.includes('PostProcessor') ||
          folder._title.includes('Bloom') ||
          folder._title.includes('Flare') ||
          folder._title.includes('Lens') ||
          folder._title.includes('Optics') ||
          folder._title.includes('Anamorphic')
        )) {
          return;
        }
        if (folder.controllers) {
          folder.controllers.forEach(c => {
            if (c.object && typeof postProcessor !== 'undefined' && postProcessor && c.object === postProcessor.settings) return;
            c.updateDisplay();
          });
        }
        if (folder.folders) {
          folder.folders.forEach(f => refresh(f));
        }
      };
      refresh(gui);
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZER (Does NOT shuffle or change Post-Processing!)
    // =========================================================================
    function randomizeScene() {
      // 1. Pick a random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomSchemeKey);

      // 2. Randomize geometric & motion parameters only
      params.flameHeight = THREE.MathUtils.randFloat(2.2, 3.4);
      params.baseRadius = THREE.MathUtils.randFloat(0.7, 1.15);
      params.turbulence = THREE.MathUtils.randFloat(0.9, 1.8);
      params.tongueShredding = THREE.MathUtils.randFloat(0.85, 1.4);
      params.sparksSpeed = THREE.MathUtils.randFloat(0.9, 1.8);
      params.exposure = THREE.MathUtils.randFloat(0.9, 1.25);
      params.baseLightIntensity = THREE.MathUtils.randFloat(2.0, 4.0);
      params.coreLightIntensity = THREE.MathUtils.randFloat(2.5, 5.0);

      // 3. Sync flame uniforms & renderer exposure
      flameUniforms.uFlameHeight.value = params.flameHeight;
      flameUniforms.uBaseRadius.value = params.baseRadius;
      flameUniforms.uTurbulence.value = params.turbulence;
      flameUniforms.uTongueShredding.value = params.tongueShredding;
      renderer.toneMappingExposure = params.exposure;

      // 4. Update controllers while keeping all PostProcessing intact
      updateGUIControllers();
    }

    let pointerDownTime = 0;
    let pointerDownPos = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      pointerDownTime = performance.now();
      pointerDownPos.set(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;

      const duration = performance.now() - pointerDownTime;
      const dist = pointerDownPos.distanceTo(new THREE.Vector2(e.clientX, e.clientY));

      if (duration < 280 && dist < 6) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // =========================================================================
    // LIL-GUI SETUP
    // =========================================================================
    let gui = new GUI({ title: 'Flame Flash Controls' });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // 1. Fire Mode & Dynamics
    const fMode = gui.addFolder('Fire Mode & Timing');
    fMode.add(params, 'mode', ['Continuous Steady (10s)', 'Burst Flash (2s)']).name('Mode').onChange(applyMode);
    fMode.add(params, 'triggerFlash').name('Trigger Flash (2s)');
    fMode.add(params, 'speed', 0.1, 3.0, 0.05).name('Animation Speed').onChange(v => {
      flameUniforms.uSpeed.value = v;
    });
    fMode.add(params, 'flameHeight', 1.5, 4.2, 0.05).name('Flame Height').onChange(v => {
      flameUniforms.uFlameHeight.value = v;
    });
    fMode.add(params, 'baseRadius', 0.4, 1.6, 0.05).name('Base Radius').onChange(v => {
      flameUniforms.uBaseRadius.value = v;
    });
    fMode.add(params, 'turbulence', 0.5, 2.5, 0.05).name('Turbulence').onChange(v => {
      flameUniforms.uTurbulence.value = v;
    });
    fMode.add(params, 'tongueShredding', 0.4, 2.2, 0.05).name('Tongue Shredding').onChange(v => {
      flameUniforms.uTongueShredding.value = v;
    });
    fMode.add(params, 'coreIntensity', 0.4, 2.5, 0.05).name('Core Intensity').onChange(v => {
      flameUniforms.uCoreIntensity.value = v;
      coreUniforms.uCoreIntensity.value = v;
    });

    // 2. Color Schemes & Appearance
    const fColor = gui.addFolder('Color Schemes & Appearance');
    fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange(applyColorScheme);
    fColor.addColor(params, 'coreColor').name('Core (Heart)').onChange(syncColorsToShaders);
    fColor.addColor(params, 'midColor').name('Mid (Flame Body)').onChange(syncColorsToShaders);
    fColor.addColor(params, 'outerColor').name('Outer (Tongues)').onChange(syncColorsToShaders);
    fColor.addColor(params, 'smokeColor').name('Smoke (Tips/Puffs)').onChange(syncColorsToShaders);
    fColor.addColor(params, 'sparksColor').name('Sparks (Embers)').onChange(syncColorsToShaders);
    fColor.addColor(params, 'glowColor').name('Edge Glow Color').onChange(syncColorsToShaders);
    fColor.add(params, 'edgeGlowIntensity', 0.0, 2.5, 0.05).name('Edge Glow Intensity').onChange(v => {
      edgeGlowUniforms.uGlowIntensity.value = v;
    });

    // 3. Sparks & Smoke
    const fParticles = gui.addFolder('Sparks & Smoke');
    fParticles.add(params, 'sparksCount', 500, SPARKS_MAX, 100).name('Sparks Count');
    fParticles.add(params, 'sparksSpeed', 0.4, 3.5, 0.1).name('Sparks Updraft');
    fParticles.add(params, 'sparksSize', 2.0, 24.0, 0.5).name('Sparks Size').onChange(v => {
      sparksUniforms.uSparksSize.value = v;
    });
    fParticles.add(params, 'smokePuffs').name('Dark Smoke Puffs').onChange(v => {
      smokeUniforms.uVisible.value = v ? 1.0 : 0.0;
    });
    fParticles.add(params, 'smokeDensity', 0.2, 2.0, 0.05).name('Smoke Density').onChange(v => {
      smokeUniforms.uSmokeDensity.value = v;
    });

    // 4. Camera & Animation Presets
    const fCam = gui.addFolder('Camera & Animation');
    fCam.add(params, 'cameraAnimation', [
      'Static View',
      'Slow Gentle Orbit',
      'Low Angle Flame Rise',
      'Gentle Breathing Pulse',
      'Side-to-Side Drift',
      'Dynamic Arc & Tilt',
      'Dramatic Low Swoop',
      'Top-Down Ember Spiral'
    ]).name('Camera Motion');
    fCam.add(params, 'resetCamera').name('Reset Camera View');

    // 5. Lighting & Exposure
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.2, 2.5, 0.05).name('Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    fLight.add(params, 'baseLightIntensity', 0.0, 8.0, 0.1).name('Base Light Intensity').onChange(v => {
      baseLight.intensity = v;
    });
    fLight.addColor(params, 'baseLightColor').name('Base Light Color').onChange(v => {
      baseLight.color.set(v);
    });
    fLight.add(params, 'coreLightIntensity', 0.0, 8.0, 0.1).name('Core Light Intensity').onChange(v => {
      coreLight.intensity = v;
    });
    fLight.addColor(params, 'coreLightColor').name('Core Light Color').onChange(v => {
      coreLight.color.set(v);
    });
    fLight.add(params, 'ambientLightIntensity', 0.0, 2.0, 0.05).name('Ambient Light Intensity').onChange(v => {
      ambientLight.intensity = v;
    });
    fLight.addColor(params, 'ambientLightColor').name('Ambient Light Color').onChange(v => {
      ambientLight.color.set(v);
    });
    fLight.add(params, 'rimLightIntensity', 0.0, 5.0, 0.1).name('Rim Light Intensity').onChange(v => {
      rimLight.intensity = v;
    });
    fLight.addColor(params, 'rimLightColor').name('Rim Light Color').onChange(v => {
      rimLight.color.set(v);
    });

    // 6. Environment & Settings
    const fEnv = gui.addFolder('Environment & Settings');
    fEnv.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(v => {
      if (v) {
        scene.background.set('#00ff00');
        edgeGlowUniforms.uGreenscreen.value = 1.0;
      } else {
        scene.background.set(params.backgroundColor);
        edgeGlowUniforms.uGreenscreen.value = 0.0;
      }
    });
    fEnv.addColor(params, 'backgroundColor').name('Background Color').onChange(v => {
      if (!params.greenscreen) scene.background.set(v);
    });
    fEnv.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fEnv.add(params, 'antialias').name('Antialiasing').onChange(v => {
      initRenderer();
      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
      controls.dispose();
      controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.copy(DEFAULT_TARGET);
      controls.minDistance = 1.2;
      controls.maxDistance = 20.0;
      controls.screenSpacePanning = true;
      controls.addEventListener('start', () => { isUserDragging = true; });
      controls.addEventListener('end', () => { isUserDragging = false; });
    });
    fEnv.add(params, 'clickToRandomize').name('Click to Randomize');
    fEnv.add(params, 'randomize').name('Randomize Now');

    // 7. Attach PostProcessor Suite to GUI
    postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');

    // =========================================================================
    // MAIN ANIMATION LOOP
    // =========================================================================
    let flameTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const effectiveDelta = delta * params.speed;
      flameTime += effectiveDelta;

      const flicker = Math.sin(flameTime * 18.0) * 0.4 +
                      Math.cos(flameTime * 32.0) * 0.3 +
                      Math.sin(flameTime * 49.0) * 0.2;
      flameUniforms.uTime.value = flameTime;
      flameUniforms.uFlicker.value = flicker;
      coreUniforms.uTime.value = flameTime * 1.2;
      coreUniforms.uFlicker.value = flicker;

      if (params.mode !== 'Burst Flash (2s)') {
        baseLight.intensity = params.baseLightIntensity * (1.0 + flicker * 0.12);
        coreLight.intensity = params.coreLightIntensity * (1.0 + flicker * 0.16);
      }

      // Update Sparks
      const count = params.sparksCount;
      const posAttr = sparksGeo.attributes.position;
      const lifeAttr = sparksGeo.attributes.aLife;

      for (let i = 0; i < count; i++) {
        sparkLifetimes[i] += effectiveDelta;
        if (sparkLifetimes[i] >= sparkMaxLives[i]) {
          initSpark(i, false);
        } else {
          const vy = sparkVelocities[i * 3 + 1] * params.sparksSpeed;
          sparkPositions[i * 3 + 1] += vy * effectiveDelta;

          const angle = flameTime * 3.2 + sparkSeeds[i];
          sparkPositions[i * 3 + 0] += Math.cos(angle) * 0.35 * effectiveDelta;
          sparkPositions[i * 3 + 2] += Math.sin(angle) * 0.35 * effectiveDelta;
        }
      }
      sparksGeo.setDrawRange(0, count);
      posAttr.needsUpdate = true;
      lifeAttr.needsUpdate = true;

      // Update Smoke Puffs
      if (params.smokePuffs) {
        const sPosAttr = smokeGeo.attributes.position;
        const sLifeAttr = smokeGeo.attributes.aLife;
        for (let i = 0; i < SMOKE_MAX; i++) {
          smokeLifetimes[i] += effectiveDelta;
          if (smokeLifetimes[i] >= smokeMaxLives[i]) {
            initSmoke(i, false);
          } else {
            smokePositions[i * 3 + 1] += 0.8 * effectiveDelta;
            smokeRotations[i] += 0.25 * effectiveDelta;
          }
        }
        sPosAttr.needsUpdate = true;
        sLifeAttr.needsUpdate = true;
      }

      // Camera Animation
      updateCameraAnimation(effectiveDelta);
      controls.update();

      // Render through PostProcessor pipeline
      if (postProcessor && postProcessor.settings.enabled) {
        renderer.setRenderTarget(postProcessor.sceneTarget);
        renderer.clear();
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);
        postProcessor.render(postProcessor.sceneTarget.texture);
      } else {
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);
      }
    }

    animate();

    // =========================================================================
    // RESIZE HANDLER
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, renderer.getPixelRatio());
    });
  </script>
</body>
