      let scene, camera, renderer, composer, bloomPass, cinematicPass, smaaPass, controls;

      // --- Parametric Tendril Curve with Natural Sinuous Waves ---
      class SinuousTendrilCurve extends THREE.Curve {
        constructor(params) {
          super();
          this.origin = params.origin || new THREE.Vector3(0, 0, 0);
          this.dir = (params.dir || new THREE.Vector3(0, 1, 0)).clone().normalize();
          this.length = params.length || 60;
          this.freq = params.freq || 1.0;
          this.amp = params.amp || 8.0;
          this.twist = params.twist || 2.0;
          this.phase = params.phase || Math.random() * Math.PI * 2;
          this.seed = params.seed || Math.random() * 100.0;
          this.curvature = params.curvature || new THREE.Vector3(0, 0, 0);

          // Orthogonal basis for radial wave displacement
          const arbitrary = Math.abs(this.dir.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
          this.normal = new THREE.Vector3().crossVectors(this.dir, arbitrary).normalize();
          this.binormal = new THREE.Vector3().crossVectors(this.dir, this.normal).normalize();
        }

        getPoint(t, optionalTarget = new THREE.Vector3()) {
          const point = optionalTarget;
          const currentLength = t * this.length;

          // Base line along growth direction with subtle natural overarching curvature
          point.copy(this.origin)
            .addScaledVector(this.dir, currentLength)
            .addScaledVector(this.curvature, currentLength * currentLength * 0.012);

          // Dual harmonic sinusoidal drift for organic jellyfish-like undulation
          const harmonic1 = Math.sin(t * Math.PI * 2.5 * this.freq + this.phase);
          const harmonic2 = Math.cos(t * Math.PI * 4.0 * this.freq + this.phase * 1.5);
          const spiralAngle = t * Math.PI * this.twist + this.phase;

          const envelope = Math.sin(t * Math.PI * 0.85) * this.amp * (0.2 + 0.8 * t);
          const waveX = (Math.cos(spiralAngle) * harmonic1) * envelope;
          const waveY = (Math.sin(spiralAngle) * harmonic2) * envelope;

          point.addScaledVector(this.normal, waveX);
          point.addScaledVector(this.binormal, waveY);

          return point;
        }
      }

      // --- Bioluminescent Tendril Shader Definition ---
      function createBioluminescentMaterial(isBranch = false, branchDepth = 0) {
        const uniforms = {
          uTime: { value: 0 },
          uGrowth: { value: config.growthProgress },
          uColor1: { value: new THREE.Color(config.color1) },
          uColor2: { value: new THREE.Color(config.color2) },
          uColor3: { value: new THREE.Color(config.color3) },
          uColor4: { value: new THREE.Color(config.color4) },
          uColor5: { value: new THREE.Color(config.color5) },
          uGlowBrightness: { value: config.glowBrightness },
          uSoftFalloff: { value: config.softFalloff },
          uPulseSpeed: { value: config.pulseSpeed },
          uPulseDensity: { value: config.pulseDensity },
          uSubsurfaceScatter: { value: config.subsurfaceScatter },
          uSparkleIntensity: { value: config.sparkleIntensity },
          uWaveIntensity: { value: config.waveIntensity },
          uWaveFrequency: { value: config.waveFrequency },
          uDriftSpeed: { value: config.driftSpeed },
          uBranchDepth: { value: branchDepth }
        };

        const vertexShader = `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          varying vec3 vWorldPosition;

          uniform float uTime;
          uniform float uWaveIntensity;
          uniform float uWaveFrequency;
          uniform float uDriftSpeed;
          uniform float uBranchDepth;

          vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
          vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
          vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
          vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

          float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(
                      i.z + vec4(0.0, i1.z, i2.z, 1.0))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
            p0 *= norm.x;
            p1 *= norm.y;
            p2 *= norm.z;
            p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
          }

          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);

            vec3 transformed = position;
            float waveProgress = uv.x * (1.0 + uBranchDepth * 0.35);
            float timeScale = uTime * uDriftSpeed;

            vec3 noisePos = (transformed * 0.022 * uWaveFrequency) + vec3(0.0, timeScale * 0.25, 0.0);
            float driftX = snoise(noisePos) * waveProgress * 4.0 * uWaveIntensity;
            float driftY = snoise(noisePos + vec3(12.5, 4.2, 8.1)) * waveProgress * 2.2 * uWaveIntensity;
            float driftZ = snoise(noisePos + vec3(7.3, 15.9, 3.4)) * waveProgress * 4.0 * uWaveIntensity;

            float harmonicSway = sin(timeScale * 1.4 + waveProgress * 3.8) * waveProgress * 1.8 * uWaveIntensity;
            transformed.x += driftX + harmonicSway;
            transformed.y += driftY;
            transformed.z += driftZ + cos(timeScale * 1.1 + waveProgress * 3.2) * waveProgress * 1.6 * uWaveIntensity;

            vec4 worldPosition = modelMatrix * vec4(transformed, 1.0);
            vWorldPosition = worldPosition.xyz;

            vec4 mvPosition = viewMatrix * worldPosition;
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `;

        const fragmentShader = `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          varying vec3 vWorldPosition;

          uniform float uTime;
          uniform float uGrowth;
          uniform vec3 uColor1;
          uniform vec3 uColor2;
          uniform vec3 uColor3;
          uniform vec3 uColor4;
          uniform vec3 uColor5;
          uniform float uGlowBrightness;
          uniform float uSoftFalloff;
          uniform float uPulseSpeed;
          uniform float uPulseDensity;
          uniform float uSubsurfaceScatter;
          uniform float uSparkleIntensity;
          uniform float uBranchDepth;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          void main() {
            float growthThreshold = uGrowth;
            float growthEdge = smoothstep(growthThreshold, growthThreshold - 0.05, vUv.x);
            if (growthEdge <= 0.001) discard;

            float rootFade = smoothstep(0.0, 0.08, vUv.x);

            float tipGlow = smoothstep(growthThreshold - 0.07, growthThreshold, vUv.x) * 
                            (1.0 - smoothstep(growthThreshold, growthThreshold + 0.01, vUv.x)) * 1.8;

            vec3 viewDir = normalize(vViewPosition);
            vec3 normal = normalize(vNormal);
            float NdotV = abs(dot(normal, viewDir));
            
            float rim = 1.0 - NdotV;
            float fresnelGlow = pow(rim, uSoftFalloff) * uSubsurfaceScatter * 0.95;
            float innerCoreGlow = pow(NdotV, 3.5) * 0.28;

            float gradPos = fract(vUv.x * 0.85 - uTime * 0.07 * uPulseSpeed);
            vec3 baseGrad;
            if (gradPos < 0.25) {
              baseGrad = mix(uColor1, uColor2, smoothstep(0.0, 0.25, gradPos));
            } else if (gradPos < 0.5) {
              baseGrad = mix(uColor2, uColor3, smoothstep(0.25, 0.5, gradPos));
            } else if (gradPos < 0.75) {
              baseGrad = mix(uColor3, uColor4, smoothstep(0.5, 0.75, gradPos));
            } else {
              baseGrad = mix(uColor4, uColor1, smoothstep(0.75, 1.0, gradPos));
            }

            float pulseCoord = (vUv.x * uPulseDensity) - (uTime * 0.75 * uPulseSpeed);
            float pulseWave = sin(pulseCoord * 6.28318);
            float pulseSharp = pow(max(0.0, pulseWave), 8.0) * 1.3;

            float nodeIndex = floor(pulseCoord * 2.5);
            float nodeLocal = fract(pulseCoord * 2.5);
            float nodeSparkle = (1.0 - smoothstep(0.0, 0.35, abs(nodeLocal - 0.5))) * 
                                step(0.45, hash(vec2(nodeIndex, uBranchDepth))) *
                                (sin(uTime * 4.5 + hash(vec2(nodeIndex)) * 6.28) * 0.3 + 0.7) * uSparkleIntensity * 0.8;

            float bodyTransmission = fresnelGlow + innerCoreGlow;
            vec3 finalColor = baseGrad * bodyTransmission;
            finalColor += mix(uColor4, uColor5, 0.5) * (pulseSharp + nodeSparkle);
            finalColor += uColor5 * tipGlow;

            finalColor *= uGlowBrightness * rootFade;

            float alpha = (bodyTransmission * 0.6 + pulseSharp * 0.4 + tipGlow) * growthEdge * rootFade;
            alpha = clamp(alpha, 0.0, 1.0);

            gl_FragColor = vec4(finalColor, alpha);
          }
        `;

        const mat = new THREE.ShaderMaterial({
          vertexShader,
          fragmentShader,
          uniforms,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide
        });

        tendrilMaterials.push(mat);
        return mat;
      }

      // --- Build Multi-Tier Branching Tendril Network ---
      function buildTendrilNetwork() {
        if (tendrilGroup) {
          scene.remove(tendrilGroup);
          tendrilGroup.traverse((child) => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          });
        }

        tendrilGroup = new THREE.Group();
        tendrilMaterials = [];

        const primaryCount = 34;
        const mainRadius = 26;

        for (let i = 0; i < primaryCount; i++) {
          const phi = (i / primaryCount) * Math.PI * 2 + (Math.random() * 0.12);
          const rad = mainRadius * (0.25 + 0.75 * Math.sqrt((i + 1) / primaryCount));
          const startX = Math.cos(phi) * rad;
          const startZ = Math.sin(phi) * rad;
          const domeDrop = Math.pow(rad / mainRadius, 1.8) * 14.0;
          const startY = 36.0 - domeDrop + (Math.random() - 0.5) * 3.0;

          const origin = new THREE.Vector3(startX, startY, startZ);
          const dir = new THREE.Vector3(
            startX * 0.15 + (Math.random() - 0.5) * 3.0,
            -65 - Math.random() * 20.0,
            startZ * 0.15 + (Math.random() - 0.5) * 3.0
          ).normalize();

          const length = 85 + Math.random() * 40;
          const mainCurve = new SinuousTendrilCurve({
            origin: origin,
            dir: dir,
            length: length,
            freq: 0.75 + Math.random() * 0.5,
            amp: 5.5 + Math.random() * 5.0,
            twist: 1.2 + Math.random() * 2.0,
            phase: Math.random() * Math.PI * 2,
            curvature: new THREE.Vector3((Math.random() - 0.5) * 0.35, -0.15, (Math.random() - 0.5) * 0.35)
          });

          const mainThickness = 0.24 + Math.random() * 0.18;
          const mainGeo = new THREE.TubeGeometry(mainCurve, 130, mainThickness, 7, false);
          const mainMat = createBioluminescentMaterial(false, 0);
          const mainMesh = new THREE.Mesh(mainGeo, mainMat);
          tendrilGroup.add(mainMesh);

          // Tier 1 Branching
          const branchCount = 2 + Math.floor(Math.random() * 2);
          for (let b = 0; b < branchCount; b++) {
            const branchT = 0.38 + (b / branchCount) * 0.42 + (Math.random() * 0.08 - 0.04);
            const branchOrigin = mainCurve.getPoint(branchT);

            const branchAngle = Math.random() * Math.PI * 2;
            const branchDir = new THREE.Vector3(
              Math.cos(branchAngle) * 0.55 + dir.x * 0.45,
              dir.y * 0.85 - 0.2,
              Math.sin(branchAngle) * 0.55 + dir.z * 0.45
            ).normalize();

            const branchLength = length * (0.35 + Math.random() * 0.22);
            const branchCurve = new SinuousTendrilCurve({
              origin: branchOrigin,
              dir: branchDir,
              length: branchLength,
              freq: 1.1 + Math.random() * 0.7,
              amp: 4.0 + Math.random() * 3.5,
              twist: 1.8 + Math.random() * 1.8,
              phase: Math.random() * Math.PI * 2
            });

            const branchThickness = mainThickness * 0.52;
            const branchGeo = new THREE.TubeGeometry(branchCurve, 80, branchThickness, 6, false);
            const branchMat = createBioluminescentMaterial(true, 1);
            const branchMesh = new THREE.Mesh(branchGeo, branchMat);
            tendrilGroup.add(branchMesh);

            // Tier 2 Branching
            if (Math.random() > 0.45) {
              const subT = 0.52 + Math.random() * 0.32;
              const subOrigin = branchCurve.getPoint(subT);
              const subDir = new THREE.Vector3(
                (Math.random() - 0.5) * 0.7 + branchDir.x * 0.5,
                branchDir.y - 0.25,
                (Math.random() - 0.5) * 0.7 + branchDir.z * 0.5
              ).normalize();

              const subLength = branchLength * 0.38;
              const subCurve = new SinuousTendrilCurve({
                origin: subOrigin,
                dir: subDir,
                length: subLength,
                freq: 1.6 + Math.random() * 0.8,
                amp: 2.2 + Math.random() * 2.0,
                twist: 2.5,
                phase: Math.random() * Math.PI * 2
              });

              const subGeo = new THREE.TubeGeometry(subCurve, 55, branchThickness * 0.5, 5, false);
              const subMat = createBioluminescentMaterial(true, 2);
              const subMesh = new THREE.Mesh(subGeo, subMat);
              tendrilGroup.add(subMesh);
            }
          }
        }

        // Inner glowing oral arms / central spiraling tentacles
        const coreCount = 8;
        for (let c = 0; c < coreCount; c++) {
          const coreAngle = (c / coreCount) * Math.PI * 2;
          const coreOrigin = new THREE.Vector3(
            Math.cos(coreAngle) * 4.5,
            37.0 + Math.random() * 2.0,
            Math.sin(coreAngle) * 4.5
          );
          const coreDir = new THREE.Vector3(
            Math.cos(coreAngle) * 0.12,
            -75 - Math.random() * 15.0,
            Math.sin(coreAngle) * 0.12
          ).normalize();

          const coreCurve = new SinuousTendrilCurve({
            origin: coreOrigin,
            dir: coreDir,
            length: 95 + Math.random() * 25,
            freq: 1.3 + Math.random() * 0.5,
            amp: 8.0 + Math.random() * 4.0,
            twist: 3.5 + Math.random() * 2.5,
            phase: coreAngle * 2.0
          });

          const coreGeo = new THREE.TubeGeometry(coreCurve, 140, 0.35, 7, false);
          const coreMat = createBioluminescentMaterial(false, 0);
          const coreMesh = new THREE.Mesh(coreGeo, coreMat);
          tendrilGroup.add(coreMesh);
        }

        scene.add(tendrilGroup);
      }

      // --- Bioluminescent Marine Snow / Deep-Sea Spores ---
      function createMarineSpores() {
        if (sporePoints) {
          scene.remove(sporePoints);
          sporeGeo.dispose();
          sporeMat.dispose();
        }

        sporeGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(config.sporeCount * 3);
        const scales = new Float32Array(config.sporeCount);
        const phases = new Float32Array(config.sporeCount);
        const colorWeights = new Float32Array(config.sporeCount);

        for (let i = 0; i < config.sporeCount; i++) {
          const radius = 10 + Math.random() * 75;
          const theta = Math.random() * Math.PI * 2;
          const y = -65 + Math.random() * 125;

          positions[i * 3 + 0] = Math.cos(theta) * radius;
          positions[i * 3 + 1] = y;
          positions[i * 3 + 2] = Math.sin(theta) * radius;

          scales[i] = 0.4 + Math.random() * 2.0;
          phases[i] = Math.random() * Math.PI * 2;
          colorWeights[i] = Math.random();
        }

        sporeGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        sporeGeo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
        sporeGeo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
        sporeGeo.setAttribute('aColorWeight', new THREE.BufferAttribute(colorWeights, 1));

        const sporeVertexShader = `
          attribute float aScale;
          attribute float aPhase;
          attribute float aColorWeight;

          varying float vPhase;
          varying float vColorWeight;

          uniform float uTime;
          uniform float uSporeSize;
          uniform float uSporeSpeed;

          void main() {
            vPhase = aPhase;
            vColorWeight = aColorWeight;

            vec3 pos = position;
            float t = uTime * uSporeSpeed * 0.35 + aPhase;
            pos.y += sin(t * 0.6) * 2.2 + cos(t * 0.4) * 1.2;
            pos.x += cos(t * 0.5) * 1.8;
            pos.z += sin(t * 0.5) * 1.8;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (aScale * uSporeSize * 22.0) / -mvPosition.z;
            gl_Position = projectionMatrix * mvPosition;
          }
        `;

        const sporeFragmentShader = `
          varying float vPhase;
          varying float vColorWeight;

          uniform float uTime;
          uniform vec3 uColor1;
          uniform vec3 uColor2;
          uniform vec3 uColor3;
          uniform vec3 uColor4;
          uniform vec3 uColor5;

          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;

            float glow = 1.0 - smoothstep(0.0, 0.5, dist);
            glow = pow(glow, 1.8);

            float twinkle = sin(uTime * 2.2 + vPhase) * 0.3 + 0.7;

            vec3 pCol = mix(uColor1, uColor3, vColorWeight);
            pCol = mix(pCol, uColor5, smoothstep(0.7, 1.0, vColorWeight));

            gl_FragColor = vec4(pCol * 1.1, glow * twinkle * 0.45);
          }
        `;

        sporeMat = new THREE.ShaderMaterial({
          vertexShader: sporeVertexShader,
          fragmentShader: sporeFragmentShader,
          uniforms: {
            uTime: { value: 0 },
            uSporeSize: { value: config.sporeSize },
            uSporeSpeed: { value: config.sporeSpeed },
            uColor1: { value: new THREE.Color(config.color1) },
            uColor2: { value: new THREE.Color(config.color2) },
            uColor3: { value: new THREE.Color(config.color3) },
            uColor4: { value: new THREE.Color(config.color4) },
            uColor5: { value: new THREE.Color(config.color5) }
          },
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        sporePoints = new THREE.Points(sporeGeo, sporeMat);
        scene.add(sporePoints);
      }

      // --- Custom Cinematic Shader Pass (Chromatic Aberration, Vignette, Noise Grain, Levels) ---
      function createCinematicShader() {
        return {
          uniforms: {
            tDiffuse: { value: null },
            resolution: { value: new THREE.Vector2(window.innerWidth * config.dpr, window.innerHeight * config.dpr) },
            enabled: { value: config.postProcessEnabled },
            chromaticAberrationAmount: { value: config.chromaticAberration },
            vignetteBoost: { value: config.vignetteBoost },
            vignetteReduction: { value: config.vignetteReduction },
            noiseIntensity: { value: config.noiseIntensity },
            gammaLevel: { value: config.gamma },
            minInputLevel: { value: config.minInputLevel },
            maxInputLevel: { value: config.maxInputLevel },
            time: { value: 0 }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform vec2 resolution;
            uniform bool enabled;
            uniform float chromaticAberrationAmount;
            uniform float vignetteBoost;
            uniform float vignetteReduction;
            uniform float noiseIntensity;
            uniform float gammaLevel;
            uniform float minInputLevel;
            uniform float maxInputLevel;
            uniform float time;
            varying vec2 vUv;

            vec2 barrelDistortion(vec2 coord, float amt) {
              vec2 cc = coord - 0.5;
              float dist = dot(cc, cc);
              return coord + cc * dist * amt;
            }
            float sat(float t) { return clamp(t, 0.0, 1.0); }
            float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
            float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
            vec4 spectrum_offset(float t) {
              float lo = step(t, 0.5);
              float hi = 1.0 - lo;
              float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
              vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
              return pow(ret, vec4(1.0 / 2.2));
            }
            const float max_distort = 2.2;
            const int num_iter = 8;
            const float reci_num_iter_f = 1.0 / float(num_iter);
            vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount) {
              vec4 sumcol = vec4(0.0);
              vec4 sumw = vec4(0.0);
              for (int i = 0; i < num_iter; ++i) {
                float t = float(i) * reci_num_iter_f;
                vec4 w = spectrum_offset(t);
                sumw += w;
                sumcol += w * texture2D(inputTexture, barrelDistortion(uv, amount * max_distort * t));
              }
              return sumcol / sumw;
            }

            float vignette(vec2 uv, float boost, float reduction) {
              vec2 position = uv - 0.5;
              return boost - length(position) * reduction;
            }

            float hash1(uint n) {
              n = (n << 13U) ^ n;
              n = n * (n * n * 15731U + 789221U) + 1376312589U;
              return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
            }

            float noise(in vec2 uv, in float timeVal) {
              uvec2 p = uvec2(uv);
              return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
            }

            vec3 gammaCorrect(vec3 color, vec3 gamma) {
              return pow(max(color, vec3(0.0)), 1.0 / gamma);
            }
            vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
              return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
            }
            vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
              return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
            }

            void main() {
              if (!enabled) {
                gl_FragColor = texture2D(tDiffuse, vUv);
                return;
              }

              vec4 color = chromaticAberration(tDiffuse, vUv, chromaticAberrationAmount);
              color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
              color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
              color.rgb = finalLevels(color.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
              color.a = 1.0;
              gl_FragColor = color;
            }
          `
        };
      }

      // --- Color & Uniform Sync ---
      function updateMaterialUniforms() {
        const c1 = new THREE.Color(config.color1);
        const c2 = new THREE.Color(config.color2);
        const c3 = new THREE.Color(config.color3);
        const c4 = new THREE.Color(config.color4);
        const c5 = new THREE.Color(config.color5);

        tendrilMaterials.forEach((mat) => {
          mat.uniforms.uColor1.value.copy(c1);
          mat.uniforms.uColor2.value.copy(c2);
          mat.uniforms.uColor3.value.copy(c3);
          mat.uniforms.uColor4.value.copy(c4);
          mat.uniforms.uColor5.value.copy(c5);
          mat.uniforms.uGlowBrightness.value = config.glowBrightness;
          mat.uniforms.uSoftFalloff.value = config.softFalloff;
          mat.uniforms.uPulseSpeed.value = config.pulseSpeed;
          mat.uniforms.uPulseDensity.value = config.pulseDensity;
          mat.uniforms.uSubsurfaceScatter.value = config.subsurfaceScatter;
          mat.uniforms.uSparkleIntensity.value = config.sparkleIntensity;
          mat.uniforms.uWaveIntensity.value = config.waveIntensity;
          mat.uniforms.uWaveFrequency.value = config.waveFrequency;
          mat.uniforms.uDriftSpeed.value = config.driftSpeed;
        });

        if (sporeMat) {
          sporeMat.uniforms.uColor1.value.copy(c1);
          sporeMat.uniforms.uColor2.value.copy(c2);
          sporeMat.uniforms.uColor3.value.copy(c3);
          sporeMat.uniforms.uColor4.value.copy(c4);
          sporeMat.uniforms.uColor5.value.copy(c5);
          sporeMat.uniforms.uSporeSize.value = config.sporeSize;
          sporeMat.uniforms.uSporeSpeed.value = config.sporeSpeed;
        }

        if (cinematicPass) {
          const u = cinematicPass.uniforms;
          u.enabled.value = config.postProcessEnabled;
          u.chromaticAberrationAmount.value = config.chromaticAberration;
          u.vignetteBoost.value = config.vignetteBoost;
          u.vignetteReduction.value = config.vignetteReduction;
          u.noiseIntensity.value = config.noiseIntensity;
          u.gammaLevel.value = config.gamma;
          u.minInputLevel.value = config.minInputLevel;
          u.maxInputLevel.value = config.maxInputLevel;
        }

        if (bloomPass) {
          bloomPass.strength = config.bloomStrength;
          bloomPass.radius = config.bloomRadius;
          bloomPass.threshold = config.bloomThreshold;
        }
      }

      function applyPalette(themeName) {
        if (!COLOR_PALETTES[themeName]) return;
        const pal = COLOR_PALETTES[themeName];
        config.theme = themeName;
        config.color1 = pal.color1;
        config.color2 = pal.color2;
        config.color3 = pal.color3;
        config.color4 = pal.color4;
        config.color5 = pal.color5;

        updateMaterialUniforms();
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      function setGreenScreen(enabled) {
        const bg = enabled ? '#00ff00' : '#02040a';
        scene.background = new THREE.Color(bg);
        document.body.style.backgroundColor = bg;
      }

      // --- Procedural Randomization on Scene Click ---
      function randomizeScene() {
        const paletteKeys = Object.keys(COLOR_PALETTES);
        const randomKey = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
        applyPalette(randomKey);

        config.waveIntensity = +(0.8 + Math.random() * 0.8).toFixed(2);
        config.waveFrequency = +(0.5 + Math.random() * 0.6).toFixed(2);
        config.driftSpeed = +(0.3 + Math.random() * 0.4).toFixed(2);
        config.glowBrightness = +(1.0 + Math.random() * 0.5).toFixed(2);
        config.pulseDensity = +(1.5 + Math.random() * 2.0).toFixed(2);
        config.pulseSpeed = +(0.8 + Math.random() * 0.9).toFixed(2);
        config.exposure = +(0.95 + Math.random() * 0.25).toFixed(2);

        // Randomize Bloom
        config.bloomStrength = +(0.45 + Math.random() * 0.55).toFixed(2);
        config.bloomRadius = +(0.3 + Math.random() * 0.35).toFixed(2);
        config.bloomThreshold = +(0.12 + Math.random() * 0.14).toFixed(2);

        // Randomize Cinematic Post-Processing
        config.chromaticAberration = +(0.02 + Math.random() * 0.05).toFixed(3);
        config.vignetteReduction = +(0.4 + Math.random() * 0.35).toFixed(2);
        config.gamma = +(0.85 + Math.random() * 0.15).toFixed(2);

        renderer.toneMappingExposure = config.exposure;

        buildTendrilNetwork();
        updateMaterialUniforms();

        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      // --- Interaction & Keyboard Event Listeners ---
      function setupInteractionListeners() {
        // Toggle UI with "H" key
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            if (gui._hidden) {
              gui.show();
            } else {
              gui.hide();
            }
          }
        });

        // Click detection without dragging for Procedural Scene Randomization
        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', (e) => {
          pointerDownPos = { x: e.clientX, y: e.clientY };
          pointerDownTime = performance.now();
        });

        dom.addEventListener('pointerup', (e) => {
          const deltaX = Math.abs(e.clientX - pointerDownPos.x);
          const deltaY = Math.abs(e.clientY - pointerDownPos.y);
          const duration = performance.now() - pointerDownTime;

          if (deltaX < 6 && deltaY < 6 && duration < 300) {
            if (config.clickToRandomize) {
              randomizeScene();
            }
          }
        });
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
        if (smaaPass) {
          smaaPass.setSize(window.innerWidth * config.dpr, window.innerHeight * config.dpr);
        }
        if (cinematicPass) {
          cinematicPass.uniforms.resolution.value.set(window.innerWidth * config.dpr, window.innerHeight * config.dpr);
        }
      }

      // --- 5 Smooth Camera Animation Presets ---
      function updateCameraAnimation(delta) {
        const t = globalTime * 0.2;

        switch (config.animationPreset) {
          case 'Deep Abyssal Drift':
            camState.orbitAngle += delta * 0.08 * config.speedMultiplier;
            camState.swayAngle += delta * 0.15 * config.speedMultiplier;
            const r = 50.4 + Math.sin(camState.swayAngle * 0.5) * 6;
            camera.position.x = 5.34 + Math.sin(camState.orbitAngle) * r;
            camera.position.z = -33.12 + Math.cos(camState.orbitAngle) * r;
            camera.position.y = -77.74 + Math.sin(camState.swayAngle) * 5;
            controls.target.set(5.34, -86.75 + Math.sin(camState.swayAngle * 0.8) * 3, -33.12);
            break;

          case 'Bioluminescent Bloom':
            camState.swayAngle += delta * 0.25 * config.speedMultiplier;
            const bloomRadius = 50.4 + Math.sin(camState.swayAngle) * 14;
            camera.position.x = 5.34 + Math.sin(t * 0.3) * bloomRadius;
            camera.position.z = -33.12 + Math.cos(t * 0.3) * bloomRadius;
            camera.position.y = -77.74 + Math.cos(camState.swayAngle * 0.7) * 6;
            controls.target.set(5.34, -86.75, -33.12);
            break;

          case 'Current Flow':
            camState.verticalDrift = (camState.verticalDrift + delta * 3.0 * config.speedMultiplier) % 40;
            camera.position.x = -0.32 + Math.sin(t * 0.2) * 8;
            camera.position.z = 50.4;
            camera.position.y = -95 + camState.verticalDrift;
            controls.target.set(5.34, camera.position.y - 9, -33.12);
            break;

          case 'Spiraling Tendrils':
            camState.orbitAngle += delta * 0.18 * config.speedMultiplier;
            const spiralH = Math.sin(camState.orbitAngle * 0.8) * 12 - 77.74;
            camera.position.x = 5.34 + Math.sin(camState.orbitAngle) * 50.4;
            camera.position.z = -33.12 + Math.cos(camState.orbitAngle) * 50.4;
            camera.position.y = spiralH;
            controls.target.set(5.34, -86.75, -33.12);
            break;

          case 'Static Sanctuary':
          default:
            break;
        }
      }

      // --- Main Render & Animation Loop ---
      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const effectiveSpeed = delta * config.speedMultiplier;
        globalTime += effectiveSpeed;

        // Auto Growth System (Cycles smoothly 0 -> 1 -> restart)
        if (config.autoGrowthLoop) {
          growthTimer += effectiveSpeed * config.growthSpeed * 0.5;
          const cycle = growthTimer % 2.0;
          if (cycle <= 1.0) {
            config.growthProgress = Math.min(1.0, cycle * 1.15);
          } else {
            const resetPhase = cycle - 1.0;
            if (resetPhase > 0.85) {
              config.growthProgress = (1.0 - resetPhase) / 0.15;
            } else {
              config.growthProgress = 1.0;
            }
          }
        }

        // Update Shader Uniforms
        tendrilMaterials.forEach((m) => {
          m.uniforms.uTime.value = globalTime;
          m.uniforms.uGrowth.value = config.growthProgress;
        });

        if (sporeMat) {
          sporeMat.uniforms.uTime.value = globalTime;
        }

        if (cinematicPass) {
          cinematicPass.uniforms.time.value = Math.random() * 100000;
        }

        // Apply Camera Animation Preset if not being manually dragged
        if (!controls.state || controls.state === -1) {
          updateCameraAnimation(delta);
        }

        controls.update();

        // Render through EffectComposer
        composer.render();
      }

      // --- Main Initialization ---
      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(config.greenScreen ? '#00ff00' : '#02040a');

        // Camera framed according to user-selected placement
        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 1000);
        camera.position.set(-0.32, -77.74, 50.4);

        renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: 'high-performance',
          alpha: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(config.dpr);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = config.exposure;
        document.body.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.minDistance = 12;
        controls.maxDistance = 350;
        controls.target.set(5.34, -86.75, -33.12);

        // EffectComposer Post-Processing Pipeline
        const renderTarget = new THREE.WebGLRenderTarget(
          window.innerWidth * config.dpr,
          window.innerHeight * config.dpr,
          {
            type: THREE.HalfFloatType,
            format: THREE.RGBAFormat,
            samples: 4
          }
        );

        composer = new EffectComposer(renderer, renderTarget);
        composer.setPixelRatio(config.dpr);

        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        smaaPass = new SMAAPass(window.innerWidth * config.dpr, window.innerHeight * config.dpr);
        composer.addPass(smaaPass);

        // Standalone Unreal Bloom Pass
        bloomPass = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          config.bloomStrength,
          config.bloomRadius,
          config.bloomThreshold
        );
        composer.addPass(bloomPass);

        // Cinematic Post-Processing Pass (Chromatic Aberration, Vignette, Noise, Levels)
        cinematicPass = new ShaderPass(createCinematicShader());
        composer.addPass(cinematicPass);

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        buildTendrilNetwork();
        createMarineSpores();

        setupGUI();
        setupInteractionListeners();

        window.addEventListener('resize', onWindowResize);
      }

      // Launch application
      init();
      animate();
    </script>
  </body>
</html>
