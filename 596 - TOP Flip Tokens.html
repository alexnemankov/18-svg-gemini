        lgt: ['#F0F0F0', '#E0E0E0', '#C8D6E5', '#D1D8E0', '#FAFAFA'],
        med: ['#FF0000', '#0984E3'],
        drk: ['#000000', '#2D3436', '#1E272E', '#130F40']
      }

    // =========================================================================
    // CREATIVE CODING CONFIGURATION & PARAMS
    // =========================================================================
    const SCHEME_KEYS = Object.keys(COLOR_SCHEMES);

    const params = {
      // Color & Theme
      paletteScheme: 'Original',
      randomizeOnClick: true,
      customBg: false,
      bgColor: '#E8E0E0',

      // Automatic Rotation & Dynamics
      autoRotate: true,
      globalSpeed: 1.0,
      motionMode: 'Independent Spin', // 'Independent Spin', 'Domino Wave', 'Synchronized Rhythm', 'Diagonal Cascade', 'Vortex Swirl'
      directionMode: 'Mixed (Alternating)', // 'Mixed (Alternating)', 'Clockwise', 'Counter-Clockwise'
      waveFreqX: 2.2,
      waveFreqY: 1.8,
      mouseReaction: 'Spin Accelerate', // 'Spin Accelerate', 'Tilt / Orient', 'Wave Ripple', 'None'

      // Token Geometry
      rowCount: 8,
      rowHeightMode: 'Varied (Original)', // 'Varied (Original)', 'Uniform Rows'
      thickness: 18,
      tokenSpacing: 0,
      layoutMode: 'Original Dynamic Walk', // 'Original Dynamic Walk', 'Equispaced Slots', 'Staggered Grid'

      // Pattern & Risograph Aesthetics
      renderQuality: 'High-Performance Stipple (60 FPS)', // 'High-Performance Stipple (60 FPS)', 'Hardware Gradients + Film Grain', 'Live Procedural Noise'
      noiseDensity: 0.3,
      filmGrainOverlay: true,
      grainOpacity: 0.07,

      // Viewport & UX
      viewportMode: 'Fullscreen', // 'Fullscreen', 'Square 1:1', 'Print 4:5'
      showHUD: true
    };

    // Active color sets mapped from selected palette
    let BG = COLOR_SCHEMES.Original.bg;
    let LGT = [...COLOR_SCHEMES.Original.lgt];
    let MED = [...COLOR_SCHEMES.Original.med];
    let DRK = [...COLOR_SCHEMES.Original.drk];

    // Original sketch dimensions & global parameters
    const DIM = 800;
    const N = 8;
    let SZ = DIM / N;
    let THICKNESS = 18;

    // Pattern engine internal state
    let _patternColorsArr = [BG, LGT[0]];
    let _patternAngleVal = 0;
    let _patternFunc = null;

    // Noise Grain Overlay Canvas
    let grainCanvas = null;

    // Offscreen background buffer
    let bgBuffer = null;

    // Grid token items
    let tokens = [];

    // Animation time tracker
    let animTime = 0;
    let lastMillis = 0;

    // Toast helper
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    // =========================================================================
    // PATTERN ENGINE (Self-Contained Full p5.pattern Implementation)
    // =========================================================================
    // Functions to set pattern state
    function patternColors(cols) {
      if (Array.isArray(cols)) {
        _patternColorsArr = cols.slice();
      }
      return _patternColorsArr;
    }

    function patternAngle(angle) {
      if (typeof angle === 'number') {
        _patternAngleVal = angle;
      }
      return _patternAngleVal;
    }

    function pattern(func) {
      _patternFunc = func;
    }

    // Pattern drawing primitives
    const PTN = {
      // Noise gradient pattern
      // patternColors()[0] base color
      // patternColors()[1] dot color
      // @param {Number} _density Density of dots. default = 0.2
      noiseGrad: function(_density = 0.2) {
        const func = function(_w, _h, _rt = window) {
          const density = Math.min(1, Math.max(0, _density));
          const c = (typeof _rt.patternColors === 'function') ? _rt.patternColors() : patternColors();
          const num = Math.floor(_w * _h * density * 0.12);
          const ns = 0.01;

          if (typeof _rt.rectMode === 'function') _rt.rectMode(CORNER);
          if (typeof _rt.ellipseMode === 'function') _rt.ellipseMode(CENTER);
          if (typeof _rt.noStroke === 'function') _rt.noStroke();

          if (typeof _rt.fill === 'function') _rt.fill(c[0]);
          if (typeof _rt.rect === 'function') _rt.rect(0, 0, _w, _h);

          if (typeof _rt.fill === 'function') _rt.fill(c[1 % c.length]);
          for (let i = 0; i < num; i++) {
            const g = Math.abs(randomGaussian()) / 5;
            const x = g * _w;
            const y = random(_h);
            const dia = noise(x * ns, y * ns) * 0.5 + 1.2;
            if (typeof _rt.ellipse === 'function') _rt.ellipse(x, y, dia, dia);
          }
        };
        return func;
      }
    };

    // Shape drawing with active pattern
    function rectPattern(x, y, w, h, targetGfx = null) {
      const ctx = targetGfx ? targetGfx.drawingContext : drawingContext;
      const rt = targetGfx || window;

      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      const diag = Math.sqrt(w * w + h * h) * 1.5;
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(_patternAngleVal);
      ctx.translate(-diag / 2, -diag / 2);

      if (typeof _patternFunc === 'function') {
        _patternFunc(diag, diag, rt);
      } else {
        rt.fill(_patternColorsArr[0]);
        rt.rect(0, 0, diag, diag);
      }
      ctx.restore();
    }

    function ellipsePattern(cx, cy, w, h, targetGfx = null) {
      const ctx = targetGfx ? targetGfx.drawingContext : drawingContext;
      const rt = targetGfx || window;

      const rx = Math.max(0.1, Math.abs(w) / 2);
      const ry = Math.max(0.1, Math.abs(h) / 2);

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();

      const diag = Math.sqrt(w * w + h * h) * 1.5;
      ctx.translate(cx, cy);
      ctx.rotate(_patternAngleVal);
      ctx.translate(-diag / 2, -diag / 2);

      if (typeof _patternFunc === 'function') {
        _patternFunc(diag, diag, rt);
      } else {
        rt.fill(_patternColorsArr[0]);
        rt.rect(0, 0, diag, diag);
      }
      ctx.restore();
    }

    // Gradient helper presets matching original source code
    // Set the pattern to a light - medium gradient
    function lightGrad() {
      patternAngle(random(TAU));
      patternColors([random(LGT), random(MED)]);
    }

    // Set the pattern to a dark - medium gradient
    function medGrad() {
      patternAngle(random(TAU));
      patternColors([random(MED), random(LGT.concat(DRK))]);
    }

    // Set the pattern to a medium - anything gradient
    function darkGrad() {
      patternAngle(random(DRK), random(MED));
    }

    // =========================================================================
    // HIGH-PERFORMANCE PROCEDURAL GRAIN & TEXTURE BAKING
    // =========================================================================
    // Generate fine organic risograph / film grain canvas pattern
    function createGrainPattern() {
      const grainSize = 256;
      grainCanvas = document.createElement('canvas');
      grainCanvas.width = grainSize;
      grainCanvas.height = grainSize;
      const gctx = grainCanvas.getContext('2d');
      const imgData = gctx.createImageData(grainSize, grainSize);
      const data = imgData.data;

      for (let i = 0; i < data.length; i += 4) {
        const val = Math.floor(Math.random() * 255);
        data[i] = val;
        data[i + 1] = val;
        data[i + 2] = val;
        data[i + 3] = Math.floor(Math.random() * 45); // subtle alpha
      }
      gctx.putImageData(imgData, 0, 0);
    }

    // Bake texture with genuine PTN.noiseGrad dot stipples for a token face or edge
    function bakeStippleTexture(w, h, colBase, colDot, angle, density, isCircle = false) {
      const gw = Math.max(1, Math.ceil(w));
      const gh = Math.max(1, Math.ceil(h));
      const gfx = createGraphics(gw, gh);
      gfx.pixelDensity(1);
      gfx.rectMode(CORNER);
      gfx.ellipseMode(CENTER);
      gfx.noStroke();

      const ctx = gfx.drawingContext;
      ctx.save();

      if (isCircle) {
        ctx.beginPath();
        ctx.ellipse(gw / 2, gh / 2, Math.max(0.1, w / 2), Math.max(0.1, h / 2), 0, 0, Math.PI * 2);
        ctx.clip();
      } else {
        ctx.beginPath();
        ctx.rect(0, 0, w, h);
        ctx.clip();
      }

      // Draw rotated noise gradient
      ctx.save();
      ctx.translate(gw / 2, gh / 2);
      ctx.rotate(angle);
      const diag = Math.sqrt(gw * gw + gh * gh) * 1.5;
      ctx.translate(-diag / 2, -diag / 2);

      // Base color fill
      gfx.fill(colBase);
      gfx.rect(0, 0, diag, diag);

      // Gaussian stippled dots
      gfx.fill(colDot);
      const dotCount = Math.floor(diag * diag * Math.min(0.5, density) * 0.1);
      const ns = 0.012;
      for (let i = 0; i < dotCount; i++) {
        const g = Math.abs(randomGaussian()) / 5;
        const x = Math.min(diag, g * diag);
        const y = random(diag);
        const dia = noise(x * ns, y * ns) * 0.6 + 1.2;
        gfx.ellipse(x, y, dia, dia);
      }

      ctx.restore();
      ctx.restore();
      return gfx;
    }

    // Rebuild the textured gradient background buffer
    function buildBackgroundBuffer() {
      if (bgBuffer) bgBuffer.remove();
      bgBuffer = createGraphics(width, height);
      bgBuffer.pixelDensity(1);
      bgBuffer.rectMode(CORNER);
      bgBuffer.noStroke();

      // Background fill
      bgBuffer.background(BG);

      // Gradient background :3
      const bgGradAngle = random(TAU);
      const bgGradColor = random(LGT);
      const ctx = bgBuffer.drawingContext;

      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(bgGradAngle);
      const diag = Math.sqrt(width * width + height * height) * 1.4;
      ctx.translate(-diag / 2, -diag / 2);

      // Base fill
      bgBuffer.fill(BG);
      bgBuffer.rect(0, 0, diag, diag);

      // Stippled noise dots
      bgBuffer.fill(bgGradColor);
      const dotCount = Math.floor(diag * diag * (params.noiseDensity * 0.035));
      const ns = 0.008;
      for (let i = 0; i < dotCount; i++) {
        const g = Math.abs(randomGaussian()) / 5;
        const x = Math.min(diag, g * diag);
        const y = random(diag);
        const dia = noise(x * ns, y * ns) * 1.4 + 1.0;
        bgBuffer.ellipse(x, y, dia, dia);
      }
      ctx.restore();
    }

    // =========================================================================
    // TOKEN CLASS & ROW GENERATION
    // =========================================================================
    class TokenItem {
      constructor(cx, cy, r, baseProg, thickness) {
        this.cx = cx;
        this.cy = cy;
        this.r = r;
        this.baseProg = baseProg;
        this.thickness = thickness;

        // Individual rotation velocity and direction
        const dir = (params.directionMode === 'Clockwise') ? 1 :
                    (params.directionMode === 'Counter-Clockwise') ? -1 :
                    (random() < 0.5 ? 1 : -1);
        this.speed = random(0.85, 1.4) * dir;
        this.phase = random(TAU);
        this.mouseImpulse = 0;

        // Color & angle assignments matching original distribution
        this.colEdgeBase = random(MED);
        this.colEdgeDot = random(LGT.concat(DRK));
        this.angleEdge = random(TAU);

        this.colLightBase = random(LGT);
        this.colLightDot = random(MED);
        this.angleLight = random(TAU);

        this.colDarkBase = random(DRK);
        this.colDarkDot = random(MED);
        this.angleDark = random(TAU);

        // Pre-baked texture graphics
        this.edgeGfx = null;
        this.frontGfx = null;
        this.backGfx = null;
        this.bakeTextures();
      }

      bakeTextures() {
        if (this.edgeGfx) this.edgeGfx.remove();
        if (this.frontGfx) this.frontGfx.remove();
        if (this.backGfx) this.backGfx.remove();

        // Edge rectangle texture
        this.edgeGfx = bakeStippleTexture(
          this.thickness, this.r,
          this.colEdgeBase, this.colEdgeDot,
          this.angleEdge, params.noiseDensity, false
        );

        // Front circular face texture
        this.frontGfx = bakeStippleTexture(
          this.r, this.r,
          this.colLightBase, this.colLightDot,
          this.angleLight, params.noiseDensity, true
        );

        // Back circular face texture
        this.backGfx = bakeStippleTexture(
          this.r, this.r,
          this.colDarkBase, this.colDarkDot,
          this.angleDark, params.noiseDensity, true
        );
      }

      getProg(t) {
        let prog = this.baseProg;

        if (params.autoRotate) {
          if (params.motionMode === 'Independent Spin') {
            prog += t * this.speed * params.globalSpeed;
          } else if (params.motionMode === 'Domino Wave') {
            const waveX = (this.cx / width) * params.waveFreqX * TAU;
            const waveY = (this.cy / height) * params.waveFreqY * TAU;
            prog = this.baseProg + t * 2.2 * params.globalSpeed - waveX - waveY;
          } else if (params.motionMode === 'Synchronized Rhythm') {
            prog = t * 2.0 * params.globalSpeed;
          } else if (params.motionMode === 'Diagonal Cascade') {
            const diagNorm = (this.cx + this.cy) / (width + height);
            prog = t * 2.5 * params.globalSpeed - diagNorm * TAU * 3.0;
          } else if (params.motionMode === 'Vortex Swirl') {
            const d = dist(this.cx, this.cy, width / 2, height / 2);
            prog = t * 2.2 * params.globalSpeed - d * 0.015;
          }
        }

        // Apply mouse interaction
        prog += this.mouseImpulse;
        return prog;
      }

      updateMouse(mx, my) {
        if (params.mouseReaction === 'Spin Accelerate') {
          const d = dist(this.cx, this.cy, mx, my);
          if (d < 160) {
            const force = (1 - d / 160) * 0.12;
            this.mouseImpulse += force;
          }
        } else if (params.mouseReaction === 'Wave Ripple') {
          const d = dist(this.cx, this.cy, mx, my);
          const ripple = Math.sin(animTime * 6.0 - d * 0.04) * 0.3 * Math.exp(-d * 0.005);
          this.mouseImpulse = ripple;
        } else if (params.mouseReaction === 'Tilt / Orient') {
          const angleToMouse = Math.atan2(my - this.cy, mx - this.cx);
          this.mouseImpulse += (angleToMouse - this.mouseImpulse) * 0.05;
        }
      }

      draw(t) {
        const prog = this.getProg(t);

        // p is the orientation of the token from -1 to 1
        const p = Math.sin(prog);
        const tokenW = Math.abs(p) * this.r;
        // Determines colour of face
        const side = (p > 0);

        // Centered coordinates matching original math
        const x = this.cx - tokenW / 2;
        const y = this.cy - this.r / 2;

        if (params.renderQuality === 'High-Performance Stipple (60 FPS)') {
          this.drawCached(x, y, tokenW, this.r, side);
        } else if (params.renderQuality === 'Hardware Gradients + Film Grain') {
          this.drawHardwareGradient(x, y, tokenW, this.r, side);
        } else {
          // Live Procedural Noise
          token(x, y, tokenW, this.r, side);
        }
      }

      // Fast cached renderer: preserves original offsets, translations and depth stacking
      drawCached(x, y, w, h, side) {
        push();
        const T = this.thickness;
        const cx = x + w / 2;
        const cy = y + h / 2;

        if (side) {
          translate(T / 2, 0);

          // Edge rectangle: rectPattern(x + w/2 - THICKNESS, y, THICKNESS, h)
          if (this.edgeGfx) {
            image(this.edgeGfx, cx - T, y, T, h);
          }

          // Rear rim ellipse: ellipsePattern(x + w/2, y + h/2, w, h)
          fill(this.colEdgeBase);
          ellipse(cx, cy, w, h);

          // Front base ellipse: ellipsePattern(x + w/2 - THICKNESS, y + h/2, w, h)
          fill(this.colEdgeBase);
          ellipse(cx - T, cy, w, h);

          // Front illuminated face: ellipsePattern(x + w/2 - THICKNESS, y + h/2, w, h) with lightGrad
          if (this.frontGfx && w >= 0.5) {
            imageMode(CENTER);
            image(this.frontGfx, cx - T, cy, w, h);
            imageMode(CORNER);
          }
        } else {
          translate(-T / 2, 0);

          // Edge rectangle: rectPattern(x + w/2, y, THICKNESS, h)
          if (this.edgeGfx) {
            image(this.edgeGfx, cx, y, T, h);
          }

          // Front rim ellipse: ellipsePattern(x + w/2, y + h/2, w, h)
          fill(this.colEdgeBase);
          ellipse(cx, cy, w, h);

          // Back base ellipse: ellipsePattern(x + w/2 + THICKNESS, y + h/2, w, h)
          fill(this.colEdgeBase);
          ellipse(cx + T, cy, w, h);

          // Back shadow face: ellipsePattern(x + w/2 + THICKNESS, y + h/2, w, h) with darkGrad
          if (this.backGfx && w >= 0.5) {
            imageMode(CENTER);
            image(this.backGfx, cx + T, cy, w, h);
            imageMode(CORNER);
          }
        }
        pop();
      }

      // Hardware Canvas2D linear gradients for maximum speed
      drawHardwareGradient(x, y, w, h, side) {
        push();
        const ctx = drawingContext;
        const T = this.thickness;
        const cx = x + w / 2;
        const cy = y + h / 2;

        if (side) {
          translate(T / 2, 0);

          // Edge rect
          ctx.save();
          const gradEdge = ctx.createLinearGradient(cx - T, y, cx, y + h);
          gradEdge.addColorStop(0, this.colEdgeBase);
          gradEdge.addColorStop(1, this.colEdgeDot);
          ctx.fillStyle = gradEdge;
          ctx.fillRect(cx - T, y, T, h);
          ctx.restore();

          // Rim ellipse
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(cx, cy, Math.max(0.1, w / 2), Math.max(0.1, h / 2), 0, 0, Math.PI * 2);
          ctx.fillStyle = this.colEdgeBase;
          ctx.fill();
          ctx.restore();

          // Front face ellipse
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(cx - T, cy, Math.max(0.1, w / 2), Math.max(0.1, h / 2), 0, 0, Math.PI * 2);
          const gradFace = ctx.createLinearGradient(cx - T - w / 2, cy - h / 2, cx - T + w / 2, cy + h / 2);
          gradFace.addColorStop(0, this.colLightBase);
          gradFace.addColorStop(1, this.colLightDot);
          ctx.fillStyle = gradFace;
          ctx.fill();
          ctx.restore();
        } else {
          translate(-T / 2, 0);

          // Edge rect
          ctx.save();
          const gradEdge = ctx.createLinearGradient(cx, y, cx + T, y + h);
          gradEdge.addColorStop(0, this.colEdgeBase);
          gradEdge.addColorStop(1, this.colEdgeDot);
          ctx.fillStyle = gradEdge;
          ctx.fillRect(cx, y, T, h);
          ctx.restore();

          // Rim ellipse
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(cx, cy, Math.max(0.1, w / 2), Math.max(0.1, h / 2), 0, 0, Math.PI * 2);
          ctx.fillStyle = this.colEdgeBase;
          ctx.fill();
          ctx.restore();

          // Back face ellipse
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(cx + T, cy, Math.max(0.1, w / 2), Math.max(0.1, h / 2), 0, 0, Math.PI * 2);
          const gradBack = ctx.createLinearGradient(cx + T - w / 2, cy - h / 2, cx + T + w / 2, cy + h / 2);
          gradBack.addColorStop(0, this.colDarkBase);
          gradBack.addColorStop(1, this.colDarkDot);
          ctx.fillStyle = gradBack;
          ctx.fill();
          ctx.restore();
        }
        pop();
      }
    }

    // =========================================================================
    // ORIGINAL SOURCE SNIPPET TOKEN FUNCTION (Exact Formula Preserved)
    // =========================================================================
    function token(x, y, w, h, side) {
      push();
      // Behold! Spaghetti
      if (side) {
        medGrad();
        translate(THICKNESS / 2, 0);
        rectPattern(x + w / 2 - THICKNESS, y, THICKNESS, h);
        ellipsePattern(x + w / 2, y + h / 2, w, h);
        ellipsePattern(x + w / 2 - THICKNESS, y + h / 2, w, h);
        lightGrad();
        ellipsePattern(x + w / 2 - THICKNESS, y + h / 2, w, h);
      } else {
        medGrad();
        translate(-THICKNESS / 2, 0);
        rectPattern(x + w / 2, y, THICKNESS, h);
        ellipsePattern(x + w / 2, y + h / 2, w, h);
        ellipsePattern(x + w / 2 + THICKNESS, y + h / 2, w, h);
        darkGrad();
        ellipsePattern(x + w / 2 + THICKNESS, y + h / 2, w, h);
      }
      pop();
    }

    // =========================================================================
    // GRID GENERATION (Fullscreen Responsive & Varied Rows)
    // =========================================================================
    function generateGrid() {
      tokens = [];
      SZ = height / params.rowCount;
      THICKNESS = params.thickness;

      let curY = 0;
      let rowIndex = 0;

      while (curY < height) {
        let sz = SZ;

        if (params.rowHeightMode === 'Varied (Original)') {
          // Pick a random token size for each row
          sz = (random() < 0.5) ? SZ : (random() < 0.5) ? SZ / 2 : SZ * 2;
          // Ending row is flush with bottom of screen
          if (height - curY < SZ * 2) sz = SZ;
          if (height - curY < SZ) sz = height - curY;
        }

        if (sz <= 4) break;

        generateRowTokens(-40, curY, width + 80, sz, rowIndex);
        curY += sz;
        rowIndex++;
      }

      document.getElementById('token-stat').innerText = `● ${tokens.length} Tokens`;
    }

    // Generate tokens for a single row across horizontal range
    function generateRowTokens(x, y, w, r, rowIdx) {
      const cy = y + r / 2;
      let prog = random(TAU);

      if (params.layoutMode === 'Original Dynamic Walk') {
        let curX = x;
        while (curX < x + w) {
          const p = Math.sin(prog);
          const tokenW = Math.abs(p) * r;
          const cx = curX + tokenW / 2;

          tokens.push(new TokenItem(cx, cy, r, prog, THICKNESS));

          curX += tokenW + THICKNESS + params.tokenSpacing;
          prog += random(0.5, 1.0);
        }
      } else if (params.layoutMode === 'Equispaced Slots') {
        const slotWidth = r * 0.75 + THICKNESS + params.tokenSpacing;
        const count = Math.ceil(w / slotWidth) + 1;
        for (let i = 0; i < count; i++) {
          const cx = x + i * slotWidth;
          tokens.push(new TokenItem(cx, cy, r, prog, THICKNESS));
          prog += random(0.5, 1.0);
        }
      } else if (params.layoutMode === 'Staggered Grid') {
        const slotWidth = r * 0.8 + THICKNESS + params.tokenSpacing;
        const offset = (rowIdx % 2 === 1) ? slotWidth * 0.5 : 0;
        const count = Math.ceil(w / slotWidth) + 2;
        for (let i = 0; i < count; i++) {
          const cx = x + i * slotWidth + offset;
          tokens.push(new TokenItem(cx, cy, r, prog, THICKNESS));
          prog += random(0.5, 1.0);
        }
      }
    }

    // =========================================================================
    // P5 SETUP & DRAW LIFECYCLE
    // =========================================================================
    function setup() {
      updateCanvasDimensions();
      const c = createCanvas(targetWidth, targetHeight);
      c.parent('canvas-container');

      noStroke();
      pattern(PTN.noiseGrad(params.noiseDensity));
      createGrainPattern();
      buildBackgroundBuffer();
      generateGrid();

      initGUI();
      updateHUD();
      lastMillis = millis();
    }

    let targetWidth = 800;
    let targetHeight = 800;

    function updateCanvasDimensions() {
      const container = document.getElementById('canvas-container');
      const winW = window.innerWidth;
      const winH = window.innerHeight;

      if (params.viewportMode === 'Fullscreen') {
        targetWidth = winW;
        targetHeight = winH;
        container.classList.remove('framed-view');
      } else if (params.viewportMode === 'Square 1:1') {
        const minDim = Math.min(winW, winH) * 0.9;
        targetWidth = Math.floor(minDim);
        targetHeight = Math.floor(minDim);
        container.classList.add('framed-view');
      } else if (params.viewportMode === 'Print 4:5') {
        let h = winH * 0.9;
        let w = h * 0.8;
        if (w > winW * 0.9) {
          w = winW * 0.9;
          h = w * 1.25;
        }
        targetWidth = Math.floor(w);
        targetHeight = Math.floor(h);
        container.classList.add('framed-view');
      }
    }

    function windowResized() {
      updateCanvasDimensions();
      resizeCanvas(targetWidth, targetHeight);
      buildBackgroundBuffer();
      generateGrid();
    }

    function draw() {
      const now = millis();
      const dt = (now - lastMillis) * 0.001;
      lastMillis = now;

      if (params.autoRotate) {
        animTime += dt;
      }

      // Draw textured background
      if (bgBuffer) {
        image(bgBuffer, 0, 0);
      } else {
        background(BG);
      }

      // Update tokens under mouse
      for (let t of tokens) {
        t.updateMouse(mouseX, mouseY);
      }

      // Draw all animated tokens
      for (let t of tokens) {
        t.draw(animTime);
      }

      // Apply organic risograph / film grain overlay
      if (params.filmGrainOverlay && grainCanvas) {
        const ctx = drawingContext;
        ctx.save();
        ctx.globalAlpha = params.grainOpacity;
        ctx.globalCompositeOperation = 'multiply';
        const pattern = ctx.createPattern(grainCanvas, 'repeat');
        ctx.fillStyle = pattern;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
      }

      // Update HUD stats
      if (frameCount % 15 === 0) {
        document.getElementById('fps-stat').innerText = `● ${Math.round(frameRate())} FPS`;
      }
    }

    // =========================================================================
    // THEME & RANDOMIZATION CONTROLLER
    // =========================================================================
    function applyPalette(schemeKey, updateBgColor = true) {
      if (!COLOR_SCHEMES[schemeKey]) {
        schemeKey = 'Original';
      }
      params.paletteScheme = schemeKey;
      const scheme = COLOR_SCHEMES[schemeKey];

      BG = scheme.bg;
      LGT = [...scheme.lgt];
      MED = [...scheme.med];
      DRK = [...scheme.drk];

      if (updateBgColor) {
        params.bgColor = BG;
      }

      buildBackgroundBuffer();

      // Refresh baked textures for existing tokens or regenerate
      for (let t of tokens) {
        t.colEdgeBase = random(MED);
        t.colEdgeDot = random(LGT.concat(DRK));
        t.angleEdge = random(TAU);

        t.colLightBase = random(LGT);
        t.colLightDot = random(MED);
        t.angleLight = random(TAU);

        t.colDarkBase = random(DRK);
        t.colDarkDot = random(MED);
        t.angleDark = random(TAU);

        t.bakeTextures();
      }

      updateHUD();
      if (window.guiInstance) {
        window.guiInstance.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // Procedural randomization triggered on user click or 'R' key
    function randomizeScene() {
      // Pick random palette different from current
      const available = SCHEME_KEYS.filter(k => k !== params.paletteScheme);
      const nextKey = available[Math.floor(Math.random() * available.length)];

      // Re-roll geometric & motion parameters
      params.thickness = Math.floor(random(10, 28));
      params.globalSpeed = Math.round(random(0.6, 1.8) * 10) / 10;
      params.noiseDensity = Math.round(random(0.18, 0.42) * 100) / 100;

      const motionModes = ['Independent Spin', 'Domino Wave', 'Synchronized Rhythm', 'Diagonal Cascade', 'Vortex Swirl'];
      params.motionMode = motionModes[Math.floor(Math.random() * motionModes.length)];

      const dirModes = ['Mixed (Alternating)', 'Clockwise', 'Counter-Clockwise'];
      params.directionMode = dirModes[Math.floor(Math.random() * dirModes.length)];

      const layoutModes = ['Original Dynamic Walk', 'Equispaced Slots', 'Staggered Grid'];
      params.layoutMode = layoutModes[Math.floor(Math.random() * layoutModes.length)];

      applyPalette(nextKey, true);
      generateGrid();

      showToast(`🎲 ${COLOR_SCHEMES[nextKey].name} • ${params.motionMode}`);
    }

    function updateHUD() {
      const curScheme = COLOR_SCHEMES[params.paletteScheme] || COLOR_SCHEMES.Original;
      document.getElementById('badge-theme').innerText = curScheme.name;
      document.getElementById('mode-stat').innerText = `● ${params.motionMode}`;
    }

    // =========================================================================
    // USER INTERACTION & SHORTCUTS
    // =========================================================================
    function mousePressed(e) {
      // Ignore clicks on lil-gui controls, buttons or inputs
      if (e && e.target && (e.target.closest('.lil-gui') || e.target.closest('#hud') || e.target.closest('button') || e.target.closest('input'))) {
        return;
      }

      if (params.randomizeOnClick) {
        randomizeScene();
      }
    }

    function keyPressed() {
      // Spacebar: Pause / Resume animation
      if (key === ' ' || keyCode === 32) {
        params.autoRotate = !params.autoRotate;
        showToast(params.autoRotate ? '▶ Auto-Rotation Resumed' : '⏸ Auto-Rotation Paused');
        if (window.guiInstance) window.guiInstance.controllersRecursive().forEach(c => c.updateDisplay());
      }
      // 'R' or 'r': Randomize
      else if (key === 'r' || key === 'R') {
        randomizeScene();
      }
      // 'F' or 'f': Fullscreen toggle
      else if (key === 'f' || key === 'F') {
        toggleFullscreen();
      }
      // 'H' or 'h': Toggle HUD
      else if (key === 'h' || key === 'H') {
        params.showHUD = !params.showHUD;
        const hud = document.getElementById('hud');
        if (params.showHUD) hud.classList.remove('hidden');
        else hud.classList.add('hidden');
        if (window.guiInstance) window.guiInstance.controllersRecursive().forEach(c => c.updateDisplay());
      }
      // 'S' or 's': Save High-Res PNG
      else if (key === 's' || key === 'S') {
        saveCanvas(`flip-tokens-${Date.now()}`, 'png');
        showToast('📸 Screenshot Saved');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // =========================================================================
    // LIL-GUI CONTROL PANEL SETUP
    // =========================================================================
    function initGUI() {
      const GUIClass = window.lil?.GUI || window.GUI;
      if (!GUIClass) return;

      const gui = new GUIClass({ title: 'Flip Tokens Controls', width: 310 });
      window.guiInstance = gui;

      // 1. Theme & 19 Color Schemes
      const fTheme = gui.addFolder('19 Curated Color Schemes');
      const paletteOptions = {};
      for (let k in COLOR_SCHEMES) {
        paletteOptions[COLOR_SCHEMES[k].name] = k;
      }

      fTheme.add(params, 'paletteScheme', paletteOptions).name('Preset').listen().onChange(k => {
        applyPalette(k, true);
        showToast(`Palette: ${COLOR_SCHEMES[k].name}`);
      });

      fTheme.add(params, 'randomizeOnClick').name('Randomize on Click').listen();
      fTheme.addColor(params, 'bgColor').name('Background Color').listen().onChange(v => {
        BG = v;
        buildBackgroundBuffer();
      });

      // 2. Motion & Automatic Rotation
      const fMotion = gui.addFolder('Dynamics & Auto-Rotation');
      fMotion.add(params, 'autoRotate').name('Auto-Rotation').listen();
      fMotion.add(params, 'globalSpeed', 0.1, 3.5, 0.05).name('Rotation Speed').listen();
      fMotion.add(params, 'motionMode', [
        'Independent Spin',
        'Domino Wave',
        'Synchronized Rhythm',
        'Diagonal Cascade',
        'Vortex Swirl'
      ]).name('Motion Style').listen().onChange(updateHUD);

      fMotion.add(params, 'directionMode', [
        'Mixed (Alternating)',
        'Clockwise',
        'Counter-Clockwise'
      ]).name('Direction Mode').listen().onChange(() => {
        for (let t of tokens) {
          const dir = (params.directionMode === 'Clockwise') ? 1 :
                      (params.directionMode === 'Counter-Clockwise') ? -1 :
                      (random() < 0.5 ? 1 : -1);
          t.speed = Math.abs(t.speed) * dir;
        }
      });

      fMotion.add(params, 'mouseReaction', [
        'Spin Accelerate',
        'Tilt / Orient',
        'Wave Ripple',
        'None'
      ]).name('Mouse Reaction').listen();

      // 3. Token Morphology & Geometry
      const fGeo = gui.addFolder('Token Geometry');
      fGeo.add(params, 'rowCount', 4, 16, 1).name('Grid Rows (N)').listen().onChange(() => {
        generateGrid();
      });
      fGeo.add(params, 'rowHeightMode', [
        'Varied (Original)',
        'Uniform Rows'
      ]).name('Row Heights').listen().onChange(() => {
        generateGrid();
      });
      fGeo.add(params, 'thickness', 6, 42, 1).name('Thickness (px)').listen().onChange(v => {
        THICKNESS = v;
        for (let t of tokens) {
          t.thickness = v;
          t.bakeTextures();
        }
      });
      fGeo.add(params, 'tokenSpacing', -15, 40, 1).name('Slot Spacing').listen().onChange(() => {
        generateGrid();
      });
      fGeo.add(params, 'layoutMode', [
        'Original Dynamic Walk',
        'Equispaced Slots',
        'Staggered Grid'
      ]).name('Layout Style').listen().onChange(() => {
        generateGrid();
      });

      // 4. Pattern & Risograph Aesthetics
      const fTexture = gui.addFolder('Pattern & Risograph');
      fTexture.add(params, 'renderQuality', [
        'High-Performance Stipple (60 FPS)',
        'Hardware Gradients + Film Grain',
        'Live Procedural Noise'
      ]).name('Render Engine').listen();

      fTexture.add(params, 'noiseDensity', 0.1, 0.6, 0.02).name('Stipple Density').listen().onChange(() => {
        buildBackgroundBuffer();
        for (let t of tokens) t.bakeTextures();
      });
      fTexture.add(params, 'filmGrainOverlay').name('Film Grain Overlay').listen();
      fTexture.add(params, 'grainOpacity', 0.0, 0.25, 0.01).name('Grain Opacity').listen();

      // 5. Viewport & UX
      const fView = gui.addFolder('Viewport & UX');
      fView.add(params, 'viewportMode', [
        'Fullscreen',
        'Square 1:1',
        'Print 4:5'
      ]).name('Display Ratio').listen().onChange(() => {
        windowResized();
      });
      fView.add(params, 'showHUD').name('Show Heads-Up Display').listen().onChange(v => {
        const hud = document.getElementById('hud');
        if (v) hud.classList.remove('hidden');
        else hud.classList.add('hidden');
      });

      // 6. Action Triggers
      const fActions = gui.addFolder('Quick Actions');
      fActions.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Scene [R]');
      fActions.add({ reseed: () => generateGrid() }, 'reseed').name('🔄 Re-roll Grid Layout');
      fActions.add({ exportPNG: () => saveCanvas(`flip-tokens-${Date.now()}`, 'png') }, 'exportPNG').name('📸 Save PNG Artwork [S]');
      fActions.add({ toggleFS: toggleFullscreen }, 'toggleFS').name('⛶ Fullscreen Toggle [F]');

      // Open primary folders by default
      fTheme.open();
      fMotion.open();
    }
  </script>
</body>
</html>
