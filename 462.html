function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(1337);
const rng = (a, b) => a + (b - a) * rand();

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

function arcFlicker(t, seed, amount) {
  const a = hash1(Math.floor(t * 30) + seed * 17.3);
  const b = hash1(Math.floor(t * 9) + seed * 5.1);
  const s = 0.5 + 0.5 * Math.sin(t * 95 + seed * 3.0);
  const v = 0.25 + 0.55 * a * (0.6 + 0.4 * s) + 0.35 * b;
  return 1 - amount + amount * v;
}

// Geometry batching
const _m4 = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _eu = new THREE.Euler();
const _p = new THREE.Vector3();
const _s = new THREE.Vector3();

class GeoBatch {
  constructor() { this.map = new Map(); }
  add(key, geo, p, s = [1, 1, 1], r = [0, 0, 0]) {
    _m4.compose(_p.set(p[0], p[1], p[2]), _q.setFromEuler(_eu.set(r[0], r[1], r[2])), _s.set(s[0], s[1], s[2]));
    const g = geo.clone().applyMatrix4(_m4);
    if (!this.map.has(key)) this.map.set(key, []);
    this.map.get(key).push(g);
  }
  geometries() {
    const out = {};
    for (const [key, list] of this.map) {
      out[key] = mergeGeometries(list, false);
      list.forEach(g => g.dispose());
    }
    this.map.clear();
    return out;
  }
  build(parent, mats) {
    const geos = this.geometries();
    for (const key in geos) parent.add(new THREE.Mesh(geos[key], mats[key]));
  }
}

function makeSlatTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 8;
  const g = c.getContext('2d');
  g.fillStyle = '#4a525e'; g.fillRect(0, 0, 64, 8);
  g.fillStyle = '#121519'; g.fillRect(0, 0, 5, 8);
  g.fillStyle = '#6b7482'; g.fillRect(5, 0, 2, 8);
  g.fillStyle = '#3c434d'; g.fillRect(40, 0, 1, 8);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.12, 'rgba(235,242,255,0.85)');
  grd.addColorStop(0.35, 'rgba(160,190,255,0.25)');
  grd.addColorStop(1.0, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeScreenTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 160;
  const g = c.getContext('2d');
  g.fillStyle = '#10151d'; g.fillRect(0, 0, 256, 160);
  g.fillStyle = '#9aa6b8'; g.fillRect(0, 0, 256, 16);
  g.fillStyle = '#2a3340'; g.fillRect(6, 24, 118, 66); g.fillRect(132, 24, 118, 66);
  g.strokeStyle = '#ffffff'; g.lineWidth = 2; g.beginPath();
  for (let x = 0; x <= 110; x += 5) {
    const y = 64 - 22 * Math.sin(x * 0.09) * Math.cos(x * 0.031) - x * 0.1;
    x === 0 ? g.moveTo(10 + x, y) : g.lineTo(10 + x, y);
  }
  g.stroke();
  for (let k = 0; k < 8; k++) {
    const h = 12 + 44 * hash1(k * 3.3);
    g.fillStyle = k % 3 === 0 ? '#ffffff' : '#7d8899';
    g.fillRect(138 + k * 14, 86 - h, 9, h);
  }
  for (let r = 0; r < 4; r++) {
    g.fillStyle = '#39424f'; g.fillRect(6, 98 + r * 15, 244, 11);
    g.fillStyle = r === 1 ? '#ffffff' : '#8995a7'; g.fillRect(6, 98 + r * 15, 60 + 150 * hash1(r + 9), 11);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function solveIK(r, tx, ty, tz) {
  r.turret.rotation.y = Math.atan2(-tz, tx);
  const wx = Math.hypot(tx, tz);
  const wy = ty + TIP - SHOULDER_H;
  const d = clamp(Math.hypot(wx, wy), 0.25, REACH);
  const c = clamp((d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1);
  const a2 = -Math.acos(c);
  const a1 = Math.atan2(wy, wx) - Math.atan2(L2 * Math.sin(a2), L1 + L2 * Math.cos(a2));
  r.upper.rotation.z = a1;
  r.fore.rotation.z = a2;
  r.wrist.rotation.z = -HALF_PI - a1 - a2;
}

const robots = [];
const welders = [];

function addRobot(station, opts) {
  const meshes = createRobotMeshes(opts.scale);
  meshes.root.position.set(opts.x, opts.y, opts.z);
  station.group.add(meshes.root);
  const toLocal = (wx, wy, wz) => new THREE.Vector3((wx - opts.x) / opts.scale, (wy - opts.y) / opts.scale, (wz - opts.z) / opts.scale);
  const lift = 0.3;
  const robot = {
    ...meshes,
    station,
    scale: opts.scale,
    base: meshes.root.position,
    home: toLocal(...opts.home),
    p1: toLocal(...opts.p1),
    p2: toLocal(...opts.p2),
    a1: toLocal(opts.p1[0], opts.p1[1] + lift, opts.p1[2]),
    a2: toLocal(opts.p2[0], opts.p2[1] + lift, opts.p2[2]),
    phase: opts.phase,
    rate: opts.rate || 1,
    seam: opts.seam || 0.07,
    welder: !!opts.welder,
    target: new THREE.Vector3(),
    tipWorld: new THREE.Vector3(),
    weldLevel: 0,
    sparkAcc: 0,
    light: null,
    lightWeight: 0,
    glow: null,
    seed: opts.seed
  };
  robots.push(robot);
  if (robot.welder) welders.push(robot);
  return robot;
}

function lerpSmooth(out, a, b, t0, t1, u) { return out.lerpVectors(a, b, smooth(t0, t1, u)); }

function robotTarget(r, u) {
  const out = r.target;
  r.weldLevel = 0;
  if (u < 0.08) return lerpSmooth(out, r.home, r.a1, 0.0, 0.08, u);
  if (u < 0.12) return lerpSmooth(out, r.a1, r.p1, 0.08, 0.12, u);
  if (u < 0.34) return workPath(out, r, r.p1, (u - 0.12) / 0.22);
  if (u < 0.38) return lerpSmooth(out, r.p1, r.a1, 0.34, 0.38, u);
  if (u < 0.45) return lerpSmooth(out, r.a1, r.a2, 0.38, 0.45, u);
  if (u < 0.49) return lerpSmooth(out, r.a2, r.p2, 0.45, 0.49, u);
  if (u < 0.70) return workPath(out, r, r.p2, (u - 0.49) / 0.21);
  if (u < 0.74) return lerpSmooth(out, r.p2, r.a2, 0.70, 0.74, u);
  if (u < 0.84) return lerpSmooth(out, r.a2, r.home, 0.74, 0.84, u);
  return out.copy(r.home);
}

function workPath(out, r, p, w) {
  const s = r.seam / r.scale;
  out.set(
    p.x + s * Math.sin(w * Math.PI * 4.0),
    p.y + 0.015 * Math.sin(w * Math.PI * 10.0),
    p.z + s * 1.2 * Math.sin(w * Math.PI * 2.0)
  );
  r.weldLevel = smooth(0.0, 0.06, w) * (1 - smooth(0.94, 1.0, w));
  return out;
}

function addVentX(b, x, y, z, h, d, n, sx) {
  for (let k = 0; k < n; k++) b.add('seam', T.box, [x + sx * 0.002, y - h / 2 + (k + 0.5) * h / n, z], [0.004, h / n * 0.45, d]);
}

function addSideDetails(b, i) {
  const cs = i % 2 === 0 ? 1 : -1;
  for (const sx of [-1, 1]) {
    const face = sx * (CAB_X0 - 0.077);
    for (const zb of [-1.6, 0]) {
      const zc = zb + 0.8;
      const h = hash1(i * 5.31 + zb * 1.7 + sx * 3.1);

      b.add('paint', T.rbox, [sx * (CAB_X0 - 0.01), 0.46, zc], [0.13, 0.66, 1.3]);
      b.add('seam', T.box, [face, 0.46, zc], [0.004, 0.62, 0.006]);
      b.add('alu', T.box, [face - sx * 0.012, 0.52, zc - 0.07], [0.02, 0.12, 0.018]);
      b.add('alu', T.box, [face - sx * 0.012, 0.52, zc + 0.07], [0.02, 0.12, 0.018]);
      addVentX(b, face, 0.28, zc - 0.36, 0.16, 0.34, 6, -sx);
      addVentX(b, face, 0.28, zc + 0.36, 0.16, 0.34, 6, -sx);
      b.add('curb', T.box, [face - sx * 0.002, 0.7, zc - 0.36], [0.004, 0.05, 0.16]);
      b.add(h > 0.5 ? 'stackG' : 'stackB', T.box, [face - sx * 0.003, 0.7, zc + 0.3], [0.004, 0.018, 0.018]);
      b.add('stackY', T.box, [face - sx * 0.003, 0.7, zc + 0.34], [0.004, 0.018, 0.018]);
      for (const hz of [-0.5, 0.5]) b.add('dark', T.box, [face - sx * 0.006, 0.46, zc + hz * 1.2], [0.012, 0.06, 0.02]);

      b.add('alu', T.box, [sx * CAB_X0, 1.8, zc], [0.03, 1.8, 0.03]);
      b.add('alu', T.box, [sx * (CAB_X0 - 0.035), 1.75, zc - 0.07], [0.02, 0.3, 0.02]);
      for (const hy of [1.1, 2.5]) b.add('dark', T.box, [sx * (CAB_X0 - 0.02), hy, zb + 0.05], [0.025, 0.08, 0.04]);
      for (const gy of [0.94, 1.76, 2.66]) b.add('alu', T.box, [sx * (CAB_X0 + 0.04), gy, zb], [0.05, 0.05, 0.08]);
      b.add('seam', T.box, [sx * (CAB_X0 - 0.026), 1.8, zb], [0.004, 1.8, 0.012]);
      b.add('steel', T.box, [sx * CAB_X0, 0.006, zb], [0.16, 0.012, 0.16]);

      if (zb === 0) {
        b.add('steel', T.box, [sx * 2.5, 0.006, zc], [0.46, 0.012, 1.4]);
        for (let k = 0; k < 9; k++) b.add('seam', T.box, [sx * 2.5, 0.013, zc - 0.6 + k * 0.15], [0.4, 0.002, 0.02]);
      }

      b.add('dark', T.rbox, [sx * 6.9, 1.35, zc], [0.06, 0.34, 0.52]);
      b.add('screen', T.box, [sx * 6.868, 1.35, zc], [0.003, 0.28, 0.46]);
      if (zb === 0 && h > 0.3) {
        b.add('grey', T.cyl, [sx * 5.3, 1.02, zc - 0.35], [0.18, 0.16, 0.18]);
        b.add('alu', T.cyl, [sx * 5.3, 1.12, zc - 0.35], [0.2, 0.03, 0.2]);
        b.add('dark', T.cyl, [sx * 5.3, 1.13, zc - 0.35], [0.14, 0.02, 0.14]);
        b.add('alu', T.box, [sx * 5.5, 1.1, zc - 0.25], [0.3, 0.02, 0.05], [0, sx * 0.5, 0]);
      }
      for (let k = 0; k < 4; k++) b.add('bin', T.rbox, [sx * (5.25 + k * 0.28), 1.86, zc - 0.5], [0.24, 0.12, 0.2]);

      b.add('paint', T.rbox, [sx * 5.9, 3.0, zc - 0.45], [0.5, 0.6, 0.4]);
      b.add('screen', T.box, [sx * 5.9, 3.1, zc - 0.25 + 0.003], [0.32, 0.2, 0.002]);
      addVentX(b, sx * 5.65, 2.9, zc - 0.45, 0.2, 0.3, 5, -sx);

      for (let k = 0; k < 3; k++) b.add(k === 1 ? 'bin' : 'grey', T.rbox, [sx * (5.2 + k * 0.45), 4.32, zc + 0.3], [0.36, 0.2, 0.3]);
      b.add('steel', T.box, [sx * (CAB_X1 + 0.5), 4.16, zc], [0.1, 0.03, 1.4]);
      b.add('steel', T.box, [sx * (CAB_X2 + 0.6), 5.37, zc], [0.1, 0.03, 1.4]);
    }

    const pf = sx * 2.045;
    b.add('paint', T.box, [pf, 0.38, -0.2], [0.012, 0.44, 1.1]);
    addVentX(b, pf, 0.3, -0.45, 0.18, 0.4, 6, sx);
    b.add('curb', T.box, [pf + sx * 0.007, 0.52, 0.1], [0.002, 0.05, 0.2]);
    b.add('alu', T.box, [pf + sx * 0.012, 0.42, 0.25], [0.012, 0.1, 0.018]);
  }

  if (i % 3 === 0) {
    const sx = -cs, cx = sx * 2.5, cz = 0.3;
    for (const ox of [-0.18, 0.18]) for (const oz of [-0.28, 0.28]) {

    }
    b.add('alu', T.cylLow, [cx, 1.02, cz + 0.3], [0.014, 0.38, 0.014], [0, 0, HALF_PI]);
  }
}

const scaras = [];

function addScara(station, x, z, seed) {

  b.build(base, MAT);
  station.group.add(base);

  const arm1 = new THREE.Group();
  arm1.position.y = 0.62;
  base.add(arm1);
  b.add('white', T.rbox, [0.17, 0, 0], [0.44, 0.1, 0.16]);
  b.add('grey', T.cyl, [0, 0, 0], [0.1, 0.12, 0.1]);
  b.add('seam', T.cyl, [0.34, 0, 0], [0.085, 0.104, 0.085]);
  b.build(arm1, MAT);

  const arm2 = new THREE.Group();
  arm2.position.set(0.34, 0.07, 0);
  arm1.add(arm2);
  b.add('white', T.rbox, [0.15, 0, 0], [0.38, 0.09, 0.14]);
  b.add('led', T.torus, [0, 0.05, 0], [0.9, 0.9, 1], [HALF_PI, 0, 0]);
  b.add('grey', T.cylLow, [0.3, 0, 0], [0.05, 0.12, 0.05]);
  b.build(arm2, MAT);

  const quill = new THREE.Group();
  quill.position.set(0.3, 0, 0);
  arm2.add(quill);
  b.add('alu', T.cylLow, [0, -0.08, 0], [0.018, 0.34, 0.018]);
  b.add('dark', T.rbox, [0, -0.26, 0], [0.06, 0.06, 0.06]);
  b.build(quill, MAT);

  scaras.push({ arm1, arm2, quill, seed, dir: Math.sign(x) });
}

function addGantry(station, sx, z, seed) {
  const bridge = new THREE.Group();
  bridge.position.set(0, 0, z);
  station.group.add(bridge);
  const b = new GeoBatch();
  const xa = sx * 4.25, xb = sx * 6.55, xm = (xa + xb) * 0.5, len = Math.abs(xb - xa);
  b.add('alu', T.box, [xm, 4.0, 0], [len, 0.08, 0.1]);
  b.add('seam', T.box, [xm, 4.0, 0.051], [len, 0.012, 0.004]);
  b.add('dark', T.rbox, [xa, 3.98, 0], [0.14, 0.1, 0.22]);
  b.add('dark', T.rbox, [xb, 3.98, 0], [0.14, 0.1, 0.22]);
  b.add('rubber', T.box, [xm, 4.07, -0.03], [len * 0.9, 0.03, 0.05]);
  b.build(bridge, MAT);

  const carriage = new THREE.Group();
  carriage.position.set(xm, 4.0, 0);
  bridge.add(carriage);
  b.add('white', T.rbox, [0, 0, 0.1], [0.18, 0.2, 0.12]);
  b.add('grey', T.box, [0, -0.25, 0.1], [0.06, 0.4, 0.06]);
  b.add('led', T.box, [0, 0.02, 0.162], [0.1, 0.012, 0.002]);
  b.add('dark', T.rbox, [0, -0.48, 0.1], [0.1, 0.08, 0.1]);
  b.build(carriage, MAT);

  gantries.push({ bridge, carriage, seed, xm, span: len * 0.3 });
}

function updateSideMachines(t) {
  for (const s of scaras) {
    const ph = s.seed * 1.37;
    s.arm1.rotation.y = (s.dir > 0 ? Math.PI : 0) + 0.8 * Math.sin(t * 0.8 + ph);
    s.arm2.rotation.y = 1.3 * Math.sin(t * 1.1 + ph * 1.7);
    s.quill.position.y = -0.07 * (0.5 + 0.5 * Math.sin(t * 2.3 + ph));
  }
  for (const g of gantries) {
    const ph = g.seed * 2.11;
    g.bridge.position.z = -0.8 + 0.55 * Math.sin(t * 0.35 + ph);
    g.carriage.position.x = g.xm + g.span * Math.sin(t * 0.6 + ph * 0.7);
  }
}

    phase: rng(0, 1),
    rate: rng(0.85, 1.15),
    seam: 0.04,
    seed: 100 + i

  addScara(station, -sx * 4.5, -0.9, i);
  addGantry(station, sx, -0.8, i);
}

const _palletMatrix = new THREE.Matrix4();
function updatePallets(offset, camZ) {
  const near = camZ + 3.0;
  const z0 = -offset + Math.floor((near + offset) / PALLET_PITCH) * PALLET_PITCH;
  for (let k = 0; k < PALLET_COUNT; k++) {
    _palletMatrix.makeTranslation(0, 0, z0 - k * PALLET_PITCH);
    for (const im of palletMeshes) im.setMatrixAt(k, _palletMatrix);
  }
  for (const im of palletMeshes) im.instanceMatrix.needsUpdate = true;
}

// Sparks
const SPARK_MAX = 1600;
const sparkPos = new Float32Array(SPARK_MAX * 3);
const sparkVel = new Float32Array(SPARK_MAX * 3);
const sparkLife = new Float32Array(SPARK_MAX);
const sparkAge = new Float32Array(SPARK_MAX);
const sparkMaxAge = new Float32Array(SPARK_MAX);
const sparkFloor = new Float32Array(SPARK_MAX);
for (let i = 0; i < SPARK_MAX; i++) sparkPos[i * 3 + 1] = -100;
let sparkCursor = 0;

const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3).setUsage(THREE.DynamicDrawUsage));
sparkGeo.setAttribute('aLife', new THREE.BufferAttribute(sparkLife, 1).setUsage(THREE.DynamicDrawUsage));
const sparkMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor: { value: weldColor.clone().multiplyScalar(4) },
    uSize: { value: 26.0 },
    uPixelRatio: { value: PARAMS.performance.dpr }
  },
  vertexShader: /* glsl */`
    attribute float aLife;
    uniform float uSize;
    uniform float uPixelRatio;
    varying float vLife;
    void main() {
      vLife = aLife;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aLife > 0.0 ? uSize * uPixelRatio * (0.35 + 0.65 * aLife) / max(-mv.z, 0.1) : 0.0;
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uColor;
    varying float vLife;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(uColor * a * vLife * vLife, 1.0);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const sparks = new THREE.Points(sparkGeo, sparkMat);
sparks.frustumCulled = false;
scene.add(sparks);

const sparkRand = mulberry32(7);
function emitSpark(p, floorY) {
  const i = sparkCursor;
  sparkCursor = (sparkCursor + 1) % SPARK_MAX;
  const a = sparkRand() * Math.PI * 2;
  const sp = 0.6 + sparkRand() * 2.2;
  const up = 0.4 + sparkRand() * 1.8;
  sparkPos[i * 3] = p.x; sparkPos[i * 3 + 1] = p.y; sparkPos[i * 3 + 2] = p.z;
  sparkVel[i * 3] = Math.cos(a) * sp; sparkVel[i * 3 + 1] = up; sparkVel[i * 3 + 2] = Math.sin(a) * sp;
  sparkAge[i] = 0;
  sparkMaxAge[i] = 0.25 + sparkRand() * 0.6;
  sparkLife[i] = 1;
  sparkFloor[i] = floorY;
}

function updateSparks(dt) {
  for (let i = 0; i < SPARK_MAX; i++) {
    if (sparkLife[i] <= 0) continue;
    sparkAge[i] += dt;
    const life = 1 - sparkAge[i] / sparkMaxAge[i];
    if (life <= 0) { sparkLife[i] = 0; sparkPos[i * 3 + 1] = -100; continue; }
    sparkLife[i] = life;
    const j = i * 3;
    sparkVel[j + 1] -= 7.5 * dt;
    sparkPos[j] += sparkVel[j] * dt;
    sparkPos[j + 1] += sparkVel[j + 1] * dt;
    sparkPos[j + 2] += sparkVel[j + 2] * dt;
    if (sparkPos[j + 1] < sparkFloor[i] && sparkVel[j + 1] < 0) {
      sparkPos[j + 1] = sparkFloor[i];
      sparkVel[j + 1] *= -0.3;
      sparkVel[j] *= 0.5; sparkVel[j + 2] *= 0.5;
    }
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.aLife.needsUpdate = true;
}

// ============================================================
// Post processing
// ============================================================
function createComposer() {
  const dpr = clamp(PARAMS.performance.dpr, 0.5, MAX_DPR);
  const w = window.innerWidth, h = window.innerHeight;
  const renderTarget = new THREE.WebGLRenderTarget(w * dpr, h * dpr, {
    type: THREE.HalfFloatType,
    samples: PARAMS.performance.antialias ? 4 : 0
  });

  const comp = new EffectComposer(renderer, renderTarget);
  comp.setPixelRatio(dpr);
  comp.setSize(w, h);
  comp.addPass(new RenderPass(scene, camera));

  const bloom = new UnrealBloomPass(
    new THREE.Vector2(w, h),
    PARAMS.post.bloomStrength, PARAMS.post.bloomRadius, PARAMS.post.bloomThreshold
  );
  bloom.enabled = PARAMS.post.bloom;
  comp.addPass(bloom);
  comp.addPass(new OutputPass());

  const grade = new ShaderPass(GradeShader);
  comp.addPass(grade);

  return { composer: comp, bloomPass: bloom, gradePass: grade, renderTarget };
}

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uTint: { value: new THREE.Vector3(1, 1, 1) },
    uShadow: { value: new THREE.Vector3() },
    uSaturation: { value: PARAMS.post.saturation },
    uVignette: { value: PARAMS.post.vignette },
    uGrain: { value: PARAMS.post.grain },
    uGreenscreen: { value: 0.0 },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uTime, uSaturation, uVignette, uGrain, uGreenscreen;
    uniform vec3 uTint, uShadow;
    uniform vec2 uResolution;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      if (uGreenscreen > 0.5) {
        gl_FragColor = vec4(c, 1.0);
        return;
      }
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, uSaturation);
      c *= mix(mix(vec3(1.0), uTint, 0.6), vec3(1.0), smoothstep(0.6, 1.0, l));
      c += uShadow * (1.0 - smoothstep(0.0, 0.35, l));
      vec2 q = (vUv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0);
      float v = smoothstep(1.25, 0.25, length(q));
      c *= mix(1.0, v, uVignette);
      float n = hash(vUv * uResolution + fract(uTime) * 91.7) - 0.5;
      c += n * uGrain;
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }
  `
};

let { composer, bloomPass, gradePass } = createComposer();

function applyGradeColors() {
  const t = new THREE.Color(PARAMS.colors.tint);
  const lum = 0.2126 * t.r + 0.7152 * t.g + 0.0722 * t.b;
  const k = 1 / Math.max(lum, 0.05);
  gradePass.uniforms.uTint.value.set(t.r * k, t.g * k, t.b * k);
  const s = new THREE.Color(PARAMS.colors.shadowLift);
  gradePass.uniforms.uShadow.value.set(s.r, s.g, s.b);
  gradePass.uniforms.uGreenscreen.value = PARAMS.colors.greenscreen ? 1.0 : 0.0;
}
applyGradeColors();

// Interactive Camera, Zoom, Pan and 8 Preconfigured Animations

let userZoom = 1.0;
let userYaw = 0.0;
let userPitch = 0.0;
const userPan = new THREE.Vector3();

function resetCameraControls() {
  userZoom = 1.0;
  PARAMS.controls.zoom = 1.0;
  userYaw = 0.0;
  userPitch = 0.0;
  userPan.set(0, 0, 0);
  updateGuiDisplay();
}

const basePos = new THREE.Vector3();
const baseTarget = new THREE.Vector3();
let camTime = 0;
let camTravel = 0;

function calculateCameraPose(dt) {
  const c = PARAMS.camera;
  const speed = PARAMS.animation.speed;
  const type = PARAMS.animationType;

  switch (type) {
    case 'Assembly Line Tracking': {
      if (c.moveForward) camTravel += dt * c.forwardSpeed * speed;
      const dx = c.sway * Math.sin(camTime * 0.21);
      const dy = c.sway * 0.4 * Math.sin(camTime * 0.17 + 1.3);
      basePos.set(dx, c.height + dy, c.distance - camTravel);
      baseTarget.set(dx * 0.5, c.lookY, c.lookZ - camTravel);
      break;
    }
    case 'Static Inspection': {
      basePos.set(2.8, 3.2, 1.5 - camTravel);
      baseTarget.set(0, 1.2, -1.8 - camTravel);
      break;
    }
    case 'Slow Orbit Low': {
      const radius = 4.2;
      const angle = camTime * 0.12 * speed;
      baseTarget.set(0, 1.2, -0.6 - camTravel);
      basePos.set(
        Math.sin(angle) * radius,
        1.7 + 0.3 * Math.sin(camTime * 0.15 * speed),
        -0.6 - camTravel + Math.cos(angle) * radius
      );
      break;
    }
    case 'Slow Orbit High': {
      const radius = 6.2;
      const angle = camTime * 0.08 * speed;
      baseTarget.set(0, 0.9, -2.5 - camTravel);
      basePos.set(
        Math.sin(angle) * radius,
        5.8 + 0.5 * Math.cos(camTime * 0.09 * speed),
        -2.5 - camTravel + Math.cos(angle) * radius
      );
      break;
    }
    case 'Flyover Survey': {
      if (c.moveForward) camTravel += dt * c.forwardSpeed * 0.7 * speed;
      baseTarget.set(0, 0.8, -camTravel - 4.5);
      basePos.set(
        1.5 * Math.sin(camTime * 0.15 * speed),
        4.4 + 0.6 * Math.sin(camTime * 0.12 * speed),
        -camTravel + 3.2
      );
      break;
    }
    case 'Side Profile Glide': {
      if (c.moveForward) camTravel += dt * c.forwardSpeed * 0.55 * speed;
      baseTarget.set(0, 1.3, -camTravel - 1.2);
      basePos.set(3.4, 2.4, -camTravel + 1.4);
      break;
    }
    case 'Diagonal Crane Sweep': {
      const radius = 3.8;
      const angle = camTime * 0.1 * speed;
      baseTarget.set(0, 1.1, -camTravel - 2.0);
      basePos.set(
        radius * Math.cos(angle),
        3.2 + 1.2 * Math.sin(camTime * 0.12 * speed),
        -camTravel + 2.4 + radius * 0.45 * Math.sin(angle)
      );
      break;
    }
    case 'Welder Close-up Focus': {
      const radius = 2.1;
      const angle = camTime * 0.14 * speed;
      baseTarget.set(-0.35, 1.15, -0.2 - camTravel);
      basePos.set(
        -0.35 + Math.sin(angle) * radius,
        1.65 + 0.25 * Math.sin(camTime * 0.16 * speed),
        -0.2 - camTravel + Math.cos(angle) * radius
      );
      break;
    }
    default: {
      if (c.moveForward) camTravel += dt * c.forwardSpeed * speed;
      basePos.set(0, c.height, c.distance - camTravel);
      baseTarget.set(0, c.lookY, c.lookZ - camTravel);
    }
  }

  // Combine animation base with user orbit angle, zoom and pan
  const offset = basePos.clone().sub(baseTarget);
  const currentDist = offset.length() * userZoom;
  const spherical = new THREE.Spherical().setFromVector3(offset);

  spherical.theta += userYaw;
  spherical.phi = clamp(spherical.phi + userPitch, 0.05, Math.PI - 0.05);
  spherical.radius = currentDist;

  const newOffset = new THREE.Vector3().setFromSpherical(spherical);
  const finalTarget = baseTarget.clone().add(userPan);
  const finalPos = finalTarget.clone().add(newOffset);

  camera.position.copy(finalPos);
  camera.lookAt(finalTarget);
}

// Recycle stations behind the camera
function updateWorldWindow() {
  if (camTravel > REBASE_DIST) {
    camTravel -= REBASE_DIST;
    for (const st of stations) st.group.position.z += REBASE_DIST;
    for (let i = 0; i < SPARK_MAX; i++) sparkPos[i * 3 + 2] += REBASE_DIST;
  }
  const camZ = PARAMS.camera.distance - camTravel;
  for (const st of stations) {
    while (st.group.position.z > camZ + 1.8) st.group.position.z -= RING_LEN;
    while (st.group.position.z < camZ + 1.8 - RING_LEN) st.group.position.z += RING_LEN;
  }
  followGroup.position.z = camZ;
  return camZ;
}

// Mouse Wheel & Drag Controls + Scene Click Randomizer
// ============================================================
let isPointerDown = false;
let pointerButton = 0;
let lastPointerX = 0;
let lastPointerY = 0;
let totalDragDistance = 0;
let pointerDownX = 0;
let pointerDownY = 0;

window.addEventListener('wheel', (e) => {
  if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
  const zoomFactor = e.deltaY > 0 ? 1.08 : 0.92;
  userZoom = clamp(userZoom * zoomFactor, 0.15, 6.0);
  PARAMS.controls.zoom = +userZoom.toFixed(2);
  updateGuiDisplay();
}, { passive: true });

window.addEventListener('contextmenu', (e) => {
  if (!e.target || !e.target.closest || !e.target.closest('.lil-gui')) {
    e.preventDefault();
  }
});

window.addEventListener('pointerdown', (e) => {
  if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
  isPointerDown = true;
  pointerButton = e.button;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  pointerDownX = e.clientX;
  pointerDownY = e.clientY;
  totalDragDistance = 0;
});

window.addEventListener('pointermove', (e) => {
  if (!isPointerDown) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  totalDragDistance += Math.hypot(dx, dy);

  if (pointerButton === 2 || pointerButton === 1 || e.shiftKey) {
    // Pan scene/object across screen
    const right = new THREE.Vector3();
    const up = new THREE.Vector3();
    camera.matrixWorld.extractBasis(right, up, new THREE.Vector3());
    const panSpeed = 0.0035 * userZoom;
    userPan.addScaledVector(right, -dx * panSpeed);
    userPan.addScaledVector(up, dy * panSpeed);
  } else if (pointerButton === 0) {
    // Rotate view angle / orbit
    userYaw -= dx * 0.005;
    userPitch = clamp(userPitch - dy * 0.005, -1.35, 1.35);
  }
});

window.addEventListener('pointerup', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;
  // If clean click on canvas without dragging: trigger procedural variation
  if (totalDragDistance < 5 && e.button === 0 && PARAMS.interaction.clickToRandomize) {
    if (!e.target || !e.target.closest || !e.target.closest('.lil-gui')) {
      randomizeScene();
    }
  }
});

// ============================================================
// Procedural Variation Generator (Randomizer)
// ============================================================
function randomizeScene() {
  const schemeNames = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
  applyColorScheme(randomScheme);

  // Geometric and motion re-rolls
  PARAMS.animation.robotSpeed = +(0.5 + Math.random() * 1.5).toFixed(2);
  PARAMS.animation.cycleTime = +(4.0 + Math.random() * 8.0).toFixed(1);
  PARAMS.camera.forwardSpeed = +(0.15 + Math.random() * 0.55).toFixed(2);
  PARAMS.camera.sway = +(Math.random() * 0.25).toFixed(2);

  for (const r of robots) {
    r.phase = Math.random();
    r.rate = +(0.8 + Math.random() * 0.4).toFixed(2);
    r.seam = +(0.03 + Math.random() * 0.07).toFixed(2);
  }

  // Lighting variations
  PARAMS.lighting.ambient = +(0.25 + Math.random() * 0.5).toFixed(2);
  PARAMS.lighting.key = +(0.35 + Math.random() * 1.0).toFixed(2);
  PARAMS.lighting.rim = +(0.15 + Math.random() * 0.5).toFixed(2);
  PARAMS.lighting.weld = +(0.5 + Math.random() * 1.5).toFixed(2);
  PARAMS.lighting.flicker = +(0.6 + Math.random() * 0.4).toFixed(2);
  PARAMS.lighting.environment = +(0.15 + Math.random() * 0.5).toFixed(2);
  PARAMS.lighting.masterExposure = +(0.6 + Math.random() * 0.8).toFixed(2);
  updateLights();

  // Post processing variations
  PARAMS.post.bloomStrength = +(0.3 + Math.random() * 1.0).toFixed(2);
  PARAMS.post.saturation = +(0.25 + Math.random() * 0.75).toFixed(2);
  bloomPass.strength = PARAMS.post.bloomStrength;
  gradePass.uniforms.uSaturation.value = PARAMS.post.saturation;

  updateGuiDisplay();
}

    guiVisible = !guiVisible;
    if (typeof gui.show === 'function') {
      gui.show(guiVisible);
    } else if (gui.domElement) {
      gui.domElement.style.display = guiVisible ? '' : 'none';
    }
  }
});

// ============================================================
// Resize / visibility
// ============================================================
function applySize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = clamp(PARAMS.performance.dpr, 0.5, MAX_DPR);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  gradePass.uniforms.uResolution.value.set(w * dpr, h * dpr);
  sparkMat.uniforms.uPixelRatio.value = dpr;
}
window.addEventListener('resize', applySize);
applySize();

const clock = new THREE.Clock();
document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });

// ============================================================
// Animation loop
// ============================================================
let simTime = 0;
const lightSlots = new Array(WELD_LIGHT_COUNT).fill(null);
const lightDist = new Float32Array(WELD_LIGHT_COUNT);

function assignWeldLights(camZ) {
  for (let k = 0; k < WELD_LIGHT_COUNT; k++) { lightSlots[k] = null; lightDist[k] = Infinity; }
  for (const r of welders) {
    r.light = null;
    const d = camZ - (r.station.group.position.z + r.base.z);
    if (d < 0.5) continue;
    for (let k = 0; k < WELD_LIGHT_COUNT; k++) {
      if (d < lightDist[k]) {
        for (let m = WELD_LIGHT_COUNT - 1; m > k; m--) { lightDist[m] = lightDist[m - 1]; lightSlots[m] = lightSlots[m - 1]; }
        lightDist[k] = d; lightSlots[k] = r;
        break;
      }
    }
  }
  for (let k = 0; k < WELD_LIGHT_COUNT; k++) {
    const r = lightSlots[k];
    weldLights[k].intensity = 0;
    if (r) { r.light = weldLights[k]; r.lightWeight = 1 - smooth(9, 13, lightDist[k]); }
  }
}

function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const A = PARAMS.animation;
  const masterSpeed = A.speed;
  camTime += dt * masterSpeed;
  const sdt = A.paused ? 0 : dt * A.robotSpeed * masterSpeed;
  simTime += sdt;

  calculateCameraPose(dt);
  const camZ = updateWorldWindow();

  // Conveyor indexing
  const cyc = simTime / A.cycleTime;
  const cycFloor = Math.floor(cyc);
  const frac = cyc - cycFloor;
  const offset = A.conveyor ? (cycFloor + smooth(0.85, 0.98, frac)) * PALLET_PITCH : 0;
  updatePallets(offset, camZ);
  updateSideMachines(simTime);

  assignWeldLights(camZ);

  // Robots IK and welding sparks
  for (let i = 0; i < robots.length; i++) {
    const r = robots[i];
    let u = cyc * r.rate + r.phase;
    u -= Math.floor(u);
    robotTarget(r, u);
    solveIK(r, r.target.x, r.target.y, r.target.z);

    if (r.welder) {
      r.tipWorld.copy(r.target).multiplyScalar(r.scale).add(r.base);
      r.tipWorld.z += r.station.group.position.z;
      const f = arcFlicker(simTime, r.seed, PARAMS.lighting.flicker);
      const level = r.weldLevel * PARAMS.lighting.weld * (A.paused ? 0.6 : 1);
      const e = level * f;
      r.glow.visible = e > 0.01;
      if (r.glow.visible) {
        r.glow.position.copy(r.tipWorld);
        r.glow.position.y -= 0.02;
        r.glow.material.opacity = Math.min(1, e);
        r.glow.scale.setScalar(0.22 + 0.4 * e);
      }
      if (r.light) {
        r.light.position.copy(r.tipWorld);
        r.light.position.y += 0.18;
        r.light.intensity = 9 * e * r.lightWeight;
      }
      const d = camZ - r.tipWorld.z;
      if (PARAMS.performance.sparks && e > 0.05 && d > 0 && d < 22 && sdt > 0) {
        r.sparkAcc += sdt * 110 * e;
        while (r.sparkAcc >= 1) {
          r.sparkAcc -= 1;
          emitSpark(r.tipWorld, RAIL_Y + 0.13);
        }
      }
    }
  }

  if (PARAMS.performance.sparks) updateSparks(sdt);

  gradePass.uniforms.uTime.value = camTime;
  composer.render();
}

renderer.setAnimationLoop(loop);
</script>
