<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f6">
  <link rel="icon" href="data:,">
  <title>Black Ink</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f8f8f6; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas aria-label="Glossy black ink slowly flowing down a white canvas"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const config = {
      scheme: 'Original', invert: false, greenscreen: false,
      inkColor: '#050505', color2: '#050505', color3: '#050505',
      color4: '#050505', color5: '#050505', color6: '#050505',
      highlightColor: '#ffffff', accentColor: '#e53b38', backgroundColor: '#f8f8f6',
      paletteBlend: 0, accentAmount: 0,
      animation: 'Viscous flow', speed: 1, motionStrength: 1, sway: 1,
      viscosity: 0.84, density: 1, length: 1, glossiness: 0.88, noiseScale: 1,
      seed: 0, randomizeOnClick: true,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0
    };

    // Nineteen palette families; Invert supplies both achromatic orientations.
    const schemes = {
      'Original': { colors: ['050505'], background: 'f8f8f6', blend: 0 },
      'Monochromatic': { colors: ['153442', '234e62', '397a91', '6aa6b6', '10242e'], background: 'edf3f4' },
      'Analogous': { colors: ['093f52', '176c78', '29978a', '658e9e', '212e4b'], background: 'f1f5ed' },
      'Complementary': { colors: ['174963', '246e86', 'd28348', 'eead65', '102a3a'], background: 'faf0df' },
      'Split-complementary': { colors: ['283d78', '496ab0', 'd99b48', 'ce657b', '17213d'], background: 'f7f1e5' },
      'Triadic': { colors: ['225c75', 'b74f6b', 'd8ad4f', '2e7c84', '162c3b'], background: 'f9f3e5' },
      'Tetradic': { colors: ['24576b', 'bc7160', '8e6a99', 'b6ad60', '192b35'], background: 'f4efe7' },
      'Double split-complementary': { colors: ['214f67', '557c70', 'b78957', 'a65a77', '655a93', '172c36'], background: 'f4f0e7' },
      'Achromatic': { colors: ['000000'], background: 'ffffff', blend: 0 },
      'Achromatic + Accent': { colors: ['050505'], background: 'ffffff', blend: 0, accent: 'e52c35', amount: 1 },
      'Neutral + accent': { colors: ['2d2a27', '4b4640', '77716b', 'a39b91', '24211f'], background: 'eae4da', accent: 'f35d32', amount: 0.65, blend: 0.55 },
      'Amber / Oxblood': { colors: ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'], background: '220901' },
      'Lagoon / Midnight': { colors: ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'], background: '000000' },
      'Orchid / Aubergine': { colors: ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'], background: '120A12' },
      'Saffron / Petrol': { colors: ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'], background: '061210' },
      'Chartreuse / Forest': { colors: ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'], background: '05140A' },
      'Tangerine / Plum': { colors: ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'], background: '0E0618' },
      'Lavender / Violet': { colors: ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'], background: '090612' },
      'Cyan / Magenta': { colors: ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F'], background: '05020F' }
    };
    const animations = [
      'Viscous flow', 'Heavy ooze', 'Filament sway', 'Tidal breathing',
      'Slow orbit', 'Drifting study', 'Macro glide', 'Static'
    ];

    // Public shader parameters. A complete, seamless cycle takes 40 / uSpeed seconds.
    const uniforms = {
      uTime:        { value: 0 },
      uResolution: { value: new THREE.Vector2() },
      uSpeed:       { value: 1.0 },
      uViscosity:   { value: 0.84 },
      uDripDensity: { value: 1.0 },
      uDripLength:  { value: 1.0 },
      uGlossiness:  { value: 0.88 },
      uNoiseScale:  { value: 1.0 },
      uSeed:        { value: 0 },
      uMotion:      { value: 1 },
      uSway:        { value: 1 },
      uZoom:        { value: 1 },
      uPan:         { value: new THREE.Vector2() },
      uView:        { value: new THREE.Matrix3() },
      uPalette:     { value: Array.from({ length: 6 }, () => new THREE.Color()) },
      uBackground:  { value: new THREE.Color() },
      uHighlight:   { value: new THREE.Color() },
      uAccent:      { value: new THREE.Color() },
      uPaletteBlend:{ value: 0 },
      uAccentAmount:{ value: 0 },
      uInvert:      { value: 0 },
      uGreenscreen: { value: 0 }
    };

    const vertexShader = /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const fragmentShader = /* glsl */`
      precision highp float;
      uniform float uTime, uSpeed, uViscosity;
      uniform float uDripDensity, uDripLength, uGlossiness, uNoiseScale;
      uniform float uSeed, uMotion, uSway, uZoom;
      uniform float uPaletteBlend, uAccentAmount, uInvert, uGreenscreen;
      uniform vec2 uResolution;
      uniform vec2 uPan;
      uniform mat3 uView;
      uniform vec3 uPalette[6], uBackground, uHighlight, uAccent;
      varying vec2 vUv;
      const float TAU = 6.28318530718;

      float hash(float n) {
        return fract(sin(n * 127.1 + 311.7) * 43758.5453123);
      }
      float hash2(vec2 p) {
        vec3 q = fract(vec3(p.xyx) * 0.1031);
        q += dot(q, q.yzx + 33.33);
        return fract((q.x + q.y) * q.z);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash2(i), hash2(i + vec2(1, 0)), f.x),
                   mix(hash2(i + vec2(0, 1)), hash2(i + 1.0), f.x), f.y);
      }
      float fbm(vec2 p) {
        float s = 0.0, a = 0.5;
        mat2 m = mat2(1.63, 1.17, -1.17, 1.63);
        for (int i = 0; i < 4; i++) {
          s += a * noise(p);
          p = m * p + 7.19;
          a *= 0.5;
        }
        return s;
      }
      float smin(float a, float b, float k) {
        float h = max(k - abs(a - b), 0.0) / k;
        return min(a, b) - h * h * k * 0.25;
      }
      float ellipse(vec2 p, vec2 r) {
        float k0 = length(p / r);
        float k1 = length(p / (r * r));
        if (k0 < 0.00001) return -min(r.x, r.y);
        return k0 * (k0 - 1.0) / max(k1, 0.00001);
      }

      // The two harmonics give each seed a different flow while every component
      // returns to exactly the same position at the master-loop boundary.
      vec2 flow(vec2 p, float t) {
        return vec2(
          sin(p.y * 8.0 - t + sin(p.x * 6.0 + t)) * 0.008
            + sin(p.y * 19.0 - t * 2.0 + p.x * 13.0) * 0.0025,
          sin(p.x * 9.0 - p.y * 5.0 + t) * 0.010
            + cos(p.x * 21.0 + p.y * 8.0 - t * 2.0) * 0.004
        );
      }

      // Variable-radius curved capsule, seamlessly united with a hanging bulb.
      float stream(vec2 p, float id, float cell, float t, float fine) {
        float seed = id + fine * 138.0 + uSeed;
        float a = hash(seed + 13.4), b = hash(seed + 51.9);
        float c = hash(seed + 94.2), phase = TAU * hash(seed + 7.6);
        float viscosity = clamp(uViscosity, 0.05, 2.0);
        float pulse = sin(t + phase) * uMotion;
        float gravity = sin(t - 0.8 + phase) * uMotion;
        float swayStrength = min(uSway, cell / 0.018);
        float root = mix(0.13, 0.21, b);
        float reach = mix(0.26, 0.80, pow(a, 1.35));
        reach = mix(reach, 0.91, step(0.91, c));
        reach = mix(reach, 0.30 + a * 0.43, fine);
        float end = root + (reach - root) * clamp(uDripLength, 0.2, 1.45);
        end += (0.010 + 0.014 * b) * pulse / (0.7 + viscosity);
        float cy = clamp(p.y, root, end);
        float s = clamp((cy - root) / (end - root), 0.0, 1.0);
        float x = (id + 0.5 + (b - 0.5) * 0.64) * cell;
        float sway = sin(cy * (6.0 + c * 10.0) - t + phase);
        x += (sway * 0.010 + sin(cy * 25.0 - 2.0 * t + phase) * 0.003)
              * sin(s * 2.1) * swayStrength / (0.65 + viscosity);
        x += sin(s * 5.0 + phase) * 0.013 * (1.0 - fine * 0.7);

        float w = cell * mix(0.17, 0.38, hash(seed + 33.7));
        w *= mix(1.0, 0.135 + b * 0.16, fine);
        float taper = 0.40 + 1.35 * pow(1.0 - s, 2.3);
        taper += 0.19 * sin(s * 12.0 - t + phase) * sin(s * 3.14159);
        taper += 0.42 * exp(-pow((s - (0.52 + c * 0.25)) * 8.0, 2.0));
        taper += (1.0 - fine) * step(0.66, b) * 1.25
          * exp(-pow((s - 0.55) * 3.4, 2.0));
        taper *= 1.0 + 0.11 * sin(cy * 63.0 - t * 2.0 + phase);
        float r = max(w * taper, 0.0007);
        float d = length(vec2(p.x - x, p.y - cy)) - r;

        float bulb = w * mix(0.60, 0.95, c) * (1.0 + gravity * 0.09);
        float tipX = (id + 0.5 + (b - 0.5) * 0.64) * cell;
        tipX += (sin(end * (6.0 + c * 10.0) - t + phase) * 0.010
          + sin(end * 25.0 - 2.0 * t + phase) * 0.003)
          * sin(2.1) * swayStrength / (0.65 + viscosity);
        tipX += sin(5.0 + phase) * 0.013 * (1.0 - fine * 0.7);
        float drop = ellipse(p - vec2(tipX, end - bulb * 0.10),
          vec2(bulb * 0.83, bulb * (1.36 + 0.14 * pulse)));
        return smin(d, drop, w * 0.7);
      }

      void main() {
        float aspect = uResolution.x / max(uResolution.y, 1.0);
        // Orthographic ray projection onto the ink sheet. Manual framing is
        // composed with the animated camera instead of being overwritten by it.
        vec2 screen = (vUv - 0.5) * vec2(aspect, 1.0);
        vec2 sheet = (uView * vec3(screen - uPan, 1.0)).xy / uZoom;
        vec2 p = sheet * vec2(1.0, -1.0) + vec2(aspect * 0.5, 0.5);
        float t = uTime * uSpeed * (TAU / 40.0);
        float ns = clamp(uNoiseScale, 0.25, 3.0);
        vec2 advect = flow(p, t) * uMotion;
        vec2 q = p + advect;
        float grain = fbm(q * vec2(29.0, 13.0) * ns + uSeed * 0.13);
        q.x += (grain - 0.47) * 0.005;

        // A permanent reservoir keeps the top edge dense throughout the loop.
        float coast = 0.255 + 0.034 * sin(q.x * 8.0 + 0.6 + uSeed)
          + 0.025 * sin(q.x * 23.0 - 0.4)
          + 0.040 * (fbm(vec2(q.x * 13.0, 1.2)) - 0.4);
        coast = max(coast, 0.235);
        float d = q.y - coast;
        float density = clamp(uDripDensity, 0.5, 2.0);
        float cell = mix(0.071, 0.108, smoothstep(0.5, 1.8, aspect)) / density;
        float lane = floor(q.x / cell);
        for (int i = -2; i <= 2; i++) {
          float id = lane + float(i);
          d = smin(d, stream(q, id, cell, t, 0.0), 0.020);
        }

        // Smaller tributaries merge into the large hanging lobes.
        float tributaryCell = cell * 0.557;
        float tributaryLane = floor(q.x / tributaryCell);
        for (int i = -2; i <= 2; i++) {
          float id = tributaryLane + float(i);
          d = smin(d, stream(q, id, tributaryCell, t, 0.5), 0.009);
        }

        // Fine threads hang between the broad streams; stable IDs avoid popping.
        float threadCell = cell * 0.293;
        float threadLane = floor(q.x / threadCell);
        for (int i = -2; i <= 2; i++) {
          float id = threadLane + float(i);
          d = smin(d, stream(q + vec2(0.0, 0.018), id,
            threadCell, t, 1.0), 0.0035);
        }

        // Microscopic edge corrugation: low amplitude preserves clean SDF AA.
        d += (noise(q * vec2(380.0, 150.0) * ns) - 0.5) * 0.00065;
        float aa = max(fwidth(d), 0.6 / uResolution.y);
        float ink = 1.0 - smoothstep(-aa, aa, d);

        // Rounded SDF cross-sections plus advected, anisotropic surface grooves.
        float depth = max(-d, 0.0);
        float roundness = sqrt(max(1.0 - exp(-depth * 105.0), 0.0001));
        float strands = fbm(vec2((q.x + 0.009 * sin(q.y * 13.0 - t))
          * 185.0 * ns, q.y * 5.5 - 0.32 * sin(t) ));
        float fineLines = noise(vec2(q.x * 720.0 * ns
          + 4.0 * sin(q.y * 9.0 - t), q.y * 31.0 - sin(t)));
        float height = roundness * 0.024;
        height += (strands - 0.46) * 0.0042 * smoothstep(0.0, 0.012, depth);
        height += (fineLines - 0.5) * 0.00007 * smoothstep(0.0, 0.005, depth);
        vec3 normal = normalize(vec3(-dFdx(height) * uResolution.x / aspect * uZoom,
                                    dFdy(height) * uResolution.y * uZoom, 1.0));
        vec3 light = normalize(vec3(-0.65, -0.48, 0.72));
        vec3 halfLight = normalize(light + vec3(0.0, 0.0, 1.0));
        float gloss = clamp(uGlossiness, 0.0, 1.5);
        float specular = pow(max(dot(normal, halfLight), 0.0), mix(42.0, 85.0, min(gloss, 1.0)));

        // A long studio softbox produces the broken white ribbons of wet enamel.
        vec3 reflection = reflect(vec3(0.0, 0.0, -1.0), normal);
        float ribbon = exp(-pow((reflection.x + 0.72 + 0.055 * sin(q.y * 18.0)) / 0.12, 2.0));
        ribbon *= smoothstep(-0.3, 0.25, reflection.z);
        float breaks = smoothstep(0.30, 0.67,
          fbm(vec2(q.x * 110.0 + strands * 2.0, q.y * 38.0 - 0.6 * sin(t))));
        float shine = (specular * 0.83 + ribbon * breaks * 0.74) * gloss;
        shine *= smoothstep(0.0, aa * 1.5, depth);
        float rim = pow(1.0 - max(normal.z, 0.0), 4.0) * 0.022;
        float pigment = clamp(0.49 + 0.22 * sin(q.x * 5.0 + strands * 4.0)
          + 0.18 * sin(q.y * 4.0 + grain * 3.0) + 0.20 * (grain - 0.5), 0.0, 1.0);
        float stop = pigment * 5.0;
        int index = min(int(floor(stop)), 4);
        vec3 pigmentColor = mix(uPalette[index], uPalette[index + 1], smoothstep(0.0, 1.0, fract(stop)));
        vec3 base = mix(uPalette[0], pigmentColor, uPaletteBlend);
        float accentMask = smoothstep(0.93, 0.99,
          0.5 + 0.5 * sin(q.x * 29.0 + 0.25 * sin(q.y * 7.0) + uSeed * 0.2));
        vec3 highlight = uHighlight;
        vec3 paper = uBackground;
        if (uInvert > 0.5) {
          base = vec3(1.0) - base;
          highlight = vec3(1.0) - highlight;
          paper = vec3(1.0) - paper;
        }
        // Accent pigment retains its chosen hue in either orientation.
        base = mix(base, uAccent, accentMask * uAccentAmount);
        vec3 inkColor = mix(base, highlight, clamp(shine + rim, 0.0, 0.98));
        if (uGreenscreen > 0.5) paper = vec3(0.0, 1.0, 0.0);
        // Very light contact shading gives the thick hanging edges physical depth.
        float shadow = exp(-max(d, 0.0) * 220.0) * (1.0 - ink) * 0.075 * (1.0 - uGreenscreen);
        vec3 color = mix(paper - shadow, clamp(inkColor, 0.0, 1.0), ink);
        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const canvas = document.querySelector('canvas');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false,
        powerPreference: 'high-performance' });
    } catch (error) {
      console.error('WebGL 2 is required to render Black Ink.', error);
      throw error;
    }
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const geometry = new THREE.PlaneGeometry(2, 2);
    const material = new THREE.ShaderMaterial({
      uniforms, vertexShader, fragmentShader,
      depthTest: false, depthWrite: false, toneMapped: false
    });
    const plane = new THREE.Mesh(geometry, material);
    plane.frustumCulled = false;
    scene.add(plane);

    const colorKeys = ['inkColor', 'color2', 'color3', 'color4', 'color5', 'color6'];
    function setColor(target, hex) {
      // Shader colors are display RGB, matching the color pickers exactly.
      target.set(hex).convertLinearToSRGB();
    }
    function syncColors() {
      colorKeys.forEach((key, index) => setColor(uniforms.uPalette.value[index], config[key]));
      setColor(uniforms.uBackground.value, config.backgroundColor);
      setColor(uniforms.uHighlight.value, config.highlightColor);
      setColor(uniforms.uAccent.value, config.accentColor);
      uniforms.uPaletteBlend.value = config.paletteBlend;
      uniforms.uAccentAmount.value = config.accentAmount;
      uniforms.uInvert.value = Number(config.invert);
      uniforms.uGreenscreen.value = Number(config.greenscreen);
    }
    function applyScheme() {
      const preset = schemes[config.scheme];
      // Resample all supplied stops, including six-color palettes and repeats.
      colorKeys.forEach((key, i) => {
        const index = Math.min(preset.colors.length - 1,
          Math.floor(i * preset.colors.length / colorKeys.length));
        config[key] = '#' + preset.colors[index];
      });
      config.backgroundColor = '#' + preset.background;
      config.highlightColor = '#ffffff';
      config.accentColor = '#' + (preset.accent || 'e53b38');
      config.paletteBlend = preset.blend ?? 0.88;
      config.accentAmount = preset.amount ?? 0;
      syncColors();
      refreshPanel();
    }

    const gui = new GUI({ title: 'Ink settings' });
    function refreshPanel() {
      gui.controllersRecursive().forEach(controller => controller.updateDisplay());
    }
    const colors = gui.addFolder('Colors');
    colors.add(config, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
    colors.add(config, 'invert').name('Invert palette').onChange(syncColors);
    colors.add(config, 'greenscreen').name('Greenscreen').onChange(syncColors);
    colors.addColor(config, 'backgroundColor').name('Background').onChange(syncColors);
    colors.addColor(config, 'inkColor').name('Ink color').onChange(syncColors);
    const palette = colors.addFolder('Palette & reflections').close();
    colorKeys.slice(1).forEach((key, i) => {
      palette.addColor(config, key).name('Pigment ' + (i + 2)).onChange(syncColors);
    });
    palette.add(config, 'paletteBlend', 0, 1, 0.01).name('Palette blend').onChange(syncColors);
    palette.addColor(config, 'highlightColor').name('Reflections').onChange(syncColors);
    palette.addColor(config, 'accentColor').name('Accent color').onChange(syncColors);
    palette.add(config, 'accentAmount', 0, 1, 0.01).name('Accent amount').onChange(syncColors);

    const motion = gui.addFolder('Animation');
    motion.add(config, 'animation', animations).name('Animation');
    motion.add(config, 'speed', 0, 3, 0.01).name('Speed');
    motion.add(config, 'motionStrength', 0, 1.75, 0.01).name('Flow strength');
    motion.add(config, 'sway', 0, 1.6, 0.01).name('Filament sway');
    const inkSettings = gui.addFolder('Ink geometry').close();
    inkSettings.add(config, 'viscosity', 0.15, 2, 0.01).name('Viscosity');
    inkSettings.add(config, 'density', 0.5, 2, 0.01).name('Drip density');
    inkSettings.add(config, 'length', 0.3, 1.4, 0.01).name('Drip length');
    inkSettings.add(config, 'glossiness', 0, 1.5, 0.01).name('Glossiness');
    inkSettings.add(config, 'noiseScale', 0.25, 3, 0.01).name('Noise scale');
    inkSettings.add(config, 'seed', 0, 999, 1).name('Seed').listen();
    const view = gui.addFolder('Camera & framing').close();
    view.add(config, 'zoom', 0.35, 4, 0.01).name('Zoom').listen();
    view.add(config, 'panX', -3, 3, 0.001).name('Horizontal').listen();
    view.add(config, 'panY', -3, 3, 0.001).name('Vertical').listen();
    view.add(config, 'yaw', -55, 55, 0.1).name('Yaw').listen();
    view.add(config, 'pitch', -55, 55, 0.1).name('Pitch').listen();
    view.add(config, 'roll', -180, 180, 0.1).name('Roll');
    view.add({ resetView() {
      Object.assign(config, { zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0 });
      refreshPanel();
    } }, 'resetView').name('Reset view');
    const quality = gui.addFolder('Rendering').close();
    quality.add(config, 'pixelRatio', 0.5, 3, 0.25).name('Pixel ratio (DPR)').onChange(() => resize());
    const variations = gui.addFolder('Variations').close();
    variations.add(config, 'randomizeOnClick').name('Randomize on click');
    variations.add({ randomize: randomizeScene }, 'randomize').name('New variation');
    if (window.innerWidth < 600) gui.close();
    syncColors();

    function randomizeScene() {
      const pick = list => list[Math.floor(Math.random() * list.length)];
      const range = (min, max) => min + Math.random() * (max - min);
      config.scheme = pick(Object.keys(schemes));
      applyScheme();
      Object.assign(config, {
        seed: (config.seed + 1 + Math.floor(Math.random() * 998)) % 1000,
        animation: pick(animations.filter(name => name !== 'Static')),
        speed: range(0.45, 1.15), motionStrength: range(0.55, 1.3), sway: range(0.5, 1.35),
        viscosity: range(0.55, 1.65), density: range(0.75, 1.6),
        length: range(0.75, 1.15), glossiness: range(0.65, 1.2), noiseScale: range(0.7, 1.6)
      });
      refreshPanel();
    }

    let uiVisible = true;
    window.addEventListener('keydown', event => {
      if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      const target = event.target;
      if (target instanceof HTMLElement && (target.isContentEditable || target.tagName === 'TEXTAREA')) return;
      if (target instanceof HTMLInputElement && /^(text|search|email|password|url|tel)$/.test(target.type)) return;
      uiVisible = !uiVisible;
      gui.show(uiVisible);
    });

    let width = 0, height = 0, pixelRatio = 0;
    function resize() {
      const w = Math.max(1, window.innerWidth);
      const h = Math.max(1, window.innerHeight);
      const maxBuffer = renderer.capabilities.maxTextureSize;
      const dpr = Math.min(config.pixelRatio, maxBuffer / w, maxBuffer / h);
      if (width === w && height === h && pixelRatio === dpr) return;
      width = w; height = h; pixelRatio = dpr;
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    // Zoom is cursor-anchored. Animated zoom is a multiplier, so manual zoom
    // and angle offsets persist through every subsequent animation frame.
    function zoomAt(next, x, y) {
      const nextZoom = THREE.MathUtils.clamp(next, 0.35, 4);
      const ratio = nextZoom / config.zoom;
      const sx = (x - width * 0.5) / height;
      const sy = (height * 0.5 - y) / height;
      config.panX += (sx - uniforms.uPan.value.x) * (1 - ratio);
      config.panY += (sy - uniforms.uPan.value.y) * (1 - ratio);
      config.zoom = nextZoom;
    }
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? height : 1;
      zoomAt(config.zoom * Math.exp(-event.deltaY * unit * 0.001), event.clientX, event.clientY);
    }, { passive: false });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    const pointers = new Map();
    let gesture = null;
    const midpoint = pair => ({ x: (pair[0].x + pair[1].x) / 2, y: (pair[0].y + pair[1].y) / 2 });
    const distance = pair => Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y);
    canvas.addEventListener('pointerdown', event => {
      if (event.button > 2) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      canvas.setPointerCapture(event.pointerId);
      if (pointers.size === 1) {
        gesture = { x: event.clientX, y: event.clientY, moved: false,
          orbit: event.button === 2 || event.shiftKey, click: event.button === 0 };
      } else if (gesture) gesture.moved = true;
    });
    canvas.addEventListener('pointermove', event => {
      const previousPointer = pointers.get(event.pointerId);
      if (!previousPointer || !gesture) return;
      const before = Array.from(pointers.values());
      const dx = event.clientX - previousPointer.x, dy = event.clientY - previousPointer.y;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pointers.size > 1) {
        const after = Array.from(pointers.values());
        const a = midpoint(before), b = midpoint(after);
        zoomAt(config.zoom * distance(after) / Math.max(distance(before), 1), a.x, a.y);
        config.panX += (b.x - a.x) / height;
        config.panY -= (b.y - a.y) / height;
        gesture.moved = true;
      } else {
        if (Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) > 5) gesture.moved = true;
        if (!gesture.moved) return;
        if (gesture.orbit) {
          config.yaw = THREE.MathUtils.clamp(config.yaw + dx * 0.12, -55, 55);
          config.pitch = THREE.MathUtils.clamp(config.pitch + dy * 0.12, -55, 55);
        } else {
          config.panX += dx / height;
          config.panY -= dy / height;
        }
      }
    });
    function endPointer(event) {
      if (!pointers.has(event.pointerId)) return;
      pointers.delete(event.pointerId);
      const randomize = event.type === 'pointerup' && !pointers.size && gesture &&
        !gesture.moved && gesture.click && config.randomizeOnClick;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (!pointers.size) gesture = null;
      if (randomize) randomizeScene();
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('lostpointercapture', endPointer);

    const rotation = new THREE.Matrix4();
    const euler = new THREE.Euler();
    function updateScene(loopTime) {
      const phase = loopTime * Math.PI * 2 / 40;
      const amplitude = config.motionStrength;
      let panX = 0, panY = 0, yaw = 0, pitch = 0, zoom = 1;
      let flow = 1, sway = 1, stretch = 1, viscosity = 0;
      switch (config.animation) {
        case 'Heavy ooze': flow = 0.65; viscosity = 0.3; break;
        case 'Filament sway': flow = 0.7; sway = 1.2; break;
        case 'Tidal breathing': stretch = 1 + Math.sin(phase) * 0.035 * amplitude; break;
        case 'Slow orbit':
          yaw = Math.sin(phase) * 17 * amplitude;
          pitch = Math.sin(phase * 2) * 7 * amplitude;
          break;
        case 'Drifting study':
          panX = Math.sin(phase) * 0.045 * amplitude;
          panY = (Math.cos(phase) - 1) * 0.015 * amplitude;
          break;
        case 'Macro glide':
          zoom = 1 + (1 - Math.cos(phase)) * 0.075 * amplitude;
          panX = Math.sin(phase) * 0.025 * amplitude;
          break;
      }
      uniforms.uTime.value = loopTime;
      uniforms.uSpeed.value = 1;
      uniforms.uViscosity.value = config.viscosity + viscosity;
      uniforms.uDripDensity.value = config.density;
      uniforms.uDripLength.value = config.length * stretch;
      uniforms.uGlossiness.value = config.glossiness;
      uniforms.uNoiseScale.value = config.noiseScale;
      uniforms.uSeed.value = config.seed;
      uniforms.uMotion.value = amplitude * flow;
      uniforms.uSway.value = config.sway * sway;
      uniforms.uZoom.value = config.zoom * zoom;
      uniforms.uPan.value.set(config.panX + panX, config.panY + panY);
      const radians = Math.PI / 180;
      rotation.makeRotationFromEuler(euler.set((config.pitch + pitch) * radians,
        (config.yaw + yaw) * radians, config.roll * radians, 'YXZ'));
      const e = rotation.elements;
      uniforms.uView.value.set(e[0], e[4], 0, e[1], e[5], 0, 0, 0, 1).invert();
    }

    // Pause the clock in hidden tabs instead of jumping after a long suspension.
    let loopTime = 0, previous = null, frame = 0;
    let contextLost = false, disposed = false;
    function animate(now) {
      if (disposed || document.hidden || contextLost) return;
      if (previous !== null && config.animation !== 'Static') {
        const rate = config.animation === 'Heavy ooze' ? 0.65 : 1;
        // Integrating speed avoids a phase jump when its slider changes.
        loopTime = (loopTime + Math.min((now - previous) / 1000, 0.1) * config.speed * rate) % 40;
      }
      previous = now;
      updateScene(loopTime);
      resize();
      renderer.render(scene, camera);
      frame = requestAnimationFrame(animate);
    }
    function resume() {
      cancelAnimationFrame(frame);
      previous = null;
      if (!document.hidden && !contextLost && !disposed) frame = requestAnimationFrame(animate);
    }
    document.addEventListener('visibilitychange', resume);
    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      contextLost = true;
      cancelAnimationFrame(frame);
    });
    canvas.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      resize();
      resume();
    });
    window.addEventListener('pagehide', event => {
      cancelAnimationFrame(frame);
      if (event.persisted) return;
      disposed = true;
      geometry.dispose();
      material.dispose();
      gui.destroy();
      renderer.dispose();
    });
    window.addEventListener('pageshow', resume);
    resume();
  </script>
</body>
</html>
