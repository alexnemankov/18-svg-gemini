// Helper: hex string to THREE.Vector3 RGB [0, 1]
function hexToVec3(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}

// ============================================================
//  Shaders
// ============================================================
const vertexShader = /* glsl */ `
in vec3 position;
void main() {
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const fragmentShader = /* glsl */ `
precision highp float;
precision highp int;

#define MAX_LEVELS ${MAX_LEVELS}

uniform vec2  uResolution;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamForward;
uniform float uFocal;

uniform vec3  uObjOffset;
uniform mat3  uObjRot;
uniform float uThick[MAX_LEVELS];

uniform float uMaxDist;
uniform float uSurfEps;
uniform float uStepFactor;
uniform float uObjSize;
uniform float uFractalScale;
uniform float uBoundRadius;

uniform float uHoloFreq;
uniform float uHoloPhase;
uniform float uHoloAmount;
uniform float uSweepY;
uniform float uScanlineAmt;

uniform float uExposure;
uniform float uSceneLightIntensity;
uniform float uAmbientIntensity;
uniform float uGlowStrength;
uniform vec3  uGlowColor;

uniform vec3  uLight1Color;
uniform float uLight1Intensity;
uniform vec3  uLight2Color;
uniform float uLight2Intensity;
uniform vec3  uLight3Color;
uniform float uLight3Intensity;

uniform float uGlassIor;
uniform float uDispersion;
uniform vec3  uGlassAbsorb;

uniform vec3  uBgColor;

out vec4 fragColor;

const float TAU = 6.28318530718;

// ---------- Math ----------
vec2 sphereIntersect(vec3 ro, vec3 rd, float r) {
  float b = dot(ro, rd);
  float c = dot(ro, ro) - r * r;
  float h = b * b - c;
  if (h < 0.0) return vec2(-1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

vec3 safeRefract(vec3 I, vec3 N, float eta) {
  vec3 r = refract(I, N, eta);
  return dot(r, r) < 1e-6 ? reflect(I, N) : r;
}

// ---------- Color ----------
vec3 holoPalette(float x) {
  vec3 c = 0.5 + 0.5 * cos(TAU * (x + vec3(0.0, 0.33, 0.67)));
  c = mix(c, c * vec3(0.75, 0.9, 1.15), 0.5);
  return c * c;
}

vec3 thinFilm(float ndv, float thickness) {
  float sinT2 = (1.0 - ndv * ndv) / (1.4 * 1.4);
  float cosT  = sqrt(max(1.0 - sinT2, 0.0));
  float phase = thickness * cosT * uHoloFreq;
  vec3  c = 0.5 + 0.5 * cos(TAU * (phase + vec3(0.0, 0.33, 0.67)));
  c = mix(c, c * vec3(0.8, 0.95, 1.2), 0.4);
  return 2.0 * c * c + 0.15;
}

vec3 acesTonemap(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

vec3 toDisplay(vec3 c) {
  return pow(acesTonemap(max(c * uExposure, 0.0)), vec3(1.0 / 2.2));
}

// ---------- Environment & Lighting ----------
vec3 envBase(vec3 d) {
  return mix(vec3(0.004, 0.005, 0.012), vec3(0.012, 0.008, 0.03),
             clamp(d.y * 0.5 + 0.5, 0.0, 1.0));
}

vec3 envLit(vec3 d) {
  vec3 c = envBase(d) * (2.0 * uAmbientIntensity);
  c += uLight1Color * (3.0 * uLight1Intensity) *
       smoothstep(0.25, 0.05, abs(d.x)) * smoothstep(0.55, 0.8, d.y);
  c += uLight2Color * (2.0 * uLight2Intensity) *
       smoothstep(0.78, 0.96, dot(d, vec3(-0.94, 0.19, 0.28)));
  c += uLight3Color * (1.6 * uLight3Intensity) *
       smoothstep(0.80, 0.97, dot(d, vec3(0.93, -0.28, -0.19)));
  c += vec3(0.05, 0.06, 0.1) * smoothstep(0.0, -0.8, d.y);
  return c * uSceneLightIntensity;
}

// ---------- SDF ----------
float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float map(vec3 p, out float trap) {
  p = (uObjRot * p) / uObjSize;
  float d = sdBox(p, vec3(1.0));
  float h = 1.0;
  trap = 1e9;

  for (int i = 0; i < FRACTAL_ITERS; i++) {
    vec3 a = abs(mod(p + h, 2.0 * h) - h);
    float slabs = min(min(a.x, a.y), a.z) - h * uThick[i];
    d = max(d, slabs);
    trap = min(trap, dot(a, a) / (h * h));
    h /= uFractalScale;
  }
  return d * uObjSize;
}

float mapD(vec3 p) {
  float t;
  return map(p, t);
}

// ---------- Normals & AO ----------
vec3 calcNormal(vec3 p, float h) {
  const vec2 k = vec2(1.0, -1.0);
  vec3 g = k.xyy * mapD(p + k.xyy * h) +
           k.yyx * mapD(p + k.yyx * h) +
           k.yxy * mapD(p + k.yxy * h) +
           k.xxx * mapD(p + k.xxx * h);
  return g * inversesqrt(max(dot(g, g), 1e-12));
}

float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, w = 1.0;
  for (int i = 0; i < AO_SAMPLES; i++) {
    float h = 0.01 + 0.06 * float(i);
    occ += (h - mapD(p + n * h)) * w;
    w *= 0.7;
  }
  return clamp(1.0 - 3.0 * occ, 0.0, 1.0);
}

// ---------- Interior march ----------
float traceInterior(vec3 ro, vec3 rd, out vec3 pExit) {
  float t = 0.0;
  for (int i = 0; i < INTERIOR_STEPS; i++) {
    float d = -mapD(ro + rd * t);
    if (d < 0.001) break;
    t += max(d * uStepFactor, 0.004);
    if (t > 2.0 * uBoundRadius) break;
  }
  pExit = ro + rd * t;
  return t;
}

// ---------- Render one sample ----------
vec3 render(vec2 fragCoord) {
  vec2 uv = (2.0 * fragCoord - uResolution) / uResolution.y;

  vec3 ro = (uCamPos - uObjOffset);
  vec3 rd = normalize(uv.x * uCamRight + uv.y * uCamUp + uFocal * uCamForward);

  vec3  objCol   = vec3(0.0);
  float coverage = 0.0;

  vec2  bnd  = sphereIntersect(ro, rd, uBoundRadius);
  float t    = max(bnd.x, 0.0);
  float tFar = min(bnd.y, t + uMaxDist);
  float glow = 0.0;
  float trap = 0.0;
  bool  hit  = false;

  if (bnd.y > 0.0) {
    for (int i = 0; i < MAX_STEPS; i++) {
      float d = map(ro + rd * t, trap);
      glow += exp(-d * 30.0) * 0.012;
      if (d < uSurfEps * t) { hit = true; break; }
      t += d * uStepFactor;
      if (t > tFar) break;
    }
  }

  if (hit) {
    vec3  p   = ro + rd * t;
    vec3  n   = calcNormal(p, max(uSurfEps * t, 0.0005));
    float ao  = calcAO(p, n);
    float ndv = clamp(dot(n, -rd), 0.0, 1.0);
    float fr  = 1.0 - ndv;
    float fr2 = fr * fr;
    float F   = 0.04 + 0.96 * fr2 * fr2 * fr;

    float filmThick = 1.0 + 0.35 * log(1.0 + trap)
                    + 0.4 * sin(dot(p, vec3(2.1, 1.7, 2.6)))
                    + uHoloPhase / uHoloFreq;
    vec3 film     = thinFilm(ndv, filmThick);
    vec3 reflTint = mix(vec3(1.0), film, uHoloAmount);

    vec3 refl = envLit(reflect(rd, n)) * reflTint;

    vec3 dIn = safeRefract(rd, n, 1.0 / uGlassIor);
    vec3 pExit;
    float thick = traceInterior(p - n * 0.01, dIn, pExit);
    vec3  nExit = -calcNormal(pExit, 0.001);
    vec3  iors  = uGlassIor + vec3(-uDispersion, 0.0, uDispersion);
    vec3 trans;
    trans.r = envLit(safeRefract(dIn, nExit, iors.r)).r;
    trans.g = envLit(safeRefract(dIn, nExit, iors.g)).g;
    trans.b = envLit(safeRefract(dIn, nExit, iors.b)).b;
    trans *= exp(-thick * uGlassAbsorb);

    const vec3 L = vec3(0.5306, 0.7960, -0.2908);
    float dif  = clamp(dot(n, L), 0.0, 1.0);
    vec3  hv   = normalize(L - rd);
    float spec = pow(clamp(dot(n, hv), 0.0, 1.0), 96.0);

    float aoSoft = mix(0.55, 1.0, ao);
    objCol  = mix(trans, refl, F) * aoSoft;
    objCol += film * uHoloAmount * 0.08 * (0.3 + dif) * ao;
    objCol += reflTint * spec * 2.5 * ao;

    float sy = p.y - uSweepY;
    objCol += film * exp(-sy * sy * 60.0) * 0.6;

    float depth = max(t - (length(ro) - uBoundRadius), 0.0);
    coverage = exp(-0.08 * depth * depth);
  }

  // Volumetric edge glow
  vec3 holoGlow = holoPalette(0.6 + 0.25 * uv.y + uHoloPhase);
  vec3 glowLin = mix(holoGlow, uGlowColor, 0.65) * glow * uGlowStrength;

  // Composite in display space so the background color stays exact
  vec3 bgWithGlow = 1.0 - (1.0 - uBgColor) * (1.0 - toDisplay(glowLin));
  vec3 col = mix(bgWithGlow, toDisplay(objCol + glowLin), coverage);

  // Scanlines
  col *= 1.0 - uScanlineAmt * (0.5 + 0.5 * sin(fragCoord.y * TAU / 3.0));
  return col;
}

void main() {
#if AA > 1
  vec3 col = vec3(0.0);
  for (int j = 0; j < AA; j++) {
    for (int i = 0; i < AA; i++) {
      vec2 o = (vec2(float(i), float(j)) + 0.5) / float(AA) - 0.5;
      col += render(gl_FragCoord.xy + o);
    }
  }
  col /= float(AA * AA);
#else
  vec3 col = render(gl_FragCoord.xy);
#endif
  fragColor = vec4(col, 1.0);
}
`;

let composer;
let smaaPass;

function buildComposer() {
  composer = new EffectComposer(renderer);
  composer.setPixelRatio(Math.min(PARAMS.dpr, MAX_DPR));
  composer.addPass(new RenderPass(scene, camera));
  smaaPass = new SMAAPass(window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio());
  smaaPass.enabled = PARAMS.smaa;
  composer.addPass(smaaPass);
}
buildComposer();

// ============================================================
//  Camera / resize / DPR / colors
// ============================================================
function updateCamera() {
  const dist = PARAMS.camDistance;
  const height = PARAMS.camHeight;
  const angle = PARAMS.orbitAngle;

  // Spherical/cylindrical orbiting position
  camPos.set(
    dist * Math.sin(angle),
    height,
    -dist * Math.cos(angle)
  );
  camForward.copy(camPos).negate().normalize();
  camRight.crossVectors(WORLD_UP, camForward).normalize();
  camUp.crossVectors(camForward, camRight);
  uniforms.uFocal.value = 1.0 / Math.tan(THREE.MathUtils.degToRad(PARAMS.fov) * 0.5);
}

function updateBackgroundColor() {
  const hex = PARAMS.greenscreen ? '#00ff00' : PARAMS.backgroundColor;
  const n = parseInt(hex.slice(1), 16);
  uniforms.uBgColor.value.set(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
  document.body.style.background = hex;
}

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  renderer.getDrawingBufferSize(uniforms.uResolution.value);
}

function setDPR(value) {
  const dpr = THREE.MathUtils.clamp(value, 0.5, MAX_DPR);
  renderer.setPixelRatio(dpr);
  composer.setPixelRatio(dpr);
  resize();
}

function setDefine(name, value) {
  const v = Math.round(value);
  if (material.defines[name] === v) return;
  material.defines[name] = v;
  material.needsUpdate = true;
}

function setAntialias(enabled) {
  PARAMS.antialias = enabled;
  const oldCanvas = canvas;
  renderer.dispose();
  renderer = new THREE.WebGLRenderer({ antialias: enabled, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(PARAMS.dpr, MAX_DPR));
  renderer.setSize(window.innerWidth, window.innerHeight);
  oldCanvas.replaceWith(renderer.domElement);
  canvas = renderer.domElement;
  attachCanvasEvents(canvas);
  buildComposer();
  resize();
}

window.addEventListener('resize', resize);
updateCamera();
updateBackgroundColor();
resize();

// ============================================================
//  Animation State & Presets
// ============================================================
const anim = {
  rotPhase: 0,
  morphPhase: 0,
  holoPhase: 0,
  sweepPhase: 0,
  camPhase: 0
};

const rotY = new THREE.Matrix3();
const rotX = new THREE.Matrix3();
const autoRot = new THREE.Matrix3();
const userRotT = new THREE.Matrix3();
const userMat4 = new THREE.Matrix4();
const userQuat = new THREE.Quaternion();
const tmpQuat = new THREE.Quaternion();

function updateAnimation(dt) {
  const t = PARAMS.paused ? 0 : dt * PARAMS.timeScale;
  anim.rotPhase   += t * PARAMS.rotSpeed;
  anim.morphPhase += t * PARAMS.morphSpeed;
  anim.holoPhase  += t * PARAMS.holoSpeed;
  anim.sweepPhase += t * PARAMS.sweepSpeed;
  anim.camPhase   += t * 0.4;

  // Auto rotation of object
  const ay = anim.rotPhase;
  const ax = 0.35 + 0.2 * Math.sin(anim.rotPhase * 0.7);
  const cy = Math.cos(ay), sy = Math.sin(ay);
  const cx = Math.cos(ax), sx = Math.sin(ax);
  rotY.set(cy, 0, sy,   0, 1, 0,   -sy, 0, cy);
  rotX.set(1, 0, 0,    0, cx, -sx,  0, sx, cx);
  autoRot.multiplyMatrices(rotY, rotX);

  userMat4.makeRotationFromQuaternion(userQuat);
  userRotT.setFromMatrix4(userMat4).transpose();
  uniforms.uObjRot.value.multiplyMatrices(autoRot, userRotT);

  // Fractal slabs breathing wave
  for (let i = 0; i < MAX_LEVELS; i++) {
    thickArray[i] = (1 / 3) *
      (1 + PARAMS.morphAmount * Math.sin(anim.morphPhase - i * PARAMS.levelPhaseLag * 3));
  }

  uniforms.uHoloPhase.value = anim.holoPhase;
  const s = anim.sweepPhase % 5.0;
  uniforms.uSweepY.value = (s < 0 ? s + 5.0 : s) - 2.5;

  // 8 Preconfigured Camera Animations
  // User zoom and angle offsets persist and are not overwritten!
  let animDeltaAngle = 0.0;
  let animDeltaHeight = 0.0;
  let animDeltaDist = 0.0;
  const cp = anim.camPhase;

  switch (PARAMS.animation) {
    case 'Static (No Movement)':
      animDeltaAngle = 0.0;
      animDeltaHeight = 0.0;
      animDeltaDist = 0.0;
      break;
    case 'Smooth Orbit':
      animDeltaAngle = cp * 0.45;
      animDeltaHeight = 0.35 * Math.sin(cp * 0.3);
      animDeltaDist = 0.0;
      break;
    case 'Breathing Glide':
      animDeltaAngle = 0.2 * Math.sin(cp * 0.3);
      animDeltaHeight = 0.45 * Math.sin(cp * 0.5);
      animDeltaDist = 0.85 * Math.sin(cp * 0.6);
      break;
    case 'Figure-8 Drift':
      animDeltaAngle = 0.5 * Math.sin(cp * 0.35);
      animDeltaHeight = 0.65 * Math.sin(cp * 0.7);
      animDeltaDist = 0.4 * Math.cos(cp * 0.35);
      break;
    case 'Vertical Sine Rise & Fall':
      animDeltaAngle = 0.2 * Math.cos(cp * 0.25);
      animDeltaHeight = 1.6 * Math.sin(cp * 0.4);
      animDeltaDist = 0.3 * Math.sin(cp * 0.25);
      break;
    case 'Diagonal Helix':
      animDeltaAngle = cp * 0.35;
      animDeltaHeight = 1.2 * Math.sin(cp * 0.35);
      animDeltaDist = 0.45 * Math.cos(cp * 0.35);
      break;
    case 'Pendulum Arc':
      animDeltaAngle = 0.75 * Math.sin(cp * 0.45);
      animDeltaHeight = 0.35 * (1.0 - Math.cos(cp * 0.9));
      animDeltaDist = 0.25 * Math.cos(cp * 0.45);
      break;
    case 'Hypnotic Micro-Drift':
      animDeltaAngle = 0.12 * Math.sin(cp * 0.15);
      animDeltaHeight = 0.25 * Math.sin(cp * 0.2);
      animDeltaDist = 0.18 * Math.cos(cp * 0.18);
      break;
  }

  const effectiveDist = Math.max(1.2, PARAMS.camDistance + animDeltaDist);
  const effectiveHeight = PARAMS.camHeight + animDeltaHeight;
  const effectiveAngle = PARAMS.orbitAngle + animDeltaAngle;

  camPos.set(
    effectiveDist * Math.sin(effectiveAngle),
    effectiveHeight,
    -effectiveDist * Math.cos(effectiveAngle)
  );
  camForward.copy(camPos).negate().normalize();
  camRight.crossVectors(WORLD_UP, camForward).normalize();
  camUp.crossVectors(camForward, camRight);
  uniforms.uFocal.value = 1.0 / Math.tan(THREE.MathUtils.degToRad(PARAMS.fov) * 0.5);
}

function syncUniforms() {
  const u = uniforms;
  u.uMaxDist.value = PARAMS.maxDist;
  u.uSurfEps.value = PARAMS.surfEps;
  u.uStepFactor.value = PARAMS.stepFactor;
  u.uObjSize.value = PARAMS.objSize;
  u.uFractalScale.value = PARAMS.fractalScale;
  u.uBoundRadius.value = PARAMS.boundRadius;
  u.uHoloFreq.value = PARAMS.holoFreq;
  u.uHoloAmount.value = PARAMS.holoAmount;
  u.uScanlineAmt.value = PARAMS.scanlines;
  u.uExposure.value = PARAMS.exposure;
  u.uSceneLightIntensity.value = PARAMS.sceneLightIntensity;
  u.uAmbientIntensity.value = PARAMS.ambientIntensity;
  u.uGlowStrength.value = PARAMS.glowStrength;
  u.uGlowColor.value.copy(hexToVec3(PARAMS.glowColor));
  u.uLight1Color.value.copy(hexToVec3(PARAMS.light1Color));
  u.uLight1Intensity.value = PARAMS.light1Intensity;
  u.uLight2Color.value.copy(hexToVec3(PARAMS.light2Color));

  u.uDispersion.value = PARAMS.dispersion;
  u.uGlassAbsorb.value.set(PARAMS.absorbR, PARAMS.absorbG, PARAMS.absorbB);
}

// ============================================================
//  Apply Color Scheme
// ============================================================
function applyColorScheme(schemeName) {
  const scheme = COLOR_SCHEMES[schemeName];
  if (!scheme) return;

  PARAMS.colorScheme = schemeName;

  // Handle Achromatic Inversions if applicable
  if (schemeName.startsWith('Achromatic') && !schemeName.includes('+ Accent')) {
    if (PARAMS.achromaticVariant === 'White & Black') {
      PARAMS.backgroundColor = '#ffffff';
      PARAMS.absorbR = 1.80; PARAMS.absorbG = 1.80; PARAMS.absorbB = 1.80;
      PARAMS.glowColor = '#444444';
      PARAMS.glowStrength = 0.40;
      PARAMS.exposure = 1.05;
      PARAMS.light1Color = '#333333'; PARAMS.light1Intensity = 1.0;
      PARAMS.light2Color = '#222222'; PARAMS.light2Intensity = 0.8;
      PARAMS.light3Color = '#111111'; PARAMS.light3Intensity = 0.8;
    } else {
      PARAMS.backgroundColor = scheme.bg;
      PARAMS.absorbR = scheme.absorb[0]; PARAMS.absorbG = scheme.absorb[1]; PARAMS.absorbB = scheme.absorb[2];
      PARAMS.glowColor = scheme.glowColor;
      PARAMS.glowStrength = scheme.glowStrength;
      PARAMS.exposure = scheme.exposure;
      PARAMS.light1Color = scheme.light1Color; PARAMS.light1Intensity = scheme.light1Int;
      PARAMS.light2Color = scheme.light2Color; PARAMS.light2Intensity = scheme.light2Int;
      PARAMS.light3Color = scheme.light3Color; PARAMS.light3Intensity = scheme.light3Int;
    }
  } else if (schemeName.includes('+ Accent')) {
    if (PARAMS.achromaticVariant === 'White & Black') {
      PARAMS.backgroundColor = '#ffffff';
      PARAMS.absorbR = 1.60; PARAMS.absorbG = 1.60; PARAMS.absorbB = 1.60;
      PARAMS.glowColor = '#ff0033';
      PARAMS.glowStrength = 0.85;
      PARAMS.exposure = 1.10;
      PARAMS.light1Color = '#222222'; PARAMS.light1Intensity = 1.0;
      PARAMS.light2Color = '#444444'; PARAMS.light2Intensity = 0.8;
      PARAMS.light3Color = '#ff0033'; PARAMS.light3Intensity = 1.4;
    } else {
      PARAMS.backgroundColor = scheme.bg;
      PARAMS.absorbR = scheme.absorb[0]; PARAMS.absorbG = scheme.absorb[1]; PARAMS.absorbB = scheme.absorb[2];
      PARAMS.glowColor = scheme.glowColor;
      PARAMS.glowStrength = scheme.glowStrength;
      PARAMS.exposure = scheme.exposure;
      PARAMS.light1Color = scheme.light1Color; PARAMS.light1Intensity = scheme.light1Int;
      PARAMS.light2Color = scheme.light2Color; PARAMS.light2Intensity = scheme.light2Int;
      PARAMS.light3Color = scheme.light3Color; PARAMS.light3Intensity = scheme.light3Int;
    }
  } else {
    PARAMS.backgroundColor = scheme.bg;
    PARAMS.absorbR = scheme.absorb[0]; PARAMS.absorbG = scheme.absorb[1]; PARAMS.absorbB = scheme.absorb[2];
    PARAMS.glowColor = scheme.glowColor;
    PARAMS.glowStrength = scheme.glowStrength;
    PARAMS.exposure = scheme.exposure;
    PARAMS.light1Color = scheme.light1Color; PARAMS.light1Intensity = scheme.light1Int;
    PARAMS.light2Color = scheme.light2Color; PARAMS.light2Intensity = scheme.light2Int;
    PARAMS.light3Color = scheme.light3Color; PARAMS.light3Intensity = scheme.light3Int;
  }

  updateBackgroundColor();
  syncUniforms();
  updateGuiControllers();
}

const ANIMATION_LIST = [
  'Static (No Movement)',

function randomizeScene() {
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  applyColorScheme(randomScheme);

  // Geometric variation
  PARAMS.objSize = Number((0.85 + Math.random() * 0.85).toFixed(2));
  PARAMS.fractalScale = Number((1.30 + Math.random() * 1.20).toFixed(2));
  PARAMS.fractalIters = Math.floor(3 + Math.random() * 3);
  setDefine('FRACTAL_ITERS', PARAMS.fractalIters);
  PARAMS.boundRadius = Number((1.70 + Math.random() * 0.90).toFixed(2));

  // Material & Optics
  PARAMS.glassIor = Number((1.25 + Math.random() * 0.55).toFixed(2));

  // Motion & Animation
  PARAMS.animation = ANIMATION_LIST[Math.floor(Math.random() * ANIMATION_LIST.length)];
  PARAMS.rotSpeed = Number(((Math.random() - 0.5) * 0.9).toFixed(2));

}

// ============================================================
//  Mouse, Touch, Wheel & Dragging Navigation
// ============================================================
const pointer = {
  dragging: false,
  button: 0,
  isShift: false,
  id: -1,
  startX: 0,
  startY: 0,
  lastX: 0,
  lastY: 0,
  accX: 0,
  accY: 0,
  downTime: 0,
  moved: false
};

const spin = { velX: 0, velY: 0 };

function attachCanvasEvents(targetCanvas) {
  targetCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

  targetCanvas.addEventListener('pointerdown', (e) => {
    pointer.dragging = true;
    pointer.button = e.button;
    pointer.isShift = e.shiftKey;
    pointer.id = e.pointerId;
    pointer.startX = e.clientX;
    pointer.startY = e.clientY;
    pointer.lastX = e.clientX;
    pointer.lastY = e.clientY;
    pointer.accX = 0;
    pointer.accY = 0;
    pointer.downTime = performance.now();
    pointer.moved = false;

    targetCanvas.setPointerCapture(e.pointerId);
    targetCanvas.classList.add('dragging');
  });

  targetCanvas.addEventListener('pointermove', (e) => {
    if (!pointer.dragging || e.pointerId !== pointer.id) return;

    const dx = e.clientX - pointer.lastX;
    const dy = e.clientY - pointer.lastY;

    if (Math.hypot(e.clientX - pointer.startX, e.clientY - pointer.startY) > 5) {
      pointer.moved = true;
    }

    // Drag object across screen if: right-click, middle-click, Shift+drag, or dragMode is 'Drag Object Across Screen'
    const isPan = (pointer.button === 2) || (pointer.button === 1) || pointer.isShift || (PARAMS.dragMode === 'Drag Object Across Screen');

    if (isPan) {
      const panSens = (PARAMS.camDistance * Math.tan(THREE.MathUtils.degToRad(PARAMS.fov) * 0.5) * 2.0) / Math.max(window.innerHeight, 1);
      objOffset.addScaledVector(camRight, dx * panSens);
      objOffset.addScaledVector(camUp, -dy * panSens);
      uniforms.uObjOffset.value.copy(objOffset);
    } else {
      pointer.accX += dx;
      pointer.accY += dy;

      // Adjust camera orbit angle and height during drag
      PARAMS.orbitAngle += (dx * 0.005);
      PARAMS.camHeight = THREE.MathUtils.clamp(PARAMS.camHeight - dy * 0.015, -20, 20);
    }

    pointer.lastX = e.clientX;
    pointer.lastY = e.clientY;
  });

  function handlePointerUp(e) {
    if (e.pointerId !== pointer.id) return;

    const clickDuration = performance.now() - pointer.downTime;
    if (!pointer.moved && clickDuration < 320 && pointer.button === 0) {
      if (PARAMS.clickRandomize) {
        randomizeScene();
      }
    }

    pointer.dragging = false;
    pointer.id = -1;
    targetCanvas.classList.remove('dragging');
  }

  targetCanvas.addEventListener('pointerup', handlePointerUp);
  targetCanvas.addEventListener('pointercancel', handlePointerUp);
  targetCanvas.addEventListener('lostpointercapture', handlePointerUp);

  // Smooth Zoom with Wheel (Persists during camera animation without reverting)
  targetCanvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomMultiplier = Math.exp(e.deltaY * 0.0018);
    PARAMS.camDistance = THREE.MathUtils.clamp(PARAMS.camDistance * zoomMultiplier, 1.2, 25.0);
    updateGuiControllers();
  }, { passive: false });
}

attachCanvasEvents(canvas);

function updateUserRotation(dt) {
  if (pointer.dragging && pointer.button === 0 && !pointer.isShift && PARAMS.dragMode === 'Rotate Object') {
    const sens = PARAMS.dragSensitivity * 3.0 / Math.max(window.innerHeight, 1);
    const targetX = (pointer.accX * sens) / dt;
    const targetY = (pointer.accY * sens) / dt;
    pointer.accX = 0;
    pointer.accY = 0;
    const k = 1.0 - Math.exp(-DRAG_RESPONSE * dt);
    spin.velX += (targetX - spin.velX) * k;
    spin.velY += (targetY - spin.velY) * k;
  } else {
    const decay = Math.exp(-PARAMS.inertiaDamping * dt);
    spin.velX *= decay;
    spin.velY *= decay;
  }

  const angX = -spin.velX * dt;
  const angY = -spin.velY * dt;
  if (Math.abs(angX) + Math.abs(angY) < 1e-7) return;

  tmpQuat.setFromAxisAngle(camUp, angX);
  userQuat.premultiply(tmpQuat);
  tmpQuat.setFromAxisAngle(camRight, angY);
  userQuat.premultiply(tmpQuat);
  userQuat.normalize();
}

}

const fLight1 = fLight.addFolder('Light 1 (Key Light)');

// Folder: Geometry & Material
const fGeom = gui.addFolder('Geometry');
fGeom.add(PARAMS, 'objSize', 0.5, 2.5, 0.01).name('Object Size');
fGeom.add(PARAMS, 'fractalScale', 1.1, 4.0, 0.01).name('Fractal Scale');

const fMat = gui.addFolder('Material & Optics');

fMat.add(PARAMS, 'holoAmount', 0.0, 1.0, 0.01).name('Holo Amount');
const fAbsorb = fMat.addFolder('Glass Absorption');
fAbsorb.add(PARAMS, 'absorbR', 0, 3, 0.01).name('Red');

// Folder: Performance & Antialiasing
const fPerf = gui.addFolder('Performance & Antialiasing');
fPerf.add(PARAMS, 'antialias').name('Three.js Antialias (Default ON)').onChange(setAntialias);
fPerf.add(PARAMS, 'dpr', 0.5, MAX_DPR, 0.25).name('Pixel Ratio (DPR)').onChange(setDPR);
fPerf.add(PARAMS, 'scanlines', 0, 0.5, 0.005).name('Scanlines');
fPerf.add(PARAMS, 'smaa').name('SMAA Pass').onChange((v) => { smaaPass.enabled = v; });

  .onChange((v) => setDefine('AA', Number(v)));
fPerf.add(PARAMS, 'maxSteps', 32, 300, 1).name('Max Steps')
  .onFinishChange((v) => setDefine('MAX_STEPS', v));

  .onFinishChange((v) => setDefine('INTERIOR_STEPS', v));

  .onFinishChange((v) => setDefine('AO_SAMPLES', v));
fPerf.add(PARAMS, 'maxDist', 1, 20, 0.1).name('Max Distance');
fPerf.add(PARAMS, 'surfEps', 0.0002, 0.01, 0.0001).name('Surface Epsilon');
fPerf.add(PARAMS, 'stepFactor', 0.5, 2.0, 0.01).name('Step Factor');

gui.close();

// Toggle GUI with "H" key
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    if (gui._hidden) {
      gui.show();
    } else {
      gui.hide();
    }
  }
});

// ============================================================
//  Render Loop
// ============================================================
let lastTime = performance.now();

document.addEventListener('visibilitychange', () => {
  lastTime = performance.now();
});

function frame() {
  const now = performance.now();
  const dt = Math.min(Math.max((now - lastTime) / 1000, 1e-4), MAX_DELTA);
  lastTime = now;

  updateUserRotation(dt);
  updateAnimation(dt);
  syncUniforms();

  composer.render();
}

renderer.setAnimationLoop(frame);
</script>
</body>
