<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lee Perry Smith - Procedural Dual Matcap Visualizer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      margin: 0;
      background-color: #000000;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .writing {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(3rem, 15vh, 12rem);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      letter-spacing: 0.08em;
      white-space: nowrap;
      text-align: center;
      transition: color 0.3s ease, -webkit-text-stroke 0.3s ease;
    }

    .back {
      color: #ffffff;
      z-index: 0;
    }

    .front {
      color: transparent;
      -webkit-text-stroke: 0.5vh #ffffff;
      z-index: 2;
      pointer-events: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .unselectable {
      -moz-user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { SimplexNoise } from "three/addons/math/SimplexNoise.js";
    import GUI from "lil-gui";

    console.clear();

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      45 * 0.4,
      window.innerWidth / window.innerHeight,
      1,
      1000
    );
    const initialCamPos = new THREE.Vector3(1, -5, 8).setLength(21);
    camera.position.copy(initialCamPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = true;
    controls.enableZoom = true;
    controls.minDistance = 3;
    controls.maxDistance = 80;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0;

    const simplex = new SimplexNoise();
    const clock = new THREE.Clock();

    const textBack = document.getElementById("textBack");
    const textFront = document.getElementById("textFront");

    // --- Color Scheme Definitions ---
    const colorSchemes = {
      "Cyber Neon": {
        bgColor: "#05050a",
        patternStyle: "radar",
        matcap1Bg: "#222222",
        matcap1Stroke: "#dddddd",
        matcap1PieColor: "#000000",
        matcap2Stops: ["#ff00ff", "#ff88ff", "#0044ff", "#ffff00"],
        matcap2Type: "linear",
        tintColor: "#ffffff",
        textFillColor: "#ffffff",
        textStrokeColor: "#ffffff",
        text: "3D ART",
        transitionSoftness: 0.1,
        transitionAngle: 0
      },
      "Molten Obsidian": {
        bgColor: "#090402",
        patternStyle: "radar",
        matcap1Bg: "#140f0c",
        matcap1Stroke: "#ffaa00",
        matcap1PieColor: "#000000",
        matcap2Stops: ["#ff1100", "#ff6600", "#ffbb00", "#ffffff"],
        matcap2Type: "linear",
        tintColor: "#ffffff",
        textFillColor: "#ffffff",
        textStrokeColor: "#ff9900",
        text: "OBSIDIAN",
        transitionSoftness: 0.08,
        transitionAngle: 0
      },
      "Vaporwave Sunset": {
        bgColor: "#0c0618",
        patternStyle: "rings",
        matcap1Bg: "#1a1030",
        matcap1Stroke: "#d8b4e2",
        matcap1PieColor: "#080210",
        matcap2Stops: ["#ff2a8d", "#8a2be2", "#00f0ff", "#ffe600"],
        matcap2Type: "linear",
        tintColor: "#ffffff",
        textFillColor: "#ffffff",
        textStrokeColor: "#ff70c0",
        text: "SYNTHWAVE",
        transitionSoftness: 0.12,
        transitionAngle: 15
      },
      "Emerald Matrix": {
        bgColor: "#020c06",
        patternStyle: "radar",
        matcap1Bg: "#05150a",
        matcap1Stroke: "#00ff66",
        matcap1PieColor: "#000000",
        matcap2Stops: ["#003811", "#00ff66", "#70e000", "#00ffff"],
        matcap2Type: "linear",
        tintColor: "#ffffff",
        textFillColor: "#ffffff",
        textStrokeColor: "#00ff88",
        text: "QUANTUM",
        transitionSoftness: 0.09,
        transitionAngle: 0
      },
      "Glacial Arctic": {
        bgColor: "#030a14",
        patternStyle: "grid",
        matcap1Bg: "#081729",
        matcap1Stroke: "#b0e0e6",
        matcap1PieColor: "#02060c",
        matcap2Stops: ["#03045e", "#0077b6", "#00b4d8", "#caf0f8"],
        matcap2Type: "linear",
        tintColor: "#ffffff",
        textFillColor: "#ffffff",
        textStrokeColor: "#90e0ef",
        text: "GLACIER",
        transitionSoftness: 0.1,
        transitionAngle: -20
      }
    };

    // --- State Parameters ---
    const params = {
      // Presets & Modes
      colorScheme: "Cyber Neon",
      animationMode: "Scan Wave",
      animSpeed: 1.0,
      dpr: Math.min(window.devicePixelRatio, 2),
      clickRandomize: true,

      // Greenscreen & Background
      greenScreen: false,
      bgColor: "#05050a",

      // Shader & Transition
      transitionLevel: 0.5,
      transitionSoftness: 0.1,
      transitionAngle: 0,
      autoTransition: true,
      tintColor: "#ffffff",

      // Matcap 1 (Pattern)
      patternStyle: "radar",
      matcap1Bg: "#222222",
      matcap1Stroke: "#dddddd",
      matcap1PieColor: "#000000",

      // Matcap 2 (Gradient)
      matcap2Stop1: "#ff00ff",
      matcap2Stop2: "#ff88ff",
      matcap2Stop3: "#0044ff",
      matcap2Stop4: "#ffff00",

      // Typography
      textContent: "3D ART",
      textFillColor: "#ffffff",
      textStrokeColor: "#ffffff",
      showText: true,

      // Controls
      autoRotate: true,
      autoRotateSpeed: 1.0,

      // Actions
      randomize: () => randomizeProceduralScene(),
      resetCamera: () => {
        camera.position.copy(initialCamPos);
        controls.target.set(0, -0.75, 0);
        controls.update();
      }
    };

    // --- Procedural Canvas Texture Generators ---
    function generateMatcap1Texture() {
      const c = document.createElement("canvas");
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext("2d");
      const unit = (val) => val * c.height * 0.01;

      ctx.fillStyle = params.matcap1Bg;
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.lineCap = "round";
      ctx.strokeStyle = params.matcap1Stroke;
      ctx.filter = `blur(${unit(0.5)}px)`;

      if (params.patternStyle === "radar" || params.patternStyle === "rings") {
        const rows = 8;
        const cols = 4;
        const colFactor = 0.75;
        const colAngle = Math.PI / cols;
        const colAngleHalf = colAngle * 0.5;

        for (let row = 0; row < rows; row++) {
          ctx.lineWidth = unit(10 - row * 0.8) * 0.25;
          const r = 47 - row * 5;
          if (params.patternStyle === "rings") {
            ctx.beginPath();
            ctx.arc(unit(50), unit(50), unit(r), 0, Math.PI * 2);
            ctx.stroke();
          } else {
            for (let col = 0; col < cols; col++) {
              ctx.beginPath();
              const centralAngle = -colAngleHalf - colAngle * col;
              ctx.arc(
                unit(50),
                unit(50),
                unit(r),
                centralAngle - colAngleHalf * colFactor,
                centralAngle + colAngleHalf * colFactor
              );
              ctx.stroke();
            }
          }
        }
      } else if (params.patternStyle === "grid") {
        ctx.lineWidth = unit(0.7);
        const step = unit(8);
        for (let x = 0; x <= c.width; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, c.height);
          ctx.stroke();
        }
        for (let y = 0; y <= c.height; y += step) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(c.width, y);
          ctx.stroke();
        }
      } else if (params.patternStyle === "dots") {
        ctx.fillStyle = params.matcap1Stroke;
        const step = unit(6);
        for (let x = unit(3); x < c.width; x += step) {
          for (let y = unit(3); y < c.height; y += step) {
            ctx.beginPath();
            ctx.arc(x, y, unit(1.2), 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      ctx.fillStyle = params.matcap1PieColor;
      ctx.beginPath();
      ctx.moveTo(unit(50), unit(50));
      ctx.arc(unit(50), unit(50), unit(50), Math.PI * 0.25, Math.PI * 0.75);
      ctx.fill();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.center.setScalar(0.5);
      return tex;
    }

    function generateMatcap2Texture() {
      const c = document.createElement("canvas");
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext("2d");

      const grd = ctx.createLinearGradient(0, 0, 0, c.height);
      const stops = [
        params.matcap2Stop1,
        params.matcap2Stop2,
        params.matcap2Stop3,
        params.matcap2Stop4
      ];
      stops.forEach((col, idx) => {
        const pos = idx / (stops.length - 1);
        grd.addColorStop(pos, col);
      });

      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, c.width, c.height);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.center.setScalar(0.5);
      return tex;
    }

    // --- Shader Uniforms & Material Setup ---
    const uniforms = {
      transitionLevel: { value: params.transitionLevel },
      transitionSoftness: { value: params.transitionSoftness },
      transitionAngle: { value: params.transitionAngle },
      tintColor: { value: new THREE.Color(params.tintColor) },
      matcap2: { value: null }
    };

    let tex1 = generateMatcap1Texture();
    let tex2 = generateMatcap2Texture();
    uniforms.matcap2.value = tex2;

    const material = new THREE.MeshMatcapMaterial({
      matcap: tex1
    });

    material.onBeforeCompile = (shader) => {
      shader.uniforms.transitionLevel = uniforms.transitionLevel;
      shader.uniforms.transitionSoftness = uniforms.transitionSoftness;
      shader.uniforms.transitionAngle = uniforms.transitionAngle;
      shader.uniforms.tintColor = uniforms.tintColor;
      shader.uniforms.matcap2 = uniforms.matcap2;

      shader.vertexShader = `
        varying vec4 vClipPos;
        ${shader.vertexShader}
      `.replace(
        `vViewPosition = - mvPosition.xyz;`,
        `vViewPosition = - mvPosition.xyz;
         vClipPos = gl_Position;`
      );

      shader.fragmentShader = `
        uniform float transitionLevel;
        uniform float transitionSoftness;
        uniform float transitionAngle;
        uniform vec3 tintColor;
        uniform sampler2D matcap2;
        varying vec4 vClipPos;
        ${shader.fragmentShader}
      `.replace(
        `vec4 matcapColor = texture2D( matcap, uv );`,
        `
        vec4 mc1 = texture( matcap, uv );
        vec4 mc2 = texture( matcap2, uv );
        
        vec2 clipUV = (vClipPos.xy / vClipPos.w) * 0.5 + 0.5;
        float rad = radians(transitionAngle);
        vec2 dir = vec2(sin(rad), cos(rad));
        float proj = dot(clipUV - vec2(0.5), dir) + 0.5;
        float soft = max(0.005, transitionSoftness);
        float blendFactor = smoothstep(transitionLevel - soft, transitionLevel + soft, proj);
        
        vec4 matcapColor = mix(mc1, mc2, blendFactor);
        matcapColor.rgb *= tintColor;
        `
      );
    };

    // --- Model Loading ---
    let model = null;
    const loader = new GLTFLoader();
    loader.load(
      "https://threejs.org/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb",
      (gltf) => {
        model = gltf.scene.children[0];
        model.position.y = -0.75;
        model.material = material;
        scene.add(model);
        controls.target.set(0, -0.75, 0);
      },
      undefined,
      (err) => {
        console.warn("Model loader fallback to procedural geometry:", err);
        // Fallback procedural geometry in case network is offline
        const geom = new THREE.TorusKnotGeometry(2, 0.7, 128, 32);
        model = new THREE.Mesh(geom, material);
        model.position.y = -0.75;
        scene.add(model);
      }
    );

    // --- UI Update & Theme Applying Helpers ---
    function updateTextures() {
      if (tex1) tex1.dispose();
      if (tex2) tex2.dispose();

      tex1 = generateMatcap1Texture();
      tex2 = generateMatcap2Texture();

      material.matcap = tex1;
      uniforms.matcap2.value = tex2;
      material.needsUpdate = true;
    }

    function applyColorScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;

      params.bgColor = scheme.bgColor;
      params.patternStyle = scheme.patternStyle;
      params.matcap1Bg = scheme.matcap1Bg;
      params.matcap1Stroke = scheme.matcap1Stroke;
      params.matcap1PieColor = scheme.matcap1PieColor;

      params.matcap2Stop1 = scheme.matcap2Stops[0];
      params.matcap2Stop2 = scheme.matcap2Stops[1];
      params.matcap2Stop3 = scheme.matcap2Stops[2];
      params.matcap2Stop4 = scheme.matcap2Stops[3];

      params.tintColor = scheme.tintColor;
      params.textFillColor = scheme.textFillColor;
      params.textStrokeColor = scheme.textStrokeColor;
      params.textContent = scheme.text;
      params.transitionSoftness = scheme.transitionSoftness;
      params.transitionAngle = scheme.transitionAngle;

      applyVisualTheme();
      updateTextures();
      gui.controllersRecursive().forEach((c) => c.updateDisplay());
    }

    function applyVisualTheme() {
      // Greenscreen or normal background
      if (params.greenScreen) {
        document.body.style.backgroundColor = "#00ff00";
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        document.body.style.backgroundColor = params.bgColor;
        renderer.setClearColor(0x000000, 0);
      }

      // Typography
      if (textBack && textFront) {
        textBack.style.display = params.showText ? "block" : "none";
        textFront.style.display = params.showText ? "block" : "none";

        textBack.textContent = params.textContent;
        textFront.textContent = params.textContent;

        textBack.style.color = params.textFillColor;
        textFront.style.webkitTextStrokeColor = params.textStrokeColor;
      }

      // Shader uniforms
      uniforms.transitionLevel.value = params.transitionLevel;
      uniforms.transitionSoftness.value = params.transitionSoftness;
      uniforms.transitionAngle.value = params.transitionAngle;
      uniforms.tintColor.value.set(params.tintColor);

      // Controls
      controls.autoRotate = params.autoRotate && params.animationMode !== "Static";
      controls.autoRotateSpeed = params.autoRotateSpeed;
    }

    // --- Procedural Scene Randomizer on Scene Click ---
    const randomWords = [
      "CYBER", "NEURAL", "MATRIX", "SYNTH", "NEXUS",
      "CHROMA", "VERTEX", "FUTURE", "3D ART", "GLITCH",
      "QUANTUM", "HYPER", "PULSE", "KINETIC", "AVATAR"
    ];

    function randomHexColor() {
      const letters = "0123456789abcdef";
      let col = "#";
      for (let i = 0; i < 6; i++) {
        col += letters[Math.floor(Math.random() * 16)];
      }
      return col;
    }

    function randomVibrantColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 100%, ${45 + Math.random() * 25}%)`;
    }

    function hslToHex(h, s, l) {
      l /= 100;
      const a = (s * Math.min(l, 1 - l)) / 100;
      const f = (n) => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, "0");
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function randomizeProceduralScene() {
      const baseHue = Math.floor(Math.random() * 360);
      const bgHex = hslToHex(baseHue, 40, 4);

      params.colorScheme = "Custom";
      params.bgColor = bgHex;

      // Pattern matcap
      const patternTypes = ["radar", "rings", "grid", "dots"];
      params.patternStyle = patternTypes[Math.floor(Math.random() * patternTypes.length)];
      params.matcap1Bg = hslToHex((baseHue + 20) % 360, 20, 10);
      params.matcap1Stroke = hslToHex((baseHue + 180) % 360, 80, 75);
      params.matcap1PieColor = hslToHex(baseHue, 30, 2);

      // Gradient matcap
      params.matcap2Stop1 = hslToHex(baseHue, 95, 55);
      params.matcap2Stop2 = hslToHex((baseHue + 60) % 360, 95, 65);
      params.matcap2Stop3 = hslToHex((baseHue + 180) % 360, 90, 50);
      params.matcap2Stop4 = hslToHex((baseHue + 240) % 360, 100, 60);

      // Shader & Geometric parameters
      params.transitionSoftness = +(0.03 + Math.random() * 0.2).toFixed(2);
      params.transitionAngle = Math.floor((Math.random() - 0.5) * 90);
      params.autoRotateSpeed = +(0.5 + Math.random() * 2.0).toFixed(1);
      params.tintColor = "#ffffff";

      // Typography
      params.textContent = randomWords[Math.floor(Math.random() * randomWords.length)];
      params.textStrokeColor = hslToHex((baseHue + 180) % 360, 90, 70);
      params.textFillColor = "#ffffff";

      // Motion
      const anims = ["Scan Wave", "Floating Breath", "Cinematic Orbit", "Dynamic Slice"];
      params.animationMode = anims[Math.floor(Math.random() * anims.length)];

      applyVisualTheme();
      updateTextures();
      gui.controllersRecursive().forEach((c) => c.updateDisplay());
    }

    // --- lil-gui Control Panel Setup ---
    const gui = new GUI({ title: "Visualizer Settings" });

    // Presets & Modes Folder
    const fPresets = gui.addFolder("Presets & Mode");
    fPresets
      .add(params, "colorScheme", [
        "Cyber Neon",
        "Molten Obsidian",
        "Vaporwave Sunset",
        "Emerald Matrix",
        "Glacial Arctic"
      ])
      .name("Color Preset")
      .onChange((val) => {
        applyColorScheme(val);
      });

    fPresets
      .add(params, "animationMode", [
        "Scan Wave",
        "Floating Breath",
        "Cinematic Orbit",
        "Dynamic Slice",
        "Static"
      ])
      .name("Animation")
      .onChange((val) => {
        if (val === "Static") {
          controls.autoRotate = false;
          if (model) {
            model.position.y = -0.75;
            model.rotation.set(0, 0, 0);
          }
        } else {
          controls.autoRotate = params.autoRotate;
        }
      });

    fPresets
      .add(params, "animSpeed", 0.0, 3.0, 0.05)
      .name("Anim Speed");

    fPresets
      .add(params, "dpr", 0.5, 3.0, 0.1)
      .name("DPR (Pixel Ratio)")
      .onChange((val) => {
        renderer.setPixelRatio(val);
      });

    fPresets
      .add(params, "clickRandomize")
      .name("Click to Randomize");

    fPresets.add(params, "randomize").name("Reroll Scene ⚡");

    // Greenscreen & Display Folder
    const fDisplay = gui.addFolder("Greenscreen & Canvas");
    fDisplay
      .add(params, "greenScreen")
      .name("Green Screen (#00ff00)")
      .onChange(() => {
        applyVisualTheme();
      });

    fDisplay
      .addColor(params, "bgColor")
      .name("Background Color")
      .onChange(() => {
        if (!params.greenScreen) {
          applyVisualTheme();
        }
      });

    // Shader & Transition Folder
    const fShader = gui.addFolder("Shader Transition");
    fShader
      .add(params, "autoTransition")
      .name("Auto Animate Slice");

    fShader
      .add(params, "transitionLevel", 0.0, 1.0, 0.01)
      .name("Transition Level")
      .onChange((val) => {
        uniforms.transitionLevel.value = val;
      });

    fShader
      .add(params, "transitionSoftness", 0.005, 0.4, 0.005)
      .name("Softness")
      .onChange((val) => {
        uniforms.transitionSoftness.value = val;
      });

    fShader
      .add(params, "transitionAngle", -180, 180, 1)
      .name("Angle (°)")
      .onChange((val) => {
        uniforms.transitionAngle.value = val;
      });

    fShader
      .addColor(params, "tintColor")
      .name("Model Tint")
      .onChange((val) => {
        uniforms.tintColor.value.set(val);
      });

    // Matcap Customization Folder
    const fMatcaps = gui.addFolder("Matcaps & Textures");
    fMatcaps
      .add(params, "patternStyle", ["radar", "rings", "grid", "dots"])
      .name("Pattern 1 Style")
      .onChange(updateTextures);

    fMatcaps
      .addColor(params, "matcap1Bg")
      .name("Matcap 1 Base")
      .onChange(updateTextures);

    fMatcaps
      .addColor(params, "matcap1Stroke")
      .name("Matcap 1 Detail")
      .onChange(updateTextures);

    fMatcaps
      .addColor(params, "matcap2Stop1")
      .name("Gradient Stop 1")
      .onChange(updateTextures);

    fMatcaps
      .addColor(params, "matcap2Stop2")
      .name("Gradient Stop 2")
      .onChange(updateTextures);

    fMatcaps
      .addColor(params, "matcap2Stop3")
      .name("Gradient Stop 3")
      .onChange(updateTextures);

    fMatcaps
      .addColor(params, "matcap2Stop4")
      .name("Gradient Stop 4")
      .onChange(updateTextures);

    // Typography Folder
    const fText = gui.addFolder("Typography Overlay");
    fText
      .add(params, "showText")
      .name("Show Text")
      .onChange(applyVisualTheme);

    fText
      .add(params, "textContent")
      .name("Text Content")
      .onChange(applyVisualTheme);

    fText
      .addColor(params, "textFillColor")
      .name("Back Fill Color")
      .onChange(applyVisualTheme);

    fText
      .addColor(params, "textStrokeColor")
      .name("Front Stroke Color")
      .onChange(applyVisualTheme);

    // Camera Controls Folder
    const fCamera = gui.addFolder("Camera Controls");
    fCamera
      .add(params, "autoRotate")
      .name("Auto Rotate")
      .onChange((val) => {
        controls.autoRotate = val && params.animationMode !== "Static";
      });

    fCamera
      .add(params, "autoRotateSpeed", -5.0, 5.0, 0.1)
      .name("Rotate Speed")
      .onChange((val) => {
        controls.autoRotateSpeed = val;
      });

    fCamera.add(params, "resetCamera").name("Reset Camera");

    fPresets.open();
    fDisplay.open();

    // Initial theme apply
    applyColorScheme("Cyber Neon");

    // --- Interaction Listeners ---
    // Hide / Show UI with 'H' key
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        if (
          document.activeElement &&
          (document.activeElement.tagName === "INPUT" ||
            document.activeElement.tagName === "TEXTAREA")
        ) {
          return;
        }
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Handle scene click to randomize (distinguishing clicks from drags)
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".lil-gui")) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener("pointerup", (e) => {
      if (e.target.closest(".lil-gui")) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.hypot(dx, dy);
      const dt = performance.now() - pointerDownTime;

      // Click detected if displacement < 6px and duration < 350ms
      if (dist < 6 && dt < 350 && params.clickRandomize) {
        randomizeProceduralScene();
      }
    });

    // Window Resize handling
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Main Animation Loop ---
    let t = 0;

    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta() * params.animSpeed;
      t += dt;

      if (params.animationMode === "Scan Wave") {
        if (params.autoTransition) {
          const wave = Math.sin(t * 1.2) * 0.45 + 0.5;
          uniforms.transitionLevel.value = wave;
          params.transitionLevel = wave;
        }
        if (model) {
          model.position.y = -0.75 + Math.sin(t * 0.8) * 0.05;
        }
      } else if (params.animationMode === "Floating Breath") {
        if (params.autoTransition) {
          const n = simplex.noise(t * 0.25, Math.PI) * 0.5 + 0.5;
          uniforms.transitionLevel.value = n;
          params.transitionLevel = n;
        }
        if (model) {
          model.position.y = -0.75 + Math.sin(t * 1.0) * 0.12;
          model.rotation.x = Math.sin(t * 0.7) * 0.04;
          model.rotation.z = Math.cos(t * 0.5) * 0.03;
        }
      } else if (params.animationMode === "Cinematic Orbit") {
        if (params.autoTransition) {
          const wave = Math.sin(t * 0.7) * 0.35 + 0.5;
          uniforms.transitionLevel.value = wave;
          params.transitionLevel = wave;
        }
        if (model) {
          model.position.y = -0.75 + Math.sin(t * 0.5) * 0.08;
        }
      } else if (params.animationMode === "Dynamic Slice") {
        if (params.autoTransition) {
          const wave = (Math.sin(t * 1.8) * 0.5 + 0.5);
          uniforms.transitionLevel.value = wave;
          params.transitionLevel = wave;
        }
        if (model) {
          model.rotation.y = Math.sin(t * 0.6) * 0.15;
          model.position.y = -0.75;
        }
      } else if (params.animationMode === "Static") {
        // Pure static: no camera motion, no procedural translation
        if (model) {
          model.position.y = -0.75;
          model.rotation.set(0, 0, 0);
        }
        uniforms.transitionLevel.value = params.transitionLevel;
      }

      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
