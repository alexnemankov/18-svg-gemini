<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>624 - Rift Opening</title>

  <!-- p5.js v2.3.3 from official CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <!-- lil-gui Modern Interactive Controls CDN -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.umd.min.js"></script>

  <style>
    /* =========================================================================
       CSS RESET & FULL-VIEWPORT CANVAS UX
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #080a10;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: background-color 0.4s ease;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: padding 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s ease;
    }

    canvas {
      display: block;
      cursor: grab;
      touch-action: none;
      outline: none;
      transition: box-shadow 0.4s ease, border-radius 0.4s ease;
    }

    body.grabbing canvas,
    canvas.grabbing {
      cursor: grabbing !important;
    }

    /* Framed Mode (4:5 Generative Art Print Presentation) */
    body.mode-framed #canvas-container {
      padding: 36px;
      background: radial-gradient(circle at 50% 50%, #151a28 0%, #06080e 100%);
    }

    body.mode-framed canvas {
      border-radius: 12px;
      box-shadow: 
        0 30px 90px rgba(0, 0, 0, 0.9),
        0 12px 36px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 10px rgba(255, 255, 255, 0.02);
    }

    /* =========================================================================
       lil-gui CUSTOM DARK GLASSMORPHISM THEME
       ========================================================================= */
    .lil-gui {
      --background-color: rgba(10, 15, 26, 0.88);
      --text-color: #f1f5f9;
      --title-background-color: rgba(18, 25, 40, 0.95);
      --widget-color: rgba(30, 41, 59, 0.85);
      --hover-color: rgba(51, 65, 85, 0.9);
      --focus-color: #38bdf8;
      --number-color: #38bdf8;
      --string-color: #34d399;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      --font-size: 11px;
      --folder-indent: 8px;

      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.75);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s ease, pointer-events 0.3s ease;
    }

    .lil-gui .title {
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .lil-gui button {
      font-weight: 600;
      cursor: pointer;
    }

    /* Smooth UI Hiding (Triggered via 'H' key) */
    body.hidden-ui .lil-gui {
      opacity: 0 !important;
      transform: translateY(12px) !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <main id="sketch-holder"></main>
  </div>

  <script>
    // Rift Opening
    // For the #WCCChallenge «Split» (join the discord! https://discord.gg/S8c7qcjw2b)
    // Randomly splits the canvas into two parts, revealing a hidden background from the rift opening and pushing the two parts apart.
    // Controls:
    // - R: Regenerate / Randomize the scene
    // - Space: Reseed / Randomize (or Pause/Resume)
    // - S: Save current image as PNG
    // - H: Hide / Show all UI controls
    // - 0: Reset camera zoom & pan
    // - Mouse Drag / Touch Drag: Pan across screen
    // - Mouse Wheel / Pinch: Zoom in & out

    /* =========================================================================
       19 PRECONFIGURED COLOR SCHEMES
       ========================================================================= */
    const COLOR_SCHEMES = {
      'Original': [
        ["#ed225d", "#3caf65", "#0d40bf", "#f5b800", "#2a2a2a"],
        ["#b30000", "#e6cf00", "#1283b3", "#fafafa", "#0a0a0a"],
        ["#606c38", "#283618", "#fefae0", "#dda15e", "#bc6c25"],
        ["#001427", "#708d81", "#f4d58d", "#bf0603", "#8d0801"],
        ["#3d5a80", "#98c1d9", "#e0fbfc", "#ee6c4d", "#293241"],
        ["#4464a1", "#62b6de", "#b3dce0", "#fafafa", "#ffc5c7", "#ee726b", "#cd1440"],
        ["#353535", "#3c6e71", "#ffffff", "#d9d9d9", "#284b63"],
        ["#0081a7", "#00afb9", "#fdfcdc", "#fed9b7", "#f07167"],
        ["#004b23", "#006400", "#007200", "#008000", "#38b000", "#70e000", "#9ef01a", "#ccff33"],
        ["#0a1128", "#001f54", "#034078", "#1282a2", "#fefcfb"],
        ["#2d3142", "#bfc0c0", "#ffffff", "#ef8354", "#4f5d75"],
        ["#04151f", "#183a37", "#efd6ac", "#c44900", "#432534"],
        ["#ca9ce1", "#54defd", "#f1ffc4", "#ffcaaf", "#28587b"]
      ],
      'Monochromatic': [
        ['#020b14', '#07243f', '#0c426e', '#1367a7', '#2589d8', '#38bdf8', '#7dd3fc', '#bae6fd']
      ],
      'Analogous': [
        ['#180026', '#45065c', '#831070', '#be2663', '#ea434d', '#f45d43', '#fba338', '#ffd166']
      ],
      'Complementary': [
        ['#002b36', '#005f73', '#0a9396', '#94d2bd', '#e9d8a6', '#ee9b00', '#ca6702', '#bb3e03', '#ae2012']
      ],
      'Split-complementary': [
        ['#060e20', '#0a4a6e', '#0284c7', '#38bdf8', '#f43f5e', '#fb7185', '#fb923c', '#fed7aa']
      ],
      'Triadic': [
        ['#0d0221', '#240046', '#3a0ca3', '#7209b7', '#4cc9f0', '#06d6a0', '#f72585', '#ffbe0b']
      ],
      'Tetradic': [
        ['#090514', '#581845', '#900c3f', '#c70039', '#009688', '#26a69a', '#ff5722', '#00e676']
      ],
      'Double split-complementary': [
        ['#07021a', '#240046', '#7b2cbf', '#e01e5a', '#ff007f', '#ffb703', '#fb8500', '#2ec4b6']
      ],
      'Achromatic': [
        ['#000000', '#1c1c1c', '#333333', '#555555', '#777777', '#999999', '#cccccc', '#f5f5f5', '#ffffff']
      ],
      'Achromatic + Accent': [
        ['#000000', '#1a1a1a', '#3a3a3a', '#777777', '#cccccc', '#f5f5f5', '#ff1744', '#d50000', '#ff5252']
      ],
      'Neutral + accent': [
        ['#121519', '#1e242d', '#333d4b', '#5c6979', '#94a3b8', '#cbd5e1', '#ff5400', '#ffaa00', '#00f0ff']
      ],
      'Palette 12 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': [
        ['#F6AA1C', '#BC3908', '#941B0C', '#220901', '#E85D04', '#FFBA08', '#6A040F']
      ],
      'Palette 13 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': [
        ['#63D1CF', '#5BC0BE', '#4BAD9E', '#378A7C', '#0B132B', '#000000', '#2EC4B6']
      ],
      'Palette 14 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': [
        ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12', '#7B2CBF']
      ],
      'Palette 15 (FEF1BE, FFBA00, 008189, 00474D, 061210)': [
        ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210', '#00A896', '#FFE066']
      ],
      'Palette 16 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': [
        ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A', '#55EFC4', '#00E676']
      ],
      'Palette 17 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': [
        ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618', '#8F2D56', '#FFA94D']
      ],
      'Palette 18 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': [
        ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612', '#4D194D', '#C4A3FF']
      ],
      'Palette 19 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': [
        ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F', '#7928CA', '#00E5FF']
      ]
    };

    /* =========================================================================
       APPLICATION CONFIGURATION & PARAMETERS
       ========================================================================= */
    const params = {
      // 🎨 Color & Tone
      colorScheme: 'Original',
      bgColorMode: 'solid', // 'solid', 'gradient', 'texture1', 'hatch', 'band'
      gradientDirection: 'horizontal', // 'horizontal', 'vertical', 'diagonal1', 'diagonal2'
      gradientDisplacement: 2.0,
      showOutline: false,
      outlineWeight: 2.0,
      bandWidth: 200,

      // ⚡ Animation & Dynamics
      speed: 1.0,
      framesPerSplit: 10,
      numSplits: 3000,
      displacementAmount: 20,
      easing: 'linear', // 'linear', 'easeOut', 'easeInOut'
      paused: false,

      // 🌊 Procedural Geometry & Noise
      curveMode: false,
      noiseScale: 0.2,
      noiseStrength: 300,
      lineSampleSpacing: 5,
      hatchSpacing: 10,
      hatchStrokeWeight: 1,

      // 👁 Viewport & UX
      presentationMode: 'Fullscreen', // 'Fullscreen' or 'Framed'
      clickToRandomize: true,
      zoom: 1.0,
      spaceAction: 'reseed', // 'reseed' or 'pause'
    };

    // Core original sketch variables
    let colorPalette = [];
    let numSplits = 3000;
    let framesPerSplit = 10;
    let noiseScale = 0.2;
    let noiseStrength = 300;
    let displacementAmount = 20;
    let lineSampleSpacing = 5;
    let activeBuffer, lastImageBuffer;
    let currentSplitIndex = 0;
    let currentSplitPolygons = null, currentSplitPoints = null, currentSplitLine = null;
    let curveMode = false;
    let done = false;
    let canvasWidth, canvasHeight, bufferWidth, bufferHeight;
    let margin = 100;
    let animProgress = 0; // Continuous subframe accumulator for silky smooth speed scaling
    let paused = false;

    // Background and stroke styling
    let showOutline = false;
    let bgColorMode = 'solid';
    let currentColors = [];
    let currentColorIndices = [0, 1, 2];
    let gradientDirection = 'horizontal';
    let gradientDisplacement = 2.0;
    let hatchAngle = 0;
    let hatchSpacing = 10;
    let hatchStrokeWeight = 1;
    let bandWidth = 200;

    // Camera Pan & Zoom Transform State
    let targetZoom = 1.0;
    let currentZoom = 1.0;
    let targetPanX = 0;
    let targetPanY = 0;
    let currentPanX = 0;
    let currentPanY = 0;

    let isPointerDown = false;
    let isDragging = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let initialPanX = 0;
    let initialPanY = 0;
    let totalDragDistance = 0;

    let gui = null;
    let zoomCtrl = null;

    /* =========================================================================
       COLOR PALETTE RESOLVER
       ========================================================================= */
    function setPaletteFromScheme() {
      const scheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];
      if (params.colorScheme === 'Original') {
        colorPalette = random(scheme);
      } else {
        colorPalette = scheme[0];
      }
    }

    function changeColor() {
      if (!colorPalette || colorPalette.length === 0) {
        setPaletteFromScheme();
      }

      let N = colorPalette.length;
      let k = currentColorIndices.length;

      let prevFirst = currentColorIndices[0];
      let newFirst = floor(random(N));
      while (newFirst === prevFirst && N > 1) {
        newFirst = floor(random(N));
      }

      // Build a pool of remaining indices, excluding the chosen first
      let pool = [];
      for (let i = 0; i < N; i++) {
        if (i !== newFirst) pool.push(i);
      }
      shuffle(pool, true);

      let result = [newFirst];
      for (let i = 0; i < Math.min(k - 1, pool.length); i++) {
        result.push(pool[i]);
      }

      currentColorIndices = result;
      currentColors = result.map(i => color(colorPalette[i]));

      hatchAngle = random(0, TAU);
      hatchSpacing = random(params.hatchSpacing * 0.7, params.hatchSpacing * 1.4);
      hatchStrokeWeight = params.hatchStrokeWeight;
    }

    /* =========================================================================
       p5.js LIFECYCLE
       ========================================================================= */
    function updateDimensions() {
      if (params.presentationMode === 'Framed') {
        const pad = 80;
        const availW = Math.max(320, windowWidth - pad * 2);
        const availH = Math.max(320, windowHeight - pad * 2);
        const aspect = 4 / 5; // 4:5 generative art print ratio
        if (availW / availH > aspect) {
          canvasHeight = availH;
          canvasWidth = Math.round(availH * aspect);
        } else {
          canvasWidth = availW;
          canvasHeight = Math.round(availW / aspect);
        }
      } else {
        canvasWidth = windowWidth;
        canvasHeight = windowHeight;
      }

      bufferWidth = canvasWidth + margin * 2;
      bufferHeight = canvasHeight + margin * 2;
    }

    function setup() {
      updateDimensions();
      const cnv = createCanvas(windowWidth, windowHeight);
      cnv.parent('sketch-holder');

      setPaletteFromScheme();
      changeColor();

      activeBuffer = createGraphics(bufferWidth, bufferHeight);
      drawBackground(activeBuffer);
      lastImageBuffer = activeBuffer.get();

      noiseScale = random(0.01, 0.2);
      noiseStrength = random(10, 300);
      displacementAmount = random(10, 50);

      params.noiseScale = noiseScale;
      params.noiseStrength = noiseStrength;
      params.displacementAmount = displacementAmount;

      initGUI();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      updateDimensions();
      restart();
    }

    function draw() {
      // Advance procedural rift animation if active
      if (!params.paused && !done) {
        animProgress += params.speed;

        if (animProgress >= params.framesPerSplit || !currentSplitPolygons) {
          animProgress = 0;
          currentSplitIndex++;
          if (currentSplitIndex >= params.numSplits) {
            done = true;
          } else {
            // Snapshot active buffer before the next rift begins
            lastImageBuffer = activeBuffer.get();
            let result = generateSplits();
            currentSplitPolygons = result.polygons;
            currentSplitLine = result.splitLine;
            changeColor();
          }
        }
      }

      // Draw the splits if geometry is valid
      if (currentSplitPolygons && currentSplitPolygons.length >= 2) {
        drawSplits();
      }

      // Render transformed scene with camera Pan & Zoom to display canvas
      renderSceneToDisplay();
    }

    /* =========================================================================
       DISPLAY & CAMERA RENDERING
       ========================================================================= */
    function renderSceneToDisplay() {
      // Smooth camera interpolation
      currentZoom += (targetZoom - currentZoom) * 0.18;
      currentPanX += (targetPanX - currentPanX) * 0.18;
      currentPanY += (targetPanY - currentPanY) * 0.18;
      params.zoom = parseFloat(currentZoom.toFixed(2));

      clear();
      // Outer canvas background (clean dark slate)
      background(8, 10, 16);

      push();
      // Center-based Pan and Zoom transformation
      translate(width * 0.5 + currentPanX, height * 0.5 + currentPanY);
      scale(currentZoom);
      translate(-canvasWidth * 0.5, -canvasHeight * 0.5);

      // Framed presentation mode aesthetic
      if (params.presentationMode === 'Framed') {
        drawingContext.save();
        drawingContext.shadowColor = 'rgba(0, 0, 0, 0.75)';
        drawingContext.shadowBlur = 45;
        drawingContext.shadowOffsetY = 20;
        drawingContext.fillStyle = '#06080e';
        drawingContext.fillRect(0, 0, canvasWidth, canvasHeight);
        drawingContext.restore();
      }

      // Render the active buffer content (cropped by margin)
      image(
        activeBuffer,
        0, 0, canvasWidth, canvasHeight,
        margin, margin, canvasWidth, canvasHeight
      );

      // Subtle border for framed presentation
      if (params.presentationMode === 'Framed') {
        push();
        noFill();
        stroke(255, 255, 255, 25);
        strokeWeight(1);
        rect(0, 0, canvasWidth, canvasHeight, 6);
        pop();
      }

      pop();
    }

    /* =========================================================================
       RIFT RENDERING ENGINE
       ========================================================================= */
    function drawSplits() {
      if (!currentSplitPolygons || currentSplitPolygons.length < 2 || !currentSplitPoints || currentSplitPoints.length < 2) {
        return;
      }

      // Draw background
      if (bgColorMode === 'texture1') {
        drawTexture1Gradient(activeBuffer);
      } else {
        drawBackground(activeBuffer);
      }

      let progress = params.framesPerSplit > 0 ? (animProgress / params.framesPerSplit) : 0;
      progress = Math.min(1.0, Math.max(0.0, progress));

      let A = currentSplitPolygons[0];
      let B = currentSplitPolygons[1];
      let displacement = getPerpendicularDisplacement(
        currentSplitPoints[0],
        currentSplitPoints[1],
        params.displacementAmount,
        progress
      );

      // Draw polygon piece A
      activeBuffer.push();
      activeBuffer.translate(displacement.x, displacement.y);
      activeBuffer.beginClip();
      drawPolygon(activeBuffer, A);
      activeBuffer.endClip();
      activeBuffer.image(lastImageBuffer, 0, 0);
      activeBuffer.pop();

      // Draw outline for polygon A if enabled
      if (params.showOutline) {
        activeBuffer.push();
        activeBuffer.translate(displacement.x, displacement.y);
        activeBuffer.stroke(currentColors[0]);
        activeBuffer.strokeWeight(params.outlineWeight);
        activeBuffer.noFill();
        drawPolygon(activeBuffer, A);
        activeBuffer.pop();
      }

      // Draw polygon piece B
      activeBuffer.push();
      activeBuffer.translate(-displacement.x, -displacement.y);
      activeBuffer.beginClip();
      drawPolygon(activeBuffer, B);
      activeBuffer.endClip();
      activeBuffer.image(lastImageBuffer, 0, 0);
      activeBuffer.pop();

      // Draw outline for polygon B if enabled
      if (params.showOutline) {
        activeBuffer.push();
        activeBuffer.translate(-displacement.x, -displacement.y);
        activeBuffer.stroke(currentColors[0]);
        activeBuffer.strokeWeight(params.outlineWeight);
        activeBuffer.noFill();
        drawPolygon(activeBuffer, B);
        activeBuffer.pop();
      }
    }

    function drawBackground(buffer) {
      const c0 = currentColors[0] || color(10);
      const c1 = currentColors[1] || currentColors[0] || color(20);

      if (bgColorMode === 'solid') {
        buffer.background(c0);
      } else if (bgColorMode === 'gradient' || bgColorMode === 'band') {
        drawGradient(buffer, bgColorMode);
      } else if (bgColorMode === 'texture1') {
        buffer.background(c1);
      } else if (bgColorMode === 'hatch') {
        buffer.background(c0);
        buffer.stroke(c1);
        drawHatch(buffer);
      } else {
        buffer.background(c0);
      }
    }

    function drawGradient(buffer, mode) {
      const c1 = currentColors[0] || color(10);
      const c2 = currentColors[1] || currentColors[0] || color(20);
      const c1Str = `rgb(${red(c1)}, ${green(c1)}, ${blue(c1)})`;
      const c2Str = `rgb(${red(c2)}, ${green(c2)}, ${blue(c2)})`;

      const ctx = buffer.drawingContext;
      let gradient;

      if (mode === 'gradient' || !currentSplitPoints || currentSplitPoints.length < 2) {
        if (gradientDirection === 'horizontal') {
          gradient = ctx.createLinearGradient(0, 0, buffer.width, 0);
        } else if (gradientDirection === 'vertical') {
          gradient = ctx.createLinearGradient(0, 0, 0, buffer.height);
        } else if (gradientDirection === 'diagonal1') {
          gradient = ctx.createLinearGradient(0, 0, buffer.width, buffer.height);
        } else if (gradientDirection === 'diagonal2') {
          gradient = ctx.createLinearGradient(buffer.width, 0, 0, buffer.height);
        } else {
          gradient = ctx.createLinearGradient(0, 0, buffer.width, 0);
        }
        gradient.addColorStop(0, c1Str);
        gradient.addColorStop(1, c2Str);
      } else if (mode === 'band' && currentSplitPoints && currentSplitPoints.length >= 2) {
        let midPoint = p5.Vector.lerp(currentSplitPoints[0], currentSplitPoints[1], 0.5);
        let lineDirection = p5.Vector.sub(currentSplitPoints[1], currentSplitPoints[0]).normalize();
        let linePerpendicular = createVector(-lineDirection.y, lineDirection.x);
        let point1 = p5.Vector.add(midPoint, p5.Vector.mult(linePerpendicular, -params.displacementAmount * params.gradientDisplacement));
        let point2 = p5.Vector.add(midPoint, p5.Vector.mult(linePerpendicular, params.displacementAmount * params.gradientDisplacement));
        gradient = ctx.createLinearGradient(point1.x, point1.y, point2.x, point2.y);
        gradient.addColorStop(0, c1Str);
        gradient.addColorStop(0.5, c2Str);
        gradient.addColorStop(1, c1Str);
      }

      if (gradient) {
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, buffer.width, buffer.height);
      } else {
        buffer.background(c1);
      }
    }

    function drawTexture1Gradient(buffer) {
      if (!currentSplitLine || currentSplitLine.length < 2) {
        buffer.background(currentColors[0] || color(10));
        return;
      }

      const centerColor = currentColors[0] || color(10);
      const edgeColor = currentColors[1] || currentColors[0] || color(20);
      const gradientDistance = 2 * params.displacementAmount;

      buffer.background(edgeColor);
      buffer.push();
      buffer.noStroke();

      for (let i = 0; i < currentSplitLine.length - 1; i++) {
        let A = currentSplitLine[i];
        let B = currentSplitLine[i + 1];
        let C = p5.Vector.lerp(A, B, 0.5);
        let dir = p5.Vector.sub(B, A).normalize();
        let perp = createVector(-dir.y, dir.x);
        let D = p5.Vector.add(C, p5.Vector.mult(perp, -gradientDistance));
        let E = p5.Vector.add(C, p5.Vector.mult(perp, gradientDistance));
        let segmentLength = p5.Vector.dist(A, B);
        let ctx = buffer.drawingContext;
        let gradient = ctx.createLinearGradient(D.x, D.y, E.x, E.y);
        let centerColorStr = `rgb(${red(centerColor)}, ${green(centerColor)}, ${blue(centerColor)})`;
        let edgeColorStr = `rgb(${red(edgeColor)}, ${green(edgeColor)}, ${blue(edgeColor)})`;

        gradient.addColorStop(0, edgeColorStr);
        gradient.addColorStop(0.5, centerColorStr);
        gradient.addColorStop(1, edgeColorStr);

        ctx.save();
        ctx.fillStyle = gradient;

        let numSteps = max(5, ceil(segmentLength / 10));
        for (let _step = 0; _step < numSteps; _step++) {
          let t1 = _step / numSteps;
          let t2 = (_step + 1) / numSteps;

          let p1 = p5.Vector.lerp(A, B, t1);
          let p2 = p5.Vector.lerp(A, B, t2);

          let segCorners = [
            p5.Vector.add(p1, p5.Vector.mult(perp, -gradientDistance)),
            p5.Vector.add(p2, p5.Vector.mult(perp, -gradientDistance)),
            p5.Vector.add(p2, p5.Vector.mult(perp, gradientDistance)),
            p5.Vector.add(p1, p5.Vector.mult(perp, gradientDistance))
          ];

          ctx.beginPath();
          ctx.moveTo(segCorners[0].x, segCorners[0].y);
          ctx.lineTo(segCorners[1].x, segCorners[1].y);
          ctx.lineTo(segCorners[2].x, segCorners[2].y);
          ctx.lineTo(segCorners[3].x, segCorners[3].y);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      buffer.pop();
    }

    function drawPolygon(buffer, polygon, dx = 0, dy = 0) {
      if (!polygon || polygon.length === 0) return;
      buffer.push();
      buffer.beginShape();
      for (let p of polygon) {
        if (params.curveMode) {
          if (typeof buffer.splineVertex === 'function') {
            buffer.splineVertex(p.x + dx, p.y + dy);
          } else if (typeof buffer.curveVertex === 'function') {
            buffer.curveVertex(p.x + dx, p.y + dy);
          } else {
            buffer.vertex(p.x + dx, p.y + dy);
          }
        } else {
          buffer.vertex(p.x + dx, p.y + dy);
        }
      }
      buffer.endShape(CLOSE);
      buffer.pop();
    }

    function getPerpendicularDisplacement(p1, p2, distance, progress) {
      if (progress <= 0 || !p1 || !p2) {
        return createVector(0, 0);
      }
      let easedProgress = progress;
      if (params.easing === 'easeOut') {
        easedProgress = 1 - Math.pow(1 - progress, 2);
      } else if (params.easing === 'easeInOut') {
        easedProgress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
      }
      let dir = p5.Vector.sub(p2, p1);
      let perp = createVector(-dir.y, dir.x);
      perp.normalize().mult(distance * easedProgress);
      return perp;
    }

    function generateSplits() {
      let p1, p2, linePos;
      let edgeChoice = random([0, 0, 1, 1, 2, 3, 4, 5]); // Horizontal or vertical splits have higher weight

      switch (edgeChoice) {
        case 0:
          // Top-bottom
          p1 = createVector(random(bufferWidth * 0.25, bufferWidth * 0.75), 0);
          p2 = createVector(random(bufferWidth * 0.25, bufferWidth * 0.75), bufferHeight);
          linePos = 'top-bottom';
          break;
        case 1:
          // Left-right
          p1 = createVector(0, random(bufferHeight * 0.25, bufferHeight * 0.75));
          p2 = createVector(bufferWidth, random(bufferHeight * 0.25, bufferHeight * 0.75));
          linePos = 'left-right';
          break;
        case 2:
          // Top-right
          p1 = createVector(random(bufferWidth * 0.25, bufferWidth * 0.75), 0);
          p2 = createVector(bufferWidth, random(bufferHeight * 0.25, bufferHeight * 0.75));
          linePos = 'top-right';
          break;
        case 3:
          // Right-bottom
          p1 = createVector(bufferWidth, random(bufferHeight * 0.25, bufferHeight * 0.75));
          p2 = createVector(random(bufferWidth * 0.25, bufferWidth * 0.75), bufferHeight);
          linePos = 'right-bottom';
          break;
        case 4:
          // Bottom-left
          p1 = createVector(random(bufferWidth * 0.25, bufferWidth * 0.75), bufferHeight);
          p2 = createVector(0, random(bufferHeight * 0.25, bufferHeight * 0.75));
          linePos = 'bottom-left';
          break;
        case 5:
          // Left-top
          p1 = createVector(0, random(bufferHeight * 0.25, bufferHeight * 0.75));
          p2 = createVector(random(bufferWidth * 0.25, bufferWidth * 0.75), 0);
          linePos = 'left-top';
          break;
        default:
          p1 = createVector(0, bufferHeight * 0.5);
          p2 = createVector(bufferWidth, bufferHeight * 0.5);
          linePos = 'left-right';
          break;
      }

      currentSplitPoints = [p1, p2];
      noiseSeed(Math.floor(random(1000000)));
      let splitLine = createWavyLine(p1, p2);
      let splitLineCopy = splitLine.map(p => createVector(p.x, p.y));
      let polygons = splitCanvas(splitLine, linePos);
      return { polygons: polygons, splitLine: splitLineCopy };
    }

    function createWavyLine(p1, p2) {
      let points = [];
      let lineDist = p5.Vector.dist(p1, p2);
      let numSamples = Math.max(3, ceil(lineDist / Math.max(2, params.lineSampleSpacing)));

      for (let i = 0; i <= numSamples; i++) {
        let t = i / numSamples;
        let basePoint = p5.Vector.lerp(p1, p2, t);

        // Sine function: 0 at edges (t=0, t=1), 1 at middle (t=0.5)
        let sineFactor = sin(t * PI);

        // Calculate perpendicular direction for noise offset
        let dir = p5.Vector.sub(p2, p1).normalize();
        let perp = createVector(-dir.y, dir.x);

        // Sample noise for offset
        let noiseValue = noise(
          basePoint.x * params.noiseScale + 1000,
          basePoint.y * params.noiseScale + 1000
        );
        let offset = (noiseValue - 0.5) * 2; // Map from [0,1] to [-1,1]

        // Apply offset with sine modulation
        let offsetAmount = offset * params.noiseStrength * sineFactor;
        let offsetVec = p5.Vector.mult(perp, offsetAmount);

        points.push(p5.Vector.add(basePoint, offsetVec));
      }

      return points;
    }

    function splitCanvas(splitLine, linePos) {
      let A = createVector(0, 0);                      // A: Top-left
      let B = createVector(bufferWidth, 0);              // B: Top-right
      let C = createVector(bufferWidth, bufferHeight);   // C: Bottom-right
      let D = createVector(0, bufferHeight);             // D: Bottom-left

      let cases = {
        'top-bottom': [[D, A], [B, C]],
        'left-right': [[C, D], [A, B]],
        'top-right': [[C, D, A], [B]],
        'right-bottom': [[D, A, B], [C]],
        'bottom-left': [[A, B, C], [D]],
        'left-top': [[B, C, D], [A]],
      };
      let [poly1Corners, poly2Corners] = cases[linePos] || [[D, A], [B, C]];

      let poly1 = [...splitLine, ...poly1Corners];
      let poly2 = [...poly2Corners, ...splitLine.slice().reverse()];

      return [poly1, poly2];
    }

    function drawHatch(buffer) {
      let x = 0;
      let y = 0;
      let w = buffer.width;
      let h = buffer.height;
      let angle = hatchAngle;
      let spacing = Math.max(4, hatchSpacing);
      const cx = x + w / 2;
      const cy = y + h / 2;

      // Direction of each hatch line
      const dx = cos(angle);
      const dy = sin(angle);

      // Perpendicular direction (normal)
      const nx = -dy;
      const ny = dx;

      // Find max distance we need to slide along the normal
      const corners = [
        { x: x, y: y },
        { x: x + w, y: y },
        { x: x + w, y: y + h },
        { x: x, y: y + h }
      ];

      let maxD = 0;
      for (let c of corners) {
        const vx = c.x - cx;
        const vy = c.y - cy;
        const d = Math.abs(vx * nx + vy * ny);
        if (d > maxD) maxD = d;
      }

      buffer.strokeWeight(params.hatchStrokeWeight);
      // Sweep lines across the rect
      for (let d = -maxD; d <= maxD; d += spacing) {
        const lx = cx + nx * d; // a point on the current line
        const ly = cy + ny * d;

        const pts = lineRectIntersections(lx, ly, dx, dy, x, y, w, h);
        if (pts.length === 2) {
          buffer.line(pts[0].x, pts[0].y, pts[1].x, pts[1].y);
        }
      }
    }

    // Find intersection of an infinite line with a rectangle.
    // Line: (lx, ly) + t * (dx, dy)
    // Rect: axis-aligned, at (rx, ry) with width rw and height rh
    function lineRectIntersections(lx, ly, dx, dy, rx, ry, rw, rh) {
      const x0 = rx;
      const x1 = rx + rw;
      const y0 = ry;
      const y1 = ry + rh;

      const pts = [];
      const eps = 1e-6;

      function addPoint(px, py) {
        // Avoid duplicates (corners hit twice)
        for (let p of pts) {
          if (Math.abs(p.x - px) < eps && Math.abs(p.y - py) < eps) return;
        }
        pts.push({ x: px, y: py });
      }

      // Intersect with x = x0 and x = x1
      if (Math.abs(dx) > eps) {
        let t = (x0 - lx) / dx;
        let iy = ly + t * dy;
        if (iy >= y0 - eps && iy <= y1 + eps) addPoint(x0, iy);

        t = (x1 - lx) / dx;
        iy = ly + t * dy;
        if (iy >= y0 - eps && iy <= y1 + eps) addPoint(x1, iy);
      }

      // Intersect with y = y0 and y = y1
      if (Math.abs(dy) > eps) {
        let t = (y0 - ly) / dy;
        let ix = lx + t * dx;
        if (ix >= x0 - eps && ix <= x1 + eps) addPoint(ix, y0);

        t = (y1 - ly) / dy;
        ix = lx + t * dx;
        if (ix >= x0 - eps && ix <= x1 + eps) addPoint(ix, y1);
      }

      // We only care about up to 2 intersection points
      return pts.length > 2 ? pts.slice(0, 2) : pts;
    }

    /* =========================================================================
       RESTART & REGENERATION
       ========================================================================= */
    function restart() {
      // Reset all state
      currentSplitIndex = 0;
      currentSplitPolygons = null;
      currentSplitPoints = null;
      currentSplitLine = null;
      animProgress = 0;

      // Sync params with local variables
      numSplits = params.numSplits;
      framesPerSplit = params.framesPerSplit;
      noiseScale = params.noiseScale;
      noiseStrength = params.noiseStrength;
      displacementAmount = params.displacementAmount;
      lineSampleSpacing = params.lineSampleSpacing;
      curveMode = params.curveMode;
      showOutline = params.showOutline;
      bgColorMode = params.bgColorMode;
      gradientDirection = params.gradientDirection;
      gradientDisplacement = params.gradientDisplacement;

      done = false;

      // Reset colors
      changeColor();

      // Reset graphics buffer
      activeBuffer = createGraphics(bufferWidth, bufferHeight);
      drawBackground(activeBuffer);
      lastImageBuffer = activeBuffer.get();
    }

    function randomizeScene() {
      // 1. Pick a new color scheme from the 19 preconfigured schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      let nextScheme = params.colorScheme;
      while (nextScheme === params.colorScheme && schemeKeys.length > 1) {
        nextScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      }
      params.colorScheme = nextScheme;
      setPaletteFromScheme();

      // 2. Re-roll background mode & gradient direction
      params.bgColorMode = random(['solid', 'gradient', 'texture1', 'band', 'hatch']);
      params.gradientDirection = random(['horizontal', 'vertical', 'diagonal1', 'diagonal2']);
      params.gradientDisplacement = parseFloat((1.8 + Math.random() * 3.2).toFixed(1));

      // 3. Re-roll geometric styling & parameters
      params.curveMode = Math.random() < 0.6;
      params.showOutline = Math.random() < 0.28;
      params.outlineWeight = parseFloat((1.2 + Math.random() * 2.8).toFixed(1));
      params.lineSampleSpacing = Math.round(4 + Math.pow(Math.random(), 2) * 36);

      // 4. Re-roll noise parameters
      params.noiseScale = parseFloat((0.02 + Math.random() * 0.45).toFixed(3));
      params.noiseStrength = Math.round(20 + Math.random() * 280);
      params.displacementAmount = Math.round(15 + Math.random() * 65);

      // 5. Re-roll timing & speed
      params.framesPerSplit = Math.round(7 + Math.random() * 14); // 7 to 21
      params.speed = 1.0;
      params.easing = random(['linear', 'easeOut', 'easeInOut']);

      // 6. Restart simulation and refresh control panel
      restart();
      updateGuiDisplays();
    }

    function resetCameraView() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
      if (zoomCtrl) zoomCtrl.updateDisplay();
    }

    function saveArtScreenshot() {
      let timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
      saveCanvas('rift-opening-' + timestamp, 'png');
    }

    /* =========================================================================
       INTERACTIVE PANNING & WHEEL ZOOM
       ========================================================================= */
    window.addEventListener('pointerdown', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      isPointerDown = true;
      isDragging = false;
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
      initialPanX = targetPanX;
      initialPanY = targetPanY;
      totalDragDistance = 0;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - pointerStartX;
      const dy = e.clientY - pointerStartY;
      totalDragDistance = Math.hypot(dx, dy);

      if (totalDragDistance > 6) {
        if (!isDragging) {
          isDragging = true;
          document.body.classList.add('grabbing');
        }
        targetPanX = initialPanX + dx;
        targetPanY = initialPanY + dy;
      }
    });

    function finishPointer(e) {
      if (!isPointerDown) return;
      document.body.classList.remove('grabbing');
      isPointerDown = false;

      // Pure click detection (distance moved < 6px)
      if (totalDragDistance < 6) {
        if (!e.target || !e.target.closest || !e.target.closest('.lil-gui')) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
      }
      isDragging = false;
    }

    window.addEventListener('pointerup', finishPointer);
    window.addEventListener('pointercancel', finishPointer);

    // Zoom with Mouse Wheel (Smooth focal zoom towards cursor)
    window.addEventListener('wheel', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      e.preventDefault();

      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.893;
      const newZoom = Math.max(0.15, Math.min(12.0, targetZoom * zoomFactor));

      // Anchor zoom around cursor position
      const mx = e.clientX - window.innerWidth * 0.5;
      const my = e.clientY - window.innerHeight * 0.5;
      targetPanX = mx - (mx - targetPanX) * (newZoom / targetZoom);
      targetPanY = my - (my - targetPanY) * (newZoom / targetZoom);
      targetZoom = newZoom;

      if (zoomCtrl) zoomCtrl.updateDisplay();
    }, { passive: false });

    // Touch Support for Mobile / Multi-touch Tablets (Pinch to Zoom & Drag)
    let touchStartDist = 0;
    let touchStartZoom = 1.0;

    window.addEventListener('touchstart', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      if (e.touches.length === 1) {
        isPointerDown = true;
        isDragging = false;
        pointerStartX = e.touches[0].clientX;
        pointerStartY = e.touches[0].clientY;
        initialPanX = targetPanX;
        initialPanY = targetPanY;
        totalDragDistance = 0;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        touchStartZoom = targetZoom;
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      if (e.touches.length === 1 && isPointerDown) {
        const dx = e.touches[0].clientX - pointerStartX;
        const dy = e.touches[0].clientY - pointerStartY;
        totalDragDistance = Math.hypot(dx, dy);
        if (totalDragDistance > 6) {
          isDragging = true;
          targetPanX = initialPanX + dx;
          targetPanY = initialPanY + dy;
          e.preventDefault();
        }
      } else if (e.touches.length === 2 && touchStartDist > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        targetZoom = Math.max(0.15, Math.min(12.0, touchStartZoom * (dist / touchStartDist)));
        if (zoomCtrl) zoomCtrl.updateDisplay();
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        if (isPointerDown && totalDragDistance < 8) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
        isPointerDown = false;
        isDragging = false;
      }
    });

    /* =========================================================================
       KEYBOARD SHORTCUTS
       ========================================================================= */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      // 'H' key toggles UI visibility
      if (e.key === 'h' || e.key === 'H') {
        document.body.classList.toggle('hidden-ui');
        if (gui) {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      } else if (e.code === 'Space') {
        e.preventDefault();
        if (params.spaceAction === 'reseed') {
          randomizeScene();
        } else {
          params.paused = !params.paused;
          updateGuiDisplays();
        }
      } else if (e.key === 'r' || e.key === 'R') {
        randomizeScene();
      } else if (e.key === 'p' || e.key === 'P') {
        params.paused = !params.paused;
        updateGuiDisplays();
      } else if (e.key === 's' || e.key === 'S') {
        saveArtScreenshot();
      } else if (e.key === '0') {
        resetCameraView();
      }
    });

    /* =========================================================================
       lil-gui CONTROLLER PANEL
       ========================================================================= */
    function updateGuiDisplays(target = gui) {
      if (!target) return;
      if (target.controllers) {
        target.controllers.forEach(c => {
          try { c.updateDisplay(); } catch (err) {}
        });
      }
      if (target.folders) {
        target.folders.forEach(f => updateGuiDisplays(f));
      }
    }

    function initGUI() {
      gui = new lil.GUI({ title: '624 // RIFT OPENING' });

      // 1. Color Schemes Folder (19 Preconfigured Schemes)
      const fColor = gui.addFolder('🎨 Color Schemes (19)');
      fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Active Scheme')
        .onChange(() => {
          setPaletteFromScheme();
          restart();
          updateGuiDisplays();
        });

      fColor.add(params, 'bgColorMode', ['solid', 'gradient', 'band', 'hatch', 'texture1'])
        .name('Background Style')
        .onChange(() => {
          bgColorMode = params.bgColorMode;
          restart();
          updateGuiDisplays();
        });

      fColor.add(params, 'gradientDirection', ['horizontal', 'vertical', 'diagonal1', 'diagonal2'])
        .name('Gradient Direction')
        .onChange(() => {
          gradientDirection = params.gradientDirection;
        });

      fColor.add(params, 'gradientDisplacement', 1, 8, 0.5)
        .name('Band Width Factor');

      fColor.add(params, 'showOutline')
        .name('Rift Outlines');

      fColor.add(params, 'outlineWeight', 0.5, 8, 0.5)
        .name('Outline Weight');

      fColor.add(params, 'hatchSpacing', 4, 40, 1)
        .name('Hatch Spacing');

      fColor.add(params, 'hatchStrokeWeight', 0.5, 5, 0.5)
        .name('Hatch Line Width');

      // 2. Motion & Animation Speed
      const fMotion = gui.addFolder('⚡ Motion & Speed');
      fMotion.add(params, 'speed', 0.1, 4.0, 0.05)
        .name('Animation Speed');

      fMotion.add(params, 'framesPerSplit', 2, 40, 1)
        .name('Frames / Split')
        .onChange(() => {
          framesPerSplit = params.framesPerSplit;
        });

      fMotion.add(params, 'displacementAmount', 5, 150, 1)
        .name('Tear Distance')
        .onChange(() => {
          displacementAmount = params.displacementAmount;
        });

      fMotion.add(params, 'easing', ['linear', 'easeOut', 'easeInOut'])
        .name('Tear Easing');

      fMotion.add(params, 'paused')
        .name('Paused (Space / P)')
        .listen();

      fMotion.add(params, 'numSplits', 100, 5000, 100)
        .name('Max Splits')
        .onChange(() => {
          numSplits = params.numSplits;
        });

      const splitTracker = { get 'Current Split'() { return `${currentSplitIndex} / ${params.numSplits}`; } };
      fMotion.add(splitTracker, 'Current Split').listen().disable();

      // 3. Procedural Geometry & Noise
      const fGeom = gui.addFolder('🌊 Rift Noise & Geometry');
      fGeom.add(params, 'curveMode')
        .name('Curved Rifts (Splines)')
        .onChange(() => {
          curveMode = params.curveMode;
        });

      fGeom.add(params, 'noiseScale', 0.005, 0.6, 0.005)
        .name('Noise Frequency')
        .onChange(() => {
          noiseScale = params.noiseScale;
        });

      fGeom.add(params, 'noiseStrength', 10, 450, 5)
        .name('Noise Amplitude')
        .onChange(() => {
          noiseStrength = params.noiseStrength;
        });

      fGeom.add(params, 'lineSampleSpacing', 2, 45, 1)
        .name('Sample Spacing')
        .onChange(() => {
          lineSampleSpacing = params.lineSampleSpacing;
        });

      // 4. Viewport & Interaction
      const fView = gui.addFolder('👁 Viewport & UX');
      fView.add(params, 'presentationMode', ['Fullscreen', 'Framed'])
        .name('Display Mode')
        .onChange((val) => {
          if (val === 'Framed') {
            document.body.classList.add('mode-framed');
          } else {
            document.body.classList.remove('mode-framed');
          }
          updateDimensions();
          restart();
        });

      fView.add(params, 'clickToRandomize')
        .name('Click to Randomize');

      zoomCtrl = fView.add(params, 'zoom', 0.2, 8.0, 0.05)
        .name('Zoom Level')
        .listen()
        .onChange(val => {
          targetZoom = val;
        });

      fView.add(params, 'spaceAction', ['reseed', 'pause'])
        .name('Spacebar Action');

      // 5. Actions
      const fActions = gui.addFolder('🚀 Actions');
      fActions.add({ fn: randomizeScene }, 'fn').name('🎲 Randomize Scene (R)');
      fActions.add({ fn: restart }, 'fn').name('🔄 Restart Animation');
      fActions.add({ fn: () => { params.paused = !params.paused; updateGuiDisplays(); } }, 'fn').name('⏸ Play / Pause');
      fActions.add({ fn: resetCameraView }, 'fn').name('🎯 Reset View (0)');
      fActions.add({ fn: saveArtScreenshot }, 'fn').name('📷 Capture PNG (S)');

      fColor.open();
      fMotion.open();
    }
  </script>
