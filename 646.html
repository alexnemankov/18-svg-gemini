<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bfd7f5">
  <title>Pearlescent — Liquid Marble</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 76% 58%, #fff3ed, #d4d3ef 44%, #b8d6fa 85%);
      overscroll-behavior: none;
    }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
    #error {
      position: fixed; inset: 0; margin: 0; padding: 2rem;
      display: grid; place-content: center; color: #526481;
      font: 15px/1.6 system-ui, sans-serif; text-align: center;
    }
    #error[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas aria-label="Slowly flowing pastel blue and lavender marble with delicate champagne gold veins" role="img"></canvas>
  <p id="error" role="alert" hidden></p>
  <script type="module">
    // The artwork and controls are contained here; only the two runtimes use a CDN.
    let THREE;
    const error = document.querySelector('#error');
    function showError(message, cause) {
      error.textContent = message;
      error.hidden = false;
      if (cause) console.error(cause);
    }

    try {
      try {
        THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js');
      } catch {
        THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.min.js');
      }

      const canvas = document.querySelector('canvas');
      const renderer = new THREE.WebGLRenderer({
        canvas, antialias: false, alpha: false, powerPreference: 'high-performance'
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.setClearColor(0xb8d6fa, 1);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
      camera.position.z = 1;
      const uniforms = {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2() },
        uPalette: { value: Array.from({ length: 10 }, () => new THREE.Vector3()) },
        uBackground: { value: new THREE.Vector3() },
        uIsolate: { value: 0 },
        uMonochrome: { value: 0 },
        uZoom: { value: 1 },
        uPan: { value: new THREE.Vector2() },
        uView: { value: new THREE.Matrix3() },
        uSeed: { value: 0 },
        uScale: { value: 1 },
        uWarp: { value: 1 },
        uFlow: { value: 1 },
        uVeins: { value: 1 }
      };

      const material = new THREE.ShaderMaterial({
        uniforms, depthTest: false, depthWrite: false, toneMapped: false,
        vertexShader: /* glsl */ `
          void main() {
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;
          uniform vec2 uResolution;
          uniform float uTime;
          uniform vec3 uPalette[10];
          uniform vec3 uBackground;
          uniform float uIsolate, uMonochrome, uZoom, uSeed, uScale, uWarp, uFlow, uVeins;
          uniform vec2 uPan;
          uniform mat3 uView;
          const float TAU = 6.283185307179586;

          #define POWDER uPalette[0]
          #define BABY uPalette[1]
          #define ICE uPalette[2]
          #define LAVENDER uPalette[3]
          #define PERIWINKLE uPalette[4]
          #define BLUSH uPalette[5]
          #define PEARL uPalette[6]
          #define BLUE uPalette[7]
          #define GOLD uPalette[8]
          #define ROSE uPalette[9]

          vec2 hash22(vec2 p) {
            p += vec2(uSeed, uSeed*0.371);
            vec3 h = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
            h += dot(h, h.yzx + 33.33);
            return -1.0 + 2.0 * fract((h.xx + h.yz) * h.zy);
          }

          // Quintic gradient noise with analytical x/y derivatives.
          // The derivatives stay continuous across lattice cells.
          vec3 noiseD(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
            vec2 du = 30.0*f*f*(f*(f-2.0)+1.0);
            vec2 ga = hash22(i), gb = hash22(i+vec2(1,0));
            vec2 gc = hash22(i+vec2(0,1)), gd = hash22(i+vec2(1,1));
            float a = dot(ga,f), b = dot(gb,f-vec2(1,0));
            float c = dot(gc,f-vec2(0,1)), d = dot(gd,f-vec2(1,1));
            float v = mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
            vec2 g = mix(mix(ga,gb,u.x),mix(gc,gd,u.x),u.y);
            g += du * vec2(mix(b-a,d-c,u.y),mix(c-a,d-b,u.x));
            return vec3(v,g);
          }

          float noise(vec2 p) { return noiseD(p).x; }

          float fbm(vec2 p) {
            float value = 0.0, amplitude = 0.55;
            const mat2 turn = mat2(0.8,-0.6,0.6,0.8);
            for (int i = 0; i < 4; i++) {
              value += amplitude * noise(p);
              p = turn * p * 2.03 + vec2(13.1,7.7);
              amplitude *= 0.48;
            }
            return value;
          }

          vec2 eddy(vec2 p, vec2 center, float radius, float strength) {
            vec2 d = p-center;
            float a = strength * exp(-dot(d,d)/(radius*radius));
            float s = sin(a), c = cos(a);
            return center + mat2(c,-s,s,c)*d;
          }

          vec2 fluidDomain(vec2 p, vec2 orbit) {
            // Broad localized curls make open pools between stretched sheets.
            p = eddy(p, vec2(-1.05,0.12)+orbit*0.06, 0.68, 1.65*uWarp);
            p = eddy(p, vec2(0.73,0.50)-orbit*0.07, 0.94, -1.25*uWarp);
            vec2 q = vec2(
              fbm(p*vec2(0.76,1.12)+vec2(4.2,1.7)+orbit*0.12),
              fbm(p*vec2(0.87,0.71)+vec2(1.3,8.4)-orbit.yx*0.10)
            );
            vec2 r = vec2(
              fbm(p*1.10+q*2.2+vec2(8.3,2.8)+orbit*0.08),
              fbm(p*0.92+q*1.8+vec2(2.1,6.7)-orbit*0.09)
            );
            vec2 detail = vec2(
              fbm(p*2.6+r*3.4+vec2(3.4,1.8)),
              fbm(p*2.1+q*3.1+vec2(7.8,5.2))
            );
            return p + (q*1.04 + r*0.63 + detail*0.14)*uWarp;
          }

          // A contour in scalar space, filtered to its actual screen footprint.
          float filament(float field, float level, float width) {
            float aa = max(fwidth(field)*0.72, 0.00012);
            return 1.0-smoothstep(width, width+aa, abs(field-level));
          }

          vec3 pastelLayers(vec2 p, vec2 q, float field, vec2 orbit) {
            float cloud = fbm(q*0.72+vec2(6.4,2.0)+orbit*0.06);
            float wash = smoothstep(-0.52,0.62,
              sin(field*2.15+cloud*1.3)*0.65+cloud*0.45);
            vec3 color = mix(POWDER,LAVENDER,0.37+cloud*0.55);
            color = mix(color,BABY,0.20+0.15*sin(q.y*1.3+q.x));
            color = mix(color,BLUSH,wash*0.72);

            // Warm light transmitted through the large unbroken mineral pools.
            float light = exp(-dot((p-vec2(0.85,-0.45))*vec2(0.68,1.1),
                                  (p-vec2(0.85,-0.45))*vec2(0.68,1.1)));
            color = mix(color,PEARL,light*(0.22+wash*0.65));
            float silk = smoothstep(0.35,0.91,sin(field*2.8+cloud*1.1));
            color = mix(color,ICE,silk*0.22*(1.0-wash*0.5));

            // Unevenly spaced translucent edges, with a soft body and fine lip.
            for (int i=0; i<4; i++) {
              float level = -2.15+float(i)*1.53;
              float d = field-level;
              float body = exp(-abs(d+0.045)*13.0);
              float lip = exp(-abs(d)*80.0);
              color = mix(color,PERIWINKLE,body*0.25);
              float deposit = smoothstep(-0.27,0.29,noise(q*3.8+vec2(1.6,8.3)));
              color = mix(color,BLUE,lip*(0.14+deposit*0.35));
              color += vec3(0.018,0.032,0.035)*exp(-abs(d-0.026)*56.0);
              float wisps = filament(field+0.028*noise(q*9.0),level+0.047,0.0012);
              color = mix(color,BLUE,wisps*0.17);

              // Squeezed, nested laminae collect on one side of a seam.
              // Their warped spacing opens into pools instead of uniform rings.
              float sheet = exp(-abs(d+0.07)*11.0);
              float texture = fbm(q*vec2(5.5,2.2)+vec2(2.1,7.8));
              float strata = field + texture*0.21;
              float cell = floor(strata*48.0);
              float offset = hash22(vec2(cell,3.7)).x*0.32;
              float fineDistance = abs(fract(strata*48.0)-0.5-offset);
              float fine = 1.0-smoothstep(0.025,0.065+fwidth(strata)*24.0,fineDistance);
              float broken = smoothstep(-0.12,0.24,texture+noise(q*18.0)*0.26);
              color = mix(color,BLUE,sheet*fine*broken*0.30);
              float pigment = noise(q*vec2(19.0,6.0)+texture*4.0);
              color = mix(color,ICE,sheet*smoothstep(-0.18,0.4,pigment)*0.24);
              color = mix(color,PERIWINKLE,sheet*(texture*0.18+0.045));
            }

            // Broken mineral striations gather near folds and fade into pools.
            float fold = pow(0.5+0.5*cos(field*4.52+0.35),12.0);
            float streak = sin(field*112.0+fbm(q*5.0)*6.0);
            color = mix(color,ICE,fold*smoothstep(0.1,0.94,streak)*0.14);
            return color;
          }

          vec3 metallicVeins(vec3 color, vec2 q, float field, vec2 orbit) {
            float mineral = fbm(q*5.6+vec2(2.6,9.1));
            float grain = noise(q*186.0);
            float warped = field + 0.025*fbm(q*11.0) + 0.004*grain;
            float width = 0.0009+0.0028*smoothstep(-0.25,0.36,mineral);
            float veins = 0.0;
            for (int i=0; i<4; i++) {
              float level = -2.12+float(i)*1.53;
              float availability = smoothstep(-0.25,0.14,
                noise(q*2.7+vec2(float(i)*7.4,4.0))+0.11);
              veins += filament(warped,level,width)*availability;
              // A neighboring contour splits off, then rejoins the main seam.
              float split = 0.045*pow(smoothstep(-0.2,0.45,mineral),2.0);
              veins += filament(warped+split,level,0.00065)*availability*0.54;
              float branch = 0.12*noise(q*2.8+vec2(5.1,float(i)*1.4));
              veins += filament(warped+branch,level,0.00055)*
                smoothstep(0.06,0.29,mineral)*0.68;
            }
            // Occasional independent hairlines wander across the broad fields.
            float hair = field+0.32*fbm(q*3.1+vec2(18,2));
            float hairMask = smoothstep(-0.04,0.22,noise(q*3.9+7.0));
            veins += filament(hair,-0.68,0.00075)*hairMask*0.55;
            veins += filament(hair,1.72,0.00070)*hairMask*0.46;

            vec2 slope = noiseD(q*5.6+vec2(2.6,9.1)).yz;
            float sheen = pow(clamp(0.52+dot(slope,normalize(vec2(0.8,0.6)))*0.35
                                   +orbit.x*0.10,0.0,1.0),3.0);
            vec3 metal = mix(ROSE,GOLD,0.52+mineral*0.6);
            metal = mix(metal,mix(PEARL,GOLD,0.18),sheen*0.85);
            metal += grain*0.055;
            return mix(color,metal,clamp(veins*uVeins,0.0,1.0)*0.89);
          }

          void main() {
            // Coordinates are measured in viewport heights: no stretched noise.
            vec2 screen = (gl_FragCoord.xy-0.5*uResolution)/uResolution.y*2.65;
            // Intersect a movable, orbiting virtual camera with the marble plane.
            // The fullscreen raster plane stays fixed, so no viewport gaps appear.
            vec3 eye = uView*vec3(0.0,0.0,3.4);
            vec3 ray = uView*vec3(screen/uZoom,-3.4);
            vec2 sheetPosition = eye.xy + ray.xy*(-eye.z/min(ray.z,-0.05)) + uPan;
            float coverage = 1.0;
            if (uIsolate > 0.5) {
              vec2 edge = abs(sheetPosition/vec2(1.92,1.08));
              float shape = pow(pow(edge.x,5.0)+pow(edge.y,5.0),0.2);
              shape += 0.014*sin(sheetPosition.x*5.0+sheetPosition.y*3.0);
              float aa = max(fwidth(shape),0.0004);
              coverage = 1.0-smoothstep(1.0-aa,1.0+aa,shape);
              if (coverage <= 0.0) {
                gl_FragColor = vec4(uBackground,1.0);
                return;
              }
            }
            vec2 p = sheetPosition*uScale;
            float phase = TAU*mod(uTime,60.0)/60.0;
            vec2 orbit = vec2(cos(phase),sin(phase))*uFlow;
            vec2 q = fluidDomain(p,orbit);
            vec3 ridge = noiseD(q*vec2(1.20,0.64)+vec2(5.3,2.4));
            float field = q.x*0.84+q.y*1.14+ridge.x*0.74;
            field += 0.085*fbm(q*vec2(3.2,1.5)+vec2(4.5,7.1));

            vec3 color = pastelLayers(p,q,field,orbit);
            // Analytic noise gradients suggest shallow, softly backlit folds.
            float nacre = dot(ridge.yz,normalize(vec2(-0.4,0.9)));
            float contourLight = exp(-abs(sin(field*2.23))*13.0);
            color += vec3(0.024,0.027,0.032)*nacre*contourLight;
            color += vec3(0.010,0.005,0.012)*sin(field*3.0+orbit.x*0.35);
            if (uMonochrome > 0.5) color = vec3(dot(color,vec3(0.2126,0.7152,0.0722)));
            color = metallicVeins(color,q,field,orbit);

            // Screen-stationary sub-LSB dither prevents pastel gradient banding.
            float dither = fract(52.9829189*fract(dot(gl_FragCoord.xy,
                                vec2(0.06711056,0.00583715))))-0.5;
            color += dither/255.0;
            gl_FragColor = vec4(mix(uBackground,clamp(color,0.0,1.0),coverage),1.0);
          }
        `
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      scene.add(new THREE.Mesh(geometry, material));

      // Ten semantic colors per scheme: body, blue, silk, lavender, ridge,
      // blush, pearl, fine veins, metal, secondary metal. No LUT/image assets.
      const stops = colors => {
        const p = colors.split(' ').map(c => '#'+c);
        return [p[1],p[2],p[0],p[Math.min(3,p.length-2)],p.at(-2),p[0],p[0],p.at(-1),p[1],p[2]];
      };
      const schemes = {
        'Original': ['#b8d6fa','#a9cafa','#bcebfa','#c9c9f0','#a8b8eb','#f5d8ea','#fff9f5','#618dc9','#f6d6a7','#e8b9ba'],
        'Monochromatic': ['#adcdf0','#81a9d8','#e5f2ff','#b5cde9','#638bb8','#d4e5f6','#f6faff','#315c91','#a7c6e6','#789fc9'],
        'Analogous': ['#afdbec','#87c9df','#d1f4ed','#c5bce8','#8c9dd2','#ddd0ed','#f5f7ff','#557eae','#b6d7ca','#c9b6e5'],
        'Complementary': ['#a6cde4','#72aacd','#d8ebf5','#b5cde0','#6686a5','#f4cbb3','#fff0de','#375d82','#e9ae70','#cf8568'],
        'Split-complementary': ['#b0c9ed','#8aaee0','#dceafb','#c9bee8','#8f91c0','#f1c7cc','#fff4e8','#526da0','#e8c783','#dc9eaf'],
        'Triadic': ['#b1cbea','#92afe0','#dfedfc','#d8b6d2','#9d8cb5','#efc1c5','#fff0d8','#56678f','#ead28c','#cf9abb'],
        'Tetradic': ['#a6cddb','#85b4d5','#d3eee4','#cbb7dc','#9694b9','#e8c2c7','#fbefd7','#536781','#d9bd7f','#c593b9'],
        'Double split-complementary': ['#b3cce8','#8eadd5','#d1e6d2','#cbb7dc','#9694b6','#edc4b3','#fff0d9','#566782','#e3bc81','#c993b5'],
        'Achromatic': ['#999999','#555555','#e2e2e2','#bbbbbb','#444444','#eeeeee','#ffffff','#080808','#f8f8f8','#888888'],
        'Achromatic + Accent': ['#999999','#555555','#e2e2e2','#bbbbbb','#444444','#eeeeee','#ffffff','#080808','#ff202a','#bc1424'],
        'Neutral + accent': ['#c6c1b8','#aca69c','#ece9e0','#9f9c97','#6c6b68','#d9d4c9','#f5f2eb','#3f4143','#e9a23b','#cb7138'],
        'Amber / Ember': stops('F6AA1C BC3908 941B0C F6AA1C 220901'),
        'Turquoise / Obsidian': stops('63D1CF 5BC0BE 4BAD9E 4BAD9E 0B132B 000000'),
        'Orchid / Ink': stops('AA60C8 D69ADE C9A3C6 CFB5C2 0D001D 120A12'),
        'Saffron / Lagoon': stops('FEF1BE FFBA00 008189 00474D 061210'),
        'Chartreuse / Jade': stops('D4FFB0 7FFF00 00B894 0A3322 05140A'),
        'Tangerine / Aubergine': stops('FFE8CC FF8C00 C7501A 3D1050 0E0618'),
        'Amethyst / Midnight': stops('E8E0FF B38FFF 6A3DE8 1A1250 090612'),
        'Cyan / Fuchsia': stops('E0FBFF 00F0FF D40078 1E0A3D 05020F')
      };
      const animationNames = ['Static','Liquid drift','Diagonal glide','Gentle orbit',
        'Figure eight','Silk sway','Pearl breathing','Slow roll'];
      const params = {
        scheme: 'Original', color: '#b8d6fa', accent: '#f6d6a7', invert: false,
        background: '#bfd7f5', greenscreen: false, isolate: false,
        pixelRatio: 0, animation: 'Liquid drift', speed: 1, motion: 1,
        zoom: 1, panX: 0, panY: 0, yaw: 0, tilt: 0, rotation: 0,
        seed: 0, scale: 1, warp: 1, flow: 1, veins: 1, clickRandomize: true
      };

      function rgb(hex, target) {
        const n = parseInt(hex.replace('#',''),16);
        return target.set(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255);
      }
      function hsl(hex) {
        return new THREE.Color(hex).getHSL({},THREE.SRGBColorSpace);
      }
      function applyPalette() {
        const palette = schemes[params.scheme];
        const base = hsl(palette[0]), tint = hsl(params.color);
        const metal = hsl(palette[8]), accent = hsl(params.accent);
        palette.forEach((hex,i) => {
          const source = hsl(hex);
          let h = source.h, s = source.s, l = source.l;
          if (i < 8) {
            h += tint.h-base.h;
            s = THREE.MathUtils.clamp(s+(tint.s-base.s)*(s<0.04?0.25:1),0,1);
            l = THREE.MathUtils.clamp(l+tint.l-base.l,0,1);
            if (params.invert) l = 1-l;
          } else {
            h += accent.h-metal.h;
            s = THREE.MathUtils.clamp(s+accent.s-metal.s,0,1);
            l = THREE.MathUtils.clamp(l+accent.l-metal.l,0,1);
          }
          const color = new THREE.Color().setHSL(h,s,l,THREE.SRGBColorSpace);
          const channels = color.getRGB({},THREE.SRGBColorSpace);
          uniforms.uPalette.value[i].set(channels.r,channels.g,channels.b);
        });
        uniforms.uMonochrome.value = params.scheme.startsWith('Achromatic') &&
          params.color.toLowerCase() === palette[0].toLowerCase() ? 1 : 0;
      }
      function applyBackground() {
        rgb(params.greenscreen ? '#00ff00' : params.background,uniforms.uBackground.value);
        uniforms.uIsolate.value = params.isolate ? 1 : 0;
      }
      function applyStructure() {
        uniforms.uSeed.value = params.seed;
        uniforms.uScale.value = params.scale;
        uniforms.uWarp.value = params.warp;
        uniforms.uFlow.value = params.flow;
        uniforms.uVeins.value = params.veins;
      }

      let GUI;
      try {
        ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
      } catch {
        ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
      }
      const gui = new GUI({ title: 'Liquid Marble', width: 300 });
      function refreshPanel() { gui.controllersRecursive().forEach(c => c.updateDisplay()); }
      function selectScheme() {
        params.color = schemes[params.scheme][0];
        params.accent = schemes[params.scheme][8];
        applyPalette();
        refreshPanel();
      }

      const appearance = gui.addFolder('Color');
      appearance.add(params,'scheme',Object.keys(schemes)).name('Color scheme').onChange(selectScheme);
      appearance.addColor(params,'color').name('Marble color').onChange(applyPalette);
      appearance.addColor(params,'accent').name('Vein color').onChange(applyPalette);
      appearance.add(params,'invert').name('Invert tones').onChange(applyPalette);

      const background = gui.addFolder('Background');
      background.add(params,'greenscreen').name('Greenscreen').onChange(value => {
        if (value) params.isolate = true;
        applyBackground();
        refreshPanel();
      });
      background.addColor(params,'background').name('Background color').onChange(() => {
        params.greenscreen = false;
        params.isolate = true;
        applyBackground();
        refreshPanel();
      });
      background.add(params,'isolate').name('Isolate marble sheet').onChange(applyBackground);

      const motion = gui.addFolder('Animation');
      motion.add(params,'animation',animationNames).name('Motion preset').onChange(() => {
        // Static freezes the current composition, including the current camera.
        if (params.animation === 'Static') {
          params.zoom *= cameraMotion.zoom;
          params.panX += cameraMotion.x;
          params.panY += cameraMotion.y;
          params.yaw += cameraMotion.yaw;
          params.tilt += cameraMotion.tilt;
          params.rotation += cameraMotion.roll;
          Object.assign(cameraMotion,{x:0,y:0,yaw:0,tilt:0,roll:0,zoom:1});
          refreshPanel();
        }
      });
      motion.add(params,'speed',0,3,0.01).name('Animation speed');
      motion.add(params,'motion',0,2,0.01).name('Camera motion');
      motion.add(params,'flow',0,2,0.01).name('Fluid motion').onChange(applyStructure);

      const view = gui.addFolder('View');
      view.add(params,'zoom',0.15,10,0.01).name('Zoom');
      view.add(params,'panX',-20,20,0.01).name('Horizontal position');
      view.add(params,'panY',-20,20,0.01).name('Vertical position');
      view.add(params,'yaw',-40,40,0.1).name('Orbit angle');
      view.add(params,'tilt',-40,40,0.1).name('Tilt');
      view.add(params,'rotation',-180,180,0.1).name('Rotation');
      const actions = {
        resetView() {
          Object.assign(params,{zoom:1,panX:0,panY:0,yaw:0,tilt:0,rotation:0});
          refreshPanel();
        },
        randomize() {
          const choose = list => list[Math.floor(Math.random()*list.length)];
          const range = (min,max) => Number((min+Math.random()*(max-min)).toFixed(2));
          params.scheme = choose(Object.keys(schemes));
          params.invert = params.scheme.startsWith('Achromatic') && Math.random()<0.5;
          params.seed = Math.floor(range(1,10000));
          params.scale = range(0.65,1.6);
          params.warp = range(0.6,1.65);
          params.flow = range(0.45,1.45);
          params.veins = range(0.55,1.55);
          params.animation = choose(animationNames.slice(1));
          params.speed = range(0.3,1.05);
          params.motion = range(0.35,1.15);
          // User positioning, DPR, key color, and background mode stay intact.
          if (!params.greenscreen) params.background = schemes[params.scheme][7];
          selectScheme();
          applyBackground();
          applyStructure();
          refreshPanel();
        }
      };
      view.add(actions,'resetView').name('Reset view');
      view.close();
      const structure = gui.addFolder('Procedural variation');
      structure.add(params,'clickRandomize').name('Randomize on click');
      structure.add(actions,'randomize').name('New variation');
      structure.add(params,'seed',0,10000,1).name('Seed').onChange(applyStructure);
      structure.add(params,'scale',0.3,3,0.01).name('Pattern scale').onChange(applyStructure);
      structure.add(params,'warp',0.1,2,0.01).name('Fold curvature').onChange(applyStructure);
      structure.add(params,'veins',0,2,0.01).name('Mineral veins').onChange(applyStructure);
      structure.close();
      const quality = gui.addFolder('Rendering');
      quality.add(params,'pixelRatio',{'Auto':0,'0.5':0.5,'0.75':0.75,'1':1,'1.25':1.25,
        '1.5':1.5,'1.75':1.75,'2':2,'2.5':2.5,'3':3}).name('Pixel ratio (DPR)').onChange(resize);
      quality.close();
      for (const controller of gui.controllersRecursive()) {
        if (typeof controller.decimals === 'function') controller.decimals(controller.property==='seed'?0:2);
      }

      function resize() {
        const width = window.innerWidth, height = window.innerHeight;
        const autoRatio = Math.min(window.devicePixelRatio || 1,1.75,
          Math.sqrt(4200000/(width*height)));
        // A selected numeric DPR is honored exactly; only Auto caps fill rate.
        renderer.setPixelRatio(params.pixelRatio || autoRatio);
        renderer.setSize(width,height,false);
        renderer.getDrawingBufferSize(uniforms.uResolution.value);
      }
      window.addEventListener('resize',resize,{passive:true});

      let animationFrame = 0, elapsed = 0, cameraPhase = 0;
      let previousTime = null, contextLost = false;
      const cameraMotion = {x:0,y:0,yaw:0,tilt:0,roll:0,zoom:1};
      const viewMatrix = new THREE.Matrix4();
      const viewEuler = new THREE.Euler(0,0,0,'YXZ');
      const radians = THREE.MathUtils.degToRad;

      function updateView(dt=0) {
        const target = {x:0,y:0,yaw:0,tilt:0,roll:0,zoom:1};
        const a = cameraPhase, m = params.motion;
        switch (params.animation) {
          case 'Diagonal glide':
            target.x = Math.sin(a)*0.28*m;
            target.y = Math.sin(a)*0.18*m;
            break;
          case 'Gentle orbit':
            target.yaw = Math.sin(a)*12*m;
            target.tilt = Math.cos(a)*8*m;
            break;
          case 'Figure eight':
            target.x = Math.sin(a)*0.26*m;
            target.y = Math.sin(a*2)*0.11*m;
            target.roll = Math.sin(a)*2*m;
            break;
          case 'Silk sway':
            target.roll = Math.sin(a)*4*m;
            target.x = Math.sin(a)*0.12*m;
            break;
          case 'Pearl breathing':
            target.zoom = Math.exp(Math.sin(a)*0.065*m);
            target.tilt = Math.sin(a)*3*m;
            break;
          case 'Slow roll':
            target.roll = Math.sin(a)*14*m;
            target.yaw = Math.sin(a)*4*m;
            break;
        }
        // Ease preset changes; user zoom and angle are independent persistent offsets.
        const blend = 1-Math.exp(-dt*2.8);
        for (const key in cameraMotion) cameraMotion[key] += (target[key]-cameraMotion[key])*blend;
        const yaw = THREE.MathUtils.clamp(params.yaw+cameraMotion.yaw,-55,55);
        const tilt = THREE.MathUtils.clamp(params.tilt+cameraMotion.tilt,-55,55);
        viewEuler.set(radians(tilt),radians(yaw),radians(params.rotation+cameraMotion.roll),'YXZ');
        viewMatrix.makeRotationFromEuler(viewEuler);
        uniforms.uView.value.setFromMatrix4(viewMatrix);
        uniforms.uZoom.value = params.zoom*cameraMotion.zoom;
        uniforms.uPan.value.set(params.panX+cameraMotion.x,params.panY+cameraMotion.y);
      }

      // The same ray/plane intersection as the shader anchors zoom and dragging.
      const eye = new THREE.Vector3(), ray = new THREE.Vector3();
      function worldAt(clientX,clientY) {
        const bounds = canvas.getBoundingClientRect();
        const x = ((clientX-bounds.left)-bounds.width/2)/bounds.height*2.65;
        const y = (bounds.height/2-(clientY-bounds.top))/bounds.height*2.65;
        eye.set(0,0,3.4).applyMatrix3(uniforms.uView.value);
        ray.set(x/uniforms.uZoom.value,y/uniforms.uZoom.value,-3.4).applyMatrix3(uniforms.uView.value);
        const distance = -eye.z/Math.min(ray.z,-0.05);
        return new THREE.Vector2(eye.x+ray.x*distance,eye.y+ray.y*distance).add(uniforms.uPan.value);
      }
      canvas.addEventListener('wheel',event => {
        event.preventDefault();
        updateView();
        const before = worldAt(event.clientX,event.clientY);
        const delta = event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?innerHeight:1);
        params.zoom = THREE.MathUtils.clamp(params.zoom*Math.exp(-THREE.MathUtils.clamp(delta,-300,300)*0.0015),0.15,10);
        updateView();
        const after = worldAt(event.clientX,event.clientY);
        params.panX += before.x-after.x;
        params.panY += before.y-after.y;
        updateView();
        refreshPanel();
      },{passive:false});

      let gesture = null;
      canvas.addEventListener('pointerdown',event => {
        if (!event.isPrimary || (event.button!==0 && event.button!==2)) return;
        canvas.setPointerCapture(event.pointerId);
        gesture = {id:event.pointerId,startX:event.clientX,startY:event.clientY,
          x:event.clientX,y:event.clientY,dragged:false,orbit:event.button===2 || event.shiftKey};
      });
      canvas.addEventListener('pointermove',event => {
        if (!gesture || gesture.id!==event.pointerId) return;
        if (Math.hypot(event.clientX-gesture.startX,event.clientY-gesture.startY)>5) gesture.dragged = true;
        if (!gesture.dragged) return;
        if (gesture.orbit) {
          params.yaw = THREE.MathUtils.clamp(params.yaw+(event.clientX-gesture.x)*0.16,-40,40);
          params.tilt = THREE.MathUtils.clamp(params.tilt+(event.clientY-gesture.y)*0.16,-40,40);
        } else {
          updateView();
          const before = worldAt(gesture.x,gesture.y), after = worldAt(event.clientX,event.clientY);
          params.panX += before.x-after.x;
          params.panY += before.y-after.y;
        }
        gesture.x = event.clientX;
        gesture.y = event.clientY;
        updateView();
        refreshPanel();
      });
      canvas.addEventListener('pointerup',event => {
        if (!gesture || gesture.id!==event.pointerId) return;
        const randomize = !gesture.dragged && !gesture.orbit && params.clickRandomize;
        gesture = null;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        if (randomize) actions.randomize();
      });
      canvas.addEventListener('pointercancel',() => { gesture = null; });
      canvas.addEventListener('lostpointercapture',() => { gesture = null; });
      canvas.addEventListener('contextmenu',event => event.preventDefault());
      window.addEventListener('keydown',event => {
        if (event.code!=='KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.target instanceof HTMLElement &&
          (event.target.matches('input,textarea') || event.target.isContentEditable)) return;
        gui.show(gui._hidden);
      });

      function frame(now) {
        animationFrame = 0;
        if (document.hidden || contextLost) return;
        const dt = previousTime===null ? 0 : Math.min((now-previousTime)/1000,0.1);
        previousTime = now;
        const running = params.animation!=='Static';
        const animationDelta = running ? dt*params.speed : 0;
        elapsed = (elapsed+animationDelta)%60;
        cameraPhase = (cameraPhase+animationDelta*Math.PI*2/120)%(Math.PI*2);
        uniforms.uTime.value = elapsed;
        updateView(running && params.speed>0 ? dt : 0);
        renderer.render(scene,camera);
        animationFrame = requestAnimationFrame(frame);
      }
      function resume() {
        cancelAnimationFrame(animationFrame);
        previousTime = null;
        if (!document.hidden && !contextLost) animationFrame = requestAnimationFrame(frame);
      }
      document.addEventListener('visibilitychange',resume);
      canvas.addEventListener('webglcontextlost',event => {
        event.preventDefault();
        contextLost = true;
        cancelAnimationFrame(animationFrame);
      });
      canvas.addEventListener('webglcontextrestored',() => {
        contextLost = false;
        resize();
        resume();
      });
      applyPalette();
      applyBackground();
      applyStructure();
      updateView();
      resize();
      resume();
    } catch (cause) {
      showError('This artwork needs WebGL 2 and an internet connection to load its libraries.',cause);
    }
  </script>
</body>
</html>
