    class Tool {
      static randomNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
      }

      static randomColorRGB() {
        return (
          'rgb(' +
          this.randomNumber(0, 255) +
          ', ' +
          this.randomNumber(0, 255) +
          ', ' +
          this.randomNumber(0, 255) +
          ')'
        );
      }

      static randomColorHSL(saturation, lightness) {
        return (
          'hsl(' +
          this.randomNumber(0, 360) +
          ', ' +
          saturation +
          '%, ' +
          lightness +
          '%)'
        );
      }

      static gradientColor(ctx, cr, cg, cb, ca, x, y, r) {
        const col = cr + ',' + cg + ',' + cb;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(' + col + ', ' + ca * 1 + ')');
        g.addColorStop(0.5, 'rgba(' + col + ', ' + ca * 0.5 + ')');
        g.addColorStop(1, 'rgba(' + col + ', ' + ca * 0 + ')');
        return g;
      }
    }

    class Angle {
      constructor(angle) {
        this.a = angle;
        this.rad = (this.a * Math.PI) / 180;
      }

      incDec(num) {
        this.a += num;
        this.rad = (this.a * Math.PI) / 180;
        return this.rad;
      }
    }

    class Time {
      constructor(time) {
        this.startTime = time;
        this.lastTime = 0;
        this.elapsedTime = 0;
      }

      getElapsedTime() {
        this.lastTime = Date.now();
        this.elapsedTime = (this.startTime - this.lastTime) * -1;
        return this.elapsedTime;
      }
    }

    class Vector2d {
      constructor(x, y) {
        this.vx = x;
        this.vy = y;
      }

      scale(scale) {
        this.vx *= scale;
        this.vy *= scale;
      }

      add(vec2) {
        this.vx += vec2.vx;
        this.vy += vec2.vy;
      }

      sub(vec2) {
        this.vx -= vec2.vx;
        this.vy -= vec2.vy;
      }

      negate() {
        this.vx = -this.vx;
        this.vy = -this.vy;
      }

      length() {
        return Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      }

      lengthSquared() {
        return this.vx * this.vx + this.vy * this.vy;
      }

      normalize() {
        const len = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (len) {
          this.vx /= len;
          this.vy /= len;
        }
        return len;
      }

      rotate(angle) {
        const vx = this.vx;
        const vy = this.vy;
        const cosVal = Math.cos(angle);
        const sinVal = Math.sin(angle);
        this.vx = vx * cosVal - vy * sinVal;
        this.vy = vx * sinVal + vy * cosVal;
      }

      toString() {
        return '(' + this.vx.toFixed(3) + ',' + this.vy.toFixed(3) + ')';
      }
    }

    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const a = s * Math.min(l, 1 - l);
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    const colorSchemes = {

          const h = ((Math.sin(aRad / 5) * 360 + params.hueShift) % 360 + 360) % 360;
          const s = params.saturation;
          const l = params.lightness;
          return {
            main: `hsl(${h}, ${s}%, ${l}%)`,

    const params = {
      // Colors & Background
      scheme: 'Original',
      greenscreen: false,
      backgroundColor: '#0b0b12',
      accentColor: '#FFB703',
      customHue: 200,
      hueShift: 0,
      saturation: 80,
      lightness: 60,

      // Transform (Pan & Zoom)
      scale: 1.0,
      panX: 0,
      panY: 0,
      resetView() {
        params.scale = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateGuiDisplays();
      },

      // Geometry & Physics
      ballNum: 36,
      ballSize: 1.0,
      lineWidth: 1.0,
      amplitude: 1.0,
      speed: 1.0,
      elasticity: 0.3,
      damping: 0.5,
      showShadows: true,
      shadowAlpha: 0.5,

      // Procedural Variation
      clickToRandomize: true,
      randomizeNow() {
        randomizeScene();
      }
    };

    function updateGuiDisplays() {
      if (typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else {
        const updateFolder = f => {
          if (f.controllers) f.controllers.forEach(c => c.updateDisplay());
          if (f.folders) f.folders.forEach(sub => updateFolder(sub));
        };
        updateFolder(gui);
      }
    }

    function onSchemeChange(value) {
      if (!params.greenscreen && colorSchemes[value] && colorSchemes[value].defaultBg) {
        params.backgroundColor = colorSchemes[value].defaultBg;
      }
      updateGuiDisplays();
    }

    function randomizeScene() {
      const schemeKeys = Object.keys(colorSchemes);
      const chosenKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.scheme = chosenKey;

      params.customHue = Math.floor(Math.random() * 360);
      params.hueShift = Math.floor(Math.random() * 360);
      params.saturation = Math.floor(Math.random() * 30 + 70);
      params.lightness = Math.floor(Math.random() * 20 + 50);

      const randAccent = Math.floor(Math.random() * 360);
      params.accentColor = hslToHex(randAccent, 95, 60);

      if (!params.greenscreen) {
        if (colorSchemes[params.scheme].defaultBg) {
          params.backgroundColor = colorSchemes[params.scheme].defaultBg;
        } else {
          params.backgroundColor = hslToHex((randAccent + 180) % 360, 40, 8);
        }
      }

      params.ballNum = Math.floor(Math.random() * 35 + 15);
      params.ballSize = Number((Math.random() * 1.0 + 0.6).toFixed(2));
      params.lineWidth = Number((Math.random() * 1.4 + 0.6).toFixed(2));
      params.amplitude = Number((Math.random() * 1.4 + 0.6).toFixed(2));
      params.speed = Number((Math.random() * 1.2 + 0.5).toFixed(2));
      params.elasticity = Number((Math.random() * 0.4 + 0.15).toFixed(2));
      params.damping = Number((Math.random() * 0.35 + 0.35).toFixed(2));
      params.shadowAlpha = Number((Math.random() * 0.5 + 0.3).toFixed(2));

      updateGuiDisplays();
      canvas.rebuildBalls();
    }

    class Ball {
      constructor(ctx, x, y, r, i, index, total) {
        this.ctx = ctx;
        this.init(x, y, r, i, index, total);
      }

      init(x, y, r, i, index, total) {
        this.t = new Time(new Date());
        this.ratio = i / 10 / 10;
        this.x = x;
        this.xi = x;
        this.y = 0;
        this.yi = y;
        this.r = r;
        this.i = i;
        this.index = index;
        this.total = total;
        this.lw = this.r / 50;
        this.a = new Angle(this.i);
        this.v = new Vector2d(0, 0);
      }

      draw() {
        const ctx = this.ctx;
        const schemeObj = colorSchemes[params.scheme] || colorSchemes['Original'];
        const colors = schemeObj.getColors(this.index, this.total, this.a.rad);

        const currentRadius = this.r * params.ballSize;
        const currentLw = this.lw * params.lineWidth;

        ctx.save();
        ctx.lineWidth = currentLw;
        ctx.strokeStyle = colors.main;
        ctx.fillStyle = colors.main;

        ctx.translate(this.x, 0);
        ctx.rotate(0.05 * this.ratio * Math.sin(this.a.rad) * params.amplitude);
        ctx.translate(-this.x, 0);

        // Hanging elastic curve
        ctx.beginPath();
        ctx.moveTo(this.xi, 0);
        ctx.quadraticCurveTo(
          Math.sin(this.a.rad) * 30 * params.amplitude + this.xi,
          this.y / 2,
          this.x,
          this.y
        );
        ctx.stroke();

        // Main Ball
        ctx.beginPath();
        ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2, false);
        ctx.fill();
        ctx.stroke();

        // Highlight Crescent
        ctx.lineCap = 'round';
        ctx.strokeStyle = colors.highlight;
        ctx.lineWidth = currentLw * 10;
        ctx.beginPath();
        ctx.arc(this.x, this.y, currentRadius * 0.7, Math.PI * 1.1, Math.PI * 1.4, false);
        ctx.stroke();
        ctx.restore();

        // Drop shadow on floor
        if (params.showShadows) {
          ctx.save();
          this.dropShadow(colors.shadow, currentRadius);
          ctx.restore();
        }
      }

      dropShadow(shadowColor, currentRadius) {
        const ctx = this.ctx;
        ctx.save();
        ctx.fillStyle = shadowColor;
        ctx.globalAlpha = params.shadowAlpha;
        ctx.beginPath();
        ctx.ellipse(
          Math.sin(-this.a.rad) * 30 * this.ratio * params.amplitude + this.x,
          this.y + (100 * this.ratio) / 5,
          currentRadius,
          Math.max(0.5, currentRadius / 20),
          0,
          0,
          Math.PI * 2,
          false
        );
        ctx.fill();
        ctx.restore();
      }

      elasticity() {
        this.v.vy += (this.yi - this.y) * params.elasticity;
        this.v.vy *= params.damping;
        this.y += this.v.vy;
      }

      render() {
        this.draw();
        this.elasticity();
        this.a.incDec(1 * params.speed);
      }
    }

    class Canvas {
      constructor(bool) {
        this.canvas = document.createElement('canvas');
        if (bool === true) {
          this.canvas.style.display = 'block';
          this.canvas.style.top = '0';
          this.canvas.style.left = '0';
          document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;

        this.balls = [];
        this.clearId = [];
      }

      init() {
        const that = this;
        for (let i = 0; i < this.clearId.length; i++) {
          clearTimeout(this.clearId[i]);
        }
        this.clearId = [];
        this.balls = [];

        let p = Promise.resolve();
        for (let i = 1; i <= params.ballNum; i++) {
          p = p.then(function () {
            return new Promise(function (res) {
              const tid = setTimeout(function () {
                const b = new Ball(
                  that.ctx,
                  that.width - (that.width / params.ballNum) * i,
                  that.height / 2 + 5 * i,
                  2 * i,
                  i * 20,
                  i - 1,
                  params.ballNum
                );
                that.balls.push(b);
              }, i * 60);
              that.clearId.push(tid);
              res();
            });
          });
        }
      }

      rebuildBalls() {
        for (let i = 0; i < this.clearId.length; i++) {
          clearTimeout(this.clearId[i]);
        }
        this.clearId = [];
        this.balls = [];

        for (let i = 1; i <= params.ballNum; i++) {
          const b = new Ball(
            this.ctx,
            this.width - (this.width / params.ballNum) * i,
            this.height / 2 + 5 * i,
            2 * i,
            i * 20,
            i - 1,
            params.ballNum
          );
          this.balls.push(b);
        }
      }

      render() {
        const ctx = this.ctx;

        // Background rendering
        if (params.greenscreen) {
          ctx.fillStyle = '#00ff00';
        } else {
          ctx.fillStyle = params.backgroundColor;
        }
        ctx.fillRect(0, 0, this.width, this.height);

        // Zoom and Pan transform
        ctx.save();
        ctx.translate(params.panX, params.panY);
        ctx.scale(params.scale, params.scale);

        for (let i = 0; i < this.balls.length; i++) {
          this.balls[i].render();
        }

        ctx.restore();
      }

      resize() {
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
        this.rebuildBalls();
      }
    }

    let canvas;
    let gui;

    window.addEventListener('load', function () {
      canvas = new Canvas(true);
      canvas.init();

      // Setup lil-gui
      gui = new GUI({ title: 'Pendulum Wave Settings' });

      // Color Schemes & Background Folder
      const fColor = gui.addFolder('Color Schemes & Background');
      fColor
        .add(params, 'scheme', Object.keys(colorSchemes))
        .name('Color Scheme')
        .onChange(onSchemeChange);
      fColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)');
      fColor.addColor(params, 'backgroundColor').name('Background Color').listen();
      fColor.addColor(params, 'accentColor').name('Accent Color');
      fColor.add(params, 'customHue', 0, 360, 1).name('Base Hue');
      fColor.add(params, 'hueShift', 0, 360, 1).name('Hue Shift');
      fColor.add(params, 'saturation', 0, 100, 1).name('Saturation %');
      fColor.add(params, 'lightness', 0, 100, 1).name('Lightness %');

      // Zoom & Pan Folder
      const fTransform = gui.addFolder('Zoom & Pan');
      fTransform.add(params, 'scale', 0.1, 5.0, 0.01).name('Zoom Scale').listen();
      fTransform.add(params, 'panX', -2000, 2000, 1).name('Pan X').listen();
      fTransform.add(params, 'panY', -2000, 2000, 1).name('Pan Y').listen();
      fTransform.add(params, 'resetView').name('Reset View');

      // Geometry & Motion Folder
      const fMotion = gui.addFolder('Geometry & Motion');
      fMotion
        .add(params, 'ballNum', 5, 80, 1)
        .name('Ball Count')
        .onFinishChange(() => canvas.rebuildBalls());
      fMotion.add(params, 'ballSize', 0.2, 3.0, 0.05).name('Ball Size');
      fMotion.add(params, 'lineWidth', 0.2, 5.0, 0.05).name('Line Width');
      fMotion.add(params, 'amplitude', 0.1, 3.0, 0.05).name('Amplitude');
      fMotion.add(params, 'speed', 0.1, 3.0, 0.05).name('Motion Speed');
      fMotion.add(params, 'elasticity', 0.05, 0.8, 0.01).name('Elasticity');
      fMotion.add(params, 'damping', 0.1, 0.95, 0.01).name('Damping');
      fMotion.add(params, 'showShadows').name('Show Shadows');
      fMotion.add(params, 'shadowAlpha', 0.0, 1.0, 0.05).name('Shadow Opacity');

      // Procedural Variation Folder
      const fProcedural = gui.addFolder('Procedural Variations');
      fProcedural.add(params, 'clickToRandomize').name('Click to Randomize');
      fProcedural.add(params, 'randomizeNow').name('Randomize Now');

      // Animation loop
      function renderLoop() {
        window.requestAnimationFrame(function () {
          canvas.render();
          renderLoop();
        });
      }
      renderLoop();

      // Window resize
      window.addEventListener('resize', function () {
        canvas.resize();
      }, false);

      // Hide/Show UI with 'H' key
      window.addEventListener('keydown', function (e) {
        if (e.key === 'h' || e.key === 'H') {
          if (
            e.target &&
            (e.target.tagName === 'INPUT' ||
              e.target.tagName === 'TEXTAREA' ||
              e.target.tagName === 'SELECT')
          ) {
            return;
          }
          const isHidden = gui.domElement.style.display === 'none';
          gui.domElement.style.display = isHidden ? '' : 'none';
        }
      });

      // Zoom with mouse wheel centered at cursor
      window.addEventListener('wheel', function (e) {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();

        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const newScale = Math.min(Math.max(0.1, params.scale * zoomFactor), 8.0);

        const mouseX = e.clientX;
        const mouseY = e.clientY;

        params.panX = mouseX - (mouseX - params.panX) * (newScale / params.scale);
        params.panY = mouseY - (mouseY - params.panY) * (newScale / params.scale);
        params.scale = newScale;

        updateGuiDisplays();
      }, { passive: false });

      // Drag object across screen + Click on scene to randomize
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let startPanX = 0;
      let startPanY = 0;
      let dragDistance = 0;

      window.addEventListener('mousedown', function (e) {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startPanX = params.panX;
        startPanY = params.panY;
        dragDistance = 0;
        canvas.canvas.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', function (e) {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        dragDistance = Math.hypot(dx, dy);
        params.panX = startPanX + dx;
        params.panY = startPanY + dy;
        updateGuiDisplays();
      });

      window.addEventListener('mouseup', function (e) {
        if (e.target.closest && e.target.closest('.lil-gui')) {
          isDragging = false;
          canvas.canvas.style.cursor = 'grab';
          return;
        }
        if (isDragging) {
          canvas.canvas.style.cursor = 'grab';
          isDragging = false;
          if (dragDistance < 6 && params.clickToRandomize) {
            randomizeScene();
          }
        }
      });

      // Touch drag, pinch-to-zoom, and touch-to-randomize
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartPanX = 0;
      let touchStartPanY = 0;
      let touchStartDist = 0;
      let touchStartScale = 1;
      let isTouching = false;
      let touchMovedDistance = 0;

      window.addEventListener('touchstart', function (e) {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        if (e.touches.length === 1) {
          isTouching = true;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartPanX = params.panX;
          touchStartPanY = params.panY;
          touchMovedDistance = 0;
        } else if (e.touches.length === 2) {
          isTouching = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          touchStartScale = params.scale;
        }
      }, { passive: true });

      window.addEventListener('touchmove', function (e) {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        if (isTouching && e.touches.length === 1) {
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          touchMovedDistance = Math.hypot(dx, dy);
          params.panX = touchStartPanX + dx;
          params.panY = touchStartPanY + dy;
          updateGuiDisplays();
        } else if (e.touches.length === 2 && touchStartDist > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const newScale = Math.min(Math.max(0.1, touchStartScale * (dist / touchStartDist)), 8.0);
          params.scale = newScale;
          updateGuiDisplays();
        }
      }, { passive: true });

      window.addEventListener('touchend', function (e) {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        if (isTouching) {
          if (touchMovedDistance < 6 && params.clickToRandomize) {
            randomizeScene();
          }
          isTouching = false;
        }
      });
    });
  </script>
</body>
</html>
