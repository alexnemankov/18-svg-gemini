<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Row of Clay Diyas on Dark Surface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080707;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #canvas-container canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Import Maps for Three.js, lil-gui & PostProcessor -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
        "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // Inlined for standalone execution with zero-CORS restriction
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);
      float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.0001);
      vec3 result = color * contribution;
      fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}

    vec4 sanitize(vec4 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
      return clamp(v, vec4(0.0), vec4(65000.0));
    }

    void main() {
      color = sanitize(blur13(inputTexture, vUv, direction));
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0
    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);
      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
        vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
        vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
        vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
        vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);

        vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec3 r = sanitize(texture(raysTexture, vUv).rgb);
        color += r * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
        color += a;
      }

      float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
      color *= vig;
      color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
      fragColor = vec4(sanitize(color), 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      color = max(vec3(0.0), color);
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      vec3 denom = max(color * (c * color + d) + e, vec3(0.0001));
      return clamp((color * (a * color + b)) / denom, 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      return whiteHot ? vec3(pow(heat, 0.85)) : ironbow(heat);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
      if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
      if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
      finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
        if (crtIntensity > 0.0001) {
          float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
          finalCol -= scanline;
        }
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : false,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }
      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }
      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }
      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);
        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;
        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);
          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);
          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;
        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.1,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.16,
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.7,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xff9922),
          raysColorHex: params.raysColorHex || '#ff9922',

          // Anamorphic default is OFF as explicitly requested
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0xff8833),
          anamorphicColorHex: params.anamorphicColorHex || '#ff8833',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.008,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.12,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.68,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.008,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.1,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples, depthBuffer: true });

        this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);
        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.raysThreshold } },
          vertexShader: orthoVertexShader, fragmentShader: godRaysDepthMaskShader, glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader, fragmentShader: godRaysGenerateShader, glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.anamorphicThreshold }, smoothWidth: { value: this.settings.anamorphicSmoothWidth } },
          vertexShader: orthoVertexShader, fragmentShader: anamorphicBrightShader, glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader, fragmentShader: anamorphicBlurShader, glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader, fragmentShader: finalFragmentShader, glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader, fragmentShader: colorFragmentShader, glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader, fragmentShader: copyFragmentShader,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
            depthBuffer: true,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Amplification").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());

        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });
        anamorphic.close();

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());
        lens.close();

        return root;
      }
    }

    function createSlateTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 512, 512);

      const imgData = ctx.getImageData(0, 0, 512, 512);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 45;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(14, 14);
      return texture;
    }

    function updateClayCanvas() {
      const cHex = '#' + activeColors.clay.getHexString();
      const wHex = '#' + activeColors.dotWhite.getHexString();
      const gHex = '#' + activeColors.dotGold.getHexString();

      clayCtx.fillStyle = cHex;
      clayCtx.fillRect(0, 0, 1024, 512);

      const imgData = clayCtx.getImageData(0, 0, 1024, 512);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const noise = (Math.random() - 0.5) * 18;
        d[i] = Math.min(255, Math.max(0, d[i] + noise));
        d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + noise * 0.7));
        d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + noise * 0.5));
      }
      clayCtx.putImageData(imgData, 0, 0);

      const dotsCount = 44;
      for (let i = 0; i < dotsCount; i++) {
        const x = (i / dotsCount) * 1024;
        clayCtx.fillStyle = (i % 2 === 0) ? wHex : gHex;
        clayCtx.beginPath();
        clayCtx.arc(x, 210, 4.0, 0, Math.PI * 2);
        clayCtx.fill();

        clayCtx.fillStyle = (i % 2 === 0) ? gHex : wHex;
        clayCtx.beginPath();
        clayCtx.arc(x + (1024 / dotsCount) * 0.5, 235, 2.6, 0, Math.PI * 2);
        clayCtx.fill();

        if (i % 4 === 0) {
          clayCtx.fillStyle = gHex;
          clayCtx.beginPath();
          clayCtx.arc(x, 260, 3.2, 0, Math.PI * 2);
          clayCtx.fill();

          clayCtx.fillStyle = wHex;
          clayCtx.beginPath();
          clayCtx.arc(x - 7, 272, 2.0, 0, Math.PI * 2);
          clayCtx.arc(x + 7, 272, 2.0, 0, Math.PI * 2);
          clayCtx.arc(x, 280, 2.0, 0, Math.PI * 2);
          clayCtx.fill();
        }
      }
      clayTexture.needsUpdate = true;
    }

    // Authentic handcrafted Indian Diya: well-proportioned bowl + pinched spout
    function createDiyaGeometry() {
      const profile = [
        new THREE.Vector2(0.0, 0.0),
        new THREE.Vector2(0.24, 0.0),
        new THREE.Vector2(0.36, 0.04),
        new THREE.Vector2(0.54, 0.14),
        new THREE.Vector2(0.62, 0.24),
        new THREE.Vector2(0.58, 0.30),
        new THREE.Vector2(0.62, 0.34),
        new THREE.Vector2(0.56, 0.34),
        new THREE.Vector2(0.44, 0.22),
        new THREE.Vector2(0.26, 0.10),
        new THREE.Vector2(0.0, 0.08)
      ];
      const lathe = new THREE.LatheGeometry(profile, 64);
      lathe.center();

      lathe.computeBoundingBox();
      const minY = lathe.boundingBox.min.y;
      lathe.translate(0, -minY, 0);

      // Pinch the front spout (+Z axis)
      const pos = lathe.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const angle = Math.atan2(v.x, v.z);
        if (Math.abs(angle) < 0.65 && v.y > 0.1) {
          const pinch = Math.cos(angle * (Math.PI / 1.3));
          if (pinch > 0) {
            v.z += 0.26 * pinch * (v.y / 0.34);
            v.x *= (1.0 - 0.44 * pinch);
            v.y += 0.045 * pinch;
          }
        }
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      lathe.computeVertexNormals();
      return lathe;
    }

        const normY = (v.y + 0.18) / 0.36;
        const widthFactor = Math.sin(normY * Math.PI);
        v.x *= (0.3 + 0.7 * widthFactor);
        v.z += (v.x * v.x) * 4.2;
        v.z += Math.sin(normY * Math.PI) * 0.045;
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geom.computeVertexNormals();
      return geom;
    }

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const y = t * H;
        let r = 0;
        if (t > 0 && t < 1) {
          r = Math.sin(Math.pow(t, 0.45) * Math.PI) * (1.0 - t * 0.65) * 0.16;
        }
        points.push(new THREE.Vector2(Math.max(0, r), y));
      }
      return new THREE.LatheGeometry(points, 32);
    }

    // Natural Organic Flame Shader with Translucent Feathered Edges
    const flameVertexShader = `
      uniform float uTime;
      uniform float uFlickerFreq;
      uniform float uFlickerPhase;
      uniform float uFlickerAmp;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;

      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        vec3 p = position;
        
        float h = clamp(p.y / 0.52, 0.0, 1.0);
        float t = uTime * uFlickerFreq + uFlickerPhase;
        
        float swayX = sin(t * 1.1) * 0.032 + sin(t * 2.7) * 0.016 + sin(t * 5.3) * 0.008;
        float swayZ = cos(t * 1.3) * 0.026 + cos(t * 3.1) * 0.012;
        float jitterY = sin(t * 3.7) * 0.014;
        
        p.x += swayX * pow(h, 1.6) * uFlickerAmp;
        p.z += swayZ * pow(h, 1.6) * uFlickerAmp;
        p.y += jitterY * h * uFlickerAmp;

        vec4 worldPos = modelMatrix * vec4(p, 1.0);
        vWorldPosition = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const flameFragmentShader = `
      uniform vec3 uColorBase;
      uniform vec3 uColorCore;
      uniform vec3 uColorTip;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;

      void main() {
        float h = clamp(vUv.y, 0.0, 1.0);
        
        vec3 col = uColorCore;
        if (h < 0.16) {
          col = mix(uColorBase, uColorCore, h / 0.16);
        } else {
          col = mix(uColorCore, uColorTip, pow((h - 0.16) / 0.84, 0.75));
        }
        
        vec3 viewDir = normalize(cameraPosition - vWorldPosition);
        float normalDot = max(0.0, dot(vNormal, viewDir));
        float fresnel = 1.0 - normalDot;
        fresnel = pow(fresnel, 1.4);
        
        float centerGlow = pow(normalDot, 1.8);
        col += vec3(0.45, 0.4, 0.25) * centerGlow * (1.0 - h * 0.5);
        
        float alpha = clamp((0.3 + 0.7 * centerGlow) * (1.0 - pow(h, 2.5)), 0.0, 1.0);
        
        gl_FragColor = vec4(col, alpha);
      }
    `;

      const rB = diyaRadius * scales[i + 1];

      distances.push(distances[i] + rA + rB + gap);

    // Foreground (start): (X: 2.5, Z: 3.2), Distant (end): (X: -1.8, Z: -5.4)
    const startX = 2.5, startZ = 3.2;
    const endX = -1.8, endZ = -5.4;
    const dirX = (endX - startX);
    const dirZ = (endZ - startZ);
    const lineLen = Math.hypot(dirX, dirZ);
    const normDirX = dirX / lineLen;
    const normDirZ = dirZ / lineLen;
    const perpX = -normDirZ;
    const perpZ = normDirX;

    const diyas = [];
    const beadGeometry = new THREE.SphereGeometry(0.018, 12, 12);

    for (let i = 0; i < NUM_DIYAS; i++) {
      const dProg = distances[i] / totalDist;
      const scale = scales[i];
      const diyaGroup = new THREE.Group();
      diyaGroup.scale.setScalar(scale);

      // Position along diagonal with gentle organic serpentine arch
      const sDist = distances[i];
      const sCurve = Math.sin(dProg * Math.PI) * 0.45;
      const posX = startX + normDirX * sDist + perpX * sCurve;
      const posZ = startZ + normDirZ * sDist + perpZ * sCurve;
      const posY = 0;
      diyaGroup.position.set(posX, posY, posZ);

      // Rotate beak along the procession
      diyaGroup.rotation.y = -0.32 + dProg * 0.55;

      // 1. Clay Bowl
      const clayMesh = new THREE.Mesh(diyaGeometry, clayMaterial);
      diyaGroup.add(clayMesh);

      // 2. Oil Reservoir Reflective Surface
      const oilGeo = new THREE.CylinderGeometry(0.42, 0.32, 0.03, 32);
      const oilMesh = new THREE.Mesh(oilGeo, oilMaterial);
      oilMesh.position.set(0, 0.12, 0);
      diyaGroup.add(oilMesh);

      // 3. Charred Cotton Wick
      const wickGeo = new THREE.CylinderGeometry(0.016, 0.022, 0.18, 12);
      const wickMesh = new THREE.Mesh(wickGeo, wickMaterial);
      wickMesh.position.set(0, 0.17, 0.32);
      wickMesh.rotation.x = 0.52;
      diyaGroup.add(wickMesh);

      // 4. Physical Raised 3D Beads along rim
      const numBeads = 32;
      for (let b = 0; b < numBeads; b++) {
        const angle = (b / numBeads) * Math.PI * 2;
        let bx = Math.sin(angle) * 0.58;
        let bz = Math.cos(angle) * 0.58;
        let by = 0.34;

        if (Math.abs(angle) < 0.65) {
          const pinch = Math.cos(angle * (Math.PI / 1.3));
          bz += 0.24 * pinch;
          bx *= (1.0 - 0.44 * pinch);
          by += 0.045 * pinch;
        }

        const beadMesh = new THREE.Mesh(beadGeometry, (b % 2 === 0) ? beadWhiteMat : beadGoldMat);
        beadMesh.position.set(bx, by, bz);
        diyaGroup.add(beadMesh);
      }

      // 5. Scattered Calendula / Marigold Petals around foot
      const numPetals = 16;
      for (let p = 0; p < numPetals; p++) {
        const pAngle = (p / numPetals) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
        const pDist = 0.64 + Math.random() * 0.32;
        const px = Math.sin(pAngle) * pDist;
        const pz = Math.cos(pAngle) * pDist;

        const petal = new THREE.Mesh(petalGeometry, (p % 2 === 0) ? petalMat1 : petalMat2);
        petal.position.set(px, 0.012 + Math.random() * 0.015, pz);
        petal.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.25;
        petal.rotation.y = Math.random() * Math.PI * 2;
        petal.rotation.z = (Math.random() - 0.5) * 0.3;
        petal.scale.setScalar(0.65 + Math.random() * 0.4);
        diyaGroup.add(petal);
      }

      // 6. Live Flame Shader Mesh
      const flickerFreq = 4.2 + Math.random() * 3.8;
      const flickerPhase = Math.random() * Math.PI * 2;

      const flameMat = new THREE.ShaderMaterial({
        vertexShader: flameVertexShader,
        fragmentShader: flameFragmentShader,
        uniforms: {
          uTime: { value: 0 },
          uFlickerFreq: { value: flickerFreq },
          uFlickerPhase: { value: flickerPhase },
          uFlickerAmp: { value: params.flameFlickerAmp },
          uColorBase: { value: activeColors.flameBase },
          uColorCore: { value: activeColors.flameCore },
          uColorTip: { value: activeColors.flameTip }
        },
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const flameMesh = new THREE.Mesh(flameGeometry, flameMat);
      flameMesh.position.set(0, 0.22, 0.34);
      diyaGroup.add(flameMesh);

      // Inner white-hot flame core
      const flameCoreMat = new THREE.MeshBasicMaterial({
        color: activeColors.flameCore,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const flameCoreMesh = new THREE.Mesh(flameCoreGeometry, flameCoreMat);
      flameCoreMesh.position.set(0, 0.22, 0.34);
      diyaGroup.add(flameCoreMesh);

      // 7. Soft Radial Halo Sprite
      const haloMat = new THREE.SpriteMaterial({
        map: glowTexture,
        color: activeColors.flameGlow,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const haloSprite = new THREE.Sprite(haloMat);
      const baseHaloScale = 1.15;
      haloSprite.scale.set(baseHaloScale, baseHaloScale, 1.0);
      haloSprite.position.set(0, 0.42, 0.34);
      diyaGroup.add(haloSprite);

      // 8. Point Light (Individual light source)
      const light = new THREE.PointLight(
        activeColors.flameGlow,
        params.flameMasterIntensity * scale,
        params.flameLightDistance * Math.sqrt(scale),
        params.flameLightDecay
      );
      light.position.set(posX, posY + 0.36 * scale, posZ + 0.34 * scale);
      scene.add(light);

      scene.add(diyaGroup);

      diyas.push({
        group: diyaGroup,
        scale: scale,
        light: light,
        flameMesh: flameMesh,
        flameMat: flameMat,
        flameCoreMesh: flameCoreMesh,
        flameCoreMat: flameCoreMat,
        haloSprite: haloSprite,
        baseHaloScale: baseHaloScale,
        flickerFreq: flickerFreq,
        flickerPhase: flickerPhase
      });
    }

    // =========================================================================
    // FLOATING WARM DUST MOTES
    // =========================================================================
    const DUST_COUNT = 500;
    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(DUST_COUNT * 3);
    const dustVelocities = new Float32Array(DUST_COUNT * 3);
    const dustPhases = new Float32Array(DUST_COUNT);

    for (let i = 0; i < DUST_COUNT; i++) {
      const progress = Math.random();
      const px = startX * (1.0 - progress) + endX * progress + (Math.random() - 0.5) * 1.8;
      const pz = startZ * (1.0 - progress) + endZ * progress + (Math.random() - 0.5) * 1.8;
      const py = 0.05 + Math.random() * 3.0;

      dustPositions[i * 3] = px;
      dustPositions[i * 3 + 1] = py;
      dustPositions[i * 3 + 2] = pz;

      dustVelocities[i * 3] = (Math.random() - 0.5) * 0.035;
      dustVelocities[i * 3 + 1] = 0.05 + Math.random() * 0.08;
      dustVelocities[i * 3 + 2] = (Math.random() - 0.5) * 0.035;

      dustPhases[i] = Math.random() * Math.PI * 2;
    }

    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));

    function createDustParticleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.35, 'rgba(255, 215, 140, 0.7)');
      grad.addColorStop(0.7, 'rgba(255, 140, 50, 0.2)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    const dustMat = new THREE.PointsMaterial({
      size: 0.055,
      map: createDustParticleTexture(),
      color: activeColors.flameTip,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const dustPoints = new THREE.Points(dustGeo, dustMat);
    scene.add(dustPoints);

    // =========================================================================
    // COLOR APPLICATION & GSAP SMOOTH TRANSITIONS
    // =========================================================================
    function applyColorsToScene() {
      if (params.greenScreen) {
        scene.background.setHex(0x00ff00);
        scene.fog.color.setHex(0x00ff00);
      } else {
        scene.background.copy(activeColors.ground);
        scene.fog.color.copy(activeColors.ground);
      }

      floorMat.color.copy(activeColors.ground);
      beadWhiteMat.color.copy(activeColors.dotWhite);
      beadGoldMat.color.copy(activeColors.dotGold);
      petalMat1.color.copy(activeColors.petal1);
      petalMat2.color.copy(activeColors.petal2);
      dustMat.color.copy(activeColors.flameTip);

      diyas.forEach(d => {
        d.flameMat.uniforms.uColorBase.value.copy(activeColors.flameBase);
        d.flameMat.uniforms.uColorCore.value.copy(activeColors.flameCore);
        d.flameMat.uniforms.uColorTip.value.copy(activeColors.flameTip);
        d.flameCoreMat.color.copy(activeColors.flameCore);
        d.haloSprite.material.color.copy(activeColors.flameGlow);
        d.light.color.copy(activeColors.flameGlow);
      });

      updateClayCanvas();
    }

    function setScheme(schemeName, smooth = true) {
      const target = COLOR_SCHEMES[schemeName];
      if (!target) return;

      if (smooth) {
        const tweenObj = {
          clayR: activeColors.clay.r, clayG: activeColors.clay.g, clayB: activeColors.clay.b,
          dotWhiteR: activeColors.dotWhite.r, dotWhiteG: activeColors.dotWhite.g, dotWhiteB: activeColors.dotWhite.b,
          dotGoldR: activeColors.dotGold.r, dotGoldG: activeColors.dotGold.g, dotGoldB: activeColors.dotGold.b,
          petal1R: activeColors.petal1.r, petal1G: activeColors.petal1.g, petal1B: activeColors.petal1.b,
          petal2R: activeColors.petal2.r, petal2G: activeColors.petal2.g, petal2B: activeColors.petal2.b,
          flameBaseR: activeColors.flameBase.r, flameBaseG: activeColors.flameBase.g, flameBaseB: activeColors.flameBase.b,
          flameCoreR: activeColors.flameCore.r, flameCoreG: activeColors.flameCore.g, flameCoreB: activeColors.flameCore.b,
          flameTipR: activeColors.flameTip.r, flameTipG: activeColors.flameTip.g, flameTipB: activeColors.flameTip.b,
          flameGlowR: activeColors.flameGlow.r, flameGlowG: activeColors.flameGlow.g, flameGlowB: activeColors.flameGlow.b,
          groundR: activeColors.ground.r, groundG: activeColors.ground.g, groundB: activeColors.ground.b
        };

        const targetColors = {
          clay: new THREE.Color(target.clay),
          dotWhite: new THREE.Color(target.dotWhite),
          dotGold: new THREE.Color(target.dotGold),
          petal1: new THREE.Color(target.petal1),
          petal2: new THREE.Color(target.petal2),
          flameBase: new THREE.Color(target.flameBase),
          flameCore: new THREE.Color(target.flameCore),
          flameTip: new THREE.Color(target.flameTip),
          flameGlow: new THREE.Color(target.flameGlow),
          ground: new THREE.Color(target.ground)
        };

        gsap.to(tweenObj, {
          duration: 1.25,
          ease: 'power2.out',
          clayR: targetColors.clay.r, clayG: targetColors.clay.g, clayB: targetColors.clay.b,
          dotWhiteR: targetColors.dotWhite.r, dotWhiteG: targetColors.dotWhite.g, dotWhiteB: targetColors.dotWhite.b,
          dotGoldR: targetColors.dotGold.r, dotGoldG: targetColors.dotGold.g, dotGoldB: targetColors.dotGold.b,
          petal1R: targetColors.petal1.r, petal1G: targetColors.petal1.g, petal1B: targetColors.petal1.b,
          petal2R: targetColors.petal2.r, petal2G: targetColors.petal2.g, petal2B: targetColors.petal2.b,
          flameBaseR: targetColors.flameBase.r, flameBaseG: targetColors.flameBase.g, flameBaseB: targetColors.flameBase.b,
          flameCoreR: targetColors.flameCore.r, flameCoreG: targetColors.flameCore.g, flameCoreB: targetColors.flameCore.b,
          flameTipR: targetColors.flameTip.r, flameTipG: targetColors.flameTip.g, flameTipB: targetColors.flameTip.b,
          flameGlowR: targetColors.flameGlow.r, flameGlowG: targetColors.flameGlow.g, flameGlowB: targetColors.flameGlow.b,
          groundR: targetColors.ground.r, groundG: targetColors.ground.g, groundB: targetColors.ground.b,
          onUpdate: () => {
            activeColors.clay.setRGB(tweenObj.clayR, tweenObj.clayG, tweenObj.clayB);
            activeColors.dotWhite.setRGB(tweenObj.dotWhiteR, tweenObj.dotWhiteG, tweenObj.dotWhiteB);
            activeColors.dotGold.setRGB(tweenObj.dotGoldR, tweenObj.dotGoldG, tweenObj.dotGoldB);
            activeColors.petal1.setRGB(tweenObj.petal1R, tweenObj.petal1G, tweenObj.petal1B);
            activeColors.petal2.setRGB(tweenObj.petal2R, tweenObj.petal2G, tweenObj.petal2B);
            activeColors.flameBase.setRGB(tweenObj.flameBaseR, tweenObj.flameBaseG, tweenObj.flameBaseB);
            activeColors.flameCore.setRGB(tweenObj.flameCoreR, tweenObj.flameCoreG, tweenObj.flameCoreB);
            activeColors.flameTip.setRGB(tweenObj.flameTipR, tweenObj.flameTipG, tweenObj.flameTipB);
            activeColors.flameGlow.setRGB(tweenObj.flameGlowR, tweenObj.flameGlowG, tweenObj.flameGlowB);
            activeColors.ground.setRGB(tweenObj.groundR, tweenObj.groundG, tweenObj.groundB);
            applyColorsToScene();
          }
        });
      } else {
        activeColors.clay.set(target.clay);
        activeColors.dotWhite.set(target.dotWhite);
        activeColors.dotGold.set(target.dotGold);
        activeColors.petal1.set(target.petal1);
        activeColors.petal2.set(target.petal2);
        activeColors.flameBase.set(target.flameBase);
        activeColors.flameCore.set(target.flameCore);
        activeColors.flameTip.set(target.flameTip);
        activeColors.flameGlow.set(target.flameGlow);
        activeColors.ground.set(target.ground);
        applyColorsToScene();
      }
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZATION ON SCENE CLICK
    // NOTE: Does NOT shuffle or modify any PostProcessing settings!
    // =========================================================================
    function randomizeScene() {
      // Pick random new color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const filtered = schemeKeys.filter(k => k !== params.colorScheme);
      const randomScheme = filtered[Math.floor(Math.random() * filtered.length)];
      params.colorScheme = randomScheme;

      // Re-roll flame flicker motion parameters
      params.flameFlickerSpeed = +(0.65 + Math.random() * 0.75).toFixed(2);
      params.flameFlickerAmp = +(0.18 + Math.random() * 0.28).toFixed(2);
      params.flameMasterIntensity = +(2.0 + Math.random() * 0.8).toFixed(2);

      // Re-roll individual diya frequencies & phases
      diyas.forEach(d => {
        d.flickerFreq = 3.8 + Math.random() * 4.2;
        d.flickerPhase = Math.random() * Math.PI * 2;
      });

      // Smooth color transition
      setScheme(randomScheme, true);

      // Update scene GUI controllers (without touching PostProcessor GUI)
      if (gui) {
        gui.controllersRecursive().forEach(c => {
          // Do not touch post-processing folder controllers
          if (!c.parent || !c.parent._title || !c.parent._title.includes('Post-Processing')) {
            c.updateDisplay();
          }
        });
      }
    }

    let pointerStartX = 0;
    let pointerStartY = 0;
    let pointerStartTime = 0;

    function attachPointerEvents(dom) {
      dom.addEventListener('pointerdown', (e) => {
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        pointerStartTime = performance.now();
      });

      dom.addEventListener('pointerup', (e) => {
        if (!params.clickToRandomize) return;
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        const dist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
        const dur = performance.now() - pointerStartTime;
        if (dist < 6 && dur < 350) {
          randomizeScene();
        }
      });
    }

    // =========================================================================
    // CAMERA ANIMATION PRESETS
    // Preserves interactive zoom distance and angle continuously!
    // =========================================================================
    const ANIMATION_MODES = [
      'Slow Cinematic Drift',
      'Gentle Diya Glide',
      'Subtle Breathing Orbit',
      'Focus Shift & Rise',
      'Zen Pan Across Line',
      'Evening Sway',
      'Soft Bokeh Spiral',
      'Static View'
    ];

    const clock = new THREE.Clock();

    function updateCameraAnimation(dt, time) {
      if (params.animationMode === 'Static View') {
        controls.update();
        return;
      }

      const spd = params.animSpeed;

      switch (params.animationMode) {
        case 'Slow Cinematic Drift': {
          const drift = Math.sin(time * 0.28) * 0.07 * dt * spd;
          controls.target.x += drift;
          camera.position.x += drift;
          break;
        }

        case 'Gentle Diya Glide': {
          const glideZ = Math.cos(time * 0.22) * 0.08 * dt * spd;
          const glideX = glideZ * 0.4;
          controls.target.z += glideZ;
          controls.target.x += glideX;
          camera.position.z += glideZ;
          camera.position.x += glideX;
          break;
        }

        case 'Subtle Breathing Orbit': {
          controls.rotateLeft(0.045 * dt * spd);
          const dy = Math.sin(time * 0.35) * 0.015 * dt * spd;
          controls.rotateUp(dy);
          break;
        }

        case 'Focus Shift & Rise': {
          const rise = Math.sin(time * 0.25) * 0.035 * dt * spd;
          controls.rotateUp(rise);
          break;
        }

        case 'Zen Pan Across Line': {
          const pan = Math.sin(time * 0.2) * 0.04 * dt * spd;
          controls.rotateLeft(pan);
          break;
        }

        case 'Evening Sway': {
          const swayAz = Math.sin(time * 0.45) * 0.035 * dt * spd;
          const swayPol = Math.cos(time * 0.3) * 0.018 * dt * spd;
          controls.rotateLeft(swayAz);
          controls.rotateUp(swayPol);
          break;
        }

        case 'Soft Bokeh Spiral': {
          controls.rotateLeft(0.04 * dt * spd);
          const spiralUp = Math.sin(time * 0.5) * 0.02 * dt * spd;
          controls.rotateUp(spiralUp);
          break;
        }
      }

      controls.update();
    }

    // =========================================================================
    // LIL-GUI SETUP
    // =========================================================================
    const gui = new GUI({ title: 'Diya Scene Controls' });

    // 1. Theme & Color
    const fTheme = gui.addFolder('Theme & Color');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Palette').onChange(v => setScheme(v, true));
    fTheme.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => applyColorsToScene());
    fTheme.add(params, 'clickToRandomize').name('Click Scene to Randomize');
    fTheme.add({ randomize: randomizeScene }, 'randomize').name('⚡ Random Variation');

    // 2. Camera & Animation
    const fCamera = gui.addFolder('Camera & Animation');
    fCamera.add(params, 'animationMode', ANIMATION_MODES).name('Animation Preset');
    fCamera.add(params, 'animSpeed', 0.1, 3.0, 0.05).name('Animation Speed');

    // 3. Lighting & Atmosphere
    const fLight = gui.addFolder('Lighting & Atmosphere');
    fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Master Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
      if (postProcessor) postProcessor.settings.exposure = v;
    });
    fLight.add(params, 'flameMasterIntensity', 0.2, 5.0, 0.1).name('Flame Light Master');
    fLight.add(params, 'flameLightDistance', 1.0, 10.0, 0.2).name('Light Distance').onChange(v => {
      diyas.forEach(d => { d.light.distance = v * Math.sqrt(d.scale); });
    });
    fLight.add(params, 'flameLightDecay', 1.0, 3.0, 0.1).name('Light Falloff Decay').onChange(v => {
      diyas.forEach(d => { d.light.decay = v; });
    });
    fLight.add(params, 'flameFlickerSpeed', 0.1, 3.0, 0.05).name('Flicker Speed');
    fLight.add(params, 'flameFlickerAmp', 0.0, 0.8, 0.02).name('Flicker Amplitude');
    fLight.add(params, 'ambientIntensity', 0.0, 0.5, 0.01).name('Ambient Bounce').onChange(v => {
      ambientLight.intensity = v;
    });

    const fIndividualLights = fLight.addFolder('Individual Diya Lights');
    fIndividualLights.close();
    for (let i = 0; i < NUM_DIYAS; i++) {
      const label = (i === 0) ? 'Diya 1 (Foreground Hero)' : (i === NUM_DIYAS - 1) ? `Diya ${i + 1} (Distant)` : `Diya ${i + 1}`;
      fIndividualLights.add(params, `diyaLight_${i}`, 0.0, 3.0, 0.1).name(label);
    }

    // 4. Render Settings
    const fRender = gui.addFolder('Render Settings');
    fRender.add(params, 'pixelRatio', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fRender.add(params, 'antialias').name('Antialiasing (Scene)').onChange(v => {
      initRenderer(v);
    });

    // 5. Post-Processing Suite Integration
    postProcessor.attachGUI(gui, "Post-Processing Suite");

    // Toggle UI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.pixelRatio);
    });

    // =========================================================================
    // MAIN ANIMATION LOOP
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const time = clock.getElapsedTime();

      // 1. Camera Motion
      updateCameraAnimation(dt, time);

      // 2. Diya Live Dynamics
      diyas.forEach((d, idx) => {
        const curFreq = d.flickerFreq * params.flameFlickerSpeed;
        const curAmp = params.flameFlickerAmp;

        const flicker = Math.sin(time * curFreq + d.flickerPhase) * 0.5
                      + Math.sin(time * curFreq * 2.3 + d.flickerPhase * 1.7) * 0.3
                      + Math.sin(time * curFreq * 4.1) * 0.2;

        const individual = params[`diyaLight_${idx}`] !== undefined ? params[`diyaLight_${idx}`] : 1.0;
        d.light.intensity = params.flameMasterIntensity * d.scale * individual * (1.0 + flicker * curAmp);

        d.flameMat.uniforms.uTime.value = time;
        d.flameMat.uniforms.uFlickerFreq.value = curFreq;
        d.flameMat.uniforms.uFlickerAmp.value = curAmp;

        const haloScale = d.baseHaloScale * (1.0 + flicker * 0.12 * curAmp);
        d.haloSprite.scale.set(haloScale, haloScale, 1.0);
        d.haloSprite.material.opacity = 0.5 + flicker * 0.15 * curAmp;
      });

      // 3. Floating Dust
      const posArr = dustGeo.attributes.position.array;
      const spd = params.animSpeed;
      for (let i = 0; i < DUST_COUNT; i++) {
        posArr[i * 3 + 1] += dustVelocities[i * 3 + 1] * dt * spd;
        posArr[i * 3] += Math.sin(time * 0.8 + dustPhases[i]) * 0.003 * spd;
        posArr[i * 3 + 2] += Math.cos(time * 0.9 + dustPhases[i] * 1.2) * 0.003 * spd;

        if (posArr[i * 3 + 1] > 3.6) {
          posArr[i * 3 + 1] = 0.03;
        }
      }
      dustGeo.attributes.position.needsUpdate = true;

      // 4. Render through PostProcessor Pipeline
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
