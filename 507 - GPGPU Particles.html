<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPGPU Particles</title>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-size: 62.5%;
      background: #000;
      overflow: hidden;
      color: #FFF;
      font-family: sans-serif;
      overscroll-behavior: none;
    }

    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
    }

    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }

    #loading.loaded {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
      100% {
        opacity: 0;
        transform: scale(0, 0);
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="circle"></div>
  </div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.121.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.121.1/examples/jsm/controls/OrbitControls.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    /**
     * 19 Preconfigured Color Schemes
     */
    const COLOR_SCHEMES = {
      'Original': {
        type: 0,
        colors: ['#FF3366', '#33FFCC', '#3366FF', '#FFFF33', '#FF00FF']
      },
      'Monochromatic': {
        type: 1,
        colors: ['#0B192C', '#1E3E62', '#0066CC', '#38B6FF', '#BBE1FA']
      },
      'Analogous': {
        type: 1,
        colors: ['#00F5D4', '#00BBF9', '#4361EE', '#7209B7', '#F72585']
      },
      'Complementary': {
        type: 1,
        colors: ['#03045E', '#0077B6', '#FF9E00', '#FF6000', '#FFD166']
      },
      'Split-complementary': {
        type: 1,
        colors: ['#7B2CBF', '#9D4EDD', '#FF9100', '#70E000', '#38B000']
      },
      'Triadic': {
        type: 1,
        colors: ['#FF0054', '#FF5400', '#FFBD00', '#00F5D4', '#00BBF9']
      },
      'Tetradic': {
        type: 1,
        colors: ['#FF0A54', '#FF758F', '#FFB703', '#06D6A0', '#118AB2']
      },
      'Double split-complementary': {
        type: 1,
        colors: ['#F72585', '#7209B7', '#3A0CA3', '#4CC9F0', '#4895EF']
      },
      'Achromatic': {
        type: 1,
        colors: ['#000000', '#333333', '#777777', '#CCCCCC', '#FFFFFF']
      },
      'Achromatic + Accent': {
        type: 1,
        colors: ['#000000', '#222222', '#888888', '#FFFFFF', '#FF0033']
      },
      'Neutral + accent': {
        type: 1,
        colors: ['#18181B', '#3F3F46', '#71717A', '#E4E4E7', '#00F0FF']
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        type: 1,
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        type: 1,
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#0B132B', '#000000']
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        type: 1,
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D']
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        type: 1,
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        type: 1,
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        type: 1,
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        type: 1,
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        type: 1,
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      }
    };

    /** Vertex Shader */
    const vertexShader = `
      attribute vec2 reference;

      uniform float uTime;
      uniform sampler2D texturePosition;
      uniform float uPointSize;

      varying vec3 vPosition;
      varying vec2 vUv;

      void main(){
        vec3 pos = texture2D(texturePosition, reference).xyz;
        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        
        vPosition = pos;
        vUv = reference;
        
        gl_PointSize = uPointSize * (50.0 / - mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    /** Fragment Shader */
    const fragmentShader = `
      uniform float uTime;
      uniform int uSchemeType;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec3 uColor4;
      uniform vec3 uColor5;
      uniform float uColorScale;
      uniform float uBrightness;

      varying vec3 vPosition;

      // Simplex 3D Noise by Ian McEwan, Ashima Arts
      vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

      float snoise(vec3 v){ 
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + 1.0 * C.xxx;
        vec3 x2 = x0 - i2 + 2.0 * C.xxx;
        vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;

        i = mod(i, 289.0); 
        vec4 p = permute(permute(permute( 
                   i.z + vec4(0.0, i1.z, i2.z, 1.0))
                 + i.y + vec4(0.0, i1.y, i2.y, 1.0)) 
                 + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 1.0/7.0;
        vec3 ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      vec3 samplePalette(float t) {
        t = clamp(t, 0.0, 1.0);
        if (t < 0.25) {
          return mix(uColor1, uColor2, t * 4.0);
        } else if (t < 0.5) {
          return mix(uColor2, uColor3, (t - 0.25) * 4.0);
        } else if (t < 0.75) {
          return mix(uColor3, uColor4, (t - 0.5) * 4.0);
        } else {
          return mix(uColor4, uColor5, (t - 0.75) * 4.0);
        }
      }

      void main () {
        float f = length(gl_PointCoord - vec2(0.5, 0.5));
        if (f > 0.45) discard;
        
        vec3 color;
        if (uSchemeType == 0) {
          color.r = abs(snoise(vec3(vPosition.x * uColorScale, vPosition.y * uColorScale, uTime * 0.1)));
          color.g = abs(snoise(vec3(vPosition.x * uColorScale, vPosition.y * uColorScale, uTime * 0.2)));
          color.b = abs(snoise(vec3(vPosition.x * uColorScale, vPosition.y * uColorScale, uTime * 0.3)));
        } else {
          float n1 = abs(snoise(vec3(vPosition.x * uColorScale, vPosition.y * uColorScale, uTime * 0.12)));
          float n2 = abs(snoise(vec3(vPosition.y * uColorScale * 1.5, vPosition.z * uColorScale * 1.5, uTime * 0.2)));
          float t = clamp(n1 * 0.65 + n2 * 0.45, 0.0, 1.0);
          color = samplePalette(t);
        }
        
        color *= uBrightness;
        gl_FragColor = vec4(color, 1.0);
      }
    `;

    /** Fragment Simulation for Position */
    const positionSimulation = `
      uniform float uTime;
      uniform float uSpeed;
      uniform float uDrift;
      uniform float uNoiseScale;
      uniform float uTurbulence;
      uniform float uBoundX;

      // Simplex 4D Noise by Ian McEwan, Ashima Arts
      vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
      float permute(float x){return floor(mod(((x*34.0)+1.0)*x, 289.0));}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
      float taylorInvSqrt(float r){return 1.79284291400159 - 0.85373472095314 * r;}

      vec4 grad4(float j, vec4 ip){
        const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
        vec4 p,s;

        p.xyz = floor(fract(vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
        p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
        s = vec4(lessThan(p, vec4(0.0)));
        p.xyz = p.xyz + (s.xyz * 2.0 - 1.0) * s.www; 

        return p;
      }

      float snoise(vec4 v){
        const vec2 C = vec2(0.138196601125010504, 0.309016994374947451);
        vec4 i = floor(v + dot(v, C.yyyy));
        vec4 x0 = v - i + dot(i, C.xxxx);

        vec4 i0;
        vec3 isX = step(x0.yzw, x0.xxx);
        vec3 isYZ = step(x0.zww, x0.yyz);
        i0.x = isX.x + isX.y + isX.z;
        i0.yzw = 1.0 - isX;

        i0.y += isYZ.x + isYZ.y;
        i0.zw += 1.0 - isYZ.xy;

        i0.z += isYZ.z;
        i0.w += 1.0 - isYZ.z;

        vec4 i3 = clamp(i0, 0.0, 1.0);
        vec4 i2 = clamp(i0 - 1.0, 0.0, 1.0);
        vec4 i1 = clamp(i0 - 2.0, 0.0, 1.0);

        vec4 x1 = x0 - i1 + 1.0 * C.xxxx;
        vec4 x2 = x0 - i2 + 2.0 * C.xxxx;
        vec4 x3 = x0 - i3 + 3.0 * C.xxxx;
        vec4 x4 = x0 - 1.0 + 4.0 * C.xxxx;

        i = mod(i, 289.0); 
        float j0 = permute(permute(permute(permute(i.w) + i.z) + i.y) + i.x);
        vec4 j1 = permute(permute(permute(permute(
                   i.w + vec4(i1.w, i2.w, i3.w, 1.0))
                 + i.z + vec4(i1.z, i2.z, i3.z, 1.0))
                 + i.y + vec4(i1.y, i2.y, i3.y, 1.0))
                 + i.x + vec4(i1.x, i2.x, i3.x, 1.0));

        vec4 ip = vec4(1.0/294.0, 1.0/49.0, 1.0/7.0, 0.0);
        vec4 p0 = grad4(j0, ip);
        vec4 p1 = grad4(j1.x, ip);
        vec4 p2 = grad4(j1.y, ip);
        vec4 p3 = grad4(j1.z, ip);
        vec4 p4 = grad4(j1.w, ip);

        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;
        p4 *= taylorInvSqrt(dot(p4,p4));

        vec3 m0 = max(0.6 - vec3(dot(x0,x0), dot(x1,x1), dot(x2,x2)), 0.0);
        vec2 m1 = max(0.6 - vec2(dot(x3,x3), dot(x4,x4)), 0.0);
        m0 = m0 * m0;
        m1 = m1 * m1;
        return 49.0 * (dot(m0 * m0, vec3(dot(p0, x0), dot(p1, x1), dot(p2, x2)))
                     + dot(m1 * m1, vec2(dot(p3, x3), dot(p4, x4))));
      }

      void main () {
        vec2 uv = gl_FragCoord.xy / resolution.xy;
        vec4 tmpPos = texture2D(texturePosition, uv);
        vec4 tmpVel = texture2D(textureVelocity, uv);
        vec3 pos = tmpPos.xyz;
        vec3 vel = tmpVel.xyz;
        
        float noisy = snoise(vec4(pos.x * uNoiseScale, pos.y * uNoiseScale, pos.z * uNoiseScale, uTime));
        
        pos.x += (noisy * uTurbulence + vel.x * 0.1) * uSpeed;
        pos.y += (noisy * uTurbulence + vel.y * 0.1) * uSpeed;
        pos.z += (noisy * uTurbulence + vel.z * 0.1) * uSpeed;
        pos.x += uDrift * uSpeed;
        
        if (pos.x > uBoundX) pos.x = -uBoundX;
        
        gl_FragColor = vec4(pos, 1.0);
      }
    `;

    /** Velocity Simulation */
    const velocitySimulation = `
      void main() {
        vec2 uv = gl_FragCoord.xy / resolution.xy;
        vec4 tmpVel = texture2D(textureVelocity, uv);
        vec3 vel = tmpVel.xyz;

        gl_FragColor = vec4(vel.xyz, 1.0);
      }
    `;

    /**
     * GPUComputationRenderer
     */
    class GPUComputationRenderer {
      constructor(sizeX, sizeY, renderer) {
        this.variables = [];
        this.currentTextureIndex = 0;
        let dataType = THREE.FloatType;
        const scene = new THREE.Scene();
        const camera = new THREE.Camera();
        camera.position.z = 1;
        const passThruUniforms = {
          passThruTexture: { value: null }
        };
        const passThruShader = createShaderMaterial(getPassThroughFragmentShader(), passThruUniforms);
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), passThruShader);
        scene.add(mesh);

        this.setDataType = function (type) {
          dataType = type;
          return this;
        };

        this.addVariable = function (variableName, computeFragmentShader, initialValueTexture) {
          const material = this.createShaderMaterial(computeFragmentShader);
          const variable = {
            name: variableName,
            initialValueTexture: initialValueTexture,
            material: material,
            dependencies: null,
            renderTargets: [],
            wrapS: null,
            wrapT: null,
            minFilter: THREE.NearestFilter,
            magFilter: THREE.NearestFilter
          };
          this.variables.push(variable);
          return variable;
        };

        this.setVariableDependencies = function (variable, dependencies) {
          variable.dependencies = dependencies;
        };

        this.init = function () {
          if (renderer.capabilities.isWebGL2 === false && renderer.extensions.has('OES_texture_float') === false) {
            return 'No OES_texture_float support for float textures.';
          }
          if (renderer.capabilities.maxVertexTextures === 0) {
            return 'No support for vertex shader textures.';
          }

          for (let i = 0; i < this.variables.length; i++) {
            const variable = this.variables[i];
            variable.renderTargets[0] = this.createRenderTarget(sizeX, sizeY, variable.wrapS, variable.wrapT, variable.minFilter, variable.magFilter);
            variable.renderTargets[1] = this.createRenderTarget(sizeX, sizeY, variable.wrapS, variable.wrapT, variable.minFilter, variable.magFilter);
            this.renderTexture(variable.initialValueTexture, variable.renderTargets[0]);
            this.renderTexture(variable.initialValueTexture, variable.renderTargets[1]);

            const material = variable.material;
            const uniforms = material.uniforms;

            if (variable.dependencies !== null) {
              for (let d = 0; d < variable.dependencies.length; d++) {
                const depVar = variable.dependencies[d];
                if (depVar.name !== variable.name) {
                  let found = false;
                  for (let j = 0; j < this.variables.length; j++) {
                    if (depVar.name === this.variables[j].name) {
                      found = true;
                      break;
                    }
                  }
                  if (!found) {
                    return 'Variable dependency not found. Variable=' + variable.name + ', dependency=' + depVar.name;
                  }
                }
                uniforms[depVar.name] = { value: null };
                material.fragmentShader = '\nuniform sampler2D ' + depVar.name + ';\n' + material.fragmentShader;
              }
            }
          }
          this.currentTextureIndex = 0;
          return null;
        };

        this.compute = function () {
          const currentTextureIndex = this.currentTextureIndex;
          const nextTextureIndex = this.currentTextureIndex === 0 ? 1 : 0;

          for (let i = 0, il = this.variables.length; i < il; i++) {
            const variable = this.variables[i];
            if (variable.dependencies !== null) {
              const uniforms = variable.material.uniforms;
              for (let d = 0, dl = variable.dependencies.length; d < dl; d++) {
                const depVar = variable.dependencies[d];
                uniforms[depVar.name].value = depVar.renderTargets[currentTextureIndex].texture;
              }
            }
            this.doRenderTarget(variable.material, variable.renderTargets[nextTextureIndex]);
          }
          this.currentTextureIndex = nextTextureIndex;
        };

        this.getCurrentRenderTarget = function (variable) {
          return variable.renderTargets[this.currentTextureIndex];
        };

        this.getAlternateRenderTarget = function (variable) {
          return variable.renderTargets[this.currentTextureIndex === 0 ? 1 : 0];
        };

        function addResolutionDefine(materialShader) {
          materialShader.defines.resolution = 'vec2( ' + sizeX.toFixed(1) + ', ' + sizeY.toFixed(1) + ' )';
        }
        this.addResolutionDefine = addResolutionDefine;

        function createShaderMaterial(computeFragmentShader, uniforms) {
          uniforms = uniforms || {};
          const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: getPassThroughVertexShader(),
            fragmentShader: computeFragmentShader
          });
          addResolutionDefine(material);
          return material;
        }
        this.createShaderMaterial = createShaderMaterial;

        this.createRenderTarget = function (sizeXTexture, sizeYTexture, wrapS, wrapT, minFilter, magFilter) {
          sizeXTexture = sizeXTexture || sizeX;
          sizeYTexture = sizeYTexture || sizeY;
          wrapS = wrapS || THREE.ClampToEdgeWrapping;
          wrapT = wrapT || THREE.ClampToEdgeWrapping;
          minFilter = minFilter || THREE.NearestFilter;
          magFilter = magFilter || THREE.NearestFilter;
          return new THREE.WebGLRenderTarget(sizeXTexture, sizeYTexture, {
            wrapS: wrapS,
            wrapT: wrapT,
            minFilter: minFilter,
            magFilter: magFilter,
            format: THREE.RGBAFormat,
            type: dataType,
            depthBuffer: false
          });
        };

        this.createTexture = function () {
          const data = new Float32Array(sizeX * sizeY * 4);
          return new THREE.DataTexture(data, sizeX, sizeY, THREE.RGBAFormat, THREE.FloatType);
        };

        this.renderTexture = function (input, output) {
          passThruUniforms.passThruTexture.value = input;
          this.doRenderTarget(passThruShader, output);
          passThruUniforms.passThruTexture.value = null;
        };

        this.doRenderTarget = function (material, output) {
          const currentRenderTarget = renderer.getRenderTarget();
          mesh.material = material;
          renderer.setRenderTarget(output);
          renderer.render(scene, camera);
          mesh.material = passThruShader;
          renderer.setRenderTarget(currentRenderTarget);
        };

        function getPassThroughVertexShader() {
          return 'void main()	{\n\tgl_Position = vec4( position, 1.0 );\n}\n';
        }

        function getPassThroughFragmentShader() {
          return 'uniform sampler2D passThruTexture;\nvoid main() {\n\tvec2 uv = gl_FragCoord.xy / resolution.xy;\n\tgl_FragColor = texture2D( passThruTexture, uv );\n}\n';
        }
      }
    }

    /**
     * Shape Class
     */
    class Shape {
      constructor(sketch) {
        this.sketch = sketch;
        this.init();
      }

      init() {
        this.num = this.sketch.width < 500 ? 200 : 400;
        this.initGPGPU();

        this.geometry = new THREE.BufferGeometry();
        this.material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            texturePosition: { value: null },
            textureVelocity: { value: null },
            uPointSize: { value: this.sketch.params.pointSize },
            uSchemeType: { value: this.sketch.params.colorScheme === 'Original' ? 0 : 1 },
            uColor1: { value: new THREE.Color(this.sketch.params.color1) },
            uColor2: { value: new THREE.Color(this.sketch.params.color2) },
            uColor3: { value: new THREE.Color(this.sketch.params.color3) },
            uColor4: { value: new THREE.Color(this.sketch.params.color4) },
            uColor5: { value: new THREE.Color(this.sketch.params.color5) },
            uColorScale: { value: this.sketch.params.colorScale },
            uBrightness: { value: this.sketch.params.brightness }
          },
          blending: this.sketch.params.blending === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending,
          transparent: true,
          depthWrite: false,
          vertexShader: vertexShader,
          fragmentShader: fragmentShader
        });

        const positions = new Float32Array(this.num * this.num * 3);
        const reference = new Float32Array(this.num * this.num * 2);

        for (let i = 0; i < this.num * this.num; i++) {
          positions.set([0, 0, 0], i * 3);
        }

        for (let j = 0; j < this.num; j++) {
          for (let i = 0; i < this.num; i++) {
            const index = j * this.num + i;
            reference.set([(i + 0.5) / this.num, (j + 0.5) / this.num], index * 2);
          }
        }

        this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        this.geometry.setAttribute('reference', new THREE.BufferAttribute(reference, 2));

        this.mesh = new THREE.Points(this.geometry, this.material);
        this.sketch.scene.add(this.mesh);
      }

      initGPGPU() {
        this.gpuCompute = new GPUComputationRenderer(this.num, this.num, this.sketch.renderer);

        this.dataTexturePosition = this.gpuCompute.createTexture();
        this.dataTextureVelocity = this.gpuCompute.createTexture();

        this.setPositions(this.dataTexturePosition);
        this.setVelocities(this.dataTextureVelocity);

        this.dataTexturePosition.needsUpdate = true;
        this.dataTextureVelocity.needsUpdate = true;

        this.positionVariable = this.gpuCompute.addVariable('texturePosition', positionSimulation, this.dataTexturePosition);
        this.velocityVariable = this.gpuCompute.addVariable('textureVelocity', velocitySimulation, this.dataTextureVelocity);

        this.gpuCompute.setVariableDependencies(this.velocityVariable, [this.positionVariable, this.velocityVariable]);
        this.gpuCompute.setVariableDependencies(this.positionVariable, [this.positionVariable, this.velocityVariable]);

        this.boundX = Math.max(this.sketch.width, 800) / 2;
        this.positionVariable.material.uniforms['uTime'] = { value: 0 };
        this.positionVariable.material.uniforms['uSpeed'] = { value: this.sketch.params.simSpeed };
        this.positionVariable.material.uniforms['uDrift'] = { value: this.sketch.params.driftSpeed };
        this.positionVariable.material.uniforms['uNoiseScale'] = { value: this.sketch.params.noiseScale };
        this.positionVariable.material.uniforms['uTurbulence'] = { value: this.sketch.params.turbulence };
        this.positionVariable.material.uniforms['uBoundX'] = { value: this.boundX };

        const error = this.gpuCompute.init();
        if (error !== null) {
          console.error(error);
        }
      }

      setVelocities(texture) {
        const arr = texture.image.data;
        for (let i = 0; i < arr.length; i += 4) {
          arr[i + 0] = Math.random() * 2 - 1;
          arr[i + 1] = Math.random() * 2 - 1;
          arr[i + 2] = Math.random() * 2 - 1;
          arr[i + 3] = 1;
        }
      }

      setPositions(texture) {
        const arr = texture.image.data;
        const boundX = Math.max(this.sketch.width, 800) / 2;
        const boundY = Math.max(this.sketch.height, 600) / 2;
        for (let i = 0; i < arr.length; i += 4) {
          arr[i + 0] = (Math.random() * 2 - 1) * boundX;
          arr[i + 1] = (Math.random() * 2 - 1) * boundY;
          arr[i + 2] = Math.random() * 500 - 250;
          arr[i + 3] = 1;
        }
      }

      update(time) {
        this.positionVariable.material.uniforms.uTime.value = time * this.sketch.params.timeSpeed;
        this.positionVariable.material.uniforms.uSpeed.value = this.sketch.params.simSpeed;
        this.positionVariable.material.uniforms.uDrift.value = this.sketch.params.driftSpeed;
        this.positionVariable.material.uniforms.uNoiseScale.value = this.sketch.params.noiseScale;
        this.positionVariable.material.uniforms.uTurbulence.value = this.sketch.params.turbulence;
        this.positionVariable.material.uniforms.uBoundX.value = Math.max(this.sketch.width, 800) / 2;

        this.gpuCompute.compute();

        this.material.uniforms.texturePosition.value = this.gpuCompute.getCurrentRenderTarget(this.positionVariable).texture;
        this.material.uniforms.textureVelocity.value = this.gpuCompute.getCurrentRenderTarget(this.velocityVariable).texture;
        this.material.uniforms.uTime.value = time * this.sketch.params.timeSpeed;
      }
    }

    /**
     * Sketch Class
     */
    class Sketch {
      constructor() {
        this.renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });
        document.getElementById('container').appendChild(this.renderer.domElement);

        this.initParams();
        this.init();
      }

      initParams() {
        const initialScheme = COLOR_SCHEMES['Original'];
        this.params = {
          // Greenscreen & Background
          greenScreen: false,
          bgColor: '#000000',

          // Color Scheme & Palettes
          colorScheme: 'Original',
          color1: initialScheme.colors[0],
          color2: initialScheme.colors[1],
          color3: initialScheme.colors[2],
          color4: initialScheme.colors[3],
          color5: initialScheme.colors[4],
          colorScale: 0.001,
          brightness: 1.0,

          // Geometry & Motion
          pointSize: 50.0,
          simSpeed: 1.0,
          timeSpeed: 1.0,
          driftSpeed: 1.0,
          turbulence: 1.0,
          noiseScale: 0.01,

          // Interaction & Render
          clickToRandomize: true,
          dragMode: 'Pan (Move)',
          blending: 'Additive'
        };
      }

      init() {
        this.time = new THREE.Clock(true);

        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.scene = new THREE.Scene();

        this.setupCanvas();
        this.setupCamera();
        this.setupShape();
        this.setupGui();
        this.setupEvents();

        this.updateBackground();

        this.render();
      }

      setupCanvas() {
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        this.renderer.setClearColor(0x000000, 1.0);

        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';
      }

      setupCamera() {
        const fov = 70;
        this.camera = new THREE.PerspectiveCamera(
          fov,
          this.width / this.height,
          0.01,
          3000
        );
        this.camera.position.set(-200, 200, -100);
        this.camera.lookAt(new THREE.Vector3(0, 0, 0));
        this.scene.add(this.camera);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.screenSpacePanning = true;
        this.controls.enableZoom = true;
        this.controls.zoomSpeed = 1.0;
        this.controls.enablePan = true;
        this.controls.panSpeed = 1.0;
        this.controls.enableRotate = true;
        this.controls.rotateSpeed = 0.8;

        this.setDragMode(this.params.dragMode);
      }

      setDragMode(mode) {
        this.params.dragMode = mode;
        if (mode === 'Pan (Move)') {
          this.controls.mouseButtons = {
            LEFT: THREE.MOUSE.PAN,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
          };
        } else {
          this.controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.PAN
          };
        }
      }

      setupShape() {
        this.shapes = [];
        const s = new Shape(this);
        this.shapes.push(s);
      }

      setupGui() {
        this.gui = new GUI({ title: 'Controls' });

        // Background Folder
        const fBg = this.gui.addFolder('Background');
        this.greenScreenCtrl = fBg.add(this.params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => {
          this.updateBackground();
        });
        this.bgColorCtrl = fBg.addColor(this.params, 'bgColor').name('Background Color').onChange(() => {
          if (this.params.greenScreen) {
            this.params.greenScreen = false;
            this.greenScreenCtrl.updateDisplay();
          }
          this.updateBackground();
        });

        // Color Theme Folder
        const fColors = this.gui.addFolder('Color Theme');
        fColors.add(this.params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Scheme').onChange((name) => {
          this.applyScheme(name);
        });
        fColors.addColor(this.params, 'color1').name('Color 1').onChange(() => this.updateColors());
        fColors.addColor(this.params, 'color2').name('Color 2').onChange(() => this.updateColors());
        fColors.addColor(this.params, 'color3').name('Color 3').onChange(() => this.updateColors());
        fColors.addColor(this.params, 'color4').name('Color 4').onChange(() => this.updateColors());
        fColors.addColor(this.params, 'color5').name('Color 5').onChange(() => this.updateColors());
        fColors.add(this.params, 'brightness', 0.2, 3.0, 0.05).name('Brightness').onChange(() => this.updateColors());
        fColors.add(this.params, 'colorScale', 0.0002, 0.005, 0.0001).name('Color Scale').onChange(() => this.updateColors());

        // Geometry & Motion Folder
        const fMotion = this.gui.addFolder('Geometry & Motion');
        fMotion.add(this.params, 'pointSize', 10, 100, 1).name('Point Size').onChange(() => this.updateColors());
        fMotion.add(this.params, 'simSpeed', 0.1, 3.0, 0.05).name('Sim Speed');
        fMotion.add(this.params, 'timeSpeed', 0.0, 3.0, 0.05).name('Time Flow');
        fMotion.add(this.params, 'driftSpeed', 0.0, 3.0, 0.05).name('Drift Speed');
        fMotion.add(this.params, 'turbulence', 0.1, 3.0, 0.05).name('Turbulence');
        fMotion.add(this.params, 'noiseScale', 0.002, 0.03, 0.001).name('Noise Scale');

        // Interaction & Scene
        const fInteract = this.gui.addFolder('Interaction');
        fInteract.add(this.params, 'clickToRandomize').name('Click to Randomize');
        fInteract.add({ randomize: () => this.randomizeScene() }, 'randomize').name('Randomize Now');
        fInteract.add(this.params, 'dragMode', ['Pan (Move)', 'Rotate (Orbit)']).name('Drag Action').onChange((mode) => {
          this.setDragMode(mode);
        });
        fInteract.add(this.params, 'blending', ['Additive', 'Normal']).name('Blending').onChange((val) => {
          this.updateBlending(val);
        });
        fInteract.add({ resetView: () => this.resetCamera() }, 'resetView').name('Reset Camera');
      }

      applyScheme(schemeName) {
        const scheme = COLOR_SCHEMES[schemeName];
        if (!scheme) return;
        this.params.colorScheme = schemeName;
        this.params.color1 = scheme.colors[0];
        this.params.color2 = scheme.colors[1];
        this.params.color3 = scheme.colors[2];
        this.params.color4 = scheme.colors[3];
        this.params.color5 = scheme.colors[4];
        this.updateColors();
        this.updateGuiDisplays();
      }

      updateColors() {
        const isOriginal = this.params.colorScheme === 'Original';
        for (let s of this.shapes) {
          if (s.material) {
            s.material.uniforms.uSchemeType.value = isOriginal ? 0 : 1;
            s.material.uniforms.uColor1.value.set(this.params.color1);
            s.material.uniforms.uColor2.value.set(this.params.color2);
            s.material.uniforms.uColor3.value.set(this.params.color3);
            s.material.uniforms.uColor4.value.set(this.params.color4);
            s.material.uniforms.uColor5.value.set(this.params.color5);
            s.material.uniforms.uColorScale.value = this.params.colorScale;
            s.material.uniforms.uBrightness.value = this.params.brightness;
            s.material.uniforms.uPointSize.value = this.params.pointSize;
          }
        }
      }

      updateBlending(mode) {
        this.params.blending = mode;
        const b = mode === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending;
        for (let s of this.shapes) {
          if (s.material) {
            s.material.blending = b;
            s.material.needsUpdate = true;
          }
        }
      }

      updateBackground() {
        const color = this.params.greenScreen ? '#00ff00' : this.params.bgColor;
        const threeColor = new THREE.Color(color);
        this.renderer.setClearColor(threeColor, 1.0);
        document.body.style.backgroundColor = color;
        const container = document.getElementById('container');
        if (container) container.style.backgroundColor = color;
      }

      resetCamera() {
        this.camera.position.set(-200, 200, -100);
        this.camera.lookAt(new THREE.Vector3(0, 0, 0));
        this.controls.target.set(0, 0, 0);
        this.controls.update();
      }

      randomizeScene() {
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const randomSchemeName = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        const scheme = COLOR_SCHEMES[randomSchemeName];

        this.params.colorScheme = randomSchemeName;
        this.params.color1 = scheme.colors[0];
        this.params.color2 = scheme.colors[1];
        this.params.color3 = scheme.colors[2];
        this.params.color4 = scheme.colors[3];
        this.params.color5 = scheme.colors[4];

        // Re-roll geometric parameters
        this.params.pointSize = parseFloat((20 + Math.random() * 55).toFixed(1));
        this.params.colorScale = parseFloat((0.0004 + Math.random() * 0.0026).toFixed(4));
        this.params.noiseScale = parseFloat((0.004 + Math.random() * 0.02).toFixed(4));

        // Re-roll motion parameters
        this.params.simSpeed = parseFloat((0.4 + Math.random() * 1.8).toFixed(2));
        this.params.driftSpeed = parseFloat((0.3 + Math.random() * 2.2).toFixed(2));
        this.params.turbulence = parseFloat((0.5 + Math.random() * 1.8).toFixed(2));
        this.params.timeSpeed = parseFloat((0.4 + Math.random() * 1.6).toFixed(2));
        this.params.brightness = parseFloat((0.8 + Math.random() * 0.8).toFixed(2));

        // Subtle dark background variation if greenscreen is off
        if (!this.params.greenScreen && Math.random() < 0.25) {
          const darkBgs = ['#000000', '#050508', '#08050a', '#030806', '#0a0505'];
          this.params.bgColor = darkBgs[Math.floor(Math.random() * darkBgs.length)];
          this.updateBackground();
        }

        this.updateColors();
        this.updateGuiDisplays();
      }

      updateGuiDisplays() {
        if (!this.gui) return;
        const updateRec = (g) => {
          if (g.controllers) {
            g.controllers.forEach(c => c.updateDisplay());
          }
          if (g.folders) {
            g.folders.forEach(f => updateRec(f));
          }
        };
        if (typeof this.gui.controllersRecursive === 'function') {
          this.gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else {
          updateRec(this.gui);
        }
      }

      setupEvents() {
        window.addEventListener('resize', this.onResize.bind(this), false);

        // Hide/Show GUI with 'H' key
        window.addEventListener('keydown', (e) => {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
            return;
          }
          if (e.key === 'h' || e.key === 'H') {
            if (this.gui) {
              if (this.gui.domElement.style.display === 'none') {
                this.gui.show();
              } else {
                this.gui.hide();
              }
            }
          }
        });

        // Scene Click Randomization (distinguish single click from drag)
        let downPos = { x: 0, y: 0, time: 0 };
        this.renderer.domElement.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          downPos.x = e.clientX;
          downPos.y = e.clientY;
          downPos.time = performance.now();
        });

        this.renderer.domElement.addEventListener('pointerup', (e) => {
          if (e.button !== 0) return;
          const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
          const elapsed = performance.now() - downPos.time;

          if (dist < 6 && elapsed < 350) {
            if (this.params.clickToRandomize) {
              this.randomizeScene();
            }
          }
        });
      }

      onResize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.width, this.height);
      }

      render() {
        const time = this.time.getElapsedTime();

        if (this.controls) {
          this.controls.update();
        }

        for (let i = 0; i < this.shapes.length; i++) {
          this.shapes[i].update(time);
        }

        this.renderer.render(this.scene, this.camera);
        this.animationId = requestAnimationFrame(this.render.bind(this));
      }
    }

    // Initialize application
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('loaded');
      }
      new Sketch();
    });
  </script>
