<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Sphere Illusions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }

    canvas.is-dragging {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>

  <script type="module">
    import GUI from 'lil-gui';

    // ============================================================
    // 5 Preconfigured Color Schemes
    // ============================================================
    const colorSchemes = {
      'Original Sunset Gold': {
        background: '#ffffff',
        centerColor: '#ffe600',
        outerColor: '#4b0082',
        highlightColor: '#ffffff',
        shadowColor: 'rgba(0, 0, 0, 0.28)'
      },
      'Black and White': {
        background: '#ffffff',
        centerColor: '#111111',
        outerColor: '#606470',
        highlightColor: '#ffffff',
        shadowColor: 'rgba(0, 0, 0, 0.22)'
      },
      'White and Black': {
        background: '#09090b',
        centerColor: '#ffffff',
        outerColor: '#40434d',
        highlightColor: '#ffffff',
        shadowColor: 'rgba(0, 0, 0, 0.75)'
      },
      'Cyberpunk Neon': {
        background: '#0a0518',
        centerColor: '#00f0ff',
        outerColor: '#ff007f',
        highlightColor: '#ffffff',
        shadowColor: 'rgba(0, 0, 0, 0.65)'
      },
      'Emerald Aurora': {
        background: '#03140d',
        centerColor: '#00ffa3',
        outerColor: '#105652',
        highlightColor: '#e0fff4',
        shadowColor: 'rgba(0, 0, 0, 0.70)'
      }
    };

    // ============================================================
    // Main Parameters State
    // ============================================================
    const params = {
      // Color & Theme
      scheme: 'Original Sunset Gold',
      greenScreen: false,
      background: '#ffffff',
      centerColor: '#ffe600',
      outerColor: '#4b0082',
      highlightColor: '#ffffff',
      shadowColor: 'rgba(0, 0, 0, 0.28)',

      // Geometry
      particles: 600,
      radius: 50, // vmin percentage
      particleSize: 20, // vmin percentage
      initialScale: 0.1,
      enableShadows: true,
      depthShading: 0.45,

      // Animation
      animationPreset: 'Breathing Bloom (Original)',
      speed: 1.0,

      // View & Interaction
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      zoom: 1.0,
      panX: 0,
      panY: 0,
      dragMode: 'Pan & Tilt',
      randomizeOnClick: true,

      // Utility actions
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        rotationX = 0;
        rotationY = 0;
        targetRotationX = 0;
        targetRotationY = 0;
        updateGuiDisplays(gui);
      },
      randomize: () => {
        randomizeScene();
      }
    };

    // ============================================================
    // Color Conversion & Interpolation Utilities
    // ============================================================
    function hexToRgba(hex, alpha = 1) {
      hex = hex.replace('#', '');
      if (hex.length === 3) {
        hex = hex.split('').map(c => c + c).join('');
      }
      const num = parseInt(hex, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255,
        a: alpha
      };
    }

    function parseColor(str) {
      if (str.startsWith('#')) return hexToRgba(str);
      if (str.startsWith('rgba')) {
        const parts = str.match(/[\d.]+/g);
        return {
          r: parseFloat(parts[0]),
          g: parseFloat(parts[1]),
          b: parseFloat(parts[2]),
          a: parts[3] !== undefined ? parseFloat(parts[3]) : 1
        };
      }
      if (str.startsWith('rgb')) {
        const parts = str.match(/[\d.]+/g);
        return {
          r: parseFloat(parts[0]),
          g: parseFloat(parts[1]),
          b: parseFloat(parts[2]),
          a: 1
        };
      }
      return { r: 255, g: 255, b: 255, a: 1 };
    }

    function lerpColor(c1, c2, t) {
      const col1 = parseColor(c1);
      const col2 = parseColor(c2);
      const r = Math.round(col1.r + (col2.r - col1.r) * t);
      const g = Math.round(col1.g + (col2.g - col1.g) * t);
      const b = Math.round(col1.b + (col2.b - col1.b) * t);
      const a = col1.a + (col2.a - col1.a) * t;
      return `rgba(${r}, ${g}, ${b}, ${a.toFixed(3)})`;
    }

    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (0 <= h && h < 60) { r = c; g = x; b = 0; }
      else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
      else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
      else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
      else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
      else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
      const toHex = n => {
        const hx = Math.round((n + m) * 255).toString(16);
        return hx.length === 1 ? '0' + hx : hx;
      };
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    // ============================================================
    // Canvas and Context Initialization
    // ============================================================
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });

    let width = window.innerWidth;
    let height = window.innerHeight;
    let vmin = Math.min(width, height);

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      vmin = Math.min(width, height);

      const dpr = params.dpr;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ============================================================
    // Particle System Model
    // ============================================================
    let particlesList = [];

    // Uniform distribution on a disc (identical to the Sass calcCoords function)
    function generateParticleList(count) {
      const list = [];
      for (let i = 0; i < count; i++) {
        const theta = 2 * Math.PI * Math.random();
        // Sum of two uniform randoms generates a triangular distribution for uniform disc area
        const u = Math.random() + Math.random();
        const r = u > 1 ? 2 - u : u;

        const x = r * Math.cos(theta);
        const y = r * Math.sin(theta);
        const c = Math.sqrt(x * x + y * y); // hypotenuse: distance 0..1 from center
        const d = Math.sin(c * Math.PI / 2); // non-linear curved falloff 0..1

        // Deterministic & organic phase variables
        const delay = -2.1 * Math.random(); // Matches $animation_delay * random
        const phase = Math.random() * Math.PI * 2;
        const zOffset = Math.sin(theta * 3 + c * Math.PI) * 0.15;

        list.push({
          x,
          y,
          c,
          d,
          delay,
          phase,
          zOffset
        });
      }
      return list;
    }

    function rebuildParticles() {
      particlesList = generateParticleList(params.particles);
    }
    rebuildParticles();

    // ============================================================
    // 3D Math & Render Helpers
    // ============================================================
    let rotationX = 0;
    let rotationY = 0;
    let targetRotationX = 0;
    let targetRotationY = 0;

    function getEffectiveBg() {
      return params.greenScreen ? '#00ff00' : params.background;
    }

    // ============================================================
    // Animation Calculations
    // ============================================================
    const animationPresets = [
      'Breathing Bloom (Original)',
      'Celestial Orbit',
      'Harmonic Wave',
      'Spiral Vortex',
      'Static (No Movement)'
    ];

    let elapsedTime = 0;
    let lastTimestamp = performance.now();

    function computeParticleState(p, timeSec, radiusPx) {
      const preset = params.animationPreset;
      const d = p.d;
      const c = p.c;
      const x = p.x;
      const y = p.y;
      const initScale = params.initialScale;

      let px = x * radiusPx;
      let py = y * radiusPx;
      let pz = p.zOffset * radiusPx;
      let scale = 1 - d;
      let colorFactor = d; // 0 = center color, 1 = outer color

      if (preset === 'Breathing Bloom (Original)') {
        // Faithful reproduction of CSS @keyframes doit with alternate easing & delays
        const duration = 1.5; // 1500ms
        const progress = ((timeSec / duration) + p.delay + 1000) % 2;
        // Alternate bounce: 0 -> 1 -> 0
        const pingPong = progress > 1 ? 2 - progress : progress;
        // Ease-in-out curve
        const ease = pingPong < 0.5
          ? 2 * pingPong * pingPong
          : -1 + (4 - 2 * pingPong) * pingPong;

        // Animate from original position to center (0,0) and scale down
        px = (x * radiusPx) * (1 - ease * 0.96);
        py = (y * radiusPx) * (1 - ease * 0.96);
        pz = (p.zOffset * radiusPx) + Math.sin(timeSec * 2 + p.phase) * (radiusPx * 0.12 * ease);
        scale = (1 - d) * (1 - ease * (1 - initScale)) + initScale * ease * (1 - d * 0.5);
        colorFactor = Math.min(1, Math.max(0, d + Math.sin(timeSec * 1.5 + p.phase) * 0.15));

      } else if (preset === 'Celestial Orbit') {
        // Slow majestic 3D revolving disc with floating waves
        const orbitAngle = timeSec * 0.35;
        const tilt = 0.42 + 0.12 * Math.sin(timeSec * 0.25);
        
        // 3D rotation of disc
        const cosO = Math.cos(orbitAngle);
        const sinO = Math.sin(orbitAngle);
        const cosT = Math.cos(tilt);
        const sinT = Math.sin(tilt);

        const x0 = x * radiusPx;
        const y0 = y * radiusPx;
        const z0 = p.zOffset * radiusPx + Math.sin(timeSec * 0.8 + c * Math.PI * 2) * (radiusPx * 0.08);

        // Rotate Y then X
        const x1 = x0 * cosO + z0 * sinO;
        const z1 = -x0 * sinO + z0 * cosO;
        const y1 = y0 * cosT - z1 * sinT;
        const z2 = y0 * sinT + z1 * cosT;

        px = x1;
        py = y1;
        pz = z2;

        const depthFactor = (pz + radiusPx * 1.5) / (radiusPx * 1.5);
        scale = Math.max(0.02, (1 - d) * Math.max(0.2, depthFactor * 0.85));
        colorFactor = d;

      } else if (preset === 'Harmonic Wave') {
        // Concentric harmonic ripples undulating through radial depth
        const wave = Math.sin(timeSec * 2.8 - c * 7.0 + p.phase * 0.3);
        const expansion = 1 + wave * 0.14;

        px = x * radiusPx * expansion;
        py = y * radiusPx * expansion;
        pz = wave * (radiusPx * 0.35);

        scale = Math.max(0.02, (1 - d) * (1 + wave * 0.38));
        colorFactor = Math.min(1, Math.max(0, d + wave * 0.22));

      } else if (preset === 'Spiral Vortex') {
        // Hypnotic logarithmic swirl contraction & expansion
        const twist = timeSec * 0.65 + (1 - c) * 3.5;
        const cosTwist = Math.cos(twist);
        const sinTwist = Math.sin(twist);
        const pulse = 1 + 0.18 * Math.sin(timeSec * 1.6 + c * 4.0);

        const rx = (x * cosTwist - y * sinTwist) * radiusPx * pulse;
        const ry = (x * sinTwist + y * cosTwist) * radiusPx * pulse;

        px = rx;
        py = ry;
        pz = Math.cos(timeSec * 1.2 + twist) * (radiusPx * 0.2);

        scale = Math.max(0.02, (1 - d) * (0.75 + 0.35 * Math.sin(timeSec * 2.0 + p.phase)));
        colorFactor = Math.min(1, Math.max(0, d + 0.2 * Math.sin(timeSec + c * 3)));

      } else if (preset === 'Static (No Movement)') {
        // Pristine frozen balance without camera/particle motion
        px = x * radiusPx;
        py = y * radiusPx;
        pz = p.zOffset * radiusPx;
        scale = 1 - d;
        colorFactor = d;
      }

      return { px, py, pz, scale, colorFactor };
    }

    // ============================================================
    // Particle Shading & Drawing
    // ============================================================
    function drawParticle(ctx, screenX, screenY, sizePx, baseColor, highlightColor, shadowColor, hasShadow, depthShade) {
      if (sizePx <= 0.5) return;
      const radius = sizePx / 2;

      ctx.save();
      ctx.translate(screenX, screenY);

      // 1. Soft Drop Shadow
      if (hasShadow && radius > 1.2) {
        ctx.beginPath();
        ctx.arc(0, radius * 0.25, radius * 0.95, 0, Math.PI * 2);
        ctx.fillStyle = shadowColor;
        ctx.shadowColor = shadowColor;
        ctx.shadowBlur = radius * 0.35;
        ctx.shadowOffsetY = radius * 0.2;
        ctx.fill();
        ctx.shadowColor = 'transparent';
      }

      // 2. Spherical 3D Ball Body with Radial Lighting
      const lightOffsetX = -radius * 0.3;
      const lightOffsetY = -radius * 0.35;

      const grad = ctx.createRadialGradient(
        lightOffsetX, lightOffsetY, radius * 0.05,
        0, 0, radius
      );

      // Highlight peak, midtone, and ambient shadow edge
      grad.addColorStop(0, highlightColor);
      grad.addColorStop(0.25, baseColor);
      grad.addColorStop(0.85, baseColor);
      grad.addColorStop(1, lerpColor(baseColor, '#000000', depthShade));

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // 3. Crisp Top-Left Gloss Arc & Bottom Inset Depth
      if (radius > 3.0) {
        // Specular highlight crescent
        ctx.beginPath();
        ctx.arc(lightOffsetX, lightOffsetY, radius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.fill();

        // Bottom ambient occlusive rim
        ctx.beginPath();
        ctx.arc(0, radius * 0.25, radius * 0.75, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';
        ctx.fill();
      }

      ctx.restore();
    }

    // ============================================================
    // Main Render Loop
    // ============================================================
    function render(timestamp) {
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
      lastTimestamp = timestamp;

      if (params.speed > 0 && params.animationPreset !== 'Static (No Movement)') {
        elapsedTime += dt * params.speed;
      }

      // Smooth inertia for interactive rotation
      rotationX += (targetRotationX - rotationX) * 0.12;
      rotationY += (targetRotationY - rotationY) * 0.12;

      // Clear & Background fill
      const bgColor = getEffectiveBg();
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, width, height);

      // Base dimension scaling
      const radiusPx = (vmin * (params.radius / 100)) * params.zoom;
      const baseParticleSizePx = (vmin * (params.particleSize / 100)) * params.zoom;
      const centerX = (width / 2) + params.panX;
      const centerY = (height / 2) + params.panY;

      // Compute and depth-sort all particles
      const renderQueue = [];
      const len = particlesList.length;

      const cosRotX = Math.cos(rotationX);
      const sinRotX = Math.sin(rotationX);
      const cosRotY = Math.cos(rotationY);
      const sinRotY = Math.sin(rotationY);

      for (let i = 0; i < len; i++) {
        const p = particlesList[i];
        const state = computeParticleState(p, elapsedTime, radiusPx);

        // Apply interactive viewport 3D rotation if dragged
        let rx = state.px;
        let ry = state.py;
        let rz = state.pz;

        if (rotationX !== 0 || rotationY !== 0) {
          // Rotate Y
          const x1 = rx * cosRotY + rz * sinRotY;
          const z1 = -rx * sinRotY + rz * cosRotY;
          // Rotate X
          const y1 = ry * cosRotX - z1 * sinRotX;
          const z2 = ry * sinRotX + z1 * cosRotX;

          rx = x1;
          ry = y1;
          rz = z2;
        }

        const screenX = centerX + rx;
        const screenY = centerY + ry;
        const sizePx = baseParticleSizePx * state.scale;

        // Skip particles outside viewport bounds or scaled to zero
        if (
          screenX + sizePx < -50 ||
          screenX - sizePx > width + 50 ||
          screenY + sizePx < -50 ||
          screenY - sizePx > height + 50 ||
          sizePx < 0.5
        ) {
          continue;
        }

        const particleColor = lerpColor(params.centerColor, params.outerColor, state.colorFactor);

        renderQueue.push({
          screenX,
          screenY,
          sizePx,
          z: rz,
          particleColor
        });
      }

      // Sort by Z depth (back to front) for perfect occlusion & shadow projection
      renderQueue.sort((a, b) => a.z - b.z);

      // Draw all particles
      const qLen = renderQueue.length;
      for (let i = 0; i < qLen; i++) {
        const item = renderQueue[i];
        drawParticle(
          ctx,
          item.screenX,
          item.screenY,
          item.sizePx,
          item.particleColor,
          params.highlightColor,
          params.shadowColor,
          params.enableShadows,
          params.depthShading
        );
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    // ============================================================
    // Procedural Theme & Parameter Randomization (Click to Mutate)
    // ============================================================
    function generateRandomTheme() {
      const mode = Math.floor(Math.random() * 6);
      const baseHue = Math.floor(Math.random() * 360);
      let bg, center, outer, highlight, shadow;

      if (mode === 0) {
        // Deep Dark Cyber / Neon
        bg = hslToHex(baseHue, 65, 5);
        center = hslToHex(baseHue, 100, 65);
        outer = hslToHex((baseHue + 140) % 360, 95, 55);
        highlight = '#ffffff';
        shadow = 'rgba(0, 0, 0, 0.7)';
      } else if (mode === 1) {
        // Clean Minimal Light
        bg = hslToHex(baseHue, 20, 96);
        center = hslToHex(baseHue, 85, 45);
        outer = hslToHex((baseHue + 60) % 360, 75, 25);
        highlight = '#ffffff';
        shadow = 'rgba(0, 0, 0, 0.22)';
      } else if (mode === 2) {
        // Warm Radiant Sunset
        bg = hslToHex(baseHue, 35, 92);
        center = hslToHex((baseHue + 40) % 360, 100, 58);
        outer = hslToHex((baseHue + 280) % 360, 85, 35);
        highlight = '#ffffff';
        shadow = 'rgba(0, 0, 0, 0.28)';
      } else if (mode === 3) {
        // High Contrast Electric Triad
        bg = hslToHex(baseHue, 80, 4);
        center = hslToHex((baseHue + 180) % 360, 100, 60);
        outer = hslToHex((baseHue + 300) % 360, 95, 50);
        highlight = '#ffffff';
        shadow = 'rgba(0, 0, 0, 0.8)';
      } else if (mode === 4) {
        // Emerald / Forest Lustre
        bg = hslToHex(150, 40, 6);
        center = hslToHex(145, 95, 60);
        outer = hslToHex(210, 80, 35);
        highlight = '#e6fff5';
        shadow = 'rgba(0, 0, 0, 0.75)';
      } else {
        // Obsidian Gold / Luxury
        bg = '#0a0a0c';
        center = '#ffd700';
        outer = '#8b4513';
        highlight = '#ffffff';
        shadow = 'rgba(0, 0, 0, 0.85)';
      }

      return { bg, center, outer, highlight, shadow };
    }

    function randomizeScene() {
      // 1. New Visual Theme
      const theme = generateRandomTheme();
      params.scheme = 'Custom';
      params.background = theme.bg;
      params.centerColor = theme.center;
      params.outerColor = theme.outer;
      params.highlightColor = theme.highlight;
      params.shadowColor = theme.shadow;

      // 2. Geometric Variations
      params.particles = Math.floor(400 + Math.random() * 450);
      params.radius = +(40 + Math.random() * 22).toFixed(1);
      params.particleSize = +(15 + Math.random() * 10).toFixed(1);
      params.depthShading = +(0.3 + Math.random() * 0.4).toFixed(2);

      // 3. Motion Variations
      const anims = [
        'Breathing Bloom (Original)',
        'Celestial Orbit',
        'Harmonic Wave',
        'Spiral Vortex'
      ];
      params.animationPreset = anims[Math.floor(Math.random() * anims.length)];
      params.speed = +(0.65 + Math.random() * 1.1).toFixed(2);

      // Rebuild and update
      rebuildParticles();
      updateGuiDisplays(gui);
    }

    function updateGuiDisplays(targetGui) {
      if (!targetGui) return;
      if (targetGui.controllers) {
        targetGui.controllers.forEach(c => c.updateDisplay());
      }
      if (targetGui.folders) {
        targetGui.folders.forEach(f => updateGuiDisplays(f));
      }
    }

    // ============================================================
    // Interaction: Wheel Zoom & Screen Drag
    // ============================================================
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomDelta = e.deltaY < 0 ? 1.085 : 0.92;
      params.zoom = Math.max(0.15, Math.min(8.0, +(params.zoom * zoomDelta).toFixed(3)));
      updateGuiDisplays(gui);
    }, { passive: false });

    let isPointerDown = false;
    let startX = 0;
    let startY = 0;
    let startPanX = 0;
    let startPanY = 0;
    let startRotX = 0;
    let startRotY = 0;
    let didDrag = false;
    const DRAG_THRESHOLD = 5;

    canvas.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      didDrag = false;
      startX = e.clientX;
      startY = e.clientY;
      startPanX = params.panX;
      startPanY = params.panY;
      startRotX = targetRotationX;
      startRotY = targetRotationY;
      canvas.classList.add('is-dragging');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
        didDrag = true;
      }

      if (e.buttons === 2 || e.shiftKey || e.altKey || params.dragMode === 'Rotate 3D') {
        // 3D rotation drag
        targetRotationY = startRotY + (dx / vmin) * Math.PI * 1.5;
        targetRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, startRotX + (dy / vmin) * Math.PI * 1.5));
      } else {
        // Screen Pan Drag
        params.panX = startPanX + dx;
        params.panY = startPanY + dy;
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      canvas.classList.remove('is-dragging');

      // Click detection: if not dragged, trigger procedural variation
      if (!didDrag && e.target === canvas && e.button === 0 && !e.shiftKey && !e.altKey) {
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // ============================================================
    // Keyboard Shortcuts: 'H' to toggle UI
    // ============================================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // ============================================================
    // Control Panel (lil-gui)
    // ============================================================
    const gui = new GUI({ title: 'Particle Controls' });

    // 1. Colors & Theme Folder
    const fTheme = gui.addFolder('Theme & Colors');

    fTheme.add(params, 'scheme', [
      'Original Sunset Gold',
      'Black and White',
      'White and Black',
      'Cyberpunk Neon',
      'Emerald Aurora',
      'Custom'
    ]).name('Preset Scheme').onChange((val) => {
      if (val !== 'Custom' && colorSchemes[val]) {
        const s = colorSchemes[val];
        params.background = s.background;
        params.centerColor = s.centerColor;
        params.outerColor = s.outerColor;
        params.highlightColor = s.highlightColor;
        params.shadowColor = s.shadowColor;
        updateGuiDisplays(gui);
      }
    });

    fTheme.add(params, 'greenScreen')
      .name('Greenscreen (#00ff00)');

    fTheme.addColor(params, 'background').name('Background').onChange(() => {
      params.scheme = 'Custom';
      updateGuiDisplays(gui);
    });

    fTheme.addColor(params, 'centerColor').name('Center Color').onChange(() => {
      params.scheme = 'Custom';
      updateGuiDisplays(gui);
    });

    fTheme.addColor(params, 'outerColor').name('Outer Color').onChange(() => {
      params.scheme = 'Custom';
      updateGuiDisplays(gui);
    });

    fTheme.addColor(params, 'highlightColor').name('Highlight Tint');
    fTheme.add(params, 'enableShadows').name('Particle Shadows');
    fTheme.add(params, 'depthShading', 0, 1, 0.01).name('Shading Intensity');

    // 2. Animation Folder
    const fAnim = gui.addFolder('Animation');

    fAnim.add(params, 'animationPreset', animationPresets)
      .name('Preset');

    fAnim.add(params, 'speed', 0, 3.0, 0.05)
      .name('Speed');

    // 3. Geometry Folder
    const fGeo = gui.addFolder('Geometry');

    fGeo.add(params, 'particles', 100, 1200, 10)
      .name('Count')
      .onChange(() => rebuildParticles());

    fGeo.add(params, 'radius', 10, 90, 1)
      .name('Sphere Radius (%)');

    fGeo.add(params, 'particleSize', 5, 45, 1)
      .name('Ball Size (%)');

    fGeo.add(params, 'initialScale', 0.01, 0.5, 0.01)
      .name('Min Scale');

    // 4. View & Interaction Folder
    const fView = gui.addFolder('View & Interaction');

    fView.add(params, 'dpr', 0.5, 3.0, 0.25)
      .name('Pixel Ratio (DPR)')
      .onChange(() => resizeCanvas());

    fView.add(params, 'zoom', 0.2, 5.0, 0.05)
      .name('Zoom')
      .listen();

    fView.add(params, 'dragMode', ['Pan & Tilt', 'Rotate 3D'])
      .name('Drag Action');

    fView.add(params, 'randomizeOnClick')
      .name('Randomize on Click');

    fView.add(params, 'resetView')
      .name('Reset View');

    fView.add(params, 'randomize')
      .name('Randomize Now');

  </script>
</body>
</html>
