<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Import Map for Three.js and lil-gui -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
            "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
        }
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            cursor: grab;
        }

        body:active {
            cursor: grabbing;
        }

        body.greenscreen {
            background-color: #00ff00 !important;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // =========================================================================
        // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
        // =========================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) {
              renderer.setRenderTarget(this.fbo);
            }
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) {
              renderer.setRenderTarget(null);
            }
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class ShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class BloomPass {
          constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              // Horizontal blur pass
              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              // Vertical blur pass
              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.65,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.45,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,
              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.012,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.35,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,
              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader);

            this.copyPass = new ShaderPass(new THREE.RawShaderMaterial({
              uniforms: { inputTexture: { value: null } },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            }));
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post-Processing Suite") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            const bloom = root.addFolder("Bloom");
            bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

            const lens = root.addFolder("Lens, Optics & Color");
            lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
            lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
            lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            return root;
          }
        }

        // --- 1. PRECONFIGURED COLOR SCHEMES (10 Distinct Karst & Laser Palettes) ---

                primary: "#ffffff",

                accent: "#f0f0f0",
                bg: "#000000"
            },
            "Neutral + Accent (Limestone & Emerald Laser)": {
                primary: "#5e6674",
                secondary: "#282d37",
                accent: "#00ff9d",
                bg: "#090b0e"
            }
        };

        // --- 2. PRECONFIGURED ANIMATION MODES (8 Smooth Speleothem Modes) ---
        const ANIMATION_MODES = {
            "Static (No Movement)": { rotSpeedX: 0.0, rotSpeedY: 0.0, pulseSpeed: 0.0, morphSpeed: 0.0, scanSpeed: 0.0 },
            "Slow Speleothem Drip (Subtle Flow)": { rotSpeedX: 0.06, rotSpeedY: 0.03, pulseSpeed: 0.12, morphSpeed: 0.15, scanSpeed: 0.4 },
            "Cave LiDAR Laser Scan (Orbital Drift)": { rotSpeedX: 0.18, rotSpeedY: 0.08, pulseSpeed: 0.05, morphSpeed: 0.08, scanSpeed: 1.6 },
            "Karst Accretion Pulse (Breathing)": { rotSpeedX: 0.08, rotSpeedY: 0.04, pulseSpeed: 0.35, morphSpeed: 0.22, scanSpeed: 0.6 },
            "Travertine Terrace Sweep (Cinematic Pan)": { rotSpeedX: 0.14, rotSpeedY: -0.06, pulseSpeed: 0.10, morphSpeed: 0.12, scanSpeed: 0.8 },
            "Stalactite Formation (Vertical Morph)": { rotSpeedX: 0.04, rotSpeedY: 0.12, pulseSpeed: 0.18, morphSpeed: 0.40, scanSpeed: 0.5 },
            "Subterranean Echo (Gentle Oscillation)": { rotSpeedX: 0.11, rotSpeedY: 0.09, pulseSpeed: 0.15, morphSpeed: 0.10, scanSpeed: 0.7 },
            "Deep Abyss Orbit (Full 360 Survey)": { rotSpeedX: 0.25, rotSpeedY: 0.05, pulseSpeed: 0.08, morphSpeed: 0.06, scanSpeed: 1.0 }
        };

        // --- 3. PARAMETERS & STATE ---
        const params = {
            // Render Quality
            dpr: 1.0,
            antiAlias: false,
            greenScreen: false,
            greenThreshold: 0.025,
            greenFeather: 0.08,

            // Animation
            animationPreset: "Slow Speleothem Drip (Subtle Flow)",
            speed: 0.35,

            // Camera & View
            zoom: 6.2,
            perspective: 2.2,
            panX: 0.0,
            panY: 0.0,

            // Karst / Speleothem Drip Geometry (SDF)
            shapeSize: 1.8,
            iterations: 5,
            foldX: 1.62,
            foldY: 0.68,
            foldZ: 0.74,
            scaleFactor: 1.38,
            growthCeiling: 1.32,
            growthFloor: 2.15,
            dripTaper: 1.15,
            repPeriod: 2.4,
            repetitionMix: 0.75,
            noduleRoughness: 0.38,
            noduleFreq: 2.8,

            // Stratified Travertine & Laser Deposit Accumulation
            depositDecay: 7.5,
            glowIntensity: 0.032,
            ringFreq: 2.85,
            terraceFreq: 4.6,
            laserIntensity: 0.42,
            lidarSpeed: 1.2,

            // Color Palette
            colorPreset: "Travertine Classic (Ochre-to-Cream)",
            colorPrimary: COLOR_SCHEMES["Travertine Classic (Ochre-to-Cream)"].primary,
            colorSecondary: COLOR_SCHEMES["Travertine Classic (Ochre-to-Cream)"].secondary,
            colorAccent: COLOR_SCHEMES["Travertine Classic (Ochre-to-Cream)"].accent,
            colorBg: COLOR_SCHEMES["Travertine Classic (Ochre-to-Cream)"].bg,

            // Procedural Randomize on Click
            randomOnClick: true
        };

        // --- 4. THREE.JS INITIALIZATION ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setPixelRatio(params.dpr);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        // Helper to convert hex to THREE.Vector3 (normalized RGB)
        const hexToVec3 = (hex) => {
            const col = new THREE.Color(hex);
            return new THREE.Vector3(col.r, col.g, col.b);
        };

        // --- 5. SHADER UNIFORMS ---
        const uniforms = {
            u_time: { value: 0.0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },
            u_mouse_rot: { value: new THREE.Vector2(0.0, 0.0) },
            u_pan: { value: new THREE.Vector2(params.panX, params.panY) },
            u_zoom: { value: params.zoom },
            u_perspective: { value: params.perspective },
            u_anim_speed: { value: params.speed },

            // Geometry & Speleothem Drip SDF
            u_shape_size: { value: params.shapeSize },
            u_iterations: { value: params.iterations },
            u_fold: { value: new THREE.Vector3(params.foldX, params.foldY, params.foldZ) },
            u_scale_factor: { value: params.scaleFactor },
            u_growth_ceiling: { value: params.growthCeiling },
            u_growth_floor: { value: params.growthFloor },
            u_drip_taper: { value: params.dripTaper },
            u_rep_period: { value: params.repPeriod },
            u_repetition_mix: { value: params.repetitionMix },
            u_nodule_roughness: { value: params.noduleRoughness },
            u_nodule_freq: { value: params.noduleFreq },

            // Deposit & Travertine Layering
            u_deposit_decay: { value: params.depositDecay },
            u_glow_intensity: { value: params.glowIntensity },
            u_ring_freq: { value: params.ringFreq },
            u_terrace_freq: { value: params.terraceFreq },
            u_laser_intensity: { value: params.laserIntensity },
            u_lidar_speed: { value: params.lidarSpeed },

            // Colors
            u_color_primary: { value: hexToVec3(params.colorPrimary) },
            u_color_secondary: { value: hexToVec3(params.colorSecondary) },
            u_color_accent: { value: hexToVec3(params.colorAccent) },
            u_color_bg: { value: hexToVec3(params.colorBg) },

            // Green Screen
            u_green_screen: { value: params.greenScreen },
            u_green_threshold: { value: params.greenThreshold },
            u_green_feather: { value: params.greenFeather }
        };

        // --- 6. SHADER GLSL SOURCE ---
        const getFragmentShader = (useAA) => `
            #define MAX_ITERATIONS 10
            ${useAA ? '#define USE_AA' : ''}

            precision highp float;

            uniform float u_time;
            uniform vec2 u_resolution;
            uniform vec2 u_mouse_rot;
            uniform vec2 u_pan;
            uniform float u_zoom;
            uniform float u_perspective;
            uniform float u_anim_speed;

            // Geometry & Speleothem Drip SDF
            uniform float u_shape_size;
            uniform int u_iterations;
            uniform vec3 u_fold;
            uniform float u_scale_factor;
            uniform float u_growth_ceiling;
            uniform float u_growth_floor;
            uniform float u_drip_taper;
            uniform float u_rep_period;
            uniform float u_repetition_mix;
            uniform float u_nodule_roughness;
            uniform float u_nodule_freq;

            // Deposit & Travertine Layering
            uniform float u_deposit_decay;
            uniform float u_glow_intensity;
            uniform float u_ring_freq;
            uniform float u_terrace_freq;
            uniform float u_laser_intensity;
            uniform float u_lidar_speed;

            // Colors
            uniform vec3 u_color_primary;
            uniform vec3 u_color_secondary;
            uniform vec3 u_color_accent;
            uniform vec3 u_color_bg;

            // Green Screen
            uniform bool u_green_screen;
            uniform float u_green_threshold;
            uniform float u_green_feather;

            // Globals computed per ray step
            float g_qw;
            vec3 g_localPos;

            mat2 g_rotAnim;
            mat2 g_rotAnim07;
            mat2 g_rotFractalXY;
            mat2 g_rotFractalXZ;
            mat2 g_rotFractalYZ;
            mat2 g_camRotX;
            mat2 g_camRotY;

            mat2 rotate2D(float angle) {
                float c = cos(angle);
                float s = sin(angle);
                return mat2(c, -s, s, c);
            }

            // --- Ultra-Fast Harmonic Vector FBM for Mineral Accretion Nodules ---
            vec3 fastFbmNodule(vec3 p) {
                vec3 v = sin(p.yzx * 1.0 + vec3(0.0, 1.57, 3.14)) * 0.5;
                v += sin(p.zxy * 2.15 + vec3(1.23, 0.45, 2.67)) * 0.26;
                v += sin(p.xyz * 4.65 + vec3(2.31, 3.12, 0.84)) * 0.13;
                return v;
            }

            // 2D Hash for jitter
            float hash2D(vec2 p) {
                return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
            }

            // --- EVALUATE SCENE SDF ---
            // SDF: feed p through gravity-biased domain repetition on Y with slowly increasing period,
            // sphere-fold growth term is a function of Y (tighter near ceiling, looser as it falls),
            // low-frequency fbm displacement to q pre-fold to roughen into accretion nodules.
            float evaluateSceneSDF(vec3 samplePoint) {
                vec3 localP = samplePoint;

                localP.xz *= g_rotAnim;
                localP.xy *= g_rotAnim07;
                g_localPos = localP;

                vec3 p = localP;

                // 1. Gravity-biased domain repetition on Y with slowly increasing period (stalactite elongation)
                float yDepth = clamp((2.2 - p.y) * 0.25, 0.0, 1.0);
                float periodY = mix(u_rep_period * 0.75, u_rep_period * 1.5, yDepth);
                float yRep = mod(p.y + periodY * 0.5, periodY) - periodY * 0.5;
                p.y = mix(p.y, yRep, u_repetition_mix);

                // 2. Pre-fold ultra-fast harmonic FBM displacement for botryoidal accretion nodules
                vec3 noduleDisp = fastFbmNodule(p * u_nodule_freq) * (u_nodule_roughness * 0.35);

                vec4 q = vec4(p + noduleDisp, 1.0);

                // 3. Karst / Stalactite Folding Loop
                for (int k = 0; k < MAX_ITERATIONS; k++) {
                    if (k >= u_iterations) break;

                    float r2 = dot(q.xyz, q.xyz);

                    // Sphere-fold growth term as a function of Y (tighter near ceiling, looser as it falls)
                    float yTaper = clamp(0.5 - q.y * 0.35 * u_drip_taper, 0.0, 1.2);
                    float growth = mix(u_growth_ceiling, u_growth_floor, yTaper);
                    float sphereFold = max(growth / max(r2, 0.12), 1.06);
                    q *= sphereFold;

                    q.xyz = abs(q.xyz) - u_fold;
                    q.xy = g_rotFractalXY * q.xy;
                    q.xz = g_rotFractalXZ * q.xz;
                    q.yz = g_rotFractalYZ * q.yz;

                    q *= u_scale_factor;
                }

                g_qw = q.w;

                // Bounding column envelope + travertine rimstone dam ripples
                float boundCol = length(p.xz) - (u_shape_size * mix(0.45, 1.15, clamp(p.y * 0.3 + 0.6, 0.1, 1.3)));
                float terraceSteps = sin(p.y * u_terrace_freq) * 0.04;
                float fractalSurface = (length(q.xyz) - 1.25) / max(q.w, 0.001) + terraceSteps;

                return max(fractalSurface, boundCol * 0.28);
            }

            // Normal estimation
            vec3 estimateNormal(vec3 p) {
                vec2 e = vec2(1.0, -1.0) * 0.005;
                return normalize(
                    e.xyy * evaluateSceneSDF(p + e.xyy) +
                    e.yyx * evaluateSceneSDF(p + e.yyx) +
                    e.yxy * evaluateSceneSDF(p + e.yxy) +
                    e.xxx * evaluateSceneSDF(p + e.xxx)
                );
            }

            // --- RAYMARCHER WITH DEPOSIT TIME & STRATIFIED TRAVERTINE RINGS ---
            vec3 renderRay(vec3 origin, vec3 direction, float jitter) {
                float totalDistance = jitter * 0.04;
                float depositTime = 0.0;
                vec3 accumulatedLight = vec3(0.0);
                int bounceCount = 0;

                for (int step = 0; step < 72; step++) {
                    vec3 currentPos = origin + direction * totalDistance;
                    float sceneDist = evaluateSceneSDF(currentPos);

                    // 1. Accumulate deposit time: decayed running total of dwelling time near sceneDist ≈ 0
                    float dwell = exp(-abs(sceneDist) * u_deposit_decay);
                    depositTime += dwell * 0.024;

                    // 2. Stratified travertine-terrace rings banded with fract(log(q.w))
                    float logQw = log(max(g_qw, 1.001));
                    float rings = fract(logQw * u_ring_freq + currentPos.y * (u_terrace_freq * 0.2));
                    float ringBands = smoothstep(0.12, 0.48, rings) - smoothstep(0.55, 0.92, rings);

                    // 3. Cave laser-scan / LiDAR depth pulses
                    float lidarScan = sin(currentPos.y * 38.0 - u_time * u_lidar_speed * 2.5) * 0.5 + 0.5;
                    float laserLines = smoothstep(0.93, 0.99, sin(currentPos.z * 16.0 + currentPos.x * 12.0 + u_time * 0.7));

                    // 4. Color tinting through travertine mineral palette
                    vec3 layerColor = mix(u_color_bg, u_color_primary, clamp(depositTime * 1.3, 0.0, 1.0));
                    layerColor = mix(layerColor, u_color_secondary, rings * 0.65);
                    layerColor = mix(layerColor, u_color_accent, ringBands * 0.85);

                    // Add LiDAR laser scan highlights
                    layerColor += u_color_accent * (lidarScan * 0.18 + laserLines * 0.45) * u_laser_intensity;

                    // Volumetric mineral accretion glow
                    if (step > 1) {
                        float distSq = dot(currentPos, currentPos);
                        float attenuation = exp(-distSq * 0.06);
                        accumulatedLight += layerColor * dwell * u_glow_intensity * attenuation;
                    }

                    // Surface hit
                    if (sceneDist < 0.0008) {
                        if (bounceCount > 0) break;

                        vec3 surfNorm = estimateNormal(currentPos);
                        vec3 keyLight = normalize(vec3(0.5, 0.8, -0.6));
                        float diff = max(dot(surfNorm, keyLight), 0.0);
                        float rim = pow(1.0 - max(dot(-direction, surfNorm), 0.0), 2.5);

                        vec3 surfColor = mix(u_color_primary, u_color_secondary, rings);
                        surfColor = mix(surfColor, u_color_accent, ringBands);

                        accumulatedLight += surfColor * (diff * 0.55 + rim * 0.5 + 0.22) * exp(-depositTime * 0.15);

                        direction = reflect(direction, surfNorm);
                        totalDistance += 0.025;
                        bounceCount++;
                    }

                    totalDistance += max(sceneDist * 0.82, 0.005);
                    if (totalDistance > u_zoom + 5.0) break;
                }

                return accumulatedLight;
            }

            vec3 getPixelColor(vec2 fragCoord) {
                vec2 uv = (2.0 * fragCoord.xy - u_resolution.xy) / u_resolution.y;
                uv -= u_pan; // Screen drag panning

                float jitter = hash2D(uv + vec2(u_time * 0.01)) * 0.08;

                vec3 cameraOrigin = vec3(0.0, 0.0, -u_zoom);
                vec3 rayDirection = normalize(vec3(uv, u_perspective));

                cameraOrigin.yz *= g_camRotY;
                cameraOrigin.xz *= g_camRotX;
                rayDirection.yz *= g_camRotY;
                rayDirection.xz *= g_camRotX;

                vec3 finalColor = renderRay(cameraOrigin, rayDirection, jitter);
                return finalColor * finalColor;
            }

            void main() {
                float timeAnim = u_time * u_anim_speed;
                g_rotAnim = rotate2D(timeAnim * 0.4);
                g_rotAnim07 = rotate2D(timeAnim * 0.25);
                g_rotFractalXY = rotate2D(0.68 + sin(u_time * 0.04) * 0.08);
                g_rotFractalXZ = rotate2D(0.52 + cos(u_time * 0.03) * 0.06);
                g_rotFractalYZ = rotate2D(0.38);

                g_camRotY = rotate2D(-u_mouse_rot.y);
                g_camRotX = rotate2D(-u_mouse_rot.x);

                vec3 finalColor = vec3(0.0);

                #ifdef USE_AA
                    for(int m = 0; m < 2; m++) {
                        for(int n = 0; n < 2; n++) {
                            vec2 offset = vec2(float(m), float(n)) / 2.0 - 0.25;
                            finalColor += getPixelColor(gl_FragCoord.xy + offset);
                        }
                    }
                    finalColor /= 4.0;
                #else
                    finalColor = getPixelColor(gl_FragCoord.xy);
                #endif

                // Tone mapping & green screen
                finalColor = finalColor / (vec3(1.0) + finalColor * 0.4);

                if (u_green_screen) {
                    float brightness = max(max(finalColor.r, finalColor.g), finalColor.b);
                    float keepFractal = smoothstep(u_green_threshold, u_green_threshold + u_green_feather, brightness);
                    finalColor = mix(vec3(0.0, 1.0, 0.0), finalColor, keepFractal);
                }

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        let material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: getFragmentShader(params.antiAlias),
            uniforms: uniforms
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // --- 7. UNIFORMS & COLOR CONTROLLERS UPDATE ---
        const updateUniforms = () => {
            uniforms.u_zoom.value = params.zoom;
            uniforms.u_perspective.value = params.perspective;
            uniforms.u_pan.value.set(params.panX, params.panY);
            uniforms.u_anim_speed.value = params.speed;

            uniforms.u_shape_size.value = params.shapeSize;
            uniforms.u_iterations.value = params.iterations;
            uniforms.u_fold.value.set(params.foldX, params.foldY, params.foldZ);
            uniforms.u_scale_factor.value = params.scaleFactor;
            uniforms.u_growth_ceiling.value = params.growthCeiling;
            uniforms.u_growth_floor.value = params.growthFloor;
            uniforms.u_drip_taper.value = params.dripTaper;
            uniforms.u_rep_period.value = params.repPeriod;
            uniforms.u_repetition_mix.value = params.repetitionMix;
            uniforms.u_nodule_roughness.value = params.noduleRoughness;
            uniforms.u_nodule_freq.value = params.noduleFreq;

            uniforms.u_deposit_decay.value = params.depositDecay;
            uniforms.u_glow_intensity.value = params.glowIntensity;
            uniforms.u_ring_freq.value = params.ringFreq;
            uniforms.u_terrace_freq.value = params.terraceFreq;
            uniforms.u_laser_intensity.value = params.laserIntensity;
            uniforms.u_lidar_speed.value = params.lidarSpeed;

            uniforms.u_color_primary.value.copy(hexToVec3(params.colorPrimary));
            uniforms.u_color_secondary.value.copy(hexToVec3(params.colorSecondary));
            uniforms.u_color_accent.value.copy(hexToVec3(params.colorAccent));
            uniforms.u_color_bg.value.copy(hexToVec3(params.colorBg));

            uniforms.u_green_screen.value = params.greenScreen;
            uniforms.u_green_threshold.value = params.greenThreshold;
            uniforms.u_green_feather.value = params.greenFeather;
        };

        // --- 7.5. POSTPROCESSOR INITIALIZATION ---
        const postProcessor = new PostProcessor(renderer, {
            enabled: true,
            bloomEnabled: true,
            bloomStrength: 0.65,
            bloomRadius: 0.45,
            bloomThreshold: 0.18,
            fisheyeStrength: 0.0,
            fisheyeRadius: 1.0,
            chromaticAberration: 0.012,
            vignetteBoost: 1.0,
            vignetteReduction: 0.35,
            noiseIntensity: 0.012,
            gamma: 1.0
        });
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

        function setGreenScreen(enabled) {
            document.body.classList.toggle('greenscreen', enabled);
            renderer.setClearColor(enabled ? 0x00ff00 : 0x000000, 1);
            uniforms.u_green_screen.value = enabled;
            if (enabled) {
                postProcessor.settings.enabled = false;
            } else {
                postProcessor.settings.enabled = true;
            }
            postProcessor.updateSettings();
        }

        // Apply a preconfigured color scheme
        function applyColorScheme(name) {
            const scheme = COLOR_SCHEMES[name];
            if (!scheme) return;
            params.colorPrimary = scheme.primary;
            params.colorSecondary = scheme.secondary;
            params.colorAccent = scheme.accent;
            params.colorBg = scheme.bg;
            updateUniforms();
            controllers.colorPrimary.updateDisplay();
            controllers.colorSecondary.updateDisplay();
            controllers.colorAccent.updateDisplay();
            controllers.colorBg.updateDisplay();
        }

        // Apply a preconfigured animation mode
        function applyAnimationPreset(name) {
            params.animationPreset = name;
        }

        // --- 8. LIL-GUI SETUP ---
        const gui = new GUI({ title: 'Drip Terrace Settings' });
        const controllers = {};

        // Render Quality
        const renderFolder = gui.addFolder('Render Quality');
        renderFolder.add(params, 'dpr', [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            uniforms.u_resolution.value.set(window.innerWidth * v, window.innerHeight * v);
            postProcessor.setSize(window.innerWidth, window.innerHeight, v);
        });
        renderFolder.add(params, 'antiAlias').name('Anti-Aliasing').onChange(v => {
            material.fragmentShader = getFragmentShader(v);
            material.needsUpdate = true;
        });

        // Green Screen
        const greenFolder = gui.addFolder('Green Screen');
        controllers.greenScreen = greenFolder.add(params, 'greenScreen').name('Enable #00ff00').onChange(setGreenScreen);
        controllers.greenThreshold = greenFolder.add(params, 'greenThreshold', 0.0, 0.2, 0.001).name('Threshold').onChange(updateUniforms);
        controllers.greenFeather = greenFolder.add(params, 'greenFeather', 0.0, 0.3, 0.001).name('Feather').onChange(updateUniforms);

        // Animation
        const animFolder = gui.addFolder('Animation');
        controllers.animPreset = animFolder.add(params, 'animationPreset', Object.keys(ANIMATION_MODES)).name('Preset').onChange(applyAnimationPreset);
        controllers.speed = animFolder.add(params, 'speed', 0.0, 2.0, 0.01).name('Animation Speed').onChange(updateUniforms);

        // Camera & Drag View
        const camFolder = gui.addFolder('Camera & View');
        controllers.zoom = camFolder.add(params, 'zoom', 0.8, 16.0, 0.1).name('Zoom Distance').onChange(updateUniforms);
        controllers.perspective = camFolder.add(params, 'perspective', 0.5, 4.0, 0.05).name('Perspective Z').onChange(updateUniforms);
        controllers.panX = camFolder.add(params, 'panX', -3.0, 3.0, 0.01).name('Pan X').onChange(updateUniforms);
        controllers.panY = camFolder.add(params, 'panY', -3.0, 3.0, 0.01).name('Pan Y').onChange(updateUniforms);

        // Karst Speleothem Drip Geometry (SDF)
        const karstFolder = gui.addFolder('Speleothem Geometry');
        controllers.shapeSize = karstFolder.add(params, 'shapeSize', 0.5, 3.5, 0.05).name('Shape Size').onChange(updateUniforms);
        controllers.iterations = karstFolder.add(params, 'iterations', 1, 10, 1).name('Iterations').onChange(updateUniforms);
        controllers.foldX = karstFolder.add(params, 'foldX', 0.1, 3.0, 0.01).name('Fold X').onChange(updateUniforms);
        controllers.foldY = karstFolder.add(params, 'foldY', 0.1, 3.0, 0.01).name('Fold Y').onChange(updateUniforms);
        controllers.foldZ = karstFolder.add(params, 'foldZ', 0.1, 3.0, 0.01).name('Fold Z').onChange(updateUniforms);
        controllers.scaleFactor = karstFolder.add(params, 'scaleFactor', 1.0, 2.2, 0.01).name('Fractal Scale').onChange(updateUniforms);
        controllers.growthCeiling = karstFolder.add(params, 'growthCeiling', 0.8, 2.0, 0.01).name('Ceiling Fold Growth').onChange(updateUniforms);
        controllers.growthFloor = karstFolder.add(params, 'growthFloor', 1.2, 3.0, 0.01).name('Floor Fold Growth').onChange(updateUniforms);
        controllers.dripTaper = karstFolder.add(params, 'dripTaper', 0.0, 2.5, 0.05).name('Gravity Drip Taper').onChange(updateUniforms);
        controllers.repPeriod = karstFolder.add(params, 'repPeriod', 0.8, 5.0, 0.1).name('Y Domain Period').onChange(updateUniforms);
        controllers.repetitionMix = karstFolder.add(params, 'repetitionMix', 0.0, 1.0, 0.01).name('Y Repetition Mix').onChange(updateUniforms);
        controllers.noduleRoughness = karstFolder.add(params, 'noduleRoughness', 0.0, 1.0, 0.01).name('Accretion Roughness').onChange(updateUniforms);
        controllers.noduleFreq = karstFolder.add(params, 'noduleFreq', 0.5, 8.0, 0.1).name('Accretion Frequency').onChange(updateUniforms);

        // Stratified Travertine & Laser Scan Accumulation
        const depositFolder = gui.addFolder('Deposit & Travertine Scan');
        controllers.depositDecay = depositFolder.add(params, 'depositDecay', 1.0, 20.0, 0.1).name('Deposit Decay').onChange(updateUniforms);
        controllers.glowIntensity = depositFolder.add(params, 'glowIntensity', 0.0, 0.1, 0.001).name('Deposit Glow').onChange(updateUniforms);
        controllers.ringFreq = depositFolder.add(params, 'ringFreq', 0.5, 8.0, 0.05).name('Travertine Ring Freq').onChange(updateUniforms);
        controllers.terraceFreq = depositFolder.add(params, 'terraceFreq', 0.5, 12.0, 0.1).name('Terrace Step Freq').onChange(updateUniforms);
        controllers.laserIntensity = depositFolder.add(params, 'laserIntensity', 0.0, 1.5, 0.02).name('LiDAR Laser Intensity').onChange(updateUniforms);
        controllers.lidarSpeed = depositFolder.add(params, 'lidarSpeed', 0.0, 4.0, 0.05).name('LiDAR Scan Speed').onChange(updateUniforms);

        // Color Schemes & Palette
        const colorFolder = gui.addFolder('Color Schemes');
        controllers.colorPreset = colorFolder.add(params, 'colorPreset', Object.keys(COLOR_SCHEMES)).name('Preset (10 Schemes)').onChange(v => {
            applyColorScheme(v);
        });
        controllers.colorPrimary = colorFolder.addColor(params, 'colorPrimary').name('Primary Mineral').onChange(updateUniforms);
        controllers.colorSecondary = colorFolder.addColor(params, 'colorSecondary').name('Secondary Mineral').onChange(updateUniforms);
        controllers.colorAccent = colorFolder.addColor(params, 'colorAccent').name('Accent / Laser').onChange(updateUniforms);
        controllers.colorBg = colorFolder.addColor(params, 'colorBg').name('Cavern Void').onChange(updateUniforms);

        // Procedural Variation on Click Toggle
        const proceduralFolder = gui.addFolder('Procedural Click Mode');
        controllers.randomOnClick = proceduralFolder.add(params, 'randomOnClick').name('Randomize On Click');

        // Attach PostProcessor Suite Controls Folder
        postProcessor.attachGUI(gui, "Post-Processing (PostProcessor.js)");

        gui.close();

        // --- 9. PROCEDURAL RANDOMIZER (On Click) ---
        function randomizeScene() {
            // Pick a random color scheme
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const chosenSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            params.colorPreset = chosenSchemeKey;
            const scheme = COLOR_SCHEMES[chosenSchemeKey];
            params.colorPrimary = scheme.primary;
            params.colorSecondary = scheme.secondary;
            params.colorAccent = scheme.accent;
            params.colorBg = scheme.bg;

            // Randomize geometric parameters
            params.shapeSize = Number((0.9 + Math.random() * 1.5).toFixed(2));
            params.iterations = Math.floor(4 + Math.random() * 2.5);
            params.foldX = Number((0.8 + Math.random() * 1.4).toFixed(2));
            params.foldY = Number((0.3 + Math.random() * 1.0).toFixed(2));
            params.foldZ = Number((0.4 + Math.random() * 1.0).toFixed(2));
            params.scaleFactor = Number((1.25 + Math.random() * 0.35).toFixed(2));
            params.growthCeiling = Number((1.0 + Math.random() * 0.6).toFixed(2));
            params.growthFloor = Number((1.7 + Math.random() * 0.9).toFixed(2));
            params.dripTaper = Number((0.6 + Math.random() * 1.2).toFixed(2));
            params.repPeriod = Number((1.5 + Math.random() * 2.0).toFixed(2));
            params.noduleRoughness = Number((0.2 + Math.random() * 0.45).toFixed(2));
            params.noduleFreq = Number((1.5 + Math.random() * 3.5).toFixed(1));

            // Randomize deposit & scan parameters
            params.depositDecay = Number((4.0 + Math.random() * 8.0).toFixed(1));
            params.glowIntensity = Number((0.02 + Math.random() * 0.035).toFixed(3));
            params.ringFreq = Number((1.5 + Math.random() * 4.0).toFixed(2));
            params.terraceFreq = Number((2.5 + Math.random() * 5.5).toFixed(1));
            params.laserIntensity = Number((0.2 + Math.random() * 0.6).toFixed(2));

            // Randomize animation mode
            const animKeys = Object.keys(ANIMATION_MODES);
            params.animationPreset = animKeys[Math.floor(Math.random() * animKeys.length)];
            params.speed = Number((0.2 + Math.random() * 0.4).toFixed(2));

            // Update GUI displays and uniforms
            for (let key in controllers) {
                if (controllers[key] && controllers[key].updateDisplay) {
                    controllers[key].updateDisplay();
                }
            }
            updateUniforms();
        }

        // --- 10. MOUSE INTERACTION (DRAG TO ROTATE, PAN, SCROLL TO ZOOM, CLICK TO RANDOMIZE) ---
        let isDragging = false;
        let isPanning = false;
        let dragDistance = 0;
        let clickStartTime = 0;
        let previousMousePosition = { x: 0, y: 0 };

        const targetMouseRot = new THREE.Vector2(0, 0);
        const currentMouseRot = new THREE.Vector2(0, 0);

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault(); // allow right-click drag to pan
        });

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            isDragging = true;
            isPanning = (e.button === 2 || e.button === 1 || e.shiftKey);
            dragDistance = 0;
            clickStartTime = performance.now();
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const clickDuration = performance.now() - clickStartTime;

            // Detect clean click on canvas without dragging (randomize if enabled)
            if (dragDistance < 5 && clickDuration < 300 && params.randomOnClick) {
                randomizeScene();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            dragDistance += Math.hypot(deltaX, deltaY);

            if (isPanning || e.buttons === 2 || e.buttons === 4 || e.shiftKey) {
                // Drag object across screen (Panning)
                params.panX += (deltaX / window.innerHeight) * 2.0;
                params.panY -= (deltaY / window.innerHeight) * 2.0;
                controllers.panX.updateDisplay();
                controllers.panY.updateDisplay();
                updateUniforms();
            } else {
                // Drag to rotate view
                targetMouseRot.x += deltaX * 0.008;
                targetMouseRot.y -= deltaY * 0.008;
            }

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        // Touch Interaction Support
        let initialPinchDistance = null;
        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            if (e.touches.length === 1) {
                isDragging = true;
                isPanning = false;
                dragDistance = 0;
                clickStartTime = performance.now();
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                dragDistance += Math.hypot(deltaX, deltaY);

                targetMouseRot.x += deltaX * 0.008;
                targetMouseRot.y -= deltaY * 0.008;

                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2 && initialPinchDistance !== null) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const pinchFactor = initialPinchDistance / currentDist;
                params.zoom = Math.max(0.8, Math.min(params.zoom * pinchFactor, 16.0));
                controllers.zoom.updateDisplay();
                updateUniforms();
                initialPinchDistance = currentDist;
            }
        });

        window.addEventListener('touchend', (e) => {
            if (isDragging && dragDistance < 5 && (performance.now() - clickStartTime) < 300 && params.randomOnClick) {
                randomizeScene();
            }
            isDragging = false;
            initialPinchDistance = null;
        });

        // Wheel Zoom
        window.addEventListener('wheel', (e) => {
            if (e.target.tagName !== 'CANVAS') return;

            params.zoom += e.deltaY * 0.004;
            params.zoom = Math.max(0.8, Math.min(params.zoom, 16.0));

            controllers.zoom.updateDisplay();
            updateUniforms();
        }, { passive: true });

        // --- 11. HIDE / SHOW UI WITH "H" KEY ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // --- 12. WINDOW RESIZE HANDLING ---
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth * params.dpr, window.innerHeight * params.dpr);
            postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        });

        // --- 13. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            uniforms.u_time.value = elapsedTime;

            // Apply selected animation mode
            const mode = ANIMATION_MODES[params.animationPreset] || ANIMATION_MODES["Slow Speleothem Drip (Subtle Flow)"];
            const effectiveSpeed = params.speed;

            if (params.animationPreset !== "Static (No Movement)") {
                const autoRotX = Math.sin(elapsedTime * effectiveSpeed * mode.rotSpeedX) * 0.003;
                const autoRotY = Math.cos(elapsedTime * effectiveSpeed * mode.rotSpeedY) * 0.003;
                targetMouseRot.x += autoRotX;
                targetMouseRot.y += autoRotY;
            }

            currentMouseRot.lerp(targetMouseRot, 0.08);
            uniforms.u_mouse_rot.value.copy(currentMouseRot);

            postProcessor.renderScene(scene, camera);
        }

        // Initialize green screen & start loop
        setGreenScreen(params.greenScreen);
        updateUniforms();
        animate();
    </script>
</body>
