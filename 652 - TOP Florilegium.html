<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030604">
  <link rel="icon" href="data:,">
  <title>Florilegium — a living painting</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030604; }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }

</head>
<body>
<canvas aria-label="A living botanical oil painting of cobalt irises, vermilion poppies and delicate golden foliage on black"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

// All assets are procedural; the control panel edits this same configuration.
const settings = {
  seed: 72819,
  flowerDensity: 1,
  species: { iris: 1, poppy: 1, forgetMeNot: 1, cornflower: 1 },
  windStrength: 0.65,
  animationSpeed: 1,
  loopDuration: 48,
  petalDetail: 24,
  goldIntensity: 0.78,
  textureGrain: 0.65,
  backgroundDarkness: 0.91,
  cameraFraming: 1,
  pixelRatio: Math.min(devicePixelRatio || 1, 1.75),
  antialias: true,
  scheme: 'Original',
  color1: '#426dcc', color2: '#de3719', color3: '#435a40',
  color4: '#c6a361', color5: '#687049', color6: '#e4c786',
  backgroundColor: '#07100d', greenscreen: false, invert: false,
  paletteBlend: 0, paletteMode: 0,
  animation: 'Living painting', motionStrength: 1,
  zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0,
  randomizeOnClick: true
};

const schemes = {
  'Original': { colors: ['426dcc','de3719','435a40','c6a361','687049','e4c786'], background: '07100d', blend: 0 },
  'Monochromatic': { colors: ['638eb4','365c82','344c62','9ab5cb','243e53','c2d3df'], background: '060e17' },
  'Analogous': { colors: ['4e79ce','8663b2','38596c','91acb8','344356','c3b8d9'], background: '090e18' },
  'Complementary': { colors: ['316eb0','d47638','476a67','ccae6a','314a4b','e2c697'], background: '080e14' },
  'Split-complementary': { colors: ['477bc3','ce5c48','6c7451','dab75b','404a49','dbcc98'], background: '0b1012' },
  'Triadic': { colors: ['4277bb','c95563','707d47','c9b56c','3f5550','dccd9a'], background: '090f12' },
  'Tetradic': { colors: ['487dbe','ca7545','6c956b','b67a9c','3b5b50','e1c796'], background: '0c1114' },
  'Double split-complementary': { colors: ['497ba9','c48b55','799479','bd7193','6c6698','dbbf86'], background: '0c1017' },
  'Achromatic': { colors: ['ecece7','bdbdb8','858581','c8c8c2','777773','f0f0eb'], background: '080808', mode: 1 },
  'Achromatic + Accent': { colors: ['deded8','ca3225','96968e','c9c9bd','70716b','dfd9c6'], background: '080808', mode: 2 },
  'Neutral + accent': { colors: ['c3b9a4','c7623c','868d78','c6b795','5b6658','e2d6ba'], background: '171c18', mode: 3 },
  'Amber / Oxblood': { colors: ['F6AA1C','BC3908','941B0C','F6AA1C','941B0C','F6AA1C'], background: '220901' },
  'Lagoon / Midnight': { colors: ['63D1CF','5BC0BE','4BAD9E','4BAD9E','0B132B','63D1CF'], background: '000000' },
  'Orchid / Aubergine': { colors: ['AA60C8','D69ADE','C9A3C6','CFB5C2','0D001D','D69ADE'], background: '120A12' },
  'Saffron / Petrol': { colors: ['FEF1BE','FFBA00','008189','FFBA00','00474D','FEF1BE'], background: '061210' },
  'Chartreuse / Forest': { colors: ['D4FFB0','7FFF00','00B894','7FFF00','0A3322','D4FFB0'], background: '05140A' },
  'Tangerine / Plum': { colors: ['FFE8CC','FF8C00','C7501A','FF8C00','3D1050','FFE8CC'], background: '0E0618' },
  'Lavender / Indigo': { colors: ['E8E0FF','B38FFF','6A3DE8','B38FFF','1A1250','E8E0FF'], background: '090612' },
  'Cyan / Magenta': { colors: ['E0FBFF','00F0FF','D40078','00F0FF','1E0A3D','E0FBFF'], background: '05020F' }
};
const animations = [
  'Living painting', 'Evening breeze', 'Lacquer light', 'Slow orbit',
  'Pendulum', 'Drifting study', 'Breathing frame', 'Petal reverie', 'Static'
];

const TAU = Math.PI * 2;
let randomState, aspect, spread, bloomScale, currentWidth = 0, currentHeight = 0;
const random = () => {
  randomState |= 0; randomState = randomState + 0x6D2B79F5 | 0;
  let t = Math.imul(randomState ^ randomState >>> 15, 1 | randomState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
const between = (a, b) => a + (b - a) * random();
const vec = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const color = hex => {
  const n = parseInt(hex.replace('#', ''), 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
};
const palette = {
  blue: ['365fba', '426dcc', '3158af', '547bd0', '24478f', '6788d6'],
  red: ['de3719', 'eb451c', 'c72b13', 'ed4b20', 'c53719'],
  leaf: ['354b38', '435a40', '4e6146', '344c42', '687451'],
  gold: ['ad8846', 'c6a361', '8e723d', 'd2b277'],
  cream: ['e4c786', 'd4b46a', 'f0daa5'],
  stem: ['5f6945', '687049', '43543a']
};
const pick = list => list[Math.floor(random() * list.length)];

const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('canvas'), antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(settings.pixelRatio);
renderer.setClearColor(0x030604);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-8, 8, 5, -5, 0.1, 100);
camera.position.z = 30;
const uniforms = {
  uPhase: { value: 0 }, uWind: { value: settings.windStrength },
  uGold: { value: settings.goldIntensity }, uGrain: { value: settings.textureGrain },
  uDarkness: { value: settings.backgroundDarkness },
  uResolution: { value: new THREE.Vector2() },
  uPalette: { value: Array.from({length: 6}, (_,i)=>new THREE.Vector3(...color(settings['color'+(i+1)]))) },
  uPaletteBlend: { value: 0 }, uPaletteMode: { value: 0 }, uInvert: { value: 0 },
  uBackground: { value: new THREE.Vector3(...color(settings.backgroundColor)) },
  uGreenScreen: { value: 0 }, uPetalMotion: { value: 1 }
};

const paletteGLSL = `
  uniform vec3 uPalette[6];
  uniform float uPaletteBlend,uPaletteMode,uInvert;
  vec3 recolor(vec3 c,vec3 original,float kind,float seed) {
    float lum=dot(c,vec3(.299,.587,.114));
    float base=max(.06,dot(original,vec3(.299,.587,.114)));
    bool red=original.r>original.b*1.4 && original.r>original.g*1.6;
    vec3 target=uPalette[0];
    if(kind<.5) target=red?uPalette[1]:uPalette[0];
    else if(kind<1.5) target=uPalette[2];
    else if(kind<2.5) target=uPalette[4];
    else if(kind<3.5) target=uPalette[3];
    else target=uPalette[5];
    vec3 mapped=target*clamp(lum/base,.12,1.4);
    if(uPaletteMode>.5 && uPaletteMode<2.5) {
      float gray=pow(clamp(lum*1.16,0.,1.),.74);
      mapped=vec3(gray);
      if(uPaletteMode>1.5 && red && kind<.5) mapped=uPalette[1]*clamp(lum/base,.12,1.4);
    }
    vec3 result=mix(c,mapped,uPaletteBlend);
    vec3 inverted=vec3(1.)-result;
    // Both achromatic orientations retain the red pigment in the accent version.
    if(uPaletteMode>1.5 && uPaletteMode<2.5 && red && kind<.5)inverted=result;
    return mix(result,inverted,uInvert);
  }
`;

const noiseGLSL = `
  float hash(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * .1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
               mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
  }
  float fbm(vec2 p) {
    return .57*noise(p) + .28*noise(p*2.07+13.7) + .15*noise(p*4.13+7.3);
  }
`;
// Every vertex on one stalk receives the same root/phase. Leaves, heads, veins,
// stamens and dew therefore stay attached during the periodic world-space bend.
const windGLSL = `
  vec3 bend(vec3 p, vec4 stalk) {
    float h = max(0., p.y - stalk.y);
    float w = sin(uPhase + stalk.z) + .23*sin(2.*uPhase + stalk.z*1.7);
    p.x += uWind * stalk.w * h*h * .0019 * w;
    p.y += uWind * stalk.w * h * .0009 * cos(uPhase + stalk.z);
    return p;
  }
`;
const paintingMaterial = new THREE.ShaderMaterial({
  uniforms, side: THREE.DoubleSide,
  vertexShader: `
    uniform float uPhase, uWind, uPetalMotion;
    attribute vec3 pigment;
    attribute vec4 stalk;
    attribute float kind, seed;
    varying vec2 vUv;
    varying vec3 vColor, vNormal, vPosition;
    varying float vKind, vSeed;
    ${windGLSL}
    void main() {
      vUv=uv; vColor=pigment; vKind=kind; vSeed=seed;
      vNormal=normalize(normalMatrix*normal);
      vec3 p=position;
      if(kind < .5) {
        float flex=pow(uv.y,2.) * .009 * uPetalMotion;
        p.z += flex*sin(uPhase+seed+uv.x*3.1);
        p.x += flex*.3*sin(2.*uPhase+seed);
      }
      p=bend(p,stalk); vPosition=p;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uPhase, uGold, uGrain;
    varying vec2 vUv;
    varying vec3 vColor, vNormal, vPosition;
    varying float vKind, vSeed;
    ${noiseGLSL}
    ${paletteGLSL}
    void main() {
      vec2 uv=vUv;
      float s=vSeed;
      float cloud=fbm(uv*vec2(8.,11.)+s);
      float grain=hash(gl_FragCoord.xy+fract(s)*71.);
      float weave=(sin(gl_FragCoord.x*2.8)*sin(gl_FragCoord.y*2.6))*.014;
      float brush=noise(vec2(uv.x*76.+s,uv.y*13.));
      float filament=sin(uv.x*103.+noise(vec2(uv.y*4.,s))*1.8+sin(uv.y*11.+s)*.35);
      float fine=sin(uv.x*249.+noise(vec2(uv.y*9.,s))*2.);
      vec3 n=normalize(vNormal);
      float diffuse=abs(dot(n,normalize(vec3(-.38,.55,1.))));
      vec3 col=vColor;
      float shade=.52 + .45*diffuse + .29*(cloud-.5);
      if(vKind < .5) {
        float rim=smoothstep(.76,1.,abs(uv.x*2.-1.));
        float veins=pow(.5+.5*filament,13.);
        float strokes=(brush-.5)*.13 + filament*.015 + fine*.006;
        float folds=noise(vec2(uv.x*12.+s,uv.y*2.3));
        float crease=pow(.5+.5*sin(uv.x*23.+sin(uv.y*5.+s)*1.5+s),12.);
        shade+=strokes-rim*.19 + (folds-.5)*.32;
        shade-=crease*.20*(.3+.7*uv.y);
        shade*=.88+.16*hash(vec2(s,3.));
        col*=shade;
        col+=vec3(.11,.14,.19)*veins*(.09+.18*uv.y);
        // Sparse, broken pigment deposits give the veins a painted edge.
        col-=vec3(.045,.04,.03)*pow(.5+.5*fine,16.)*cloud;
        float throat=(1.-smoothstep(.10,.39,uv.y));
        float flame=step(.52,noise(vec2(uv.x*24.+s,uv.y*4.)));
        if(vColor.b>vColor.r*1.3) {
          col=mix(col,vec3(.89,.35,.065),throat*flame*.93);
          col+=vec3(.06,.085,.13)*pow(uv.y,2.)*brush;
        } else {
          col*=.51+.49*smoothstep(0.,.66,uv.y);
          col=mix(col,col*vec3(.48,.31,.24),crease*.33);
          col+=vec3(.13,.038,.004)*smoothstep(.54,.87,folds)*uv.y;
          col+=vec3(.04,.013,.002)*veins;
        }
      } else if(vKind < 1.5) {
        float mid=exp(-abs(uv.x-.5)*210.);
        float side=pow(.5+.5*cos(uv.y*77.-abs(uv.x-.5)*38.),25.);
        float edge=smoothstep(.87,1.,abs(uv.x*2.-1.));
        col*=shade*.85+(brush-.5)*.30;
        col=mix(col,vec3(.58,.47,.24),(.38*mid+.17*side+edge*.20)*uGold);
      } else if(vKind < 2.5) {
        col*=.65+.40*diffuse+(brush-.5)*.36;
        float stripe=pow(.5+.5*sin(uv.x*39.),6.);
        col=mix(col,vec3(.58,.47,.25),stripe*.23*uGold);
      } else if(vKind < 3.5) {
        float foil=fbm(vPosition.xy*38.+s);
        float glint=.5+.5*sin(uPhase+vPosition.x*.46+vPosition.y*.28);
        col*=.60+.40*foil+uGold*.24*glint;
        col+=vec3(.12,.09,.035)*pow(grain,9.)*uGold;
      } else {
        col*=shade+(brush-.5)*.25;
      }
      col+=(grain-.5)*.045*uGrain + weave*uGrain;
      col*=1.+.009*sin(uPhase+s);
      col=recolor(col,vColor,vKind,vSeed);
      gl_FragColor=vec4(max(col,vec3(0.)),1.);
    }
  `
});

// The canvas ground is itself a shader: near-black lacquer, not a flat fill.
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({
  uniforms, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy, .999, 1.);}`,
  fragmentShader: `
    precision highp float;
    uniform float uGrain,uDarkness,uGreenScreen,uInvert;
    uniform vec3 uBackground;
    uniform vec2 uResolution;
    varying vec2 vUv;
    ${noiseGLSL}
    void main(){
      if(uGreenScreen>.5){gl_FragColor=vec4(0.,1.,0.,1.);return;}
      vec2 p=vUv;
      float light=pow(max(0.,1.-length((p-vec2(.48,.45))*1.32)),2.);
      float patina=fbm(p*vec2(19.,23.));
      vec3 col=uBackground*(.73+.27*light);
      col+=(patina-.5)*.025*uGrain;
      col*=1.9-uDarkness;
      float grain=hash(gl_FragCoord.xy);
      float linen=sin(gl_FragCoord.x*2.6)*sin(gl_FragCoord.y*2.8);
      col+=(grain-.5)*.034*uGrain+linen*.003;
      col+=pow(grain,65.)*.035;
      col=mix(col,vec3(1.)-col,uInvert);
      gl_FragColor=vec4(max(col,0.),1.);
    }
  `
}));
ground.frustumCulled=false; ground.renderOrder=-100; scene.add(ground);

// MSAA resolves geometry edges first; FXAA then catches fine vein/foil aliasing.
const paintingTarget=new THREE.WebGLRenderTarget(1,1,{
  minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
  samples:Math.min(4,renderer.capabilities.maxSamples)
});
const postScene=new THREE.Scene(),postCamera=new THREE.Camera();
const postMaterial=new THREE.ShaderMaterial({
  depthTest:false,depthWrite:false,
  uniforms:{tColor:{value:paintingTarget.texture},uTexel:{value:new THREE.Vector2(1,1)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
    precision highp float;
    uniform sampler2D tColor;
    uniform vec2 uTexel;
    varying vec2 vUv;
    void main(){
      vec3 nw=texture2D(tColor,vUv+vec2(-1.,1.)*uTexel).rgb;
      vec3 ne=texture2D(tColor,vUv+vec2(1.,1.)*uTexel).rgb;
      vec3 sw=texture2D(tColor,vUv+vec2(-1.,-1.)*uTexel).rgb;
      vec3 se=texture2D(tColor,vUv+vec2(1.,-1.)*uTexel).rgb;
      vec3 mid=texture2D(tColor,vUv).rgb;
      vec3 luma=vec3(.299,.587,.114);
      float lnw=dot(nw,luma),lne=dot(ne,luma),lsw=dot(sw,luma),lse=dot(se,luma),lm=dot(mid,luma);
      float lo=min(lm,min(min(lnw,lne),min(lsw,lse)));
      float hi=max(lm,max(max(lnw,lne),max(lsw,lse)));
      if(hi-lo<max(.018,hi*.12)){gl_FragColor=vec4(mid,1.);return;}
      vec2 dir=vec2(-((lnw+lne)-(lsw+lse)),((lnw+lsw)-(lne+lse)));
      float reduction=max((lnw+lne+lsw+lse)*.03125,.0078125);
      float rcp=1./(min(abs(dir.x),abs(dir.y))+reduction);
      dir=clamp(dir*rcp,vec2(-6.),vec2(6.))*uTexel;
      vec3 a=.5*(texture2D(tColor,vUv+dir*(-1./6.)).rgb+texture2D(tColor,vUv+dir*(1./6.)).rgb);
      vec3 b=a*.5+.25*(texture2D(tColor,vUv+dir*(-.5)).rgb+texture2D(tColor,vUv+dir*.5).rgb);
      float lb=dot(b,luma);
      gl_FragColor=vec4(lb<lo||lb>hi?a:b,1.);
    }
  `
});
const postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMaterial);
postQuad.frustumCulled=false;postScene.add(postQuad);
function renderPainting(){
  if(settings.antialias){
    renderer.setRenderTarget(paintingTarget);renderer.render(scene,camera);
    renderer.setRenderTarget(null);renderer.render(postScene,postCamera);
  }else renderer.render(scene,camera);
}

// One merged draw for all opaque botanical surfaces; one instanced draw for dew.
class PaintBatch {
  constructor() { this.p=[]; this.n=[]; this.uv=[]; this.c=[]; this.k=[]; this.s=[]; this.st=[]; this.i=[]; }
  add(geometry, matrix, hex, kind, stalk, seed=between(0,100)) {
    geometry.applyMatrix4(matrix);
    const p=geometry.attributes.position, n=geometry.attributes.normal, uv=geometry.attributes.uv;
    const offset=this.p.length/3, c=color(hex);
    for(let j=0;j<p.count;j++) {
      this.p.push(p.getX(j),p.getY(j),p.getZ(j));
      this.n.push(n.getX(j),n.getY(j),n.getZ(j));
      this.uv.push(uv?uv.getX(j):0,uv?uv.getY(j):0);
      this.c.push(...c); this.k.push(kind); this.s.push(seed); this.st.push(...stalk);
    }
    if(geometry.index) for(const index of geometry.index.array) this.i.push(index+offset);
    else for(let j=0;j<p.count;j++) this.i.push(offset+j);
    geometry.dispose();
  }
  mesh() {
    const g=new THREE.BufferGeometry();
    for(const [name,array,size] of [['position',this.p,3],['normal',this.n,3],['uv',this.uv,2],['pigment',this.c,3],['kind',this.k,1],['seed',this.s,1],['stalk',this.st,4]])
      g.setAttribute(name,new THREE.Float32BufferAttribute(array,size));
    g.setIndex(this.i); g.computeBoundingSphere();
    return new THREE.Mesh(g,paintingMaterial);
  }
}
let batch, art, dewData=[];
const identity = new THREE.Matrix4();
function transform(x,y,z,rx=0,ry=0,rz=0,sx=1,sy=sx,sz=sx) {
  return new THREE.Matrix4().compose(vec(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)),vec(sx,sy,sz));
}
function surfacePoint(u,v,length,width,curl,ruffle,seed,shape) {
  const envelope=Math.pow(Math.max(0,Math.sin(Math.PI*Math.pow(v,.88))),shape==='pointed'?.94:.56);
  const edge=1.+ruffle*(.55*Math.sin(v*24.+seed)+.30*Math.sin(v*43.+seed*2.));
  let x=u*width*envelope*edge;
  let y=v*length;
  let z=curl*u*u*v + .065*length*Math.sin(v*Math.PI);
  z+=ruffle*length*.22*Math.pow(Math.abs(u),1.7)*v*Math.sin(u*11.+v*16.+seed);
  z+=.009*length*Math.sin(u*24.+v*5.+seed)*Math.sin(Math.PI*v);
  y+=Math.pow(v,4.)*ruffle*length*.09*Math.cos(u*14.+seed);
  if(shape==='iris') { x*=1.+.17*Math.sin(v*11.+seed); z+=.13*length*Math.sin(v*5.)*u; }
  if(shape==='poppy') {
    z+=.10*length*Math.sin(u*7.+v*5.+seed)*v;
    z+=.026*length*Math.sin(u*19.+v*11.+seed)*v;
    x+=.055*length*Math.sin(v*5.+seed)*v;
  }
  if(shape==='leaf') {
    x*=1.+.10*Math.sin(v*46.+seed); z+=.12*length*Math.abs(u)*Math.sin(v*8.);
  }
  return vec(x,y,z);
}
function petal({x,y,z,length,width,angle=0,rx=0,ry=0,curl=.1,ruffle=.1,hex,stalk,shape='round',kind=0,dew=0}) {
  const seed=between(0,100), cols=Math.max(10,Math.round(settings.petalDetail*.75)), rows=settings.petalDetail+8;
  const vertices=[],uvs=[],indices=[];
  for(let j=0;j<=rows;j++) for(let i=0;i<=cols;i++) {
    const u=i/cols*2-1,v=j/rows;
    const p=surfacePoint(u,v,length,width,curl,ruffle,seed,shape);
    vertices.push(p.x,p.y,p.z); uvs.push(i/cols,v);
  }
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) {
    const a=j*(cols+1)+i,b=a+cols+1;
    indices.push(a,a+1,b,a+1,b+1,b);
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
  geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  geometry.setIndex(indices); geometry.computeVertexNormals();
  const matrix=transform(x,y,z,rx,ry,angle);
  batch.add(geometry,matrix,hex,kind,stalk,seed);
  for(let i=0;i<dew;i++) {
    const u=between(-.72,.72),v=between(.34,.85);
    const p=surfacePoint(u,v,length,width,curl,ruffle,seed,shape);
    p.z+=.014; p.applyMatrix4(matrix);
    dewData.push({p,r:between(.012,.029)*Math.sqrt(length),stalk,seed});
  }
  return {matrix,seed};
}

function stroke(points,radius,hex,kind,stalk,segments=36) {
  const curve=new THREE.CatmullRomCurve3(points);
  const g=new THREE.TubeGeometry(curve,segments,radius,5,false);
  batch.add(g,identity,hex,kind,stalk);
  return curve;
}
function bead(x,y,z,radius,hex,kind,stalk,scaleY=1) {
  const g=new THREE.SphereGeometry(radius,7,5);
  batch.add(g,transform(x,y,z,0,0,0,1,scaleY,1),hex,kind,stalk);
}
function makeLeaf(p,length,angle,stalk,gold=false,width=.23) {
  const hex=pick(gold?palette.gold:palette.leaf);
  const leaf=petal({x:p.x,y:p.y,z:p.z,length,width:length*width,angle,rx:between(-.4,.4),ry:between(-.35,.35),
    curl:length*.13,ruffle:.12,hex,stalk,shape:'leaf',kind:gold?3:1,dew:gold?0:Math.floor(between(0,3))});
  const pts=[];
  for(let i=0;i<=12;i++) {
    const v=i/12;
    pts.push(surfacePoint(0,v,length,length*width,length*.13,.12,leaf.seed,'leaf').add(vec(0,0,.012)).applyMatrix4(leaf.matrix));
  }
  stroke(pts,.0045, gold?'e0c285':'9d905c',3,stalk,16);
  if(gold && length>.45) for(let j=2;j<9;j++) for(const side of [-1,1]) {
    const pts=[];
    for(let i=0;i<6;i++) {
      const t=i/5,v=j/10+t*.13,u=side*t*.86;
      pts.push(surfacePoint(u,v,length,length*width,length*.13,.12,leaf.seed,'leaf').add(vec(0,0,.014)).applyMatrix4(leaf.matrix));
    }
    stroke(pts,.0025,'68512e',3,stalk,7);
  }
}
function makeStem(x,y,z,rootX,stalk,leafCount=4) {
  const root=vec(rootX,-5.65,z-.35);
  const bow=between(-.48,.48)*spread;
  const curve=stroke([root,vec(rootX+(x-rootX)*.12+bow,-3.2,z-.23),vec(x-.15-bow,(y-3.2)*.47,z-.08),vec(x,y,z)],
    between(.017,.027),pick(palette.stem),2,stalk,65);
  // A broken, fine gold edge is the illuminated brushstroke along each stem.
  const contour=[];
  for(let i=0;i<=35;i++) contour.push(curve.getPoint(i/35).add(vec(-.013,.0,.018)));
  stroke(contour,.0036,'a18c50',3,stalk,35);
  for(let j=0;j<leafCount;j++) {
    const t=.17+j/(leafCount+1)*.62;
    const p=curve.getPoint(t); p.z+=.015;
    const direction=j%2?1:-1;
    makeLeaf(p,between(.64,1.33)*bloomScale,direction*between(.48,1.12),stalk,j%5===1,between(.13,.25));
  }
  return curve;
}
function stamens(x,y,z,radius,stalk,type='poppy') {
  const poppy=type==='poppy',count=poppy?76:32;
  // Golden filaments are individual curved strokes, not a glowing center disc.
  for(let i=0;i<count;i++) {
    const a=i*2.399963+between(-.12,.12), r=radius*between(.50,1.28),
      px=x+Math.cos(a)*r,py=y+Math.sin(a)*r*.83;
    stroke([vec(x+Math.cos(a)*radius*.2,y+Math.sin(a)*radius*.2,z-.025),
      vec(px,py,z+between(.02,.10))],between(.004,.007),pick(palette.cream),4,stalk,3);
    bead(px,py,z+.06,between(.010,.019),pick(palette.cream),4,stalk,1.35);
  }
  bead(x,y,z+.035,radius*.43,poppy?'545a35':'aa4c16',4,stalk,.86);
  for(let i=0;i<(poppy?12:8);i++) {
    const a=TAU*i/(poppy?12:8),r=radius*.38;
    stroke([vec(x,y,z+.105),vec(x+Math.cos(a)*r,y+Math.sin(a)*r*.8,z+.07)],.005,'b4a35c',3,stalk,3);
  }
}
function makePoppy(x,y,z,size,stalk) {
  const rotation=between(-.8,.8);
  for(let layer=0;layer<2;layer++) {
    const count=layer===0?5:4;
    for(let i=0;i<count;i++) {
      const a=rotation+TAU*i/count+layer*.64+between(-.16,.16);
      petal({x:x+Math.sin(a)*.025,y:y-Math.cos(a)*.025,z:z+layer*.09,
        length:size*between(.80,1.18)*(layer?.76:1),width:size*between(.47,.68),
        angle:a,rx:between(-.37,.38),ry:between(-.34,.34),curl:size*between(.18,.46),ruffle:.19,
        hex:pick(palette.red),stalk,shape:'poppy',dew:random()<.55?2:0});
    }
  }
  stamens(x,y,z+.30,size*.20,stalk);
}
function makeIris(x,y,z,size,stalk) {
  const roll=between(-.48,.48);
  // Three broad hanging falls, three erect folded standards, and small crests.
  for(let i=0;i<3;i++) {
    const a=roll+Math.PI+TAU*i/3;
    petal({x,y,z:z+i*.022,length:size*between(.86,1.03),width:size*between(.42,.53),angle:a,
      rx:between(-.32,.22),ry:between(-.22,.22),curl:size*.20,ruffle:.16,hex:pick(palette.blue),stalk,shape:'iris',dew:3});
  }
  for(let i=0;i<3;i++) {
    const a=roll+(i-1)*.73;
    petal({x:x+(i-1)*size*.08,y:y+.02,z:z+.19+i*.015,length:size*between(.83,1.04),width:size*between(.24,.35),
      angle:a,rx:between(.1,.5),ry:(i-1)*.5,curl:size*.45,ruffle:.13,hex:pick(palette.blue),stalk,shape:'iris',dew:2});
  }
  for(let i=0;i<3;i++) {
    const a=roll+Math.PI+TAU*i/3;
    petal({x,y,z:z+.36,length:size*.48,width:size*.09,angle:a,rx:.4,ry:.15,curl:size*.17,ruffle:.14,
      hex:i===1?'a1afd9':'819bce',stalk,shape:'iris'});
    const dx=-Math.sin(a),dy=Math.cos(a);
    for(let j=0;j<14;j++) {
      const t=j/14;
      bead(x+dx*size*t*.47+between(-.015,.015),y+dy*size*t*.47,z+.40+Math.sin(t*Math.PI)*size*.08,
        size*between(.008,.015),'e2a33a',4,stalk,1.4);
    }
  }
}
function makeForget(x,y,z,size,stalk) {
  const a0=between(0,TAU);
  for(let i=0;i<5;i++) petal({x,y,z:z+i*.005,length:size,width:size*.49,angle:a0+TAU*i/5,
    curl:size*.12,ruffle:.10,hex:pick(palette.blue),stalk,dew:random()<.5?1:0});
  for(let i=0;i<9;i++) {
    const a=i*TAU/9;
    bead(x+Math.cos(a)*size*.14,y+Math.sin(a)*size*.14,z+.08,size*.054,'dd8125',4,stalk,1.4);
  }
  bead(x,y,z+.085,size*.095,'933714',4,stalk);
  bead(x,y,z+.11,size*.038,'343d26',4,stalk);
}
function makeCornflower(x,y,z,size,stalk) {
  for(let ring=0;ring<3;ring++) {
    const count=ring===0?19:13;
    for(let i=0;i<count;i++) {
      const a=i*TAU/count+ring*.19;
      const px=x-Math.sin(a)*size*.14,py=y+Math.cos(a)*size*.14;
      petal({x:px,y:py,z:z+ring*.055,length:size*between(.57,.87)*(1.-ring*.18),width:size*between(.09,.16),
        angle:a,rx:between(-.1,.3),ry:between(-.2,.2),curl:size*.18,ruffle:.22,
        hex:pick(['315ba9','286bc6','4483d2','4379c2','6698db']),stalk,shape:'pointed',dew:i%9===0?1:0});
    }
  }
  for(let i=0;i<18;i++) {
    const a=between(0,TAU),r=between(0,size*.21);
    bead(x+Math.cos(a)*r,y+Math.sin(a)*r,z+.23,size*.023,'b4b799',4,stalk,2.8);
  }
}
function makeBud(x,y,z,size,stalk,angle=.15) {
  const g=new THREE.SphereGeometry(1,13,16);
  batch.add(g,transform(x,y,z,0,0,angle,size*.26,size*.47,size*.23),'405c46',1,stalk);
  for(let i=0;i<7;i++) {
    const a=TAU*i/7;
    stroke([vec(x+Math.sin(a)*size*.19,y-size*.30,z+.04),vec(x+Math.sin(a)*size*.27,y,z+size*.18),vec(x+Math.sin(a)*size*.13,y+size*.37,z+.04)],
      .004,'a18e52',3,stalk,12);
  }
}

function plant(type,x,y,size,z,root,leafCount=4) {
  x+=between(-.20,.20);y+=between(-.16,.16);size*=between(.89,1.11);
  x*=spread; root*=spread; size*=bloomScale;
  const stalk=[root,-5.65,between(0,TAU),between(.7,1.15)];
  const curve=makeStem(x,y,z,root,stalk,leafCount);
  if(type==='iris') makeIris(x,y,z,size,stalk);
  if(type==='poppy') makePoppy(x,y,z,size,stalk);
  if(type==='cornflower') makeCornflower(x,y,z,size,stalk);
  if(type==='bud') makeBud(x,y,z,size,stalk);
  return {x,y,z,size,stalk,curve};
}
function forgetBranch(x,y,z,root) {
  const p=plant('stem',x,y,.4,z,root,3);
  const count=Math.round(7*settings.flowerDensity*settings.species.forgetMeNot);
  for(let i=0;i<count;i++) {
    const a=i*2.399963, r=Math.sqrt(i)*.29*bloomScale;
    const px=p.x+Math.cos(a)*r,py=y+Math.sin(a)*r*.7;
    stroke([p.curve.getPoint(.82),vec(px-.08,py-.25,z),vec(px,py,z+.05)],.010,'626b45',2,p.stalk,14);
    makeForget(px,py,z+.07+i*.012,between(.22,.31)*bloomScale,p.stalk);
  }
}

function goldSprig(x,y,length,angle,z) {
  x*=spread; length*=bloomScale;
  const stalk=[x,-5.65,between(0,TAU),.45];
  const end=vec(x-Math.sin(angle)*length,y+Math.cos(angle)*length,z);
  const curve=stroke([vec(x,y,z),vec(x-Math.sin(angle)*length*.2+.14,y+Math.cos(angle)*length*.45,z),end],
    .007,pick(palette.gold),3,stalk,35);
  for(let i=1;i<9;i++) {
    const t=i/10,p=curve.getPoint(t);
    makeLeaf(p,length*.18*(1.-t*.6),angle+(i%2?.8:-.8),stalk,true,.25);
  }
}
function ornaments() {
  const width=10*aspect;
  const staticStalk=[0,-6,0,0];
  // Low, meandering gold contours enter and leave the canvas like lacquer inlay.
  // Their ends are outside the frame; they never form a rectangular border.
  for(let line=0;line<7;line++) {
    const pts=[];
    for(let j=0;j<=100;j++) {
      const t=j/100,x=(t-.5)*width*1.3;
      const y=-4.9+.31*Math.sin(t*8.+.6)+.13*Math.sin(t*21.)+line*.043;
      pts.push(vec(x,y,-2.7));
    }
    stroke(pts,line===0?.009:.0035,line===0?'95783f':'6b5933',3,staticStalk,100);
  }
  for(let i=0;i<9;i++) {
    const side=i%2?1:-1;
    goldSprig(side*between(2.9,5.9),between(-4.7,-2.3),between(1.0,2.5),side*between(-.9,-.3),-1.8);
  }
  // Tiny discontinuous foil flecks, concentrated near the foot of the bouquet.
  for(let i=0;i<180;i++) {
    const x=between(-width*.46,width*.46),y=between(-5.4,-2.1);
    if(random()>.65+(y+5.4)*.07) {
      const g=new THREE.CircleGeometry(between(.003,.013),3);
      batch.add(g,transform(x,y,-2.3,0,0,between(0,TAU)),pick(palette.gold),3,staticStalk);
    }
  }
}

function makeDew() {
  const g=new THREE.SphereGeometry(1,9,7);
  const stalks=new Float32Array(dewData.length*4),seeds=new Float32Array(dewData.length);
  dewData.forEach((d,i)=>{stalks.set(d.stalk,i*4);seeds[i]=d.seed;});
  g.setAttribute('dewStalk',new THREE.InstancedBufferAttribute(stalks,4));
  g.setAttribute('dewSeed',new THREE.InstancedBufferAttribute(seeds,1));
  const material=new THREE.ShaderMaterial({
    uniforms, transparent:true, depthWrite:false,
    vertexShader:`
      uniform float uPhase,uWind;
      attribute vec4 dewStalk;
      attribute float dewSeed;
      varying vec3 vN;
      varying float vSeed;
      ${windGLSL}
      void main(){
        vN=normal;vSeed=dewSeed;
        vec3 p=(instanceMatrix*vec4(position,1.)).xyz;
        p=bend(p,dewStalk);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
      }
    `,
    fragmentShader:`
      precision highp float;
      uniform float uPhase;
      varying vec3 vN;
      varying float vSeed;
      void main(){
        vec3 n=normalize(vN);
        vec3 l=normalize(vec3(-.45+.07*sin(uPhase),.62,1.));
        float glint=pow(max(0.,dot(n,l)),58.);
        float edge=pow(1.-abs(n.z),3.);
        float caustic=pow(max(0.,dot(n,normalize(vec3(.5,-.7,.4)))),18.);
        vec3 c=mix(vec3(.06,.13,.16),vec3(.88,.87,.70),glint);
        c+=caustic*vec3(.23,.31,.37);
        gl_FragColor=vec4(c,.10+edge*.35+glint*.57+caustic*.19);
      }
    `
  });
  const mesh=new THREE.InstancedMesh(g,material,dewData.length);
  dewData.forEach((d,i)=>mesh.setMatrixAt(i,transform(d.p.x,d.p.y,d.p.z,0,0,0,d.r,d.r*1.08,d.r*.55)));
  mesh.instanceMatrix.needsUpdate=true;
  mesh.frustumCulled=false;
  mesh.renderOrder=2;
  return mesh;
}

function buildPainting() {
  if(art) {
    scene.remove(art);
    art.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material!==paintingMaterial)o.material.dispose();});
  }
  randomState=settings.seed;
  spread=Math.min(1.22,Math.max(.35,aspect*.68));
  bloomScale=Math.min(1,Math.max(.56,aspect*.77));
  batch=new PaintBatch(); dewData=[]; art=new THREE.Group();
  ornaments();
  // Back-to-front placement gives the painting natural, legible overlaps.
  const buds=[[-3.9,3.45,.52,-.95], [3.25,3.9,.43,.6], [5.3,1.3,.46,1.4],[-1.55,2.6,.38,-.4],[3.8,-.3,.43,1.1]];
  for(const [x,y,s,root] of buds) plant('bud',x,y,s,-.9,root,3);
  if(settings.species.cornflower>0) {
    for(const [x,y,s,root] of [[-.25,3.5,.6,-.3],[-3.8,1.35,.63,-.8],[2.75,1.75,.62,.3],[4.2,-1.9,.59,.8],[-1.8,-1.2,.58,-.4]])
      if(random()<=settings.species.cornflower*settings.flowerDensity) plant('cornflower',x,y,s,-.42,root,3);
  }
  if(settings.species.forgetMeNot>0) {
    forgetBranch(-4.4,-.25,-.3,-.7);
    forgetBranch(4.35,.55,-.1,.75);
    forgetBranch(-.75,2.40,-.4,-.5);
  }
  const flowers=[
    ['poppy',-2.65,2.87,1.04,.08,-.8,5],
    ['iris',1.27,3.07,1.08,.22,.38,4],
    ['iris',3.40,1.00,1.02,.40,.65,5],
    ['poppy',-4.14,-1.43,.82,.35,-1.0,3],
    ['poppy',.38,.52,1.06,.65,-.25,5],
    ['iris',-1.86,-.65,1.10,.88,-.3,4],
    ['poppy',3.36,-2.17,.91,1.02,.68,4],
    ['iris',.90,-2.64,1.06,1.15,.1,3]
  ];
  flowers.forEach(args=>{if(random()<=settings.species[args[0]]*settings.flowerDensity) plant(...args);});
  // Fine, crimson satellite blossoms, kept subordinate to the larger flowers.
  for(let j=0;j<Math.round(2*settings.flowerDensity);j++) {
    const x=(j?2.16:-3.05)*spread,y=j?-1.0:.35,z=1.3;
    const stalk=[x*.2,-5.65,between(0,TAU),.8];
    const curve=makeStem(x,y,z,x*.2,stalk,3);
    for(let i=0;i<3;i++) {
      const px=x+(i-1)*.27*bloomScale,py=y+(i===1?.27:0);
      stroke([curve.getPoint(.92),vec(px,py,z)],.009,'5a6040',2,stalk,9);
      for(let k=0;k<4;k++) petal({x:px,y:py,z:z+.02,length:.28*bloomScale,width:.14*bloomScale,
        angle:k*TAU/4+between(-.2,.2),curl:.06,ruffle:.14,hex:'c94323',stalk});
      bead(px,py,z+.09,.035*bloomScale,'d2a04b',4,stalk);
    }
  }
  // Engraved basal foliage, including a few broad gold leaves.
  for(let i=0;i<20;i++) {
    const x=between(-2.25,2.25)*spread,y=between(-5.7,-4.05);
    const stalk=[x,-5.9,between(0,TAU),.6];
    makeLeaf(vec(x,y,1.45),between(.85,1.8)*bloomScale,between(-1.4,1.4),stalk,i%4===0,between(.22,.34));
  }
  art.add(batch.mesh()); art.add(makeDew()); scene.add(art);
  batch=null;
}

function resize() {
  const w=innerWidth,h=innerHeight;
  if(w===currentWidth&&h===currentHeight)return;
  const previousAspect=aspect;
  currentWidth=w;currentHeight=h;aspect=w/h;
  const halfH=5.25*settings.cameraFraming;
  camera.left=-halfH*aspect;camera.right=halfH*aspect;
  camera.top=halfH;camera.bottom=-halfH;camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
  renderer.getDrawingBufferSize(uniforms.uResolution.value);
  paintingTarget.setSize(uniforms.uResolution.value.x,uniforms.uResolution.value.y);
  postMaterial.uniforms.uTexel.value.set(1/uniforms.uResolution.value.x,1/uniforms.uResolution.value.y);
  if(!art || Math.abs(previousAspect-aspect)>.025) buildPainting();
}
let resizeTimer;
addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,120);});
resize();

function updateColors(){
  for(let i=0;i<6;i++)uniforms.uPalette.value[i].set(...color(settings['color'+(i+1)]));
  uniforms.uPaletteBlend.value=settings.paletteBlend;
  uniforms.uPaletteMode.value=settings.paletteMode;
  uniforms.uInvert.value=settings.invert?1:0;
  uniforms.uBackground.value.set(...color(settings.backgroundColor));
  uniforms.uGreenScreen.value=settings.greenscreen?1:0;
}
function applyScheme(name){
  const preset=schemes[name];
  settings.scheme=name;
  preset.colors.forEach((hex,i)=>settings['color'+(i+1)]='#'+hex);
  settings.backgroundColor='#'+preset.background;
  settings.paletteBlend=preset.blend??1;settings.paletteMode=preset.mode??0;
  updateColors();
  if(gui)gui.controllersRecursive().forEach(c=>c.updateDisplay());
}

// Automatic camera offsets never overwrite zoom, angles, or the user's pan.
// Every path is periodic; even the orbit uses integer harmonics of one phase.
const cameraTarget=vec(0,0,0);
function updateMotion(phase){
  const strength=settings.motionStrength,mode=settings.animation;
  let autoYaw=0,autoPitch=0,autoRoll=0,autoX=0,autoY=0,autoZoom=1;
  let wind=1,flutter=1;
  switch(mode){
    case 'Evening breeze':wind=1.6;flutter=1.35;break;
    case 'Lacquer light':wind=.16;flutter=.15;break;
    case 'Slow orbit':
      autoYaw=Math.sin(phase)*9;autoPitch=Math.cos(phase)*3.5;wind=.65;break;
    case 'Pendulum':
      autoYaw=Math.sin(phase)*5;autoRoll=Math.sin(phase)*1.1;wind=.65;break;
    case 'Drifting study':
      autoX=Math.sin(phase)*.24;autoY=Math.cos(phase)*.15;autoYaw=Math.sin(phase)*2;break;
    case 'Breathing frame':autoZoom=1.+.038*strength*Math.sin(phase);wind=.7;break;
    case 'Petal reverie':wind=.40;flutter=2.3;break;
    case 'Static':wind=0;flutter=0;phase=0;break;
  }
  uniforms.uPhase.value=phase;
  uniforms.uWind.value=settings.windStrength*wind*strength;
  uniforms.uPetalMotion.value=flutter*strength;
  uniforms.uGold.value=settings.goldIntensity;
  uniforms.uGrain.value=settings.textureGrain;
  uniforms.uDarkness.value=settings.backgroundDarkness;
  const yaw=THREE.MathUtils.degToRad(settings.yaw+autoYaw*strength);
  const pitch=THREE.MathUtils.degToRad(settings.pitch+autoPitch*strength);
  cameraTarget.set(settings.panX+autoX*strength,settings.panY+autoY*strength,0);
  camera.position.set(
    cameraTarget.x+Math.sin(yaw)*Math.cos(pitch)*30,
    cameraTarget.y+Math.sin(pitch)*30,
    Math.cos(yaw)*Math.cos(pitch)*30
  );
  camera.up.set(0,1,0);camera.lookAt(cameraTarget);
  camera.rotateZ(THREE.MathUtils.degToRad(settings.roll+autoRoll*strength));
  const zoom=settings.zoom*autoZoom;
  if(Math.abs(camera.zoom-zoom)>1e-7){camera.zoom=zoom;camera.updateProjectionMatrix();}
}

let gui;
function randomizeTheme(){
  const roll=(a,b)=>a+Math.random()*(b-a);
  settings.seed=Math.floor(Math.random()*2147483647);
  settings.flowerDensity=roll(.73,1.24);
  settings.species.iris=roll(.82,1.2);settings.species.poppy=roll(.82,1.2);
  settings.species.cornflower=roll(.65,1.2);settings.species.forgetMeNot=roll(.72,1.2);
  settings.windStrength=roll(.3,.95);settings.motionStrength=roll(.55,1.12);
  settings.animationSpeed=roll(.55,1.05);settings.loopDuration=Math.round(roll(38,60));
  settings.goldIntensity=roll(.40,1.05);settings.textureGrain=roll(.35,.76);
  settings.petalDetail=Math.round(roll(20,29));
  settings.animation=animations[Math.floor(Math.random()*(animations.length-1))];
  const names=Object.keys(schemes);
  applyScheme(names[Math.floor(Math.random()*names.length)]);
  buildPainting();
  gui.controllersRecursive().forEach(c=>c.updateDisplay());
}

gui=new GUI({title:'Florilegium'});
gui.add(settings,'scheme',Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
gui.add(settings,'animation',animations).name('Animation');
gui.add(settings,'randomizeOnClick').name('Randomize on click');
gui.add({randomize:randomizeTheme},'randomize').name('New variation');
const colorsFolder=gui.addFolder('Colors');
const labels=['Primary flowers','Secondary flowers','Foliage','Metallic details','Stems','Flower centers'];
for(let i=1;i<=6;i++)colorsFolder.addColor(settings,'color'+i).name(labels[i-1]).onChange(()=>{
  settings.paletteBlend=1;
  if(settings.paletteMode===1||settings.paletteMode===2)settings.paletteMode=0;
  updateColors();
});
colorsFolder.add(settings,'paletteBlend',0,1,.01).name('Palette blend').onChange(updateColors);
colorsFolder.add(settings,'invert').name('Invert colors').onChange(updateColors);
colorsFolder.addColor(settings,'backgroundColor').name('Background').onChange(updateColors);
colorsFolder.add(settings,'greenscreen').name('Greenscreen #00ff00').onChange(updateColors);
colorsFolder.close();
const motionFolder=gui.addFolder('Motion');
motionFolder.add(settings,'animationSpeed',0,3,.01).name('Animation speed');
motionFolder.add(settings,'motionStrength',0,2,.01).name('Motion strength');
motionFolder.add(settings,'windStrength',0,2,.01).name('Breeze');
motionFolder.add(settings,'loopDuration',30,90,1).name('Loop duration');
motionFolder.close();
const cameraFolder=gui.addFolder('Camera');
cameraFolder.add(settings,'zoom',.35,4,.01).name('Zoom').listen();
cameraFolder.add(settings,'panX',-14,14,.01).name('Horizontal position').listen();
cameraFolder.add(settings,'panY',-10,10,.01).name('Vertical position').listen();
cameraFolder.add(settings,'yaw',-65,65,.1).name('Horizontal angle').listen();
cameraFolder.add(settings,'pitch',-50,50,.1).name('Vertical angle').listen();
cameraFolder.add(settings,'roll',-35,35,.1).name('Roll');
cameraFolder.add({reset(){Object.assign(settings,{zoom:1,panX:0,panY:0,yaw:0,pitch:0,roll:0});gui.controllersRecursive().forEach(c=>c.updateDisplay());}},'reset').name('Reset view');
cameraFolder.close();
const botanicalFolder=gui.addFolder('Botanicals');
botanicalFolder.add(settings,'seed',1,2147483646,1).name('Seed').onFinishChange(buildPainting);
botanicalFolder.add(settings,'flowerDensity',.3,1.5,.01).name('Flower density').onFinishChange(buildPainting);
for(const [key,label] of [['iris','Irises'],['poppy','Poppies'],['cornflower','Cornflowers'],['forgetMeNot','Forget-me-nots']])
  botanicalFolder.add(settings.species,key,0,1.5,.01).name(label).onFinishChange(buildPainting);
botanicalFolder.add(settings,'petalDetail',12,36,1).name('Petal detail').onFinishChange(buildPainting);
botanicalFolder.close();
const renderingFolder=gui.addFolder('Rendering');
renderingFolder.add(settings,'antialias').name('Antialiasing');
renderingFolder.add(settings,'pixelRatio',.5,3,.25).name('Pixel ratio (DPR)').onFinishChange(()=>{
  renderer.setPixelRatio(settings.pixelRatio);
  currentWidth=0;resize();
});
renderingFolder.add(settings,'goldIntensity',0,1.5,.01).name('Gold intensity');
renderingFolder.add(settings,'textureGrain',0,1.5,.01).name('Paint grain');
renderingFolder.add(settings,'backgroundDarkness',.4,1.6,.01).name('Background darkness');
renderingFolder.close();
updateColors();

// Pointer controls live only on the canvas, so panel edits never roll a theme.
const canvas=renderer.domElement,pointers=new Map();
let gestureMoved=false,gestureWasMultiple=false,pinchDistance=0,uiVisible=true;
canvas.addEventListener('wheel',event=>{
  event.preventDefault();
  settings.zoom=THREE.MathUtils.clamp(settings.zoom*Math.exp(-event.deltaY*.001),.35,4);
},{passive:false});
canvas.addEventListener('pointerdown',event=>{
  canvas.setPointerCapture(event.pointerId);
  if(pointers.size===0){gestureMoved=false;gestureWasMultiple=false;}
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY,rotate:event.button===2||event.shiftKey||event.altKey});
  if(pointers.size>1){gestureWasMultiple=true;pinchDistance=0;}
  canvas.style.cursor='grabbing';
});
canvas.addEventListener('pointermove',event=>{
  const p=pointers.get(event.pointerId);if(!p)return;
  const dx=event.clientX-p.x,dy=event.clientY-p.y;
  p.x=event.clientX;p.y=event.clientY;
  if(Math.hypot(p.x-p.startX,p.y-p.startY)>5)gestureMoved=true;
  if(pointers.size===2){
    const [a,b]=pointers.values();const distance=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchDistance>0)settings.zoom=THREE.MathUtils.clamp(settings.zoom*distance/pinchDistance,.35,4);
    pinchDistance=distance;return;
  }
  if(p.rotate||event.shiftKey||event.altKey){
    settings.yaw=THREE.MathUtils.clamp(settings.yaw-dx*.18,-65,65);
    settings.pitch=THREE.MathUtils.clamp(settings.pitch+dy*.18,-50,50);
  }else{
    const units=(camera.top-camera.bottom)/innerHeight/camera.zoom;
    const r=THREE.MathUtils.degToRad(settings.roll);
    settings.panX-=units*(dx*Math.cos(r)+dy*Math.sin(r));
    settings.panY+=units*(dy*Math.cos(r)-dx*Math.sin(r));
  }
});
function endPointer(event,cancelled=false){
  if(!pointers.has(event.pointerId))return;
  const click=!cancelled&&!gestureMoved&&!gestureWasMultiple&&event.button===0;
  pointers.delete(event.pointerId);pinchDistance=0;
  if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);
  if(!pointers.size)canvas.style.cursor='grab';
  if(click&&settings.randomizeOnClick)randomizeTheme();
}
canvas.addEventListener('pointerup',event=>endPointer(event));
canvas.addEventListener('pointercancel',event=>endPointer(event,true));
canvas.addEventListener('contextmenu',event=>event.preventDefault());
addEventListener('keydown',event=>{
  if(event.key.toLowerCase()!=='h'||event.ctrlKey||event.metaKey||event.altKey||event.repeat)return;
  event.preventDefault();
  if(gui.domElement.contains(document.activeElement))document.activeElement.blur();
  uiVisible=!uiVisible;uiVisible?gui.show():gui.hide();
});

// An integer-harmonic orbit: every animated mode returns exactly to its start.
let elapsed=0,lastTime=performance.now();
function frame(now) {
  elapsed+=(now-lastTime)*.001*settings.animationSpeed; lastTime=now;
  updateMotion(TAU*(elapsed%settings.loopDuration)/settings.loopDuration);
  renderPainting();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{lastTime=performance.now();});
requestAnimationFrame(frame);
</script>
</body>
</html>
