<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zdog 3D Geometric Solids</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .illo {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #ccffdd;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .illo:active {
      cursor: grabbing;
    }
  </style>
  <script src="https://unpkg.com/zdog@1/dist/zdog.dist.min.js"></script>
</head>
<body>
  <canvas class="illo"></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // ----- Constants & Math ----- //
    const TAU = Zdog.TAU;
    const ROOT3 = Math.sqrt(3);
    const ROOT5 = Math.sqrt(5);
    const PHI = (1 + ROOT5) / 2;
    const sceneSize = 96;

    // ----- Preset Color Schemes ----- //
    const colorPresets = {
      'Original Sunset': {
        background: '#ccffdd',
        color1: '#663366',
        color2: '#cc2255',
        color3: '#ee6622',
        color4: '#eeaa00',
        color5: '#eedd00'
      },
      'Black & White': {
        background: '#ffffff',
        color1: '#111111',
        color2: '#2b2b2b',
        color3: '#4f4f4f',
        color4: '#777777',
        color5: '#9e9e9e'
      },
      'White & Black': {
        background: '#111111',
        color1: '#ffffff',
        color2: '#e0e0e0',
        color3: '#c4c4c4',
        color4: '#999999',
        color5: '#707070'
      },
      'Cyber Neon': {
        background: '#0d0221',
        color1: '#ff007f',
        color2: '#7b2cbf',
        color3: '#00f0ff',
        color4: '#ffe600',
        color5: '#00ff87'
      },
      'Nordic Pastel': {
        background: '#f4f1de',
        color1: '#e07a5f',
        color2: '#3d405b',
        color3: '#81b29a',
        color4: '#f2cc8f',
        color5: '#e29578'
      }
    };

    // ----- Settings / State ----- //
    const params = {
      // Color & Theme
      preset: 'Original Sunset',
      greenscreen: false,
      background: '#ccffdd',
      color1: '#663366',
      color2: '#cc2255',
      color3: '#ee6622',
      color4: '#eeaa00',
      color5: '#eedd00',

      // Animation
      animation: 'Original Multi-Axis',
      speed: 1.0,
      isSpinning: true,

      // Rendering & Geometry
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      zoom: 1.0,
      spacing: 4,
      scale: 1.0,

      // Interaction
      dragMode: 'Pan Object',
      randomizeOnClick: true,
      resetView: function() {
        params.zoom = 1.0;
        illo.translate.set({ x: 0, y: 0, z: 0 });
        viewRotation.set({ x: 0, y: 0, z: 0 });
        updateZoom();
        updateGuiDisplays(gui);
      },
      randomizeNow: function() {
        randomizeScene();
      }
    };

    // ----- Setup Illustration ----- //
    const illoElem = document.querySelector('.illo');
    let displaySize = Math.min(window.innerWidth, window.innerHeight);
    const viewRotation = new Zdog.Vector();
    let solids = [];

    const illo = new Zdog.Illustration({
      element: illoElem,
      scale: 8,
      dragRotate: false
    });

    // ----- Scene Builder ----- //
    function rebuildScene() {
      illo.children = [];
      solids = [];

      const c1 = params.color1;
      const c2 = params.color2;
      const c3 = params.color3;
      const c4 = params.color4;
      const c5 = params.color5;
      const sp = params.spacing;
      const sc = params.scale;

      // 1. Hourglass (top-center)
      (function() {
        const hourglass = new Zdog.Anchor({
          addTo: illo,
          translate: { x: 0, y: -sp * sc }
        });
        solids.push(hourglass);

        const hemi = new Zdog.Hemisphere({
          diameter: 2 * sc,
          translate: { z: -1 * sc },
          addTo: hourglass,
          color: c2,
          backface: c3,
          stroke: false
        });

        hemi.copy({
          translate: { z: 1 * sc },
          rotate: { y: TAU / 2 },
          color: c1,
          backface: c4
        });
      })();

      // 2. Sphere (top-left)
      (function() {
        const sphere = new Zdog.Anchor({
          addTo: illo,
          translate: { x: -sp * sc, y: -sp * sc }
        });
        solids.push(sphere);

        const hemi = new Zdog.Hemisphere({
          diameter: 2 * sc,
          addTo: sphere,
          color: c3,
          backface: c1,
          stroke: false
        });

        hemi.copy({
          rotate: { y: TAU / 2 },
          color: c1,
          backface: c3
        });
      })();

      // 3. Cylinder (top-right)
      (function() {
        const cylinder = new Zdog.Cylinder({
          diameter: 2 * sc,
          length: 2 * sc,
          addTo: illo,
          translate: { x: sp * sc, y: -sp * sc },
          color: c4,
          backface: c2,
          stroke: false
        });
        solids.push(cylinder);
      })();

      // 4. Cone (middle-left)
      (function() {
        const cone = new Zdog.Anchor({
          addTo: illo,
          translate: { x: -sp * sc, y: 0 }
        });
        solids.push(cone);

        new Zdog.Cone({
          diameter: 2 * sc,
          length: 2 * sc,
          addTo: cone,
          translate: { z: 1 * sc },
          rotate: { y: TAU / 2 },
          color: c2,
          backface: c4,
          stroke: false
        });
      })();

      // 5. Tetrahedron (center)
      (function() {
        const tetrahedron = new Zdog.Anchor({
          addTo: illo,
          translate: { x: 0, y: 0 },
          scale: 2.5 * sc
        });
        solids.push(tetrahedron);

        const radius = 0.5;
        const inradius = Math.cos(TAU / 6) * radius;
        const height = radius + inradius;

        const triangle = new Zdog.Polygon({
          sides: 3,
          radius: radius,
          addTo: tetrahedron,
          translate: { y: height / 2 },
          fill: true,
          stroke: false,
          color: c1
        });

        const faceColors = [c4, c2, c3];
        for (let i = 0; i < 3; i++) {
          const rotor1 = new Zdog.Anchor({
            addTo: tetrahedron,
            rotate: { y: TAU / 3 * -i }
          });
          const rotor2 = new Zdog.Anchor({
            addTo: rotor1,
            translate: { z: inradius, y: height / 2 },
            rotate: { x: Math.acos(1 / 3) * -1 + TAU / 4 }
          });
          triangle.copy({
            addTo: rotor2,
            translate: { y: -inradius },
            color: faceColors[i]
          });
        }

        triangle.rotate.set({ x: -TAU / 4, z: -TAU / 2 });
      })();

      // 6. Octahedron (bottom-left)
      (function() {
        const octahedron = new Zdog.Anchor({
          addTo: illo,
          translate: { x: -sp * sc, y: sp * sc },
          scale: 1.75 * sc
        });
        solids.push(octahedron);

        const colorWheel = [c1, c2, c3, c4, c5];
        const radius = ROOT3 / 2 * 2 / 3;
        const height = radius * 3 / 2;
        const tilt = Math.asin(0.5 / height);

        [-1, 1].forEach(function(ySide) {
          for (let i = 0; i < 4; i++) {
            const rotor = new Zdog.Anchor({
              addTo: octahedron,
              rotate: { y: TAU / 4 * (i + 1.5) * -1 }
            });

            const anchor = new Zdog.Anchor({
              addTo: rotor,
              translate: { z: 0.5 },
              rotate: { x: tilt * ySide }
            });

            new Zdog.Polygon({
              sides: 3,
              radius: radius,
              addTo: anchor,
              translate: { y: -radius / 2 * ySide },
              scale: { y: ySide },
              stroke: false,
              fill: true,
              color: colorWheel[Math.floor(i + 0.5 + 0.5 * ySide) % colorWheel.length],
              backface: false
            });
          }
        });
      })();

      // 7. Cube (middle-right)
      (function() {
        const cube = new Zdog.Box({
          addTo: illo,
          width: 2 * sc,
          height: 2 * sc,
          depth: 2 * sc,
          translate: { x: sp * sc, y: 0 },
          topFace: c5,
          frontFace: c4,
          leftFace: c3,
          rightFace: c3,
          rearFace: c2,
          bottomFace: c1,
          stroke: false
        });
        solids.push(cube);
      })();

      // 8. Dodecahedron (bottom-center)
      (function() {
        const dodecahedron = new Zdog.Anchor({
          addTo: illo,
          translate: { x: 0, y: sp * sc },
          scale: 0.75 * sc
        });
        solids.push(dodecahedron);

        const midradius = (PHI * PHI) / 2;

        const face = new Zdog.Polygon({
          sides: 5,
          radius: 1,
          addTo: dodecahedron,
          translate: { y: -midradius },
          rotate: { x: TAU / 4 },
          fill: true,
          stroke: false,
          color: c5
        });

        face.copy({
          translate: { y: midradius },
          rotate: { x: -TAU / 4 },
          color: c1
        });

        [-1, 1].forEach(function(ySide) {
          const colorWheel = {
            '-1': [c1, c2, c4, c3, c2],
            '1': [c5, c4, c2, c3, c4]
          }[ySide];

          for (let i = 0; i < 5; i++) {
            const rotor1 = new Zdog.Anchor({
              addTo: dodecahedron,
              rotate: { y: TAU / 5 * i }
            });
            const rotor2 = new Zdog.Anchor({
              addTo: rotor1,
              rotate: { x: TAU / 4 * ySide - Math.atan(2) }
            });

            face.copy({
              addTo: rotor2,
              translate: { z: midradius },
              rotate: { z: TAU / 2 },
              color: colorWheel[i]
            });
          }
        });
      })();

      // 9. Icosahedron (bottom-right)
      (function() {
        const isocahedron = new Zdog.Anchor({
          addTo: illo,
          translate: { x: sp * sc, y: sp * sc },
          scale: 1.2 * sc
        });
        solids.push(isocahedron);

        const faceRadius = ROOT3 / 2 * 2 / 3;
        const faceHeight = faceRadius * 3 / 2;
        const capApothem = 0.5 / Math.tan(TAU / 10);
        const capRadius = 0.5 / Math.sin(TAU / 10);
        const capTilt = Math.asin(capApothem / faceHeight);
        const capSagitta = capRadius - capApothem;
        const sideTilt = Math.asin(capSagitta / faceHeight);
        const sideHeight = Math.sqrt(faceHeight * faceHeight - capSagitta * capSagitta);

        [-1, 1].forEach(function(ySide) {
          const capColors = {
            '-1': [c2, c4, c5, c4, c3],
            '1': [c4, c2, c1, c2, c3]
          }[ySide];

          const sideColors = {
            '-1': [c2, c4, c5, c3, c2],
            '1': [c4, c2, c1, c3, c3]
          }[ySide];

          for (let i = 0; i < 5; i++) {
            const rotor = new Zdog.Anchor({
              addTo: isocahedron,
              rotate: { y: TAU / 5 * -i },
              translate: { y: sideHeight / 2 * ySide }
            });

            let capRotateX = -capTilt;
            const isYPos = ySide > 0;
            capRotateX += isYPos ? TAU / 2 : 0;

            const capAnchor = new Zdog.Anchor({
              addTo: rotor,
              translate: { z: capApothem * ySide },
              rotate: { x: capRotateX }
            });

            const face = new Zdog.Polygon({
              sides: 3,
              radius: faceRadius,
              addTo: capAnchor,
              translate: { y: -faceRadius / 2 },
              stroke: false,
              fill: true,
              color: capColors[i]
            });

            let sideRotateX = -sideTilt;
            sideRotateX += isYPos ? 0 : TAU / 2;
            const sideAnchor = capAnchor.copy({
              rotate: { x: sideRotateX }
            });

            face.copy({
              addTo: sideAnchor,
              translate: { y: -faceRadius / 2 },
              rotate: { y: TAU / 2 },
              color: sideColors[i]
            });
          }
        });
      })();

      illo.updateGraph();
    }

    // ----- Background & Zoom Updaters ----- //
    function updateBackground() {
      const bg = params.greenscreen ? '#00ff00' : params.background;
      illoElem.style.background = bg;
      document.body.style.background = bg;
    }

    function updateZoom() {
      const baseZoom = Math.floor(displaySize / sceneSize) || 1;
      illo.zoom = Math.max(0.1, baseZoom * params.zoom);
    }

    function updateDimensions() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      displaySize = Math.min(w, h);
      illo.dpr = params.dpr;
      illo.setSize(w, h);
      updateZoom();
    }

    // ----- Keyframe & Animation Logic ----- //
    const keyframes = [
      { x: 0, y: 0 },
      { x: 0, y: TAU },
      { x: TAU, y: TAU }
    ];

    let ticker = 0;
    const cycleCount = 180;
    const turnLimit = keyframes.length - 1;

    function update() {
      if (params.isSpinning && params.speed > 0) {
        ticker += params.speed;

        if (params.animation === 'Original Multi-Axis') {
          const progress = ticker / cycleCount;
          const tween = Zdog.easeInOut(progress % 1, 4);
          const turn = Math.floor(progress % turnLimit);
          const keyA = keyframes[turn];
          const keyB = keyframes[turn + 1];
          viewRotation.x = Zdog.lerp(keyA.x, keyB.x, tween);
          viewRotation.y = Zdog.lerp(keyA.y, keyB.y, tween);
          viewRotation.z = 0;

          solids.forEach(function(solid) {
            solid.rotate.set(viewRotation);
          });
        } else if (params.animation === 'Gentle Floating Orbit') {
          const t = ticker * 0.008;
          viewRotation.x = Math.sin(t * 0.7) * 0.35 + 0.2;
          viewRotation.y = t;
          viewRotation.z = Math.cos(t * 0.5) * 0.15;

          solids.forEach(function(solid) {
            solid.rotate.set(viewRotation);
          });
        } else if (params.animation === 'Harmonic Wave') {
          const t = ticker * 0.012;
          viewRotation.x = Math.sin(t) * (TAU / 8);
          viewRotation.y = Math.cos(t * 0.8) * (TAU / 4);
          viewRotation.z = Math.sin(t * 0.5) * (TAU / 12);

          solids.forEach(function(solid) {
            solid.rotate.set(viewRotation);
          });
        } else if (params.animation === 'Individual Spin') {
          const t = ticker * 0.01;
          viewRotation.x = Math.sin(t * 0.3) * 0.2;
          viewRotation.y = t * 0.5;
          viewRotation.z = 0;

          solids.forEach(function(solid, idx) {
            solid.rotate.x = viewRotation.x + Math.sin(t + idx * 0.7) * 0.8;
            solid.rotate.y = viewRotation.y + t * (0.8 + (idx % 3) * 0.3);
            solid.rotate.z = Math.cos(t + idx * 0.5) * 0.4;
          });
        } else if (params.animation === 'Static (No Movement)') {
          viewRotation.x = -TAU / 16;
          viewRotation.y = TAU / 8;
          viewRotation.z = 0;

          solids.forEach(function(solid) {
            solid.rotate.set(viewRotation);
          });
        }
      } else {
        solids.forEach(function(solid) {
          solid.rotate.set(viewRotation);
        });
      }

      illo.updateGraph();
    }

    function animate() {
      update();
      illo.renderGraph();
      requestAnimationFrame(animate);
    }

    // ----- Color Helpers & Procedural Generation ----- //
    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (0 <= h && h < 60) { r = c; g = x; b = 0; }
      else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
      else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
      else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
      else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
      else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
      const toHex = function(n) {
        const hex = Math.round((n + m) * 255).toString(16);
        return hex.length === 1 ? '0' + hex : hex;
      };
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    function generateRandomTheme() {
      const mode = Math.floor(Math.random() * 5);
      const baseHue = Math.floor(Math.random() * 360);
      let bg, c1, c2, c3, c4, c5;

      if (mode === 0) { // Dark Cyber Neon
        bg = hslToHex(baseHue, 60, 7);
        c1 = hslToHex(baseHue, 95, 60);
        c2 = hslToHex((baseHue + 60) % 360, 90, 55);
        c3 = hslToHex((baseHue + 150) % 360, 95, 60);
        c4 = hslToHex((baseHue + 210) % 360, 90, 65);
        c5 = hslToHex((baseHue + 280) % 360, 95, 70);
      } else if (mode === 1) { // Light Pastel
        bg = hslToHex(baseHue, 35, 93);
        c1 = hslToHex((baseHue + 30) % 360, 65, 55);
        c2 = hslToHex((baseHue + 80) % 360, 60, 50);
        c3 = hslToHex((baseHue + 160) % 360, 55, 45);
        c4 = hslToHex((baseHue + 210) % 360, 70, 60);
        c5 = hslToHex((baseHue + 290) % 360, 60, 55);
      } else if (mode === 2) { // High Contrast Triadic
        bg = hslToHex(baseHue, 20, 92);
        c1 = hslToHex(baseHue, 80, 45);
        c2 = hslToHex((baseHue + 120) % 360, 85, 50);
        c3 = hslToHex((baseHue + 240) % 360, 80, 55);
        c4 = hslToHex((baseHue + 60) % 360, 90, 60);
        c5 = hslToHex((baseHue + 180) % 360, 85, 40);
      } else if (mode === 3) { // Deep Vibrant Minimal
        bg = hslToHex(baseHue, 40, 12);
        c1 = hslToHex((baseHue + 45) % 360, 85, 65);
        c2 = hslToHex((baseHue + 90) % 360, 80, 60);
        c3 = hslToHex((baseHue + 180) % 360, 90, 70);
        c4 = hslToHex((baseHue + 240) % 360, 75, 65);
        c5 = hslToHex((baseHue + 315) % 360, 85, 75);
      } else { // Warm Sunset / Earthy
        bg = hslToHex(baseHue, 30, 88);
        c1 = hslToHex(baseHue, 75, 40);
        c2 = hslToHex((baseHue + 30) % 360, 85, 50);
        c3 = hslToHex((baseHue + 60) % 360, 90, 55);
        c4 = hslToHex((baseHue + 90) % 360, 80, 60);
        c5 = hslToHex((baseHue + 140) % 360, 70, 45);
      }
      return { background: bg, color1: c1, color2: c2, color3: c3, color4: c4, color5: c5 };
    }

    function randomizeScene() {
      // 1. New Visual Theme
      const theme = generateRandomTheme();
      params.preset = 'Custom';
      params.background = theme.background;
      params.color1 = theme.color1;
      params.color2 = theme.color2;
      params.color3 = theme.color3;
      params.color4 = theme.color4;
      params.color5 = theme.color5;

      // 2. Geometric Parameters
      params.spacing = +(3.2 + Math.random() * 2.2).toFixed(2);
      params.scale = +(0.8 + Math.random() * 0.45).toFixed(2);

      // 3. Motion Parameters
      const animList = ['Original Multi-Axis', 'Gentle Floating Orbit', 'Harmonic Wave', 'Individual Spin'];
      params.animation = animList[Math.floor(Math.random() * animList.length)];
      params.speed = +(0.6 + Math.random() * 1.2).toFixed(2);

      // Apply changes
      updateBackground();
      rebuildScene();
      updateGuiDisplays(gui);
    }

    function updateGuiDisplays(targetGui) {
      if (!targetGui) return;
      if (targetGui.controllers) {
        targetGui.controllers.forEach(c => c.updateDisplay());
      }
      if (targetGui.folders) {
        targetGui.folders.forEach(f => updateGuiDisplays(f));
      }
    }

    // ----- Wheel Zoom & Screen Drag Handling ----- //
    window.addEventListener('wheel', function(e) {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.925;
      params.zoom = Math.max(0.15, Math.min(12.0, +(params.zoom * zoomFactor).toFixed(3)));
      updateZoom();
      updateGuiDisplays(gui);
    }, { passive: false });

    let isPointerDown = false;
    let isPanning = false;
    let isRotating = false;
    let startTranslateX = 0, startTranslateY = 0;
    let startRotX = 0, startRotY = 0;
    let downX = 0, downY = 0;
    const dragThreshold = 5;
    let didDrag = false;

    illoElem.addEventListener('pointerdown', function(e) {
      if (e.target !== illoElem) return;

      isPointerDown = true;
      didDrag = false;
      downX = e.clientX;
      downY = e.clientY;

      if (e.button === 2 || e.shiftKey || e.altKey || params.dragMode === 'Rotate Scene') {
        isRotating = true;
        isPanning = false;
        startRotX = viewRotation.x;
        startRotY = viewRotation.y;
      } else if (e.button === 0) {
        isPanning = true;
        isRotating = false;
        startTranslateX = illo.translate.x;
        startTranslateY = illo.translate.y;
      }
    });

    window.addEventListener('pointermove', function(e) {
      if (!isPointerDown) return;
      const dx = e.clientX - downX;
      const dy = e.clientY - downY;

      if (Math.hypot(dx, dy) > dragThreshold) {
        didDrag = true;
      }

      if (isPanning) {
        const currentZoom = illo.zoom || 1;
        illo.translate.x = startTranslateX + (dx / currentZoom);
        illo.translate.y = startTranslateY + (dy / currentZoom);
      } else if (isRotating) {
        const dSize = displaySize || Math.min(window.innerWidth, window.innerHeight);
        viewRotation.x = startRotX - (dy / dSize * TAU);
        viewRotation.y = startRotY - (dx / dSize * TAU);
      }
    });

    window.addEventListener('pointerup', function(e) {
      if (!isPointerDown) return;
      isPointerDown = false;

      // Click without drag triggers procedural variation if enabled
      if (!didDrag && e.target === illoElem && e.button === 0 && !e.shiftKey && !e.altKey) {
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
      isPanning = false;
      isRotating = false;
    });

    illoElem.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    // ----- Hide / Show UI with "H" Key ----- //
    window.addEventListener('keydown', function(e) {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    window.addEventListener('resize', function() {
      updateDimensions();
    });

    // ----- Lil-GUI Setup ----- //
    const gui = new GUI({ title: 'Scene Controls' });

    // Color Folder
    const fColors = gui.addFolder('Colors & Theme');
    fColors.add(params, 'preset', ['Original Sunset', 'Black & White', 'White & Black', 'Cyber Neon', 'Nordic Pastel', 'Custom'])
      .name('Color Scheme')
      .onChange(function(val) {
        if (val !== 'Custom' && colorPresets[val]) {
          const p = colorPresets[val];
          params.background = p.background;
          params.color1 = p.color1;
          params.color2 = p.color2;
          params.color3 = p.color3;
          params.color4 = p.color4;
          params.color5 = p.color5;
          updateBackground();
          rebuildScene();
          updateGuiDisplays(gui);
        }
      });

    fColors.add(params, 'greenscreen')
      .name('Greenscreen (#00ff00)')
      .onChange(function() {
        updateBackground();
      });

    fColors.addColor(params, 'background')
      .name('Background')
      .onChange(function() {
        params.preset = 'Custom';
        updateBackground();
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color1')
      .name('Color 1')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color2')
      .name('Color 2')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color3')
      .name('Color 3')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color4')
      .name('Color 4')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color5')
      .name('Color 5')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    // Animation Folder
    const fAnim = gui.addFolder('Animation');
    fAnim.add(params, 'animation', [
      'Original Multi-Axis',
      'Gentle Floating Orbit',
      'Harmonic Wave',
      'Individual Spin',
      'Static (No Movement)'
    ]).name('Animation');

    fAnim.add(params, 'speed', 0.0, 3.0, 0.05).name('Speed');
    fAnim.add(params, 'isSpinning').name('Auto Animate');

    // Geometry & Display Folder
    const fGeom = gui.addFolder('Geometry & Display');
    fGeom.add(params, 'zoom', 0.2, 5.0, 0.05)
      .name('Zoom')
      .onChange(function() {
        updateZoom();
      });

    fGeom.add(params, 'spacing', 2.0, 7.0, 0.1)
      .name('Grid Spacing')
      .onChange(function() {
        rebuildScene();
      });

    fGeom.add(params, 'scale', 0.4, 2.0, 0.05)
      .name('Shape Scale')
      .onChange(function() {
        rebuildScene();
      });

    fGeom.add(params, 'dpr', 0.5, 3.0, 0.25)
      .name('DPR (Pixel Ratio)')
      .onChange(function() {
        updateDimensions();
      });

    fGeom.add(params, 'resetView').name('Reset View');

    // Interaction Folder
    const fInteract = gui.addFolder('Interaction');
    fInteract.add(params, 'dragMode', ['Pan Object', 'Rotate Scene']).name('Drag Action');
    fInteract.add(params, 'randomizeOnClick').name('Click Randomize');
    fInteract.add(params, 'randomizeNow').name('Randomize Now');

    // ----- Initialize & Start Animation ----- //
    updateDimensions();
    updateBackground();
    rebuildScene();
    animate();
  </script>
</body>
</html>
