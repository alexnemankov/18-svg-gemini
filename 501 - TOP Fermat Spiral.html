<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fermat Spiral Generative System</title>
  <style>
    * {
      font-family: 'arial black', Helvetica, verdana, monospace, sans-serif;
      letter-spacing: 0.2rem;
      margin: 0;
      padding: 0;
      color: #FFF;
      overflow: hidden;
    }

    body {
      position: relative;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas#canvas {
      display: block;
      background: #000;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas">Canvas not supported.</canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 19 Preconfigured Color Schemes
    const COLOR_SCHEME_KEYS = [
      'Original',
      'Monochromatic',
      'Analogous',
      'Complementary',
      'Split-complementary',
      'Triadic',
      'Tetradic',
      'Double split-complementary',
      'Achromatic (black and white version, white and black)',
      'Achromatic + Accent (black and white + red, white and black + red)',
      'Neutral + accent',
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)',
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)'
    ];

    const SCHEME_BG = {
      'Original': '#000000',
      'Monochromatic': '#030814',
      'Analogous': '#020f12',
      'Complementary': '#050711',
      'Split-complementary': '#080310',
      'Triadic': '#06020c',
      'Tetradic': '#07020e',
      'Double split-complementary': '#080310',
      'Achromatic (black and white version, white and black)': '#000000',
      'Achromatic + Accent (black and white + red, white and black + red)': '#050102',
      'Neutral + accent': '#0a0908',
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': '#220901',
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': '#000000',
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': '#120A12',
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': '#061210',
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': '#05140A',
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': '#0E0618',
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': '#090612',
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': '#05020F'
    };

    function hexToRgb(hex) {
      let clean = hex.replace('#', '');
      if (clean.length === 3) clean = clean.split('').map(c => c + c).join('');
      const num = parseInt(clean, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function lerpColor(c1, c2, t) {
      const r1 = hexToRgb(c1);
      const r2 = hexToRgb(c2);
      const r = Math.round(r1[0] + (r2[0] - r1[0]) * t);
      const g = Math.round(r1[1] + (r2[1] - r1[1]) * t);
      const b = Math.round(r1[2] + (r2[2] - r1[2]) * t);
      return `rgb(${r},${g},${b})`;
    }

    function samplePalette(paletteArray, pos) {
      pos = Math.max(0, Math.min(1, pos));
      const n = paletteArray.length - 1;
      const scaled = pos * n;
      const idx = Math.floor(scaled);
      const fract = scaled - idx;
      if (idx >= n) return paletteArray[n];
      return lerpColor(paletteArray[idx], paletteArray[idx + 1], fract);
    }

    function getColor(schemeName, i, normI, rad, params) {
      if (params.useCustomColor) {
        return params.customColor;
      }

      const hueShift = params.hueShift;
      const sat = params.saturation;
      const lit = params.lightness;

      switch (schemeName) {
        case 'Original': {
          const h = ((Math.sin(rad) * 360 + hueShift) % 360 + 360) % 360;
          return `hsl(${h}, ${sat}%, ${lit}%)`;
        }

        case 'Monochromatic': {
          const h = (205 + hueShift) % 360;
          const l = Math.max(12, Math.min(88, lit - 20 + Math.sin(rad) * 22 + normI * 24));
          return `hsl(${h}, ${sat}%, ${l}%)`;
        }

        case 'Analogous': {
          const h = ((175 + hueShift + Math.sin(rad * 0.7) * 35 + normI * 45) % 360 + 360) % 360;
          return `hsl(${h}, ${sat}%, ${lit}%)`;
        }

        case 'Complementary': {
          const base = (30 + hueShift) % 360;
          const comp = (base + 180) % 360;
          const isAlt = Math.sin(rad) > 0;
          const h = isAlt ? base : comp;
          return `hsl(${h}, ${sat}%, ${lit}%)`;
        }

        case 'Split-complementary': {
          const base = (280 + hueShift) % 360;
          const c1 = (base + 150) % 360;
          const c2 = (base + 210) % 360;
          const wave = Math.sin(rad);
          const h = wave < -0.33 ? c1 : (wave > 0.33 ? c2 : base);
          return `hsl(${h}, ${sat}%, ${lit}%)`;
        }

        case 'Triadic': {
          const base = (180 + hueShift) % 360;
          const step = Math.floor(((rad / Math.PI + normI * 3) % 3 + 3) % 3);
          const h = (base + step * 120) % 360;
          return `hsl(${h}, ${sat}%, ${lit}%)`;
        }

        case 'Tetradic': {
          const base = (200 + hueShift) % 360;
          const step = Math.floor(((rad / Math.PI + normI * 4) % 4 + 4) % 4);
          const h = (base + step * 90) % 360;
          return `hsl(${h}, ${sat}%, ${lit}%)`;
        }

        case 'Double split-complementary': {
          const base = (350 + hueShift) % 360;
          const angles = [(base - 15 + 360) % 360, (base + 15) % 360, (base + 165) % 360, (base + 195) % 360];
          const step = Math.floor(((rad / Math.PI + normI * 4) % 4 + 4) % 4);
          return `hsl(${angles[step]}, ${sat}%, ${lit}%)`;
        }

        case 'Achromatic (black and white version, white and black)': {
          const l = Math.max(8, Math.min(95, 18 + Math.abs(Math.sin(rad)) * 77));
          return `hsl(0, 0%, ${l}%)`;
        }

        case 'Achromatic + Accent (black and white + red, white and black + red)': {
          const isAccent = (i % 7 === 0) || (Math.abs(Math.sin(rad * 2)) > 0.93);
          if (isAccent) {
            return `hsl(${(0 + hueShift) % 360}, 96%, 56%)`;
          }
          const l = Math.max(12, Math.min(92, 18 + Math.abs(Math.sin(rad)) * 74));
          return `hsl(0, 0%, ${l}%)`;
        }

        case 'Neutral + accent': {
          const isAccent = (i % 6 === 0) || (Math.abs(Math.sin(rad * 1.6)) > 0.88);
          if (isAccent) {
            return `hsl(${(38 + hueShift) % 360}, 100%, 54%)`;
          }
          const h = (35 + hueShift) % 360;
          const s = 14;
          const l = Math.max(18, Math.min(82, 22 + normI * 36 + Math.sin(rad) * 16));
          return `hsl(${h}, ${s}%, ${l}%)`;
        }

        case 'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
          const pal = ['#220901', '#941B0C', '#BC3908', '#F6AA1C', '#FFE082'];
          const t = (Math.sin(rad) * 0.5 + 0.5 + normI) % 1;
          return samplePalette(pal, t);
        }

        case 'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
          const pal = ['#0B132B', '#4BAD9E', '#5BC0BE', '#63D1CF', '#E0FFFF'];
          const t = (Math.sin(rad) * 0.5 + 0.5 + normI) % 1;
          return samplePalette(pal, t);
        }

        case 'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
          const pal = ['#0D001D', '#AA60C8', '#C9A3C6', '#D69ADE', '#CFB5C2'];
          const t = (Math.sin(rad) * 0.5 + 0.5 + normI) % 1;
          return samplePalette(pal, t);
        }

        case 'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
          const pal = ['#00474D', '#008189', '#FFBA00', '#FEF1BE'];
          const t = (Math.sin(rad) * 0.5 + 0.5 + normI) % 1;
          return samplePalette(pal, t);
        }

        case 'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
          const pal = ['#0A3322', '#00B894', '#7FFF00', '#D4FFB0'];
          const t = (Math.sin(rad) * 0.5 + 0.5 + normI) % 1;
          return samplePalette(pal, t);
        }

        case 'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
          const pal = ['#3D1050', '#C7501A', '#FF8C00', '#FFE8CC'];
          const t = (Math.sin(rad) * 0.5 + 0.5 + normI) % 1;
          return samplePalette(pal, t);
        }

        case 'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
          const pal = ['#1A1250', '#6A3DE8', '#B38FFF', '#E8E0FF'];
          const t = (Math.sin(rad) * 0.5 + 0.5 + normI) % 1;
          return samplePalette(pal, t);
        }

        case 'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
          const pal = ['#1E0A3D', '#D40078', '#00F0FF', '#E0FBFF'];
          const t = (Math.sin(rad) * 0.5 + 0.5 + normI) % 1;
          return samplePalette(pal, t);
        }

        default:
          return '#ffffff';
      }
    }

    const canvas = document.getElementById('canvas');
    if (!canvas || !canvas.getContext) {
      throw new Error('Canvas not supported');
    }
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    const initialShapeCount = width < 768 ? Math.max(height, 600) : Math.max(width, 1000);

    const params = {
      // Scene & Interaction
      greenScreen: false,
      bgColor: '#000000',
      randomizeOnClick: true,
      isPlaying: true,

      // View & Camera
      zoom: 1.0,
      panX: 0,
      panY: 0,
      sceneRotation: 0,

      // Color Schemes & Palette
      colorScheme: 'Original',
      blendMode: 'source-over',
      hueShift: 0,
      saturation: 80,
      lightness: 60,
      opacity: 1.0,
      useCustomColor: false,
      customColor: '#00f0ff',

      // Geometry & Phyllotaxis
      angle: 137.5,
      spacing: 1.0,
      particleCount: initialShapeCount,
      distributionPower: 1.0,
      particleScale: 1.0,
      shapeType: 'Circle',

      // Motion & Dynamics
      pulseSpeed: 1.0,
      rotateSpeed: 0.0,
      angleDrift: 0.0,
      waveDistortion: 0.0,
      waveFrequency: 1.0,

      // Actions
      randomize: () => randomizeScene(),
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        params.sceneRotation = 0;
        updateAllGUI();
      },
      setGoldenAngle: () => {
        params.angle = 137.5;
        updateAllGUI();
      }
    };

    class Shape {
      constructor(i) {
        this.init(i);
      }

      init(i) {
        this.i = i;
        this.r = 20 * i / 200;
        this.a = i / 3;
        this.rad = this.a * Math.PI / 180;
        this.random = 0.25 + Math.random() * 0.75;
      }

      update(speed) {
        this.a += speed;
        this.rad = this.a * Math.PI / 180;
      }

      draw(ctx, params, angle, normI) {
        let dist;
        if (Math.abs(params.distributionPower - 1.0) < 0.02) {
          dist = (this.i / 2) * params.spacing;
        } else {
          dist = Math.pow(this.i, params.distributionPower) * params.spacing * (params.distributionPower < 0.8 ? 12 : 0.5);
        }

        if (params.waveDistortion > 0) {
          dist += Math.sin(this.rad * params.waveFrequency + this.i * 0.04) * 14 * params.waveDistortion;
        }

        const angRad = (angle * Math.PI / 180) * this.i;
        const px = Math.cos(angRad) * dist;
        const py = Math.sin(angRad) * dist;

        const sinRad = Math.sin(this.rad / 2);
        const r = Math.abs(sinRad) * this.r * params.particleScale;
        if (r < 0.15) return;

        const color = getColor(params.colorScheme, this.i, normI, this.rad, params);

        ctx.save();
        ctx.globalAlpha = Math.min(1.0, this.random * params.opacity);

        if (params.shapeType === 'Hollow Ring') {
          ctx.strokeStyle = color;
          ctx.lineWidth = Math.max(1, r * 0.3);
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2, false);
          ctx.stroke();
        } else if (params.shapeType === 'Glow Disc') {
          const grad = ctx.createRadialGradient(px, py, 0, px, py, r);
          grad.addColorStop(0, color);
          grad.addColorStop(0.7, color);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2, false);
          ctx.fill();
        } else if (params.shapeType === 'Polygon') {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(px, py - r);
          ctx.lineTo(px + r, py);
          ctx.lineTo(px, py + r);
          ctx.lineTo(px - r, py);
          ctx.closePath();
          ctx.fill();
        } else {
          // Circle
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2, false);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    let shapes = [];

    function ensureShapesCapacity(count) {
      while (shapes.length < count) {
        shapes.push(new Shape(shapes.length));
      }
    }

    ensureShapesCapacity(params.particleCount);

    function onResize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
    }

    window.addEventListener('resize', onResize);
    onResize();

    // Setup GUI
    const gui = new GUI({ title: 'Fermat Spiral Settings' });

    const fScene = gui.addFolder('Scene & Interaction');
    fScene.add(params, 'greenScreen').name('Green Screen (#00ff00)');
    const ctrlBg = fScene.addColor(params, 'bgColor').name('Background Color');
    fScene.add(params, 'randomizeOnClick').name('Click to Randomize');
    fScene.add(params, 'randomize').name('Randomize Scene');
    fScene.add(params, 'isPlaying').name('Play Animation');
    fScene.add(params, 'resetView').name('Reset Pan/Zoom');

    const fColor = gui.addFolder('Color Controls');
    const ctrlScheme = fColor.add(params, 'colorScheme', COLOR_SCHEME_KEYS).name('Color Scheme');
    ctrlScheme.onChange((val) => {
      if (!params.greenScreen && SCHEME_BG[val]) {
        params.bgColor = SCHEME_BG[val];
        ctrlBg.updateDisplay();
      }
    });
    fColor.add(params, 'blendMode', ['source-over', 'lighter', 'screen']).name('Blend Mode');
    fColor.add(params, 'hueShift', 0, 360, 1).name('Hue Shift');
    fColor.add(params, 'saturation', 0, 100, 1).name('Saturation %');
    fColor.add(params, 'lightness', 0, 100, 1).name('Lightness %');
    fColor.add(params, 'opacity', 0.05, 1.5, 0.05).name('Opacity Multiplier');
    fColor.add(params, 'useCustomColor').name('Override Custom Color');
    fColor.addColor(params, 'customColor').name('Custom Color');

    const fGeo = gui.addFolder('Geometry & Phyllotaxis');
    fGeo.add(params, 'angle', 130.0, 145.0, 0.001).name('Divergence Angle');
    fGeo.add(params, 'setGoldenAngle').name('Set Golden Angle (137.5°)');
    const ctrlCount = fGeo.add(params, 'particleCount', 100, 3500, 10).name('Particle Count');
    ctrlCount.onChange((val) => {
      ensureShapesCapacity(val);
    });
    fGeo.add(params, 'spacing', 0.1, 3.0, 0.05).name('Radial Spacing');
    fGeo.add(params, 'distributionPower', 0.4, 1.2, 0.02).name('Distribution Power');
    fGeo.add(params, 'particleScale', 0.1, 4.0, 0.05).name('Particle Scale');
    fGeo.add(params, 'shapeType', ['Circle', 'Glow Disc', 'Hollow Ring', 'Polygon']).name('Shape Type');

    const fMotion = gui.addFolder('Motion & Dynamics');
    fMotion.add(params, 'pulseSpeed', 0.0, 5.0, 0.05).name('Pulse Speed');
    fMotion.add(params, 'rotateSpeed', -1.5, 1.5, 0.01).name('Rotation Speed');
    fMotion.add(params, 'angleDrift', -0.0005, 0.0005, 0.00001).name('Angle Drift');
    fMotion.add(params, 'waveDistortion', 0.0, 2.5, 0.05).name('Wave Ripple');
    fMotion.add(params, 'waveFrequency', 0.1, 5.0, 0.1).name('Wave Frequency');

    const fView = gui.addFolder('View & Transform');
    fView.add(params, 'zoom', 0.05, 10.0, 0.05).name('Zoom Level');
    fView.add(params, 'panX', -1500, 1500, 1).name('Pan X');
    fView.add(params, 'panY', -1500, 1500, 1).name('Pan Y');
    fView.add(params, 'sceneRotation', -180, 180, 0.5).name('Scene Rotation°');

    function updateAllGUI() {
      if (typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else {
        const updateFolder = (f) => {
          if (f.controllers) f.controllers.forEach(c => c.updateDisplay());
          if (f.folders) f.folders.forEach(child => updateFolder(child));
        };
        updateFolder(gui);
      }
    }

    // Toggle UI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'h' || e.key === 'H') {
        const isHidden = gui.domElement.style.display === 'none' || gui._hidden;
        if (typeof gui.show === 'function') {
          gui.show(isHidden);
        }
        gui.domElement.style.display = isHidden ? '' : 'none';
      }
    });

    // Procedural variation generator on scene click / randomizer
    function randomizeScene() {
      // 1. Pick a random color scheme from the 19 schemes
      const randomScheme = COLOR_SCHEME_KEYS[Math.floor(Math.random() * COLOR_SCHEME_KEYS.length)];
      params.colorScheme = randomScheme;
      if (!params.greenScreen && SCHEME_BG[randomScheme]) {
        params.bgColor = SCHEME_BG[randomScheme];
      }
      params.hueShift = Math.floor(Math.random() * 360);
      params.useCustomColor = false;

      // 2. Geometric & Phyllotaxis re-roll
      if (Math.random() < 0.65) {
        // Fine golden angle variation
        params.angle = +(137.5 + (Math.random() - 0.5) * 0.38).toFixed(4);
      } else {
        // Resonant parastichy angle variations
        const angles = [99.5, 137.3, 137.42, 137.5, 137.508, 137.58, 137.64, 222.49];
        params.angle = angles[Math.floor(Math.random() * angles.length)];
      }

      params.spacing = +(0.4 + Math.random() * 0.9).toFixed(2);
      params.particleScale = +(0.6 + Math.random() * 1.5).toFixed(2);
      params.distributionPower = Math.random() < 0.35 ? 0.5 : +(0.7 + Math.random() * 0.4).toFixed(2);
      params.shapeType = ['Circle', 'Glow Disc', 'Hollow Ring', 'Polygon'][Math.floor(Math.random() * 4)];
      params.blendMode = Math.random() < 0.5 ? 'lighter' : 'source-over';

      const minCount = width < 768 ? 600 : 1000;
      params.particleCount = Math.floor(minCount + Math.random() * 1500);
      ensureShapesCapacity(params.particleCount);

      // 3. Motion re-roll
      params.pulseSpeed = +(0.5 + Math.random() * 2.2).toFixed(2);
      params.rotateSpeed = +((Math.random() - 0.5) * 0.6).toFixed(3);
      params.angleDrift = Math.random() < 0.3 ? +((Math.random() - 0.5) * 0.0001).toFixed(6) : 0.0;
      params.waveDistortion = Math.random() < 0.4 ? +(Math.random() * 1.2).toFixed(2) : 0.0;

      // Update control panel
      updateAllGUI();
    }

    // Zoom with wheel
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.09 : 0.917;
      const newZoom = Math.min(Math.max(params.zoom * zoomFactor, 0.05), 15.0);

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left - (width / 2);
      const mouseY = e.clientY - rect.top - (height / 2);

      // Anchor zoom around cursor position
      params.panX = mouseX - (mouseX - params.panX) * (newZoom / params.zoom);
      params.panY = mouseY - (mouseY - params.panY) * (newZoom / params.zoom);
      params.zoom = newZoom;

      updateAllGUI();
    }, { passive: false });

    // Drag object across screen & scene click detection
    let isPointerDown = false;
    let lastX = 0, lastY = 0;
    let totalDragDist = 0;

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isPointerDown = true;
      lastX = e.clientX;
      lastY = e.clientY;
      totalDragDist = 0;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      totalDragDist += Math.hypot(dx, dy);

      params.panX += dx;
      params.panY += dy;
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

      // Click detection: if pointer moved less than 6px, trigger procedural randomize
      if (totalDragDist < 6) {
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
    });

    canvas.addEventListener('pointercancel', () => {
      isPointerDown = false;
    });

    // Render loop
    function render() {
      requestAnimationFrame(render);

      if (params.isPlaying) {
        for (let i = 0; i < shapes.length; i++) {
          shapes[i].update(params.pulseSpeed);
        }
        if (params.angleDrift !== 0) {
          params.angle += params.angleDrift;
        }
        if (params.rotateSpeed !== 0) {
          params.sceneRotation = (params.sceneRotation + params.rotateSpeed) % 360;
        }
      }

      ctx.save();
      ctx.scale(dpr, dpr);

      // Draw background: greenscreen or custom bgColor
      if (params.greenScreen) {
        ctx.fillStyle = '#00ff00';
      } else {
        ctx.fillStyle = params.bgColor;
      }
      ctx.fillRect(0, 0, width, height);

      // Center -> Pan -> Zoom -> Rotate
      ctx.translate(width / 2 + params.panX, height / 2 + params.panY);
      ctx.scale(params.zoom, params.zoom);
      ctx.rotate(params.sceneRotation * Math.PI / 180);

      ctx.globalCompositeOperation = params.blendMode;

      const count = Math.min(shapes.length, params.particleCount);
      for (let i = 0; i < count; i++) {
        shapes[i].draw(ctx, params, params.angle, i / count);
      }

      ctx.restore();
    }

    render();
  </script>
</body>
</html>
