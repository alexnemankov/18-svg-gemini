<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPGPU Simplex Noise Particles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      font-size: 62.5%;
      background: #000;
      overflow: hidden;
      color: #FFF;
      font-family: serif;
      overscroll-behavior: none;
    }
    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
    }
    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }
    #loading.loaded {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
    }
  </style>

    /** vertex shader source */
    const vertexShader = `
    attribute vec2 reference;

    uniform float uTime;
    uniform bool uPressed;
    uniform float uPointSize;
    uniform sampler2D texturePosition;

    varying vec3 vPosition;
    varying vec2 vUv;
    varying float vDist;

    void main(){
      vec3 pos = texture2D(texturePosition, reference).xyz;
      
      vPosition = pos;
      vUv = reference;
      vDist = length(pos);
      
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      
      gl_PointSize = uPointSize * (4.0 / - mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
    `;

    /** fragment shader source */
    const fragmentShader = `
    uniform float uTime;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    uniform vec3 uColor4;
    uniform float uOpacity;
    uniform float uMaxRadius;

    varying vec3 vPosition;
    varying vec2 vUv;
    varying float vDist;

    void main () {
      vec2 coord = gl_PointCoord - vec2(0.5);
      float dist = length(coord);
      if (dist > 0.5) discard;
      
      float shapeAlpha = smoothstep(0.5, 0.05, dist);
      float r = clamp(vDist / max(uMaxRadius, 0.1), 0.0, 1.0);
      
      vec3 col;
      if (r < 0.33) {
        col = mix(uColor1, uColor2, r / 0.33);
      } else if (r < 0.66) {
        col = mix(uColor2, uColor3, (r - 0.33) / 0.33);
      } else {
        col = mix(uColor3, uColor4, (r - 0.66) / 0.34);
      }
      
      // subtle core highlight
      col += vec3(1.0 - dist * 2.0) * 0.15;
      
      gl_FragColor = vec4(col, shapeAlpha * uOpacity);
    }
    `;

    /** fragment simulation */
    const positionSimulation = `
    uniform float uTime;
    uniform float uScale;
    uniform float uStepScale;
    uniform float uMaxRadius;

    // Simplex 4D Noise 
    // by Ian McEwan, Ashima Arts
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    float permute(float x){return floor(mod(((x*34.0)+1.0)*x, 289.0));}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
    float taylorInvSqrt(float r){return 1.79284291400159 - 0.85373472095314 * r;}

    vec4 grad4(float j, vec4 ip){
      const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
      vec4 p,s;

      p.xyz = floor( fract (vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
      p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
      s = vec4(lessThan(p, vec4(0.0)));
      p.xyz = p.xyz + (s.xyz*2.0 - 1.0) * s.www; 

      return p;
    }

    float snoise(vec4 v){
      const vec2  C = vec2( 0.138196601125010504,  // (5 - sqrt(5))/20  G4
                            0.309016994374947451); // (sqrt(5) - 1)/4   F4
      vec4 i  = floor(v + dot(v, C.yyyy) );
      vec4 x0 = v -   i + dot(i, C.xxxx);

      vec4 i0;

      vec3 isX = step( x0.yzw, x0.xxx );
      vec3 isYZ = step( x0.zww, x0.yyz );
      i0.x = isX.x + isX.y + isX.z;
      i0.yzw = 1.0 - isX;

      i0.y += isYZ.x + isYZ.y;
      i0.zw += 1.0 - isYZ.xy;

      i0.z += isYZ.z;
      i0.w += 1.0 - isYZ.z;

      vec4 i3 = clamp( i0, 0.0, 1.0 );
      vec4 i2 = clamp( i0-1.0, 0.0, 1.0 );
      vec4 i1 = clamp( i0-2.0, 0.0, 1.0 );

      vec4 x1 = x0 - i1 + 1.0 * C.xxxx;
      vec4 x2 = x0 - i2 + 2.0 * C.xxxx;
      vec4 x3 = x0 - i3 + 3.0 * C.xxxx;
      vec4 x4 = x0 - 1.0 + 4.0 * C.xxxx;

      i = mod(i, 289.0); 
      float j0 = permute( permute( permute( permute(i.w) + i.z) + i.y) + i.x);
      vec4 j1 = permute( permute( permute( permute (
                 i.w + vec4(i1.w, i2.w, i3.w, 1.0 ))
               + i.z + vec4(i1.z, i2.z, i3.z, 1.0 ))
               + i.y + vec4(i1.y, i2.y, i3.y, 1.0 ))
               + i.x + vec4(i1.x, i2.x, i3.x, 1.0 ));

      vec4 ip = vec4(1.0/294.0, 1.0/49.0, 1.0/7.0, 0.0) ;

      vec4 p0 = grad4(j0,   ip);
      vec4 p1 = grad4(j1.x, ip);
      vec4 p2 = grad4(j1.y, ip);
      vec4 p3 = grad4(j1.z, ip);
      vec4 p4 = grad4(j1.w, ip);

      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
      p0 *= norm.x;
      p1 *= norm.y;
      p2 *= norm.z;
      p3 *= norm.w;
      p4 *= taylorInvSqrt(dot(p4,p4));

      vec3 m0 = max(0.6 - vec3(dot(x0,x0), dot(x1,x1), dot(x2,x2)), 0.0);
      vec2 m1 = max(0.6 - vec2(dot(x3,x3), dot(x4,x4)            ), 0.0);
      m0 = m0 * m0;
      m1 = m1 * m1;
      return 49.0 * ( dot(m0*m0, vec3( dot( p0, x0 ), dot( p1, x1 ), dot( p2, x2 )))
                   + dot(m1*m1, vec2( dot( p3, x3 ), dot( p4, x4 ) ) ) ) ;
    }

    void main () {
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      vec4 tmpPos = texture2D(texturePosition, uv);
      vec4 tmpVel = texture2D(textureVelocity, uv);
      vec4 pos = tmpPos.xyzw;
      vec4 vel = tmpVel.xyzw;
      
      float noisyX = snoise(vec4(pos.x * uScale, pos.y / uScale, pos.z / uScale, uTime));
      float noisyY = snoise(vec4(pos.x / uScale, pos.y * uScale, pos.z / uScale, uTime));
      float noisyZ = snoise(vec4(pos.x / uScale, pos.y / uScale, pos.z * uScale, uTime));
      
      pos.x += (noisyX + tmpVel.x) * uStepScale;
      pos.y += (noisyY + tmpVel.y) * uStepScale;
      pos.z += (noisyZ + tmpVel.z) * uStepScale;
      
      if (length(pos.xyz) > uMaxRadius) {
        pos.x = (fract(sin(dot(uv, vec2(12.9898, 78.233)) + uTime) * 43758.5453) - 0.5) * 0.2;
        pos.y = (fract(sin(dot(uv, vec2(39.346, 11.135)) + uTime) * 43758.5453) - 0.5) * 0.2;
        pos.z = (fract(sin(dot(uv, vec2(73.156, 52.214)) + uTime) * 43758.5453) - 0.5) * 0.2;
      }
      
      gl_FragColor = pos;
    }
    `;

    const velocitySimulation = `
    void main() {
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      vec4 tmpVel = texture2D(textureVelocity, uv);
      gl_FragColor = tmpVel;
    }
    `;

    /**
     * GPGPU Computation Renderer
     */
    class GPUComputationRenderer {
      constructor( sizeX, sizeY, renderer ) {
        this.variables = [];
        this.currentTextureIndex = 0;
        let dataType = THREE.FloatType;
        const scene = new THREE.Scene();
        const camera = new THREE.Camera();
        camera.position.z = 1;
        const passThruUniforms = {
          passThruTexture: { value: null }
        };
        const passThruShader = createShaderMaterial( getPassThroughFragmentShader(), passThruUniforms );
        const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 2, 2 ), passThruShader );
        scene.add( mesh );

        this.setDataType = function ( type ) {
          dataType = type;
          return this;
        };

        this.addVariable = function ( variableName, computeFragmentShader, initialValueTexture ) {
          const material = this.createShaderMaterial( computeFragmentShader );
          const variable = {
            name: variableName,
            initialValueTexture: initialValueTexture,
            material: material,
            dependencies: null,
            renderTargets: [],
            wrapS: null,
            wrapT: null,
            minFilter: THREE.NearestFilter,
            magFilter: THREE.NearestFilter
          };
          this.variables.push( variable );
          return variable;
        };

        this.setVariableDependencies = function ( variable, dependencies ) {
          variable.dependencies = dependencies;
        };

        this.init = function () {
          if ( renderer.capabilities.isWebGL2 ) {
            renderer.getContext().getExtension('EXT_color_buffer_float');
          } else if ( renderer.extensions.has( 'OES_texture_float' ) === false ) {
            return 'No OES_texture_float support for float textures.';
          }

          if ( renderer.capabilities.maxVertexTextures === 0 ) {
            return 'No support for vertex shader textures.';
          }

          for ( let i = 0; i < this.variables.length; i ++ ) {
            const variable = this.variables[ i ];
            variable.renderTargets[ 0 ] = this.createRenderTarget( sizeX, sizeY, variable.wrapS, variable.wrapT, variable.minFilter, variable.magFilter );
            variable.renderTargets[ 1 ] = this.createRenderTarget( sizeX, sizeY, variable.wrapS, variable.wrapT, variable.minFilter, variable.magFilter );
            this.renderTexture( variable.initialValueTexture, variable.renderTargets[ 0 ] );
            this.renderTexture( variable.initialValueTexture, variable.renderTargets[ 1 ] );

            const material = variable.material;
            const uniforms = material.uniforms;

            if ( variable.dependencies !== null ) {
              for ( let d = 0; d < variable.dependencies.length; d ++ ) {
                const depVar = variable.dependencies[ d ];
                if ( depVar.name !== variable.name ) {
                  let found = false;
                  for ( let j = 0; j < this.variables.length; j ++ ) {
                    if ( depVar.name === this.variables[ j ].name ) {
                      found = true;
                      break;
                    }
                  }
                  if ( ! found ) {
                    return 'Variable dependency not found. Variable=' + variable.name + ', dependency=' + depVar.name;
                  }
                }
                uniforms[ depVar.name ] = { value: null };
                material.fragmentShader = '\nuniform sampler2D ' + depVar.name + ';\n' + material.fragmentShader;
              }
            }
          }
          this.currentTextureIndex = 0;
          return null;
        };

        this.compute = function () {
          const currentTextureIndex = this.currentTextureIndex;
          const nextTextureIndex = this.currentTextureIndex === 0 ? 1 : 0;

          for ( let i = 0, il = this.variables.length; i < il; i ++ ) {
            const variable = this.variables[ i ];
            if ( variable.dependencies !== null ) {
              const uniforms = variable.material.uniforms;
              for ( let d = 0, dl = variable.dependencies.length; d < dl; d ++ ) {
                const depVar = variable.dependencies[ d ];
                uniforms[ depVar.name ].value = depVar.renderTargets[ currentTextureIndex ].texture;
              }
            }
            this.doRenderTarget( variable.material, variable.renderTargets[ nextTextureIndex ] );
          }
          this.currentTextureIndex = nextTextureIndex;
        };

        this.getCurrentRenderTarget = function ( variable ) {
          return variable.renderTargets[ this.currentTextureIndex ];
        };

        this.getAlternateRenderTarget = function ( variable ) {
          return variable.renderTargets[ this.currentTextureIndex === 0 ? 1 : 0 ];
        };

        function addResolutionDefine( materialShader ) {
          materialShader.defines.resolution = 'vec2( ' + sizeX.toFixed( 1 ) + ', ' + sizeY.toFixed( 1 ) + ' )';
        }

        this.addResolutionDefine = addResolutionDefine;

        function createShaderMaterial( computeFragmentShader, uniforms ) {
          uniforms = uniforms || {};
          const material = new THREE.ShaderMaterial( {
            uniforms: uniforms,
            vertexShader: getPassThroughVertexShader(),
            fragmentShader: computeFragmentShader
          } );
          addResolutionDefine( material );
          return material;
        }

        this.createShaderMaterial = createShaderMaterial;

        this.createRenderTarget = function ( sizeXTexture, sizeYTexture, wrapS, wrapT, minFilter, magFilter ) {
          sizeXTexture = sizeXTexture || sizeX;
          sizeYTexture = sizeYTexture || sizeY;
          wrapS = wrapS || THREE.ClampToEdgeWrapping;
          wrapT = wrapT || THREE.ClampToEdgeWrapping;
          minFilter = minFilter || THREE.NearestFilter;
          magFilter = magFilter || THREE.NearestFilter;
          const renderTarget = new THREE.WebGLRenderTarget( sizeXTexture, sizeYTexture, {
            wrapS: wrapS,
            wrapT: wrapT,
            minFilter: minFilter,
            magFilter: magFilter,
            format: THREE.RGBAFormat,
            type: dataType,
            depthBuffer: false
          } );
          return renderTarget;
        };

        this.createTexture = function () {
          const data = new Float32Array( sizeX * sizeY * 4 );
          return new THREE.DataTexture( data, sizeX, sizeY, THREE.RGBAFormat, THREE.FloatType );
        };

        this.renderTexture = function ( input, output ) {
          passThruUniforms.passThruTexture.value = input;
          this.doRenderTarget( passThruShader, output );
          passThruUniforms.passThruTexture.value = null;
        };

        this.doRenderTarget = function ( material, output ) {
          const currentRenderTarget = renderer.getRenderTarget();
          mesh.material = material;
          renderer.setRenderTarget( output );
          renderer.render( scene, camera );
          mesh.material = passThruShader;
          renderer.setRenderTarget( currentRenderTarget );
        };

        function getPassThroughVertexShader() {
          return 'void main()	{\n' + '\n' + '	gl_Position = vec4( position, 1.0 );\n' + '\n' + '}\n';
        }

        function getPassThroughFragmentShader() {
          return 'uniform sampler2D passThruTexture;\n' + '\n' + 'void main() {\n' + '\n' + '	vec2 uv = gl_FragCoord.xy / resolution.xy;\n' + '\n' + '	gl_FragColor = texture2D( passThruTexture, uv );\n' + '\n' + '}\n';
        }
      }
    }

    /**
     * Shape Class
     */
    class Shape {
      constructor(sketch) {
        this.sketch = sketch;
        this.init();
      }
      
      init() {
        this.num = 400;
        this.initGPGPU();
        
        this.geometry = new THREE.BufferGeometry();
        this.material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uPressed: { value: false },
            uPointSize: { value: this.sketch.settings.pointSize },
            uOpacity: { value: this.sketch.settings.pointOpacity },
            uMaxRadius: { value: this.sketch.settings.maxRadius },
            uColor1: { value: new THREE.Color() },
            uColor2: { value: new THREE.Color() },
            uColor3: { value: new THREE.Color() },
            uColor4: { value: new THREE.Color() },
            texturePosition: { value: null },
            textureVelocity: { value: null },
          },
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          transparent: true,
          vertexShader: vertexShader,
          fragmentShader: fragmentShader
        });
        
        let positions = new Float32Array(this.num * this.num * 3);
        let reference = new Float32Array(this.num * this.num * 2);
        
        for (let i = 0; i < this.num * this.num; i++) {
          positions.set([0, 0, 0], i * 3);
        }
        
        for (let j = 0; j < this.num; j++) {
          for (let i = 0; i < this.num; i++) {
            const index = j * this.num + i;
            reference.set([(i + 0.5) / this.num, (j + 0.5) / this.num], index * 2);
          }
        }
        
        this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        this.geometry.setAttribute('reference', new THREE.BufferAttribute(reference, 2));
        
        this.mesh = new THREE.Points(this.geometry, this.material);
        this.sketch.scene.add(this.mesh);
        this.updateColors();
      }
      
      initGPGPU() {
        this.gpuCompute = new GPUComputationRenderer(this.num, this.num, this.sketch.renderer);
        
        this.dataTexturePosition = this.gpuCompute.createTexture();
        this.dataTextureVelocity = this.gpuCompute.createTexture();
        
        this.setPositions(this.dataTexturePosition);
        this.setVelocities(this.dataTextureVelocity);
        
        this.positionVariable = this.gpuCompute.addVariable('texturePosition', positionSimulation, this.dataTexturePosition);
        this.velocityVariable = this.gpuCompute.addVariable('textureVelocity', velocitySimulation, this.dataTextureVelocity);
        
        this.gpuCompute.setVariableDependencies( this.velocityVariable, [ this.positionVariable, this.velocityVariable ] );
        this.gpuCompute.setVariableDependencies( this.positionVariable, [ this.positionVariable, this.velocityVariable ] );
        
        this.positionVariable.material.uniforms['uTime'] = { value: 0 };
        this.positionVariable.material.uniforms['uScale'] = { value: this.sketch.settings.noiseScale };
        this.positionVariable.material.uniforms['uStepScale'] = { value: this.sketch.settings.stepScale };
        this.positionVariable.material.uniforms['uMaxRadius'] = { value: this.sketch.settings.maxRadius };
        
        const error = this.gpuCompute.init();
        if (error !== null) {
          console.error(error);
        }
      }
      
      setVelocities(texture) {
        const arr = texture.image.data;
        for (let i = 0; i < arr.length; i += 4) {
          const r = Math.PI * 2 * Math.random();
          const rand = Math.random();
          arr[i + 0] = Math.cos(r) * rand;
          arr[i + 1] = Math.sin(r) * rand;
          arr[i + 2] = Math.sin(Math.PI * 2 * Math.random()) * Math.random();
          arr[i + 3] = 0.0;
        }
      }
      
      setPositions(texture) {
        const arr = texture.image.data;
        for (let i = 0; i < arr.length; i += 4) {
          arr[i + 0] = (Math.random() - 0.5) * 0.1;
          arr[i + 1] = (Math.random() - 0.5) * 0.1;
          arr[i + 2] = (Math.random() - 0.5) * 0.1;
          arr[i + 3] = Math.random();
        }
      }

      updateColors() {
        if (!this.material) return;
        this.material.uniforms.uColor1.value.set(this.sketch.settings.color1);
        this.material.uniforms.uColor2.value.set(this.sketch.settings.color2);
        this.material.uniforms.uColor3.value.set(this.sketch.settings.color3);
        this.material.uniforms.uColor4.value.set(this.sketch.settings.color4);

        if (this.sketch.settings.blending === 'Normal') {
          this.material.blending = THREE.NormalBlending;
        } else {
          this.material.blending = THREE.AdditiveBlending;
        }
        this.material.needsUpdate = true;
      }
      
      update(time) {
        this.gpuCompute.compute();
        
        this.material.uniforms.texturePosition.value =
          this.gpuCompute.getCurrentRenderTarget(this.positionVariable).texture;
        this.material.uniforms.textureVelocity.value =
          this.gpuCompute.getCurrentRenderTarget(this.velocityVariable).texture;
        
        this.material.uniforms.uTime.value = time;
        this.material.uniforms.uPressed.value = this.sketch.pressed;
        this.material.uniforms.uPointSize.value = this.sketch.settings.pointSize;
        this.material.uniforms.uOpacity.value = this.sketch.settings.pointOpacity;
        this.material.uniforms.uMaxRadius.value = this.sketch.settings.maxRadius;
        
        this.positionVariable.material.uniforms.uTime.value = this.sketch.simTime;
        this.positionVariable.material.uniforms.uScale.value = this.sketch.settings.noiseScale;
        this.positionVariable.material.uniforms.uStepScale.value = this.sketch.settings.stepScale;
        this.positionVariable.material.uniforms.uMaxRadius.value = this.sketch.settings.maxRadius;
      }
    }

    /**
     * Main Sketch Class
     */
    class Sketch {
      constructor() {
        this.settings = {
          greenscreen: false,
          colorScheme: 'Original',
          bgColor: '#000000',
          color1: '#4cff4c',
          color2: '#33ff33',
          color3: '#66ff66',
          color4: '#1a991a',
          invertAchromatic: false,
          blending: 'Additive',
          
          pointSize: 2.0,
          pointOpacity: 0.85,
          maxRadius: 7.0,
          
          simSpeed: 1.0,
          noiseScale: 15.0,
          stepScale: 0.05,
          
          autoRotate: true,
          rotationSpeed: 0.8,
          dragAction: 'Rotate (Right-drag Pan)',
          randomizeOnClick: true
        };

        this.renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });
        document.getElementById('container').appendChild(this.renderer.domElement);
        
        this.init();
      }
      
      init() {
        this.clock = new THREE.Clock(true);
        this.simTime = 0;
        
        this.mouse = new THREE.Vector2();
        this.pressed = false;
        
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.scene = new THREE.Scene();
        
        this.setupCanvas();
        this.setupCamera();
        this.setupControls();
        this.setupShape();
        this.setupGui();
        this.setupEvents();
        
        this.applyScheme('Original');
        this.render();
      }
      
      setupCanvas() {
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
        this.updateBackground();
        
        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';
      }
      
      setupCamera() {
        const fov = 70;
        this.camera = new THREE.PerspectiveCamera(
          fov,
          this.width / this.height,
          0.01,
          1000
        );
        this.camera.position.set(0, 2.5, 5.5);
        this.camera.lookAt(new THREE.Vector3(0, 0, 0));
        this.scene.add(this.camera);
      }

      setupControls() {
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.screenSpacePanning = true;
        this.controls.enableZoom = true;
        this.controls.enableRotate = true;
        this.controls.enablePan = true;
        this.controls.minDistance = 0.5;
        this.controls.maxDistance = 50.0;
        this.updateDragAction();
      }

      updateDragAction() {
        if (!this.controls) return;
        if (this.settings.dragAction === 'Pan across screen') {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
          this.controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
          if (this.controls.touches) {
            this.controls.touches.ONE = THREE.TOUCH.PAN;
          }
        } else {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
          this.controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
          if (this.controls.touches) {
            this.controls.touches.ONE = THREE.TOUCH.ROTATE;
          }
        }
      }
      
      setupShape() {
        this.shapes = [];
        this.shape = new Shape(this);
        this.shapes.push(this.shape);
      }

      updateBackground() {
        if (this.settings.greenscreen) {
          this.renderer.setClearColor(0x00ff00, 1.0);
          document.body.style.backgroundColor = '#00ff00';
        } else {
          const bgCol = new THREE.Color(this.settings.bgColor);
          this.renderer.setClearColor(bgCol, 1.0);
          document.body.style.backgroundColor = this.settings.bgColor;
        }
      }

      applyScheme(schemeKey) {
        let scheme = COLOR_SCHEMES[schemeKey];
        if (!scheme) {
          const lower = String(schemeKey).toLowerCase();
          for (const [k, v] of Object.entries(COLOR_SCHEMES)) {
            if (k.toLowerCase() === lower || k.toLowerCase().startsWith(lower)) {
              scheme = v;
              schemeKey = k;
              break;
            }
          }
        }
        if (!scheme) {
          scheme = COLOR_SCHEMES['Original'];
          schemeKey = 'Original';
        }

        this.settings.colorScheme = schemeKey;

        if (this.settings.invertAchromatic && (schemeKey.includes('Achromatic') || schemeKey.includes('black and white'))) {
          this.settings.bgColor = '#ffffff';
          this.settings.color1 = '#000000';
          this.settings.color2 = '#222222';
          this.settings.color3 = schemeKey.includes('Accent') ? '#ff1744' : '#555555';
          this.settings.color4 = '#888888';
          this.settings.blending = 'Normal';
        } else {
          this.settings.bgColor = scheme.bg;
          this.settings.color1 = scheme.c1;
          this.settings.color2 = scheme.c2;
          this.settings.color3 = scheme.c3;
          this.settings.color4 = scheme.c4;
          this.settings.blending = 'Additive';
        }

        this.updateBackground();
        if (this.shape) {
          this.shape.updateColors();
        }
        this.updateGuiDisplay();
      }

      randomizeProcedural() {
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const randomKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        this.applyScheme(randomKey);

        this.settings.noiseScale = parseFloat((Math.random() * 22.0 + 4.0).toFixed(1));
        this.settings.simSpeed = parseFloat((Math.random() * 1.8 + 0.5).toFixed(2));
        this.settings.stepScale = parseFloat((Math.random() * 0.07 + 0.02).toFixed(3));
        this.settings.maxRadius = parseFloat((Math.random() * 6.0 + 4.0).toFixed(1));
        this.settings.pointSize = parseFloat((Math.random() * 3.5 + 1.2).toFixed(1));
        this.settings.pointOpacity = parseFloat((Math.random() * 0.4 + 0.6).toFixed(2));
        
        let rot = (Math.random() * 2.4 - 1.2);
        if (Math.abs(rot) < 0.25) rot = rot < 0 ? -0.7 : 0.7;
        this.settings.rotationSpeed = parseFloat(rot.toFixed(2));

        if (this.shape) {
          this.shape.updateColors();
        }
        this.updateGuiDisplay();
      }

      updateGuiDisplay() {
        if (!this.gui) return;
        if (typeof this.gui.controllersRecursive === 'function') {
          this.gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (this.gui.controllers) {
          this.gui.controllers.forEach(c => c.updateDisplay());
          if (this.gui.folders) {
            this.gui.folders.forEach(f => {
              if (f.controllers) f.controllers.forEach(c => c.updateDisplay());
            });
          }
        }
      }

      setupGui() {
        this.gui = new GUI({ title: 'Scene Controls' });

        const fTheme = this.gui.addFolder('Color Theme');
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        fTheme.add(this.settings, 'colorScheme', schemeKeys).name('Preset Scheme').onChange(v => this.applyScheme(v));
        fTheme.add(this.settings, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => this.updateBackground());
        fTheme.addColor(this.settings, 'bgColor').name('Background Color').onChange(() => this.updateBackground());
        fTheme.addColor(this.settings, 'color1').name('Particle Color 1').onChange(() => this.shape.updateColors());
        fTheme.addColor(this.settings, 'color2').name('Particle Color 2').onChange(() => this.shape.updateColors());
        fTheme.addColor(this.settings, 'color3').name('Particle Color 3').onChange(() => this.shape.updateColors());
        fTheme.addColor(this.settings, 'color4').name('Particle Color 4').onChange(() => this.shape.updateColors());
        fTheme.add(this.settings, 'invertAchromatic').name('Invert B&W (Light BG)').onChange(() => this.applyScheme(this.settings.colorScheme));
        fTheme.add(this.settings, 'blending', ['Additive', 'Normal']).name('Blending').onChange(() => this.shape.updateColors());

        const fGeo = this.gui.addFolder('Geometry & Particles');
        fGeo.add(this.settings, 'pointSize', 0.5, 8.0, 0.1).name('Point Size');
        fGeo.add(this.settings, 'pointOpacity', 0.1, 1.0, 0.05).name('Opacity');
        fGeo.add(this.settings, 'maxRadius', 2.0, 15.0, 0.5).name('Max Radius');

        const fMotion = this.gui.addFolder('Motion & Simulation');
        fMotion.add(this.settings, 'simSpeed', 0.1, 3.0, 0.05).name('Sim Speed');
        fMotion.add(this.settings, 'noiseScale', 1.0, 30.0, 0.5).name('Noise Scale');
        fMotion.add(this.settings, 'stepScale', 0.01, 0.15, 0.005).name('Step Scale');

        const fCam = this.gui.addFolder('Camera & Interaction');
        fCam.add(this.settings, 'autoRotate').name('Auto Rotate');
        fCam.add(this.settings, 'rotationSpeed', -5.0, 5.0, 0.1).name('Rotation Speed');
        fCam.add(this.settings, 'dragAction', ['Rotate (Right-drag Pan)', 'Pan across screen']).name('Drag Action').onChange(() => this.updateDragAction());
        fCam.add(this.settings, 'randomizeOnClick').name('Randomize on Click');
        fCam.add({ randomize: () => this.randomizeProcedural() }, 'randomize').name('⚡ Randomize Scene');

        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            const isHidden = this.gui._hidden || this.gui.domElement.style.display === 'none';
            if (isHidden) {
              this.gui.show();
              this.gui.domElement.style.display = '';
            } else {
              this.gui.hide();
              this.gui.domElement.style.display = 'none';
            }
          }
        });
      }
      
      render() {
        const delta = this.clock.getDelta();
        const time = this.clock.getElapsedTime();
        this.simTime += delta * this.settings.simSpeed;

        if (this.controls) {
          this.controls.autoRotate = this.settings.autoRotate;
          this.controls.autoRotateSpeed = this.settings.rotationSpeed;
          this.controls.update();
        }
        
        for (let i = 0; i < this.shapes.length; i++) {
          this.shapes[i].update(time);
        }
        
        this.renderer.render(this.scene, this.camera);
        this.animationId = requestAnimationFrame(this.render.bind(this));
      }
      
      setupEvents() {
        window.addEventListener('resize', this.onResize.bind(this), false);
        window.addEventListener('mousemove', this.onMousemove.bind(this), false);

        let downX = 0, downY = 0, downTime = 0, isDown = false;

        window.addEventListener('pointerdown', (e) => {
          if (e.target && e.target.closest && e.target.closest('.lil-gui')) {
            return;
          }
          if (e.button === 0) {
            isDown = true;
            downX = e.clientX;
            downY = e.clientY;
            downTime = performance.now();
            this.pressed = true;
          }
        });

        window.addEventListener('pointerup', (e) => {
          this.pressed = false;
          if (!isDown) return;
          isDown = false;

          if (e.target && e.target.closest && e.target.closest('.lil-gui')) {
            return;
          }

          const moveDist = Math.hypot(e.clientX - downX, e.clientY - downY);
          const duration = performance.now() - downTime;

          if (moveDist < 6 && duration < 500) {
            if (this.settings.randomizeOnClick) {
              this.randomizeProcedural();
            }
          }
        });
      }
      
      onResize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.width, this.height);
      }
      
      onMousemove(event) {
        this.mouse.x = ( event.clientX / window.innerWidth ) * 2 - 1;
        this.mouse.y = - ( event.clientY / window.innerHeight ) * 2 + 1;
      }
    }

    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('loaded');
      }
      new Sketch();
    });
  </script>
