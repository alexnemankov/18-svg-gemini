<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Orbital Stillness</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05020f;
        }
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // =========================================================================
        // POST-PROCESSING SUITE (Inlined PostProcessor.js Pipeline)
        // =========================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        uniform bool greenscreenActive;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          if (!greenscreenActive) {
            color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
            color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          }
          fragColor = vec4(color.rgb, color.a);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        uniform bool greenscreenActive;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          if (greenscreenActive) {
            fragColor = texture(inputTexture, vUv);
            return;
          }
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) renderer.setRenderTarget(this.fbo);
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) renderer.setRenderTarget(null);
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class ShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class BloomPass {
          constructor(strength = 1.6, radius = 1.2, threshold = 0.18, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.4,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 1.1,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.16,
              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.025,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,
              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
              greenscreenActive: false,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                greenscreenActive: { value: false },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                greenscreenActive: { value: false },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader);

            this.copyShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.copyPass = new ShaderPass(this.copyShader);
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;
            this.finalShader.uniforms.greenscreenActive.value = this.settings.greenscreenActive;

            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
            this.rgbShader.uniforms.greenscreenActive.value = this.settings.greenscreenActive;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post-Processing Suite") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            const bloom = root.addFolder("Bloom Optics");
            bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomRadius", 0, 2.5, 0.05).name("Radius").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

            const lens = root.addFolder("Lens, Optics & Tone");
            lens.add(this.settings, "fisheyeStrength", -0.8, 0.8, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
            lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
            lens.add(this.settings, "chromaticAberration", 0, 0.15, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.08, 0.002).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.4, 2.2, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.4, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.6, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            return root;
          }
        }

        // =========================================================================
        // 18 PRECONFIGURED COLOR SCHEMES
        // =========================================================================
        const COLOR_SCHEMES = {
            'Monochromatic': {
                bg: '#02050e',
                core: '#d8f0ff',
                coreGlow: '#4895ef',
                planets: ['#8ecae6', '#219ebc', '#48cae4', '#0077b6', '#90e0ef', '#023e8a'],
                rim: '#e0f7ff',
                trail: '#48cae4',
                bokeh: '#1e6091'
            },
            'Analogous': {
                bg: '#04020f',
                core: '#e0fbff',
                coreGlow: '#00f5d4',
                planets: ['#00f5d4', '#00bbf9', '#4361ee', '#3f37c9', '#7209b7', '#4cc9f0'],
                rim: '#c9f9ff',
                trail: '#00bbf9',
                bokeh: '#4361ee'
            },
            'Complementary': {
                bg: '#08050e',
                core: '#fff3d1',
                coreGlow: '#ffb703',
                planets: ['#023047', '#219ebc', '#fb8500', '#8ecae6', '#ffb703', '#126782'],
                rim: '#ffe3a8',
                trail: '#fb8500',
                bokeh: '#219ebc'

        // Procedural plasma turbulence for realistic solar surface

            return sin(p.x * 3.5 + uTime * 0.8) * cos(p.y * 3.5 + uTime * 0.6) * sin(p.z * 3.5 + uTime * 0.4);

            float pulse = sin(uTime * uPulseRate) * 0.5 + 0.5;
            float turb = snoise(vWorldPos * 1.6) * 0.12;

            float coreFactor = pow(clamp(NdotV + turb, 0.0, 1.0), 1.6);
            float rimFactor = pow(1.0 - NdotV, 2.2);

            vec3 core = mix(uGlowColor * 1.8, uCoreColor * 3.2, coreFactor);
            vec3 glow = uGlowColor * (rimFactor * (2.2 + 0.5 * pulse));

                        if (i < this.history.length) {
                            const p = this.history[i];
                            posAttr[i3] = p.x;
                            posAttr[i3 + 1] = p.y;
                            posAttr[i3 + 2] = p.z;

                            const t = 1.0 - (i / this.maxPoints);
                            alphaAttr[i] = t * t * params.trailOpacity;
                            scaleAttr[i] = 1.2 + t * 2.8;
                        } else {
                            alphaAttr[i] = 0.0;
                            scaleAttr[i] = 0.0;
                        }
                    }

                    this.geometry.attributes.position.needsUpdate = true;
                    this.geometry.attributes.aAlpha.needsUpdate = true;
                    this.geometry.attributes.aScale.needsUpdate = true;
                }
            };
        }

        function createFullOrbitDustRing(a, b, tiltX, tiltZ, pointCount = 300) {
            const positions = new Float32Array(pointCount * 3);
            const alphas = new Float32Array(pointCount);
            const scales = new Float32Array(pointCount);

            for (let i = 0; i < pointCount; i++) {
                const theta = (i / pointCount) * Math.PI * 2.0;
                let x = a * Math.cos(theta);
                let z = b * Math.sin(theta);
                let y = 0;

                const rotX_y = y * Math.cos(tiltX) - z * Math.sin(tiltX);
                const rotX_z = y * Math.sin(tiltX) + z * Math.cos(tiltX);
                y = rotX_y;
                z = rotX_z;

                const rotZ_x = x * Math.cos(tiltZ) - y * Math.sin(tiltZ);
                const rotZ_y = x * Math.sin(tiltZ) + y * Math.cos(tiltZ);
                x = rotZ_x;
                y = rotZ_y;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                alphas[i] = params.orbitDustOpacity * (0.7 + Math.sin(theta * 3.0) * 0.3);
                scales[i] = 1.2 + Math.random() * 0.8;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
            geometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));

            const material = new THREE.ShaderMaterial({
                vertexShader: trailVertexShader,
                fragmentShader: trailFragmentShader,
                uniforms: {
                    uColor: { value: new THREE.Color(params.trailColor) }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);
            return { points, material, geometry, a, b, tiltX, tiltZ };
        }

        // Initialize Celestial Bodies
        PLANET_CONFIGS.forEach((cfg) => {
            const mat = createBodyMaterial(params[cfg.colorKey], cfg.bodyType);
            const mesh = new THREE.Mesh(sphereGeo, mat);
            mesh.scale.setScalar(cfg.radius);
            scene.add(mesh);

            const trail = createTrailingSystem(params.trailLength);
            const dustRing = createFullOrbitDustRing(cfg.a, cfg.b, cfg.tiltX, cfg.tiltZ);

            let ringMesh = null;
            if (cfg.hasRing) {
                const ringGeo = new THREE.PlaneGeometry(cfg.radius * 4.8, cfg.radius * 4.8);
                const ringMat = new THREE.ShaderMaterial({
                    vertexShader: ringVertexShader,
                    fragmentShader: ringFragmentShader,
                    uniforms: {
                        uRingColor: { value: new THREE.Color(params[cfg.colorKey]) },
                        uOpacity: { value: 0.65 }
                    },
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });
                ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI * 0.45;
                scene.add(ringMesh);
            }

            const moonObjects = [];
            cfg.moons.forEach((mCfg) => {
                const moonMat = createBodyMaterial(params.moonColor, mCfg.bodyType);
                const moonMesh = new THREE.Mesh(sphereGeo, moonMat);
                moonMesh.scale.setScalar(mCfg.radius);
                scene.add(moonMesh);

                const moonTrail = createTrailingSystem(35);
                moonObjects.push({
                    mesh: moonMesh,
                    material: moonMat,
                    trail: moonTrail,
                    config: mCfg
                });
            });

            celestialBodies.push({
                config: cfg,
                mesh,
                material: mat,
                trail,
                dustRing,
                ringMesh,
                moons: moonObjects,
                currentPos: new THREE.Vector3()
            });
        });

        // =========================================================================
        // 1. DEEP TWINKLING STARFIELD (Crisp, Multi-Magnitude Stars)
        // =========================================================================
        const starVertexShader = `
        attribute float aSize;
        attribute vec3 aColor;
        attribute vec2 aTwinkle;
        varying vec3 vColor;
        varying float vTwinkle;
        uniform float uTime;
        uniform float uBrightness;

        void main() {
            vColor = aColor;
            float tw = 0.65 + 0.35 * sin(uTime * aTwinkle.x + aTwinkle.y);
            vTwinkle = tw * uBrightness;

            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = aSize * tw * (260.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
        `;

        const starFragmentShader = `
        precision highp float;
        varying vec3 vColor;
        varying float vTwinkle;

        void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;

            float core = exp(-dist * 7.5);

            // Subtle 4-pointed diffraction spike on bright stars
            vec2 ac = abs(coord);
            float crossRays = max(pow(max(1.0 - ac.x * 2.0, 0.0), 9.0) * pow(max(1.0 - ac.y * 22.0, 0.0), 1.6),
                                  pow(max(1.0 - ac.y * 2.0, 0.0), 9.0) * pow(max(1.0 - ac.x * 22.0, 0.0), 1.6));

            float alpha = (core + crossRays * 0.75) * vTwinkle;
            gl_FragColor = vec4(vColor * 1.8, alpha);
        }
        `;

        let starPoints = null;
        let starMaterial = null;

        function initStars() {
            const count = 3800;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const twinkles = new Float32Array(count * 2);

            const spectralColors = [
                new THREE.Color('#ffffff'),
                new THREE.Color('#d2f1ff'),
                new THREE.Color('#ffe9c4'),
                new THREE.Color('#e0d2ff'),
                new THREE.Color('#ffd8dc')
            ];

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const r = 420.0 + Math.random() * 560.0;
                const theta = Math.random() * Math.PI * 2.0;
                const phi = Math.acos(2.0 * Math.random() - 1.0);

                positions[i3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = r * Math.cos(phi);

                const c = spectralColors[Math.floor(Math.random() * spectralColors.length)];
                colors[i3] = c.r;
                colors[i3 + 1] = c.g;
                colors[i3 + 2] = c.b;

                const mag = Math.random();
                sizes[i] = mag < 0.85 ? THREE.MathUtils.randFloat(2.5, 6.0) : THREE.MathUtils.randFloat(7.5, 14.5);

                twinkles[i * 2] = THREE.MathUtils.randFloat(1.2, 3.8);
                twinkles[i * 2 + 1] = Math.random() * Math.PI * 2.0;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('aTwinkle', new THREE.BufferAttribute(twinkles, 2));

            starMaterial = new THREE.ShaderMaterial({
                vertexShader: starVertexShader,
                fragmentShader: starFragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uBrightness: { value: params.starsBrightness }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            starPoints = new THREE.Points(geometry, starMaterial);
            scene.add(starPoints);
        }
        initStars();

        // =========================================================================
        // 2. COSMIC DUST & INTERSTELLAR NEBULA CLOUDS
        // =========================================================================
        const dustVertexShader = `
        attribute float aScale;
        attribute float aAlpha;
        attribute vec3 aDrift;
        varying float vAlpha;
        varying vec3 vWorldPos;
        uniform float uTime;
        uniform float uDensity;

        void main() {
            vAlpha = aAlpha * uDensity;
            vec3 pos = position;
            pos.x += sin(uTime * 0.04 + aDrift.x) * 6.0;
            pos.y += cos(uTime * 0.03 + aDrift.y) * 5.0;
            pos.z += sin(uTime * 0.035 + aDrift.z) * 6.0;

            vWorldPos = pos;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = aScale * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
        `;

        const dustFragmentShader = `
        precision highp float;
        varying float vAlpha;
        varying vec3 vWorldPos;
        uniform vec3 uDustColor1;
        uniform vec3 uDustColor2;
        uniform float uTime;

        void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;

            float puff = pow(clamp(1.0 - dist * 2.0, 0.0, 1.0), 2.2);
            float filament = sin(coord.x * 7.0 + coord.y * 6.0) * 0.15 + 0.85;

            vec3 col = mix(uDustColor1, uDustColor2, sin(vWorldPos.x * 0.012 + vWorldPos.z * 0.012) * 0.5 + 0.5);

            gl_FragColor = vec4(col * 1.35, puff * filament * vAlpha);
        }
        `;

        let dustPoints = null;
        let dustMaterial = null;

        function initCosmicDust() {
            const count = 7500;
            const positions = new Float32Array(count * 3);
            const scales = new Float32Array(count);
            const alphas = new Float32Array(count);
            const drifts = new Float32Array(count * 3);

            const cloudCenters = [
                new THREE.Vector3(-140, 60, -220),
                new THREE.Vector3(160, -40, -180),
                new THREE.Vector3(0, 120, 200),
                new THREE.Vector3(-180, -90, 150),
                new THREE.Vector3(120, 80, 240)
            ];

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const center = cloudCenters[i % cloudCenters.length];
                const spread = 120.0;

                positions[i3] = center.x + (Math.random() - 0.5) * spread * 2.0;
                positions[i3 + 1] = center.y + (Math.random() - 0.5) * spread * 1.2;
                positions[i3 + 2] = center.z + (Math.random() - 0.5) * spread * 2.0;

                scales[i] = THREE.MathUtils.randFloat(40.0, 130.0);
                alphas[i] = THREE.MathUtils.randFloat(0.04, 0.15);

                drifts[i3] = Math.random() * 20.0;
                drifts[i3 + 1] = Math.random() * 20.0;
                drifts[i3 + 2] = Math.random() * 20.0;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
            geometry.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
            geometry.setAttribute('aDrift', new THREE.BufferAttribute(drifts, 3));

            dustMaterial = new THREE.ShaderMaterial({
                vertexShader: dustVertexShader,
                fragmentShader: dustFragmentShader,
                uniforms: {
                    uDustColor1: { value: new THREE.Color(params.bokehColor) },
                    uDustColor2: { value: new THREE.Color(params.coreGlowColor) },
                    uTime: { value: 0 },
                    uDensity: { value: params.cosmicDustDensity }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            dustPoints = new THREE.Points(geometry, dustMaterial);
            scene.add(dustPoints);
        }
        initCosmicDust();

        // =========================================================================
        // 3. BACKGROUND COMETS WITH SOLAR RADIATION PRESSURE TAILS
        // =========================================================================
        const cometTailVertexShader = `
        attribute float aAlpha;
        attribute float aScale;
        varying float vAlpha;

        void main() {
            vAlpha = aAlpha;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = aScale * (190.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
        `;

        const cometTailFragmentShader = `
        precision highp float;
        varying float vAlpha;
        uniform vec3 uColor;

        void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;
            float falloff = pow(clamp(1.0 - dist * 2.0, 0.0, 1.0), 1.6);
            gl_FragColor = vec4(uColor * 2.4, falloff * vAlpha);
        }
        `;

        const comets = [];

        function createComet(config) {
            const group = new THREE.Group();

            const nucGeo = new THREE.SphereGeometry(0.85, 24, 24);
            const nucMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color('#ffffff'),
                transparent: true,
                opacity: 0.95
            });
            const nucleus = new THREE.Mesh(nucGeo, nucMat);
            group.add(nucleus);

            const comaGeo = new THREE.PlaneGeometry(7.5, 7.5);
            const comaMat = new THREE.ShaderMaterial({
                vertexShader: coronaVertex,
                fragmentShader: coronaFragment,
                uniforms: {
                    uGlowColor: { value: new THREE.Color(params.trailColor) },
                    uTime: { value: 0 },
                    uPulseRate: { value: 1.5 }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const comaMesh = new THREE.Mesh(comaGeo, comaMat);
            group.add(comaMesh);

            const maxTail = 135;
            const posArray = new Float32Array(maxTail * 3);
            const alphaArray = new Float32Array(maxTail);
            const scaleArray = new Float32Array(maxTail);

            const tailGeo = new THREE.BufferGeometry();
            tailGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            tailGeo.setAttribute('aAlpha', new THREE.BufferAttribute(alphaArray, 1));
            tailGeo.setAttribute('aScale', new THREE.BufferAttribute(scaleArray, 1));

            const tailMat = new THREE.ShaderMaterial({
                vertexShader: cometTailVertexShader,
                fragmentShader: cometTailFragmentShader,
                uniforms: {
                    uColor: { value: new THREE.Color(params.trailColor) }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const tailPoints = new THREE.Points(tailGeo, tailMat);
            scene.add(tailPoints);
            scene.add(group);

            return {
                group,
                nucleus,
                comaMesh,
                comaMat,
                tailPoints,
                tailGeo,
                tailMat,
                config,
                history: [],
                maxTail
            };
        }

        function initComets() {
            const cometConfigs = [
                { a: 110, b: 65, tiltX: 0.38, tiltZ: -0.28, speed: 0.38, phase: 0.4 },
                { a: 155, b: 85, tiltX: -0.55, tiltZ: 0.42, speed: 0.26, phase: 3.2 },
                { a: 190, b: 95, tiltX: 0.72, tiltZ: 0.65, speed: 0.18, phase: 1.8 }
            ];

            cometConfigs.forEach(cfg => {
                comets.push(createComet(cfg));
            });
        }
        initComets();

        function updateComets(time, delta) {
            const visible = params.cometsEnabled && !params.greenscreen;

            comets.forEach(c => {
                c.group.visible = visible;
                c.tailPoints.visible = visible;
                if (!visible) return;

                const cfg = c.config;
                const theta = cfg.phase + time * cfg.speed * params.cometSpeed * 0.16;

                let x = cfg.a * Math.cos(theta);
                let z = cfg.b * Math.sin(theta);
                let y = 0;

                const rotX_y = y * Math.cos(cfg.tiltX) - z * Math.sin(cfg.tiltX);
                const rotX_z = y * Math.sin(cfg.tiltX) + z * Math.cos(cfg.tiltX);
                y = rotX_y;
                z = rotX_z;

                const rotZ_x = x * Math.cos(cfg.tiltZ) - y * Math.sin(cfg.tiltZ);
                const rotZ_y = x * Math.sin(cfg.tiltZ) + y * Math.cos(cfg.tiltZ);
                x = rotZ_x;
                y = rotZ_y;

                c.group.position.set(x, y, z);
                c.comaMesh.quaternion.copy(camera.quaternion);

                const sunAway = new THREE.Vector3(x, y, z).normalize();

                c.history.unshift({
                    pos: new THREE.Vector3(x, y, z),
                    away: sunAway.clone()
                });
                if (c.history.length > c.maxTail) c.history.pop();

                const posAttr = c.tailGeo.attributes.position.array;
                const alphaAttr = c.tailGeo.attributes.aAlpha.array;
                const scaleAttr = c.tailGeo.attributes.aScale.array;

                for (let i = 0; i < c.maxTail; i++) {
                    const i3 = i * 3;
                    if (i < c.history.length) {
                        const h = c.history[i];
                        const age = i / c.maxTail;
                        const tailDisplace = h.away.clone().multiplyScalar(age * 22.0);
                        const p = h.pos.clone().add(tailDisplace);

                        posAttr[i3] = p.x;
                        posAttr[i3 + 1] = p.y;
                        posAttr[i3 + 2] = p.z;

                        const fade = 1.0 - age;
                        alphaAttr[i] = fade * fade * 0.8;
                        scaleAttr[i] = 1.6 + age * 8.5;
                    } else {
                        alphaAttr[i] = 0;
                        scaleAttr[i] = 0;
                    }
                }

                c.tailGeo.attributes.position.needsUpdate = true;
                c.tailGeo.attributes.aAlpha.needsUpdate = true;
                c.tailGeo.attributes.aScale.needsUpdate = true;
            });
        }

        // =========================================================================
        // SPARSE BOKEH DEPTH-OF-FIELD FIELD (Refined Soft Defocus)
        // =========================================================================
        const bokehVertexShader = `
        attribute float aScale;
        attribute float aOpacity;
        attribute vec3 aOffsetDrift;
        varying float vOpacity;
        uniform float uTime;
        uniform float uDriftSpeed;

        void main() {
            vOpacity = aOpacity;

            vec3 pos = position;
            pos.x += sin(uTime * uDriftSpeed + aOffsetDrift.x) * 4.0;
            pos.y += cos(uTime * uDriftSpeed * 0.8 + aOffsetDrift.y) * 3.5;
            pos.z += sin(uTime * uDriftSpeed * 0.6 + aOffsetDrift.z) * 4.0;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float depth = -mvPosition.z;

            gl_PointSize = aScale * (320.0 / max(depth, 10.0));
            gl_Position = projectionMatrix * mvPosition;
        }
        `;

        const bokehFragmentShader = `
        precision highp float;
        varying float vOpacity;
        uniform vec3 uColor;

        void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;

            float edge = smoothstep(0.5, 0.40, dist);
            float ring = smoothstep(0.35, 0.48, dist) * 0.35;
            float discAlpha = (edge * 0.6 + ring) * vOpacity;

            gl_FragColor = vec4(uColor * 1.3, discAlpha);
        }
        `;

        let bokehPoints = null;
        let bokehMaterial = null;

        function initBokehField() {
            const count = params.bokehCount;
            const positions = new Float32Array(count * 3);
            const scales = new Float32Array(count);
            const opacities = new Float32Array(count);
            const drifts = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const r = 110.0 + Math.cbrt(Math.random()) * 480.0;
                const theta = Math.random() * Math.PI * 2.0;
                const phi = Math.acos(2.0 * Math.random() - 1.0);

                positions[i3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = r * Math.cos(phi);

                scales[i] = THREE.MathUtils.randFloat(params.bokehSize * 0.4, params.bokehSize * 1.3);
                opacities[i] = THREE.MathUtils.randFloat(0.04, 0.24);

                drifts[i3] = Math.random() * 20.0;
                drifts[i3 + 1] = Math.random() * 20.0;
                drifts[i3 + 2] = Math.random() * 20.0;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
            geometry.setAttribute('aOpacity', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('aOffsetDrift', new THREE.BufferAttribute(drifts, 3));

            bokehMaterial = new THREE.ShaderMaterial({
                vertexShader: bokehVertexShader,
                fragmentShader: bokehFragmentShader,
                uniforms: {
                    uColor: { value: new THREE.Color(params.bokehColor) },
                    uTime: { value: 0 },
                    uDriftSpeed: { value: params.bokehDriftSpeed }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            bokehPoints = new THREE.Points(geometry, bokehMaterial);
            scene.add(bokehPoints);
        }
        initBokehField();

        // =========================================================================
        // PALETTE & COLOR MANAGEMENT
        // =========================================================================
        function applyPalette(schemeName) {
            const sc = COLOR_SCHEMES[schemeName];
            if (!sc) return;

            params.palettePreset = schemeName;
            params.bgColor = sc.bg;
            params.coreColor = sc.core;
            params.coreGlowColor = sc.coreGlow;
            params.rimColor = sc.rim;
            params.trailColor = sc.trail;
            params.bokehColor = sc.bokeh;

            if (sc.planets.length >= 6) {
                params.planet1Color = sc.planets[0];
                params.planet2Color = sc.planets[1];
                params.planet3Color = sc.planets[2];
                params.planet4Color = sc.planets[3];
                params.planet5Color = sc.planets[4];
                params.planet6Color = sc.planets[5];
            }
            params.moonColor = sc.rim;

            updateColors();
            if (typeof gui !== 'undefined' && gui) {
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        }

        function updateColors() {
            if (params.greenscreen) {
                renderer.setClearColor(0x00ff00, 1.0);
                document.body.style.backgroundColor = '#00ff00';
                if (postProcessor) postProcessor.settings.greenscreenActive = true;
                if (starMaterial) starMaterial.uniforms.uBrightness.value = 0.0;
                if (dustMaterial) dustMaterial.uniforms.uDensity.value = 0.0;
                if (rayMaterial1) rayMaterial1.uniforms.uIntensity.value = 0.0;
                if (rayMaterial2) rayMaterial2.uniforms.uIntensity.value = 0.0;
            } else {
                renderer.setClearColor(new THREE.Color(params.bgColor), 1.0);
                document.body.style.backgroundColor = params.bgColor;
                if (postProcessor) postProcessor.settings.greenscreenActive = false;
                if (starMaterial) starMaterial.uniforms.uBrightness.value = params.starsBrightness;
                if (dustMaterial) dustMaterial.uniforms.uDensity.value = params.cosmicDustDensity;
                if (rayMaterial1) rayMaterial1.uniforms.uIntensity.value = params.solarRays;
                if (rayMaterial2) rayMaterial2.uniforms.uIntensity.value = params.solarRays;
            }

            sunMaterial.uniforms.uCoreColor.value.set(params.coreColor);
            sunMaterial.uniforms.uGlowColor.value.set(params.coreGlowColor);
            coronaMaterial.uniforms.uGlowColor.value.set(params.coreGlowColor);
            rayMaterial1.uniforms.uGlowColor.value.set(params.coreGlowColor);
            rayMaterial2.uniforms.uGlowColor.value.set(params.coreColor);
            pointLight.color.set(params.coreColor);

            celestialBodies.forEach((body) => {
                const colorHex = params[body.config.colorKey];
                body.material.uniforms.uPlanetColor.value.set(colorHex);
                body.material.uniforms.uRimColor.value.set(params.rimColor);
                body.material.uniforms.uRimPower.value = params.rimPower;
                body.material.uniforms.uRimIntensity.value = params.rimIntensity;

                body.trail.material.uniforms.uColor.value.set(params.trailColor);
                body.dustRing.material.uniforms.uColor.value.set(params.trailColor);

                if (body.ringMesh) {
                    body.ringMesh.material.uniforms.uRingColor.value.set(colorHex);
                }

                body.moons.forEach((m) => {
                    m.material.uniforms.uPlanetColor.value.set(params.moonColor);
                    m.material.uniforms.uRimColor.value.set(params.rimColor);
                    m.material.uniforms.uRimPower.value = params.rimPower;
                    m.material.uniforms.uRimIntensity.value = params.rimIntensity;
                    m.trail.material.uniforms.uColor.value.set(params.trailColor);
                });
            });

            if (bokehMaterial) {
                bokehMaterial.uniforms.uColor.value.set(params.bokehColor);
            }

            if (dustMaterial) {
                dustMaterial.uniforms.uDustColor1.value.set(params.bokehColor);
                dustMaterial.uniforms.uDustColor2.value.set(params.coreGlowColor);
            }

            comets.forEach(c => {
                c.comaMat.uniforms.uGlowColor.value.set(params.trailColor);
                c.tailMat.uniforms.uColor.value.set(params.trailColor);
            });
        }

        // =========================================================================
        // PROCEDURAL VARIATION RANDOMIZER
        // =========================================================================
        function randomizeScene() {
            const keys = Object.keys(COLOR_SCHEMES);
            const randomScheme = keys[Math.floor(Math.random() * keys.length)];
            applyPalette(randomScheme);

            params.animationSpeed = THREE.MathUtils.randFloat(0.35, 1.05);
            params.sunPulseRate = THREE.MathUtils.randFloat(0.5, 1.4);
            params.rimPower = THREE.MathUtils.randFloat(2.0, 4.2);
            params.rimIntensity = THREE.MathUtils.randFloat(1.1, 2.3);
            params.trailOpacity = THREE.MathUtils.randFloat(0.5, 0.9);
            params.bokehDriftSpeed = THREE.MathUtils.randFloat(0.08, 0.28);
            params.starsBrightness = THREE.MathUtils.randFloat(0.8, 1.5);
            params.cosmicDustDensity = THREE.MathUtils.randFloat(0.5, 1.1);
            params.cometSpeed = THREE.MathUtils.randFloat(0.5, 1.6);
            params.solarRays = THREE.MathUtils.randFloat(0.5, 1.5);

            const animMode = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
            params.animationMode = animMode;

            celestialBodies.forEach((body) => {
                body.config.tiltX = THREE.MathUtils.randFloat(-0.25, 0.25);
                body.config.tiltZ = THREE.MathUtils.randFloat(-0.25, 0.25);
                body.config.speed = THREE.MathUtils.randFloat(0.18, 1.4);
                body.dustRing.tiltX = body.config.tiltX;
                body.dustRing.tiltZ = body.config.tiltZ;
            });

            updateColors();
            if (typeof gui !== 'undefined' && gui) {
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        }

        // =========================================================================
        // LIL-GUI SETUP
        // =========================================================================
        const gui = new GUI({ title: 'Orbital Stillness' });

        const fPresets = gui.addFolder('Presets & Motion');
        fPresets.add(params, 'palettePreset', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyPalette);
        fPresets.add(params, 'animationMode', ANIMATION_MODES).name('Camera Animation');
        fPresets.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Motion Speed');

        const fColors = gui.addFolder('Colors & Greenscreen');
        fColors.add(params, 'greenscreen').name('Greenscreen #00ff00').onChange(updateColors);
        fColors.addColor(params, 'bgColor').name('Background Color').onChange(updateColors);
        fColors.addColor(params, 'coreColor').name('Sun Luminary Core').onChange(updateColors);
        fColors.addColor(params, 'coreGlowColor').name('Sun Corona Glow').onChange(updateColors);
        fColors.addColor(params, 'planet1Color').name('Planet 1 Color').onChange(updateColors);
        fColors.addColor(params, 'planet2Color').name('Planet 2 Color').onChange(updateColors);
        fColors.addColor(params, 'planet3Color').name('Planet 3 Color').onChange(updateColors);
        fColors.addColor(params, 'planet4Color').name('Planet 4 Color').onChange(updateColors);
        fColors.addColor(params, 'planet5Color').name('Planet 5 Color').onChange(updateColors);
        fColors.addColor(params, 'planet6Color').name('Planet 6 Color').onChange(updateColors);
        fColors.addColor(params, 'moonColor').name('Moons Color').onChange(updateColors);
        fColors.addColor(params, 'rimColor').name('Rim-Light Color').onChange(updateColors);
        fColors.addColor(params, 'trailColor').name('Orbit Trail Color').onChange(updateColors);
        fColors.addColor(params, 'bokehColor').name('Bokeh Field Color').onChange(updateColors);

        const fCosmic = gui.addFolder('Cosmic Background & Enhancements');
        fCosmic.add(params, 'starsBrightness', 0.0, 3.0, 0.05).name('Stars Brilliance').onChange(v => {
            if (starMaterial && !params.greenscreen) starMaterial.uniforms.uBrightness.value = v;
        });
        fCosmic.add(params, 'cosmicDustDensity', 0.0, 2.5, 0.05).name('Cosmic Dust Clouds').onChange(v => {
            if (dustMaterial && !params.greenscreen) dustMaterial.uniforms.uDensity.value = v;
        });
        fCosmic.add(params, 'cometsEnabled').name('Background Comets').onChange(updateColors);
        fCosmic.add(params, 'cometSpeed', 0.1, 3.0, 0.05).name('Comets Speed');
        fCosmic.add(params, 'solarRays', 0.0, 2.5, 0.05).name('Solar Light Rays').onChange(v => {
            if (rayMaterial1 && !params.greenscreen) {
                rayMaterial1.uniforms.uIntensity.value = v;
                rayMaterial2.uniforms.uIntensity.value = v;
            }
        });

        const fCelestial = gui.addFolder('Celestial & Shader Optics');
        fCelestial.add(params, 'rimPower', 1.0, 6.0, 0.1).name('Rim Sharpness').onChange(updateColors);
        fCelestial.add(params, 'rimIntensity', 0.2, 3.0, 0.05).name('Rim Intensity').onChange(updateColors);
        fCelestial.add(params, 'trailOpacity', 0.1, 1.0, 0.05).name('Trail Brightness');
        fCelestial.add(params, 'orbitDustOpacity', 0.0, 0.6, 0.02).name('Orbit Ellipse Guide').onChange(v => {
            celestialBodies.forEach(b => {
                const alphas = b.dustRing.geometry.attributes.aAlpha.array;
                for (let i = 0; i < alphas.length; i++) {
                    alphas[i] = v * (0.7 + Math.sin(i * 0.1) * 0.3);
                }
                b.dustRing.geometry.attributes.aAlpha.needsUpdate = true;
            });
        });
        fCelestial.add(params, 'bokehDriftSpeed', 0.0, 1.0, 0.02).name('Bokeh Calm Drift').onChange(v => {
            if (bokehMaterial) bokehMaterial.uniforms.uDriftSpeed.value = v;
        });

        const fSystem = gui.addFolder('System & Interactivity');
        fSystem.add(params, 'dpr', ['0.5', '1.0', '1.5', '2.0', 'Auto']).name('Pixel Ratio (DPR)').onChange(updateRendererDPR);
        fSystem.add(params, 'clickToRandomize').name('Click Scene to Reroll');
        fSystem.add({ randomize: randomizeScene }, 'randomize').name('Randomize Scene Now');
        fSystem.add({ resetCamera: () => {
            controls.reset();
            camera.position.set(0, 24, 68);
            controls.target.set(0, 0, 0);
        }}, 'resetCamera').name('Reset Camera');

        postProcessor.attachGUI(gui, 'Post-Processing Suite');
        fPresets.open();

        applyPalette(params.palettePreset);

        // =========================================================================
        // USER INTERACTION: CLICK TO RANDOMIZE (DISTINGUISHING DRAG)
        // =========================================================================
        let pointerDownTime = 0;
        let pointerDownPos = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            pointerDownTime = performance.now();
            pointerDownPos.x = e.clientX;
            pointerDownPos.y = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            if (e.target.closest('.lil-gui')) return;

            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const elapsed = performance.now() - pointerDownTime;

            if (dist < 6 && elapsed < 350 && params.clickToRandomize) {
                randomizeScene();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateRendererDPR();
        });

        // =========================================================================
        // CAMERA MOTION ENGINE
        // =========================================================================
        function updateCameraMotion(t, delta) {
            const mode = params.animationMode;
            if (mode === 'Static (No Camera Motion)') {
                return;
            }

            switch (mode) {
                case 'Orbital Stillness (Dolly-In)': {
                    const cycle = (t * 0.04) % (Math.PI * 2.0);
                    const dollyDist = 58.0 + Math.cos(cycle) * 16.0;
                    const subtleElevation = 20.0 + Math.sin(t * 0.035) * 4.0;
                    const subtleAzimuth = t * 0.03;

                    camera.position.x = Math.sin(subtleAzimuth) * (dollyDist * 0.45);
                    camera.position.z = Math.cos(subtleAzimuth) * dollyDist;
                    camera.position.y = subtleElevation;
                    controls.target.set(Math.sin(t * 0.02) * 1.5, 0, Math.cos(t * 0.02) * 1.5);
                    break;
                }
                case 'Elliptical Horizon Drift': {
                    const radius = 62.0;
                    const az = t * 0.06;
                    camera.position.x = Math.sin(az) * radius;
                    camera.position.z = Math.cos(az) * radius;
                    camera.position.y = 8.0 + Math.sin(t * 0.05) * 4.0;
                    controls.target.set(0, 1.0, 0);
                    break;
                }
                case 'Zenith Meditative Descent': {
                    const radius = 48.0 + Math.sin(t * 0.05) * 6.0;
                    camera.position.x = Math.sin(t * 0.04) * radius;
                    camera.position.z = Math.cos(t * 0.04) * radius;
                    camera.position.y = 52.0 - Math.sin(t * 0.03) * 12.0;
                    controls.target.set(0, 0, 0);
                    break;
                }
                case 'Solar Core Flyby': {
                    const dist = 32.0 + Math.sin(t * 0.08) * 14.0;
                    camera.position.x = Math.sin(t * 0.07) * dist;
                    camera.position.z = Math.cos(t * 0.07) * dist;
                    camera.position.y = 12.0 + Math.cos(t * 0.06) * 6.0;
                    controls.target.set(Math.sin(t * 0.05) * 2.0, 0, 0);
                    break;
                }
                case 'Lissajous Cosmic Swell': {
                    camera.position.x = Math.sin(t * 0.06) * 58.0;
                    camera.position.z = Math.cos(t * 0.03) * 58.0;
                    camera.position.y = 18.0 + Math.sin(t * 0.09) * 14.0;
                    controls.target.set(0, 0, 0);
                    break;
                }
                case 'Inclined Axis Sweep': {
                    const az = t * 0.05;
                    const r = 55.0;
                    camera.position.x = Math.sin(az) * r;
                    camera.position.z = Math.cos(az) * r;
                    camera.position.y = 28.0 * Math.sin(az + 0.4);
                    controls.target.set(0, 0, 0);
                    break;
                }
                case 'Planetary Alignment Chase': {
                    const p3 = celestialBodies[2];
                    const targetX = p3 ? p3.currentPos.x * 0.7 : 0;
                    const targetZ = p3 ? p3.currentPos.z * 0.7 : 0;
                    camera.position.x = Math.sin(t * 0.045) * 52.0 + targetX * 0.3;
                    camera.position.z = Math.cos(t * 0.045) * 52.0 + targetZ * 0.3;
                    camera.position.y = 16.0 + Math.sin(t * 0.05) * 5.0;
                    controls.target.set(targetX * 0.4, 0, targetZ * 0.4);
                    break;
                }
            }
        }

        // =========================================================================
        // INFINITE ANIMATION LOOP
        // =========================================================================
        const clock = new THREE.Clock();
        let simTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            simTime += delta * params.animationSpeed;

            // Update Luminary Soft Pulse & Corona
            sunMaterial.uniforms.uTime.value = simTime;
            sunMaterial.uniforms.uPulseRate.value = params.sunPulseRate;
            coronaMaterial.uniforms.uTime.value = simTime;
            coronaMaterial.uniforms.uPulseRate.value = params.sunPulseRate;

            coronaMesh.quaternion.copy(camera.quaternion);

            // Update Solar Rays rotation
            if (rayMaterial1 && rayMaterial2) {
                rayMaterial1.uniforms.uAngle.value = simTime * 0.08;
                rayMaterial2.uniforms.uAngle.value = -simTime * 0.06;
                rayMesh1.quaternion.copy(camera.quaternion);
                rayMesh2.quaternion.copy(camera.quaternion);
            }

            // Update Celestial Bodies on Elliptical Orbits
            celestialBodies.forEach((body) => {
                const cfg = body.config;
                const theta = cfg.phase + simTime * cfg.speed * 0.25;

                let x = cfg.a * Math.cos(theta);
                let z = cfg.b * Math.sin(theta);
                let y = 0;

                const rotX_y = y * Math.cos(cfg.tiltX) - z * Math.sin(cfg.tiltX);
                const rotX_z = y * Math.sin(cfg.tiltX) + z * Math.cos(cfg.tiltX);
                y = rotX_y;
                z = rotX_z;

                const rotZ_x = x * Math.cos(cfg.tiltZ) - y * Math.sin(cfg.tiltZ);
                const rotZ_y = x * Math.sin(cfg.tiltZ) + y * Math.cos(cfg.tiltZ);
                x = rotZ_x;
                y = rotZ_y;

                body.mesh.position.set(x, y, z);
                body.mesh.rotation.y += delta * 0.35;
                body.currentPos.set(x, y, z);

                body.material.uniforms.uCameraPos.value.copy(camera.position);

                if (body.ringMesh) {
                    body.ringMesh.position.set(x, y, z);
                }

                body.trail.update(body.currentPos);

                body.moons.forEach((moon) => {
                    const mCfg = moon.config;
                    const mTheta = mCfg.phase + simTime * mCfg.speed;
                    const mx = x + mCfg.orbitDist * Math.cos(mTheta);
                    const mz = z + mCfg.orbitDist * Math.sin(mTheta);
                    const my = y + Math.sin(mTheta) * (mCfg.orbitDist * mCfg.tilt);

                    moon.mesh.position.set(mx, my, mz);
                    moon.material.uniforms.uCameraPos.value.copy(camera.position);
                    moon.trail.update(moon.mesh.position);
                });
            });

            // Update Starfield Twinkle
            if (starMaterial) {
                starMaterial.uniforms.uTime.value = simTime;
            }

            // Update Cosmic Dust Drifting
            if (dustMaterial) {
                dustMaterial.uniforms.uTime.value = simTime;
            }

            // Update Background Comets
            updateComets(simTime, delta);

            // Update Bokeh Particles
            if (bokehMaterial) {
                bokehMaterial.uniforms.uTime.value = simTime;
            }

            // Update Camera Motion
            updateCameraMotion(simTime, delta);
            controls.update();

            // Render through PostProcessor Suite
            postProcessor.renderScene(scene, camera);
        }

        animate();
    </script>
</body>
