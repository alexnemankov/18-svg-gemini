<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Arc & Noise Lines Visualizer</title>
  <style>
    body {
      overflow: hidden;
      margin: 0;
      background-color: #000;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
import GUI from "lil-gui";

console.clear();

const noise = `
// Simplex 4D Noise by Ian McEwan, Stefan Gustavson (https://github.com/stegu/webgl-noise)
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
float permute(float x){return floor(mod(((x*34.0)+1.0)*x, 289.0));}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
float taylorInvSqrt(float r){return 1.79284291400159 - 0.85373472095314 * r;}

vec4 grad4(float j, vec4 ip){
  const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
  vec4 p,s;

  p.xyz = floor( fract (vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
  p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
  s = vec4(lessThan(p, vec4(0.0)));
  p.xyz = p.xyz + (s.xyz*2.0 - 1.0) * s.www; 

  return p;
}

float snoise(vec4 v){
  const vec2  C = vec2( 0.138196601125010504,  // (5 - sqrt(5))/20  G4
                        0.309016994374947451); // (sqrt(5) - 1)/4   F4
  vec4 i  = floor(v + dot(v, C.yyyy) );
  vec4 x0 = v -   i + dot(i, C.xxxx);

  vec4 i0;
  vec3 isX = step( x0.yzw, x0.xxx );
  vec3 isYZ = step( x0.zww, x0.yyz );
  i0.x = isX.x + isX.y + isX.z;
  i0.yzw = 1.0 - isX;
  i0.y += isYZ.x + isYZ.y;
  i0.zw += 1.0 - isYZ.xy;
  i0.z += isYZ.z;
  i0.w += 1.0 - isYZ.z;

  vec4 i3 = clamp( i0, 0.0, 1.0 );
  vec4 i2 = clamp( i0-1.0, 0.0, 1.0 );
  vec4 i1 = clamp( i0-2.0, 0.0, 1.0 );

  vec4 x1 = x0 - i1 + 1.0 * C.xxxx;
  vec4 x2 = x0 - i2 + 2.0 * C.xxxx;
  vec4 x3 = x0 - i3 + 3.0 * C.xxxx;
  vec4 x4 = x0 - 1.0 + 4.0 * C.xxxx;

  i = mod(i, 289.0); 
  float j0 = permute( permute( permute( permute(i.w) + i.z) + i.y) + i.x);
  vec4 j1 = permute( permute( permute( permute (
             i.w + vec4(i1.w, i2.w, i3.w, 1.0 ))
           + i.z + vec4(i1.z, i2.z, i3.z, 1.0 ))
           + i.y + vec4(i1.y, i2.y, i3.y, 1.0 ))
           + i.x + vec4(i1.x, i2.x, i3.x, 1.0 ));

  vec4 ip = vec4(1.0/294.0, 1.0/49.0, 1.0/7.0, 0.0) ;

  vec4 p0 = grad4(j0,   ip);
  vec4 p1 = grad4(j1.x, ip);
  vec4 p2 = grad4(j1.y, ip);
  vec4 p3 = grad4(j1.z, ip);
  vec4 p4 = grad4(j1.w, ip);

  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
  p0 *= norm.x;
  p1 *= norm.y;
  p2 *= norm.z;
  p3 *= norm.w;
  p4 *= taylorInvSqrt(dot(p4,p4));

  vec3 m0 = max(0.6 - vec3(dot(x0,x0), dot(x1,x1), dot(x2,x2)), 0.0);
  vec2 m1 = max(0.6 - vec2(dot(x3,x3), dot(x4,x4)            ), 0.0);
  m0 = m0 * m0;
  m1 = m1 * m1;
  return 49.0 * ( dot(m0*m0, vec3( dot( p0, x0 ), dot( p1, x1 ), dot( p2, x2 )))
               + dot(m1*m1, vec2( dot( p3, x3 ), dot( p4, x4 ) ) ) ) ;
}
`;

// 5 Curated Color Schemes
const COLOR_SCHEMES = {
  "Original Monochrome": {
    bg: "#ffffff",
    lines: "#000000",
    arcPrimary: "#222222",
    arcSecondary: "#777777"
  },
  "Cyber Emerald": {
    bg: "#060e0a",
    lines: "#00ff77",
    arcPrimary: "#00e5a3",
    arcSecondary: "#0b3b2c"
  },
  "Solar Flare": {
    bg: "#0e060d",
    lines: "#ff4b2b",
    arcPrimary: "#ff9000",
    arcSecondary: "#8b003a"
  },
  "Electric Blueprint": {
    bg: "#040a16",
    lines: "#00d2ff",
    arcPrimary: "#3a7bd5",
    arcSecondary: "#0f2b5c"
  },
  "Vapor Horizon": {
    bg: "#120d1c",
    lines: "#ff2a85",
    arcPrimary: "#9d4edd",
    arcSecondary: "#00f5d4"
  }
};

const params = {
  colorScheme: "Original Monochrome",
  greenscreen: false,
  bgColor: "#ffffff",
  linesColor: "#000000",
  arcPrimaryColor: "#222222",
  arcSecondaryColor: "#777777",
  
  // Animation settings
  animationMode: "Gentle Orbit",
  animSpeed: 1.0,
  linesRotSpeed: 0.25,
  arcsTimeScale: 0.5,
  
  // Geometric & Noise controls
  arcCount: 20,
  arcWidth: 0.25,
  arcOpacity: 1.0,
  lineWidth: 0.05,
  raysAmount: 13,
  noiseScale: 1.0,
  noiseSpeed: 0.1,
  noiseDistort: 1.0,

  // Render & Interaction
  dpr: Math.min(window.devicePixelRatio || 1, 2),
  clickToRandomize: true
};

const gu = {
  time: { value: 0 },
  timeDelta: { value: 0 },
  arcWidth: { value: params.arcWidth },
  arcOpacity: { value: params.arcOpacity },
  arcPrimary: { value: new THREE.Color(params.arcPrimaryColor) },
  arcSecondary: { value: new THREE.Color(params.arcSecondaryColor) },
  noiseScale: { value: params.noiseScale },
  noiseSpeed: { value: params.noiseSpeed },
  noiseDistort: { value: params.noiseDistort },
  linesColor: { value: new THREE.Color(params.linesColor) }
};

class Arcs extends THREE.Group {
  constructor(count = 20) {
    super();
    this.count = count;
    const segments = 100;
    const g = new THREE.InstancedBufferGeometry().copy(
      new THREE.PlaneGeometry(1, 1, segments, 1).translate(0.5, 0.5, 0)
    );
    g.instanceCount = count;
    g.setAttribute(
      "instData",
      new THREE.InstancedBufferAttribute(
        new Float32Array(
          Array.from({ length: g.instanceCount }, (_, idx) => {
            return [
              2 + ((7 - 2) / g.instanceCount) * idx * (Math.random() * 0.9 + 0.1), // radius
              Math.PI * 0.5 * (Math.floor(Math.random() * 3) + 1), // arc
              Math.PI * 2 * (Math.random() - 0.5), // init rotation
              Math.sign(Math.random() - 0.5) * (Math.random() * 0.5 + 0.1) * Math.PI // speed
            ];
          }).flat()
        ),
        4
      )
    );

    const m = new THREE.MeshBasicMaterial({
      side: THREE.DoubleSide,
      vertexColors: false,
      transparent: true,
      alphaTest: 0.001,
      onBeforeCompile: (shader) => {
        shader.uniforms.time = gu.time;
        shader.uniforms.uArcWidth = gu.arcWidth;
        shader.uniforms.uArcOpacity = gu.arcOpacity;
        shader.uniforms.uPrimary = gu.arcPrimary;
        shader.uniforms.uSecondary = gu.arcSecondary;
        shader.uniforms.uCount = { value: count };

        shader.vertexShader = `
          uniform float time;
          uniform float uArcWidth;
          attribute vec4 instData;
          varying float vIID;
          varying vec2 vUvLocal;
          ${shader.vertexShader}
        `.replace(
          `#include <begin_vertex>`,
          `#include <begin_vertex>
            float iID = float(gl_InstanceID);
            vIID = iID;
            vUvLocal = uv;
            float posZ = sin((rand(vec2(iID)) + time * 0.25) * PI2) * 0.25;
            
            float r = instData.x;
            float arc = instData.y;
            float rotInit = instData.z;
            float rotSpeed = instData.w;
            
            float angle = -(position.x * arc + rotInit + rotSpeed * time * 0.5);
            float radius = r + position.y * uArcWidth;
            float posX = cos(angle) * radius;
            float posY = sin(angle) * radius;
            
            transformed = vec3(posX, posY, posZ);
          `
        );

        shader.fragmentShader = `
          uniform float uArcOpacity;
          uniform vec3 uPrimary;
          uniform vec3 uSecondary;
          uniform float uCount;
          varying float vIID;
          varying vec2 vUvLocal;
          
          float Grid(vec2 p){
            vec2 coord = p.xy;
            vec2 grid = abs(fract(coord - 0.5) - 0.5) / fwidth(coord) / 2.;
            float line = min(grid.x, grid.y);
            return smoothstep(0., 0.1, 1.0 - min(line, 1.0));
          }
          ${shader.fragmentShader}
        `.replace(
          `vec4 diffuseColor = vec4( diffuse, opacity );`,
          `
          bool isHollow = rand(vec2(floor(vIID + 0.1))) > 0.45;
          float a = uArcOpacity;
          if (isHollow) {
            a *= Grid(vUvLocal);
          }
          float mixFactor = clamp(vIID / max(uCount - 1.0, 1.0), 0.0, 1.0);
          vec3 col = mix(uPrimary, uSecondary, mixFactor);
          vec4 diffuseColor = vec4(col, a);
          `
        );
      }
    });
    m.defines = { USE_UV: "" };
    this.mesh = new THREE.Mesh(g, m);
    this.add(this.mesh);
  }
}

class Lines extends LineSegments2 {
  constructor(raysAmount = 13, lineWidth = 0.05) {
    const segments = 100;
    const points = new THREE.Path()
      .absarc(0, 0, 7, 0, Math.PI * 2)
      .getSpacedPoints(segments)
      .map((p, pIdx) => {
        const retVal = [];
        const retVertex = new THREE.Vector3(...p, 0);
        retVal.push(retVertex);
        if (pIdx != 0 && pIdx != segments) {
          retVal.push(retVertex);
        }
        return retVal;
      })
      .flat();

    // rays
    const aStep = (Math.PI * 2) / raysAmount;
    for (let i = 0; i < raysAmount; i++) {
      const p1 = new THREE.Vector3(
        Math.cos(i * aStep),
        Math.sin(i * aStep),
        0
      ).setLength(4);
      const p2 = p1.clone().setLength(12);
      points.push(p1, p2);
    }

    const flatPoints = points.map((p) => [...p]).flat();

    const lineMat = new LineMaterial({
      color: new THREE.Color(params.linesColor),
      linewidth: lineWidth,
      worldUnits: true,
      alphaToCoverage: true,
      onBeforeCompile: (shader) => {
        shader.uniforms.time = gu.time;
        shader.uniforms.uNoiseScale = gu.noiseScale;
        shader.uniforms.uNoiseSpeed = gu.noiseSpeed;
        shader.uniforms.uDistortAmp = gu.noiseDistort;
        shader.uniforms.uLineColor = gu.linesColor;

        shader.vertexShader = `
          uniform float time;
          uniform float uNoiseScale;
          uniform float uNoiseSpeed;
          uniform float uDistortAmp;
          ${noise}
          ${shader.vertexShader}
        `.replace(
          `// camera space
			vec4 start = modelViewMatrix * vec4( instanceStart, 1.0 );
			vec4 end = modelViewMatrix * vec4( instanceEnd, 1.0 );`,
          `
          vec3 startPos = instanceStart;
          float startPosLen = length(startPos);
          vec3 endPos = instanceEnd;
          float endPosLen = length(endPos);
          
          if (startPosLen < 5.0){
            vec3 startNormalized = normalize(startPos);
            vec3 startModel = (modelMatrix * vec4(startNormalized, 1.0)).xyz;
            float startNoise = snoise(vec4(startModel * uNoiseScale, time * uNoiseSpeed)) * uDistortAmp;
            startPos += startNormalized * startNoise;
          }
          
          // camera space
			vec4 start = modelViewMatrix * vec4( startPos, 1.0 );
			vec4 end = modelViewMatrix * vec4( endPos, 1.0 );
          `
        );

        shader.fragmentShader = `
          uniform vec3 uLineColor;
          ${shader.fragmentShader}
        `.replace(
          `vec4 diffuseColor = vec4( diffuse, opacity );`,
          `vec4 diffuseColor = vec4( uLineColor, opacity );`
        );
      }
    });

    lineMat.resolution.set(window.innerWidth, window.innerHeight);

    super(new LineSegmentsGeometry().setPositions(flatPoints), lineMat);
    this.lineMat = lineMat;
  }

  update(t) {
    this.rotation.z = t * params.linesRotSpeed;
  }
}

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(params.bgColor);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100);
camera.position.set(-0.5, -0.5, 0.5).setLength(10);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(params.dpr);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = true;
controls.enablePan = true;
controls.screenSpacePanning = true;

let arcs = new Arcs(params.arcCount);
scene.add(arcs);

let lines = new Lines(params.raysAmount, params.lineWidth);
scene.add(lines);

// Update scene background based on settings
function updateBackground() {
  if (params.greenscreen) {
    scene.background = new THREE.Color("#00ff00");
  } else {
    scene.background = new THREE.Color(params.bgColor);
  }
}

// Rebuild scene meshes when structural geometric parameters change
function rebuildScene() {
  scene.remove(arcs);
  arcs.geometry?.dispose();
  arcs.mesh?.material?.dispose();
  arcs = new Arcs(params.arcCount);
  scene.add(arcs);

  scene.remove(lines);
  lines.geometry?.dispose();
  lines.lineMat?.dispose();
  lines = new Lines(params.raysAmount, params.lineWidth);
  lines.lineMat.resolution.set(window.innerWidth, window.innerHeight);
  scene.add(lines);
}

// Apply color schemes
function applyColorScheme(schemeName) {
  const scheme = COLOR_SCHEMES[schemeName];
  if (!scheme) return;
  params.bgColor = scheme.bg;
  params.linesColor = scheme.lines;
  params.arcPrimaryColor = scheme.arcPrimary;
  params.arcSecondaryColor = scheme.arcSecondary;

  gu.linesColor.value.set(params.linesColor);
  gu.arcPrimary.value.set(params.arcPrimaryColor);
  gu.arcSecondary.value.set(params.arcSecondaryColor);
  updateBackground();
}

// Helper to generate random vibrant/aesthetic color
function getRandomHexColor() {
  const letters = '0123456789ABCDEF';
  let color = '#';
  for (let i = 0; i < 6; i++) {
    color += letters[Math.floor(Math.random() * 16)];
  }
  return color;
}

function getRandomAestheticPalette() {
  const h1 = Math.random();
  const h2 = (h1 + 0.2 + Math.random() * 0.6) % 1.0;
  const isDark = Math.random() > 0.3;

  const cBg = new THREE.Color().setHSL(Math.random(), 0.3, isDark ? 0.04 : 0.96);
  const cLine = new THREE.Color().setHSL(h1, 0.9, isDark ? 0.65 : 0.15);
  const cArc1 = new THREE.Color().setHSL(h2, 0.85, isDark ? 0.55 : 0.25);
  const cArc2 = new THREE.Color().setHSL((h2 + 0.3) % 1.0, 0.8, isDark ? 0.45 : 0.4);

  return {
    bg: '#' + cBg.getHexString(),
    lines: '#' + cLine.getHexString(),
    arcPrimary: '#' + cArc1.getHexString(),
    arcSecondary: '#' + cArc2.getHexString()
  };
}

// Procedural randomizer
function randomizeScene() {
  const pal = getRandomAestheticPalette();
  params.colorScheme = "Custom";
  params.greenscreen = false;
  params.bgColor = pal.bg;
  params.linesColor = pal.lines;
  params.arcPrimaryColor = pal.arcPrimary;
  params.arcSecondaryColor = pal.arcSecondary;

  params.arcCount = Math.floor(10 + Math.random() * 25);
  params.arcWidth = parseFloat((0.15 + Math.random() * 0.45).toFixed(2));
  params.raysAmount = Math.floor(6 + Math.random() * 20);
  params.lineWidth = parseFloat((0.02 + Math.random() * 0.1).toFixed(3));
  params.noiseScale = parseFloat((0.4 + Math.random() * 2.0).toFixed(2));
  params.noiseSpeed = parseFloat((0.04 + Math.random() * 0.25).toFixed(3));
  params.noiseDistort = parseFloat((0.4 + Math.random() * 2.2).toFixed(2));
  params.linesRotSpeed = parseFloat(((Math.random() > 0.5 ? 1 : -1) * (0.1 + Math.random() * 0.4)).toFixed(2));

  // Sync uniforms
  gu.arcWidth.value = params.arcWidth;
  gu.noiseScale.value = params.noiseScale;
  gu.noiseSpeed.value = params.noiseSpeed;
  gu.noiseDistort.value = params.noiseDistort;
  gu.linesColor.value.set(params.linesColor);
  gu.arcPrimary.value.set(params.arcPrimaryColor);
  gu.arcSecondary.value.set(params.arcSecondaryColor);

  updateBackground();
  rebuildScene();
  updateGuiDisplay();
}

// lil-gui setup
const gui = new GUI({ title: "Visualizer Settings" });

// Presets folder
const fTheme = gui.addFolder("Theme & Colors");
const schemeController = fTheme.add(params, "colorScheme", ["Original Monochrome", "Cyber Emerald", "Solar Flare", "Electric Blueprint", "Vapor Horizon", "Custom"])
  .name("Preset Scheme")
  .onChange((val) => {
    if (val !== "Custom") {
      applyColorScheme(val);
      updateGuiDisplay();
    }
  });

fTheme.add(params, "greenscreen")
  .name("Greenscreen (#00ff00)")
  .onChange(() => {
    updateBackground();
  });

fTheme.addColor(params, "bgColor")
  .name("Background")
  .onChange((val) => {
    if (!params.greenscreen) scene.background.set(val);
    params.colorScheme = "Custom";
    schemeController.setValue("Custom");
  });

fTheme.addColor(params, "linesColor")
  .name("Lines Color")
  .onChange((val) => {
    gu.linesColor.value.set(val);
    params.colorScheme = "Custom";
    schemeController.setValue("Custom");
  });

fTheme.addColor(params, "arcPrimaryColor")
  .name("Arc Primary")
  .onChange((val) => {
    gu.arcPrimary.value.set(val);
    params.colorScheme = "Custom";
    schemeController.setValue("Custom");
  });

fTheme.addColor(params, "arcSecondaryColor")
  .name("Arc Secondary")
  .onChange((val) => {
    gu.arcSecondary.value.set(val);
    params.colorScheme = "Custom";
    schemeController.setValue("Custom");
  });

// Animation folder
const fAnim = gui.addFolder("Motion & Camera");
fAnim.add(params, "animationMode", [
  "Static (Manual Orbit)",
  "Gentle Orbit",
  "Breathing Float",
  "Figure-8 Infinity",
  "Zenith Spiral"
]).name("Camera Mode");

fAnim.add(params, "animSpeed", 0.0, 3.0, 0.01).name("Anim Speed");
fAnim.add(params, "linesRotSpeed", -1.0, 1.0, 0.01).name("Lines Spin Speed");

// Geometry & Noise folder
const fGeom = gui.addFolder("Geometry & Noise");
fGeom.add(params, "arcCount", 5, 40, 1).name("Arcs Count").onFinishChange(rebuildScene);
fGeom.add(params, "arcWidth", 0.05, 0.8, 0.01).name("Arc Width").onChange((v) => { gu.arcWidth.value = v; });
fGeom.add(params, "arcOpacity", 0.1, 1.0, 0.01).name("Arc Opacity").onChange((v) => { gu.arcOpacity.value = v; });
fGeom.add(params, "raysAmount", 4, 32, 1).name("Rays Amount").onFinishChange(rebuildScene);
fGeom.add(params, "lineWidth", 0.01, 0.2, 0.005).name("Line Width").onFinishChange(rebuildScene);
fGeom.add(params, "noiseScale", 0.1, 3.0, 0.01).name("Noise Scale").onChange((v) => { gu.noiseScale.value = v; });
fGeom.add(params, "noiseSpeed", 0.01, 0.5, 0.005).name("Noise Speed").onChange((v) => { gu.noiseSpeed.value = v; });
fGeom.add(params, "noiseDistort", 0.0, 3.0, 0.01).name("Noise Distortion").onChange((v) => { gu.noiseDistort.value = v; });

// System & Render
const fSys = gui.addFolder("System & Click Mode");
fSys.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange((v) => {
  renderer.setPixelRatio(v);
});
fSys.add(params, "clickToRandomize").name("Click Scene to Re-roll");
fSys.add({ randomize: randomizeScene }, "randomize").name("Randomize Now");

function updateGuiDisplay() {
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

// Hide / Show UI with 'H' key
window.addEventListener("keydown", (e) => {
  if (e.key === "h" || e.key === "H") {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
    if (gui._hidden) {
      gui.show();
    } else {
      gui.hide();
    }
  }
});

// Scene click detection for re-roll
let pointerDownPos = { x: 0, y: 0 };
let pointerDownTime = 0;

window.addEventListener("pointerdown", (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
  pointerDownTime = performance.now();
});

window.addEventListener("pointerup", (e) => {
  if (!params.clickToRandomize) return;
  // Ignore clicks on the GUI
  if (e.target.closest && e.target.closest('.lil-gui')) return;

  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const dt = performance.now() - pointerDownTime;
  const dist = Math.hypot(dx, dy);

  // If minimal movement and fast press -> it's a click, not an orbit/pan drag
  if (dist < 6 && dt < 350) {
    randomizeScene();
  }
});

// Window resize handling
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (lines && lines.lineMat) {
    lines.lineMat.resolution.set(window.innerWidth, window.innerHeight);
  }
});

// Animation loop
const clock = new THREE.Clock();
let t = 0;
const defaultDistance = 10;

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  t += dt * params.animSpeed;
  gu.time.value = t;
  gu.timeDelta.value = dt;

  // Handle Preset Camera Animations
  if (params.animationMode === "Gentle Orbit") {
    const camDist = 10;
    const angle = t * 0.12;
    camera.position.x = Math.sin(angle) * camDist;
    camera.position.y = Math.cos(angle) * camDist * 0.7;
    camera.position.z = Math.sin(angle * 0.5) * 3.0 + 7.0;
  } else if (params.animationMode === "Breathing Float") {
    const breathe = defaultDistance + Math.sin(t * 0.35) * 2.2;
    const angle = t * 0.08;
    camera.position.x = Math.sin(angle) * breathe;
    camera.position.y = Math.cos(angle) * breathe * 0.8;
    camera.position.z = 6.0 + Math.sin(t * 0.25) * 2.0;
  } else if (params.animationMode === "Figure-8 Infinity") {
    const scale = 9.0;
    const angle = t * 0.15;
    camera.position.x = Math.sin(angle) * scale;
    camera.position.y = Math.sin(angle * 2.0) * (scale * 0.45);
    camera.position.z = Math.cos(angle) * (scale * 0.75) + 3.0;
  } else if (params.animationMode === "Zenith Spiral") {
    const radius = 6.5 + Math.sin(t * 0.18) * 2.0;
    const angle = t * 0.1;
    camera.position.x = Math.cos(angle) * radius;
    camera.position.y = Math.sin(angle) * radius;
    camera.position.z = 9.0 + Math.cos(t * 0.15) * 2.5;
  }
  // If "Static (Manual Orbit)", camera position is left fully to user OrbitControls

  controls.update();
  lines.update(t);
  renderer.render(scene, camera);
});

// Initialize background
updateBackground();
</script>
