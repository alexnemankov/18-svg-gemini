const MAX_LEVELS = 8;
const MAX_DPR = 3;
const DRAG_RESPONSE = 18.0;
const MAX_DELTA = 0.1;

// ============================================================
//  Shaders
// ============================================================
const vertexShader = /* glsl */ `
in vec3 position;
void main() {
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const fragmentShader = /* glsl */ `
precision highp float;
precision highp int;

#define MAX_LEVELS ${MAX_LEVELS}

uniform vec2  uResolution;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamForward;
uniform float uFocal;

uniform mat3  uObjRot;
uniform vec3  uObjPos;
uniform float uThick[MAX_LEVELS];

uniform float uMaxDist;
uniform float uSurfEps;
uniform float uStepFactor;
uniform float uObjSize;
uniform float uFractalScale;
uniform float uBoundRadius;

uniform float uHoloFreq;
uniform float uHoloPhase;
uniform float uHoloAmount;
uniform vec3  uHoloColor;
uniform float uSweepY;
uniform float uScanlineAmt;
uniform float uGlowStrength;
uniform vec3  uGlowColor;
uniform float uExposure;
uniform float uSceneLightIntensity;
uniform float uEnvIntensity;

uniform vec3  uLight1Color;
uniform float uLight1Intensity;
uniform vec3  uLight2Color;
uniform float uLight2Intensity;
uniform vec3  uLight3Color;
uniform float uLight3Intensity;
uniform vec3  uLightDirColor;
uniform float uLightDirIntensity;

uniform float uGlassIor;
uniform float uDispersion;
uniform vec3  uGlassAbsorb;
uniform vec3  uBgColor;

out vec4 fragColor;

const float TAU = 6.28318530718;

// ---------- Math ----------
vec2 sphereIntersect(vec3 ro, vec3 rd, float r) {
  float b = dot(ro, rd);
  float c = dot(ro, ro) - r * r;
  float h = b * b - c;
  if (h < 0.0) return vec2(-1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

vec3 safeRefract(vec3 I, vec3 N, float eta) {
  vec3 r = refract(I, N, eta);
  return dot(r, r) < 1e-6 ? reflect(I, N) : r;
}

// ---------- Color ----------
vec3 holoPalette(float x) {
  vec3 c = 0.5 + 0.5 * cos(TAU * (x + vec3(0.0, 0.33, 0.67)));
  c = mix(c, c * vec3(0.75, 0.9, 1.15), 0.5);
  return c * c;
}

vec3 thinFilm(float ndv, float thickness) {
  float sinT2 = (1.0 - ndv * ndv) / (1.4 * 1.4);
  float cosT  = sqrt(max(1.0 - sinT2, 0.0));
  float phase = thickness * cosT * uHoloFreq;
  vec3  c = 0.5 + 0.5 * cos(TAU * (phase + vec3(0.0, 0.33, 0.67)));
  c = mix(c, c * vec3(0.8, 0.95, 1.2), 0.4);
  return (2.0 * c * c + 0.15) * uHoloColor;
}

vec3 acesTonemap(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

// Linear HDR -> display (exposure, ACES, gamma)
vec3 toDisplay(vec3 c) {
  return pow(acesTonemap(max(c * uExposure, 0.0)), vec3(1.0 / 2.2));
}

// ---------- Environment & Lights ----------
vec3 envBase(vec3 d) {
  return mix(vec3(0.004, 0.005, 0.012), vec3(0.012, 0.008, 0.03),
             clamp(d.y * 0.5 + 0.5, 0.0, 1.0)) * uEnvIntensity;
}

vec3 envLit(vec3 d) {
  vec3 c = envBase(d) * 2.0;
  // Key Light
  c += uLight1Color * (3.0 * uLight1Intensity) *
       smoothstep(0.25, 0.05, abs(d.x)) * smoothstep(0.55, 0.8, d.y);
  // Cool Rim Light
  c += uLight2Color * (2.0 * uLight2Intensity) *
       smoothstep(0.78, 0.96, dot(d, vec3(-0.94, 0.19, 0.28)));
  // Warm Rim Light
  c += uLight3Color * (1.6 * uLight3Intensity) *
       smoothstep(0.80, 0.97, dot(d, vec3(0.93, -0.28, -0.19)));
  // Ambient floor bounce
  c += vec3(0.05, 0.06, 0.1) * smoothstep(0.0, -0.8, d.y) * uEnvIntensity;
  return c * uSceneLightIntensity;
}

// ---------- SDF ----------
float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float map(vec3 p, out float trap) {
  p = (uObjRot * (p - uObjPos)) / uObjSize;
  float d = sdBox(p, vec3(1.0));
  float h = 1.0;
  trap = 1e9;

  for (int i = 0; i < FRACTAL_ITERS; i++) {
    vec3 a = abs(mod(p + h, 2.0 * h) - h);
    float slabs = min(min(a.x, a.y), a.z) - h * uThick[i];
    d = max(d, slabs);
    trap = min(trap, dot(a, a) / (h * h));
    h /= uFractalScale;
  }
  return d * uObjSize;
}

float mapD(vec3 p) {
  float t;
  return map(p, t);
}

// ---------- Normals & AO ----------
vec3 calcNormal(vec3 p, float h) {
  const vec2 k = vec2(1.0, -1.0);
  vec3 g = k.xyy * mapD(p + k.xyy * h) +
           k.yyx * mapD(p + k.yyx * h) +
           k.yxy * mapD(p + k.yxy * h) +
           k.xxx * mapD(p + k.xxx * h);
  return g * inversesqrt(max(dot(g, g), 1e-12));
}

float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, w = 1.0;
  for (int i = 0; i < AO_SAMPLES; i++) {
    float h = 0.01 + 0.06 * float(i);
    occ += (h - mapD(p + n * h)) * w;
    w *= 0.7;
  }
  return clamp(1.0 - 3.0 * occ, 0.0, 1.0);
}

// ---------- Interior march ----------
float traceInterior(vec3 ro, vec3 rd, out vec3 pExit) {
  float t = 0.0;
  for (int i = 0; i < INTERIOR_STEPS; i++) {
    float d = -mapD(ro + rd * t);
    if (d < 0.001) break;
    t += max(d * uStepFactor, 0.004);
    if (t > 2.0 * uBoundRadius) break;
  }
  pExit = ro + rd * t;
  return t;
}

// ---------- Render one sample ----------
vec3 render(vec2 fragCoord) {
  vec2 uv = (2.0 * fragCoord - uResolution) / uResolution.y;

  vec3 ro = uCamPos;
  vec3 rd = normalize(uv.x * uCamRight + uv.y * uCamUp + uFocal * uCamForward);

  vec3  objCol   = vec3(0.0);
  float coverage = 0.0;

  vec2  bnd  = sphereIntersect(ro - uObjPos, rd, uBoundRadius);
  float t    = max(bnd.x, 0.0);
  float tFar = min(bnd.y, t + uMaxDist);
  float glow = 0.0;
  float trap = 0.0;
  bool  hit  = false;

  if (bnd.y > 0.0) {
    for (int i = 0; i < MAX_STEPS; i++) {
      float d = map(ro + rd * t, trap);
      glow += exp(-d * 30.0) * 0.012;
      if (d < uSurfEps * t) { hit = true; break; }
      t += d * uStepFactor;
      if (t > tFar) break;
    }
  }

  if (hit) {
    vec3  p   = ro + rd * t;
    vec3  n   = calcNormal(p, max(uSurfEps * t, 0.0005));
    float ao  = calcAO(p, n);
    float ndv = clamp(dot(n, -rd), 0.0, 1.0);
    float fr  = 1.0 - ndv;
    float fr2 = fr * fr;
    float F   = 0.04 + 0.96 * fr2 * fr2 * fr;

    float filmThick = 1.0 + 0.35 * log(1.0 + trap)
                    + 0.4 * sin(dot(p - uObjPos, vec3(2.1, 1.7, 2.6)))
                    + uHoloPhase / uHoloFreq;
    vec3 film     = thinFilm(ndv, filmThick);
    vec3 reflTint = mix(vec3(1.0), film, uHoloAmount);

    vec3 refl = envLit(reflect(rd, n)) * reflTint;

    vec3 dIn = safeRefract(rd, n, 1.0 / uGlassIor);
    vec3 pExit;
    float thick = traceInterior(p - n * 0.01, dIn, pExit);
    vec3  nExit = -calcNormal(pExit, 0.001);
    vec3  iors  = uGlassIor + vec3(-uDispersion, 0.0, uDispersion);
    vec3 trans;
    trans.r = envLit(safeRefract(dIn, nExit, iors.r)).r;
    trans.g = envLit(safeRefract(dIn, nExit, iors.g)).g;
    trans.b = envLit(safeRefract(dIn, nExit, iors.b)).b;
    trans *= exp(-thick * uGlassAbsorb);

    const vec3 L = vec3(0.5306, 0.7960, -0.2908);
    float dif  = clamp(dot(n, L), 0.0, 1.0);
    vec3  hv   = normalize(L - rd);
    float spec = pow(clamp(dot(n, hv), 0.0, 1.0), 96.0);

    float aoSoft = mix(0.55, 1.0, ao);
    objCol  = mix(trans, refl, F) * aoSoft;
    objCol += film * uHoloAmount * 0.08 * (0.3 + dif) * ao;
    objCol += reflTint * spec * 2.5 * ao * uLightDirColor * uLightDirIntensity * uSceneLightIntensity;

    float sy = (p.y - uObjPos.y) - uSweepY;
    objCol += film * exp(-sy * sy * 60.0) * 0.6;

    // Depth fog -> fades toward the background color
    float depth = max(t - (length(ro - uObjPos) - uBoundRadius), 0.0);
    coverage = exp(-0.08 * depth * depth);
  }

  // Volumetric edge glow
  vec3 glowLin = uGlowColor * holoPalette(0.6 + 0.25 * uv.y + uHoloPhase) * glow * uGlowStrength * uSceneLightIntensity;

  // Composite in display space so background stays exactly as picked
  vec3 bgWithGlow = 1.0 - (1.0 - uBgColor) * (1.0 - toDisplay(glowLin));
  vec3 col = mix(bgWithGlow, toDisplay(objCol + glowLin), coverage);

  // Scanlines
  col *= 1.0 - uScanlineAmt * (0.5 + 0.5 * sin(fragCoord.y * TAU / 3.0));
  return col;
}

void main() {
#if AA > 1
  vec3 col = vec3(0.0);
  for (int j = 0; j < AA; j++) {
    for (int i = 0; i < AA; i++) {
      vec2 o = (vec2(float(i), float(j)) + 0.5) / float(AA) - 0.5;
      col += render(gl_FragCoord.xy + o);
    }
  }
  col /= float(AA * AA);
#else
  vec3 col = render(gl_FragCoord.xy);
#endif
  fragColor = vec4(col, 1.0);
}
`;

  uMaxDist:             { value: PARAMS.maxDist },
  uSurfEps:             { value: PARAMS.surfEps },
  uStepFactor:          { value: PARAMS.stepFactor },

function updateBackgroundColor() {
  const colorHex = PARAMS.greenscreen ? '#00ff00' : PARAMS.backgroundColor;
  hexToVec3(colorHex, uniforms.uBgColor.value);
  document.body.style.background = colorHex;
}

function syncUniforms() {
  const u = uniforms;
  u.uMaxDist.value = PARAMS.maxDist;
  u.uSurfEps.value = PARAMS.surfEps;
  u.uStepFactor.value = PARAMS.stepFactor;
  u.uObjSize.value = PARAMS.objSize;
  u.uFractalScale.value = PARAMS.fractalScale;
  u.uBoundRadius.value = PARAMS.boundRadius;
  u.uHoloFreq.value = PARAMS.holoFreq;
  u.uHoloAmount.value = PARAMS.holoAmount;
  u.uScanlineAmt.value = PARAMS.scanlines;
  u.uGlowStrength.value = PARAMS.glowStrength;
  u.uExposure.value = PARAMS.exposure;
  u.uGlassIor.value = PARAMS.glassIor;
  u.uDispersion.value = PARAMS.dispersion;
  u.uGlassAbsorb.value.set(PARAMS.absorbR, PARAMS.absorbG, PARAMS.absorbB);

  u.uSceneLightIntensity.value = PARAMS.sceneLightIntensity;
  u.uEnvIntensity.value = PARAMS.envIntensity;
  u.uLight1Intensity.value = PARAMS.light1Intensity;
  u.uLight2Intensity.value = PARAMS.light2Intensity;
  u.uLight3Intensity.value = PARAMS.light3Intensity;
  u.uLightDirIntensity.value = PARAMS.lightDirIntensity;

  hexToVec3(PARAMS.glowColor, u.uGlowColor.value);
  hexToVec3(PARAMS.holoColor, u.uHoloColor.value);
  hexToVec3(PARAMS.light1Color, u.uLight1Color.value);
  hexToVec3(PARAMS.light2Color, u.uLight2Color.value);
  hexToVec3(PARAMS.light3Color, u.uLight3Color.value);
  hexToVec3(PARAMS.lightDirColor, u.uLightDirColor.value);
}

function applyColorScheme(name) {
  const s = COLOR_SCHEMES[name];
  if (!s) return;
  PARAMS.colorScheme = name;
  PARAMS.backgroundColor = s.bg;
  PARAMS.absorbR = s.absorb[0];
  PARAMS.absorbG = s.absorb[1];
  PARAMS.absorbB = s.absorb[2];
  PARAMS.glowColor = s.glow;
  PARAMS.holoColor = s.holo;
  PARAMS.light1Color = s.light1;
  PARAMS.light2Color = s.light2;
  PARAMS.light3Color = s.light3;
  PARAMS.lightDirColor = s.lightDir;

  updateBackgroundColor();
  syncUniforms();
  updateGUIControllers();
}

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  renderer.getDrawingBufferSize(uniforms.uResolution.value);
}

function setDPR(value) {
  const dpr = THREE.MathUtils.clamp(value, 0.5, MAX_DPR);
  renderer.setPixelRatio(dpr);
  composer.setPixelRatio(dpr);
  resize();
}

function setDefine(name, value) {
  const v = Math.round(value);
  if (material.defines[name] === v) return;
  material.defines[name] = v;
  material.needsUpdate = true;
}

window.addEventListener('resize', resize);
updateBackgroundColor();
syncUniforms();
resize();

// ============================================================
//  Animation Engine
// ============================================================
const anim = {
  rotPhase: 0,
  morphPhase: 0,
  holoPhase: 0,
  sweepPhase: 0,
  camAnimPhase: 0
};

const rotY = new THREE.Matrix3();
const rotX = new THREE.Matrix3();
const autoRot = new THREE.Matrix3();

function updateAnimation(dt) {
  const t = PARAMS.paused ? 0 : dt * PARAMS.timeScale;
  anim.rotPhase     += t * PARAMS.rotSpeed;
  anim.morphPhase   += t * PARAMS.morphSpeed;
  anim.holoPhase    += t * PARAMS.holoSpeed;
  anim.sweepPhase   += t * PARAMS.sweepSpeed;
  anim.camAnimPhase += t;

  // Auto rotation of object
  const ay = anim.rotPhase;
  const ax = 0.35 + 0.2 * Math.sin(anim.rotPhase * 0.7);
  const cy = Math.cos(ay), sy = Math.sin(ay);
  const cx = Math.cos(ax), sx = Math.sin(ax);
  rotY.set(cy, 0, sy,   0, 1, 0,   -sy, 0, cy);
  rotX.set(1, 0, 0,    0, cx, -sx,  0, sx, cx);
  autoRot.multiplyMatrices(rotY, rotX);
  uniforms.uObjRot.value.copy(autoRot);

  // Per-level slab breathing thickness wave
  for (let i = 0; i < MAX_LEVELS; i++) {
    thickArray[i] = (1 / 3) *
      (1 + PARAMS.morphAmount * Math.sin(anim.morphPhase - i * PARAMS.levelPhaseLag * 3));
  }

  uniforms.uHoloPhase.value = anim.holoPhase;
  const s = anim.sweepPhase % 5.0;
  uniforms.uSweepY.value = (s < 0 ? s + 5.0 : s) - 2.5;

  // 8 Smooth preconfigured camera animations
  let animYaw = 0;
  let animPitch = 0;
  let animDistMult = 1.0;

  switch (PARAMS.animationMode) {
    case 'Static (No Camera Motion)':
      break;
    case 'Slow Orbit':
      animYaw = anim.camAnimPhase * 0.18;
      break;
    case 'Gentle Levitation':
      animYaw = Math.sin(anim.camAnimPhase * 0.12) * 0.15;
      animPitch = Math.sin(anim.camAnimPhase * 0.22) * 0.22;
      break;
    case 'Cosmic Drift':
      animYaw = anim.camAnimPhase * 0.12;
      animPitch = Math.sin(anim.camAnimPhase * 0.18) * 0.28;
      break;
    case 'Figure-Eight Drift':
      animYaw = Math.sin(anim.camAnimPhase * 0.2) * 0.38;
      animPitch = Math.sin(anim.camAnimPhase * 0.4) * 0.22;
      break;
    case 'Deep Breath & Sway':
      animYaw = Math.sin(anim.camAnimPhase * 0.15) * 0.22;
      animPitch = Math.sin(anim.camAnimPhase * 0.22) * 0.14;
      animDistMult = 1.0 + 0.05 * Math.sin(anim.camAnimPhase * 0.3);
      break;
    case 'Zenith Pan & Tilt':
      animYaw = Math.sin(anim.camAnimPhase * 0.12) * 0.35;
      animPitch = 0.3 + 0.25 * Math.sin(anim.camAnimPhase * 0.16);
      break;
    case 'Prism Float':
      animYaw = anim.camAnimPhase * 0.1;
      animPitch = 0.25 * Math.cos(anim.camAnimPhase * 0.15);
      animDistMult = 1.0 + 0.04 * Math.sin(anim.camAnimPhase * 0.25);
      break;
  }

  // Combine user interactive angles and animation modulation
  const totalYaw = PARAMS.camYaw + animYaw;
  const totalPitch = THREE.MathUtils.clamp(
    PARAMS.camPitch + animPitch,
    -Math.PI / 2 + 0.05,
    Math.PI / 2 - 0.05
  );
  const totalDist = PARAMS.camDistance * animDistMult;

  // Compute camera position & basis in spherical coordinates
  const cy_ = Math.cos(totalYaw), sy_ = Math.sin(totalYaw);
  const cp_ = Math.cos(totalPitch), sp_ = Math.sin(totalPitch);

  camPos.set(
    totalDist * cp_ * sy_,
    totalDist * sp_,
    -totalDist * cp_ * cy_
  );

  camForward.copy(camPos).negate().normalize();
  camRight.crossVectors(WORLD_UP, camForward).normalize();
  camUp.crossVectors(camForward, camRight);

  // Position object with screen pan offset
  objPos.copy(camPos)
    .addScaledVector(camForward, totalDist)
    .addScaledVector(camRight, PARAMS.panX)
    .addScaledVector(camUp, PARAMS.panY);

  uniforms.uObjPos.value.copy(objPos);
  uniforms.uFocal.value = 1.0 / Math.tan(THREE.MathUtils.degToRad(PARAMS.fov) * 0.5);
}

// ============================================================
//  Mouse & Touch Controls (Orbit, Pan, Zoom with Wheel, Click Randomize)
// ============================================================
const pointer = {
  dragging: false,
  id: -1,
  mode: 'orbit',
  startX: 0,
  startY: 0,
  lastX: 0,
  lastY: 0,
  accX: 0,
  accY: 0,
  panAccX: 0,
  panAccY: 0,
  button: 0,
  startTime: 0
};

const spin = { velYaw: 0, velPitch: 0 };

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('pointerdown', (e) => {
  pointer.dragging = true;
  pointer.id = e.pointerId;
  pointer.button = e.button;
  pointer.startX = e.clientX;
  pointer.startY = e.clientY;
  pointer.lastX = e.clientX;
  pointer.lastY = e.clientY;
  pointer.accX = 0;
  pointer.accY = 0;
  pointer.panAccX = 0;
  pointer.panAccY = 0;
  pointer.startTime = performance.now();

  // Right-click (2), Middle-click (1), Shift+Left, or GUI mode 'pan' activates drag object
  if (e.button === 2 || e.button === 1 || e.shiftKey || PARAMS.dragMode === 'pan') {
    pointer.mode = 'pan';
  } else {
    pointer.mode = 'orbit';
  }

  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointer.dragging || e.pointerId !== pointer.id) return;
  const dx = e.clientX - pointer.lastX;
  const dy = e.clientY - pointer.lastY;
  pointer.lastX = e.clientX;
  pointer.lastY = e.clientY;

  if (pointer.mode === 'pan') {
    pointer.panAccX += dx;
    pointer.panAccY += dy;
  } else {
    pointer.accX += dx;
    pointer.accY += dy;
  }
});

function endDrag(e) {
  if (e.pointerId !== pointer.id) return;
  const dist = Math.hypot(e.clientX - pointer.startX, e.clientY - pointer.startY);
  const elapsed = performance.now() - pointer.startTime;
  pointer.dragging = false;
  pointer.id = -1;
  canvas.classList.remove('dragging');

  // Procedural generation upon scene click without significant drag
  if (dist < 6 && elapsed < 400 && e.button === 0) {
    if (PARAMS.randomizeOnClick) {
      randomizeScene();
    }
  }
}

canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('lostpointercapture', endDrag);

// Smooth Zoom with mouse wheel (persists across animations without resetting)
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = Math.exp(e.deltaY * 0.0015);
  PARAMS.camDistance = THREE.MathUtils.clamp(PARAMS.camDistance * zoomFactor, 1.5, 20.0);
  updateGUIControllers();
}, { passive: false });

function updateUserControls(dt) {
  if (pointer.dragging) {
    if (pointer.mode === 'orbit') {
      const sens = (PARAMS.dragSensitivity * 3.0) / Math.max(window.innerHeight, 1);
      const targetX = (pointer.accX * sens) / dt;
      const targetY = (pointer.accY * sens) / dt;
      pointer.accX = 0;
      pointer.accY = 0;
      const k = 1.0 - Math.exp(-DRAG_RESPONSE * dt);
      spin.velYaw += (targetX - spin.velYaw) * k;
      spin.velPitch += (targetY - spin.velPitch) * k;
    } else if (pointer.mode === 'pan') {
      const fovRad = THREE.MathUtils.degToRad(PARAMS.fov);
      const screenFactor = (2.0 * PARAMS.camDistance * Math.tan(fovRad * 0.5)) / Math.max(window.innerHeight, 1);
      PARAMS.panX += pointer.panAccX * screenFactor;
      PARAMS.panY += -pointer.panAccY * screenFactor;
      pointer.panAccX = 0;
      pointer.panAccY = 0;
      updateGUIControllers();
    }
  } else {
    const decay = Math.exp(-PARAMS.inertiaDamping * dt);
    spin.velYaw *= decay;
    spin.velPitch *= decay;
  }

  // Update persistent camera angle (works seamlessly during orbit animation)
  PARAMS.camYaw += spin.velYaw * dt;
  PARAMS.camPitch -= spin.velPitch * dt;
  PARAMS.camPitch = THREE.MathUtils.clamp(PARAMS.camPitch, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05);
}

// ============================================================
//  Procedural Variation Generator
// ============================================================
function randomizeScene() {
  const schemeNames = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
  applyColorScheme(randomScheme);

  // Geometric parameters
  PARAMS.objSize = +(0.85 + Math.random() * 0.95).toFixed(2);
  PARAMS.fractalScale = +(1.25 + Math.random() * 1.35).toFixed(2);
  PARAMS.fractalIters = Math.floor(3 + Math.random() * 4); // 3..6
  PARAMS.boundRadius = +(1.8 + Math.random() * 1.0).toFixed(2);
  PARAMS.glassIor = +(1.25 + Math.random() * 0.6).toFixed(2);
  PARAMS.dispersion = +(0.01 + Math.random() * 0.06).toFixed(3);
  PARAMS.morphAmount = +(0.05 + Math.random() * 0.25).toFixed(3);
  PARAMS.levelPhaseLag = +(0.4 + Math.random() * 1.4).toFixed(2);
  PARAMS.holoFreq = +(0.8 + Math.random() * 2.8).toFixed(2);
  PARAMS.holoAmount = +(0.2 + Math.random() * 0.55).toFixed(2);

  // Motion parameters
  PARAMS.rotSpeed = +(0.1 + (Math.random() - 0.5) * 0.6).toFixed(2);
  PARAMS.morphSpeed = +(1.2 + Math.random() * 2.8).toFixed(2);
  PARAMS.sweepSpeed = +(0.3 + Math.random() * 0.8).toFixed(2);
  PARAMS.holoSpeed = +(0.04 + Math.random() * 0.14).toFixed(3);
  PARAMS.timeScale = +(0.8 + Math.random() * 0.6).toFixed(2);

  // Lighting
  PARAMS.glowStrength = +(0.5 + Math.random() * 1.1).toFixed(2);
  PARAMS.exposure = +(0.9 + Math.random() * 0.6).toFixed(2);
  PARAMS.sceneLightIntensity = +(0.8 + Math.random() * 0.7).toFixed(2);
  PARAMS.light1Intensity = +(0.7 + Math.random() * 0.7).toFixed(2);
  PARAMS.light2Intensity = +(0.6 + Math.random() * 0.8).toFixed(2);
  PARAMS.light3Intensity = +(0.6 + Math.random() * 0.8).toFixed(2);

  setDefine('FRACTAL_ITERS', PARAMS.fractalIters);
  syncUniforms();
  updateGUIControllers();
}

registerController(fPerf.add(PARAMS, 'dpr', 0.5, MAX_DPR, 0.25).name('DPR (Pixel Ratio)').onChange(setDPR));
registerController(fPerf.add(PARAMS, 'maxSteps', 32, 300, 1).name('Max Steps')
  .onFinishChange((v) => setDefine('MAX_STEPS', v)));
registerController(fPerf.add(PARAMS, 'interiorSteps', 8, 120, 1).name('Interior Steps')
  .onFinishChange((v) => setDefine('INTERIOR_STEPS', v)));
registerController(fPerf.add(PARAMS, 'aoSamples', 1, 10, 1).name('AO Samples')
  .onFinishChange((v) => setDefine('AO_SAMPLES', v)));
registerController(fPerf.add(PARAMS, 'maxDist', 1, 20, 0.1).name('Max Distance'));
registerController(fPerf.add(PARAMS, 'surfEps', 0.0002, 0.01, 0.0001).name('Surface Epsilon'));
registerController(fPerf.add(PARAMS, 'stepFactor', 0.5, 2.0, 0.01).name('Step Factor'));

gui.close();

// Toggle GUI with "H" key
let isGuiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'h' || e.key === 'H') {
    isGuiVisible = !isGuiVisible;
    gui.show(isGuiVisible);
  }
});

// ============================================================
//  Render Loop (Auto Infinite Animation)
// ============================================================
let lastTime = performance.now();

document.addEventListener('visibilitychange', () => {
  lastTime = performance.now();
});

function frame() {
  const now = performance.now();
  const dt = Math.min(Math.max((now - lastTime) / 1000, 1e-4), MAX_DELTA);
  lastTime = now;

  updateUserControls(dt);
  updateAnimation(dt);
  syncUniforms();

  composer.render();
}

renderer.setAnimationLoop(frame);
</script>
</body>
</html>
