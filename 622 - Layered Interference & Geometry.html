<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>622 - Generative Layered Interference & Geometry</title>

  <!-- p5.js Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>

  <!-- Chroma.js for Color Dynamics CDN -->

  <!-- lil-gui Modern Interactive Controls CDN -->

  <style>
    /* =========================================================================
       CSS RESET & FULL-VIEWPORT CANVAS UX
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0c0f17;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background-color 0.4s ease, padding 0.3s ease;
    }

    canvas {
      display: block;
      cursor: grab;
      touch-action: none;
      outline: none;
      transition: box-shadow 0.3s ease, border-radius 0.3s ease;
    }

    body.grabbing canvas,
    canvas.grabbing {
      cursor: grabbing !important;
    }

    /* Fixed Aspect Ratio Framed Presentation (4:5 Art Print, 1:1, etc.) */
    body.mode-framed #canvas-container {
      padding: 32px;
      background: radial-gradient(circle at 50% 50%, #171d2c 0%, #080b12 100%);
    }

    body.mode-framed canvas {
      border-radius: 10px;
      box-shadow: 
        0 24px 70px rgba(0, 0, 0, 0.85),
        0 10px 25px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        0 0 0 8px rgba(255, 255, 255, 0.02);
    }

    /* =========================================================================
       lil-gui CUSTOM DARK GLASSMORPHISM THEME
       ========================================================================= */
    .lil-gui.root {
      --background-color: rgba(13, 18, 30, 0.88);
      --text-color: #f1f5f9;
      --title-background-color: rgba(22, 30, 48, 0.95);
      --widget-color: rgba(30, 42, 65, 0.85);
      --hover-color: rgba(45, 62, 94, 0.95);
      --focus-color: #38bdf8;
      --number-color: #38bdf8;
      --string-color: #34d399;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      --font-size: 11px;
      --folder-indent: 8px;

      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.75);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s ease, pointer-events 0.3s ease;
    }

    .lil-gui .title {
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .lil-gui button {
      font-weight: 600;
      cursor: pointer;
    }

    /* Smooth UI Hiding (Triggered via 'H' key) */
    body.hidden-ui .lil-gui.root {
      opacity: 0 !important;
      transform: translateY(14px) !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

  <script>

        ]

      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        palettes: [
          ["#FEF1BE", "#FFBA00", "#008189", "#00474D", "#061210"]
        ]
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        palettes: [
          ["#D4FFB0", "#7FFF00", "#00B894", "#0A3322", "#05140A"]
        ]
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        palettes: [
          ["#FFE8CC", "#FF8C00", "#C7501A", "#3D1050", "#0E0618"]
        ]
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        palettes: [
          ["#E8E0FF", "#B38FFF", "#6A3DE8", "#1A1250", "#090612"]
        ]
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        palettes: [
          ["#E0FBFF", "#00F0FF", "#D40078", "#1E0A3D", "#05020F"]
        ]
      }
    };

    /* =========================================================================
       APPLICATION STATE & CONFIGURATION
       ========================================================================= */
    const params = {
      // 🎨 Color & Theme
      colorScheme: 'Original',
      color1: '#fb6107',
      color2: '#5c8001',
      bgColor: '#f4f4f4',
      autoBgColor: true,

      // 📐 Geometry & Shapes
      totalShapes: 45,
      shapesPerLayer: 25,
      percentHoles: 0.45,
      shapeSize: 95,
      quantizeDivider: 3,

      // 🏁 Patterns & Modes
      patternMode: 'horizontal', // 'horizontal', 'vertical', 'checkered'
      colorMode: 'horizontal',   // 'same', 'solid', 'horizontal', 'vertical', 'diagonal-tlbr', 'diagonal-trbl', 'cross', 'diag-cross'
      minStripeSize: 4,
      maxStripeSize: 18,

      // ✨ Shadows & Texture
      shadowBlur: 8,
      shadowOffsetX: 4,
      shadowOffsetY: 4,
      shadowMix: 0.5,
      enableGrain: true,
      grainAmount: 0.08,
      grainSeed: 0.42,

      // 🎬 Animation & Motion
      animated: true,
      animSpeed: 1.0,
      stripeFlow: 0.3,
      shapeDrift: 3.5,

      // 🔍 View, Pan & Zoom
      viewMode: 'Full Viewport', // 'Full Viewport', '4:5 Art Print', '1:1 Square', '16:9 Cinema'
      zoom: 1.0,
      panX: 0,
      panY: 0,

      // 🎲 Randomization & Interaction
      randomizeOnClick: true,
      autoPickSchemeOnRandom: true,

      // Actions
      regenerate: () => regenerate(true),
      randomizeColors: () => rerollColors(),
      resetView: () => resetViewTransform(),
      exportImage: () => exportHighResImage()
    };

    // Global offscreen buffers & sketch data
    let buffer1, buffer2;
    let shapes = [];
    let maskBuf1, maskBuf2;
    let holeBuf1, holeBuf2;
    let result1, result2;
    let finalResult;
    let selectedPalette;
    let animTime = 0;
    let mainCanvas;
    let gui;
    let guiControllers = {};

    // Interactive pointer drag / pan / zoom tracking
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let hasMovedSignificantly = false;

    /* =========================================================================
       HELPER UTILITIES
       ========================================================================= */
    function weightedRandom(choices) {
      let total = choices.reduce((sum, item) => sum + item.weight, 0);
      let r = random(total);
      let cumulative = 0;
      for (let i = 0; i < choices.length; i++) {
        cumulative += choices[i].weight;
        if (r < cumulative) return choices[i].choice;
      }
      return choices[choices.length - 1].choice;
    }

    function calculateTargetCanvasSize() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      if (params.viewMode === '4:5 Art Print') {
        const padding = 64;
        const maxW = vw - padding;
        const maxH = vh - padding;
        const targetRatio = 4 / 5;
        let w = maxW;
        let h = w / targetRatio;
        if (h > maxH) {
          h = maxH;
          w = h * targetRatio;
        }
        return { w: Math.floor(w), h: Math.floor(h), isFramed: true };
      } else if (params.viewMode === '1:1 Square') {
        const padding = 64;
        const side = Math.min(vw - padding, vh - padding);
        return { w: Math.floor(side), h: Math.floor(side), isFramed: true };
      } else if (params.viewMode === '16:9 Cinema') {
        const padding = 64;
        const maxW = vw - padding;
        const maxH = vh - padding;
        const targetRatio = 16 / 9;
        let w = maxW;
        let h = w / targetRatio;
        if (h > maxH) {
          h = maxH;
          w = h * targetRatio;
        }
        return { w: Math.floor(w), h: Math.floor(h), isFramed: true };
      } else {
        // Full Viewport
        return { w: vw, h: vh, isFramed: false };
      }
    }

    /* =========================================================================
       P5.JS CORE LIFECYCLE
       ========================================================================= */
    function setup() {
      const size = calculateTargetCanvasSize();
      mainCanvas = createCanvas(size.w, size.h);
      mainCanvas.parent('canvas-container');
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

      if (size.isFramed) {
        document.body.classList.add('mode-framed');
      } else {
        document.body.classList.remove('mode-framed');
      }

      initBuffers(width, height);
      initGui();
      attachPointerListeners();

      // Initial procedural creation
      regenerate(true);
    }

    function initBuffers(w, h) {
      buffer1 = createGraphics(w, h);
      buffer2 = createGraphics(w, h);
      maskBuf1 = createGraphics(w, h);
      maskBuf2 = createGraphics(w, h);
      holeBuf1 = createGraphics(w, h);
      holeBuf2 = createGraphics(w, h);
      result1 = createGraphics(w, h);
      result2 = createGraphics(w, h);
      finalResult = createGraphics(w, h);

      if (grainBuffer) {
        grainBuffer = createGraphics(w, h, WEBGL);
        grainShader = grainBuffer.createShader(GRAIN_VERT, GRAIN_FRAG);
      }
    }

    function windowResized() {
      const size = calculateTargetCanvasSize();
      if (size.w !== width || size.h !== height) {
        resizeCanvas(size.w, size.h);
        initBuffers(size.w, size.h);
        regenerate(false);
      }
    }

    /* =========================================================================
       PROCEDURAL GENERATION LOGIC
       ========================================================================= */
    function regenerate(fullRandom = false) {
      if (fullRandom) {
        // Pick scheme if auto-scheme enabled
        if (params.autoPickSchemeOnRandom) {
          const schemeNames = Object.keys(COLOR_SCHEMES);
          params.colorScheme = schemeNames[Math.floor(random(schemeNames.length))];
        }

        // Re-roll colors
        rerollColors();

        // Re-roll geometric parameters
        params.percentHoles = Number(random(0.25, 0.55).toFixed(2));
        params.totalShapes = Math.floor(random(25, 75));
        params.shapesPerLayer = Math.floor(params.totalShapes * random(0.35, 0.75));
        params.minStripeSize = Math.floor(random(2, 8));
        params.maxStripeSize = Math.floor(random(12, 32));
        params.shapeSize = Math.floor(Math.min(width, height) / random(6, 14));

        // Re-roll pattern mode
        params.patternMode = weightedRandom([
          { choice: 'horizontal', weight: 3 },
          { choice: 'vertical', weight: 3 },
          { choice: 'checkered', weight: 2 },
        ]);

        if (params.patternMode === 'checkered') {
          params.minStripeSize = Math.floor(params.minStripeSize * random(1.2, 1.8));
          params.maxStripeSize = Math.floor(params.maxStripeSize * random(1.2, 1.8));
        }

        // Re-roll color mode
        params.colorMode = weightedRandom([
          { choice: 'same', weight: 2 },
          { choice: 'solid', weight: 1 },
          { choice: 'horizontal', weight: 2 },
          { choice: 'vertical', weight: 2 },
          { choice: 'diagonal-tlbr', weight: 1 },
          { choice: 'diagonal-trbl', weight: 1 },
          { choice: 'cross', weight: 1 },
          { choice: 'diag-cross', weight: 1 },
        ]);

        // Re-roll motion & shading parameters
        params.shadowBlur = Math.floor(random(4, 18));
        params.shadowOffsetX = Math.floor(params.minStripeSize * random(-1.2, 1.2));
        params.shadowOffsetY = Math.floor(params.minStripeSize * random(-1.2, 1.2));
        params.shadowMix = Number(random(0.35, 0.65).toFixed(2));
        params.grainAmount = Number(random(0.05, 0.12).toFixed(3));
        params.grainSeed = Number(random().toFixed(4));
        params.animSpeed = Number(random(0.6, 1.6).toFixed(2));
        params.stripeFlow = Number(random(0.15, 0.5).toFixed(2));
        params.shapeDrift = Number(random(1.5, 6.0).toFixed(1));

        updateAllGuiControllers();
      }

      // Generate shapes, pattern, masks and combine
      generateShapes();
      generatePattern(animTime * params.stripeFlow);
      createMasks(0, 0);
      createHoles(0, 0);
      compositeLayers();
      combineResults();

      if (params.animated && params.animSpeed > 0) {
        loop();
      } else {
        redraw();
        noLoop();
      }
    }

    function rerollColors() {
      const schemeObj = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];
      const palList = schemeObj.palettes;
      selectedPalette = palList[Math.floor(random(palList.length))];

      let indices = [];
      for (let i = 0; i < selectedPalette.length; i++) indices.push(i);
      let shuffled = shuffle(indices);

      params.color1 = selectedPalette[shuffled[0]];
      params.color2 = selectedPalette[shuffled[1 % selectedPalette.length]];

      if (params.autoBgColor) {
        let bgSourceColor = selectedPalette[Math.floor(random(selectedPalette.length))];
        try {
          params.bgColor = chroma(bgSourceColor).desaturate(random(1, 2)).brighten(random(0.5, 2)).hex();
        } catch (e) {
          params.bgColor = '#f4f4f4';
        }
      }
    }

    function generateShapes() {
      shapes = [];
      let numShapes = params.totalShapes;
      let quantizeSize = Math.max(2, Math.floor(params.shapeSize / params.quantizeDivider));

      for (let i = 0; i < numShapes; i++) {
        let sizeMultiplier = weightedRandom([
          { choice: 1, weight: 1 },
          { choice: 2, weight: 2 },
          { choice: 3, weight: 3 },
          { choice: 4, weight: 4 },
        ]);
        let size = params.shapeSize * sizeMultiplier;

        let x = random(size / 2, width - size / 2);
        let y = random(size / 2, height - size / 2);
        x = Math.floor(x / quantizeSize) * quantizeSize;
        y = Math.floor(y / quantizeSize) * quantizeSize;

        let shapeType = Math.floor(random(4)); // 0: triangle up, 1: triangle down, 2: hexagon, 3: circle

        shapes.push({
          type: shapeType,
          x: x,
          y: y,
          size: size,
          seed: random(100.0)
        });
      }
    }

    function generatePattern(timeOffset = 0) {
      buffer1.clear();
      buffer2.clear();
      setupFillStyles();

      if (params.patternMode === 'horizontal') {
        generateHorizontalStripes(timeOffset);
      } else if (params.patternMode === 'vertical') {
        generateVerticalStripes(timeOffset);
      } else if (params.patternMode === 'checkered') {
        generateCheckered(timeOffset);
      }
    }

    function setupFillStyles() {
      let ctx1 = buffer1.drawingContext;
      let ctx2 = buffer2.drawingContext;
      let c1 = params.color1;
      let c2 = params.color2;

      if (params.colorMode === 'same') {
        ctx1.fillStyle = c1;
        ctx2.fillStyle = c1;
      } else if (params.colorMode === 'solid') {
        ctx1.fillStyle = c1;
        ctx2.fillStyle = c2;
      } else if (params.colorMode === 'horizontal') {
        let grad1 = ctx1.createLinearGradient(0, 0, width, 0);
        grad1.addColorStop(0, c1);
        grad1.addColorStop(1, c2);
        ctx1.fillStyle = grad1;

        let grad2 = ctx2.createLinearGradient(0, 0, width, 0);
        grad2.addColorStop(0, c2);
        grad2.addColorStop(1, c1);
        ctx2.fillStyle = grad2;
      } else if (params.colorMode === 'vertical') {
        let grad1 = ctx1.createLinearGradient(0, 0, 0, height);
        grad1.addColorStop(0, c1);
        grad1.addColorStop(1, c2);
        ctx1.fillStyle = grad1;

        let grad2 = ctx2.createLinearGradient(0, 0, 0, height);
        grad2.addColorStop(0, c2);
        grad2.addColorStop(1, c1);
        ctx2.fillStyle = grad2;
      } else if (params.colorMode === 'diagonal-tlbr') {
        let grad1 = ctx1.createLinearGradient(0, 0, width, height);
        grad1.addColorStop(0, c1);
        grad1.addColorStop(1, c2);
        ctx1.fillStyle = grad1;

        let grad2 = ctx2.createLinearGradient(0, 0, width, height);
        grad2.addColorStop(0, c2);
        grad2.addColorStop(1, c1);
        ctx2.fillStyle = grad2;
      } else if (params.colorMode === 'diagonal-trbl') {
        let grad1 = ctx1.createLinearGradient(width, 0, 0, height);
        grad1.addColorStop(0, c1);
        grad1.addColorStop(1, c2);
        ctx1.fillStyle = grad1;

        let grad2 = ctx2.createLinearGradient(width, 0, 0, height);
        grad2.addColorStop(0, c2);
        grad2.addColorStop(1, c1);
        ctx2.fillStyle = grad2;
      } else if (params.colorMode === 'cross') {
        let grad1 = ctx1.createLinearGradient(0, 0, width, 0);
        grad1.addColorStop(0, c1);
        grad1.addColorStop(0.5, c2);
        grad1.addColorStop(1, c1);
        ctx1.fillStyle = grad1;

        let grad2 = ctx2.createLinearGradient(0, 0, 0, height);
        grad2.addColorStop(0, c1);
        grad2.addColorStop(0.5, c2);
        grad2.addColorStop(1, c1);
        ctx2.fillStyle = grad2;
      } else if (params.colorMode === 'diag-cross') {
        let grad1 = ctx1.createLinearGradient(0, 0, width, height);
        grad1.addColorStop(0, c1);
        grad1.addColorStop(0.5, c2);
        grad1.addColorStop(1, c1);
        ctx1.fillStyle = grad1;

        let grad2 = ctx2.createLinearGradient(width, 0, 0, height);
        grad2.addColorStop(0, c1);
        grad2.addColorStop(0.5, c2);
        grad2.addColorStop(1, c1);
        ctx2.fillStyle = grad2;
      }
    }

    function generateHorizontalStripes(timeOffset = 0) {
      let y = 0;
      let stripeIndex = 0;

      while (y < height) {
        let noiseValue = noise(stripeIndex * 0.5 + timeOffset);
        let stripeSize = map(noiseValue, 0, 1, params.minStripeSize, params.maxStripeSize);
        stripeSize = Math.max(1, Math.floor(stripeSize));

        if (stripeIndex % 2 === 0) {
          buffer1.noStroke();
          buffer1.rect(0, y, width, stripeSize);
        } else {
          buffer2.noStroke();
          buffer2.rect(0, y, width, stripeSize);
        }

        y += stripeSize;
        stripeIndex++;
      }
    }

    function generateVerticalStripes(timeOffset = 0) {
      let x = 0;
      let stripeIndex = 0;

      while (x < width) {
        let noiseValue = noise(stripeIndex * 0.5 + timeOffset);
        let stripeSize = map(noiseValue, 0, 1, params.minStripeSize, params.maxStripeSize);
        stripeSize = Math.max(1, Math.floor(stripeSize));

        if (stripeIndex % 2 === 0) {
          buffer1.noStroke();
          buffer1.rect(x, 0, stripeSize, height);
        } else {
          buffer2.noStroke();
          buffer2.rect(x, 0, stripeSize, height);
        }

        x += stripeSize;
        stripeIndex++;
      }
    }

    function generateCheckered(timeOffset = 0) {
      let rowHeights = [];
      let y = 0;
      let rowIndex = 0;
      while (y < height) {
        let noiseValue = noise(rowIndex * 0.5 + timeOffset);
        let rowHeight = map(noiseValue, 0, 1, params.minStripeSize, params.maxStripeSize);
        rowHeight = Math.max(1, Math.floor(rowHeight));
        rowHeights.push(rowHeight);
        y += rowHeight;
        rowIndex++;
      }

      let colWidths = [];
      let x = 0;
      let colIndex = 0;
      while (x < width) {
        let noiseValue = noise(colIndex * 0.5 + timeOffset * 0.7);
        let colWidth = map(noiseValue, 0, 1, params.minStripeSize, params.maxStripeSize);
        colWidth = Math.max(1, Math.floor(colWidth));
        colWidths.push(colWidth);
        x += colWidth;
        colIndex++;
      }

      y = 0;
      for (let rowIdx = 0; rowIdx < rowHeights.length; rowIdx++) {
        let rowHeight = rowHeights[rowIdx];
        x = 0;

        for (let colIdx = 0; colIdx < colWidths.length; colIdx++) {
          let colWidth = colWidths[colIdx];
          let isEvenCell = (rowIdx + colIdx) % 2 === 0;
          let buf = isEvenCell ? buffer1 : buffer2;

          buf.noStroke();
          buf.rect(x, y, colWidth, rowHeight);
          x += colWidth;
        }

        y += rowHeight;
      }
    }

    function drawTriangleUp(buf, x, y, size) {
      let h = size * Math.sqrt(3) / 2;
      buf.beginShape();
      buf.vertex(x, y - h / 2);
      buf.vertex(x - size / 2, y + h / 2);
      buf.vertex(x + size / 2, y + h / 2);
      buf.endShape(CLOSE);
    }

    function drawTriangleDown(buf, x, y, size) {
      let h = size * Math.sqrt(3) / 2;
      buf.beginShape();
      buf.vertex(x, y + h / 2);
      buf.vertex(x - size / 2, y - h / 2);
      buf.vertex(x + size / 2, y - h / 2);
      buf.endShape(CLOSE);
    }

    function drawHexagon(buf, x, y, size) {
      let r = size / 2;
      buf.beginShape();
      for (let i = 0; i < 6; i++) {
        let angle = (Math.PI / 3) * i;
        let px = x + r * Math.cos(angle);
        let py = y + r * Math.sin(angle);
        buf.vertex(px, py);
      }
      buf.endShape(CLOSE);
    }

    function drawCircle(buf, x, y, size) {
      buf.circle(x, y, size);
    }

    function drawShape(buf, shape, timeOffset = 0, driftAmp = 0) {
      let sx = shape.x;
      let sy = shape.y;

      if (driftAmp > 0 && timeOffset > 0) {
        sx += Math.sin(timeOffset * 1.1 + shape.seed) * driftAmp;
        sy += Math.cos(timeOffset * 0.9 + shape.seed * 1.3) * driftAmp;
      }

      if (shape.type === 0) {
        drawTriangleUp(buf, sx, sy, shape.size);
      } else if (shape.type === 1) {
        drawTriangleDown(buf, sx, sy, shape.size);
      } else if (shape.type === 2) {
        drawHexagon(buf, sx, sy, shape.size);
      } else {
        drawCircle(buf, sx, sy, shape.size);
      }
    }

    function createMasks(timeOffset = 0, driftAmp = 0) {
      maskBuf1.clear();
      maskBuf1.noStroke();
      maskBuf1.fill('green');

      maskBuf2.clear();
      maskBuf2.noStroke();
      maskBuf2.fill('orange');

      let count = Math.min(params.shapesPerLayer, shapes.length);
      for (let i = 0; i < count; i++) {
        drawShape(maskBuf1, shapes[i], timeOffset, driftAmp);
      }

      for (let i = 0; i < count; i++) {
        // Layer 2 takes shifted subset
        let idx = (i + Math.floor(shapes.length / 2)) % shapes.length;
        drawShape(maskBuf2, shapes[idx], timeOffset, driftAmp);
      }
    }

    function createHoles(timeOffset = 0, driftAmp = 0) {
      holeBuf1.clear();
      holeBuf2.clear();
      holeBuf1.fill(0);
      holeBuf2.fill(0);

      let holeCount = Math.floor(params.shapesPerLayer * params.percentHoles);
      for (let i = 0; i < holeCount; i++) {
        let idx = (i * 3 + 1) % shapes.length;
        drawShape(holeBuf1, shapes[idx], timeOffset, driftAmp);
      }

      for (let i = 0; i < holeCount; i++) {
        let idx = (i * 3 + 2) % shapes.length;
        drawShape(holeBuf2, shapes[idx], timeOffset, driftAmp);
      }
    }

    function compositeLayers() {
      // Composite layer 1: buffer1 masked by maskBuf1, then holes punched
      result1.clear();
      result1.image(buffer1, 0, 0);
      {
        const ctx = result1.drawingContext;
        ctx.save();
        ctx.globalCompositeOperation = 'destination-in';
        ctx.drawImage(maskBuf1.canvas, 0, 0);
        ctx.restore();

        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(holeBuf1.canvas, 0, 0);
        ctx.restore();
      }

      // Composite layer 2: buffer2 masked by maskBuf2, then holes punched
      result2.clear();
      result2.image(buffer2, 0, 0);
      {
        const ctx = result2.drawingContext;
        ctx.save();
        ctx.globalCompositeOperation = 'destination-in';
        ctx.drawImage(maskBuf2.canvas, 0, 0);
        ctx.restore();

        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(holeBuf2.canvas, 0, 0);
        ctx.restore();
      }
    }

    function combineResults() {
      finalResult.clear();
      finalResult.image(result1, 0, 0);
      finalResult.image(result2, 0, 0);
    }

    /* =========================================================================
       MAIN RENDER LOOP
       ========================================================================= */
    function draw() {
      // Dynamic animation progression
      if (params.animated && params.animSpeed > 0) {
        const dt = Math.min(deltaTime / 1000, 0.1);
        animTime += dt * params.animSpeed;

        if (params.stripeFlow > 0) {
          generatePattern(animTime * params.stripeFlow);
        }
        if (params.shapeDrift > 0) {
          createMasks(animTime, params.shapeDrift);
          createHoles(animTime, params.shapeDrift);
        }
        if (params.stripeFlow > 0 || params.shapeDrift > 0) {
          compositeLayers();
          combineResults();
        }
      }

      // Render base canvas background
      background(params.bgColor);

      // Pan & Zoom Coordinate Transformation
      push();
      translate(width / 2 + params.panX, height / 2 + params.panY);
      scale(params.zoom);
      translate(-width / 2, -height / 2);

      // Canvas drop shadow
      drawingContext.shadowColor = lerpColor(color(params.color1), color(params.color2), params.shadowMix);
      drawingContext.shadowBlur = params.shadowBlur;
      drawingContext.shadowOffsetX = params.shadowOffsetX;
      drawingContext.shadowOffsetY = params.shadowOffsetY;

      // Draw composite
      image(finalResult, 0, 0);
      pop();

      // Reset shadow for subsequent passes
      drawingContext.shadowColor = 'transparent';
      drawingContext.shadowBlur = 0;
      drawingContext.shadowOffsetX = 0;
      drawingContext.shadowOffsetY = 0;

      // WebGL Grain Postprocessing
      if (params.enableGrain && params.grainAmount > 0) {
        applyGrain({
          noiseAmount: params.grainAmount,
          noiseSeed: (params.animated && params.animSpeed > 0) ? Math.random() : params.grainSeed,
          clearBeforeDraw: false
        });
      }
    }

    /* =========================================================================
       REUSABLE GRAIN SHADER UTILITY
       ========================================================================= */
    const GRAIN_VERT = `
precision highp float;
attribute vec3 aPosition;
attribute vec2 aTexCoord;

uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;

varying vec2 vVertTexCoord;

void main(void) {
  vec4 positionVec4 = vec4(aPosition, 1.0);
  gl_Position = uProjectionMatrix * uModelViewMatrix * positionVec4;
  vVertTexCoord = aTexCoord;
}
`;

    const GRAIN_FRAG = `
precision highp float;
varying vec2 vVertTexCoord;

uniform sampler2D source;
uniform float noiseSeed;
uniform float noiseAmount;

// Noise functions
// https://gist.github.com/patriciogonzalezvivo/670c22f3966e662d2f83
float rand(vec2 n) {
  return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);
}

void main() {
  // GorillaSun's grain algorithm
  vec4 inColor = texture2D(source, vVertTexCoord);
  gl_FragColor = clamp(inColor + vec4(
    mix(-noiseAmount, noiseAmount, fract(noiseSeed + rand(vVertTexCoord * 1234.5678))),
    mix(-noiseAmount, noiseAmount, fract(noiseSeed + rand(vVertTexCoord * 876.54321))),
    mix(-noiseAmount, noiseAmount, fract(noiseSeed + rand(vVertTexCoord * 3214.5678))),
    0.
  ), 0., 1.);
}
`;

    let grainBuffer = null;
    let grainShader = null;

    function applyGrain(options = {}) {
      const {
        source = null,
        noiseAmount = 0.08,
        noiseSeed = Math.random(),
        clearBeforeDraw = true
      } = options;

      try {
        if (!grainBuffer) {
          grainBuffer = createGraphics(width, height, WEBGL);
        }
        if (!grainShader) {
          grainShader = grainBuffer.createShader(GRAIN_VERT, GRAIN_FRAG);
        }
        if (grainBuffer.width !== width || grainBuffer.height !== height) {
          grainBuffer = createGraphics(width, height, WEBGL);
          grainShader = grainBuffer.createShader(GRAIN_VERT, GRAIN_FRAG);
        }

        let sourceCanvas = source;
        if (!sourceCanvas) {
          sourceCanvas = get();
        }

        grainBuffer.clear();
        grainBuffer.reset();
        grainBuffer.push();
        grainBuffer.shader(grainShader);
        grainShader.setUniform('noiseSeed', noiseSeed);
        grainShader.setUniform('source', sourceCanvas);
        grainShader.setUniform('noiseAmount', noiseAmount);
        grainBuffer.rectMode(CENTER);
        grainBuffer.noStroke();
        grainBuffer.rect(0, 0, width, height);
        grainBuffer.pop();

        if (clearBeforeDraw) {
          clear();
        }
        push();
        image(grainBuffer, 0, 0);
        pop();
      } catch (err) {
        // Graceful fallback if WebGL context is unavailable
      }
    }

    /* =========================================================================
       ZOOM, PAN & INTERACTION HANDLING
       ========================================================================= */
    function attachPointerListeners() {
      const canvasEl = mainCanvas.elt;

      // Pointer Down: initiate drag tracking
      canvasEl.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        isDragging = true;
        hasMovedSignificantly = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        startPanX = params.panX;
        startPanY = params.panY;
        canvasEl.classList.add('grabbing');
        document.body.classList.add('grabbing');
        canvasEl.setPointerCapture(e.pointerId);
      });

      // Pointer Move: handle smooth pan dragging across screen
      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;

        if (Math.hypot(dx, dy) > 5) {
          hasMovedSignificantly = true;
        }

        params.panX = startPanX + dx;
        params.panY = startPanY + dy;
        guiControllers.panX?.updateDisplay();
        guiControllers.panY?.updateDisplay();

        if (!params.animated || params.animSpeed === 0) {
          redraw();
        }
      });

      // Pointer Up: complete drag or trigger click-randomization
      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        canvasEl.classList.remove('grabbing');
        document.body.classList.remove('grabbing');
        try {
          canvasEl.releasePointerCapture(e.pointerId);
        } catch (err) {}

        // If mouse didn't drag significantly, treat as pure click
        if (!hasMovedSignificantly && params.randomizeOnClick) {
          regenerate(true);
        }
      });

      // Mouse Wheel: zoom in / out anchored to mouse pointer
      canvasEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 1.09 : 0.91;
        const newZoom = Math.min(Math.max(params.zoom * zoomDelta, 0.2), 12.0);

        // Anchor zoom around cursor position
        const rect = canvasEl.getBoundingClientRect();
        const mouseCanvasX = e.clientX - rect.left;
        const mouseCanvasY = e.clientY - rect.top;

        params.panX = mouseCanvasX - (mouseCanvasX - params.panX) * (newZoom / params.zoom);
        params.panY = mouseCanvasY - (mouseCanvasY - params.panY) * (newZoom / params.zoom);
        params.zoom = Number(newZoom.toFixed(3));

        guiControllers.zoom?.updateDisplay();
        guiControllers.panX?.updateDisplay();
        guiControllers.panY?.updateDisplay();

        if (!params.animated || params.animSpeed === 0) {
          redraw();
        }
      }, { passive: false });

      // Double-click to reset view
      canvasEl.addEventListener('dblclick', () => {
        resetViewTransform();
      });
    }

    function resetViewTransform() {
      params.zoom = 1.0;
      params.panX = 0;
      params.panY = 0;
      guiControllers.zoom?.updateDisplay();
      guiControllers.panX?.updateDisplay();
      guiControllers.panY?.updateDisplay();
      if (!params.animated || params.animSpeed === 0) redraw();
    }

    /* =========================================================================
       KEYBOARD SHORTCUTS
       ========================================================================= */
    function keyPressed() {
      // Press 'H' or 'h' to hide/show all UI controls
      if (key === 'h' || key === 'H') {
        document.body.classList.toggle('hidden-ui');
        return false;
      }

      // Spacebar or 'R' / 'r' re-rolls procedural variation
      if (key === ' ' || key === 'r' || key === 'R') {
        regenerate(true);
        return false;
      }
    }

       EXPORT HIGH-RES IMAGE

      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      saveCanvas(mainCanvas, `generative-art-622-${timestamp}`, 'png');
    }

        if (guiControllers[key] && typeof guiControllers[key].updateDisplay === 'function') {
          guiControllers[key].updateDisplay();
        }
      }
    }
