    // ==========================================
    // 8 PRECONFIGURED CAMERA ANIMATIONS
    // ==========================================
    const ANIMATIONS = [
      'Static Sentinel (No Camera Motion)',
      'Perimeter Patrol (Slow Orbit)',
      'Tactical Pitch & Drift',
      'Threat Intercept Zoom',
      'Isometric Defense Scan',
      'Low-Angle Bastion',
      'Core Security Sweep',
      'Harmonic Lissajous Orbit'
    ];

    // Initial Parameters
    const defaultSchemeKey = 'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)';
    const initialScheme = COLOR_SCHEMES[defaultSchemeKey];

    const params = {
      colorScheme: defaultSchemeKey,
      shieldColor: initialScheme.shieldColor,
      shieldTrim: initialScheme.shieldTrim,
      shieldCore: initialScheme.shieldCore,
      domeColor: initialScheme.domeColor,
      domeGlow: initialScheme.domeGlow,
      threatColor: initialScheme.threatColor,
      accentColor: initialScheme.accentColor,
      bgColor: initialScheme.bgColor,
      greenscreen: false,

      animation: 'Perimeter Patrol (Slow Orbit)',
      animationSpeed: 1.0,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      exposure: 1.15,
      lightIntensity: 1.4,

      shieldHover: true,
      fieldDistance: 2.2,
      fieldGap: 0.08,
      rippleIntensity: 1.2,
      domeOpacity: 0.38,
      threatFrequency: 1.0,
      threatSpeed: 1.0,
      clickToRandomize: true
    };

    // =========================================================================================
    // POST PROCESSOR SUITE (postprocessing/PostProcessor.js)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.2,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.28,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.03,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

    const DOME_RADIUS = 5.4;
    const DOME_CENTER_Z = -DOME_RADIUS; // Apex of dome at local z = 0

    // Function to dynamically update distance between shield & field, and gap between field tiles
    function updateFieldLayout() {
      domeGroup.position.z = params.fieldDistance;
      domeGroup.updateMatrixWorld(true);

      const baseStep = 0.31;
      const currentStep = baseStep * (1.0 + params.fieldGap * 0.9);
      const tileScale = Math.max(0.25, 1.0 - params.fieldGap * 0.95);

      hexTiles.forEach(tile => {
        const coord = hexGridCoords[tile.id];
        const x2d = currentStep * Math.sqrt(3) * (coord.q + coord.r / 2);
        const y2d = currentStep * 1.5 * coord.r;
        const dist2d = Math.hypot(x2d, y2d);
        const ang2d = Math.atan2(y2d, x2d);

        const theta = dist2d / DOME_RADIUS;
        const px = DOME_RADIUS * Math.sin(theta) * Math.cos(ang2d);
        const py = DOME_RADIUS * Math.sin(theta) * Math.sin(ang2d);
        const pz = DOME_CENTER_Z + DOME_RADIUS * Math.cos(theta);

        tile.basePos.set(px, py, pz);
        tile.normal.subVectors(tile.basePos, sphereCenter).normalize();
        tile.baseQuat.setFromUnitVectors(upVector, tile.normal);

        tile.mesh.position.copy(tile.basePos);
        tile.mesh.quaternion.copy(tile.baseQuat);
        tile.mesh.scale.set(tileScale, tileScale, 1.0);
      });
    }
    updateFieldLayout();

    // ==========================================
    // RIPPLE SHOCKWAVE SYSTEM
    // ==========================================
    const activeRipples = [];

    function triggerDomeRipple(hitPosition, intensity = 1.0, colorHex = params.threatColor) {
      activeRipples.push({
        center: hitPosition.clone(),
        startTime: performance.now() * 0.001,
        duration: 1.85,
        speed: 4.6,
        intensity: intensity * params.rippleIntensity,
        color: new THREE.Color(colorHex)
      });
    }

    // ==========================================
    // INCOMING THREAT PROJECTILES & PARTICLES
    // ==========================================
    const threatGroup = new THREE.Group();
    scene.add(threatGroup);

    // Threat Missile Geometry: faceted crimson/plasma data spike
    const threatGeom = new THREE.ConeGeometry(0.12, 0.65, 5);
    threatGeom.rotateX(Math.PI / 2);
    const threatMaterial = new THREE.MeshStandardMaterial({
      color: params.threatColor,
      emissive: params.threatColor,
      emissiveIntensity: 2.5,
      roughness: 0.1,
      metalness: 0.8
    });

    const THREAT_COUNT = 6;
    const threats = [];

    function spawnThreat(threat) {
      // Incoming from deep space in front of dome
      const angle = Math.random() * Math.PI * 2;
      const rad = 1.0 + Math.random() * 3.2;
      const startZ = domeGroup.position.z + 10.0 + Math.random() * 6.0;

      threat.position.set(Math.cos(angle) * rad, Math.sin(angle) * rad, startZ);

      // Select random target hexagon on dome
      const targetTile = hexTiles[Math.floor(Math.random() * hexTiles.length)];
      threat.targetTile = targetTile;
      threat.targetPos.copy(targetTile.basePos).applyMatrix4(domeGroup.matrixWorld);

      threat.speed = (5.5 + Math.random() * 3.5) * params.threatSpeed;
      threat.active = true;

      // Point towards target
      threat.mesh.position.copy(threat.position);
      threat.mesh.lookAt(threat.targetPos);
      threat.mesh.visible = true;

      // Trail history
      threat.trailPositions = [];
      for (let i = 0; i < 8; i++) {
        threat.trailPositions.push(threat.position.clone());
      }
    }

    for (let i = 0; i < THREAT_COUNT; i++) {
      const mesh = new THREE.Mesh(threatGeom, threatMaterial);
      threatGroup.add(mesh);

      const trailGeom = new THREE.BufferGeometry();
      const trailMat = new THREE.LineBasicMaterial({
        color: params.threatColor,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
      const trailLine = new THREE.Line(trailGeom, trailMat);
      threatGroup.add(trailLine);

      const threatObj = {
        mesh,
        trailLine,
        trailMat,
        position: new THREE.Vector3(),
        targetPos: new THREE.Vector3(),
        targetTile: null,
        speed: 6.0,
        active: false,
        trailPositions: []
      };
      // Stagger spawn times
      setTimeout(() => spawnThreat(threatObj), i * 750);
      threats.push(threatObj);
    }

    // ==========================================
    // DEFLECTION SPARK PARTICLES SYSTEM
    // ==========================================
    const SPARK_MAX = 400;
    const sparkGeom = new THREE.BufferGeometry();
    const sparkPositions = new Float32Array(SPARK_MAX * 3);
    const sparkColors = new Float32Array(SPARK_MAX * 3);
    sparkGeom.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
    sparkGeom.setAttribute('color', new THREE.BufferAttribute(sparkColors, 3));

    const sparkMaterial = new THREE.PointsMaterial({
      size: 0.12,
      vertexColors: true,
      transparent: true,
      opacity: 1.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkPoints = new THREE.Points(sparkGeom, sparkMaterial);
    scene.add(sparkPoints);

    const sparks = [];
    for (let i = 0; i < SPARK_MAX; i++) {
      sparks.push({
        position: new THREE.Vector3(0, -999, 0),
        velocity: new THREE.Vector3(),
        life: 0,
        maxLife: 1.0,
        color: new THREE.Color()
      });
    }

    function emitDeflectionSparks(impactPos, impactNormal, count = 28, colorHex = params.threatColor) {
      let emitted = 0;
      const col = new THREE.Color(colorHex);

      for (let i = 0; i < SPARK_MAX && emitted < count; i++) {
        const sp = sparks[i];
        if (sp.life <= 0) {
          sp.position.copy(impactPos);
          // Scatter outward along bounce normal with wide cone spread
          sp.velocity.copy(impactNormal).multiplyScalar(2.0 + Math.random() * 4.5);
          sp.velocity.x += (Math.random() - 0.5) * 3.5;
          sp.velocity.y += (Math.random() - 0.5) * 3.5;
          sp.velocity.z += Math.random() * 2.0;

          sp.maxLife = 0.55 + Math.random() * 0.65;
          sp.life = sp.maxLife;
          sp.color.copy(col).lerp(new THREE.Color('#ffffff'), Math.random() * 0.5);
          emitted++;
        }
      }
    }

    // ==========================================
    // AMBIENT DEEP SPACE CYBER MATRIX PARTICLES
    // ==========================================
    const AMBIENT_PARTICLES_COUNT = 240;
    const ambientGeom = new THREE.BufferGeometry();
    const ambientPos = new Float32Array(AMBIENT_PARTICLES_COUNT * 3);
    for (let i = 0; i < AMBIENT_PARTICLES_COUNT; i++) {
      ambientPos[i * 3]     = (Math.random() - 0.5) * 22;
      ambientPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
      ambientPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
    }
    ambientGeom.setAttribute('position', new THREE.BufferAttribute(ambientPos, 3));
    const ambientMat = new THREE.PointsMaterial({
      color: params.accentColor,
      size: 0.07,
      transparent: true,
      opacity: 0.45,
      blending: THREE.AdditiveBlending
    });
    const ambientParticles = new THREE.Points(ambientGeom, ambientMat);
    scene.add(ambientParticles);

    // ==========================================
    // COLOR THEME APPLICATION
    // ==========================================
    function updateMaterialColors() {
      // 1. Background and Greenscreen
      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
        scene.fog.color = new THREE.Color('#00ff00');
        scene.fog.density = 0.0;
      } else {
        scene.background = new THREE.Color(params.bgColor);
        scene.fog.color = new THREE.Color(params.bgColor);
        scene.fog.density = 0.038;
      }

      // 2. Shield Emblem & Symmetrical Defense Crystals
      shieldTrimMaterial.color.set(params.shieldTrim);
      shieldBodyMaterial.color.set(params.shieldColor);
      bracketMaterial.color.set(params.shieldTrim);
      crystalMaterial.color.set(params.shieldCore);
      crystalMaterial.emissive.set(params.shieldCore);
      gyroRing1Mat.color.set(params.accentColor);
      gyroRing2Mat.color.set(params.shieldCore);
      traceMaterial.color.set(params.accentColor);
      corePointLight.color.set(params.shieldCore);

      // 3. Hexagonal Dome Tiles & Edges
      domeTileMaterial.color.set(params.domeColor);
      domeTileMaterial.emissive.set(params.domeGlow);
      domeTileMaterial.opacity = params.domeOpacity;
      domeEdgesMaterial.color.set(params.domeGlow);

      hexTiles.forEach(tile => {
        tile.tileMat.color.set(params.domeColor);
        tile.tileMat.emissive.set(params.domeGlow);
        tile.tileMat.opacity = params.domeOpacity;
        tile.edgeMat.color.set(params.domeGlow);
      });

      // 4. Threats & Sparks
      threatMaterial.color.set(params.threatColor);
      threatMaterial.emissive.set(params.threatColor);
      threats.forEach(t => t.trailMat.color.set(params.threatColor));
      ambientMat.color.set(params.accentColor);
      rimLight.color.set(params.accentColor);
      fillLight.color.set(params.shieldTrim);
    }

    function applyColorScheme(schemeKey) {
      const scheme = COLOR_SCHEMES[schemeKey];
      if (!scheme) return;
      params.colorScheme = schemeKey;
      params.shieldColor = scheme.shieldColor;
      params.shieldTrim = scheme.shieldTrim;
      params.shieldCore = scheme.shieldCore;
      params.domeColor = scheme.domeColor;
      params.domeGlow = scheme.domeGlow;
      params.threatColor = scheme.threatColor;
      params.accentColor = scheme.accentColor;
      params.bgColor = scheme.bgColor;

      updateMaterialColors();
    }

    // ==========================================
    // PROCEDURAL SCENE RANDOMIZER (ON CLICK)
    // ==========================================
    function randomizeScene() {
      // Pick a random scheme from the 18 preconfigured color schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomSchemeKey);

      // Randomize motion and aesthetic parameters
      params.animation = ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)];
      params.rippleIntensity = 0.8 + Math.random() * 1.2;
      params.threatSpeed = 0.8 + Math.random() * 0.8;
      params.threatFrequency = 0.8 + Math.random() * 0.8;
      params.domeOpacity = 0.25 + Math.random() * 0.35;
      params.exposure = 0.95 + Math.random() * 0.45;
      params.lightIntensity = 1.1 + Math.random() * 0.7;
      params.fieldDistance = 1.4 + Math.random() * 1.8;
      params.fieldGap = 0.03 + Math.random() * 0.18;
      updateFieldLayout();

      renderer.toneMappingExposure = params.exposure;
      ambientLight.intensity = 0.4 * params.lightIntensity;
      keyLight.intensity = 2.2 * params.lightIntensity;
      rimLight.intensity = 3.2 * params.lightIntensity;
      fillLight.intensity = 1.6 * params.lightIntensity;
      frontLight.intensity = 1.8 * params.lightIntensity;

      // Trigger celebratory multi-point ripple wave across dome
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          const randTile = hexTiles[Math.floor(Math.random() * hexTiles.length)];
          triggerDomeRipple(randTile.basePos, 1.4, params.shieldCore);
          const worldPos = randTile.basePos.clone().applyMatrix4(domeGroup.matrixWorld);
          const worldNorm = randTile.normal.clone().applyQuaternion(domeGroup.quaternion);
          emitDeflectionSparks(worldPos, worldNorm, 35, params.shieldCore);
          impactPointLight.position.copy(worldPos);
          impactPointLight.color.set(params.shieldCore);
          impactPointLight.intensity = 8.0;
        }, i * 160);
      }

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Pointer-up click detection for scene re-roll
    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dx = e.clientX - pointerDownX;
      const dy = e.clientY - pointerDownY;
      const dist = Math.hypot(dx, dy);
      const duration = performance.now() - pointerDownTime;

      // Pure click threshold without drag
      if (dist < 6 && duration < 350) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // ==========================================
    // HIDE/SHOW UI WITH "H" KEY
    // ==========================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // ==========================================
    // LIL-GUI SETUP (Standard styles, no custom CSS)
    // ==========================================
    const gui = new GUI({ title: 'Security Shield Settings' });

    // Color Schemes & Themes Folder
    const folderColors = gui.addFolder('Color Schemes & Custom Colors');
    folderColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('18 Presets').onChange((val) => {
      applyColorScheme(val);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    folderColors.addColor(params, 'shieldColor').name('Shield Body').onChange(updateMaterialColors);
    folderColors.addColor(params, 'shieldTrim').name('Shield Armor Trim').onChange(updateMaterialColors);
    folderColors.addColor(params, 'shieldCore').name('Security Core Glow').onChange(updateMaterialColors);
    folderColors.addColor(params, 'domeColor').name('Force Field Base').onChange(updateMaterialColors);
    folderColors.addColor(params, 'domeGlow').name('Force Field Glow').onChange(updateMaterialColors);
    folderColors.addColor(params, 'threatColor').name('Threat Missile Color').onChange(updateMaterialColors);
    folderColors.addColor(params, 'accentColor').name('Accent / Cyber Glow').onChange(updateMaterialColors);
    folderColors.addColor(params, 'bgColor').name('Scene Background').onChange(updateMaterialColors);
    folderColors.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateMaterialColors);

    // Camera & Motion Folder
    const folderAnim = gui.addFolder('Camera & Animation');
    folderAnim.add(params, 'animation', ANIMATIONS).name('Camera Mode');
    folderAnim.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Global Speed');
    folderAnim.add(params, 'shieldHover').name('Emblem Floating Hover');

    // Lighting & Display Folder
    const folderLight = gui.addFolder('Lighting & Exposure');
    folderLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(val => {
      renderer.toneMappingExposure = val;
    });
    folderLight.add(params, 'lightIntensity', 0.2, 3.0, 0.05).name('Light Intensity').onChange(val => {
      ambientLight.intensity = 0.4 * val;
      keyLight.intensity = 2.2 * val;
      rimLight.intensity = 3.2 * val;
      fillLight.intensity = 1.6 * val;
      frontLight.intensity = 1.8 * val;
    });
    folderLight.add(params, 'pixelRatio', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
      renderer.setPixelRatio(val);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, val);
      }
    });

    // Force Field Dynamics Folder
    const folderDome = gui.addFolder('Force Field Dynamics');
    folderDome.add(params, 'fieldDistance', 0.6, 5.0, 0.05).name('Field Distance').onChange(updateFieldLayout);
    folderDome.add(params, 'fieldGap', 0.0, 0.4, 0.01).name('Field Tiles Gap').onChange(updateFieldLayout);
    folderDome.add(params, 'rippleIntensity', 0.2, 3.0, 0.05).name('Ripple Amplitude');
    folderDome.add(params, 'domeOpacity', 0.05, 0.9, 0.02).name('Field Opacity').onChange(updateMaterialColors);
    folderDome.add(params, 'threatFrequency', 0.2, 3.0, 0.05).name('Threat Spawn Rate');
    folderDome.add(params, 'threatSpeed', 0.2, 3.0, 0.05).name('Threat Velocity');

    // Interactivity Folder
    const folderInteract = gui.addFolder('Interactivity');
    folderInteract.add(params, 'clickToRandomize').name('Click Scene to Re-roll');

    // Auto-attach PostProcessor Suite controls to lil-gui
    postProcessor.attachGUI(gui, 'Post-Processing Suite');

    // ==========================================
    // 8 PRECONFIGURED CAMERA ANIMATION MODES
    // ==========================================
    function updateCameraAnimation(time, delta) {
      if (userInteractCooldown > 0) {
        userInteractCooldown -= delta;
        return;
      }
      if (isUserInteracting) return;

      const mode = params.animation;
      if (mode === 'Static Sentinel (No Camera Motion)') {
        // Camera remains in rest position without automated movement
        return;
      }

      if (mode === 'Perimeter Patrol (Slow Orbit)') {
        const rad = 8.8;
        const speed = time * 0.1;
        const targetX = rad * Math.sin(speed);
        const targetZ = rad * Math.cos(speed);
        const targetY = 0.6 + 0.4 * Math.sin(time * 0.18);
        camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.035);
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.04);
      }
      else if (mode === 'Tactical Pitch & Drift') {
        const swayX = 5.2 * Math.sin(time * 0.12);
        const swayY = 1.8 * Math.cos(time * 0.16);
        const swayZ = 7.6 + 1.2 * Math.cos(time * 0.1);
        camera.position.lerp(new THREE.Vector3(swayX, swayY, swayZ), 0.03);
        controls.target.lerp(new THREE.Vector3(0, 0.2, 0), 0.04);
      }
      else if (mode === 'Threat Intercept Zoom') {
        // Slow cinematic push towards the force field frontline, then retreat
        const dist = 6.4 + 2.4 * Math.cos(time * 0.14);
        const ang = time * 0.08;
        const targetX = dist * Math.sin(ang) * 0.6;
        const targetZ = dist * Math.cos(ang);
        const targetY = 0.4 + 0.3 * Math.sin(time * 0.12);
        camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.035);
        controls.target.lerp(new THREE.Vector3(0, 0, 1.2), 0.04);
      }
      else if (mode === 'Isometric Defense Scan') {
        const rad = 8.5;
        const speed = time * 0.09;
        const isoX = rad * Math.cos(speed);
        const isoZ = rad * Math.sin(speed);
        const isoY = 4.8 + 0.6 * Math.sin(time * 0.15);
        camera.position.lerp(new THREE.Vector3(isoX, isoY, isoZ), 0.03);
        controls.target.lerp(new THREE.Vector3(0, -0.2, 0), 0.04);
      }
      else if (mode === 'Low-Angle Bastion') {
        // Imposing view from below looking up at the monumental shield dome
        const lowX = 4.5 * Math.sin(time * 0.11);
        const lowY = -2.8 + 0.5 * Math.cos(time * 0.13);
        const lowZ = 6.8 + 0.8 * Math.cos(time * 0.09);
        camera.position.lerp(new THREE.Vector3(lowX, lowY, lowZ), 0.03);
        controls.target.lerp(new THREE.Vector3(0, 0.8, 0), 0.04);
      }
      else if (mode === 'Core Security Sweep') {
        // Close-up orbital inspection of the metallic crest and pulsing core
        const sweepRad = 5.2;
        const speed = time * 0.15;
        const sX = sweepRad * Math.sin(speed);
        const sZ = sweepRad * Math.cos(speed);
        const sY = 0.1 + 0.5 * Math.sin(time * 0.22);
        camera.position.lerp(new THREE.Vector3(sX, sY, sZ), 0.035);
        controls.target.lerp(new THREE.Vector3(0, 0.1, 0.3), 0.05);
      }
      else if (mode === 'Harmonic Lissajous Orbit') {
        const lissX = 7.5 * Math.sin(time * 0.12);
        const lissY = 2.4 * Math.sin(time * 0.24);
        const lissZ = 7.5 * Math.cos(time * 0.12);
        camera.position.lerp(new THREE.Vector3(lissX, lissY, lissZ), 0.03);
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.04);
      }
    }

    // ==========================================
    // MAIN INFINITE ANIMATION LOOP
    // ==========================================
    const clock = new THREE.Clock();
    let accumulatedTime = 0;
    const dummyQuat = new THREE.Quaternion();
    const axisY = new THREE.Vector3(0, 1, 0);

    function animate() {
      requestAnimationFrame(animate);

      const rawDelta = clock.getDelta();
      const delta = Math.min(rawDelta, 0.1) * params.animationSpeed;
      accumulatedTime += delta;
      const nowSec = performance.now() * 0.001;

      // 1. Floating Metallic Shield Levitation & Hover
      if (params.shieldHover) {
        shieldGroup.position.y = Math.sin(accumulatedTime * 1.3) * 0.14;
        shieldGroup.rotation.y = Math.sin(accumulatedTime * 0.9) * 0.07;
        shieldGroup.rotation.x = Math.cos(accumulatedTime * 1.1) * 0.035;
        shieldGroup.rotation.z = Math.sin(accumulatedTime * 0.8) * 0.025;
      }

      // Symmetrical Defense Crystals Dynamic Animation
      masterCrystal.rotation.y = accumulatedTime * 1.6;
      masterCrystal.rotation.z = Math.sin(accumulatedTime * 0.9) * 0.12;

      // Radial satellite defense crystals orbital resonance
      satelliteGroup.rotation.z = accumulatedTime * 0.22;
      satelliteCrystals.forEach((c, idx) => {
        c.rotation.y = accumulatedTime * 2.0 + idx * 0.8;
      });

      // Cardinal defense crystals gentle counter-oscillation
      cardinalCrystals.forEach((c, idx) => {
        c.rotation.y = Math.sin(accumulatedTime * 1.8 + idx * 1.2) * 0.3;
      });

      // Rotating Gyro-Energy Rings around Master Crystal
      gyroRing1.rotation.x = accumulatedTime * 0.9;
      gyroRing1.rotation.y = accumulatedTime * 0.6;
      gyroRing2.rotation.y = -accumulatedTime * 0.8;
      gyroRing2.rotation.z = accumulatedTime * 0.5;

      // Harmonious Energy Pulse across all Defense Crystals
      const crystalPulse = Math.sin(accumulatedTime * 3.6) * 0.5 + 0.5;
      crystalMaterial.emissiveIntensity = 1.4 + crystalPulse * 2.4;
      corePointLight.intensity = 3.8 + crystalPulse * 4.2;

      // Decay impact point light flash
      if (impactPointLight.intensity > 0.01) {
        impactPointLight.intensity *= Math.max(0, 1 - delta * 6.0);
      }

      // 2. Incoming Particle Threats Simulation
      threats.forEach(threat => {
        if (!threat.active) return;

        const dir = new THREE.Vector3().subVectors(threat.targetPos, threat.position);
        const dist = dir.length();
        const step = threat.speed * delta;

        if (dist <= step || threat.position.z <= threat.targetPos.z) {
          // --- THREAT IMPACT ON FORCE FIELD DOME! ---
          const hitTile = threat.targetTile;
          const hitPos = threat.targetPos;

          // A. Trigger Hexagonal Tile Ripple Shockwave
          triggerDomeRipple(hitTile.basePos, 1.2, params.threatColor);

          // B. Eject Deflection Sparks
          const worldNormal = hitTile ? hitTile.normal.clone().applyQuaternion(domeGroup.quaternion) : new THREE.Vector3(0, 0, 1);
          emitDeflectionSparks(hitPos, worldNormal, 32, params.threatColor);

          impactPointLight.position.copy(hitPos);
          impactPointLight.color.set(params.threatColor);
          impactPointLight.intensity = 8.0;

          // C. Slight Kinetic Recoil on Shield Emblem
          shieldGroup.position.z -= 0.07;

          // D. Reset Threat for next strike
          threat.active = false;
          threat.mesh.visible = false;
          threat.trailLine.visible = false;

          const respawnDelay = (800 + Math.random() * 1400) / params.threatFrequency;
          setTimeout(() => spawnThreat(threat), respawnDelay);
        } else {
          dir.normalize();
          threat.position.addScaledVector(dir, step);
          threat.mesh.position.copy(threat.position);
          threat.mesh.lookAt(threat.targetPos);

          // Update Missile Trail
          threat.trailPositions.pop();
          threat.trailPositions.unshift(threat.position.clone());
          threat.trailLine.geometry.setFromPoints(threat.trailPositions);
          threat.trailLine.visible = true;
        }
      });

      // Recover shield position from kinetic recoil
      shieldGroup.position.z = THREE.MathUtils.lerp(shieldGroup.position.z, 0, delta * 6.0);

      // 3. Process Active Ripples and Update Hexagonal Dome Tiles
      // Clean expired ripples
      for (let i = activeRipples.length - 1; i >= 0; i--) {
        if (nowSec - activeRipples[i].startTime > activeRipples[i].duration) {
          activeRipples.splice(i, 1);
        }
      }

      const waveWidth = 0.85;
      const baseGlowCol = new THREE.Color(params.domeGlow);
      const domeBaseCol = new THREE.Color(params.domeColor);

      hexTiles.forEach(tile => {
        let totalDisp = 0;
        let maxWave = 0;
        let activeColor = baseGlowCol;

        // Calculate impact ripples
        activeRipples.forEach(rip => {
          const age = nowSec - rip.startTime;
          const currentRadius = age * rip.speed;
          const dist = tile.basePos.distanceTo(rip.center);
          const distDiff = dist - currentRadius;

          if (Math.abs(distDiff) < waveWidth) {
            const normalizedDiff = distDiff / waveWidth;
            const waveShape = Math.cos(normalizedDiff * Math.PI * 0.5);
            const timeDecay = Math.max(0, 1.0 - (age / rip.duration));
            const spatialDecay = Math.exp(-dist * 0.3);
            const waveStrength = waveShape * timeDecay * spatialDecay * rip.intensity;

            // Displace tile outward along its surface normal
            totalDisp += waveStrength * 0.38;

            if (waveStrength > maxWave) {
              maxWave = waveStrength;
              activeColor = rip.color;
            }
          }
        });

        // Ambient cyber frequency wave (breathing hex matrix)
        const distFromCenter = Math.hypot(tile.basePos.x, tile.basePos.y);
        const ambientBreathing = Math.sin(accumulatedTime * 2.2 - distFromCenter * 2.4) * 0.016;
        const finalDisp = totalDisp + ambientBreathing;

        // Apply physical displacement along normal
        tile.mesh.position.copy(tile.basePos).addScaledVector(tile.normal, finalDisp);

        // Subtle kinetic tilt when hit
        if (maxWave > 0.05) {
          dummyQuat.setFromAxisAngle(axisY, maxWave * 0.12);
          tile.mesh.quaternion.copy(tile.baseQuat).multiply(dummyQuat);
        } else {
          tile.mesh.quaternion.copy(tile.baseQuat);
        }

        // Apply dynamic emissive luminescence and opacity surge
        const glowBoost = Math.min(maxWave * 3.2, 4.0);
        tile.tileMat.emissive.copy(baseGlowCol).lerp(activeColor, Math.min(maxWave * 1.4, 1.0));
        tile.tileMat.emissiveIntensity = 0.35 + glowBoost;
        tile.tileMat.opacity = Math.min(0.95, params.domeOpacity + maxWave * 0.45);

        tile.edgeMat.color.copy(baseGlowCol).lerp(activeColor, Math.min(maxWave * 1.5, 1.0));
        tile.edgeMat.opacity = Math.min(1.0, 0.65 + maxWave * 0.8);
      });

      // 4. Update Deflection Spark Particles
      const pArr = sparkGeom.attributes.position.array;
      const cArr = sparkGeom.attributes.color.array;

      for (let i = 0; i < SPARK_MAX; i++) {
        const sp = sparks[i];
        const idx = i * 3;

        if (sp.life > 0) {
          sp.life -= delta;
          sp.position.addScaledVector(sp.velocity, delta);
          // Decelerate sparks
          sp.velocity.multiplyScalar(0.96);

          pArr[idx]     = sp.position.x;
          pArr[idx + 1] = sp.position.y;
          pArr[idx + 2] = sp.position.z;

          const alpha = Math.max(0, sp.life / sp.maxLife);
          cArr[idx]     = sp.color.r * alpha;
          cArr[idx + 1] = sp.color.g * alpha;
          cArr[idx + 2] = sp.color.b * alpha;
        } else {
          pArr[idx + 1] = -999;
        }
      }
      sparkGeom.attributes.position.needsUpdate = true;
      sparkGeom.attributes.color.needsUpdate = true;

      // 5. Deep Space Cyber Dust Rotation
      ambientParticles.rotation.y = accumulatedTime * 0.04;
      ambientParticles.rotation.x = accumulatedTime * 0.02;

      // 6. Camera Orbit & Preconfigured Animations
      updateCameraAnimation(accumulatedTime, delta);
      controls.update();

      // 7. Render Scene through PostProcessor Pipeline
      if (postProcessor) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // ==========================================
    // RESPONSIVE RESIZE
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.pixelRatio);
      }
    });

    // Start auto infinite animation
    animate();
  </script>
</body>
</html>
