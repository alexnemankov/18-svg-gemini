    // --- Scene Parameters ---
    const params = {

    // --- Global Three.js References ---
    let scene, camera, renderer, controls;
    let composer, bloomPass;
    let branchMesh, branchMat, leafMesh, leafMat, haloGroup;
    let particleMesh, particleMat, packetMesh;
    let ambientLight, keyLight, rootLight, canopyLight;
    let treeData = null;
    let packets = [];
    let growthTween = null;
    let animClock = 0;
    let gui = null;

    // --- Initialize Application ---
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2.5, 34);

      haloGroup = new THREE.Group();
      scene.add(haloGroup);

      initRenderer(params.antialias);
      initLights();
      buildTree();
      initParticles();
      initPackets();
      initGSAP();
      buildGUI();
      initEventListeners();

      animate();
    }

    // --- Renderer & Composer Setup ---
    function initRenderer(antialias) {
      params.antialias = antialias;
      const container = document.getElementById('canvas-container');

      if (renderer) {
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      updateBackgroundState();
      container.appendChild(renderer.domElement);

      if (controls) controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.minDistance = 3.0;
      controls.maxDistance = 160.0;
      controls.target.set(0, 1.5, 0);

      initComposer();
    }

    function initComposer() {
      composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);

      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        params.bloomStrength,
        params.bloomRadius,
        params.bloomThreshold
      );
      composer.addPass(bloomPass);

      const outputPass = new OutputPass();
      composer.addPass(outputPass);
    }

    function updateBackgroundState() {
      const activeColor = params.greenScreen ? '#00ff00' : params.bgColor;
      renderer.setClearColor(activeColor, 1.0);
      scene.background = new THREE.Color(activeColor);
      document.body.style.backgroundColor = activeColor;
    }

    // --- Lighting Setup ---
    function initLights() {
      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
      scene.add(ambientLight);

      keyLight = new THREE.DirectionalLight(params.keyColor, params.keyIntensity);
      keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);
      scene.add(keyLight);

      rootLight = new THREE.PointLight(params.rootLightColor, params.rootLightIntensity, params.rootLightDistance);
      rootLight.position.set(0, -11.0, 2.5);
      scene.add(rootLight);

      canopyLight = new THREE.PointLight(params.canopyLightColor, params.canopyLightIntensity, params.canopyLightDistance);
      canopyLight.position.set(0, 6.5, 2.0);
      scene.add(canopyLight);
    }

    // --- Procedural Tree Architecture ---
    function generateTreeStructure(spread, curvature, thickness, maxDepth) {
      const branches = [];
      const leafNodes = [];
      const majorNodes = [];
      const paths = [];

      const rootBaseY = -12.0;
      const rootPos = new THREE.Vector3(0, rootBaseY, 0);
      const trunkLength = 5.2;
      const trunkRadius = 0.22 * thickness;

      // 1. Biological Root Filaments Anchoring into the Void
      const numRoots = 7;
      for (let r = 0; r < numRoots; r++) {
        const rootAngle = (r / numRoots) * Math.PI * 2 + Math.random() * 0.3;
        const rootSpreadDist = 1.8 + Math.random() * 1.5;
        const rootDepthY = rootBaseY - (1.8 + Math.random() * 1.6);
        const rEnd = new THREE.Vector3(
          Math.cos(rootAngle) * rootSpreadDist,
          rootDepthY,
          Math.sin(rootAngle) * rootSpreadDist
        );
        const rMid = new THREE.Vector3(
          Math.cos(rootAngle) * rootSpreadDist * 0.45,
          rootBaseY - 0.7,
          Math.sin(rootAngle) * rootSpreadDist * 0.45
        );

        branches.push({
          start: rootPos.clone(),
          mid: rMid,
          end: rEnd,
          radiusStart: trunkRadius * 0.65,
          radiusEnd: 0.015,
          depth: 0,
          progressStart: 0.0,
          progressEnd: 0.08
        });
      }

      // 2. Hierarchical Recursive Branching with Natural Cathedral Crown
      function branch(start, dir, length, radius, depth, parentProgress, currentPath) {
        const upward = new THREE.Vector3(0, 1, 0);
        // Phototropism & graceful vertical reach
        const curveFactor = curvature * (0.28 + depth * 0.06);
        const midDir = dir.clone().lerp(upward, curveFactor).normalize();
        const endDir = dir.clone().lerp(upward, curveFactor * 0.85).normalize();

        const mid = start.clone().addScaledVector(midDir, length * 0.52);
        const end = start.clone().addScaledVector(endDir, length);

        const endProgress = Math.min(1.0, parentProgress + (1.0 / (maxDepth + 1.2)));
        const branchObj = {
          start,
          mid,
          end,
          radiusStart: radius,
          radiusEnd: Math.max(0.008, radius * 0.66),
          depth,
          progressStart: parentProgress,
          progressEnd: endProgress
        };
        branches.push(branchObj);

        const newPath = [...currentPath, end.clone()];

        // Hub nodes with holographic orbital rings
        if (depth >= 2 && depth <= 4 && Math.random() < 0.62) {
          majorNodes.push({
            position: end.clone(),
            depth: depth,
            scale: 0.32 * (1.0 - depth * 0.12),
            progress: endProgress
          });
        }

        if (depth >= maxDepth) {
          leafNodes.push({
            position: end.clone(),
            progress: endProgress,
            direction: endDir.clone()
          });
          paths.push(newPath);
          return;
        }

        // Branching: 1 central leader + 2-3 outward boughs at level 0; 2-3 children thereafter
        const isTrunk = (depth === 0);
        const numChildren = isTrunk ? 4 : (Math.random() > 0.4 ? 3 : 2);
        const goldenAngle = 2.39996323;

        for (let i = 0; i < numChildren; i++) {
          let childDir;
          let childLength;
          let childRadius;

          if (isTrunk && i === 0) {
            // Central upward ascending leader branch giving vertical crown elegance
            childDir = new THREE.Vector3(
              (Math.random() - 0.5) * 0.15,
              0.98,
              (Math.random() - 0.5) * 0.15
            ).normalize();
            childLength = length * 0.88;
            childRadius = radius * 0.72;
          } else {
            const angle = (i * (Math.PI * 2 / numChildren)) + (depth * goldenAngle) + (Math.random() - 0.5) * 0.35;

            let u = new THREE.Vector3();
            if (Math.abs(dir.y) < 0.99) {
              u.crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
            } else {
              u.crossVectors(dir, new THREE.Vector3(1, 0, 0)).normalize();
            }
            const v = new THREE.Vector3().crossVectors(dir, u).normalize();

            const spreadAngle = (0.32 + 0.34 * spread) * (0.85 + Math.random() * 0.28);
            childDir = dir.clone().multiplyScalar(Math.cos(spreadAngle))
              .add(u.clone().multiplyScalar(Math.cos(angle) * Math.sin(spreadAngle)))
              .add(v.clone().multiplyScalar(Math.sin(angle) * Math.sin(spreadAngle)))
              .normalize();

            childLength = length * (0.74 + (Math.random() - 0.5) * 0.08);
            childRadius = radius * (0.66 + (Math.random() - 0.5) * 0.05);
          }

          branch(end, childDir, childLength, childRadius, depth + 1, endProgress, newPath);
        }
      }

      branch(rootPos, new THREE.Vector3(0, 1, 0), trunkLength, trunkRadius, 0, 0.05, [rootPos.clone()]);
      return { branches, leafNodes, majorNodes, paths };
    }

    // --- Consolidated Tube Geometry Builder ---
    function buildBranchGeometry(branches) {
      const radialSegments = 6;
      const lengthSegments = 5;
      const totalRingsPerBranch = lengthSegments + 1;
      const totalVertsPerBranch = totalRingsPerBranch * radialSegments;
      const totalIndicesPerBranch = lengthSegments * radialSegments * 6;

      const numBranches = branches.length;
      const positions = new Float32Array(numBranches * totalVertsPerBranch * 3);
      const normals = new Float32Array(numBranches * totalVertsPerBranch * 3);
      const uvs = new Float32Array(numBranches * totalVertsPerBranch * 2);
      const aProgress = new Float32Array(numBranches * totalVertsPerBranch);
      const aBranchLevel = new Float32Array(numBranches * totalVertsPerBranch);
      const indices = new Uint32Array(numBranches * totalIndicesPerBranch);

      let vOffset = 0;
      let iOffset = 0;

      for (let b = 0; b < numBranches; b++) {
        const br = branches[b];
        const baseVertIndex = vOffset / 3;

        for (let l = 0; l <= lengthSegments; l++) {
          const t = l / lengthSegments;
          const invT = 1.0 - t;

          // Quadratic Bezier interpolation
          const p = new THREE.Vector3(
            invT * invT * br.start.x + 2 * invT * t * br.mid.x + t * t * br.end.x,
            invT * invT * br.start.y + 2 * invT * t * br.mid.y + t * t * br.end.y,
            invT * invT * br.start.z + 2 * invT * t * br.mid.z + t * t * br.end.z
          );

          // Tangent
          const tangent = new THREE.Vector3(
            2 * (invT * (br.mid.x - br.start.x) + t * (br.end.x - br.mid.x)),
            2 * (invT * (br.mid.y - br.start.y) + t * (br.end.y - br.mid.y)),
            2 * (invT * (br.mid.z - br.start.z) + t * (br.end.z - br.mid.z))
          ).normalize();

          let normalVec = new THREE.Vector3();
          if (Math.abs(tangent.y) < 0.99) {
            normalVec.crossVectors(tangent, new THREE.Vector3(0, 1, 0)).normalize();
          } else {
            normalVec.crossVectors(tangent, new THREE.Vector3(1, 0, 0)).normalize();
          }
          const binormalVec = new THREE.Vector3().crossVectors(tangent, normalVec).normalize();

          const r = br.radiusStart + (br.radiusEnd - br.radiusStart) * t;
          const prog = br.progressStart + (br.progressEnd - br.progressStart) * t;

          for (let s = 0; s < radialSegments; s++) {
            const theta = (s / radialSegments) * Math.PI * 2;
            const cosT = Math.cos(theta);
            const sinT = Math.sin(theta);

            const n = new THREE.Vector3()
              .addScaledVector(normalVec, cosT)
              .addScaledVector(binormalVec, sinT)
              .normalize();

            const pos = p.clone().addScaledVector(n, r);

            positions[vOffset] = pos.x;
            positions[vOffset + 1] = pos.y;
            positions[vOffset + 2] = pos.z;

            normals[vOffset] = n.x;
            normals[vOffset + 1] = n.y;
            normals[vOffset + 2] = n.z;

            const uvIdx = (vOffset / 3) * 2;
            uvs[uvIdx] = s / radialSegments;
            uvs[uvIdx + 1] = prog;

            const progIdx = vOffset / 3;
            aProgress[progIdx] = prog;
            aBranchLevel[progIdx] = br.depth;

            vOffset += 3;
          }
        }

        for (let l = 0; l < lengthSegments; l++) {
          for (let s = 0; s < radialSegments; s++) {
            const nextS = (s + 1) % radialSegments;
            const currentRing = baseVertIndex + l * radialSegments;
            const nextRing = baseVertIndex + (l + 1) * radialSegments;

            const i0 = currentRing + s;
            const i1 = nextRing + s;
            const i2 = nextRing + nextS;
            const i3 = currentRing + nextS;

            indices[iOffset++] = i0;
            indices[iOffset++] = i1;
            indices[iOffset++] = i2;

            indices[iOffset++] = i0;
            indices[iOffset++] = i2;
            indices[iOffset++] = i3;
          }
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geo.setAttribute('aProgress', new THREE.BufferAttribute(aProgress, 1));
      geo.setAttribute('aBranchLevel', new THREE.BufferAttribute(aBranchLevel, 1));
      geo.setIndex(new THREE.BufferAttribute(indices, 1));
      return geo;
    }

    // --- Build / Rebuild Tree Geometry & Node Visuals ---
    function buildTree() {
      if (branchMesh) scene.remove(branchMesh);
      if (leafMesh) scene.remove(leafMesh);

      // Clear halo rings
      while (haloGroup.children.length > 0) {
        const obj = haloGroup.children[0];
        haloGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
      }

      treeData = generateTreeStructure(
        params.branchSpread,
        params.branchCurvature,
        params.branchThickness,
        params.branchDepth
      );

      const branchGeo = buildBranchGeometry(treeData.branches);

      branchMat = new THREE.ShaderMaterial({
        vertexShader: `
          attribute float aProgress;
          attribute float aBranchLevel;
          uniform float uGrowth;
          uniform float uTime;
          uniform float uSwayIntensity;

          varying vec3 vNormal;
          varying vec3 vWorldPosition;
          varying float vProgress;
          varying float vLevel;
          varying vec2 vUv;

          void main() {
            vUv = uv;
            vProgress = aProgress;
            vLevel = aBranchLevel;

            float growthThreshold = aProgress * 0.92;
            float branchGrowth = clamp((uGrowth - growthThreshold) / 0.08, 0.0, 1.0);
            vec3 pos = position;

            // Organic volumetric sway
            float swayProgress = pow(aProgress, 1.6);
            float sway1 = sin(uTime * 1.1 + pos.y * 0.28) * 0.3 * swayProgress * uSwayIntensity;
            float sway2 = cos(uTime * 0.85 + pos.y * 0.22 + pos.x * 0.15) * 0.22 * swayProgress * uSwayIntensity;
            pos.x += sway1;
            pos.z += sway2;

            pos += normal * (branchGrowth - 1.0) * 0.015;

            vNormal = normalize(normalMatrix * normal);
            vec4 worldPos = modelMatrix * vec4(pos, 1.0);
            vWorldPosition = worldPos.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uRootColor;
          uniform vec3 uMidColor;
          uniform vec3 uTipColor;
          uniform vec3 uPulseColor;
          uniform float uPulseSpeed;
          uniform float uPulseDensity;
          uniform float uPulseIntensity;
          uniform float uGrowth;
          uniform float uTime;
          uniform vec3 uCameraPos;

          varying vec3 vNormal;
          varying vec3 vWorldPosition;
          varying float vProgress;
          varying float vLevel;
          varying vec2 vUv;

          void main() {
            if (vProgress > uGrowth + 0.004) discard;
            float growthFade = clamp((uGrowth - vProgress) / 0.02, 0.0, 1.0);

            // Rich gradient from golden root to turquoise/cyan canopy
            vec3 baseColor;
            if (vProgress < 0.4) {
              baseColor = mix(uRootColor, uMidColor, vProgress / 0.4);
            } else {
              baseColor = mix(uMidColor, uTipColor, (vProgress - 0.4) / 0.6);
            }

            // Continuous Gaussian energy pulses traveling upwards
            float p1 = fract(uTime * (0.28 * uPulseSpeed) - vProgress * uPulseDensity);
            float pulseShape1 = exp(-pow((p1 - 0.5) * 14.0, 2.0));

            float p2 = fract(uTime * (0.44 * uPulseSpeed) - vProgress * (uPulseDensity * 1.6) + 0.35);
            float pulseShape2 = exp(-pow((p2 - 0.5) * 18.0, 2.0));

            float spark = pow(sin(vProgress * 60.0 - uTime * 6.0) * 0.5 + 0.5, 4.0) * 0.4;
            float totalPulse = (pulseShape1 * 3.8 + pulseShape2 * 2.6 + spark) * uPulseIntensity;

            // Optical fiber edge glow & core brightness
            vec3 viewDir = normalize(uCameraPos - vWorldPosition);
            float NdotV = max(dot(normalize(vNormal), viewDir), 0.0);
            float fresnel = pow(1.0 - NdotV, 2.4);
            float coreFilament = pow(NdotV, 3.5) * 0.45;

            vec3 finalColor = baseColor * (0.8 + 0.8 * fresnel + coreFilament);
            finalColor += uPulseColor * totalPulse * (1.2 + 0.8 * fresnel);
            finalColor += uTipColor * fresnel * 0.9 * vProgress;

            // HDR multiplier for UnrealBloom glow
            finalColor *= 1.35;

            gl_FragColor = vec4(finalColor, growthFade);
          }
        `,
        uniforms: {
          uRootColor: { value: new THREE.Color(params.rootColor) },
          uMidColor: { value: new THREE.Color(params.midColor) },
          uTipColor: { value: new THREE.Color(params.tipColor) },
          uPulseColor: { value: new THREE.Color(params.pulseColor) },
          uPulseSpeed: { value: params.pulseSpeed },
          uPulseDensity: { value: params.pulseDensity },
          uPulseIntensity: { value: params.pulseIntensity },
          uGrowth: { value: params.growth },
          uTime: { value: 0 },
          uSwayIntensity: { value: params.swayIntensity },
          uCameraPos: { value: camera.position }
        },
        transparent: true,
        side: THREE.DoubleSide
      });

      branchMesh = new THREE.Mesh(branchGeo, branchMat);
      scene.add(branchMesh);

      // --- Glowing Crystalline Leaf Blossoms ---
      const numLeaves = treeData.leafNodes.length;
      const leafGeo = new THREE.OctahedronGeometry(0.12, 0);
      leafMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.tipColor),
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });
      leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, numLeaves);

      const dummy = new THREE.Object3D();
      for (let i = 0; i < numLeaves; i++) {
        const lf = treeData.leafNodes[i];
        dummy.position.copy(lf.position);
        dummy.scale.setScalar(0.001);
        dummy.updateMatrix();
        leafMesh.setMatrixAt(i, dummy.matrix);
      }
      leafMesh.instanceMatrix.needsUpdate = true;
      scene.add(leafMesh);

      // --- Holographic Quantum Orbital Hubs (Key Nodes) ---
      const majorNodes = treeData.majorNodes;
      for (let m = 0; m < majorNodes.length; m++) {
        const node = majorNodes[m];
        const hubGroup = new THREE.Group();
        hubGroup.position.copy(node.position);

        // Core Pulsing Sphere
        const sphereGeo = new THREE.SphereGeometry(node.scale * 0.65, 16, 16);
        const sphereMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(params.accentColor)
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        hubGroup.add(sphere);

        // Outer Gimbal Ring 1
        const ring1Geo = new THREE.TorusGeometry(node.scale * 2.2, node.scale * 0.06, 10, 36);
        const ring1Mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(params.accentColor),
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending
        });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        ring1.rotation.x = Math.random() * Math.PI;
        ring1.rotation.y = Math.random() * Math.PI;
        ring1.userData = {
          rotSpeedX: (Math.random() - 0.5) * 2.2,
          rotSpeedY: (Math.random() - 0.5) * 2.2,
          rotSpeedZ: (Math.random() - 0.5) * 2.2
        };
        hubGroup.add(ring1);

        // Inner Gimbal Ring 2
        const ring2Geo = new THREE.TorusGeometry(node.scale * 1.5, node.scale * 0.05, 10, 36);
        const ring2Mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(params.pulseColor),
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending
        });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.x = Math.random() * Math.PI;
        ring2.rotation.z = Math.random() * Math.PI;
        ring2.userData = {
          rotSpeedX: (Math.random() - 0.5) * 1.8,
          rotSpeedY: (Math.random() - 0.5) * 1.8,
          rotSpeedZ: (Math.random() - 0.5) * 1.8
        };
        hubGroup.add(ring2);

        // Orbiting Micro Satellite Spark
        const sparkGeo = new THREE.SphereGeometry(node.scale * 0.2, 8, 8);
        const sparkMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(params.pulseColor),
          blending: THREE.AdditiveBlending
        });
        const spark = new THREE.Mesh(sparkGeo, sparkMat);
        spark.position.set(node.scale * 2.2, 0, 0);
        ring1.add(spark);

        hubGroup.userData = {
          progress: node.progress,
          baseScale: node.scale,
          ring1,
          ring2
        };
        haloGroup.add(hubGroup);
      }

      initPackets();
    }

    // --- Subtle Ambient Micro-Particle Cloud ---
    function initParticles() {
      if (particleMesh) scene.remove(particleMesh);

      const count = 2600;
      const positions = new Float32Array(count * 3);
      const phases = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const r = Math.pow(Math.random(), 0.72) * 15.5;
        const theta = Math.random() * Math.PI * 2;
        const y = (Math.random() - 0.42) * 25.0;

        positions[i * 3] = Math.cos(theta) * r;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = Math.sin(theta) * r;
        phases[i] = Math.random();
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

      particleMat = new THREE.ShaderMaterial({
        vertexShader: `
          attribute float aPhase;
          uniform float uTime;
          varying float vPhase;

          void main() {
            vPhase = aPhase;
            vec3 pos = position;

            pos.y += sin(uTime * 0.42 + aPhase * 6.28) * 0.85;
            pos.x += cos(uTime * 0.32 + aPhase * 6.28) * 0.55;
            pos.z += sin(uTime * 0.28 + aPhase * 5.0) * 0.55;

            vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (18.0 / -mvPos.z) * (0.8 + 0.4 * sin(uTime * 1.8 + aPhase * 8.0));
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uParticleColor;
          varying float vPhase;

          void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            float alpha = smoothstep(0.5, 0.04, dist) * 0.7;
            gl_FragColor = vec4(uParticleColor * 1.25, alpha);
          }
        `,
        uniforms: {
          uTime: { value: 0 },
          uParticleColor: { value: new THREE.Color(params.particleColor) }
        },
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particleMesh = new THREE.Points(geo, particleMat);
      scene.add(particleMesh);
    }

    // --- Real 3D Traveling Data Packet Impulses ---
    function initPackets() {
      if (packetMesh) scene.remove(packetMesh);
      if (!treeData || !treeData.paths || treeData.paths.length === 0) return;

      const numPackets = 100;
      packets = [];

      for (let i = 0; i < numPackets; i++) {
        const pathIdx = Math.floor(Math.random() * treeData.paths.length);
        const path = treeData.paths[pathIdx];

        let totalLen = 0;
        const cumDists = [0];
        for (let j = 0; j < path.length - 1; j++) {
          totalLen += path[j].distanceTo(path[j + 1]);
          cumDists.push(totalLen);
        }

        packets.push({
          pathIdx,
          t: Math.random(),
          speed: 0.14 + Math.random() * 0.24,
          totalLen,
          cumDists,
          scale: 0.12 + Math.random() * 0.12
        });
      }

      const packetGeo = new THREE.SphereGeometry(0.15, 12, 12);
      const packetMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.pulseColor),
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });

      packetMesh = new THREE.InstancedMesh(packetGeo, packetMat, numPackets);
      scene.add(packetMesh);
    }

    function samplePolyline(path, cumDists, totalLen, t) {
      if (!path || path.length === 0) return new THREE.Vector3();
      if (path.length === 1 || totalLen === 0) return path[0].clone();

      const targetDist = t * totalLen;
      for (let i = 0; i < cumDists.length - 1; i++) {
        if (targetDist >= cumDists[i] && targetDist <= cumDists[i + 1]) {
          const segLen = cumDists[i + 1] - cumDists[i];
          const localT = segLen > 0 ? (targetDist - cumDists[i]) / segLen : 0;
          return new THREE.Vector3().lerpVectors(path[i], path[i + 1], localT);
        }
      }
      return path[path.length - 1].clone();
    }

    // --- GSAP Growth & Bloom Cycle ---
    function initGSAP() {
      if (growthTween) growthTween.kill();

      params.growth = 0.0;
      growthTween = gsap.to(params, {
        growth: 1.0,
        duration: 8.5,
        ease: 'power2.inOut',
        repeat: -1,
        yoyo: true,
        repeatDelay: 1.5,
        onUpdate: () => {
          if (branchMat) branchMat.uniforms.uGrowth.value = params.growth;
        }
      });
      growthTween.timeScale(params.animSpeed);
    }

    // --- Camera Animations Suite ---
    function updateCameraAnimation(delta) {
      if (params.cameraAnimation === 'Static (Fixed Camera)') return;

      const effectiveDelta = delta * params.animSpeed;
      animClock += effectiveDelta;

      const offset = camera.position.clone().sub(controls.target);
      const spherical = new THREE.Spherical().setFromVector3(offset);

      switch (params.cameraAnimation) {
        case 'Gentle Orbit': {
          spherical.theta += 0.16 * effectiveDelta;
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;
        }
        case 'Cinematic Spiral Ascend': {
          spherical.theta += 0.13 * effectiveDelta;
          const targetDriftY = Math.sin(animClock * 0.4) * 2.0 * effectiveDelta;
          controls.target.y += targetDriftY;
          camera.position.y += targetDriftY;
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;
        }
        case 'Slow Breathing Sway': {
          spherical.theta += Math.sin(animClock * 0.5) * 0.22 * effectiveDelta;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.cos(animClock * 0.4) * 0.1 * effectiveDelta,
            0.3, Math.PI - 0.3
          );
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;
        }
        case 'Vertical Scan Rise & Dip': {
          const scan = Math.sin(animClock * 0.45) * 2.6 * effectiveDelta;
          controls.target.y += scan;
          camera.position.y += scan;
          break;
        }
        case 'Mystic Drone Panoramic': {
          spherical.theta += 0.08 * effectiveDelta;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(animClock * 0.25) * 0.07 * effectiveDelta,
            0.4, Math.PI * 0.65
          );
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;
        }
        case 'Radial Pulse Oscillate': {
          const pulseOsc = 1.0 + Math.sin(animClock * 0.8) * 0.0018 * params.animSpeed;
          offset.multiplyScalar(pulseOsc);
          camera.position.copy(controls.target).add(offset);
          break;
        }
        case 'Zenith Downward Float': {
          spherical.theta += 0.11 * effectiveDelta;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(animClock * 0.3) * 0.06 * effectiveDelta,
            0.25, 0.95
          );
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;
        }
      }
    }

    // --- Dynamic Color Application ---
    function applySchemeColors(schemeKey) {
      const sch = colorSchemes[schemeKey];
      if (!sch) return;

      params.colorScheme = schemeKey;
      params.rootColor = sch.rootColor;
      params.midColor = sch.midColor;
      params.tipColor = sch.tipColor;
      params.accentColor = sch.accentColor;
      params.pulseColor = sch.pulseColor;
      params.particleColor = sch.particleColor;
      params.bgColor = sch.bgColor;

      updateShaderColors();
      updateBackgroundState();

      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function updateShaderColors() {
      if (branchMat) {
        branchMat.uniforms.uRootColor.value.set(params.rootColor);
        branchMat.uniforms.uMidColor.value.set(params.midColor);
        branchMat.uniforms.uTipColor.value.set(params.tipColor);
        branchMat.uniforms.uPulseColor.value.set(params.pulseColor);
      }
      if (leafMat) {
        leafMat.color.set(params.tipColor);
      }
      if (particleMat) {
        particleMat.uniforms.uParticleColor.value.set(params.particleColor);
      }
      if (packetMesh && packetMesh.material) {
        packetMesh.material.color.set(params.pulseColor);
      }

      haloGroup.children.forEach(hub => {
        if (hub.children[0]) hub.children[0].material.color.set(params.accentColor);
        if (hub.userData.ring1) hub.userData.ring1.material.color.set(params.accentColor);
        if (hub.userData.ring2) hub.userData.ring2.material.color.set(params.pulseColor);
      });

      if (rootLight) rootLight.color.set(params.rootLightColor);
      if (canopyLight) canopyLight.color.set(params.canopyLightColor);
    }

    // --- Procedural Re-roll on Scene Click ---
    function randomizeScene() {
      const schemeKeys = Object.keys(colorSchemes);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applySchemeColors(randomScheme);

      params.branchSpread = 0.35 + Math.random() * 0.45;
      params.branchCurvature = 0.3 + Math.random() * 0.5;
      params.branchThickness = 0.6 + Math.random() * 0.45;
      params.branchDepth = Math.random() > 0.4 ? 6 : 5;
      params.swayIntensity = 0.5 + Math.random() * 0.7;
      params.pulseSpeed = 0.7 + Math.random() * 1.4;
      params.pulseDensity = 3.2 + Math.random() * 3.5;
      params.animSpeed = 0.8 + Math.random() * 0.5;

      buildTree();
      initGSAP();

      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- Interaction Listeners ---
    function initEventListeners() {
      // Toggle GUI with "H" key
      window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
          if (gui && gui.domElement) {
            gui.domElement.style.display = gui.domElement.style.display === 'none' ? '' : 'none';
          }
        }
      });

      // Window Resize Handling
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (composer) {
          composer.setSize(window.innerWidth, window.innerHeight);
          bloomPass.resolution.set(window.innerWidth, window.innerHeight);
        }
      });

      // Stationary Click to Randomize
      let pointerDownData = { x: 0, y: 0, time: 0 };
      window.addEventListener('pointerdown', (e) => {
        pointerDownData = { x: e.clientX, y: e.clientY, time: performance.now() };
      });

      window.addEventListener('pointerup', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;

        const dx = e.clientX - pointerDownData.x;
        const dy = e.clientY - pointerDownData.y;
        const dt = performance.now() - pointerDownData.time;

        if (Math.hypot(dx, dy) < 6 && dt < 300) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
      });
    }

    // --- Main Animation Loop ---
    const clock = new THREE.Clock();
    const dummyObj = new THREE.Object3D();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime() * params.animSpeed;

      controls.update();
      updateCameraAnimation(delta);

      // Update Shaders
      if (branchMat) {
        branchMat.uniforms.uTime.value = time;
        branchMat.uniforms.uCameraPos.value.copy(camera.position);
      }
      if (particleMat) {
        particleMat.uniforms.uTime.value = time;
      }

      // Update Leaf Blossoms
      if (leafMesh && treeData && treeData.leafNodes) {
        const numLeaves = treeData.leafNodes.length;
        const leafGrowthScale = Math.max(0.0001, (params.growth - 0.72) / 0.28);

        for (let i = 0; i < numLeaves; i++) {
          const lf = treeData.leafNodes[i];
          dummyObj.position.copy(lf.position);
          dummyObj.rotation.y = time * 1.5 + i;
          dummyObj.rotation.z = Math.sin(time + i) * 0.4;
          const blossomPulse = 0.8 + 0.3 * Math.sin(time * 2.2 + i);
          dummyObj.scale.setScalar(leafGrowthScale * blossomPulse);
          dummyObj.updateMatrix();
          leafMesh.setMatrixAt(i, dummyObj.matrix);
        }
        leafMesh.instanceMatrix.needsUpdate = true;
      }

      // Update Halo Rings around Major Nodes
      haloGroup.children.forEach(hub => {
        const nodeProgress = hub.userData.progress || 0.5;
        const hubVisible = params.growth >= (nodeProgress - 0.05);

        if (hubVisible) {
          const ringScale = Math.min(1.0, (params.growth - (nodeProgress - 0.05)) / 0.1);
          hub.scale.setScalar(ringScale);

          const r1 = hub.userData.ring1;
          const r2 = hub.userData.ring2;
          if (r1) {
            r1.rotation.x += r1.userData.rotSpeedX * delta * params.animSpeed;
            r1.rotation.y += r1.userData.rotSpeedY * delta * params.animSpeed;
            r1.rotation.z += r1.userData.rotSpeedZ * delta * params.animSpeed;
          }
          if (r2) {
            r2.rotation.x += r2.userData.rotSpeedX * delta * params.animSpeed;
            r2.rotation.y += r2.userData.rotSpeedY * delta * params.animSpeed;
            r2.rotation.z += r2.userData.rotSpeedZ * delta * params.animSpeed;
          }
        } else {
          hub.scale.setScalar(0.0001);
        }
      });

      // Update 3D Traveling Data Packets
      if (packetMesh && treeData && treeData.paths && treeData.paths.length > 0) {
        for (let i = 0; i < packets.length; i++) {
          const pkt = packets[i];
          pkt.t += delta * pkt.speed * params.animSpeed;

          if (pkt.t >= 1.0) {
            pkt.t = 0.0;
            pkt.pathIdx = Math.floor(Math.random() * treeData.paths.length);
            const path = treeData.paths[pkt.pathIdx];
            let totalLen = 0;
            const cumDists = [0];
            for (let j = 0; j < path.length - 1; j++) {
              totalLen += path[j].distanceTo(path[j + 1]);
              cumDists.push(totalLen);
            }
            pkt.totalLen = totalLen;
            pkt.cumDists = cumDists;
          }

          if (pkt.t > params.growth) {
            dummyObj.scale.setScalar(0.0001);
          } else {
            const currentPath = treeData.paths[pkt.pathIdx];
            const pos = samplePolyline(currentPath, pkt.cumDists, pkt.totalLen, pkt.t);
            dummyObj.position.copy(pos);
            const pulseScale = pkt.scale * (1.0 + 0.35 * Math.sin(time * 6.0 + i));
            dummyObj.scale.setScalar(pulseScale);
          }

          dummyObj.updateMatrix();
          packetMesh.setMatrixAt(i, dummyObj.matrix);
        }
        packetMesh.instanceMatrix.needsUpdate = true;
      }

      // Render through Composer (Bloom) or Direct for Green Screen
      if (params.bloomEnabled && !params.greenScreen && composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    // Initialize application
    init();
  </script>
</body>
</html>
