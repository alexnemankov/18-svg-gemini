        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.5, 48);

        let renderer = null;
        let controls = null;
        let postProcessor = null;

        function createRendererInstance() {
            if (renderer) {
                renderer.dispose();
                if (renderer.domElement && renderer.domElement.parentNode) {
                    renderer.domElement.parentNode.removeChild(renderer.domElement);
                }
            }

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(params.dpr);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = params.exposure;
            container.appendChild(renderer.domElement);

            const oldTarget = controls ? controls.target.clone() : new THREE.Vector3(0, 8.8, 0);
            if (controls) controls.dispose();

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.copy(oldTarget);
            controls.minDistance = 12;
            controls.maxDistance = 150;
            controls.maxPolarAngle = Math.PI * 0.54;
            controls.minPolarAngle = Math.PI * 0.12;

            if (postProcessor) {
                postProcessor.renderer = renderer;
                postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
            } else {
                postProcessor = new PostProcessor(renderer, {
                    enabled: true,
                    antialiasMode: params.antialiasMode,
                    bloomEnabled: true,
                    bloomStrength: 1.35,
                    bloomRadius: 0.55,
                    bloomThreshold: 0.22,
                    anamorphicEnabled: false, // Default Strictly OFF
                    raysEnabled: false,
                    chromaticAberration: 0.006,
                    vignetteBoost: 1.06,
                    vignetteReduction: 0.65,
                    noiseIntensity: 0.008,
                    exposure: params.exposure
                });
                postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
            }

            setupEventListeners();
        }

        createRendererInstance();

        // ==========================================
        // LIGHTS
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0x182030, params.ambientIntensity);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x283850, 0x101824, params.horizonGlow);
        scene.add(hemiLight);

        const flashLight = new THREE.PointLight(0xffe49e, 0, 180, 1.4);
        flashLight.position.set(0, 22, 0);
        scene.add(flashLight);

        // ==========================================
        // SKY & HORIZON HAZE
        // ==========================================
        const skyGeo = new THREE.SphereGeometry(180, 48, 32);
        const skyMat = new THREE.ShaderMaterial({
            uniforms: {
                topColor: { value: new THREE.Color(COLOR_SCHEMES[params.scheme].skyTop) },
                bottomColor: { value: new THREE.Color(COLOR_SCHEMES[params.scheme].skyBottom) },
                offset: { value: 12.0 },
                exponent: { value: 0.72 }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 topColor;
                uniform vec3 bottomColor;
                uniform float offset;
                uniform float exponent;
                varying vec3 vWorldPosition;
                void main() {
                    float h = normalize(vWorldPosition + offset).y;
                    float factor = max(pow(max(h, 0.0), exponent), 0.0);
                    gl_FragColor = vec4(mix(bottomColor, topColor, factor), 1.0);
                }
            `,
            side: THREE.BackSide,
            depthWrite: false
        });
        const skyMesh = new THREE.Mesh(skyGeo, skyMat);
        scene.add(skyMesh);

        const hazeGeo = new THREE.CylinderGeometry(140, 140, 38, 64, 1, true);
        const hazeMat = new THREE.ShaderMaterial({
            uniforms: {
                hazeColor: { value: new THREE.Color(COLOR_SCHEMES[params.scheme].hazeColor) },
                flashIntensity: { value: 0.0 },
                flashColor: { value: new THREE.Color(COLOR_SCHEMES[params.scheme].flashColor) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 hazeColor;
                uniform vec3 flashColor;
                uniform float flashIntensity;
                varying vec2 vUv;
                void main() {
                    float alpha = smoothstep(0.02, 0.38, vUv.y) * smoothstep(0.98, 0.48, vUv.y) * 0.38;
                    vec3 col = mix(hazeColor, flashColor, flashIntensity * 0.65);
                    gl_FragColor = vec4(col, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const hazeMesh = new THREE.Mesh(hazeGeo, hazeMat);
        hazeMesh.position.y = 5.0;
        scene.add(hazeMesh);

        const cloudGroup = new THREE.Group();
        const cloudMaterials = [];
        const cloudCount = 12;
        for (let i = 0; i < cloudCount; i++) {
            const cMat = new THREE.MeshBasicMaterial({
                map: cloudTexture,
                transparent: true,
                opacity: 0.06 + Math.random() * 0.05,
                color: new THREE.Color(COLOR_SCHEMES[params.scheme].hazeColor),
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            cloudMaterials.push(cMat);

            const cMesh = new THREE.Mesh(new THREE.PlaneGeometry(36 + Math.random() * 22, 12 + Math.random() * 8), cMat);
            const angle = (i / cloudCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
            const dist = 65 + Math.random() * 20;
            cMesh.position.set(Math.cos(angle) * dist, 18 + Math.random() * 14, Math.sin(angle) * dist);
            cMesh.lookAt(0, cMesh.position.y, 0);
            cloudGroup.add(cMesh);
        }
        scene.add(cloudGroup);

        // ==========================================
        // SOLID GROUNDED ARCHITECTURE (NO FLYING ROOFS)
        // ==========================================
        const cityGroup = new THREE.Group();
        scene.add(cityGroup);

        const roofMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(COLOR_SCHEMES[params.scheme].roofColor),
            roughness: 0.88,
            metalness: 0.18,
            flatShading: false
        });

        let diyaPointsMesh = null;
        let diyaData = [];

        // Generates an anchored onion dome whose bottom radius seamlessly matches its drum base
        function generateAnchoredOnionDomeGeometry(baseRadius, domeHeight) {
            const points = [];
            const segments = 48;
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const y = t * domeHeight;
                let r;
                if (t < 0.15) {
                    // Solid base: matches drum base at t = 0 without pinching to zero!
                    r = baseRadius * (1.0 + (t / 0.15) * 0.18);
                } else if (t < 0.65) {
                    const localT = (t - 0.15) / 0.50;
                    r = baseRadius * 1.18 * (1.0 - Math.pow(localT, 2.0) * 0.35);
                } else {
                    const localT = (t - 0.65) / 0.35;
                    r = baseRadius * 0.76 * Math.pow(1.0 - localT, 1.8);
                }
                points.push(new THREE.Vector2(Math.max(r, 0.01), y));
            }
            return new THREE.LatheGeometry(points, 36);
        }

        function buildRooftopSilhouette() {
            while (cityGroup.children.length > 0) {
                const obj = cityGroup.children[0];
                cityGroup.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
            }
            diyaData = [];

            // 1. Continuous Solid Deep Foundation Wall:
            // Extends deep down to y = -40 to ensure absolute solid base horizon
            const baseFoundationGeo = new THREE.BoxGeometry(240, 36, 12);
            const baseFoundationMesh = new THREE.Mesh(baseFoundationGeo, roofMat);
            baseFoundationMesh.position.set(0, -23.0, -25.0);
            cityGroup.add(baseFoundationMesh);

            const layers = [
                { z: 12, count: 18, widthMin: 3.8, widthMax: 7.8, hMin: 3.5, hMax: 6.8, depth: 5.0, scale: 0.95 },
                { z: 0, count: 26, widthMin: 4.5, widthMax: 9.8, hMin: 5.0, hMax: 9.8, depth: 6.5, scale: 1.0 },
                { z: -16, count: 24, widthMin: 5.5, widthMax: 11.5, hMin: 6.5, hMax: 12.0, depth: 8.0, scale: 1.1 }
            ];

            const finialGeo = new THREE.ConeGeometry(0.18, 1.5, 16);

            layers.forEach((layer) => {
                const span = 90 * layer.scale;
                const step = span / layer.count;

                for (let i = 0; i < layer.count; i++) {
                    const posX = -span * 0.5 + i * step + (Math.random() - 0.5) * step * 0.6;
                    const posZ = layer.z + (Math.random() - 0.5) * 3.0;
                    const bWidth = layer.widthMin + Math.random() * (layer.widthMax - layer.widthMin);
                    const bHeight = layer.hMin + Math.random() * (layer.hMax - layer.hMin);
                    const bDepth = layer.depth + Math.random() * 2.0;

                    // Absolute Grounding: bottom extends all the way down to -36.0!
                    const topY = -4.5 + bHeight;
                    const baseBottom = -36.0;
                    const totalH = topY - baseBottom;
                    const posY = (topY + baseBottom) * 0.5;

                    const blockGeo = new THREE.BoxGeometry(bWidth, totalH, bDepth);
                    const blockMesh = new THREE.Mesh(blockGeo, roofMat);
                    blockMesh.position.set(posX, posY, posZ);
                    cityGroup.add(blockMesh);

                    // Terrace slab
                    const slabGeo = new THREE.BoxGeometry(bWidth + 0.5, 0.38, bDepth + 0.5);
                    const slabMesh = new THREE.Mesh(slabGeo, roofMat);
                    slabMesh.position.set(posX, topY + 0.19, posZ);
                    cityGroup.add(slabMesh);

                    const terraceY = topY + 0.38;

                    // Add Diyas along terrace edge
                    const diyaCount = Math.floor(bWidth * 1.0);
                    for (let d = 0; d < diyaCount; d++) {
                        const dx = posX - bWidth * 0.45 + (d / Math.max(diyaCount - 1, 1)) * (bWidth * 0.9);
                        const dz = posZ + bDepth * 0.48;
                        diyaData.push({
                            x: dx,
                            y: terraceY + 0.12,
                            z: dz,
                            phase: Math.random() * Math.PI * 2,
                            speed: 2.2 + Math.random() * 3.0,
                            baseScale: 0.35 + Math.random() * 0.2
                        });
                    }

                    // Feature atop building: strictly sized to fit inside the building footprint!
                    const maxR = Math.min(bWidth, bDepth) * 0.34; // Leaves at least 32% margin around terrace!
                    const featureRoll = Math.random();

                    if (featureRoll < 0.48 && maxR > 1.2) {
                        // Anchored Onion Dome with supporting drum
                        const drumR = maxR * 0.88;
                        const drumH = maxR * 0.65;
                        const drumMesh = new THREE.Mesh(new THREE.CylinderGeometry(drumR, drumR, drumH, 32), roofMat);
                        drumMesh.position.set(posX, terraceY + drumH * 0.5, posZ);
                        cityGroup.add(drumMesh);

                        const collarMesh = new THREE.Mesh(new THREE.CylinderGeometry(drumR * 1.06, drumR * 1.06, 0.16, 32), roofMat);
                        collarMesh.position.set(posX, terraceY + drumH + 0.08, posZ);
                        cityGroup.add(collarMesh);

                        const domeH = maxR * 1.7;
                        const domeGeo = generateAnchoredOnionDomeGeometry(drumR * 0.98, domeH);
                        const domeMesh = new THREE.Mesh(domeGeo, roofMat);
                        domeMesh.position.set(posX, terraceY + drumH + 0.16, posZ);
                        cityGroup.add(domeMesh);

                        const finial = new THREE.Mesh(finialGeo, roofMat);
                        const finialY = terraceY + drumH + 0.16 + domeH;
                        finial.position.set(posX, finialY + 0.75, posZ);
                        cityGroup.add(finial);

                        diyaData.push({
                            x: posX,
                            y: finialY + 1.55,
                            z: posZ,
                            phase: Math.random() * Math.PI * 2,
                            speed: 2.8,
                            baseScale: 0.55
                        });
                    } else if (featureRoll < 0.78 && maxR > 1.0) {
                        // Anchored Cupola with supporting drum
                        const drumR = maxR * 0.85;
                        const drumH = maxR * 0.55;
                        const drumMesh = new THREE.Mesh(new THREE.CylinderGeometry(drumR, drumR, drumH, 32), roofMat);
                        drumMesh.position.set(posX, terraceY + drumH * 0.5, posZ);
                        cityGroup.add(drumMesh);

                        const collarMesh = new THREE.Mesh(new THREE.CylinderGeometry(drumR * 1.05, drumR * 1.05, 0.14, 32), roofMat);
                        collarMesh.position.set(posX, terraceY + drumH + 0.07, posZ);
                        cityGroup.add(collarMesh);

                        const cupolaGeo = new THREE.SphereGeometry(drumR * 1.02, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.5);
                        const cupolaMesh = new THREE.Mesh(cupolaGeo, roofMat);
                        cupolaMesh.position.set(posX, terraceY + drumH + 0.14, posZ);
                        cityGroup.add(cupolaMesh);

                        const finial = new THREE.Mesh(finialGeo, roofMat);
                        const finialY = terraceY + drumH + 0.14 + drumR * 1.02;
                        finial.position.set(posX, finialY + 0.75, posZ);
                        cityGroup.add(finial);
                    } else if (featureRoll < 0.92) {
                        // Stepped Terrace Pavilion
                        const subW = bWidth * 0.6;
                        const subD = bDepth * 0.6;
                        const subH = 1.6 + Math.random() * 1.2;
                        const subBlock = new THREE.Mesh(new THREE.BoxGeometry(subW, subH, subD), roofMat);
                        subBlock.position.set(posX, terraceY + subH * 0.5, posZ);
                        cityGroup.add(subBlock);

                        const subSlab = new THREE.Mesh(new THREE.BoxGeometry(subW + 0.4, 0.25, subD + 0.4), roofMat);
                        subSlab.position.set(posX, terraceY + subH + 0.125, posZ);
                        cityGroup.add(subSlab);

                        diyaData.push({
                            x: posX - subW * 0.35,
                            y: terraceY + subH + 0.35,
                            z: posZ + subD * 0.35,
                            phase: Math.random() * Math.PI * 2,
                            speed: 3.1,
                            baseScale: 0.4
                        });
                        diyaData.push({
                            x: posX + subW * 0.35,
                            y: terraceY + subH + 0.35,
                            z: posZ + subD * 0.35,
                            phase: Math.random() * Math.PI * 2,
                            speed: 2.7,
                            baseScale: 0.4
                        });
                    }

                    // Hanging fairy garlands between foreground buildings
                    if (i > 0 && Math.random() < 0.45 && layer.z >= 0) {
                        const prevX = posX - step;
                        const garlandDots = 8;
                        for (let g = 1; g < garlandDots; g++) {
                            const gt = g / garlandDots;
                            const gx = prevX + (posX - prevX) * gt;
                            const sag = Math.sin(gt * Math.PI) * 0.85;
                            const gy = terraceY - sag + 0.1;
                            const gz = posZ + bDepth * 0.46;
                            diyaData.push({
                                x: gx,
                                y: gy,
                                z: gz,
                                phase: Math.random() * Math.PI * 2,
                                speed: 3.0 + Math.random() * 2.5,
                                baseScale: 0.28 + Math.random() * 0.12
                            });
                        }
                    }
                }
            });

            rebuildDiyaParticleSystem();
        }

        function rebuildDiyaParticleSystem() {
            if (diyaPointsMesh) {
                scene.remove(diyaPointsMesh);
                if (diyaPointsMesh.geometry) diyaPointsMesh.geometry.dispose();
                if (diyaPointsMesh.material) diyaPointsMesh.material.dispose();
            }

            const count = diyaData.length;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const baseColor = new THREE.Color(COLOR_SCHEMES[params.scheme].diyaColor);

            for (let i = 0; i < count; i++) {
                const d = diyaData[i];
                positions[i * 3] = d.x;
                positions[i * 3 + 1] = d.y;
                positions[i * 3 + 2] = d.z;

                colors[i * 3] = baseColor.r * 2.0;
                colors[i * 3 + 1] = baseColor.g * 2.0;
                colors[i * 3 + 2] = baseColor.b * 2.0;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.85 * params.diyaIntensity,
                map: sparkTexture,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            diyaPointsMesh = new THREE.Points(geo, mat);
            scene.add(diyaPointsMesh);
        }

        buildRooftopSilhouette();

        // =========================================================================
        // ENHANCED FIREWORKS ENGINE WITH STREAMERS & CRACKLE
        // =========================================================================
        const FIREWORK_TYPES = ['Chrysanthemum', 'Palm', 'Ring', 'Willow'];
        const activeFireworks = [];

        class Firework {
            constructor(options = {}) {
                this.type = options.type || FIREWORK_TYPES[Math.floor(Math.random() * FIREWORK_TYPES.length)];
                
                const scheme = COLOR_SCHEMES[params.scheme];
                const palette = scheme.fireworkColors;
                this.primaryColor = new THREE.Color(palette[Math.floor(Math.random() * palette.length)]);
                this.secondaryColor = new THREE.Color(palette[Math.floor(Math.random() * palette.length)]);

                this.targetX = options.x !== undefined ? options.x : (Math.random() - 0.5) * 44;
                this.targetY = options.y !== undefined ? options.y : 15 + Math.random() * 16;
                // Launch depth placed behind the midground skyline to avoid clipping through foreground roofs
                this.targetZ = options.z !== undefined ? options.z : -5.0 + (Math.random() - 0.5) * 16;

                this.launchX = this.targetX + (Math.random() - 0.5) * 3.0;
                this.launchY = -6.0;
                this.launchZ = this.targetZ - 4.0; // Deep behind roofs

                this.phase = 'ascending';
                this.age = 0;
                this.flightDuration = 1.0 + Math.random() * 0.4;

                this.rocketPos = new THREE.Vector3(this.launchX, this.launchY, this.launchZ);
                this.rocketVel = new THREE.Vector3(
                    (this.targetX - this.launchX) / this.flightDuration,
                    (this.targetY - this.launchY) / this.flightDuration,
                    (this.targetZ - this.launchZ) / this.flightDuration
                );

                this.initRocketVisual();
            }

            initRocketVisual() {
                const trailLen = 14;
                const pos = new Float32Array(trailLen * 3);
                const col = new Float32Array(trailLen * 3);

                for (let i = 0; i < trailLen; i++) {
                    pos[i * 3] = this.launchX;
                    pos[i * 3 + 1] = this.launchY;
                    pos[i * 3 + 2] = this.launchZ;

                    const t = 1.0 - (i / trailLen);
                    col[i * 3] = this.primaryColor.r * 2.0 * t;
                    col[i * 3 + 1] = this.primaryColor.g * 2.0 * t;
                    col[i * 3 + 2] = this.primaryColor.b * 2.0 * t;
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

                const mat = new THREE.PointsMaterial({
                    size: 1.35,
                    map: sparkTexture,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: true // Properly occluded by buildings!
                });

                this.rocketMesh = new THREE.Points(geo, mat);
                scene.add(this.rocketMesh);
                this.rocketHistory = [];
            }

            detonate() {
                this.phase = 'bursting';
                this.age = 0;

                if (this.rocketMesh) {
                    scene.remove(this.rocketMesh);
                    this.rocketMesh.geometry.dispose();
                    this.rocketMesh.material.dispose();
                    this.rocketMesh = null;
                }

                // Dynamic Flash Light illumination
                flashLight.position.set(this.targetX, this.targetY, this.targetZ);
                flashLight.color.copy(this.primaryColor);
                
                const flashPeak = 3.2 * params.flashIntensity;
                gsap.killTweensOf(flashLight);
                gsap.fromTo(flashLight, 
                    { intensity: flashPeak }, 
                    { intensity: 0, duration: 0.8, ease: 'power2.out' }
                );

                hazeMat.uniforms.flashColor.value.copy(this.primaryColor);
                gsap.killTweensOf(hazeMat.uniforms.flashIntensity);
                gsap.fromTo(hazeMat.uniforms.flashIntensity, 
                    { value: 1.0 }, 
                    { value: 0.0, duration: 0.9, ease: 'power2.out' }
                );

                cloudMaterials.forEach(cMat => {
                    gsap.killTweensOf(cMat.color);
                    gsap.fromTo(cMat.color,
                        { r: this.primaryColor.r, g: this.primaryColor.g, b: this.primaryColor.b },
                        { 
                            r: new THREE.Color(COLOR_SCHEMES[params.scheme].hazeColor).r,
                            g: new THREE.Color(COLOR_SCHEMES[params.scheme].hazeColor).g,
                            b: new THREE.Color(COLOR_SCHEMES[params.scheme].hazeColor).b,
                            duration: 1.0,
                            ease: 'power2.out'
                        }
                    );
                });

                this.initStreamerBurst();
            }

            initStreamerBurst() {
                // Number of main stars
                let baseStars = 140;
                if (this.type === 'Chrysanthemum') baseStars = 180;
                else if (this.type === 'Palm') baseStars = 130;
                else if (this.type === 'Ring') baseStars = 160;
                else if (this.type === 'Willow') baseStars = 150;

                this.starCount = Math.floor(baseStars * params.sparkCount);
                this.trailHistoryLen = 6; // 6 trailing sparks per star forming smooth streamers
                this.totalPoints = this.starCount * (1 + this.trailHistoryLen);
                this.maxLife = (this.type === 'Willow') ? 4.1 : 2.5;

                const positions = new Float32Array(this.totalPoints * 3);
                const colors = new Float32Array(this.totalPoints * 3);
                this.velocities = [];
                this.stars = [];

                // Ring orientation normal
                const ringNormal = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.7,
                    1.0,
                    (Math.random() - 0.5) * 0.7
                ).normalize();
                const ringTanU = new THREE.Vector3(1, 0, 0).cross(ringNormal).normalize();
                const ringTanV = ringNormal.clone().cross(ringTanU).normalize();

                // Palm frond branches
                const branchCount = 12;
                const branchDirs = [];
                for (let b = 0; b < branchCount; b++) {
                    const theta = (b / branchCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;
                    const phi = 0.38 + Math.random() * 0.42;
                    branchDirs.push(new THREE.Vector3(
                        Math.cos(theta) * Math.sin(phi),
                        Math.cos(phi) * 1.3,
                        Math.sin(theta) * Math.sin(phi)
                    ).normalize());
                }

                for (let i = 0; i < this.starCount; i++) {
                    let vel = new THREE.Vector3();
                    let isCore = false;

                    if (this.type === 'Chrysanthemum') {
                        const u = Math.random();
                        const v = Math.random();
                        const theta = u * 2.0 * Math.PI;
                        const phi = Math.acos(2.0 * v - 1.0);
                        const speed = 14 + Math.random() * 15;
                        vel.set(
                            Math.sin(phi) * Math.cos(theta),
                            Math.sin(phi) * Math.sin(theta),
                            Math.cos(phi)
                        ).multiplyScalar(speed);
                    } else if (this.type === 'Palm') {
                        const branchIdx = i % branchCount;
                        const branch = branchDirs[branchIdx];
                        const spread = 0.14;
                        vel.copy(branch).add(new THREE.Vector3(
                            (Math.random() - 0.5) * spread,
                            (Math.random() - 0.5) * spread,
                            (Math.random() - 0.5) * spread
                        )).normalize().multiplyScalar(17 + Math.random() * 10);
                    } else if (this.type === 'Ring') {
                        if (i < 20) {
                            // Sparkling center jewel
                            isCore = true;
                            vel.set((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
                        } else {
                            const angle = ((i - 20) / (this.starCount - 20)) * Math.PI * 2;
                            const speed = 19 + (Math.random() - 0.5) * 2.5;
                            vel.addScaledVector(ringTanU, Math.cos(angle) * speed);
                            vel.addScaledVector(ringTanV, Math.sin(angle) * speed);
                        }
                    } else if (this.type === 'Willow') {
                        const u = Math.random();
                        const v = Math.random();
                        const theta = u * 2.0 * Math.PI;
                        const phi = Math.acos(2.0 * v - 1.0);
                        const speed = 9 + Math.random() * 10;
                        vel.set(
                            Math.sin(phi) * Math.cos(theta),
                            Math.sin(phi) * Math.sin(theta) * 0.7 + 0.35,
                            Math.cos(phi)
                        ).multiplyScalar(speed);
                    }

                    const starColor = isCore ? new THREE.Color(0xffffff) : (Math.random() < 0.65 ? this.primaryColor : this.secondaryColor);

                    const history = [];
                    for (let h = 0; h < this.trailHistoryLen; h++) {
                        history.push(new THREE.Vector3(this.targetX, this.targetY, this.targetZ));
                    }

                    this.stars.push({
                        pos: new THREE.Vector3(this.targetX, this.targetY, this.targetZ),
                        vel: vel,
                        color: starColor,
                        history: history,
                        seed: Math.random() * 30.0,
                        isCore: isCore
                    });
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const mat = new THREE.PointsMaterial({
                    size: (this.type === 'Willow' ? 1.6 : 1.45),
                    map: sparkTexture,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.burstMesh = new THREE.Points(geo, mat);
                scene.add(this.burstMesh);
            }

            update(dt) {
                this.age += dt;

                if (this.phase === 'ascending') {
                    this.rocketPos.addScaledVector(this.rocketVel, dt);

                    if (this.rocketMesh) {
                        this.rocketHistory.unshift(this.rocketPos.clone());
                        if (this.rocketHistory.length > 14) this.rocketHistory.pop();

                        const posAttr = this.rocketMesh.geometry.attributes.position;
                        for (let i = 0; i < this.rocketHistory.length; i++) {
                            posAttr.setXYZ(i, this.rocketHistory[i].x, this.rocketHistory[i].y, this.rocketHistory[i].z);
                        }
                        posAttr.needsUpdate = true;
                    }

                    if (this.age >= this.flightDuration || this.rocketPos.y >= this.targetY) {
                        this.detonate();
                    }
                } else if (this.phase === 'bursting') {
                    if (!this.burstMesh) return;

                    const lifeNorm = Math.min(this.age / this.maxLife, 1.0);
                    const posAttr = this.burstMesh.geometry.attributes.position;
                    const colAttr = this.burstMesh.geometry.attributes.color;

                    const drag = (this.type === 'Willow') ? 0.982 : 0.962;
                    const gravity = (this.type === 'Willow') ? 4.2 : 6.5;

                    let pIndex = 0;

                    for (let i = 0; i < this.starCount; i++) {
                        const star = this.stars[i];

                        star.vel.multiplyScalar(drag);
                        star.vel.y -= gravity * dt;

                        // Add star current position to history
                        star.history.unshift(star.pos.clone());
                        if (star.history.length > this.trailHistoryLen) star.history.pop();

                        star.pos.addScaledVector(star.vel, dt);

                        // Primary Star Head
                        posAttr.setXYZ(pIndex, star.pos.x, star.pos.y, star.pos.z);
                        const twinkle = 0.8 + Math.sin(this.age * 28.0 + star.seed) * 0.25;
                        const headFade = Math.pow(1.0 - lifeNorm, 1.2) * twinkle * 1.8;

                        colAttr.setXYZ(pIndex, star.color.r * headFade, star.color.g * headFade, star.color.b * headFade);
                        pIndex++;

                        // Trailing Streamer Sparks
                        for (let h = 0; h < star.history.length; h++) {
                            const hPos = star.history[h];
                            const tRatio = 1.0 - (h + 1) / (this.trailHistoryLen + 1);
                            const tailFade = headFade * tRatio * 0.75;

                            posAttr.setXYZ(pIndex, hPos.x, hPos.y, hPos.z);
                            colAttr.setXYZ(pIndex, star.color.r * tailFade, star.color.g * tailFade, star.color.b * tailFade);
                            pIndex++;
                        }
                    }

                    posAttr.needsUpdate = true;
                    colAttr.needsUpdate = true;

                    if (this.age >= this.maxLife) {
                        this.dispose();
                        this.phase = 'dead';
                    }
                }
            }

            dispose() {
                if (this.rocketMesh) {
                    scene.remove(this.rocketMesh);
                    this.rocketMesh.geometry.dispose();
                    this.rocketMesh.material.dispose();
                    this.rocketMesh = null;
                }
                if (this.burstMesh) {
                    scene.remove(this.burstMesh);
                    this.burstMesh.geometry.dispose();
                    this.burstMesh.material.dispose();
                    this.burstMesh = null;
                }
            }
        }

        function spawnFirework(options) {
            activeFireworks.push(new Firework(options));
        }

        let autoLaunchTimer = 0;
        function updateFireworksEngine(dt) {
            autoLaunchTimer += dt * params.fireworkRate;
            if (autoLaunchTimer > 1.45) {
                autoLaunchTimer = 0;
                spawnFirework();
                if (Math.random() < 0.4) {
                    setTimeout(() => spawnFirework(), 350 + Math.random() * 400);
                }
            }

            for (let i = activeFireworks.length - 1; i >= 0; i--) {
                const fw = activeFireworks[i];
                fw.update(dt);
                if (fw.phase === 'dead') {
                    activeFireworks.splice(i, 1);
                }
            }
        }

        // Initial launch
        spawnFirework({ type: 'Chrysanthemum', x: -8, y: 22 });
        setTimeout(() => spawnFirework({ type: 'Willow', x: 8, y: 26 }), 650);
        setTimeout(() => spawnFirework({ type: 'Ring', x: -15, y: 19 }), 1300);

        // ==========================================
        // CAMERA MOTION SYSTEM (PRESERVES USER ZOOM & ANGLE)
        // ==========================================
        let simTime = 0;

        function updateCameraMotion(dt) {
            const speed = params.animationSpeed;
            simTime += dt * speed;

            const mode = params.cameraAnimation;

            if (mode === 'Static (No camera movement)') {
                controls.autoRotate = false;
            } else if (mode === 'Subtle Rooftop Orbit') {
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.28 * speed;
            } else if (mode === 'Slow Horizon Pan') {
                controls.autoRotate = false;
                const panStep = Math.sin(simTime * 0.35) * 1.1 * dt;
                controls.target.x += panStep;
                camera.position.x += panStep;
            } else if (mode === 'Majestic Rise') {
                controls.autoRotate = false;
                const riseStep = Math.cos(simTime * 0.25) * 0.75 * dt;
                controls.target.y += riseStep * 0.45;
                camera.position.y += riseStep;
            } else if (mode === 'Midnight Breathe') {
                controls.autoRotate = false;
                const dir = camera.position.clone().sub(controls.target).normalize();
                const breatheDelta = Math.sin(simTime * 0.45) * 0.45 * dt;
                camera.position.addScaledVector(dir, breatheDelta);
            } else if (mode === 'Rooftop Balcony Sweep') {
                controls.autoRotate = false;
                const sweepX = Math.sin(simTime * 0.28) * 0.95 * dt;
                const sweepY = Math.cos(simTime * 0.22) * 0.4 * dt;
                controls.target.x += sweepX;
                camera.position.x += sweepX;
                controls.target.y += sweepY * 0.3;
                camera.position.y += sweepY;
            } else if (mode === 'Stargazer Sway') {
                controls.autoRotate = false;
                const swayX = Math.sin(simTime * 0.3) * 0.85 * dt;
                const swayY = Math.sin(simTime * 0.6) * 0.35 * dt;
                controls.target.x += swayX;
                camera.position.x += swayX;
                controls.target.y += swayY * 0.3;
                camera.position.y += swayY;
            } else if (mode === 'Golden Hour Drift') {
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.16 * speed;
                const driftY = Math.sin(simTime * 0.2) * 0.55 * dt;
                controls.target.y += driftY * 0.35;
                camera.position.y += driftY;
            }

            controls.update();
        }

        // ==========================================
        // COLOR SCHEME APPLICATION
        // ==========================================
        function applyColorScheme(schemeName) {
            const sc = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
            params.scheme = schemeName;

            params.primaryColor = sc.fireworkColors[0];
            params.accentColor = sc.fireworkColors[1];

            if (params.greenscreen) {
                applyGreenscreen();
                return;
            }

            scene.background = null;
            skyMesh.visible = true;
            hazeMesh.visible = true;

            skyMat.uniforms.topColor.value.set(sc.skyTop);
            skyMat.uniforms.bottomColor.value.set(sc.skyBottom);
            hazeMat.uniforms.hazeColor.value.set(sc.hazeColor);
            roofMat.color.set(sc.roofColor);

            ambientLight.color.set(sc.skyBottom);
            hemiLight.color.set(sc.skyTop);
            hemiLight.groundColor.set(sc.roofColor);

            cloudMaterials.forEach(cMat => {
                cMat.color.set(sc.hazeColor);
            });

            rebuildDiyaParticleSystem();
        }

        function applyGreenscreen() {
            if (params.greenscreen) {
                scene.background = new THREE.Color(0x00ff00);
                skyMesh.visible = false;
                hazeMesh.visible = false;
                cloudGroup.visible = false;
            } else {
                cloudGroup.visible = true;
                applyColorScheme(params.scheme);
            }
        }

        // ==========================================
        // PROCEDURAL RANDOMIZATION ON SCENE CLICK
        // DOES NOT SHUFFLE POSTPROCESSING SETTINGS!
        // ==========================================
        function triggerProceduralRandomization() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            params.scheme = randomScheme;
            applyColorScheme(randomScheme);

            // Re-roll scene dynamics only (DO NOT TOUCH POSTPROCESSOR)
            params.fireworkRate = 0.7 + Math.random() * 1.2;
            params.animationSpeed = 0.65 + Math.random() * 0.75;
            params.exposure = 0.95 + Math.random() * 0.3;
            renderer.toneMappingExposure = params.exposure;

            const randomMotion = CAMERA_ANIMATIONS[Math.floor(Math.random() * CAMERA_ANIMATIONS.length)];
            params.cameraAnimation = randomMotion;

            // Grand celebratory salute
            spawnFirework({ x: -14, y: 19 + Math.random() * 5 });
            spawnFirework({ x: 0, y: 25 + Math.random() * 5 });
            spawnFirework({ x: 14, y: 21 + Math.random() * 5 });

            // Only update scene controllers in GUI
            if (sceneControllers) {
                sceneControllers.forEach(c => c.updateDisplay());
            }
        }

        // ==========================================
        // LIL-GUI SETUP
        // ==========================================
        const gui = new GUI({ title: 'Scene & Fireworks Controls' });
        const sceneControllers = [];

        // Folder: Themes & Colors
        const fTheme = gui.addFolder('Color & Scheme');
        sceneControllers.push(fTheme.add(params, 'scheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange(val => applyColorScheme(val)));
        sceneControllers.push(fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => applyGreenscreen()));
        sceneControllers.push(fTheme.addColor(params, 'primaryColor').name('Custom Primary').onChange(val => {
            COLOR_SCHEMES[params.scheme].fireworkColors[0] = val;
        }));
        sceneControllers.push(fTheme.addColor(params, 'accentColor').name('Custom Accent').onChange(val => {
            COLOR_SCHEMES[params.scheme].fireworkColors[1] = val;
        }));
        sceneControllers.push(fTheme.add(params, 'clickRandomize').name('Click to Randomize'));

        // Folder: Camera & Motion
        const fCamera = gui.addFolder('Camera & Motion');
        sceneControllers.push(fCamera.add(params, 'cameraAnimation', CAMERA_ANIMATIONS).name('Camera Motion'));
        sceneControllers.push(fCamera.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Animation Speed'));

        // Folder: Lighting & Exposure
        const fLight = gui.addFolder('Lighting & Exposure');
        sceneControllers.push(fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(v => {
            renderer.toneMappingExposure = v;
            if (postProcessor) postProcessor.settings.exposure = v;
        }));
        sceneControllers.push(fLight.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Light').onChange(v => {
            ambientLight.intensity = v;
        }));
        sceneControllers.push(fLight.add(params, 'flashIntensity', 0.0, 4.0, 0.1).name('Firework Flash'));
        sceneControllers.push(fLight.add(params, 'diyaIntensity', 0.0, 3.0, 0.1).name('Diya Lanterns').onChange(v => {
            if (diyaPointsMesh) diyaPointsMesh.material.size = 0.85 * v;
        }));
        sceneControllers.push(fLight.add(params, 'horizonGlow', 0.0, 3.0, 0.1).name('Horizon Glow').onChange(v => {
            hemiLight.intensity = v;
        }));

        // Folder: Rendering & Fireworks
        const fRender = gui.addFolder('Rendering & Fireworks');
        sceneControllers.push(fRender.add(params, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, v);
        }));
        sceneControllers.push(fRender.add(params, 'fireworkRate', 0.2, 3.0, 0.1).name('Launch Frequency'));
        sceneControllers.push(fRender.add(params, 'sparkCount', 0.5, 2.0, 0.1).name('Spark Density'));
        sceneControllers.push(fRender.add(params, 'triggerFirework').name('Trigger Firework 🎆'));

        // Attach Post-Processing Suite (from postprocessing/PostProcessor.js)
        postProcessor.attachGUI(gui, 'Post-Processing Suite');

        // Toggle UI with 'H' key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // Pointer event listener
        function setupEventListeners() {
            let pointerDownPos = { x: 0, y: 0 };
            let pointerDownTime = 0;

            renderer.domElement.addEventListener('pointerdown', (e) => {
                pointerDownPos = { x: e.clientX, y: e.clientY };
                pointerDownTime = performance.now();
            });

            renderer.domElement.addEventListener('pointerup', (e) => {
                const dx = e.clientX - pointerDownPos.x;
                const dy = e.clientY - pointerDownPos.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const duration = performance.now() - pointerDownTime;

                if (dist < 6 && duration < 350 && params.clickRandomize) {
                    triggerProceduralRandomization();
                }
            });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (postProcessor) {
                postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
            }
        });

        // ==========================================
        // MAIN ANIMATION LOOP
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);

            // Update Diya candle flickering
            if (diyaPointsMesh && diyaData.length > 0) {
                const now = clock.getElapsedTime();
                const colAttr = diyaPointsMesh.geometry.attributes.color;
                const baseColor = new THREE.Color(COLOR_SCHEMES[params.scheme].diyaColor);

                for (let i = 0; i < diyaData.length; i++) {
                    const d = diyaData[i];
                    const flicker = (0.75 + Math.sin(now * d.speed + d.phase) * 0.25) * 2.0;
                    colAttr.setXYZ(i, baseColor.r * flicker, baseColor.g * flicker, baseColor.b * flicker);
                }
                colAttr.needsUpdate = true;
            }

            updateFireworksEngine(dt);
            updateCameraMotion(dt);

            // Render through PostProcessor pipeline
            postProcessor.renderScene(scene, camera);
        }

        animate();
    </script>
