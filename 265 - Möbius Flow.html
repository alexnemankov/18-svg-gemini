<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Möbius Flow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: hsla(0, 0%, 15%, 1);
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    canvas#canv {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      box-shadow: none;
      touch-action: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canv"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone usage)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.75,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.03,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.4,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens & Cinematic Effects");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    // =========================================================================================
    // COLOR SCHEMES & ANIMATION PRESETS
    // =========================================================================================
    const COLOR_SCHEMES = {
      'Original Classic': {
        bg: '#262626',
        stroke: '#e6e6e6',
        strokeAlpha: 0.6,
        lineWidth: 1.0
      },
      'Black & White': {
        bg: '#000000',
        stroke: '#ffffff',
        strokeAlpha: 0.85,
        lineWidth: 1.2
      },
      'White & Black': {
        bg: '#ffffff',
        stroke: '#000000',
        strokeAlpha: 0.75,
        lineWidth: 1.0
      },
      'Cyberpunk Neon': {
        bg: '#0a0614',
        stroke: '#00f5ff',
        strokeAlpha: 0.75,
        lineWidth: 1.2
      },
      'Solar Flare': {
        bg: '#140b05',
        stroke: '#ffb32b',
        strokeAlpha: 0.8,
        lineWidth: 1.1
      },
      'Emerald Aurora': {
        bg: '#04130c',
        stroke: '#32ffa0',
        strokeAlpha: 0.75,
        lineWidth: 1.1
      },
      'Cosmic Indigo': {
        bg: '#0b091a',
        stroke: '#a878ff',
        strokeAlpha: 0.8,
        lineWidth: 1.2
      },
      'Crimson Abyss': {
        bg: '#160507',
        stroke: '#ff374b',
        strokeAlpha: 0.8,
        lineWidth: 1.2
      }
    };

    const ANIMATIONS = {
      'Static (Classic)': 'static',
      'Harmonic Drift': 'harmonic_drift',
      'Breathing Infinity': 'breathing_infinity',
      'Orbital Precession': 'orbital_precession',
      'Hypnotic Pulse': 'hypnotic_pulse',
      'Lissajous Wave': 'lissajous_wave',
      'Cosmic Vortex': 'cosmic_vortex',
      'Quantum Undulation': 'quantum_undulation'
    };

    // Application Parameters
    const params = {
      // Themes & Colors
      colorScheme: 'Original Classic',
      greenscreen: false,
      bgColor: COLOR_SCHEMES['Original Classic'].bg,
      strokeColor: COLOR_SCHEMES['Original Classic'].stroke,
      strokeAlpha: COLOR_SCHEMES['Original Classic'].strokeAlpha,
      lineWidth: COLOR_SCHEMES['Original Classic'].lineWidth,
      fade: 0.02,

      // Animations & Motion
      animationMode: 'Static (Classic)',
      speed: 1.0,
      baseYu: Math.PI / 1.223,
      baseR: 1 / 5,
      baseTheta: Math.PI / 2,

      // Particles
      num: 4200,
      life: 20,
      cv: 150,

      // View & Camera (Zoom & Pan)
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      zoom: 1.0,
      panX: 0,
      panY: 0,

      // Interactive Randomization
      clickToRandomize: true,

      // Actions
      randomize: () => triggerRandomize(),
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      },
      reseedParticles: () => initParticles()
    };

    // =========================================================================================
    // CANVAS & THREE.JS RENDERER / POSTPROCESSOR SETUP
    // =========================================================================================
    const visibleCanvas = document.getElementById('canv');
    const container = document.getElementById('canvas-container');

    const renderer = new THREE.WebGLRenderer({
      canvas: visibleCanvas,
      antialias: false,
      powerPreference: 'high-performance'
    });

    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      bloomEnabled: true,
      bloomStrength: 0.8,
      bloomRadius: 0.5,
      bloomThreshold: 0.18,
      chromaticAberration: 0.025,
      vignetteBoost: 1.0,
      vignetteReduction: 0.4,
      noiseIntensity: 0.015
    });

    // 2D Offscreen Canvas for Möbius particle simulation
    const offscreenCanvas = document.createElement('canvas');
    const ctx = offscreenCanvas.getContext('2d');
    const canvasTexture = new THREE.CanvasTexture(offscreenCanvas);
    canvasTexture.minFilter = THREE.LinearFilter;
    canvasTexture.magFilter = THREE.LinearFilter;
    canvasTexture.generateMipmaps = false;

    let cssW = window.innerWidth;
    let cssH = window.innerHeight;
    let particles = [];
    let time = 0;

    // Helper: Hex Color to RGB Object
    function hexToRgb(hex) {
      if (!hex) return { r: 230, g: 230, b: 230 };
      let clean = hex.replace('#', '');
      if (clean.length === 3) {
        clean = clean.split('').map(x => x + x).join('');
      }
      const val = parseInt(clean, 16);
      if (isNaN(val)) return { r: 230, g: 230, b: 230 };
      return {
        r: (val >> 16) & 255,
        g: (val >> 8) & 255,
        b: val & 255
      };
    }

    // Mathematical Transformations
    function rot(yu, loc) {
      return function(x, y, t) {
        const cos = Math.cos(yu);
        const sin = Math.sin(yu);
        return loc(x * cos - y * sin, x * sin + y * cos, t);
      };
    }

    function möb(loc) {
      return function(x, y, t) {
        let _r = (x - 1) * (x - 1) + y * y;
        if (_r < 1e-6) _r = 1e-6;
        const _x = (1 - x * x - y * y) / _r;
        const _y = 2 * y / _r;
        const v = loc(_x, _y, t);
        const vx = v[0];
        const vy = v[1];
        let d = Math.pow((_x + 1) * (_x + 1) + _y * _y, 2) / 4;
        if (d < 1e-6) d = 1e-6;
        const a = 2 * (_y * _y - (_x + 1) * (_x + 1));
        const b = 4 * (_x + 1) * _y;
        return [(a * vx - b * vy) / d, (b * vx + a * vy) / d];
      };
    }

    function accl(loc) {
      return function(px, py, t) {
        const calc = (Math.min(cssW, cssH) / 4) * params.zoom;
        const x = (px - (cssW / 2 + params.panX)) / calc;
        const y = (py - (cssH / 2 + params.panY)) / calc;
        const v = loc(x, y, t);
        return [v[0] * params.zoom, v[1] * params.zoom];
      };
    }

    function dbl(r, theta) {
      const lr = Math.log(Math.max(r, 1e-5));
      return function(x, y, t) {
        return [x * lr - y * theta, x * theta + y * lr];
      };
    }

    function getAnimationParams(mode, t) {
      const baseYu = params.baseYu;
      const baseR = params.baseR;
      const baseTheta = params.baseTheta;

      switch (mode) {
        case 'Harmonic Drift':
          return {
            yu: baseYu + 0.18 * Math.sin(t * 0.25),
            r: Math.max(0.02, baseR + 0.04 * Math.cos(t * 0.2)),
            theta: baseTheta + 0.12 * Math.sin(t * 0.15)
          };
        case 'Breathing Infinity':
          return {
            yu: baseYu + 0.08 * Math.sin(t * 0.18),
            r: Math.max(0.02, baseR * (1 + 0.35 * Math.sin(t * 0.3))),
            theta: baseTheta + 0.3 * Math.cos(t * 0.22)
          };
        case 'Orbital Precession':
          return {
            yu: baseYu + t * 0.07,
            r: Math.max(0.02, baseR + 0.02 * Math.sin(t * 0.1)),
            theta: baseTheta
          };
        case 'Hypnotic Pulse':
          return {
            yu: baseYu + 0.22 * Math.cos(t * 0.35),
            r: Math.max(0.02, baseR + 0.07 * Math.sin(t * 0.4)),
            theta: baseTheta + 0.25 * Math.sin(t * 0.3)
          };
        case 'Lissajous Wave':
          return {
            yu: baseYu + 0.2 * Math.sin(t * 0.22),
            r: Math.max(0.02, baseR + 0.05 * Math.sin(t * 0.33 + 1.2)),
            theta: baseTheta + 0.25 * Math.cos(t * 0.28)
          };
        case 'Cosmic Vortex':
          return {
            yu: baseYu + t * 0.04 + 0.1 * Math.sin(t * 0.2),
            r: Math.max(0.02, baseR * (1 + 0.25 * Math.cos(t * 0.15))),
            theta: baseTheta + 0.15 * Math.sin(t * 0.25)
          };
        case 'Quantum Undulation':
          return {
            yu: baseYu + 0.12 * Math.sin(t * 0.14) + 0.06 * Math.cos(t * 0.31),
            r: Math.max(0.02, baseR + 0.035 * Math.sin(t * 0.27) + 0.02 * Math.cos(t * 0.45)),
            theta: baseTheta + 0.18 * Math.sin(t * 0.19) + 0.08 * Math.cos(t * 0.38)
          };
        case 'Static (Classic)':
        default:
          return {
            yu: baseYu,
            r: baseR,
            theta: baseTheta
          };
      }
    }

    function initParticles() {
      particles = [];
      const cv = params.cv;
      for (let i = 0; i < params.num; i++) {
        particles.push([
          Math.round(Math.random() * (cssW + 2 * cv)) - cv,
          Math.round(Math.random() * (cssH + 2 * cv)) - cv,
          Math.round(Math.random() * params.life) + 1
        ]);
      }
    }

    function updateColors() {
      const effectiveBg = params.greenscreen ? '#00ff00' : params.bgColor;
      document.body.style.backgroundColor = effectiveBg;
      visibleCanvas.style.backgroundColor = effectiveBg;
    }

    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      params.colorScheme = name;
      params.bgColor = scheme.bg;
      params.strokeColor = scheme.stroke;
      params.strokeAlpha = scheme.strokeAlpha;
      params.lineWidth = scheme.lineWidth;
      params.greenscreen = false;

      updateColors();
      const rgb = hexToRgb(params.bgColor);
      ctx.fillStyle = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
      ctx.fillRect(0, 0, cssW, cssH);

      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    function triggerRandomize() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      const scheme = COLOR_SCHEMES[randomSchemeKey];

      params.colorScheme = randomSchemeKey;
      params.bgColor = scheme.bg;
      params.strokeColor = scheme.stroke;
      params.strokeAlpha = +(0.5 + Math.random() * 0.45).toFixed(2);
      params.lineWidth = +(0.8 + Math.random() * 1.5).toFixed(1);
      params.fade = +(0.015 + Math.random() * 0.035).toFixed(3);
      params.greenscreen = false;

      const animKeys = Object.keys(ANIMATIONS);
      params.animationMode = animKeys[Math.floor(Math.random() * animKeys.length)];
      params.speed = +(0.6 + Math.random() * 1.2).toFixed(2);

      params.baseYu = +(Math.random() * Math.PI * 2).toFixed(3);
      params.baseR = +(0.08 + Math.random() * 0.35).toFixed(3);
      params.baseTheta = +(0.5 + Math.random() * 2.5).toFixed(3);

      params.num = Math.round(2500 + Math.random() * 3500);
      params.life = Math.round(12 + Math.random() * 25);

      // Randomize subtle post-processing attributes
      if (postProcessor) {
        postProcessor.settings.bloomStrength = +(0.4 + Math.random() * 0.8).toFixed(2);
        postProcessor.settings.bloomRadius = +(0.3 + Math.random() * 0.5).toFixed(2);
        postProcessor.settings.bloomThreshold = +(0.1 + Math.random() * 0.2).toFixed(2);
        postProcessor.settings.chromaticAberration = +(0.01 + Math.random() * 0.04).toFixed(3);
        postProcessor.updateSettings();
      }

      initParticles();
      updateColors();

      const rgb = hexToRgb(params.bgColor);
      ctx.fillStyle = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
      ctx.fillRect(0, 0, cssW, cssH);

      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    function resize() {
      cssW = window.innerWidth;
      cssH = window.innerHeight;

      visibleCanvas.style.width = cssW + 'px';
      visibleCanvas.style.height = cssH + 'px';

      const renderW = Math.round(cssW * params.dpr);
      const renderH = Math.round(cssH * params.dpr);

      offscreenCanvas.width = renderW;
      offscreenCanvas.height = renderH;
      ctx.setTransform(params.dpr, 0, 0, params.dpr, 0, 0);

      renderer.setSize(cssW, cssH, false);
      renderer.setPixelRatio(params.dpr);
      postProcessor.setSize(cssW, cssH, params.dpr);

      updateColors();
      const rgb = params.greenscreen ? { r: 0, g: 255, b: 0 } : hexToRgb(params.bgColor);
      ctx.fillStyle = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
      ctx.fillRect(0, 0, cssW, cssH);
    }

    function draw() {
      // Fading background trail
      const rgb = params.greenscreen ? { r: 0, g: 255, b: 0 } : hexToRgb(params.bgColor);
      ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${params.fade})`;
      ctx.fillRect(0, 0, cssW, cssH);

      // Dynamic parameters calculation
      const currentT = time * 0.05;
      const anim = getAnimationParams(params.animationMode, currentT);
      const vel = accl(rot(anim.yu, möb(dbl(anim.r, anim.theta))));

      // Style particles
      const strokeRgb = hexToRgb(params.strokeColor);
      ctx.strokeStyle = `rgba(${strokeRgb.r}, ${strokeRgb.g}, ${strokeRgb.b}, ${params.strokeAlpha})`;
      ctx.lineWidth = params.lineWidth;
      ctx.lineCap = 'round';

      const cv = params.cv;

      ctx.beginPath();
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p[2] <= 0) {
          p[0] = Math.round(Math.random() * (cssW + 2 * cv)) - cv;
          p[1] = Math.round(Math.random() * (cssH + 2 * cv)) - cv;
          p[2] = params.life;
        }

        const v = vel(p[0], p[1], currentT);
        const nx = p[0] + v[0];
        const ny = p[1] + v[1];

        if (nx >= -cv && nx <= cssW + cv && ny >= -cv && ny <= cssH + cv) {
          ctx.moveTo(p[0], p[1]);
          ctx.lineTo(nx, ny);
          p[0] = nx;
          p[1] = ny;
        } else {
          p[0] = Math.round(Math.random() * (cssW + 2 * cv)) - cv;
          p[1] = Math.round(Math.random() * (cssH + 2 * cv)) - cv;
          p[2] = params.life;
        }
        p[2]--;
      }
      ctx.stroke();
    }

    // Main Render Loop with Post-Processing
    let lastTime = 0;
    function animate(now) {
      requestAnimationFrame(animate);
      if (!lastTime) lastTime = now;
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      time += dt * params.speed;

      // Draw particle flow simulation to offscreen canvas
      draw();

      // Send offscreen canvas texture to PostProcessor WebGL pipeline
      canvasTexture.needsUpdate = true;
      postProcessor.render(canvasTexture);
    }

    // Event Listeners: Zoom with Mouse Wheel
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      params.zoom = Math.min(Math.max(params.zoom * zoomFactor, 0.2), 8.0);
      gui.controllersRecursive().forEach(ctrl => {
        if (ctrl.property === 'zoom') ctrl.updateDisplay();
      });
    }, { passive: false });

    // Event Listeners: Drag & Click on Scene
    let isDragging = false;
    let startX = 0, startY = 0;
    let dragDistance = 0;

    container.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      dragDistance = 0;
      container.setPointerCapture(e.pointerId);
    });

    container.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX;
      startY = e.clientY;
      dragDistance += Math.hypot(dx, dy);

      params.panX += dx;
      params.panY += dy;

      if (particles) {
        for (let i = 0; i < particles.length; i++) {
          particles[i][0] += dx;
          particles[i][1] += dy;
        }
      }

      gui.controllersRecursive().forEach(ctrl => {
        if (ctrl.property === 'panX' || ctrl.property === 'panY') ctrl.updateDisplay();
      });
    });

    container.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      try {
        container.releasePointerCapture(e.pointerId);
      } catch (err) {}

      if (dragDistance < 6) {
        if (params.clickToRandomize) {
          triggerRandomize();
        }
      }
    });

    container.addEventListener('pointercancel', () => {
      isDragging = false;
    });

    // Window Resize
    window.addEventListener('resize', resize, false);

    // Toggle UI with 'H' Key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Initialize System
    resize();
    initParticles();
    animate(0);

    // Setup GUI (lil-gui)
    const gui = new GUI({ title: 'Möbius Controls' });

    // Presets & Themes Folder
    const fTheme = gui.addFolder('Theme & Colors');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
    fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
      updateColors();
      const rgb = params.greenscreen ? { r: 0, g: 255, b: 0 } : hexToRgb(params.bgColor);
      ctx.fillStyle = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
      ctx.fillRect(0, 0, cssW, cssH);
    });
    fTheme.addColor(params, 'strokeColor').name('Particle Color');
    fTheme.add(params, 'strokeAlpha', 0.05, 1.0, 0.01).name('Opacity');
    fTheme.addColor(params, 'bgColor').name('Background Color').onChange(() => {
      if (!params.greenscreen) updateColors();
    });
    fTheme.add(params, 'lineWidth', 0.5, 5.0, 0.1).name('Line Width');
    fTheme.add(params, 'fade', 0.005, 0.1, 0.005).name('Trail Fade');

    // Post-Processing Suite Integration (PostProcessor.js)
    postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');

    // Motion & Animations Folder
    const fMotion = gui.addFolder('Motion & Animation');
    fMotion.add(params, 'animationMode', Object.keys(ANIMATIONS)).name('Animation');
    fMotion.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
    fMotion.add(params, 'baseYu', 0, Math.PI * 2, 0.01).name('Rotation (yu)');
    fMotion.add(params, 'baseR', 0.01, 1.0, 0.01).name('Ratio (r)');
    fMotion.add(params, 'baseTheta', 0, Math.PI * 2, 0.01).name('Angle (theta)');

    // Particles Folder
    const fParticles = gui.addFolder('Particles');
    fParticles.add(params, 'num', 500, 8000, 100).name('Count').onChange(initParticles);
    fParticles.add(params, 'life', 5, 60, 1).name('Life');
    fParticles.add(params, 'reseedParticles').name('Re-seed Particles');

    // View & Camera Folder
    const fView = gui.addFolder('View & Quality');
    fView.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(resize);
    fView.add(params, 'zoom', 0.2, 8.0, 0.05).name('Zoom');
    fView.add(params, 'panX', -1000, 1000, 1).name('Pan X');
    fView.add(params, 'panY', -1000, 1000, 1).name('Pan Y');
    fView.add(params, 'resetView').name('Reset View');

    // Procedural Interaction Folder
    const fProcedural = gui.addFolder('Procedural Interaction');
    fProcedural.add(params, 'clickToRandomize').name('Click Scene to Reroll');
    fProcedural.add(params, 'randomize').name('Generate Random Theme');
  </script>
</body>
</html>
