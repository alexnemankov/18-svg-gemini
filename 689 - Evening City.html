<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8a267">
  <link rel="icon" href="data:,">
  <meta name="description" content="A living watercolor of a city at sunset. Procedural pigment, paper, and light, in a seamless 32-second loop.">
  <title>Evening, Still Wet</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #e8a267; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas aria-label="A hand-painted city at sunset, with golden light slowly breathing above layers of ochre and turquoise buildings" role="img"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const settings = {
      scheme: 'Original', baseColor: '#e89437', accent: '#e53935',
      background: '#e8a267', customBackground: false, greenscreen: false,
      customPalette: false, invert: false, saturation: 1, hue: 0,
      tint: '#ffffff', tintAmount: 0,
      color1: '#183d40', color2: '#657773', color3: '#95563b',
      color4: '#d08a42', color5: '#f6b551', color6: '#fff9d1',
      animation: 'Living watercolor', animate: true, speed: 1, motionAmount: 1,
      orbitAngle: 0, diffusion: 1, glow: 1, grain: 1,
      gazeRange: 1, windStrength: 1, sunTravel: 1, rainIntensity: 1, mistDensity: 1,
      zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0,
      seed: 0, density: 1, buildingHeight: 1, towerSpread: 1, sunSize: 1, sunX: 0,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      respectReducedMotion: true, clickVariation: true,
      newVariation: () => randomize(), resetView: () => resetView()
    };
    const animationNames = [
      'Living watercolor', 'Breathing light', 'Drifting haze', 'Slow orbit',
      'Gentle push', 'Rooftop glide', 'Floating study', 'Wandering gaze',
      'Wind wash', 'Drifting sun', 'Passing rain', 'Evening mist', 'Static'
    ];
    const movingAnimations = animationNames.filter(name => name !== 'Static');
    // Achromatic presets each offer both polarities through the Invert control.
    // That retains all requested variants within exactly nineteen schemes.
    const schemeNames = [
      'Original', 'Monochromatic', 'Analogous', 'Complementary',
      'Split-complementary', 'Triadic', 'Tetradic', 'Double split-complementary',
      'Achromatic', 'Achromatic + Accent', 'Neutral + Accent',
      'Amber & Ember', 'Lagoon', 'Orchid', 'Saffron & Teal',
      'Chartreuse', 'Orange & Plum', 'Lavender Nocturne', 'Cyan & Magenta'
    ];
    const fixedPalettes = {
      'Amber & Ember': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
      'Lagoon': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
      'Orchid': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
      'Saffron & Teal': ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
      'Chartreuse': ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
      'Orange & Plum': ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
      'Lavender Nocturne': ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
      'Cyan & Magenta': ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']
    };

    const rawColor = hex => {
      const value = parseInt(hex.replace('#', ''), 16);
      return new THREE.Vector3((value >> 16 & 255) / 255, (value >> 8 & 255) / 255, (value & 255) / 255);
    };
    function hslHex(h, s, l) {
      return '#' + new THREE.Color().setHSL(((h % 1) + 1) % 1, s, l, THREE.LinearSRGBColorSpace).getHexString(THREE.LinearSRGBColorSpace);
    }
    function baseHue() {
      const rgb = rawColor(settings.baseColor);
      return new THREE.Color(rgb.x, rgb.y, rgb.z).getHSL({}, THREE.LinearSRGBColorSpace).h;
    }

    const canvas = document.querySelector('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const scene = new THREE.Scene();
    const geometry = new THREE.PlaneGeometry(2, 2);
    const vertexShader = /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;
    const noise = /* glsl */`
      uniform float uSeed;
      float hash(vec2 p) {
        p += vec2(mod(uSeed, 997.0) * .731, floor(uSeed / 997.0) * 1.173);
        vec3 p3 = fract(vec3(p.xyx) * .1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }
      float n2(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
                   mix(hash(i + vec2(0, 1)), hash(i + vec2(1)), f.x), f.y);
      }
      float fbm(vec2 p) {
        float n = .54 * n2(p);
        p = mat2(1.6, -1.2, 1.2, 1.6) * p + 7.1;
        n += .27 * n2(p);
        p = mat2(1.6, -1.2, 1.2, 1.6) * p + 7.1;
        n += .135 * n2(p);
        n += .0675 * n2(p * 2.03 + 9.2);
        return n;
      }
      float box(vec2 p, vec2 b) {
        vec2 d = abs(p) - b;
        return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
      }
    `;

    // Cache the city until its geometry changes. The second pass animates light,
    // weather, and pigment; paper fibers remain stationary above those washes.
    const painting = new THREE.ShaderMaterial({
      vertexShader,
      uniforms: {
        uAspect: { value: 1 }, uHorizon: { value: .7 }, uSeed: { value: 0 },
        uDensity: { value: 1 }, uBuildingHeight: { value: 1 },
        uTowerSpread: { value: 1 }, uSunSize: { value: 1 }, uSunX: { value: 0 },
        uSunEnabled: { value: 1 }
      },
      fragmentShader: /* glsl */`
        precision highp float;
        varying vec2 vUv;
        uniform float uAspect, uHorizon;
        uniform float uDensity, uBuildingHeight, uTowerSpread, uSunSize, uSunX;
        uniform float uSunEnabled;
        ${noise}

        vec2 warp;
        float pigment, mottle, coverage;

        vec3 building(vec3 under, vec2 p, vec2 origin, vec2 size, float seed, float depth) {
          size.y *= uBuildingHeight;
          vec2 q = p - origin;
          q.x += (q.y / size.y) * (hash(vec2(seed, 1)) - .5) * .009;
          q += warp * mix(.65, 1.1, depth);
          float bristle = (n2(p * vec2(310.0, 175.0) + seed) - .5) * .0023;
          float d = box(q - vec2(0, size.y * .5), size * .5) + bristle;
          float soft = mix(.006, .0024, depth);
          float body = 1.0 - smoothstep(-soft, soft, d);
          float bleed = (1.0 - smoothstep(-.002, .012, d)) * .14;
          coverage = max(coverage, clamp(body + bleed, 0.0, 1.0));
          if (body + bleed < .001) return under;

          float rnd = hash(vec2(seed, 8.4));
          vec3 warm = mix(vec3(.63, .32, .21), vec3(.66, .48, .27), rnd);
          vec3 cool = mix(vec3(.16, .31, .31), vec3(.40, .45, .39), rnd);
          float cold = (1.0 - smoothstep(.04, .48, p.y)) * (.45 + depth * .55);
          vec3 ink = mix(warm, cool, cold);
          ink = mix(ink, vec3(.66, .35, .30), (1.0 - depth) * .27);
          ink *= .83 + .30 * rnd;

          // A broad pale facade, a darker return, and irregular vertical brush loads.
          float face = q.x / size.x + .5;
          float side = smoothstep(.66, .70, face);
          float brush = n2(vec2(q.x * 130.0 + seed * 5.0, q.y * 3.5));
          ink *= .84 + brush * .32;
          ink *= 1.0 - side * (.12 + depth * .16);
          ink += vec3(.075, .055, .025) * (1.0 - side) * depth;
          ink += (pigment - .5) * vec3(.13, .12, .10);
          ink += (mottle - .5) * .055;
          float rim = exp(-abs(d + .001) / .0027);
          ink *= 1.0 - rim * (.09 + .09 * depth);

          // Broken, loosely dabbed window marks, with omissions and uneven spacing.
          vec2 grid = vec2(mix(.019, .038, depth), mix(.024, .047, depth));
          vec2 wp = q + vec2(seed * .17, .004);
          vec2 cell = floor(wp / grid);
          vec2 local = fract(wp / grid) - .5;
          float wr = hash(cell + seed);
          local += vec2(n2(cell + seed), n2(cell + seed + 12.0)) * .16 - .08;
          float wd = length(local / vec2(.15 + wr * .07, .24)) - 1.0;
          wd += (n2(p * 330.0 + seed) - .5) * .65;
          float windows = (1.0 - smoothstep(-.17, .18, wd))
                        * step(.30, wr) * smoothstep(.05, .12, q.y / size.y)
                        * (1.0 - smoothstep(.88, .96, q.y / size.y));
          windows *= mix(.12, .66, depth) * smoothstep(.03, .10, size.x);
          ink = mix(ink, ink * vec3(.35, .43, .43), windows);

          float opacity = mix(.42, .84, depth) * (.89 + pigment * .16);
          vec3 result = mix(under, ink, clamp(body * opacity + bleed, 0.0, .94));

          // Exposed paper along occasional roof edges, never a precise outline.
          float roof = 1.0 - smoothstep(.001, .0042, abs(q.y - size.y + bristle));
          roof *= (1.0 - smoothstep(.20, .52, abs(q.x / size.x))) * step(.42, rnd);
          roof *= smoothstep(.31, .66, n2(p * vec2(190, 410) + seed));
          vec3 light = mix(vec3(.99, .77, .43), vec3(.85, .84, .68), cold);
          return mix(result, light, roof * .64 * depth);
        }

        void main() {
          coverage = 0.0;
          vec2 p = vec2((vUv.x - .5) * uAspect, vUv.y);
          pigment = fbm(p * vec2(56, 68));
          mottle = n2(p * vec2(250, 310));
          warp = vec2(fbm(p * vec2(43, 19)), fbm(p * vec2(29, 51)));
          warp = (warp - .5) * .010 + (vec2(mottle, pigment) - .5) * .002;
          vec2 sun = vec2((.015 + uSunX) * uAspect, uHorizon + .026);
          float glow = exp(-length((p - sun) * vec2(.90, 1.28)) * 7.0);
          float wash = fbm(p * vec2(4, 8));
          vec3 col = mix(vec3(.97, .58, .29), vec3(.94, .72, .53), smoothstep(uHorizon, 1.12, p.y));
          col += (wash - .5) * vec3(.18, .12, .085);
          col += (pigment - .5) * vec3(.10, .10, .08);
          // Broad horizontal washes with uneven, feathered edges.
          float cloud = fbm(p * vec2(3.0, 33.0) + vec2(3.0, 9.0));
          float band = exp(-pow((p.y - uHorizon - .060) / .095, 2.0));
          col = mix(col, vec3(.72, .35, .28), smoothstep(.43, .69, cloud) * band * .38);
          col = mix(col, vec3(1.0, .80, .25), glow * .87 * uSunEnabled);
          float aureole = exp(-dot((p - sun) * vec2(.85, 1.25), (p - sun) * vec2(.85, 1.25)) / .020);
          col = mix(col, vec3(1.0, .92, .39), aureole * .88 * uSunEnabled);
          vec2 sp = (p - sun + warp * .55) / uSunSize;
          float disc = 1.0 - smoothstep(.042, .054, length(sp * vec2(1.0, 1.13)) + (fbm(p * 95.0) - .5) * .024);
          disc *= uSunEnabled;
          float veils = smoothstep(.38, .72, fbm(p * vec2(20, 160) + 40.0));
          col = mix(col, vec3(1.0, .985, .80), disc * (.80 + .20 * veils));

          // A nonlinear horizontal coordinate packs smaller roofs into the distance.
          vec2 city = p;
          city.x = sign(p.x) * (abs(p.x) + .10 * (1.0 - exp(-abs(p.x) * 10.0)));
          // Thirteen overlapping rows open toward a central, light-filled valley.
          for (int i = 0; i < 13; i++) {
            float row = float(i), depth = row / 12.0;
            float spacing = mix(.044, .106, depth) / uDensity;
            float shifted = city.x + row * .1327;
            float id = floor(shifted / spacing);
            float seed = row * 73.7 + id * 3.17 + 18.0;
            float rnd = hash(vec2(id, row + 5.0));
            float cx = (id + .5) * spacing - row * .1327;
            float base = uHorizon - .145 - depth * (uHorizon + .025);
            base += (hash(vec2(id + 31.0, row)) - .5) * .045;
            float height = .075 + rnd * .125 + depth * (.08 + rnd * .085);
            // More height on the flanks, lower rooftops down the central avenue.
            height += smoothstep(.04, .44, abs(cx) / max(uAspect, .6)) * .052;
            height -= exp(-abs(cx) * 12.0) * .070 * (.2 + depth);
            float width = spacing * (.66 + hash(vec2(id + 9.0, row)) * .36);
            col = building(col, city, vec2(cx, base), vec2(width, height), seed, depth * .84);
          }

          // Small, low blocks recede along the sunlit central corridor. Their
          // overlapping roofs break up the vertical strokes of the skyline.
          for (int i = 0; i < 10; i++) {
            float row = float(i), depth = row / 9.0;
            float spacing = (.026 + depth * .043) / uDensity;
            float shift = row * .079;
            float id = floor((p.x + shift) / spacing);
            float r = hash(vec2(id + 80.0, row + 17.0));
            float cx = (id + .5) * spacing - shift;
            float base = uHorizon - .22 - depth * (uHorizon - .40);
            base += (r - .5) * .026;
            float height = .024 + r * .041 + depth * .032;
            float corridor = mix(.045, .26 * max(uAspect, .8), depth);
            float cover = 1.0 - smoothstep(corridor, corridor + .035, abs(p.x));
            float previousCoverage = coverage;
            vec3 roofs = building(col, p, vec2(cx, base), vec2(spacing * (.76 + .25 * r), height), 510.0 + id * 9.1 + row * 53.7, .52 + depth * .30);
            coverage = mix(previousCoverage, coverage, cover);
            col = mix(col, roofs, cover);
          }

          // Two tall, deliberately asymmetric apartment blocks frame the distance.
          float left = -uAspect * .355 * uTowerSpread;
          float right = uAspect * .374 * uTowerSpread;
          float towerWidth = clamp(uAspect * .18, .105, .23);
          col = building(col, p, vec2(left - towerWidth * .45, .115), vec2(towerWidth * .26, .408), 137.1, .91);
          col = building(col, p, vec2(left, .10), vec2(towerWidth, .468), 74.3, .96);
          col = building(col, p, vec2(left + towerWidth * .45, .11), vec2(towerWidth * .29, .399), 49.2, .94);
          col = building(col, p, vec2(right, .13), vec2(towerWidth * 1.13, .417), 17.8, .91);
          col = building(col, p, vec2(right - towerWidth * .44, .13), vec2(towerWidth * .18, .438), 34.4, .93);

          // Closer roofs interrupt the towers' bases and dissolve into cool pigment.
          for (int i = 0; i < 5; i++) {
            float row = float(i);
            float spacing = (.083 + row * .028) / uDensity;
            float offset = row * .071;
            float id = floor((p.x + offset) / spacing);
            float r = hash(vec2(id, row + 61.0));
            float cx = (id + .5) * spacing - offset;
            float base = .035 - row * .048;
            float height = .083 + r * .12 + (4.0 - row) * .018;
            col = building(col, p, vec2(cx, base), vec2(spacing * (.70 + r * .25), height), 270.0 + id * 8.7 + row * 97.0, 1.0);
          }

          // Little untouched horizontal flecks of paper between the buildings.
          vec2 hp = p + warp * .4;
          vec2 grid = vec2(.039, .027);
          vec2 hi = floor(hp / grid);
          vec2 hf = fract(hp / grid) - .5;
          float hr = hash(hi + 133.7);
          hf -= vec2(hash(hi + 82.0), hash(hi + 25.0)) * .36 - .18;
          float mark = 1.0 - smoothstep(.75, 1.2, length(hf / vec2(.16 + hr * .16, .043)));
          mark *= step(.81, hr) * smoothstep(.03, .17, p.y) * (1.0 - smoothstep(uHorizon - .16, uHorizon - .09, p.y));
          mark *= .65 + .35 * pigment;
          col = mix(col, vec3(1.0, .94, .76), mark * .82);

          // Warm light stains the distance; blue granules collect toward the foot.
          float air = exp(-abs(p.x - sun.x) * 3.7) * exp(-pow((p.y - (uHorizon - .15)) / .26, 2.0));
          col = mix(col, vec3(1.0, .65, .25), air * .24 * uSunEnabled);
          float transmitted = exp(-pow((p.x - sun.x) / .11, 2.0))
                            * exp(-pow((p.y - uHorizon + .085) / .13, 2.0));
          col = mix(col, vec3(1.0, .78, .32), transmitted * .23 * uSunEnabled);
          col += (pigment - .5) * .033;
          // Keep a real silhouette mask, independent of the colors. The sky can
          // then be replaced with an exact chroma key without recoloring the city.
          gl_FragColor = vec4(clamp(col, .0, 1.0), max(coverage, disc));
        }
      `
    });

    const livingPaint = new THREE.ShaderMaterial({
      vertexShader,
      uniforms: {
        uPainting: { value: null },
        uAspect: { value: 1 }, uHorizon: { value: .7 }, uPhase: { value: 0 },
        uSeed: { value: 0 }, uSunX: { value: 0 },
        uPan: { value: new THREE.Vector2() }, uZoom: { value: 1 },
        uInverseRotation: { value: new THREE.Matrix3() },
        uDiffusion: { value: 1 }, uGlow: { value: 1 }, uGrain: { value: 1 },
        uHaze: { value: 1 }, uBreath: { value: 1 },
        uWind: { value: 0 }, uRain: { value: 0 }, uMist: { value: 0 },
        uMovingSun: { value: false }, uSunTravel: { value: 1 }, uSunSize: { value: 1 },
        uPalette: { value: Array.from({ length: 6 }, () => new THREE.Vector3()) },
        uPaletteCount: { value: 6 },
        uPaletteMode: { value: 0 }, uInvert: { value: false },
        uAccent: { value: rawColor(settings.accent) }, uSaturation: { value: 1 },
        uHue: { value: 0 }, uTint: { value: rawColor(settings.tint) }, uTintAmount: { value: 0 },
        uBackground: { value: rawColor(settings.background) },
        uCustomBackground: { value: false }, uGreenscreen: { value: false }
      },
      fragmentShader: /* glsl */`
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uPainting;
        uniform float uAspect, uHorizon, uPhase;
        uniform float uSunX, uZoom, uDiffusion, uGlow, uGrain, uHaze, uBreath;
        uniform float uWind, uRain, uMist, uSunTravel, uSunSize;
        uniform bool uMovingSun;
        uniform vec2 uPan;
        uniform mat3 uInverseRotation;
        uniform vec3 uPalette[6], uAccent, uBackground, uTint;
        uniform float uPaletteMode, uPaletteCount, uSaturation, uHue, uTintAmount;
        uniform bool uInvert, uCustomBackground, uGreenscreen;
        ${noise}
        vec3 palette(float t) {
          float x = clamp(t, 0.0, 1.0) * (uPaletteCount - 1.0);
          vec3 c = mix(uPalette[0], uPalette[1], clamp(x, 0.0, 1.0));
          c = mix(c, uPalette[2], clamp(x - 1.0, 0.0, 1.0));
          c = mix(c, uPalette[3], clamp(x - 2.0, 0.0, 1.0));
          c = mix(c, uPalette[4], clamp(x - 3.0, 0.0, 1.0));
          return mix(c, uPalette[5], clamp(x - 4.0, 0.0, 1.0));
        }
        vec3 grade(vec3 source, vec2 p) {
          float luma = dot(source, vec3(.299, .587, .114));
          float t = clamp((luma - .06) / .91, 0.0, 1.0);
          vec3 col = source;
          if (uPaletteMode > .5 && uPaletteMode < 1.5) col = palette(t);
          if (uPaletteMode > 1.5) {
            float tone = uInvert ? 1.0 - t : t;
            col = vec3(tone);
            float warm = smoothstep(.045, .20, source.r - source.b);
            float accent = warm * smoothstep(.25, .42, t) * (1.0 - smoothstep(.56, .74, t));
            accent *= smoothstep(.53, .66, fbm(p * vec2(14.0, 19.0) + 7.0));
            if (uPaletteMode > 2.5 && uPaletteMode < 3.5) {
              col = mix(col, uAccent * (.45 + .65 * t), accent * .88);
            }
            if (uPaletteMode > 3.5) {
              col = mix(vec3(.075, .085, .095), vec3(.94, .91, .85), tone);
              col = mix(col, uAccent * (.5 + .65 * t), accent * .9);
            }
          }
          if (uInvert && uPaletteMode < 1.5) col = 1.0 - col;
          float gray = dot(col, vec3(.299, .587, .114));
          col = mix(vec3(gray), col, uSaturation);
          // Rotate hues around the neutral axis, leaving grayscale neutral.
          vec3 axis = vec3(.577350269);
          col = col * cos(uHue) + cross(axis, col) * sin(uHue)
              + axis * dot(axis, col) * (1.0 - cos(uHue));
          col = mix(col, col * uTint * 1.5, uTintAmount);
          return clamp(col, 0.0, 1.0);
        }
        float rainStrokes(vec2 p) {
          float rain = 0.0;
          // The hash repeats after twelve vertical cells. Each layer travels an
          // integer multiple of that distance, giving continuous falling rain
          // with the same exact loop period as the pigment and camera.
          for (int i = 0; i < 3; i++) {
            float layer = float(i);
            vec2 q = vec2((p.x + p.y * .13) * (68.0 + layer * 19.0),
                          p.y * (19.0 + layer * 7.0));
            q += vec2(layer * 17.3, uPhase / 6.28318530718 * 12.0 * (2.0 + layer));
            vec2 cell = floor(q), local = fract(q) - .5;
            float r = hash(vec2(cell.x, mod(cell.y, 12.0)) + layer * 41.0);
            local.x -= (r - .5) * .55;
            float stroke = 1.0 - smoothstep(.014, .065, abs(local.x + local.y * .12));
            stroke *= 1.0 - smoothstep(.08, .34, abs(local.y));
            stroke *= step(.86, r) * (.55 + .45 * r);
            rain += stroke * (.50 - layer * .10);
          }
          return rain;
        }
        void main() {
          vec3 background = uGreenscreen ? vec3(0.0, 1.0, 0.0) : uBackground;
          vec2 screen = (vUv - .5) * vec2(uAspect, 1.0);
          // Ray/plane intersection gives the painted sheet a gentle perspective
          // during orbits. Manual zoom and pan remain independent of that motion.
          vec3 ro = uInverseRotation * vec3(0.0, 0.0, 2.0);
          vec3 rd = uInverseRotation * vec3((screen - uPan) / uZoom, -2.0);
          float hit = -ro.z / rd.z;
          vec2 sheet = ro.xy + rd.xy * hit;
          vec2 artUv = sheet / vec2(uAspect, 1.0) + .5;
          float edge = min(min(artUv.x, artUv.y), min(1.0 - artUv.x, 1.0 - artUv.y));

          col = mix(col, vec3(.98, .60, .35), distant * (.025 + .035 * haze) * (.7 + .3 * cos(uPhase)) * uHaze);
          float shimmer = sin(uPhase * 2.0 + n2(p * 91.0) * 6.283185);

          col += vec3(.025, .020, .010) * shimmer * highlights;

            float ribbons = fbm(p * vec2(2.7, 26.0) + orbit * vec2(.65, .18));
            float windBand = exp(-pow((p.y - uHorizon - .045) / .19, 2.0));
            col = mix(col, vec3(.94, .64, .43),
              smoothstep(.46, .70, ribbons) * windBand * .16 * uWind);

          if (uMist > 0.0) {
            float level = uHorizon - .24 + .025 * sin(uPhase);
            float bank = exp(-pow((p.y - level) / .17, 2.0));
            float wisps = fbm(p * vec2(5.5, 21.0) + orbit * vec2(.65, .24));
            float veil = smoothstep(.25, .68, wisps) * bank * .34 * uMist;

        settings.panX = clamp(settings.panX + dx / canvas.clientHeight, -3, 3);
        settings.panY = clamp(settings.panY - dy / canvas.clientHeight, -3, 3);
        panXControl.updateDisplay(); panYControl.updateDisplay();
      }
      invalidate();
    });
    function endDrag(event, cancelled = false) {
      if (!drag || drag.id !== event.pointerId) return;
      const vary = !cancelled && !drag.moved && !drag.angle && settings.clickVariation
        && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 5;
      drag = null;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (vary) randomize();
    }
    canvas.addEventListener('pointerup', event => endDrag(event));
    canvas.addEventListener('pointercancel', event => endDrag(event, true));
    canvas.addEventListener('lostpointercapture', () => { drag = null; });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    let uiVisible = true;
    window.addEventListener('keydown', event => {
      if (event.code !== 'KeyH' || event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
      if (event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      uiVisible = !uiVisible;
      gui.show(uiVisible);
    });

    let resizeFrame;
    window.addEventListener('resize', () => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(resize);
    });
    document.addEventListener('visibilitychange', resume);
    reducedMotion.addEventListener('change', resume);
    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault(); contextLost = true; cancelAnimationFrame(frame);
    });
    canvas.addEventListener('webglcontextrestored', () => {
      contextLost = false; resize(); resume();
    });
    window.addEventListener('pagehide', event => {
      if (event.persisted) return;
      cancelAnimationFrame(frame);
      cancelAnimationFrame(resizeFrame);
      target?.dispose();
      gui.destroy();
      painting.dispose(); livingPaint.dispose(); geometry.dispose(); renderer.dispose();
    });
    applyPalette();
    resize();
    resume();
  </script>
</body>
</html>
