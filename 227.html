<script>
  const manhattan = `
    vec2 N22(vec2 p){
      vec3 a = fract(p.xyx * vec3(123.34, 234.34, 345.65));
      a += dot(a, a + 34.45);
      return fract(vec2(a.x * a.y, a.y * a.z));
    }
    
    vec4 manhattan(vec2 p){
      vec2 gv = fract(p) - 0.5;
      vec2 id = floor(p);
      vec2 cid = vec2(0);
      float minDist = 100.;
      for(float y = -1.; y <= 1.; y++){
        for(float x = -1.; x <= 1.; x++){
          vec2 offset = vec2(x, y);
          vec2 current = id + offset;
          vec2 n = N22(current);
          vec2 p = offset + sin(n * time * 0.25) * 0.5;
          p -= gv;
          float d = abs(p.x) + abs(p.y);
          if (d < minDist) {
            minDist = d;
            cid = current;
          }
        }
      }
      return vec4(cid, minDist, 0.);
    }
  `;
</script>
<script>
  const simplex = `
    // Simplex 3D Noise 
    // by Ian McEwan, Stefan Gustavson (https://github.com/stegu/webgl-noise)
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

    float snoise(vec3 v){ 
      const vec2 C = vec2(1.0/6.0, 1.0/3.0) ;
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

      // First corner
      vec3 i = floor(v + dot(v, C.yyy) );
      vec3 x0 = v - i + dot(i, C.xxx) ;

      // Other corners
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min( g.xyz, l.zxy );
      vec3 i2 = max( g.xyz, l.zxy );

      vec3 x1 = x0 - i1 + 1.0 * C.xxx;
      vec3 x2 = x0 - i2 + 2.0 * C.xxx;
      vec3 x3 = x0 - 1. + 3.0 * C.xxx;

      // Permutations
      i = mod(i, 289.0 ); 
      vec4 p = permute( permute( permute( 
                 i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
               + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
               + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

      // Gradients
      float n_ = 1.0/7.0; // N=7
      vec3 ns = n_ * D.wyz - D.xzx;

      vec4 j = p - 49.0 * floor(p * ns.z *ns.z); // mod(p,N*N)

      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_ ); // mod(j,N)

      vec4 x = x_ *ns.x + ns.yyyy;
      vec4 y = y_ *ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);

      vec4 b0 = vec4( x.xy, y.xy );
      vec4 b1 = vec4( x.zw, y.zw );

      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));

      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

      vec3 p0 = vec3(a0.xy,h.x);
      vec3 p1 = vec3(a0.zw,h.y);
      vec3 p2 = vec3(a1.xy,h.z);
      vec3 p3 = vec3(a1.zw,h.w);

      // Normalise gradients
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
      p0 *= norm.x;
      p1 *= norm.y;
      p2 *= norm.z;
      p3 *= norm.w;

      // Mix final noise value
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), 
                                    dot(p2,x2), dot(p3,x3) ) );
    }
  `;
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import GUI from "lil-gui";

console.clear();

const mu = THREE.MathUtils;
const loader = new GLTFLoader();
const model = (await loader.loadAsync("https://cywarr.github.io/small-shop/ali_brain.gltf")).scene.children[0].children[0];
model.geometry.rotateY(mu.degToRad(1));

// Load fonts
await (async function () {
  async function loadFont(fontface) {
    await fontface.load();
    document.fonts.add(fontface);
  }
  let fonts = [
    new FontFace(
      "Wallpoet",
      "url(https://fonts.gstatic.com/s/wallpoet/v21/f0X10em2_8RnXVVdUObp58Q.woff2) format('woff2')"
    ),
    new FontFace(
      "Kablammo",
      "url(https://fonts.gstatic.com/s/kablammo/v4/bWtm7fHPcgrhC-J3lcXhcQTY5Ixs6Au9YgCTiBcQ.woff2) format('woff2')"
    )
  ];
  for (let font in fonts) {
    await loadFont(fonts[font]);
  }
})();

// Color schemes
const PRESETS = {
  "Dualism Monochrome (Original)": {
    bgColor: "#888888",
    baseColor: "#000000",
    orderColor: "#ffffff",
    disorderColor: "#ffffff",
    textColor: "#ffffff",
    patternScale: 5.0,
    patternIntensity: 1.0,
    noiseSpeed: 1.0,
    roughness: 0.0,
    metalness: 0.0,
    envIntensity: 0.75
  },
  "Cyberpunk Neon": {
    bgColor: "#0a0614",
    baseColor: "#150529",
    orderColor: "#00f0ff",
    disorderColor: "#ff0077",
    textColor: "#ffe600",
    patternScale: 5.5,
    patternIntensity: 1.2,
    noiseSpeed: 1.3,
    roughness: 0.08,
    metalness: 0.25,
    envIntensity: 1.1
  },
  "Bio-Electric Abyssal": {
    bgColor: "#020c12",
    baseColor: "#01151f",
    orderColor: "#00ffd5",
    disorderColor: "#ff8400",
    textColor: "#55ffaa",
    patternScale: 4.8,
    patternIntensity: 1.1,
    noiseSpeed: 1.1,
    roughness: 0.12,
    metalness: 0.15,

  },
  "Crimson Order & Gold": {
    bgColor: "#0e0104",
    baseColor: "#22030a",
    orderColor: "#ffd700",
    disorderColor: "#ff1e46",
    textColor: "#ffffff",
    patternScale: 6.0,
    patternIntensity: 1.25,
    noiseSpeed: 0.9,
    roughness: 0.05,
    metalness: 0.4,
    envIntensity: 1.15
  },
  "Emerald Matrix": {
    bgColor: "#020d05",
    baseColor: "#041d0c",
    orderColor: "#00ff88",
    disorderColor: "#adff00",
    textColor: "#e1ff80",
    patternScale: 5.2,
    patternIntensity: 1.15,
    noiseSpeed: 1.2,
    roughness: 0.1,
    metalness: 0.18,
    envIntensity: 0.9
  }
};

const ANIMATION_MODES = [
  "Orbit Gentle",
  "Zenith Flow (Figure-8)",
  "Dual Horizon Wave",
  "Slow Floating Drift",
  "Static (No Camera Motion)"
];

const params = {
  preset: "Dualism Monochrome (Original)",
  greenscreen: false,
  bgColor: PRESETS["Dualism Monochrome (Original)"].bgColor,
  baseColor: PRESETS["Dualism Monochrome (Original)"].baseColor,
  orderColor: PRESETS["Dualism Monochrome (Original)"].orderColor,
  disorderColor: PRESETS["Dualism Monochrome (Original)"].disorderColor,
  textColor: PRESETS["Dualism Monochrome (Original)"].textColor,
  patternScale: 5.0,
  patternIntensity: 1.0,
  noiseSpeed: 1.0,
  roughness: 0.0,
  metalness: 0.0,
  envIntensity: 0.75,
  animSpeed: 1.0,
  animationMode: "Orbit Gentle",
  dpr: Math.min(window.devicePixelRatio || 1, 2),
  clickRandomize: true
};

const gu = {
  time: { value: 0 },
  aspect: { value: innerWidth / innerHeight },
  polar: { value: 0 },
  azimuth: { value: 0 },
  baseColor: { value: new THREE.Color(params.baseColor) },
  orderColor: { value: new THREE.Color(params.orderColor) },
  disorderColor: { value: new THREE.Color(params.disorderColor) },
  textColor: { value: new THREE.Color(params.textColor) },
  patternScale: { value: params.patternScale },
  patternIntensity: { value: params.patternIntensity },
  noiseSpeed: { value: params.noiseSpeed }
};

class Brain extends THREE.Group {
  constructor() {
    super();
    this.model = model;
    
    const setTexture = (f) => {
      const c = document.createElement("canvas");
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext("2d");
      const u = val => val * 0.01 * c.height;

      f(ctx, u);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = "srgb";
      tex.anisotropy = 16;
      return tex;
    };
    
    this.model.material = new THREE.MeshStandardMaterial({
      metalness: params.metalness,
      roughness: params.roughness,
      onBeforeCompile: shader => {
        shader.uniforms.time = gu.time;
        shader.uniforms.aspect = gu.aspect;
        shader.uniforms.polar = gu.polar;
        shader.uniforms.azimuth = gu.azimuth;
        shader.uniforms.baseColor = gu.baseColor;
        shader.uniforms.orderColor = gu.orderColor;
        shader.uniforms.disorderColor = gu.disorderColor;
        shader.uniforms.textColor = gu.textColor;
        shader.uniforms.patternScale = gu.patternScale;
        shader.uniforms.patternIntensity = gu.patternIntensity;
        shader.uniforms.noiseSpeed = gu.noiseSpeed;
        
        shader.uniforms.texOrder = {
          value: setTexture(function(ctx, u) {
            ctx.fillStyle = "#fff";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = u(4);
            ctx.translate(ctx.canvas.width * 0.5, ctx.canvas.height * 0.5);
            ctx.font = `${u(45)}px Wallpoet`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const text = "ORDER";
            ctx.strokeText(text, 0, 0);
            ctx.fillText(text, 0, 0);
          })
        };
        
        shader.uniforms.texDisorder = {
          value: setTexture(function(ctx, u) {
            ctx.fillStyle = "#000";
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = u(4);
            ctx.translate(ctx.canvas.width * 0.5, ctx.canvas.height * 0.5);
            ctx.font = `${u(40)}px Kablammo`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const text = "DISORDER";
            ctx.strokeText(text, 0, 0);
            ctx.fillText(text, 0, 0);
          })
        };
        
        shader.vertexShader = `
          varying vec3 vPos;
          varying vec4 vProjPos;
          ${shader.vertexShader}
        `.replace(
          `#include <project_vertex>`,
          `#include <project_vertex>
            vPos = position;
            vProjPos = gl_Position;
          `
        );
        
        shader.fragmentShader = `
          uniform float time;
          uniform float aspect;
          uniform float polar;
          uniform float azimuth;
          uniform sampler2D texOrder;
          uniform sampler2D texDisorder;
          uniform vec3 baseColor;
          uniform vec3 orderColor;
          uniform vec3 disorderColor;
          uniform vec3 textColor;
          uniform float patternScale;
          uniform float patternIntensity;
          uniform float noiseSpeed;
          
          varying vec3 vPos;
          varying vec4 vProjPos;
          
          ${manhattan}
          ${simplex}
          ${shader.fragmentShader}
        `.replace(
          `vec4 diffuseColor = vec4( diffuse, opacity );`,
          `
          float fHalven = smoothstep(0., 0.05, vPos.x);
          
          vec2 uv = (vProjPos.xy / vProjPos.w) * vec2(aspect, 1.);
          vec2 texUV = uv;
          uv *= patternScale;
          
          texUV *= vec2(1.0, 2.0) * 0.75;
          texUV += 0.5;
          
          vec4 dataOrder = texture(texOrder, texUV) * (
            smoothstep(0.1, 0.25, azimuth) - 
            smoothstep(0.75, 0.9, azimuth)
          );
          vec4 dataDisorder = texture(texDisorder, texUV) * (
            smoothstep(-0.9, -0.75, azimuth) -
            smoothstep(-0.25, -0.1, azimuth)
          );
          
          vec4 texVal = max(dataOrder, dataDisorder) * (
            smoothstep(0.2, 0.4, polar) - 
            smoothstep(0.6, 0.8, polar)
          );
          
          float f = 0.;
          
          vec4 mData = manhattan(uv);
          float fm = max(mData.z, 1. - smoothstep(0., 0.2, abs(mData.z - 0.65)));
          fm *= fm;
          fm = 1. - fm;
          
          float fs = 1. - smoothstep(0.1, 0.3, pow(abs(snoise(vec3(uv, time * noiseSpeed))), 0.5));
          
          f = mix(fs, fm, fHalven);
          
          vec3 hemiColor = mix(disorderColor, orderColor, fHalven);
          vec3 col = mix(baseColor, hemiColor, clamp(f * patternIntensity, 0.0, 1.0));
          
          vec3 textFinal = textColor * texVal.rgb;
          col = mix(col, textFinal, texVal.a);
          
          vec4 diffuseColor = vec4( col, opacity );
          `
        );
      }
    });
    
    this.add(this.model);
  }
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(params.greenscreen ? "#00ff00" : params.bgColor);

const camera = new THREE.PerspectiveCamera(
  45,
  innerWidth / innerHeight,
  0.1,
  100
);
camera.position.set(0, 0, 1).setLength(3.25);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(params.dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = params.envIntensity;

const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(2, 3, 2);
scene.add(light);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const brain = new Brain();
scene.add(brain);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = true;
controls.enableZoom = true;
controls.enableRotate = true;

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  gu.aspect.value = camera.aspect;
});

// Update functions
function applyColorsAndParams() {
  gu.baseColor.value.set(params.baseColor);
  gu.orderColor.value.set(params.orderColor);
  gu.disorderColor.value.set(params.disorderColor);
  gu.textColor.value.set(params.textColor);
  gu.patternScale.value = params.patternScale;
  gu.patternIntensity.value = params.patternIntensity;
  gu.noiseSpeed.value = params.noiseSpeed;
  
  if (brain && brain.model && brain.model.material) {
    brain.model.material.roughness = params.roughness;
    brain.model.material.metalness = params.metalness;
  }
  
  scene.environmentIntensity = params.envIntensity;
  scene.background.set(params.greenscreen ? "#00ff00" : params.bgColor);
}

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  params.preset = name;
  params.bgColor = p.bgColor;
  params.baseColor = p.baseColor;
  params.orderColor = p.orderColor;
  params.disorderColor = p.disorderColor;
  params.textColor = p.textColor;
  params.patternScale = p.patternScale;
  params.patternIntensity = p.patternIntensity;
  params.noiseSpeed = p.noiseSpeed;
  params.roughness = p.roughness;
  params.metalness = p.metalness;
  params.envIntensity = p.envIntensity;
  
  applyColorsAndParams();
  updateGuiDisplay();
}

function updateGuiDisplay() {
  function syncFolder(f) {
    f.controllers.forEach(c => c.updateDisplay());
    f.folders.forEach(sub => syncFolder(sub));
  }
  syncFolder(gui);
}

// Procedural randomizer on scene click
function hslToHex(h, s, l) {
  const col = new THREE.Color();
  col.setHSL(h, s, l);
  return "#" + col.getHexString();
}

function randomizeScene() {
  const h1 = Math.random();
  const h2 = (h1 + 0.35 + Math.random() * 0.3) % 1.0;
  const h3 = (h1 + 0.65 + Math.random() * 0.2) % 1.0;
  
  const isDarkBase = Math.random() > 0.15;
  const baseL = isDarkBase ? (0.02 + Math.random() * 0.08) : (0.8 + Math.random() * 0.15);
  const bgL = isDarkBase ? (0.02 + Math.random() * 0.06) : (0.7 + Math.random() * 0.15);
  
  params.preset = "Custom";
  params.bgColor = hslToHex(h1, 0.4, bgL);
  params.baseColor = hslToHex(h1, 0.6, baseL);
  params.orderColor = hslToHex(h1, 0.9, 0.65);
  params.disorderColor = hslToHex(h2, 0.9, 0.6);
  params.textColor = hslToHex(h3, 0.85, 0.75);
  
  params.patternScale = +(2.5 + Math.random() * 6.5).toFixed(1);
  params.patternIntensity = +(0.7 + Math.random() * 0.7).toFixed(2);
  params.noiseSpeed = +(0.5 + Math.random() * 1.5).toFixed(2);
  params.roughness = +(Math.random() * 0.4).toFixed(2);
  params.metalness = +(Math.random() * 0.6).toFixed(2);
  params.envIntensity = +(0.5 + Math.random() * 1.0).toFixed(2);
  params.animSpeed = +(0.6 + Math.random() * 1.0).toFixed(2);
  
  applyColorsAndParams();
  updateGuiDisplay();
}

// GUI Setup
const gui = new GUI({ title: "Brain Controls" });

const fPresets = gui.addFolder("Color Schemes");
fPresets.add(params, "preset", Object.keys(PRESETS).concat(["Custom"])).name("Theme").onChange(applyPreset);
fPresets.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(applyColorsAndParams);
fPresets.addColor(params, "bgColor").name("Background Color").onChange(() => {
  params.preset = "Custom";
  applyColorsAndParams();
  updateGuiDisplay();
});
fPresets.addColor(params, "baseColor").name("Base Brain Color").onChange(() => {
  params.preset = "Custom";
  applyColorsAndParams();
  updateGuiDisplay();
});
fPresets.addColor(params, "orderColor").name("Order (Grid) Color").onChange(() => {
  params.preset = "Custom";
  applyColorsAndParams();
  updateGuiDisplay();
});
fPresets.addColor(params, "disorderColor").name("Disorder (Noise) Color").onChange(() => {
  params.preset = "Custom";
  applyColorsAndParams();
  updateGuiDisplay();
});
fPresets.addColor(params, "textColor").name("Text Color").onChange(() => {
  params.preset = "Custom";
  applyColorsAndParams();
  updateGuiDisplay();
});

const fAnim = gui.addFolder("Animation & Motion");
fAnim.add(params, "animationMode", ANIMATION_MODES).name("Camera Animation");
fAnim.add(params, "animSpeed", 0.0, 3.0, 0.05).name("Global Speed");
fAnim.add(params, "noiseSpeed", 0.1, 3.0, 0.05).name("Noise Flow Speed").onChange(applyColorsAndParams);

const fGeo = gui.addFolder("Material & Geometry");
fGeo.add(params, "patternScale", 1.0, 12.0, 0.1).name("Pattern Scale").onChange(applyColorsAndParams);
fGeo.add(params, "patternIntensity", 0.0, 2.0, 0.05).name("Pattern Intensity").onChange(applyColorsAndParams);
fGeo.add(params, "roughness", 0.0, 1.0, 0.01).name("Roughness").onChange(applyColorsAndParams);
fGeo.add(params, "metalness", 0.0, 1.0, 0.01).name("Metalness").onChange(applyColorsAndParams);
fGeo.add(params, "envIntensity", 0.0, 2.0, 0.05).name("Env Lighting").onChange(applyColorsAndParams);

const fSettings = gui.addFolder("Settings & Interaction");
fSettings.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange(v => renderer.setPixelRatio(v));
fSettings.add(params, "clickRandomize").name("Click Scene to Randomize");
fSettings.add({ randomize: randomizeScene }, "randomize").name("🎲 Randomize Variation");

// Hide/show UI with "H" key
window.addEventListener("keydown", (e) => {
  if (e.key === "h" || e.key === "H") {
    if (gui._hidden) {
      gui.show();
    } else {
      gui.hide();
    }
  }
});

// Click detection for randomizer (distinguishing click from orbit/pan drag)
let pointerDownPos = { x: 0, y: 0 };
let pointerDownTime = 0;

window.addEventListener("pointerdown", (e) => {
  if (e.target.closest && e.target.closest(".lil-gui")) return;
  pointerDownPos = { x: e.clientX, y: e.clientY };
  pointerDownTime = performance.now();
});

window.addEventListener("pointerup", (e) => {
  if (e.target.closest && e.target.closest(".lil-gui")) return;
  const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  const elapsed = performance.now() - pointerDownTime;
  if (dist < 5 && elapsed < 350 && params.clickRandomize) {
    randomizeScene();
  }
});

// Animation loop
const clock = new THREE.Clock();
let animTime = 0;
let currentCamDistance = 3.25;
let isUserInteracting = false;

controls.addEventListener("start", () => {
  isUserInteracting = true;
});

controls.addEventListener("end", () => {
  isUserInteracting = false;
  currentCamDistance = camera.position.distanceTo(controls.target);
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  animTime += dt * params.animSpeed;
  gu.time.value = animTime;

  if (!isUserInteracting && params.animationMode !== "Static (No Camera Motion)") {
    const target = controls.target;
    let x = 0, y = 0, z = currentCamDistance;

    if (params.animationMode === "Orbit Gentle") {
      const angle = animTime * 0.25;
      x = Math.sin(angle) * currentCamDistance;
      z = Math.cos(angle) * currentCamDistance;
      y = Math.sin(animTime * 0.35) * 0.35;
    } else if (params.animationMode === "Zenith Flow (Figure-8)") {
      const angle = animTime * 0.2;
      x = Math.sin(angle) * currentCamDistance * 0.95;
      z = Math.cos(angle * 0.5) * currentCamDistance * 1.05;
      y = Math.sin(angle * 2.0) * 0.6 + 0.3;
    } else if (params.animationMode === "Dual Horizon Wave") {
      const angle = Math.sin(animTime * 0.35) * (Math.PI * 0.55);
      x = Math.sin(angle) * currentCamDistance;
      z = Math.cos(angle) * currentCamDistance;
      y = Math.sin(animTime * 0.25) * 0.25;
    } else if (params.animationMode === "Slow Floating Drift") {
      const dist = currentCamDistance + Math.sin(animTime * 0.2) * 0.35;
      const yaw = Math.sin(animTime * 0.15) * 0.8;
      const pitch = Math.cos(animTime * 0.18) * 0.35;
      x = Math.sin(yaw) * Math.cos(pitch) * dist;
      y = Math.sin(pitch) * dist;
      z = Math.cos(yaw) * Math.cos(pitch) * dist;
    }

    camera.position.set(target.x + x, target.y + y, target.z + z);
    camera.lookAt(target);
  } else {
    currentCamDistance = camera.position.distanceTo(controls.target);
  }

  controls.update();
  gu.polar.value = controls.getPolarAngle() / Math.PI;
  gu.azimuth.value = controls.getAzimuthalAngle() / Math.PI;
  renderer.render(scene, camera);
});
</script>
