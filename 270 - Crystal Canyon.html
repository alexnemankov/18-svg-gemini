        // =========================================================================
/**
 * =========================================================================================
 * POST PROCESSOR SUITE (Three.js Shader Post-Processing Pipeline)
 * =========================================================================================
 * Description:
 * A high-performance, modular post-processing pipeline for Three.js. It features:
 *   - Universal 3-Parameter Gaussian Bloom (Strength, Radius, Threshold)
 *   - Radial Chromatic Aberration distortion
 *   - Dynamic Film Grain Noise
 *   - Adjustable Vignette (Boost & Reduction)
 *   - Custom Gamma Correction & Min/Max Level controls
 *   - One-line lil-gui integration (`attachGUI(gui)`)
 *   - Offscreen scene target rendering (`renderScene(scene, camera)`)
 *
 * IMPORTANT USAGE NOTE:
 * DO NOT import this file directly via relative file path (e.g. `import { PostProcessor } from './postprocessing/PostProcessor.js'`)
 * when building standalone local HTML files that are opened directly via the `file://` protocol.
 * Browsers block relative ES module file imports under `file://` due to CORS origin policies.
 *
 * INSTEAD, copy and reuse the code from this file directly inline inside the target project's
 * HTML `<script type="module">` block whenever requested.
 * =========================================================================================
 */



// -------------------------------------------------------------
// Shaders: GLSL Code
// -------------------------------------------------------------
const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  // Calculate relative luminance (Rec. 709)
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  // Soft knee thresholding
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.0001) return uv;
  vec2 p = uv - 0.5;
  float d = length(p);
  if (d > radius * 1.5) return uv;
  float r = d / max(radius, 0.001);
  float theta = atan(p.y, p.x);
  float rDist = r + strength * (r * r * r);
  return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / gamma);
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}
void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
  fragColor.a = 1.0;
}
`;

const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

// -------------------------------------------------------------
// Helper Classes (FBO & Passes)
// -------------------------------------------------------------
function createFBO(w, h, options = {}) {
  return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
    wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
    wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
    minFilter: options.minFilter || THREE.LinearFilter,
    magFilter: options.magFilter || THREE.LinearFilter,
    format: options.format || THREE.RGBAFormat,
    type: options.type || THREE.HalfFloatType,
    stencilBuffer: options.stencilBuffer || false,
    depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
    samples: options.samples || 0,
  });
}

class ShaderPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbo = createFBO(1, 1, options);
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
    this.texture = this.fbo.texture;
  }
  render(renderer, toScreen = false) {
    if (!toScreen) {
      renderer.setRenderTarget(this.fbo);
    }
    renderer.render(this.orthoScene, this.orthoCamera);
    if (!toScreen) {
      renderer.setRenderTarget(null);
    }
  }
  setSize(width, height) {
    this.fbo.setSize(Math.max(1, width), Math.max(1, height));
    this.orthoQuad.scale.set(width, height, 1);
  }
}

class ShaderPingPongPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
    this.currentFBO = 0;
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer) {
    renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
    renderer.render(this.orthoScene, this.orthoCamera);
    renderer.setRenderTarget(null);
    this.currentFBO = 1 - this.currentFBO;
  }
  get current() { return this.fbos[this.currentFBO]; }
  get texture() { return this.current.texture; }
  setSize(width, height) {
    const w = Math.max(1, width);
    const h = Math.max(1, height);
    this.orthoQuad.scale.set(w, h, 1);
    this.fbos[0].setSize(w, h);
    this.fbos[1].setSize(w, h);
  }
}

class BloomPass {
  constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
    this.strength = strength;
    this.radius = radius;
    this.threshold = threshold;
    this.enabled = true;
    this.levels = levels;

    this.brightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        bloomThreshold: { value: this.threshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: brightFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.brightPass = new ShaderPass(this.brightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.blurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        direction: { value: new THREE.Vector2(0, 1) },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: blurFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.blurPasses = [];
    for (let i = 0; i < this.levels; i++) {
      this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType,
      }));
    }
  }

  setSize(w, h) {
    let tw = Math.max(1, w);
    let th = Math.max(1, h);
    this.brightPass.setSize(tw, th);
    for (let i = 0; i < this.levels; i++) {
      tw = Math.max(1, Math.round(tw / 2));
      th = Math.max(1, Math.round(th / 2));
      this.blurPasses[i].setSize(tw, th);
    }
  }

  set source(texture) {
    this.brightShader.uniforms.inputTexture.value = texture;
  }

  render(renderer) {
    if (!this.enabled || this.strength <= 0.001) return;

    this.brightShader.uniforms.bloomThreshold.value = this.threshold;
    this.brightPass.render(renderer);

    const baseOffset = Math.max(0.1, this.radius * 2.0);
    const u = this.blurShader.uniforms;

    for (let j = 0; j < this.levels; j++) {
      const blurPass = this.blurPasses[j];
      const stepOffset = baseOffset * (1.0 + j * 0.5);

      // Horizontal blur pass
      u.direction.value.set(stepOffset, 0);
      u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
      blurPass.render(renderer);

      // Vertical blur pass
      u.direction.value.set(0, stepOffset * 0.5);
      u.inputTexture.value = blurPass.current.texture;
      blurPass.render(renderer);
    }
  }
}

// -------------------------------------------------------------
// Main Export Class
// -------------------------------------------------------------
class PostProcessor {
  constructor(renderer, params = {}) {
    this.renderer = renderer;

    this.settings = {
      // Global Switch
      enabled: params.enabled !== undefined ? params.enabled : true,

      // 1. Universal 3-Param Bloom Engine
      bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
      bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
      bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
      bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

      // 2. Lens & Camera Optics
      fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
      fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
      chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.04,
      vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
      vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
      noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.02,

      // 3. Color Grading & Tone
      gamma: params.gamma !== undefined ? params.gamma : 1.0,
      minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
      maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
    };

    this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

    this.bloomPass = new BloomPass(
      this.settings.bloomStrength,
      this.settings.bloomRadius,
      this.settings.bloomThreshold,
      5
    );

    this.finalShader = new THREE.RawShaderMaterial({
      uniforms: {
        resolution: { value: new THREE.Vector2(1, 1) },
        bloomEnabled: { value: this.settings.bloomEnabled },
        bloomStrength: { value: this.settings.bloomStrength },
        vignetteBoost: { value: this.settings.vignetteBoost },
        vignetteReduction: { value: this.settings.vignetteReduction },
        noiseIntensity: { value: this.settings.noiseIntensity },
        inputTexture: { value: null },
        blur0Texture: { value: null },
        blur1Texture: { value: null },
        blur2Texture: { value: null },
        blur3Texture: { value: null },
        blur4Texture: { value: null },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: finalFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.finalPass = new ShaderPass(this.finalShader);

    this.rgbShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: this.finalPass.texture },
        fisheyeStrength: { value: this.settings.fisheyeStrength },
        fisheyeRadius: { value: this.settings.fisheyeRadius },
        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
        minInputLevel: { value: this.settings.minInputLevel },
        maxInputLevel: { value: this.settings.maxInputLevel },
        gammaLevel: { value: this.settings.gamma },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: colorFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.rgbPass = new ShaderPass(this.rgbShader);

    this.copyShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: copyFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.copyPass = new ShaderPass(this.copyShader);
  }

  updateSettings() {
    this.bloomPass.enabled = this.settings.bloomEnabled;
    this.bloomPass.strength = this.settings.bloomStrength;
    this.bloomPass.radius = this.settings.bloomRadius;
    this.bloomPass.threshold = this.settings.bloomThreshold;

    this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
    this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
    this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
    this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
    this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

    this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
    this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
    this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
    this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
    this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
    this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
  }

  setSize(w0, h0, dpr = 1) {
    const w = Math.max(1, Math.floor(w0 * dpr));
    const h = Math.max(1, Math.floor(h0 * dpr));
    this.sceneTarget.setSize(w, h);
    this.finalPass.setSize(w, h);
    this.finalShader.uniforms.resolution.value.set(w, h);
    this.bloomPass.setSize(w, h);
    this.rgbPass.setSize(w, h);
    this.copyPass.setSize(w, h);
  }

  renderScene(scene, camera) {
    if (!this.settings.enabled) {
      this.renderer.render(scene, camera);
      return;
    }
    this.renderer.setRenderTarget(this.sceneTarget);
    this.renderer.render(scene, camera);
    this.renderer.setRenderTarget(null);
    this.render(this.sceneTarget.texture);
  }

  render(sourceTexture) {
    if (!this.settings.enabled) {
      this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
      this.copyPass.render(this.renderer, true);
      return;
    }

    this.updateSettings();

    this.bloomPass.source = sourceTexture;
    this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
    this.bloomPass.render(this.renderer);

    this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
    this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
    this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
    this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
    this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

    const randomTime = Math.random() * 100000;
    this.finalPass.shader.uniforms.time.value = randomTime;
    this.rgbPass.shader.uniforms.time.value = randomTime;

    this.finalPass.render(this.renderer);
    this.rgbPass.render(this.renderer, true);
  }

  attachGUI(gui, title = "Post-Processing Suite") {
    const root = gui.addFolder(title);
    root.add(this.settings, "enabled").name("Enable Suite");

    // Folder 1: Bloom (Standard 3-Param Optical Engine)
    const bloom = root.addFolder("Bloom");
    bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

    // Folder 2: Lens & Cinematic Effects
    const lens = root.addFolder("Lens, Optics & Fisheye");
    lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
    lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
    lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
    lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
    lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
    lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
    lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

    return root;
  }
}

            },

                base: '#111111',
                accent: '#ffffff',
                phase: [0.0, 0.0, 0.0]
            },
            'White and black': {
                base: '#f0f0f5',
                accent: '#18181c',
                phase: [3.14, 3.14, 3.14]
            },
            'Neutral + accent': {
                base: '#404552',
                accent: '#00f0ff',
                phase: [1.5, 1.5, 1.5]
            }
        };

        // --- 8 Preconfigured Animations ---
        const ANIMATIONS = {
            'Cruising Flight': (t, s) => ({
                pos: [0.0, 0.0, t * s * 1.8],
                rot: [0.68, 0.0, 0.0]
            }),
            'Crystal Waltz': (t, s) => ({

            }),
            'Deep Descent': (t, s) => ({
                pos: [Math.sin(t * s * 0.25) * 0.4, 0.8 - (t * s * 0.6) % 6.0, t * s * 1.4],

            }),
            'Prismatic Hover': (t, s) => ({
                pos: [Math.sin(t * s * 0.5) * 0.6, 0.2 + Math.cos(t * s * 0.35) * 0.35, Math.sin(t * s * 0.25) * 0.5],
                rot: [0.68 + Math.sin(t * s * 0.35) * 0.1, Math.cos(t * s * 0.3) * 0.12, Math.sin(t * s * 0.25) * 0.06]
            }),
            'Canyon Slalom': (t, s) => ({

            }),

            }),
            'Static Chamber': (t, s) => ({
                pos: [0.0, 0.35, 2.2],
                rot: [0.68, 0.0, 0.0]
            })
        };

        // --- Application Parameters ---
        const params = {
            colorScheme: 'Monochromatic',
            baseColor: COLOR_SCHEMES['Monochromatic'].base,
            accentColor: COLOR_SCHEMES['Monochromatic'].accent,
            colorR: COLOR_SCHEMES['Monochromatic'].phase[0],
            colorG: COLOR_SCHEMES['Monochromatic'].phase[1],
            colorB: COLOR_SCHEMES['Monochromatic'].phase[2],
            animation: 'Cruising Flight',
            speed: 2.2,
            zoom: 1.0,
            dpr: 1.0,
            dither: 0.0,
            greenScreen: false,
            greenThreshold: 0.035,
            clickRandomize: true,
            canyonWidth: 0.65,
            canyonHeight: 0.75,
            facetScale: 1.8,
            facetSharpness: 2.4,
            terrainHeight: 0.55,
            fogStepSize: 1.8,
            noiseFreq: 1.8,
            noiseAmp: 0.28,
            glowIntensity: 1.0,
            dragRotX: 0.0,
            dragRotY: 0.0,
            dragPanX: 0.0,
            dragPanY: 0.0
        };

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(params.dpr);
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        // --- Instantiate PostProcessor ---
        const postProcessor = new PostProcessor(renderer, {
            enabled: true,
            bloomEnabled: true,
            bloomStrength: 0.7,
            bloomRadius: 0.45,
            bloomThreshold: 0.18,
            chromaticAberration: 0.02,
            vignetteBoost: 1.05,
            vignetteReduction: 0.4,
            noiseIntensity: 0.0,
            gamma: 1.0
        });

        // --- Helper Color Converters ---
        function hexToRgbVec(hex) {
            const c = new THREE.Color(hex);
            return new THREE.Vector3(c.r, c.g, c.b);
        }

        // --- Shader Material ---
        const geometry = new THREE.PlaneGeometry(2, 2);

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float iTime;
            uniform vec2 iResolution;

            // Camera Controls & Animations
            uniform vec3 uCamPos;
            uniform vec3 uCamRot;
            uniform vec2 uDragPan;
            uniform float uZoom;

            // Geometry & Facet Fold Parameters
            uniform float uCanyonWidth;
            uniform float uCanyonHeight;
            uniform float uFacetScale;
            uniform float uFacetSharpness;
            uniform float uTerrainHeight;
            uniform float uFogStepSize;
            uniform float uNoiseFreq;
            uniform float uNoiseAmp;
            uniform float uGlowIntensity;
            uniform float uDither;

            // Colors & Green Screen
            uniform vec3 uColorBase;
            uniform vec3 uColorAccent;
            uniform vec3 uColorPhase;
            uniform bool uGreenScreen;
            uniform float uGreenThreshold;

            // Hash without Sine
            float hash12(vec2 p) {
                vec3 p3  = fract(vec3(p.xyx) * .1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            vec2 rotate(vec2 v, float t) {
                float s = sin(t), c = cos(t);
                return mat2(c, -s, s, c) * v;
            }

            // ACES-fitted Cinematic Tone Mapping
            vec3 toneMap(vec3 c) {
                mat3 m1 = mat3(0.59719, 0.17600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
                mat3 m2 = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
                vec3 v = m1 * c;
                vec3 a = v * (v + -0.3254214) - 0.000090537;
                vec3 b = v * (0.973729 * v + 0.3429510) + 0.018081;
                return m2 * (a / b);
            }

            // Pseudo-Random Hash for 3D Noise
            float hash(float n) {
                return fract(sin(n) * 43758.7253);
            }

            // 3D Value Noise
            float valueNoise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);

                float n = p.x + p.y * 157.0 + 113.0 * p.z;
                return mix(
                    mix(mix(hash(n +   0.0), hash(n +   1.0), f.x),
                        mix(hash(n + 157.0), hash(n + 158.0), f.x), f.y),
                    mix(mix(hash(n + 113.0), hash(n + 114.0), f.x),
                        mix(hash(n + 270.0), hash(n + 271.0), f.x), f.y),
                    f.z
                );
            }

            // Domain-Repeated Faceted Crystal SDF & Cleavage Planes
            float facetedCrystalSDF(vec3 p) {
                vec3 q = p;

                // 1. Canyon Symmetry Fold
                q.x = abs(q.x) - uCanyonWidth;

                // 2. Modular Domain Repetition for Crystal Clusters
                float rep = uFacetScale;
                q.xz = mod(q.xz + 0.5 * rep, rep) - 0.5 * rep;

                // 3. Polyhedral Facet Folding (Octahedral / Diamond Cleavage Planes)
                q = abs(q);
                if (q.x < q.y) q.xy = q.yx;
                if (q.y < q.z) q.yz = q.zy;
                if (q.x < q.y) q.xy = q.yx;

                // 4. Diagonal Cleavage Rotation
                q.xz = rotate(q.xz, 0.785398);
                q = abs(q);

                // 5. Quantized Multi-Octave Faceted Noise
                float amp = uNoiseAmp;
                float freq = uNoiseFreq;
                float crystalVal = 0.0;

                for (int i = 0; i < 3; i++) {
                    vec3 np = q * freq;
                    float rawN = valueNoise(np);
                    float facetedN = floor(rawN * 4.0) / 4.0 + smoothstep(0.35, 0.65, fract(rawN * 4.0)) * 0.25;
                    crystalVal += amp * facetedN;
                    freq *= 1.95;
                    amp *= 0.52;
                }

                // Sharp Polyhedral Gem Slicing
                float polyFacet = max(q.x * 0.707 + q.y * 0.707, max(q.y * 0.707 + q.z * 0.707, q.x * 0.707 + q.z * 0.707)) - 0.55;

                return crystalVal * uTerrainHeight + polyFacet * 0.28;
            }

            void main() {
                vec2 fragCoord = gl_FragCoord.xy;
                float time = iTime;

                // Setup Camera with pan/drag and zoom
                vec3 rayPos = uCamPos + vec3(uDragPan.x, uDragPan.y, 0.0);
                vec2 uv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;

                // Zoom factor scaling
                vec3 rayDir = normalize(vec3(uv * (1.0 / uZoom), 0.35));

                // Camera Rotations (Pitch, Yaw, Roll)
                rayDir.yz = rotate(rayDir.yz, uCamRot.x);
                rayDir.xz = rotate(rayDir.xz, uCamRot.y);
                rayDir.xy = rotate(rayDir.xy, uCamRot.z);

                // Optional Dither
                float dither = hash12(fragCoord);
                if (uDither > 0.001) {
                    rayPos += rayDir * (dither - 0.5) * 0.5 * uDither;
                }

                vec3 accumulatedLight = vec3(0.0);

                // Volumetric Crystal Raymarching Loop
                for (float i = 8.8; i < 52.0; i++) {
                    vec3 p = rayPos;

                    // Geode Cavern Chasm Boundary
                    float chasmBase = length(vec2(p.x * 0.58, p.y)) - uCanyonHeight;

                    // Faceted Crystal Displacement SDF
                    float facetDisp = facetedCrystalSDF(p);

                    // Distance to crystal facets
                    float dist = abs(chasmBase - facetDisp);

                    // Soft bounding to prevent singularity
                    dist = max(dist, 0.32);

                    // Step Ray Forward
                    rayPos += rayDir * dist * uFogStepSize;

                    // --- Sharp Refractive Color Facet Bands ---
                    vec3 facetCoord = abs(mod(rayPos * uNoiseFreq * 0.5, 2.0) - 1.0);
                    float facetMetric = max(facetCoord.x, max(facetCoord.y, facetCoord.z));

                    float sharpBand1 = smoothstep(0.42, 0.58, fract(facetMetric * 3.2 + time * 0.04));
                    float sharpBand2 = smoothstep(0.46, 0.54, fract(dot(floor(rayPos * 1.6), vec3(0.35, 0.65, 0.95)) + length(uColorPhase) * 0.12));

                    vec3 phaseSine = sin(i * 0.12 + length(rayPos.xz * 0.18) + uColorPhase);
                    vec3 sharpPhase = smoothstep(vec3(-0.6), vec3(0.6), phaseSine);
                    sharpPhase = pow(sharpPhase, vec3(uFacetSharpness));

                    vec3 facetColor = mix(uColorBase, uColorAccent, sharpBand1 * 0.75 + sharpBand2 * 0.25);
                    facetColor = mix(facetColor, uColorAccent * 1.6, sharpPhase.x * 0.45);
                    facetColor *= (0.55 + 1.45 * sharpPhase);

                    float edgeGlow = smoothstep(0.55, 0.12, dist) * uGlowIntensity;
                    vec3 stepContribution = (facetColor + edgeGlow * uColorAccent * 1.3) / dist;

                    accumulatedLight += stepContribution;
                }

                // Balance and Tone Mapping
                vec3 finalColor = (accumulatedLight * accumulatedLight) / (2950.0 / uGlowIntensity);
                
                if (uDither > 0.001) {
                    finalColor += (dither - 0.5) * 0.02 * uDither * clamp(length(finalColor), 0.0, 1.0);
                }
                finalColor = max(finalColor, vec3(0.0));

                vec3 mappedColor = toneMap(finalColor);

                // Clean Green Screen Background Replacement
                if (uGreenScreen) {
                    float lum = dot(mappedColor, vec3(0.299, 0.587, 0.114));
                    mappedColor = mix(vec3(0.0, 1.0, 0.0), mappedColor, smoothstep(uGreenThreshold, uGreenThreshold + 0.1, lum));
                }

                gl_FragColor = vec4(mappedColor, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },
                uCamPos: { value: new THREE.Vector3(0, 0, 0) },
                uCamRot: { value: new THREE.Vector3(0.68, 0, 0) },
                uDragPan: { value: new THREE.Vector2(0, 0) },
                uZoom: { value: params.zoom },
                uCanyonWidth: { value: params.canyonWidth },
                uCanyonHeight: { value: params.canyonHeight },
                uFacetScale: { value: params.facetScale },
                uFacetSharpness: { value: params.facetSharpness },
                uTerrainHeight: { value: params.terrainHeight },
                uFogStepSize: { value: params.fogStepSize },
                uNoiseFreq: { value: params.noiseFreq },
                uNoiseAmp: { value: params.noiseAmp },
                uGlowIntensity: { value: params.glowIntensity },
                uDither: { value: params.dither },
                uColorBase: { value: hexToRgbVec(params.baseColor) },
                uColorAccent: { value: hexToRgbVec(params.accentColor) },
                uColorPhase: { value: new THREE.Vector3(params.colorR, params.colorG, params.colorB) },
                uGreenScreen: { value: params.greenScreen },
                uGreenThreshold: { value: params.greenThreshold }
            }
        });

        const quad = new THREE.Mesh(geometry, material);
        scene.add(quad);

        function setGreenScreen(enabled) {
            document.body.classList.toggle('greenscreen', enabled);
            renderer.setClearColor(enabled ? 0x00ff00 : 0x000000, 1);
            material.uniforms.uGreenScreen.value = enabled;
        }

        function applyColorScheme(schemeName) {
            const scheme = COLOR_SCHEMES[schemeName];
            if (!scheme) return;
            params.colorScheme = schemeName;
            params.baseColor = scheme.base;
            params.accentColor = scheme.accent;
            params.colorR = scheme.phase[0];
            params.colorG = scheme.phase[1];
            params.colorB = scheme.phase[2];

            material.uniforms.uColorBase.value.copy(hexToRgbVec(params.baseColor));
            material.uniforms.uColorAccent.value.copy(hexToRgbVec(params.accentColor));
            material.uniforms.uColorPhase.value.set(params.colorR, params.colorG, params.colorB);
        }

        // --- GUI Setup ---
        const gui = new GUI({ title: 'Crystal Canyon Settings' });
        gui.close();

        // 1. Scene & General
        gui.add(params, 'greenScreen').name('Green Screen #00ff00').onChange(setGreenScreen);
        gui.add(params, 'greenThreshold', 0.0, 0.3, 0.001).name('Green Threshold').onChange(v => {
            material.uniforms.uGreenThreshold.value = v;
        });
        gui.add(params, 'dither', 0.0, 1.0, 0.05).name('Noise / Dither').onChange(v => {
            material.uniforms.uDither.value = v;
        });
        gui.add(params, 'clickRandomize').name('Randomize on Click');

        // DPR (Pixel Ratio) Setting
        gui.add(params, 'dpr', 0.25, 2.5, 0.25).name('DPR (Pixel Ratio)').onChange(val => {
            renderer.setPixelRatio(val);
            const w = window.innerWidth;
            const h = window.innerHeight;
            material.uniforms.iResolution.value.set(w * val, h * val);
            postProcessor.setSize(w, h, val);
        });

        // 2. Animation Controls
        const animFolder = gui.addFolder('Animation & Motion');
        animFolder.add(params, 'animation', Object.keys(ANIMATIONS)).name('Animation Mode');
        animFolder.add(params, 'speed', 0.0, 10.0, 0.1).name('Animation Speed');
        const zoomController = animFolder.add(params, 'zoom', 0.2, 4.0, 0.05).name('Zoom Factor').onChange(v => {
            material.uniforms.uZoom.value = v;
        });

        // 3. Color & Lighting
        const colorFolder = gui.addFolder('Color & Lighting');
        colorFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(val => {
            applyColorScheme(val);
            updateGuiControllers();
        });
        colorFolder.addColor(params, 'baseColor').name('Base Color').onChange(v => {
            material.uniforms.uColorBase.value.copy(hexToRgbVec(v));
        });
        colorFolder.addColor(params, 'accentColor').name('Accent Color').onChange(v => {
            material.uniforms.uColorAccent.value.copy(hexToRgbVec(v));
        });
        colorFolder.add(params, 'colorR', 0.0, 10.0, 0.1).name('Red Phase').onChange(v => material.uniforms.uColorPhase.value.x = v);
        colorFolder.add(params, 'colorG', 0.0, 10.0, 0.1).name('Green Phase').onChange(v => material.uniforms.uColorPhase.value.y = v);
        colorFolder.add(params, 'colorB', 0.0, 10.0, 0.1).name('Blue Phase').onChange(v => material.uniforms.uColorPhase.value.z = v);
        colorFolder.add(params, 'facetSharpness', 0.5, 6.0, 0.1).name('Facet Band Sharpness').onChange(v => {
            material.uniforms.uFacetSharpness.value = v;
        });
        colorFolder.add(params, 'glowIntensity', 0.1, 3.0, 0.1).name('Glow & Refraction').onChange(v => {
            material.uniforms.uGlowIntensity.value = v;
        });

        // 4. Crystal Geometry & Facet SDF
        const geomFolder = gui.addFolder('Crystal Geometry');
        geomFolder.add(params, 'canyonWidth', 0.1, 2.0, 0.05).name('Canyon Chasm Width').onChange(v => material.uniforms.uCanyonWidth.value = v);
        geomFolder.add(params, 'canyonHeight', 0.2, 2.5, 0.05).name('Canyon Height').onChange(v => material.uniforms.uCanyonHeight.value = v);
        geomFolder.add(params, 'facetScale', 0.5, 4.0, 0.1).name('Facet Repeat Scale').onChange(v => material.uniforms.uFacetScale.value = v);
        geomFolder.add(params, 'terrainHeight', 0.0, 2.0, 0.05).name('Crystal Amplitude').onChange(v => material.uniforms.uTerrainHeight.value = v);
        geomFolder.add(params, 'fogStepSize', 0.2, 4.0, 0.05).name('Volumetric Step').onChange(v => material.uniforms.uFogStepSize.value = v);
        geomFolder.add(params, 'noiseFreq', 0.2, 5.0, 0.1).name('Crystal Noise Freq').onChange(v => material.uniforms.uNoiseFreq.value = v);
        geomFolder.add(params, 'noiseAmp', 0.0, 1.0, 0.02).name('Crystal Noise Amp').onChange(v => material.uniforms.uNoiseAmp.value = v);

        // 5. Post-Processing Suite Folder
        postProcessor.attachGUI(gui, 'Post-Processing Suite');

        function updateGuiControllers() {
            if (gui.controllersRecursive) {
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            } else {
                const updateFolder = (f) => {
                    f.controllers.forEach(c => c.updateDisplay());
                    f.folders.forEach(updateFolder);
                };
                updateFolder(gui);
            }
        }

        // --- Procedural Variation on Click ---
        function randomizeTheme() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomScheme);

            // Re-roll geometric & motion parameters
            params.canyonWidth = +(0.35 + Math.random() * 0.7).toFixed(2);
            params.canyonHeight = +(0.45 + Math.random() * 0.7).toFixed(2);
            params.facetScale = +(1.1 + Math.random() * 1.8).toFixed(1);
            params.facetSharpness = +(1.6 + Math.random() * 3.2).toFixed(1);
            params.terrainHeight = +(0.35 + Math.random() * 0.6).toFixed(2);
            params.fogStepSize = +(1.3 + Math.random() * 1.2).toFixed(2);
            params.noiseFreq = +(1.2 + Math.random() * 2.2).toFixed(1);
            params.noiseAmp = +(0.18 + Math.random() * 0.28).toFixed(2);
            params.glowIntensity = +(0.8 + Math.random() * 0.9).toFixed(1);
            params.speed = +(1.4 + Math.random() * 3.0).toFixed(1);

            // Update Shader Uniforms
            material.uniforms.uCanyonWidth.value = params.canyonWidth;
            material.uniforms.uCanyonHeight.value = params.canyonHeight;
            material.uniforms.uFacetScale.value = params.facetScale;
            material.uniforms.uFacetSharpness.value = params.facetSharpness;
            material.uniforms.uTerrainHeight.value = params.terrainHeight;
            material.uniforms.uFogStepSize.value = params.fogStepSize;
            material.uniforms.uNoiseFreq.value = params.noiseFreq;
            material.uniforms.uNoiseAmp.value = params.noiseAmp;
            material.uniforms.uGlowIntensity.value = params.glowIntensity;

            // Refresh UI
            updateGuiControllers();
        }

        // --- Mouse Drag & Wheel Zoom Controls ---
        let isPointerDown = false;
        let startX = 0, startY = 0;
        let lastX = 0, lastY = 0;
        let totalDragDistance = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;
            isPointerDown = true;
            startX = e.clientX;
            startY = e.clientY;
            lastX = e.clientX;
            lastY = e.clientY;
            totalDragDistance = 0;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPointerDown) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            totalDragDistance += Math.hypot(dx, dy);
            lastX = e.clientX;
            lastY = e.clientY;

            // Pan and rotate object/camera view
            params.dragRotY += dx * 0.005;
            params.dragRotX += dy * 0.005;
            params.dragRotX = Math.max(-Math.PI * 0.45, Math.min(Math.PI * 0.45, params.dragRotX));

            params.dragPanX -= dx * 0.0015;
            params.dragPanY += dy * 0.0015;
        });

        window.addEventListener('pointerup', (e) => {
            if (!isPointerDown) return;
            isPointerDown = false;

            // If clean click without dragging, re-roll procedural theme
            if (totalDragDistance < 6 && params.clickRandomize && !e.target.closest('.lil-gui')) {
                randomizeTheme();
            }
        });

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            params.zoom += e.deltaY * -0.0015;
            params.zoom = Math.max(0.2, Math.min(4.0, params.zoom));
            material.uniforms.uZoom.value = params.zoom;
            zoomController.updateDisplay();
        }, { passive: false });

        // Toggle Hide/Show UI with "H" key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                const isHidden = gui.domElement.style.display === 'none';
                gui.domElement.style.display = isHidden ? '' : 'none';
            }
        });

        // --- Window Resize Handler ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            const dpr = renderer.getPixelRatio();
            material.uniforms.iResolution.value.set(w * dpr, h * dpr);
            postProcessor.setSize(w, h, dpr);
        });

        // Initial setup
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        setGreenScreen(params.greenScreen);

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            material.uniforms.iTime.value = elapsedTime;

            // Compute Camera Position & Rotation from Selected Animation
            const animFn = ANIMATIONS[params.animation] || ANIMATIONS['Cruising Flight'];
            const animState = animFn(elapsedTime, params.speed);

            material.uniforms.uCamPos.value.set(
                animState.pos[0] + params.dragPanX,
                animState.pos[1] + params.dragPanY,
                animState.pos[2]
            );

            material.uniforms.uCamRot.value.set(
                animState.rot[0] + params.dragRotX,
                animState.rot[1] + params.dragRotY,
                animState.rot[2]
            );

            // Render through PostProcessor Pipeline
            postProcessor.renderScene(scene, camera);
        }

        animate();
    </script>
</body>
</html>
