    // ---------------------------------------------------------------

      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      antialias: true

    // ---------------------------------------------------------------
    // Three.js Core Setup
    // ---------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    let renderer, scene, camera, controls;

    function createRenderer(useAntialias) {
      const r = new THREE.WebGLRenderer({
        antialias: useAntialias,
        alpha: true,
        powerPreference: 'high-performance'
      });
      r.setSize(window.innerWidth, window.innerHeight);
      r.setPixelRatio(params.dpr);
      r.toneMapping = THREE.ACESFilmicToneMapping;
      r.toneMappingExposure = params.exposure;
      return r;
    }

    renderer = createRenderer(params.antialias);
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 8.4);

    // OrbitControls: Full freedom to zoom with wheel, pan and rotate
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.screenSpacePanning = true;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.enableRotate = true;
    controls.minDistance = 2.5;
    controls.maxDistance = 24.0;
    controls.target.set(0, 0, 0);

    // ---------------------------------------------------------------
    // Procedural Frosted Grain Texture
    // ---------------------------------------------------------------
    function createFrostedGrainTexture() {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const imgData = ctx.createImageData(size, size);
      const data = imgData.data;

      // Fine high-frequency noise for authentic frosted tactile texture
      for (let i = 0; i < data.length; i += 4) {
        const n = 120 + Math.floor(Math.random() * 28);
        data[i] = n;
        data[i + 1] = n;
        data[i + 2] = n;
        data[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);

      // Rare subtle light veins / wisps (редкие светлые прожилки)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.filter = 'blur(1.5px)';

      for (let v = 0; v < 3; v++) {
        ctx.beginPath();
        const startX = Math.random() * size;
        ctx.moveTo(startX, 0);
        ctx.bezierCurveTo(
          startX + (Math.random() - 0.5) * 160, size * 0.33,
          startX + (Math.random() - 0.5) * 160, size * 0.66,
          startX + (Math.random() - 0.5) * 120, size
        );
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(params.grainScale, params.grainScale);
      return texture;
    }

    const grainTexture = createFrostedGrainTexture();

    // ---------------------------------------------------------------
    // Background Plane (Atmospheric Left-Bright / Right-Dark Gradient)
    // ---------------------------------------------------------------
    const bgPlaneGeo = new THREE.PlaneGeometry(36, 22);
    const bgUniforms = {
      uLeftColor: { value: new THREE.Color(params.bgLeft) },
      uRightColor: { value: new THREE.Color(params.bgRight) },
      uGreenscreen: { value: 0.0 }
    };

    const bgPlaneMat = new THREE.ShaderMaterial({
      uniforms: bgUniforms,
      depthWrite: false,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uLeftColor;
        uniform vec3 uRightColor;
        uniform float uGreenscreen;
        varying vec2 vUv;

        void main() {
          if (uGreenscreen > 0.5) {
            gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
            return;
          }
          // Horizontal gradient: left is brighter, right is darker
          float h = smoothstep(0.05, 0.95, vUv.x);
          vec3 base = mix(uLeftColor, uRightColor, h);

          // Subtle organic left glow
          float leftGlow = smoothstep(0.9, 0.0, distance(vUv, vec2(0.22, 0.52)));
          base += uLeftColor * leftGlow * 0.45;

          gl_FragColor = vec4(base, 1.0);
        }
      `
    });

    const bgPlane = new THREE.Mesh(bgPlaneGeo, bgPlaneMat);
    bgPlane.position.set(0, 0, -6.5);
    scene.add(bgPlane);

    // ---------------------------------------------------------------
    // Central Frosted Glass Panel & Shiny Specular Edge
    // ---------------------------------------------------------------
    const panelWidth = 4.6;
    const panelHeight = 8.0;
    const panelRadius = 0.36;
    const panelDepth = 0.32;

    function createRoundedPanelShape(w, h, r) {
      const shape = new THREE.Shape();
      shape.moveTo(-w / 2 + r, -h / 2);
      shape.lineTo(w / 2 - r, -h / 2);
      shape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
      shape.lineTo(w / 2, h / 2 - r);
      shape.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
      shape.lineTo(-w / 2 + r, h / 2);
      shape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
      shape.lineTo(-w / 2, -h / 2 + r);
      shape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
      return shape;
    }

    const panelShape = createRoundedPanelShape(panelWidth, panelHeight, panelRadius);
    const extrudeSettings = {
      steps: 1,
      depth: panelDepth,
      bevelEnabled: true,
      bevelThickness: 0.08,
      bevelSize: 0.08,
      bevelSegments: 5
    };

    const glassGeometry = new THREE.ExtrudeGeometry(panelShape, extrudeSettings);
    glassGeometry.center();

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.glassTint),
      transmission: params.transmission,
      roughness: params.roughness,
      ior: params.ior,
      thickness: params.thickness,
      specularIntensity: 1.0,
      specularColor: new THREE.Color(0xffffff),
      clearcoat: params.clearcoat,
      clearcoatRoughness: params.clearcoatRoughness,
      roughnessMap: grainTexture,
      bumpMap: grainTexture,
      bumpScale: params.grainIntensity,
      transparent: true,
      opacity: 1.0
    });

    const glassPanel = new THREE.Mesh(glassGeometry, glassMaterial);
    glassPanel.position.set(0, 0, 0);
    scene.add(glassPanel);

    // Thin shiny specular edge line (на кромке панели тонкая блестящая линия)
    function createEdgeCurve(w, h, r) {
      const path = new THREE.CurvePath();
      const hw = w / 2, hh = h / 2;

      path.add(new THREE.LineCurve3(new THREE.Vector3(-hw + r, -hh, 0), new THREE.Vector3(hw - r, -hh, 0)));
      path.add(new THREE.QuadraticBezierCurve3(new THREE.Vector3(hw - r, -hh, 0), new THREE.Vector3(hw, -hh, 0), new THREE.Vector3(hw, -hh + r, 0)));
      path.add(new THREE.LineCurve3(new THREE.Vector3(hw, -hh + r, 0), new THREE.Vector3(hw, hh - r, 0)));
      path.add(new THREE.QuadraticBezierCurve3(new THREE.Vector3(hw, hh - r, 0), new THREE.Vector3(hw, hh, 0), new THREE.Vector3(hw - r, hh, 0)));
      path.add(new THREE.LineCurve3(new THREE.Vector3(hw - r, hh, 0), new THREE.Vector3(-hw + r, hh, 0)));
      path.add(new THREE.QuadraticBezierCurve3(new THREE.Vector3(-hw + r, hh, 0), new THREE.Vector3(-hw, hh, 0), new THREE.Vector3(-hw, hh - r, 0)));
      path.add(new THREE.LineCurve3(new THREE.Vector3(-hw, hh - r, 0), new THREE.Vector3(-hw, -hh + r, 0)));
      path.add(new THREE.QuadraticBezierCurve3(new THREE.Vector3(-hw, -hh + r, 0), new THREE.Vector3(-hw, -hh, 0), new THREE.Vector3(-hw + r, -hh, 0)));

      return path;
    }

    const edgePath = createEdgeCurve(panelWidth + 0.14, panelHeight + 0.14, panelRadius + 0.07);
    const edgeTubeGeo = new THREE.TubeGeometry(edgePath, 160, 0.022, 8, true);

    const edgeMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.edgeColor),
      emissive: new THREE.Color(params.edgeColor),
      emissiveIntensity: params.edgeGlow * 0.7,
      metalness: 0.92,
      roughness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.02,
      reflectivity: 1.0
    });

    const edgeMeshFront = new THREE.Mesh(edgeTubeGeo, edgeMaterial);
    edgeMeshFront.position.set(0, 0, (panelDepth / 2) + 0.06);
    glassPanel.add(edgeMeshFront);

    const edgeMeshBack = new THREE.Mesh(edgeTubeGeo, edgeMaterial);
    edgeMeshBack.position.set(0, 0, -(panelDepth / 2) - 0.06);
    glassPanel.add(edgeMeshBack);

    // ---------------------------------------------------------------
    // Moving Colored Blobs / Clouds Behind the Glass
    // ---------------------------------------------------------------
    const blobGroup = new THREE.Group();
    scene.add(blobGroup);

    function createBlobCloudMaterial(colorHex, bgHex) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: new THREE.Color(colorHex) },
          uBgColor: { value: new THREE.Color(bgHex) },
          uIntensity: { value: 2.2 }
        },
        depthWrite: false,
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform vec3 uBgColor;
          uniform float uIntensity;
          varying vec3 vNormal;
          varying vec3 vViewPosition;

          void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            float fresnel = max(0.0, dot(normal, viewDir));
            float softFalloff = smoothstep(0.0, 0.85, fresnel);
            vec3 finalCol = mix(uBgColor, uColor * uIntensity, softFalloff);
            gl_FragColor = vec4(finalCol, 1.0);
          }
        `
      });
    }

    const blobConfigs = [
      {
        id: 1,
        colorProp: 'blob1Color',
        intensityProp: 'blob1Intensity',
        basePos: new THREE.Vector3(-1.8, 1.6, -2.4),
        radius: 1.6,
        speedX: 0.42,
        speedY: 0.33,
        speedZ: 0.28,
        ampX: 1.8,
        ampY: 1.3,
        ampZ: 0.6,
        phase: 0.0

      {
        id: 2,
        colorProp: 'blob2Color',
        intensityProp: 'blob2Intensity',
        basePos: new THREE.Vector3(1.7, -1.2, -2.2),
        radius: 1.7,
        speedX: 0.36,
        speedY: 0.45,
        speedZ: 0.24,
        ampX: 1.7,
        ampY: 1.5,
        ampZ: 0.5,
        phase: 2.1

      {
        id: 3,
        colorProp: 'blob3Color',
        intensityProp: 'blob3Intensity',
        basePos: new THREE.Vector3(-0.9, -1.8, -2.7),
        radius: 1.5,
        speedX: 0.48,
        speedY: 0.38,
        speedZ: 0.32,
        ampX: 1.5,
        ampY: 1.4,
        ampZ: 0.6,
        phase: 4.2

      {
        id: 4,
        colorProp: 'blob4Color',
        intensityProp: 'blob4Intensity',
        basePos: new THREE.Vector3(1.4, 1.9, -2.9),
        radius: 1.4,
        speedX: 0.32,
        speedY: 0.42,
        speedZ: 0.26,
        ampX: 1.4,
        ampY: 1.2,
        ampZ: 0.7,
        phase: 1.4

    const blobs = [];
    blobConfigs.forEach((cfg) => {
      const geo = new THREE.IcosahedronGeometry(cfg.radius, 4);
      const mat = createBlobCloudMaterial(params[cfg.colorProp], params.bgRight);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(cfg.basePos);
      blobGroup.add(mesh);

      const light = new THREE.PointLight(
        params[cfg.colorProp],
        params[cfg.intensityProp] * params.lightIntensity,
        14,
        1.8
      );
      light.position.copy(cfg.basePos);
      scene.add(light);

      blobs.push({
        cfg,
        mesh,
        mat,
        light,
        baseScale: 1.0
      });
    });

    // ---------------------------------------------------------------
    // Scene Lights
    // ---------------------------------------------------------------
    const ambientLight = new THREE.AmbientLight(
      params.ambientColor,
      params.ambientIntensity * params.lightIntensity
    );
    scene.add(ambientLight);

    // Left Key Light (Bright side of composition)
    const keyLight = new THREE.DirectionalLight(
      params.keyLightColor,
      params.keyLightIntensity * params.lightIntensity
    );
    keyLight.position.set(params.keyLightX, params.keyLightY, params.keyLightZ);
    scene.add(keyLight);

    // Right Fill Light (Darker side of composition)
    const fillLight = new THREE.DirectionalLight(
      params.fillLightColor,
      params.fillLightIntensity * params.lightIntensity
    );
    fillLight.position.set(params.fillLightX, params.fillLightY, params.fillLightZ);
    scene.add(fillLight);

    // Specular Rim Light for edge highlights
    const edgeLight = new THREE.DirectionalLight(
      params.edgeLightColor,
      params.edgeLightIntensity * params.lightIntensity
    );
    edgeLight.position.set(-2.0, 5.0, 3.0);
    scene.add(edgeLight);

    // ---------------------------------------------------------------
    // Camera Animation System: 8 Preconfigured Modes
    // Preserves wheel zoom distance & orientation without snapping!
    // ---------------------------------------------------------------
    let baseTarget = new THREE.Vector3(0, 0, 0);
    let driftTargetOffset = new THREE.Vector3(0, 0, 0);

    function updateCameraAnimation(elapsedTime, delta) {
      const mode = params.animation;
      const speed = params.animSpeed;

      if (mode === 'Static (No Camera Move)') {
        controls.autoRotate = false;
        camera.zoom = 1.0;
        camera.updateProjectionMatrix();
        return;
      }

      if (mode === 'Slow Cinematic Orbit') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.65 * speed;
        camera.zoom = 1.0;
        camera.updateProjectionMatrix();
        return;
      } else {
        controls.autoRotate = false;
      }

      if (mode === 'Gentle Floating Drift') {
        driftTargetOffset.set(
          Math.sin(elapsedTime * 0.4 * speed) * 0.28,
          Math.cos(elapsedTime * 0.3 * speed) * 0.22,
          0
        );
        camera.zoom = 1.0;
        camera.updateProjectionMatrix();
      } else if (mode === 'Breathing Depth Zoom') {
        // Modulates optical zoom smoothly so user's wheel distance is completely preserved
        const breath = 1.0 + Math.sin(elapsedTime * 0.8 * speed) * 0.055;
        camera.zoom = breath;
        camera.updateProjectionMatrix();
      } else if (mode === 'Soft Figure-8 Pan') {
        driftTargetOffset.set(
          Math.sin(elapsedTime * 0.45 * speed) * 0.42,
          Math.sin(elapsedTime * 0.9 * speed) * 0.24,
          0
        );
        camera.zoom = 1.0;
        camera.updateProjectionMatrix();
      } else if (mode === 'Subtle Parallax Swivel') {
        driftTargetOffset.set(
          Math.sin(elapsedTime * 0.5 * speed) * 0.35,
          0,
          Math.cos(elapsedTime * 0.5 * speed) * 0.2
        );
        camera.zoom = 1.0;
        camera.updateProjectionMatrix();
      } else if (mode === 'Diagonal Glass Glide') {
        const glide = Math.sin(elapsedTime * 0.38 * speed);
        driftTargetOffset.set(glide * 0.48, glide * 0.32, 0);
        camera.zoom = 1.0;
        camera.updateProjectionMatrix();
      } else if (mode === 'Ambient Horizon Sway') {
        driftTargetOffset.set(
          Math.sin(elapsedTime * 0.32 * speed) * 0.32,
          Math.cos(elapsedTime * 0.25 * speed) * 0.15,
          0
        );
        camera.rotation.z += Math.sin(elapsedTime * 0.25 * speed) * 0.012;
        camera.zoom = 1.0;
        camera.updateProjectionMatrix();
      }

      controls.target.copy(baseTarget).add(driftTargetOffset);
    }

    // ---------------------------------------------------------------
    // Theme & Parameters Applicator
    // ---------------------------------------------------------------
    function applyPalette(paletteKey, duration = 0.8) {
      const pal = PALETTES[paletteKey];
      if (!pal) return;

      params.scheme = paletteKey;
      params.blob1Color = pal.blob1;
      params.blob2Color = pal.blob2;
      params.blob3Color = pal.blob3;
      params.blob4Color = pal.blob4;
      params.bgLeft = pal.bgLeft;
      params.bgRight = pal.bgRight;
      params.edgeColor = pal.edgeColor;
      params.glassTint = pal.glassTint;
      params.bgColor = pal.bgColor;

      updateAllMaterials(duration);
    }

    function updateAllMaterials(duration = 0.8) {
      if (duration > 0 && window.gsap) {
        // Smooth transitions via GSAP
        blobs.forEach((b) => {
          const colProp = b.cfg.colorProp;
          const targetCol = new THREE.Color(params[colProp]);
          gsap.to(b.mat.uniforms.uColor.value, {
            r: targetCol.r,
            g: targetCol.g,
            b: targetCol.b,
            duration: duration,
            ease: 'power2.out'
          });
          gsap.to(b.light.color, {
            r: targetCol.r,
            g: targetCol.g,
            b: targetCol.b,
            duration: duration,
            ease: 'power2.out'
          });
        });

        const leftCol = new THREE.Color(params.bgLeft);
        const rightCol = new THREE.Color(params.bgRight);
        gsap.to(bgUniforms.uLeftColor.value, {
          r: leftCol.r,
          g: leftCol.g,
          b: leftCol.b,
          duration: duration,
          ease: 'power2.out'
        });
        gsap.to(bgUniforms.uRightColor.value, {
          r: rightCol.r,
          g: rightCol.g,
          b: rightCol.b,
          duration: duration,
          ease: 'power2.out'
        });

        const edgeCol = new THREE.Color(params.edgeColor);
        gsap.to(edgeMaterial.color, {
          r: edgeCol.r,
          g: edgeCol.g,
          b: edgeCol.b,
          duration: duration
        });
        gsap.to(edgeMaterial.emissive, {
          r: edgeCol.r,
          g: edgeCol.g,
          b: edgeCol.b,
          duration: duration
        });

        const glassCol = new THREE.Color(params.glassTint);
        gsap.to(glassMaterial.color, {
          r: glassCol.r,
          g: glassCol.g,
          b: glassCol.b,
          duration: duration
        });
      } else {
        blobs.forEach((b) => {
          const col = new THREE.Color(params[b.cfg.colorProp]);
          b.mat.uniforms.uColor.value.copy(col);
          b.light.color.copy(col);
        });
        bgUniforms.uLeftColor.value.set(params.bgLeft);
        bgUniforms.uRightColor.value.set(params.bgRight);
        edgeMaterial.color.set(params.edgeColor);
        edgeMaterial.emissive.set(params.edgeColor);
        glassMaterial.color.set(params.glassTint);
      }

      // Greenscreen handling
      if (params.greenScreen) {
        bgUniforms.uGreenscreen.value = 1.0;
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        bgUniforms.uGreenscreen.value = 0.0;
        renderer.setClearColor(params.bgColor, 1.0);
      }

      // Light intensities
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity * params.lightIntensity;

      keyLight.color.set(params.keyLightColor);
      keyLight.intensity = params.keyLightIntensity * params.lightIntensity;
      keyLight.position.set(params.keyLightX, params.keyLightY, params.keyLightZ);

      fillLight.color.set(params.fillLightColor);
      fillLight.intensity = params.fillLightIntensity * params.lightIntensity;
      fillLight.position.set(params.fillLightX, params.fillLightY, params.fillLightZ);

      edgeLight.color.set(params.edgeLightColor);
      edgeLight.intensity = params.edgeLightIntensity * params.lightIntensity;

      blobs.forEach((b) => {
        b.light.intensity = params[b.cfg.intensityProp] * params.lightIntensity;
      });

      // Glass properties
      glassMaterial.transmission = params.transmission;
      glassMaterial.roughness = params.roughness;
      glassMaterial.ior = params.ior;
      glassMaterial.thickness = params.thickness;
      glassMaterial.clearcoat = params.clearcoat;
      glassMaterial.clearcoatRoughness = params.clearcoatRoughness;
      glassMaterial.bumpScale = params.grainIntensity;

      edgeMaterial.emissiveIntensity = params.edgeGlow * 0.7;

      renderer.toneMappingExposure = params.exposure;
    }

    // ---------------------------------------------------------------
    // Procedural Scene Randomizer (Upon User Click)
    // ---------------------------------------------------------------
    function randomizeScene() {
      const paletteKeys = Object.keys(PALETTES);
      const chosenKey = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];

      params.scheme = chosenKey;
      applyPalette(chosenKey, 0.8);

      // Re-roll motion & geometric parameters
      params.animSpeed = Number((0.6 + Math.random() * 0.9).toFixed(2));
      params.blobSpeed = Number((0.6 + Math.random() * 1.0).toFixed(2));
      params.roughness = Number((0.2 + Math.random() * 0.15).toFixed(2));
      params.transmission = Number((0.92 + Math.random() * 0.07).toFixed(2));
      params.exposure = Number((0.95 + Math.random() * 0.4).toFixed(2));
      params.lightIntensity = Number((1.0 + Math.random() * 0.5).toFixed(2));
      params.edgeGlow = Number((0.8 + Math.random() * 0.8).toFixed(2));

      blobs.forEach((b) => {
        const scaleVariation = 0.85 + Math.random() * 0.45;
        b.baseScale = scaleVariation;
        b.cfg.ampX = 1.2 + Math.random() * 1.0;
        b.cfg.ampY = 1.0 + Math.random() * 0.8;
      });

      updateAllMaterials(0.8);

      // Instantly update GUI controllers to reflect new state
      if (gui && gui.controllersRecursive) {
        gui.controllersRecursive().forEach((c) => c.updateDisplay());
      }
    }

    // ---------------------------------------------------------------
    // Click & Drag Detection (Dispatches Randomize on Scene Click)
    // ---------------------------------------------------------------
    let downX = 0, downY = 0, downTime = 0;

    function setupPointerEvents(canvasElement) {
      canvasElement.addEventListener('pointerdown', (e) => {
        downX = e.clientX;
        downY = e.clientY;
        downTime = performance.now();
      });

      canvasElement.addEventListener('pointerup', (e) => {
        const dx = e.clientX - downX;
        const dy = e.clientY - downY;
        const dt = performance.now() - downTime;

        // Distinguish click from orbit drag/zoom
        if (Math.hypot(dx, dy) < 6 && dt < 450) {
          if (params.randomizeOnClick) {
            randomizeScene();
          }
        }
      });
    }

    setupPointerEvents(renderer.domElement);

    // ---------------------------------------------------------------
    // Antialias Toggle Implementation
    // ---------------------------------------------------------------
    function recreateRenderer(antialiasEnabled) {
      params.antialias = antialiasEnabled;
      const oldCanvas = renderer.domElement;
      const newRenderer = createRenderer(antialiasEnabled);

      oldCanvas.parentNode.replaceChild(newRenderer.domElement, oldCanvas);
      renderer.dispose();
      renderer = newRenderer;

      controls.domElement = renderer.domElement;
      setupPointerEvents(renderer.domElement);
      updateAllMaterials(0);
    }

    // ---------------------------------------------------------------
    // lil-gui Control Panel (Native styles, English UI)
    // ---------------------------------------------------------------
    const gui = new GUI({ title: 'Frosted Glass Controls' });

    // Color Scheme & Background Folder
    const fTheme = gui.addFolder('Color Theme');
    fTheme.add(params, 'scheme', Object.keys(PALETTES)).name('Color Scheme').onChange((v) => {
      applyPalette(v, 0.6);
      if (gui.controllersRecursive) {
        gui.controllersRecursive().forEach((c) => c.updateDisplay());
      }
    });

    fTheme.add(params, 'greenScreen').name('Greenscreen (#00ff00)').onChange(() => updateAllMaterials(0));
    fTheme.addColor(params, 'bgColor').name('Background Color').onChange(() => updateAllMaterials(0));
    fTheme.addColor(params, 'bgLeft').name('Left Ambient Tint').onChange(() => updateAllMaterials(0));
    fTheme.addColor(params, 'bgRight').name('Right Ambient Tint').onChange(() => updateAllMaterials(0));
    fTheme.add(params, 'randomizeOnClick').name('Randomize On Click');
    fTheme.add({ randomize: randomizeScene }, 'randomize').name('⚡ Randomize Now');

    // Animation Folder
    const fAnim = gui.addFolder('Animation');
    const animOptions = [
      'Static (No Camera Move)',
      'Slow Cinematic Orbit',
      'Gentle Floating Drift',
      'Breathing Depth Zoom',
      'Soft Figure-8 Pan',
      'Subtle Parallax Swivel',
      'Diagonal Glass Glide',
      'Ambient Horizon Sway'
    ];
    fAnim.add(params, 'animation', animOptions).name('Camera Mode');
    fAnim.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    fAnim.add(params, 'blobSpeed', 0.1, 3.0, 0.05).name('Blob Float Speed');

    // Lighting & Exposure Folder
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Exposure').onChange(() => updateAllMaterials(0));
    fLight.add(params, 'lightIntensity', 0.1, 3.0, 0.05).name('Scene Light Intensity').onChange(() => updateAllMaterials(0));

    // Ambient Light
    const fAmb = fLight.addFolder('Ambient Light');
    fAmb.addColor(params, 'ambientColor').name('Color').onChange(() => updateAllMaterials(0));
    fAmb.add(params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(() => updateAllMaterials(0));
    fAmb.close();

    // Key Light
    const fKey = fLight.addFolder('Left Key Light');
    fKey.addColor(params, 'keyLightColor').name('Color').onChange(() => updateAllMaterials(0));
    fKey.add(params, 'keyLightIntensity', 0.0, 6.0, 0.1).name('Intensity').onChange(() => updateAllMaterials(0));
    fKey.add(params, 'keyLightX', -10, 10, 0.2).name('Pos X').onChange(() => updateAllMaterials(0));
    fKey.add(params, 'keyLightY', -10, 10, 0.2).name('Pos Y').onChange(() => updateAllMaterials(0));
    fKey.add(params, 'keyLightZ', -10, 10, 0.2).name('Pos Z').onChange(() => updateAllMaterials(0));
    fKey.close();

    // Fill Light
    const fFill = fLight.addFolder('Right Fill Light');
    fFill.addColor(params, 'fillLightColor').name('Color').onChange(() => updateAllMaterials(0));
    fFill.add(params, 'fillLightIntensity', 0.0, 4.0, 0.1).name('Intensity').onChange(() => updateAllMaterials(0));
    fFill.add(params, 'fillLightX', -10, 10, 0.2).name('Pos X').onChange(() => updateAllMaterials(0));
    fFill.add(params, 'fillLightY', -10, 10, 0.2).name('Pos Y').onChange(() => updateAllMaterials(0));
    fFill.add(params, 'fillLightZ', -10, 10, 0.2).name('Pos Z').onChange(() => updateAllMaterials(0));
    fFill.close();

    // Edge Specular Light
    const fEdgeLight = fLight.addFolder('Edge Specular Light');
    fEdgeLight.addColor(params, 'edgeLightColor').name('Color').onChange(() => updateAllMaterials(0));
    fEdgeLight.add(params, 'edgeLightIntensity', 0.0, 6.0, 0.1).name('Intensity').onChange(() => updateAllMaterials(0));
    fEdgeLight.close();

    // Moving Blobs Folder
    const fBlobs = gui.addFolder('Colored Blobs');
    fBlobs.addColor(params, 'blob1Color').name('Blob 1 (Pink)').onChange(() => updateAllMaterials(0));
    fBlobs.add(params, 'blob1Intensity', 0.0, 6.0, 0.1).name('Blob 1 Intensity').onChange(() => updateAllMaterials(0));
    fBlobs.addColor(params, 'blob2Color').name('Blob 2 (Orange)').onChange(() => updateAllMaterials(0));
    fBlobs.add(params, 'blob2Intensity', 0.0, 6.0, 0.1).name('Blob 2 Intensity').onChange(() => updateAllMaterials(0));
    fBlobs.addColor(params, 'blob3Color').name('Blob 3 (Blue)').onChange(() => updateAllMaterials(0));
    fBlobs.add(params, 'blob3Intensity', 0.0, 6.0, 0.1).name('Blob 3 Intensity').onChange(() => updateAllMaterials(0));
    fBlobs.addColor(params, 'blob4Color').name('Blob 4 (Accent)').onChange(() => updateAllMaterials(0));
    fBlobs.add(params, 'blob4Intensity', 0.0, 6.0, 0.1).name('Blob 4 Intensity').onChange(() => updateAllMaterials(0));
    fBlobs.close();

    // Glass Panel Folder
    const fGlass = gui.addFolder('Glass Panel');
    fGlass.add(params, 'transmission', 0.5, 1.0, 0.01).name('Transmission').onChange(() => updateAllMaterials(0));
    fGlass.add(params, 'roughness', 0.05, 0.7, 0.01).name('Frost Roughness').onChange(() => updateAllMaterials(0));
    fGlass.add(params, 'ior', 1.0, 2.33, 0.01).name('IOR').onChange(() => updateAllMaterials(0));
    fGlass.add(params, 'thickness', 0.1, 3.0, 0.05).name('Thickness').onChange(() => updateAllMaterials(0));
    fGlass.add(params, 'clearcoat', 0.0, 1.0, 0.02).name('Clearcoat').onChange(() => updateAllMaterials(0));
    fGlass.add(params, 'clearcoatRoughness', 0.0, 0.5, 0.01).name('Clearcoat Roughness').onChange(() => updateAllMaterials(0));
    fGlass.add(params, 'grainScale', 1.0, 16.0, 0.5).name('Grain Scale').onChange((v) => {
      grainTexture.repeat.set(v, v);
    });
    fGlass.add(params, 'grainIntensity', 0.0, 0.04, 0.002).name('Grain Bump').onChange(() => updateAllMaterials(0));
    fGlass.addColor(params, 'glassTint').name('Glass Tint').onChange(() => updateAllMaterials(0));
    fGlass.addColor(params, 'edgeColor').name('Edge Line Color').onChange(() => updateAllMaterials(0));
    fGlass.add(params, 'edgeGlow', 0.0, 3.0, 0.05).name('Edge Line Glow').onChange(() => updateAllMaterials(0));

    // Rendering & DPR Folder
    const fRender = gui.addFolder('Rendering');
    fRender.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((v) => {
      renderer.setPixelRatio(v);
    });
    fRender.add(params, 'antialias').name('Antialias').onChange((v) => {
      recreateRenderer(v);
    });

    // ---------------------------------------------------------------
    // Keyboard Shortcut: "H" to Toggle UI
    // ---------------------------------------------------------------
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // ---------------------------------------------------------------
    // Responsive Resize Handler
    // ---------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initial Materials Setup
    updateAllMaterials(0);

    // ---------------------------------------------------------------
    // Continuous Infinite Render Loop
    // ---------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      // Update camera animation
      updateCameraAnimation(elapsedTime, delta);

      // OrbitControls update
      controls.update();

      // Soft fluid floating clouds behind the glass
      const bSpeed = params.blobSpeed;
      blobs.forEach((b) => {
        const c = b.cfg;
        const tx = c.basePos.x + Math.sin(elapsedTime * c.speedX * bSpeed + c.phase) * c.ampX;
        const ty = c.basePos.y + Math.cos(elapsedTime * c.speedY * bSpeed + c.phase * 1.3) * c.ampY;
        const tz = c.basePos.z + Math.sin(elapsedTime * c.speedZ * bSpeed + c.phase * 0.7) * c.ampZ;

        b.mesh.position.set(tx, ty, tz);
        b.light.position.set(tx, ty, tz);

        // Organic pulsating scale
        const s = b.baseScale * (1.0 + Math.sin(elapsedTime * 0.7 * bSpeed + c.phase) * 0.14);
        b.mesh.scale.set(s, s * 1.08, s * 0.94);
      });

      // Render scene
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
