<script type="importmap">
{
  "imports": {

    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",

<script type="module">
import * as THREE from 'three';
import GUI from 'lil-gui';

// =========================================================================================
// POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js with ES fallback)
// =========================================================================================
const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

const godRaysDepthMaskShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float factor = smoothstep(threshold, threshold + 0.15, lum);
  fragColor = vec4(vec3(factor), 1.0);
}
`;

const godRaysGenerateShader = `
precision highp float;
#define TAPS_PER_PASS 6.0

uniform sampler2D inputTexture;
uniform vec3 vSunPositionScreenSpace;
uniform float fStepSize;
uniform float distanceAttenuation;
uniform float maxDensity;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec2 delta = vSunPositionScreenSpace.xy - vUv;
  float dist = length(delta);
  vec2 stepv = fStepSize * delta / max(dist, 0.0001);
  float iters = dist / max(fStepSize, 0.00001);

  vec2 uv = vUv;
  float col = 0.0;
  float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

  float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

  if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

  float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
  fragColor = vec4(vec3(finalVal), 1.0);
}
`;

const anamorphicBrightShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
uniform float smoothWidth;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float alpha = smoothstep(threshold, threshold + smoothWidth, v);
  fragColor = mix(vec4(0.0), color, alpha);
}
`;

const anamorphicBlurShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 resolution;
uniform float samples;
uniform float intensity;
uniform vec3 tintColor;
uniform float bloomRadius;
in vec2 vUv;
out vec4 fragColor;

void main() {
  int halfSamples = max(1, int(samples) / 2);
  float fHalfSamples = float(halfSamples);
  vec2 invSize = 1.0 / resolution;
  vec4 total = vec4(0.0);

  for (int i = -64; i <= 64; i++) {
    if (i < -halfSamples || i > halfSamples) continue;
    float softness = 1.0 - abs(float(i)) / fHalfSamples;
    softness = pow(softness, 2.0);
    vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
    shiftedUV = clamp(shiftedUV, 0.001, 0.999);
    total += texture(inputTexture, shiftedUV) * softness;
  }

  fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
}
`;

const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform sampler2D raysTexture;
uniform sampler2D anamorphicTexture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform bool raysEnabled;
uniform float raysStrength;
uniform vec3 raysColor;
uniform bool anamorphicEnabled;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  if (raysEnabled && raysStrength > 0.001) {
    vec4 r = texture(raysTexture, vUv);
    color.rgb += r.rgb * raysColor * raysStrength;
  }

  if (anamorphicEnabled) {
    vec4 a = texture(anamorphicTexture, vUv);
    color.rgb += a.rgb;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float exposure;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
uniform int visionMode;
uniform float thermalSensitivity;
uniform float nightVisionNoise;
uniform float nightVisionGain;
uniform float crtIntensity;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.0001) return uv;
  vec2 p = uv - 0.5;
  float d = length(p);
  if (d > radius * 1.5) return uv;
  float r = d / max(radius, 0.001);
  float theta = atan(p.y, p.x);
  float rDist = r + strength * (r * r * r);
  return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
}

vec3 ACESFilmicToneMapping(vec3 color) {
  float a = 2.51;
  float b = 0.03;
  float c = 2.43;
  float d = 0.59;
  float e = 0.14;
  return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / gamma);
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}

vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  float amplified = pow(lum * gain, 0.72);
  vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
  phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
  vec2 p = uv - 0.5;
  float tubeDist = length(p);
  float tubeMask = smoothstep(0.72, 0.44, tubeDist);
  float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
  float scanline = sin(uv.y * 650.0) * crt;
  phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
  return clamp(phosphorColor * tubeMask, 0.0, 1.0);
}

vec3 ironbow(float t) {
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3(0.02, 0.01, 0.18);
  vec3 c1 = vec3(0.22, 0.02, 0.48);
  vec3 c2 = vec3(0.82, 0.05, 0.25);
  vec3 c3 = vec3(1.0, 0.62, 0.02);
  vec3 c4 = vec3(1.0, 1.0, 0.92);
  if (t < 0.25) return mix(c0, c1, t * 4.0);
  if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
  if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
  return mix(c3, c4, (t - 0.75) * 4.0);
}

vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  float heat = clamp(lum * sensitivity, 0.0, 1.0);
  float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
  heat = clamp(heat + sensorRaster, 0.0, 1.0);
  if (whiteHot) {
    return vec3(pow(heat, 0.85));
  } else {
    return ironbow(heat);
  }
}

void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  vec3 finalCol = col.rgb;
  
  if (visionMode == 1) {
    finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
  } else if (visionMode == 2) {
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
  } else if (visionMode == 3) {
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
  } else {
    vec3 exposedColor = finalCol * exposure;
    vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
    finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
  }

  fragColor = vec4(finalCol, 1.0);
}
`;

const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

function createFBO(w, h, options = {}) {
  return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
    wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
    wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
    minFilter: options.minFilter || THREE.LinearFilter,
    magFilter: options.magFilter || THREE.LinearFilter,
    format: options.format || THREE.RGBAFormat,
    type: options.type || THREE.HalfFloatType,
    stencilBuffer: options.stencilBuffer || false,
    depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
    samples: options.samples !== undefined ? options.samples : 0,
  });
}

class ShaderPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbo = createFBO(1, 1, options);
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
    this.texture = this.fbo.texture;
  }
  render(renderer, toScreen = false) {
    if (!toScreen) {
      renderer.setRenderTarget(this.fbo);
    }
    renderer.render(this.orthoScene, this.orthoCamera);
    if (!toScreen) {
      renderer.setRenderTarget(null);
    }
  }
  setSize(width, height) {
    this.fbo.setSize(Math.max(1, width), Math.max(1, height));
    this.orthoQuad.scale.set(width, height, 1);
  }
}

class ShaderPingPongPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
    this.currentFBO = 0;
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer) {
    renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
    renderer.render(this.orthoScene, this.orthoCamera);
    renderer.setRenderTarget(null);
    this.currentFBO = 1 - this.currentFBO;
  }
  get current() { return this.fbos[this.currentFBO]; }
  get texture() { return this.current.texture; }
  setSize(width, height) {
    const w = Math.max(1, width);
    const h = Math.max(1, height);
    this.orthoQuad.scale.set(w, h, 1);
    this.fbos[0].setSize(w, h);
    this.fbos[1].setSize(w, h);
  }
}

class BloomPass {
  constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
    this.strength = strength;
    this.radius = radius;
    this.threshold = threshold;
    this.enabled = true;
    this.levels = levels;

    this.brightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        bloomThreshold: { value: this.threshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: brightFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.brightPass = new ShaderPass(this.brightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.blurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        direction: { value: new THREE.Vector2(0, 1) },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: blurFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.blurPasses = [];
    for (let i = 0; i < this.levels; i++) {
      this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType,
      }));
    }
  }

  setSize(w, h) {
    let tw = Math.max(1, w);
    let th = Math.max(1, h);
    this.brightPass.setSize(tw, th);
    for (let i = 0; i < this.levels; i++) {
      tw = Math.max(1, Math.round(tw / 2));
      th = Math.max(1, Math.round(th / 2));
      this.blurPasses[i].setSize(tw, th);
    }
  }

  set source(texture) {
    this.brightShader.uniforms.inputTexture.value = texture;
  }

  render(renderer) {
    if (!this.enabled || this.strength <= 0.001) return;

    this.brightShader.uniforms.bloomThreshold.value = this.threshold;
    this.brightPass.render(renderer);

    const baseOffset = Math.max(0.1, this.radius * 2.0);
    const u = this.blurShader.uniforms;

    for (let j = 0; j < this.levels; j++) {
      const blurPass = this.blurPasses[j];
      const stepOffset = baseOffset * (1.0 + j * 0.5);

      u.direction.value.set(stepOffset, 0);
      u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
      blurPass.render(renderer);

      u.direction.value.set(0, stepOffset * 0.5);
      u.inputTexture.value = blurPass.current.texture;
      blurPass.render(renderer);
    }
  }
}

const VISION_MODE_MAP = {
  'Normal (Cinematic)': 0,
  'Night Vision (Phosphor)': 1,
  'Thermal (Ironbow)': 2,
  'Thermal (White-Hot)': 3,
};

class InlinePostProcessor {
  constructor(renderer, params = {}) {
    this.renderer = renderer;

    this.settings = {
      enabled: params.enabled !== undefined ? params.enabled : true,
      bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
      bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.85,
      bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
      bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.25,

      raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
      raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.75,
      raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
      raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
      raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
      raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
      raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x57aeff),
      raysColorHex: params.raysColorHex || '#57aeff',

      anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
      anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
      anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
      anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
      anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
      anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
      anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x7a8aff),
      anamorphicColorHex: params.anamorphicColorHex || '#7a8aff',

      visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
      thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
      nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
      nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
      crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

      fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
      fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
      chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
      vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
      vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
      noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.01,

      gamma: params.gamma !== undefined ? params.gamma : 1.0,
      minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
      maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
      exposure: params.exposure !== undefined ? params.exposure : 1.0,
    };

    this.sceneTarget = createFBO(1, 1, {
      type: THREE.HalfFloatType,
      samples: Math.min(4, this.renderer.capabilities.maxSamples || 4)
    });

    this.bloomPass = new BloomPass(
      this.settings.bloomStrength,
      this.settings.bloomRadius,
      this.settings.bloomThreshold,
      5
    );

    this.moonScreenPos = new THREE.Vector3(0.5, 0.5, 1.0);
    this.moonInFront = true;

    this.godRaysMaskShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        threshold: { value: this.settings.raysThreshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: godRaysDepthMaskShader,
      glslVersion: THREE.GLSL3,
    });
    this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.godRaysGenShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        vSunPositionScreenSpace: { value: this.moonScreenPos },
        fStepSize: { value: 1.0 },
        distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
        maxDensity: { value: this.settings.raysMaxDensity },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: godRaysGenerateShader,
      glslVersion: THREE.GLSL3,
    });
    this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.anamorphicBrightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        threshold: { value: this.settings.anamorphicThreshold },
        smoothWidth: { value: this.settings.anamorphicSmoothWidth },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: anamorphicBrightShader,
      glslVersion: THREE.GLSL3,
    });
    this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.anamorphicBlurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        resolution: { value: new THREE.Vector2(1, 1) },
        samples: { value: this.settings.anamorphicSamples },
        intensity: { value: this.settings.anamorphicIntensity },
        tintColor: { value: this.settings.anamorphicColor },
        bloomRadius: { value: this.settings.anamorphicRadius },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: anamorphicBlurShader,
      glslVersion: THREE.GLSL3,
    });
    this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.finalShader = new THREE.RawShaderMaterial({
      uniforms: {
        resolution: { value: new THREE.Vector2(1, 1) },
        bloomEnabled: { value: this.settings.bloomEnabled },
        bloomStrength: { value: this.settings.bloomStrength },
        raysEnabled: { value: this.settings.raysEnabled },
        raysStrength: { value: this.settings.raysStrength },
        raysColor: { value: this.settings.raysColor },
        anamorphicEnabled: { value: this.settings.anamorphicEnabled },
        vignetteBoost: { value: this.settings.vignetteBoost },
        vignetteReduction: { value: this.settings.vignetteReduction },
        noiseIntensity: { value: this.settings.noiseIntensity },
        inputTexture: { value: null },
        blur0Texture: { value: null },
        blur1Texture: { value: null },
        blur2Texture: { value: null },
        blur3Texture: { value: null },
        blur4Texture: { value: null },
        raysTexture: { value: null },
        anamorphicTexture: { value: null },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: finalFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.finalPass = new ShaderPass(this.finalShader);

    this.rgbShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: this.finalPass.texture },
        fisheyeStrength: { value: this.settings.fisheyeStrength },
        fisheyeRadius: { value: this.settings.fisheyeRadius },
        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
        minInputLevel: { value: this.settings.minInputLevel },
        maxInputLevel: { value: this.settings.maxInputLevel },
        gammaLevel: { value: this.settings.gamma },
        exposure: { value: this.settings.exposure },
        visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
        thermalSensitivity: { value: this.settings.thermalSensitivity },
        nightVisionGain: { value: this.settings.nightVisionGain },
        nightVisionNoise: { value: this.settings.nightVisionNoise },
        crtIntensity: { value: this.settings.crtIntensity },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: colorFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.rgbPass = new ShaderPass(this.rgbShader);

    this.copyPass = new ShaderPass(
      new THREE.RawShaderMaterial({
        uniforms: { inputTexture: { value: null } },
        vertexShader: orthoVertexShader,
        fragmentShader: copyFragmentShader,
        glslVersion: THREE.GLSL3,
      })
    );
  }

  updateSettings() {
    this.bloomPass.enabled = this.settings.bloomEnabled;
    this.bloomPass.strength = this.settings.bloomStrength;
    this.bloomPass.radius = this.settings.bloomRadius;
    this.bloomPass.threshold = this.settings.bloomThreshold;

    this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
    this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
    this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

    this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
    this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
    this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
    this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
    this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
    this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

    this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
    this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
    this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
    this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
    this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
    this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
    this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
    this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
    this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

    this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
    this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
    this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
    this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
    this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
    this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
    this.rgbShader.uniforms.exposure.value = this.settings.exposure;
    this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
    this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
    this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
    this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
    this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
  }

  setSize(w0, h0, dpr = 1) {
    const w = Math.max(1, Math.floor(w0 * dpr));
    const h = Math.max(1, Math.floor(h0 * dpr));
    this.sceneTarget.setSize(w, h);
    this.finalPass.setSize(w, h);
    this.finalShader.uniforms.resolution.value.set(w, h);
    this.bloomPass.setSize(w, h);

    const grW = Math.max(1, Math.round(w / 2));
    const grH = Math.max(1, Math.round(h / 2));
    this.godRaysMaskPass.setSize(grW, grH);
    this.godRaysPingPong.setSize(grW, grH);

    const anW = Math.max(1, Math.round(w / 4));
    const anH = Math.max(1, Math.round(h / 4));
    this.anamorphicBrightPass.setSize(anW, anH);
    this.anamorphicBlurPass.setSize(anW, anH);
    this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

    this.rgbPass.setSize(w, h);
    this.copyPass.setSize(w, h);
  }

  setMoonScreenPosition(camera, moonWorldPos) {
    if (!this._camDir) {
      this._camDir = new THREE.Vector3();
      this._toMoon = new THREE.Vector3();
      this._ndc = new THREE.Vector3();
    }
    camera.getWorldDirection(this._camDir);
    this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
    const dot = this._camDir.dot(this._toMoon);

    if (dot <= 0.02) {
      this.moonInFront = false;
      this.finalShader.uniforms.raysEnabled.value = false;
      return;
    }

    this.moonInFront = true;
    const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);

    this._ndc.copy(moonWorldPos).project(camera);
    const screenX = this._ndc.x * 0.5 + 0.5;
    const screenY = this._ndc.y * 0.5 + 0.5;
    const screenZ = fade;

    this.moonScreenPos.set(screenX, screenY, screenZ);
    this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
  }

  renderScene(scene, camera) {
    if (!this.settings.enabled) {
      this.renderer.render(scene, camera);
      return;
    }
    this.renderer.setRenderTarget(this.sceneTarget);
    this.renderer.render(scene, camera);
    this.renderer.setRenderTarget(null);
    this.render(this.sceneTarget.texture);
  }

  render(sourceTexture) {
    if (!this.settings.enabled) {
      this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
      this.copyPass.render(this.renderer, true);
      return;
    }

    this.updateSettings();

    this.bloomPass.source = sourceTexture;
    this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
    this.bloomPass.render(this.renderer);

    this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
    this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
    this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
    this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
    this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

    if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
      this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
      this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
      this.godRaysMaskPass.render(this.renderer);

      const filterLen = this.settings.raysDensity;
      const tapsPerPass = 6.0;

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
      this.godRaysPingPong.render(this.renderer);

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
      this.finalPass.shader.uniforms.raysEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.raysEnabled.value = false;
    }

    if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
      this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
      this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
      this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
      this.anamorphicBrightPass.render(this.renderer);

      this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
      this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
      this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
      this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
      this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
      this.anamorphicBlurPass.render(this.renderer);

      this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
      this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
    }

    const randomTime = Math.random() * 100000;
    this.finalPass.shader.uniforms.time.value = randomTime;
    this.rgbPass.shader.uniforms.time.value = randomTime;

    this.finalPass.render(this.renderer);
    this.rgbPass.render(this.renderer, true);
  }

  attachGUI(gui, title = "Post-Processing Suite") {
    const root = gui.addFolder(title);
    root.add(this.settings, "enabled").name("Enable Post-Process");

    const vision = root.addFolder("Thermal & Night Vision");
    vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
    vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Amplification").onChange(() => this.updateSettings());
    vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
    vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
    vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());

    const rays = root.addFolder("Three.js Godrays");
    rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Density (Spread)").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysMaxDensity", 0.1, 1.0, 0.05).name("Max Density").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysDistanceAttenuation", 0.5, 4.0, 0.1).name("Distance Atten").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysThreshold", 0.0, 0.8, 0.01).name("Light Threshold").onChange(() => this.updateSettings());
    rays.addColor(this.settings, "raysColorHex").name("Ray Tint").onChange((v) => {
      this.settings.raysColor.set(v);
      this.updateSettings();
    });

    const anamorphic = root.addFolder("Three.js Anamorphic Flare");
    anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
    anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
      this.settings.anamorphicColor.set(v);
      this.updateSettings();
    });

    const bloom = root.addFolder("Atmospheric Bloom");
    bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

    const lens = root.addFolder("Lens, Optics & Film Grain");
    lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
    lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
    lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
    lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
    lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
    lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
    lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

    return root;
  }
}

// =========================================================================================
// SHADER UNIFORMS & GLSL SOURCES
// =========================================================================================
const uniforms = {
  uReflectionBias: { value: 0 },
  uCapture: { value: false },
  uLinearOutput: { value: postProcessor.settings.enabled },
  uMutualStrength: { value: 0 },
  uTime: { value: 0 },
  uLiquid: { value: params.liquid },
  uFolds: { value: params.folds },
  uWidth: { value: params.width },
  uTwist: { value: params.twist },
  uExposure: { value: params.exposure },
  uSoftness: { value: params.softness },
  uReflection: { value: params.reflection },

  // Scene Lighting Controls
  uSceneLightIntensity: { value: params.sceneLightIntensity },
  uKeyLightIntensity: { value: params.keyLightIntensity },
  uKeyLightColor: { value: new THREE.Color(params.keyLightColor) },
  uFillLightIntensity: { value: params.fillLightIntensity },
  uFillLightColor: { value: new THREE.Color(params.fillLightColor) },
  uVioletIntensity: { value: params.violetLightIntensity },
  uPinkIntensity: { value: params.pinkLightIntensity },
  uCyanIntensity: { value: params.cyanLightIntensity },
  uAmbientIntensity: { value: params.ambientIntensity },

  // Colors
  uCyan: { value: new THREE.Color(params.cyan) },
  uViolet: { value: new THREE.Color(params.violet) },
  uPink: { value: new THREE.Color(params.pink) }
};

const vertexShader = /* glsl */`
uniform float uTime, uLiquid, uFolds, uWidth, uTwist;
uniform vec4 uShape;
uniform float uPhase;
varying vec3 vNormal;
varying vec3 vPosition;
const float TAU = 6.28318530718;

vec3 surface(vec2 coord) {
    float a = coord.x * TAU;
    float b = coord.y * TAU;
    float t = uTime * TAU / 15.0;
    float s = uPhase;
    float flow = a * 3.0 - t + s;
    float wave = sin(flow + 0.48 * sin(a * 5.0 + t));
    float ripple = sin(a * 7.0 + t + s) * 0.55
                 + sin(a * 11.0 - t * 2.0 - s) * 0.25;
    float radial = uLiquid * (0.10 * wave + 0.055 * ripple);
    vec3 center = vec3((uShape.x + radial) * cos(a),
                       (uShape.y + radial) * sin(a),
                       0.16 * uLiquid * sin(a * 4.0 + t + s));
    vec3 outward = normalize(vec3(cos(a) / uShape.x, sin(a) / uShape.y, 0.0));
    vec3 depth = vec3(0.0, 0.0, 1.0);
    float turn = uTwist * (0.65 * sin(a * 2.0 + s)
               + 0.46 * sin(a * 4.0 - t + s));
    vec3 wideAxis = outward * cos(turn) + depth * sin(turn);
    vec3 thinAxis = -outward * sin(turn) + depth * cos(turn);
    float breathing = 1.0 + uLiquid * (0.26 * wave + 0.13 * ripple);
    float width = uShape.z * uWidth * breathing;
    float lateral = cos(b);
    float fold = uFolds * (0.17 * sin(a * 6.0 + 2.0 * lateral - t + s)
               + 0.065 * sin(a * 13.0 + 1.2 * cos(2.0 * b) + t));
    float edge = sin(b);
    float bulge = 1.0 + 0.19 * sin(a * 9.0 + 2.0 * lateral + t + s) * uLiquid;
    return center + wideAxis * width * lateral
        + thinAxis * (uShape.w * bulge * edge + fold * (0.35 + 0.65 * edge * edge));
}
void main() {
    vec3 p = surface(uv);
    float e = 0.00015;
    vec3 tangent = surface(uv + vec2(e, 0.0)) - surface(uv - vec2(e, 0.0));
    vec3 across = surface(uv + vec2(0.0, e)) - surface(uv - vec2(0.0, e));
    vNormal = normalize(mat3(modelMatrix) * normalize(cross(tangent, across)));
    vec4 world = modelMatrix * vec4(p, 1.0);
    vPosition = world.xyz;
    gl_Position = projectionMatrix * viewMatrix * world;
}`;

const fragmentShader = /* glsl */`
uniform float uExposure, uSoftness, uReflection, uMutualStrength, uReflectionBias;
uniform bool uCapture, uLinearOutput;
uniform samplerCube uEnvironment;
uniform vec3 uCyan, uViolet, uPink;
uniform vec3 uKeyLightColor, uFillLightColor;
uniform float uKeyLightIntensity, uFillLightIntensity;
uniform float uVioletIntensity, uPinkIntensity, uCyanIntensity;
uniform float uAmbientIntensity, uSceneLightIntensity;
varying vec3 vNormal;
varying vec3 vPosition;

float panel(vec2 p, vec2 extent, float blur) {
    vec2 d = abs(p) - extent;
    float distance = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
    return 1.0 - smoothstep(-blur, blur, distance);
}

vec3 studio(vec3 r) {
    float azimuth = atan(r.x, r.z);
    float elevation = asin(clamp(r.y, -1.0, 1.0));
    vec2 p = vec2(azimuth, elevation);
    float soft = uSoftness;

    // Ambient / Horizon base radiance
    vec3 color = vec3(0.0015, 0.0015, 0.003) * uAmbientIntensity;
    color += vec3(0.021, 0.019, 0.041) * uAmbientIntensity *
        exp(-3.0 * pow(elevation + 0.55, 2.0));

    float bend = 0.12 * sin(azimuth * 1.8);
    vec2 stripe = vec2(azimuth + 0.25, elevation - 0.48 - bend);

    // Dynamic Colored Studio Panels
    color += uViolet * (0.82 * uVioletIntensity) * panel(stripe + vec2(0.0, 0.13), vec2(1.9, 0.18), soft + 0.11);
    color += uPink * (0.90 * uPinkIntensity) * panel(stripe + vec2(0.0, 0.025), vec2(1.7, 0.078), soft + 0.042);
    color += uCyan * (1.05 * uCyanIntensity) * panel(stripe - vec2(0.0, 0.075), vec2(1.8, 0.047), soft + 0.035);

    color += uViolet * (0.75 * uVioletIntensity) * panel(p - vec2(1.1, -0.26), vec2(0.32, 0.62), soft + 0.14);
    color += uPink * (0.70 * uPinkIntensity) * panel(p - vec2(1.48, -0.16), vec2(0.075, 0.6), soft + 0.045);
    color += uCyan * (0.75 * uCyanIntensity) * panel(p - vec2(-2.4, 0.05), vec2(0.065, 1.1), soft + 0.025);

    // Key Light Source (Specular central stripe)
    color += uKeyLightColor * (1.65 * uKeyLightIntensity) * panel(stripe, vec2(1.65, 0.040), soft + 0.012);

    // Fill / Rim Light Source (Diffuse soft panel)
    color += uFillLightColor * (1.55 * uFillLightIntensity) * panel(p - vec2(-1.25, 0.1), vec2(0.15, 0.7), soft + 0.08);

    return color * uSceneLightIntensity;
}

void main() {
    vec3 n = normalize(vNormal);
    vec3 view = uCapture
        ? normalize(cameraPosition - vPosition)
        : vec3(0.0, 0.0, 1.0);
    if (dot(n, view) < 0.0) n = -n;
    vec3 reflected = reflect(-view, n);
    vec3 color = studio(reflected) * uReflection;

    // Cubemaps contain only the other forms, with transparent empty space
    if (!uCapture && uMutualStrength > 0.0) {
        vec4 reflectedForms = textureCube(uEnvironment, reflected, uReflectionBias);
        color = color * (1.0 - reflectedForms.a * uMutualStrength)
              + reflectedForms.rgb * uMutualStrength;
    }
    float facing = max(dot(n, view), 0.0);
    color *= 0.78 + 0.22 * pow(1.0 - facing, 5.0);

    // If capturing cubemaps or sending to PostProcessor, preserve linear radiance
    if (uCapture || uLinearOutput) {
        gl_FragColor = vec4(color * uExposure, 1.0);
        return;
    }

    // Standalone fallback tone mapping
    color *= uExposure;
    color = (color * (2.51 * color + 0.03)) /
            (color * (2.43 * color + 0.59) + 0.14);
    gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
    #include <colorspace_fragment>
}`;

// =========================================================================================
// MESHES & ENVIRONMENT REFLECTION PROBES
// =========================================================================================
const geometry = new THREE.PlaneGeometry(1, 1, 384, 64);
const reflectionGeometry = new THREE.PlaneGeometry(1, 1, 160, 48);
const materials = [];
let reflectionsDirty = true;
let lastReflectionTime = -Infinity;

function addArch(settings) {
  const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: {
      ...uniforms,
      uEnvironment: { value: null },
      uShape: { value: new THREE.Vector4() },
      uPhase: { value: settings.phase }
    },
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.frustumCulled = false;
  objectsGroup.add(mesh);
  materials.push(material);

  function update() {
    reflectionsDirty = true;
    mesh.position.set(settings.x, settings.y, settings.z);
    mesh.rotation.set(
      THREE.MathUtils.degToRad(settings.rotationX),
      THREE.MathUtils.degToRad(settings.rotationY),
      THREE.MathUtils.degToRad(settings.rotationZ)
    );
    material.uniforms.uShape.value.set(
      settings.radiusX, settings.radiusY, settings.width, settings.thickness
    );
  }
  update();
  return { mesh, settings, update };
}

const forms = params.forms.map(addArch);
const reflectionClearColor = new THREE.Color();
const reflectionProbes = [];

function createReflectionProbes() {
  const scale = params.reflectionAntiAliasing ? 2 : 1;
  const captureSize = params.reflectionResolution * scale;
  uniforms.uReflectionBias.value = params.reflectionAntiAliasing ? 1 : 0;
  uniforms.uMutualStrength.value = 0;
  for (const form of forms) form.mesh.material.uniforms.uEnvironment.value = null;
  for (const probe of reflectionProbes) probe.target.dispose();
  reflectionProbes.length = 0;

  for (const form of forms) {
    const target = new THREE.WebGLCubeRenderTarget(captureSize, {
      type: THREE.HalfFloatType,
      format: THREE.RGBAFormat,
      minFilter: params.reflectionAntiAliasing
        ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      generateMipmaps: params.reflectionAntiAliasing,
      depthBuffer: true
    });
    target.texture.colorSpace = THREE.LinearSRGBColorSpace;
    const cubeCamera = new THREE.CubeCamera(0.03, 100, target);
    reflectionProbes.push({ form, target, camera: cubeCamera });
  }
  reflectionsDirty = true;
  lastReflectionTime = -Infinity;
}
createReflectionProbes();

const probePosTemp = new THREE.Vector3();
function updateReflections(now) {
  if (!params.mutualReflections || params.reflectionStrength === 0) {
    uniforms.uMutualStrength.value = 0;
    return;
  }
  const moving = !params.paused && params.speed > 0;
  if (!reflectionsDirty && (!moving || now - lastReflectionTime < 1000 / params.reflectionFPS)) return;

  const oldTarget = renderer.getRenderTarget();
  const oldFace = renderer.getActiveCubeFace();
  const oldMip = renderer.getActiveMipmapLevel();
  const oldAlpha = renderer.getClearAlpha();
  renderer.getClearColor(reflectionClearColor);
  renderer.setClearColor(0x000000, 0);
  uniforms.uCapture.value = true;

  for (const form of forms) {
    form.mesh.material.uniforms.uEnvironment.value = null;
    form.mesh.geometry = reflectionGeometry;
  }
  try {
    for (const probe of reflectionProbes) {
      probe.form.mesh.getWorldPosition(probePosTemp);
      probe.camera.position.copy(probePosTemp);
      probe.form.mesh.visible = false;
      try {
        probe.camera.update(renderer, scene);
      } finally {
        probe.form.mesh.visible = true;
      }
    }
  } finally {
    uniforms.uCapture.value = false;
    for (const probe of reflectionProbes) {
      probe.form.mesh.geometry = geometry;
      probe.form.mesh.material.uniforms.uEnvironment.value = probe.target.texture;
    }
    renderer.setRenderTarget(oldTarget, oldFace, oldMip);
    renderer.setClearColor(reflectionClearColor, oldAlpha);
  }
  uniforms.uMutualStrength.value = params.reflectionStrength;
  reflectionsDirty = false;
  lastReflectionTime = now;
}

// =========================================================================================
// RESIZING, DPR & VIEWPORT LOGIC
// =========================================================================================
function updateBackground() {
  const col = params.greenScreen ? params.greenScreenColor : params.background;
  renderer.setClearColor(col);
}

function resize() {
  const width = window.innerWidth, height = window.innerHeight;
  const aspect = width / height;
  const viewHeight = 6 / params.zoom;
  camera.left = -viewHeight * aspect / 2;
  camera.right = viewHeight * aspect / 2;
  camera.top = viewHeight / 2;
  camera.bottom = -viewHeight / 2;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(params.dpr);
  renderer.setSize(width, height);
  if (postProcessor) {
    postProcessor.setSize(width, height, params.dpr);
  }
}
window.addEventListener('resize', resize);
resize();

// =========================================================================================
// COLOR SCHEME APPLICATION
// =========================================================================================
function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;

  params.cyan = scheme.cyan;
  params.violet = scheme.violet;
  params.pink = scheme.pink;
  params.background = scheme.background;
  params.keyLightColor = scheme.keyLightColor || '#ffffff';
  params.fillLightColor = scheme.fillLightColor || '#f0f5ff';

  uniforms.uCyan.value.set(params.cyan);
  uniforms.uViolet.value.set(params.violet);
  uniforms.uPink.value.set(params.pink);
  uniforms.uKeyLightColor.value.set(params.keyLightColor);
  uniforms.uFillLightColor.value.set(params.fillLightColor);

  updateBackground();
  reflectionsDirty = true;
}

// =========================================================================================
// PROCEDURAL RANDOM GENERATOR (Triggered on canvas click)
// =========================================================================================
function randomizeScene() {
  // 1. Randomize Visual Color Theme from 19 schemes
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const picked = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  params.colorScheme = picked;
  applyColorScheme(picked);

  // 2. Randomize Geometry Parameters
  params.liquid = +(0.5 + Math.random() * 0.9).toFixed(2);
  params.folds = +(0.4 + Math.random() * 1.0).toFixed(2);
  params.width = +(0.65 + Math.random() * 0.65).toFixed(2);
  params.twist = +(0.4 + Math.random() * 1.0).toFixed(2);
  params.exposure = +(0.85 + Math.random() * 0.45).toFixed(2);
  params.softness = +(0.05 + Math.random() * 0.08).toFixed(3);
  params.reflection = +(0.8 + Math.random() * 0.8).toFixed(2);

  uniforms.uLiquid.value = params.liquid;
  uniforms.uFolds.value = params.folds;
  uniforms.uWidth.value = params.width;
  uniforms.uTwist.value = params.twist;
  uniforms.uExposure.value = params.exposure;
  uniforms.uSoftness.value = params.softness;
  uniforms.uReflection.value = params.reflection;

  // 3. Re-roll Form Parameters
  forms.forEach((form, index) => {
    const def = DEFAULTS.forms[index];
    form.settings.radiusX = +(def.radiusX * (0.85 + Math.random() * 0.35)).toFixed(2);
    form.settings.radiusY = +(def.radiusY * (0.85 + Math.random() * 0.35)).toFixed(2);
    form.settings.width = +(def.width * (0.85 + Math.random() * 0.35)).toFixed(3);
    form.settings.thickness = +(def.thickness * (0.85 + Math.random() * 0.35)).toFixed(3);
    form.settings.rotationZ = +(def.rotationZ + (Math.random() - 0.5) * 50).toFixed(1);
    form.settings.phase = +(Math.random() * 6.28).toFixed(2);
    form.update();
  });

  // 4. Randomize Motion Speed & Smooth Animation Preset
  params.speed = +(0.65 + Math.random() * 0.85).toFixed(2);
  const smoothAnims = ANIMATION_MODES.filter(m => m !== 'Static (No Camera Movement)');
  params.animationMode = smoothAnims[Math.floor(Math.random() * smoothAnims.length)];

  // 5. Randomize Light Intensities
  params.sceneLightIntensity = +(0.85 + Math.random() * 0.45).toFixed(2);
  params.keyLightIntensity = +(0.85 + Math.random() * 0.45).toFixed(2);
  params.fillLightIntensity = +(0.75 + Math.random() * 0.45).toFixed(2);
  uniforms.uSceneLightIntensity.value = params.sceneLightIntensity;
  uniforms.uKeyLightIntensity.value = params.keyLightIntensity;
  uniforms.uFillLightIntensity.value = params.fillLightIntensity;

  reflectionsDirty = true;

  // 6. Update Control Panel Controllers without altering PostProcessing
  gui.controllersRecursive().forEach(c => c.updateDisplay());
}

// =========================================================================================
// MOUSE WHEEL ZOOM & DRAG INTERACTION
// =========================================================================================
let isPointerDown = false;
let pointerStartX = 0, pointerStartY = 0;
let lastPointerX = 0, lastPointerY = 0;
let hasDragged = false;

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('.lil-gui')) return;
  if (e.target !== renderer.domElement) return;
  isPointerDown = true;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  hasDragged = false;
});

window.addEventListener('pointermove', (e) => {
  if (!isPointerDown) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  if (Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY) > 5) {
    hasDragged = true;
  }
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  const aspect = window.innerWidth / window.innerHeight;
  const viewHeight = 6 / params.zoom;
  const viewWidth = viewHeight * aspect;

  params.panX += (dx / window.innerWidth) * viewWidth;
  params.panY -= (dy / window.innerHeight) * viewHeight;
  objectsGroup.position.x = params.panX;
  objectsGroup.position.y = params.panY;
  reflectionsDirty = true;
  if (controllers.panX) controllers.panX.updateDisplay();
  if (controllers.panY) controllers.panY.updateDisplay();
});

window.addEventListener('pointerup', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;
  if (!hasDragged && params.clickRandomize) {
    if (!e.target.closest || !e.target.closest('.lil-gui')) {
      randomizeScene();
    }
  }
});

// Wheel zoom with clamp and instant camera frustum recalculation
window.addEventListener('wheel', (e) => {
  if (e.target.closest && e.target.closest('.lil-gui')) return;
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.08 : 0.925;
  params.zoom = Math.min(Math.max(params.zoom * zoomFactor, 0.2), 4.0);
  resize();
  if (controllers.zoom) controllers.zoom.updateDisplay();
}, { passive: false });

// Keyboard shortcut: Press "H" to toggle visibility of lil-gui
let guiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
    guiVisible = !guiVisible;
    gui.domElement.style.display = guiVisible ? '' : 'none';
  }
});

// =========================================================================================
// PRECONFIGURED ANIMATION LOOP EVALUATOR
// =========================================================================================
function updateAnimation(t) {
  let animOffsetX = 0;
  let animOffsetY = 0;
  let animRotZ = 0;

  switch (params.animationMode) {
    case 'Fluid Drift (Default)': {
      animOffsetX = Math.sin(t * 0.35) * 0.45;
      animOffsetY = Math.cos(t * 0.28) * 0.35;
      uniforms.uLiquid.value = params.liquid * (1.0 + 0.12 * Math.sin(t * 0.5));
      uniforms.uWidth.value = params.width * (1.0 + 0.06 * Math.cos(t * 0.4));
      uniforms.uFolds.value = params.folds;
      uniforms.uTwist.value = params.twist;
      break;
    }
    case 'Liquid Waltz (Slow Orbit)': {
      animOffsetX = Math.cos(t * 0.22) * 0.7;
      animOffsetY = Math.sin(t * 0.22) * 0.5;
      animRotZ = Math.sin(t * 0.15) * 0.08;
      uniforms.uLiquid.value = params.liquid * (1.0 + 0.15 * Math.sin(t * 0.3));
      uniforms.uWidth.value = params.width;
      uniforms.uFolds.value = params.folds;
      uniforms.uTwist.value = params.twist;
      break;
    }
    case 'Deep Tidal Swell (Breathing Resonator)': {
      const swell = Math.sin(t * 0.4);
      animOffsetX = Math.sin(t * 0.2) * 0.2;
      animOffsetY = Math.cos(t * 0.25) * 0.15;
      uniforms.uLiquid.value = params.liquid * (1.0 + 0.2 * swell);
      uniforms.uWidth.value = params.width * (1.0 + 0.18 * swell);
      uniforms.uFolds.value = params.folds * (1.0 + 0.25 * Math.cos(t * 0.4));
      uniforms.uTwist.value = params.twist;
      break;
    }
    case 'Gentle Mobius Weave (Torsional Twist)': {
      const twistWave = Math.sin(t * 0.45);
      animOffsetX = Math.sin(t * 0.3) * 0.35;
      animOffsetY = Math.sin(t * 0.6) * 0.2;
      uniforms.uTwist.value = params.twist * (1.0 + 0.35 * twistWave);
      uniforms.uLiquid.value = params.liquid * (1.0 + 0.1 * Math.cos(t * 0.3));
      uniforms.uWidth.value = params.width;
      uniforms.uFolds.value = params.folds;
      break;
    }
    case 'Hypnotic Ripple (Radial Resonance)': {
      const ripple = Math.sin(t * 0.6);
      animOffsetX = Math.cos(t * 0.3) * 0.25;
      animOffsetY = Math.sin(t * 0.35) * 0.25;
      uniforms.uFolds.value = params.folds * (1.0 + 0.32 * ripple);
      uniforms.uLiquid.value = params.liquid * (1.0 + 0.18 * Math.cos(t * 0.5));
      uniforms.uWidth.value = params.width;
      uniforms.uTwist.value = params.twist;
      break;
    }
    case 'Cosmic Float (Zero-Gravity Levitation)': {
      animOffsetX = Math.sin(t * 0.25) * 0.5 + Math.sin(t * 0.11) * 0.2;
      animOffsetY = Math.cos(t * 0.2) * 0.4 + Math.cos(t * 0.13) * 0.2;
      animRotZ = Math.sin(t * 0.18) * 0.05;
      uniforms.uLiquid.value = params.liquid;
      uniforms.uWidth.value = params.width;
      uniforms.uFolds.value = params.folds;
      uniforms.uTwist.value = params.twist;
      break;
    }
    case 'Centrifugal Dream (Slow Spiral Flow)': {
      animOffsetX = Math.sin(t * 0.3) * 0.65;
      animOffsetY = Math.cos(t * 0.45) * 0.35;
      animRotZ = Math.sin(t * 0.25) * 0.12;
      uniforms.uLiquid.value = params.liquid * (1.0 + 0.15 * Math.sin(t * 0.4));
      uniforms.uTwist.value = params.twist * (1.0 + 0.2 * Math.cos(t * 0.35));
      uniforms.uWidth.value = params.width;
      uniforms.uFolds.value = params.folds;
      break;
    }
    case 'Static (No Camera Movement)':
    default: {
      animOffsetX = 0;
      animOffsetY = 0;
      animRotZ = 0;
      uniforms.uLiquid.value = params.liquid;
      uniforms.uWidth.value = params.width;
      uniforms.uFolds.value = params.folds;
      uniforms.uTwist.value = params.twist;
      break;
    }
  }

  objectsGroup.position.x = params.panX + animOffsetX;
  objectsGroup.position.y = params.panY + animOffsetY;
  objectsGroup.rotation.z = animRotZ;
}

// =========================================================================================
// LIL-GUI CONTROL PANEL INTEGRATION
// =========================================================================================
const gui = new GUI({ title: 'Liquid Rings Settings', width: 300 });
const controllers = {};

// 1. Animation Folder
const fAnimation = gui.addFolder('Animation');
controllers.animationMode = fAnimation.add(params, 'animationMode', ANIMATION_MODES).name('Preset');
controllers.speed = fAnimation.add(params, 'speed', 0, 3, 0.01).name('Speed');
controllers.paused = fAnimation.add(params, 'paused').name('Pause');

// 2. Color Palette & Greenscreen
const fColors = gui.addFolder('Color Palette');
controllers.colorScheme = fColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
  .name('Scheme')
  .onChange(applyColorScheme);

controllers.greenScreen = fColors.add(params, 'greenScreen')
  .name('Greenscreen (#00ff00)')
  .onChange(updateBackground);

controllers.cyan = fColors.addColor(params, 'cyan').name('Primary (Cyan)').onChange(v => uniforms.uCyan.value.set(v));
controllers.violet = fColors.addColor(params, 'violet').name('Secondary (Violet)').onChange(v => uniforms.uViolet.value.set(v));
controllers.pink = fColors.addColor(params, 'pink').name('Accent (Pink)').onChange(v => uniforms.uPink.value.set(v));
controllers.background = fColors.addColor(params, 'background').name('Background').onChange(updateBackground);

// 3. Lighting & Exposure Folder
const fLighting = gui.addFolder('Lighting & Exposure');
controllers.exposure = fLighting.add(params, 'exposure', 0.2, 3.0, 0.01)
  .name('Exposure')
  .onChange(v => uniforms.uExposure.value = v);

controllers.sceneLightIntensity = fLighting.add(params, 'sceneLightIntensity', 0.1, 3.0, 0.01)
  .name('Scene Light Intensity')
  .onChange(v => uniforms.uSceneLightIntensity.value = v);

controllers.keyLightIntensity = fLighting.add(params, 'keyLightIntensity', 0.0, 3.0, 0.01)
  .name('Key Stripe Light')
  .onChange(v => uniforms.uKeyLightIntensity.value = v);

controllers.keyLightColor = fLighting.addColor(params, 'keyLightColor')
  .name('Key Light Color')
  .onChange(v => uniforms.uKeyLightColor.value.set(v));

controllers.fillLightIntensity = fLighting.add(params, 'fillLightIntensity', 0.0, 3.0, 0.01)
  .name('Fill Panel Light')
  .onChange(v => uniforms.uFillLightIntensity.value = v);

controllers.fillLightColor = fLighting.addColor(params, 'fillLightColor')
  .name('Fill Light Color')
  .onChange(v => uniforms.uFillLightColor.value.set(v));

controllers.violetLightIntensity = fLighting.add(params, 'violetLightIntensity', 0.0, 3.0, 0.01)
  .name('Violet Light Level')
  .onChange(v => uniforms.uVioletIntensity.value = v);

controllers.pinkLightIntensity = fLighting.add(params, 'pinkLightIntensity', 0.0, 3.0, 0.01)
  .name('Pink Light Level')
  .onChange(v => uniforms.uPinkIntensity.value = v);

controllers.cyanLightIntensity = fLighting.add(params, 'cyanLightIntensity', 0.0, 3.0, 0.01)
  .name('Cyan Light Level')
  .onChange(v => uniforms.uCyanIntensity.value = v);

controllers.ambientIntensity = fLighting.add(params, 'ambientIntensity', 0.0, 3.0, 0.01)
  .name('Ambient Intensity')
  .onChange(v => uniforms.uAmbientIntensity.value = v);

// 4. Geometry Folder
const fGeometry = gui.addFolder('Geometry');
function controlGeom(folder, key, label, uniformKey, min, max, step) {
  controllers[key] = folder.add(params, key, min, max, step).name(label)
    .onChange(value => { uniforms[uniformKey].value = value; reflectionsDirty = true; });
}
controlGeom(fGeometry, 'liquid', 'Liquid Motion', 'uLiquid', 0, 1.8, 0.01);
controlGeom(fGeometry, 'folds', 'Folds', 'uFolds', 0, 1.8, 0.01);
controlGeom(fGeometry, 'width', 'Width', 'uWidth', 0.4, 1.6, 0.01);
controlGeom(fGeometry, 'twist', 'Twist', 'uTwist', 0, 1.8, 0.01);

// 5. Individual Forms Configuration Folder
const formControls = gui.addFolder('Forms');
forms.forEach((form, index) => {
  const folder = formControls.addFolder(`Form ${index + 1}`);
  const position = folder.addFolder('Position');
  const rotation = folder.addFolder('Rotation');
  const geomFolder = folder.addFolder('Dimensions');

  for (const axis of ['x', 'y', 'z']) {
    position.add(form.settings, axis, -12, 12, 0.01)
      .name(axis.toUpperCase()).onChange(form.update);
  }
  for (const axis of ['X', 'Y', 'Z']) {
    rotation.add(form.settings, `rotation${axis}`, -180, 180, 0.1)
      .name(`${axis} (deg)`).onChange(form.update);
  }
  for (const [key, label, min, max, step] of [
    ['radiusX', 'Radius X', 0.8, 8, 0.01],
    ['radiusY', 'Radius Y', 0.8, 8, 0.01],
    ['width', 'Width', 0.05, 0.8, 0.005],
    ['thickness', 'Thickness', 0.02, 0.4, 0.001]
  ]) {
    geomFolder.add(form.settings, key, min, max, step)
      .name(label).onChange(form.update);
  }
  folder.add({ reset() {
    Object.assign(form.settings, DEFAULTS.forms[index]);
    form.update();
    folder.controllersRecursive().forEach(controller => controller.updateDisplay());
  } }, 'reset').name('Reset Form');
  folder.close();
});
formControls.close();

// 6. Camera & Drag View Controls
const fCamera = gui.addFolder('Camera & Pan');
controllers.zoom = fCamera.add(params, 'zoom', 0.2, 4.0, 0.01).name('Zoom').onChange(resize);
controllers.panX = fCamera.add(params, 'panX', -15.0, 15.0, 0.01).name('Pan X').onChange(() => {
  objectsGroup.position.x = params.panX;
  reflectionsDirty = true;
});
controllers.panY = fCamera.add(params, 'panY', -15.0, 15.0, 0.01).name('Pan Y').onChange(() => {
  objectsGroup.position.y = params.panY;
  reflectionsDirty = true;
});
fCamera.add({ resetView() {
  params.zoom = 1.0;
  params.panX = 0.0;
  params.panY = 0.0;
  objectsGroup.position.set(0, 0, 0);
  resize();
  controllers.zoom.updateDisplay();
  controllers.panX.updateDisplay();
  controllers.panY.updateDisplay();
} }, 'resetView').name('Reset Camera View');

// 7. Material Optics
const metal = gui.addFolder('Material Optics');
controllers.reflection = metal.add(params, 'reflection', 0.2, 2.5, 0.01).name('Reflections')
  .onChange(v => { uniforms.uReflection.value = v; reflectionsDirty = true; });
controllers.softness = metal.add(params, 'softness', 0.005, 0.2, 0.001).name('Reflection Softness')
  .onChange(v => { uniforms.uSoftness.value = v; reflectionsDirty = true; });

// 8. Mutual Reflections
const reflections = gui.addFolder('Mutual Reflections');
reflections.add(params, 'mutualReflections').name('Enabled');
reflections.add(params, 'reflectionStrength', 0, 1, 0.01).name('Strength');
reflections.add(params, 'reflectionAntiAliasing').name('Probe AA').onChange(createReflectionProbes);
reflections.add(params, 'reflectionResolution', [128, 256, 512]).name('Probe Resolution').onChange(createReflectionProbes);
reflections.add(params, 'reflectionFPS', [15, 30, 60]).name('Probe FPS');
reflections.close();

// 9. Interaction & Procedural Randomize
const fInteraction = gui.addFolder('Procedural Interaction');
controllers.clickRandomize = fInteraction.add(params, 'clickRandomize').name('Click to Randomize');
fInteraction.add({ randomizeScene }, 'randomizeScene').name('🎲 Randomize Scene');

// 10. Performance & Antialiasing
const fPerformance = gui.addFolder('Performance');
controllers.antiAliasing = fPerformance.add(params, 'antiAliasing').name('Scene Antialiasing')
  .onChange(v => {
    const samples = v ? Math.min(4, renderer.capabilities.maxSamples || 4) : 0;
    if (postProcessor && postProcessor.sceneTarget) {
      postProcessor.sceneTarget.dispose();
      postProcessor.sceneTarget = createFBO(1, 1, {
        type: THREE.HalfFloatType,
        samples: samples
      });
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    }
  });

controllers.dpr = fPerformance.add(params, 'dpr', 0.5, 3.0, 0.1)
  .name('DPR (Pixel Ratio)')
  .onChange(resize);

// 11. PostProcessing Suite Integration
postProcessor.attachGUI(gui, 'Post-Processing Suite (PostProcessor.js)');

gui.onChange(() => {
  reflectionsDirty = true;
  uniforms.uLinearOutput.value = postProcessor.settings.enabled;
});
gui.close();

// =========================================================================================
// MAIN ANIMATION LOOP
// =========================================================================================
let lastTime = performance.now();
let animTime = 0;
let visible = true;

const observer = new IntersectionObserver(entries => {
  visible = entries[0].isIntersecting;
  lastTime = performance.now();
});
observer.observe(renderer.domElement);
document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

renderer.setAnimationLoop(now => {
  const delta = Math.min(Math.max((now - lastTime) / 1000, 0), 0.05);
  lastTime = now;
  if (document.hidden || !visible) return;

  if (!params.paused) {
    animTime += delta * params.speed;
    uniforms.uTime.value = (uniforms.uTime.value + delta * params.speed) % 15;
  }

  updateAnimation(animTime);
  updateReflections(now);

  postProcessor.setMoonScreenPosition(camera, objectsGroup.position);

  if (postProcessor.settings.enabled) {
    postProcessor.renderScene(scene, camera);
  } else {
    renderer.render(scene, camera);
  }
});

// Cleanup on unload
window.addEventListener('pagehide', event => {
  if (event.persisted) return;
  renderer.setAnimationLoop(null);
  observer.disconnect();
  geometry.dispose();
  reflectionGeometry.dispose();
  for (const probe of reflectionProbes) probe.target.dispose();
  materials.forEach(material => material.dispose());
  gui.destroy();
  renderer.dispose();
});
</script>
