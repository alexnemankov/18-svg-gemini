<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L-System Tree & SVG Customizer</title>
  <script type="importmap">
    {
      "imports": {
        "./three": "https://assets.codepen.io/25387/three.webgpu.min.js",
        "./three/webgl": "https://esm.sh/three@0.172.0/src/renderers/WebGLRenderer.js",
        "./three/tsl": "https://assets.codepen.io/25387/three.tsl.js",
        "./three/addons/": "https://esm.sh/three@0.172.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }
    canvas {
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <input type="file" id="svgFileInput" accept=".svg" style="display: none;" />

  <script type="module">
    import * as THREE from './three'
    import { WebGLRenderer } from './three/webgl'
    import * as BufferGeometryUtils from './three/addons/utils/BufferGeometryUtils.js'
    import { OrbitControls } from './three/addons/controls/OrbitControls.js'
    import { SVGLoader } from './three/addons/loaders/SVGLoader.js'
    import GUI from 'lil-gui'

    // Color Scheme Presets
    const colorSchemes = {
      'Bioluminescent Neon': {
        lightColor: '#00ffcc',
        branchBaseColor: '#050510',
        sceneBGColor: '#050510'
      },
      'Cyberpunk Pulse': {
        lightColor: '#ff007f',
        branchBaseColor: '#0f021a',
        sceneBGColor: '#07000e'
      },
      'Golden Amber': {
        lightColor: '#ffaa00',
        branchBaseColor: '#080400',
        sceneBGColor: '#080400'
      },
      'Deep Ocean Light': {
        lightColor: '#0088ff',
        branchBaseColor: '#010d18',
        sceneBGColor: '#010d18'
      },
      'Emerald Forest': {
        lightColor: '#39ff14',
        branchBaseColor: '#02140a',
        sceneBGColor: '#02140a'
      }
    }

    const settings = {
      colorScheme: 'Bioluminescent Neon',
      greenscreen: false,
      lightColor: colorSchemes['Bioluminescent Neon'].lightColor,
      branchBaseColor: colorSchemes['Bioluminescent Neon'].branchBaseColor,
      sceneBGColor: colorSchemes['Bioluminescent Neon'].sceneBGColor,
      
      dpr: Math.min(window.devicePixelRatio, 2),
      animationPreset: 'Gentle Sway',
      animationSpeed: 1.0,
      
      iterations: 14,
      rules: {
        'X': 'F[-FY][+FY]',
        'Y': 'F[&FX][^FX]'
      },
      axiom: 'FFFX',
      flow: true,
      flowDirection: 1,
      flowSpeed: 1,
      pulseWidth: 1.3,
      pulseInterval: 3,
      minAngle: 15, 
      maxAngle: 35,
      coneFactor: 0.9,
      initialLength: 1.2,
      minLengthFactor: 0.2,
      maxLengthFactor: 0.8,
      initialThickness: 0.75,
      thicknessFactor: .9,

      uploadSVG: () => {
        document.getElementById('svgFileInput').click()
      },
      resetToTree: () => {
        currentFormMode = 'tree'
        updateActiveMesh()
      }
    }

    let currentFormMode = 'tree' // 'tree' or 'svg'
    let customSvgGeometry = null

    const { degToRad, randFloat } = THREE.MathUtils

    // Scene & Camera setup
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(settings.greenscreen ? '#00ff00' : settings.sceneBGColor)

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    )
    camera.position.set(0, 0, 20)

    // Renderer setup
    const renderer = new WebGLRenderer({ antialias: true })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(settings.dpr)
    document.body.appendChild(renderer.domElement)

    // Orbit Controls for Zoom & Drag
    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true
    controls.dampingFactor = 0.05
    controls.enableZoom = true
    controls.enablePan = true
    controls.target.set(0, 10, 0)
    controls.enabled = true

    // Compute initial L-System string
    let fullAxiom = settings.axiom
    for (let i = 0; i < settings.iterations; i++) {
      fullAxiom = fullAxiom.split('').map(char => settings.rules[char] || char).join('')
    }

    // Custom shader material for glowing flow effect
    const flowingLightMaterial = new THREE.ShaderMaterial({
      defines: {
        FLOW_UPSTREAM: settings.flowDirection === 1
      },
      uniforms: {
        uTime: { value: 0 },
        uFlowSpeed: { value: settings.flowSpeed },
        uPulseWidth: { value: settings.pulseWidth },
        uPulseInterval: { value: settings.pulseInterval },
        uLightColor: { value: new THREE.Color(settings.lightColor) },
        uBaseColor: { value: new THREE.Color(settings.branchBaseColor) }
      },
      vertexShader: `
        attribute float aProgress;
        varying float vProgress;
        varying vec3 vNormal;
        void main() {
          vProgress = aProgress;
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uFlowSpeed;
        uniform float uPulseWidth;
        uniform float uPulseInterval;
        uniform vec3 uLightColor;
        uniform vec3 uBaseColor;
        varying float vProgress;
        varying vec3 vNormal;

        void main() {
          #ifdef FLOW_UPSTREAM
            float wave = mod(vProgress - uTime * uFlowSpeed, uPulseInterval);
            float pulse = smoothstep(uPulseInterval - uPulseWidth, uPulseInterval, wave);
          #else
            float wave = mod(vProgress + uTime * uFlowSpeed, uPulseInterval);
            float pulse = smoothstep(uPulseInterval - uPulseWidth, uPulseInterval, wave);
          #endif

          vec3 finalColor = mix(uBaseColor, uLightColor * 2.5, pulse);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `
    })

    // Generate Tree Geometry
    function generateLSystemTree(string) {
      const geometries = []
      const stateStack = []

      let position = new THREE.Vector3(0, 0, 0)
      let direction = new THREE.Vector3(0, 1, 0)
      let currentProgress = 0.0

      for (let i = 0; i < string.length; i++) {
        const char = string[i]

        if (char === 'F') {
          const lengthFactor = Math.max(
            0.2,
            1.0 - (currentProgress * randFloat(
              settings.minLengthFactor,
              settings.maxLengthFactor
            ))
          )
          const currentLength = settings.initialLength * lengthFactor
          const nextPosition = position.clone().addScaledVector(direction, currentLength)
          const distance = position.distanceTo(nextPosition)

          const radiusFactor = Math.max(
            0.1,
            1.0 - (currentProgress * settings.thicknessFactor)
          )
          const currentRadius = settings.initialThickness * radiusFactor

          const cylinderGeo = new THREE.CylinderGeometry(
            currentRadius * settings.coneFactor,
            currentRadius,
            distance,
            6
          )

          cylinderGeo.translate(0, distance / 2, 0)
          cylinderGeo.rotateX(Math.PI / 2)

          const quaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction.clone().normalize())
          cylinderGeo.applyQuaternion(quaternion)
          cylinderGeo.translate(position.x, position.y, position.z)

          const vertexCount = cylinderGeo.attributes.position.count
          const progressArray = new Float32Array(vertexCount).fill(currentProgress)
          cylinderGeo.setAttribute('aProgress', new THREE.BufferAttribute(progressArray, 1))

          geometries.push(cylinderGeo)

          position.copy(nextPosition)
          currentProgress += 0.06

        } else if (char === '+') {
          const randomAngle = degToRad(randFloat(settings.minAngle, settings.maxAngle))
          direction.applyAxisAngle(new THREE.Vector3(0, 0, 1), randomAngle)
        } else if (char === '-') {
          const randomAngle = degToRad(randFloat(settings.minAngle, settings.maxAngle))
          direction.applyAxisAngle(new THREE.Vector3(0, 0, 1), -randomAngle)
        } else if (char === '&') {
          const randomAngle = degToRad(randFloat(settings.minAngle, settings.maxAngle))
          direction.applyAxisAngle(new THREE.Vector3(1, 0, 0), randomAngle)
        } else if (char === '^') {
          const randomAngle = degToRad(randFloat(settings.minAngle, settings.maxAngle))
          direction.applyAxisAngle(new THREE.Vector3(1, 0, 0), -randomAngle)
        } else if (char === '[') {
          stateStack.push({
            position: position.clone(),
            direction: direction.clone(),
            currentProgress: currentProgress
          })
        } else if (char === ']') {
          const state = stateStack.pop()
          position.copy(state.position)
          direction.copy(state.direction)
          currentProgress = state.currentProgress
        }
      }

      const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometries, true)
      return mergedGeometry
    }

    // Convert SVG to 3D Extruded Geometry with aProgress
    function createGeometryFromSVG(svgText) {
      const loader = new SVGLoader()
      const svgData = loader.parse(svgText)
      const geometries = []

      svgData.paths.forEach((path) => {
        const shapes = SVGLoader.createShapes(path)
        shapes.forEach((shape) => {
          const extrudeGeo = new THREE.ExtrudeGeometry(shape, {
            depth: 1.5,
            bevelEnabled: true,
            bevelSegments: 2,
            steps: 1,
            bevelSize: 0.2,
            bevelThickness: 0.2
          })
          geometries.push(extrudeGeo)
        })
      })

      if (geometries.length === 0) return null

      let mergedGeo = BufferGeometryUtils.mergeGeometries(geometries, true)
      mergedGeo.center()

      // Flip SVG upside down since SVG coordinates are top-left origin
      mergedGeo.rotateX(Math.PI)

      // Scale geometry to fit nicely in 3D view
      mergedGeo.computeBoundingBox()
      const box = mergedGeo.boundingBox
      const maxDim = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z)
      if (maxDim > 0) {
        const scale = 16 / maxDim
        mergedGeo.scale(scale, scale, scale)
      }

      // Add aProgress attribute along height for shader compatibility
      mergedGeo.computeBoundingBox()
      const minY = mergedGeo.boundingBox.min.y
      const maxY = mergedGeo.boundingBox.max.y
      const heightRange = (maxY - minY) || 1

      const posAttr = mergedGeo.attributes.position
      const progressArray = new Float32Array(posAttr.count)
      for (let i = 0; i < posAttr.count; i++) {
        const y = posAttr.getY(i)
        progressArray[i] = ((y - minY) / heightRange) * 3.0
      }
      mergedGeo.setAttribute('aProgress', new THREE.BufferAttribute(progressArray, 1))

      return mergedGeo
    }

    let activeMesh = null

    function updateActiveMesh() {
      if (activeMesh) {
        scene.remove(activeMesh)
        activeMesh.geometry.dispose()
      }

      let geo
      if (currentFormMode === 'svg' && customSvgGeometry) {
        geo = customSvgGeometry
        controls.target.set(0, 0, 0)
      } else {
        geo = generateLSystemTree(fullAxiom)
        controls.target.set(0, 10, 0)
      }

      activeMesh = new THREE.Mesh(geo, flowingLightMaterial)
      scene.add(activeMesh)
    }

    // SVG File Upload Listener
    document.getElementById('svgFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0]
      if (!file) return

      const reader = new FileReader()
      reader.onload = (event) => {
        const svgContent = event.target.result
        const geo = createGeometryFromSVG(svgContent)
        if (geo) {
          customSvgGeometry = geo
          currentFormMode = 'svg'
          updateActiveMesh()
        }
      }
      reader.readAsText(file)
    })

    // Init mesh
    updateActiveMesh()

    // Animation Loop
    let virtualTime = 0
    const clock = new THREE.Clock()

    function animate() {
      requestAnimationFrame(animate)

      const delta = clock.getDelta()
      virtualTime += delta * settings.animationSpeed

      flowingLightMaterial.uniforms.uTime.value = virtualTime
      flowingLightMaterial.uniforms.uFlowSpeed.value = settings.flow ? settings.flowSpeed : 0.0

      if (activeMesh) {
        const t = virtualTime
        switch (settings.animationPreset) {
          case 'Static (No Movement)':
            activeMesh.rotation.set(0, 0, 0)
            activeMesh.position.set(0, 0, 0)
            activeMesh.scale.set(1, 1, 1)
            break

          case 'Gentle Sway':
            activeMesh.rotation.x = Math.sin(t) / 3
            activeMesh.rotation.z = Math.cos(t * 0.5) / -3
            activeMesh.rotation.y = t * 0.2
            activeMesh.position.set(0, 0, 0)
            activeMesh.scale.set(1, 1, 1)
            break

          case 'Cosmic Drift':
            activeMesh.rotation.x = Math.sin(t * 0.3) * 0.2
            activeMesh.rotation.y = t * 0.1
            activeMesh.rotation.z = Math.sin(t * 0.2) * 0.15
            activeMesh.position.set(0, 0, 0)
            activeMesh.scale.set(1, 1, 1)
            break

          case 'Spiral Ascent':
            activeMesh.rotation.x = Math.sin(t * 0.4) * 0.1
            activeMesh.rotation.y = t * 0.3
            activeMesh.rotation.z = 0
            activeMesh.position.y = Math.sin(t * 0.6) * 1.2
            activeMesh.scale.set(1, 1, 1)
            break

          case 'Pulse Breathing':
            const scaleFactor = 1 + Math.sin(t * 0.8) * 0.06
            activeMesh.scale.set(scaleFactor, scaleFactor, scaleFactor)
            activeMesh.rotation.y = t * 0.15
            activeMesh.rotation.z = Math.sin(t * 0.4) * 0.15
            activeMesh.position.set(0, 0, 0)
            break
        }
      }

      controls.update()
      renderer.render(scene, camera)
    }

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    // Setup GUI
    const gui = new GUI({ title: 'Scene Settings' })

    // Color Scheme Presets
    gui.add(settings, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange((presetName) => {
      const scheme = colorSchemes[presetName]
      settings.lightColor = scheme.lightColor
      settings.branchBaseColor = scheme.branchBaseColor
      settings.sceneBGColor = scheme.sceneBGColor

      lightColorCtrl.setValue(scheme.lightColor)
      baseColorCtrl.setValue(scheme.branchBaseColor)
      bgColorCtrl.setValue(scheme.sceneBGColor)

      flowingLightMaterial.uniforms.uLightColor.value.set(settings.lightColor)
      flowingLightMaterial.uniforms.uBaseColor.value.set(settings.branchBaseColor)

      if (!settings.greenscreen) {
        scene.background.set(settings.sceneBGColor)
      }
    })

    // Greenscreen Toggle
    gui.add(settings, 'greenscreen').name('Greenscreen (#00ff00)').onChange((val) => {
      scene.background.set(val ? '#00ff00' : settings.sceneBGColor)
    })

    // Color Customization
    const colorFolder = gui.addFolder('Custom Colors')
    const lightColorCtrl = colorFolder.addColor(settings, 'lightColor').name('Light Color').onChange((val) => {
      flowingLightMaterial.uniforms.uLightColor.value.set(val)
    })
    const baseColorCtrl = colorFolder.addColor(settings, 'branchBaseColor').name('Base Color').onChange((val) => {
      flowingLightMaterial.uniforms.uBaseColor.value.set(val)
    })
    const bgColorCtrl = colorFolder.addColor(settings, 'sceneBGColor').name('Background Color').onChange((val) => {
      if (!settings.greenscreen) {
        scene.background.set(val)
      }
    })

    // Animation Controls
    const animFolder = gui.addFolder('Animation')
    animFolder.add(settings, 'animationPreset', [
      'Static (No Movement)',
      'Gentle Sway',
      'Cosmic Drift',
      'Spiral Ascent',
      'Pulse Breathing'
    ]).name('Preset')
    animFolder.add(settings, 'animationSpeed', 0.0, 3.0, 0.1).name('Speed')

    // Display & Render Settings
    const renderFolder = gui.addFolder('Render Settings')
    renderFolder.add(settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
      renderer.setPixelRatio(val)
    })

    // Form & SVG Upload
    const formFolder = gui.addFolder('Form / Geometry')
    formFolder.add(settings, 'uploadSVG').name('📁 Upload SVG Form')
    formFolder.add(settings, 'resetToTree').name('🌳 Reset to L-System')

    // Hide/Show GUI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show()
        } else {
          gui.hide()
        }
      }
    })

    // Start animation loop
    animate()
  </script>
</body>
</html>
