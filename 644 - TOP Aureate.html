<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b6afd0">
  <meta name="description" content="A living alcohol ink painting. Translucent lavender, midnight indigo, and fine metallic gold, generated entirely in GLSL.">
  <link rel="icon" href="data:,">
  <title>Aureate — Ink in suspension</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b6afd0; }
    canvas { display: block; width: 100%; height: 100%; }
    canvas { touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .unavailable { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px; color: #272447; font: 15px/1.7 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
<script type="module">
/*
 * AUREATE / INK IN SUSPENSION
 * A single plane, a single procedural shader pass, no textures or image assets.
 * Slow, closed-loop currents and independently adjustable framing.
 * Three.js and the standard lil-gui panel are loaded from CDNs.
 */
let renderer;
try {
  let THREE;
  try {
    THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  } catch {
    THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
  }
  const { default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js');

  // Nineteen entries; the achromatic entries each have two polarities.
  // Roles: paper, wash, secondary ink, deep ink, darkest ink, metallic accent.
  const palettes = {
    'Original': ['b6afd0','b6a9d6','a6c9e7','10184d','080d35','e3a640'],
    'Monochromatic': ['dce4f3','a4badd','7094c7','284c81','0b1d39','bed7ff'],
    'Analogous': ['ddd6ed','ad91d0','799cd6','403568','15142f','d69ade'],
    'Complementary': ['ece2d5','a8bfd0','d0a578','27435e','101c2b','f6aa1c'],
    'Split-complementary': ['e6dce8','af97ce','78b4a5','49355f','191326','f5b36b'],
    'Triadic': ['e4dee9','a994cf','86bba8','4c3679','1a152e','f3bd5c'],
    'Tetradic': ['e6dde2','c591aa','79ada2','49335c','1b182b','eac16b'],
    'Double split-complementary': ['e4dfe9','b89bd4','79b9c2','4c3c79','18152e','ed9d70'],
    'Achromatic': ['ffffff','c5c5c5','949494','292929','000000','eeeeee'],
    'Achromatic + Accent': ['ffffff','c5c5c5','949494','292929','000000','ed2424'],
    'Neutral + accent': ['e9e3d8','c7beb0','aaa397','524e48','211f1c','ed7040'],
    'Amber / Garnet': ['f6aa1c','bc3908','941b0c','941b0c','220901','f6aa1c'],
    'Sea glass / Midnight': ['63d1cf','5bc0be','4bad9e','4bad9e','0b132b','000000'],
    'Orchid / Obsidian': ['cfb5c2','d69ade','c9a3c6','0d001d','120a12','aa60c8'],
    'Saffron / Petrol': ['fef1be','ffba00','008189','00474d','061210','ffba00'],
    'Lime / Forest': ['d4ffb0','7fff00','00b894','0a3322','05140a','7fff00'],
    'Tangerine / Plum': ['ffe8cc','ff8c00','c7501a','3d1050','0e0618','ff8c00'],
    'Violet / Velvet': ['e8e0ff','b38fff','6a3de8','1a1250','090612','b38fff'],
    'Cyan / Magenta': ['e0fbff','00f0ff','d40078','1e0a3d','05020f','00f0ff']
  };
  const animations = ['Ink tide', 'Breathing pools', 'Silken drift', 'Orbital current',
    'Pendulum', 'Spiral reverie', 'Floating islands', 'Static'];
  const settings = {
    scheme: 'Original', invert: false, background: '#b6afd0', wash: '#b6a9d6',
    secondary: '#a6c9e7', deep: '#10184d', darkest: '#080d35', accent: '#e3a640',
    greenscreen: false, pixelRatio: Math.min(window.devicePixelRatio || 1, 1.75),
    animation: 'Ink tide', speed: 1, strength: 1, zoom: 1, angle: 0, tilt: 0,
    panX: 0, panY: 0, scale: 1, riverWidth: .155, warp: .18, seed: 0,
    clickVariation: true
  };

  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0xb6afd0);
  // Explicitly keep palette values in display space; no lighting or tone mapping.
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.domElement.setAttribute('role', 'img');
  renderer.domElement.setAttribute('aria-label', 'Slowly breathing lavender and blue alcohol ink, threaded with delicate metallic gold.');
  document.body.prepend(renderer.domElement);

  const uniforms = {
    uResolution: { value: new THREE.Vector2() },
    uPixelRatio: { value: 1 },
    uPhase: { value: 0 },
    uBackground: { value: new THREE.Vector3() },
    uWash: { value: new THREE.Vector3() },
    uSecondary: { value: new THREE.Vector3() },
    uDeep: { value: new THREE.Vector3() },
    uDarkest: { value: new THREE.Vector3() },
    uAccent: { value: new THREE.Vector3() },
    uGreen: { value: false },
    uPan: { value: new THREE.Vector2() },
    uZoom: { value: 1 },
    uAngle: { value: 0 },
    uTilt: { value: 0 },
    uMotion: { value: new THREE.Vector2() },
    uStrength: { value: 1 },
    uScale: { value: 1 },
    uWidth: { value: .155 },
    uWarp: { value: .18 },
    uSeed: { value: 0 }
  };
  const material = new THREE.ShaderMaterial({
    uniforms,
    depthTest: false,
    depthWrite: false,
    vertexShader: /* glsl */`
      void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform vec2 uResolution;
      uniform float uPixelRatio;
      uniform float uPhase;
      uniform vec3 uBackground, uWash, uSecondary, uDeep, uDarkest, uAccent;
      uniform bool uGreen;
      uniform vec2 uPan, uMotion;
      uniform float uZoom, uAngle, uTilt, uStrength, uScale, uWidth, uWarp, uSeed;

      const float TAU = 6.28318530718;
      #define INDIGO uDeep
      #define NAVY uDarkest

      float hash12(vec2 p) {
        p += vec2(uSeed*.173,uSeed*.297);
        vec3 p3 = fract(vec3(p.xyx) * .1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }
      vec2 hash22(vec2 p) {
        p += vec2(uSeed*.173,uSeed*.297);
        vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.xx + p3.yz) * p3.zy);
      }
      // Quintic gradient noise: continuous derivatives keep membrane edges soft.
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
        float a = dot(hash22(i) * 2.0-1.0, f);
        float b = dot(hash22(i+vec2(1,0)) * 2.0-1.0, f-vec2(1,0));
        float c = dot(hash22(i+vec2(0,1)) * 2.0-1.0, f-vec2(0,1));
        float d = dot(hash22(i+vec2(1,1)) * 2.0-1.0, f-1.0);
        return mix(mix(a,b,u.x), mix(c,d,u.x), u.y) * 1.65;
      }
      mat2 turn = mat2(.80, -.60, .60, .80);
      float fbm(vec2 p) {
        float n = 0.0, a = .53;
        for (int i = 0; i < 5; i++) {
          n += a * noise(p);
          p = turn * p * 2.06 + vec2(17.7, 9.2);
          a *= .49;
        }
        return n;
      }
      float detail(vec2 p) {
        return .58*noise(p) + .27*noise(turn*p*2.1+7.3) + .13*noise(p*4.3-8.1);
      }
      // A gently wandering river, fixed in the composition.
      float river(float x) {
        return -.065 - .115*sin(x*4.0+.35+uSeed*.07) + .065*sin(x*7.2-1.1+uSeed*.11);
      }
      vec3 gold(float reflectance) {
        vec3 g = mix(uAccent*.49, uAccent, smoothstep(.05,.60,reflectance));
        vec3 highlight = mix(uAccent,vec3(1.0),.43);
        return mix(g,highlight,smoothstep(.56,.98,reflectance));
      }
      // Warped nearest-cell boundaries, used only as faint pigment capillaries.
      float cells(vec2 p) {
        vec2 ip = floor(p), fp = fract(p);
        float first = 8.0, second = 8.0;
        for (int y = -1; y <= 1; y++) {
          for (int x = -1; x <= 1; x++) {
            vec2 g = vec2(float(x),float(y));
            vec2 r = g + .2 + .6*hash22(ip+g) - fp;
            float d = dot(r,r);
            second = max(first,min(second,d));
            first = min(first,d);
          }
        }
        return sqrt(second)-sqrt(first);
      }
      // Every dot remains anchored to its cell. No scrolling particle systems.
      vec3 pigment(vec2 p, float scale, float density, float size, float seed, float phase) {
        vec2 grid = p*scale + seed;
        vec2 id = floor(grid), f = fract(grid);
        vec2 rnd = hash22(id+seed*3.1);
        vec2 center = .25 + .50*rnd;
        float selection = hash12(id+seed+91.7);
        float radius = size * mix(.28,1.0,pow(hash12(id-19.4),2.0));
        vec2 delta = f-center;
        float rough = 1.0 + .035*sin(atan(delta.y,delta.x)*3.0+selection*31.0);
        float distanceToDot = length(delta)*rough;
        float aa = max(fwidth(grid.x),fwidth(grid.y))*.62;
        float presence = smoothstep(selection-.025,selection+.025,density);
        float mask = (1.0-smoothstep(radius-aa,radius+aa,distanceToDot)) * presence;
        float leaf = hash12(floor(p*scale*9.0)+seed);
        float reflection = .47 + .24*sin(rnd.x*19.0+phase) + .21*leaf;
        reflection += .18*dot(normalize(delta+vec2(.001)),normalize(vec2(-.7,.5)));
        return vec3(mask, reflection, radius);
      }

      void main() {
        vec2 screen = gl_FragCoord.xy/uResolution;
        float aspect = uResolution.x/uResolution.y;
        // Cover the original landscape framing without distorting any pigment.
        vec2 p = (screen-.5)*vec2(aspect,1.0);
        p *= min(1.0,1.77777778/aspect);
        p = (p-uPan)/uZoom-uMotion;
        float c = cos(uAngle), s = sin(uAngle);
        p = mat2(c,-s,s,c)*p;
        p.y /= max(.45,cos(uTilt));
        vec2 frameP = p;
        float border = max(abs(frameP.x)/.91,abs(frameP.y)/.52);
        float frameMask = 1.0-smoothstep(.985,1.0,border);
        p *= uScale;
        float phase = uPhase;
        vec2 tide = uStrength*.11*vec2(sin(phase),cos(phase)-1.0);
        // Local currents deform the pigment rather than moving the camera.
        // Integer harmonics share an exact loop and never reverse all at once.
        vec2 current = .024*vec2(
          sin(phase+p.y*3.0)-sin(p.y*3.0),
          cos(phase+p.x*2.0)-cos(p.x*2.0));
        current += .009*vec2(
          sin(phase*2.0+p.x*4.0)-sin(p.x*4.0),
          sin(phase*2.0-p.y*5.0)-sin(-p.y*5.0));
        current *= uStrength;

        vec2 warp = vec2(fbm(p*2.65+vec2(3.7,9.1)+tide),
                         fbm(p*2.4+vec2(-6.1,2.7)-tide));
        vec2 q = p + uWarp*warp;
        q += current + .006*vec2(sin(3.0*p.y),cos(2.0*p.x));
        float cloud = fbm(q*2.2+vec2(1.2,7.8));
        float blueSide = smoothstep(-.65,.70,p.x+.35*cloud);
        vec3 paper = mix(mix(uBackground,uWash,.13),mix(uBackground,uSecondary,.22),blueSide);
        vec3 color = paper + cloud*.095;

        // Separate translucent puddles, each with its own broken drying rim.
        for (int i = 0; i < 5; i++) {
          float fi = float(i);
          vec2 offset = vec2(fi*7.71+2.4,fi*3.23-5.6);
          vec2 layerP = q*(1.65+fi*.19) + offset + tide*sin(fi+1.0);
          float field = fbm(layerP + warp*.36);
          float d = field + .035 + .035*sin(fi*2.1);
          float wash = smoothstep(-.035,.075,d);
          float edge = exp(-abs(d)*220.0);
          vec3 ink = mix(uWash*.83,uSecondary*.83,clamp(blueSide+sin(fi*2.7)*.24,0.0,1.0));
          color = mix(color,ink,wash*(.12+.025*fi));
          float drying = .45+.55*smoothstep(-.3,.3,detail(layerP*8.0));
          color *= 1.0-edge*drying*.10;
          color += .012*exp(-abs(d+.021)*45.0);
        }

        float center = river(q.x);
        float broad = abs(q.y-center);
        float flowNoise = fbm(q*vec2(4.0,5.0)+vec2(8.1,-3.6)+tide*.7);
        float fine = detail(q*35.0 + warp*2.0);
        float riverDistance = broad - uWidth + .125*flowNoise + .012*fine;
        float haze = 1.0-smoothstep(-.05,.22,riverDistance);
        vec3 underpainting = mix(mix(uWash,uDeep,.35),mix(uSecondary,uDeep,.35),blueSide);
        color = mix(color,underpainting,haze*.38);

        // Nested solvent fronts. Unequal spacing and independent displacements
        // prevent the contour lines from becoming repetitive topographic bands.
        for (int i = 0; i < 6; i++) {
          float fi = float(i);
          float variation = detail(q*(5.0+fi*1.1)+vec2(fi*8.3,fi*-3.7)+tide*.6);
          float d = riverDistance + (fi-2.2)*.038 + variation*.061;
          float inside = 1.0-smoothstep(-.007,.009,d);
          float rimWidth = .0015+.00045*sin(fi*2.4);
          float rim = exp(-abs(d)/rimWidth);
          float fade = .55+.45*noise(q*18.0+fi*9.7);
          vec3 ink = mix(mix(uWash,uDeep,.62),mix(uSecondary,uDeep,.62),blueSide);
          ink = mix(ink, mix(INDIGO,NAVY,.55),fi*.115);
          color = mix(color,ink,inside*(.22+fi*.045));
          color *= 1.0-rim*fade*(.18+fi*.015);
        }
        float heart = (1.0-smoothstep(-.045,.012,riverDistance+.055*detail(q*9.0-16.4)));
        float pooling = smoothstep(-.35,.26,detail(q*9.5+warp));
        color = mix(color,mix(INDIGO,NAVY,pooling),heart*pooling*.63);

        // Translucent solvent islands remain legible inside the dark pool.
        // Their drying rims give the ink a thin, folded-membrane character.
        for (int i = 0; i < 3; i++) {
          float fi = float(i);
          float membrane = fbm(q*(3.4+fi*.31)+warp*.42+vec2(fi*13.6+7.9,fi*8.7));
          float d = membrane+.025;
          float island = smoothstep(-.008,.018,d);
          vec3 tint = mix(mix(uWash,uDeep,.48),mix(uSecondary,uDeep,.48),blueSide);
          color = mix(color,tint,island*haze*(.12+fi*.025));
          float dryRim = exp(-abs(d)*245.0);
          color *= 1.0-dryRim*haze*.22;
        }
        float shoreline = exp(-abs(riverDistance-.055)*520.0);
        color *= 1.0-shoreline*(.12+.09*noise(q*47.0));

        // Sparse, branching capillary marks in the concentrated ink.
        float cellular = cells(q*9.0 + warp*3.5 + .22*vec2(fine,flowNoise));
        float capillary = 1.0-smoothstep(.0,.017,cellular);
        color *= 1.0-capillary*haze*.065*smoothstep(-.05,.2,flowNoise);
        float marbling = abs(detail(q*21.0+warp*4.0));
        color *= 1.0-(1.0-smoothstep(.002,.012,marbling))*heart*.065;

        // Gold leaf trails: hairline bodies, interrupted foil, no bloom.
        float nearestThread = 1.0;
        float leafNoise = noise(p*155.0+4.8);
        for (int i = 0; i < 5; i++) {
          float fi = float(i);
          float x = p.x;
          float threadY = river(x)*.72 + .078*sin(x*(5.1+fi*.55)+fi*1.8);
          threadY += (fi-2.0)*.041 + .044*sin(x*8.3+fi*3.7);
          threadY += .026*detail(vec2(x*5.1,fi*7.1)+tide);
          threadY += uStrength*.010*sin(phase*2.0+fi+x*2.0);
          threadY += uStrength*.006*sin(phase+fi*1.7-x*3.0);
          float d = abs(p.y-threadY);
          nearestThread = min(nearestThread,d);
          float pixel = fwidth(p.y);
          float thickness = .00030 + .00016*(.5+.5*sin(x*21.0+fi));
          float thread = 1.0-smoothstep(thickness,thickness+pixel*.85,d);
          float breakup = smoothstep(-.43,-.15,noise(vec2(x*88.0,fi*12.8)));
          float foil = .56+.25*leafNoise+.17*sin(x*22.0+fi*3.0+phase);
          color = mix(color,gold(foil),thread*breakup*.92);
          float edgeDust = exp(-d*900.0)*step(.92,hash12(floor(p*1600.0)+fi));
          color = mix(color,gold(.78),edgeDust*.65);
        }

        // Clusters of four pigment sizes. The density field creates bare paper
        // between organic dust blooms rather than a uniform star field.
        vec2 dustP = p + current*.12 + .0018*vec2(sin(phase),cos(phase)-1.0);
        float dustCloud = detail(q*6.7+vec2(4.9,12.3));
        float clustering = smoothstep(-.12,.31,dustCloud);
        float banks = exp(-abs(riverDistance+.025)*28.0);
        float trails = exp(-nearestThread*65.0);
        float density = clamp(.025 + .55*clustering + .16*banks + .22*trails,.0,.88);
        vec3 dust = pigment(dustP,410.0,density*.73,.19,7.31,phase);
        color = mix(color,gold(dust.y),dust.x*.83);
        vec3 speck = pigment(dustP,160.0,density*.36,.20,43.8,phase);
        color = mix(color,gold(speck.y+.13),speck.x*.95);
        vec3 drop = pigment(dustP,49.0,.025+density*.09,.21,12.1,phase);
        color = mix(color,gold(drop.y+.12),drop.x);
        vec3 bead = pigment(dustP,19.0,.045,.18,27.4,phase);
        color = mix(color,gold(bead.y+.15),bead.x);

        // Microscopic static pigment grain and a nearly invisible paper tooth.
        vec2 grainUV = gl_FragCoord.xy/max(uPixelRatio,1.0);
        float grain = hash12(grainUV)-.5;
        float tooth = noise(p*760.0);
        color += grain*(.015+.012*heart) + tooth*.006;
        float granules = step(.985,hash12(floor(p*2100.0)));
        color *= 1.0-granules*heart*.13;
        color += (hash12(gl_FragCoord.xy+83.0)-.5)/255.0;
        vec3 backdrop = uGreen ? vec3(0.0,1.0,0.0) : uBackground;
        float inkMask = uGreen ? smoothstep(.10,.72,haze) : 1.0;
        gl_FragColor = vec4(mix(backdrop,clamp(color,0.0,1.0),frameMask*inkMask),1.0);
      }
    `
  });
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const geometry = new THREE.PlaneGeometry(2,2);
  const painting = new THREE.Mesh(geometry,material);
  painting.frustumCulled = false;
  scene.add(painting);

  const gui = new GUI({ title: 'Aureate', width: 300 });
  const colorRoles = {
    background: 'uBackground', wash: 'uWash', secondary: 'uSecondary',
    deep: 'uDeep', darkest: 'uDarkest', accent: 'uAccent'
  };
  function syncColors() {
    for (const [role, uniform] of Object.entries(colorRoles)) {
      const hex = settings[role].replace('#','');
      uniforms[uniform].value.set(
        parseInt(hex.slice(0,2),16)/255,
        parseInt(hex.slice(2,4),16)/255,
        parseInt(hex.slice(4,6),16)/255
      );
    }
    uniforms.uGreen.value = settings.greenscreen;
  }
  function refreshPanel() { gui.controllersRecursive().forEach(control => control.updateDisplay()); }
  function applyPalette() {
    const colors = palettes[settings.scheme];
    const achromatic = settings.scheme.startsWith('Achromatic');
    Object.keys(colorRoles).forEach((role,index) => {
      const hex = colors[index];
      const keepAccent = settings.scheme === 'Achromatic + Accent' && role === 'accent';
      settings[role] = '#' + (achromatic && settings.invert && !keepAccent
        ? (0xffffff-parseInt(hex,16)).toString(16).padStart(6,'0') : hex);
    });
    syncColors();
    refreshPanel();
  }
  const colorsFolder = gui.addFolder('Palette & background');
  colorsFolder.add(settings,'scheme',Object.keys(palettes)).name('Color scheme').onChange(applyPalette);
  colorsFolder.add(settings,'invert').name('Invert achromatic').onChange(applyPalette);
  colorsFolder.add(settings,'greenscreen').name('Greenscreen').onChange(syncColors);
  for (const role of Object.keys(colorRoles)) {
    colorsFolder.addColor(settings,role).name({background:'Background',wash:'Ink wash',
      secondary:'Secondary ink',deep:'Deep ink',darkest:'Darkest ink',accent:'Metallic accent'}[role]).onChange(syncColors);
  }
  const motionFolder = gui.addFolder('Animation');
  motionFolder.add(settings,'animation',animations).name('Motion');
  motionFolder.add(settings,'speed',0,3,.01).name('Speed');
  motionFolder.add(settings,'strength',0,2,.01).name('Current strength');
  const viewFolder = gui.addFolder('Framing');
  viewFolder.add(settings,'zoom',.25,6,.01).name('Zoom').listen();
  viewFolder.add(settings,'angle',-180,180,.1).name('Camera angle');
  viewFolder.add(settings,'tilt',-60,60,.1).name('Camera tilt');
  viewFolder.add(settings,'panX',-3,3,.001).name('Horizontal position').listen();
  viewFolder.add(settings,'panY',-3,3,.001).name('Vertical position').listen();
  viewFolder.add({reset() {
    Object.assign(settings,{zoom:1,angle:0,tilt:0,panX:0,panY:0});
    refreshPanel();
  }},'reset').name('Reset framing');
  const inkFolder = gui.addFolder('Ink geometry');
  inkFolder.add(settings,'scale',.55,2,.01).name('Pattern scale');
  inkFolder.add(settings,'riverWidth',.06,.3,.001).name('Pool width');
  inkFolder.add(settings,'warp',.03,.45,.001).name('Membrane warp');
  inkFolder.add(settings,'seed',0,100,.01).name('Seed');
  const variationFolder = gui.addFolder('Variation & rendering');
  variationFolder.add(settings,'clickVariation').name('Click to regenerate');
  function randomize() {
    const between = (low,high) => low+Math.random()*(high-low);
    const names = Object.keys(palettes).filter(name => name !== settings.scheme);
    settings.scheme = names[Math.floor(Math.random()*names.length)];
    settings.invert = Math.random() < .5;
    settings.seed = between(0,100);
    settings.scale = between(.75,1.35);
    settings.riverWidth = between(.10,.24);
    settings.warp = between(.08,.32);
    settings.animation = animations[Math.floor(Math.random()*7)];
    settings.speed = between(.4,1.25);
    settings.strength = between(.5,1.5);
    applyPalette();
  }
  variationFolder.add({randomize},'randomize').name('New variation');
  variationFolder.add(settings,'pixelRatio',.5,3,.05).name('Pixel ratio (DPR)').onChange(resize);
  viewFolder.close();
  inkFolder.close();
  variationFolder.close();
  syncColors();

  function resize() {
    const width = Math.max(1,window.innerWidth);
    const height = Math.max(1,window.innerHeight);
    const pixelRatio = settings.pixelRatio;
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(width,height);
    renderer.getDrawingBufferSize(uniforms.uResolution.value);
    uniforms.uPixelRatio.value = pixelRatio;
  }
  resize();
  window.addEventListener('resize',resize,{ passive:true });

  // Framing is an additive user layer; animation never writes these values.
  const canvas = renderer.domElement;
  const pointerPosition = event => {
    const rect = canvas.getBoundingClientRect();
    const aspect = rect.width/rect.height;
    const fit = Math.min(1,1.77777778/aspect);
    return new THREE.Vector2(
      ((event.clientX-rect.left)/rect.width-.5)*aspect*fit,
      (.5-(event.clientY-rect.top)/rect.height)*fit
    );
  };
  canvas.addEventListener('wheel',event => {
    event.preventDefault();
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
    const next = THREE.MathUtils.clamp(settings.zoom*Math.exp(-event.deltaY*unit*.001),.25,6);
    const ratio = next/settings.zoom;
    const pointer = pointerPosition(event);
    settings.panX = pointer.x-(pointer.x-settings.panX)*ratio;
    settings.panY = pointer.y-(pointer.y-settings.panY)*ratio;
    settings.zoom = next;
  },{passive:false});
  let drag;
  canvas.addEventListener('pointerdown',event => {
    if (event.button !== 0 || drag) return;
    drag = { id:event.pointerId, x:event.clientX, y:event.clientY,
      start:pointerPosition(event), panX:settings.panX, panY:settings.panY, moved:false };
    canvas.setPointerCapture(event.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',event => {
    if (!drag || drag.id !== event.pointerId) return;
    drag.moved ||= Math.hypot(event.clientX-drag.x,event.clientY-drag.y)>5;
    if (!drag.moved) return;
    const point = pointerPosition(event).sub(drag.start);
    settings.panX = drag.panX+point.x;
    settings.panY = drag.panY+point.y;
  });
  function endDrag(event) {
    if (!drag || drag.id !== event.pointerId) return;
    const click = !drag.moved && event.type === 'pointerup';
    drag = undefined;
    canvas.classList.remove('dragging');
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    if (click && settings.clickVariation) randomize();
  }
  canvas.addEventListener('pointerup',endDrag);
  canvas.addEventListener('pointercancel',endDrag);
  canvas.addEventListener('lostpointercapture',endDrag);
  let uiHidden = false;
  window.addEventListener('keydown',event => {
    const editing = event.target instanceof HTMLElement &&
      (event.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName));
    if (event.code === 'KeyH' && !editing && !event.repeat && !event.ctrlKey && !event.metaKey && !event.altKey) {
      uiHidden = !uiHidden;
      gui.show(!uiHidden);
    }
  });

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const LOOP_SECONDS = 240;
  let previousTime;
  let elapsed = 0;
  let frame;
  let contextLost = false;
  function draw(now) {
    if (previousTime !== undefined) {
      // Keep the requested continuous motion even when the OS requests reduced
      // motion; use a gentler current instead of freezing the artwork entirely.
      const speed = settings.speed*(reducedMotion.matches ? .4 : 1);
      elapsed = (elapsed + Math.min((now-previousTime)/1000,.1)*speed) % LOOP_SECONDS;
    }
    previousTime = now;
    const phase = elapsed/LOOP_SECONDS*Math.PI*2;
    let inkPhase = phase, angle = 0, tilt = 0, breathing = 1;
    let motionX = 0, motionY = 0, strength = settings.strength;
    const gentle = reducedMotion.matches ? .4 : 1;
    switch (settings.animation) {
      case 'Breathing pools':
        breathing = 1+.045*gentle*Math.sin(phase);
        inkPhase = phase*2;
        break;
      case 'Silken drift':
        motionX = .065*gentle*Math.sin(phase);
        motionY = .025*gentle*Math.sin(phase*2);
        break;
      case 'Orbital current':
        motionX = .055*gentle*Math.cos(phase);
        motionY = .035*gentle*Math.sin(phase);
        angle = .12*gentle*Math.sin(phase);
        tilt = .12*gentle*Math.cos(phase);
        break;
      case 'Pendulum':
        angle = .075*gentle*Math.sin(phase);
        motionY = .025*gentle*Math.sin(phase*2);
        break;
      case 'Spiral reverie':
        angle = .16*gentle*Math.sin(phase);
        breathing = 1+.06*gentle*Math.cos(phase);
        inkPhase = phase*2;
        break;
      case 'Floating islands':
        motionY = .045*gentle*Math.sin(phase);
        tilt = .15*gentle*Math.sin(phase);
        strength *= 1.25;
        break;
      case 'Static':
        inkPhase = 0;
        strength = 0;
        break;
    }
    uniforms.uPhase.value = inkPhase;
    uniforms.uMotion.value.set(motionX,motionY);
    uniforms.uPan.value.set(settings.panX,settings.panY);
    uniforms.uZoom.value = settings.zoom*breathing;
    uniforms.uAngle.value = settings.angle*Math.PI/180+angle;
    uniforms.uTilt.value = settings.tilt*Math.PI/180+tilt;
    uniforms.uStrength.value = strength;
    uniforms.uScale.value = settings.scale;
    uniforms.uWidth.value = settings.riverWidth;
    uniforms.uWarp.value = settings.warp;
    uniforms.uSeed.value = settings.seed;
    renderer.render(scene,camera);
    if (!document.hidden && !contextLost) frame = requestAnimationFrame(draw);
    else previousTime = undefined;
  }
  function resume() {
    cancelAnimationFrame(frame);
    previousTime = undefined;
    if (!document.hidden && !contextLost) frame = requestAnimationFrame(draw);
  }
  document.addEventListener('visibilitychange',resume);
  reducedMotion.addEventListener('change',resume);
  renderer.domElement.addEventListener('webglcontextlost',event => {
    event.preventDefault();
    contextLost = true;
    cancelAnimationFrame(frame);
  });
  renderer.domElement.addEventListener('webglcontextrestored',() => {
    contextLost = false;
    resize();
    resume();
  });
  resume();
} catch (error) {
  console.error('Unable to initialize Aureate:',error);
  renderer?.dispose();
  renderer?.domElement.remove();
  const message = document.createElement('div');
  message.className = 'unavailable';
  message.setAttribute('role','status');
  message.textContent = 'This living painting needs WebGL 2 and an internet connection to load Three.js. Please open it in a current browser with hardware acceleration enabled.';
  document.body.append(message);
}
</script>
</body>
</html>
