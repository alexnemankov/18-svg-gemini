<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Rotating Cube Grid</title>
  <style>
    body {
      font-family: Arial, Helvetica, "Liberation Sans", FreeSans, sans-serif;
      background-color: #000;
      margin: 0;
      padding: 0;
      border-width: 0;
      overflow: hidden;
      user-select: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <script type="module">
    import GUI from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";

    "use strict";

    const nbx = 7;
    const nby = 7;
    const nbz = 7;

    let canv, ctx;
    let maxx, maxy;
    let xc, yc;
    let arCubes = [];

    const mrandom = Math.random;
    const mPI = Math.PI;
    const m2PI = Math.PI * 2;
    const msin = Math.sin;
    const mcos = Math.cos;
    const mtan = Math.tan;
    const mhypot = Math.hypot;
    const msqrt = Math.sqrt;

    let proj;

    // Preconfigured color palettes from prompt
    const RAW_PALETTES = {
      "Palette: Fire (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)": [
        "#F6AA1C", "#BC3908", "#941B0C", "#F6AA1C", "#220901"
      ],
      "Palette: Teal (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)": [
        "#63D1CF", "#5BC0BE", "#4BAD9E", "#4BAD9E", "#0B132B", "#000000"
      ],
      "Palette: Lavender (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)": [
        "#AA60C8", "#D69ADE", "#C9A3C6", "#CFB5C2", "#0D001D", "#120A12"
      ],
      "Palette: Petroleum (FEF1BE, FFBA00, 008189, 00474D, 061210)": [
        "#FEF1BE", "#FFBA00", "#008189", "#00474D", "#061210"
      ],
      "Palette: Neon Meadow (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)": [
        "#D4FFB0", "#7FFF00", "#00B894", "#0A3322", "#05140A"
      ],
      "Palette: Sunset Rust (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)": [
        "#FFE8CC", "#FF8C00", "#C7501A", "#3D1050", "#0E0618"
      ],
      "Palette: Electric Violet (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)": [
        "#E8E0FF", "#B38FFF", "#6A3DE8", "#1A1250", "#090612"
      ],
      "Palette: Cyber Pink (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)": [
        "#E0FBFF", "#00F0FF", "#D40078", "#1E0A3D", "#05020F"
      ]
    };

    const COLOR_SCHEMES = [
      "Original",
      "Monochromatic",
      "Analogous",
      "Complementary",
      "Split-complementary",
      "Triadic",
      "Tetradic",
      "Double split-complementary",
      "Achromatic (Black & White)",
      "Achromatic (White & Black)",
      "Achromatic + Accent (Black & White + Red)",
      "Achromatic + Accent (White & Black + Red)",
      "Neutral + accent",
      "Palette: Fire (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)",
      "Palette: Teal (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)",
      "Palette: Lavender (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)",
      "Palette: Petroleum (FEF1BE, FFBA00, 008189, 00474D, 061210)",
      "Palette: Neon Meadow (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)",
      "Palette: Sunset Rust (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)",
      "Palette: Electric Violet (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)",
      "Palette: Cyber Pink (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)",
      "Custom Color"
    ];

    // Configurable parameters
    const params = {
      // Color Schemes & Appearance
      colorScheme: "Original",
      baseHue: 210,
      customColor: "#00e5ff",
      lineWidth: 2.0,

      // Background & Greenscreen
      greenscreen: false,
      backgroundColor: "#000000",

      // Zoom & Pan
      zoom: 1.0,
      panX: 0,
      panY: 0,

      // Geometry
      cubeSize: 0.4,

      // Animation & Motion
      rotSpeed: 0.002,
      paused: false,

      // Scene Click Randomizer
      randomizeOnClick: true,

      // Helpers
      randomize: () => randomizeScene(),
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateAllGuiControllers(gui);
      }
    };

    function hexToRgb(hex) {
      let clean = hex.replace("#", "");
      if (clean.length === 3) clean = clean.split("").map(c => c + c).join("");
      const num = parseInt(clean, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function interpolatePalette(paletteHexes, t) {
      const n = paletteHexes.length - 1;
      const scaled = Math.max(0, Math.min(1, t)) * n;
      const i0 = Math.floor(scaled);
      const i1 = Math.min(n, i0 + 1);
      const frac = scaled - i0;
      const c0 = hexToRgb(paletteHexes[i0]);
      const c1 = hexToRgb(paletteHexes[i1]);
      const r = Math.round(c0[0] + (c1[0] - c0[0]) * frac);
      const g = Math.round(c0[1] + (c1[1] - c0[1]) * frac);
      const b = Math.round(c0[2] + (c1[2] - c0[2]) * frac);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function ensureContrast(hexOrRgb, bgHex, isGreenscreen) {
      if (isGreenscreen) return hexOrRgb;
      const m = hexOrRgb.match(/\d+/g);
      if (m) {
        let [r, g, b] = m.map(Number);
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        if (lum < 38) {
          r = Math.min(255, r + 45);
          g = Math.min(255, g + 45);
          b = Math.min(255, b + 55);
          return `rgb(${r}, ${g}, ${b})`;
        }
      }
      return hexOrRgb;
    }

    function getCubeColor(kx, ky, kz) {
      const scheme = params.colorScheme;
      const u = kx / (nbx - 1);
      const v = ky / (nby - 1);
      const w = kz / (nbz - 1);
      const avg = (u + v + w) / 3;
      const distFromCenter = Math.hypot(u - 0.5, v - 0.5, w - 0.5) / 0.866;
      const baseHue = params.baseHue;

      if (scheme === "Custom Color") {
        return params.customColor;
      }

      if (scheme === "Original") {
        const red = 0.2 + 0.8 * u;
        const green = 0.2 + 0.8 * v;
        const blue = 0.2 + 0.8 * w;
        return `rgb(${Math.round(255 * red)}, ${Math.round(255 * green)}, ${Math.round(255 * blue)})`;
      }

      if (scheme === "Monochromatic") {
        const sat = Math.round(65 + 30 * (1 - distFromCenter));
        const light = Math.round(30 + 55 * avg);
        return `hsl(${baseHue}, ${sat}%, ${light}%)`;
      }

      if (scheme === "Analogous") {
        const hue = Math.round((baseHue + (u - 0.5) * 60 + 360) % 360);
        const light = Math.round(35 + 45 * v);
        return `hsl(${hue}, 85%, ${light}%)`;
      }

      if (scheme === "Complementary") {
        const isComp = (kx + ky + kz) % 2 === 0;
        const hue = isComp ? baseHue : (baseHue + 180) % 360;
        const light = Math.round(35 + 45 * ((v + w) / 2));
        return `hsl(${hue}, 85%, ${light}%)`;
      }

      if (scheme === "Split-complementary") {
        const hues = [baseHue, (baseHue + 150) % 360, (baseHue + 210) % 360];
        const hue = hues[(kx + ky + kz) % 3];
        const light = Math.round(35 + 45 * avg);
        return `hsl(${hue}, 85%, ${light}%)`;
      }

      if (scheme === "Triadic") {
        const hues = [baseHue, (baseHue + 120) % 360, (baseHue + 240) % 360];
        const hue = hues[(kx + ky + kz) % 3];
        const light = Math.round(35 + 45 * avg);
        return `hsl(${hue}, 85%, ${light}%)`;
      }

      if (scheme === "Tetradic") {
        const hues = [baseHue, (baseHue + 90) % 360, (baseHue + 180) % 360, (baseHue + 270) % 360];
        const hue = hues[(kx + ky + kz) % 4];
        const light = Math.round(35 + 45 * avg);
        return `hsl(${hue}, 85%, ${light}%)`;
      }

      if (scheme === "Double split-complementary") {
        const hues = [
          (baseHue - 30 + 360) % 360,
          (baseHue + 30) % 360,
          (baseHue + 150) % 360,
          (baseHue + 210) % 360
        ];
        const hue = hues[(kx + ky + kz) % 4];
        const light = Math.round(35 + 45 * avg);
        return `hsl(${hue}, 85%, ${light}%)`;
      }

      if (scheme === "Achromatic (Black & White)") {
        const light = Math.round(25 + 70 * avg);
        return `hsl(0, 0%, ${light}%)`;
      }

      if (scheme === "Achromatic (White & Black)") {
        const light = Math.round(10 + 60 * (1 - avg));
        return `hsl(0, 0%, ${light}%)`;
      }

      if (scheme === "Achromatic + Accent (Black & White + Red)") {
        const isCenter = (kx === 3 && ky === 3 && kz === 3);
        const isDiag = (kx === ky && ky === kz);
        if (isCenter || isDiag) {
          return "#ff1744";
        }
        const light = Math.round(25 + 65 * avg);
        return `hsl(0, 0%, ${light}%)`;
      }

      if (scheme === "Achromatic + Accent (White & Black + Red)") {
        const isCenter = (kx === 3 && ky === 3 && kz === 3);
        const isDiag = (kx === ky && ky === kz);
        if (isCenter || isDiag) {
          return "#d50000";
        }
        const light = Math.round(10 + 60 * (1 - avg));
        return `hsl(0, 0%, ${light}%)`;
      }

      if (scheme === "Neutral + accent") {
        const isAccent = (kx === 3 && ky === 3 && kz === 3) || ((kx + ky + kz) % 5 === 0);
        if (isAccent) {
          return "#ff9100";
        }
        const neutrals = ["#8d8070", "#b8a99a", "#696058", "#d6cdc4", "#524b45", "#9e9185"];
        return neutrals[(kx + 2 * ky + 3 * kz) % neutrals.length];
      }

      if (RAW_PALETTES[scheme]) {
        const raw = RAW_PALETTES[scheme];
        const col = interpolatePalette(raw, avg);
        return ensureContrast(col, params.backgroundColor, params.greenscreen);
      }

      return "#ffffff";
    }

    function updateCubeColors() {
      if (!arCubes) return;
      arCubes.forEach(cube => {
        cube.color = getCubeColor(cube.kx, cube.ky, cube.kz);
      });
    }

    function updateCubeSizes() {
      if (!arCubes) return;
      arCubes.forEach(cube => {
        cube.updatePts(params.cubeSize);
      });
    }

    function Noise1DOneShot(period, min = 0, max = 1, random) {
      random = random || Math.random;
      let currx = random();
      let y0 = min + (max - min) * random();
      let y1 = min + (max - min) * random();
      let dx = 1 / period;

      return function() {
        currx += dx;
        if (currx > 1) {
          currx -= 1;
          y0 = y1;
          y1 = min + (max - min) * random();
        }
        let z = (3 - 2 * currx) * currx * currx;
        return z * y1 + (1 - z) * y0;
      };
    }

    function Cube(xc, yc, zc, color, kx, ky, kz) {
      this.xc = xc;
      this.yc = yc;
      this.zc = zc;
      this.kx = kx;
      this.ky = ky;
      this.kz = kz;
      this.color = color;
      this.updatePts(params.cubeSize);
    }

    Cube.prototype.updatePts = function(size) {
      const cs2 = size / 2;
      const x0 = this.xc - cs2;
      const x1 = this.xc + cs2;
      const y0 = this.yc - cs2;
      const y1 = this.yc + cs2;
      const z0 = this.zc - cs2;
      const z1 = this.zc + cs2;

      this.pts = [
        [x0, y0, z0], [x1, y0, z0],
        [x0, y1, z0], [x1, y1, z0],
        [x0, y0, z1], [x1, y0, z1],
        [x0, y1, z1], [x1, y1, z1]
      ];
    };

    Cube.prototype.draw = function() {
      ctx.strokeStyle = this.color;
      ctx.lineWidth = params.lineWidth;
      const p = proj.projection(this.pts);

      ctx.beginPath();
      // bottom face
      ctx.moveTo(p[0][0], p[0][1]);
      ctx.lineTo(p[1][0], p[1][1]);
      ctx.lineTo(p[3][0], p[3][1]);
      ctx.lineTo(p[2][0], p[2][1]);
      ctx.closePath();

      // top face
      ctx.moveTo(p[4][0], p[4][1]);
      ctx.lineTo(p[5][0], p[5][1]);
      ctx.lineTo(p[7][0], p[7][1]);
      ctx.lineTo(p[6][0], p[6][1]);
      ctx.closePath();

      // vertical edges
      ctx.moveTo(p[0][0], p[0][1]); ctx.lineTo(p[4][0], p[4][1]);
      ctx.moveTo(p[1][0], p[1][1]); ctx.lineTo(p[5][0], p[5][1]);
      ctx.moveTo(p[2][0], p[2][1]); ctx.lineTo(p[6][0], p[6][1]);
      ctx.moveTo(p[3][0], p[3][1]); ctx.lineTo(p[7][0], p[7][1]);
      ctx.stroke();
    };

    function createTranslation(depl) {
      const [dx, dy, dz] = depl;
      function apply(p) {
        if (p[0].length !== 3) {
          return [p[0] + dx, p[1] + dy, p[2] + dz];
        } else {
          return p.map(pt => [pt[0] + dx, pt[1] + dy, pt[2] + dz]);
        }
      }
      return { dx, dy, dz, apply };
    }

    function createPerspective3(pcam, pLookAt, a, th, resx, resy) {
      const resx2 = resx / 2;
      const resy2 = resy / 2;
      const th2 = th / 2;
      const b = a * mtan(th2);
      const projScale = a * resx2 / b;
      const transl = createTranslation([-pLookAt[0], -pLookAt[1], -pLookAt[2]]);

      const redpcam = transl.apply(pcam);
      const D = mhypot(redpcam[0], redpcam[1], redpcam[2]);
      const X = redpcam[0] / D;
      const Y = redpcam[1] / D;
      const Z = redpcam[2] / D;
      const m11 = Math.max(0.0001, msqrt(Math.max(0.000001, 1 - Y * Y)));
      const m00 = Z / m11;
      const m02 = -X / m11;
      const m10 = Y * m02;
      const m12 = -Y * m00;
      const m20 = X;
      const m21 = Y;
      const m22 = Z;

      function rotatePoint(point) {
        return [
          m00 * point[0] + m02 * point[2],
          m10 * point[0] + m11 * point[1] + m12 * point[2],
          m20 * point[0] + m21 * point[1] + m22 * point[2]
        ];
      }

      function pointToScreen(point) {
        const denom = Math.max(0.001, D - point[2]);
        return [
          (point[0] / denom * projScale) * params.zoom + resx2 + params.panX,
          (-point[1] / denom * projScale) * params.zoom + resy2 + params.panY
        ];
      }

      function projection(spaceCoords) {
        if (spaceCoords[0].length !== 3) {
          return pointToScreen(rotatePoint(transl.apply(spaceCoords)));
        } else {
          return spaceCoords.map(pt => pointToScreen(rotatePoint(transl.apply(pt))));
        }
      }

      return { pcam, pLookAt, D, a, th, resx, resy, projection };
    }

    function rebuildCubes() {
      arCubes = [];
      for (let kz = 0; kz < nbz; ++kz) {
        let z = kz - (nbz - 1) / 2;
        for (let ky = 0; ky < nby; ++ky) {
          let y = ky - (nby - 1) / 2;
          for (let kx = 0; kx < nbx; ++kx) {
            let x = kx - (nbx - 1) / 2;
            const col = getCubeColor(kx, ky, kz);
            arCubes.push(new Cube(x, y, z, col, kx, ky, kz));
          }
        }
      }
    }

    function startOver() {
      maxx = window.innerWidth;
      maxy = window.innerHeight;

      canv.style.left = '0px';
      canv.style.top = '0px';

      ctx.canvas.width = maxx;
      ctx.canvas.height = maxy;
      ctx.lineCap = 'round';

      if (maxx < 100) return false;
      xc = maxx / 2;
      yc = maxy / 2;

      rebuildCubes();
      return true;
    }

    // Dynamic noise generators
    let deplR, deply, deplfy;
    let theta = 0;
    let animState = 0;
    let lastRadius = 10, lastDeply = 0, lastDeplfy = 0;

    function resetMotionGenerators() {
      const periodR = Math.floor(220 + Math.random() * 260);
      const periodY = Math.floor(250 + Math.random() * 300);
      const periodFY = Math.floor(250 + Math.random() * 300);
      deplR = Noise1DOneShot(periodR, 0.8 * nbz, 2.1 * nbz);
      deply = Noise1DOneShot(periodY, -nby / 2, nby / 2);
      deplfy = Noise1DOneShot(periodFY, -nby / 2 - 1, nby / 2 + 1);
    }

    function randomizeScene() {
      // 1. Pick a random color scheme (exclude Custom Color)
      const selectable = COLOR_SCHEMES.filter(s => s !== "Custom Color");
      params.colorScheme = selectable[Math.floor(Math.random() * selectable.length)];

      // 2. Random base hue
      params.baseHue = Math.floor(Math.random() * 360);

      // 3. Random geometry and motion
      params.lineWidth = +(1.2 + Math.random() * 2.4).toFixed(1);
      params.cubeSize = +(0.26 + Math.random() * 0.32).toFixed(2);
      params.rotSpeed = +(0.001 + Math.random() * 0.004).toFixed(4);

      // 4. Background handling
      if (!params.greenscreen) {
        if (params.colorScheme.includes("White & Black")) {
          params.backgroundColor = "#ffffff";
        } else {
          const darkBgs = ["#000000", "#05070f", "#09050d", "#030a08", "#0b0805", "#070710"];
          params.backgroundColor = darkBgs[Math.floor(Math.random() * darkBgs.length)];
        }
      }

      // 5. Re-roll motion noise paths
      resetMotionGenerators();

      // 6. Update scene elements
      rebuildCubes();

      // 7. Update GUI controllers
      updateAllGuiControllers(gui);
    }

    function updateAllGuiControllers(rootGui) {
      if (!rootGui) return;
      if (rootGui.controllers) {
        rootGui.controllers.forEach(c => c.updateDisplay());
      }
      if (rootGui.folders) {
        rootGui.folders.forEach(f => updateAllGuiControllers(f));
      }
    }

    function animate() {
      window.requestAnimationFrame(animate);

      switch (animState) {
        case 0:
          if (startOver()) {
            resetMotionGenerators();
            ++animState;
          }
          break;
        case 1:
          const currentBg = params.greenscreen ? "#00ff00" : params.backgroundColor;
          document.body.style.backgroundColor = currentBg;
          ctx.fillStyle = currentBg;
          ctx.fillRect(0, 0, maxx, maxy);

          if (!params.paused) {
            theta = (theta + params.rotSpeed) % m2PI;
            lastRadius = deplR();
            lastDeply = deply();
            lastDeplfy = deplfy();
          }

          proj = createPerspective3(
            [lastRadius * msin(theta), lastDeply, lastRadius * mcos(theta)],
            [0, lastDeplfy, 0],
            0.5,
            0.5,
            maxx,
            maxy
          );

          for (let i = 0; i < arCubes.length; i++) {
            arCubes[i].draw();
          }
          break;
      }
    }

    // Initialize Canvas
    canv = document.createElement("canvas");
    canv.style.position = "absolute";
    document.body.appendChild(canv);
    ctx = canv.getContext("2d");

    // Initialize lil-gui
    const gui = new GUI({ title: "3D Grid Controls" });

    // Folder 1: Color Schemes & Appearance
    const fTheme = gui.addFolder("Colors & Themes");
    const schemeCtrl = fTheme.add(params, "colorScheme", COLOR_SCHEMES).name("Scheme");
    schemeCtrl.onChange((val) => {
      if (!params.greenscreen) {
        if (val.includes("White & Black")) {
          params.backgroundColor = "#ffffff";
        } else if (params.backgroundColor === "#ffffff") {
          params.backgroundColor = "#000000";
        }
      }
      updateCubeColors();
      updateAllGuiControllers(gui);
    });

    const hueCtrl = fTheme.add(params, "baseHue", 0, 360, 1).name("Base Hue");
    hueCtrl.onChange(() => updateCubeColors());

    const customColCtrl = fTheme.addColor(params, "customColor").name("Custom Color");
    customColCtrl.onChange(() => updateCubeColors());

    const lineWCtrl = fTheme.add(params, "lineWidth", 0.5, 8.0, 0.1).name("Line Width");

    // Folder 2: Background & Greenscreen
    const fBg = gui.addFolder("Background");
    fBg.add(params, "greenscreen").name("Greenscreen (#00ff00)");
    fBg.addColor(params, "backgroundColor").name("Background Color");

    // Folder 3: View & Transform (Zoom & Pan)
    const fView = gui.addFolder("View & Navigation");
    fView.add(params, "zoom", 0.1, 8.0, 0.05).name("Zoom Level");
    fView.add(params, "panX", -1200, 1200, 1).name("Pan X");
    fView.add(params, "panY", -1200, 1200, 1).name("Pan Y");
    fView.add(params, "resetView").name("Reset Pan & Zoom");

    // Folder 4: Geometry & Motion
    const fGeom = gui.addFolder("Geometry & Motion");
    const cubeSizeCtrl = fGeom.add(params, "cubeSize", 0.1, 0.8, 0.01).name("Cube Size");
    cubeSizeCtrl.onChange(() => updateCubeSizes());
    fGeom.add(params, "rotSpeed", 0.0, 0.02, 0.0005).name("Rotation Speed");
    fGeom.add(params, "paused").name("Pause Motion");

    // Folder 5: Procedural Variation
    const fRandom = gui.addFolder("Procedural Variation");
    fRandom.add(params, "randomizeOnClick").name("Randomize on Click");
    fRandom.add(params, "randomize").name("Generate New Variation");

    // Mouse Wheel Zoom
    window.addEventListener("wheel", (e) => {
      if (e.target.closest && e.target.closest(".lil-gui")) return;
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 0.92;
      params.zoom = Math.max(0.1, Math.min(10.0, +(params.zoom * factor).toFixed(3)));
      updateAllGuiControllers(gui);
    }, { passive: false });

    // Drag Object Across Screen
    let isPointerDown = false;
    let startX = 0, startY = 0;
    let initialPanX = 0, initialPanY = 0;
    let hasDragged = false;

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest && e.target.closest(".lil-gui")) return;
      isPointerDown = true;
      startX = e.clientX;
      startY = e.clientY;
      initialPanX = params.panX;
      initialPanY = params.panY;
      hasDragged = false;
    });

    window.addEventListener("pointermove", (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
      }
      params.panX = Math.round(initialPanX + dx);
      params.panY = Math.round(initialPanY + dy);
      updateAllGuiControllers(gui);
    });

    window.addEventListener("pointerup", (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      // If user clicked on scene without dragging, trigger random variation if enabled
      if (!hasDragged && params.randomizeOnClick) {
        randomizeScene();
      }
    });

    window.addEventListener("pointercancel", () => {
      isPointerDown = false;
    });

    // Toggle GUI with "H" key
    let isGuiVisible = true;
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
        isGuiVisible = !isGuiVisible;
        if (isGuiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Window Resize handling
    window.addEventListener("resize", () => {
      maxx = window.innerWidth;
      maxy = window.innerHeight;
      ctx.canvas.width = maxx;
      ctx.canvas.height = maxy;
      ctx.lineCap = "round";
      xc = maxx / 2;
      yc = maxy / 2;
    });

    // Start Animation Loop
    window.requestAnimationFrame(animate);
  </script>
</body>
</html>
