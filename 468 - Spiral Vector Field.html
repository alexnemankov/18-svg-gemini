// ============================================================================
// Needle Geometry Builder & InstancedMesh
// ============================================================================
function buildNeedleGeometry() {
  const shaftGeo = new THREE.CylinderGeometry(0.06, 0.16, 1.0, 10);
  shaftGeo.rotateX(Math.PI / 2);
  shaftGeo.translate(0, 0, 0.5);

  const baseGeo = new THREE.SphereGeometry(0.18, 10, 8);
  const tipGeo = new THREE.SphereGeometry(0.07, 8, 6);
  tipGeo.translate(0, 0, 1.0);

  const merged = mergeGeometries([shaftGeo, baseGeo, tipGeo], false);
  return merged;
}

const needleGeo = buildNeedleGeometry();
let needleMesh = null;
let gridPositions = [];

function setupGrid() {
  if (needleMesh) {
    scene.remove(needleMesh);
    needleMesh.geometry.dispose();
  }

  const res = PARAMS.geometry.gridResolution;
  const count = res * res;
  needleMesh = new THREE.InstancedMesh(needleGeo, needleMaterial, count);
  needleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

  const colors = new Float32Array(count * 3);
  needleMesh.instanceColor = new THREE.InstancedBufferAttribute(colors, 3);

  gridPositions = [];
  const fieldSpan = 52.0;
  const spacing = fieldSpan / (res - 1);
  const halfSpan = fieldSpan * 0.5;

  for (let j = 0; j < res; j++) {
    for (let i = 0; i < res; i++) {
      const px = i * spacing - halfSpan;
      const pz = j * spacing - halfSpan;
      gridPositions.push({ x: px, z: pz });
    }
  }

  scene.add(needleMesh);
}

setupGrid();

// ============================================================================
// Raymond G McCord (slow_izzm) Vector Field Math:
// calcVec(x, y) = new p5.Vector(y - x, -x - y)
// In 3D (X-Z plane): dx = x - cx, dz = z - cz
// h = (dz - dx, -dx - dz)
// ============================================================================
const tempColPrimary = new THREE.Color();
const tempColAccent = new THREE.Color();
const tempColCore = new THREE.Color();
const tempLerp = new THREE.Color();

let cx = 0;
let cz = 0;
let mouseWorldX = 0;
let mouseWorldZ = 0;
let mouseActiveFactor = 0;
let lastMouseMoveTime = 0;

const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPoint = new THREE.Vector3();

function updateVortexField(elapsed, dt) {
  // 1. Attractor center trajectory
  const autoRadius = PARAMS.animation.orbitRadius;
  const autoCx = Math.sin(elapsed * 0.58) * autoRadius + Math.cos(elapsed * 0.29) * (autoRadius * 0.35);
  const autoCz = Math.cos(elapsed * 0.44) * autoRadius + Math.sin(elapsed * 0.22) * (autoRadius * 0.45);

  const now = performance.now();
  if (now - lastMouseMoveTime < 2400) {
    mouseActiveFactor = Math.min(1.0, mouseActiveFactor + dt * 2.5);
  } else {
    mouseActiveFactor = Math.max(0.0, mouseActiveFactor - dt * 1.2);
  }

  const blend = PARAMS.animation.mouseInfluence * mouseActiveFactor;
  cx = THREE.MathUtils.lerp(autoCx, mouseWorldX, blend);
  cz = THREE.MathUtils.lerp(autoCz, mouseWorldZ, blend);

  const coreHeight = 1.0 + Math.sin(elapsed * 2.2) * 0.35;
  coreGroup.position.set(cx, coreHeight, cz);
  coreGroup.rotation.y = elapsed * 1.4;
  outerRingMesh.rotation.z = -elapsed * 2.0;

  vortexPointLight.position.set(cx, coreHeight + 0.8, cz);

  // 2. Needles transformation & instance matrix computation
  const matrixArray = needleMesh.instanceMatrix.array;
  const colorArray = needleMesh.instanceColor.array;
  const count = gridPositions.length;

  tempColPrimary.set(PARAMS.colors.needlePrimary);
  tempColAccent.set(PARAMS.colors.needleAccent);
  tempColCore.set(PARAMS.colors.vortexCore);

  const baseSizer = PARAMS.geometry.sizer;
  const baseThickness = PARAMS.geometry.thickness;
  const pitchAmp = PARAMS.geometry.pitchAmp;
  const waveAmp = PARAMS.geometry.waveAmp;
  const coneLift = PARAMS.geometry.coneLift;
  const swirl = PARAMS.animation.swirlPower;
  const waveFreq = PARAMS.animation.waveFreq;
  const waveSpeed = PARAMS.animation.waveSpeed;

  for (let i = 0; i < count; i++) {
    const pt = gridPositions[i];
    const dx = pt.x - cx;
    const dz = pt.z - cz;
    const dist = Math.sqrt(dx * dx + dz * dz) + 1e-5;

    // Logarithmic Spiral Vector calculation: calcVec(dx, dz)
    const hx = dz * swirl - dx;
    const hz = -dx - dz * swirl;
    const yaw = Math.atan2(hx, hz);

    // Dynamic wave elevation & cone vortex suction
    const wave = Math.sin(dist * waveFreq - elapsed * waveSpeed);
    const falloff = 1.0 / (1.0 + dist * 0.1);
    const cone = Math.exp(-dist * dist / 50.0);
    const py = wave * waveAmp * falloff + cone * coneLift;

    // 3D vertical deflection pitch towards/away from eye
    const pitch = Math.sin(dist * 0.28 - elapsed * 2.4) * pitchAmp * falloff;

    // Dynamic sizer pulse
    const sz = baseSizer * (0.85 + 0.3 * Math.cos(yaw * 2.0 + elapsed * 1.5));
    const sx = baseThickness;
    const sy = baseThickness;

    // Fast orthonormal matrix calculation
    const sinYaw = Math.sin(yaw);
    const cosYaw = Math.cos(yaw);
    const sinPitch = Math.sin(pitch);
    const cosPitch = Math.cos(pitch);

    const mIdx = i * 16;
    // Col 0 (+X)
    matrixArray[mIdx + 0] = sx * cosYaw;
    matrixArray[mIdx + 1] = 0;
    matrixArray[mIdx + 2] = -sx * sinYaw;
    matrixArray[mIdx + 3] = 0;

    // Col 1 (+Y)
    matrixArray[mIdx + 4] = -sy * sinYaw * sinPitch;
    matrixArray[mIdx + 5] = sy * cosPitch;
    matrixArray[mIdx + 6] = -sy * cosYaw * sinPitch;
    matrixArray[mIdx + 7] = 0;

    // Col 2 (+Z forward along needle)
    matrixArray[mIdx + 8] = sz * sinYaw * cosPitch;
    matrixArray[mIdx + 9] = sz * sinPitch;
    matrixArray[mIdx + 10] = sz * cosYaw * cosPitch;
    matrixArray[mIdx + 11] = 0;

    // Col 3 (Position)
    matrixArray[mIdx + 12] = pt.x;
    matrixArray[mIdx + 13] = py;
    matrixArray[mIdx + 14] = pt.z;
    matrixArray[mIdx + 15] = 1.0;

    // Dynamic Color Gradient
    const coreProximity = Math.exp(-dist * 0.18);
    const waveColorLerp = 0.5 + 0.5 * Math.sin(yaw * 2.0 + elapsed * 2.0);
    tempLerp.copy(tempColPrimary).lerp(tempColAccent, waveColorLerp);
    tempLerp.lerp(tempColCore, coreProximity * 0.85);

    const cIdx = i * 3;
    colorArray[cIdx + 0] = tempLerp.r;
    colorArray[cIdx + 1] = tempLerp.g;
    colorArray[cIdx + 2] = tempLerp.b;
  }

  needleMesh.instanceMatrix.needsUpdate = true;
  needleMesh.instanceColor.needsUpdate = true;
}

// ============================================================================
// Camera Animations (8 modes + user zoom, drag pan & orbit angle)
// ============================================================================
const camPosBase = new THREE.Vector3();
const camTargetBase = new THREE.Vector3();
const camOffset = new THREE.Vector3();
const camRight = new THREE.Vector3();
const camUp = new THREE.Vector3();

function updateCamera(elapsed) {
  const mode = PARAMS.camera.animationMode;
  let targetX = 0;
  let targetY = 1.0;
  let targetZ = 0;

  switch (mode) {
    case 'Vortex Orbit': {
      const r = 44.0;
      camPosBase.set(
        Math.cos(elapsed * 0.14) * r,
        24.0 + Math.sin(elapsed * 0.1) * 3.5,
        Math.sin(elapsed * 0.14) * r
      );
      camTargetBase.set(0, 1.2, 0);
      break;
    }
    case 'Horizon Skim': {
      const r = 32.0;
      camPosBase.set(
        Math.cos(elapsed * 0.11) * r,
        4.8 + Math.sin(elapsed * 0.18) * 1.8,
        Math.sin(elapsed * 0.11) * r
      );
      camTargetBase.set(0, 1.5, 0);
      break;
    }
    case 'Overhead Mandala': {
      const r = 8.5;
      camPosBase.set(
        Math.cos(elapsed * 0.08) * r,
        56.0,
        Math.sin(elapsed * 0.08) * r
      );
      camTargetBase.set(0, 0, 0);
      break;
    }
    case 'Breathing Drift': {
      camPosBase.set(
        Math.sin(elapsed * 0.13) * 38.0,
        22.0 + Math.sin(elapsed * 0.22) * 6.5,
        Math.cos(elapsed * 0.09) * 38.0
      );
      camTargetBase.set(0, 1.5, 0);
      break;
    }
    case 'Spiral Descend': {
      const cycle = (elapsed * 0.08) % (Math.PI * 2);
      const r = 26.0 + Math.sin(cycle) * 12.0;
      camPosBase.set(
        Math.cos(elapsed * 0.16) * r,
        14.0 + Math.cos(cycle) * 10.0,
        Math.sin(elapsed * 0.16) * r
      );
      camTargetBase.set(0, 1.0, 0);
      break;
    }
    case 'Cinematic Diagonal': {
      const dist = 42.0 + Math.sin(elapsed * 0.12) * 5.0;
      camPosBase.set(
        dist * 0.707,
        22.0 + Math.cos(elapsed * 0.1) * 3.0,
        dist * 0.707
      );
      camTargetBase.set(0, 1.2, 0);
      break;
    }
    case 'Core Focus': {
      const r = 20.0;
      camPosBase.set(
        Math.cos(elapsed * 0.2) * r,
        11.0 + Math.sin(elapsed * 0.14) * 2.5,
        Math.sin(elapsed * 0.2) * r
      );
      targetX = cx * 0.45;
      targetZ = cz * 0.45;
      camTargetBase.set(targetX, 1.2, targetZ);
      break;
    }
    case 'Static Camera':
    default: {
      camPosBase.set(0, 28.0, 42.0);
      camTargetBase.set(0, 1.0, 0);
      break;
    }
  }

  // Preserve user zoom without snapping back
  camOffset.subVectors(camPosBase, camTargetBase);
  const baseDist = camOffset.length();
  const effectiveDist = baseDist / Math.max(0.1, PARAMS.camera.userZoom);
  camOffset.normalize().multiplyScalar(effectiveDist);

  // Apply user orbit yaw and pitch offsets
  const yawAngle = PARAMS.camera.angleYaw;
  const pitchAngle = PARAMS.camera.anglePitch;

  // Rotate around global Y
  const cosY = Math.cos(yawAngle);
  const sinY = Math.sin(yawAngle);
  const rx = camOffset.x * cosY - camOffset.z * sinY;
  const rz = camOffset.x * sinY + camOffset.z * cosY;
  camOffset.x = rx;
  camOffset.z = rz;

  // Pitch rotation around view right axis
  camRight.crossVectors(camOffset, new THREE.Vector3(0, 1, 0)).normalize();
  camOffset.applyAxisAngle(camRight, pitchAngle);

  // Apply user pan offset (in camera view plane)
  camUp.crossVectors(camRight, camOffset).normalize();
  const panOffset = new THREE.Vector3()
    .addScaledVector(camRight, PARAMS.camera.panX)
    .addScaledVector(camUp, PARAMS.camera.panY);

  camera.position.addVectors(camTargetBase, camOffset).add(panOffset);
  camera.lookAt(camTargetBase.clone().add(panOffset));
}

// Interactive Controls (Zoom with wheel, Drag across screen, Orbit Angle)
// ============================================================================
let isDragging = false;
let dragButton = 0;
let dragStartX = 0;
let dragStartY = 0;
let didMove = false;

window.addEventListener('wheel', (e) => {
  // Zoom in or out during any camera animation without returning to predefined zoom
  const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
  PARAMS.camera.userZoom = THREE.MathUtils.clamp(PARAMS.camera.userZoom * zoomFactor, 0.2, 5.0);
}, { passive: true });

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.lil-gui')) return;
  isDragging = true;
  dragButton = e.button;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  didMove = false;
});

window.addEventListener('pointermove', (e) => {
  // Track mouse coordinates for subtle vortex tracking
  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  if (raycaster.ray.intersectPlane(groundPlane, hitPoint)) {
    mouseWorldX = hitPoint.x;
    mouseWorldZ = hitPoint.z;
    lastMouseMoveTime = performance.now();
  }

  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (Math.hypot(dx, dy) > 4) {
    didMove = true;
  }
  dragStartX = e.clientX;
  dragStartY = e.clientY;

  if (dragButton === 0 && !e.shiftKey && !e.altKey) {
    // Left drag: drag object/scene across screen (pan in camera view plane)
    const panSens = 0.03 * (1.0 / PARAMS.camera.userZoom);
    PARAMS.camera.panX -= dx * panSens;
    PARAMS.camera.panY += dy * panSens;
  } else {
    // Right drag or Shift+drag: change camera angle during orbit or any animation
    const angleSens = 0.005;
    PARAMS.camera.angleYaw -= dx * angleSens;
    PARAMS.camera.anglePitch = THREE.MathUtils.clamp(PARAMS.camera.anglePitch + dy * angleSens, -1.35, 1.35);
  }
});

window.addEventListener('pointerup', (e) => {
  if (isDragging && !didMove && PARAMS.interaction.randomizeOnClick && !e.target.closest('.lil-gui')) {
    // Pure user click on scene: randomly generate new theme, motion & geometric parameters
    randomizeScene();
  }
  isDragging = false;
});

window.addEventListener('contextmenu', (e) => {
  e.preventDefault();
});

// Hide/Show GUI with "H" key
let guiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    guiVisible = !guiVisible;
    gui.domElement.style.display = guiVisible ? '' : 'none';
  }
});

// ============================================================================
// Palette & Scene Color Application
// ============================================================================
function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;
  PARAMS.colors.needlePrimary = scheme.needlePrimary;
  PARAMS.colors.needleAccent = scheme.needleAccent;
  PARAMS.colors.vortexCore = scheme.vortexCore;
  PARAMS.colors.floor = scheme.floor;
  PARAMS.colors.background = scheme.background;

  applyBackgroundAndFog();
  applyMaterials();
  applyLights();
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

function applyBackgroundAndFog() {
  if (PARAMS.colors.greenscreen) {
    const green = new THREE.Color('#00ff00');
    scene.background = green;
    scene.fog.color.copy(green);
    document.body.style.backgroundColor = '#00ff00';
    floorMesh.visible = false;
  } else {
    const bg = new THREE.Color(PARAMS.colors.background);
    scene.background = bg;
    scene.fog.color.copy(bg);
    document.body.style.backgroundColor = PARAMS.colors.background;
    floorMesh.visible = true;
  }
}

function applyMaterials() {
  needleMaterial.metalness = PARAMS.material.metalness;
  needleMaterial.roughness = PARAMS.material.roughness;

  floorMaterial.color.set(PARAMS.colors.floor);
  coreMat.color.set(PARAMS.colors.vortexCore);
  coreMesh.scale.setScalar(PARAMS.material.coreGlow);
}

function applyLights() {
  const m = PARAMS.lighting.masterIntensity;
  ambientLight.intensity = PARAMS.lighting.ambient * m * PARAMS.individualLights.ambient;
  keyLight.intensity = PARAMS.lighting.keyLight * m * PARAMS.individualLights.keyLight;
  vortexPointLight.intensity = PARAMS.lighting.vortexPoint * m * PARAMS.individualLights.vortexPoint;
  vortexPointLight.color.set(PARAMS.colors.vortexCore);
  rimLight.intensity = PARAMS.lighting.rimLight * m * PARAMS.individualLights.rimLight;
  fillLight.intensity = PARAMS.lighting.fillLight * m * PARAMS.individualLights.fillLight;
  renderer.toneMappingExposure = PARAMS.lighting.exposure;
}

// ============================================================================
// Procedural Variation Generator (Randomize on Click)
// ============================================================================
function randomizeScene() {
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const pickedScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  PARAMS.colors.scheme = pickedScheme;
  applyColorScheme(pickedScheme);

  // Geometric parameters
  PARAMS.geometry.sizer = +(0.9 + Math.random() * 2.2).toFixed(2);
  PARAMS.geometry.thickness = +(0.08 + Math.random() * 0.22).toFixed(2);
  PARAMS.geometry.pitchAmp = +(0.25 + Math.random() * 0.85).toFixed(2);
  PARAMS.geometry.waveAmp = +(0.35 + Math.random() * 1.4).toFixed(2);
  PARAMS.geometry.coneLift = +(0.4 + Math.random() * 2.2).toFixed(2);

  // Motion & Animation parameters
  PARAMS.animation.timeScale = +(0.5 + Math.random() * 1.5).toFixed(2);
  PARAMS.animation.waveFreq = +(0.08 + Math.random() * 0.25).toFixed(2);
  PARAMS.animation.waveSpeed = +(0.8 + Math.random() * 2.4).toFixed(2);
  PARAMS.animation.swirlPower = +(0.5 + Math.random() * 1.6).toFixed(2);
  PARAMS.animation.orbitRadius = +(6.0 + Math.random() * 9.0).toFixed(2);

  // Material & Lighting
  PARAMS.material.metalness = +(0.1 + Math.random() * 0.8).toFixed(2);
  PARAMS.material.roughness = +(0.15 + Math.random() * 0.65).toFixed(2);
  PARAMS.material.coreGlow = +(0.8 + Math.random() * 2.0).toFixed(2);
  PARAMS.lighting.exposure = +(0.8 + Math.random() * 0.6).toFixed(2);
  PARAMS.lighting.masterIntensity = +(0.8 + Math.random() * 0.6).toFixed(2);

  // Camera preset
  PARAMS.camera.animationMode = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];

  applyMaterials();
  applyLights();
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

// ============================================================================
// Control Panel (lil-gui: "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js")
// ============================================================================
const gui = new GUI({ title: 'Spiral Vector Field (Izzms)' });

// 1. Color Schemes & Greenscreen
const fCol = gui.addFolder('Color Schemes');
fCol.add(PARAMS.colors, 'scheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange(applyColorScheme);
fCol.add(PARAMS.colors, 'greenscreen').name('Greenscreen #00ff00').onChange(applyBackgroundAndFog);
fCol.addColor(PARAMS.colors, 'background').name('Background Color').onChange(applyBackgroundAndFog);
fCol.addColor(PARAMS.colors, 'needlePrimary').name('Needle Primary').onChange(() => {});
fCol.addColor(PARAMS.colors, 'needleAccent').name('Needle Accent').onChange(() => {});
fCol.addColor(PARAMS.colors, 'vortexCore').name('Vortex Core').onChange(() => {
  coreMat.color.set(PARAMS.colors.vortexCore);
  vortexPointLight.color.set(PARAMS.colors.vortexCore);
});
fCol.addColor(PARAMS.colors, 'floor').name('Floor Color').onChange((v) => { floorMaterial.color.set(v); });

// 2. Camera & Animations (8 modes + zoom, angle & pan)
const fCam = gui.addFolder('Camera & Animation');
fCam.add(PARAMS.camera, 'animationMode', ANIMATION_MODES).name('Animation Mode');
fCam.add(PARAMS.camera, 'userZoom', 0.2, 5.0, 0.01).name('Zoom Factor');
fCam.add(PARAMS.camera, 'panX', -30, 30, 0.1).name('Pan Screen X');
fCam.add(PARAMS.camera, 'panY', -25, 25, 0.1).name('Pan Screen Y');
fCam.add(PARAMS.camera, 'angleYaw', -Math.PI, Math.PI, 0.01).name('Orbit Yaw Angle');
fCam.add(PARAMS.camera, 'anglePitch', -1.35, 1.35, 0.01).name('Orbit Pitch Angle');
fCam.add(PARAMS.camera, 'fov', 25, 85, 1).name('Base FOV').onChange((v) => {
  camera.fov = v;
  camera.updateProjectionMatrix();
});
fCam.add({ resetView: () => {
  PARAMS.camera.userZoom = 1.0;
  PARAMS.camera.panX = 0;
  PARAMS.camera.panY = 0;
  PARAMS.camera.angleYaw = 0;
  PARAMS.camera.anglePitch = 0;
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}}, 'resetView').name('Reset Drag / Zoom');

// 3. Animation Speed & Dynamics
const fAnim = gui.addFolder('Animation Speed & Motion');
fAnim.add(PARAMS.animation, 'timeScale', 0, 3.5, 0.02).name('Animation Speed');
fAnim.add(PARAMS.animation, 'waveFreq', 0.04, 0.45, 0.01).name('Wave Frequency');
fAnim.add(PARAMS.animation, 'waveSpeed', 0.2, 4.0, 0.05).name('Wave Ripple Speed');
fAnim.add(PARAMS.animation, 'swirlPower', 0.1, 2.5, 0.02).name('Vortex Swirl Power');
fAnim.add(PARAMS.animation, 'orbitRadius', 0, 18, 0.2).name('Vortex Orbit Radius');
fAnim.add(PARAMS.animation, 'mouseInfluence', 0, 1.0, 0.02).name('Mouse Influence');

// 4. Geometry & Needle Dimensions
const fGeo = gui.addFolder('Geometry & Needles');
fGeo.add(PARAMS.geometry, 'sizer', 0.5, 4.0, 0.05).name('Needle Length (sizer)');
fGeo.add(PARAMS.geometry, 'thickness', 0.05, 0.45, 0.01).name('Needle Thickness');
fGeo.add(PARAMS.geometry, 'pitchAmp', 0, 1.2, 0.02).name('Vertical Pitch Amp');
fGeo.add(PARAMS.geometry, 'waveAmp', 0, 3.0, 0.05).name('Wave Elevation Amp');
fGeo.add(PARAMS.geometry, 'coneLift', 0, 4.0, 0.05).name('Vortex Cone Lift');
fGeo.add(PARAMS.geometry, 'gridResolution', 26, 70, 2).name('Grid Density').onFinishChange(setupGrid);

// 5. Materials
const fMat = gui.addFolder('Materials');
fMat.add(PARAMS.material, 'metalness', 0, 1, 0.01).name('Metalness').onChange(applyMaterials);
fMat.add(PARAMS.material, 'roughness', 0.05, 0.95, 0.01).name('Roughness').onChange(applyMaterials);
fMat.add(PARAMS.material, 'coreGlow', 0.4, 4.0, 0.05).name('Core Glow Size').onChange(applyMaterials);

// 6. Lighting & Light Sources
const fLight = gui.addFolder('Lighting');
fLight.add(PARAMS.lighting, 'masterIntensity', 0, 3.0, 0.02).name('Scene Light Intensity').onChange(applyLights);
fLight.add(PARAMS.lighting, 'exposure', 0.2, 3.0, 0.02).name('Exposure').onChange(applyLights);

const fIndLight = fLight.addFolder('Individual Light Sources');
fIndLight.add(PARAMS.individualLights, 'ambient', 0, 3.0, 0.05).name('Ambient Light').onChange(applyLights);
fIndLight.add(PARAMS.individualLights, 'keyLight', 0, 4.0, 0.05).name('Key Light').onChange(applyLights);
fIndLight.add(PARAMS.individualLights, 'vortexPoint', 0, 5.0, 0.05).name('Vortex Core Light').onChange(applyLights);
fIndLight.add(PARAMS.individualLights, 'rimLight', 0, 4.0, 0.05).name('Rim Light').onChange(applyLights);
fIndLight.add(PARAMS.individualLights, 'fillLight', 0, 3.0, 0.05).name('Fill Light').onChange(applyLights);

// 7. Post-Processing
const fPost = gui.addFolder('Post Processing');
fPost.add(PARAMS.post, 'bloomStrength', 0, 2.5, 0.02).name('Bloom Strength').onChange((v) => { bloomPass.strength = v; });
fPost.add(PARAMS.post, 'bloomRadius', 0, 1.2, 0.02).name('Bloom Radius').onChange((v) => { bloomPass.radius = v; });
fPost.add(PARAMS.post, 'bloomThreshold', 0, 2.0, 0.02).name('Bloom Threshold').onChange((v) => { bloomPass.threshold = v; });

// 8. Performance & System
const fPerf = gui.addFolder('Performance & System');
fPerf.add(PARAMS.performance, 'dpr', 0.5, 2.5, 0.05).name('DPR (Pixel Ratio)').onChange((v) => {
  renderer.setPixelRatio(v);
  composer.setPixelRatio(v);
  composer.setSize(window.innerWidth, window.innerHeight);
  smaaPass.setSize(window.innerWidth * v, window.innerHeight * v);
});
fPerf.add(PARAMS.performance, 'antialias').name('Antialias (SMAA)').onChange((v) => { smaaPass.enabled = v; });
fPerf.add(PARAMS.interaction, 'randomizeOnClick').name('Randomize on Click');
fPerf.add({ randomizeNow: randomizeScene }, 'randomizeNow').name('Randomize Scene Now');
fPerf.add(PARAMS.performance, 'paused').name('Pause Animation');

// ============================================================================
// Resize Handling
// ============================================================================
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  smaaPass.setSize(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
});

// Initial Setup
applyBackgroundAndFog();
applyMaterials();
applyLights();

// ============================================================================
// Main Animation Loop
// ============================================================================
const clock = new THREE.Clock();
let elapsed = 0;

document.addEventListener('visibilitychange', () => {
  clock.getDelta();
});

renderer.setAnimationLoop(() => {
  const rawDt = Math.min(clock.getDelta(), 0.1);
  if (PARAMS.performance.paused) {
    composer.render();
    return;
  }

  const dt = rawDt * PARAMS.animation.timeScale;
  elapsed += dt;

  updateVortexField(elapsed, dt);
  updateCamera(elapsed);
  composer.render();
});
</script>
