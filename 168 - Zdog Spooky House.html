<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zdog Spooky House</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1B2838;
      color: #EEE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .zdog-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: move;
      touch-action: none;
    }
  </style>
  <!-- Zdog 3D Canvas Engine -->
  <script src="https://unpkg.com/zdog@1/dist/zdog.dist.min.js"></script>
</head>
<body>

  <canvas class="zdog-canvas"></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // namespace
    window.ZdogSpookyHouse = {
      wobbling: true,
      sceneY: 12,
      hillScale: 0.75,
      color: {
        deep: 'hsl(230, 60%, 40%)',
        dark: 'hsl(230, 60%, 50%)',
        darker: '#2a3a81',
        medium: 'hsl(230, 60%, 60%)',
        light: 'hsl(230, 60%, 70%)',
        pale: '#6D77AD',
        highlight: '#FFBB00',
        fog: 'hsla(230, 60%, 80%, 0.4)',
        paintjob: '#d59c55',
      }
    };

    // Color Scheme Presets
    const colorSchemes = {
      'Spooky Night': {
        bgColor: '#1B2838',
        deep: 'hsl(230, 60%, 40%)',
        dark: 'hsl(230, 60%, 50%)',
        darker: '#2a3a81',
        medium: 'hsl(230, 60%, 60%)',
        light: 'hsl(230, 60%, 70%)',
        pale: '#6D77AD',
        highlight: '#FFBB00',
        fog: 'hsla(230, 60%, 80%, 0.4)',
        paintjob: '#d59c55',
      },
      'Neon Synthwave': {
        bgColor: '#120024',
        deep: '#2a0845',
        dark: '#4d086f',
        darker: '#1a032a',
        medium: '#8a2be2',
        light: '#00f3ff',
        pale: '#ff007f',
        highlight: '#ffe600',
        fog: 'rgba(0, 243, 255, 0.4)',
        paintjob: '#ff007f',
      },
      'Crimson Horror': {
        bgColor: '#140505',
        deep: '#3b0000',
        dark: '#5c0808',
        darker: '#220000',
        medium: '#8b1e1e',
        light: '#c24b4b',
        pale: '#d8b4a0',
        highlight: '#ff5533',
        fog: 'rgba(180, 40, 40, 0.4)',
        paintjob: '#8b0000',
      },
      'Toxic Wasteland': {
        bgColor: '#05140a',
        deep: '#0b3319',
        dark: '#13522b',
        darker: '#041a0c',
        medium: '#278a4d',
        light: '#52d683',
        pale: '#a0d8b4',
        highlight: '#ccff00',
        fog: 'rgba(57, 255, 20, 0.4)',
        paintjob: '#39ff14',
      },
      'Ghostly Twilight': {
        bgColor: '#0f141d',
        deep: '#1c2536',
        dark: '#2e3b52',
        darker: '#0b0f17',
        medium: '#485a78',
        light: '#7a91b5',
        pale: '#a3b5d1',
        highlight: '#e2f1ff',
        fog: 'rgba(160, 200, 240, 0.4)',
        paintjob: '#70a9a1',
      }
    };

    // Global settings object
    const settings = {
      greenscreen: false,
      bgColor: '#1B2838',
      colorPreset: 'Spooky Night',
      animPreset: 'Wobble Orbit',
      animSpeed: 1.0,
      zoom: 2.75,
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      dragMode: 'Rotate',
      uploadSVG: function() { fileInput.click(); }
    };

    // Helper to assign color keys for dynamic updates
    function setKey(shape, colorKey, backfaceKey) {
      if (shape) {
        if (colorKey) shape._colorKey = colorKey;
        if (backfaceKey) shape._backfaceKey = backfaceKey;
      }
      return shape;
    }

    // ------------------------- bones ------------------------- //
    ZdogSpookyHouse.addBones = function( options ) {
      var TAU = Zdog.TAU;
      var lineX = 2;
      var color = ZdogSpookyHouse.color.light;
      var stroke = 1.3;

      var line = setKey(new Zdog.Shape({
        addTo: options.addTo,
        path: [ { x: -lineX }, { x: lineX } ],
        closed: false,
        stroke: stroke,
        color: color,
        translate: { y: 12, z: -30 },
        rotate: { y: TAU/16, z: TAU/16 },
      }), 'light');

      var halfFemur = setKey(line.copy({
        translate: { x: -6, y: 15, z: -28 },
        rotate: { y: -TAU/8, z: TAU/8 },
      }), 'light');

      var femurEnd = setKey(line.copy({
        addTo: halfFemur,
        path: [
          { x: 1, y: -1 },
          { x: 0, y:  0 },
          { x: 1, y:  1 },
        ],
        closed: false,
        rotate: null,
        translate: { x: lineX },
      }), 'light');

      halfFemur.copyGraph({
        translate: { x: 1, y: 6, z: -31 },
        rotate: { z: -TAU/8, x: TAU/8 },
        scale: 0.75,
      });

      setKey(line.copy({
        scale: 0.25,
        translate: { y: 18, z: -26 },
        rotate: { z: TAU/8 },
      }), 'light');

      var fullFemur = halfFemur.copyGraph({
        translate: { x: -9, y: 10, z: -30 },
        rotate: { z: -TAU/16 },
      });

      setKey(femurEnd.copy({
        addTo: fullFemur,
        scale: { x: -1 },
        translate: { x: -lineX },
      }), 'light');

      setKey(line.copy({
        scale: 0.4,
        translate: { x: -12, y: 14, z: -28 },
        rotate: { z: -TAU/16 },
      }), 'light');
    };

    // ------------------------- car & road ------------------------- //
    ZdogSpookyHouse.addCarRoad = function( options ) {
      var color = ZdogSpookyHouse.color;
      var TAU = Zdog.TAU;

      var roadRadius = 120;
      var roadSegmentCount = 40;
      var roadSegmentZ = 5;
      var roadSegmentX = (roadRadius + roadSegmentZ) * TAU / roadSegmentCount / 2;

      var roadSegmentPath = [
        { x: -roadSegmentX + 1, z:  roadSegmentZ },
        { x:  roadSegmentX - 1, z:  roadSegmentZ },
        { x:  roadSegmentX,     z: -roadSegmentZ },
        { x: -roadSegmentX,     z: -roadSegmentZ },
      ];

      for ( var i = 0; i < roadSegmentCount; i++ ) {
        var roadAngle = i/roadSegmentCount * TAU;
        setKey(new Zdog.Shape({
          addTo: options.addTo,
          path: roadSegmentPath,
          translate: {
            x: Math.cos( roadAngle ) * roadRadius,
            z: Math.sin( roadAngle ) * roadRadius,
          },
          rotate: { y: roadAngle + TAU/4 },
          fill: true,
          stroke: 2,
          color: color.deep,
        }), 'deep');
      }

      // car
      var bottomY = -1;
      var middleY = -2.5;
      var topY = -4.5;
      var outerZ = 2.5;
      var innerZ = 1.5;
      var grillX = -5;
      var hoodX = -4;
      var wipersX = -2;
      var windshieldX = -1;
      var roofX = 2;
      var trunkX = 4;
      var bumperX = 5;

      var driverPoints = {
        grill: new Zdog.Vector({ x: grillX, y: bottomY, z: outerZ }),
        hood: new Zdog.Vector({ x: hoodX, y: middleY, z: outerZ }),
        wipers: new Zdog.Vector({ x: wipersX, y: middleY, z: outerZ }),
        windshield: new Zdog.Vector({ x: windshieldX, y: topY, z: innerZ }),
        roof: new Zdog.Vector({ x: roofX, y: topY, z: innerZ }),
        trunk: new Zdog.Vector({ x: trunkX, y: middleY, z: outerZ }),
        bumper: new Zdog.Vector({ x: bumperX, y: bottomY, z: outerZ }),
      };

      var passengerPoints = {};
      for ( var pointName in driverPoints ) {
        var driverPoint = driverPoints[ pointName ];
        passengerPoints[ pointName ] = driverPoint.copy().multiply({ z: -1 });
      }

      var carRotor = new Zdog.Anchor({
        addTo: options.addTo,
      });

      var carAnchorY = -6;

      var carAnchor = new Zdog.Group({
        addTo: carRotor,
        translate: { z: roadRadius - 0, y: carAnchorY },
        scale: 1.2,
        updateSort: true,
      });

      var carSide = setKey(new Zdog.Shape({
        addTo: carAnchor,
        path: [
          driverPoints.grill, driverPoints.hood, driverPoints.wipers,
          driverPoints.windshield, driverPoints.roof, driverPoints.trunk,
          driverPoints.bumper
        ],
        stroke: 2,
        fill: true,
        color: color.paintjob,
      }), 'paintjob');

      setKey(carSide.copy({
        scale: { z: -1 },
      }), 'paintjob');

      function getCarPanel( pointNameA, pointNameB, panelColorKey ) {
        var key = panelColorKey || 'paintjob';
        return setKey(carSide.copy({
          path: [
            driverPoints[ pointNameA ], driverPoints[ pointNameB ],
            passengerPoints[ pointNameB ], passengerPoints[ pointNameA ],
          ],
          color: ZdogSpookyHouse.color[key],
        }), key);
      }

      getCarPanel( 'grill', 'hood', 'paintjob' );
      getCarPanel( 'hood', 'wipers', 'paintjob' );
      getCarPanel( 'wipers', 'windshield', 'medium' );
      getCarPanel( 'windshield', 'roof', 'paintjob' );
      getCarPanel( 'roof', 'trunk', 'medium' );
      getCarPanel( 'trunk', 'bumper', 'paintjob' );

      var tireTranslate = new Zdog.Vector({ x: -3.5, z: outerZ, y: bottomY });

      var tire = setKey(new Zdog.Ellipse({
        addTo: carAnchor,
        diameter: 1.8,
        translate: tireTranslate,
        stroke: 2,
        fill: true,
        color: color.paintjob,
      }), 'paintjob');

      setKey(tire.copy({
        translate: tireTranslate.copy().multiply({ x: -1 }),
      }), 'paintjob');
      setKey(tire.copy({
        translate: tireTranslate.copy().multiply({ z: -1 }),
      }), 'paintjob');
      setKey(tire.copy({
        translate: tireTranslate.copy().multiply({ x: -1, z: -1 }),
      }), 'paintjob');

      function animate( progress ) {
        carRotor.rotate.y = Zdog.easeInOut( progress/4 % 1 ) * TAU + TAU * 3/8;
        carAnchor.rotate.x = Math.sin( progress * TAU * 2 ) * 0.1;
        carAnchor.translate.y = Math.sin( progress * TAU * 1.5 ) * 2 + carAnchorY;
      }

      return { animate: animate };
    };

    // ------------------------- cats ------------------------- //
    ZdogSpookyHouse.addCats = function( options ) {
      var TAU = Zdog.TAU;
      var color = ZdogSpookyHouse.color;
      var catScale = 1.1;

      var cat = new Zdog.Anchor({
        addTo: options.addTo,
        translate: { z: -22, x: -28, y: -2 },
        scale: catScale,
        rotate: { y: TAU/8 },
      });

      setKey(new Zdog.Cone({
        addTo: cat,
        diameter: 1,
        length: 3,
        rotate: { x: TAU/4 },
        stroke: 4 * catScale,
        color: color.deep,
      }), 'deep');

      var catHead = setKey(new Zdog.Shape({
        addTo: cat,
        translate: { y: -4 },
        stroke: 5 * catScale,
        color: color.deep,
      }), 'deep');

      var catEye = setKey(new Zdog.Shape({
        addTo: catHead,
        translate: { x: -1, z: 1 },
        stroke: 0.9 * catScale,
        color: color.highlight,
      }), 'highlight');
      
      setKey(catEye.copy({
        translate: { x: 1, z: 1 },
      }), 'highlight');

      var catEarPointA = { x: -1, y:  1 };
      var catEarPointB = { x: -1, y: -1 };
      var catEarPointC = { x:  1, y:  1 };
      var catEarPointD = { x:  1, y:  1, z: -1 };

      var catEar = new Zdog.Anchor({
        addTo: catHead,
        scale: new Zdog.Vector({ x: 1, y: 1, z: 1.25 }),
      });

      var catEarPanel = setKey(new Zdog.Shape({
        addTo: catEar,
        path: [ catEarPointA, catEarPointB, catEarPointD ],
        translate: { x: -0.96, y: -1.5, z: 0 },
        stroke: 0.6 * catScale,
        fill: true,
        color: color.deep,
      }), 'deep');

      setKey(catEarPanel.copy({
        path: [ catEarPointB, catEarPointC, catEarPointD ],
      }), 'deep');

      catEar.copyGraph({
        scale: catEar.scale.copy().multiply({ x: -1 }),
      });

      setKey(new Zdog.Shape({
        addTo: cat,
        path: [
          {},
          { bezier: [
            { x:  4, y:  0, z: -4 },
            { x:  0, y: -3, z: 0 },
            { x:  3, y: -5, z: -1 },
          ]},
        ],
        closed: false,
        translate: { z: -1 },
        stroke: 0 * catScale,
        color: color.deep,
      }), 'deep');

      cat.copyGraph({
        translate: { z: -6, x: -42, y: -15 },
        scale: catScale,
        rotate: { y: TAU/4 },
      });

      cat.copyGraph({
        translate: { z: -30, x: -30, y: -2 },
        scale: catScale,
        rotate: { y: TAU/4 },
      });
    };

    // ------------------------- fogMonster ------------------------- //
    ZdogSpookyHouse.addFogMonster = function( options ) {
      var TAU = Zdog.TAU;
      var color = ZdogSpookyHouse.color;
      var radius = 54;

      var rotor = new Zdog.Anchor( options );
      var segmentCount = 74;
      var trailEndAngle = TAU * 4/8;
      var segments = [];

      for ( var i = 0; i < segmentCount; i++ ) {
        var alpha = i / segmentCount;
        var angle = alpha * trailEndAngle;
        var segment = setKey(new Zdog.Shape({
          addTo: rotor,
          path: [ {}, { x: radius * TAU / segmentCount * 0.8 } ],
          stroke: 22 + 8 * -Math.cos( TAU/8 * ( 3 + alpha * 5 ) ),
          translate: {
            x: Math.sin( angle ) * radius,
            z: Math.cos( angle ) * radius,
            y: Math.sin( angle * 4 ) * 6,
          },
          rotate: { y: alpha * -trailEndAngle },
          color: color.fog,
        }), 'fog');
        segments.push( segment );
      }

      var monsterEye = setKey(new Zdog.Shape({
        addTo: segments[0],
        translate: { x: -10, z: 8 },
        color: color.deep,
        stroke: 3.5,
      }), 'deep');

      setKey(monsterEye.copy({
        translate: { x: -10, z: -8 },
      }), 'deep');

      setKey(new Zdog.Ellipse({
        addTo: segments[0],
        translate: { x: -10, y: 4 },
        quarters: 2,
        rotate: { z: TAU/4, y: TAU/4 },
        closed: true,
        diameter: 8,
        stroke: false,
        fill: true,
        color: color.deep,
      }), 'deep');

      function animate( progress ) {
        var rotorRY = rotor.rotate.y = progress * TAU/6;
        segments.forEach( function( segment, i ) {
          var alpha = i / segmentCount;
          var angle = alpha * trailEndAngle;
          segment.translate.y = Math.sin( (angle - rotorRY) * 4 ) * 6;
        });
      }

      return { animate: animate };
    };

    // ------------------------- addHouse ------------------------- //
    ZdogSpookyHouse.addHouse = function( options ) {
      var TAU = Zdog.TAU;
      var color = ZdogSpookyHouse.color;

      var eastWestWallRects = [];
      var southWallRects = [];

      function addEastWestWallRect( rect ) {
        eastWestWallRects.push( rect );
      }

      function addSouthWallRect( rect ) {
        southWallRects.push( rect );
      }

      var house = new Zdog.Anchor({
        addTo: options.addTo,
        translate: { x: 0, y: -8, z: -6 },
      });

      var wallPanelOptions = {
        addTo: house,
        width: 12,
        height: 12,
        stroke: options.stroke,
        fill: true,
        backface: color.deep,
      };

      var southWallPanelOptions = Object.assign( {
        color: color.light,
      }, wallPanelOptions );

      var frontDoorGroup = new Zdog.Group({
        addTo: house,
        translate: { z: 24 },
      });

      var southWallRect1 = setKey(new Zdog.Rect( Object.assign( {}, southWallPanelOptions, {
        addTo: frontDoorGroup,
      }) ), 'light', 'deep');
      addSouthWallRect( southWallRect1 );

      setKey(new Zdog.Rect({
        addTo: frontDoorGroup,
        width: 6,
        height: 8,
        translate: { y: 2 },
        color: color.dark,
        fill: true,
        stroke: false,
      }), 'dark');

      ZdogSpookyHouse.getWallPanel({
        wall: Object.assign( {
          translate: { y: -12, z: 24 }
        }, southWallPanelOptions ),
        pane: 'medium',
        wallRectCallback: addSouthWallRect,
      });

      ZdogSpookyHouse.getWallPanel({
        wall: Object.assign( {
          translate: { y: -24, z: 24 },
        }, southWallPanelOptions ),
        pane: 'highlight',
        wallRectCallback: addSouthWallRect,
      });

      var eastWallPanelOptions = Object.assign( {
        color: color.medium,
        rotate: { y: -TAU/4 },
      }, wallPanelOptions );

      var westWallPanelOptions = Object.assign( {
        color: color.medium,
        rotate: { y: TAU/4 },
      }, wallPanelOptions );

      var eastWallSquare = setKey(new Zdog.Rect( Object.assign( {}, eastWallPanelOptions, {
        translate: { x: 6, z: 18, },
      })), 'medium', 'deep');
      addEastWestWallRect( eastWallSquare );

      var ews2 = setKey(eastWallSquare.copy({
        translate: { x: 6, y: -12, z: 18, },
      }), 'medium', 'deep');
      addEastWestWallRect( ews2 );

      var ews3 = setKey(eastWallSquare.copy({
        translate: { x: 6, y: -24, z: 18, },
      }), 'medium', 'deep');
      addEastWestWallRect( ews3 );

      var westWallSquare = setKey(eastWallSquare.copy({
        translate: { x: -6, z: 18, },
        rotate: { y: TAU/4 },
      }), 'medium', 'deep');
      addEastWestWallRect( westWallSquare );

      var wws2 = setKey(westWallSquare.copy({
        translate: { x: -6, y: -12, z: 18, },
      }), 'medium', 'deep');
      addEastWestWallRect( wws2 );

      var wws3 = setKey(westWallSquare.copy({
        translate: { x: -6, y: -24, z: 18, },
      }), 'medium', 'deep');
      addEastWestWallRect( wws3 );

      var entranceRoof = new Zdog.Anchor({
        addTo: house,
        translate: { y: -36, z: 18 },
      });

      var entranceRoofPanel = setKey(new Zdog.Shape({
        addTo: entranceRoof,
        path: [
          { x: -8, y:  6 },
          { x:  8, y:  6 },
          { x:  4, y: -6, z: -4 },
          { x: -4, y: -6, z: -4 },
        ],
        translate: { z: 8 },
        stroke: options.stroke,
        fill: true,
        color: color.dark,
      }), 'dark');

      setKey(entranceRoofPanel.copy({
        rotate: { y: TAU/4 },
        translate: { x: -8 },
      }), 'dark');

      setKey(entranceRoofPanel.copy({
        rotate: { y: TAU/2 },
        translate: { z: -8 },
        color: color.deep,
      }), 'deep');

      setKey(entranceRoofPanel.copy({
        rotate: { y: TAU * 3/4 },
        translate: { x: 8 },
        color: color.deep,
      }), 'deep');

      setKey(new Zdog.Rect({
        addTo: entranceRoof,
        width: 8,
        height: 8,
        rotate: { x: -TAU/4 },
        translate: { y: -6 },
        stroke: options.stroke,
        fill: true,
        color: color.dark,
      }), 'dark');

      ZdogSpookyHouse.getWallPanel({
        wall: Object.assign( {}, southWallPanelOptions, {
          translate: { x: 12, z: 12 },
        }),
        pane: 'medium',
        wallRectCallback: addSouthWallRect,
      });

      ZdogSpookyHouse.getWallPanel({
        wall: Object.assign( {}, southWallPanelOptions, {
          translate: { x: 12, y: -12, z: 12 },
        }),
        pane: 'medium',
        wallRectCallback: addSouthWallRect,
      });

      ZdogSpookyHouse.getWallPanel({
        wall: Object.assign( {}, southWallPanelOptions, {
          translate: { x: -12, z: 12 },
        }),
        pane: 'medium',
        wallRectCallback: addSouthWallRect,
      });

      ZdogSpookyHouse.getWallPanel({
        wall: Object.assign( {}, southWallPanelOptions, {
          translate: { x: -12, y: -12, z: 12 },
        }),
        pane: 'medium',
        wallRectCallback: addSouthWallRect,
      });

      ZdogSpookyHouse.getWallPanel({
        wall: Object.assign( {}, eastWallPanelOptions, {
          translate: { x: 18, z: 6, },
        }),
        pane: 'dark',
        wallRectCallback: addEastWestWallRect,
      });

      ZdogSpookyHouse.getWallPanel({
        wall: Object.assign( {}, eastWallPanelOptions, {
          translate: { x: 18, y: -12, z: 6, },
        }),
        pane: 'dark',
        wallRectCallback: addEastWestWallRect,
      });

      ZdogSpookyHouse.getWallPanel({
        wall: Object.assign( {}, eastWallPanelOptions, {
          translate: { x: 18, z: -6, },
        }),
        pane: 'dark',
        wallRectCallback: addEastWestWallRect,
      });

      var ewsHalf = setKey(eastWallSquare.copy({
        width: 6,
        translate: { x: 18, y: -12, z: -3, },
      }), 'medium', 'deep');
      addEastWestWallRect( ewsHalf );

      var northWallSquare = setKey(eastWallSquare.copy({
        width: 6,
        translate: { x: 15, z: -12, },
        rotate: { y: TAU/2 },
        color: color.dark,
      }), 'dark', 'deep');

      var northBigWindowWall = setKey(new Zdog.Shape({
        addTo: house,
        path: [
          { x: -4, y:  12 },
          { x: -4, y:  -6 },
          { arc: [
            { x: -4, y: -10 },
            { x:  0, y: -10 },
          ]},
          { arc: [
            { x:  4, y: -10 },
            { x:  4, y:  -6 },
          ]},
          { x:  4, y:  12 },
          { x:  5, y:  12 },
          { x:  5, y: -12 },
          { x: -5, y: -12 },
          { x: -5, y:  12 },
        ],
        translate: { x: 7, y: -6, z: -12, },
        stroke: options.stroke,
        color: color.dark,
        fill: true,
      }), 'dark');

      setKey(new Zdog.Shape({
        addTo: northBigWindowWall,
        path: [
          { move: { x: -4, y:  -6 } },
          { line: { x:  4, y:  -6 } },
          { move: { x: -4, y:   0 } },
          { line: { x:  4, y:   0 } },
          { move: { x: -4, y:   6 } },
          { line: { x:  0, y: -11 } },
          { line: { x:  0, y:  12 } },
        ],
        closed: false,
        stroke: 0.2,
        color: color.dark,
      }), 'dark');

      northBigWindowWall.copyGraph({
        translate: { x: -3, y: -6, z: -12, },
      });
      northBigWindowWall.copyGraph({
        translate: { x: -13, y: -6, z: -12, },
      });

      setKey(northWallSquare.copy({
        width: 36,
        height: 3,
        translate: { x: 0, y: 4.5, z: -12, },
        color: color.dark,

            addTo: pyramid,

    // ------------------------- getWallPanel ------------------------- //
    ( function() {
      var wallChildProperties = [ 'color', 'stroke', 'fill', 'width', 'height', 'backface' ];

      ZdogSpookyHouse.getWallPanel = function( options ) {
        var wallPanel;
        if ( !options.pane ) {
          wallPanel = setKey(new Zdog.Rect( options.wall ), 'light', 'deep');
          if ( options.wallRectCallback ) {
            options.wallRectCallback( wallPanel );
          }
        } else {
          wallPanel = getWallPanelGroup( options );
        }
        return wallPanel;
      };

      function getWallPanelGroup( options ) {
        var group = new Zdog.Group( options.wall );

        var panelOptions = wallChildProperties.reduce( function( wallOptions, prop ) {
          wallOptions[ prop ] = options.wall[ prop ];
          return wallOptions;
        }, {} );
        panelOptions.addTo = group;

        var wallRect = setKey(new Zdog.Rect( panelOptions ), 'light', 'deep');
        if ( options.wallRectCallback ) {
          options.wallRectCallback( wallRect );
        }

        setKey(new Zdog.Rect({
          addTo: group,
          width: 8,
          height: 6,
          translate: { y: -1 },
          color: ZdogSpookyHouse.color.dark,
          fill: true,
          stroke: false,
          backface: false,
        }), 'dark');

        var paneKey = typeof options.pane === 'string' ? options.pane : 'medium';
        setKey(new Zdog.Rect({
          addTo: group,
          width: 4,
          height: 6,
          translate: { y: -1 },
          color: ZdogSpookyHouse.color[paneKey] || options.pane,
          fill: true,
          stroke: false,
        }), paneKey);

        return group;

    // SVG Upload Form Creator
    function createSVGForm(svgText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(svgText, "image/svg+xml");
      const svgElem = xmlDoc.querySelector("svg");
      if (!svgElem) return;

      const tempContainer = document.createElement("div");
      tempContainer.style.position = "absolute";
      tempContainer.style.left = "-9999px";
      tempContainer.style.top = "-9999px";
      document.body.appendChild(tempContainer);
      tempContainer.appendChild(svgElem);

      const elements = svgElem.querySelectorAll("path, polygon, polyline, rect, circle, ellipse");
      const pathsData = [];

      elements.forEach(function(el) {
        let totalLen = 0;
        try {
          if (el.getTotalLength) totalLen = el.getTotalLength();
        } catch(err){}

        if (totalLen > 0) {
          const numPts = Math.min(150, Math.max(24, Math.floor(totalLen / 3)));
          const pts = [];
          for (let i = 0; i <= numPts; i++) {
            const p = el.getPointAtLength((i / numPts) * totalLen);
            pts.push({ x: p.x, y: p.y });
          }
          pathsData.push(pts);
        }
      });

      document.body.removeChild(tempContainer);

      if (pathsData.length === 0) return;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      pathsData.forEach(function(pts) {
        pts.forEach(function(p) {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        });
      });

      const w = maxX - minX || 1;
      const h = maxY - minY || 1;
      const maxDim = Math.max(w, h);
      const targetSize = 36;
      const scale = targetSize / maxDim;
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;

      if (customSvgAnchor) {
        customSvgAnchor.remove();
      }

      customSvgAnchor = new Zdog.Anchor({
        addTo: scene,
        translate: { x: 0, y: -120, z: 0 },
      });

      pathsData.forEach(function(pts) {
        const zdogPath = pts.map(function(p) {
          return { x: (p.x - cx) * scale, y: (p.y - cy) * scale };
        });

        const frontShape = setKey(new Zdog.Shape({
          addTo: customSvgAnchor,
          path: zdogPath,
          stroke: 2.5,
          color: ZdogSpookyHouse.color.highlight,
          fill: true,
          backface: ZdogSpookyHouse.color.deep,
          translate: { z: 3 }
        }), 'highlight', 'deep');

        const backShape = setKey(new Zdog.Shape({
          addTo: customSvgAnchor,
          path: zdogPath,
          stroke: 2.5,
          color: ZdogSpookyHouse.color.medium,
          fill: true,
          backface: ZdogSpookyHouse.color.deep,
          translate: { z: -3 }
        }), 'medium', 'deep');
      });

      illo.updateRenderGraph();
    }

    // Hidden File Input for SVG upload

    // ----- Mouse Wheel Zoom & Drag Panning ----- //
    let isPanning = false;
    let startPanX = 0, startPanY = 0;
    let startTranslateX = 0, startTranslateY = 0;

    zdogCanvas.addEventListener('wheel', function(e) {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      settings.zoom = Math.max(0.2, Math.min(8.0, settings.zoom * zoomFactor));
      illo.zoom = settings.zoom * settings.dpr;
      if (guiZoomController) guiZoomController.updateDisplay();
      illo.updateRenderGraph();
    }, { passive: false });

    zdogCanvas.addEventListener('pointerdown', function(e) {
      if (e.button === 2 || e.button === 1 || e.shiftKey || settings.dragMode === 'Pan') {
        isPanning = true;
        startPanX = e.clientX;
        startPanY = e.clientY;
        startTranslateX = illo.translate.x;
        startTranslateY = illo.translate.y;
        e.stopPropagation();
      }
    }, true);

    window.addEventListener('pointermove', function(e) {
      if (isPanning) {
        const dx = (e.clientX - startPanX) / (settings.zoom * settings.dpr);
        const dy = (e.clientY - startPanY) / (settings.zoom * settings.dpr);
        illo.translate.x = startTranslateX + dx;
        illo.translate.y = startTranslateY + dy;
        illo.updateRenderGraph();
        e.stopPropagation();
      }
    }, true);

    window.addEventListener('pointerup', function(e) {
      if (isPanning) {
        isPanning = false;
        e.stopPropagation();
      }
    }, true);

    zdogCanvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    // ----- Animation Frame Loop ----- //
    const TAU = Zdog.TAU;
    let ticker = 0;
    const cycleCount = 300;

    function animate() {
      const progress = (ticker / cycleCount) % 1000;
      const speed = settings.animSpeed;

      // Animation presets logic
      if (settings.animPreset === 'Wobble Orbit') {
        const theta = Zdog.easeInOut( progress % 1 ) * TAU;
        const delta = TAU * -3/64;
        illo.rotate.y = Math.sin( theta ) * delta + TAU/8;
        illo.rotate.x = ( Math.cos( theta ) * -0.5 + 0.5 ) * delta;
      } else if (settings.animPreset === '360° Slow Panorama') {
        illo.rotate.y = (progress * 0.15 * TAU) + TAU/8;
        illo.rotate.x = -0.1;
      } else if (settings.animPreset === 'Cinematic Flyby') {
        illo.rotate.y = Math.sin( progress * TAU * 0.25 ) * 0.4 + TAU/8;
        illo.rotate.x = Math.cos( progress * TAU * 0.25 ) * 0.15 - 0.1;
      } else if (settings.animPreset === 'Floating Island Pulse') {
        illo.rotate.y = TAU/8;
        illo.rotate.x = 0;
      } else if (settings.animPreset === 'Static Camera') {
        // Camera remains unchanged
      }

      illo.normalizeRotate();

      // Sub-component animations
      fogMonsterObj.animate( progress );
      carRoadObj.animate( progress );
      houseObj.animate( progress, illo.rotate );
      interiorSceneObj.animate( progress );

      cloudRotorA.rotate.y = progress * TAU/12;
      cloudRotorB.rotate.y = progress * TAU/16;

      // Island bobbing
      const bobMult = settings.animPreset === 'Floating Island Pulse' ? 2.2 : 1.0;
      centerIsland.translate.y = Math.sin( progress/4 * TAU ) * 4 * bobMult;
      eastIsland.translate.y = Math.sin( progress/1.5 * TAU ) * -4 * bobMult;
      westIsland.translate.y = Math.sin( progress/2.5 * TAU ) * -4 * bobMult;
      northIsland.translate.y = Math.sin( progress/3 * TAU ) * 4 * bobMult;
      southIsland.translate.y = Math.sin( progress/2 * TAU ) * 4 * bobMult;

      if (customSvgAnchor) {
        customSvgAnchor.rotate.y += 0.02 * speed;
        customSvgAnchor.translate.y = -120 + Math.sin( progress * TAU * 2 ) * 6;
      }

      ticker += speed;
      illo.updateRenderGraph();
      requestAnimationFrame( animate );
    }

    requestAnimationFrame( animate );

    // ----- lil-gui Controls Setup ----- //
    const gui = new GUI({ title: 'Scene Controls' });

    // Hide/Show GUI with 'H' key
    window.addEventListener('keydown', function(e) {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Display & View Folder
    const viewFolder = gui.addFolder('View & Display');

    viewFolder.add(settings, 'greenscreen').name('Greenscreen (#00ff00)').onChange(function(val) {
      updateColors();
    });

    viewFolder.addColor(settings, 'bgColor').name('Background Color').onChange(function(val) {
      updateColors();
    });

    let guiZoomController = viewFolder.add(settings, 'zoom', 0.2, 5.0, 0.05).name('Zoom').onChange(function(val) {
      illo.zoom = val * settings.dpr;
      illo.updateRenderGraph();
    });

    viewFolder.add(settings, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(function() {
      updateDPR();
    });

    viewFolder.add(settings, 'dragMode', ['Rotate', 'Pan']).name('Drag Mode');

    // Animation Folder
    const animFolder = gui.addFolder('Animation');

    animFolder.add(settings, 'animPreset', [
      'Wobble Orbit',
      '360° Slow Panorama',
      'Cinematic Flyby',
      'Floating Island Pulse',
      'Static Camera'
    ]).name('Animation Scheme');

    animFolder.add(settings, 'animSpeed', 0.0, 3.0, 0.1).name('Speed');

    // Colors Folder
    const colorFolder = gui.addFolder('Color Schemes & Palette');

    const customColorControllers = {};

    colorFolder.add(settings, 'colorPreset', Object.keys(colorSchemes)).name('Preset Scheme').onChange(function(presetName) {
      const scheme = colorSchemes[presetName];
      if (scheme) {
        settings.bgColor = scheme.bgColor;
        Object.keys(scheme).forEach(key => {
          if (key !== 'bgColor') {
            ZdogSpookyHouse.color[key] = scheme[key];
            if (customColorControllers[key]) {
              customColorControllers[key].setValue(scheme[key]);
            }
          }
        });
        updateColors();
      }
    });

    const customFolder = colorFolder.addFolder('Custom Palette');

    Object.keys(ZdogSpookyHouse.color).forEach(key => {
      customColorControllers[key] = customFolder.addColor(ZdogSpookyHouse.color, key).name(key).onChange(function() {
        updateColors();
      });
    });

    // SVG Upload Folder
    const svgFolder = gui.addFolder('Custom Form (SVG)');
    svgFolder.add(settings, 'uploadSVG').name('Upload SVG Form');

  </script>
</body>
</html>
