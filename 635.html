<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07518d">
  <meta name="description" content="A living vortex of silver fish in deep blue water. Procedural geometry, GPU schooling, and custom Three.js shaders.">
  <link rel="icon" href="data:,">
  <title>Blue / A Living Vortex</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07518d; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
<script>
/*
 * BLUE / A LIVING VORTEX
 * Open this file in a browser; no build step is required.
 * The pinned Three.js dependency is fetched from a CDN, with a second CDN as fallback.
 * All geometry, water, shading, and movement are generated here; no image assets.
 */
(async () => {
  'use strict';

  // Art direction. Distances are world units; speeds are radians / second.
  const CONFIG = {
    fishCount: 520,
    vortexRadius: 0.65,
    vortexThickness: 0.43,
    centerOpeningRadius: 0.28,
    rotationSpeed: 0.24,
    radialNoise: 0.026,
    turbulenceStrength: 0.028,
    tailAmplitude: 0.036,
    swimFrequency: 7.4,
    fishSize: 0.073,
    formationDuration: 12,
    backgroundColor: '#07518D',
    fishColor: '#F2F7F5',
    depthGrain: 1.15,
    grainScale: 1,
    seed: 635,
    orbitalBands: 13
  };

  async function loadThree() {
    if (window.THREE) return window.THREE;
    const sources = [
      'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js',
      'https://unpkg.com/three@0.160.1/build/three.min.js'
    ];
    for (const src of sources) {
      try {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          const timer = setTimeout(() => { script.remove(); reject(new Error('CDN timeout')); }, 10000);
          script.src = src;
          script.crossOrigin = 'anonymous';
          script.onload = () => { clearTimeout(timer); resolve(); };
          script.onerror = () => { clearTimeout(timer); script.remove(); reject(new Error('CDN unavailable')); };
          document.head.appendChild(script);
        });
        if (window.THREE) return window.THREE;
      } catch (_) { /* The next source serves the same pinned release. */ }
    }
    throw new Error('Three.js could not load. Check your internet connection.');
  }

  try {
    const [THREE, { default: GUI }] = await Promise.all([
      loadThree(),
      import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js')
        .catch(() => import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'))
    ]);
    // The two achromatic presets each have a reversible light/dark version: 19 themes total.
    const THEMES = {
      'Original': ['F2F7F5', 'D9E8ED', 'B6D5DF', 'E7F1F2', '07518D'],
      'Monochromatic': ['ECF6FF', '9DCBF5', '5C9DD9', '2565A8', '071C36'],
      'Analogous': ['CFFFF1', '73E4D8', '54A6DF', '8A9EEB', '082A3D'],
      'Complementary': ['E3F5FF', '80C5EC', 'FFB76B', 'F07846', '102B46'],
      'Split-complementary': ['D6F7FF', '6ECFDA', 'FFCE7A', 'E88EAE', '15243B'],
      'Triadic': ['7EE8E2', 'EAA3DB', 'FFE09A', 'CFA3EF', '162C3C'],
      'Tetradic': ['76DDD0', 'F3B080', 'C8A0EB', 'E2DD91', '182C35'],
      'Double split-complementary': ['8BDAF1', 'A8E5BB', 'F8CA8B', 'E7A2C2', 'C3ABEF', '182536'],
      'Achromatic': ['FFFFFF', 'DDDDDD', 'AAAAAA', 'EEEEEE', '080808'],
      'Achromatic + Accent': ['FFFFFF', 'DDDDDD', 'AAAAAA', 'EF3340', '080808'],
      'Neutral + Accent': ['F1E9DA', 'C9C3B6', '9AA99B', 'EC795E', '242923'],
      'Amber / Ember': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
      'Lagoon / Ink': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
      'Orchid / Plum': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
      'Saffron / Teal': ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
      'Lime / Forest': ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
      'Apricot / Aubergine': ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
      'Lavender / Indigo': ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
      'Ice / Fuchsia': ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']
    };
    const ANIMATIONS = ['Static', 'Gentle orbit', 'Tidal drift', 'Slow roll',
      'Breathing', 'Figure eight', 'Elliptic orbit', 'Pendulum'];
    const settings = {
      scheme: 'Original', invertAchromatic: false, greenscreen: false,
      background: CONFIG.backgroundColor,
      color1: CONFIG.fishColor, color2: '#D9E8ED', color3: '#B6D5DF', color4: '#E7F1F2', color5: '#F2F7F5',
      animation: 'Static', speed: 1, cameraSpeed: 1, zoom: 1, angle: 0, azimuth: 0,
      panX: 0, panY: 0, pixelRatio: Math.min(devicePixelRatio || 1, 2),
      clickVariation: true,
      newVariation: () => generateVariation(),
      resetView: () => { settings.zoom = 1; settings.angle = 0; settings.azimuth = 0; settings.panX = 0; settings.panY = 0; refreshPanel(); }
    };
    const canvas = document.createElement('canvas');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', 'Hundreds of silver fish swimming in an evolving vortex in deep blue ocean water.');
    document.body.appendChild(canvas);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(CONFIG.backgroundColor);
    const scene = new THREE.Scene();
    // XY is the water surface. Looking down the Z axis preserves a true overhead view.
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 20);
    camera.position.z = 5;
    const school = new THREE.Group();
    scene.add(school);

    const uniforms = {
      uTime: { value: 0 },
      uView: { value: new THREE.Vector2(2, 2) },
      uResolution: { value: new THREE.Vector2(1, 1) },
      uRotation: { value: CONFIG.rotationSpeed },
      uRadius: { value: CONFIG.vortexRadius },
      uRadial: { value: CONFIG.radialNoise },
      uTurbulence: { value: CONFIG.turbulenceStrength },
      uFormation: { value: CONFIG.formationDuration },
      uTail: { value: CONFIG.tailAmplitude },
      uSwim: { value: CONFIG.swimFrequency },
      uDepthGrain: { value: CONFIG.depthGrain },
      uGrainScale: { value: CONFIG.grainScale },
      uFishColor: { value: new THREE.Color(CONFIG.fishColor) },
      uWaterColor: { value: new THREE.Color(CONFIG.backgroundColor) },
      uPalette: { value: Array.from({ length: 5 }, () => new THREE.Color(CONFIG.fishColor)) },
      uPaletteCount: { value: 4 },
      uOriginal: { value: 1 },
      uAccent: { value: 0 },
      uGreen: { value: 0 },
      uInverse: { value: 0 }
    };

    // Smooth value noise is shared by the water shader. Nothing is texture-backed.
    const noiseGLSL = /* glsl */`
      float hash21(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * .1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash21(i), hash21(i + vec2(1,0)), f.x),
                   mix(hash21(i + vec2(0,1)), hash21(i + vec2(1,1)), f.x), f.y);
      }
    `;

    const water = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
      uniforms,
      depthWrite: false,
      depthTest: false,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, .99, 1.0); }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform vec2 uView, uResolution;
        uniform vec3 uWaterColor;
        uniform float uGreen, uOriginal, uInverse;
        varying vec2 vUv;
        ${noiseGLSL}
        void main() {
          if (uGreen > .5) { gl_FragColor = vec4(0.0,1.0,0.0,1.0); return; }
          vec2 p = (vUv - .5) * uView;
          vec2 drift = vec2(uTime * .004, -uTime * .0025);
          float clouds = noise(p * 1.8 + drift) * .57
                       + noise(p * 4.3 - drift * .6) * .28
                       + noise(p * 11.0 + 7.0) * .15;
          float fine = noise(p * 78.0 + drift * .2) - .5;
          float light = exp(-dot(p - vec2(-.6,.8), p - vec2(-.6,.8)) * .33);
          float edge = smoothstep(.35, 2.4, length(p * vec2(.6,.48)));
          vec3 color = uWaterColor * (0.90 + clouds * .25 + light * .09 - edge * .10);
          color += mix(vec3(.002), vec3(.001,.0035,.005), uOriginal) * (clouds - .3);
          color += fine * .0013;
          // Grain has a fixed spatial identity and changes gently, without sparkling.
          float grain = hash21(floor(vUv * uResolution) + floor(uTime * 8.0) * .13) - .5;
          color += grain * .0016;
          color = mix(color, uWaterColor, uInverse);
          gl_FragColor = vec4(color, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    }));
    water.frustumCulled = false;
    water.renderOrder = -2;
    scene.add(water);

    function randomGenerator(seed) {
      return () => {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // Rounded shoulders, a narrow caudal peduncle, swept fins, and a crescent tail.
    // Local X points toward the nose. Parts: body, caudal, pectoral, pelvic.
    function makeFishGeometry() {
      const vertices = [], crossSections = [], parts = [], indices = [];
      const add = (x, y, across, part) => {
        const index = vertices.length / 3;
        vertices.push(x, y, 0); crossSections.push(across); parts.push(part);
        return index;
      };
      const profile = [
        [-.43,.009], [-.35,.014], [-.24,.030], [-.10,.052],
        [.06,.076], [.21,.079], [.33,.063], [.43,.038], [.49,.017], [.525,.001]
      ];
      function bodyWidth(x) {
        let k = 0;
        while (k < profile.length - 2 && x > profile[k + 1][0]) k++;
        const a = profile[k], b = profile[k + 1];
        const before = profile[Math.max(0, k - 1)], after = profile[Math.min(profile.length - 1, k + 2)];
        const span = b[0] - a[0], t = (x - a[0]) / span;
        const m0 = (b[1] - before[1]) / (b[0] - before[0]) * span;
        const m1 = (after[1] - a[1]) / (after[0] - a[0]) * span;
        return Math.max(.001, (2*t*t*t - 3*t*t + 1)*a[1] + (t*t*t - 2*t*t + t)*m0
          + (-2*t*t*t + 3*t*t)*b[1] + (t*t*t - t*t)*m1);
      }
      const segments = 36, strips = 6;
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const x = -.43 + t * .955;
        const width = bodyWidth(x);
        for (let j = 0; j <= strips; j++) {
          const across = 2 * j / strips - 1;
          add(x, width * across, across, 0);
        }
      }
      for (let i = 0; i < segments; i++) {
        for (let j = 0; j < strips; j++) {
          const k = i * (strips + 1) + j;
          indices.push(k, k + 1, k + strips + 1, k + 1, k + strips + 2, k + strips + 1);
        }
      }
      const fin = (outline, part) => {
        const contour = outline.map(([x,y]) => new THREE.Vector2(x,y));
        const ids = outline.map(([x,y]) => add(x,y,0,part));
        for (const face of THREE.ShapeUtils.triangulateShape(contour, [])) indices.push(...face.map(i => ids[i]));
      };
      fin([[-.405,.010],[-.485,.040],[-.620,.135],[-.665,.151],[-.610,.059],
        [-.550,0],[-.610,-.059],[-.665,-.151],[-.620,-.135],[-.485,-.040],[-.405,-.010]], 1);
      for (const sign of [-1, 1]) {
        fin([[.23,sign*.064],[.11,sign*.102],[-.025,sign*.170],
          [.005,sign*.102],[.075,sign*.054]], 2);
        fin([[-.11,sign*.045],[-.24,sign*.099],[-.205,sign*.046],[-.16,sign*.032]], 3);
      }
      const geometry = new THREE.InstancedBufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute('aCross', new THREE.Float32BufferAttribute(crossSections, 1));
      geometry.setAttribute('aPart', new THREE.Float32BufferAttribute(parts, 1));
      geometry.setIndex(indices);

      const random = randomGenerator(CONFIG.seed);
      const orbit = [], identity = [];
      const count = Math.max(1, Math.floor(CONFIG.fishCount));
      const bands = Math.min(count, Math.max(1, Math.floor(CONFIG.orbitalBands)));
      for (let i = 0; i < count; i++) {
        const band = i % bands;
        const population = Math.floor((count - 1 - band) / bands) + 1;
        const slot = Math.floor(i / bands);
        const q = ((slot + random() * .7) / population + band * .381966) % 1;
        const layer = (band + .35 + random() * .3) / bands;
        const radius = Math.max(CONFIG.centerOpeningRadius + .09,
          CONFIG.vortexRadius + (layer - .5) * CONFIG.vortexThickness);
        const phase = random() * Math.PI * 2;
        orbit.push(q, radius + (random() - .5) * .015,
          .88 + (1 - layer) * .28 + (random() - .5) * .045, phase);
        // A minority near the surface catch white light; deeper fish stay blue-silver.
        const depth = Math.pow(random(), .74);
        const length = CONFIG.fishSize * (depth < .19
          ? 1.95 + random() * .56
          : 1.38 + random() * .84);
        identity.push(length, (depth < .19 ? .91 : .64) + random() * .25, depth, random());
      }
      // Transparent, stippled fish render below clean surface silhouettes, including after rerolls.
      const order = Array.from({ length: count }, (_, i) => i).sort((a,b) => identity[b*4+2] - identity[a*4+2]);
      const sortedOrbit = new Float32Array(count * 4), sortedIdentity = new Float32Array(count * 4);
      order.forEach((source, destination) => {
        for (let j = 0; j < 4; j++) {
          sortedOrbit[destination*4+j] = orbit[source*4+j];
          sortedIdentity[destination*4+j] = identity[source*4+j];
        }
      });
      geometry.setAttribute('aOrbit', new THREE.InstancedBufferAttribute(sortedOrbit, 4));
      geometry.setAttribute('aFish', new THREE.InstancedBufferAttribute(sortedIdentity, 4));
      geometry.instanceCount = count;
      return geometry;
    }

    const fishVertex = /* glsl */`
      uniform float uTime, uRotation, uRadius, uRadial, uTurbulence, uFormation, uTail, uSwim;
      uniform float uShadow;
      attribute vec4 aOrbit, aFish;
      attribute float aCross, aPart;
      varying float vCross, vPart, vDepth, vSeed, vLight;
      varying vec2 vLocal;
      const float TAU = 6.28318530718;

      // A divergence-free perturbation: the analytic curl of a smooth scalar field.
      vec2 curl(vec2 p, float t) {
        float a = p.x * 2.8 + p.y * 1.7 + t * .13;
        float b = p.y * 3.1 - p.x * 1.3 - t * .11;
        return vec2(1.7 * cos(a) + 3.1 * cos(b), -2.8 * cos(a) + 1.3 * cos(b)) * .23;
      }

      vec2 schoolPosition(float t) {
        float formed = smoothstep(0.0, max(.01, uFormation), t);
        float phase = aOrbit.w;
        float q = aOrbit.x;
        // Unwrapped angles open the crescent continuously, preserving every identity.
        float angle = (q - .5) * mix(4.72, TAU, formed) - .55;
        angle -= sin(q * TAU - 2.8) * mix(.47, .23, formed);
        // Bounded phase modulation gives each fish a gentle acceleration / glide cycle.
        float cruise = t + .18 * sin(t * .61 + phase) + .30 * sin(t * .19 + phase * 1.7);
        angle -= cruise * uRotation * aOrbit.z;
        angle += .04 * sin(t * .31 + phase) + .065 * sin(angle * 2.0 + t * .12);
        angle += .032 * sin(angle * 3.0 - t * .22 + aOrbit.y * 3.0);
        float bandWave = sin(angle * 3.0 - aOrbit.y * 6.0 + t * .19);
        float bandSpread = 1.0 + .22 * sin(angle + .6 + t * .035);
        float r = uRadius + (aOrbit.y - uRadius) * bandSpread;
        r += uRadial * (bandWave + .4 * sin(t * .43 + phase));
        // Slow exchanges between neighboring streams, rather than rigid circular rails.
        r += uRadial * .8 * sin(t * .17 + phase) * sin(t * .071 + phase * 1.9);
        r *= 1.0 + .028 * sin(t * .21) + .018 * cos(angle * 2.0 + t * .14);
        // Sparse outer individuals drift away and rejoin over much longer periods.
        r += smoothstep(.83, 1.0, aFish.w) * .075 * (.5 + .5 * sin(t * .17 + phase));
        vec2 p = vec2(cos(angle), sin(angle)) * r;
        p += curl(p, t) * uTurbulence;
        p.x *= .96 + .022 * sin(t * .09);
        p.y *= 1.055 + .024 * sin(t * .13 + 1.0);
        p += vec2(sin(t * .12), cos(t * .095) - 1.0) * .014;
        return p;
      }

      void main() {
        vec2 center = schoolPosition(uTime);
        vec2 ahead = schoolPosition(uTime + .04);
        vec2 behind = schoolPosition(uTime - .04);
        vec2 velocity = (ahead - behind) * .5;
        vec2 forward = normalize(velocity + vec2(.000001, 0.0));
        vec2 side = vec2(-forward.y, forward.x);
        float curvature = dot(ahead - 2.0 * center + behind, side) / max(dot(velocity, velocity), .0000001);
        float turn = clamp(curvature * aFish.x, -.65, .65);
        vec2 local = position.xy;
        float rear = clamp((.34 - local.x) / 1.0, 0.0, 1.0);
        float rhythm = .84 + fract(aFish.w * 13.7) * .33;
        float beat = uTime * uSwim * rhythm + aOrbit.w + .24 * sin(uTime * .7 + aOrbit.w);
        float effort = .73 + .27 * sin(uTime * .67 + aOrbit.w);
        float wavePhase = beat + (local.x - .34) * 7.2;
        float wave = sin(wavePhase) + .18 * sin(wavePhase * 2.0 + .6);
        // Shoulder and snout proportions vary independently of total length.
        local.y *= aFish.y;
        local.y *= 1.0 + .10 * sin(local.x * 5.0 + aFish.w * 18.0);
        if (aPart > 1.5) local.y *= .85 + .15 * sin(beat * .52 + aPart * .6);
        if (aPart > .5 && aPart < 1.5) {
          local.x -= (-local.x - .4) * fract(aFish.w * 7.3) * .25;
          local.y *= .84 + fract(aFish.w * 17.1) * .3;
          local.x -= local.y * cos(wavePhase) * uTail * 5.0;
        }
        // Curved spine follows the actual turn; a traveling S-wave grows toward the tail.
        local.y += .5 * turn * pow(max(.0, .30 - local.x), 2.0);
        local.y += wave * rear * rear * uTail * 1.75 * effort;
        local.y *= .94 + .06 * sin(beat * .45 + aFish.w * 6.0);
        vec2 world = center + (forward * local.x + side * local.y) * aFish.x;
        world += vec2(.006, -.009) * uShadow;
        float depth = clamp(aFish.z + .025 * sin(uTime * .18 + aOrbit.w), 0.0, 1.0);
        float bodyHeight = aPart < .5 ? sqrt(max(0.0, 1.0 - aCross * aCross)) * aFish.x * .028 : 0.0;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(world, .035 - depth * .13 + bodyHeight, 1.0);
        vLocal = position.xy;
        vCross = aCross;
        vPart = aPart;
        vDepth = depth;
        vSeed = aFish.w;
        vLight = .92 + .08 * sin(beat * .52 + dot(forward, vec2(.7,.3)));
      }
    `;

    const fishFragment = /* glsl */`
      uniform float uShadow;
      uniform vec3 uFishColor, uPalette[5], uWaterColor;
      uniform float uPaletteCount, uOriginal, uAccent, uInverse, uDepthGrain, uGrainScale;
      varying float vCross, vPart, vDepth, vSeed, vLight;
      varying vec2 vLocal;
      ${noiseGLSL}

      // Body-anchored, irregular stipple. The dots swim with the skin, not the screen.
      float stipple(vec2 p, float seed) {
        vec2 grid = p * vec2(43.0, 83.0) * uGrainScale;
        vec2 cell = floor(grid);
        vec2 jitter = vec2(hash21(cell + seed * 93.1), hash21(cell + seed * 57.7 + 19.0));
        vec2 offset = fract(grid) - (.5 + (jitter - .5) * .82);
        float radius = .18 + hash21(cell + seed * 31.7 + 4.0) * .22;
        float d = length(offset);
        float aa = max(.055, fwidth(d) * .65);
        float fleck = 1.0 - smoothstep(radius - aa, radius + aa, d);
        float mottling = .64 + .36 * noise(p * vec2(17.0, 52.0) + seed * 18.0);
        float occupied = step(.16, hash21(cell + seed * 73.3 + 11.0));
        return fleck * mottling * occupied;
      }
      void main() {
        float fin = step(.5, vPart);
        if (uShadow > .5) {
          gl_FragColor = vec4(mix(vec3(.025), vec3(.006,.055,.085), uOriginal),
            .045 * (1.0 - vDepth * .5) * mix(1.0,.3,fin));
          return;
        }
        float across = abs(vCross);
        float rounded = sqrt(max(0.0, 1.0 - across * across));
        float dorsal = exp(-pow((vCross + .19) * 2.6, 2.0));
        float light = (.56 + rounded * .31 + dorsal * .16) * vLight;
        float pick = min(floor(vSeed * uPaletteCount), uPaletteCount - 1.0);
        if (uAccent > .5) pick = vSeed > .87 ? 3.0 : min(pick, 2.0);
        vec3 base = uPalette[0];
        for (int i = 0; i < 5; i++) { if (abs(pick - float(i)) < .5) base = uPalette[i]; }
        base = mix(base, uFishColor, uOriginal);
        vec3 shade = mix(base * .48, vec3(.31,.52,.61), uOriginal);
        vec3 silver = mix(shade, base, light);
        // Clean surface fish become porous, bright mineral-like flecks with depth.
        float grainDepth = min(.985, smoothstep(.12, .76, vDepth) * uDepthGrain);
        float skinSeed = floor(vSeed * 4096.0 + .5) / 4096.0;
        float fleck = stipple(vLocal, skinSeed);
        float micro = noise(vLocal * vec2(180.0, 310.0) + skinSeed * 45.0);
        silver *= .96 + micro * .08;
        vec3 deep = mix(base * .34, vec3(.11,.36,.51), uOriginal);
        silver = mix(silver, deep, vDepth * .28 * (1.0 - uInverse));
        silver = mix(silver, mix(base * .88, uFishColor * .92, uOriginal), grainDepth * fleck * .65);
        float alpha = mix(.98, .84, smoothstep(.12, 1.0, vDepth));
        alpha *= mix(1.0, .022 + fleck * 1.12, grainDepth);
        if (fin > .5) {
          silver = mix(silver, mix(base * .76, vec3(.48,.69,.74), uOriginal), .28);
          alpha *= vPart > 1.5 ? .59 : .80;
          float rays = .5 + .5 * sin(atan(abs(vLocal.y), .45 - vLocal.x) * 75.0);
          alpha *= .72 + rays * .28;
        } else {
          alpha *= 1.0 - .22 * smoothstep(.75, 1.0, across);
          // Small blue-gray eyes and a barely perceptible gill, without outlines.
          float eye = 1.0 - smoothstep(.005, .014,
            length((vLocal - vec2(.395, .031)) * vec2(1.0, 1.2)));
          float eye2 = 1.0 - smoothstep(.005, .014,
            length((vLocal - vec2(.395, -.031)) * vec2(1.0, 1.2)));
          silver = mix(silver, mix(base * .15, vec3(.075,.18,.23), uOriginal), max(eye, eye2) * .76);
          float gill = exp(-pow((vLocal.x - .27 + abs(vLocal.y) * .7) * 95.0, 2.0));
          silver *= 1.0 - gill * .15 * across;
          float lateralLine = exp(-pow((abs(vCross) - .53) * 18.0, 2.0));
          silver *= 1.0 - lateralLine * .065;
        }
        gl_FragColor = vec4(silver, alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `;

    let geometry = makeFishGeometry();
    const material = new THREE.ShaderMaterial({
      uniforms: { ...uniforms, uShadow: { value: 0 } },
      vertexShader: fishVertex,
      fragmentShader: fishFragment,
      transparent: true,
      depthTest: false,
      depthWrite: false,
      extensions: { derivatives: true },
      side: THREE.DoubleSide
    });
    const fish = new THREE.Mesh(geometry, material);
    fish.frustumCulled = false;
    fish.renderOrder = 1;
    school.add(fish);
    const shadowMaterial = material.clone();
    // Share animated uniforms after cloning; only the pass selector is independent.
    shadowMaterial.uniforms = { ...uniforms, uShadow: { value: 1 } };
    const shadows = new THREE.Mesh(geometry, shadowMaterial);
    shadows.frustumCulled = false;
    shadows.renderOrder = 0;
    school.add(shadows);

    function refreshPanel() {
      gui.controllersRecursive().forEach(controller => controller.updateDisplay());
      invertControl.show(settings.scheme.startsWith('Achromatic'));
    }

    function applyColors(original = false) {
      uniforms.uOriginal.value = original ? 1 : 0;
      uniforms.uFishColor.value.set(settings.color1);
      for (let i = 0; i < 5; i++) uniforms.uPalette.value[i].set(settings['color' + (i + 1)]);
      uniforms.uWaterColor.value.set(settings.background);
      uniforms.uGreen.value = settings.greenscreen ? 1 : 0;
      shadows.visible = !settings.greenscreen;
      renderer.setClearColor(settings.greenscreen ? '#00ff00' : settings.background);
      document.body.style.background = settings.greenscreen ? '#00ff00' : settings.background;
    }

    function applyTheme() {
      const palette = THEMES[settings.scheme];
      const colors = palette.slice(0, -1).map(hex => '#' + hex);
      const achromatic = settings.scheme.startsWith('Achromatic');
      const inverse = achromatic && settings.invertAchromatic;
      if (inverse) {
        colors[0] = '#080808'; colors[1] = '#222222'; colors[2] = '#444444';
        if (settings.scheme === 'Achromatic') colors[3] = '#111111';
      }
      settings.background = inverse ? '#ffffff' : '#' + palette[palette.length - 1];
      for (let i = 0; i < 5; i++) settings['color' + (i + 1)] = colors[i % colors.length];
      uniforms.uPaletteCount.value = colors.length;
      uniforms.uAccent.value = settings.scheme === 'Achromatic + Accent' || settings.scheme === 'Neutral + Accent' ? 1 : 0;
      uniforms.uInverse.value = inverse ? 1 : 0;
      applyColors(settings.scheme === 'Original');
      refreshPanel();
    }

    function syncMotion() {
      uniforms.uRadius.value = CONFIG.vortexRadius;
      uniforms.uRotation.value = CONFIG.rotationSpeed;
      uniforms.uRadial.value = CONFIG.radialNoise;
      uniforms.uTurbulence.value = CONFIG.turbulenceStrength;
      uniforms.uTail.value = CONFIG.tailAmplitude;
      uniforms.uSwim.value = CONFIG.swimFrequency;
      uniforms.uDepthGrain.value = CONFIG.depthGrain;
      uniforms.uGrainScale.value = CONFIG.grainScale;
    }

    function rebuildSchool() {
      CONFIG.centerOpeningRadius = Math.min(CONFIG.centerOpeningRadius,
        Math.max(.1, CONFIG.vortexRadius - CONFIG.vortexThickness * .5 - .03));
      const previous = geometry;
      geometry = makeFishGeometry();
      fish.geometry = geometry;
      shadows.geometry = geometry;
      previous.dispose();
      syncMotion();
      refreshPanel();
    }

    function generateVariation() {
      const random = randomGenerator(crypto.getRandomValues(new Uint32Array(1))[0]);
      const between = (a, b) => a + random() * (b - a);
      settings.scheme = Object.keys(THEMES)[Math.floor(random() * 19)];
      settings.invertAchromatic = random() > .5;
      CONFIG.seed = Math.floor(random() * 1000000);
      CONFIG.fishCount = Math.round(between(360, 640) / 10) * 10;
      CONFIG.vortexRadius = between(.55, .71);
      CONFIG.vortexThickness = between(.29, .48);
      CONFIG.centerOpeningRadius = between(.19, .29);
      CONFIG.orbitalBands = Math.round(between(9, 16));
      CONFIG.fishSize = between(.059, .086);
      CONFIG.rotationSpeed = between(.14, .28);
      CONFIG.radialNoise = between(.014, .036);
      CONFIG.turbulenceStrength = between(.014, .042);
      CONFIG.tailAmplitude = between(.018, .035);
      CONFIG.swimFrequency = between(5.5, 8.5);
      settings.speed = Math.round(between(.65, 1.15) * 100) / 100;
      settings.animation = ANIMATIONS[Math.floor(random() * ANIMATIONS.length)];
      rebuildSchool();
      applyTheme();
    }

    // Stock lil-gui styling; the panel is the only interface on the scene.
    const gui = new GUI({ title: 'Vortex' });
    gui.add(settings, 'scheme', Object.keys(THEMES)).name('Color scheme').onChange(applyTheme);
    const invertControl = gui.add(settings, 'invertAchromatic').name('Invert light / dark').onChange(applyTheme);
    gui.add(settings, 'greenscreen').name('Greenscreen').onChange(() => applyColors(uniforms.uOriginal.value > .5));
    gui.add(settings, 'animation', ANIMATIONS).name('Camera animation');
    gui.add(settings, 'speed', 0, 3, .05).name('Animation speed');
    gui.add(settings, 'clickVariation').name('Click to regenerate');
    gui.add(settings, 'newVariation').name('New variation');

    const colorsFolder = gui.addFolder('Colors').close();
    colorsFolder.addColor(settings, 'background').name('Background').onChange(() => applyColors(uniforms.uOriginal.value > .5));
    for (let i = 1; i <= 5; i++) {
      colorsFolder.addColor(settings, 'color' + i).name(i === 1 ? 'Fish color' : 'Fish color ' + i)
        .onChange(() => { uniforms.uPaletteCount.value = 5; applyColors(); });
    }

    const cameraFolder = gui.addFolder('Camera').close();
    cameraFolder.add(settings, 'zoom', .15, 8, .01).name('Zoom').listen();
    cameraFolder.add(settings, 'angle', 0, 65, .1).name('Angle').listen();
    cameraFolder.add(settings, 'azimuth', -180, 180, .1).name('Azimuth').listen();
    cameraFolder.add(settings, 'cameraSpeed', .1, 2, .05).name('Camera speed');
    cameraFolder.add(settings, 'panX', -4, 4, .01).name('Position X').listen();
    cameraFolder.add(settings, 'panY', -4, 4, .01).name('Position Y').listen();
    cameraFolder.add(settings, 'resetView').name('Reset view');

    const schoolFolder = gui.addFolder('School').close();
    for (const [key, label, min, max, step] of [
      ['fishCount','Fish count',100,900,10], ['vortexRadius','Radius',.4,.9,.01],
      ['vortexThickness','Ring thickness',.15,.65,.01], ['centerOpeningRadius','Center opening',.1,.45,.01],
      ['orbitalBands','Streams',5,22,1], ['fishSize','Fish size',.03,.12,.001], ['seed','Seed',0,1000000,1]
    ]) schoolFolder.add(CONFIG, key, min, max, step).name(label).onFinishChange(rebuildSchool);
    for (const [key, label, min, max, step] of [
      ['rotationSpeed','Circulation',.03,.45,.005], ['radialNoise','Radial flow',0,.07,.001],
      ['turbulenceStrength','Turbulence',0,.07,.001], ['tailAmplitude','Tail movement',0,.06,.001],
      ['swimFrequency','Tail frequency',2,12,.1]
    ]) schoolFolder.add(CONFIG, key, min, max, step).name(label).onChange(syncMotion);

    const renderingFolder = gui.addFolder('Rendering').close();
    renderingFolder.add(settings, 'pixelRatio', .5, 3, .25).name('Pixel ratio (DPR)').onChange(resize);
    renderingFolder.add(CONFIG, 'depthGrain', 0, 1.5, .05).name('Depth grain').onChange(syncMotion);
    renderingFolder.add(CONFIG, 'grainScale', .5, 2, .05).name('Grain scale').onChange(syncMotion);
    applyTheme();

    function resize() {
      const width = Math.max(1, innerWidth), height = Math.max(1, innerHeight);
      const aspect = width / height;
      // Fit the entire breathing school against the shorter dimension, including tails.
      const half = 1.14;
      const x = aspect >= 1 ? half * aspect : half;
      const y = aspect >= 1 ? half : half / aspect;
      camera.left = -x; camera.right = x;
      camera.top = y; camera.bottom = -y;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(width, height);
      uniforms.uView.value.set(x * 2, y * 2);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
    }
    addEventListener('resize', resize, { passive: true });
    resize();

    let uiVisible = true;
    addEventListener('keydown', event => {
      if (event.key.toLowerCase() !== 'h' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      uiVisible = !uiVisible;
      gui.show(uiVisible);
    });

    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
      // The user's zoom is a persistent multiplier, independent of every camera path.
      settings.zoom = THREE.MathUtils.clamp(settings.zoom * Math.exp(-delta * .0012), .15, 8);
    }, { passive: false });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    let drag = null;
    canvas.addEventListener('pointerdown', event => {
      if (!event.isPrimary || (event.button !== 0 && event.button !== 2)) return;
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY,
        startX: event.clientX, startY: event.clientY, moved: false,
        rotate: event.button === 2 || event.shiftKey };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag || drag.id !== event.pointerId) return;
      const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) > 5) drag.moved = true;
      drag.x = event.clientX; drag.y = event.clientY;
      if (!drag.moved) return;
      if (drag.rotate) {
        settings.azimuth = ((settings.azimuth + dx * .24 + 540) % 360) - 180;
        settings.angle = THREE.MathUtils.clamp(settings.angle + dy * .18, 0, 65);
      } else {
        settings.panX += dx / innerWidth * (camera.right - camera.left) / camera.zoom;
        settings.panY -= dy / innerHeight * (camera.top - camera.bottom) / camera.zoom;
      }
    });
    canvas.addEventListener('pointerup', event => {
      if (!drag || drag.id !== event.pointerId) return;
      const regenerate = !drag.moved && !drag.rotate && settings.clickVariation;
      drag = null;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (regenerate) generateVariation();
    });
    canvas.addEventListener('pointercancel', () => { drag = null; });
    canvas.addEventListener('lostpointercapture', () => { drag = null; });

    const pose = { tilt: 0, yaw: 0, roll: 0, x: 0, y: 0, zoom: 1 };
    const target = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3();
    let elapsed = 0, cameraTime = 0, last = performance.now(), frame = 0;
    function updateCamera(dt) {
      const t = cameraTime * settings.cameraSpeed;
      let tilt = 0, yaw = 0, roll = 0, x = 0, y = 0, zoom = 1;
      switch (settings.animation) {
        case 'Gentle orbit': tilt = .19 + .035 * Math.sin(t * .09); yaw = t * .055; break;
        case 'Tidal drift': x = .07 * Math.sin(t * .075); y = .05 * Math.sin(t * .11); roll = .025 * Math.sin(t * .065); break;
        case 'Slow roll': roll = t * .025; break;
        case 'Breathing': zoom = 1 + .065 * Math.sin(t * .10); break;
        case 'Figure eight': x = .075 * Math.sin(t * .07); y = .045 * Math.sin(t * .14); roll = .04 * Math.sin(t * .07); break;
        case 'Elliptic orbit': tilt = .25 + .10 * Math.sin(t * .065); yaw = t * .045; zoom = 1 + .025 * Math.sin(t * .08); break;
        case 'Pendulum': tilt = .11 + .09 * Math.sin(t * .07); yaw = .4 * Math.sin(t * .055); roll = .035 * Math.sin(t * .09); break;
      }
      tilt = THREE.MathUtils.clamp(tilt + settings.angle * Math.PI / 180, 0, 1.22);
      yaw += settings.azimuth * Math.PI / 180;
      const blend = 1 - Math.exp(-dt * 3);
      pose.tilt += (tilt - pose.tilt) * blend;
      pose.yaw += Math.atan2(Math.sin(yaw - pose.yaw), Math.cos(yaw - pose.yaw)) * blend;
      pose.roll += Math.atan2(Math.sin(roll - pose.roll), Math.cos(roll - pose.roll)) * blend;
      pose.x += (x - pose.x) * blend; pose.y += (y - pose.y) * blend;
      pose.zoom += (zoom - pose.zoom) * blend;
      target.set(pose.x, pose.y, 0);
      camera.position.set(Math.sin(pose.tilt) * Math.cos(pose.yaw),
        Math.sin(pose.tilt) * Math.sin(pose.yaw), Math.cos(pose.tilt)).multiplyScalar(5).add(target);
      camera.up.set(-Math.sin(pose.roll), Math.cos(pose.roll), 0);
      camera.lookAt(target);
      camera.zoom = settings.zoom * pose.zoom;
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
      right.setFromMatrixColumn(camera.matrixWorld, 0);
      up.setFromMatrixColumn(camera.matrixWorld, 1);
      school.position.copy(right).multiplyScalar(settings.panX).addScaledVector(up, settings.panY);
    }
    let contextLost = false;
    canvas.addEventListener('webglcontextlost', event => { event.preventDefault(); contextLost = true; });
    canvas.addEventListener('webglcontextrestored', () => { contextLost = false; resize(); });
    document.addEventListener('visibilitychange', () => { last = performance.now(); });

    function animate(now) {
      frame = requestAnimationFrame(animate);
      const dt = Math.max(0, Math.min((now - last) / 1000, .06));
      last = now;
      if (document.hidden || contextLost) return;
      elapsed += dt * settings.speed;
      cameraTime += dt * settings.speed;
      uniforms.uTime.value = elapsed;
      updateCamera(dt);
      renderer.render(scene, camera);
    }
    frame = requestAnimationFrame(animate);
    addEventListener('pagehide', event => {
      if (event.persisted) return; // Keep GPU resources alive for back/forward restoration.
      cancelAnimationFrame(frame);
      gui.destroy();
      geometry.dispose(); water.geometry.dispose();
      material.dispose(); shadowMaterial.dispose(); water.material.dispose(); renderer.dispose();
    }, { once: true });
  } catch (error) {
    console.error('[Blue vortex]', error);
    const message = document.createElement('p');
    message.textContent = 'The ocean needs WebGL and an internet connection to load. Please try again in a current browser.';
    message.style.cssText = 'position:fixed;inset:0;margin:0;display:grid;place-content:center;padding:2rem;color:#d6edf5;font:15px/1.6 system-ui;text-align:center';
    message.setAttribute('role', 'alert');
    document.body.appendChild(message);
  }
})();
</script>
</body>
</html>
