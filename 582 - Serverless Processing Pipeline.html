    // --- ROUND PARTICLE TEXTURE GENERATOR ---
    function createRoundParticleTexture(size = 128) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const center = size / 2;
      const gradient = ctx.createRadialGradient(center, center, 0, center, center, center);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.9)');
      gradient.addColorStop(0.45, 'rgba(255, 255, 255, 0.4)');
      gradient.addColorStop(0.75, 'rgba(255, 255, 255, 0.1)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(center, center, center, 0, Math.PI * 2);
      ctx.fill();
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // --- CIRCULAR TECH HUD FLOOR TEXTURE GENERATOR ---
    function createTechCircleTexture(size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const center = size / 2;

      ctx.clearRect(0, 0, size, size);

      // Outer Glow Ring
      const grad = ctx.createRadialGradient(center, center, center * 0.5, center, center, center * 0.95);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.0)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.25)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(center, center, center * 0.95, 0, Math.PI * 2);
      ctx.fill();

      // Sharp Rings
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(center, center, center * 0.88, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(center, center, center * 0.65, 0, Math.PI * 2);
      ctx.stroke();

      // Dashed Arc
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 6;
      ctx.setLineDash([16, 12]);
      ctx.beginPath();
      ctx.arc(center, center, center * 0.75, 0, Math.PI * 2);
      ctx.stroke();

      // Cardinal Ticks
      ctx.setLineDash([]);
      ctx.lineWidth = 4;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
        const x1 = center + Math.cos(a) * (center * 0.82);
        const y1 = center + Math.sin(a) * (center * 0.82);
        const x2 = center + Math.cos(a) * (center * 0.94);
        const y2 = center + Math.sin(a) * (center * 0.94);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    const roundParticleMap = createRoundParticleTexture(128);
    const techCircleMap = createTechCircleTexture(512);

    // --- COLOR PALETTE DEFINITIONS (19 Preconfigured Schemes) ---
    const COLOR_SCHEMES = {

      },
      'Palette: (AA60C8, D69ADE...)': {

      },
      'Palette: (FEF1BE, FFBA00...)': {

      },
      'Palette: (D4FFB0, 7FFF00...)': {

      },
      'Palette: (FFE8CC, FF8C00...)': {

      'Palette: (E8E0FF, B38FFF...)': {

        accent: '#6a3de8',
        payload: '#b38fff',
        rails: '#e8e0ff',
        particles: '#b38fff',
        background: '#090612',
        light: '#f2ebff'
      },
      'Palette: (E0FBFF, 00F0FF...)': {
        platform: '#1e0a3d',
        accent: '#00f0ff',
        payload: '#d40078',
        rails: '#e0fbff',
        particles: '#00f0ff',
        background: '#05020f',
        light: '#e6fcff'
      }
    };

    // --- CONFIGURATION & GUI PARAMETERS ---
    const params = {
      // Color Schemes & Appearance
      colorScheme: 'Original',
      greenScreen: false,
      backgroundColor: COLOR_SCHEMES['Original'].background,
      platformColor: COLOR_SCHEMES['Original'].platform,
      accentColor: COLOR_SCHEMES['Original'].accent,
      payloadColor: COLOR_SCHEMES['Original'].payload,
      railsColor: COLOR_SCHEMES['Original'].rails,
      particleColor: COLOR_SCHEMES['Original'].particles,

      // Animation & Motion
      animationMode: 'Orbital Flow (Turntable)',
      animSpeed: 1.0,
      hoverAmplitude: 0.32,
      randomizeOnClick: true,

      // Lighting & Exposure
      exposure: 1.35,
      ambientIntensity: 0.75,
      ambientColor: '#ffffff',
      dirLightIntensity: 2.2,
      dirLightColor: COLOR_SCHEMES['Original'].light,
      fillLightIntensity: 1.1,
      fillLightColor: '#88aaff',
      platformGlowIntensity: 2.8,
      payloadLightIntensity: 3.5,

      // Render & Display Settings
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true
    };

    // --- THREE.JS INITIALIZATION ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);
    scene.fog = new THREE.FogExp2(params.backgroundColor, 0.016);

    let camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 16, 32);

    let renderer = new THREE.WebGLRenderer({
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    container.appendChild(renderer.domElement);

    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 90;
    controls.minDistance = 3.5;
    controls.target.set(0, 0, 0);
    controls.screenSpacePanning = true;

    // --- LIGHTS ---
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(params.dirLightColor, params.dirLightIntensity);
    dirLight.position.set(20, 32, 22);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(params.fillLightColor, params.fillLightIntensity);
    fillLight.position.set(-20, 18, -22);
    scene.add(fillLight);

    // --- SHARED MATERIALS ---
    const platformMaterial = new THREE.MeshPhysicalMaterial({
      color: params.platformColor,
      roughness: 0.12,
      metalness: 0.25,
      transparent: true,
      opacity: 0.82,
      transmission: 0.65,
      ior: 1.45,
      reflectivity: 0.8
    });

    const chassisMaterial = new THREE.MeshStandardMaterial({
      color: 0x070b14,
      roughness: 0.35,
      metalness: 0.85
    });

    const neonTrimMaterial = new THREE.MeshBasicMaterial({
      color: params.accentColor
    });

    const neonEdgeLineMaterial = new THREE.LineBasicMaterial({
      color: params.accentColor,
      transparent: true,
      opacity: 0.95
    });

    const holographicRingMaterial = new THREE.MeshBasicMaterial({
      color: params.accentColor,
      wireframe: true,
      transparent: true,
      opacity: 0.75
    });

    const railBodyMaterial = new THREE.MeshStandardMaterial({
      color: 0x060911,
      roughness: 0.3,
      metalness: 0.9
    });

    const railLaserMaterial = new THREE.MeshBasicMaterial({
      color: params.railsColor
    });

    const laserScannerMaterial = new THREE.MeshBasicMaterial({
      color: params.accentColor,
      transparent: true,
      opacity: 0.35,
      side: THREE.DoubleSide
    });

    const portalVortexMaterial = new THREE.MeshBasicMaterial({
      color: params.accentColor,
      wireframe: true,
      transparent: true,
      opacity: 0.7
    });

    // --- 5 HIGH-TECH LAMBDA PLATFORMS ---
    const STAGE_CONFIGS = [
      { id: 0, name: 'Ingest / API Gateway', x: -16 },
      { id: 1, name: 'Validate & Filter', x: -8 },
      { id: 2, name: 'Transform & Compute', x: 0 },
      { id: 3, name: 'Aggregate & Batch', x: 8 },
      { id: 4, name: 'Dispatch & Event Sink', x: 16 }
    ];

    const platforms = [];
    const platformGroup = new THREE.Group();
    scene.add(platformGroup);

    // Create 3D Holographic Lambda Symbol (λ)
    function createLambdaGlyph() {
      const glyphGroup = new THREE.Group();
      // Main stem
      const geom1 = new THREE.CylinderGeometry(0.08, 0.08, 1.5, 16);
      const stroke1 = new THREE.Mesh(geom1, neonTrimMaterial);
      stroke1.rotation.z = -0.38;
      stroke1.position.set(-0.16, 0.7, 0);
      glyphGroup.add(stroke1);

      // Branch stem
      const geom2 = new THREE.CylinderGeometry(0.08, 0.08, 1.0, 16);
      const stroke2 = new THREE.Mesh(geom2, neonTrimMaterial);
      stroke2.rotation.z = 0.55;
      stroke2.position.set(0.3, 0.44, 0);
      glyphGroup.add(stroke2);

      // Central glowing micro-orb
      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), neonTrimMaterial);
      orb.position.set(0.06, 0.72, 0);
      glyphGroup.add(orb);

      return glyphGroup;
    }

    // Build each Lambda Platform with rich sci-fi architecture
    STAGE_CONFIGS.forEach((stage, idx) => {
      const pGroup = new THREE.Group();
      pGroup.position.set(stage.x, 0, 0);

      // 1. Lower Tech Chassis & Magnetic Levitation Hub
      const subGeom = new THREE.CylinderGeometry(3.3, 2.4, 0.5, 6);
      const subMesh = new THREE.Mesh(subGeom, chassisMaterial);
      subMesh.position.y = -0.4;
      pGroup.add(subMesh);

      // Lower glowing radiator ring
      const lowerRing = new THREE.Mesh(new THREE.TorusGeometry(2.35, 0.07, 16, 48), neonTrimMaterial);
      lowerRing.rotation.x = Math.PI / 2;
      lowerRing.position.y = -0.62;
      pGroup.add(lowerRing);

      // 2. Main Beveled Translucent Glass Hexagon
      const baseGeom = new THREE.CylinderGeometry(3.5, 3.75, 0.55, 6);
      const baseMesh = new THREE.Mesh(baseGeom, platformMaterial);
      pGroup.add(baseMesh);

      const baseEdges = new THREE.LineSegments(new THREE.EdgesGeometry(baseGeom), neonEdgeLineMaterial);
      pGroup.add(baseEdges);

      // 3. Glowing Perimeter Edge Trim Tube (Thick Neon Piping)
      const trimCurvePoints = [];
      for (let i = 0; i <= 6; i++) {
        const angle = (i / 6) * Math.PI * 2 + Math.PI / 6;
        trimCurvePoints.push(new THREE.Vector3(Math.cos(angle) * 3.65, 0.28, Math.sin(angle) * 3.65));
      }
      const trimCurve = new THREE.CatmullRomCurve3(trimCurvePoints);
      const trimGeom = new THREE.TubeGeometry(trimCurve, 36, 0.045, 8, true);
      const trimMesh = new THREE.Mesh(trimGeom, neonTrimMaterial);
      pGroup.add(trimMesh);

      // 4. Central Processor Die with glowing heat sinks
      const dieMesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 1.8), chassisMaterial);
      dieMesh.position.y = 0.32;
      pGroup.add(dieMesh);

      const dieTrim = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.8, 0.12, 1.8)), neonEdgeLineMaterial);
      dieTrim.position.y = 0.32;
      pGroup.add(dieTrim);

      // 5. Hovering 3D Lambda Symbol
      const lambdaGlyph = createLambdaGlyph();
      lambdaGlyph.position.y = 0.55;
      pGroup.add(lambdaGlyph);

      // 6. Dual Holographic Telemetry Rings
      const ring1Geom = new THREE.TorusGeometry(2.5, 0.035, 16, 64);
      const ring1Mesh = new THREE.Mesh(ring1Geom, holographicRingMaterial);
      ring1Mesh.rotation.x = Math.PI / 2;
      ring1Mesh.position.y = 0.42;
      pGroup.add(ring1Mesh);

      const ring2Geom = new THREE.TorusGeometry(1.7, 0.025, 16, 48);
      const ring2Mesh = new THREE.Mesh(ring2Geom, holographicRingMaterial);
      ring2Mesh.rotation.x = Math.PI / 2;
      ring2Mesh.position.y = 0.62;
      pGroup.add(ring2Mesh);

      // 7. 6 Perimeter Corner Energy Pylons with pulsating orbs
      const cornerOrbs = [];
      for (let c = 0; c < 6; c++) {
        const a = (c / 6) * Math.PI * 2 + Math.PI / 6;
        const px = Math.cos(a) * 3.4;
        const pz = Math.sin(a) * 3.4;

        const pylon = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.1, 12), chassisMaterial);
        pylon.position.set(px, 0.55, pz);
        pGroup.add(pylon);

        const orb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), neonTrimMaterial);
        orb.position.set(px, 1.15, pz);
        pGroup.add(orb);
        cornerOrbs.push(orb);
      }

      // 8. Platform Underlight & Floor Tech Halo
      const pLight = new THREE.PointLight(params.accentColor, params.platformGlowIntensity, 10);
      pLight.position.set(0, -0.65, 0);
      pGroup.add(pLight);

      // Floor HUD Tech Ring Projection
      const hudPlaneGeom = new THREE.PlaneGeometry(8.5, 8.5);
      const hudPlaneMat = new THREE.MeshBasicMaterial({
        map: techCircleMap,
        color: params.accentColor,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const hudPlane = new THREE.Mesh(hudPlaneGeom, hudPlaneMat);
      hudPlane.rotation.x = -Math.PI / 2;
      hudPlane.position.y = -4.95;
      scene.add(hudPlane); // Keep on floor plane

      // 9. Stage-Specific Holographic Gizmos
      let stageGizmo = null;
      let scannerBeam = null;

      if (idx === 0) {
        // Stage 0: Ingestion Funnel & Overhead Data Beacon
        const funnelGroup = new THREE.Group();
        const topDish = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.08, 16, 48), neonTrimMaterial);
        topDish.rotation.x = Math.PI / 2;
        topDish.position.y = 3.6;
        funnelGroup.add(topDish);

        // Ingestion laser guide lines
        for (let l = 0; l < 4; l++) {
          const la = (l / 4) * Math.PI * 2;
          const lineGeom = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(Math.cos(la) * 1.5, 3.6, Math.sin(la) * 1.5),
            new THREE.Vector3(Math.cos(la) * 0.5, 1.2, Math.sin(la) * 0.5)
          ]);
          const line = new THREE.Line(lineGeom, neonEdgeLineMaterial);
          funnelGroup.add(line);
        }
        pGroup.add(funnelGroup);
        stageGizmo = funnelGroup;
      }
      else if (idx === 1) {
        // Stage 1: Dual Cyber Scanning Gantries with Animated Laser Grid (Replaces grey cylinder)
        const scannerGroup = new THREE.Group();
        const gantry1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.2, 12), chassisMaterial);
        gantry1.position.set(0, 1.8, -2.4);
        scannerGroup.add(gantry1);

        const gantry2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.2, 12), chassisMaterial);
        gantry2.position.set(0, 1.8, 2.4);
        scannerGroup.add(gantry2);

        // Scanning Laser Plane
        const laserPlaneGeom = new THREE.PlaneGeometry(0.08, 4.8);
        scannerBeam = new THREE.Mesh(laserPlaneGeom, laserScannerMaterial);
        scannerBeam.rotation.z = Math.PI / 2;
        scannerBeam.position.set(0, 1.8, 0);
        scannerGroup.add(scannerBeam);

        pGroup.add(scannerGroup);
        stageGizmo = scannerGroup;
      }
      else if (idx === 2) {
        // Stage 2: 3-Axis Gyroscopic Containment Rings
        const gyroGroup = new THREE.Group();
        gyroGroup.position.y = 1.8;

        const gRing1 = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.045, 16, 64), holographicRingMaterial);
        gyroGroup.add(gRing1);

        const gRing2 = new THREE.Mesh(new THREE.TorusGeometry(1.65, 0.035, 16, 48), holographicRingMaterial);
        gRing2.rotation.x = Math.PI / 2;
        gyroGroup.add(gRing2);

        pGroup.add(gyroGroup);
        stageGizmo = gyroGroup;
      }
      else if (idx === 3) {
        // Stage 3: Holographic Aggregation Silos
        const silosGroup = new THREE.Group();
        const silo1 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2.4, 16, 1, true), holographicRingMaterial);
        silo1.position.set(-1.8, 1.6, -1.8);
        silosGroup.add(silo1);

        const silo2 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2.4, 16, 1, true), holographicRingMaterial);
        silo2.position.set(-1.8, 1.6, 1.8);
        silosGroup.add(silo2);

        pGroup.add(silosGroup);
        stageGizmo = silosGroup;
      }
      else if (idx === 4) {
        // Stage 4: Stargate Quantum Portal Arch & Swirling Vortex
        const portalGroup = new THREE.Group();
        portalGroup.position.set(0, 1.9, 0);

        // Segmented Stargate Outer Ring
        const portalArchGeom = new THREE.TorusGeometry(2.8, 0.16, 16, 64);
        const portalArch = new THREE.Mesh(portalArchGeom, chassisMaterial);
        portalArch.rotation.y = Math.PI / 2;
        portalGroup.add(portalArch);

        // Glowing Inner Neon Rim
        const portalRim = new THREE.Mesh(new THREE.TorusGeometry(2.65, 0.05, 16, 64), neonTrimMaterial);
        portalRim.rotation.y = Math.PI / 2;
        portalGroup.add(portalRim);

        // Swirling Portal Event Horizon Vortex
        const vortexGeom = new THREE.RingGeometry(0.2, 2.6, 32);
        const vortexMesh = new THREE.Mesh(vortexGeom, portalVortexMaterial);
        vortexMesh.rotation.y = Math.PI / 2;
        portalGroup.add(vortexMesh);

    // --- COLOR THEME SYNCHRONIZATION ---
    function applyColorScheme(schemeName, animate = true) {

      params.backgroundColor = scheme.background;
      params.platformColor = scheme.platform;
      params.accentColor = scheme.accent;
      params.payloadColor = scheme.payload;
      params.railsColor = scheme.rails;
      params.particleColor = scheme.particles;

    function updateSceneColors(animate = false) {
      const duration = animate ? 0.75 : 0;
      const ease = "power2.out";

      // Background & Fog
      if (!params.greenScreen) {
        if (animate) {
          const targetColor = new THREE.Color(params.backgroundColor);
          gsap.to(scene.background, {
            r: targetColor.r, g: targetColor.g, b: targetColor.b,
            duration: duration, ease: ease
          });
          gsap.to(scene.fog.color, {
            r: targetColor.r, g: targetColor.g, b: targetColor.b,
            duration: duration, ease: ease
          });
        } else {
          scene.background.set(params.backgroundColor);
          scene.fog.color.set(params.backgroundColor);
        }
      } else {
        scene.background.set(0x00ff00);
        scene.fog.color.set(0x00ff00);
      }

      const aColor = new THREE.Color(params.accentColor);
      const rColor = new THREE.Color(params.railsColor);
      const payColor = new THREE.Color(params.payloadColor);
      const partColor = new THREE.Color(params.particleColor);

        gsap.to(shapeCubeMat.color, { r: payColor.r, g: payColor.g, b: payColor.b, duration, ease });
        gsap.to(shapeIcosaMat.color, { r: aColor.r, g: aColor.g, b: aColor.b, duration, ease });
        gsap.to(shapeTorusKnotMat.color, { r: aColor.r, g: aColor.g, b: aColor.b, duration, ease });
        gsap.to(shapeStellarMat.color, { r: aColor.r, g: aColor.g, b: aColor.b, duration, ease });
        gsap.to(ambientMat.color, { r: partColor.r, g: partColor.g, b: partColor.b, duration, ease });

    // --- RECREATE RENDERER FOR ANTIALIAS TOGGLE ---
    function recreateRenderer() {
      const oldCanvas = renderer.domElement;
      const parent = oldCanvas.parentElement;
      renderer.dispose();
      if (parent && oldCanvas) {
        parent.removeChild(oldCanvas);
      }

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      parent.appendChild(renderer.domElement);

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 90;
      controls.minDistance = 3.5;
      controls.screenSpacePanning = true;

      bindPointerEvents(renderer.domElement);
    }

    // --- PROCEDURAL RANDOMIZER (UPON CLICK ON SCENE) ---
    function generateRandomProceduralVariation() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomSchemeKey, true);

      params.animSpeed = Number((0.65 + Math.random() * 1.2).toFixed(2));
      params.hoverAmplitude = Number((0.18 + Math.random() * 0.38).toFixed(2));
      params.exposure = Number((1.05 + Math.random() * 0.55).toFixed(2));
      params.platformGlowIntensity = Number((1.8 + Math.random() * 2.2).toFixed(2));
      params.payloadLightIntensity = Number((2.4 + Math.random() * 2.2).toFixed(2));

      renderer.toneMappingExposure = params.exposure;
      platforms.forEach(p => p.light.intensity = params.platformGlowIntensity);
      payloadLight.intensity = params.payloadLightIntensity;

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- POINTER / CLICK EVENT HANDLING ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    function bindPointerEvents(domElement) {
      domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = performance.now();
      });

      domElement.addEventListener('pointerup', (e) => {
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.hypot(dx, dy);
        const elapsed = performance.now() - pointerDownTime;

        if (dist < 5 && elapsed < 350 && params.randomizeOnClick) {
          generateRandomProceduralVariation();
        }
      });
    }
    bindPointerEvents(renderer.domElement);

    // --- CAMERA ANIMATIONS (8 PRECONFIGURED MODES) ---
    const ANIMATION_MODES = [
      'Static (Free Orbit)',
      'Orbital Flow (Turntable)',
      'Pipeline Glide (Follow Payload)',
      'Overhead Isometric Scan',
      'Lambda Inspection Pendulum',
      'Cinematic Crane',
      'Frontal Stream Perspective',
      'Dynamic Focus Dolly'
    ];

    function updateCameraAnimation(clockTime, dt) {
      if (params.animationMode === 'Static (Free Orbit)') {
        controls.update();
        return;
      }

      if (params.animationMode === 'Orbital Flow (Turntable)') {
        // Continuous smooth turntable orbit around current target.
        // User zoom distance & polar elevation angle are completely preserved!
        const offset = camera.position.clone().sub(controls.target);
        const spherical = new THREE.Spherical().setFromVector3(offset);
        spherical.theta += 0.24 * dt * params.animSpeed;
        offset.setFromSpherical(spherical);
        camera.position.copy(controls.target).add(offset);
        controls.update();
      }
      else if (params.animationMode === 'Pipeline Glide (Follow Payload)') {
        // Glides alongside moving payload. User zoom and angle preserved!
        const targetX = heroPayloadGroup.position.x;
        const dx = (targetX - controls.target.x) * Math.min(dt * 3.2 * params.animSpeed, 0.12);
        controls.target.x += dx;
        camera.position.x += dx;
        controls.update();
      }
      else if (params.animationMode === 'Overhead Isometric Scan') {
        const desiredX = Math.sin(clockTime * 0.25 * params.animSpeed) * 12;
        const dx = (desiredX - controls.target.x) * Math.min(dt * 2.0, 0.08);
        controls.target.x += dx;
        camera.position.x += dx;
        controls.update();
      }
      else if (params.animationMode === 'Lambda Inspection Pendulum') {
        const stageProgress = (cycleProgress * 5) % 5;
        const currentStageIdx = Math.min(Math.floor(stageProgress), 4);
        const desiredX = STAGE_CONFIGS[currentStageIdx].x;
        const dx = (desiredX - controls.target.x) * Math.min(dt * 2.5 * params.animSpeed, 0.1);
        controls.target.x += dx;
        camera.position.x += dx;
        controls.update();
      }
      else if (params.animationMode === 'Cinematic Crane') {
        const dy = Math.sin(clockTime * 0.45 * params.animSpeed) * 0.035 * params.animSpeed;
        camera.position.y += dy;
        controls.update();
      }
      else if (params.animationMode === 'Frontal Stream Perspective') {
        const desiredTargetZ = Math.sin(clockTime * 0.3 * params.animSpeed) * 0.8;
        controls.target.z += (desiredTargetZ - controls.target.z) * dt;
        controls.update();
      }
      else if (params.animationMode === 'Dynamic Focus Dolly') {
        const offset = camera.position.clone().sub(controls.target);
        const breathe = 1.0 + Math.sin(clockTime * 0.9 * params.animSpeed) * (0.0012 * params.animSpeed);
        offset.multiplyScalar(breathe);
        camera.position.copy(controls.target).add(offset);
        controls.update();
      }
    }

    // --- PIPELINE SIMULATION & EVENT PROGRESSION ---
    let cycleProgress = 0;
    const CYCLE_DURATION = 13.5;

    function updatePipeline(dt, clockTime) {
      cycleProgress = (cycleProgress + (dt / CYCLE_DURATION) * params.animSpeed) % 1.0;

      const startX = -18.5;
      const endX = 18.5;
      const currentX = startX + cycleProgress * (endX - startX);
      heroPayloadGroup.position.x = currentX;

      // Vertical sinusoidal hover of payload
      heroPayloadGroup.position.y = 1.85 + Math.sin(clockTime * 3.8 * params.animSpeed) * 0.16;

      // Rotation & Breathing Core
      heroPayloadGroup.rotation.y += 0.018 * params.animSpeed;
      payloadRing.rotation.z += 0.024 * params.animSpeed;
      payloadRing.rotation.x = Math.sin(clockTime * 1.6) * 0.3;

      const corePulse = 1.0 + Math.sin(clockTime * 6.5 * params.animSpeed) * 0.14;
      innerCore.scale.setScalar(corePulse);

      // Morphing Shape Transitions across the 5 Stages
      const stageSpan = (endX - startX) / 5;
      const currentStageFraction = (currentX - startX) / stageSpan;
      const stageIdx = Math.floor(currentStageFraction);
      const stageFrac = currentStageFraction - stageIdx;

      function setShapeScale(mesh, weight) {
        const s = Math.max(0.001, weight);
        mesh.scale.set(s, s, s);
      }

      const blend = (stageFrac < 0.35) ? 0 : (stageFrac > 0.65) ? 1 : (stageFrac - 0.35) / 0.3;
      const smoothBlend = 0.5 - 0.5 * Math.cos(blend * Math.PI);

      if (stageIdx <= 0) {
        setShapeScale(shapeSphere, 1.0 - smoothBlend);
        setShapeScale(shapeIcosa, smoothBlend);
        setShapeScale(shapeTorusKnot, 0.001);
        setShapeScale(shapeCube, 0.001);
        setShapeScale(shapeStellar, 0.001);
      } else if (stageIdx === 1) {
        setShapeScale(shapeSphere, 0.001);
        setShapeScale(shapeIcosa, 1.0 - smoothBlend);
        setShapeScale(shapeTorusKnot, smoothBlend);
        setShapeScale(shapeCube, 0.001);
        setShapeScale(shapeStellar, 0.001);
      } else if (stageIdx === 2) {
        setShapeScale(shapeSphere, 0.001);
        setShapeScale(shapeIcosa, 0.001);
        setShapeScale(shapeTorusKnot, 1.0 - smoothBlend);
        setShapeScale(shapeCube, smoothBlend);
        setShapeScale(shapeStellar, 0.001);
      } else if (stageIdx === 3) {
        setShapeScale(shapeSphere, 0.001);
        setShapeScale(shapeIcosa, 0.001);
        setShapeScale(shapeTorusKnot, 0.001);
        setShapeScale(shapeCube, 1.0 - smoothBlend);
        setShapeScale(shapeStellar, smoothBlend);
      } else {
        setShapeScale(shapeSphere, 0.001);
        setShapeScale(shapeIcosa, 0.001);
        setShapeScale(shapeTorusKnot, 0.001);
        setShapeScale(shapeCube, 0.001);
        const burst = 1.0 + stageFrac * 0.55;
        setShapeScale(shapeStellar, burst);
      }

      // Individual morph mesh spins
      shapeIcosa.rotation.x += 0.022 * params.animSpeed;
      shapeIcosa.rotation.y += 0.028 * params.animSpeed;
      shapeTorusKnot.rotation.x += 0.035 * params.animSpeed;
      shapeTorusKnot.rotation.y += 0.04 * params.animSpeed;
      shapeCube.rotation.y += 0.025 * params.animSpeed;
      satelliteGroup.rotation.y -= 0.05 * params.animSpeed;
      shapeStellar.rotation.y += 0.045 * params.animSpeed;

      // Platform Floating & Interactive Execution Reactions
      platforms.forEach(p => {
        const hoverY = p.baseY + Math.sin(clockTime * 1.9 * params.animSpeed + p.phase) * params.hoverAmplitude;
        p.group.position.y = hoverY;
        p.group.rotation.x = Math.sin(clockTime * 1.2 + p.phase) * 0.02;
        p.group.rotation.z = Math.cos(clockTime * 1.4 + p.phase) * 0.02;

        p.ring1.rotation.z += 0.018 * params.animSpeed;
        p.ring2.rotation.z -= 0.026 * params.animSpeed;
        p.glyph.rotation.y += 0.015 * params.animSpeed;

        // Rotate floor HUD ring projection
        p.hud.rotation.z += 0.008 * params.animSpeed;

        // Bobbing corner orbs
        p.cornerOrbs.forEach((orb, oIdx) => {
          orb.position.y = 1.15 + Math.sin(clockTime * 3.0 + oIdx * 1.1) * 0.12;
        });

        // Stage execution flaring when payload is near
        const dist = Math.abs(heroPayloadGroup.position.x - p.group.position.x);
        const isNear = dist < 3.2;
        const targetLightIntensity = isNear ? params.platformGlowIntensity * 2.4 : params.platformGlowIntensity;
        p.light.intensity += (targetLightIntensity - p.light.intensity) * 0.12;
        p.hud.material.opacity = isNear ? 0.9 : 0.45;

        // Stage-specific gizmo animations
        if (p.index === 0 && p.gizmo) {
          p.gizmo.rotation.y += 0.015 * params.animSpeed;
        } else if (p.index === 1 && p.scannerBeam) {
          // Cyber Scanner Laser sweeping vertically across payload
          p.scannerBeam.position.y = 1.8 + Math.sin(clockTime * 4.5 * params.animSpeed) * 1.1;
          p.scannerBeam.material.opacity = isNear ? 0.8 : 0.35;
        } else if (p.index === 2 && p.gizmo) {
          p.gizmo.children[0].rotation.x += 0.035 * params.animSpeed;
          p.gizmo.children[0].rotation.y += 0.045 * params.animSpeed;
          p.gizmo.children[1].rotation.y -= 0.05 * params.animSpeed;
        } else if (p.index === 3 && p.gizmo) {
          p.gizmo.children[0].rotation.y += 0.03 * params.animSpeed;
          p.gizmo.children[1].rotation.y -= 0.03 * params.animSpeed;
        } else if (p.index === 4 && p.gizmo) {
          p.gizmo.children[2].rotation.z += 0.04 * params.animSpeed; // Vortex spin
        }
      });

      // Advance Micro-Packets along Rails
      microPackets.forEach(pk => {
        pk.progress = (pk.progress + (pk.speed * 0.011 * params.animSpeed)) % 1.0;
        const px = startX + pk.progress * (endX - startX);
        pk.mesh.position.set(px, pk.baseY + Math.sin(clockTime * 7 + pk.progress * 12) * 0.04, pk.side);
      });

      // Update Ambient Round Particles
      const aPos = ambientGeom.attributes.position.array;
      for (let i = 0; i < ambientParticleCount; i++) {
        aPos[i * 3 + 1] += ambientVels[i].vy * params.animSpeed;
        aPos[i * 3] += ambientVels[i].vx * params.animSpeed;
        aPos[i * 3 + 2] += ambientVels[i].vz * params.animSpeed;
        if (aPos[i * 3 + 1] > 16) {
          aPos[i * 3 + 1] = ambientVels[i].baseY;
          aPos[i * 3] = (Math.random() - 0.5) * 70;
          aPos[i * 3 + 2] = (Math.random() - 0.5) * 45;
        }
      }
      ambientGeom.attributes.position.needsUpdate = true;

      // Update Payload Comet Tail Round Particles
      const tPos = trailGeom.attributes.position.array;
      trailHeadIndex = (trailHeadIndex + 1) % trailCount;
      tPos[trailHeadIndex * 3] = heroPayloadGroup.position.x + (Math.random() - 0.5) * 0.35;
      tPos[trailHeadIndex * 3 + 1] = heroPayloadGroup.position.y + (Math.random() - 0.5) * 0.35;
      tPos[trailHeadIndex * 3 + 2] = heroPayloadGroup.position.z + (Math.random() - 0.5) * 0.35;
      trailGeom.attributes.position.needsUpdate = true;

      // Update Stargate Vortex Round Particles (Stage 4)
      const pPos = portalParticleGeom.attributes.position.array;
      for (let i = 0; i < portalParticleCount; i++) {
        portalMeta[i].angle += portalMeta[i].speed * params.animSpeed;
        portalMeta[i].radius -= 0.008 * params.animSpeed;
        if (portalMeta[i].radius < 0.25) {
          portalMeta[i].radius = 2.4;
        }
        pPos[i * 3] = 16.0 + Math.sin(portalMeta[i].angle * 2) * 0.15;
        pPos[i * 3 + 1] = 1.9 + Math.sin(portalMeta[i].angle) * portalMeta[i].radius;
        pPos[i * 3 + 2] = Math.cos(portalMeta[i].angle) * portalMeta[i].radius;
      }
      portalParticleGeom.attributes.position.needsUpdate = true;
    }

    // --- LIL-GUI SETUP (STANDARD STYLING, NO CUSTOM CSS INJECTIONS) ---
    const gui = new GUI({ title: 'Serverless Pipeline Controls' });

    // Folder: Pipeline & Presets
    const fPipeline = gui.addFolder('Pipeline & Motion');
    fPipeline.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => {
      applyColorScheme(v, true);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    fPipeline.add(params, 'animationMode', ANIMATION_MODES).name('Camera Mode');
    fPipeline.add(params, 'animSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
    fPipeline.add(params, 'hoverAmplitude', 0.0, 0.8, 0.02).name('Hover Amplitude');
    fPipeline.add(params, 'randomizeOnClick').name('Randomize on Click');

    // Folder: Colors & Greenscreen
    const fColors = gui.addFolder('Colors & Greenscreen');
    fColors.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(v => {
      if (v) {
        scene.background.set(0x00ff00);
        scene.fog.color.set(0x00ff00);
      } else {
        scene.background.set(params.backgroundColor);
        scene.fog.color.set(params.backgroundColor);
      }
    });
    fColors.addColor(params, 'backgroundColor').name('Background Color').onChange(v => {
      if (!params.greenScreen) {
        scene.background.set(v);
        scene.fog.color.set(v);
      }
    });
    fColors.addColor(params, 'platformColor').name('Platform Glass').onChange(() => updateSceneColors(false));
    fColors.addColor(params, 'accentColor').name('Accent & Lasers').onChange(() => updateSceneColors(false));
    fColors.addColor(params, 'payloadColor').name('Payload Core').onChange(() => updateSceneColors(false));
    fColors.addColor(params, 'railsColor').name('Conveyor Rails').onChange(() => updateSceneColors(false));
    fColors.addColor(params, 'particleColor').name('Quantum Particles').onChange(() => updateSceneColors(false));

    // Folder: Lighting & Exposure
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Tone Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    fLight.add(params, 'ambientIntensity', 0.0, 2.5, 0.05).name('Ambient Intensity').onChange(v => {
      ambientLight.intensity = v;
    });
    fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(v => {
      ambientLight.color.set(v);
    });
    fLight.add(params, 'dirLightIntensity', 0.0, 4.0, 0.1).name('Key Light Intensity').onChange(v => {
      dirLight.intensity = v;
    });
    fLight.addColor(params, 'dirLightColor').name('Key Light Color').onChange(v => {
      dirLight.color.set(v);
    });
    fLight.add(params, 'fillLightIntensity', 0.0, 3.0, 0.1).name('Fill Light Intensity').onChange(v => {
      fillLight.intensity = v;
    });
    fLight.addColor(params, 'fillLightColor').name('Fill Light Color').onChange(v => {
      fillLight.color.set(v);
    });
    fLight.add(params, 'platformGlowIntensity', 0.0, 6.0, 0.1).name('Platform Glow').onChange(v => {
      platforms.forEach(p => p.light.intensity = v);
    });
    fLight.add(params, 'payloadLightIntensity', 0.0, 6.0, 0.1).name('Payload Light').onChange(v => {
      payloadLight.intensity = v;
    });

    // Folder: Display & Rendering
    const fRender = gui.addFolder('Render & Display');
    fRender.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
    });
    fRender.add(params, 'antialias').name('Antialiasing').onChange(() => {
      recreateRenderer();
    });

    // --- KEYBOARD UI TOGGLE ("H" KEY) ---
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        gui.show(isGuiVisible);
      }
    });

    // --- WINDOW RESIZE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);
      const clockTime = clock.getElapsedTime();

      updatePipeline(dt, clockTime);
      updateCameraAnimation(clockTime, dt);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
