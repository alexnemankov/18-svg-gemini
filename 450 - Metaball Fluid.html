      pointer-events: none;

<!-- Original GLSL Shaders Embedded for Structure & Shader Reference -->
<script type="x-shader/x-vertex" id="vertexMetaballs">
  attribute vec2 position;
  void main() {
    gl_Position = vec4(position, 0.0, 1.0);
  }
</script>

<script type="x-shader/x-fragment" id="fragmentMetaballs">
  precision highp float;
  const int NUM_METABALLS = 15;

  uniform vec3 metaballs[15];
  uniform vec2 uResolution;
  uniform sampler2D uColorSampler;
  uniform sampler2D uNoiseSampler;
  uniform float uTime;
  
  void main(){
    float x = gl_FragCoord.x;
    float y = gl_FragCoord.y;
    float v = 0.0;
    for (int i = 0; i < NUM_METABALLS; i++) {
      vec3 mb = metaballs[i];
      float dx = mb.x - x;
      float dy = mb.y - y;
      float r = mb.z;
      v += r*r/(dx*dx + dy*dy);
    }

    vec4 color;
    if (v > 1.0) {
      vec4 textureColor = texture2D(uColorSampler, vec2(gl_FragCoord.x / uResolution.x, gl_FragCoord.y / uResolution.y) );
      vec4 noiseColor = (texture2D(uNoiseSampler, gl_FragCoord.xy / 100.0 )) / 1.;
      float l = length(noiseColor);
      if(l > 1.05){
        vec4 mixedColor = textureColor + (noiseColor * 0.001);
        color = mixedColor;
      }
      else{
        color = textureColor * 0.85;
      }
    }
    else {
      discard;
    }
    gl_FragColor = vec4(color.rgb, 0.8);
  }
</script>

  // =========================================================================
  // GRADIENT & PROCEDURAL NOISE GENERATORS
  // Generates canvas gradient textures and multi-frequency noise textures
  // =========================================================================
  function generateGradientTexture(colorStops, vertical) {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    const grd = vertical ? ctx.createLinearGradient(0, size, 0, 0) : ctx.createLinearGradient(0, 0, size, 0);
    colorStops.forEach(st => {
      grd.addColorStop(st.stop, st.color);
    });
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, size, size);

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  function createProceduralNoiseTexture() {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(size, size);
    const data = imgData.data;

    // Organic procedural value noise texture
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const idx = (y * size + x) * 4;
        const n1 = Math.sin(x * 0.12) * Math.cos(y * 0.12);
        const n2 = Math.sin(x * 0.04 + y * 0.03) * 0.5;
        const n3 = (Math.random() - 0.5) * 0.25;
        const val = Math.max(0, Math.min(1, (n1 + n2 + n3) * 0.5 + 0.5));
        const c = Math.floor(val * 255);
        data[idx] = c;
        data[idx + 1] = c;
        data[idx + 2] = c;
        data[idx + 3] = 255;
      }
    }
    ctx.putImageData(imgData, 0, 0);

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  // =========================================================================

  let renderer, scene, camera, controls, clock;

    noiseTexture = createProceduralNoiseTexture();

    textureLoader.load(

        loadedTex.wrapS = THREE.RepeatWrapping;
        loadedTex.wrapT = THREE.RepeatWrapping;
        noiseTexture = loadedTex;
        metaballMeshes.forEach(mesh => {
          mesh.material.uniforms.uNoiseSampler.value = noiseTexture;
        });
      },
      undefined,
      () => { /* Keeps procedural noise */ }
    );

    // Build the 7 Metaball Mesh Planes
    buildMetaballLayers();

    // Setup GUI and Listeners

    // Apply initial color palette & staggered fade-in

  // =========================================================================
  // METABALL SHADER & MESH LAYERS BUILDER
  // Evaluates metaball field in local geometry space, enabling full 3D rotation,
  // camera tilt, zoom, and normal-based liquid lighting reflections
  // =========================================================================
  const metaballVertexShader = `
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying vec2 vLocalPos;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPos = worldPos.xyz;
      vLocalPos = position.xy;
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `;

  const metaballFragmentShader = `
    precision highp float;
    const int NUM_METABALLS = 15;

    uniform vec3 metaballs[15];
    uniform int uNumBalls;
    uniform sampler2D uColorSampler;
    uniform sampler2D uNoiseSampler;
    uniform float uTime;
    uniform float uFade;

    // Lighting Uniforms
    uniform float exposure;
    uniform float sceneLightIntensity;
    uniform vec3 ambientColor;
    uniform float ambientIntensity;

    uniform vec3 keyLightColor;
    uniform float keyLightIntensity;
    uniform vec3 keyLightPos;

    uniform vec3 fillLightColor;
    uniform float fillLightIntensity;
    uniform vec3 fillLightPos;

    uniform vec3 pointLightColor;
    uniform float pointLightIntensity;
    uniform vec3 pointLightPos;

    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying vec2 vLocalPos;

    void main() {
      float x = vLocalPos.x;
      float y = vLocalPos.y;
      float v = 0.0;
      vec2 grad = vec2(0.0);

      for (int i = 0; i < NUM_METABALLS; i++) {
        if (i >= uNumBalls) break;
        vec3 mb = metaballs[i];
        float dx = mb.x - x;
        float dy = mb.y - y;
        float r = mb.z;
        float distSq = dx * dx + dy * dy;
        float safeDistSq = max(distSq, 1.0);
        float contrib = (r * r) / safeDistSq;
        v += contrib;
        grad += (2.0 * r * r / (safeDistSq * safeDistSq)) * vec2(dx, dy);
      }

      if (v > 1.0) {
        vec4 textureColor = texture2D(uColorSampler, vUv);
        vec4 noiseColor = texture2D(uNoiseSampler, vLocalPos / 100.0);
        float l = length(noiseColor);
        vec4 color;
        if (l > 1.05) {
          color = textureColor + (noiseColor * 0.001);
        } else {
          color = textureColor * 0.85;
        }

        // Analytical normal for 3D liquid dome reflection
        float heightFactor = clamp(v - 1.0, 0.0, 2.5);
        vec3 surfaceNorm = normalize(vec3(-grad * 0.12, 1.0 + heightFactor * 0.4));
        vec3 N = normalize(vNormal * surfaceNorm.z + vec3(surfaceNorm.xy, 0.0));

        // Lighting Calculation
        vec3 totalLight = ambientColor * ambientIntensity;

        // Key Light
        vec3 keyDir = normalize(keyLightPos);
        float diffKey = max(dot(N, keyDir), 0.0);
        vec3 viewDir = normalize(-vWorldPos);
        vec3 halfKey = normalize(keyDir + viewDir);
        float specKey = pow(max(dot(N, halfKey), 0.0), 32.0);
        totalLight += keyLightColor * (keyLightIntensity * diffKey + specKey * 0.4);

        // Fill Light
        vec3 fillDir = normalize(fillLightPos);
        float diffFill = max(dot(N, fillDir), 0.0);
        totalLight += fillLightColor * (fillLightIntensity * diffFill);

        // Point Light
        vec3 pointVec = pointLightPos - vWorldPos;
        float pDist = length(pointVec);
        vec3 pDir = normalize(pointVec);
        float pAtten = 1.0 / (1.0 + 0.0000015 * pDist * pDist);
        float diffP = max(dot(N, pDir), 0.0);
        vec3 halfP = normalize(pDir + viewDir);
        float specP = pow(max(dot(N, halfP), 0.0), 24.0);
        totalLight += pointLightColor * (pointLightIntensity * diffP * pAtten + specP * 0.35 * pAtten);

        vec3 litColor = color.rgb * totalLight * sceneLightIntensity * exposure;
        gl_FragColor = vec4(litColor, 0.82 * uFade);
      } else {
        discard;
      }
    }
  `;

  function buildMetaballLayers() {
    // Clear existing
    metaballMeshes.forEach(mesh => {
      objectGroup.remove(mesh);
      mesh.geometry.dispose();
      mesh.material.dispose();
    });
    metaballMeshes = [];

    // Layer plane size ample for all cluster offsets
    const planeGeo = new THREE.PlaneGeometry(3600, 2400);

    groupsData.forEach((group, idx) => {
      const uniforms = {
        metaballs: { value: new Float32Array(15 * 3) },
        uNumBalls: { value: group.metaballs.length },
        uColorSampler: { value: null },
        uNoiseSampler: { value: noiseTexture },
        uTime: { value: 0.0 },
        uFade: { value: 0.0 },

        exposure: { value: params.exposure },
        sceneLightIntensity: { value: params.sceneLightIntensity },
        ambientColor: { value: new THREE.Color(params.ambientColor) },
        ambientIntensity: { value: params.ambientIntensity },

        keyLightColor: { value: new THREE.Color(params.keyLightColor) },
        keyLightIntensity: { value: params.keyLightIntensity },
        keyLightPos: { value: new THREE.Vector3(params.keyLightX, params.keyLightY, params.keyLightZ) },

        fillLightColor: { value: new THREE.Color(params.fillLightColor) },
        fillLightIntensity: { value: params.fillLightIntensity },
        fillLightPos: { value: new THREE.Vector3(params.fillLightX, params.fillLightY, params.fillLightZ) },

        pointLightColor: { value: new THREE.Color(params.pointLightColor) },
        pointLightIntensity: { value: params.pointLightIntensity },
        pointLightPos: { value: new THREE.Vector3(params.pointLightX, params.pointLightY, params.pointLightZ) }
      };

      const mat = new THREE.ShaderMaterial({
        vertexShader: metaballVertexShader,
        fragmentShader: metaballFragmentShader,
        uniforms: uniforms,
        transparent: true,
        depthWrite: false,
        blending: THREE.NormalBlending
      });

      const mesh = new THREE.Mesh(planeGeo, mat);
      mesh.position.z = group.zDepth;
      objectGroup.add(mesh);
      metaballMeshes.push(mesh);
    });

    updateAllGroupTextures();
  }

  function getPaletteColorByIndex(pal, idx) {
    if (idx === 1) return pal.c1;
    if (idx === 2) return pal.c2;
    if (idx === 3) return pal.c3;
    if (idx === 4) return pal.c4;
    return pal.c5;
  }

  function updateAllGroupTextures() {
    const pal = {
      c1: params.color1,
      c2: params.color2,
      c3: params.color3,
      c4: params.color4,
      c5: params.color5
    };

    groupsData.forEach((group, idx) => {
      const stops = group.stops.map(st => ({
        stop: st.stop,
        color: getPaletteColorByIndex(pal, st.idx)
      }));
      const tex = generateGradientTexture(stops, group.vertical);
      if (metaballMeshes[idx]) {
        metaballMeshes[idx].material.uniforms.uColorSampler.value = tex;
      }
    });
  }

  // =========================================================================
  // COLOR SCHEMES & GREENSCREEN APPLICATION
  // =========================================================================
  function applyPalette(schemeKey) {
    params.palette = schemeKey;
    const pal = COLOR_SCHEMES[schemeKey] || COLOR_SCHEMES['Original'];

    params.bgColor1 = pal.bg1;
    params.bgColor2 = pal.bg2;
    params.color1 = pal.c1;
    params.color2 = pal.c2;
    params.color3 = pal.c3;
    params.color4 = pal.c4;
    params.color5 = pal.c5;

    params.ambientColor = pal.ambient;
    params.keyLightColor = pal.keyLight;
    params.fillLightColor = pal.fillLight;
    params.pointLightColor = pal.pointLight;

    updateBackgroundStyling();
    updateAllGroupTextures();
    updateLightingUniforms();
  }

  function updateBackgroundStyling() {
    if (params.greenscreen) {
      bgWrapper.style.background = '#00ff00';
      dotsOverlay.style.opacity = '0';
      renderer.setClearColor(0x00ff00, 1.0);
    } else {
      bgWrapper.style.background = `linear-gradient(to bottom right, ${params.bgColor1}, ${params.bgColor2})`;
      dotsOverlay.style.opacity = '0.1';
      renderer.setClearColor(0x000000, 0.0);
    }
  }

  function updateLightingUniforms() {
    metaballMeshes.forEach(mesh => {
      const u = mesh.material.uniforms;
      u.exposure.value = params.exposure;
      u.sceneLightIntensity.value = params.sceneLightIntensity;

      u.ambientColor.value.set(params.ambientColor);
      u.ambientIntensity.value = params.ambientIntensity;

      u.keyLightColor.value.set(params.keyLightColor);
      u.keyLightIntensity.value = params.keyLightIntensity;
      u.keyLightPos.value.set(params.keyLightX, params.keyLightY, params.keyLightZ);

      u.fillLightColor.value.set(params.fillLightColor);
      u.fillLightIntensity.value = params.fillLightIntensity;
      u.fillLightPos.value.set(params.fillLightX, params.fillLightY, params.fillLightZ);

      u.pointLightColor.value.set(params.pointLightColor);
      u.pointLightIntensity.value = params.pointLightIntensity;
      u.pointLightPos.value.set(params.pointLightX, params.pointLightY, params.pointLightZ);
    });

    if (renderer) {
      renderer.toneMappingExposure = params.exposure;
    }
  }

  function updateMouseButtons() {
    if (!controls) return;
    if (params.leftClickAction === 'Drag / Pan Object') {
      controls.mouseButtons = {
        LEFT: THREE.MOUSE.PAN,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.ROTATE
      };
    } else {
      controls.mouseButtons = {
        LEFT: THREE.MOUSE.ROTATE,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.PAN
      };
    }
  }

  function resetCameraView() {
    controls.target.set(0, 0, 0);
    camera.position.set(0, 0, 1800);
    camera.lookAt(0, 0, 0);
    controls.update();

  function rebuildRenderer() {
    if (renderer) {
      renderer.dispose();
    }
    renderer = new THREE.WebGLRenderer({
      canvas: canvasElement,
      antialias: params.antialias,
      alpha: true,
      powerPreference: 'high-performance'
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    updateBackgroundStyling();

    controls.dispose();
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.zoomSpeed = 1.0;
    controls.enablePan = true;
    controls.panSpeed = 1.0;
    controls.screenSpacePanning = true;
    controls.minDistance = 200;
    controls.maxDistance = 5000;

  // =========================================================================
  // PROCEDURAL RANDOMIZATION ON USER SCENE CLICK
  // Re-rolls theme, geometric parameters, motion speeds, and updates panel
  // =========================================================================
  function randomizeProceduralScene() {
    // 1. Pick a random palette from the 19 schemes
    const keys = Object.keys(COLOR_SCHEMES);
    const randKey = keys[Math.floor(Math.random() * keys.length)];
    applyPalette(randKey);

    // 2. Re-roll geometric & motion parameters
    params.animationSpeed = parseFloat((Math.random() * 1.5 + 0.5).toFixed(2));
    params.metaballScale = parseFloat((Math.random() * 0.7 + 0.65).toFixed(2));
    params.clusterJitter = parseFloat((Math.random() * 1.0 + 0.5).toFixed(2));

    groupsData.forEach(group => {
      group.metaballs.forEach(mb => {
        mb.radius = mb.baseRadius * params.metaballScale * (0.8 + Math.random() * 0.4);
        mb.speed = (Math.random() * 1.8 + 0.3) * (Math.random() < 0.5 ? 1 : -1);
        mb.arcMultiplierX = (Math.random() - 0.5) * 1.6 * params.clusterJitter;
        mb.arcMultiplierY = (Math.random() - 0.5) * 1.2 * params.clusterJitter;
      });
    });

    // 3. Re-roll subtle lighting
    params.exposure = parseFloat((Math.random() * 0.6 + 0.7).toFixed(2));
    params.sceneLightIntensity = parseFloat((Math.random() * 0.6 + 0.7).toFixed(2));
    params.keyLightIntensity = parseFloat((Math.random() * 1.0 + 0.8).toFixed(2));
    params.pointLightIntensity = parseFloat((Math.random() * 1.2 + 0.6).toFixed(2));

    updateAllGroupTextures();
    updateLightingUniforms();

    // 4. Update lil-gui controls
    if (gui) {
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }
  }

  // =========================================================================
  // EVENT LISTENERS
  // =========================================================================
  function setupEventListeners() {
    window.addEventListener('resize', onWindowResize);

    // Toggle all UI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui) {
          gui._hidden ? gui.show() : gui.hide();
        }
      }
    });

    // Detect genuine scene click vs drag to trigger procedural randomization
    canvasElement.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      pointerDownPos.set(e.clientX, e.clientY);
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;

      // Ignore clicks directly inside lil-gui control panel
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownTime;

      // Clean single click (not a camera orbit or screen drag)
      if (dist < 6 && elapsed < 350) {
        if (params.randomizeOnClick) {
          randomizeProceduralScene();
        }
      }
    });
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.pixelRatio);
  }

  // =========================================================================
  // LIL-GUI CONTROL PANEL SYSTEM
  // Pure, standard lil-gui matching all user parameters
  // =========================================================================
  function setupGui() {
    gui = new GUI({ title: 'Metaball Fluid Controls' });

    // 🎬 Folder: Animation & Camera
    const animFolder = gui.addFolder('🎬 Animation & Camera');
    animFolder.add(params, 'cameraAnimation', [
      'Static (No Movement)',
      'Slow Orbit',
      'Gentle Figure-8',
      'Floating Waves',
      'Spiral Drift',
      'Breathing Dolly',
      'Pendulum Sway',
      'Cinematic Arc'
    ]).name('Camera Animation');

    animFolder.add(params, 'animationSpeed', 0.0, 4.0, 0.05).name('Animation Speed');
    animFolder.add(params, 'leftClickAction', ['Rotate / Orbit', 'Drag / Pan Object'])
      .name('Left-Click Action')
      .onChange(updateMouseButtons);
    animFolder.add(params, 'resetCamera').name('🎯 Reset Camera');

    // 🎨 Folder: Color & Schemes (19 Preconfigured Schemes)
    const colorFolder = gui.addFolder('🎨 Color & Schemes');
    colorFolder.add(params, 'palette', Object.keys(COLOR_SCHEMES))
      .name('Color Scheme')
      .onChange((val) => {
        applyPalette(val);
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      });

    colorFolder.add(params, 'greenscreen')
      .name('Greenscreen (#00ff00)')
      .onChange(updateBackgroundStyling);

    colorFolder.addColor(params, 'bgColor1').name('Background Grad 1').onChange(updateBackgroundStyling);
    colorFolder.addColor(params, 'bgColor2').name('Background Grad 2').onChange(updateBackgroundStyling);
    colorFolder.addColor(params, 'color1').name('Metaball Color 1').onChange(updateAllGroupTextures);
    colorFolder.addColor(params, 'color2').name('Metaball Color 2').onChange(updateAllGroupTextures);
    colorFolder.addColor(params, 'color3').name('Metaball Color 3').onChange(updateAllGroupTextures);
    colorFolder.addColor(params, 'color4').name('Metaball Color 4').onChange(updateAllGroupTextures);
    colorFolder.addColor(params, 'color5').name('Metaball Color 5').onChange(updateAllGroupTextures);

    // 💡 Folder: Lighting & Exposure
    const lightFolder = gui.addFolder('💡 Lighting & Exposure');
    lightFolder.add(params, 'exposure', 0.1, 3.0, 0.05).name('Exposure').onChange(updateLightingUniforms);
    lightFolder.add(params, 'sceneLightIntensity', 0.0, 3.0, 0.05).name('Scene Light Intensity').onChange(updateLightingUniforms);

    lightFolder.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(updateLightingUniforms);
    lightFolder.addColor(params, 'ambientColor').name('Ambient Color').onChange(updateLightingUniforms);

    lightFolder.add(params, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Key Light Intensity').onChange(updateLightingUniforms);
    lightFolder.addColor(params, 'keyLightColor').name('Key Light Color').onChange(updateLightingUniforms);
    lightFolder.add(params, 'keyLightX', -1000, 1000, 10).name('Key Light X').onChange(updateLightingUniforms);
    lightFolder.add(params, 'keyLightY', -1000, 1000, 10).name('Key Light Y').onChange(updateLightingUniforms);
    lightFolder.add(params, 'keyLightZ', 100, 1500, 10).name('Key Light Z').onChange(updateLightingUniforms);

    lightFolder.add(params, 'fillLightIntensity', 0.0, 2.0, 0.05).name('Fill Light Intensity').onChange(updateLightingUniforms);
    lightFolder.addColor(params, 'fillLightColor').name('Fill Light Color').onChange(updateLightingUniforms);

    lightFolder.add(params, 'pointLightIntensity', 0.0, 3.0, 0.05).name('Point Light Intensity').onChange(updateLightingUniforms);
    lightFolder.addColor(params, 'pointLightColor').name('Point Light Color').onChange(updateLightingUniforms);
    lightFolder.add(params, 'pointLightX', -800, 800, 10).name('Point Light X').onChange(updateLightingUniforms);
    lightFolder.add(params, 'pointLightY', -800, 800, 10).name('Point Light Y').onChange(updateLightingUniforms);
    lightFolder.add(params, 'pointLightZ', 100, 1000, 10).name('Point Light Z').onChange(updateLightingUniforms);

    // ⚙️ Folder: Quality & Render
    const renderFolder = gui.addFolder('⚙️ Quality & Render');
    renderFolder.add(params, 'antialias').name('Antialias').onChange(rebuildRenderer);
    renderFolder.add(params, 'pixelRatio', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
      renderer.setPixelRatio(val);
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 🎲 Folder: Procedural Generation
    const procFolder = gui.addFolder('🎲 Procedural Variation');
    procFolder.add(params, 'randomizeOnClick').name('Randomize on Click');
    procFolder.add(params, 'randomizeNow').name('🎲 Randomize Scene Now');
    procFolder.add(params, 'metaballScale', 0.4, 2.0, 0.05).name('Metaball Scale').onChange(() => {
      groupsData.forEach(group => {
        group.metaballs.forEach(mb => {
          mb.radius = mb.baseRadius * params.metaballScale;
        });
      });
    });
    procFolder.add(params, 'clusterJitter', 0.0, 2.5, 0.1).name('Orbit Spread').onChange(() => {
      groupsData.forEach(group => {
        group.metaballs.forEach(mb => {
          mb.centerOffsetX = mb.baseOffsetX * params.clusterJitter;
          mb.centerOffsetY = mb.baseOffsetY * params.clusterJitter;
        });
      });
    });

    animFolder.open();
    colorFolder.open();
  }

  // =========================================================================
  // ANIMATION & RENDER LOOP
  // Preserves user wheel zoom and camera angle offsets seamlessly
  // =========================================================================
  const camOffset = new THREE.Vector3();
  const spherical = new THREE.Spherical();

  function renderLoop() {
    requestAnimationFrame(renderLoop);

    const delta = Math.min(clock.getDelta(), 0.1);
    const effectiveDelta = delta * params.animationSpeed;
    animTime += effectiveDelta;

    // 1. Update Metaball Physical Simulation in each group
    groupsData.forEach((group, gIdx) => {
      if (group.fadingIn && group.fade < 1.0) {
        group.fade = Math.min(1.0, group.fade + delta * 1.5);
      }

      const ballCount = group.metaballs.length;
      const mesh = metaballMeshes[gIdx];
      if (!mesh) return;

      const uniformArr = mesh.material.uniforms.metaballs.value;

      group.metaballs.forEach((mb, mIdx) => {
        mb.t += mb.speed * 0.03 * params.animationSpeed;
        const curX = mb.centerOffsetX + Math.cos(mb.t) * (mb.radius * mb.arcMultiplierX);
        const curY = mb.centerOffsetY + Math.sin(mb.t) * (mb.radius * mb.arcMultiplierY);

        uniformArr[mIdx * 3 + 0] = curX;
        uniformArr[mIdx * 3 + 1] = curY;
        uniformArr[mIdx * 3 + 2] = mb.radius;
      });

      mesh.material.uniforms.uTime.value = animTime;
      mesh.material.uniforms.uFade.value = group.fade;
    });

    // 2. Camera Animation Presets (Seamlessly preserves user wheel zoom & manual angle tweaks)
    if (params.cameraAnimation !== 'Static (No Movement)') {
      camOffset.copy(camera.position).sub(controls.target);
      spherical.setFromVector3(camOffset);

      switch (params.cameraAnimation) {
        case 'Slow Orbit':
          spherical.theta += 0.22 * effectiveDelta;
          break;

        case 'Gentle Figure-8':
          spherical.theta += 0.18 * effectiveDelta;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(animTime * 0.8) * 0.14 * effectiveDelta,
            0.15,
            Math.PI - 0.15
          );
          break;

        case 'Floating Waves':
          spherical.theta += Math.sin(animTime * 0.6) * 0.22 * effectiveDelta;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.cos(animTime * 0.9) * 0.15 * effectiveDelta,
            0.15,
            Math.PI - 0.15
          );
          break;

        case 'Spiral Drift':
          spherical.theta += 0.20 * effectiveDelta;
          controls.target.y += Math.sin(animTime * 1.1) * 15.0 * effectiveDelta;
          break;

        case 'Breathing Dolly': {
          spherical.theta += 0.12 * effectiveDelta;
          // Subtly pulses around the user's chosen distance without resetting
          const breath = 1.0 + Math.sin(animTime * 1.2) * 0.0025 * params.animationSpeed;
          spherical.radius = THREE.MathUtils.clamp(spherical.radius * breath, 200, 5000);
          break;
        }

        case 'Pendulum Sway':
          spherical.theta += Math.cos(animTime * 0.7) * 0.28 * effectiveDelta;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(animTime * 0.4) * 0.10 * effectiveDelta,
            0.2,
            Math.PI - 0.2
          );
          break;

        case 'Cinematic Arc':
          spherical.theta += 0.25 * effectiveDelta;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(animTime * 0.45) * 0.18 * effectiveDelta,
            0.2,
            Math.PI - 0.2
          );
          break;
      }

      camOffset.setFromSpherical(spherical);
      camera.position.copy(controls.target).add(camOffset);
    }

    controls.update();
    renderer.render(scene, camera);
  }

  // Launch scene
  init();
</script>
