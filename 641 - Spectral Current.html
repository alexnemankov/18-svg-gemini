<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Spectral Current — an infinite, procedural photograph of delicate light flowing through darkness.">
  <link rel="icon" href="data:,">
  <title>Spectral Current</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #status { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; color: #c7d8e4; font: 14px/1.7 system-ui, sans-serif; text-align: center; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
<div id="status" role="status">Gathering light…</div>
<script type="module">
/*
 * SPECTRAL CURRENT
 * Single-file Three.js / GLSL artwork. No image, video, or texture assets.
 * Open directly, or serve with any static server / Vite. Internet is needed
 * only for the pinned Three.js module (with an independent CDN fallback).
 * Space: pause / resume. F: fullscreen. H: toggle the lil-gui panel.
 * Wheel / pinch: zoom. Drag: pan. Shift-drag: adjust the view angle.
 * All emitted light and the thresholded, separable bloom are computed on GPU.
 */
const config = {
  speed: 0.035,
  streakDensity: 1.0,
  glowIntensity: 1.25,
  colorSaturation: 1.15,
  distortionStrength: 0.025,
  parallaxStrength: 0.15,
  exposure: 1.12,
  maxPixelRatio: 1.75,
  animationEnabled: true,
  animation: 'Spectral current',
  animationSpeed: 1,
  motionAmount: 1,
  scheme: 'Original',
  background: '#000000',
  greenscreen: false,
  invert: false,
  lightColor: '#ffffff',
  colorMix: 0,
  accent: '#ff3030',
  zoom: 1,
  panX: 0,
  panY: 0,
  angle: 32,
  seed: 0,
  randomizeOnClick: true
};

// Eleven color-theory schemes plus the eight supplied palettes = 19 choices.
// Inversion gives both achromatic variants without duplicating menu entries.
const schemes = {
  'Original': { colors: ['005bff','00f5ff','853bff','ff00cb','ff6200','fff340'], background: '#000000', mode: 0 },
  'Monochromatic': { colors: ['e6f5ff','81c8ff','3288ec','164aa0','061630'], background: '#01050c' },
  'Analogous': { colors: ['00f5ff','00aaff','395bff','853bff','d33bff'], background: '#03010d' },
  'Complementary': { colors: ['00ecff','168dcd','416bba','ff7b21','ffd38a'], background: '#03070b' },
  'Split-complementary': { colors: ['22deed','3971cf','f567aa','ff7941','ffd166'], background: '#07040c' },
  'Triadic': { colors: ['24dcf4','fc448f','ffe258','3aaada','db369d'], background: '#05040a' },
  'Tetradic': { colors: ['00dbe9','5366ff','ff486a','ffcd38','7be85c'], background: '#03070a' },
  'Double split-complementary': { colors: ['ff8165','ffce5b','7de6a4','34badc','9272ef','ed65b0'], background: '#07060b' },
  'Achromatic': { colors: ['ffffff','dddddd','aaaaaa','777777','444444'], background: '#000000', mode: 2 },
  'Achromatic + Accent': { colors: ['ffffff','dddddd','aaaaaa','777777','ff3030'], background: '#000000', mode: 3 },
  'Neutral + accent': { colors: ['f5efe3','b7b2a7','878b90','525c64','ffae38'], background: '#080a0d', mode: 4, accent: '#ffae38' },
  '01 · Ember / ochre': { colors: ['F6AA1C','BC3908','941B0C','F6AA1C','220901'], background: '#220901' },
  '02 · Tidal teal': { colors: ['63D1CF','5BC0BE','4BAD9E','4BAD9E','0B132B','000000'], background: '#000000' },
  '03 · Orchid dusk': { colors: ['AA60C8','D69ADE','C9A3C6','CFB5C2','0D001D','120A12'], background: '#120a12' },
  '04 · Honey / petrol': { colors: ['FEF1BE','FFBA00','008189','00474D','061210'], background: '#061210' },
  '05 · Electric fern': { colors: ['D4FFB0','7FFF00','00B894','0A3322','05140A'], background: '#05140a' },
  '06 · Apricot / plum': { colors: ['FFE8CC','FF8C00','C7501A','3D1050','0E0618'], background: '#0e0618' },
  '07 · Ultraviolet': { colors: ['E8E0FF','B38FFF','6A3DE8','1A1250','090612'], background: '#090612' },
  '08 · Cyan / fuchsia': { colors: ['E0FBFF','00F0FF','D40078','1E0A3D','05020F'], background: '#05020f' }
};
const animationPresets = ['Static', 'Spectral current', 'Gentle orbit', 'Diagonal drift',
  'Floating sway', 'Breathing light', 'Chromatic tide', 'Layered parallax'];

const status = document.querySelector('#status');
let renderer, gui;
try {
  let THREE;
  try {
    THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  } catch {
    THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
  }
  let GUI;
  try {
    ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
  } catch {
    ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
  }

  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 1);
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.domElement.setAttribute('role', 'img');
  renderer.domElement.setAttribute('aria-label', 'Slowly flowing spectral light: cyan and violet filaments on the left, amber and gold on the right, crossing a deep black void. Space pauses the animation; F toggles fullscreen.');
  document.body.prepend(renderer.domElement);

  const vertexShader = /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `;

  const fragmentShader = /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform vec2 uResolution, uPan;
    uniform float uZoom, uAngle, uSeed, uHueShift;
    uniform vec3 uPalette[6], uTint, uAccent;
    uniform float uPaletteSize, uPaletteMode, uTintStrength;
    uniform float uTime, uSpeed, uGlowIntensity, uDetailDensity;
    uniform vec4 uTravel;
    uniform float uSaturation, uDistortion, uParallax;

    // Nonrepeating local randomness. Every filament keeps its identity in time.
    float hash(float p) {
      return fract(sin(p * 127.1 + 311.7 + uSeed * 17.13) * 43758.5453123);
    }
    float hash2(vec2 p) {
      vec3 q = fract((vec3(p.xyx) + uSeed * 0.173) * vec3(0.1031, 0.1030, 0.0973));
      q += dot(q, q.yzx + 33.33);
      return fract((q.x + q.y) * q.z);
    }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 s = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash2(i), hash2(i + vec2(1,0)), s.x),
                 mix(hash2(i + vec2(0,1)), hash2(i + vec2(1,1)), s.x), s.y);
    }
    // Each stream has a 256-unit cyclic domain. The coordinate and its lattice
    // wrap together, so movement always continues forward through the seam.
    float trailNoise(float x, float y, float frequency) {
      vec2 p = vec2(x * frequency, y);
      vec2 i = floor(p), f = fract(p);
      vec2 s = f * f * (3.0 - 2.0 * f);
      float period = 256.0 * frequency;
      float a = mod(i.x, period), b = mod(i.x + 1.0, period);
      return mix(mix(hash2(vec2(a, i.y)), hash2(vec2(b, i.y)), s.x),
                 mix(hash2(vec2(a, i.y + 1.0)), hash2(vec2(b, i.y + 1.0)), s.x), s.y);
    }
    float bell(float x, float w) { return exp(-x * x / (w * w)); }

    // Wavelength-like palette: nonlinear stops retain deep blue and hot red,
    // rather than blending the whole field into a desaturated rainbow.
    vec3 spectrum(float h) {
      h += uHueShift;
      if (uPaletteMode > 1.5 && uPaletteMode < 3.5) {
        float accentMask = uPaletteMode > 2.5 ? smoothstep(0.74, 0.87, fract(h * 2.13)) : 0.0;
        return mix(vec3(1.0), uAccent, accentMask);
      }
      if (uPaletteMode > 0.5) {
        float index = fract(h) * (uPaletteSize - 1.0);
        vec3 mapped = uPalette[0];
        for (int i = 0; i < 5; i++) {
          if (index >= float(i)) mapped = mix(uPalette[i], uPalette[i+1], clamp(index - float(i), 0.0, 1.0));
        }
        if (uPaletteMode > 3.5) {
          float neutral = dot(mapped, vec3(0.2126, 0.7152, 0.0722));
          mapped = mix(vec3(max(0.15, neutral)), uAccent, smoothstep(0.75, 0.91, fract(h * 1.71)));
        }
        return mix(mapped, uTint, uTintStrength);
      }
      h = fract(h) * 6.0;
      vec3 a = vec3(0.005, 0.16, 1.0);
      vec3 b = vec3(0.005, 1.0, 1.0);
      vec3 c = vec3(0.42, 1.0, 0.008);
      vec3 d = vec3(1.0, 0.58, 0.003);
      vec3 e = vec3(1.0, 0.018, 0.002);
      vec3 f = vec3(1.0, 0.003, 0.46);
      if (h < 1.0) return mix(a, b, h);
      if (h < 2.0) return mix(b, c, h - 1.0);
      if (h < 3.0) return mix(c, d, h - 2.0);
      if (h < 4.0) return mix(d, e, h - 3.0);
      if (h < 5.0) return mix(e, f, h - 4.0);
      return mix(f, a, h - 5.0);
    }

    float clusters(vec2 p, vec2 screen) {
      float q = p.y;
      float bands = 0.015 + 1.3 * pow(noise(vec2(q * 19.0 + 7.3, p.x * 0.8)), 3.0);
      bands += 0.65 * bell(q + 0.10, 0.048);
      bands += 0.38 * bell(q - 0.22, 0.032);
      bands += 0.48 * bell(q + 0.42, 0.065);
      float left = bell(screen.x + 0.92, 0.58) * bell(screen.y - 0.43, 0.57);
      float right = bell(screen.x - 0.96, 0.59) * bell(screen.y + 0.38, 0.56);
      float voidMask = 1.0 - 0.985 * exp(-pow((screen.x + 0.03) / 0.51, 2.0)
                                                       -pow((screen.y - 0.09) / 0.61, 2.0));
      return (0.018 + 3.9 * left + 4.6 * right) * bands * voidMask;
    }

    vec3 fibers(vec2 p, vec2 screen, float density, float layer, float strength) {
      float drift = layer < 0.5 ? uTravel.x : layer < 1.5 ? uTravel.y : layer < 2.5 ? uTravel.z : uTravel.w;
      float along = p.x - drift;
      p.y += p.x * (layer - 1.5) * 0.004;
      // A common, gentle warp preserves continuity between neighboring cells.
      float warp = uDistortion * 0.10 * sin(p.x * 1.8 + p.y * 4.0 + sin(uTime));
      float row = (p.y + warp) * density;
      float id = floor(row);
      float r = hash(id + layer * 191.7);
      float center = 0.14 + 0.72 * r;
      float distanceToLine = abs(fract(row) - center);
      float aa = max(fwidth(row) * 0.56, 0.035);
      float width = mix(0.018, 0.36, pow(hash(id + layer * 21.1), 6.0));
      float core = (1.0 - smoothstep(width, width + aa, distanceToLine))
                    * min(1.0, (width + 0.075) / aa);
      float sheath = exp(-distanceToLine * distanceToLine / 0.032) * 0.065;

      // Long carriers, short scratches, and tiny interruptions share the same axis.
      float rate = floor(mix(1.5, 15.0, hash(id + 57.0)) * 8.0) / 8.0;
      float carrier = trailNoise(along + r * 71.0, id * 1.71 + layer * 31.0, rate);
      float segment = pow(smoothstep(0.28, 0.88, carrier), 2.5);
      float fine = trailNoise(along + r * 19.0, id * 2.17, 95.0);
      segment *= 0.37 + 0.63 * smoothstep(0.13, 0.72, fine);
      float filamentPower = 0.0003 + 29.0 * pow(smoothstep(0.46, 1.0, hash(id + 7.7)), 5.0);
      float pulseDepth = 0.12 + 0.05 * clamp(uSpeed / 0.035, 0.0, 1.0);
      float pulse = 1.0 - pulseDepth + pulseDepth * sin(along * 3.14159265 + r * 32.0 + uTime * 3.0);

      float warm = smoothstep(-0.25, 0.36, screen.x + 0.12 * trailNoise(along, p.y * 8.0, 1.0));
      float chroma = 0.72 * trailNoise(along, p.y * 17.0 + 13.0, 1.25)
                   + 0.28 * trailNoise(along + r * 17.0, id * 0.037 + layer * 9.0, 2.25);
      float coolHue = mix(0.74, 1.34, chroma) + 0.11 * (r - 0.5);
      coolHue -= 0.14 * bell(p.y - 0.14, 0.09);
      float warmHue = mix(0.30, 0.75, chroma) + 0.15 * (r - 0.5);
      float hue = mix(coolHue, warmHue, warm);
      // Occasional foreign-color refractions in either family.
      hue += smoothstep(0.79, 0.96, trailNoise(along + 11.0, id * 0.091, 6.0)) * (0.24 + r * 0.35);
      vec3 color = spectrum(hue);
      if (uPaletteMode < 0.5) color = mix(color, uTint, uTintStrength);
      float energy = segment * filamentPower * pulse * clusters(p, screen) * strength;
      float glint = pow(smoothstep(0.68, 0.98,
                       trailNoise(along + 7.0, id * 3.1, 31.0)), 9.0);
      // White only at the most intense, very narrow focal points.
      vec3 emission = color * (core + sheath) * energy;
      emission += mix(color, vec3(1.0), 0.58) * core * glint * energy * 2.4;
      return emission;
    }

    void main() {
      vec2 uv = ((gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y - uPan) / uZoom;
      // Physical screen coordinates fix the direction at 32 degrees on all displays.
      vec2 p = vec2(dot(uv, vec2(cos(uAngle), -sin(uAngle))),
                    dot(uv, vec2(sin(uAngle),  cos(uAngle))));
      vec2 screen = vec2(uv.x * 1.77778 * uResolution.y / uResolution.x, uv.y);
      float density = max(0.25, uDetailDensity);
      vec3 light = fibers(p + vec2(8.1, 0.13), screen, 1660.0 * density, 0.0, 0.09);
      light += fibers(p, screen, 1030.0 * density, 1.0, 1.00);
      light += fibers(p + vec2(5.2, 0.37), screen, 690.0 * density, 2.0, 0.94);
      light += fibers(p + vec2(1.7, 0.63), screen, 370.0 * density, 3.0, 0.82);
      float focal = 2.4 * bell(screen.x + 0.80, 0.26) * bell(screen.y - 0.40, 0.24);
      focal += 2.8 * bell(screen.x - 0.83, 0.28) * bell(screen.y + 0.26, 0.32);
      light *= 1.0 + focal;
      float luma = dot(light, vec3(0.2126, 0.7152, 0.0722));
      light = max(vec3(0.0), mix(vec3(luma), light, uSaturation));
      gl_FragColor = vec4(light * (0.83 + 0.17 * uGlowIntensity), 1.0);
    }
  `;

  const blurShader = /* glsl */`
    varying vec2 vUv;
    uniform sampler2D uSource;
    uniform vec2 uStep;
    uniform bool uThreshold;
    vec3 sampleLight(vec2 uv) {
      vec3 c = texture2D(uSource, uv).rgb;
      if (uThreshold) {
        float b = max(c.r, max(c.g, c.b));
        c *= smoothstep(0.6, 1.7, b);
      }
      return c;
    }
    void main() {
      vec3 c = sampleLight(vUv) * 0.227027;
      c += sampleLight(vUv + uStep * 1.384615) * 0.316216;
      c += sampleLight(vUv - uStep * 1.384615) * 0.316216;
      c += sampleLight(vUv + uStep * 3.230769) * 0.070270;
      c += sampleLight(vUv - uStep * 3.230769) * 0.070270;
      gl_FragColor = vec4(c, 1.0);
    }
  `;
  const compositeShader = /* glsl */`
    varying vec2 vUv;
    uniform sampler2D uScene, uBloom;
    uniform float uGlowIntensity, uExposure;
    uniform vec3 uBackground, uAccent;
    uniform bool uGreenscreen, uInvert;
    uniform float uPaletteMode;
    void main() {
      vec3 light = texture2D(uScene, vUv).rgb;
      light += texture2D(uBloom, vUv).rgb * 0.58 * uGlowIntensity;
      light *= uExposure;
      // Hue-preserving highlight compression, then the display's sRGB transfer.
      float peak = max(light.r, max(light.g, light.b));
      light /= 1.0 + peak * 0.28;
      light = mix(light, vec3(1.0), smoothstep(2.4, 13.0, peak) * 0.38);
      light = clamp(light, 0.0, 1.0);
      float coverage = smoothstep(uGreenscreen ? 0.018 : 0.0, uGreenscreen ? 0.32 : 0.82, max(light.r, max(light.g, light.b)));
      vec3 ink = light;
      if (uInvert && uPaletteMode > 1.5 && uPaletteMode < 3.5) {
        float accentMask = uPaletteMode > 2.5 ? smoothstep(0.05, 0.55, max(light.r, max(light.g, light.b)) - min(light.r, min(light.g, light.b))) : 0.0;
        ink = mix(vec3(0.0), uAccent, accentMask);
      }
      vec3 background = uGreenscreen ? vec3(0.0, 1.0, 0.0) : uBackground;
      gl_FragColor = vec4(mix(background, ink, coverage), 1.0);
      #include <colorspace_fragment>
    }
  `;

  const uniforms = {
    uResolution: { value: new THREE.Vector2() }, uTime: { value: 0 }, uTravel: { value: new THREE.Vector4() },
    uSpeed: { value: config.speed }, uGlowIntensity: { value: config.glowIntensity },
    uDetailDensity: { value: config.streakDensity }, uSaturation: { value: config.colorSaturation },
    uDistortion: { value: config.distortionStrength }, uParallax: { value: config.parallaxStrength },
    uPan: { value: new THREE.Vector2() }, uZoom: { value: 1 }, uAngle: { value: Math.PI * 32 / 180 },
    uSeed: { value: 0 }, uHueShift: { value: 0 },
    uPalette: { value: Array.from({ length: 6 }, () => new THREE.Color()) },
    uPaletteSize: { value: 6 }, uPaletteMode: { value: 0 },
    uTint: { value: new THREE.Color('#ffffff') }, uTintStrength: { value: 0 }, uAccent: { value: new THREE.Color('#ff3030') }
  };
  const materialOptions = { vertexShader, depthTest: false, depthWrite: false, toneMapped: false };
  const fieldMaterial = new THREE.ShaderMaterial({ ...materialOptions, fragmentShader, uniforms });
  const blurMaterial = new THREE.ShaderMaterial({
    ...materialOptions, fragmentShader: blurShader,
    uniforms: { uSource: { value: null }, uStep: { value: new THREE.Vector2() }, uThreshold: { value: true } }
  });
  const outputMaterial = new THREE.ShaderMaterial({
    ...materialOptions, fragmentShader: compositeShader,
    uniforms: { uScene: { value: null }, uBloom: { value: null },
      uGlowIntensity: { value: config.glowIntensity }, uExposure: { value: config.exposure },
      uBackground: { value: new THREE.Color('#000000') }, uGreenscreen: { value: false },
      uInvert: { value: false }, uPaletteMode: uniforms.uPaletteMode, uAccent: uniforms.uAccent }
  });
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const geometry = new THREE.BufferGeometry();
  // One oversized triangle: no diagonal seam or redundant fragment work.
  geometry.setAttribute('position', new THREE.Float32BufferAttribute([-1,-1,0, 3,-1,0, -1,3,0], 3));
  const triangle = new THREE.Mesh(geometry, fieldMaterial);
  triangle.frustumCulled = false;
  scene.add(triangle);

  const hdr = renderer.extensions.has('EXT_color_buffer_float');
  const targetOptions = { type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false };
  const field = new THREE.WebGLRenderTarget(1, 1, targetOptions);
  const bloomA = new THREE.WebGLRenderTarget(1, 1, targetOptions);
  const bloomB = new THREE.WebGLRenderTarget(1, 1, targetOptions);
  outputMaterial.uniforms.uScene.value = field.texture;
  outputMaterial.uniforms.uBloom.value = bloomB.texture;

  const drawingSize = new THREE.Vector2();
  let resizePending = true;
  function resize() {
    const ratio = THREE.MathUtils.clamp(config.maxPixelRatio, 0.5, 3);
    renderer.setPixelRatio(ratio);
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.getDrawingBufferSize(drawingSize);
    uniforms.uResolution.value.copy(drawingSize);
    field.setSize(drawingSize.x, drawingSize.y);
    bloomA.setSize(drawingSize.x, drawingSize.y);
    bloomB.setSize(bloomA.width, bloomA.height);
    resizePending = false;
  }
  function draw() {
    if (resizePending) resize();
    uniforms.uSpeed.value = config.speed;
    uniforms.uGlowIntensity.value = config.glowIntensity;
    uniforms.uDetailDensity.value = config.streakDensity;
    uniforms.uSaturation.value = config.colorSaturation;
    uniforms.uDistortion.value = config.distortionStrength;
    uniforms.uParallax.value = config.parallaxStrength;
    uniforms.uSeed.value = config.seed;
    uniforms.uZoom.value = config.zoom;
    uniforms.uPan.value.set(config.panX + motion.x, config.panY + motion.y);
    uniforms.uAngle.value = THREE.MathUtils.degToRad(config.angle) + motion.angle;
    uniforms.uHueShift.value = motion.hue;
    uniforms.uTint.value.set(config.lightColor);
    uniforms.uTintStrength.value = config.colorMix;
    uniforms.uAccent.value.set(config.accent);
    const palette = schemes[config.scheme];
    uniforms.uPaletteMode.value = palette.mode ?? 1;
    uniforms.uPaletteSize.value = palette.colors.length;
    for (let i = 0; i < 6; i++) uniforms.uPalette.value[i].set('#' + palette.colors[Math.min(i, palette.colors.length - 1)]);
    triangle.material = fieldMaterial;
    renderer.setRenderTarget(field);
    renderer.render(scene, camera);
    triangle.material = blurMaterial;
    blurMaterial.uniforms.uSource.value = field.texture;
    blurMaterial.uniforms.uThreshold.value = true;
    blurMaterial.uniforms.uStep.value.set(1 / bloomA.width, 0);
    renderer.setRenderTarget(bloomA);
    renderer.render(scene, camera);
    blurMaterial.uniforms.uSource.value = bloomA.texture;
    blurMaterial.uniforms.uThreshold.value = false;
    blurMaterial.uniforms.uStep.value.set(0, 1 / bloomA.height);
    renderer.setRenderTarget(bloomB);
    renderer.render(scene, camera);
    triangle.material = outputMaterial;
    outputMaterial.uniforms.uGlowIntensity.value = config.glowIntensity;
    outputMaterial.uniforms.uExposure.value = config.exposure * motion.brightness;
    outputMaterial.uniforms.uBackground.value.set(config.background);
    outputMaterial.uniforms.uGreenscreen.value = config.greenscreen;
    outputMaterial.uniforms.uInvert.value = config.invert;
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  config.animationEnabled = !reducedMotion.matches;
  config.maxPixelRatio = Math.min(devicePixelRatio || 1, 1.75);
  const motion = { x: 0, y: 0, angle: 0, hue: 0, brightness: 1 };
  let motionPhase = 0, uiVisible = true;
  let lastTime = null, phase = 0, frameId = 0, contextLost = false, disposed = false;
  function updateMotion() {
    const t = motionPhase, a = config.motionAmount;
    motion.x = motion.y = motion.angle = motion.hue = 0;
    motion.brightness = 1;
    // These are offsets around the user's view. Zoom, pan, and angle are never
    // overwritten by an animation, including while orbiting.
    switch (config.animation) {
      case 'Gentle orbit':
        motion.x = Math.cos(t) * 0.045 * a;
        motion.y = Math.sin(t) * 0.028 * a;
        motion.angle = Math.sin(t) * 0.075 * a;
        break;
      case 'Diagonal drift':
        motion.x = Math.sin(t) * 0.095 * a;
        motion.y = -Math.sin(t) * 0.059 * a;
        break;
      case 'Floating sway':
        motion.x = Math.sin(t) * 0.045 * a;
        motion.y = Math.sin(t * 2) * 0.025 * a;
        motion.angle = Math.sin(t) * 0.025 * a;
        break;
      case 'Breathing light':
        motion.brightness = 1 + Math.sin(t * 2) * 0.2 * a;
        break;
      case 'Chromatic tide':
        motion.hue = Math.sin(t) * 0.075 * a;
        break;
      case 'Layered parallax':
        motion.x = Math.sin(t) * 0.025 * a;
        motion.y = Math.cos(t * 2) * 0.012 * a;
        break;
    }
  }
  function tick(now) {
    frameId = 0;
    if (disposed || document.hidden || contextLost) { lastTime = null; return; }
    if (lastTime !== null && config.animationEnabled && config.animation !== 'Static') {
      const delta = Math.min((now - lastTime) / 1000, 0.05) * config.animationSpeed;
      phase = (phase + delta * Math.PI * 2 / 61) % (Math.PI * 2);
      motionPhase = (motionPhase + delta * Math.PI * 2 / 85) % (Math.PI * 2);
      for (let layer = 0; layer < 4; layer++) {
        const travel = uniforms.uTravel.value;
        const parallax = config.parallaxStrength * (config.animation === 'Layered parallax' ? 2.5 : 1);
        travel.setComponent(layer, (travel.getComponent(layer) + delta * config.speed * (0.40 + layer * parallax)) % 256);
      }
    }
    lastTime = now;
    uniforms.uTime.value = phase;
    updateMotion();
    draw();
    if (config.animationEnabled && config.animation !== 'Static' && config.animationSpeed > 0) frameId = requestAnimationFrame(tick);
  }
  function wake() { if (!frameId && !disposed && !document.hidden && !contextLost) frameId = requestAnimationFrame(tick); }
  function onResize() { resizePending = true; wake(); }
  function onVisibility() { lastTime = null; if (!document.hidden) wake(); }
  function onMotion(event) { config.animationEnabled = !event.matches; lastTime = null; refreshUI(); wake(); }
  function onKey(event) {
    if (event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.target instanceof HTMLElement && (event.target.matches('input, select, textarea') || event.target.isContentEditable)) return;
    if (event.code === 'KeyH') { uiVisible = !uiVisible; gui.show(uiVisible); }
    if (event.code === 'Space') {
      event.preventDefault();
      config.animationEnabled = !config.animationEnabled;
      lastTime = null;
      refreshUI();
      wake();
    }
    if (event.code === 'KeyF') {
      const action = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
      action?.catch(() => {});
    }
  }

  function refreshUI() { gui?.controllersRecursive().forEach(controller => controller.updateDisplay()); }
  function applyScheme() {
    const palette = schemes[config.scheme];
    config.background = config.invert && (palette.mode === 2 || palette.mode === 3) ? '#ffffff' : palette.background;
    if (palette.accent) config.accent = palette.accent;
    else if (palette.mode === 3) config.accent = '#ff3030';
    config.colorMix = 0;
    refreshUI(); wake();
  }
  function randomize() {
    const random = (low, high) => low + Math.random() * (high - low);
    const names = Object.keys(schemes);
    // Retain the user's framing and green-screen override across theme changes.
    config.scheme = names[Math.floor(Math.random() * names.length)];
    config.seed = Math.floor(random(1, 9999));
    config.streakDensity = random(0.55, 1.5);
    config.distortionStrength = random(0.005, 0.065);
    config.parallaxStrength = random(0.06, 0.3);
    config.glowIntensity = random(0.75, 1.65);
    config.angle = random(24, 43);
    config.exposure = random(0.9, 1.5);
    config.animation = animationPresets[1 + Math.floor(Math.random() * 7)];
    config.animationSpeed = random(0.4, 1.25);
    config.motionAmount = random(0.4, 1.2);
    applyScheme();
  }

  gui = new GUI({ title: 'Spectral Current', width: 300 });
  gui.onChange(() => { lastTime = null; wake(); });
  const appearance = gui.addFolder('Color & background');
  appearance.add(config, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
  appearance.add(config, 'invert').name('Invert achromatic').onChange(applyScheme);
  appearance.addColor(config, 'lightColor').name('Light color').onChange(() => { if (config.colorMix === 0) config.colorMix = 0.8; refreshUI(); });
  appearance.add(config, 'colorMix', 0, 1, 0.01).name('Color mix');
  appearance.addColor(config, 'accent').name('Accent color');
  appearance.addColor(config, 'background').name('Background');
  appearance.add(config, 'greenscreen').name('Green screen');
  const animationUI = gui.addFolder('Animation');
  animationUI.add(config, 'animation', animationPresets).name('Preset').onChange(() => {
    if (config.animation === 'Static') { motion.x = motion.y = motion.angle = motion.hue = 0; motion.brightness = 1; }
    updateMotion();
  });
  animationUI.add(config, 'animationEnabled').name('Animate');
  animationUI.add(config, 'animationSpeed', 0, 3, 0.01).name('Speed');
  animationUI.add(config, 'motionAmount', 0, 2, 0.01).name('Motion amount');
  const viewUI = gui.addFolder('View');
  viewUI.add(config, 'zoom', 0.2, 8, 0.01).name('Zoom');
  viewUI.add(config, 'angle', -180, 180, 0.1).name('Camera angle');
  viewUI.add(config, 'panX', -3, 3, 0.001).name('Horizontal');
  viewUI.add(config, 'panY', -3, 3, 0.001).name('Vertical');
  viewUI.add({ resetView() { config.zoom = 1; config.panX = config.panY = 0; config.angle = 32; refreshUI(); wake(); } }, 'resetView').name('Reset view');
  const detailUI = gui.addFolder('Light & detail');
  detailUI.add(config, 'streakDensity', 0.25, 2, 0.01).name('Density');
  detailUI.add(config, 'glowIntensity', 0, 3, 0.01).name('Glow');
  detailUI.add(config, 'exposure', 0.2, 2.5, 0.01).name('Exposure');
  detailUI.add(config, 'colorSaturation', 0, 2, 0.01).name('Saturation');
  detailUI.add(config, 'distortionStrength', 0, 0.12, 0.001).name('Curvature');
  detailUI.add(config, 'parallaxStrength', 0, 0.5, 0.01).name('Layer depth');
  detailUI.close();
  const outputUI = gui.addFolder('Rendering & variation');
  outputUI.add(config, 'maxPixelRatio', 0.5, 3, 0.05).name('Pixel ratio (DPR)').onChange(onResize);
  outputUI.add(config, 'seed', 0, 9999, 1).name('Seed');
  outputUI.add(config, 'randomizeOnClick').name('Randomize on click');
  outputUI.add({ randomize }, 'randomize').name('New variation');
  animationUI.close(); viewUI.close(); outputUI.close();

  const canvas = renderer.domElement;
  const pointers = new Map();
  let drag = null, pinch = null;
  function pointerDistance() {
    const points = [...pointers.values()];
    return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
  }
  function changeZoom(next, clientX, clientY) {
    const old = config.zoom;
    next = THREE.MathUtils.clamp(next, 0.2, 8);
    const x = (clientX - innerWidth / 2) / innerHeight;
    const y = (innerHeight / 2 - clientY) / innerHeight;
    config.panX = x - (x - config.panX - motion.x) * next / old - motion.x;
    config.panY = y - (y - config.panY - motion.y) * next / old - motion.y;
    config.zoom = next;
    refreshUI(); wake();
  }
  function onWheel(event) {
    event.preventDefault();
    const units = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
    changeZoom(config.zoom * Math.exp(-THREE.MathUtils.clamp(event.deltaY * units, -250, 250) * 0.0012), event.clientX, event.clientY);
  }
  function onPointerDown(event) {
    if (event.button !== 0) return;
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 1) drag = { id: event.pointerId, x: event.clientX, y: event.clientY, startX: event.clientX, startY: event.clientY, moved: false };
    if (pointers.size > 1) { if (drag) drag.moved = true; pinch = { distance: pointerDistance(), zoom: config.zoom }; }
    canvas.classList.add('dragging');
  }
  function onPointerMove(event) {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size > 1 && pinch) {
      const points = [...pointers.values()];
      changeZoom(pinch.zoom * pointerDistance() / Math.max(1, pinch.distance), (points[0].x + points[1].x) / 2, (points[0].y + points[1].y) / 2);
      return;
    }
    if (!drag || drag.id !== event.pointerId) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) > 4) drag.moved = true;
    if (event.shiftKey) config.angle = ((config.angle + dx * 0.16 + 180) % 360 + 360) % 360 - 180;
    else { config.panX += dx / innerHeight; config.panY -= dy / innerHeight; }
    drag.x = event.clientX; drag.y = event.clientY;
    refreshUI(); wake();
  }
  function onPointerUp(event) {
    const clicked = event.type === 'pointerup' && drag && drag.id === event.pointerId && !drag.moved && pointers.size === 1;
    pointers.delete(event.pointerId);
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) { drag = null; canvas.classList.remove('dragging'); }
    else {
      const [id, point] = pointers.entries().next().value;
      drag = { id, x: point.x, y: point.y, startX: point.x, startY: point.y, moved: true };
    }
    if (clicked && config.randomizeOnClick) randomize();
  }
  canvas.addEventListener('wheel', onWheel, { passive: false });
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  renderer.domElement.addEventListener('webglcontextlost', event => {
    event.preventDefault(); contextLost = true; lastTime = null;
    cancelAnimationFrame(frameId); frameId = 0;
    status.textContent = 'Waiting for the graphics context to return…'; status.hidden = false;
  });
  renderer.domElement.addEventListener('webglcontextrestored', () => {
    contextLost = false; resizePending = true; status.hidden = true; wake();
  });
  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('keydown', onKey);
  reducedMotion.addEventListener('change', onMotion);

  draw();
  status.hidden = true;
  wake();
  // Small public API for embedding / adjusting the centralized configuration.
  window.spectralCurrent = {
    config,
    gui, schemes, animationPresets, randomize,
    render: wake,
    pause() { config.animationEnabled = false; lastTime = null; refreshUI(); wake(); },
    resume() { config.animationEnabled = true; lastTime = null; refreshUI(); wake(); },
    dispose() {
      disposed = true; cancelAnimationFrame(frameId);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('keydown', onKey);
      document.removeEventListener('visibilitychange', onVisibility);
      reducedMotion.removeEventListener('change', onMotion);
      canvas.removeEventListener('wheel', onWheel);
      canvas.removeEventListener('pointerdown', onPointerDown);
      canvas.removeEventListener('pointermove', onPointerMove);
      canvas.removeEventListener('pointerup', onPointerUp);
      canvas.removeEventListener('pointercancel', onPointerUp);
      gui.destroy();
      for (const resource of [geometry, fieldMaterial, blurMaterial, outputMaterial, field, bloomA, bloomB]) resource.dispose();
      renderer.dispose(); renderer.domElement.remove();
      delete window.spectralCurrent;
    }
  };
} catch (error) {
  console.error('Spectral Current:', error);
  renderer?.dispose();
  gui?.destroy();
  status.hidden = false;
  status.textContent = 'Spectral Current needs WebGL 2 and an internet connection to load Three.js. Please enable hardware acceleration and reload.';
}
</script>
</body>
</html>
