    // ============================================================
    // Walker Class (Preserving Original Algorithm & Math)
    // ============================================================
    class Walker {
      constructor(x, y, step, customColors) {
        this.x = x;
        this.y = y;
        this.step = step;
        this.size = this.step / random(1, 3);
        this.color1 = generateColor(settings.colorJitter, customColors);
        this.color2 = generateColor(settings.colorJitter, customColors);
        this.rad = this.step / 3;
        this.w = random(0, 100);
        this.shape = random(["line", "point"]);
      }

      draw(pg) {
        let ranAng1 = random(0, 2 * PI);
        let ranAng2 = random(0, 2 * PI);

        let oldX = this.x;
        let oldY = this.y;

        this.x += this.step * random([-1, 0, 1]);
        this.y += this.step * random([-1, 0, 1]);

        pg.strokeWeight(this.w);
        pg.stroke(this.color2);

        this.w *= 0.95;
        this.rad *= 0.95;

        if (this.shape === "line") {
          pg.line(oldX, oldY, this.x, this.y);
          if (this.w > 10) {
            pg.strokeWeight(this.w / 2);
            pg.stroke(this.color1);
            pg.line(oldX, oldY, this.x, this.y);
          }
        } else {
          pg.fill(this.color2);
          pg.circle(this.x, this.y, this.rad);
          pg.fill(this.color1);
          pg.circle(this.x, this.y, this.rad / 2);
        }
      }
    }

    // Preserving generateColor with Gaussian jitter on HSB
    function generateColor(scale = 1.0, customPalette = null) {
      let scheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      let pal = customPalette || scheme.colors;
      let hex = pal[floor(random(0, pal.length))];
      let temp = color(hex);

      let h = (hue(temp) + randomGaussian() * scale * 5.0 + 360) % 360;
      let s = constrain(saturation(temp) + randomGaussian() * scale * 3.0, 0, 100);
      let b = constrain(brightness(temp) + randomGaussian() * scale * 3.0, 0, 100);

      return color(h, s, b, 100);
    }

    // Preserving addBlur helper
    function addBlur(glow = 2, col = 'black') {
      drawingContext.shadowOffsetX = -2;
      drawingContext.shadowOffsetY = -2;
      drawingContext.shadowBlur = glow;
      drawingContext.shadowColor = col;
    }

    // ============================================================
    // Specimen Tile Class
    // ============================================================
    class SpecimenTile {
      constructor(colIdx, rowIdx, x, y, size) {
        this.colIdx = colIdx;
        this.rowIdx = rowIdx;
        this.x = x;
        this.y = y;
        this.size = size;
        this.bufferSize = 250;
        this.pg = createGraphics(this.bufferSize, this.bufferSize);
        this.pg.colorMode(HSB, 360, 100, 100, 100);
        this.pg.ellipseMode(CENTER);
        this.pg.imageMode(CENTER);
        this.pg.rectMode(CENTER);

        this.walkers = [];
        this.currentStep = 0;
        this.hoverFactor = 0;
        this.seed = floor(random(1, 1000000));
        this.phaseOffset = random(0, TWO_PI);

        this.initWalkers();
      }

      initWalkers() {
        this.walkers = [];
        this.pg.clear();
        this.currentStep = 0;

        let scheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
        let pal = settings.invertColors ? [...scheme.colors].reverse() : scheme.colors;

        let bW = this.bufferSize;
        let bH = this.bufferSize;

        // Walkers with step size 25
        let step1 = bW * 0.2;
        for (let xx = 0; xx <= bW; xx += step1) {
          for (let yy = 0; yy <= bH; yy += step1) {
            for (let i = 0; i < settings.nWalkers; i++) {
              if (random(0, 1) > 0.72) {
                this.walkers.push(new Walker(xx, yy, 25, pal));
              }
            }
          }
        }

        // Walkers with varied step sizes 50, 100, 200
        let step2 = bW * 0.1;
        for (let xx = 0; xx <= bW; xx += step2) {
          for (let yy = 0; yy <= bH; yy += step2) {
            for (let i = 0; i < settings.nWalkers; i++) {
              if (random(0, 1) > 0.75) {
                this.walkers.push(new Walker(xx, yy, random([50, 100, 200]), pal));
              }
            }
          }
        }

        // If not in Live Organic Growth, bake all steps immediately for peak 60fps performance
        if (settings.animMode !== 'Live Organic Growth') {
          for (let iter = 0; iter < settings.maxSteps; iter++) {
            for (let i = 0; i < this.walkers.length; i++) {
              this.walkers[i].draw(this.pg);
            }
          }
          this.currentStep = settings.maxSteps;
        }
      }

      stepLiveWalkers(stepsCount = 1) {
        if (this.currentStep >= settings.maxSteps) {
          // Soft cyclic regrowth
          if (random() < 0.004) {
            this.initWalkers();
          }
          return;
        }

        for (let s = 0; s < stepsCount; s++) {
          if (this.currentStep >= settings.maxSteps) break;
          for (let i = 0; i < this.walkers.length; i++) {
            this.walkers[i].draw(this.pg);
          }
          this.currentStep++;
        }
      }

      destroy() {
        if (this.pg) {
          this.pg.remove();
        }
      }
    }

    // ============================================================
    // Setup & Initialization
    // ============================================================
    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

      colorMode(HSB, 360, 100, 100, 100);
      ellipseMode(CENTER);
      imageMode(CENTER);
      rectMode(CENTER);

      initGUI();
      regenerateGrid();
    }

    // ============================================================
    // Responsive Grid Generation
    // ============================================================
    function regenerateGrid() {
      // Clean up previous buffers
      for (let tile of gridTiles) {
        tile.destroy();
      }
      gridTiles = [];

      let mySize = settings.tileSize;
      let spacing = mySize * settings.gridSpacing;

      let cols = Math.ceil(width / spacing) + 4;
      let rows = Math.ceil(height / spacing) + 4;

      let totalW = (cols - 1) * spacing;
      let totalH = (rows - 1) * spacing;
      let originX = (width - totalW) / 2;
      let originY = (height - totalH) / 2;

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          let xx = originX + c * spacing;
          let yy = originY + r * spacing;
          let tile = new SpecimenTile(c, r, xx, yy, mySize);
          gridTiles.push(tile);
        }
      }
    }

    // ============================================================
    // Main 60 FPS Render Loop
    // ============================================================
    function draw() {
      let scheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      let isDark = settings.darkTheme;
      let bgColor = isDark ? scheme.bgDark : scheme.bgLight;
      let tileBgColor = isDark ? scheme.tileBgDark : scheme.tileBgLight;
      let frameColor = isDark ? scheme.frameDark : scheme.frameLight;
      let shadowColor = isDark ? scheme.shadowDark : scheme.shadowLight;

      if (settings.invertColors) {
        let temp = bgColor;
        bgColor = tileBgColor;
        tileBgColor = temp;
      }

      background(bgColor);

      push();
      // Apply Camera Pan & Mouse Wheel Zoom
      translate(panX, panY);
      scale(settings.zoom);

      let t = settings.isPlaying ? (millis() * 0.001 * settings.animSpeed) : 0;
      let mouseWorldX = (mouseX - panX) / settings.zoom;
      let mouseWorldY = (mouseY - panY) / settings.zoom;

      let mySize = settings.tileSize;
      let spacing = mySize * settings.gridSpacing;

      // Viewport Frustum Culling bounds
      let viewMinX = -panX / settings.zoom - spacing * 1.5;
      let viewMaxX = (width - panX) / settings.zoom + spacing * 1.5;
      let viewMinY = -panY / settings.zoom - spacing * 1.5;
      let viewMaxY = (height - panY) / settings.zoom + spacing * 1.5;

      let liveSteps = Math.max(1, Math.round(settings.animSpeed * 2));

      for (let i = 0; i < gridTiles.length; i++) {
        let tile = gridTiles[i];

        // Frustum Culling
        if (tile.x < viewMinX || tile.x > viewMaxX || tile.y < viewMinY || tile.y > viewMaxY) {
          continue;
        }

        // Live Growth Mode update
        if (settings.animMode === 'Live Organic Growth' && settings.isPlaying) {
          tile.stepLiveWalkers(liveSteps);
        }

        // Interactive Mouse Proximity Hover
        let dM = dist(tile.x, tile.y, mouseWorldX, mouseWorldY);
        let targetHover = (settings.mouseInfluence && dM < mySize * 1.6) ? (1.0 - dM / (mySize * 1.6)) : 0;
        tile.hoverFactor = lerp(tile.hoverFactor, targetHover, 0.15);

        // Wave Modulation Dynamics based on chosen mode
        let wave = 0;
        let cx = width / 2;
        let cy = height / 2;
        let dCenter = dist(tile.x, tile.y, cx, cy);

        if (settings.animMode === 'Kinetic Harmonic Waves') {
          wave = sin(dCenter * settings.waveFrequency - t * 3.2);
        } else if (settings.animMode === 'Diagonal Cascade') {
          wave = sin((tile.x + tile.y) * settings.waveFrequency * 0.7 - t * 3.5);
        } else if (settings.animMode === 'Spiral Vortex') {
          let angle = atan2(tile.y - cy, tile.x - cx);
          wave = sin(dCenter * settings.waveFrequency + angle * 3.0 - t * 3.0);
        } else if (settings.animMode === 'Perlin Liquid Drift') {
          wave = (noise(tile.x * 0.004, tile.y * 0.004, t * 0.6) - 0.5) * 2.2;
        } else if (settings.animMode === 'Heartbeat Pulse') {
          let beat = sin(t * 3.0) + 0.45 * sin(t * 6.0);
          wave = beat * cos(dCenter * settings.waveFrequency * 0.4);
        } else if (settings.animMode === 'Live Organic Growth') {
          wave = sin(dCenter * settings.waveFrequency * 0.8 - t * 2.0) * 0.6;
        } else if (settings.animMode === 'Static Gallery Print') {
          wave = 0;
        }

        let scaleAnim = 1.0 + wave * settings.pulseScale + tile.hoverFactor * 0.14;
        let rotAnim = radians(wave * settings.tileRotation + tile.hoverFactor * 2.0);
        let zElev = wave * settings.floatIntensity + tile.hoverFactor * 8.0;

        push();
        translate(tile.x, tile.y + zElev);
        rotate(rotAnim);
        scale(scaleAnim);

        let frameDim = tile.size * 1.35;

        // Dynamic 2.5D Elevation Shadow
        if (settings.shadowGlow > 0) {
          drawingContext.shadowOffsetX = -2 + wave * -2;
          drawingContext.shadowOffsetY = 2 + wave * 3 + tile.hoverFactor * 4;
          drawingContext.shadowBlur = settings.shadowGlow + (wave + 1) * 3 + tile.hoverFactor * 12;
          drawingContext.shadowColor = shadowColor;
        } else {
          drawingContext.shadowColor = 'transparent';
        }

        // Draw Tile Background Plate
        fill(tileBgColor);
        noStroke();
        rect(0, 0, frameDim, frameDim, settings.cornerRadius);

        // Draw Offscreen Walker Artwork Buffer
        push();
        scale(frameDim / tile.bufferSize);
        image(tile.pg, 0, 0);
        pop();

        // Draw Specimen Frame with selected styling
        drawingContext.shadowColor = 'transparent'; // Crisp stroke outline
        stroke(frameColor);
        strokeWeight(settings.borderWeight);
        noFill();

        if (settings.frameStyle === 'Gallery Specimen') {
          rect(0, 0, frameDim, frameDim, settings.cornerRadius);
        } else if (settings.frameStyle === 'Corner Brackets') {
          drawCornerBrackets(frameDim, 14);
        } else if (settings.frameStyle === 'Double Border') {
          rect(0, 0, frameDim, frameDim, settings.cornerRadius);
          rect(0, 0, frameDim * 0.9, frameDim * 0.9, Math.max(0, settings.cornerRadius - 2));
        } else if (settings.frameStyle === 'Minimal Ghost') {
          strokeWeight(1);
          rect(0, 0, frameDim, frameDim, settings.cornerRadius);
        }

        pop();
      }

      pop();
    }

    // Helper: Draw Technical / Sci-Fi Corner Brackets
    function drawCornerBrackets(s, bLen = 14) {
      let hs = s / 2;
      // Top-Left
      line(-hs, -hs, -hs + bLen, -hs);
      line(-hs, -hs, -hs, -hs + bLen);
      // Top-Right
      line(hs, -hs, hs - bLen, -hs);
      line(hs, -hs, hs, -hs + bLen);
      // Bottom-Left
      line(-hs, hs, -hs + bLen, hs);
      line(-hs, hs, -hs, hs - bLen);
      // Bottom-Right
      line(hs, hs, hs - bLen, hs);
      line(hs, hs, hs, hs - bLen);
    }

    // ============================================================
    // Procedural Theme & Parameter Randomizer (Rule 6)
    // ============================================================
    function randomizeAll(updateGui = true) {
      // 1. Pick a random color scheme from all 19 curated schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = random(schemeKeys);

      // 2. Randomize theme mode and inversion
      settings.darkTheme = random() > 0.25;
      settings.invertColors = random() > 0.7;
      settings.colorJitter = round(random(0.5, 2.2), 2);

      // 3. Randomize animation dynamics
      const animModes = [
        'Kinetic Harmonic Waves',
        'Diagonal Cascade',
        'Spiral Vortex',
        'Perlin Liquid Drift',
        'Heartbeat Pulse',
        'Live Organic Growth'
      ];
      settings.animMode = random(animModes);
      settings.animSpeed = round(random(0.7, 1.8), 2);
      settings.waveFrequency = round(random(0.05, 0.14), 3);
      settings.pulseScale = round(random(0.08, 0.22), 2);
      settings.tileRotation = random() > 0.4 ? round(random(2.0, 12.0), 1) : 0;
      settings.floatIntensity = round(random(3.0, 12.0), 1);

      // 4. Randomize geometric resolution
      settings.tileSize = floor(random(90, 140));
      settings.gridSpacing = round(random(1.35, 1.65), 2);
      settings.frameStyle = random(['Gallery Specimen', 'Corner Brackets', 'Double Border', 'Minimal Ghost']);
      settings.cornerRadius = random([0, 4, 8, 12, 16]);
      settings.borderWeight = random([1, 2, 3]);
      settings.shadowGlow = floor(random(4, 16));
      settings.nWalkers = random([2, 3]);

      // 5. Re-generate the entire specimen grid
      regenerateGrid();

      // 6. Synchronize lil-gui controls
      if (updateGui && gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetCamera() {
      panX = 0;
      panY = 0;
      settings.zoom = 1.0;
      if (zoomController) zoomController.updateDisplay();
    }

    function exportImage() {
      saveCanvas('specimen_matrix_608_' + Date.now(), 'png');
    }

    // ============================================================
    // Viewport Resize & Window Event Handling
    // ============================================================
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      regenerateGrid();
    }

    // ============================================================
    // Mouse Drag, Pan, Zoom & Click-to-Randomize Interaction
    // ============================================================
    function mouseWheel(event) {
      if (!event) return;
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      let zoomFactor = event.deltaY < 0 ? 1.08 : 0.92;
      let oldZoom = settings.zoom;
      let newZoom = constrain(oldZoom * zoomFactor, 0.2, 8.0);

      // Smooth zoom centered towards mouse cursor
      let mouseWorldX = (mouseX - panX) / oldZoom;
      let mouseWorldY = (mouseY - panY) / oldZoom;

      panX = mouseX - mouseWorldX * newZoom;
      panY = mouseY - mouseWorldY * newZoom;
      settings.zoom = newZoom;

      if (zoomController) zoomController.updateDisplay();
      return false; // Prevent page scroll
    }

    function mousePressed(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      isDragging = true;
      hasDragged = false;
      dragStartX = mouseX;
      dragStartY = mouseY;
      startPanX = panX;
      startPanY = panY;
    }

    function mouseDragged(event) {
      if (!isDragging) return;
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      let dx = mouseX - dragStartX;
      let dy = mouseY - dragStartY;
      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
        document.body.style.cursor = 'grabbing';
      }
      panX = startPanX + dx;
      panY = startPanY + dy;
    }

    function mouseReleased(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        isDragging = false;
        return;
      }
      document.body.style.cursor = 'grab';
      // If user clicked without dragging, trigger randomization (Rule 6)
      if (isDragging && !hasDragged) {
        if (settings.clickToRandomize) {
          randomizeAll(true);
        } else {
          regenerateGrid();
        }
      }
      isDragging = false;
    }

    // Touch support for tablets & mobile
    function touchStarted(event) {
      if (touches && touches.length === 1) {
        mousePressed(event);
      }
      return true;
    }

    function touchMoved(event) {
      if (touches && touches.length === 1) {
        mouseDragged(event);
      }
      return true;
    }

    function touchEnded(event) {
      mouseReleased(event);
      return true;
    }

    // Keyboard Shortcuts
    function keyPressed() {
      if (key === ' ' || keyCode === 32) {
        if (settings.clickToRandomize) {
          randomizeAll(true);
        } else {
          regenerateGrid();
        }
        return false;
      }
      if (key === 'r' || key === 'R') {
        randomizeAll(true);
      }
      if (key === 'p' || key === 'P') {
        settings.isPlaying = !settings.isPlaying;
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
      if (key === '0') {
        resetCamera();
      }
      if (key === 'c' || key === 'C') {
        let keys = Object.keys(COLOR_SCHEMES);
        let idx = (keys.indexOf(settings.colorScheme) + 1) % keys.length;
        settings.colorScheme = keys[idx];
        regenerateGrid();
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // ============================================================
    // lil-gui Interactive Control Panel
    // ============================================================
    function initGUI() {
      gui = new lil.GUI({ title: 'Specimen Matrix 608' });

      // Folder 1: Palette & Color Schemes
      const themeFolder = gui.addFolder('Palette & Theme');
      themeFolder.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Scheme (19)')
        .onChange(() => regenerateGrid());
      themeFolder.add(settings, 'darkTheme').name('Dark Theme');
      themeFolder.add(settings, 'invertColors').name('Invert Plate');
      themeFolder.add(settings, 'colorJitter', 0.0, 3.0, 0.1)
        .name('Color Jitter')
        .onChange(() => regenerateGrid());

      // Folder 2: Animation & Dynamics
      const animFolder = gui.addFolder('Animation & Motion');
      animFolder.add(settings, 'isPlaying').name('Play Animation');
      animFolder.add(settings, 'animSpeed', 0.1, 4.0, 0.05).name('Speed');
      animFolder.add(settings, 'animMode', [
        'Kinetic Harmonic Waves',
        'Live Organic Growth',
        'Spiral Vortex',
        'Perlin Liquid Drift',
        'Diagonal Cascade',
        'Heartbeat Pulse',
        'Static Gallery Print'
      ]).name('Mode').onChange((val) => {
        if (val === 'Live Organic Growth') {
          for (let tile of gridTiles) tile.initWalkers();
        } else {
          for (let tile of gridTiles) {
            if (tile.currentStep < settings.maxSteps) {
              tile.initWalkers();
            }
          }
        }
      });
      animFolder.add(settings, 'waveFrequency', 0.02, 0.25, 0.005).name('Wave Frequency');
      animFolder.add(settings, 'pulseScale', 0.0, 0.35, 0.01).name('Pulse Scale');
      animFolder.add(settings, 'tileRotation', 0.0, 20.0, 0.5).name('Max Rotation (°)');
      animFolder.add(settings, 'floatIntensity', 0.0, 20.0, 0.5).name('Elevation Drift');
      animFolder.add(settings, 'mouseInfluence').name('Mouse Proximity');

      // Folder 3: Geometry & Specimen Walkers
      const geomFolder = gui.addFolder('Geometry & Grid');
      geomFolder.add(settings, 'tileSize', 70, 180, 5)
        .name('Tile Size')
        .onChange(() => regenerateGrid());
      geomFolder.add(settings, 'gridSpacing', 1.2, 2.0, 0.05)
        .name('Spacing Ratio')
        .onChange(() => regenerateGrid());
      geomFolder.add(settings, 'frameStyle', ['Gallery Specimen', 'Corner Brackets', 'Double Border', 'Minimal Ghost'])
        .name('Frame Style');
      geomFolder.add(settings, 'borderWeight', 1, 6, 1).name('Border Weight');
      geomFolder.add(settings, 'cornerRadius', 0, 24, 1).name('Corner Radius');
      geomFolder.add(settings, 'shadowGlow', 0, 25, 1).name('Shadow Glow');
      geomFolder.add(settings, 'nWalkers', 1, 4, 1)
        .name('Walkers/Node')
        .onChange(() => regenerateGrid());
      geomFolder.add(settings, 'maxSteps', 50, 400, 25)
        .name('Max Steps')
        .onChange(() => regenerateGrid());

      // Folder 4: Viewport & Randomization
      const viewFolder = gui.addFolder('Navigation & Actions');
      zoomController = viewFolder.add(settings, 'zoom', 0.2, 8.0, 0.05).name('Zoom Level').listen();
      viewFolder.add(settings, 'clickToRandomize').name('Click to Randomize');
      viewFolder.add(settings, 'regenerate').name('Regenerate (Space)');
      viewFolder.add(settings, 'randomize').name('Randomize All (R)');
      viewFolder.add(settings, 'resetView').name('Reset Camera (0)');
      viewFolder.add(settings, 'exportPNG').name('Export High-Res PNG');

      // Auto-collapse navigation for clean presentation
      themeFolder.open();
      animFolder.open();
    }
  </script>
