  <style>

      box-sizing: border-box;
      margin: 0;

</head>
<body>

    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // ============================================================

      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {

      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {

        lineH: '#63D1CF',
        lineV: '#5BC0BE',
        node: '#4BAD9E',
        accent: '#4BAD9E',
        ambient: '#0B132B'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        background: '#0D001D',
        lineH: '#AA60C8',
        lineV: '#D69ADE',
        node: '#C9A3C6',
        accent: '#CFB5C2',
        ambient: '#120A12'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        background: '#061210',
        lineH: '#FEF1BE',
        lineV: '#FFBA00',
        node: '#008189',
        accent: '#00474D',
        ambient: '#091c18'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        background: '#05140A',
        lineH: '#D4FFB0',
        lineV: '#7FFF00',
        node: '#00B894',
        accent: '#0A3322',
        ambient: '#0c2e17'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        background: '#0E0618',
        lineH: '#FFE8CC',
        lineV: '#FF8C00',
        node: '#C7501A',
        accent: '#3D1050',
        ambient: '#220b33'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        background: '#090612',
        lineH: '#E8E0FF',
        lineV: '#B38FFF',
        node: '#6A3DE8',
        accent: '#1A1250',
        ambient: '#1f153a'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        background: '#05020F',
        lineH: '#E0FBFF',
        lineV: '#00F0FF',
        node: '#D40078',
        accent: '#1E0A3D',
        ambient: '#1a0b36'
      }
    };

    // ============================================================
    // Simulation & Visual Parameters
    // ============================================================
    const params = {
      // Color & Theme
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: '#eeeeee',
      lineColorH: '#999999',
      lineColorV: '#bbbbbb',
      intersectionColor: '#111111',
      accentColor: '#333333',

      // Camera & Animation
      animation: 'Slow Orbit',
      speed: 1.0,
      dragMode: 'Orbit (Left) / Pan (Right)',

      // Line & Node Geometry
      linesCount: 16,
      lineWidth: 0.8,
      nodeShape: 'Spheres',
      nodeScale: 1.2,
      nodePulse: 0.35,
      zDepth: 22.0,
      twist: 0.5,
      materialStyle: 'Physical Luminous',
      showBounds: true,

      // Lighting & Exposure
      exposure: 1.0,
      masterIntensity: 1.0,
      ambientIntensity: 0.7,
      ambientColor: '#dcdcdc',
      keyIntensity: 2.2,
      keyColor: '#ffffff',
      fillIntensity: 1.6,
      fillColor: '#999999',
      rimIntensity: 1.8,
      rimColor: '#111111',
      coreIntensity: 1.4,
      coreColor: '#ffffff',

      // Display & Interaction
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      randomizeOnClick: true
    };

    // Stage Bounds Configuration
    const BOUND_X = 90;
    const BOUND_Y = 90;

    // ============================================================
    // Scene, Camera, Renderer Setup
    // ============================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3000);
    camera.position.set(0, 0, 260);

    let renderer = new THREE.WebGLRenderer({
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.minDistance = 20;
    controls.maxDistance = 1400;
    controls.target.set(0, 0, 0);

    function updateDragMode() {
      if (params.dragMode === 'Pan (Left) / Orbit (Right)') {
        controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
        controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
      } else {
        controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
        controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
      }
    }
    updateDragMode();

    // ============================================================
    // Lights Setup
    // ============================================================
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity * params.masterIntensity);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(params.keyColor, params.keyIntensity * params.masterIntensity);
    keyLight.position.set(150, 200, 160);
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(params.fillColor, params.fillIntensity * params.masterIntensity, 800, 1.2);
    fillLight.position.set(-160, -120, 120);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(params.rimColor, params.rimIntensity * params.masterIntensity, 800, 1.2);
    rimLight.position.set(0, 160, -180);
    scene.add(rimLight);

    const coreLight = new THREE.PointLight(params.coreColor, params.coreIntensity * params.masterIntensity, 500, 1.5);
    coreLight.position.set(0, 0, 30);
    scene.add(coreLight);

    function updateLights() {
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity * params.masterIntensity;

      keyLight.color.set(params.keyColor);
      keyLight.intensity = params.keyIntensity * params.masterIntensity;

      fillLight.color.set(params.fillColor);
      fillLight.intensity = params.fillIntensity * params.masterIntensity;

      rimLight.color.set(params.rimColor);
      rimLight.intensity = params.rimIntensity * params.masterIntensity;

      coreLight.color.set(params.coreColor);
      coreLight.intensity = params.coreIntensity * params.masterIntensity;
    }

    // ============================================================
    // Boundary Stage Frame Mesh
    // ============================================================
    const boundsBoxGeom = new THREE.BoxGeometry(BOUND_X * 2, BOUND_Y * 2, 40);
    const boundsBoxEdges = new THREE.EdgesGeometry(boundsBoxGeom);
    const boundsLineMat = new THREE.LineBasicMaterial({
      color: 0x888888,
      transparent: true,
      opacity: 0.25
    });
    const boundsWireframe = new THREE.LineSegments(boundsBoxEdges, boundsLineMat);
    scene.add(boundsWireframe);

    function updateBoundsVisibility() {
      boundsWireframe.visible = params.showBounds;
      boundsLineMat.color.set(params.accentColor);
    }

    // ============================================================
    // Kinetic Lines Simulation Model
    // Replicating original CodePen logic in 3D:
    // Vertical ('v') lines move across horizontal axis;
    // Horizontal ('h') lines move across vertical axis;
    // Both bounce back upon hitting boundary edges.
    // ============================================================
    class KineticLine {
      constructor(flag, index) {
        this.flag = flag; // 'h' or 'v'
        this.index = index;
        this.a = new THREE.Vector3();
        this.b = new THREE.Vector3();
        this.va = (25 + Math.random() * 75) / 100 * (Math.random() < 0.5 ? 1 : -1);
        this.vb = (25 + Math.random() * 75) / 100 * (Math.random() < 0.5 ? 1 : -1);
        this.reset();
      }

      reset() {
        if (this.flag === 'v') {
          this.a.y = -BOUND_Y;
          this.b.y = BOUND_Y;
          this.a.x = (Math.random() * 2 - 1) * BOUND_X;
          this.b.x = (Math.random() * 2 - 1) * BOUND_X;
        } else {
          this.a.x = -BOUND_X;
          this.b.x = BOUND_X;
          this.a.y = (Math.random() * 2 - 1) * BOUND_Y;
          this.b.y = (Math.random() * 2 - 1) * BOUND_Y;
        }
        this.a.z = 0;
        this.b.z = 0;
      }

      update(speedDelta, simTime, zDepth, twist) {
        const stepA = this.va * speedDelta * 1.6;
        const stepB = this.vb * speedDelta * 1.6;

        if (this.flag === 'v') {
          this.a.x += stepA;
          this.b.x += stepB;
          if (this.a.x < -BOUND_X || this.a.x > BOUND_X) {
            this.va *= -1;
            this.a.x = THREE.MathUtils.clamp(this.a.x, -BOUND_X, BOUND_X);
          }
          if (this.b.x < -BOUND_X || this.b.x > BOUND_X) {
            this.vb *= -1;
            this.b.x = THREE.MathUtils.clamp(this.b.x, -BOUND_X, BOUND_X);
          }
        } else {
          this.a.y += stepA;
          this.b.y += stepB;
          if (this.a.y < -BOUND_Y || this.a.y > BOUND_Y) {
            this.va *= -1;
            this.a.y = THREE.MathUtils.clamp(this.a.y, -BOUND_Y, BOUND_Y);
          }
          if (this.b.y < -BOUND_Y || this.b.y > BOUND_Y) {
            this.vb *= -1;
            this.b.y = THREE.MathUtils.clamp(this.b.y, -BOUND_Y, BOUND_Y);
          }
        }

        // Harmonious 3D wave undulation
        const phaseA = this.index * 0.45 + simTime;
        const phaseB = this.index * 0.45 + simTime + 1.2;
        this.a.z = Math.sin(phaseA) * zDepth * 0.4 + (this.a.x * this.a.y / (BOUND_X * BOUND_Y)) * twist * 10;
        this.b.z = Math.cos(phaseB) * zDepth * 0.4 + (this.b.x * this.b.y / (BOUND_X * BOUND_Y)) * twist * 10;
      }
    }

    let kineticLines = [];

    function initKineticLines() {
      kineticLines = [];
      const total = params.linesCount;
      for (let i = 0; i < total; i++) {
        const flag = (i % 2 === 0) ? 'h' : 'v';
        kineticLines.push(new KineticLine(flag, i));
      }
    }

    // ============================================================
    // Meshes & Materials (Lines & Intersection Nodes)
    // ============================================================
    function createMaterial(styleName, colorHex, isNode = false) {
      if (styleName === 'Holographic Glass') {
        return new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(colorHex),
          roughness: 0.1,
          metalness: 0.15,
          transmission: 0.75,
          ior: 1.45,
          transparent: true,
          opacity: 0.85,
          clearcoat: 1.0,
          clearcoatRoughness: 0.1
        });
      } else if (styleName === 'Metallic Mirror') {
        return new THREE.MeshStandardMaterial({
          color: new THREE.Color(colorHex),
          roughness: 0.15,
          metalness: 0.9,
          flatShading: !isNode
        });
      } else { // 'Physical Luminous'
        return new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(colorHex),
          roughness: 0.22,
          metalness: 0.35,
          clearcoat: 0.6,
          clearcoatRoughness: 0.18,
          reflectivity: 0.7,
          transparent: true,
          opacity: 0.95
        });
      }
    }

    function createNodeGeometry(shapeName) {
      switch (shapeName) {
        case 'Octahedra':
          return new THREE.OctahedronGeometry(2.2, 0);
        case 'Rings':
          return new THREE.TorusGeometry(2.1, 0.65, 12, 24);
        case 'Diamonds':
          return new THREE.ConeGeometry(2.0, 4.2, 4);
        case 'Boxes':
          return new THREE.BoxGeometry(2.6, 2.6, 2.6);
        case 'Spheres':
        default:
          return new THREE.SphereGeometry(1.8, 20, 14);
      }
    }

    // Line mesh: unit cylinder along Y axis
    const cylinderUnitGeom = new THREE.CylinderGeometry(1, 1, 1, 14);
    let linesMeshH = null;
    let linesMeshV = null;

    // Intersection nodes: InstancedMesh
    const MAX_INTERSECTIONS = 1024;
    let nodesMesh = null;

    function rebuildMeshes() {
      // 1. Remove old meshes
      if (linesMeshH) { scene.remove(linesMeshH); linesMeshH.material.dispose(); }
      if (linesMeshV) { scene.remove(linesMeshV); linesMeshV.material.dispose(); }
      if (nodesMesh) { scene.remove(nodesMesh); nodesMesh.material.dispose(); nodesMesh.geometry.dispose(); }

      const matH = createMaterial(params.materialStyle, params.lineColorH, false);
      const matV = createMaterial(params.materialStyle, params.lineColorV, false);
      const countH = kineticLines.filter(l => l.flag === 'h').length;
      const countV = kineticLines.filter(l => l.flag === 'v').length;

      linesMeshH = new THREE.InstancedMesh(cylinderUnitGeom, matH, Math.max(1, countH));
      linesMeshH.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(linesMeshH);

      linesMeshV = new THREE.InstancedMesh(cylinderUnitGeom, matV, Math.max(1, countV));
      linesMeshV.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(linesMeshV);

      // 2. Nodes mesh
      const nodeGeom = createNodeGeometry(params.nodeShape);
      const nodeMat = createMaterial(params.materialStyle, params.intersectionColor, true);
      nodesMesh = new THREE.InstancedMesh(nodeGeom, nodeMat, MAX_INTERSECTIONS);
      nodesMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      if (nodesMesh.instanceColor) {
        nodesMesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
      }
      scene.add(nodesMesh);

      updateMaterialColors();
    }

    function updateMaterialColors() {
      if (linesMeshH) linesMeshH.material.color.set(params.lineColorH);
      if (linesMeshV) linesMeshV.material.color.set(params.lineColorV);
      if (nodesMesh) nodesMesh.material.color.set(params.intersectionColor);
      updateBoundsVisibility();
    }

    // ============================================================
    // Background and Greenscreen Handler
    // ============================================================
    function updateBackground() {
      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
      } else {
        scene.background = new THREE.Color(params.backgroundColor);
      }
    }

    // ============================================================
    // Color Preset Application
    // ============================================================
    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      params.backgroundColor = scheme.background;
      params.lineColorH = scheme.lineH;
      params.lineColorV = scheme.lineV;
      params.intersectionColor = scheme.node;
      params.accentColor = scheme.accent;
      params.ambientColor = scheme.ambient;
      params.keyColor = scheme.accent;
      params.fillColor = scheme.lineH;
      params.rimColor = scheme.lineV;
      params.coreColor = scheme.node;

      updateBackground();
      updateLights();
      updateMaterialColors();
    }

    // ============================================================
    // Intersection Calculator
    // Exact 2D line segment intersection extended with 3D spatial depth
    // ============================================================
    const activeIntersections = [];

    function computeIntersections(simTime) {
      activeIntersections.length = 0;
      const hLines = kineticLines.filter(l => l.flag === 'h');
      const vLines = kineticLines.filter(l => l.flag === 'v');

      for (let i = 0; i < hLines.length; i++) {
        const lh = hLines[i];
        const p1 = lh.a;
        const p2 = lh.b;

        for (let j = 0; j < vLines.length; j++) {
          const lv = vLines[j];
          const p3 = lv.a;
          const p4 = lv.b;

          const denom = (p4.y - p3.y) * (p2.x - p1.x) - (p4.x - p3.x) * (p2.y - p1.y);
          if (Math.abs(denom) > 1e-6) {
            const ua = ((p4.x - p3.x) * (p1.y - p3.y) - (p4.y - p3.y) * (p1.x - p3.x)) / denom;
            const ub = ((p2.x - p1.x) * (p1.y - p3.y) - (p2.y - p1.y) * (p1.x - p3.x)) / denom;

            if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
              const x = p1.x + ua * (p2.x - p1.x);
              const y = p1.y + ua * (p2.y - p1.y);
              const zh = p1.z + ua * (p2.z - p1.z);
              const zv = p3.z + ub * (p4.z - p3.z);
              const distToCenter = Math.hypot(x, y);
              const waveZ = Math.sin(simTime * 2.5 + distToCenter * 0.05) * (params.zDepth * 0.35);
              const z = (zh + zv) * 0.5 + waveZ;

              activeIntersections.push({ x, y, z, distToCenter, index: activeIntersections.length });
              if (activeIntersections.length >= MAX_INTERSECTIONS) return;
            }
          }
        }
      }
    }

    // ============================================================
    // Interaction Tracking (Wheel Zoom & Click vs Drag Handling)
    // ============================================================
    let isUserInteracting = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;

    function attachCanvasEvents(domElem) {
      domElem.addEventListener('pointerdown', (e) => {
        if (e.target !== domElem || e.button !== 0) return;
        pointerDownX = e.clientX;
        pointerDownY = e.clientY;
        pointerDownTime = performance.now();
        isUserInteracting = true;
      });

      controls.addEventListener('start', () => {
        isUserInteracting = true;
      });

      controls.addEventListener('end', () => {
        isUserInteracting = false;
      });
    }
    attachCanvasEvents(renderer.domElement);

    window.addEventListener('pointerup', (e) => {
      isUserInteracting = false;
      if (e.target !== renderer.domElement || e.button !== 0) return;
      const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
      const duration = performance.now() - pointerDownTime;

      // Click threshold: only randomize if user clicked, NOT dragged or orbited
      if (dist < 6 && duration < 320 && params.randomizeOnClick) {
        randomizeScene();
      }
    });

    // ============================================================
    // Procedural Scene Randomizer
    // ============================================================
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(params.colorScheme);

      const shapes = ['Spheres', 'Octahedra', 'Rings', 'Diamonds', 'Boxes'];
      params.nodeShape = shapes[Math.floor(Math.random() * shapes.length)];

      const styles = ['Physical Luminous', 'Metallic Mirror', 'Holographic Glass'];
      params.materialStyle = styles[Math.floor(Math.random() * styles.length)];

      const lineCounts = [12, 16, 20, 24];
      params.linesCount = lineCounts[Math.floor(Math.random() * lineCounts.length)];
      initKineticLines();
      rebuildMeshes();

      params.lineWidth = +(0.4 + Math.random() * 1.4).toFixed(2);
      params.nodeScale = +(0.7 + Math.random() * 1.5).toFixed(2);
      params.nodePulse = +(0.15 + Math.random() * 0.55).toFixed(2);
      params.zDepth = +(10 + Math.random() * 45).toFixed(1);
      params.twist = +(0.1 + Math.random() * 1.2).toFixed(2);
      params.speed = +(0.5 + Math.random() * 1.5).toFixed(2);

      const anims = [
        'Static (No Camera Motion)',
        'Slow Orbit',
        'Gentle Drift',
        'Cosmic Spiral',
        'Pendulum Sway',
        'Breathing Pulse',
        'Vertical Wave Glide',
        'Cinematic Pan'
      ];
      params.animation = anims[Math.floor(Math.random() * anims.length)];

      params.exposure = +(0.7 + Math.random() * 0.7).toFixed(2);
      renderer.toneMappingExposure = params.exposure;
      params.keyIntensity = +(1.5 + Math.random() * 2.5).toFixed(1);
      params.fillIntensity = +(1.0 + Math.random() * 2.0).toFixed(1);
      params.rimIntensity = +(1.0 + Math.random() * 2.5).toFixed(1);
      params.coreIntensity = +(1.0 + Math.random() * 2.5).toFixed(1);
      updateLights();

      updateGuiDisplay();
    }

    // ============================================================
    // Antialias & Renderer Rebuilding
    // ============================================================
    function updateAntialiasSetting(enabled) {
      params.antialias = enabled;
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      oldCanvas.parentNode.replaceChild(renderer.domElement, oldCanvas);
      controls.domElement = renderer.domElement;
      attachCanvasEvents(renderer.domElement);
    }

    // ============================================================
    // GUI Setup (lil-gui without custom stylesheet modifications)
    // ============================================================
    const gui = new GUI({ title: 'Scene Controls' });

    // 1. Theme & Colors
    const folderColor = gui.addFolder('Theme & Colors');
    folderColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => {
      applyColorScheme(v);
      updateGuiDisplay();
    });
    folderColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);
    folderColor.addColor(params, 'backgroundColor').name('Background Color').onChange(updateBackground);
    folderColor.addColor(params, 'lineColorH').name('Horizontal Line Color').onChange(updateMaterialColors);
    folderColor.addColor(params, 'lineColorV').name('Vertical Line Color').onChange(updateMaterialColors);
    folderColor.addColor(params, 'intersectionColor').name('Intersection Node Color').onChange(updateMaterialColors);
    folderColor.addColor(params, 'accentColor').name('Accent Color').onChange(updateBoundsVisibility);

    // 2. Camera & Animation
    const folderAnim = gui.addFolder('Camera & Animation');
    folderAnim.add(params, 'animation', [
      'Static (No Camera Motion)',
      'Slow Orbit',
      'Gentle Drift',
      'Cosmic Spiral',
      'Pendulum Sway',
      'Breathing Pulse',
      'Vertical Wave Glide',
      'Cinematic Pan'
    ]).name('Animation');
    folderAnim.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
    folderAnim.add(params, 'dragMode', [
      'Orbit (Left) / Pan (Right)',
      'Pan (Left) / Orbit (Right)'
    ]).name('Drag Mode').onChange(updateDragMode);

    // 3. Geometry & Intersections
    const folderGeom = gui.addFolder('Geometry & Dynamics');
    folderGeom.add(params, 'linesCount', 6, 32, 2).name('Lines Count').onChange(() => {
      initKineticLines();
      rebuildMeshes();
    });
    folderGeom.add(params, 'lineWidth', 0.2, 3.0, 0.05).name('Line Thickness');
    folderGeom.add(params, 'nodeShape', ['Spheres', 'Octahedra', 'Rings', 'Diamonds', 'Boxes']).name('Node Shape').onChange(rebuildMeshes);
    folderGeom.add(params, 'materialStyle', ['Physical Luminous', 'Metallic Mirror', 'Holographic Glass']).name('Material Style').onChange(rebuildMeshes);
    folderGeom.add(params, 'nodeScale', 0.2, 3.5, 0.05).name('Node Scale');
    folderGeom.add(params, 'nodePulse', 0.0, 1.0, 0.05).name('Node Pulse');
    folderGeom.add(params, 'zDepth', 0.0, 60.0, 1.0).name('3D Wave Depth');
    folderGeom.add(params, 'twist', 0.0, 2.5, 0.05).name('Spatial Twist');
    folderGeom.add(params, 'showBounds').name('Show Bounds Frame').onChange(updateBoundsVisibility);

    // 4. Lighting & Exposure
    const folderLight = gui.addFolder('Lighting & Exposure');
    folderLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    folderLight.add(params, 'masterIntensity', 0.0, 3.0, 0.05).name('Master Intensity').onChange(updateLights);
    folderLight.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(updateLights);
    folderLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(updateLights);
    folderLight.add(params, 'keyIntensity', 0.0, 6.0, 0.1).name('Key Light Intensity').onChange(updateLights);
    folderLight.addColor(params, 'keyColor').name('Key Light Color').onChange(updateLights);
    folderLight.add(params, 'fillIntensity', 0.0, 6.0, 0.1).name('Fill Light Intensity').onChange(updateLights);
    folderLight.addColor(params, 'fillColor').name('Fill Light Color').onChange(updateLights);
    folderLight.add(params, 'rimIntensity', 0.0, 6.0, 0.1).name('Rim Light Intensity').onChange(updateLights);
    folderLight.addColor(params, 'rimColor').name('Rim Light Color').onChange(updateLights);
    folderLight.add(params, 'coreIntensity', 0.0, 6.0, 0.1).name('Core Light Intensity').onChange(updateLights);
    folderLight.addColor(params, 'coreColor').name('Core Light Color').onChange(updateLights);

    // 5. Display & Settings
    const folderDisplay = gui.addFolder('Display Settings');
    folderDisplay.add(params, 'antialias').name('Antialias (Default ON)').onChange(updateAntialiasSetting);
    folderDisplay.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
    });
    folderDisplay.add(params, 'randomizeOnClick').name('Randomize on Click');

    function updateGuiDisplay() {
      function traverse(f) {
        if (f.controllers) f.controllers.forEach(c => c.updateDisplay());
        if (f.folders) f.folders.forEach(child => traverse(child));
      }
      traverse(gui);
    }

    // Toggle GUI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize lines and meshes
    initKineticLines();
    rebuildMeshes();
    applyColorScheme('Original');

    // ============================================================
    // Animation & Render Loop
    // ============================================================
    let prevTime = performance.now();
    let simTime = 0;
    let animTime = 0;

    const dummy = new THREE.Object3D();
    const upVector = new THREE.Vector3(0, 1, 0);
    const lineDir = new THREE.Vector3();
    const lineMid = new THREE.Vector3();
    const tempNodeColor = new THREE.Color();
    const baseNodeColor = new THREE.Color();
    const accentNodeColor = new THREE.Color();

    function renderLoop(currentTime) {
      requestAnimationFrame(renderLoop);

      const delta = Math.min((currentTime - prevTime) / 1000, 0.1);
      prevTime = currentTime;

      const speedDelta = delta * params.speed;
      simTime += speedDelta * 0.8;
      animTime += speedDelta;

      // ============================================================
      // 1. Camera Animation with Zoom & Angle Persistence
      // Smooth slow animations, user wheel zoom and manual angle retained!
      // ============================================================
      if (params.animation === 'Static (No Camera Motion)') {
        controls.autoRotate = false;
        controls.update();
      } else if (params.animation === 'Slow Orbit') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.75 * params.speed;
        controls.update();
      } else {
        controls.autoRotate = false;
        controls.update();

        // Apply relative spherical deltas while preserving current camera distance & manual angle
        if (!isUserInteracting) {
          const offset = camera.position.clone().sub(controls.target);
          const spherical = new THREE.Spherical().setFromVector3(offset);
          // Note: spherical.radius is explicitly preserved, maintaining wheel zoom!

          if (params.animation === 'Gentle Drift') {
            spherical.theta += Math.sin(animTime * 0.35) * 0.003 * params.speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.cos(animTime * 0.28) * 0.0016 * params.speed,
              0.15, Math.PI - 0.15
            );
          } else if (params.animation === 'Cosmic Spiral') {
            spherical.theta += 0.0045 * params.speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.45) * 0.0022 * params.speed,
              0.2, Math.PI - 0.2
            );
          } else if (params.animation === 'Pendulum Sway') {
            spherical.theta += Math.cos(animTime * 0.55) * 0.0055 * params.speed;
          } else if (params.animation === 'Breathing Pulse') {
            spherical.theta += 0.0025 * params.speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.35) * 0.0018 * params.speed,
              0.22, Math.PI - 0.22
            );
          } else if (params.animation === 'Vertical Wave Glide') {
            spherical.theta += 0.0025 * params.speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.65) * 0.0032 * params.speed,
              0.25, Math.PI - 0.25
            );
          } else if (params.animation === 'Cinematic Pan') {
            spherical.theta += 0.0035 * params.speed;
          }

          camera.position.setFromSpherical(spherical).add(controls.target);
          camera.lookAt(controls.target);
        }
      }

      // ============================================================
      // 2. Kinetic Lines Simulation Step
      // ============================================================
      let idxH = 0;
      let idxV = 0;

      for (let i = 0; i < kineticLines.length; i++) {
        const line = kineticLines[i];
        line.update(speedDelta, simTime, params.zDepth, params.twist);

        // Compute 3D cylinder transform
        lineMid.copy(line.a).add(line.b).multiplyScalar(0.5);
        lineDir.copy(line.b).sub(line.a);
        const len = lineDir.length();
        lineDir.normalize();

        dummy.position.copy(lineMid);
        dummy.quaternion.setFromUnitVectors(upVector, lineDir);
        dummy.scale.set(params.lineWidth, len, params.lineWidth);
        dummy.updateMatrix();

        if (line.flag === 'h' && linesMeshH) {
          linesMeshH.setMatrixAt(idxH++, dummy.matrix);
        } else if (line.flag === 'v' && linesMeshV) {
          linesMeshV.setMatrixAt(idxV++, dummy.matrix);
        }
      }

      if (linesMeshH) linesMeshH.instanceMatrix.needsUpdate = true;
      if (linesMeshV) linesMeshV.instanceMatrix.needsUpdate = true;

      // ============================================================
      // 3. Dynamic Intersections Calculation & Rendering
      // ============================================================
      computeIntersections(simTime);

      if (nodesMesh) {
        baseNodeColor.set(params.intersectionColor);
        accentNodeColor.set(params.accentColor);
        const count = activeIntersections.length;
        nodesMesh.count = count;

        let centerSumX = 0;
        let centerSumY = 0;
        let centerSumZ = 0;

        for (let k = 0; k < count; k++) {
          const pt = activeIntersections[k];
          centerSumX += pt.x;
          centerSumY += pt.y;
          centerSumZ += pt.z;

          dummy.position.set(pt.x, pt.y, pt.z);

          // Harmonic scale pulsation
          const pulse = 1.0 + params.nodePulse * Math.sin(simTime * 3.5 + pt.distToCenter * 0.1);
          dummy.scale.setScalar(params.nodeScale * pulse);

          // Gentle continuous rotation
          dummy.rotation.set(
            simTime * 0.7 + pt.index * 0.2,
            simTime * 0.9 + pt.index * 0.3,
            simTime * 0.5
          );
          dummy.updateMatrix();

          nodesMesh.setMatrixAt(k, dummy.matrix);

          // Subtle harmonic chromatic variation
          const colorT = 0.5 + 0.5 * Math.sin(simTime * 2.0 + pt.distToCenter * 0.08);
          tempNodeColor.copy(baseNodeColor).lerp(accentNodeColor, colorT * 0.6);
          nodesMesh.setColorAt(k, tempNodeColor);
        }

        nodesMesh.instanceMatrix.needsUpdate = true;
        if (nodesMesh.instanceColor) nodesMesh.instanceColor.needsUpdate = true;

        // Position core point light to follow the kinetic centroid
        if (count > 0) {
          coreLight.position.set(
            centerSumX / count,
            centerSumY / count,
            centerSumZ / count + 15
          );
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
