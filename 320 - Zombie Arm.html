    {
      "imports": {

        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

<body>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone usage)
    // =========================================================================================
    const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

    const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

    const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

    const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

    const godRaysDepthMaskShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float factor = smoothstep(threshold, threshold + 0.15, lum);
  fragColor = vec4(vec3(factor), 1.0);
}
`;

    const godRaysGenerateShader = `
precision highp float;
#define TAPS_PER_PASS 6.0

uniform sampler2D inputTexture;
uniform vec3 vSunPositionScreenSpace;
uniform float fStepSize;
uniform float distanceAttenuation;
uniform float maxDensity;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec2 delta = vSunPositionScreenSpace.xy - vUv;
  float dist = length(delta);
  vec2 stepv = fStepSize * delta / max(dist, 0.0001);
  float iters = dist / max(fStepSize, 0.00001);

  vec2 uv = vUv;
  float col = 0.0;
  float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
  float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

  if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

  float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
  fragColor = vec4(vec3(finalVal), 1.0);
}
`;

    const anamorphicBrightShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
uniform float smoothWidth;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float alpha = smoothstep(threshold, threshold + smoothWidth, v);
  fragColor = mix(vec4(0.0), color, alpha);
}
`;

    const anamorphicBlurShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 resolution;
uniform float samples;
uniform float intensity;
uniform vec3 tintColor;
uniform float bloomRadius;
in vec2 vUv;
out vec4 fragColor;

void main() {
  int halfSamples = max(1, int(samples) / 2);
  float fHalfSamples = float(halfSamples);
  vec2 invSize = 1.0 / resolution;
  vec4 total = vec4(0.0);

  for (int i = -64; i <= 64; i++) {
    if (i < -halfSamples || i > halfSamples) continue;
    float softness = 1.0 - abs(float(i)) / fHalfSamples;
    softness = pow(softness, 2.0);
    vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
    shiftedUV = clamp(shiftedUV, 0.001, 0.999);
    total += texture(inputTexture, shiftedUV) * softness;
  }

  fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
}
`;

    const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform sampler2D raysTexture;
uniform sampler2D anamorphicTexture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform bool raysEnabled;
uniform float raysStrength;
uniform vec3 raysColor;
uniform bool anamorphicEnabled;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  if (raysEnabled && raysStrength > 0.001) {
    vec4 r = texture(raysTexture, vUv);
    color.rgb += r.rgb * raysColor * raysStrength;
  }

  if (anamorphicEnabled) {
    vec4 a = texture(anamorphicTexture, vUv);
    color.rgb += a.rgb;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

    const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

    const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float exposure;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
uniform int visionMode;
uniform float thermalSensitivity;
uniform float nightVisionNoise;
uniform float nightVisionGain;
uniform float crtIntensity;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.001) return uv;
  vec2 coord = uv - 0.5;
  float dist = length(coord);
  if (dist < radius) {
    float percent = dist / radius;
    if (strength > 0.0) {
      coord *= mix(1.0, smoothstep(0.0, radius / dist, percent), strength * 0.75);
    } else {
      coord *= mix(1.0, pow(percent, 1.0 + abs(strength) * 1.5), abs(strength) * 0.75);
    }
  }
  return coord + 0.5;
}

vec3 ACESFilmicToneMapping(vec3 color) {
  float a = 2.51;
  float b = 0.03;
  float c = 2.43;
  float d = 0.59;
  float e = 0.14;
  return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
}

vec3 finalLevels(vec3 color, vec3 minIn, vec3 gammaIn, vec3 maxIn) {
  return pow(clamp((color - minIn) / max(maxIn - minIn, vec3(0.0001)), 0.0, 1.0), 1.0 / max(gammaIn, vec3(0.0001)));
}

void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  vec3 finalCol = col.rgb;
  
  vec3 exposedColor = finalCol * exposure;
  vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
  finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));

  fragColor = vec4(finalCol, 1.0);
}
`;

    const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(
            new ShaderPingPongPass(this.blurShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            })
          );
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = j === 0 ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;
        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.85,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.22,
          raysEnabled: false,
          anamorphicEnabled: false,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.016,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.15,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.65,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: 0.0,
          maxInputLevel: 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.05,
          fisheyeStrength: 0.0,
          fisheyeRadius: 1.0
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: false },
            raysStrength: { value: 0.0 },
            raysColor: { value: new THREE.Color(0xffffff) },
            anamorphicEnabled: { value: false },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            resolution: { value: new THREE.Vector2(1, 1) },
            time: { value: 0.0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            fisheyeStrength: { value: 0.0 },
            fisheyeRadius: { value: 1.0 },
            time: { value: 0.0 },
            visionMode: { value: 0 },
            thermalSensitivity: { value: 1.0 },
            nightVisionGain: { value: 1.0 },
            nightVisionNoise: { value: 0.0 },
            crtIntensity: { value: 0.0 }
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        this.finalPass.render(this.renderer);

        this.rgbPass.shader.uniforms.inputTexture.value = this.finalPass.texture;
        this.rgbPass.render(this.renderer, true);
      }

        const folder = gui.addFolder(title);
        folder.add(this.settings, 'enabled').name('Enable PostFX');

        bloomFolder.add(this.settings, 'bloomThreshold', 0.0, 1.0, 0.01).name('Threshold');
        bloomFolder.close();

        const opticsFolder = folder.addFolder('Camera & Optics');
        opticsFolder.add(this.settings, 'chromaticAberration', 0.0, 0.08, 0.001).name('Chromatic Aberr.');
        opticsFolder.add(this.settings, 'vignetteBoost', 0.5, 2.5, 0.05).name('Vignette Boost');
        opticsFolder.add(this.settings, 'vignetteReduction', 0.0, 2.5, 0.05).name('Vignette Spread');
        opticsFolder.add(this.settings, 'noiseIntensity', 0.0, 0.08, 0.002).name('Film Grain');
        opticsFolder.close();

        const colorFolder = folder.addFolder('Tone & Levels');
        colorFolder.add(this.settings, 'exposure', 0.2, 2.5, 0.02).name('Exposure');
        colorFolder.add(this.settings, 'gamma', 0.4, 2.5, 0.02).name('Gamma');
        colorFolder.close();

        folder.close();
        return folder;
      }

    function createDecaySkinCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#6b8a5b';
      ctx.fillRect(0, 0, 1024, 1024);

      for (let i = 0; i < 450; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = 15 + Math.random() * 75;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        const choice = Math.random();
        if (choice < 0.45) {
          grad.addColorStop(0, 'rgba(40, 60, 30, 0.5)');
        } else if (choice < 0.75) {
          grad.addColorStop(0, 'rgba(65, 20, 30, 0.4)');
        } else if (choice < 0.92) {
          grad.addColorStop(0, 'rgba(20, 25, 20, 0.65)');
        } else {
          grad.addColorStop(0, 'rgba(110, 140, 90, 0.35)');
        }
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.lineWidth = 1.6;
      ctx.strokeStyle = 'rgba(25, 45, 35, 0.6)';
      for (let v = 0; v < 24; v++) {
        let vx = Math.random() * 1024;
        let vy = Math.random() * 1024;
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        for (let seg = 0; seg < 18; seg++) {
          vx += (Math.random() - 0.5) * 45;
          vy += (Math.random() - 0.3) * 45;
          ctx.lineTo(vx, vy);
        }
        ctx.stroke();
      }

      const dirtGrad = ctx.createLinearGradient(0, 750, 0, 1024);
      dirtGrad.addColorStop(0, 'rgba(25, 18, 12, 0)');
      dirtGrad.addColorStop(1, 'rgba(20, 12, 8, 0.85)');
      ctx.fillStyle = dirtGrad;
      ctx.fillRect(0, 750, 1024, 274);

      return canvas;
    }

    function createSkinBumpCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 512, 512);

      ctx.lineWidth = 1;
      for (let i = 0; i < 700; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const len = 6 + Math.random() * 28;
        const ang = (Math.random() - 0.5) * 1.6;
        ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(40,40,40,0.4)' : 'rgba(220,220,220,0.35)';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        ctx.stroke();
      }
      return canvas;
    }

    function createSoilCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2b2118';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 1400; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = 1 + Math.random() * 6;
        const dark = Math.random();
        if (dark < 0.6) {
          ctx.fillStyle = 'rgba(15, 10, 6, 0.7)';
        } else if (dark < 0.85) {
          ctx.fillStyle = 'rgba(55, 42, 30, 0.55)';
        } else {
          ctx.fillStyle = 'rgba(35, 48, 28, 0.5)';
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      return canvas;
    }

    const positions = [];

    function addVertex(x, y, z, nx, ny, nz, u, v, bA, wA, bB = 0, wB = 0) {
      positions.push(x, y, z);
      normals.push(nx, ny, nz);
      uvs.push(u, v);

      const sum = wA + wB;
      const weightA = sum > 0 ? wA / sum : 1.0;
      const weightB = sum > 0 ? wB / sum : 0.0;

      skinIndices.push(bA, bB, 0, 0);
      skinWeights.push(weightA, weightB, 0, 0);

      // Palm & Metacarpus (broadens towards knuckle arch)
      else {
        const f = (y - 0.65) / (armYMax - 0.65);
        rx = 0.26 + f * 0.17;
        rz = 0.14 + f * 0.03;

        // Thenar muscle swell on thumb side (-X, +Z)
        if (f > 0.15 && f < 0.7) {
          const thenar = Math.sin((f - 0.15) / 0.55 * Math.PI);
          offsetX -= thenar * 0.04;
          offsetZ += thenar * 0.035;
        }
      }

      // Bone skinning weights along arm & palm
      let bA = 0, bB = 1, wA = 1, wB = 0;
      if (y < -0.95) {
        const t = (y - (-1.6)) / 0.65;
        bA = 0; bB = 1;
        wB = THREE.MathUtils.clamp(t, 0, 1);
        wA = 1 - wB;
      } else if (y < -0.30) {
        const t = (y - (-0.95)) / 0.65;
        bA = 1; bB = 2;
        wB = THREE.MathUtils.clamp(t, 0, 1);
        wA = 1 - wB;
      } else if (y < 0.35) {
        const t = (y - (-0.30)) / 0.65;
        bA = 2; bB = 3;
        wB = THREE.MathUtils.clamp(t, 0, 1);
        wA = 1 - wB;
      } else {
        const t = (y - 0.35) / 0.80;
        bA = 3; bB = 4;
        wB = THREE.MathUtils.clamp(t, 0, 1);
        wA = 1 - wB;
      }

      for (let i = 0; i <= armRadial; i++) {
        const theta = (i / armRadial) * Math.PI * 2;

        let r = 1.0;
        // Tendons ridges on dorsal side (z < 0) when in palm region
        if (y > 0.70 && Math.sin(theta) < 0) {
          const tendon = Math.abs(Math.sin(theta * 4)) * 0.025;
          r += tendon;
        }
        // Palm cup hollow in center (z > 0)
        if (y > 0.70 && Math.sin(theta) > 0.3 && Math.abs(Math.cos(theta)) < 0.6) {
          r -= 0.025;
        }

        const x = Math.cos(theta) * rx * r + offsetX;
        const z = Math.sin(theta) * rz * r + offsetZ;

        const nx = Math.cos(theta);
        const ny = 0;
        const nz = Math.sin(theta);

        const u = i / armRadial;
        const v = frac * 0.7;

        const idx = addVertex(x, y, z, nx, ny, nz, u, v, bA, wA, bB, wB);
        row.push(idx);
      }
      bodyGrid.push(row);
    }

    // Build body mesh faces
    for (let j = 0; j < armHeightSegs; j++) {
      for (let i = 0; i < armRadial; i++) {
        const a = bodyGrid[j][i];
        const b = bodyGrid[j + 1][i];
        const c = bodyGrid[j + 1][i + 1];
        const d = bodyGrid[j][i + 1];
        indices.push(a, b, d);
        indices.push(b, c, d);
      }
    }

    // Cap the top rim of the palm seamlessly
    const topRow = bodyGrid[armHeightSegs];
    const palmCenterIdx = addVertex(0, armYMax + 0.02, 0.01, 0, 1, 0, 0.5, 0.72, 4, 1.0, 3, 0.0);
    for (let i = 0; i < armRadial; i++) {
      indices.push(palmCenterIdx, topRow[i], topRow[i + 1]);
    }

    // --- 2. ANATOMICAL KNUCKLE MOUNT SPHERES ---
    // Knuckle domes firmly rooted into the palm crest to ensure zero gaps
    function createKnuckleJoint(cx, cy, cz, radius, boneA, boneB, wA, wB) {
      const latSegs = 6;
      const lonSegs = 8;
      const kGrid = [];

      for (let j = 0; j <= latSegs; j++) {
        const row = [];
        const theta = (j / latSegs) * Math.PI;
        for (let i = 0; i <= lonSegs; i++) {
          const phi = (i / lonSegs) * Math.PI * 2;
          const nx = Math.sin(theta) * Math.cos(phi);
          const ny = Math.cos(theta);
          const nz = Math.sin(theta) * Math.sin(phi);

          const vx = cx + nx * radius;
          const vy = cy + ny * radius;
          const vz = cz + nz * radius;

          const idx = addVertex(vx, vy, vz, nx, ny, nz, i / lonSegs, 0.75, boneA, wA, boneB, wB);
          row.push(idx);
        }
        kGrid.push(row);
      }

      for (let j = 0; j < latSegs; j++) {
        for (let i = 0; i < lonSegs; i++) {
          const a = kGrid[j][i];
          const b = kGrid[j + 1][i];
          const c = kGrid[j + 1][i + 1];
          const d = kGrid[j][i + 1];
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }
    }

    // --- 3. SEAMLESS ARTICULATED FINGERS & HOOKED CLAWS ---
    fingerConfigs.forEach(fc => {
      const [bIdx1, bIdx2, bIdx3] = fc.boneIdx;
      const bList = fingerBones[fc.name];

      // Get world rest coordinates
      const p0 = new THREE.Vector3(); // Knuckle
      const p1 = new THREE.Vector3(); // PIP Joint
      const p2 = new THREE.Vector3(); // DIP Joint
      const p3 = new THREE.Vector3(); // Claw Tip

      bList[0].getWorldPosition(p0);
      bList[1].getWorldPosition(p1);
      bList[2].getWorldPosition(p2);

      // Claw tip extends naturally past distal bone
      const dirClaw = new THREE.Vector3().subVectors(p2, p1).normalize();
      p3.copy(p2).addScaledVector(dirClaw, fc.name === 'thumb' ? 0.16 : 0.18);
      // Hook claw forward toward palm
      p3.add(new THREE.Vector3(...fc.tipRel));

      // Build knuckle dome connecting directly to palm
      createKnuckleJoint(p0.x, p0.y, p0.z, fc.rBase * 1.05, 4, bIdx1, 0.65, 0.35);

      // Joint 1 Dome
      createKnuckleJoint(p1.x, p1.y, p1.z, fc.rMid * 1.1, bIdx1, bIdx2, 0.5, 0.5);

      // Joint 2 Dome
      createKnuckleJoint(p2.x, p2.y, p2.z, fc.rMid * 0.95, bIdx2, bIdx3, 0.5, 0.5);

      // 3 Phalanx tubular segments
      const segs = [
        { start: p0, end: p1, boneA: 4, boneB: bIdx1, wBase: 0.35, wEnd: 0.95, r0: fc.rBase, r1: fc.rMid, knobby: 0.015 },
        { start: p1, end: p2, boneA: bIdx1, boneB: bIdx2, wBase: 0.5, wEnd: 0.95, r0: fc.rMid, r1: fc.rMid * 0.85, knobby: 0.012 },
        { start: p2, end: p3, boneA: bIdx2, boneB: bIdx3, wBase: 0.5, wEnd: 1.0, r0: fc.rMid * 0.85, r1: fc.rTip, isClaw: true }
      ];

      segs.forEach(seg => {
        const sLayers = 6;
        const sRadial = 12;
        const sGrid = [];

        const axis = new THREE.Vector3().subVectors(seg.end, seg.start);
        const len = axis.length();
        axis.normalize();

        let up = new THREE.Vector3(0, 0, 1);
        if (Math.abs(axis.dot(up)) > 0.9) up.set(1, 0, 0);
        const sideX = new THREE.Vector3().crossVectors(axis, up).normalize();
        const sideZ = new THREE.Vector3().crossVectors(axis, sideX).normalize();

        for (let j = 0; j <= sLayers; j++) {
          const row = [];
          const frac = j / sLayers;
          const center = new THREE.Vector3().copy(seg.start).addScaledVector(axis, len * frac);

          let r = THREE.MathUtils.lerp(seg.r0, seg.r1, frac);
          if (seg.knobby && frac < 0.3) {
            r += seg.knobby * Math.sin((frac / 0.3) * Math.PI);
          }

          // Claw curvature
          if (seg.isClaw && frac > 0.3) {
            const hookAmt = Math.pow((frac - 0.3) / 0.7, 2) * 0.06;
            center.addScaledVector(sideZ, hookAmt);
          }

          const curWeightB = THREE.MathUtils.lerp(seg.wBase, seg.wEnd, frac);
          const curWeightA = 1.0 - curWeightB;

          for (let i = 0; i <= sRadial; i++) {
            const theta = (i / sRadial) * Math.PI * 2;
            const rx = Math.cos(theta) * r;
            const rz = Math.sin(theta) * r;

            const vx = center.x + sideX.x * rx + sideZ.x * rz;
            const vy = center.y + sideX.y * rx + sideZ.y * rz;
            const vz = center.z + sideX.z * rx + sideZ.z * rz;

            const nx = sideX.x * Math.cos(theta) + sideZ.x * Math.sin(theta);
            const ny = sideX.y * Math.cos(theta) + sideZ.y * Math.sin(theta);
            const nz = sideX.z * Math.cos(theta) + sideZ.z * Math.sin(theta);

            const u = (fc.boneIdx[0] + i / sRadial) / 20;
            const v = 0.8 + frac * 0.2;

            const idx = addVertex(vx, vy, vz, nx, ny, nz, u, v, seg.boneA, curWeightA, seg.boneB, curWeightB);
            row.push(idx);
          }
          sGrid.push(row);
        }

        for (let j = 0; j < sLayers; j++) {
          for (let i = 0; i < sRadial; i++) {
            const a = sGrid[j][i];
            const b = sGrid[j + 1][i];
            const c = sGrid[j + 1][i + 1];
            const d = sGrid[j][i + 1];
            indices.push(a, b, d);
            indices.push(b, c, d);
          }
        }
      });
    });

    // Build unified SkinnedMesh BufferGeometry
    const armGeometry = new THREE.BufferGeometry();
    armGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    armGeometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    armGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    armGeometry.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
    armGeometry.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));
    armGeometry.setIndex(indices);
    armGeometry.computeVertexNormals();

    const armMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.skinColor),
      map: skinTex,
      bumpMap: skinBumpTex,
      bumpScale: 0.04,
      roughness: params.roughness,
      metalness: params.metalness,
      roughnessMap: skinBumpTex
    });

    const skeleton = new THREE.Skeleton(bones);
    const skinnedZombieArm = new THREE.SkinnedMesh(armGeometry, armMaterial);
    skinnedZombieArm.castShadow = true;
    skinnedZombieArm.receiveShadow = true;

    skinnedZombieArm.add(boneRoot);
    skinnedZombieArm.bind(skeleton);
    scene.add(skinnedZombieArm);

    // ==========================================
    // MOUND OF EARTH & BROKEN SOIL
    // ==========================================
    const moundRadius = 3.2;
    const moundGeo = new THREE.CylinderGeometry(0.38, moundRadius, 0.55, 48, 12, false);
    moundGeo.translate(0, -0.22, 0);

    const mPos = moundGeo.attributes.position;
    for (let i = 0; i < mPos.count; i++) {
      let x = mPos.getX(i);
      let y = mPos.getY(i);
      let z = mPos.getZ(i);

      const r = Math.sqrt(x * x + z * z);

      if (r < 0.55) {
        y -= (0.55 - r) * 0.95;
      } else if (r < 1.8) {
        y += Math.sin((r - 0.55) / 1.25 * Math.PI) * 0.38;
      }

      const noise = (Math.sin(x * 9) * Math.cos(z * 9) + Math.sin(x * 17 + z * 12) * 0.5) * 0.045;
      y += noise;

      mPos.setY(i, y);
    }
    moundGeo.computeVertexNormals();

    const moundMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.dirtColor),
      map: soilTex,
      bumpMap: soilTex,
      bumpScale: 0.06,
      roughness: 0.95,
      metalness: 0.05
    });

    const moundMesh = new THREE.Mesh(moundGeo, moundMat);
    moundMesh.receiveShadow = true;
    moundMesh.castShadow = true;
    scene.add(moundMesh);

    const groundGeo = new THREE.PlaneGeometry(16, 16, 32, 32);
    groundGeo.rotateX(-Math.PI / 2);
    groundGeo.translate(0, -0.45, 0);
    const groundMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.dirtColor).multiplyScalar(0.7),
      roughness: 0.98,
      metalness: 0.02
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    // ==========================================
    // INSTANCEDMESH DIRT CHUNKS WITH BAKED AO
    // ==========================================
    const rockGeo = new THREE.DodecahedronGeometry(0.12, 1);
    const rPos = rockGeo.attributes.position;
    const aoColors = [];

    for (let i = 0; i < rPos.count; i++) {
      let vx = rPos.getX(i);
      let vy = rPos.getY(i);
      let vz = rPos.getZ(i);

      const pScale = 0.85 + Math.random() * 0.35;
      vx *= pScale;
      vy *= pScale;
      vz *= pScale;
      rPos.setXYZ(i, vx, vy, vz);

      const localAO = THREE.MathUtils.clamp(0.35 + 0.65 * (vy + 0.12) / 0.24, 0.2, 1.0);
      aoColors.push(localAO, localAO, localAO);
    }
    rockGeo.setAttribute('color', new THREE.Float32BufferAttribute(aoColors, 3));
    rockGeo.computeVertexNormals();

    const chunkCount = 220;
    const chunkMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.chunkColor),
      vertexColors: true,
      roughness: 0.92,
      metalness: 0.08
    });

    const instancedDirtChunks = new THREE.InstancedMesh(rockGeo, chunkMat, chunkCount);
    instancedDirtChunks.castShadow = true;
    instancedDirtChunks.receiveShadow = true;

    const dummy = new THREE.Object3D();
    const chunkBaseColor = new THREE.Color(params.chunkColor);

    function setupDirtChunks() {
      for (let i = 0; i < chunkCount; i++) {
        let r, theta, y;
        if (i < 130) {
          r = 0.28 + Math.random() * 0.65;
          theta = Math.random() * Math.PI * 2;
          y = -0.05 + Math.random() * 0.32 - (r < 0.45 ? (0.45 - r) * 0.8 : 0);
        } else {
          r = 0.85 + Math.random() * 1.5;
          theta = Math.random() * Math.PI * 2;
          y = 0.18 - (r - 0.85) * 0.28 + (Math.random() - 0.5) * 0.08;
        }

        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r;

        dummy.position.set(x, y, z);
        dummy.rotation.set(
          (Math.random() - 0.5) * 0.5,
          Math.random() * Math.PI * 2,
          (Math.random() - 0.5) * 0.5
        );

        const baseScale = i < 80 ? 0.9 + Math.random() * 0.9 : 0.4 + Math.random() * 0.7;
        dummy.scale.set(
          baseScale * (0.8 + Math.random() * 0.5),
          baseScale * (0.7 + Math.random() * 0.6),
          baseScale * (0.8 + Math.random() * 0.5)
        );

        dummy.updateMatrix();
        instancedDirtChunks.setMatrixAt(i, dummy.matrix);

        const instanceAO = THREE.MathUtils.clamp(0.45 + 0.55 * (r / 2.2), 0.3, 1.0);
        const col = chunkBaseColor.clone().multiplyScalar(instanceAO);
        instancedDirtChunks.setColorAt(i, col);
      }
      instancedDirtChunks.instanceMatrix.needsUpdate = true;
      if (instancedDirtChunks.instanceColor) instancedDirtChunks.instanceColor.needsUpdate = true;
    }

    setupDirtChunks();
    scene.add(instancedDirtChunks);

    // ==========================================
    // FLOATING SPORES / PARTICLES
    // ==========================================
    const sporeCount = 180;
    const sporeGeo = new THREE.BufferGeometry();
    const sporePositions = new Float32Array(sporeCount * 3);
    const sporeVelocities = [];

    for (let i = 0; i < sporeCount; i++) {
      sporePositions[i * 3 + 0] = (Math.random() - 0.5) * 4.5;
      sporePositions[i * 3 + 1] = Math.random() * 3.2;
      sporePositions[i * 3 + 2] = (Math.random() - 0.5) * 4.5;
      sporeVelocities.push({
        vy: 0.002 + Math.random() * 0.004,
        vx: (Math.random() - 0.5) * 0.002,
        vz: (Math.random() - 0.5) * 0.002
      });
    }
    sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePositions, 3));

    const sporeMat = new THREE.PointsMaterial({
      color: new THREE.Color(params.lightColor1),
      size: 0.035,
      transparent: true,
      opacity: 0.55,
      blending: THREE.AdditiveBlending
    });
    const sporePoints = new THREE.Points(sporeGeo, sporeMat);
    scene.add(sporePoints);

    // ==========================================
    // 8 PRECONFIGURED ANIMATIONS (KEYFRAME TRACKS)
    // ==========================================
    const mixer = new THREE.AnimationMixer(skinnedZombieArm);
    const actions = {};

    function buildZombieAnimationClip(clipName, duration, generator) {
      const tracks = [];
      const numFrames = 30;
      const times = [];
      for (let i = 0; i <= numFrames; i++) {
        times.push((i / numFrames) * duration);
      }

      const rootPosValues = [];
      const wristRotValues = [];
      const lowerRotValues = [];
      const upperRotValues = [];
      const palmRotValues = [];
      const fingerTracks = {};
      fingerConfigs.forEach(f => {
        fingerTracks[`bone_${f.name}_1.quaternion`] = [];
        fingerTracks[`bone_${f.name}_2.quaternion`] = [];
        fingerTracks[`bone_${f.name}_3.quaternion`] = [];
      });

      const tempEuler = new THREE.Euler();
      const tempQuat = new THREE.Quaternion();

      times.forEach(t => {
        const progress = t / duration;
        const pose = generator(progress);

        rootPosValues.push(0, pose.rootY, 0);

        tempEuler.set(pose.lowerRotX || 0, pose.lowerRotY || 0, pose.lowerRotZ || 0);
        tempQuat.setFromEuler(tempEuler);
        lowerRotValues.push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);

        tempEuler.set(pose.upperRotX || 0, pose.upperRotY || 0, pose.upperRotZ || 0);
        tempQuat.setFromEuler(tempEuler);
        upperRotValues.push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);

        tempEuler.set(pose.wristRotX || 0, pose.wristRotY || 0, pose.wristRotZ || 0);
        tempQuat.setFromEuler(tempEuler);
        wristRotValues.push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);

        tempEuler.set(pose.palmRotX || 0, pose.palmRotY || 0, pose.palmRotZ || 0);
        tempQuat.setFromEuler(tempEuler);
        palmRotValues.push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);

        fingerConfigs.forEach(f => {
          const curl = pose.curls[f.name] || 0;
          const splay = pose.splays ? (pose.splays[f.name] || 0) : 0;

          if (f.name === 'thumb') {
            // Thumb curls inward toward palm center (+X and +Z)
            tempEuler.set(0.3 + curl * 0.7, 0.4 + curl * 0.6, -0.4 - curl * 0.3);
            tempQuat.setFromEuler(tempEuler);
            fingerTracks[`bone_${f.name}_1.quaternion`].push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);

            tempEuler.set(curl * 0.85, 0.2 * curl, 0);
            tempQuat.setFromEuler(tempEuler);
            fingerTracks[`bone_${f.name}_2.quaternion`].push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);

            tempEuler.set(curl * 1.1, 0, 0);
            tempQuat.setFromEuler(tempEuler);
            fingerTracks[`bone_${f.name}_3.quaternion`].push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);
          } else {
            // 4 Fingers curl forward towards viewer (+X rotation)
            tempEuler.set(curl * 0.85, 0, splay);
            tempQuat.setFromEuler(tempEuler);
            fingerTracks[`bone_${f.name}_1.quaternion`].push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);

            tempEuler.set(curl * 0.95, 0, 0);
            tempQuat.setFromEuler(tempEuler);
            fingerTracks[`bone_${f.name}_2.quaternion`].push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);

            tempEuler.set(curl * 1.15, 0, 0);
            tempQuat.setFromEuler(tempEuler);
            fingerTracks[`bone_${f.name}_3.quaternion`].push(tempQuat.x, tempQuat.y, tempQuat.z, tempQuat.w);
          }
        });
      });

      tracks.push(new THREE.VectorKeyframeTrack('bone_root.position', times, rootPosValues));
      tracks.push(new THREE.QuaternionKeyframeTrack('bone_lower.quaternion', times, lowerRotValues));
      tracks.push(new THREE.QuaternionKeyframeTrack('bone_upper.quaternion', times, upperRotValues));
      tracks.push(new THREE.QuaternionKeyframeTrack('bone_wrist.quaternion', times, wristRotValues));
      tracks.push(new THREE.QuaternionKeyframeTrack('bone_palm.quaternion', times, palmRotValues));

      for (const trackName in fingerTracks) {
        tracks.push(new THREE.QuaternionKeyframeTrack(trackName, times, fingerTracks[trackName]));
      }

      return new THREE.AnimationClip(clipName, duration, tracks);
    }

    // 1: Burst & Claw Grip (Default: rhythmic surge upward, claw clenches tight, shakes, relaxes, sinks back)
    const clipBurst = buildZombieAnimationClip('Burst & Claw Grip', 6.0, (u) => {
      const thrust = Math.sin(u * Math.PI);
      const rootY = -1.65 + Math.pow(thrust, 1.4) * 0.65;
      const clench = Math.pow(thrust, 2.2);
      const curl = THREE.MathUtils.lerp(-0.20, 1.30, clench);
      const tremor = Math.sin(u * Math.PI * 24) * 0.03 * thrust;

      return {
        rootY,
        wristRotX: 0.12 + clench * 0.38 + tremor,
        wristRotY: Math.sin(u * Math.PI * 2) * 0.18,
        wristRotZ: Math.cos(u * Math.PI * 2) * 0.08,
        curls: { thumb: curl * 0.9, index: curl, middle: curl * 1.05, ring: curl, pinky: curl * 0.95 },
        splays: { thumb: -0.15 * (1 - clench), index: -0.1 * (1 - clench), middle: 0, ring: 0.1 * (1 - clench), pinky: 0.18 * (1 - clench) }
      };
    });

    // 2: Slow Desperate Claw
    const clipSlowClaw = buildZombieAnimationClip('Slow Desperate Claw', 8.0, (u) => {
      const p = Math.sin(u * Math.PI);
      const rootY = -1.45 + p * 0.45;
      const curl = THREE.MathUtils.lerp(0.1, 1.15, Math.pow(p, 1.6));
      return {
        rootY,
        wristRotX: Math.sin(u * Math.PI * 2) * 0.30,
        wristRotY: Math.cos(u * Math.PI * 2) * 0.22,
        curls: {
          thumb: curl * 0.85,
          index: curl * (0.9 + Math.sin(u * Math.PI * 4) * 0.15),
          middle: curl * (1.0 + Math.sin(u * Math.PI * 4 + 1) * 0.15),
          ring: curl * (0.95 + Math.sin(u * Math.PI * 4 + 2) * 0.15),
          pinky: curl * (0.85 + Math.sin(u * Math.PI * 4 + 3) * 0.15)
        }
      };
    });

    // 3: Restless Twitch & Struggle
    const clipTwitch = buildZombieAnimationClip('Restless Twitch & Struggle', 4.5, (u) => {
      const rootY = -1.15 + Math.sin(u * Math.PI * 2) * 0.08;
      const spasm = Math.sin(u * Math.PI * 18) * 0.15 + Math.sin(u * Math.PI * 32) * 0.08;
      const curl = 0.75 + spasm * 0.45;
      return {
        rootY,
        wristRotX: 0.32 + spasm * 0.25,
        wristRotY: Math.sin(u * Math.PI * 2) * 0.25,
        curls: { thumb: curl * 0.9, index: curl, middle: curl * 1.1, ring: curl, pinky: curl * 0.9 }
      };
    });

    // 4: Eerie Reaching Lurk
    const clipLurk = buildZombieAnimationClip('Eerie Reaching Lurk', 5.5, (u) => {
      const rootY = -1.35 + Math.sin(u * Math.PI * 2) * 0.12;
      const crawl1 = Math.sin(u * Math.PI * 2);
      const crawl2 = Math.cos(u * Math.PI * 2);
      return {
        rootY,
        wristRotX: 0.55 + crawl1 * 0.18,
        wristRotY: crawl2 * 0.30,
        curls: {
          thumb: 0.4 + crawl1 * 0.3,
          index: 0.5 + crawl2 * 0.4,
          middle: 0.6 - crawl1 * 0.4,
          ring: 0.5 - crawl2 * 0.4,
          pinky: 0.4 + crawl1 * 0.3
        }
      };
    });

    // 5: Deep Grave Resurrect
    const clipResurrect = buildZombieAnimationClip('Deep Grave Resurrect', 7.0, (u) => {
      const surge = Math.pow(Math.sin(u * Math.PI), 1.8);
      const rootY = -1.85 + surge * 0.95;
      const curl = THREE.MathUtils.lerp(-0.30, 1.35, Math.pow(surge, 2));
      return {
        rootY,
        wristRotX: THREE.MathUtils.lerp(-0.15, 0.45, surge),
        wristRotZ: Math.sin(u * Math.PI * 2) * 0.22,
        curls: { thumb: curl * 0.85, index: curl, middle: curl * 1.1, ring: curl, pinky: curl * 0.9 }
      };
    });

    // 6: Spectral Convulsion
    const clipConvulsion = buildZombieAnimationClip('Spectral Convulsion', 4.0, (u) => {
      const wave = Math.sin(u * Math.PI * 4);
      const rootY = -1.18 + wave * 0.06;
      return {
        rootY,
        wristRotX: 0.28 + wave * 0.22,
        wristRotZ: Math.cos(u * Math.PI * 4) * 0.18,
        curls: {
          thumb: 0.6 + Math.sin(u * Math.PI * 4) * 0.35,
          index: 0.6 + Math.sin(u * Math.PI * 4 + 0.8) * 0.35,
          middle: 0.6 + Math.sin(u * Math.PI * 4 + 1.6) * 0.35,
          ring: 0.6 + Math.sin(u * Math.PI * 4 + 2.4) * 0.35,
          pinky: 0.6 + Math.sin(u * Math.PI * 4 + 3.2) * 0.35
        }
      };
    });

    // 7: Hypnotic Finger Cascade
    const clipCascade = buildZombieAnimationClip('Hypnotic Finger Cascade', 5.0, (u) => {
      const rootY = -1.12 + Math.sin(u * Math.PI * 2) * 0.05;
      const w = u * Math.PI * 2;
      return {
        rootY,
        wristRotX: 0.18 + Math.sin(w) * 0.15,
        wristRotY: Math.cos(w) * 0.18,
        curls: {
          pinky: 0.6 + Math.sin(w) * 0.55,
          ring: 0.6 + Math.sin(w + 0.8) * 0.55,
          middle: 0.6 + Math.sin(w + 1.6) * 0.55,
          index: 0.6 + Math.sin(w + 2.4) * 0.55,
          thumb: 0.6 + Math.sin(w + 3.2) * 0.55
        }
      };
    });

    // 8: Frozen Relic (Static posed clutching hand, no camera movement)
    const clipStatic = buildZombieAnimationClip('Frozen Relic (Static / Posed)', 1.0, () => {
      return {
        rootY: -1.05,
        wristRotX: 0.38,
        wristRotY: 0.12,
        wristRotZ: -0.06,
        curls: { thumb: 1.05, index: 1.25, middle: 1.35, ring: 1.25, pinky: 1.15 }
      };
    });

    const clips = [
      clipBurst,
      clipSlowClaw,
      clipTwitch,
      clipLurk,
      clipResurrect,
      clipConvulsion,
      clipCascade,
      clipStatic
    ];

    clips.forEach(clip => {
      const action = mixer.clipAction(clip);
      action.setLoop(THREE.LoopRepeat);
      actions[clip.name] = action;
    });

    let currentAction = actions[params.animation];
    currentAction.play();

    function playAnimation(name, crossFadeDuration = 0.6) {
      const newAction = actions[name];
      if (!newAction || newAction === currentAction) return;

      newAction.reset();
      newAction.timeScale = params.speed;
      newAction.play();

      if (currentAction) {
        currentAction.crossFadeTo(newAction, crossFadeDuration, true);
      }
      currentAction = newAction;

      if (name === 'Frozen Relic (Static / Posed)') {
        controls.autoRotate = false;
        params.autoRotateCamera = false;
      }
    }

    // ==========================================
    // THEME & COLOR UPDATES
    // ==========================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.skinColor = scheme.skin;
      params.skinShadowColor = scheme.shadow;
      params.dirtColor = scheme.mound;
      params.chunkColor = scheme.dirt;
      params.clawColor = scheme.claws;
      params.lightColor1 = scheme.light1;
      params.lightColor2 = scheme.light2;
      params.bgColor = scheme.fogBg;

      updateAllMaterialsAndLighting();
    }

    function updateAllMaterialsAndLighting() {
      armMaterial.color.set(params.skinColor);
      moundMat.color.set(params.dirtColor);
      groundMat.color.set(new THREE.Color(params.dirtColor).multiplyScalar(0.7));

      chunkMat.color.set(params.chunkColor);
      const chunkBase = new THREE.Color(params.chunkColor);
      for (let i = 0; i < chunkCount; i++) {
        const instanceAO = 0.45 + (i < 130 ? 0.25 : 0.55) * Math.random();
        instancedDirtChunks.setColorAt(i, chunkBase.clone().multiplyScalar(instanceAO));
      }
      if (instancedDirtChunks.instanceColor) {
        instancedDirtChunks.instanceColor.needsUpdate = true;
      }

      keyLight.color.set(params.lightColor1);
      rimLight.color.set(params.lightColor2);
      pitLight.color.set(params.lightColor2);
      sporeMat.color.set(params.lightColor1);

      if (params.greenScreen) {
        scene.background.set('#00ff00');
        scene.fog.color.set('#00ff00');
        renderer.setClearColor('#00ff00', 1);
      } else {
        scene.background.set(params.bgColor);
        scene.fog.color.set(params.bgColor);
        renderer.setClearColor(params.bgColor, 1);
      }
    }

    // ==========================================
    // PROCEDURAL RANDOMIZER (UPON USER CLICK)
    // NOTE: DOES NOT SHUFFLE OR CHANGE POSTPROCESSING SETTINGS!
    // ==========================================
    function randomizeSceneTheme() {
      // 1. Pick a random color scheme from the 18 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // 2. Pick a random animation from the 8 animations
      const animKeys = Object.keys(actions);
      const randomAnim = animKeys[Math.floor(Math.random() * animKeys.length)];
      params.animation = randomAnim;
      playAnimation(randomAnim, 0.8);

      // 3. Re-roll geometric & motion parameters
      params.speed = 0.65 + Math.random() * 0.9;
      mixer.timeScale = params.speed;

      params.roughness = 0.5 + Math.random() * 0.4;
      armMaterial.roughness = params.roughness;

      setupDirtChunks();

      keyLight.intensity = 1.8 + Math.random() * 0.8;
      rimLight.intensity = 1.5 + Math.random() * 1.0;

      // DO NOT CHANGE POSTPROCESSOR SETTINGS ON RANDOMIZE SCENE!
      // (PostProcessor parameters are strictly preserved)

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    let pointerStartX = 0;
    let pointerStartY = 0;
    let pointerStartTime = 0;

    canvas.addEventListener('pointerdown', (e) => {
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
      pointerStartTime = performance.now();
    });

    canvas.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
      const duration = performance.now() - pointerStartTime;

      if (dist < 6 && duration < 350 && params.clickToRandomize) {
        randomizeSceneTheme();
      }
    });

    // ==========================================
    // LIL-GUI SETUP (DEFAULT STYLES)
    // ==========================================
    const gui = new GUI({ title: 'Zombie Arm Settings' });

    gui.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Color Scheme')
      .onChange((v) => {
        applyColorScheme(v);
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      });

    gui.add(params, 'animation', Object.keys(actions))
      .name('Animation')
      .onChange((v) => playAnimation(v));

    gui.add(params, 'greenScreen')
      .name('Greenscreen (#00ff00)')
      .onChange(() => updateAllMaterialsAndLighting());

    gui.add(params, 'dpr', 0.5, 3.0, 0.1)
      .name('Pixel Ratio (DPR)')
      .onChange((v) => {
        renderer.setPixelRatio(v);
        postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      });

    gui.add(params, 'speed', 0.1, 3.0, 0.05)
      .name('Animation Speed')
      .onChange((v) => {
        mixer.timeScale = v;
      });

    gui.add(params, 'clickToRandomize')
      .name('Click to Randomize');

    gui.add(params, 'autoRotateCamera')
      .name('Orbit Camera')
      .onChange((v) => {
        controls.autoRotate = v;
      });

    const colorFolder = gui.addFolder('Custom Colors');
    colorFolder.addColor(params, 'skinColor').name('Zombie Skin').onChange(() => updateAllMaterialsAndLighting());
    colorFolder.addColor(params, 'skinShadowColor').name('Skin Decay Shadow').onChange(() => updateAllMaterialsAndLighting());
    colorFolder.addColor(params, 'dirtColor').name('Soil Mound').onChange(() => updateAllMaterialsAndLighting());
    colorFolder.addColor(params, 'chunkColor').name('Dirt Chunks').onChange(() => updateAllMaterialsAndLighting());
    colorFolder.addColor(params, 'clawColor').name('Claws / Nails').onChange(() => updateAllMaterialsAndLighting());
    colorFolder.addColor(params, 'lightColor1').name('Key Light').onChange(() => updateAllMaterialsAndLighting());
    colorFolder.addColor(params, 'lightColor2').name('Rim & Grave Glow').onChange(() => updateAllMaterialsAndLighting());
    colorFolder.addColor(params, 'bgColor').name('Background / Fog').onChange(() => updateAllMaterialsAndLighting());
    colorFolder.close();

    const matFolder = gui.addFolder('Material & Decay');
    matFolder.add(params, 'roughness', 0.1, 1.0, 0.02).name('Skin Roughness').onChange(v => armMaterial.roughness = v);
    matFolder.add(params, 'metalness', 0.0, 1.0, 0.02).name('Skin Metalness').onChange(v => armMaterial.metalness = v);
    matFolder.close();

    // Attach PostProcessor GUI controls
    postProcessor.attachGUI(gui, 'Post-Processing Suite');

    // ==========================================
    // KEYBOARD SHORTCUT: "H" TO HIDE/SHOW UI
    // ==========================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
          gui.domElement.style.display = '';
        } else {
          gui.hide();
          gui.domElement.style.display = 'none';
        }
      }
    });

    // ==========================================
    // WINDOW RESIZE HANDLING
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, renderer.getPixelRatio());
    });

    // ==========================================
    // RENDER / ANIMATION LOOP
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      mixer.update(delta);

      const posArr = sporeGeo.attributes.position.array;
      for (let i = 0; i < sporeCount; i++) {
        posArr[i * 3 + 1] += sporeVelocities[i].vy;
        posArr[i * 3 + 0] += sporeVelocities[i].vx;
        posArr[i * 3 + 2] += sporeVelocities[i].vz;
        if (posArr[i * 3 + 1] > 3.5) {
          posArr[i * 3 + 1] = 0.05;
          posArr[i * 3 + 0] = (Math.random() - 0.5) * 3.5;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 3.5;
        }
      }
      sporeGeo.attributes.position.needsUpdate = true;

      controls.update();

      // Render via PostProcessor pipeline
      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();
  </script>
</body>
</html>
