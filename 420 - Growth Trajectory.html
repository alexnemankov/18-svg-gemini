<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growth Trajectory & Financial Metric Bar Surge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined for standalone file:// and http:// execution)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0
    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);
      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      
      vec3 exposedColor = finalCol * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      
      if (crtIntensity > 0.0001) {
        float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
        finalCol -= scanline;
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.85, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,

          // 1. Bloom
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.85,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.22,

          // 2. Godrays
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.75,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
          raysColor: new THREE.Color(0x00f5d4),
          raysColorHex: '#00f5d4',

          // 3. Anamorphic Flare (Default is OFF per instruction)
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: new THREE.Color(0x00f5d4),
          anamorphicColorHex: '#00f5d4',

          // 4. Optics & Film Grain
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.012,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.008,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          // 5. Grading
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.sunScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.sunInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.sunScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },

            thermalSensitivity: { value: 1.4 },
            nightVisionGain: { value: 2.1 },
            nightVisionNoise: { value: 0.05 },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.sunInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        // Atmospheric Bloom
        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        // Anamorphic Flare (Default is OFF)
        const anamorphic = root.addFolder("Three.js Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Streak Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        // Lens, Optics & Tone
        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "chromaticAberration", 0, 0.1, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.05, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.5, 1.8, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.4, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.6, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }

      'Chronological Wave',
      'Spline Flow Tracer',
      'Elevated Cinematic Pan',
      'Financial Heartbeat / Pulse',
      'Spiral Horizon Ascend',
      'Floating Drone Hover',
      'Static Studio (No Camera Movement)'
    ];

    // Global Scene Parameters
    const params = {
      // Color & Palette
      colorScheme: 'Original',
      greenscreen: false,
      showPlane: true, // Opportunity to turn off plane

      pillarColor: PALETTES['Original'].pillar,
      capColor: PALETTES['Original'].pillarCap,
      splineColor: PALETTES['Original'].spline,
      accentColor: PALETTES['Original'].accent,
      gridColor: PALETTES['Original'].grid,

      // Geometry & Metrics
      pillarCount: 24,
      basePillarWidth: 1.45,
      pillarSpacing: 2.6,
      growthExponent: 1.45,
      maxHeight: 18.5,
      minHeight: 2.4,
      surgeAmplitude: 0.28,
      waveFrequency: 0.35,
      splineElevation: 1.8,
      splineRadius: 0.18,

      // Animation
      animationMode: 'Gentle Orbit & Surge',
      animSpeed: 1.0,

      // Rendering & Exposure
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      exposure: 1.25,
      fogDensity: 0.012,

      // Studio Lighting
      ambientIntensity: 0.7,
      ambientColor: '#ffffff',
      keyLightIntensity: 2.6,
      keyLightColor: PALETTES['Original'].lightKey,
      fillLightIntensity: 1.5,
      fillLightColor: PALETTES['Original'].lightFill,
      accentLightIntensity: 3.2,
      accentLightColor: PALETTES['Original'].lightAccent,

      // Interactivity
      clickRandomize: true
    };

    // Core Variables
    const container = document.getElementById('canvas-container');
    let scene, camera, renderer, controls, gui, postProcessor;
    let ambientLight, keyLight, fillLight, accentPointLight;
    let floorGrid, shadowPlane, basePlatesGroup, pillarsGroup, splineMesh, beaconNodesGroup, dataPacketsGroup;
    let pillarMeshes = [];
    let beaconNodes = [];
    let packetParticles = [];
    let splinePoints = [];
    let clock = new THREE.Clock();

    const defaultCameraPos = new THREE.Vector3(28, 22, 38);
    const defaultTargetPos = new THREE.Vector3(0, 7.5, 0);
    let animTime = 0;

    // Studio Environment Generator for Rich Metallic Reflections
    function createStudioEnvironment(targetRenderer) {
      const pmremGenerator = new THREE.PMREMGenerator(targetRenderer);
      pmremGenerator.compileEquirectangularShader();

      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, 256);
      bgGrad.addColorStop(0, '#334155');
      bgGrad.addColorStop(0.35, '#1e293b');
      bgGrad.addColorStop(0.7, '#0f172a');
      bgGrad.addColorStop(1, '#020617');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 256);

      const topSoftbox = ctx.createRadialGradient(256, 50, 5, 256, 50, 160);
      topSoftbox.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      topSoftbox.addColorStop(0.4, 'rgba(224, 242, 254, 0.45)');
      topSoftbox.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = topSoftbox;
      ctx.fillRect(0, 0, 512, 220);

      const sideRim = ctx.createRadialGradient(90, 120, 10, 90, 120, 110);
      sideRim.addColorStop(0, 'rgba(186, 230, 253, 0.6)');
      sideRim.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = sideRim;
      ctx.fillRect(0, 0, 220, 256);

      const tex = new THREE.CanvasTexture(canvas);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      const env = pmremGenerator.fromEquirectangular(tex).texture;
      pmremGenerator.dispose();
      tex.dispose();
      return env;
    }

    // Initialize Application
    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 500);
      camera.position.copy(defaultCameraPos);

      createRenderer(params.antialias);
      scene.environment = createStudioEnvironment(renderer);

      setupControls();
      setupLighting();
      buildEnvironment();
      buildPillarsAndSpline();

      // Initialize PostProcessor
      postProcessor = new PostProcessor(renderer, {
        enabled: true,
        antialias: params.antialias,
        bloomEnabled: true,
        bloomStrength: 0.85,
        bloomRadius: 0.5,
        bloomThreshold: 0.22,
        anamorphicEnabled: false, // Default is strictly OFF
        raysEnabled: false,
        chromaticAberration: 0.012,
        vignetteBoost: 1.05,
        vignetteReduction: 0.45,
        noiseIntensity: 0.008,
        gamma: 1.0
      });
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

      setupGUI();
      setupEventListeners();

      updateThemeColors(params.colorScheme);
      animate();
    }

    // Setup / Re-create Renderer
    function createRenderer(antialias) {
      if (renderer) {
        controls.dispose();
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance',
        alpha: false
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      container.appendChild(renderer.domElement);

      if (camera) {
        setupControls();
      }
      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    }

    // OrbitControls
    function setupControls() {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true; // Drag object across screen
      controls.target.copy(defaultTargetPos);
      controls.maxDistance = 220;
      controls.minDistance = 3;
    }

    // 3-Point Studio Lighting
    function setupLighting() {
      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
      scene.add(ambientLight);

      keyLight = new THREE.DirectionalLight(params.keyLightColor, params.keyLightIntensity);
      keyLight.position.set(35, 50, 30);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 0.5;
      keyLight.shadow.camera.far = 160;
      keyLight.shadow.camera.left = -45;
      keyLight.shadow.camera.right = 45;
      keyLight.shadow.camera.top = 45;
      keyLight.shadow.camera.bottom = -45;
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);

      fillLight = new THREE.DirectionalLight(params.fillLightColor, params.fillLightIntensity);
      fillLight.position.set(-30, 25, -25);
      scene.add(fillLight);

      accentPointLight = new THREE.PointLight(params.accentLightColor, params.accentLightIntensity, 90, 1.2);
      accentPointLight.position.set(16, 24, 6);
      scene.add(accentPointLight);
    }

    // Environment & Floor Plane
    function buildEnvironment() {
      // Floor Grid
      floorGrid = new THREE.GridHelper(90, 45, params.splineColor, params.gridColor);
      floorGrid.position.y = 0;
      floorGrid.visible = params.showPlane;
      scene.add(floorGrid);

      // Floor Shadow Receiver
      const shadowPlaneGeo = new THREE.PlaneGeometry(120, 120);
      const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.5 });
      shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = -0.01;
      shadowPlane.receiveShadow = true;
      shadowPlane.visible = params.showPlane;
      scene.add(shadowPlane);
    }

    // Build Premium Beveled Pillars & Luminous Spline
    function buildPillarsAndSpline() {
      if (pillarsGroup) scene.remove(pillarsGroup);
      if (basePlatesGroup) scene.remove(basePlatesGroup);
      if (splineMesh) scene.remove(splineMesh);
      if (beaconNodesGroup) scene.remove(beaconNodesGroup);
      if (dataPacketsGroup) scene.remove(dataPacketsGroup);

      pillarsGroup = new THREE.Group();
      basePlatesGroup = new THREE.Group();
      beaconNodesGroup = new THREE.Group();
      dataPacketsGroup = new THREE.Group();
      pillarMeshes = [];
      beaconNodes = [];
      packetParticles = [];
      splinePoints = [];

      const count = params.pillarCount;
      const totalWidth = (count - 1) * params.pillarSpacing;
      const startX = -totalWidth / 2;

      // Base Pillar Geometries
      const unitBoxGeo = new THREE.BoxGeometry(1, 1, 1);
      const capRimGeo = new THREE.CylinderGeometry(params.basePillarWidth * 0.72, params.basePillarWidth * 0.75, 0.22, 24);
      const capInnerGeo = new THREE.CylinderGeometry(params.basePillarWidth * 0.62, params.basePillarWidth * 0.62, 0.26, 24);
      const basePlateGeo = new THREE.CylinderGeometry(params.basePillarWidth * 0.88, params.basePillarWidth * 0.98, 0.16, 24);
      const beaconGeo = new THREE.SphereGeometry(0.32, 20, 20);

      for (let i = 0; i < count; i++) {
        const u = i / (count - 1);
        const x = startX + i * params.pillarSpacing;
        const z = Math.sin(u * Math.PI * 1.25 - 0.25) * 6.8;

        const nominalHeight = params.minHeight + (params.maxHeight - params.minHeight) * Math.pow(u, params.growthExponent);

        // Premium Physical Material for Pillar Body
        const shaftMat = new THREE.MeshPhysicalMaterial({
          color: params.pillarColor,
          roughness: 0.18,
          metalness: 0.82,
          clearcoat: 0.85,
          clearcoatRoughness: 0.12,
          reflectivity: 0.9,
          envMapIntensity: 1.4
        });
        const shaft = new THREE.Mesh(unitBoxGeo, shaftMat);
        shaft.castShadow = true;
        shaft.receiveShadow = true;
        shaft.position.set(x, nominalHeight / 2, z);
        shaft.scale.set(params.basePillarWidth, nominalHeight, params.basePillarWidth);

        // Chamfered Beveled Cap Group
        const capGroup = new THREE.Group();
        capGroup.position.set(x, nominalHeight, z);

        const capRimMat = new THREE.MeshStandardMaterial({
          color: params.pillarColor,
          roughness: 0.2,
          metalness: 0.8
        });
        const capRim = new THREE.Mesh(capRimGeo, capRimMat);
        capRim.position.y = 0.11;
        capRim.castShadow = true;
        capGroup.add(capRim);

        // Glowing Emissive Inner Cap Disc
        const capInnerMat = new THREE.MeshStandardMaterial({
          color: params.capColor,
          emissive: params.capColor,
          emissiveIntensity: 2.2, // Vibrant Bloom Target
          roughness: 0.1,
          metalness: 0.4
        });
        const capInner = new THREE.Mesh(capInnerGeo, capInnerMat);
        capInner.position.y = 0.13;
        capInner.castShadow = true;
        capGroup.add(capInner);

        // Base Pedestal
        const basePlateMat = new THREE.MeshStandardMaterial({
          color: params.gridColor,
          roughness: 0.35,
          metalness: 0.8
        });
        const basePlate = new THREE.Mesh(basePlateGeo, basePlateMat);
        basePlate.position.set(x, 0.08, z);
        basePlate.receiveShadow = true;
        basePlatesGroup.add(basePlate);

        // Floating Spline Beacon Orb
        const beaconMat = new THREE.MeshStandardMaterial({
          color: params.splineColor,
          emissive: params.splineColor,
          emissiveIntensity: 2.8,
          roughness: 0.05,
          metalness: 0.95
        });
        const beacon = new THREE.Mesh(beaconGeo, beaconMat);
        beacon.position.set(x, nominalHeight + params.splineElevation, z);
        beaconNodesGroup.add(beacon);
        beaconNodes.push(beacon);

        // Drop laser line
        const dropLineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(x, nominalHeight, z),
          new THREE.Vector3(x, nominalHeight + params.splineElevation, z)
        ]);
        const dropLineMat = new THREE.LineBasicMaterial({
          color: params.splineColor,
          transparent: true,
          opacity: 0.65
        });
        const dropLine = new THREE.Line(dropLineGeo, dropLineMat);
        beaconNodesGroup.add(dropLine);

        pillarMeshes.push({
          shaft,
          capGroup,
          capInner,
          dropLine,
          baseX: x,
          baseZ: z,
          nominalHeight: nominalHeight,
          index: i
        });

        pillarsGroup.add(shaft);
        pillarsGroup.add(capGroup);

        splinePoints.push(new THREE.Vector3(x, nominalHeight + params.splineElevation, z));
      }

      basePlatesGroup.visible = params.showPlane;
      scene.add(basePlatesGroup);
      scene.add(pillarsGroup);
      scene.add(beaconNodesGroup);

      // Floating Spline Tube
      const curve = new THREE.CatmullRomCurve3(splinePoints, false, 'centripetal', 0.5);
      const tubeGeo = new THREE.TubeGeometry(curve, count * 8, params.splineRadius, 12, false);
      const tubeMat = new THREE.MeshStandardMaterial({
        color: params.splineColor,
        emissive: params.splineColor,
        emissiveIntensity: 2.4, // Rich Optical Bloom
        roughness: 0.12,
        metalness: 0.9
      });
      splineMesh = new THREE.Mesh(tubeGeo, tubeMat);
      splineMesh.castShadow = true;
      scene.add(splineMesh);

      // Flowing Energy Photons
      const packetCount = 14;
      const packetGeo = new THREE.SphereGeometry(params.splineRadius * 1.6, 14, 14);
      const packetMat = new THREE.MeshBasicMaterial({
        color: params.accentColor
      });
      for (let p = 0; p < packetCount; p++) {
        const packet = new THREE.Mesh(packetGeo, packetMat);
        dataPacketsGroup.add(packet);
        packetParticles.push({
          mesh: packet,
          offset: p / packetCount
        });
      }
      scene.add(dataPacketsGroup);
    }

    // Dynamic Bar Elevation & Spline Flow
    function updatePillarSurge(time) {
      if (pillarMeshes.length === 0) return;

      const count = pillarMeshes.length;
      splinePoints.length = 0;

      for (let i = 0; i < count; i++) {
        const item = pillarMeshes[i];
        const u = i / (count - 1);

        let wave = 0;
        switch (params.animationMode) {
          case 'Chronological Wave':
            wave = Math.sin(time * 2.8 * params.animSpeed - i * 0.45);
            break;
          case 'Financial Heartbeat / Pulse': {
            const beat = (time * 1.8 * params.animSpeed) % (Math.PI * 2);
            wave = (Math.pow(Math.sin(beat), 12) + 0.5 * Math.pow(Math.sin(beat + 0.35), 14) - 0.2) * Math.cos(u * 1.5);
            break;
          }
          case 'Spline Flow Tracer':
            wave = Math.sin(time * 1.5 * params.animSpeed - i * 0.3) * 0.7;
            break;
          case 'Static Studio (No Camera Movement)':
            wave = Math.sin(time * 0.8 * params.animSpeed - i * 0.2) * 0.25;
            break;
          default:
            wave = Math.sin(time * 1.6 * params.animSpeed - i * params.waveFrequency);
            break;
        }

        const currentHeight = Math.max(0.8, item.nominalHeight * (1.0 + wave * params.surgeAmplitude));

        // Shaft
        item.shaft.scale.y = currentHeight;
        item.shaft.position.y = currentHeight / 2;

        // Cap Group
        item.capGroup.position.y = currentHeight;

        // Dynamic Cap Pulse
        const capPulse = 1.8 + 0.8 * Math.sin(time * 3.0 * params.animSpeed - i * 0.4);
        item.capInner.material.emissiveIntensity = capPulse;

        // Beacon & Drop Line
        const beaconY = currentHeight + params.splineElevation;
        if (beaconNodes[i]) {
          beaconNodes[i].position.y = beaconY;
          const scale = 1.0 + 0.25 * Math.sin(time * 4.0 + i);
          beaconNodes[i].scale.set(scale, scale, scale);
        }

        const linePos = item.dropLine.geometry.attributes.position;
        linePos.setXYZ(0, item.baseX, currentHeight, item.baseZ);
        linePos.setXYZ(1, item.baseX, beaconY, item.baseZ);
        linePos.needsUpdate = true;

        splinePoints.push(new THREE.Vector3(item.baseX, beaconY, item.baseZ));
      }

      // Recompute Spline Tube
      if (splineMesh && splinePoints.length > 2) {
        const curve = new THREE.CatmullRomCurve3(splinePoints, false, 'centripetal', 0.5);
        splineMesh.geometry.dispose();
        splineMesh.geometry = new THREE.TubeGeometry(curve, count * 8, params.splineRadius, 12, false);

        for (let p = 0; p < packetParticles.length; p++) {
          const pkt = packetParticles[p];
          const t = (animTime * 0.22 * params.animSpeed + pkt.offset) % 1.0;
          const pos = curve.getPointAt(t);
          pkt.mesh.position.copy(pos);

          const scale = 1.0 + 0.4 * Math.sin(animTime * 7.0 + p * 2.0);
          pkt.mesh.scale.set(scale, scale, scale);
        }
      }
    }

    // Camera Animations
    function updateCameraAnimation(time, delta) {
      if (controls.state !== -1) return;

      const count = params.pillarCount;
      const totalWidth = (count - 1) * params.pillarSpacing;
      const speed = params.animSpeed;

      switch (params.animationMode) {
        case 'Gentle Orbit & Surge': {
          const radius = 44;
          const camAngle = time * 0.18 * speed;
          camera.position.x = Math.sin(camAngle) * radius;
          camera.position.z = Math.cos(camAngle) * radius;
          camera.position.y = 19 + Math.sin(time * 0.25 * speed) * 4;
          controls.target.set(0, 8, 0);
          break;
        }
        case 'Chronological Wave': {
          const waveU = (Math.sin(time * 0.2 * speed) + 1.0) * 0.5;
          const targetX = (waveU - 0.5) * totalWidth * 0.7;
          camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetX + 18, 0.04);
          camera.position.y = 16 + Math.cos(time * 0.3 * speed) * 3;
          camera.position.z = 38 + Math.sin(time * 0.25 * speed) * 5;
          controls.target.set(targetX, 8, 0);
          break;
        }
        case 'Spline Flow Tracer': {
          const pathT = (time * 0.08 * speed) % 1.0;
          const startX = -totalWidth / 2;
          const endX = totalWidth / 2;
          const curX = THREE.MathUtils.lerp(startX, endX, pathT);
          camera.position.x = curX + 10;
          camera.position.y = 9 + pathT * 14;
          camera.position.z = 24 - pathT * 8;
          controls.target.set(curX, 7 + pathT * 10, 0);
          break;
        }
        case 'Elevated Cinematic Pan': {
          const panAngle = time * 0.12 * speed;
          camera.position.x = Math.cos(panAngle) * 36;
          camera.position.y = 26 + Math.sin(panAngle * 1.5) * 6;
          camera.position.z = Math.sin(panAngle) * 32 + 10;
          controls.target.set(0, 10, 0);
          break;
        }
        case 'Financial Heartbeat / Pulse': {
          const pulse = Math.sin(time * 1.8 * speed);
          camera.position.x = 24 + pulse * 2.5;
          camera.position.y = 17 + pulse * 1.5;
          camera.position.z = 34 + pulse * 3.5;
          controls.target.set(0, 7.5, 0);
          break;
        }
        case 'Spiral Horizon Ascend': {
          const spiralAngle = time * 0.15 * speed;
          const spiralRadius = 40 - Math.sin(time * 0.1 * speed) * 6;
          camera.position.x = Math.cos(spiralAngle) * spiralRadius;
          camera.position.z = Math.sin(spiralAngle) * spiralRadius;
          camera.position.y = 10 + ((time * 1.6 * speed) % 24);
          controls.target.set(0, 9, 0);
          break;
        }
        case 'Floating Drone Hover': {
          camera.position.x = defaultCameraPos.x + Math.sin(time * 0.35 * speed) * 5;
          camera.position.y = defaultCameraPos.y + Math.cos(time * 0.45 * speed) * 3;
          camera.position.z = defaultCameraPos.z + Math.sin(time * 0.28 * speed) * 4;
          controls.target.set(
            defaultTargetPos.x + Math.sin(time * 0.2 * speed) * 2,
            defaultTargetPos.y + Math.cos(time * 0.3 * speed) * 1.5,
            defaultTargetPos.z
          );
          break;
        }
        case 'Static Studio (No Camera Movement)': {
          camera.position.copy(defaultCameraPos);
          controls.target.copy(defaultTargetPos);
          break;
        }
      }
    }

    // Apply Color Themes
    function updateThemeColors(schemeKey) {
      const palette = PALETTES[schemeKey] || PALETTES['Original'];

      params.pillarColor = palette.pillar;
      params.capColor = palette.pillarCap;
      params.splineColor = palette.spline;
      params.accentColor = palette.accent;
      params.gridColor = palette.grid;
      params.keyLightColor = palette.lightKey;
      params.fillLightColor = palette.lightFill;
      params.accentLightColor = palette.lightAccent;

      applyColorsToScene(palette);
    }

    function applyColorsToScene(palette) {
      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
        scene.fog = null;
      } else {
        const bgCol = new THREE.Color(palette ? palette.bg : params.pillarColor);
        scene.background = bgCol;
        scene.fog = new THREE.FogExp2(bgCol, params.fogDensity);
      }

      // Respect Plane Toggle
      if (floorGrid) {
        scene.remove(floorGrid);
        floorGrid = new THREE.GridHelper(90, 45, params.splineColor, params.gridColor);
        floorGrid.position.y = 0;
        floorGrid.visible = params.showPlane;
        scene.add(floorGrid);
      }
      if (shadowPlane) {
        shadowPlane.visible = params.showPlane;
      }
      if (basePlatesGroup) {
        basePlatesGroup.visible = params.showPlane;
      }

      pillarMeshes.forEach(item => {
        item.shaft.material.color.set(params.pillarColor);
        item.capInner.material.color.set(params.capColor);
        item.capInner.material.emissive.set(params.capColor);
        item.dropLine.material.color.set(params.splineColor);
      });

      beaconNodes.forEach(beacon => {
        beacon.material.color.set(params.splineColor);
        beacon.material.emissive.set(params.splineColor);
      });

      if (splineMesh) {
        splineMesh.material.color.set(params.splineColor);
        splineMesh.material.emissive.set(params.splineColor);
      }

      packetParticles.forEach(pkt => {
        pkt.mesh.material.color.set(params.accentColor);
      });

      if (ambientLight) {
        ambientLight.color.set(params.ambientColor);
        ambientLight.intensity = params.ambientIntensity;
      }
      if (keyLight) {
        keyLight.color.set(params.keyLightColor);
        keyLight.intensity = params.keyLightIntensity;
      }
      if (fillLight) {
        fillLight.color.set(params.fillLightColor);
        fillLight.intensity = params.fillLightIntensity;
      }
      if (accentPointLight) {
        accentPointLight.color.set(params.accentLightColor);
        accentPointLight.intensity = params.accentLightIntensity;
      }
    }

    // Procedural Scene Randomization (Leaves Postprocessor untouched per request)
    function randomizeThemeAndScene() {
      const paletteKeys = Object.keys(PALETTES);
      const randomScheme = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
      params.colorScheme = randomScheme;

      const randomAnim = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
      params.animationMode = randomAnim;

      // Re-roll geometric parameters only
      params.pillarCount = THREE.MathUtils.randInt(16, 30);
      params.basePillarWidth = parseFloat((Math.random() * 0.6 + 1.2).toFixed(2));
      params.pillarSpacing = parseFloat((params.basePillarWidth + Math.random() * 1.2 + 0.8).toFixed(2));
      params.growthExponent = parseFloat((Math.random() * 1.0 + 1.0).toFixed(2));
      params.maxHeight = parseFloat((Math.random() * 8.0 + 15.0).toFixed(1));
      params.surgeAmplitude = parseFloat((Math.random() * 0.3 + 0.15).toFixed(2));
      params.waveFrequency = parseFloat((Math.random() * 0.3 + 0.25).toFixed(2));
      params.splineElevation = parseFloat((Math.random() * 1.0 + 1.2).toFixed(2));
      params.splineRadius = parseFloat((Math.random() * 0.1 + 0.12).toFixed(2));
      params.animSpeed = parseFloat((Math.random() * 1.0 + 0.7).toFixed(2));

      // Rebuild geometry & update theme
      buildPillarsAndSpline();
      updateThemeColors(params.colorScheme);

      // NOTICE: postProcessor.settings is strictly NOT shuffled or changed!

      // Refresh GUI controllers
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // lil-gui Setup
    function setupGUI() {
      gui = new GUI({ title: 'Metric Bar Surge Controls' });

      // Theme & Color Schemes Folder
      const themeFolder = gui.addFolder('Theme & Colors');
      themeFolder.add(params, 'colorScheme', Object.keys(PALETTES)).name('Color Scheme').onChange(val => {
        updateThemeColors(val);
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      });

      themeFolder.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
        applyColorsToScene(PALETTES[params.colorScheme]);
      });

      // Opportunity to turn off plane
      themeFolder.add(params, 'showPlane').name('Show Floor Plane').onChange(val => {
        if (floorGrid) floorGrid.visible = val;
        if (shadowPlane) shadowPlane.visible = val;
        if (basePlatesGroup) basePlatesGroup.visible = val;
      });

      themeFolder.addColor(params, 'pillarColor').name('Pillar Body').onChange(() => applyColorsToScene());
      themeFolder.addColor(params, 'capColor').name('Pillar Cap').onChange(() => applyColorsToScene());
      themeFolder.addColor(params, 'splineColor').name('Spline Glow').onChange(() => applyColorsToScene());
      themeFolder.addColor(params, 'accentColor').name('Energy Pulse').onChange(() => applyColorsToScene());
      themeFolder.addColor(params, 'gridColor').name('Floor Matrix').onChange(() => applyColorsToScene());

      // Animation Folder
      const animFolder = gui.addFolder('Animation & Motion');
      animFolder.add(params, 'animationMode', ANIMATION_MODES).name('Camera & Motion');
      animFolder.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      animFolder.add(params, 'surgeAmplitude', 0.0, 0.8, 0.02).name('Surge Amplitude');
      animFolder.add(params, 'waveFrequency', 0.1, 1.2, 0.02).name('Wave Frequency');

      // Geometry & Metrics Folder
      const geomFolder = gui.addFolder('Pillars & Trajectory');
      geomFolder.add(params, 'pillarCount', 10, 40, 1).name('Pillar Count').onChange(() => buildPillarsAndSpline());
      geomFolder.add(params, 'basePillarWidth', 0.6, 2.5, 0.1).name('Pillar Width').onChange(() => buildPillarsAndSpline());
      geomFolder.add(params, 'pillarSpacing', 1.2, 4.5, 0.1).name('Pillar Spacing').onChange(() => buildPillarsAndSpline());
      geomFolder.add(params, 'growthExponent', 0.5, 2.8, 0.1).name('Growth Curve Exponent').onChange(() => buildPillarsAndSpline());
      geomFolder.add(params, 'maxHeight', 8.0, 32.0, 0.5).name('Summit Height').onChange(() => buildPillarsAndSpline());
      geomFolder.add(params, 'minHeight', 0.5, 6.0, 0.1).name('Origin Height').onChange(() => buildPillarsAndSpline());
      geomFolder.add(params, 'splineElevation', 0.4, 4.0, 0.1).name('Spline Hover Height').onChange(() => buildPillarsAndSpline());
      geomFolder.add(params, 'splineRadius', 0.05, 0.45, 0.01).name('Spline Thickness').onChange(() => buildPillarsAndSpline());

      // Lighting & Exposure Folder
      const lightFolder = gui.addFolder('Lighting & Exposure');
      lightFolder.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(val => {
        renderer.toneMappingExposure = val;
      });
      lightFolder.add(params, 'fogDensity', 0.0, 0.05, 0.002).name('Atmosphere Fog').onChange(() => {
        applyColorsToScene(PALETTES[params.colorScheme]);
      });

      const ambientSub = lightFolder.addFolder('Ambient Light');
      ambientSub.add(params, 'ambientIntensity', 0.0, 2.5, 0.05).name('Intensity').onChange(v => ambientLight.intensity = v);
      ambientSub.addColor(params, 'ambientColor').name('Color').onChange(c => ambientLight.color.set(c));

      const keySub = lightFolder.addFolder('Key Directional Light');
      keySub.add(params, 'keyLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => keyLight.intensity = v);
      keySub.addColor(params, 'keyLightColor').name('Color').onChange(c => keyLight.color.set(c));

      const fillSub = lightFolder.addFolder('Fill Light');
      fillSub.add(params, 'fillLightIntensity', 0.0, 4.0, 0.1).name('Intensity').onChange(v => fillLight.intensity = v);
      fillSub.addColor(params, 'fillLightColor').name('Color').onChange(c => fillLight.color.set(c));

      const accentSub = lightFolder.addFolder('Accent Point Light');
      accentSub.add(params, 'accentLightIntensity', 0.0, 6.0, 0.1).name('Intensity').onChange(v => accentPointLight.intensity = v);
      accentSub.addColor(params, 'accentLightColor').name('Color').onChange(c => accentPointLight.color.set(c));

      // Attach PostProcessor Suite Controls
      postProcessor.attachGUI(gui, 'Post-Processing Suite');

      // System & Interactivity Folder
      const sysFolder = gui.addFolder('System & Interactivity');
      sysFolder.add(params, 'antialias').name('Antialias').onChange(val => {
        createRenderer(val);
        postProcessor.setAntialias(val);
        applyColorsToScene(PALETTES[params.colorScheme]);
      });
      sysFolder.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(val => {
        renderer.setPixelRatio(val);
        postProcessor.setSize(window.innerWidth, window.innerHeight, val);
      });
      sysFolder.add(params, 'clickRandomize').name('Click Scene to Randomize');
      sysFolder.add({ randomize: () => randomizeThemeAndScene() }, 'randomize').name('Roll Random Variation');
    }

    // Event Listeners
    function setupEventListeners() {
      window.addEventListener('resize', onWindowResize);

      // Hide / Show UI with 'H' Key
      window.addEventListener('keydown', e => {
        if (e.key === 'h' || e.key === 'H') {
          gui._hidden ? gui.show() : gui.hide();
        }
      });

      // Pointer detection for click vs drag
      let pointerDownPos = { x: 0, y: 0 };
      window.addEventListener('pointerdown', e => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
      });

      window.addEventListener('pointerup', e => {
        if (e.target.closest('.lil-gui')) return;

        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dist < 5 && params.clickRandomize) {
          randomizeThemeAndScene();
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    }

    // Main Loop
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      animTime += delta;

      updatePillarSurge(animTime);
      updateCameraAnimation(animTime, delta);
      controls.update();

      // Render through PostProcessor pipeline
      postProcessor.renderScene(scene, camera);
    }

    init();
  </script>
</body>
</html>
