    // ============================================================================
    // 8 PRECONFIGURED CAMERA ANIMATIONS (SMOOTH & SLOW)
    // ============================================================================
    const ANIMATIONS = [
      'Static (No Camera Movement)',
      'Slow Panoramic Orbit (360°)',
      'Gentle Horizontal Pan (Side Drift)',
      'Floating Horizon (Vertical Sway)',
      'Cosmic Spiral (Dual-Axis Drift)',
      'Low Altitude Drama (Wave Crest Sweep)',
      'Zenith Top-Down Flow (Birdseye)',
      'Lissajous Infinity Glide (8-Figure Flow)'
    ];

    // ============================================================================
    // MASTER APPLICATION PARAMETERS
    // ============================================================================
    const DEG2RAD = Math.PI / 180;

    const params = {
      // Color & Theme
      colorScheme: 'Original',
      greenscreen: false,
      c1: COLOR_SCHEMES['Original'].c1,
      c2: COLOR_SCHEMES['Original'].c2,
      c3: COLOR_SCHEMES['Original'].c3,
      accent: COLOR_SCHEMES['Original'].accent,
      background: COLOR_SCHEMES['Original'].bg,

      // Interaction
      dragMode: 'Pan (Drag Object)',
      randomizeOnClick: true,

      // Camera Animation
      cameraAnimation: 'Slow Panoramic Orbit (360°)',

      // Wave Mathematics & Geometry
      waveWidth: 540,
      samples: 500,
      amplitude: 75,
      depthAmplitude: 55,
      freqLow: 0.3333,      // x / 3 degrees per unit
      freqHigh: 18.0,       // x * 18~20 degrees per unit
      speedLow: 8.0,        // Speed of macro left wave
      speedHigh: 18.0,      // Speed of micro right wave
      splitX: 0.0,          // Split boundary (0 = center)
      transitionWidth: 15.0,// Smooth crossover width
      strandsPerChannel: 5, // Layered ribbons per channel
      strandSpread: 0.04,   // Phase spread per strand
      strandZOffset: 7.0,   // Depth separation per strand
      lineWidth: 2.5,
      waveTwist: 0.45,

      // Photons / Particle Stream
      showParticles: true,
      particleCount: 750,
      particleSize: 3.2,
      particleSpeed: 1.0,

      // Motion
      animationSpeed: 1.0,
      paused: false,
      reverse: false,

      // Lighting & Exposure
      exposure: 1.15,
      sceneLightIntensity: 1.0,

      // Key Directional Light
      keyLightIntensity: 1.6,
      keyLightColor: '#ffffff',
      keyLightX: 180,
      keyLightY: 220,
      keyLightZ: 160,

      // Fill / Ambient Light
      ambientLightIntensity: 0.45,
      ambientLightColor: '#ffffff',

      // Point Light 1 (Left Macro Wave Follower)
      point1Intensity: 2.2,
      point1Color: '#ff3344',
      point1X: -140,
      point1Y: 50,
      point1Z: 40,

      // Point Light 2 (Right Laser Wave Follower)
      point2Intensity: 2.2,
      point2Color: '#00e5ff',
      point2X: 140,
      point2Y: 50,
      point2Z: 40,

      // Performance & Antialiasing
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true
    };

    // ============================================================================
    // THREE.JS SCENE SETUP
    // ============================================================================
    let renderer, scene, camera, controls, gui;
    let clock = new THREE.Clock();
    let animTime = 0.0;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(params.background);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3000);
    camera.position.set(0, 45, 340);

    function createRenderer(antialias) {
      const r = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance'
      });
      r.setSize(window.innerWidth, window.innerHeight);
      r.setPixelRatio(params.dpr);
      r.toneMapping = THREE.ACESFilmicToneMapping;
      r.toneMappingExposure = params.exposure;
      return r;
    }

    renderer = createRenderer(params.antialias);
    document.body.appendChild(renderer.domElement);

    // OrbitControls Setup
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.zoomSpeed = 1.1;
    controls.panSpeed = 1.0;
    controls.rotateSpeed = 0.8;
    controls.target.set(0, 0, 0);

    function updateDragMode() {
      if (params.dragMode === 'Pan (Drag Object)') {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.PAN,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.ROTATE
        };
        controls.touches = {
          ONE: THREE.TOUCH.PAN,
          TWO: THREE.TOUCH.DOLLY_PAN
        };
      } else {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.ROTATE,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN
        };
        controls.touches = {
          ONE: THREE.TOUCH.ROTATE,
          TWO: THREE.TOUCH.DOLLY_PAN
        };
      }
    }
    updateDragMode();

    // ============================================================================
    // LIGHTING SETUP
    // ============================================================================
    let keyLight, ambientLight, pointLight1, pointLight2;

    function setupLights() {
      ambientLight = new THREE.AmbientLight(params.ambientLightColor, params.ambientLightIntensity * params.sceneLightIntensity);
      scene.add(ambientLight);

      keyLight = new THREE.DirectionalLight(params.keyLightColor, params.keyLightIntensity * params.sceneLightIntensity);
      keyLight.position.set(params.keyLightX, params.keyLightY, params.keyLightZ);
      scene.add(keyLight);

      pointLight1 = new THREE.PointLight(params.point1Color, params.point1Intensity * params.sceneLightIntensity, 600, 1.4);
      pointLight1.position.set(params.point1X, params.point1Y, params.point1Z);
      scene.add(pointLight1);

      pointLight2 = new THREE.PointLight(params.point2Color, params.point2Intensity * params.sceneLightIntensity, 600, 1.4);
      pointLight2.position.set(params.point2X, params.point2Y, params.point2Z);
      scene.add(pointLight2);
    }
    setupLights();

    function updateLighting() {
      const master = params.sceneLightIntensity;
      if (ambientLight) {
        ambientLight.color.set(params.ambientLightColor);
        ambientLight.intensity = params.ambientLightIntensity * master;
      }
      if (keyLight) {
        keyLight.color.set(params.keyLightColor);
        keyLight.intensity = params.keyLightIntensity * master;
        keyLight.position.set(params.keyLightX, params.keyLightY, params.keyLightZ);
      }
      if (pointLight1) {
        pointLight1.color.set(params.point1Color);
        pointLight1.intensity = params.point1Intensity * master;
        pointLight1.position.set(params.point1X, params.point1Y, params.point1Z);
      }
      if (pointLight2) {
        pointLight2.color.set(params.point2Color);
        pointLight2.intensity = params.point2Intensity * master;
        pointLight2.position.set(params.point2X, params.point2Y, params.point2Z);
      }
      renderer.toneMappingExposure = params.exposure;
    }

    // ============================================================================
    // DUAL-FREQUENCY CHROMATIC WAVEFORM GENERATOR
    // ============================================================================
    let waveGroup = new THREE.Group();
    scene.add(waveGroup);

    // Channel line meshes and materials
    let lineMeshes = [];     // Array of THREE.Line
    let lineMaterials = [];  // Materials for each strand
    let particleSystem = null;
    let particlePositions = null;
    let particleChannelIndices = null;
    let particlePhases = null;

    // Center dividing ring / beacon
    let centerBeacon = null;

    function buildWaveGeometry() {
      // Dispose previous meshes
      while (waveGroup.children.length > 0) {
        const obj = waveGroup.children[0];
        waveGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
      }

      lineMeshes = [];
      lineMaterials = [];

      const totalChannels = 3;
      const strands = params.strandsPerChannel;
      const samples = params.samples;
      const channelColors = [params.c1, params.c2, params.c3];

      for (let k = 0; k < totalChannels; k++) {
        for (let s = 0; s < strands; s++) {
          const positions = new Float32Array(samples * 3);
          const geom = new THREE.BufferGeometry();
          geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

          // Compute strand brightness attenuation towards outer strands
          const strandNorm = strands > 1 ? (s / (strands - 1) - 0.5) * 2 : 0;
          const opacity = Math.max(0.4, 1.0 - Math.abs(strandNorm) * 0.45);

          const mat = new THREE.LineBasicMaterial({
            color: new THREE.Color(channelColors[k]),
            transparent: true,
            opacity: opacity,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            linewidth: params.lineWidth
          });

          const line = new THREE.Line(geom, mat);
          line.userData = {
            channel: k,
            strandIndex: s,
            strandNorm: strandNorm
          };

          waveGroup.add(line);
          lineMeshes.push(line);
          lineMaterials.push(mat);
        }
      }

      // Create Center Threshold Energy Halo / Beacon
      const ringGeom = new THREE.TorusGeometry(params.amplitude * 1.05, 1.4, 16, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.accent),
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending,
        wireframe: true
      });
      centerBeacon = new THREE.Mesh(ringGeom, ringMat);
      centerBeacon.rotation.y = Math.PI * 0.5;
      centerBeacon.position.x = params.splitX;
      waveGroup.add(centerBeacon);

      // Create Photon Particle Stream
      if (params.showParticles) {
        buildParticleSystem();
      }
    }

    // Soft glowing circle sprite for particles
    function createGlowSprite() {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.7)');
      grad.addColorStop(0.6, 'rgba(255,255,255,0.25)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    const glowTexture = createGlowSprite();

    function buildParticleSystem() {
      const count = params.particleCount;
      const pGeom = new THREE.BufferGeometry();
      particlePositions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      particleChannelIndices = new Float32Array(count);
      particlePhases = new Float32Array(count);

      const channelColors = [
        new THREE.Color(params.c1),
        new THREE.Color(params.c2),
        new THREE.Color(params.c3)
      ];

      for (let i = 0; i < count; i++) {
        const ch = i % 3;
        particleChannelIndices[i] = ch;
        particlePhases[i] = Math.random();

        const c = channelColors[ch];
        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      pGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
      pGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const pMat = new THREE.PointsMaterial({
        size: params.particleSize,
        map: glowTexture,
        transparent: true,
        opacity: 0.85,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particleSystem = new THREE.Points(pGeom, pMat);
      waveGroup.add(particleSystem);
    }

    // ============================================================================
    // EVALUATE WAVE EQUATION AT POSITION X
    // Matches the original codepen's macro/micro split with smooth 3D extrusion
    // ============================================================================
    function evaluateWave(x, k, strandOffset, t) {
      const halfW = params.waveWidth * 0.5;
      const split = params.splitX;
      const trans = params.transitionWidth;

      // Original phase offset: k / 30 radians
      const channelPhase = (k / 30) * 10.0;
      const strandPhase = strandOffset * params.strandSpread * 15.0;

      // Left macro wave: sin(x / 3 * PI / 180 + t * 10 + k / 30) * 100
      const leftAngle = (x * params.freqLow * DEG2RAD) + (t * params.speedLow) + channelPhase + strandPhase;
      const leftY = Math.sin(leftAngle) * params.amplitude;
      const leftZ = Math.cos(leftAngle * 0.6) * params.depthAmplitude + (strandOffset * params.strandZOffset);

      // Right micro laser wave: sin(x * 20 * PI / 180 + t * 20 + k / 30) * 100
      const rightAngle = (x * params.freqHigh * DEG2RAD) + (t * params.speedHigh) + channelPhase + strandPhase;
      const rightY = Math.sin(rightAngle) * params.amplitude;
      const rightZ = Math.sin(rightAngle * 0.4) * (params.depthAmplitude * 0.65) + (strandOffset * params.strandZOffset);

      // Smoothstep interpolation around split boundary
      let factor = (x - split) / trans;
      factor = THREE.MathUtils.clamp(factor, -1.0, 1.0);
      const blend = 0.5 + 0.5 * factor; // 0 on left, 1 on right

      const y = THREE.MathUtils.lerp(leftY, rightY, blend);
      const z = THREE.MathUtils.lerp(leftZ, rightZ, blend) + Math.sin(x * 0.02 + t) * (params.waveTwist * 12.0);

      return { y, z };
    }

    // Update wave geometries per frame
    function updateWaveGeometry(t) {
      const samples = params.samples;
      const halfW = params.waveWidth * 0.5;
      const step = params.waveWidth / (samples - 1);

      for (let m = 0; m < lineMeshes.length; m++) {
        const line = lineMeshes[m];
        const posAttr = line.geometry.attributes.position;
        const posArr = posAttr.array;
        const k = line.userData.channel;
        const strandNorm = line.userData.strandNorm;

        for (let i = 0; i < samples; i++) {
          const x = -halfW + i * step;
          const { y, z } = evaluateWave(x, k, strandNorm, t);
          const idx = i * 3;
          posArr[idx] = x;
          posArr[idx + 1] = y;
          posArr[idx + 2] = z;
        }

        posAttr.needsUpdate = true;
      }

      // Update Center Threshold Halo
      if (centerBeacon) {
        centerBeacon.position.x = params.splitX;
        const pulse = 1.0 + 0.08 * Math.sin(t * 6.0);
        centerBeacon.scale.set(pulse, pulse, pulse);
        centerBeacon.rotation.z = t * 0.8;
      }

      // Update Particle Stream
      if (particleSystem && particlePositions) {
        const count = params.particleCount;
        const pArr = particlePositions;
        const pSpeed = params.particleSpeed * 0.08;

        for (let i = 0; i < count; i++) {
          particlePhases[i] = (particlePhases[i] + pSpeed * 0.035) % 1.0;
          const u = particlePhases[i];
          const x = -halfW + u * params.waveWidth;
          const k = particleChannelIndices[i];
          const strandOffset = Math.sin(i * 99.0) * 1.2;

          const { y, z } = evaluateWave(x, k, strandOffset, t);
          const idx = i * 3;
          pArr[idx] = x;
          pArr[idx + 1] = y;
          pArr[idx + 2] = z;
        }

        particleSystem.geometry.attributes.position.needsUpdate = true;
      }

      // Animate Light Followers
      if (pointLight1) {
        const { y: p1Y, z: p1Z } = evaluateWave(-params.waveWidth * 0.28, 0, 0, t);
        pointLight1.position.x = -params.waveWidth * 0.28;
        pointLight1.position.y = p1Y + 30;
        pointLight1.position.z = p1Z + 40;
      }
      if (pointLight2) {
        const { y: p2Y, z: p2Z } = evaluateWave(params.waveWidth * 0.28, 2, 0, t);
        pointLight2.position.x = params.waveWidth * 0.28;
        pointLight2.position.y = p2Y + 30;
        pointLight2.position.z = p2Z + 40;
      }
    }

    // ============================================================================
    // THEME & COLOR UPDATES
    // ============================================================================
    function updateColors() {
      // Greenscreen handling
      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
      } else {
        scene.background = new THREE.Color(params.background);
      }

      const channelColors = [
        new THREE.Color(params.c1),
        new THREE.Color(params.c2),
        new THREE.Color(params.c3)
      ];

      for (let m = 0; m < lineMeshes.length; m++) {
        const line = lineMeshes[m];
        const k = line.userData.channel;
        line.material.color.copy(channelColors[k]);
      }

      if (centerBeacon) {
        centerBeacon.material.color.set(params.accent);
      }

      if (particleSystem) {
        const colorsAttr = particleSystem.geometry.attributes.color;
        const colorsArr = colorsAttr.array;
        const count = params.particleCount;

        for (let i = 0; i < count; i++) {
          const k = particleChannelIndices[i];
          const c = channelColors[k];
          colorsArr[i * 3 + 0] = c.r;
          colorsArr[i * 3 + 1] = c.g;
          colorsArr[i * 3 + 2] = c.b;
        }
        colorsAttr.needsUpdate = true;
      }
    }

    function applyColorScheme(schemeName) {
      const s = COLOR_SCHEMES[schemeName];
      if (!s) return;
      params.colorScheme = schemeName;
      params.c1 = s.c1;
      params.c2 = s.c2;
      params.c3 = s.c3;
      params.accent = s.accent;
      params.background = s.bg;
      updateColors();
      updateAllControllers();
    }

    // ============================================================================
    // PROCEDURAL RANDOMIZER (CLICK SCENE TO RE-ROLL)
    // ============================================================================
    function randomizeScene() {
      // Pick random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(chosenScheme);

      // Re-roll geometric & motion parameters
      params.amplitude = Math.floor(45 + Math.random() * 65);
      params.depthAmplitude = Math.floor(30 + Math.random() * 55);
      params.freqHigh = +(12.0 + Math.random() * 14.0).toFixed(1);
      params.speedLow = +(5.0 + Math.random() * 7.0).toFixed(1);
      params.speedHigh = +(14.0 + Math.random() * 12.0).toFixed(1);
      params.strandsPerChannel = [3, 5, 7][Math.floor(Math.random() * 3)];
      params.strandSpread = +(0.02 + Math.random() * 0.05).toFixed(3);
      params.waveTwist = +(0.2 + Math.random() * 0.6).toFixed(2);
      params.animationSpeed = +(0.7 + Math.random() * 0.7).toFixed(2);
      params.particleSpeed = +(0.6 + Math.random() * 0.8).toFixed(2);

      buildWaveGeometry();
      updateColors();
      updateAllControllers();
    }

    // Canvas click detector (Distinguishes Drag vs Click)
    function attachCanvasEvents(domElement) {
      let downX = 0, downY = 0, downTime = 0;

      domElement.addEventListener('pointerdown', (e) => {
        downX = e.clientX;
        downY = e.clientY;
        downTime = performance.now();
      });

      domElement.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
        const duration = performance.now() - downTime;
        // Pure click: movement < 6px and duration < 350ms
        if (dist < 6 && duration < 350 && params.randomizeOnClick && e.button === 0) {
          randomizeScene();
        }
      });
    }

    // ============================================================================
    // ANTIALIAS TOGGLE (RECREATES WEBGL RENDERER)
    // ============================================================================
    function setAntialias(enabled) {
      params.antialias = enabled;
      const prevCamPos = camera.position.clone();
      const prevTarget = controls.target.clone();

      renderer.dispose();
      if (renderer.domElement && renderer.domElement.parentNode) {
        renderer.domElement.parentNode.removeChild(renderer.domElement);
      }

      renderer = createRenderer(enabled);
      document.body.appendChild(renderer.domElement);

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.zoomSpeed = 1.1;
      controls.panSpeed = 1.0;
      controls.rotateSpeed = 0.8;
      camera.position.copy(prevCamPos);
      controls.target.copy(prevTarget);
      updateDragMode();

      attachCanvasEvents(renderer.domElement);
      updateColors();
    }

    // ============================================================================
    // LIL-GUI CONTROL PANEL
    // ============================================================================
    function updateAllControllers(folder = gui) {
      if (!folder) return;
      if (folder.controllers) {
        for (const c of folder.controllers) c.updateDisplay();
      }
      if (folder.folders) {
        for (const f of folder.folders) updateAllControllers(f);
      }
    }

    function initGUI() {
      gui = new GUI({ title: 'Chromatic Waveform Controls' });

      // 1. Presets & Interaction Folder
      const themeFolder = gui.addFolder('Presets & Interaction');
      themeFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => applyColorScheme(v));
      themeFolder.add(params, 'cameraAnimation', ANIMATIONS).name('Camera Animation');
      themeFolder.add(params, 'dragMode', ['Pan (Drag Object)', 'Rotate (Camera Orbit)']).name('Left Drag Action').onChange(() => updateDragMode());
      themeFolder.add(params, 'randomizeOnClick').name('Randomize On Click');
      themeFolder.add({ randomize: () => randomizeScene() }, 'randomize').name('⚡ Randomize Wave Now');
      themeFolder.add({ resetCam: () => {
        camera.position.set(0, 45, 340);
        controls.target.set(0, 0, 0);
        controls.update();
      } }, 'resetCam').name('Reset Camera View');

      // 2. Color Palette & Background
      const colorFolder = gui.addFolder('Colors & Chroma');
      colorFolder.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => updateColors());
      colorFolder.addColor(params, 'background').name('Background Color').onChange(() => updateColors());
      colorFolder.addColor(params, 'c1').name('Channel 1 (Red / Pri)').onChange(() => updateColors());
      colorFolder.addColor(params, 'c2').name('Channel 2 (Green / Sec)').onChange(() => updateColors());
      colorFolder.addColor(params, 'c3').name('Channel 3 (Blue / Tri)').onChange(() => updateColors());
      colorFolder.addColor(params, 'accent').name('Accent / Threshold Halo').onChange(() => updateColors());

      // 3. Wave Mathematics & Geometry
      const waveFolder = gui.addFolder('Waveform Geometry');
      waveFolder.add(params, 'waveWidth', 200, 900, 20).name('Total Wave Span').onChange(() => buildWaveGeometry());
      waveFolder.add(params, 'amplitude', 20, 160, 2).name('Wave Amplitude');
      waveFolder.add(params, 'depthAmplitude', 0, 140, 2).name('3D Depth Extrusion');
      waveFolder.add(params, 'freqLow', 0.1, 1.5, 0.02).name('Left Frequency (Low)');
      waveFolder.add(params, 'freqHigh', 4.0, 35.0, 0.5).name('Right Frequency (High)');
      waveFolder.add(params, 'splitX', -150, 150, 5).name('Split Boundary (X)').onChange(() => {
        if (centerBeacon) centerBeacon.position.x = params.splitX;
      });
      waveFolder.add(params, 'transitionWidth', 2, 60, 2).name('Crossover Blend');
      waveFolder.add(params, 'strandsPerChannel', [1, 3, 5, 7, 9]).name('Strands / Channel').onChange(() => buildWaveGeometry());
      waveFolder.add(params, 'strandSpread', 0.005, 0.12, 0.005).name('Strand Phase Spread');
      waveFolder.add(params, 'strandZOffset', 0, 25, 1).name('Strand Z Offset');
      waveFolder.add(params, 'waveTwist', 0.0, 1.5, 0.05).name('Wave Spatial Twist');

      // 4. Photon Stream / Particles
      const partFolder = gui.addFolder('Photon Stream Particles');
      partFolder.add(params, 'showParticles').name('Show Particles').onChange(v => {
        if (particleSystem) particleSystem.visible = v;
      });
      partFolder.add(params, 'particleCount', 100, 2000, 50).name('Particle Count').onChange(() => buildWaveGeometry());
      partFolder.add(params, 'particleSize', 1.0, 10.0, 0.5).name('Particle Glow Size').onChange(v => {
        if (particleSystem) particleSystem.material.size = v;
      });
      partFolder.add(params, 'particleSpeed', 0.1, 3.0, 0.1).name('Flow Velocity');

      // 5. Motion Controls
      const motionFolder = gui.addFolder('Motion & Kinetics');
      motionFolder.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Master Speed');
      motionFolder.add(params, 'speedLow', 1.0, 25.0, 0.5).name('Left Wave Speed');
      motionFolder.add(params, 'speedHigh', 2.0, 45.0, 1.0).name('Right Laser Speed');
      motionFolder.add(params, 'paused').name('Paused');
      motionFolder.add(params, 'reverse').name('Reverse Direction');

      // 6. Lighting & Exposure
      const lightFolder = gui.addFolder('Lighting & Exposure');
      lightFolder.add(params, 'exposure', 0.2, 3.0, 0.05).name('Tone Exposure').onChange(() => updateLighting());
      lightFolder.add(params, 'sceneLightIntensity', 0.0, 3.0, 0.05).name('Master Light Power').onChange(() => updateLighting());

      const ambFolder = lightFolder.addFolder('Ambient Light');
      ambFolder.add(params, 'ambientLightIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(() => updateLighting());
      ambFolder.addColor(params, 'ambientLightColor').name('Color').onChange(() => updateLighting());

      const dirFolder = lightFolder.addFolder('Key Directional Light');
      dirFolder.add(params, 'keyLightIntensity', 0.0, 4.0, 0.05).name('Intensity').onChange(() => updateLighting());
      dirFolder.addColor(params, 'keyLightColor').name('Color').onChange(() => updateLighting());
      dirFolder.add(params, 'keyLightX', -400, 400, 10).name('Pos X').onChange(() => updateLighting());
      dirFolder.add(params, 'keyLightY', -400, 400, 10).name('Pos Y').onChange(() => updateLighting());
      dirFolder.add(params, 'keyLightZ', -400, 400, 10).name('Pos Z').onChange(() => updateLighting());

      const p1Folder = lightFolder.addFolder('Point Light 1 (Left Follower)');
      p1Folder.add(params, 'point1Intensity', 0.0, 5.0, 0.05).name('Intensity').onChange(() => updateLighting());
      p1Folder.addColor(params, 'point1Color').name('Color').onChange(() => updateLighting());

      const p2Folder = lightFolder.addFolder('Point Light 2 (Right Follower)');
      p2Folder.add(params, 'point2Intensity', 0.0, 5.0, 0.05).name('Intensity').onChange(() => updateLighting());
      p2Folder.addColor(params, 'point2Color').name('Color').onChange(() => updateLighting());

      // 7. Performance & Antialiasing
      const perfFolder = gui.addFolder('Rendering & Performance');
      perfFolder.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => renderer.setPixelRatio(v));
      perfFolder.add(params, 'antialias').name('Antialiasing').onChange(v => setAntialias(v));
    }

    // ============================================================================
    // KEYBOARD LISTENER ("H" TO HIDE / SHOW UI)
    // ============================================================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (gui._hidden) {
          gui.show();
          gui.domElement.style.display = '';
        } else {
          gui.hide();
          gui.domElement.style.display = 'none';
        }
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // CAMERA RIG ANIMATION (PRESERVES USER ZOOM & INTERACTIVE ANGLES)
    // ============================================================================
    function updateCameraRig(delta, speed) {
      if (params.cameraAnimation === 'Static (No Camera Movement)') return;

      const camOffset = camera.position.clone().sub(controls.target);
      const currentDist = camOffset.length(); // PRESERVES EXACT USER ZOOM WHEEL DISTANCE!
      const rotDelta = 0.22 * delta * speed;

      switch (params.cameraAnimation) {
        case 'Slow Panoramic Orbit (360°)':
          camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta);
          break;

        case 'Gentle Horizontal Pan (Side Drift)':
          camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta * 0.7);
          const panX = Math.sin(animTime * 0.35) * (currentDist * 0.06);
          controls.target.x = THREE.MathUtils.lerp(controls.target.x, panX, 0.03);
          break;

        case 'Floating Horizon (Vertical Sway)':
          camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta * 0.85);
          const swayY = Math.sin(animTime * 0.65) * (currentDist * 0.12);
          camOffset.y += (swayY - camOffset.y) * 0.03;
          camOffset.setLength(currentDist);
          break;

        case 'Cosmic Spiral (Dual-Axis Drift)':
          camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta);
          const pitchTilt = Math.sin(animTime * 0.4) * 0.003 * speed;
          camOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitchTilt);
          camOffset.setLength(currentDist);
          break;

        case 'Low Altitude Drama (Wave Crest Sweep)':
          camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta * 0.75);
          const lowTargetY = -currentDist * 0.18 + Math.sin(animTime * 0.5) * (currentDist * 0.06);
          camOffset.y += (lowTargetY - camOffset.y) * 0.025;
          camOffset.setLength(currentDist);
          break;

        case 'Zenith Top-Down Flow (Birdseye)':
          camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta * 1.1);
          const topTargetY = currentDist * 0.72;
          camOffset.y += (topTargetY - camOffset.y) * 0.025;
          camOffset.setLength(currentDist);
          break;

        case 'Lissajous Infinity Glide (8-Figure Flow)':
          const yawAngle = Math.sin(animTime * 0.5) * rotDelta * 1.35;
          const pitchAngle = Math.cos(animTime * 1.0) * rotDelta * 0.65;
          camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yawAngle);
          camOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitchAngle);
          camOffset.setLength(currentDist);
          break;
      }

      camera.position.copy(controls.target).add(camOffset);
    }

    // ============================================================================
    // MAIN AUTO INFINITE ANIMATION LOOP
    // ============================================================================
    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.06);
      const speed = params.animationSpeed;

      if (!params.paused) {
        const dir = params.reverse ? -1 : 1;
        animTime += delta * speed * dir;
      }

      // Update Kinetic Waveform
      updateWaveGeometry(animTime);

      // Camera Animation (Maintains interactive zoom & angles)
      updateCameraRig(delta, speed);

      controls.update();
      renderer.render(scene, camera);
    }

    // Initialization Sequence
    buildWaveGeometry();
    updateColors();
    updateLighting();
    initGUI();
    attachCanvasEvents(renderer.domElement);
    animate();
  </script>
</body>
