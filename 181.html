<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sphere Packing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body, html, #app, #webgl-canvas {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(0,0,0,0.5) 200%);
      overflow: hidden;
      cursor: none;
    }

    .lil-gui, .lil-gui *, .buttons, .buttons * {
      cursor: auto;
    }

    #app {
      position: relative;
      height: 100%;
      font-family: "Montserrat", serif;
    }

    .hero {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    h1, h2 {
      margin: 0;
      padding: 0;
      color: black;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 1);
      line-height: 100%;
      user-select: none;
    }

    h1 {
      position: relative;
      z-index: 2;
      font-size: 100px;
      font-weight: 700;
    }

    h2 {
      font-size: 80px;
      font-weight: 500;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow: hidden;
      z-index: 1;
    }

    .buttons {
      position: fixed;
      width: 100%;
      bottom: 15px;
      z-index: 2;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    button, a {
      color: black;
      font-family: "Montserrat", serif;
      font-size: 12px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 5px;
      border: 1px solid grey;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hero">
      <h1>Sphere</h1>
      <h2>Packing</h2>
    </div>
    <div class="buttons">
      <button type="button" id="colors-btn">
        Random colors
      </button>
      <a href="https://www.framer.com/@kevin-levron/" target="_blank">
        Framer Component
      </a>
    </div>
    <canvas id="webgl-canvas"></canvas>
  </div>
  <input type="file" id="svg-upload" accept=".svg" style="display:none;" />

  <script type="module">
    import GUI from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";
    import {
      Clock, PerspectiveCamera, Scene, WebGLRenderer, SRGBColorSpace, MathUtils,
      Vector2, Vector3, MeshPhysicalMaterial, ShaderChunk, Color, Object3D,
      InstancedMesh, SphereGeometry, PointLight, DirectionalLight, PCFSoftShadowMap,
      ACESFilmicToneMapping, PMREMGenerator, Raycaster, Plane, Group
    } from "https://cdn.jsdelivr.net/npm/three@0.170.0/+esm";
    import { RoomEnvironment } from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js/+esm";

    // -------------------------------------------------------------
    // Helper math vectors & temp objects
    // -------------------------------------------------------------
    const F = new Vector3(), O = new Vector3(), V = new Vector3(), N = new Vector3(), j = new Vector3();
    const _ = new Vector3(), W = new Vector3(), H = new Vector3(), T = new Vector3();
    const Y = new Object3D();
    const pointerRaycaster = new Raycaster();
    const pointerPlane = new Plane(new Vector3(0, 0, 1), 0);
    const planeIntersection = new Vector3();

    // -------------------------------------------------------------
    // App Base Renderer Wrapper
    // -------------------------------------------------------------
    class BaseApp {
      #options;
      canvas;
      camera;
      cameraFov;
      scene;
      renderer;
      sceneGroup;
      size = { width: 0, height: 0, wWidth: 0, wHeight: 0, ratio: 0, pixelRatio: 0 };
      onBeforeRender = () => {};
      onAfterResize = () => {};
      #isIntersecting = !1;
      #isRunning = !1;
      #clock = new Clock();
      #timeData = { elapsed: 0, delta: 0 };
      #rafId;
      #resizeTimeout;

      constructor(options) {
        this.#options = { ...options };
        this.camera = new PerspectiveCamera();
        this.cameraFov = this.camera.fov;
        this.scene = new Scene();
        this.sceneGroup = new Group();
        this.scene.add(this.sceneGroup);

        this.canvas = this.#options.canvas || document.getElementById(this.#options.id);
        this.canvas.style.display = "block";

        this.renderer = new WebGLRenderer({
          canvas: this.canvas,
          powerPreference: "high-performance",
          antialias: true,
          alpha: true,
          ...this.#options.rendererOptions
        });
        this.renderer.outputColorSpace = SRGBColorSpace;

        window.addEventListener("resize", this.#onResizeThrottled.bind(this));
        this.resize();
        this.#startLoop();
      }

      #onResizeThrottled() {
        if (this.#resizeTimeout) clearTimeout(this.#resizeTimeout);
        this.#resizeTimeout = setTimeout(this.resize.bind(this), 100);
      }

      resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        this.size.width = width;
        this.size.height = height;
        this.size.ratio = width / height;

        this.camera.aspect = this.size.ratio;
        this.camera.updateProjectionMatrix();

        const fovRad = (this.camera.fov * Math.PI) / 180;
        this.size.wHeight = 2 * Math.tan(fovRad / 2) * this.camera.position.length();
        this.size.wWidth = this.size.wHeight * this.camera.aspect;

        this.renderer.setSize(width, height);
        this.onAfterResize(this.size);
      }

      #startLoop() {
        if (this.#isRunning) return;
        const loop = () => {
          this.#rafId = requestAnimationFrame(loop);
          this.#timeData.delta = this.#clock.getDelta();
          this.#timeData.elapsed += this.#timeData.delta;
          this.onBeforeRender(this.#timeData);
          this.renderer.render(this.scene, this.camera);
        };
        this.#isRunning = true;
        this.#clock.start();
        loop();
      }

      clear() {
        this.sceneGroup.clear();
      }

      dispose() {
        cancelAnimationFrame(this.#rafId);
        this.clear();
        this.renderer.dispose();
      }
    }

    // -------------------------------------------------------------
    // Physics Simulation with Custom Target Forms
    // -------------------------------------------------------------
    class PhysicsSimulation {
      constructor(config) {
        this.config = config;
        this.positionData = new Float32Array(3 * config.count).fill(0);
        this.velocityData = new Float32Array(3 * config.count).fill(0);
        this.sizeData = new Float32Array(config.count).fill(1);
        this.center = new Vector3();
        this.targetPositions = null;
        this.randomPositions();
      }

      randomPositions() {
        const { config, positionData, sizeData } = this;
        this.center.toArray(positionData, 0);
        sizeData[0] = config.size0;
        for (let s = 1; s < this.config.count; s++) {
          const n = 3 * s;
          positionData[n] = MathUtils.randFloatSpread(10);
          positionData[n + 1] = MathUtils.randFloatSpread(10);
          positionData[n + 2] = MathUtils.randFloatSpread(10);
          sizeData[s] = MathUtils.randFloat(config.minSize, config.maxSize);
        }
      }

      setTargetShape(points) {
        if (!points || points.length === 0) {
          this.targetPositions = null;
          return;
        }
        const targetArr = new Float32Array(3 * this.config.count);
        for (let i = 0; i < this.config.count; i++) {
          const pt = points[i % points.length];
          targetArr[3 * i] = pt.x;
          targetArr[3 * i + 1] = pt.y;
          targetArr[3 * i + 2] = pt.z !== undefined ? pt.z : (Math.random() - 0.5) * 2;
        }
        this.targetPositions = targetArr;
      }

      update(e) {
        const { config, center, positionData, sizeData, velocityData, targetPositions } = this;

        // Big sphere lerps towards physics center
        F.fromArray(positionData, 0);
        F.lerp(center, 0.1).toArray(positionData, 0);

        for (let i = 1; i < config.count; i++) {
          const r = 3 * i;
          O.fromArray(positionData, r);
          N.fromArray(velocityData, r);
          const sphereSize = sizeData[i];

          if (targetPositions) {
            T.fromArray(targetPositions, r).add(F);
            _.copy(T).sub(O);
            N.add(_.normalize().multiplyScalar(e.delta * config.attraction * 2.2 * Math.max(0.5, sphereSize)));
          } else {
            _.copy(F).sub(O);
            N.add(_.normalize().multiplyScalar(e.delta * config.attraction * Math.max(0.5, sphereSize)));
          }

          N.multiplyScalar(config.friction);
          N.clampLength(0, config.maxVelocity);
          O.add(N);
          O.toArray(positionData, r);
          N.toArray(velocityData, r);
        }

        // Collision detection and resolution between spheres
        for (let eIdx = 1; eIdx < config.count; eIdx++) {
          const i = 3 * eIdx;
          O.fromArray(positionData, i);
          N.fromArray(velocityData, i);
          const rSize = sizeData[eIdx];

          for (let i2 = eIdx + 1; i2 < config.count; i2++) {
            const e2 = 3 * i2;
            V.fromArray(positionData, e2);
            j.fromArray(velocityData, e2);
            const tSize = sizeData[i2];

            _.copy(V).sub(O);
            const dist = _.length();
            const minDist = rSize + tSize;
            if (dist < minDist && dist > 0.0001) {
              const overlap = minDist - dist;
              W.copy(_).normalize().multiplyScalar(0.5 * overlap);
              H.copy(W).multiplyScalar(Math.max(N.length(), 1));
              T.copy(W).multiplyScalar(Math.max(j.length(), 1));
              O.sub(W);
              N.sub(H);
              V.add(W);
              j.add(T);
              V.toArray(positionData, e2);
              j.toArray(velocityData, e2);
            }
          }

          _.copy(F).sub(O);
          const distBig = _.length();
          const minDistBig = rSize + sizeData[0];
          if (distBig < minDistBig && distBig > 0.0001) {
            const overlapBig = minDistBig - distBig;
            W.copy(_).normalize().multiplyScalar(overlapBig);
            H.copy(W).multiplyScalar(Math.max(N.length(), 2));
            O.sub(W);
            N.sub(H);
          }

          O.toArray(positionData, i);
          N.toArray(velocityData, i);
        }
      }
    }

    // -------------------------------------------------------------
    // Translucent Subsurface Scattering Material
    // -------------------------------------------------------------
    class TranslucentMaterial extends MeshPhysicalMaterial {
      constructor(params) {
        super(params);
        this.uniforms = {
          thicknessDistortion: { value: 0.1 },
          thicknessAmbient: { value: 0 },
          thicknessAttenuation: { value: 0.1 },
          thicknessPower: { value: 2 },
          thicknessScale: { value: 10 }
        };
        this.defines.USE_UV = "";
        this.onBeforeCompile = (shader) => {
          Object.assign(shader.uniforms, this.uniforms);
          shader.fragmentShader = `
            uniform float thicknessPower;
            uniform float thicknessScale;
            uniform float thicknessDistortion;
            uniform float thicknessAmbient;
            uniform float thicknessAttenuation;
            uniform vec3 thicknessColor;
          ` + shader.fragmentShader;

          shader.fragmentShader = shader.fragmentShader.replace(
            "void main() {",
            `
            void RE_Direct_Scattering(const in IncidentLight directLight, const in vec2 uv, const in vec3 geometryPosition, const in vec3 geometryNormal, const in vec3 geometryViewDir, const in vec3 geometryClearcoatNormal, inout ReflectedLight reflectedLight) {
              vec3 scatteringHalf = normalize(directLight.direction + (geometryNormal * thicknessDistortion));
              float scatteringDot = pow(saturate(dot(geometryViewDir, -scatteringHalf)), thicknessPower) * thicknessScale;
              vec3 scatteringIllu = (scatteringDot + thicknessAmbient) * vColor;
              reflectedLight.directDiffuse += scatteringIllu * thicknessAttenuation * directLight.color;
            }

            void main() {
            `
          );

          const lightsChunk = ShaderChunk.lights_fragment_begin.replaceAll(
            "RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );",
            `
              RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );
              RE_Direct_Scattering(directLight, vUv, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, reflectedLight);
            `
          );
          shader.fragmentShader = shader.fragmentShader.replace("#include <lights_fragment_begin>", lightsChunk);
        };
      }
    }

    const DEFAULT_CONFIG = {
      count: 200,
      colors: [0xff0000, 0x000000, 0xffffff],
      pointLightIntensity: 150,
      directionalLightColor: 0xffffff,
      directionalLightIntensity: 5,
      materialParams: { metalness: 0.5, roughness: 0.5, clearcoat: 1, clearcoatRoughness: 0.15 },
      minSize: 0.25,
      maxSize: 1,
      size0: 3,
      attraction: 0.15,
      friction: 0.999,
      maxVelocity: 0.15
    };

    // -------------------------------------------------------------
    // Instanced Spheres Mesh & Lights
    // -------------------------------------------------------------
    class SphereGroupMesh extends InstancedMesh {
      constructor(renderer, customConfig = {}) {
        const config = { ...DEFAULT_CONFIG, ...customConfig };
        super(new SphereGeometry(1, 48, 24), new TranslucentMaterial(config.materialParams), config.count);

        this.castShadow = true;
        this.receiveShadow = true;
        this.config = config;
        this.physics = new PhysicsSimulation(config);

        this.initLights();
        this.setColors(config.colors);
      }

      initLights() {
        this.pointLight = new PointLight(this.config.colors[0], this.config.pointLightIntensity);
        this.add(this.pointLight);

        const dLight = this.directionalLight = new DirectionalLight(this.config.directionalLightColor, this.config.directionalLightIntensity);
        dLight.position.set(20, 20, 20);
        dLight.target.position.set(0, 0, 0);
        dLight.castShadow = true;
        dLight.shadow.mapSize.width = 2048;
        dLight.shadow.mapSize.height = 2048;
        dLight.shadow.camera.far = 70;
        dLight.shadow.camera.left = -17.5;
        dLight.shadow.camera.right = 17.5;
        dLight.shadow.camera.top = 17.5;
        dLight.shadow.camera.bottom = -17.5;
        this.add(dLight);
        this.add(dLight.target);
      }

      setColors(colorList) {
        if (!Array.isArray(colorList) || colorList.length < 2) return;

        const colorObjects = colorList.map(c => new Color(c));
        const sampleColor = (factor, targetColor = new Color()) => {
          const clamped = Math.max(0, Math.min(1, factor)) * (colorObjects.length - 1);
          const index = Math.floor(clamped);
          const baseColor = colorObjects[index];
          if (index >= colorObjects.length - 1) return baseColor.clone();
          const t = clamped - index;
          const nextColor = colorObjects[index + 1];
          targetColor.r = baseColor.r + t * (nextColor.r - baseColor.r);
          targetColor.g = baseColor.g + t * (nextColor.g - baseColor.g);
          targetColor.b = baseColor.b + t * (nextColor.b - baseColor.b);
          return targetColor;
        };

        for (let i = 0; i < this.count; i++) {
          const col = sampleColor(i / this.count);
          this.setColorAt(i, col);
          if (i === 0) this.pointLight.color.copy(col);
        }
        this.instanceColor.needsUpdate = true;
      }

      update(e) {
        this.physics.update(e);
        for (let i = 0; i < this.count; i++) {
          Y.position.fromArray(this.physics.positionData, 3 * i);
          Y.scale.setScalar(this.physics.sizeData[i]);
          Y.updateMatrix();
          this.setMatrixAt(i, Y.matrix);
          if (i === 0) this.pointLight.position.copy(Y.position);
        }
        this.instanceMatrix.needsUpdate = true;
      }
    }

    // -------------------------------------------------------------
    // Shape Generators & SVG Sampler
    // -------------------------------------------------------------
    function generateShapePoints(type, count) {
      const points = [];
      if (type === 'Heart') {
        for (let i = 0; i < count; i++) {
          const t = (i / count) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          const scale = 0.38;
          points.push({ x: x * scale, y: y * scale, z: (Math.random() - 0.5) * 3 });
        }
      } else if (type === 'Star') {
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const spikes = 5;
          const r = Math.cos(angle * spikes) > 0 ? 6.5 : 2.8;
          points.push({
            x: Math.cos(angle) * r,
            y: Math.sin(angle) * r,
            z: (Math.random() - 0.5) * 2
          });
        }
      } else if (type === 'Torus Ring') {
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const r = 5.5 + (Math.random() - 0.5) * 0.8;
          points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r, z: (Math.random() - 0.5) * 1.5 });
        }
      } else if (type === 'Infinity') {
        for (let i = 0; i < count; i++) {
          const t = (i / count) * Math.PI * 2;
          const scale = 7.5;
          const denom = 1 + Math.pow(Math.sin(t), 2);
          const x = (scale * Math.cos(t)) / denom;
          const y = (scale * Math.sin(t) * Math.cos(t)) / denom;
          points.push({ x, y, z: (Math.random() - 0.5) * 2 });
        }
      }
      return points;
    }

    function samplePointsFromSVG(svgText, count) {
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgText, "image/svg+xml");
        const svg = doc.querySelector("svg");
        if (!svg) return null;

        const rects = Array.from(svg.querySelectorAll("rect"));
        rects.forEach(r => {
          const x = parseFloat(r.getAttribute("x") || 0);
          const y = parseFloat(r.getAttribute("y") || 0);
          const w = parseFloat(r.getAttribute("width") || 0);
          const h = parseFloat(r.getAttribute("height") || 0);
          const p = doc.createElementNS("http://www.w3.org/2000/svg", "path");
          p.setAttribute("d", `M ${x} ${y} h ${w} v ${h} h ${-w} Z`);
          r.parentNode.replaceChild(p, r);
        });

        const circles = Array.from(svg.querySelectorAll("circle"));
        circles.forEach(c => {
          const cx = parseFloat(c.getAttribute("cx") || 0);
          const cy = parseFloat(c.getAttribute("cy") || 0);
          const r = parseFloat(c.getAttribute("r") || 0);
          const p = doc.createElementNS("http://www.w3.org/2000/svg", "path");
          p.setAttribute("d", `M ${cx - r} ${cy} a ${r} ${r} 0 1 0 ${r * 2} 0 a ${r} ${r} 0 1 0 ${-r * 2} 0`);
          c.parentNode.replaceChild(p, c);
        });

        const polygons = Array.from(svg.querySelectorAll("polygon, polyline"));
        polygons.forEach(pg => {
          const pts = (pg.getAttribute("points") || "").trim().split(/[\s,]+/);
          if (pts.length >= 4) {
            let d = `M ${pts[0]} ${pts[1]}`;
            for (let i = 2; i < pts.length; i += 2) {
              d += ` L ${pts[i]} ${pts[i+1]}`;
            }
            if (pg.tagName.toLowerCase() === "polygon") d += " Z";
            const p = doc.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", d);
            pg.parentNode.replaceChild(p, pg);
          }
        });

        const div = document.createElement("div");
        div.style.position = "absolute";
        div.style.left = "-9999px";
        div.style.top = "-9999px";
        div.style.width = "500px";
        div.style.height = "500px";
        document.body.appendChild(div);
        div.appendChild(svg);

        const paths = Array.from(svg.querySelectorAll("path"));
        if (paths.length === 0) {
          document.body.removeChild(div);
          return null;
        }

        const lengths = paths.map(p => {
          try { return p.getTotalLength() || 0; } catch (e) { return 0; }
        });
        const totalLen = lengths.reduce((a, b) => a + b, 0);

        const points = [];
        if (totalLen > 0) {
          for (let i = 0; i < count; i++) {
            const targetD = (i / count) * totalLen;
            let curr = 0;
            let pObj = paths[0];
            let dInP = 0;
            for (let j = 0; j < paths.length; j++) {
              if (curr + lengths[j] >= targetD || j === paths.length - 1) {
                pObj = paths[j];
                dInP = targetD - curr;
                break;
              }
              curr += lengths[j];
            }
            try {
              const pt = pObj.getPointAtLength(Math.max(0, Math.min(dInP, lengths[paths.indexOf(pObj)])));
              points.push({ x: pt.x, y: -pt.y });
            } catch (e) {}
          }
        }

        document.body.removeChild(div);
        if (points.length === 0) return null;

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        points.forEach(p => {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        });

        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        const maxDim = Math.max(maxX - minX, maxY - minY) || 1;
        const scale = 13 / maxDim;

        return points.map(p => ({
          x: (p.x - cx) * scale,
          y: (p.y - cy) * scale,
          z: (Math.random() - 0.5) * 2
        }));
      } catch (err) {
        console.error("Error parsing SVG file:", err);
        return null;
      }
    }

    // -------------------------------------------------------------
    // Main App Initialization & Controllers
    // -------------------------------------------------------------
    function initApp(canvas) {
      const app = new BaseApp({
        canvas,
        rendererOptions: { antialias: true, alpha: true }
      });

      app.camera.position.set(0, 0, 30);
      app.camera.lookAt(0, 0, 0);
      app.renderer.shadowMap.enabled = true;
      app.renderer.shadowMap.type = PCFSoftShadowMap;
      app.renderer.toneMapping = ACESFilmicToneMapping;

      const envRoom = new RoomEnvironment();
      const envMap = new PMREMGenerator(app.renderer, 0.04).fromScene(envRoom).texture;

      let sphereMesh = new SphereGroupMesh(app.renderer, {
        materialParams: { envMap, envMapIntensity: 0.25, envMapRotation: { x: -Math.PI / 2 } }
      });
      app.sceneGroup.add(sphereMesh);

      // Pointer Raycasting for Center Physics Attraction
      const pointerNormalized = new Vector2();
      window.addEventListener('pointermove', (e) => {
        if (isDragging) return;
        pointerNormalized.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointerNormalized.y = -(e.clientY / window.innerHeight) * 2 + 1;
        pointerRaycaster.setFromCamera(pointerNormalized, app.camera);
        pointerRaycaster.ray.intersectPlane(pointerPlane, planeIntersection);
        // Transform planeIntersection to sceneGroup local coordinates
        planeIntersection.sub(app.sceneGroup.position);
        sphereMesh.physics.center.copy(planeIntersection);
      });

      // Dragging Object & Zooming
      let isDragging = false;
      const prevPointer = { x: 0, y: 0 };

      window.addEventListener('pointerdown', (e) => {
        if (e.target === canvas || e.target.tagName.toLowerCase() === 'canvas') {
          isDragging = true;
          prevPointer.x = e.clientX;
          prevPointer.y = e.clientY;
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (isDragging) {
          const dx = (e.clientX - prevPointer.x) * 0.028;
          const dy = (e.clientY - prevPointer.y) * -0.028;
          app.sceneGroup.position.x += dx;
          app.sceneGroup.position.y += dy;
          prevPointer.x = e.clientX;
          prevPointer.y = e.clientY;
        }
      });

      window.addEventListener('pointerup', () => { isDragging = false; });

      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        app.camera.position.z += e.deltaY * 0.025;
        app.camera.position.z = MathUtils.clamp(app.camera.position.z, 8, 80);
      }, { passive: false });

      return { app, get spheres() { return sphereMesh; } };
    }

    // -------------------------------------------------------------
    // Application Setup & GUI Configuration
    // -------------------------------------------------------------
    const canvas = document.getElementById('webgl-canvas');
    const { app, spheres } = initApp(canvas);

    // 5 Original Presetupped Color Schemes
    const COLOR_PRESETS = {
      "Sunset Silk": { colors: ['#ff3366', '#ffaa00', '#ffccd5'], light: '#ff4422' },
      "Cyber Neon": { colors: ['#00f3ff', '#ff0055', '#0044ff'], light: '#00ffff' },
      "Emerald Luxe": { colors: ['#004b23', '#70e000', '#ffd700'], light: '#aacc00' },
      "Obsidian Rose": { colors: ['#1a1a1a', '#b76e79', '#ffffff'], light: '#ffb7c5' },
      "Cosmic Lavender": { colors: ['#7b2cbf', '#c77dff', '#48cae4'], light: '#9d4edd' }
    };

    let uploadedSVGPoints = null;
    let animTime = 0;

    const settings = {
      colorPreset: "Sunset Silk",
      color1: COLOR_PRESETS["Sunset Silk"].colors[0],
      color2: COLOR_PRESETS["Sunset Silk"].colors[1],
      color3: COLOR_PRESETS["Sunset Silk"].colors[2],
      lightColor: COLOR_PRESETS["Sunset Silk"].light,
      greenscreen: false,
      dpr: Math.min(window.devicePixelRatio, 2),
      animSpeed: 1.0,
      animation: "Static (Off)",
      shapeForm: "Sphere Cluster",
      uploadSVG: () => document.getElementById('svg-upload').click()
    };

    function applyColors() {
      spheres.setColors([settings.color1, settings.color2, settings.color3]);
      spheres.pointLight.color.set(settings.lightColor);
    }

    function applyColorPreset(name) {
      if (COLOR_PRESETS[name]) {
        const p = COLOR_PRESETS[name];
        settings.color1 = p.colors[0];
        settings.color2 = p.colors[1];
        settings.color3 = p.colors[2];
        settings.lightColor = p.light;
        c1Ctrl.setValue(settings.color1);
        c2Ctrl.setValue(settings.color2);
        c3Ctrl.setValue(settings.color3);
        lcCtrl.setValue(settings.lightColor);
        applyColors();
      }
    }

    function updateBackground() {
      const appDiv = document.getElementById('app');
      if (settings.greenscreen) {
        document.body.style.background = '#00ff00';
        appDiv.style.background = '#00ff00';
        app.renderer.setClearColor(0x00ff00, 1);
      } else {
        document.body.style.background = '';
        appDiv.style.background = 'radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(0,0,0,0.5) 200%)';
        app.renderer.setClearColor(0x000000, 0);
      }
    }

    function updateShapeForm(formName) {
      if (formName === "Sphere Cluster") {
        spheres.physics.setTargetShape(null);
      } else if (formName === "Uploaded SVG") {
        if (uploadedSVGPoints) {
          spheres.physics.setTargetShape(uploadedSVGPoints);
        } else {
          alert("Please upload an SVG file first!");
          shapeCtrl.setValue("Sphere Cluster");
        }
      } else {
        const pts = generateShapePoints(formName, spheres.config.count);
        spheres.physics.setTargetShape(pts);
      }
    }

    // lil-gui setup
    const gui = new GUI({ title: "Scene Settings" });

    // Color controls
    const fColors = gui.addFolder("Colors & Presets");
    fColors.add(settings, "colorPreset", Object.keys(COLOR_PRESETS)).name("Preset").onChange(applyColorPreset);
    const c1Ctrl = fColors.addColor(settings, "color1").name("Primary Color").onChange(applyColors);
    const c2Ctrl = fColors.addColor(settings, "color2").name("Secondary Color").onChange(applyColors);
    const c3Ctrl = fColors.addColor(settings, "color3").name("Accent Color").onChange(applyColors);
    const lcCtrl = fColors.addColor(settings, "lightColor").name("Light Color").onChange(applyColors);
    fColors.add(settings, "greenscreen").name("Greenscreen (#00ff00)").onChange(updateBackground);

    // Animation controls (5 smooth presets)
    const fAnim = gui.addFolder("Animation & Motion");
    const ANIMATION_PRESETS = ["Static (Off)", "Gentle Orbit", "Floating Bob", "Cinematic Infinity", "Spiral Wobble"];
    fAnim.add(settings, "animation", ANIMATION_PRESETS).name("Camera Motion");
    fAnim.add(settings, "animSpeed", 0.1, 3.0, 0.1).name("Anim Speed");

    // Rendering settings
    const fRender = gui.addFolder("Rendering");
    fRender.add(settings, "dpr", 0.5, 2.5, 0.1).name("Pixel Ratio (DPR)").onChange(v => app.renderer.setPixelRatio(v));

    // Shape & Form controls
    const fForm = gui.addFolder("Shape & Form");
    const SHAPE_OPTIONS = ["Sphere Cluster", "Heart", "Star", "Torus Ring", "Infinity", "Uploaded SVG"];
    const shapeCtrl = fForm.add(settings, "shapeForm", SHAPE_OPTIONS).name("Form Shape").onChange(updateShapeForm);
    fForm.add(settings, "uploadSVG").name("Upload SVG File...");

    // File input handler for custom SVG upload
    const fileInput = document.getElementById('svg-upload');
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
          const points = samplePointsFromSVG(ev.target.result, spheres.config.count);
          if (points && points.length > 0) {
            uploadedSVGPoints = points;
            settings.shapeForm = "Uploaded SVG";
            shapeCtrl.setValue("Uploaded SVG");
            updateShapeForm("Uploaded SVG");
          } else {
            alert("Could not extract path points from the SVG file.");
          }
        };
        reader.readAsText(file);
      }
    });

    // Random colors button
    document.getElementById('colors-btn').addEventListener('click', (ev) => {
      ev.stopPropagation();
      settings.color1 = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      settings.color2 = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      settings.color3 = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      settings.lightColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      c1Ctrl.setValue(settings.color1);
      c2Ctrl.setValue(settings.color2);
      c3Ctrl.setValue(settings.color3);
      lcCtrl.setValue(settings.lightColor);
      applyColors();
    });

    // Hide/Show UI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const isHidden = gui._hidden;
        if (isHidden) {
          gui.show();
          document.querySelector('.buttons').style.display = 'flex';
          document.querySelector('.hero').style.display = 'flex';
        } else {
          gui.hide();
          document.querySelector('.buttons').style.display = 'none';
          document.querySelector('.hero').style.display = 'none';
        }
      }
    });

    // Auto infinite animation loop update
    app.onBeforeRender = (timeData) => {
      const scaledDelta = timeData.delta * settings.animSpeed;
      animTime += scaledDelta;

      const baseZ = app.camera.position.z;
      const targetPos = app.sceneGroup.position;

      // Handle 5 presetupped camera animations
      if (settings.animation === "Gentle Orbit") {
        const r = Math.max(20, baseZ);
        app.camera.position.x = Math.sin(animTime * 0.3) * (r * 0.4);
        app.camera.position.z = Math.cos(animTime * 0.3) * (r * 0.4) + (r * 0.84);
        app.camera.position.y = Math.sin(animTime * 0.2) * 2;
        app.camera.lookAt(targetPos);
      } else if (settings.animation === "Floating Bob") {
        app.camera.position.y = Math.sin(animTime * 0.6) * 3;
        app.camera.position.x = Math.cos(animTime * 0.3) * 2;
        app.camera.lookAt(targetPos);
      } else if (settings.animation === "Cinematic Infinity") {
        app.camera.position.x = Math.sin(animTime * 0.4) * 6;
        app.camera.position.y = Math.sin(animTime * 0.8) * 3;
        app.camera.lookAt(targetPos);
      } else if (settings.animation === "Spiral Wobble") {
        const r = baseZ + Math.sin(animTime * 0.4) * 3;
        app.camera.position.x = Math.sin(animTime * 0.25) * 5;
        app.camera.position.y = Math.cos(animTime * 0.5) * 3;
        app.camera.lookAt(targetPos);
      } else {
        // Static: maintain lookAt targetPos
        app.camera.lookAt(targetPos);
      }

      // Update spheres physics with scaled delta
      spheres.update({ delta: scaledDelta });
    };
  </script>
</body>
</html>
