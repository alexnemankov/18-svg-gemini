<head>

  <title>Botanical Foliage & Sun Study</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7DFCB;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      cursor: pointer;
    }

    /* Save Button & Botanical Flourish */
    .save-container {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 1000;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .save-container.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(0.95);
    }

    .save-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      background: rgba(231, 223, 203, 0.9);
      color: #14301F;
      border: 1.5px solid rgba(20, 48, 31, 0.32);
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 
        0 4px 14px rgba(20, 48, 31, 0.14),
        0 1px 3px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 2;
      outline: none;
      white-space: nowrap;
    }

    .save-btn:hover {
      background: rgba(242, 236, 222, 0.98);
      border-color: rgba(20, 48, 31, 0.55);
      color: #0c1f14;
      transform: translateY(-1.5px) scale(1.02);
      box-shadow: 
        0 7px 20px rgba(20, 48, 31, 0.18),
        0 2px 5px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .save-btn:active {
      transform: translateY(0.5px) scale(0.98);
      box-shadow: 0 2px 8px rgba(20, 48, 31, 0.14);
    }

    .save-icon {
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .check-icon {
      display: none;
    }

    .save-btn.saved {
      background: rgba(220, 235, 218, 0.96);
      border-color: #2C5E45;
      color: #14301F;
    }

    .save-btn.saved .download-icon {
      display: none;
    }

    .save-btn.saved .check-icon {
      display: inline-block;
      animation: checkPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes checkPop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .sprout-container {
      position: absolute;
      bottom: 0px;
      left: 0px;
      width: 240px;
      height: 220px;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    .flourish-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 240px;
      height: 220px;
      overflow: visible;
      animation: flourishFade 2.0s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes flourishFade {
      0% { opacity: 1; transform: translate(0, 0); }
      72% { opacity: 1; transform: translate(0, -3px); }
      100% { opacity: 0; transform: translate(0, -12px); }
    }

    .botanical-stem {
      fill: none;
      stroke: #1E3F2B;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawStem 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes drawStem {
      to { stroke-dashoffset: 0; }
    }

    .botanical-leaf-shape {
      transform-origin: 0px 0px;
      transform: scale(0);
      animation: bloomLeaf 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes bloomLeaf {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 0.95; }
    }
  </style>

  obovate: 'Обратнояйцевидный',
  cordate: 'Сердцевидный',
  oak: 'Дуб',
  banana: 'Банан',
  grass: 'Трава',
  fern: 'Папоротник',
  ginkgo: 'Гинкго',
  maple: 'Клён',
  agave: 'Агава',
  blossom: 'Цветение',
  lavender: 'Лаванда',
};

let currentPlantName = 'classic';

function getEffectivePlantName() {
  if (currentPlantName === 'auto') {
    return currentTheme.defaultPlant || 'classic';
  }
  return currentPlantName;
}

// ============================================================
// State & Shaders
// ============================================================
let scene;
let painter;
let desatFilter;
let grainFilter;

const DESAT_SHADER = `
  precision highp float;
  varying vec2 vTexCoord;
  uniform sampler2D tex0;
  uniform float amount;

  void main() {
    vec4 color = texture2D(tex0, vTexCoord);
    float grey = dot(color.rgb, vec3(0.299, 0.587, 0.114));
    gl_FragColor = vec4(mix(color.rgb, vec3(grey), amount), color.a);
  }
`;

const GRAIN_SHADER = `
  precision highp float;
  varying vec2 vTexCoord;
  uniform sampler2D tex0;
  uniform float grainAmount;
  uniform float grainStrength;

  float rand(vec2 n) {
    return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);
  }

  void main() {
    vec4 color = texture2D(tex0, vTexCoord);
    float noise = rand(vTexCoord * 1234.5678) * 2.0 - 1.0;
    vec3 grain = vec3(noise, noise, noise) * grainStrength * grainAmount;
    gl_FragColor = vec4(clamp(color.rgb + grain, 0.0, 1.0), color.a);
  }
`;

function canvasSize() {
  return [windowWidth, windowHeight];
}

function setup() {
  const [w, h] = canvasSize();
  createCanvas(w, h, WEBGL);
  brush.scaleBrushes(2.5 * (h / REF_HEIGHT));
  desatFilter = createFilterShader(DESAT_SHADER);
  grainFilter = createFilterShader(GRAIN_SHADER);
  readHash();
  updateButtons();
  newScene();
}

function windowResized() {
  const [w, h] = canvasSize();
  resizeCanvas(w, h);
  brush.scaleBrushes(2.5 * (h / REF_HEIGHT));
  newScene();
}

function draw() {
  translate(-width / 2, -height / 2);
  if (painter && painter.next().done) noLoop();
}

function newScene() {
  painter = paintScene();
  loop();
}

function* paintScene() {
  background(currentTheme.base);
  const sky = makeBackground();
  yield* paintBackground(sky);
  yield;
  desatFilter.setUniform('amount', BG_DESATURATE);
  filter(desatFilter);

  // Global light source for Stage 3
  const lightSource = (sky.suns && sky.suns.length > 0)
    ? { x: sky.suns[0].x, y: sky.suns[0].y }
    : { x: width * 0.2, y: height * 0.1 };

  scene = makeArrangement();
  yield* paintArrangement(scene, lightSource);
  yield;
  grainFilter.setUniform('grainAmount', 1);
  grainFilter.setUniform('grainStrength', GRAIN_STRENGTH);
  filter(grainFilter);
}

function mousePressed(e) {
  if (e && e.target && (e.target.closest('#save-btn') || e.target.closest('.save-container'))) {
    return;
  }
  newScene();
}

// ============================================================
// STAGE 2: SKY & BACKGROUND GENERATION
// ============================================================
function pickSkyStops() {
  const first = random(currentTheme.skyPalettes).map((swatch) => color(swatch));
  if (random() > SKY_MIX_CHANCE) return first;
  const _second = random(currentTheme.skyPalettes).map((swatch) => color(swatch));
  return [first[0], lerpColor(first[1], _second[1], 0.5), _second[2]];
}

function pickSkyStyle(styles) {
  const entries = Object.entries(styles);
  const total = entries.reduce((s, [, w]) => s + w, 0);
  if (total <= 0) return 'sun';
  let r = random() * total;
  for (const [k, w] of entries) {
    r -= w;
    if (r <= 0) return k;
  }
  return entries[0][0];
}

function makeBackground() {
  const stops = pickSkyStops();
  const neutral = color(currentTheme.base);
  const flip = random() < 0.5;
  const count = floor(random(SKY_BANDS[0], SKY_BANDS[1] + 1));
  const wobble = random(12, 50);
  const origin = random(1000);

  const edges = [];
  for (let i = 0; i <= count; i++) {
    const y = map(i, 0, count, -20, height + 20);
    edges.push(skyEdge(y, i === 0 || i === count ? 0 : wobble, origin + i * 7));
  }

  const bands = [];
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const sky = rampColor(stops, flip ? 1 - t : t);
    const mute = random() < SKY_ACCENT_CHANCE ? random(0.1, 0.35) : random(0.45, 0.8);
    bands.push({
      yCenter: map(i + 0.5, 0, count, 0, height),
      points: [...edges[i], ...[...edges[i + 1]].reverse()],
      tone: lerpColor(sky, neutral, mute),
    });
  }

  const blocks = [];
  const blockCount = floor(random(SKY_BLOCKS[0], SKY_BLOCKS[1] + 1));
  for (let i = 0; i < blockCount; i++) {
    const sky = rampColor(stops, random());
    blocks.push({
      points: skyBlock(),
      tone: lerpColor(sky, neutral, random() < SKY_ACCENT_CHANCE ? random(0.15, 0.4) : random(0.5, 0.82)),
    });
  }

  const skyStyle = pickSkyStyle(currentTheme.skyStyles);
  const suns = [];
  const aurora = [];
  const stars = [];
  const ranges = [];

  const baseDimension = min(width, height * 1.25);

  if (skyStyle === 'sun') {
    const sunCount = random([1, 1, 1, 1, 2, 2, 2, 3]);
    for (let i = 0; i < sunCount; i++) {
      const radius = baseDimension * random(SUN_SIZE[0], SUN_SIZE[1]) * (sunCount >= 2 ? 0.8 : 1);
      const ramp = random(currentTheme.sunRamps).map((swatch) => color(swatch));
      if (random() < 0.2) ramp.reverse();
      const ringCount = floor(random(SUN_RINGS[0], SUN_RINGS[1] + 1));
      const rings = [];
      for (let r = 0; r < ringCount; r++) {
        const t = (r + 1) / ringCount;
        rings.push({
          points: makeBlob(radius * lerp(0.9, 0.16, t), random(0.03, 0.1)),
          tone: rampColor(ramp, t),
        });
      }
      suns.push({
        x: width * random(0.12, 0.88),
        y: height * random(-0.025, 0.25),
        radius,
        tone: rampColor(ramp, 0),
        rings,
        disc: makeBlob(radius, random(0.03, 0.08)),
      });
    }
  } else if (skyStyle === 'moon') {
    const radius = baseDimension * random(0.18, 0.32);
    const coolRamps = currentTheme.sunRamps;
    const ramp = random(coolRamps).map((swatch) => color(swatch));
    const ringCount = floor(random(5, 9));
    const rings = [];
    for (let r = 0; r < ringCount; r++) {
      const t = (r + 1) / ringCount;
      rings.push({
        points: makeBlob(radius * lerp(1.6, 0.25, t), random(0.02, 0.08)),
        tone: lerpColor(rampColor(ramp, t), neutral, 0.4),
        bleed: 0.65,
        alpha: 140
      });
    }
    const craterCount = floor(random(2, 5));
    const craters = [];
    for (let c = 0; c < craterCount; c++) {
      const angle = random(TWO_PI);
      const dist = radius * random(0.15, 0.6);
      const craterRadius = radius * random(0.08, 0.2);
      craters.push({
        x: cos(angle) * dist,
        y: sin(angle) * dist,
        points: makeBlob(craterRadius, 0.25),
        tone: lerpColor(color(currentTheme.shadow), neutral, 0.35)
      });
    }
    suns.push({
      x: width * random(0.18, 0.82),
      y: height * random(0.02, 0.25),
      radius,
      tone: rampColor(ramp, 0.2),
      rings,
      disc: makeBlob(radius, random(0.02, 0.05)),
      craters
    });
  } else if (skyStyle === 'sunset') {
    const radius = baseDimension * random(0.26, 0.4);
    const sunX = width * random(0.28, 0.72);
    const sunY = height * random(0.18, 0.38);
    const ramp = random(currentTheme.sunRamps).map((swatch) => color(swatch));
    const ringCount = floor(random(SUN_RINGS[0], SUN_RINGS[1] + 1));
    const rings = [];
    for (let r = 0; r < ringCount; r++) {
      const t = (r + 1) / ringCount;
      rings.push({
        points: makeBlob(radius * lerp(0.9, 0.16, t), random(0.03, 0.1)),
        tone: rampColor(ramp, t),
      });
    }
    const stripeCount = floor(random(5, 8));
    const stripes = [];
    for (let k = 0; k < stripeCount; k++) {
      const frac = pow((k + 0.8) / (stripeCount + 0.8), 1.35);
      const sy = sunY + radius * frac;
      const sh = map(k, 0, stripeCount - 1, 3, 14) * (height / REF_HEIGHT);
      const dy = sy - sunY;
      const chordHalf = sqrt(max(0, radius * radius - dy * dy)) * 1.08;
      let stripeTone = neutral;
      for (const band of bands) {
        if (abs(band.yCenter - sy) < height / count) {
          stripeTone = band.tone;
          break;
        }
      }
      stripes.push({
        x: sunX - chordHalf,
        y: sy,
        w: chordHalf * 2,
        h: sh,
        tone: stripeTone
      });
    }
    suns.push({
      x: sunX,
      y: sunY,
      radius,
      tone: rampColor(ramp, 0),
      rings,
      disc: makeBlob(radius, random(0.03, 0.07)),
      stripes
    });
  } else if (skyStyle === 'aurora') {
    const ribbonCount = floor(random(2, 5));
    const auroraColors = [
      color('#38EF7D'), color('#11998E'), color('#2AF598'),
      color('#7F00FF'), color('#B224EF'), color('#C471ED')
    ];
    for (let rib = 0; rib < ribbonCount; rib++) {
      const ribSeed = random(1000);
      const ribYBase = height * random(0.12, 0.38);
      const ribHBase = height * random(0.16, 0.32);
      const ribSlices = [];
      const numSlices = 36;
      for (let s = 0; s < numSlices; s++) {
        const sx = map(s, 0, numSlices - 1, -width * 0.05, width * 1.05);
        const sw = (width * 1.1) / numSlices + 2;
        const n1 = noise(ribSeed + s * 0.08);
        const n2 = noise(ribSeed + 50 + s * 0.1);
        const sy = ribYBase + (n1 - 0.5) * height * 0.2;
        const sh = ribHBase * (0.6 + 0.8 * n2);
        const colBottom = random(auroraColors.slice(0, 3));
        const colTop = random(auroraColors.slice(3, 6));
        ribSlices.push({
          x: sx,
          y: sy,
          w: sw,
          h: sh,
          colBottom,
          colTop
        });
      }
      aurora.push({ slices: ribSlices });
    }
    if (random() < 0.6) {
      const radius = baseDimension * random(0.15, 0.25);
      const ramp = random(currentTheme.sunRamps).map((swatch) => color(swatch));
      suns.push({
        x: width * random(0.2, 0.8),
        y: height * random(0.05, 0.22),
        radius,
        tone: rampColor(ramp, 0.2),
        rings: [],
        disc: makeBlob(radius, 0.04)
      });
    }
  }

  // Stars: 40-120
  const hasStars = random() < (currentTheme.starsChance ?? 0) || (skyStyle === 'moon' && random() < 0.85) || (skyStyle === 'aurora' && random() < 0.9);
  if (hasStars) {
    const starCount = floor(random(40, 121));
    for (let st = 0; st < starCount; st++) {
      const sx = width * random(0.02, 0.98);
      const sy = height * random(0.02, 0.55);
      let tooClose = false;
      for (const sun of suns) {
        if (dist(sx, sy, sun.x, sun.y) < sun.radius * 1.18) {
          tooClose = true;
          break;
        }
      }
      if (!tooClose) {
        stars.push({
          x: sx,
          y: sy,
          size: random(1.5, 5) * (height / REF_HEIGHT),
          alpha: random(90, 240),
          isCross: random() < 0.35,
          tone: lerpColor(color('#FFFDF5'), neutral, random(0, 0.25))
        });
      }
    }
  }

  // Mountains: 2-3 silhouettes
  const hasRanges = random() < (currentTheme.rangesChance ?? 0);
  if (hasRanges) {
    const rangeCount = floor(random(2, 4));
    for (let r = 0; r < rangeCount; r++) {
      const t = rangeCount === 1 ? 0.5 : r / (rangeCount - 1);
      const baseY = lerp(height * 0.55, height * 0.78, t);
      const amp = height * lerp(0.18, 0.08, t);
      const seed1 = random(1000);
      const seed2 = random(1000);
      const pts = [];
      const steps = 36;
      for (let i = 0; i <= steps; i++) {
        const x = map(i, 0, steps, -width * 0.05, width * 1.05);
        const n = noise(seed1 + i * 0.09) * 0.72 + noise(seed2 + i * 0.35) * 0.28;
        pts.push({ x, y: baseY - n * amp });
      }
      pts.push({ x: width * 1.05, y: height + 25 });
      pts.push({ x: -width * 0.05, y: height + 25 });
      const farColor = lerpColor(stops[0], color(currentTheme.shadow), 0.35);
      const nearColor = lerpColor(stops[0], color(currentTheme.shadow), 0.78);
      ranges.push({
        points: pts,
        tone: lerpColor(farColor, nearColor, t)
      });
    }
  }

  return { bands, blocks, suns, stars, ranges, aurora };
}

function skyBlock() {
  const x = width * random(-0.08, 0.72);
  const y = height * random(-0.04, 0.7);
  const w = width * random(0.2, 0.55);
  const h = height * random(0.08, 0.28);
  const wobble = random(8, 28);
  const origin = random(1000);
  const top = skyEdgeSpan(x, y, w, wobble, origin);
  const bottom = skyEdgeSpan(x, y + h, w, wobble, origin + 9);
  const left = [];
  const right = [];
  const steps = 10;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    left.push({
      x: x + (noise(origin + 20 + t * 3) - 0.5) * wobble,
      y: lerp(y, y + h, t),
    });
    right.push({
      x: x + w + (noise(origin + 40 + t * 3) - 0.5) * wobble,
      y: lerp(y, y + h, t),
    });
  }
  return [...top, ...right, ...[...bottom].reverse(), ...[...left].reverse()];
}

function skyEdgeSpan(x, y, w, wobble, origin) {
  const points = [];
  const steps = 16;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    points.push({
      x: x + w * t,
      y: y + (noise(origin + t * 4) - 0.5) * wobble,
    });
  }
  return points;
}

function skyEdge(y, wobble, origin) {
  const points = [];
  const steps = 26;
  for (let i = 0; i <= steps; i++) {
    const x = map(i, 0, steps, -width * 0.05, width * 1.05);
    points.push({ x, y: y + (noise(origin + i * 0.18) - 0.5) * wobble });
  }
  return points;
}

function* paintBackground(sky) {
  // 1. Bands
  for (const band of sky.bands) {
    paintPatch(band.points, band.tone, SKY_ALPHA, 0.25);
    yield;
  }

  // 2. Blocks
  for (const block of sky.blocks) {
    paintPatch(block.points, block.tone, SKY_ALPHA, 0.2);
    yield;
  }

  // 3. Stars (fast p5 primitives, batched per yield)
  if (sky.stars && sky.stars.length > 0) {
    const chunkSize = 20;
    for (let i = 0; i < sky.stars.length; i += chunkSize) {
      push();
      noStroke();
      for (let j = i; j < min(sky.stars.length, i + chunkSize); j++) {
        const star = sky.stars[j];
        fill(red(star.tone), green(star.tone), blue(star.tone), star.alpha);
        if (star.isCross) {
          const s = star.size;
          beginShape();
          vertex(star.x, star.y - s * 1.4);
          vertex(star.x + s * 0.3, star.y - s * 0.3);
          vertex(star.x + s * 1.4, star.y);
          vertex(star.x + s * 0.3, star.y + s * 0.3);
          vertex(star.x, star.y + s * 1.4);
          vertex(star.x - s * 0.3, star.y + s * 0.3);
          vertex(star.x - s * 1.4, star.y);
          vertex(star.x - s * 0.3, star.y - s * 0.3);
          endShape(CLOSE);
        } else {
          ellipse(star.x, star.y, star.size, star.size);
        }
      }
      pop();
      yield;
    }
  }

  // 4. Aurora
  if (sky.aurora && sky.aurora.length > 0) {
    for (const rib of sky.aurora) {
      push();
      noStroke();
      for (const slice of rib.slices) {
        const gradSteps = 6;
        for (let g = 0; g < gradSteps; g++) {
          const t = g / gradSteps;
          const col = lerpColor(slice.colBottom, slice.colTop, t);
          const a = lerp(120, 20, t);
          fill(red(col), green(col), blue(col), a);
          const y1 = slice.y + slice.h * (1 - (g + 1) / gradSteps);
          const hSeg = slice.h / gradSteps + 1;
          rect(slice.x, y1, slice.w, hSeg);
        }
      }
      pop();
      yield;
    }
  }

  // 5. Suns (suns, moon craters, retro sunset stripes)
  for (const sun of sky.suns) {
    push();
    translate(sun.x, sun.y);
    paintSunRing(sun.disc, sun.tone, 0.42);
    pop();
    yield;

    for (const ring of sun.rings) {
      push();
      translate(sun.x, sun.y);
      paintSunRing(ring.points, ring.tone, ring.bleed ?? 0.5);
      pop();
      yield;
    }

    if (sun.craters && sun.craters.length > 0) {
      push();
      translate(sun.x, sun.y);
      for (const crater of sun.craters) {
        push();
        translate(crater.x, crater.y);
        paintPatch(crater.points, crater.tone, 0.35, 0.1, 0.2);
        pop();
      }
      pop();
      yield;
    }

    if (sun.stripes && sun.stripes.length > 0) {
      push();
      noStroke();
      for (const st of sun.stripes) {
        fill(st.tone);
        rect(st.x, st.y, st.w, st.h);
      }
      pop();
      yield;
    }
  }

  // 6. Ranges (mountains)
  if (sky.ranges && sky.ranges.length > 0) {
    for (const range of sky.ranges) {
      paintPatch(range.points, range.tone, SKY_ALPHA, 0.3);
      yield;
    }
  }
}

function paintSunRing(points, tone, bleed) {
  brush.noStroke();
  brush.fill(tone, 225);
  brush.fillBleed(bleed, 'out');
  brush.fillTexture(0.45, 0.12);
  brush.polygon(points.map((p) => [p.x, p.y]));
  brush.noFill();
}

// ============================================================
// STAGE 3 & 4: ARRANGEMENT & GEOMETRY GENERATORS
// ============================================================
function makeArrangement() {
  const rootX = width * 0.5;
  const rootY = height * 1.03;
  const plants = [];

  plants.push(...makeBackdrop());

  const effPlant = getEffectivePlantName();
  const pDef = PLANT_TYPES[effPlant] || PLANT_TYPES.classic;
  const arrangement = pDef.arrangement || 'fan';

  if (arrangement === 'rosette') {
    makeRosetteArrangement(plants);
  } else if (arrangement === 'branch') {
    makeBranchArrangement(plants);
  } else if (arrangement === 'spike') {
    makeSpikeArrangement(plants);
  } else {
    // fan, droop, frond
    const widthScale = max(1, min(1.6, width / (height * 0.8)));

    for (const layer of LAYERS) {
      const count = floor(random(layer.count[0], layer.count[1] + 1) * widthScale);
      for (let i = 0; i < count; i++) {
        const fan = count === 1 ? 0 : map(i + random(-0.35, 0.35), 0, count - 1, -1, 1);
        const sizeScale = random(layer.sizeScale[0], layer.sizeScale[1]) * (pDef.leafScale ?? 1.0);
        const leafLength = height * random(0.3, 0.55) * sizeScale;
        let bend = Math.sign(fan || random(-1, 1)) * random(0.2, 0.85);
        if (arrangement === 'droop') {
          bend = Math.sign(fan || random(-1, 1)) * random(0.7, 1.4);
        }

        const strays = random() < 0.32;
        const stemLength =
          height *
          random(layer.stem[0], layer.stem[1]) *
          (1 - 0.35 * abs(fan)) *
          (strays ? random(1, 1.4) : 1);
        let tilt = strays
          ? Math.sign(random(-1, 1)) * pow(random(), 1.8) * 0.6
          : Math.sign(fan) * pow(abs(fan), 0.75) * layer.spread;

        const root = {
          x: rootX + fan * width * layer.root * (strays ? 2.4 : 1),
          y: rootY * random(1, 1.1),
        };

        const bodyX = () => root.x + sin(tilt) * stemLength + sin(tilt + bend * 0.2) * leafLength * 0.5;
        for (let k = 0; k < 4 && abs(bodyX() - rootX) > width * 0.42; k++) tilt *= 0.7;

        const mute = constrain(layer.mute + random(-0.08, 0.08), 0, 1);
        const stemWeight = max(1.5, 4.5 * sizeScale);

        if (effPlant === 'fern') {
          plants.push(...makeFernFrond(root, tilt, stemLength * 1.2, mute, stemWeight));
          continue;
        }

        if (effPlant === 'grass') {
          plants.push(makeGrass(root, tilt, stemLength, leafLength, bend, mute, stemWeight));
          continue;
        }

        if (effPlant === 'classic') {
          const kind = random();
          if (kind < GRASS_CHANCE) {
            plants.push(makeGrass(root, tilt, stemLength, leafLength, bend, mute, stemWeight));
            continue;
          }
          if (kind < GRASS_CHANCE + FROND_CHANCE + BERRY_CHANCE) {
            const sprig = kind < GRASS_CHANCE + FROND_CHANCE ? 'frond' : 'berry';
            plants.push(...makeSprig(sprig, root, tilt, stemLength * 1.25, mute, stemWeight));
            continue;
          }
        }

        const stem = growStem(root, tilt, stemLength);
        let leaf;
        if (effPlant === 'ginkgo') {
          leaf = makeGinkgoLeaf({ leafLength, cutCount: pDef.cuts });
        } else if (effPlant === 'maple') {
          leaf = makeMapleLeaf({ leafLength, cutCount: pDef.cuts });
        } else {
          leaf = makeLeaf({
            leafLength,
            bend,
            baseExp: pDef.a ? random(pDef.a[0], pDef.a[1]) : undefined,
            tipExp: pDef.b ? random(pDef.b[0], pDef.b[1]) : undefined,
            widthRatio: pDef.widthRatio ? random(pDef.widthRatio[0], pDef.widthRatio[1]) : undefined,
            lean: pDef.lean,
            cutCount: pDef.cuts,
            isCordate: pDef.isCordate,
            isOak: pDef.isOak,
            lobeCount: pDef.lobes ? floor(random(pDef.lobes.count[0], pDef.lobes.count[1] + 1)) : undefined,
            lobeDepth: pDef.lobes ? random(pDef.lobes.depth[0], pDef.lobes.depth[1]) : undefined,
          });
        }

        if (effPlant === 'classic' && random() < 0.22) {
          const sprouts = floor(random(1, 4));
          for (let s = 0; s < sprouts; s++) {
            plants.push(makeSprout(stem, stemLength, leafLength, leaf.stops, mute, stemWeight));
          }
        }

        plants.push({
          kind: 'leaf',
          leaf,
          base: stem.base,
          stem: stem.points,
          stemColor: leaf.stemColor,
          rotation: stem.rotation,
          stemWeight,
          mute,
        });
      }
    }
  }

  plants.push(...makeGroundCover());
  return plants;
}

function makeBackdrop() {
  const items = [];
  const widthScale = max(1, min(1.6, width / (height * 0.8)));
  const count = floor(random(BACKDROP_COUNT[0], BACKDROP_COUNT[1] + 1) * widthScale);

  for (let i = 0; i < count; i++) {
    const spread = count === 1 ? 0 : map(i + random(-0.2, 0.2), 0, count - 1, -1, 1);
    const at = 0.5 + spread * 0.48;
    const root = { x: width * at, y: height * random(1.0, 1.25) };
    const inward = at < 0.5 ? 1 : -1;
    const tilt =
      (random() < 0.75 ? inward : -inward) * radians(random(BACKDROP_TILT[0], BACKDROP_TILT[1]));
    const stem = growStem(root, tilt, height * random(0.02, 0.16));
    const leaf = makeLeaf({
      leafLength: height * random(0.25, 0.45),
      bend: -Math.sign(tilt) * random(0.1, 0.5),
      widthRatio: random(0.15, 0.3),
    });

    items.push({
      kind: 'leaf',
      leaf,
      base: stem.base,
      stem: stem.points,
      stemColor: leaf.stemColor,
      rotation: stem.rotation,
      stemWeight: random(1.5, 3.5),
      mute: random(BACKDROP_MUTE[0], BACKDROP_MUTE[1]),
    });
  }
  return items;
}

function makeGroundCover() {
  const items = [];
  const widthScale = max(1, min(1.6, width / (height * 0.8)));
  const count = floor(random(GROUND_COUNT[0], GROUND_COUNT[1] + 1) * widthScale);

  for (let i = 0; i < count; i++) {
    const spread = count === 1 ? 0 : map(i + random(-0.35, 0.35), 0, count - 1, -1, 1);
    const at = 0.5 + Math.sign(spread) * pow(abs(spread), 0.65) * 0.62;
    const root = { x: width * at, y: height * random(1.0, 1.16) };
    const inward = at < 0.5 ? 1 : -1;
    // Bug fixed: radians(random(GROUND_TILT[0], GROUND_TILT[1]))
    const tilt =
      (random() < 0.65 ? inward : -inward) * radians(random(GROUND_TILT[0], GROUND_TILT[1]));
    const stem = growStem(root, tilt, height * random(0.02, 0.14));
    const leaf = makeLeaf({
      leafLength: height * random(0.3, 0.6),
      bend: -Math.sign(tilt) * random(0.15, 0.6),
    });

    items.push({
      kind: 'leaf',
      leaf,
      base: stem.base,
      stem: stem.points,
      stemColor: leaf.stemColor,
      rotation: stem.rotation,
      stemWeight: random(2, 5),
      mute: random(GROUND_MUTE[0], GROUND_MUTE[1]),
    });
  }
  return items;
}

function makeGrass(root, tilt, stemLength, leafLength, bend, mute, stemWeight) {
  const stem = growStem(root, tilt, stemLength * random(0.12, 0.3));
  const leaf = makeLeaf({
    leafLength: leafLength * random(1.1, 1.6),
    bend: bend * random(0.8, 1.8),
    widthRatio: random(0.022, 0.05),
    tipExp: random(1.3, 1.9),
    split: true,
  });

  return {
    kind: 'leaf',
    leaf,
    base: stem.base,
    stem: stem.points,
    stemColor: leaf.stemColor,
    rotation: stem.rotation,
    stemWeight: stemWeight * 0.5,
    mute,
  };
}

function makeSprig(kind, root, tilt, stemLength, mute, stemWeight) {
  const stem = growStem(root, tilt, stemLength);
  const paletteSource = kind === 'berry' ? currentTheme.accentPalettes : currentTheme.leafPalettes;
  const stops = random(paletteSource).map((swatch) => color(swatch));
  const stemColor = rampColor(stops, random(0.1, 0.35));
  const items = [{ kind: 'stem', stem: stem.points, stemColor, stemWeight: stemWeight * 0.5, mute }];

  const count = floor(random(8, 16));
  const first = random(0.12, 0.3);
  const spread = random(0.5, 1.1);
  const sproutSize = random(0.09, 0.2);
  let side = random() < 0.5 ? -1 : 1;

  for (let i = 0; i <= count; i++) {
    const at = lerp(first, 1, i / count);
    const anchor = quadPoint(stem.curve, at);
    const heading = quadTilt(stem.curve, at);
    const tip = i === count;
    const stalk = growStem(
      anchor,
      tip ? heading : heading + side * spread,
      stemLength * (tip ? 0.02 : random(0.03, 0.07))
    );
    const sizeScale = tip ? 0.7 : random(0.75, 1.15);

    items.push(
      kind === 'frond'
        ? {
            kind: 'leaf',
            leaf: makeLeaf({
              leafLength: stemLength * sproutSize * sizeScale,
              bend: side * random(0.1, 0.5),
              widthRatio: random(0.16, 0.32),
              stops,
              split: true,
            }),
            base: stalk.base,
            rotation: stalk.rotation,
            stem: stalk.points,
            stemColor,
            stemWeight: stemWeight * 0.3,
            mute,
          }
        : {
            kind: 'blob',
            blob: makeBlob(stemLength * sproutSize * 0.1 * sizeScale),
            tone: rampColor(stops, random(0.35, 0.95)),
            base: stalk.base,
            stem: stalk.points,
            stemColor,
            stemWeight: stemWeight * 0.25,
            mute,
          }
    );
    side *= -1;
  }
  return items;
}

function makeFernFrond(root, tilt, stemLength, mute, stemWeight) {
  const stem = growStem(root, tilt, stemLength);
  const stops = random(currentTheme.leafPalettes).map((swatch) => color(swatch));
  const stemColor = rampColor(stops, random(0.1, 0.35));
  const items = [{ kind: 'stem', stem: stem.points, stemColor, stemWeight: stemWeight * 0.5, mute }];

  const count = floor(random(14, 24));
  let side = random() < 0.5 ? -1 : 1;
  const L = stemLength * 0.3;

  for (let i = 1; i <= count; i++) {
    const at = i / count;
    const anchor = quadPoint(stem.curve, at);
    const heading = quadTilt(stem.curve, at);
    const pinnaLength = L * pow(sin(PI * at), 0.7);
    const pinnaAngle = radians(random(50, 70));
    const droop = 0.3 * pow(at, 2);
    const stalk = growStem(anchor, heading + side * pinnaAngle + droop, pinnaLength * 0.2);

    items.push({
      kind: 'leaf',
      leaf: makeLeaf({
        leafLength: pinnaLength,
        bend: side * random(0.1, 0.35),
        widthRatio: random(0.12, 0.22),
        stops,
        split: true,
      }),
      base: stalk.base,
      rotation: stalk.rotation,
      stem: stalk.points,
      stemColor,
      stemWeight: stemWeight * 0.3,
      mute,
    });
    side *= -1;
  }
  return items;
}

function makeRosetteArrangement(plants) {
  const center = { x: width * 0.5, y: height * 0.95 };
  const totalLeaves = floor(random(24, 38));
  const goldenAngle = radians(137.5);
  const maxLen = height * random(0.38, 0.55);

  for (let i = totalLeaves; i >= 1; i--) {
    const t = i / totalLeaves;
    const angle = i * goldenAngle - HALF_PI;
    const leafLen = maxLen * (0.35 + 0.65 * pow(t, 0.6));
    const mute = constrain(lerp(0.5, 0.05, t) + random(-0.06, 0.06), 0, 1);
    const stalk = growStem(center, angle, leafLen * 0.08);

    const leaf = makeLeaf({
      leafLength: leafLen,
      baseExp: 0.6,
      tipExp: 0.9,
      widthRatio: random(0.14, 0.2),
      bend: (noise(i * 10) - 0.5) * 0.3,
      lean: [0.2, 0.4],
      cutCount: [5, 10]
    });

    plants.push({
      kind: 'leaf',
      leaf,
      base: stalk.base,
      stem: stalk.points,
      stemColor: leaf.stemColor,
      rotation: stalk.rotation,
      stemWeight: max(2, 4.5 * t),
      mute,
    });
  }
}

function makeBranchArrangement(plants) {
  const root = { x: width * random(0.35, 0.65), y: height * 1.05 };
  const branchColor = color(currentTheme.shadow);

  function growBranch(start, angle, length, depth, mute) {
    const end = {
      x: start.x + sin(angle) * length,
      y: start.y - cos(angle) * length
    };
    const ctrl = {
      x: lerp(start.x, end.x, 0.5) + (noise(start.x * 0.01, depth) - 0.5) * length * 0.25,
      y: lerp(start.y, end.y, 0.5)
    };
    const curve = [start, ctrl, end];
    const stemPts = sampleQuad(curve, 16);
    const weight = max(1.2, depth * 1.6);

    plants.push({
      kind: 'stem',
      stem: stemPts,
      stemColor: branchColor,
      stemWeight: weight,
      mute
    });

    // Small leaves along the branch stems
    if (depth >= 2 && random() < 0.45) {
      const at = random(0.3, 0.75);
      const leafAnchor = quadPoint(curve, at);
      const leafHeading = quadTilt(curve, at);
      const side = random() < 0.5 ? -1 : 1;
      const leafLen = height * random(0.04, 0.075);
      const stalk = growStem(leafAnchor, leafHeading + side * random(0.7, 1.2), leafLen * 0.22);
      const bLeaf = makeLeaf({
        leafLength: leafLen,
        widthRatio: random(0.16, 0.25),
        stops: random(currentTheme.leafPalettes).map((s) => color(s)),
        bend: side * random(0.1, 0.35),
        split: true,
      });
      plants.push({
        kind: 'leaf',
        leaf: bLeaf,
        base: stalk.base,
        stem: stalk.points,
        stemColor: branchColor,
        rotation: stalk.rotation,
        stemWeight: 1.0,
        mute,
      });
    }

    if (depth <= 1 || (depth <= 2 && random() < 0.4)) {
      // Small leaf on the branch just behind/below the flower
      if (random() < 0.55) {
        const at = random(0.5, 0.75);
        const leafAnchor = quadPoint(curve, at);
        const leafHeading = quadTilt(curve, at);
        const side = random() < 0.5 ? -1 : 1;
        const leafLen = height * random(0.04, 0.07);
        const stalk = growStem(leafAnchor, leafHeading + side * random(0.7, 1.2), leafLen * 0.2);
        const lLeaf = makeLeaf({
          leafLength: leafLen,
          widthRatio: random(0.16, 0.24),
          stops: random(currentTheme.leafPalettes).map((s) => color(s)),
          bend: side * random(0.1, 0.3),
          split: true,
        });
        plants.push({
          kind: 'leaf',
          leaf: lLeaf,
          base: stalk.base,
          stem: stalk.points,
          stemColor: branchColor,
          rotation: stalk.rotation,
          stemWeight: 1.0,
          mute,
        });
      }

      // Flower with 5 petals radiating from the tip (end)
      const flowerStops = random(currentTheme.accentPalettes).map((s) => color(s));
      const petalLen = height * random(0.04, 0.075);
      const flowerRotation = random(TWO_PI);
      for (let k = 0; k < 5; k++) {
        const petAngle = flowerRotation + (TWO_PI * k) / 5;
        const petLeaf = makeLeaf({
          leafLength: petalLen,
          widthRatio: random(0.35, 0.5),
          baseExp: 0.9,
          tipExp: 0.9,
          stops: flowerStops,
          split: true,
        });
        plants.push({
          kind: 'leaf',
          leaf: petLeaf,
          base: end,
          stem: [end, end],
          stemColor: branchColor,
          rotation: petAngle,
          stemWeight: 1,
          mute: max(0, mute - 0.1),
        });
      }

      // Flower center core (pistil / stamens)
      plants.push({
        kind: 'blob',
        blob: makeBlob(petalLen * 0.24, 0.12),
        tone: rampColor(flowerStops, 0.08),
        base: end,
        stem: [end, end],
        stemColor: branchColor,
        stemWeight: 1,
        mute,
      });

      return;
    }

    const childLen = length * 0.72;
    const splitAngle = radians(random(20, 32));
    growBranch(end, angle - splitAngle + (noise(depth * 5) - 0.5) * 0.2, childLen, depth - 1, mute);
    growBranch(end, angle + splitAngle + (noise(depth * 8) - 0.5) * 0.2, childLen * random(0.85, 1.05), depth - 1, mute);
    if (depth >= 4 && random() < 0.35) {
      growBranch(end, angle + (random() < 0.5 ? -1 : 1) * radians(random(10, 20)), childLen * 0.7, depth - 2, mute);
    }
  }

  growBranch(root, radians(random(-12, 12)), height * 0.28, 5, 0.1);
}

function makeSpikeArrangement(plants) {
  const rootX = width * 0.5;
  const rootY = height * 1.05;
  const count = floor(random(18, 30));
  const goldenAngle = radians(137.5);

  for (let i = 0; i < count; i++) {
    const fan = count === 1 ? 0 : map(i + random(-0.3, 0.3), 0, count - 1, -1, 1);
    const tilt = Math.sign(fan) * pow(abs(fan), 0.75) * 0.6 + random(-0.08, 0.08);
    const stemLength = height * random(0.55, 0.85) * (1 - 0.25 * abs(fan));
    const root = {
      x: rootX + fan * width * 0.35 + random(-20, 20),
      y: rootY * random(1.0, 1.05)
    };
    const stem = growStem(root, tilt, stemLength);
    const mute = random(0.05, 0.45);
    const stops = random(currentTheme.accentPalettes).map(s => color(s));
    const stemTone = color(currentTheme.shadow);

    plants.push({
      kind: 'stem',
      stem: stem.points,
      stemColor: stemTone,
      stemWeight: random(1.8, 3.2),
      mute
    });

    const floretCount = floor(random(18, 32));
    for (let f = 0; f < floretCount; f++) {
      const at = lerp(0.65, 0.98, f / floretCount);
      const anchor = quadPoint(stem.curve, at);
      const heading = quadTilt(stem.curve, at);
      const floretAngle = heading + f * goldenAngle;
      const floretDist = random(3, 10) * (height / REF_HEIGHT);
      const floretPos = {
        x: anchor.x + sin(floretAngle) * floretDist,
        y: anchor.y - cos(floretAngle) * floretDist
      };
      const floretBlob = makeBlob(random(4, 8) * (height / REF_HEIGHT), 0.3);
      plants.push({
        kind: 'blob',
        blob: floretBlob,
        tone: rampColor(stops, random(0.2, 0.9)),
        base: floretPos,
        stem: [anchor, floretPos],
        stemColor: stemTone,
        stemWeight: 1,
        mute
      });
    }

    for (let l = 0; l < 2; l++) {
      const leafTilt = tilt + (l === 0 ? -1 : 1) * radians(random(25, 45));
      const stalk = growStem(root, leafTilt, stemLength * random(0.25, 0.45));
      plants.push({
        kind: 'leaf',
        leaf: makeLeaf({
          leafLength: stemLength * random(0.3, 0.5),
          widthRatio: random(0.025, 0.05),
          stops: random(currentTheme.leafPalettes).map(s => color(s)),
          split: true
        }),
        base: stalk.base,
        stem: stalk.points,
        stemColor: stemTone,
        rotation: stalk.rotation,
        stemWeight: 1.5,
        mute
      });
    }
  }
}

function makeBlob(radius, wobble = random(0.2, 0.5)) {
  const points = [];
  const noiseScale = random(0.8, 1.8);
  const noiseStrength = radius * wobble;
  const origin = random(1000);

  for (let a = 0; a < TWO_PI; a += radians(6)) {
    const n = noise(origin + cos(a) * noiseScale, origin + sin(a) * noiseScale);
    const r = radius + n * noiseStrength;
    points.push({ x: cos(a) * r, y: sin(a) * r });
  }
  return points;
}

function makeSprout(parent, stemLength, leafLength, stops, mute, stemWeight) {
  const at = random(0.3, 0.8);
  const root = quadPoint(parent.curve, at);
  const side = Math.sign(random(-1, 1));
  const tilt = constrain(quadTilt(parent.curve, at) + side * random(0.3, 0.9), -1.3, 1.3);
  const stem = growStem(root, tilt, stemLength * random(0.18, 0.4));

  const leaf = makeLeaf({
    leafLength: leafLength * random(0.28, 0.5),
    bend: side * random(0.2, 0.7),
    stops,
  });

  return {
    kind: 'leaf',
    leaf,
    base: stem.base,
    stem: stem.points,
    stemColor: leaf.stemColor,
    rotation: stem.rotation,
    stemWeight: stemWeight * 0.6,
    mute,
  };
}

function growStem(root, tilt, stemLength) {
  const base = {
    x: root.x + sin(tilt) * stemLength,
    y: root.y - cos(tilt) * stemLength,
  };
  const ctrl = {
    x: lerp(root.x, base.x, 0.15),
    y: root.y - min(stemLength * 0.6, max(0, root.y - base.y) * 0.75),
  };
  const curve = [root, ctrl, base];
  return {
    curve,
    base,
    points: sampleQuad(curve, 24),
    rotation: atan2(base.y - ctrl.y, base.x - ctrl.x),
  };
}

function quadPoint([a, b, c], t) {
  const u = 1 - t;
  return {
    x: u * u * a.x + 2 * u * t * b.x + t * t * c.x,
    y: u * u * a.y + 2 * u * t * b.y + t * t * c.y,
  };
}

function quadTilt([a, b, c], t) {
  const u = 1 - t;
  const dx = 2 * u * (b.x - a.x) + 2 * t * (c.x - b.x);
  const dy = 2 * u * (b.y - a.y) + 2 * t * (c.y - b.y);
  return atan2(dx, -dy);
}

function sampleQuad(curve, steps) {
  const points = [];
  for (let i = 0; i <= steps; i++) points.push(quadPoint(curve, i / steps));
  return points;
}

// ============================================================
// Extended makeLeaf with full options support
// ============================================================
function makeLeaf(options = {}) {
  const leafLength = options.leafLength ?? random(380, 620);
  const maxHalf = leafLength * (options.widthRatio ?? random(0.11, 0.22));
  const bend = options.bend ?? random(-0.85, 0.85);
  const bendEase = options.bendEase ?? random(1.0, 2.4);
  const baseExp = options.baseExp ?? random(0.5, 1.25);
  const tipExp = options.tipExp ?? random(0.55, 1.9);
  const skew = random(-0.16, 0.16);
  const edgeAmount = random(0.03, 0.14);
  const edgeScale = random(1.5, 4.5);
  const lobeCount = options.lobeCount ?? (random() < 0.35 ? floor(random(6, 16)) : 0);
  const lobeDepth = options.lobeDepth ?? random(0.02, 0.06);
  const noiseOrigin = [random(1000), random(1000)];

  const peak = baseExp / (baseExp + tipExp);
  const peakValue = pow(peak, baseExp) * pow(1 - peak, tipExp);

  const spine = buildSpine(leafLength, bend, bendEase);

  const spineAt = (t) => {
    const pos = constrain(t, 0, 1) * SPINE_STEPS;
    const i = floor(pos);
    const a = spine[i];
    const b = spine[min(i + 1, SPINE_STEPS)];
    const f = pos - i;
    return {
      x: lerp(a.x, b.x, f),
      y: lerp(a.y, b.y, f),
      heading: lerp(a.heading, b.heading, f),
    };
  };

  const halfWidthAt = (t, side) => {
    const tc = constrain(t, 0, 1);
    let w = (pow(tc, baseExp) * pow(1 - tc, tipExp)) / peakValue;
    w *= 1 + side * skew;
    if (options.isCordate) {
      w *= 1 - 0.8 * exp(-pow(tc / 0.05, 2));
    }
    if (options.isOak && lobeCount > 0) {
      w *= 1 + lobeDepth * (pow(abs(sin(PI * lobeCount * tc)), 0.6) - 0.5) * 2;
    } else if (lobeCount > 0) {
      w *= 1 + lobeDepth * sin(tc * TWO_PI * lobeCount);
    }
    const n = noise(noiseOrigin[side > 0 ? 1 : 0] + tc * edgeScale);
    w *= 1 + edgeAmount * (n - 0.5) * 2;
    return w * maxHalf;
  };

  const leafPoint = (t, u, side) => {
    const p = spineAt(t);
    const h = halfWidthAt(t, side) * u;
    const outward = p.heading + HALF_PI * side;
    return { x: p.x + cos(outward) * h, y: p.y + sin(outward) * h };
  };

  const lean = options.lean != null
    ? (Array.isArray(options.lean) ? random(options.lean[0], options.lean[1]) : options.lean)
    : random(0.26, 0.48);
  const veinCurve = options.veinCurve ?? random(1.3, 2.4);
  const veinStraight = options.veinStraight ?? random(0.15, 0.7);
  const veinShape = (u) => lerp(pow(u, veinCurve), u, veinStraight);
  const veinT = (start, u) => start + (1 - start) * lean * veinShape(u);

  const veinPath = (start, side) => {
    const points = [];
    for (let i = 0; i <= VEIN_STEPS; i++) {
      const u = i / VEIN_STEPS;
      points.push(start > 0 ? leafPoint(veinT(start, u), u, side) : leafPoint(0, 0, side));
    }
    return points;
  };

  const bandPolygon = (side, from, to) => {
    const points = [];
    const alongSpine = max(2, ceil((to - from) * 50));
    for (let i = 0; i <= alongSpine; i++) {
      points.push(leafPoint(lerp(from, to, i / alongSpine), 0, side));
    }
    points.push(...veinPath(to, side));

    const marginFrom = from > 0 ? veinT(from, 1) : 0;
    const marginTo = veinT(to, 1);
    const alongMargin = max(2, ceil((marginTo - marginFrom) * 80));
    for (let i = alongMargin; i >= 0; i--) {
      points.push(leafPoint(lerp(marginFrom, marginTo, i / alongMargin), 1, side));
    }

    const inner = veinPath(from, side);
    for (let i = inner.length - 1; i >= 0; i--) points.push(inner[i]);
    return points;
  };

  const stops = options.stops ?? random(currentTheme.leafPalettes).map((swatch) => color(swatch));
  const toneCenter = random(0.3, 0.62);
  const toneDrift = random(-0.5, 0.5);
  const sideStep = random(0.06, 0.18);

  const bands = [];
  for (const side of [-1, 1]) {
    const cuts = options.split ? [] : veinCuts(options.cutCount);
    const bounds = [0, ...cuts, 1];
    for (let i = 0; i < bounds.length - 1; i++) {
      const from = bounds[i];
      const to = bounds[i + 1];
      let tone = toneCenter + toneDrift * ((from + to) / 2 - 0.5) + side * sideStep;
      tone += random(-0.07, 0.07);
      if (random() < 0.12) tone += random() < 0.5 ? -0.3 : 0.3;
      bands.push({
        side,
        from,
        to,
        points: bandPolygon(side, from, to),
        fillColor: rampColor(stops, tone),
      });
    }
  }

  const highlights = options.split ? [] : addHighlights(bands, stops);

  return {
    spine,
    bands,
    stops,
    veinPath,
    leafPoint,
    spineAt,
    markers: options.split ? [] : pickMarkers(bands, stops, highlights),
    stemColor: rampColor(stops, toneCenter * 0.6),
  };
}

function makeGinkgoLeaf(options = {}) {
  const leafLength = options.leafLength ?? (height * random(0.25, 0.45));
  const alpha = radians(random(48, 62));
  const notchK = random(0.28, 0.42);
  const notchSigma = random(0.18, 0.26);
  const cutsCount = options.cutCount ? floor(random(options.cutCount[0], options.cutCount[1])) : floor(random(8, 15));
  const stops = options.stops ?? random(currentTheme.leafPalettes).map((s) => color(s));
  const toneCenter = random(0.35, 0.65);

  const rAt = (phi) => {
    return leafLength * (1 - notchK * exp(-pow(phi / notchSigma, 2)));
  };

  const leafPoint = (phiRatio, rRatio, side) => {
    const phi = side * phiRatio * alpha;
    const r = rAt(phi) * rRatio;
    return { x: cos(phi) * r, y: sin(phi) * r };
  };

  const spine = [];
  const spineAt = (t) => ({ x: leafLength * t, y: 0, heading: 0 });
  for (let i = 0; i <= SPINE_STEPS; i++) {
    spine.push(spineAt(i / SPINE_STEPS));
  }

  const bands = [];
  const cuts = [];
  for (let i = 1; i < cutsCount; i++) cuts.push(i / cutsCount);
  const bounds = [0, ...cuts, 1];

  for (const side of [-1, 1]) {
    for (let i = 0; i < bounds.length - 1; i++) {
      const from = bounds[i];
      const to = bounds[i + 1];
      const pts = [];
      const stepsR = 10;
      for (let s = 0; s <= stepsR; s++) pts.push(leafPoint(from, s / stepsR, side));
      const stepsEdge = 8;
      for (let s = 0; s <= stepsEdge; s++) pts.push(leafPoint(lerp(from, to, s / stepsEdge), 1, side));
      for (let s = stepsR; s >= 0; s--) pts.push(leafPoint(to, s / stepsR, side));
      let tone = toneCenter + side * 0.08 + random(-0.06, 0.06);
      bands.push({
        side,
        from,
        to,
        points: pts,
        fillColor: rampColor(stops, tone),
      });
    }
  }

  const veinPath = (cut, side) => {
    const pts = [];
    for (let s = 0; s <= VEIN_STEPS; s++) pts.push(leafPoint(cut, s / VEIN_STEPS, side));
    return pts;
  };

  const highlights = addHighlights(bands, stops);

  return {
    spine,
    bands,
    stops,
    veinPath,
    leafPoint,
    spineAt,
    markers: pickMarkers(bands, stops, highlights),
    stemColor: rampColor(stops, toneCenter * 0.6),
  };
}

function makeMapleLeaf(options = {}) {
  const leafLength = options.leafLength ?? (height * random(0.28, 0.48));
  const stops = options.stops ?? random(currentTheme.leafPalettes).map((s) => color(s));
  const toneCenter = random(0.35, 0.65);
  const p = random(0.5, 1.0);
  const maxAngle = radians(75);

  const rAt = (theta) => {
    return leafLength * (0.55 + 0.45 * pow(abs(cos((5 * theta) / 2)), p));
  };

  const leafPoint = (thetaRatio, rRatio, side) => {
    const theta = side * thetaRatio * maxAngle;
    const r = rAt(theta) * rRatio;
    return { x: cos(theta) * r, y: sin(theta) * r };
  };

  const spine = [];
  const spineAt = (t) => ({ x: leafLength * t, y: 0, heading: 0 });
  for (let i = 0; i <= SPINE_STEPS; i++) spine.push(spineAt(i / SPINE_STEPS));

  const cutsCount = options.cutCount ? floor(random(options.cutCount[0], options.cutCount[1])) : floor(random(7, 13));
  const cuts = [];
  for (let i = 1; i < cutsCount; i++) cuts.push(i / cutsCount);
  const bounds = [0, ...cuts, 1];

  const bands = [];
  for (const side of [-1, 1]) {
    for (let i = 0; i < bounds.length - 1; i++) {
      const from = bounds[i];
      const to = bounds[i + 1];
      const pts = [];
      const stepsR = 10;
      for (let s = 0; s <= stepsR; s++) pts.push(leafPoint(from, s / stepsR, side));
      const stepsEdge = 8;
      for (let s = 0; s <= stepsEdge; s++) pts.push(leafPoint(lerp(from, to, s / stepsEdge), 1, side));
      for (let s = stepsR; s >= 0; s--) pts.push(leafPoint(to, s / stepsR, side));
      let tone = toneCenter + side * 0.08 + random(-0.06, 0.06);
      bands.push({
        side,
        from,
        to,
        points: pts,
        fillColor: rampColor(stops, tone),
      });
    }
  }

  const veinPath = (cut, side) => {
    const pts = [];
    for (let s = 0; s <= VEIN_STEPS; s++) pts.push(leafPoint(cut, s / VEIN_STEPS, side));
    return pts;
  };

  const highlights = addHighlights(bands, stops);

  return {
    spine,
    bands,
    stops,
    veinPath,
    leafPoint,
    spineAt,
    markers: pickMarkers(bands, stops, highlights),
    stemColor: rampColor(stops, toneCenter * 0.6),
  };
}

function addHighlights(bands, stops) {
  const highlights = [];
  if (random() < HIGHLIGHT_CHANCE) highlights.push(pickHighlight(stops));
  if (highlights.length > 0 && random() < 0.45) highlights.push(pickHighlight(stops));
  if (highlights.length === 0) return highlights;

  for (const band of bands) {
    if (random() > ACCENT_CHANCE) continue;
    band.accent = {
      tone: random(highlights),
      bleed: random(0.15, 0.4),
      direction: random() < 0.5 ? 'in' : 'out',
      textureAmount: random(0.7, 1),
      border: random(0.4, 1),
      mass:
        random() < 0.35
          ? {
              brushName: random(MASS_BRUSHES),
              strength: random(0.5, 0.9),
              gradient: random(0.2, 0.8),
            }
          : null,
    };
  }
  return highlights;
}

function pickHighlight(stops) {
  const ramp = random() < 0.7 ? random(currentTheme.accentPalettes).map((swatch) => color(swatch)) : stops;
  return rampColor(ramp, random(0.45, 1));
}

function pickMarkers(bands, stops, highlights) {
  if (random() > MARKER_CHANCE) return [];
  const brushName = random(MARKER_BRUSHES);
  const tone = highlights.length > 0 ? random(highlights) : rampColor(stops, random(0.55, 1));
  const weight = random(0.6, 1.6);

  return bands
    .filter((band) => band.from > 0 && random() < 0.5)
    .map((band) => ({ cut: band.from, side: band.side, tone, brushName, weight }));
}

function buildSpine(leafLength, bend, bendEase) {
  const spineStep = leafLength / SPINE_STEPS;
  const points = [];
  let x = 0;
  let y = 0;
  for (let i = 0; i <= SPINE_STEPS; i++) {
    const heading = bend * pow(i / SPINE_STEPS, bendEase);
    points.push({ x, y, heading });
    x += cos(heading) * spineStep;
    y += sin(heading) * spineStep;
  }
  return points;
}

function veinCuts(cutCount) {
  const count = cutCount
    ? (Array.isArray(cutCount) ? floor(random(cutCount[0], cutCount[1] + 1)) : cutCount)
    : floor(random(6, 13));
  const first = random(0.05, 0.16);
  const last = random(0.7, 0.88);
  const gap = (last - first) / max(count - 1, 1);
  const cuts = [];
  for (let i = 0; i < count; i++) {
    cuts.push(first + gap * (i + random(-0.25, 0.25)));
  }
  return cuts;
}

function rampColor(stops, amount) {
  const pos = constrain(amount, 0, 1) * (stops.length - 1);
  const i = floor(pos);
  return lerpColor(stops[i], stops[min(i + 1, stops.length - 1)], pos - i);
}

function muteColor(c, amount) {
  const grey = 0.3 * red(c) + 0.59 * green(c) + 0.11 * blue(c);
  const flat = lerpColor(c, color(grey), amount * 0.8);
  return lerpColor(flat, color(currentTheme.shadow), amount * 0.5);
}

function paintPatch(points, tone, fillAlpha = BAND_ALPHA, shade = BRUSH_SHADE, bleed = 0.04) {
  noStroke();
  fill(red(tone), green(tone), blue(tone), fillAlpha * 255);
  beginShape();
  for (const p of points) vertex(p.x, p.y);
  endShape(CLOSE);

  brush.noStroke();
  brush.fill(lerpColor(tone, color(0), shade), BRUSH_ALPHA);
  brush.fillBleed(bleed, bleed > 0.15 ? 'out' : undefined);
  brush.fillTexture(0.9, 0.5);
  brush.polygon(points.map((p) => [p.x, p.y]));
}

// ============================================================
// STAGE 3: LIGHT & VOLUME IN PAINT ARRANGEMENT
// ============================================================
function* paintArrangement(plants, lightSource) {
  for (const plant of plants) {
    const stemTone = muteColor(lerpColor(plant.stemColor, color(0), 0.2), plant.mute);
    brush.noFill();
    brush.set('HB', stemTone, plant.stemWeight * 0.35);
    brush.spline(plant.stem.map((p) => [p.x, p.y]), 0.4);
    yield;

    if (plant.kind === 'blob') {
      push();
      translate(plant.base.x, plant.base.y);
      paintPatch(plant.blob, plant.mute > 0 ? muteColor(plant.tone, plant.mute) : plant.tone);
      pop();
      yield;
      continue;
    }
    if (plant.kind !== 'leaf') continue;

    // Stage 3: Light direction & illuminated side
    const midSpine = plant.leaf.spineAt ? plant.leaf.spineAt(0.5) : plant.leaf.spine[floor(plant.leaf.spine.length / 2)];
    const midHeading = midSpine ? midSpine.heading : 0;
    const lx = (lightSource ? lightSource.x : width * 0.2) - plant.base.x;
    const ly = (lightSource ? lightSource.y : height * 0.1) - plant.base.y;
    const lDist = Math.hypot(lx, ly) || 1;
    const lDirX = lx / lDist;
    const lDirY = ly / lDist;

    const normPos = plant.rotation + midHeading + HALF_PI;
    const normNeg = plant.rotation + midHeading - HALF_PI;
    const dotPos = cos(normPos) * lDirX + sin(normPos) * lDirY;
    const dotNeg = cos(normNeg) * lDirX + sin(normNeg) * lDirY;
    const litSide = dotPos >= dotNeg ? 1 : -1;

    for (const band of plant.leaf.bands) {
      // Lit / shade side coloring
      let toneBase = band.fillColor;
      if (band.side === litSide) {
        const lightStop = plant.leaf.stops[plant.leaf.stops.length - 1];
        toneBase = lerpColor(toneBase, lightStop, random(0.1, 0.3));
      } else {
        const darkStop = plant.leaf.stops[0];
        const altTone = (currentTheme.accentPalettes && currentTheme.accentPalettes.length > 1)
          ? color(currentTheme.accentPalettes[1][0])
          : darkStop;
        const shadeTarget = random() < 0.5 ? darkStop : altTone;
        toneBase = lerpColor(toneBase, shadeTarget, random(0.2, 0.45));
      }
      const tone = plant.mute > 0 ? muteColor(toneBase, plant.mute) : toneBase;

      const outline = band.points.map((p) => [p.x, p.y]);
      push();
      translate(plant.base.x, plant.base.y);
      rotate(plant.rotation);
      paintPatch(band.points, tone);

      if (band.accent) {
        const accent = plant.mute > 0 ? muteColor(band.accent.tone, plant.mute) : band.accent.tone;
        if (band.accent.mass) {
          const { brushName, strength, gradient } = band.accent.mass;
          brush.noFill();
          brush.mass(brushName, accent, { strength, gradient, outline: false });
          brush.polygon(outline);
          brush.noMass();
        } else {
          brush.fill(accent, ACCENT_ALPHA);
          brush.fillBleed(band.accent.bleed, band.accent.direction);
          brush.fillTexture(band.accent.textureAmount, band.accent.border);
          brush.polygon(outline);
        }
      }
      brush.noFill();
      pop();
      yield;
    }

    // Stage 3: Vein glints (блик вдоль жилки)
    if (plant.mute <= 0.6 && random() < 0.6 && plant.leaf.leafPoint && plant.leaf.veinPath) {
      push();
      translate(plant.base.x, plant.base.y);
      rotate(plant.rotation);
      brush.noFill();
      const glintBrush = random(MARKER_BRUSHES);
      const lightStop = plant.leaf.stops[plant.leaf.stops.length - 1];
      const glintTone = color(red(lightStop), green(lightStop), blue(lightStop), 110);
      const glintWeight = random(0.4, 1.0) * (height / REF_HEIGHT);
      brush.set(glintBrush, glintTone, glintWeight);

      // 1-3 splines along midrib on lit side
      const midribGlints = floor(random(1, 4));
      for (let g = 0; g < midribGlints; g++) {
        const uOffset = random(0.08, 0.18);
        const tStart = random(0.05, 0.2);
        const tEnd = random(0.7, 0.92);
        const gpts = [];
        const steps = 12;
        for (let s = 0; s <= steps; s++) {
          const t = lerp(tStart, tEnd, s / steps);
          gpts.push(plant.leaf.leafPoint(t, uOffset, litSide));
        }
        brush.spline(gpts.map((p) => [p.x, p.y]), 0.35);
      }

      // 2-4 lateral veins on lit side
      if (plant.leaf.bands) {
        const litCuts = plant.leaf.bands.filter((b) => b.side === litSide && b.from > 0).map((b) => b.from);
        if (litCuts.length > 0) {
          const numVeins = min(litCuts.length, floor(random(2, 5)));
          for (let v = 0; v < numVeins; v++) {
            const cut = litCuts[floor(random(litCuts.length))];
            brush.spline(plant.leaf.veinPath(cut, litSide).map((p) => [p.x, p.y]), 0.35);
          }
        }
      }
      pop();
      yield;
    }

    // Existing markers
    if (plant.leaf.markers && plant.leaf.markers.length > 0) {
      push();
      translate(plant.base.x, plant.base.y);
      rotate(plant.rotation);
      brush.noFill();
      for (const mark of plant.leaf.markers) {
        const tone = plant.mute > 0 ? muteColor(mark.tone, plant.mute) : mark.tone;
        brush.set(mark.brushName, tone, mark.weight * (height / REF_HEIGHT));
        brush.spline(plant.leaf.veinPath(mark.cut, mark.side).map((p) => [p.x, p.y]), 0.3);
      }
      pop();
      yield;
    }
  }
}

// ============================================================
// Controls, State, Hash & UI
// ============================================================
function updateButtons() {
  const themeLabel = document.getElementById('theme-label');
  if (themeLabel) {
    themeLabel.textContent = `Тема: ${currentTheme.label || currentThemeName}`;
  }
  const plantLabel = document.getElementById('plant-label');
  if (plantLabel) {
    const pLabel = currentPlantName === 'auto'
      ? `Авто (${PLANT_NAMES[currentTheme.defaultPlant] || currentTheme.defaultPlant})`
      : (PLANT_NAMES[currentPlantName] || currentPlantName);
    plantLabel.textContent = `Растение: ${pLabel}`;
  }
}

function readHash() {
  const hash = window.location.hash.replace(/^#/, '');
  if (!hash) return;
  const params = new URLSearchParams(hash);
  if (params.has('theme') && THEMES[params.get('theme')]) {
    setTheme(params.get('theme'));
  }
  if (params.has('plant') && (PLANT_TYPES[params.get('plant')] || params.get('plant') === 'auto')) {
    currentPlantName = params.get('plant');
  }
}

function updateHash() {
  const newHash = `#theme=${currentThemeName}&plant=${currentPlantName}`;
  if (window.location.hash !== newHash) {
    history.replaceState(null, '', newHash);
  }
}

function cycleTheme() {
  const idx = THEME_KEYS.indexOf(currentThemeName);
  const nextIdx = (idx + 1) % THEME_KEYS.length;
  setTheme(THEME_KEYS[nextIdx]);
  updateHash();
  updateButtons();
  newScene();
}

function cyclePlant() {
  const idx = PLANT_KEYS.indexOf(currentPlantName);
  const nextIdx = (idx + 1) % PLANT_KEYS.length;
  currentPlantName = PLANT_KEYS[nextIdx];
  updateHash();
  updateButtons();
  newScene();
}

// ============================================================
// Save PNG & Botanical Leaf Flourish Animation
// ============================================================
function saveArtwork() {
  const canvas = document.querySelector('canvas');
  if (!canvas) return;

  canvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const effPlant = getEffectivePlantName();
    a.href = url;
    a.download = `botanical-${currentThemeName}-${effPlant}-${timestamp}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

function triggerFlourish() {
  const container = document.getElementById('sprout-container');
  if (!container) return;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'flourish-svg');
  svg.setAttribute('viewBox', '0 0 240 220');

  function bezierPoint(p0, p1, p2, t) {
    const u = 1 - t;
    return {
      x: u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
      y: u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1],
      dx: 2 * u * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]),
      dy: 2 * u * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1])
    };
  }

  function addLeaf(x, y, angleDeg, len, wid, color, delay) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${x}, ${y}) rotate(${angleDeg - 90})`);

    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M 0 0 C ${-wid} ${-len * 0.4}, ${-wid * 0.75} ${-len * 0.8}, 0 ${-len} C ${wid * 0.75} ${-len * 0.8}, ${wid} ${-len * 0.4}, 0 0 Z`);
    p.setAttribute('fill', color);
    p.setAttribute('fill-opacity', '0.94');
    p.setAttribute('stroke', '#1E3F2B');
    p.setAttribute('stroke-width', '0.6');
    p.setAttribute('class', 'botanical-leaf-shape');
    p.style.animationDelay = `${delay}s`;
    g.appendChild(p);

    if (len > 7) {
      const mid = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      mid.setAttribute('x1', '0'); mid.setAttribute('y1', '0');
      mid.setAttribute('x2', '0'); mid.setAttribute('y2', `${-len * 0.75}`);
      mid.setAttribute('stroke', '#1E3F2B'); mid.setAttribute('stroke-width', '0.5');
      mid.setAttribute('stroke-opacity', '0.5');
      g.appendChild(mid);
    }

    svg.appendChild(g);
  }

  function addBerry(x, y, stalkAngleDeg, dist, radius, color, delay) {
    const rad = (stalkAngleDeg * Math.PI) / 180;
    const bx = x + Math.cos(rad) * dist;
    const by = y + Math.sin(rad) * dist;

    const stalk = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    stalk.setAttribute('x1', x); stalk.setAttribute('y1', y);
    stalk.setAttribute('x2', bx); stalk.setAttribute('y2', by);
    stalk.setAttribute('stroke', '#1E3F2B');
    stalk.setAttribute('stroke-width', '0.7');
    stalk.setAttribute('class', 'botanical-stem');
    stalk.setAttribute('pathLength', '1');
    stalk.style.animationDelay = `${delay}s`;
    svg.appendChild(stalk);

    const berry = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    berry.setAttribute('cx', bx); berry.setAttribute('cy', by);
    berry.setAttribute('r', radius);
    berry.setAttribute('fill', color);
    berry.setAttribute('stroke', '#1E3F2B');
    berry.setAttribute('stroke-width', '0.6');
    berry.setAttribute('class', 'botanical-leaf-shape');
    berry.style.animationDelay = `${delay + 0.05}s`;
    berry.style.transformOrigin = `${bx}px ${by}px`;
    svg.appendChild(berry);
  }

  // 1. Left arching twig
  {
    const r = [30, 205], cp = [12, 150], tip = [16, 95];
    const stem = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    stem.setAttribute('d', `M ${r[0]} ${r[1]} Q ${cp[0]} ${cp[1]} ${tip[0]} ${tip[1]}`);
    stem.setAttribute('class', 'botanical-stem');
    stem.setAttribute('pathLength', '1');
    stem.setAttribute('stroke-width', '1.2');
    stem.style.animationDelay = '0s';
    svg.appendChild(stem);

    [0.32, 0.52, 0.72].forEach((t, i) => {
      const pt = bezierPoint(r, cp, tip, t);
      const heading = (Math.atan2(pt.dy, pt.dx) * 180) / Math.PI;
      const side = i % 2 === 0 ? -1 : 1;
      const col = i % 2 === 0 ? '#4E7C50' : '#6E9A6A';
      addLeaf(pt.x, pt.y, heading + side * 42, 6.5, 3.2, col, 0.12 + t * 0.35);
    });

    const ptTip = bezierPoint(r, cp, tip, 0.92);
    const headingTip = (Math.atan2(ptTip.dy, ptTip.dx) * 180) / Math.PI;
    addBerry(ptTip.x, ptTip.y, headingTip - 50, 8, 3.2, '#DE7B4F', 0.42);

    const tipPt = bezierPoint(r, cp, tip, 1);
    addLeaf(tipPt.x, tipPt.y, (Math.atan2(tipPt.dy, tipPt.dx) * 180) / Math.PI, 6.5, 3.0, '#7FA45C', 0.46);
  }

  // 2. Slender middle-left sprig
  {
    const r = [48, 205], cp = [44, 130], tip = [56, 68];
    const stem = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    stem.setAttribute('d', `M ${r[0]} ${r[1]} Q ${cp[0]} ${cp[1]} ${tip[0]} ${tip[1]}`);
    stem.setAttribute('class', 'botanical-stem');
    stem.setAttribute('pathLength', '1');
    stem.setAttribute('stroke-width', '1.3');
    stem.style.animationDelay = '0.04s';
    svg.appendChild(stem);

    [0.28, 0.46, 0.64].forEach((t, i) => {
      const pt = bezierPoint(r, cp, tip, t);
      const heading = (Math.atan2(pt.dy, pt.dx) * 180) / Math.PI;
      const side = i % 2 === 0 ? 1 : -1;
      addLeaf(pt.x, pt.y, heading + side * 38, 7.5, 3.6, '#2C5E45', 0.14 + t * 0.35);
    });

    const bPt1 = bezierPoint(r, cp, tip, 0.82);
    const bHead1 = (Math.atan2(bPt1.dy, bPt1.dx) * 180) / Math.PI;
    addBerry(bPt1.x, bPt1.y, bHead1 + 55, 9, 3.4, '#EE9B3F', 0.42);

    const tipPt = bezierPoint(r, cp, tip, 1);
    const tipHead = (Math.atan2(tipPt.dy, tipPt.dx) * 180) / Math.PI;
    addBerry(tipPt.x, tipPt.y, tipHead - 35, 8, 3.0, '#C2452D', 0.48);
    addLeaf(tipPt.x, tipPt.y, tipHead + 10, 6.5, 2.8, '#5E8C6A', 0.46);
  }

  // 3. Middle-right arching berry sprig
  {
    const r = [68, 205], cp = [86, 145], tip = [125, 102];
    const stem = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    stem.setAttribute('d', `M ${r[0]} ${r[1]} Q ${cp[0]} ${cp[1]} ${tip[0]} ${tip[1]}`);
    stem.setAttribute('class', 'botanical-stem');
    stem.setAttribute('pathLength', '1');
    stem.setAttribute('stroke-width', '1.2');
    stem.style.animationDelay = '0.07s';
    svg.appendChild(stem);

    const berryList = [
      { t: 0.36, side: -1, color: '#DE7B4F', r: 3.3 },
      { t: 0.58, side: 1, color: '#EE9B3F', r: 3.0 },
      { t: 0.80, side: -1, color: '#D79B1E', r: 3.4 },
      { t: 0.96, side: 1, color: '#C2452D', r: 3.1 }
    ];

    berryList.forEach((b) => {
      const pt = bezierPoint(r, cp, tip, b.t);
      const heading = (Math.atan2(pt.dy, pt.dx) * 180) / Math.PI;
      addBerry(pt.x, pt.y, heading + b.side * 52, 8.5, b.r, b.color, 0.16 + b.t * 0.35);
    });

    [0.48, 0.88].forEach((t, i) => {
      const pt = bezierPoint(r, cp, tip, t);
      const heading = (Math.atan2(pt.dy, pt.dx) * 180) / Math.PI;
      const side = i % 2 === 0 ? 1 : -1;
      addLeaf(pt.x, pt.y, heading + side * 42, 6.0, 2.9, '#6E9A6A', 0.26 + t * 0.3);
    });
  }

  // 4. Little tender accent twig in the center
  {
    const r = [40, 205], cp = [38, 160], tip = [40, 128];
    const stem = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    stem.setAttribute('d', `M ${r[0]} ${r[1]} Q ${cp[0]} ${cp[1]} ${tip[0]} ${tip[1]}`);
    stem.setAttribute('class', 'botanical-stem');
    stem.setAttribute('pathLength', '1');
    stem.setAttribute('stroke-width', '1.0');
    stem.style.animationDelay = '0.06s';
    svg.appendChild(stem);

    [0.55, 0.85].forEach((t, i) => {
      const pt = bezierPoint(r, cp, tip, t);
      const heading = (Math.atan2(pt.dy, pt.dx) * 180) / Math.PI;
      const side = i % 2 === 0 ? -1 : 1;
      addLeaf(pt.x, pt.y, heading + side * 44, 5.0, 2.5, '#7FA45C', 0.2 + t * 0.3);
    });
    const tipPt = bezierPoint(r, cp, tip, 1);
    const tipHead = (Math.atan2(tipPt.dy, tipPt.dx) * 180) / Math.PI;
    addBerry(tipPt.x, tipPt.y, tipHead, 6.5, 2.7, '#EE9B3F', 0.44);
  }

  container.appendChild(svg);
  setTimeout(() => svg.remove(), 2100);
}

// Button event listeners
const themeBtn = document.getElementById('theme-btn');
if (themeBtn) {
  themeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    cycleTheme();
  });
  themeBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  themeBtn.addEventListener('mousedown', (e) => e.stopPropagation());
}

const plantBtn = document.getElementById('plant-btn');
if (plantBtn) {
  plantBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    cyclePlant();
  });
  plantBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  plantBtn.addEventListener('mousedown', (e) => e.stopPropagation());
}

const saveBtn = document.getElementById('save-btn');
if (saveBtn) {
  const saveLabel = document.getElementById('save-label');
  saveBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();

    saveArtwork();
    triggerFlourish();

    saveBtn.classList.add('saved');
    if (saveLabel) saveLabel.textContent = 'Сохранено';
    setTimeout(() => {
      saveBtn.classList.remove('saved');
      if (saveLabel) saveLabel.textContent = 'PNG';
    }, 1600);
  });

  saveBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  saveBtn.addEventListener('mousedown', (e) => e.stopPropagation());
}

// Keyboard shortcuts:
// T: next theme
// P: next plant
// R: redraw
// H: toggle UI visibility
window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  const code = e.code;
  if (code === 'KeyH' || key === 'h' || key === 'р') {
    const container = document.querySelector('.save-container');
    if (container) {
      container.classList.toggle('hidden');
    }
  } else if (code === 'KeyT' || key === 't' || key === 'е') {
    cycleTheme();
  } else if (code === 'KeyP' || key === 'p' || key === 'з') {
    cyclePlant();
  } else if (code === 'KeyR' || key === 'r' || key === 'к') {
    newScene();
  }
});
</script>
</body>
</html>
