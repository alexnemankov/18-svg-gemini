<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Motion Composition 550</title>
    <style>
        :root {
            --speed: 1;
            --scene-scale: 1;
            --scene-rotation: 0deg;
            --circle-size: 1;
            --line-thickness: 1;
            --rhombus-scale: 1;
            --bg-color: #242324;
            --color-red: #d55959;
            --color-yellow: #ffe08b;
            --color-teal: #75cfb9;
            --color-orange: #f1a05b;
            --color-blue: #78bee4;
            --color-cream: #f2f3df;
            --color-dark: #242324;
            --color-navy: #485973;
            --color-white: #ffffff;
            --color-tan: #a18a66;
        }

        /*=================
        Basic style
        ==================*/

        html, body {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            background-color: var(--bg-color);
            user-select: none;
            -webkit-user-select: none;
        }

        img {
            max-width: 100%;
            width: 100%;
            vertical-align: bottom;
        }

        h1, h2, p {
            margin: 0;
        }

        #viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }

        #viewport:active {
            cursor: grabbing;
        }

        #stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            will-change: transform;
            pointer-events: none;
        }

        #stage.paused,
        #stage.paused * {
            animation-play-state: paused !important;
        }

        /*===================
        animation01
        ====================*/

        .animation01 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .animation01 div {
            width: 20%;
            height: 100%;
            transform-origin: bottom;
            opacity: 0;
        }

        .stage.running .animation01 div {
            animation: animation01 calc(0.275s / var(--speed)) ease-in forwards;
        }

        .animation01 div:nth-child(1) {
            background-color: var(--color-red);
        }
        .stage.running .animation01 div:nth-child(1) {
            animation-delay: calc(0.4s / var(--speed));
        }

        .animation01 div:nth-child(2) {
            background-color: var(--color-yellow);
        }
        .stage.running .animation01 div:nth-child(2) {
            animation-delay: calc(0.3s / var(--speed));
        }

        .animation01 div:nth-child(3) {
            background-color: var(--color-teal);
        }
        .stage.running .animation01 div:nth-child(3) {
            animation-delay: calc(0.2s / var(--speed));
        }

        .animation01 div:nth-child(4) {
            background-color: var(--color-orange);
        }
        .stage.running .animation01 div:nth-child(4) {
            animation-delay: calc(0.1s / var(--speed));
        }

        .animation01 div:nth-child(5) {
            background-color: var(--color-blue);
        }

        @keyframes animation01 {
            0% {
                transform: scale3d(1, 0, 1);
                opacity: 1;
            }
            100% {
                transform: scale3d(1, 1, 1);
                opacity: 1;
            }
        }

        /*===================
        animation02
        ====================*/

        .animation02 {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .animation02 div {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
        }

        .stage.running .animation02 div {
            animation: animation02 calc(0.6s / var(--speed)) ease-in calc(0.6s / var(--speed)) forwards;
        }

        .animation02 div:nth-child(1) {
            top: 0;
            left: 0;
            border-top: 100vh solid transparent;
            border-right: 100vw solid var(--color-cream);
            transform-origin: bottom right;
        }

        .animation02 div:nth-child(2) {
            right: 0;
            bottom: 0;
            border-bottom: 100vh solid transparent;
            border-left: 100vw solid var(--color-cream);
            transform-origin: top left;
        }

        @keyframes animation02 {
            0% {
                transform: scale3d(0, 0, 1);
                opacity: 1;
            }
            100% {
                transform: scale3d(1, 1, 1);
                opacity: 1;
            }
        }

        /*===================
        animation03
        ====================*/

        .animation03 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(13vw * var(--circle-size));
            height: calc(13vw * var(--circle-size));
        }

        .animation03 .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center;
            background-color: transparent;
            z-index: 9998;
        }

        .animation03 .circle_element01 {
            width: calc(13vw * var(--circle-size));
            height: calc(13vw * var(--circle-size));
            border: calc(0.25vw * var(--line-thickness)) solid var(--color-teal);
            border-radius: 50%;
            opacity: 0;
        }

        .stage.running .animation03 .circle_element01 {
            animation: animation03_circle calc(0.3s / var(--speed)) ease-in-out calc(0.5s / var(--speed)) forwards,
                       animation03_circle_element01 calc(0.3s / var(--speed)) linear calc(0.9s / var(--speed)) forwards;
        }

        .animation03 .circle_element02 {
            width: calc(9vw * var(--circle-size));
            height: calc(9vw * var(--circle-size));
            border: calc(0.5vw * var(--line-thickness)) solid var(--color-navy);
            border-radius: 50%;
            opacity: 0;
        }

        .stage.running .animation03 .circle_element02 {
            animation: animation03_circle calc(0.4s / var(--speed)) ease-in-out calc(0.5s / var(--speed)) forwards,
                       animation03_circle_element02 calc(0.2s / var(--speed)) linear calc(1.0s / var(--speed)) forwards;
        }

        .animation03 .circle_element03 {
            width: calc(4vw * var(--circle-size));
            height: calc(4vw * var(--circle-size));
            border: calc(1vw * var(--line-thickness)) solid var(--color-dark);
            border-radius: 50%;
            opacity: 0;
        }

        .stage.running .animation03 .circle_element03 {
            animation: animation03_circle calc(0.45s / var(--speed)) ease-in-out calc(0.5s / var(--speed)) forwards,
                       animation03_circle_element03 calc(0.15s / var(--speed)) linear calc(1.4s / var(--speed)) forwards;
        }

        @keyframes animation03_circle {
            0% {
                transform: scale3d(0, 0, 1);
                opacity: 1;
            }
            100% {
                transform: scale3d(1, 1, 1);
                opacity: 1;
            }
        }

        @keyframes animation03_circle_element01 {
            0% {
                border-width: calc(0.25vw * var(--line-thickness));
            }
            100% {
                border-width: 0;
            }
        }

        @keyframes animation03_circle_element02 {
            0% {
                border-width: calc(0.5vw * var(--line-thickness));
            }
            100% {
                border-width: 0;
            }
        }

        @keyframes animation03_circle_element03 {
            0% {
                border-width: calc(1vw * var(--line-thickness));
            }
            100% {
                border-width: 0;
            }
        }

        /*===================
        animation04
        ====================*/

        .animation04 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            z-index: 9999;
        }

        .animation04 .line_wrapper {
            position: absolute;
            opacity: 0;
        }

        .animation04 .line {
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--color-white);
            opacity: 0;
        }

        /*===========
        line01
        ===========*/

        .animation04 .line_wrapper01 {
            top: -20%;
            left: 50%;
            width: calc(2.5% * var(--line-thickness));
            height: 30%;
        }

        .stage.running .animation04 .line_wrapper01 {
            animation: animation04_line_wrapper01 calc(0.45s / var(--speed)) ease-in calc(0.8s / var(--speed)) forwards;
        }

        .stage.running .animation04 .line01 {
            animation: animation04_line01 calc(0.45s / var(--speed)) ease-in calc(0.5s / var(--speed)) forwards;
        }

        @keyframes animation04_line_wrapper01 {
            0% {
                transform-origin: top;
                transform: scale3d(1, 1, 1);
                opacity: 1;
            }
            100% {
                transform-origin: top;
                transform: scale3d(1, 0, 1);
                opacity: 1;
            }
        }

        @keyframes animation04_line01 {
            0% {
                transform-origin: bottom;
                transform: scale3d(1, 0, 1);
                opacity: 1;
            }
            100% {
                transform-origin: bottom;
                transform: scale3d(1, 1, 1);
                opacity: 1;
            }
        }

        /*===========
        line02
        ===========*/

        .animation04 .rotate45 {
            display: block;
            position: absolute;
            top: 22.5%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: rotate(45deg);
        }

        .animation04 .line_wrapper02 {

            }

            }
            100% {

            }
        }

        /*===========

        ===========*/

        .animation04 .line_wrapper03 {

            height: calc(2.5% * var(--line-thickness));
        }

        .stage.running .animation04 .line_wrapper03 {

            }

        }

        @keyframes animation04_line04 {

            }
            100% {
                transform-origin: bottom;
                transform: scale3d(1, 1, 1);
                opacity: 1;
            }
        }

        .animation04 .line_wrapper05 {

        }

        .stage.running .animation04 .line_wrapper05 {

        .stage.running .animation04 .line05 {

        @keyframes animation04_line_wrapper05 {

            }

        @keyframes animation04_line05 {

            }

                opacity: 1;
            }
        }

        /*===========
        line06
        ===========*/

        .animation04 .rotate-135 {
            display: block;
            position: absolute;
            top: -19.5%;
            left: -48%;
            width: 100%;
            height: 100%;
            transform: rotate(-135deg);
        }

        .animation04 .line_wrapper06 {

                opacity: 1;
            }
        }

        ===========*/

        .animation04 .line_wrapper07 {
            top: 50%;

            width: 30%;
            height: calc(2.5% * var(--line-thickness));
        }

        .stage.running .animation04 .line_wrapper07 {
            animation: animation04_line_wrapper07 calc(0.45s / var(--speed)) ease-in calc(0.8s / var(--speed)) forwards;
        }

        .stage.running .animation04 .line07 {

            }
            100% {

                opacity: 1;
            }
        }

        /*===========
        line08
        ===========*/

        .animation04 .rotate-45 {
            display: block;
            position: absolute;
            top: -49.0%;
            left: 20%;
            width: 100%;
            height: 100%;
            transform: rotate(-45deg);
        }

        .animation04 .line_wrapper08 {
            width: calc(2.5% * var(--line-thickness));
            height: 30%;
        }

        .stage.running .animation04 .line_wrapper08 {

        /*===================
        animation05
        ====================*/

        .animation05 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
        }

        .double_wrapper02 {
            position: relative;
            width: 100%;
            height: 100%;
            opacity: 0;
        }

        .stage.running .double_wrapper02 {
            animation: animation05_double calc(0.5s / var(--speed)) forwards;
        }

        .double_wrapper01 {
            display: block;
            position: absolute;
            border-radius: 50%;
            overflow: hidden;
        }

        .double_wrapper01::before {
            content: "";
            display: block;
            position: absolute;
            background: var(--color-cream);
            z-index: 2;
        }

        .double_wrapper01::after {
            content: "";
            display: block;
            position: absolute;
            background: var(--color-cream);
            z-index: 3;
        }

        .double_block {
            position: absolute;
            background: var(--color-cream);
            border-radius: 50%;
        }

        /*==============
        green circle
        ==============*/

        .green02 {
            top: 0;
        }
        .stage.running .green02 {
            animation-delay: calc(1.3s / var(--speed));
        }

        .green01 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(34vw * var(--circle-size));
            height: calc(34vw * var(--circle-size));
            background: var(--color-teal);
            z-index: 1;
        }

        .green01::before {
            top: 0;
            left: calc(17vw * var(--circle-size));
            width: calc(34vw * var(--circle-size));
            height: calc(34vw * var(--circle-size));
            transform-origin: left calc(17vw * var(--circle-size));
        }

        .stage.running .green01::before {
            animation: rotate-circle-right calc(0.5s / var(--speed)) linear calc(1.55s / var(--speed)) forwards;
        }

        .green01::after {
            top: 0;
            left: calc(-17vw * var(--circle-size));
            width: calc(34vw * var(--circle-size));
            height: calc(34vw * var(--circle-size));
            transform-origin: right calc(17vw * var(--circle-size));
        }

        .stage.running .green01::after {
            animation: rotate-circle-left calc(0.5s / var(--speed)) linear calc(1.3s / var(--speed)) forwards;
        }

        .green00 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(9vw * var(--circle-size));
            height: calc(9vw * var(--circle-size));
            z-index: 4;
        }

        .blue02 {

                colorBlue: '#4F26B8',
                colorCream: '#F3EFFF',
                colorDark: '#090612',

                colorWhite: '#FFFFFF',
                colorTan: '#B38FFF',

            },
            'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
                colorRed: '#D40078',
                colorYellow: '#00F0FF',
                colorTeal: '#00F0FF',
                colorOrange: '#FF1493',
                colorBlue: '#7928CA',
                colorCream: '#E0FBFF',
                colorDark: '#05020F',
                colorNavy: '#1E0A3D',
                colorWhite: '#FFFFFF',
                colorTan: '#D40078',
                bgColor: '#05020F'
            }
        };

        const params = {
            scheme: 'Original',
            greenscreen: false,
            bgColor: '#242324',
            colorRed: '#d55959',
            colorYellow: '#ffe08b',
            colorTeal: '#75cfb9',
            colorOrange: '#f1a05b',
            colorBlue: '#78bee4',
            colorCream: '#f2f3df',
            colorDark: '#242324',
            colorNavy: '#485973',
            colorWhite: '#ffffff',
            colorTan: '#a18a66',

            speed: 1.0,
            loopDelay: 0.1,
            paused: false,
            replay: () => restartAnimation(),

            sceneScale: 1.0,
            sceneRotation: 0,
            circleSize: 1.0,
            lineThickness: 1.0,
            rhombusScale: 1.0,

            zoom: 1.0,
            panX: 0,
            panY: 0,
            resetView: () => {
                params.zoom = 1.0;
                params.panX = 0;
                params.panY = 0;
                updateTransform();
                updateAllControllers();
            },

            clickRandomize: true,
            randomizeNow: () => randomizeScene()
        };

        const stage = document.getElementById('stage');
        const root = document.documentElement;
        let loopTimer = null;

        function updateStyles() {
            root.style.setProperty('--speed', params.speed);
            root.style.setProperty('--scene-scale', params.sceneScale);
            root.style.setProperty('--scene-rotation', `${params.sceneRotation}deg`);
            root.style.setProperty('--circle-size', params.circleSize);
            root.style.setProperty('--line-thickness', params.lineThickness);
            root.style.setProperty('--rhombus-scale', params.rhombusScale);

            const effectiveBg = params.greenscreen ? '#00ff00' : params.bgColor;
            root.style.setProperty('--bg-color', effectiveBg);
            document.body.style.backgroundColor = effectiveBg;

            root.style.setProperty('--color-red', params.colorRed);
            root.style.setProperty('--color-yellow', params.colorYellow);
            root.style.setProperty('--color-teal', params.colorTeal);
            root.style.setProperty('--color-orange', params.colorOrange);
            root.style.setProperty('--color-blue', params.colorBlue);
            root.style.setProperty('--color-cream', params.colorCream);
            root.style.setProperty('--color-dark', params.colorDark);
            root.style.setProperty('--color-navy', params.colorNavy);
            root.style.setProperty('--color-white', params.colorWhite);
            root.style.setProperty('--color-tan', params.colorTan);

            if (params.paused) {
                stage.classList.add('paused');
            } else {
                stage.classList.remove('paused');
            }
        }

        function updateTransform() {
            stage.style.transform = `translate(${params.panX}px, ${params.panY}px) scale(${params.zoom * params.sceneScale}) rotate(${params.sceneRotation}deg)`;
        }

        function applyColorScheme(name) {
            const scheme = colorSchemes[name];
            if (!scheme) return;
            params.scheme = name;
            params.bgColor = scheme.bgColor;
            params.colorRed = scheme.colorRed;
            params.colorYellow = scheme.colorYellow;
            params.colorTeal = scheme.colorTeal;
            params.colorOrange = scheme.colorOrange;
            params.colorBlue = scheme.colorBlue;
            params.colorCream = scheme.colorCream;
            params.colorDark = scheme.colorDark;
            params.colorNavy = scheme.colorNavy;
            params.colorWhite = scheme.colorWhite;
            params.colorTan = scheme.colorTan;
            updateStyles();
            updateAllControllers();
        }

        function scheduleNextLoop() {
            clearTimeout(loopTimer);
            if (params.paused) return;
            const cycleDurationMs = ((4.3 / params.speed) + params.loopDelay) * 1000;
            loopTimer = setTimeout(() => {
                restartAnimation();
            }, cycleDurationMs);
        }

        function restartAnimation() {
            clearTimeout(loopTimer);
            stage.classList.remove('running');
            void stage.offsetWidth;
            stage.classList.add('running');
            scheduleNextLoop();
        }

        const anim08 = document.querySelector('.animation08');
        anim08.addEventListener('animationend', (e) => {
            if (e.animationName === 'animation08') {
                clearTimeout(loopTimer);
                if (!params.paused) {
                    loopTimer = setTimeout(() => {
                        restartAnimation();
                    }, Math.max(10, params.loopDelay * 1000));
                }
            }
        });

        function randomizeScene() {
            const keys = Object.keys(colorSchemes);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            applyColorScheme(randomKey);

            params.sceneScale = +(0.8 + Math.random() * 0.5).toFixed(2);
            params.sceneRotation = Math.floor((Math.random() - 0.5) * 60);
            params.circleSize = +(0.75 + Math.random() * 0.55).toFixed(2);
            params.lineThickness = +(0.7 + Math.random() * 0.8).toFixed(2);
            params.rhombusScale = +(0.8 + Math.random() * 0.6).toFixed(2);

            params.speed = +(0.8 + Math.random() * 0.6).toFixed(2);
            params.loopDelay = +(0.05 + Math.random() * 0.35).toFixed(2);

            updateStyles();
            updateTransform();
            updateAllControllers();
            restartAnimation();
        }

        // Mouse Wheel Zoom
        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.lil-gui')) return;
            e.preventDefault();

            const zoomFactor = e.deltaY < 0 ? 1.08 : 0.925;
            const newZoom = Math.min(Math.max(0.1, params.zoom * zoomFactor), 10.0);

            const mouseX = e.clientX - window.innerWidth / 2;
            const mouseY = e.clientY - window.innerHeight / 2;

            params.panX -= (mouseX - params.panX) * (newZoom / params.zoom - 1);
            params.panY -= (mouseY - params.panY) * (newZoom / params.zoom - 1);
            params.zoom = newZoom;

            updateTransform();
            updateAllControllers();
        }, { passive: false });

        // Pointer Drag & Click
        let isDragging = false;
        let startPointerX = 0;
        let startPointerY = 0;
        let initialPanX = 0;
        let initialPanY = 0;
        let moveDist = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;
            if (e.button !== 0) return;
            isDragging = true;
            startPointerX = e.clientX;
            startPointerY = e.clientY;
            initialPanX = params.panX;
            initialPanY = params.panY;
            moveDist = 0;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startPointerX;
            const dy = e.clientY - startPointerY;
            moveDist = Math.hypot(dx, dy);
            params.panX = initialPanX + dx;
            params.panY = initialPanY + dy;
            updateTransform();
            updateAllControllers();
        });

        window.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            if (moveDist < 5) {
                if (params.clickRandomize) {
                    randomizeScene();
                }
            }
        });

        // Initialize lil-gui
        const gui = new GUI({ title: 'Scene Controls' });

        const themeFolder = gui.addFolder('Theme & Color');
        themeFolder.add(params, 'scheme', Object.keys(colorSchemes)).name('Color Scheme').onChange(val => applyColorScheme(val));
        themeFolder.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => updateStyles());
        themeFolder.addColor(params, 'bgColor').name('Background Color').onChange(() => updateStyles());

        const paletteFolder = themeFolder.addFolder('Palette Colors');
        paletteFolder.close();
        paletteFolder.addColor(params, 'colorRed').name('Red Element').onChange(() => updateStyles());
        paletteFolder.addColor(params, 'colorYellow').name('Yellow Element').onChange(() => updateStyles());
        paletteFolder.addColor(params, 'colorTeal').name('Teal Element').onChange(() => updateStyles());
        paletteFolder.addColor(params, 'colorOrange').name('Orange Element').onChange(() => updateStyles());
        paletteFolder.addColor(params, 'colorBlue').name('Blue Element').onChange(() => updateStyles());
        paletteFolder.addColor(params, 'colorCream').name('Cream Element').onChange(() => updateStyles());
        paletteFolder.addColor(params, 'colorDark').name('Dark Element').onChange(() => updateStyles());
        paletteFolder.addColor(params, 'colorNavy').name('Navy Element').onChange(() => updateStyles());
        paletteFolder.addColor(params, 'colorWhite').name('White Element').onChange(() => updateStyles());
        paletteFolder.addColor(params, 'colorTan').name('Tan Element').onChange(() => updateStyles());

        const motionFolder = gui.addFolder('Animation & Motion');
        motionFolder.add(params, 'speed', 0.2, 3.0, 0.05).name('Playback Speed').onChange(() => { updateStyles(); scheduleNextLoop(); });
        motionFolder.add(params, 'loopDelay', 0.0, 2.0, 0.05).name('Loop Delay (s)').onChange(() => scheduleNextLoop());
        motionFolder.add(params, 'paused').name('Pause Animation').onChange(() => { updateStyles(); if (!params.paused) scheduleNextLoop(); });
        motionFolder.add(params, 'replay').name('Replay Animation');

        const geoFolder = gui.addFolder('Geometry & Variation');
        geoFolder.add(params, 'sceneScale', 0.5, 2.5, 0.05).name('Scene Scale').onChange(() => updateTransform());
        geoFolder.add(params, 'sceneRotation', -180, 180, 1).name('Scene Rotation (°)').onChange(() => updateTransform());
        geoFolder.add(params, 'circleSize', 0.5, 2.0, 0.05).name('Circle Scale').onChange(() => updateStyles());
        geoFolder.add(params, 'lineThickness', 0.5, 2.5, 0.05).name('Line Thickness').onChange(() => updateStyles());
        geoFolder.add(params, 'rhombusScale', 0.5, 2.0, 0.05).name('Rhombus Scale').onChange(() => updateStyles());

        const viewFolder = gui.addFolder('View & Navigation');
        viewFolder.add(params, 'zoom', 0.2, 5.0, 0.05).name('Zoom').onChange(() => updateTransform());
        viewFolder.add(params, 'panX', -1000, 1000, 1).name('Pan X (px)').onChange(() => updateTransform());
        viewFolder.add(params, 'panY', -1000, 1000, 1).name('Pan Y (px)').onChange(() => updateTransform());
        viewFolder.add(params, 'resetView').name('Reset View');

        const procFolder = gui.addFolder('Procedural Interaction');
        procFolder.add(params, 'clickRandomize').name('Randomize on Click');
        procFolder.add(params, 'randomizeNow').name('Randomize Variation');

        function updateAllControllers(folder = gui) {
            folder.controllers.forEach(c => c.updateDisplay());
            folder.folders.forEach(f => updateAllControllers(f));
        }

        // Press 'H' to show/hide UI
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'h' || e.key === 'H') {
                const isHidden = gui.domElement.style.display === 'none';
                gui.domElement.style.display = isHidden ? '' : 'none';
            }
        });

        updateStyles();
        updateTransform();
        scheduleNextLoop();
    </script>
