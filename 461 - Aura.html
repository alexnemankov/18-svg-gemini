// ============================================================
// Scene parameters
// ============================================================
const params = {
  // Camera

const MAX_DPR = 3.0;
const MAX_DELTA = 0.1;
const defaults = structuredClone(params);

// User-steered base camera parameters (persists across animations)
let userBaseFocalLength = params.focalLength;
let userBaseX = params.cameraX;
let userBaseY = params.cameraY;
let userBaseZ = params.cameraZ;
let userBaseYaw = params.yaw;
let userBasePitch = params.pitch;
let userBaseRoll = params.roll;

THREE.ColorManagement.enabled = false;

// ============================================================
// Renderer, scene, camera
// ============================================================
let renderer = new THREE.WebGLRenderer({
  antialias: params.antialias,

});

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ============================================================
// Shaders
// ============================================================
const vertexShader = /* glsl */`
  void main() {
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const fragmentShader = /* glsl */`
  uniform vec2  uResolution;
  uniform float uTime;

  uniform float uFocalLength;
  uniform vec3  uCameraPosition;
  uniform mat3  uCameraRotation;

  uniform int   uRaySteps;
  uniform int   uWarpSteps;

  uniform float uStartDistance;
  uniform float uEpsilon;
  uniform float uLineWidth;
  uniform float uLineCore;
  uniform float uLineHeight;
  uniform float uWarpSmoothness;
  uniform float uWarpFrequency;
  uniform float uCenterWarpAmount;
  uniform float uCenterRadius;

  uniform int   uColorMode;
  uniform vec3  uTint;
  uniform vec3  uColor1;
  uniform vec3  uColor2;
  uniform vec3  uColor3;
  uniform vec3  uColor4;
  uniform vec3  uColor5;

  uniform vec3  uBackgroundColor;
  uniform float uGreenScreen;

  uniform float uSceneLightIntensity;
  uniform float uExposure;
  uniform float uBackgroundCutoff;

  uniform float uLight1Enabled;
  uniform float uLight1Intensity;
  uniform vec3  uLight1Color;
  uniform vec3  uLight1Pos;

  uniform float uLight2Enabled;
  uniform float uLight2Intensity;
  uniform vec3  uLight2Color;
  uniform vec3  uLight2Pos;

  uniform float uLight3Enabled;
  uniform float uLight3Intensity;
  uniform vec3  uLight3Color;
  uniform vec3  uLight3Pos;

  uniform float uJitterStrength;
  uniform float uDitherStrength;
  uniform float uNoiseReferenceHeight;

  // Interleaved gradient noise, deterministic, range [0, 1)
  float gradientNoise(vec2 p) {
    return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
  }

  // Triangular distributed dither, range (-1, 1)
  float triangularDither(vec2 p) {
    return gradientNoise(p) + gradientNoise(p + vec2(47.3, 13.9)) - 1.0;
  }

  // Smooth multi-stop palette interpolation
  vec3 samplePalette(float t) {
    float p = fract(t) * 5.0;
    int idx = int(floor(p));
    float f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    if (idx == 0) return mix(uColor1, uColor2, f);
    if (idx == 1) return mix(uColor2, uColor3, f);
    if (idx == 2) return mix(uColor3, uColor4, f);
    if (idx == 3) return mix(uColor4, uColor5, f);
    return mix(uColor5, uColor1, f);
  }

  void main() {
    vec2 fragCoord = gl_FragCoord.xy;
    vec2 resolution = max(uResolution, vec2(1.0));

    // Centered coordinates with correct aspect ratio
    vec2 screenPosition = (2.0 * fragCoord - resolution) / resolution.y;

    // Deformation mask: weak at center, full at center radius and beyond
    float centerDistance = length(screenPosition);
    float warpMask = mix(
      uCenterWarpAmount,
      1.0,
      smoothstep(0.0, max(uCenterRadius, 0.001), centerDistance)
    );

    // Vertical stretch: taller lines, same horizontal width
    screenPosition.y /= max(uLineHeight, 0.05);

    vec3 rayDirection = uCameraRotation * normalize(vec3(screenPosition, max(uFocalLength, 0.001)));

    // Noise grain size in physical pixels, stays visible on high-DPI screens
    float pixelScale = max(1.0, floor(resolution.y / uNoiseReferenceHeight + 0.5));
    vec2 noiseCoord = floor(fragCoord / pixelScale);

    vec3 color = vec3(0.0);

    // Per-pixel start offset breaks up ray marching bands
    float rayDistance = uStartDistance + uJitterStrength * gradientNoise(noiseCoord);
    float stepDistance = 0.1;

    // Glow level at cutoff distance, subtracted to keep background black
    float backgroundGlow = 1.0 / (uBackgroundCutoff * uBackgroundCutoff + uLineCore);

    for (int stepIndex = 20; stepIndex < uRaySteps; ++stepIndex) {
      float iteration = float(stepIndex) + 2.0;

      vec3 position = uCameraPosition + rayDistance * rayDirection;

      // Phase is invariant for all warp octaves of this step
      float phase = uTime + iteration - rayDistance;

      for (int warpIndex = 1; warpIndex <= uWarpSteps; ++warpIndex) {
        float frequency = float(warpIndex);

        // High octaves damped stronger, center mask reduces deformation
        float amplitude = 0.52 * warpMask * pow(frequency, -uWarpSmoothness);

        position += amplitude * sin(position.yzx * (frequency * uWarpFrequency) + phase) - 0.12;
      }

      vec4 distanceVector = vec4(
        abs(position.y + position.z * 0.20),
        sin(position - rayDistance) / 3.99
      );

      stepDistance = length(distanceVector) / (4.73 + rayDistance * rayDistance * 0.14);
      stepDistance = max(stepDistance, uEpsilon);

      vec3 palette;
      if (uColorMode == 0) {
        palette = 0.9 + sin(iteration * 1.3 - vec3(4.8, -0.4, 1.2));
      } else {
        palette = samplePalette(iteration * 0.125 + rayDistance * 0.035) * 1.6;
      }

      float safeRayDistance = max(rayDistance, uStartDistance);

      // Glow distance shrunk by line width: widens the bright core
      float glowDistance = max(stepDistance - uLineWidth, 0.0);
      float glowFalloff = glowDistance * glowDistance + uLineCore;

      // Glow tail beyond the cutoff is removed
      float glow = max(1.0 / glowFalloff - backgroundGlow, 0.0);

      // Light sources illumination
      vec3 lightContrib = vec3(0.0);
      if (uLight1Enabled > 0.5) {
        float d1 = length(position - uLight1Pos);
        lightContrib += uLight1Color * (uLight1Intensity / (1.0 + d1 * d1 * 0.4));
      }
      if (uLight2Enabled > 0.5) {
        float d2 = length(position - uLight2Pos);
        lightContrib += uLight2Color * (uLight2Intensity / (1.0 + d2 * d2 * 0.4));
      }
      if (uLight3Enabled > 0.5) {
        float d3 = length(position - uLight3Pos);
        lightContrib += uLight3Color * (uLight3Intensity / (1.0 + d3 * d3 * 0.4));
      }

      vec3 litPalette = palette * (uSceneLightIntensity + lightContrib);
      color += litPalette * glow / safeRayDistance;

      rayDistance += stepDistance;
    }

    color *= uTint;

    // Stable approximation of tanh tone mapping
    color /= max(uExposure, 1.0);
    vec3 e = exp(2.0 * clamp(color, -10.0, 10.0));
    color = (e - 1.0) / (e + 1.0);
    color = clamp(color, 0.0, 1.0);

    // Output dithering, disabled on pure black
    vec3 ditherMask = clamp(color * 255.0, 0.0, 1.0);
    color += ditherMask * triangularDither(fragCoord) * uDitherStrength / 255.0;
    color = clamp(color, 0.0, 1.0);

    // Background & Green screen composite
    vec3 bg = (uGreenScreen > 0.5) ? vec3(0.0, 1.0, 0.0) : uBackgroundColor;
    float alpha = clamp(max(color.r, max(color.g, color.b)) * 2.2, 0.0, 1.0);
    vec3 finalColor = bg * (1.0 - alpha) + color;
    finalColor = clamp(finalColor, 0.0, 1.0);

    gl_FragColor = vec4(finalColor, 1.0);
  }
`;

// Fullscreen quad

geometry.setAttribute('position', new THREE.Float32BufferAttribute([
  -1, -1, 0,
   3, -1, 0,
  -1,  3, 0
], 3));

const uniforms = {
  uResolution: { value: new THREE.Vector2(1, 1) },
  uTime: { value: 0 },

  uFocalLength: { value: params.focalLength },
  uCameraPosition: { value: new THREE.Vector3(params.cameraX, params.cameraY, params.cameraZ) },
  uCameraRotation: { value: new THREE.Matrix3() },

  uRaySteps: { value: params.raySteps },
  uWarpSteps: { value: params.warpSteps },

  uStartDistance: { value: params.startDistance },
  uEpsilon: { value: params.epsilon },
  uLineWidth: { value: params.lineWidth },
  uLineCore: { value: params.lineCore },
  uLineHeight: { value: params.lineHeight },
  uWarpSmoothness: { value: params.warpSmoothness },
  uWarpFrequency: { value: params.warpFrequency },
  uCenterWarpAmount: { value: params.centerWarpAmount },
  uCenterRadius: { value: params.centerRadius },

  uColorMode: { value: params.colorMode },
  uTint: { value: new THREE.Color(params.tint) },
  uColor1: { value: new THREE.Color(params.color1) },
  uColor2: { value: new THREE.Color(params.color2) },
  uColor3: { value: new THREE.Color(params.color3) },
  uColor4: { value: new THREE.Color(params.color4) },
  uColor5: { value: new THREE.Color(params.color5) },

  uBackgroundColor: { value: new THREE.Color(params.backgroundColor) },
  uGreenScreen: { value: params.greenScreen ? 1.0 : 0.0 },

  uSceneLightIntensity: { value: params.sceneLightIntensity },
  uExposure: { value: params.exposure },
  uBackgroundCutoff: { value: params.backgroundCutoff },

  uLight1Enabled: { value: params.light1Enabled ? 1.0 : 0.0 },
  uLight1Intensity: { value: params.light1Intensity },
  uLight1Color: { value: new THREE.Color(params.light1Color) },
  uLight1Pos: { value: new THREE.Vector3(params.light1X, params.light1Y, params.light1Z) },

  uLight2Enabled: { value: params.light2Enabled ? 1.0 : 0.0 },
  uLight2Intensity: { value: params.light2Intensity },
  uLight2Color: { value: new THREE.Color(params.light2Color) },
  uLight2Pos: { value: new THREE.Vector3(params.light2X, params.light2Y, params.light2Z) },

  uLight3Enabled: { value: params.light3Enabled ? 1.0 : 0.0 },
  uLight3Intensity: { value: params.light3Intensity },
  uLight3Color: { value: new THREE.Color(params.light3Color) },
  uLight3Pos: { value: new THREE.Vector3(params.light3X, params.light3Y, params.light3Z) },

  uJitterStrength: { value: params.jitterStrength },
  uDitherStrength: { value: params.ditherStrength },
  uNoiseReferenceHeight: { value: params.noiseReferenceHeight }
};

const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms,
  depthTest: false,
  depthWrite: false
});

const quad = new THREE.Mesh(geometry, material);
quad.frustumCulled = false;
scene.add(quad);

// ============================================================
// Helpers
// ============================================================
const drawingBufferSize = new THREE.Vector2();
const cameraEuler = new THREE.Euler();
const cameraMatrix4 = new THREE.Matrix4();

function updateResolution() {
  renderer.getDrawingBufferSize(drawingBufferSize);
  uniforms.uResolution.value.copy(drawingBufferSize);
}

function updateCameraRotation() {
  cameraEuler.set(
    THREE.MathUtils.degToRad(params.pitch),
    THREE.MathUtils.degToRad(params.yaw),
    THREE.MathUtils.degToRad(params.roll),
    'YXZ'
  );
  cameraMatrix4.makeRotationFromEuler(cameraEuler);
  uniforms.uCameraRotation.value.setFromMatrix4(cameraMatrix4);
}

function updateCameraPosition() {
  uniforms.uCameraPosition.value.set(params.cameraX, params.cameraY, params.cameraZ);
}

function updateLightPositions() {
  uniforms.uLight1Pos.value.set(params.light1X, params.light1Y, params.light1Z);
  uniforms.uLight2Pos.value.set(params.light2X, params.light2Y, params.light2Z);
  uniforms.uLight3Pos.value.set(params.light3X, params.light3Y, params.light3Z);
}

function applyDpr() {
  renderer.setPixelRatio(Math.min(params.dpr, MAX_DPR));
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateResolution();
}

function applyColorScheme(name) {
  const s = colorSchemes[name];
  if (!s) return;
  params.colorMode = s.mode;
  uniforms.uColorMode.value = s.mode;
  params.tint = s.tint;
  uniforms.uTint.value.set(s.tint);

  if (!params.greenScreen) {
    params.backgroundColor = s.bg;
    uniforms.uBackgroundColor.value.set(s.bg);
    renderer.setClearColor(s.bg, 1);
  }

  params.color1 = s.colors[0];
  params.color2 = s.colors[1];
  params.color3 = s.colors[2];
  params.color4 = s.colors[3];
  params.color5 = s.colors[4];
  uniforms.uColor1.value.set(s.colors[0]);
  uniforms.uColor2.value.set(s.colors[1]);
  uniforms.uColor3.value.set(s.colors[2]);
  uniforms.uColor4.value.set(s.colors[3]);
  uniforms.uColor5.value.set(s.colors[4]);
}

function syncAllUniforms() {
  uniforms.uFocalLength.value = params.focalLength;
  userBaseFocalLength = params.focalLength;
  userBaseX = params.cameraX;
  userBaseY = params.cameraY;
  userBaseZ = params.cameraZ;
  userBaseYaw = params.yaw;
  userBasePitch = params.pitch;
  userBaseRoll = params.roll;
  updateCameraPosition();
  updateCameraRotation();

  uniforms.uRaySteps.value = params.raySteps;
  uniforms.uWarpSteps.value = params.warpSteps;
  uniforms.uStartDistance.value = params.startDistance;
  uniforms.uEpsilon.value = params.epsilon;
  uniforms.uLineWidth.value = params.lineWidth;
  uniforms.uLineCore.value = params.lineCore;
  uniforms.uLineHeight.value = params.lineHeight;
  uniforms.uWarpSmoothness.value = params.warpSmoothness;
  uniforms.uWarpFrequency.value = params.warpFrequency;
  uniforms.uCenterWarpAmount.value = params.centerWarpAmount;
  uniforms.uCenterRadius.value = params.centerRadius;

  uniforms.uTint.value.set(params.tint);
  uniforms.uExposure.value = params.exposure;
  uniforms.uBackgroundCutoff.value = params.backgroundCutoff;

  uniforms.uBackgroundColor.value.set(params.backgroundColor);
  uniforms.uGreenScreen.value = params.greenScreen ? 1.0 : 0.0;
  renderer.setClearColor(params.greenScreen ? 0x00ff00 : params.backgroundColor, 1);

  uniforms.uColorMode.value = params.colorMode;
  uniforms.uColor1.value.set(params.color1);
  uniforms.uColor2.value.set(params.color2);
  uniforms.uColor3.value.set(params.color3);
  uniforms.uColor4.value.set(params.color4);
  uniforms.uColor5.value.set(params.color5);

  uniforms.uSceneLightIntensity.value = params.sceneLightIntensity;
  uniforms.uLight1Enabled.value = params.light1Enabled ? 1.0 : 0.0;
  uniforms.uLight1Intensity.value = params.light1Intensity;
  uniforms.uLight1Color.value.set(params.light1Color);
  uniforms.uLight1Pos.value.set(params.light1X, params.light1Y, params.light1Z);

  uniforms.uLight2Enabled.value = params.light2Enabled ? 1.0 : 0.0;
  uniforms.uLight2Intensity.value = params.light2Intensity;
  uniforms.uLight2Color.value.set(params.light2Color);
  uniforms.uLight2Pos.value.set(params.light2X, params.light2Y, params.light2Z);

  uniforms.uLight3Enabled.value = params.light3Enabled ? 1.0 : 0.0;
  uniforms.uLight3Intensity.value = params.light3Intensity;
  uniforms.uLight3Color.value.set(params.light3Color);
  uniforms.uLight3Pos.value.set(params.light3X, params.light3Y, params.light3Z);

  uniforms.uJitterStrength.value = params.jitterStrength;
  uniforms.uDitherStrength.value = params.ditherStrength;
  uniforms.uNoiseReferenceHeight.value = params.noiseReferenceHeight;

  applyDpr();
}

// Procedural scene variation upon click or trigger
function randomizeScene() {
  const schemeKeys = Object.keys(colorSchemes);
  const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  params.colorScheme = randomSchemeKey;
  applyColorScheme(randomSchemeKey);

  // Geometric parameters
  params.startDistance = Number((0.2 + Math.random() * 0.5).toFixed(2));
  params.epsilon = Number((0.005 + Math.random() * 0.015).toFixed(4));
  params.lineWidth = Number((0.004 + Math.random() * 0.012).toFixed(4));
  params.lineCore = Number((0.00005 + Math.random() * 0.0003).toFixed(5));
  params.lineHeight = Number((1.2 + Math.random() * 1.5).toFixed(2));
  params.warpSmoothness = Number((1.8 + Math.random() * 1.2).toFixed(2));
  params.warpFrequency = Number((1.5 + Math.random() * 2.2).toFixed(2));
  params.centerWarpAmount = Number((0.05 + Math.random() * 0.3).toFixed(2));
  params.centerRadius = Number((0.3 + Math.random() * 0.6).toFixed(2));
  params.warpSteps = Math.floor(4 + Math.random() * 6);
  params.backgroundCutoff = Number((0.04 + Math.random() * 0.12).toFixed(3));
  params.exposure = Number((1500 + Math.random() * 2500).toFixed(0));

  // Lighting parameters
  params.sceneLightIntensity = Number((0.7 + Math.random() * 0.8).toFixed(2));
  params.light1Intensity = Number((0.6 + Math.random() * 1.2).toFixed(2));
  params.light2Intensity = Number((0.4 + Math.random() * 0.9).toFixed(2));
  params.light3Intensity = Number((0.3 + Math.random() * 0.8).toFixed(2));

  // Animation preset & speed
  params.animationPreset = animationPresets[Math.floor(Math.random() * animationPresets.length)];
  params.speed = Number((0.4 + Math.random() * 0.8).toFixed(2));

  syncAllUniforms();
  refreshGui();
}

function rebuildRenderer() {
  const oldDom = renderer.domElement;
  renderer.setAnimationLoop(null);
  renderer.dispose();
  oldDom.remove();

  renderer = new THREE.WebGLRenderer({
    antialias: params.antialias,
    alpha: false,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(params.dpr, MAX_DPR));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(params.greenScreen ? 0x00ff00 : params.backgroundColor, 1);
  renderer.toneMapping = THREE.NoToneMapping;
  document.body.appendChild(renderer.domElement);

  setupInteractionEvents(renderer.domElement);
  updateResolution();
  renderer.setAnimationLoop(renderFrame);
}

// ============================================================
// Interactive Mouse & Keyboard Controls
// ============================================================
let isPointerDown = false;
let pointerButton = 0;
let lastX = 0;
let lastY = 0;
let dragDist = 0;

function setupInteractionEvents(domElement) {
  domElement.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.lil-gui')) return;
    isPointerDown = true;
    pointerButton = e.button;
    lastX = e.clientX;
    lastY = e.clientY;
    dragDist = 0;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isPointerDown) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    dragDist += Math.hypot(dx, dy);

    const isPan = (pointerButton === 0 && !e.shiftKey && params.dragMode === 'Pan Object') ||
                  (pointerButton === 1) || (pointerButton === 0 && e.altKey);

    if (isPan) {
      // Drag object across screen
      const panSpeed = 0.003 * (0.09 / Math.max(userBaseFocalLength, 0.01));
      userBaseX -= dx * panSpeed;
      userBaseY += dy * panSpeed;
      params.cameraX = Number(userBaseX.toFixed(3));
      params.cameraY = Number(userBaseY.toFixed(3));
    } else {
      // Change camera angle (yaw / pitch) during orbit / animation
      const rotSpeed = 0.35;
      userBaseYaw = (userBaseYaw - dx * rotSpeed) % 360;
      userBasePitch = THREE.MathUtils.clamp(userBasePitch - dy * rotSpeed, -89, 89);
      params.yaw = Number(userBaseYaw.toFixed(1));
      params.pitch = Number(userBasePitch.toFixed(1));
    }
  });

  window.addEventListener('pointerup', (e) => {
    if (!isPointerDown) return;
    isPointerDown = false;
    // Check if it was a clean click on canvas (not dragging, not on GUI)
    if (dragDist < 6 && pointerButton === 0 && !e.target.closest('.lil-gui')) {
      if (params.clickToRandomize) {
        randomizeScene();
      }
    }
  });

  domElement.addEventListener('contextmenu', (e) => e.preventDefault());

  // Mouse wheel zoom: modifies user base zoom persistently during animation
  domElement.addEventListener('wheel', (e) => {
    if (e.target.closest('.lil-gui')) return;
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
    userBaseFocalLength = THREE.MathUtils.clamp(userBaseFocalLength * zoomFactor, 0.015, 1.2);
    params.focalLength = Number(userBaseFocalLength.toFixed(4));
    refreshGui();
  }, { passive: false });
}

const clock = new THREE.Clock();
let animationTime = 0;

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta();
});

// ============================================================
// Animation loop
// ============================================================
function renderFrame() {
  const delta = Math.min(clock.getDelta(), MAX_DELTA);
  if (!params.paused) animationTime += delta * params.speed;
  uniforms.uTime.value = animationTime;

  // Compute smooth animation offsets from preconfigured presets
  let animX = 0, animY = 0, animZ = 0;
  let animYaw = 0, animPitch = 0, animRoll = 0;
  let animFocalMult = 1.0;

  const t = animationTime;

  switch (params.animationPreset) {
    case 'Static (No Camera Movement)':
      // Camera stays completely motionless at user's position and angle
      break;
    case 'Gentle Orbit':
      animYaw = (t * 10.0) % 360;
      animPitch = Math.sin(t * 0.25) * 6.0;
      break;
    case 'Slow Breathing Dolly':
      animZ = Math.sin(t * 0.35) * 0.35;
      animFocalMult = 1.0 + Math.sin(t * 0.35) * 0.12;
      break;
    case 'Infinity Figure-8 Drift':
      animX = Math.sin(t * 0.25) * 0.25;
      animY = Math.sin(t * 0.5) * 0.12;
      animYaw = Math.cos(t * 0.25) * 8.0;
      break;
    case 'Cosmic Pendulum':
      animRoll = Math.sin(t * 0.3) * 12.0;
      animYaw = Math.cos(t * 0.24) * 14.0;
      animPitch = Math.sin(t * 0.15) * 6.0;
      break;
    case 'Deep Space Flythrough':
      animZ = Math.sin(t * 0.2) * 0.45;
      animRoll = (t * 4.0) % 360;
      animY = Math.cos(t * 0.2) * 0.1;
      break;
    case 'Zenith Horizon Arc':
      animPitch = Math.sin(t * 0.22) * 20.0;
      animYaw = Math.cos(t * 0.15) * 12.0;
      animX = Math.sin(t * 0.15) * 0.15;
      break;
    case 'Harmonic Warp Pulse':
      animYaw = Math.sin(t * 0.2) * 14.0;
      animPitch = Math.cos(t * 0.26) * 7.0;
      animZ = Math.sin(t * 0.3) * 0.22;
      break;
  }

  // Combine user's base position/angle/zoom with active animation deltas
  // User zoom & camera angles persist seamlessly and never snap back
  const effFocal = THREE.MathUtils.clamp(userBaseFocalLength * animFocalMult, 0.005, 2.0);
  uniforms.uFocalLength.value = effFocal;

  const effX = userBaseX + animX;
  const effY = userBaseY + animY;
  const effZ = userBaseZ + animZ;
  uniforms.uCameraPosition.value.set(effX, effY, effZ);

  const effPitch = userBasePitch + animPitch;
  const effYaw = userBaseYaw + animYaw;
  const effRoll = userBaseRoll + animRoll;

  cameraEuler.set(
    THREE.MathUtils.degToRad(effPitch),
    THREE.MathUtils.degToRad(effYaw),
    THREE.MathUtils.degToRad(effRoll),
    'YXZ'
  );
  cameraMatrix4.makeRotationFromEuler(cameraEuler);
  uniforms.uCameraRotation.value.setFromMatrix4(cameraMatrix4);

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(renderFrame);
