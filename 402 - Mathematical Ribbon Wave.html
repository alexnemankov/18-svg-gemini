<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undulating Mathematical Ribbon Wave</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>

  <style>
    @property --a {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: true;
    }

    :root {
      --size: 140deg;
      --count: 24;
      --a: 0deg;
      --c-top: #ff8c00;
      --c-mid: #ff00ff;
      --c-center: #03072c;
      --c-accent: #ff007f;
      --bg-base: #03072c;
      --noise-opacity: 0.5;
      --noise-display: block;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-base);
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.3s ease;
      touch-action: none;
    }

    body.grabbing {
      cursor: grabbing;
    }

    /* Green Screen Mode */
    body.greenscreen {
      background-color: #00ff00 !important;
      background-image: none !important;
    }

    body.greenscreen::after {
      display: none !important;
    }

    /* Noise overlay from CodePen */
    body::after {
      content: "";
      opacity: var(--noise-opacity);
      position: fixed;
      background: url(https://assets.codepen.io/907471/noise.svg);
      mix-blend-mode: hue;
      inset: 0;
      pointer-events: none;
      filter: invert(1) brightness(5) saturate(.5);
      z-index: 8;
      display: var(--noise-display);
    }

    /* World Stage for Zoom, Drag, Tilt and Motion */
    #world-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      margin-top: -50vh;
      margin-left: -50vw;
      transform-origin: center center;
      transform-style: preserve-3d;
      will-change: transform;
      z-index: 2;
    }

    /* Column Container */
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
      --per-item: calc(50% / var(--count));
      --p-per-item: calc(1 / var(--count));
      position: relative;
      overflow: hidden;
    }

    /* Oscillating Wave Column */
    .col {
      flex: 1;
      height: 100%;
      --a-per-item: calc(var(--size) / var(--count) * var(--i) - var(--a));
      --pos1: calc(50% * cos(var(--a-per-item)));
      background: linear-gradient(
        to bottom,
        var(--c-top),
        var(--c-mid) var(--pos1),
        var(--c-center) 50%,
        var(--c-mid) calc(100% - var(--pos1)),
        var(--c-top)
      );
      will-change: background;
    }

    /* Three.js Canvas Layer */
    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
      mix-blend-mode: screen;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 3D Transformable Stage -->
  <div id="world-stage">
    <div class="container" id="wave-container"></div>
  </div>

  <!-- Three.js Ambient & Particle Canvas -->

    /* ==========================================================================

       ========================================================================== */
    const ANIMATION_PRESETS = [
      'Static (No Camera Movement)',
      'Gentle Sine Sway',
      'Hypnotic Ribbon Tilt',
      'Cosmic Infinity Orbit',
      'Subtle Wave Pulse',
      'Ethereal Horizon Drift',
      'Harmonic Pendulum Glide',
      'Deep Spatial Float'
    ];

    /* ==========================================================================
       Cubic Bezier Easing Function (0.83, -0.49, 0.15, 1.84)
       ========================================================================== */
    function solveCubicBezier(x1, y1, x2, y2) {
      return function(x) {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        let t = x;
        for (let i = 0; i < 8; i++) {
          const oneMinusT = 1 - t;
          const bx = 3 * oneMinusT * oneMinusT * t * x1 + 3 * oneMinusT * t * t * x2 + t * t * t;
          const dx = 3 * oneMinusT * oneMinusT * x1 + 6 * oneMinusT * t * (x2 - x1) + 3 * t * t * (1 - x2);
          if (Math.abs(dx) < 1e-6) break;
          t -= (bx - x) / dx;
          t = Math.max(0, Math.min(1, t));
        }
        const oneMinusT = 1 - t;
        return 3 * oneMinusT * oneMinusT * t * y1 + 3 * oneMinusT * t * t * y2 + t * t * t;
      };
    }
    const easeWave = solveCubicBezier(0.83, -0.49, 0.15, 1.84);

    /* ==========================================================================
       Configuration & State
       ========================================================================== */
    const settings = {
      // Presets
      colorScheme: 'Original',
      animationPreset: 'Gentle Sine Sway',
      greenScreen: false,
      clickRandomize: true,
      randomizeNow: () => randomizeScene(true),

      // Navigation & Object Transformation
      zoom: 1.0,
      panX: 0,
      panY: 0,
      rotX: 0,
      rotY: 0,
      resetView: () => resetCameraView(),

      // Motion & Timing
      speed: 1.0,
      paused: false,
      cycleDuration: 12.0,

      // Wave Geometry
      columnCount: 24,
      waveSize: 140, // degrees
      noiseOverlay: true,

      // Lighting & Exposure
      exposure: 1.0,
      sceneLightIntensity: 1.0,

      // Light Sources
      ambientIntensity: 1.0,
      ambientColor: '#331144',
      mainLightIntensity: 1.3,
      mainLightColor: '#ff8c00',
      mainLightX: 60,
      mainLightY: 80,
      mainLightZ: 90,
      rimLightIntensity: 1.1,
      rimLightColor: '#ff00ff',
      rimLightX: -70,
      rimLightY: -50,
      rimLightZ: 80,
      stardustIntensity: 1.0,
      stardustColor: '#ff00aa',
      stardustSize: 2.2,

      // Rendering Pipeline
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),

      // Individual Colors Palette Overrides
      bgBase: '#03072c',
      cTop: '#ff8c00',
      cMid: '#ff00ff',
      cCenter: '#03072c',
      cAccent: '#ff00aa'

    /* ==========================================================================
       DOM Setup & Dynamic Column Generation
       ========================================================================== */
    const root = document.documentElement;
    const stage = document.getElementById('world-stage');
    const waveContainer = document.getElementById('wave-container');
    const webglCanvas = document.getElementById('webgl-canvas');
    let cols = [];

    function buildColumns() {
      waveContainer.innerHTML = '';
      cols = [];
      const count = settings.columnCount;
      root.style.setProperty('--count', count);
      for (let i = 0; i < count; i++) {
        const col = document.createElement('div');
        col.className = 'col';
        col.style.setProperty('--i', i);
        waveContainer.appendChild(col);
        cols.push(col);
      }
    }

    buildColumns();

    /* ==========================================================================
       Three.js Ambient Lighting & Floating Stardust Overlay
       ========================================================================== */
    let renderer, threeScene, threeCamera;
    let ambientLight, directionalLight, pointLight;
    let particlePoints, particleMat, particleGeo;
    let crystalGroup;

    function initThree() {
      if (renderer) {
        renderer.dispose();
      }

      renderer = new THREE.WebGLRenderer({
        canvas: webglCanvas,
        antialias: settings.antialias,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(settings.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = settings.exposure;

      threeScene = new THREE.Scene();
      threeCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      threeCamera.position.z = 110;

      // Lights
      ambientLight = new THREE.AmbientLight(settings.ambientColor, settings.ambientIntensity * settings.sceneLightIntensity);
      threeScene.add(ambientLight);

      directionalLight = new THREE.DirectionalLight(settings.mainLightColor, settings.mainLightIntensity * settings.sceneLightIntensity);
      directionalLight.position.set(settings.mainLightX, settings.mainLightY, settings.mainLightZ);
      threeScene.add(directionalLight);

      pointLight = new THREE.PointLight(settings.rimLightColor, settings.rimLightIntensity * settings.sceneLightIntensity, 700);
      pointLight.position.set(settings.rimLightX, settings.rimLightY, settings.rimLightZ);
      threeScene.add(pointLight);

      // Stardust Points
      const particleCount = 650;
      particleGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 260;
        posArray[i + 1] = (Math.random() - 0.5) * 180;
        posArray[i + 2] = (Math.random() - 0.5) * 160;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

      particleMat = new THREE.PointsMaterial({
        size: settings.stardustSize,
        color: new THREE.Color(settings.stardustColor),
        transparent: true,
        opacity: Math.min(1.0, settings.stardustIntensity * 0.8),
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particlePoints = new THREE.Points(particleGeo, particleMat);
      threeScene.add(particlePoints);

      // Floating Specular Crystal Nodes
      crystalGroup = new THREE.Group();
      const crystalGeo = new THREE.OctahedronGeometry(2.5, 0);
      const crystalMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(settings.cAccent),
        roughness: 0.2,
        metalness: 0.85,
        wireframe: false
      });

      for (let j = 0; j < 18; j++) {
        const mesh = new THREE.Mesh(crystalGeo, crystalMat);
        mesh.position.set(
          (Math.random() - 0.5) * 180,
          (Math.random() - 0.5) * 110,
          (Math.random() - 0.5) * 90
        );
        mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        mesh.scale.setScalar(0.7 + Math.random() * 0.8);
        crystalGroup.add(mesh);
      }
      threeScene.add(crystalGroup);
    }

    initThree();

    /* ==========================================================================
       Visual Theme & CSS Variable Engine
       ========================================================================== */
    function updateCSSVariables() {
      if (settings.greenScreen) {
        document.body.classList.add('greenscreen');
      } else {
        document.body.classList.remove('greenscreen');
      }

      root.style.setProperty('--bg-base', settings.bgBase);
      root.style.setProperty('--c-top', settings.cTop);
      root.style.setProperty('--c-mid', settings.cMid);
      root.style.setProperty('--c-center', settings.cCenter);
      root.style.setProperty('--c-accent', settings.cAccent);
      root.style.setProperty('--size', `${settings.waveSize}deg`);
      root.style.setProperty('--count', settings.columnCount);
      root.style.setProperty('--noise-display', settings.noiseOverlay ? 'block' : 'none');

      // Three.js Materials & Lights
      if (ambientLight) {
        ambientLight.color.set(settings.ambientColor);
        ambientLight.intensity = settings.ambientIntensity * settings.sceneLightIntensity;
      }
      if (directionalLight) {
        directionalLight.color.set(settings.mainLightColor);
        directionalLight.intensity = settings.mainLightIntensity * settings.sceneLightIntensity;
        directionalLight.position.set(settings.mainLightX, settings.mainLightY, settings.mainLightZ);
      }
      if (pointLight) {
        pointLight.color.set(settings.rimLightColor);
        pointLight.intensity = settings.rimLightIntensity * settings.sceneLightIntensity;
        pointLight.position.set(settings.rimLightX, settings.rimLightY, settings.rimLightZ);
      }
      if (particleMat) {
        particleMat.color.set(settings.stardustColor);
        particleMat.size = settings.stardustSize;
        particleMat.opacity = Math.min(1.0, settings.stardustIntensity * 0.8);
      }
      if (crystalGroup) {
        crystalGroup.children.forEach(mesh => {
          mesh.material.color.set(settings.cAccent);
        });
      }
      if (renderer) {
        renderer.toneMappingExposure = settings.exposure;
      }
    }

    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;

      settings.colorScheme = name;
      settings.cTop = scheme.cTop;
      settings.cMid = scheme.cMid;
      settings.cCenter = scheme.cCenter;
      settings.cAccent = scheme.cAccent;
      settings.bgBase = scheme.bgBase;

      settings.ambientColor = scheme.ambientColor;
      settings.mainLightColor = scheme.mainLightColor;
      settings.rimLightColor = scheme.rimLightColor;
      settings.stardustColor = scheme.cAccent;

      updateCSSVariables();
      syncGUIControllers();
    }

    function resetCameraView() {
      settings.zoom = 1.0;
      settings.panX = 0;
      settings.panY = 0;
      settings.rotX = 0;
      settings.rotY = 0;
      syncGUIControllers();
    }

    /* ==========================================================================
       Procedural Variation on Scene Click
       ========================================================================== */
    function randomizeScene(manual = false) {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // Re-roll geometric & motion parameters
      settings.waveSize = Math.floor(90 + Math.random() * 160);
      settings.columnCount = Math.floor(16 + Math.random() * 16);
      settings.speed = +(0.65 + Math.random() * 1.1).toFixed(2);
      settings.exposure = +(0.85 + Math.random() * 0.4).toFixed(2);
      settings.sceneLightIntensity = +(0.85 + Math.random() * 0.45).toFixed(2);
      settings.mainLightX = Math.floor((Math.random() - 0.5) * 260);
      settings.mainLightY = Math.floor((Math.random() - 0.5) * 260);
      settings.rimLightX = Math.floor((Math.random() - 0.5) * 260);
      settings.rimLightY = Math.floor((Math.random() - 0.5) * 260);

      // Re-scatter particles
      if (particleGeo) {
        const positions = particleGeo.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
          positions[i] = (Math.random() - 0.5) * 260;
          positions[i + 1] = (Math.random() - 0.5) * 180;
          positions[i + 2] = (Math.random() - 0.5) * 160;
        }
        particleGeo.attributes.position.needsUpdate = true;
      }

      buildColumns();
      updateCSSVariables();
      syncGUIControllers();
    }

    /* ==========================================================================
       Interactive Controls: Drag (Pointer) & Zoom (Wheel)
       ========================================================================== */
    let isPointerDown = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let startPanX = 0;
    let startPanY = 0;
    let hasDragged = false;
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isPointerDown = true;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      startPanX = settings.panX;
      startPanY = settings.panY;
      hasDragged = false;
      pointerDownTime = performance.now();
      document.body.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - startPointerX;
      const dy = e.clientY - startPointerY;

      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
      }

      if (e.buttons === 2 || e.shiftKey) {
        // Orbit / Tilt with right-click or shift-drag
        settings.rotY += (e.movementX || 0) * 0.35;
        settings.rotX -= (e.movementY || 0) * 0.35;
        settings.rotX = Math.max(-75, Math.min(75, settings.rotX));
        syncGUIProperty('rotX');
        syncGUIProperty('rotY');
      } else {
        // Drag object across screen
        settings.panX = startPanX + dx;
        settings.panY = startPanY + dy;
        syncGUIProperty('panX');
        syncGUIProperty('panY');
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      document.body.classList.remove('grabbing');

      const duration = performance.now() - pointerDownTime;
      if (!hasDragged && duration < 380 && settings.clickRandomize) {
        if (!e.target.closest('.lil-gui')) {
          randomizeScene();
        }
      }
    });

    // Zoom with wheel
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 0.92;
      settings.zoom = Math.min(Math.max(settings.zoom * factor, 0.2), 5.0);
      syncGUIProperty('zoom');
    }, { passive: false });

    // Prevent context menu during right-click tilt
    window.addEventListener('contextmenu', (e) => {
      if (!e.target.closest('.lil-gui')) e.preventDefault();
    });

    // Window resize handler
    window.addEventListener('resize', () => {
      if (renderer && threeCamera) {
        renderer.setSize(window.innerWidth, window.innerHeight);
        threeCamera.aspect = window.innerWidth / window.innerHeight;
        threeCamera.updateProjectionMatrix();
      }
    });

    // Keyboard shortcut: 'H' key to toggle UI
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui.show(gui._hidden);
      }
    });

    /* ==========================================================================
       lil-gui Controls Configuration
       ========================================================================== */
    const gui = new GUI({ title: 'Ribbon Wave Controls', width: 310 });

    function syncGUIControllers() {
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function syncGUIProperty(prop) {
      gui.controllersRecursive().forEach(c => {
        if (c.property === prop) c.updateDisplay();
      });
    }

    // Presets & Themes Folder
    const fPresets = gui.addFolder('Presets & Themes');
    fPresets.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => applyColorScheme(v));
    fPresets.add(settings, 'animationPreset', ANIMATION_PRESETS).name('Camera Motion');
    fPresets.add(settings, 'greenScreen').name('Green Screen #00ff00').onChange(() => updateCSSVariables());
    fPresets.add(settings, 'clickRandomize').name('Click Scene to Randomize');
    fPresets.add(settings, 'randomizeNow').name('🎲 Procedural Re-roll');

    // Camera & Viewport Navigation Folder
    const fCamera = gui.addFolder('Camera & Viewport');
    fCamera.add(settings, 'zoom', 0.2, 5.0, 0.01).name('Zoom (Wheel)');
    fCamera.add(settings, 'panX', -1500, 1500, 1).name('Pan X (Drag)');
    fCamera.add(settings, 'panY', -1000, 1000, 1).name('Pan Y (Drag)');
    fCamera.add(settings, 'rotX', -75, 75, 0.5).name('Tilt X (Shift-Drag)');
    fCamera.add(settings, 'rotY', -180, 180, 0.5).name('Orbit Y');
    fCamera.add(settings, 'resetView').name('Reset View');

    // Motion & Timing Folder
    const fMotion = gui.addFolder('Motion & Timing');
    fMotion.add(settings, 'speed', 0.0, 4.0, 0.05).name('Animation Speed');
    fMotion.add(settings, 'paused').name('Pause Motion');
    fMotion.add(settings, 'cycleDuration', 4.0, 30.0, 0.5).name('Cycle Duration (s)');

    // Wave Geometry Folder
    const fGeometry = gui.addFolder('Wave Geometry');
    fGeometry.add(settings, 'columnCount', 8, 48, 1).name('Column Count').onChange(() => {
      buildColumns();
      updateCSSVariables();
    });
    fGeometry.add(settings, 'waveSize', 40, 360, 1).name('Wave Span (--size)').onChange(() => updateCSSVariables());
    fGeometry.add(settings, 'noiseOverlay').name('Texture Noise').onChange(() => updateCSSVariables());

    // Lighting & Exposure Folder
    const fLighting = gui.addFolder('Lighting & Exposure');
    fLighting.add(settings, 'exposure', 0.1, 3.0, 0.02).name('Scene Exposure').onChange(() => updateCSSVariables());
    fLighting.add(settings, 'sceneLightIntensity', 0.0, 3.0, 0.05).name('Scene Light Multiplier').onChange(() => updateCSSVariables());

    // Light Sources Folder
    const fLights = gui.addFolder('Light Sources');
    fLights.add(settings, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Intensity').onChange(() => updateCSSVariables());
    fLights.addColor(settings, 'ambientColor').name('Ambient Color').onChange(() => updateCSSVariables());
    fLights.add(settings, 'mainLightIntensity', 0.0, 3.0, 0.05).name('Key Light Intensity').onChange(() => updateCSSVariables());
    fLights.addColor(settings, 'mainLightColor').name('Key Light Color').onChange(() => updateCSSVariables());
    fLights.add(settings, 'mainLightX', -250, 250, 1).name('Key Light X').onChange(() => updateCSSVariables());
    fLights.add(settings, 'mainLightY', -250, 250, 1).name('Key Light Y').onChange(() => updateCSSVariables());
    fLights.add(settings, 'mainLightZ', -250, 250, 1).name('Key Light Z').onChange(() => updateCSSVariables());
    fLights.add(settings, 'rimLightIntensity', 0.0, 3.0, 0.05).name('Rim Light Intensity').onChange(() => updateCSSVariables());
    fLights.addColor(settings, 'rimLightColor').name('Rim Light Color').onChange(() => updateCSSVariables());
    fLights.add(settings, 'rimLightX', -250, 250, 1).name('Rim Light X').onChange(() => updateCSSVariables());
    fLights.add(settings, 'rimLightY', -250, 250, 1).name('Rim Light Y').onChange(() => updateCSSVariables());
    fLights.add(settings, 'rimLightZ', -250, 250, 1).name('Rim Light Z').onChange(() => updateCSSVariables());
    fLights.add(settings, 'stardustIntensity', 0.0, 3.0, 0.05).name('Stardust Intensity').onChange(() => updateCSSVariables());
    fLights.addColor(settings, 'stardustColor').name('Stardust Color').onChange(() => updateCSSVariables());
    fLights.add(settings, 'stardustSize', 0.5, 8.0, 0.1).name('Stardust Size').onChange(() => updateCSSVariables());

    // Rendering Pipeline Folder
    const fRender = gui.addFolder('Rendering');
    fRender.add(settings, 'antialias').name('Three.js Antialias').onChange(() => {
      initThree();
      updateCSSVariables();
    });
    fRender.add(settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
      if (renderer) {
        renderer.setPixelRatio(v);
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    // Individual Colors Palette Folder (Closed by default)
    const fColors = gui.addFolder('Colors Palette').close();
    fColors.addColor(settings, 'bgBase').name('Background Deep').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'cTop').name('Wave Top / Bottom').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'cMid').name('Waveform Mid').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'cCenter').name('Centerline Base').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'cAccent').name('Accent Color').onChange(() => updateCSSVariables());

    /* ==========================================================================
       Main Infinite Render & Animation Loop
       ========================================================================== */
    let animTime = 0;
    let lastClock = performance.now();

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const now = performance.now();
      const dt = (now - lastClock) * 0.001;
      lastClock = now;

      if (!settings.paused) {
        animTime += dt * settings.speed;
      }

      // Compute Wave Angle using Cubic Bezier (0.83, -0.49, 0.15, 1.84)
      const duration = settings.cycleDuration > 0 ? settings.cycleDuration : 12.0;
      const progress = (animTime % duration) / duration;
      const easedY = easeWave(progress);
      const currentAngle = (easedY * 360) % 360;

      root.style.setProperty('--a', `${currentAngle.toFixed(2)}deg`);

      // Update Column Wave Gradient Positions
      const count = cols.length;
      for (let i = 0; i < count; i++) {
        const anglePerItem = (settings.waveSize / count) * i - currentAngle;
        const rad = (anglePerItem * Math.PI) / 180;
        const pos1 = 50 * Math.cos(rad);
        cols[i].style.setProperty('--pos1', `${pos1.toFixed(3)}%`);
      }

      // Compute Camera Motion Offsets from the 8 Preconfigured Animations
      let animPanX = 0;
      let animPanY = 0;
      let animRotX = 0;
      let animRotY = 0;
      let animZoom = 1.0;

      const t = animTime;

      switch (settings.animationPreset) {
        case 'Static (No Camera Movement)':
          break;
        case 'Gentle Sine Sway':
          animPanX = Math.sin(t * 0.3) * 35;
          animPanY = Math.cos(t * 0.25) * 18;
          animRotY = Math.sin(t * 0.2) * 5;
          animRotX = Math.cos(t * 0.15) * 3;
          break;
        case 'Hypnotic Ribbon Tilt':
          animRotX = Math.sin(t * 0.22) * 8;
          animRotY = Math.cos(t * 0.18) * 10;
          animPanY = Math.sin(t * 0.2) * 20;
          animZoom = 1.0 + Math.sin(t * 0.12) * 0.03;
          break;
        case 'Cosmic Infinity Orbit':
          animPanX = Math.sin(t * 0.2) * 45;
          animPanY = Math.sin(t * 0.4) * 22;
          animRotY = Math.sin(t * 0.2) * 7;
          animRotX = Math.cos(t * 0.2) * 4;
          animZoom = 1.0 + Math.sin(t * 0.15) * 0.03;
          break;
        case 'Subtle Wave Pulse':
          animZoom = 1.0 + Math.sin(t * 0.25) * 0.06;
          animPanX = Math.sin(t * 0.15) * 15;
          animPanY = Math.cos(t * 0.18) * 12;
          break;
        case 'Ethereal Horizon Drift':
          animPanX = Math.sin(t * 0.18) * 55;
          animPanY = Math.cos(t * 0.12) * 12;
          animRotY = Math.sin(t * 0.15) * 6;
          animZoom = 1.02 + Math.sin(t * 0.1) * 0.02;
          break;
        case 'Harmonic Pendulum Glide':
          animPanX = Math.sin(t * 0.28) * 38;
          animPanY = Math.abs(Math.sin(t * 0.28)) * 14;
          animRotY = Math.sin(t * 0.28) * 6;
          animRotX = Math.cos(t * 0.2) * 3;
          break;
        case 'Deep Spatial Float':
          animZoom = 1.0 + Math.sin(t * 0.2) * 0.08;
          animRotY = Math.sin(t * 0.22) * 10;
          animRotX = Math.cos(t * 0.18) * 6;
          animPanX = Math.sin(t * 0.2) * 25;
          animPanY = Math.cos(t * 0.22) * 15;
          break;
      }

      // Apply Matrix Transformation to the World Stage
      const finalPanX = settings.panX + animPanX;
      const finalPanY = settings.panY + animPanY;
      const finalZoom = settings.zoom * animZoom;
      const finalRotX = settings.rotX + animRotX;
      const finalRotY = settings.rotY + animRotY;

      stage.style.transform = `translate3d(${finalPanX.toFixed(2)}px, ${finalPanY.toFixed(2)}px, 0) scale(${finalZoom.toFixed(4)}) rotateX(${finalRotX.toFixed(2)}deg) rotateY(${finalRotY.toFixed(2)}deg)`;

      // Render Three.js Elements
      if (renderer && threeScene && threeCamera) {
        const isGreen = settings.greenScreen;
        if (particlePoints) {
          particlePoints.visible = !isGreen;
          particlePoints.rotation.y = animTime * 0.03;
          particlePoints.rotation.x = animTime * 0.015;
        }
        if (crystalGroup) {
          crystalGroup.visible = !isGreen;
          crystalGroup.rotation.y = -animTime * 0.02;
          crystalGroup.children.forEach((c, idx) => {
            c.rotation.x += 0.01;
            c.rotation.y += 0.015;
          });
        }
        renderer.render(threeScene, threeCamera);
      }
    }

    // Bootstrap Visual Pipeline
    updateCSSVariables();
    renderLoop();
  </script>
</body>
</html>
