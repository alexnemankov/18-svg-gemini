    // --- SETUP SCENE, RENDERER, CAMERA & POSTPROCESSING COMPOSER ---

    scene.fog = new THREE.FogExp2(params.bgColor, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 350);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI * 0.485;
    controls.minDistance = 6;
    controls.maxDistance = 160;
    controls.target.set(0, 2.5, 0);

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      params.bloomStrength,
      params.bloomRadius,
      params.bloomThreshold
    );
    let composer = new EffectComposer(renderer);

    composer.addPass(bloomPass);

    // --- SCENE LIGHTS ---
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(params.keyColor, params.keyIntensity);
    keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0003;
    const shadowD = 40;
    keyLight.shadow.camera.left = -shadowD;
    keyLight.shadow.camera.right = shadowD;
    keyLight.shadow.camera.top = shadowD;
    keyLight.shadow.camera.bottom = -shadowD;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 160;
    scene.add(keyLight);

    const coreRingLight = new THREE.PointLight(params.coreRingColor, params.coreRingIntensity, 70, 1.2);
    coreRingLight.position.set(0, 4.5, 0);
    scene.add(coreRingLight);

    // --- PROCEDURAL GLSL SHADERS ---

    // 1. Procedural Sci-Fi Cyber Grid Floor Shader
    const floorShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(COLOR_SCHEMES[params.colorScheme].bg) },
        uGridColor: { value: new THREE.Color(COLOR_SCHEMES[params.colorScheme].grid) },
        uWaveColor: { value: new THREE.Color(COLOR_SCHEMES[params.colorScheme].wave) },
        uTime: { value: 0.0 },
        uRadius: { value: params.ringRadius },
        uGreenscreen: { value: 0.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldPos;
        void main() {
          vUv = uv;
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform vec3 uColor;
        uniform vec3 uGridColor;
        uniform vec3 uWaveColor;
        uniform float uTime;
        uniform float uRadius;
        uniform float uGreenscreen;
        varying vec2 vUv;
        varying vec3 vWorldPos;

        void main() {
          if (uGreenscreen > 0.5) {
            gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
            return;
          }
          vec2 pos = vWorldPos.xz;
          float d = length(pos);

          // Radial falloff fade at edge
          float alpha = smoothstep(120.0, 15.0, d);

          // Concentric circular circuit lines
          float ringSpacing = 2.0;
          float ringDist = abs(fract(d / ringSpacing + 0.5) - 0.5) * ringSpacing;
          float ring = smoothstep(0.12, 0.0, ringDist);

          // Major landmark rings
          float ringCore = smoothstep(0.3, 0.0, abs(d - 6.5));
          float ringPri = smoothstep(0.4, 0.0, abs(d - 22.8));
          float ringSec = smoothstep(0.3, 0.0, abs(d - 21.2));
          float ringOuter = smoothstep(0.35, 0.0, abs(d - 32.0));

          // Radial spokes
          float angle = atan(pos.y, pos.x);
          float spokeSpacing = 3.14159265 / 16.0;
          float spokeAngle = abs(fract(angle / spokeSpacing + 0.5) - 0.5) * spokeSpacing * d;
          float spoke = smoothstep(0.12, 0.0, spokeAngle);

          // Cyber matrix grid
          vec2 gridUv = abs(fract(pos * 0.4) - 0.5);
          float gridLines = smoothstep(0.04, 0.0, min(gridUv.x, gridUv.y)) * 0.25;

          // Animated energy wave radiating from core
          float wave = sin(d * 0.4 - uTime * 2.2);
          wave = pow(max(0.0, wave), 8.0);

          vec3 finalColor = uColor;
          finalColor += uGridColor * (gridLines + ring * 0.25 + spoke * 0.25);
          finalColor += uWaveColor * (ringCore * 0.8 + ringPri * 0.9 + ringSec * 0.6 + ringOuter * 0.5);
          finalColor += uWaveColor * (wave * 0.6);

          gl_FragColor = vec4(finalColor, alpha);
        }
      `,
      transparent: true,
      depthWrite: false
    });

    // 2. High-Speed Optical Fiber Conduit Shader (Primary & Secondary Rings)
    function createConduitShader(baseColorHex, glowColorHex, isPrimary = true) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uBaseColor: { value: new THREE.Color(baseColorHex) },
          uGlowColor: { value: new THREE.Color(glowColorHex) },
          uTime: { value: 0.0 },
          uDirection: { value: 1.0 },
          uPulseIntensity: { value: isPrimary ? 3.0 : 1.8 }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          precision highp float;
          uniform vec3 uBaseColor;
          uniform vec3 uGlowColor;
          uniform float uTime;
          uniform float uDirection;
          uniform float uPulseIntensity;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPosition;

          void main() {
            // High-speed telemetry pulses rushing through the optical core
            float pulseA = sin(vUv.x * 60.0 - uTime * 18.0 * uDirection);
            pulseA = pow(max(0.0, pulseA), 6.0) * uPulseIntensity;

            float pulseB = sin(vUv.x * 160.0 - uTime * 32.0 * uDirection);
            pulseB = step(0.85, pulseB) * 1.5;

            // Fresnel rim glow
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 2.8);

            vec3 col = uBaseColor * 0.35 + uGlowColor * (fresnel * 1.6 + pulseA + pulseB);
            gl_FragColor = vec4(col, 1.0);
          }
        `,
        transparent: false
      });
    }

    // 3. Central Quantum Reactor Core Column Shader
    const reactorColumnShader = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(COLOR_SCHEMES[params.colorScheme].reactor) },
        uTime: { value: 0.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vViewPosition = -mvPosition.xyz;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform vec3 uColor;
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        void main() {
          float verticalFlow = sin(vUv.y * 30.0 - uTime * 5.0) * 0.5 + 0.5;
          float spiral = sin(vUv.x * 12.0 + vUv.y * 10.0 - uTime * 3.0) * 0.5 + 0.5;

          vec3 normal = normalize(vNormal);
          vec3 viewDir = normalize(vViewPosition);
          float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 1.8);

          vec3 col = uColor * (0.8 + verticalFlow * 0.6 + spiral * 0.5 + fresnel * 2.0);
          float alpha = clamp(fresnel * 0.8 + 0.3, 0.0, 1.0);
          gl_FragColor = vec4(col, alpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    // --- SCENE OBJECTS CONSTRUCTION ---
    const sceneGroup = new THREE.Group();
    scene.add(sceneGroup);

    let currentPalette = COLOR_SCHEMES[params.colorScheme];

    // Floor Mesh
    const floorGeo = new THREE.PlaneGeometry(240, 240);
    const floorMesh = new THREE.Mesh(floorGeo, floorShaderMaterial);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.y = -0.05;
    floorMesh.receiveShadow = true;
    sceneGroup.add(floorMesh);

    // Conduit materials
    let primaryConduitShader = createConduitShader(currentPalette.primaryRing, currentPalette.tokenCore, true);
    let secondaryConduitShader = createConduitShader(currentPalette.secondaryRing, currentPalette.secondaryRing, false);

    // Tower standard materials
    const towerMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(currentPalette.tower),
      roughness: 0.3,
      metalness: 0.85
    });

    const towerTrimMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(currentPalette.towerTrim),
      roughness: 0.2,
      metalness: 0.95
    });

    const beaconMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(currentPalette.primaryRing),
      emissive: new THREE.Color(currentPalette.primaryRing),
      emissiveIntensity: params.beaconIntensity,
      roughness: 0.1,
      metalness: 0.9
    });

    const loopbackActiveMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(currentPalette.accent),
      emissive: new THREE.Color(currentPalette.accent),
      emissiveIntensity: 3.5,
      roughness: 0.1,
      metalness: 0.9
    });

    // --- CENTRAL QUANTUM DATA REACTOR & RADIAL FIBER TRACES ---
    const centralReactorGroup = new THREE.Group();
    sceneGroup.add(centralReactorGroup);

    // Reactor Pedestal
    const baseCylGeo = new THREE.CylinderGeometry(5.2, 5.8, 1.2, 32);
    const baseCyl = new THREE.Mesh(baseCylGeo, towerTrimMat);
    baseCyl.position.y = 0.6;
    baseCyl.receiveShadow = true;
    centralReactorGroup.add(baseCyl);

    const stepCylGeo = new THREE.CylinderGeometry(4.2, 4.8, 0.6, 32);
    const stepCyl = new THREE.Mesh(stepCylGeo, towerMat);
    stepCyl.position.y = 1.4;
    centralReactorGroup.add(stepCyl);

    // Luminous Energy Column
    const columnGeo = new THREE.CylinderGeometry(1.4, 1.4, 7.5, 32, 1, true);
    const columnMesh = new THREE.Mesh(columnGeo, reactorColumnShader);
    columnMesh.position.y = 5.2;
    centralReactorGroup.add(columnMesh);

    // Inner Glowing Core Orb
    const coreOrbGeo = new THREE.IcosahedronGeometry(1.6, 2);
    const coreOrbMat = new THREE.MeshStandardMaterial({

    });
    const coreOrb = new THREE.Mesh(coreOrbGeo, coreOrbMat);
    coreOrb.position.y = 5.2;
    centralReactorGroup.add(coreOrb);

    // Rotating Holographic Gyro Rings around Reactor
    const reactorGyroRings = [];
    const gyroRadii = [2.6, 3.3, 4.0];
    gyroRadii.forEach((r, idx) => {
      const ringGeo = new THREE.TorusGeometry(r, 0.05, 8, 48);
      const ringMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(currentPalette.primaryRing),
        wireframe: true,
        transparent: true,
        opacity: 0.75
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.position.y = 5.2;
      ringMesh.rotation.x = Math.PI / (idx + 2);
      centralReactorGroup.add(ringMesh);
      reactorGyroRings.push(ringMesh);
    });

    // 16 Radial Optical Laser Traces from Central Reactor to each Tower
    const radialLinesGroup = new THREE.Group();
    sceneGroup.add(radialLinesGroup);

    const radialPacketCount = 16;
    const radialPacketGeo = new THREE.SphereGeometry(0.2, 8, 8);
    const radialPacketMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(currentPalette.primaryRing)
    });
    const radialPacketInstanced = new THREE.InstancedMesh(radialPacketGeo, radialPacketMat, radialPacketCount);
    sceneGroup.add(radialPacketInstanced);

    function buildRadialConduits() {
      while (radialLinesGroup.children.length > 0) {
        const obj = radialLinesGroup.children[0];
        radialLinesGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }
      const N = params.towerCount;
      const R = params.ringRadius;
      const pts = [];
      for (let i = 0; i < N; i++) {
        const angle = (i / N) * Math.PI * 2;
        const x1 = Math.cos(angle) * 4.5;
        const z1 = Math.sin(angle) * 4.5;
        const x2 = Math.cos(angle) * (R - 1.2);
        const z2 = Math.sin(angle) * (R - 1.2);
        pts.push(new THREE.Vector3(x1, 0.05, z1));
        pts.push(new THREE.Vector3(x2, 0.05, z2));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const lineMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(currentPalette.primaryRing),
        transparent: true,
        opacity: 0.5
      });
      const lines = new THREE.LineSegments(geo, lineMat);
      radialLinesGroup.add(lines);
    }
    buildRadialConduits();

    // --- DETAILED MONOLITHIC SERVER TOWERS & SEGMENTED CONDUIT RINGS ---
    const towers = [];
    const primaryLinkSegments = [];
    const secondaryLinkSegments = [];
    const primaryRadius = 22.8;
    const secondaryRadius = 21.2;
    const primaryHeight = 3.6;
    const secondaryHeight = 2.4;

    const topologyGroup = new THREE.Group();
    sceneGroup.add(topologyGroup);

    // Instanced High-Density Server Chassis Status LEDs
    const ledsPerTower = 24;
    const totalLEDs = params.towerCount * ledsPerTower;
    const ledGeo = new THREE.BoxGeometry(0.08, 0.035, 0.03);
    const ledMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const ledInstancedMesh = new THREE.InstancedMesh(ledGeo, ledMat, totalLEDs);
    topologyGroup.add(ledInstancedMesh);

    const dummyMatrix = new THREE.Matrix4();
    const tempColor = new THREE.Color();
    const ledPhases = new Float32Array(totalLEDs);

    // Holographic Node Floating Badges
    const badgeRings = [];

    function buildTopology() {
      // Clear previous elements
      towers.forEach(t => topologyGroup.remove(t.group));
      towers.length = 0;
      primaryLinkSegments.forEach(s => topologyGroup.remove(s));
      primaryLinkSegments.length = 0;
      secondaryLinkSegments.forEach(s => topologyGroup.remove(s));
      secondaryLinkSegments.length = 0;
      badgeRings.length = 0;

      const N = params.towerCount;
      const R = params.ringRadius;

      let ledIndex = 0;

      for (let i = 0; i < N; i++) {
        const angle = (i / N) * Math.PI * 2;
        const tx = Math.cos(angle) * R;
        const tz = Math.sin(angle) * R;

        const towerGroup = new THREE.Group();
        towerGroup.position.set(tx, 0, tz);
        towerGroup.rotation.y = -angle + Math.PI / 2; // Face inward

        // 1. Base Anchoring Pedestal
        const footGeo = new THREE.BoxGeometry(3.2, 0.5, 2.4);
        const foot = new THREE.Mesh(footGeo, towerTrimMat);
        foot.position.y = 0.25;
        foot.castShadow = true;
        foot.receiveShadow = true;
        towerGroup.add(foot);

        // 2. Main Tower Monolith Body
        const bodyGeo = new THREE.BoxGeometry(2.4, 9.8, 1.8);
        const body = new THREE.Mesh(bodyGeo, towerMat);
        body.position.y = 5.15;
        body.castShadow = true;
        body.receiveShadow = true;
        towerGroup.add(body);

        // 3. Vertical Corner Heat Sinks / Armor Plates
        const armorGeo = new THREE.BoxGeometry(0.3, 9.9, 0.3);
        [
          [-1.1, 5.15, -0.8],
          [1.1, 5.15, -0.8],
          [-1.1, 5.15, 0.8],
          [1.1, 5.15, 0.8]
        ].forEach(pos => {
          const armor = new THREE.Mesh(armorGeo, towerTrimMat);
          armor.position.set(pos[0], pos[1], pos[2]);
          towerGroup.add(armor);
        });

        // 4. Vertical Glowing Emissive Spine Lines (Back & Sides)
        const spineGeo = new THREE.BoxGeometry(0.06, 9.5, 0.04);
        const spineMat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(currentPalette.primaryRing),
          emissive: new THREE.Color(currentPalette.primaryRing),
          emissiveIntensity: 2.0
        });
        const spineBack = new THREE.Mesh(spineGeo, spineMat);
        spineBack.position.set(0, 5.15, -0.92);
        towerGroup.add(spineBack);

        // 5. Server Blade Chassis Insets & High-Density LED Matrix
        for (let bayIdx = 0; bayIdx < 4; bayIdx++) {
          const bayY = 2.4 + bayIdx * 2.0;

          // Recessed chassis bay
          const bayGeo = new THREE.BoxGeometry(1.85, 1.5, 0.15);
          const bayMat = new THREE.MeshStandardMaterial({
            color: 0x05070c,
            roughness: 0.9,
            metalness: 0.1
          });
          const bay = new THREE.Mesh(bayGeo, bayMat);
          bay.position.set(0, bayY, 0.88);
          towerGroup.add(bay);

          // Heat sink ventilation slot with subtle emissive glow
          const ventGeo = new THREE.BoxGeometry(1.6, 0.15, 0.05);
          const ventMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(currentPalette.primaryRing),
            emissive: new THREE.Color(currentPalette.primaryRing),
            emissiveIntensity: 0.6
          });
          const vent = new THREE.Mesh(ventGeo, ventMat);
          vent.position.set(0, bayY - 0.55, 0.95);
          towerGroup.add(vent);

          // Status LEDs (6 per bay -> 24 per tower)
          for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 2; col++) {
              const lx = (col - 0.5) * 1.35;
              const ly = bayY - 0.2 + row * 0.35;
              const lz = 0.97;

              const localPos = new THREE.Vector3(lx, ly, lz);
              localPos.applyEuler(towerGroup.rotation);
              localPos.add(towerGroup.position);

              dummyMatrix.makeRotationFromEuler(towerGroup.rotation);
              dummyMatrix.setPosition(localPos);
              ledInstancedMesh.setMatrixAt(ledIndex, dummyMatrix);

              ledPhases[ledIndex] = Math.random() * Math.PI * 2;
              tempColor.set(currentPalette.ledNormal);
              ledInstancedMesh.setColorAt(ledIndex, tempColor);
              ledIndex++;
            }
          }
        }

        // 6. Top Holographic Transmission Emitter Crown
        const crownGeo = new THREE.CylinderGeometry(0.7, 0.9, 0.6, 12);
        const crown = new THREE.Mesh(crownGeo, towerTrimMat);
        crown.position.y = 10.35;
        crown.castShadow = true;
        towerGroup.add(crown);

        const beaconSphereGeo = new THREE.SphereGeometry(0.42, 16, 16);
        const beacon = new THREE.Mesh(beaconSphereGeo, beaconMat);
        beacon.position.y = 10.95;
        towerGroup.add(beacon);

        // Floating Holographic Node Ring above Tower
        const badgeGeo = new THREE.TorusGeometry(0.85, 0.035, 8, 32);
        const badgeMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(currentPalette.primaryRing),
          wireframe: true,
          transparent: true,
          opacity: 0.8
        });
        const badge = new THREE.Mesh(badgeGeo, badgeMat);
        badge.position.y = 12.0;
        badge.rotation.x = Math.PI / 2;
        towerGroup.add(badge);
        badgeRings.push(badge);

        // 7. Internal Loopback Cross-Connect Bridge Conduit
        const bridgeGeo = new THREE.CylinderGeometry(0.14, 0.14, 2.2, 12);
        const bridge = new THREE.Mesh(bridgeGeo, secondaryConduitShader);
        bridge.rotation.x = Math.PI / 2;
        bridge.position.set(0, 3.0, 0);
        towerGroup.add(bridge);

        topologyGroup.add(towerGroup);

        towers.push({
          id: i,
          angle,
          group: towerGroup,
          beacon,
          badge,
          bridge,
          isLoopbackActive: false
        });
      }

      ledInstancedMesh.instanceMatrix.needsUpdate = true;
      if (ledInstancedMesh.instanceColor) ledInstancedMesh.instanceColor.needsUpdate = true;

      // Build Segmented Links between Tower i and Tower i+1
      for (let i = 0; i < N; i++) {
        const next = (i + 1) % N;
        const angleA = towers[i].angle;
        let angleB = towers[next].angle;
        if (angleB < angleA) angleB += Math.PI * 2;

        const priPts = [];
        const secPts = [];
        const segSteps = 20;

        for (let s = 0; s <= segSteps; s++) {
          const t = s / segSteps;
          const a = angleA + (angleB - angleA) * t;
          priPts.push(new THREE.Vector3(Math.cos(a) * primaryRadius, primaryHeight, Math.sin(a) * primaryRadius));
          secPts.push(new THREE.Vector3(Math.cos(a) * secondaryRadius, secondaryHeight, Math.sin(a) * secondaryRadius));
        }

        const priCurve = new THREE.CatmullRomCurve3(priPts);
        const priGeo = new THREE.TubeGeometry(priCurve, 20, 0.16, 12, false);
        const priMesh = new THREE.Mesh(priGeo, primaryConduitShader);
        priMesh.castShadow = true;
        topologyGroup.add(priMesh);
        primaryLinkSegments.push(priMesh);

        const secCurve = new THREE.CatmullRomCurve3(secPts);
        const secGeo = new THREE.TubeGeometry(secCurve, 20, 0.13, 10, false);
        const secMesh = new THREE.Mesh(secGeo, secondaryConduitShader);
        secMesh.castShadow = true;
        topologyGroup.add(secMesh);
        secondaryLinkSegments.push(secMesh);
      }
    }
    buildTopology();

    // --- PROCEDURAL CRACKLING LIGHTNING & VOLUMETRIC SPARK EMITTER (SEVERED LINK) ---
    const sparkCount = 120;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    const sparkVels = [];
    const sparkLifes = new Float32Array(sparkCount);

    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] = 0;
      sparkPos[i * 3 + 1] = -100;
      sparkPos[i * 3 + 2] = 0;
      sparkVels.push(new THREE.Vector3(0, 0, 0));
      sparkLifes[i] = Math.random();
    }
    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
    const sparkMat = new THREE.PointsMaterial({
      color: 0xff3355,
      size: 0.45,
      transparent: true,
      blending: THREE.AdditiveBlending
    });
    const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
    sceneGroup.add(sparkPoints);

    // Multi-branching crackling electric arc
    const arcBranches = 3;
    const arcPtsPerBranch = 16;
    const totalArcPts = arcBranches * arcPtsPerBranch;
    const arcPos = new Float32Array(totalArcPts * 3);
    const arcGeo = new THREE.BufferGeometry();
    arcGeo.setAttribute('position', new THREE.BufferAttribute(arcPos, 3));
    const arcMat = new THREE.LineBasicMaterial({
      color: 0xff3366,
      transparent: true,
      opacity: 0.95
    });
    const electricArc = new THREE.LineSegments(arcGeo, arcMat);
    electricArc.visible = false;
    sceneGroup.add(electricArc);

    // Dynamic Point Light at the Severance Breach
    const breachLight = new THREE.PointLight(0xff2244, 0, 15, 2.0);
    sceneGroup.add(breachLight);

    // --- DATA TOKEN: QUANTUM MULTI-LAYER ENERGY MATRIX ---
    const tokenGroup = new THREE.Group();
    sceneGroup.add(tokenGroup);

    // 1. Central Core: Dual nested spinning icosahedrons
    const tokenCoreGeo = new THREE.IcosahedronGeometry(0.85, 2);
    const tokenCoreMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(currentPalette.tokenCore),
      emissive: new THREE.Color(currentPalette.tokenCore),
      emissiveIntensity: 4.5,
      roughness: 0.1,
      metalness: 0.9
    });
    const tokenCoreMesh = new THREE.Mesh(tokenCoreGeo, tokenCoreMat);
    tokenGroup.add(tokenCoreMesh);

    // 2. Gyroscope Outer Armatures
    const gyroRingGeoA = new THREE.TorusGeometry(1.25, 0.06, 8, 36);
    const gyroMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(currentPalette.primaryRing),
      wireframe: true
    });
    const gyroRingA = new THREE.Mesh(gyroRingGeoA, gyroMat);
    tokenGroup.add(gyroRingA);

    const gyroRingGeoB = new THREE.TorusGeometry(1.5, 0.05, 8, 36);
    const gyroRingB = new THREE.Mesh(gyroRingGeoB, gyroMat);
    tokenGroup.add(gyroRingB);

    // 3. Dynamic Token Point Light
    const tokenLight = new THREE.PointLight(
      params.tokenLightColor,
      params.tokenLightIntensity,
      25,
      1.4
    );
    tokenGroup.add(tokenLight);

    // 4. Trailing Data Ribbon Particles
    const trailCount = 48;
    const trailGeo = new THREE.SphereGeometry(0.16, 8, 8);
    const trailMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(currentPalette.tokenCore),
      transparent: true,
      opacity: 0.85
    });
    const trailInstanced = new THREE.InstancedMesh(trailGeo, trailMat, trailCount);
    sceneGroup.add(trailInstanced);

    const trailHistory = [];
    for (let i = 0; i < trailCount; i++) {
      trailHistory.push(new THREE.Vector3(0, -100, 0));
    }

    // 5. Secondary Stream Packets in Circuit Formation
    const streamPacketCount = 16;
    const packetGeo = new THREE.SphereGeometry(0.24, 8, 8);
    const packetMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(currentPalette.primaryRing),
      emissive: new THREE.Color(currentPalette.primaryRing),
      emissiveIntensity: 2.8,
      roughness: 0.2
    });
    const packetInstanced = new THREE.InstancedMesh(packetGeo, packetMat, streamPacketCount);
    sceneGroup.add(packetInstanced);

    // Simulation Flow State
    let tokenProgress = 0;
    let tokenFlowDirection = 1; // 1 = Clockwise, -1 = Counter-Clockwise
    let autoFaultTimer = 0;

    // --- FAULT-TOLERANCE SEVERANCE LOGIC ---
    function setSeveredLink(linkIdx) {
      params.severedLink = linkIdx;
      const N = params.towerCount;

      for (let i = 0; i < N; i++) {
        primaryLinkSegments[i].visible = (i !== linkIdx);
      }

      towers.forEach(t => {
        t.isLoopbackActive = false;
        t.bridge.material = secondaryConduitShader;
        t.beacon.material = beaconMat;
        t.badge.material.color.set(currentPalette.primaryRing);
      });

      if (linkIdx >= 0 && linkIdx < N) {
        const towerA = towers[linkIdx];
        const towerB = towers[(linkIdx + 1) % N];

        towerA.isLoopbackActive = true;
        towerB.isLoopbackActive = true;

        towerA.bridge.material = loopbackActiveMat;
        towerB.bridge.material = loopbackActiveMat;
        towerA.beacon.material = loopbackActiveMat;
        towerB.beacon.material = loopbackActiveMat;
        towerA.badge.material.color.set(currentPalette.accent);
        towerB.badge.material.color.set(currentPalette.accent);

        // INSTANT REVERSE FLOW UPON INDUCED LINK SEVERANCE
        if (params.flowMode === 'Auto Failover') {
          tokenFlowDirection *= -1; // Reverse stream flow instantly!
          gsap.fromTo(renderer,
            { toneMappingExposure: params.exposure * 1.7 },
            { toneMappingExposure: params.exposure, duration: 0.5, ease: 'power2.out' }
          );
        }

        electricArc.visible = true;
        breachLight.intensity = 4.0;
        breachLight.color.set(currentPalette.accent);
      } else {
        electricArc.visible = false;
        breachLight.intensity = 0.0;
      }

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function severRandomLink() {
      const randIdx = Math.floor(Math.random() * params.towerCount);
      setSeveredLink(randIdx);
    }

    function repairAllLinks() {
      setSeveredLink(-1);
    }

    // --- COLOR PALETTE SWITCHER ---
    function applyColorScheme(name) {
      if (!COLOR_SCHEMES[name]) return;
      params.colorScheme = name;
      currentPalette = COLOR_SCHEMES[name];

      if (!params.greenscreen) {
        gsap.to(scene.background, {
          r: new THREE.Color(currentPalette.bg).r,
          g: new THREE.Color(currentPalette.bg).g,
          b: new THREE.Color(currentPalette.bg).b,
          duration: 0.8
        });
        gsap.to(scene.fog.color, {
          r: new THREE.Color(currentPalette.bg).r,
          g: new THREE.Color(currentPalette.bg).g,
          b: new THREE.Color(currentPalette.bg).b,
          duration: 0.8
        });
      }

      // Shaders uniforms
      floorShaderMaterial.uniforms.uColor.value.set(currentPalette.bg);
      floorShaderMaterial.uniforms.uGridColor.value.set(currentPalette.grid);
      floorShaderMaterial.uniforms.uWaveColor.value.set(currentPalette.wave);

      primaryConduitShader.uniforms.uBaseColor.value.set(currentPalette.primaryRing);
      primaryConduitShader.uniforms.uGlowColor.value.set(currentPalette.tokenCore);

      secondaryConduitShader.uniforms.uBaseColor.value.set(currentPalette.secondaryRing);
      secondaryConduitShader.uniforms.uGlowColor.value.set(currentPalette.secondaryRing);

      reactorColumnShader.uniforms.uColor.value.set(currentPalette.reactor);

      // Central Reactor
      coreOrbMat.color.set(currentPalette.reactor);
      coreOrbMat.emissive.set(currentPalette.reactor);
      reactorGyroRings.forEach(r => r.material.color.set(currentPalette.primaryRing));
      radialPacketMat.color.set(currentPalette.primaryRing);
      buildRadialConduits();

      // Towers materials
      towerMat.color.set(currentPalette.tower);
      towerTrimMat.color.set(currentPalette.towerTrim);

      beaconMat.color.set(currentPalette.primaryRing);
      beaconMat.emissive.set(currentPalette.primaryRing);

      loopbackActiveMat.color.set(currentPalette.accent);
      loopbackActiveMat.emissive.set(currentPalette.accent);

      towers.forEach(t => {
        t.badge.material.color.set(t.isLoopbackActive ? currentPalette.accent : currentPalette.primaryRing);
      });

      // Token
      tokenCoreMat.color.set(currentPalette.tokenCore);
      tokenCoreMat.emissive.set(currentPalette.tokenCore);
      gyroMat.color.set(currentPalette.primaryRing);
      trailMat.color.set(currentPalette.tokenCore);
      packetMat.color.set(currentPalette.primaryRing);
      packetMat.emissive.set(currentPalette.primaryRing);

      // Lights
      ambientLight.color.set(currentPalette.ambient);
      keyLight.color.set(currentPalette.keyLight);
      coreRingLight.color.set(currentPalette.primaryRing);
      tokenLight.color.set(currentPalette.tokenCore);
      sparkMat.color.set(currentPalette.accent);
      arcMat.color.set(currentPalette.accent);

      // Re-tint LEDs
      for (let i = 0; i < totalLEDs; i++) {
        tempColor.set(currentPalette.ledNormal);
        ledInstancedMesh.setColorAt(i, tempColor);
      }
      if (ledInstancedMesh.instanceColor) ledInstancedMesh.instanceColor.needsUpdate = true;
    }

    // --- PROCEDURAL RE-ROLL (ON CANVAS CLICK) ---
    function triggerProceduralVariation() {
      const keys = Object.keys(COLOR_SCHEMES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randomKey);

      params.animSpeed = THREE.MathUtils.randFloat(0.6, 2.2);
      params.tokenSpeed = THREE.MathUtils.randFloat(0.7, 2.4);
      params.exposure = THREE.MathUtils.randFloat(0.9, 1.4);
      renderer.toneMappingExposure = params.exposure;

      params.keyPosX = THREE.MathUtils.randFloat(-45, 45);
      params.keyPosY = THREE.MathUtils.randFloat(30, 65);
      params.keyPosZ = THREE.MathUtils.randFloat(-45, 45);
      keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);

      if (Math.random() > 0.45) {
        severRandomLink();
      } else {
        repairAllLinks();
      }

      gsap.fromTo(tokenGroup.scale,
        { x: 1.7, y: 1.7, z: 1.7 },
        { x: 1.0, y: 1.0, z: 1.0, duration: 0.5, ease: 'back.out(2)' }
      );

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // Differentiate clean click from orbit/pan drag
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    canvas.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    canvas.addEventListener('pointerup', (e) => {
      const dt = performance.now() - pointerDownTime;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dt < 300 && dist < 6) {
        if (params.clickToRandomize) {
          triggerProceduralVariation();
        }
      }
    });

    // --- ANTIALIAS RE-INITIALIZER ---
    function setAntialias(enabled) {
      params.antialias = enabled;
      const oldCanvas = renderer.domElement;
      const newRenderer = new THREE.WebGLRenderer({
        antialias: enabled,
        powerPreference: 'high-performance'
      });
      newRenderer.setSize(window.innerWidth, window.innerHeight);
      newRenderer.setPixelRatio(params.dpr);
      newRenderer.toneMapping = THREE.ACESFilmicToneMapping;
      newRenderer.toneMappingExposure = params.exposure;
      newRenderer.shadowMap.enabled = true;
      newRenderer.shadowMap.type = THREE.PCFSoftShadowMap;

      oldCanvas.parentElement.replaceChild(newRenderer.domElement, oldCanvas);
      renderer.dispose();
      renderer = newRenderer;
      controls.domElement = newRenderer.domElement;

      // Re-create composer for new renderer
      composer = new EffectComposer(newRenderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);
    }

    // --- CAMERA PRESET ANIMATION ENGINE (PRESERVING USER WHEEL ZOOM & ANGLE FREEDOM) ---
    const camOffset = new THREE.Vector3();
    const camSpherical = new THREE.Spherical();
    let animClockTime = 0;

    function updateCameraAnimation(delta) {
      if (params.cameraAnimation === 'Static Overview') {
        return; // Full manual orbit / zoom / pan
      }

      animClockTime += delta * params.cameraSpeed * params.animSpeed;

      // Extract current user distance & angles relative to target
      camOffset.copy(camera.position).sub(controls.target);
      const userRadius = camOffset.length(); // User's active zoom level (NEVER overwritten!)
      camSpherical.setFromVector3(camOffset);

      switch (params.cameraAnimation) {
        case 'Slow Orbit Sweep': {
          camSpherical.theta += delta * 0.18 * params.cameraSpeed * params.animSpeed;
          break;
        }

        case 'Token Chase Cam': {
          controls.target.lerp(tokenGroup.position, 0.04);
          camSpherical.theta += delta * 0.12 * params.cameraSpeed * params.animSpeed;
          break;
        }

        case 'Drone Overhead Surveillance': {
          const targetPhi = Math.PI * 0.22;
          camSpherical.phi = THREE.MathUtils.lerp(camSpherical.phi, targetPhi, 0.02);
          camSpherical.theta += delta * 0.08 * params.cameraSpeed * params.animSpeed;
          break;
        }

        case 'Low-Angle Monolith Flyby': {
          const targetPhi = Math.PI * 0.44;
          camSpherical.phi = THREE.MathUtils.lerp(camSpherical.phi, targetPhi, 0.02);
          camSpherical.theta += delta * 0.14 * params.cameraSpeed * params.animSpeed;
          break;
        }

        case 'Breathing Ring Elevation': {
          const bobPhi = Math.PI * 0.35 + Math.sin(animClockTime * 0.6) * 0.08;
          camSpherical.phi = THREE.MathUtils.lerp(camSpherical.phi, bobPhi, 0.04);
          camSpherical.theta += delta * 0.1 * params.cameraSpeed * params.animSpeed;
          break;
        }

        case 'Server Rack Spiral': {
          const spiralPhi = Math.PI * 0.36 + Math.cos(animClockTime * 0.8) * 0.1;
          camSpherical.phi = THREE.MathUtils.lerp(camSpherical.phi, spiralPhi, 0.03);
          camSpherical.theta += delta * 0.22 * params.cameraSpeed * params.animSpeed;
          break;
        }

        case 'Fault Incident Inspection': {
          const N = params.towerCount;
          let focusIdx = params.severedLink >= 0 ? params.severedLink : 0;
          const focusPos = towers[focusIdx].group.position.clone();
          focusPos.y = 5.2;
          controls.target.lerp(focusPos, 0.03);
          camSpherical.theta += delta * 0.09 * params.cameraSpeed * params.animSpeed;
          break;
        }
      }

      // CRITICAL: userRadius is strictly preserved! User wheel zoom is never overridden!
      camSpherical.radius = userRadius;
      camOffset.setFromSpherical(camSpherical);
      camera.position.copy(controls.target).add(camOffset);
    }

    // --- EVALUATE TOKEN RING PATH & LOOPBACK DETOUR ---
    function evaluateLoopPosition(progress, outPos) {
      const N = params.towerCount;
      const normProgress = ((progress % N) + N) % N;
      const currentSegment = Math.floor(normProgress);
      const t = normProgress - currentSegment;

      const isSevered = (params.severedLink >= 0 && currentSegment === params.severedLink);

      let rad = primaryRadius;
      let alt = primaryHeight;

      if (isSevered) {
        // Redundant loopback detour down to secondary loop
        rad = THREE.MathUtils.lerp(primaryRadius, secondaryRadius, Math.sin(t * Math.PI));
        alt = THREE.MathUtils.lerp(primaryHeight, secondaryHeight, Math.sin(t * Math.PI));
      }

      const angle = (normProgress / N) * Math.PI * 2;
      outPos.set(Math.cos(angle) * rad, alt, Math.sin(angle) * rad);
    }

    // --- LIL-GUI INITIALIZATION ---
    let gui = new GUI({ title: 'Ring Topology Controls' });

    // 1. Display & Aesthetics Folder
    const fDisplay = gui.addFolder('Display & Aesthetics');
    fDisplay.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => applyColorScheme(v));
    fDisplay.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(v => {
      floorShaderMaterial.uniforms.uGreenscreen.value = v ? 1.0 : 0.0;
      if (v) {
        scene.background = new THREE.Color(0x00ff00);
        scene.fog.color = new THREE.Color(0x00ff00);
        bloomPass.strength = 0.2; // Dim bloom bleed on greenscreen
      } else {
        scene.background = new THREE.Color(params.bgColor);
        scene.fog.color = new THREE.Color(params.bgColor);
        bloomPass.strength = params.bloomStrength;
      }
    });
    fDisplay.addColor(params, 'bgColor').name('Background Color').onChange(v => {
      if (!params.greenscreen) {
        scene.background.set(v);
        scene.fog.color.set(v);
        floorShaderMaterial.uniforms.uColor.value.set(v);
      }
    });
    fDisplay.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => {
      renderer.setPixelRatio(v);
      composer.setPixelRatio(v);
    });
    fDisplay.add(params, 'antialias').name('Antialias (Scene)').onChange(v => setAntialias(v));
    fDisplay.add(params, 'exposure', 0.1, 3.0, 0.05).name('Tone Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    fDisplay.add(params, 'bloomStrength', 0.0, 4.0, 0.1).name('Bloom Glow Intensity').onChange(v => {
      if (!params.greenscreen) bloomPass.strength = v;
    });

    // 2. Camera & Animation Folder
    const fCamera = gui.addFolder('Camera & Animation');
    fCamera.add(params, 'cameraAnimation', [
      'Static Overview',
      'Slow Orbit Sweep',
      'Token Chase Cam',
      'Drone Overhead Surveillance',
      'Low-Angle Monolith Flyby',
      'Breathing Ring Elevation',
      'Server Rack Spiral',
      'Fault Incident Inspection'
    ]).name('Camera Preset');
    fCamera.add(params, 'animSpeed', 0.1, 3.0, 0.1).name('Animation Speed');
    fCamera.add(params, 'cameraSpeed', 0.1, 3.0, 0.1).name('Camera Drift Speed');

    // 3. Topology & Failover Simulation Folder
    const fTopology = gui.addFolder('Topology & Failover');
    fTopology.add(params, 'severedLink', -1, params.towerCount - 1, 1).name('Severed Link ID (-1=None)').listen().onChange(v => setSeveredLink(v));
    fTopology.add(params, 'severRandom').name('⚡ Sever Random Link');
    fTopology.add(params, 'repairAll').name('✔ Repair All Links');
    fTopology.add(params, 'autoFaultCycle').name('Auto-Fault Cycle').listen();
    fTopology.add(params, 'flowMode', ['Auto Failover', 'Force Clockwise', 'Force Counter-CW']).name('Data Flow Direction').onChange(v => {
      if (v === 'Force Clockwise') tokenFlowDirection = 1;
      else if (v === 'Force Counter-CW') tokenFlowDirection = -1;
    });
    fTopology.add(params, 'tokenSpeed', 0.2, 4.0, 0.1).name('Token Speed');
    fTopology.add(params, 'clickToRandomize').name('Click Scene: Re-Roll');

    // 4. Lighting Sources Folder
    const fLighting = gui.addFolder('Lighting Sources');
    fLighting.add(params, 'ambientIntensity', 0.0, 3.0, 0.1).name('Ambient Intensity').onChange(v => ambientLight.intensity = v);
    fLighting.addColor(params, 'ambientColor').name('Ambient Color').onChange(v => ambientLight.color.set(v));
    fLighting.add(params, 'keyIntensity', 0.0, 5.0, 0.1).name('Key Light Intensity').onChange(v => keyLight.intensity = v);
    fLighting.addColor(params, 'keyColor').name('Key Light Color').onChange(v => keyLight.color.set(v));
    fLighting.add(params, 'keyPosX', -60, 60, 1).name('Key Pos X').onChange(v => keyLight.position.x = v);
    fLighting.add(params, 'keyPosY', 10, 80, 1).name('Key Pos Y').onChange(v => keyLight.position.y = v);
    fLighting.add(params, 'keyPosZ', -60, 60, 1).name('Key Pos Z').onChange(v => keyLight.position.z = v);
    fLighting.add(params, 'coreRingIntensity', 0.0, 6.0, 0.1).name('Core Ring Light Int').onChange(v => coreRingLight.intensity = v);
    fLighting.addColor(params, 'coreRingColor').name('Core Ring Color').onChange(v => coreRingLight.color.set(v));
    fLighting.add(params, 'tokenLightIntensity', 0.0, 10.0, 0.1).name('Token Light Intensity').onChange(v => tokenLight.intensity = v);
    fLighting.addColor(params, 'tokenLightColor').name('Token Light Color').onChange(v => tokenLight.color.set(v));
    fLighting.add(params, 'beaconIntensity', 0.1, 5.0, 0.1).name('Beacon Glow Intensity').onChange(v => beaconMat.emissiveIntensity = v);

    // Toggle UI visibility with "H" key
    let uiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (uiVisible) {
          gui.hide();
          uiVisible = false;
        } else {
          gui.show();
          uiVisible = true;
        }
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- MAIN ANIMATION & RENDERING LOOP ---
    const clock = new THREE.Clock();
    const tempVec = new THREE.Vector3();
    const tempMatrix = new THREE.Matrix4();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsedTime = clock.getElapsedTime() * params.animSpeed;

      // 1. Shaders Uniforms Time Updates
      floorShaderMaterial.uniforms.uTime.value = elapsedTime;
      primaryConduitShader.uniforms.uTime.value = elapsedTime;
      primaryConduitShader.uniforms.uDirection.value = tokenFlowDirection;
      secondaryConduitShader.uniforms.uTime.value = elapsedTime;
      secondaryConduitShader.uniforms.uDirection.value = -tokenFlowDirection; // counter-rotating loop
      reactorColumnShader.uniforms.uTime.value = elapsedTime;

      // 2. Central Quantum Reactor Core Rotations
      coreOrb.rotation.y = elapsedTime * 1.5;
      coreOrb.rotation.x = elapsedTime * 0.8;
      reactorGyroRings[0].rotation.z = elapsedTime * 1.2;
      reactorGyroRings[1].rotation.x = -elapsedTime * 0.9;
      reactorGyroRings[2].rotation.y = elapsedTime * 1.4;

      // 3. Radial Conduit Data Pulses
      const N = params.towerCount;
      const R = params.ringRadius;
      for (let i = 0; i < radialPacketCount; i++) {
        const pulseT = ((elapsedTime * 0.8 + (i / radialPacketCount)) % 1.0);
        const curR = 4.5 + pulseT * (R - 5.7);
        const a = (i / radialPacketCount) * Math.PI * 2;
        tempMatrix.makeScale(0.6, 0.6, 0.6);
        tempMatrix.setPosition(Math.cos(a) * curR, 0.08, Math.sin(a) * curR);
        radialPacketInstanced.setMatrixAt(i, tempMatrix);
      }
      radialPacketInstanced.instanceMatrix.needsUpdate = true;

      // 4. Floating Holographic Node Badges above Towers
      badgeRings.forEach((b, idx) => {
        b.rotation.z = elapsedTime * 1.2 + idx;
      });

      // 5. Auto-Fault Cycle: periodic severance and repair simulation
      if (params.autoFaultCycle) {
        autoFaultTimer += delta * params.animSpeed;
        if (params.severedLink === -1 && autoFaultTimer > 8.0) {
          severRandomLink();
          autoFaultTimer = 0;
        } else if (params.severedLink >= 0 && autoFaultTimer > 5.0) {
          repairAllLinks();
          autoFaultTimer = 0;
        }
      }

      // 6. Token Motion & Flow Direction Handling
      let speedFactor = params.tokenSpeed * params.animSpeed;
      if (params.flowMode === 'Force Clockwise') tokenFlowDirection = 1;
      else if (params.flowMode === 'Force Counter-CW') tokenFlowDirection = -1;

      tokenProgress += delta * speedFactor * tokenFlowDirection;
      tokenProgress = ((tokenProgress % N) + N) % N;

      // Evaluate Token Position
      evaluateLoopPosition(tokenProgress, tempVec);
      tokenGroup.position.copy(tempVec);

      // Gyroscopic Ring Rotations
      gyroRingA.rotation.x = elapsedTime * 2.8;
      gyroRingA.rotation.y = elapsedTime * 2.0;
      gyroRingB.rotation.y = -elapsedTime * 2.5;
      gyroRingB.rotation.z = elapsedTime * 1.8;

      // Token Trail history update
      trailHistory.unshift(tempVec.clone());
      if (trailHistory.length > trailCount) trailHistory.pop();

      for (let i = 0; i < trailCount; i++) {
        if (trailHistory[i]) {
          const s = Math.max(0.08, (1.0 - (i / trailCount)) * 0.85);
          tempMatrix.makeScale(s, s, s);
          tempMatrix.setPosition(trailHistory[i]);
          trailInstanced.setMatrixAt(i, tempMatrix);
        }
      }
      trailInstanced.instanceMatrix.needsUpdate = true;

      // Auxiliary Data Packets circulating in formation
      for (let i = 0; i < streamPacketCount; i++) {
        const offsetProg = tokenProgress + (i + 1) * (N / (streamPacketCount + 2)) * tokenFlowDirection;
        evaluateLoopPosition(offsetProg, tempVec);
        tempMatrix.makeScale(0.85, 0.85, 0.85);
        tempMatrix.setPosition(tempVec);
        packetInstanced.setMatrixAt(i, tempMatrix);
      }
      packetInstanced.instanceMatrix.needsUpdate = true;

      // 7. Server Tower LED telemetry activity blinking
      for (let i = 0; i < totalLEDs; i++) {
        ledPhases[i] += delta * 14.0;
        const blink = Math.sin(ledPhases[i]);
        if (blink > 0.35) {
          tempColor.set(currentPalette.ledActive);
        } else {
          tempColor.set(currentPalette.ledNormal).multiplyScalar(0.3);
        }
        ledInstancedMesh.setColorAt(i, tempColor);
      }
      if (ledInstancedMesh.instanceColor) ledInstancedMesh.instanceColor.needsUpdate = true;

      // 8. Severed Link Multi-Branch Crackling Lightning & Molten Sparks
      if (params.severedLink >= 0) {
        const linkIdx = params.severedLink;
        const towerA = towers[linkIdx];
        const towerB = towers[(linkIdx + 1) % N];

        const posA = new THREE.Vector3(
          Math.cos(towerA.angle) * primaryRadius,
          primaryHeight,
          Math.sin(towerA.angle) * primaryRadius
        );
        const posB = new THREE.Vector3(
          Math.cos(towerB.angle) * primaryRadius,
          primaryHeight,
          Math.sin(towerB.angle) * primaryRadius
        );

        // Place dynamic breach light in the middle of breach
        breachLight.position.lerpVectors(posA, posB, 0.5);

        // Generate multi-branch procedural crackling lightning
        const arcPositions = electricArc.geometry.attributes.position.array;
        let pIdx = 0;
        for (let b = 0; b < arcBranches; b++) {
          let prevPoint = posA.clone();
          for (let p = 1; p < arcPtsPerBranch; p++) {
            const t = p / (arcPtsPerBranch - 1);
            const curPoint = new THREE.Vector3().lerpVectors(posA, posB, t);
            if (p < arcPtsPerBranch - 1) {
              curPoint.x += (Math.random() - 0.5) * 0.75;
              curPoint.y += (Math.random() - 0.5) * 0.75;
              curPoint.z += (Math.random() - 0.5) * 0.75;
            }
            arcPositions[pIdx++] = prevPoint.x;
            arcPositions[pIdx++] = prevPoint.y;
            arcPositions[pIdx++] = prevPoint.z;
            arcPositions[pIdx++] = curPoint.x;
            arcPositions[pIdx++] = curPoint.y;
            arcPositions[pIdx++] = curPoint.z;
            prevPoint = curPoint;
          }
        }
        electricArc.geometry.attributes.position.needsUpdate = true;

        // Update burst sparks
        const sparkPositions = sparkPoints.geometry.attributes.position.array;
        for (let i = 0; i < sparkCount; i++) {
          sparkLifes[i] -= delta * 2.2;
          if (sparkLifes[i] <= 0) {
            sparkLifes[i] = Math.random();
            const origin = (i % 2 === 0) ? posA : posB;
            sparkPositions[i * 3] = origin.x;
            sparkPositions[i * 3 + 1] = origin.y;
            sparkPositions[i * 3 + 2] = origin.z;
            sparkVels[i].set(
              (Math.random() - 0.5) * 4.5,
              Math.random() * 4.0 + 1.2,
              (Math.random() - 0.5) * 4.5
            );
          } else {
            sparkPositions[i * 3] += sparkVels[i].x * delta;
            sparkPositions[i * 3 + 1] += sparkVels[i].y * delta;
            sparkPositions[i * 3 + 2] += sparkVels[i].z * delta;
            sparkVels[i].y -= 9.8 * delta; // Gravity pull
          }
        }
        sparkPoints.geometry.attributes.position.needsUpdate = true;
      } else {
        const sparkPositions = sparkPoints.geometry.attributes.position.array;
        for (let i = 0; i < sparkCount; i++) {
          sparkPositions[i * 3 + 1] = -100;
        }
        sparkPoints.geometry.attributes.position.needsUpdate = true;
      }

      // 9. Update Camera Animation (strictly preserving user zoom distance & angle)
      updateCameraAnimation(delta);

      // 10. Controls damping & post-processed bloom render
      controls.update();
      composer.render();
    }

    animate();
  </script>
</body>
</html>
