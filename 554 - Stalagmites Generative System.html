<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stalagmites Generative System</title>
  <style>
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      border: 0px solid lightgray;
      box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const COLOR_SCHEMES = {
      'Original': {
        background: '#ffffff',
        colors: ['#ffffff', '#888888', '#000000'],
        accent: '#000000'
      },
      'Monochromatic': {
        background: '#09111e',
        colors: ['#dbeafe', '#93c5fd', '#3b82f6', '#1d4ed8', '#172554'],
        accent: '#60a5fa'
      },
      'Analogous': {
        background: '#140805',
        colors: ['#ffb703', '#fb8500', '#d62828', '#9d0208', '#370617'],
        accent: '#ff0054'
      },
      'Complementary': {
        background: '#08121a',
        colors: ['#ff9f1c', '#ffbf69', '#2ec4b6', '#cbf3f0', '#011627'],
        accent: '#ff5400'
      },
      'Split-complementary': {
        background: '#0c1417',
        colors: ['#06d6a0', '#118ab2', '#ffd166', '#ef476f', '#073b4c'],
        accent: '#ef476f'
      },
      'Triadic': {
        background: '#12081d',
        colors: ['#f72585', '#7209b7', '#4cc9f0', '#4361ee', '#ffb703'],
        accent: '#4cc9f0'
      },
      'Tetradic': {
        background: '#090e14',
        colors: ['#ff5964', '#fec601', '#35ff69', '#05b292', '#38b6ff'],
        accent: '#ff5964'
      },
      'Double split-complementary': {
        background: '#0a0a14',
        colors: ['#ff0054', '#ff5400', '#ffbd00', '#00f5d4', '#7b2cbf'],
        accent: '#00f5d4'
      },
      'Achromatic': {
        background: '#000000',
        colors: ['#ffffff', '#cccccc', '#888888', '#444444', '#111111'],
        accent: '#ffffff',
        invertColors: ['#000000', '#333333', '#777777', '#cccccc', '#ffffff'],
        invertBackground: '#ffffff'
      },
      'Achromatic + Accent': {
        background: '#080808',
        colors: ['#ffffff', '#999999', '#444444', '#ff0033', '#99001f'],
        accent: '#ff0033',
        invertColors: ['#000000', '#555555', '#bbbbbb', '#ff0033', '#cc0029'],
        invertBackground: '#ffffff'
      },
      'Neutral + accent': {
        background: '#18181b',
        colors: ['#fafafa', '#d4d4d8', '#a1a1aa', '#71717a', '#3f3f46', '#27272a'],
        accent: '#ff9f1c'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        background: '#220901',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
        accent: '#F6AA1C'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        background: '#0B132B',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'],
        accent: '#63D1CF'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        background: '#0D001D',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'],
        accent: '#D69ADE'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        background: '#061210',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
        accent: '#FFBA00'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        background: '#05140A',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
        accent: '#7FFF00'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        background: '#0E0618',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
        accent: '#FF8C00'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        background: '#090612',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
        accent: '#B38FFF'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        background: '#05020F',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F'],
        accent: '#00F0FF'
      }
    };

    function hexToRgb(hex) {
      if (!hex) return { r: 255, g: 255, b: 255 };
      hex = hex.replace('#', '');
      if (hex.length === 3) {
        hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
      }
      const num = parseInt(hex, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function lerpColorRgb(c1, c2, t) {
      return {
        r: Math.round(c1.r + (c2.r - c1.r) * t),
        g: Math.round(c1.g + (c2.g - c1.g) * t),
        b: Math.round(c1.b + (c2.b - c1.b) * t)
      };
    }

    function getPaletteRgb(hexArray, t) {
      t = Math.max(0, Math.min(1, t));
      if (!hexArray || hexArray.length === 0) return { r: 255, g: 255, b: 255 };
      if (hexArray.length === 1) return hexToRgb(hexArray[0]);
      const scaled = t * (hexArray.length - 1);
      const idx = Math.floor(scaled);
      const frac = scaled - idx;
      if (idx >= hexArray.length - 1) return hexToRgb(hexArray[hexArray.length - 1]);
      return lerpColorRgb(hexToRgb(hexArray[idx]), hexToRgb(hexArray[idx + 1]), frac);
    }

    const params = {
      // Color & Theme
      scheme: 'Neutral + accent',
      greenScreen: false,
      backgroundColor: '#18181b',
      baseColor: '#fafafa',
      midColor: '#71717a',
      tipColor: '#27272a',
      accentColor: '#ff9f1c',
      useCustomColors: false,
      invertAchromatic: false,
      alpha: 0.9,

      // Geometry & Motion
      stalagmiteCount: 32,
      spawnSpread: 1.05,
      spawnMode: 'Full Screen',
      floorLevel: 1.0,
      startSize: 70,
      minSize: 6,
      growthSpeed: 1.6,
      wander: 1.1,
      taper: 0.7,
      direction: 'Upwards',

      // Infinite Animation & Trails
      infiniteAnimation: true,
      trailPersistence: 0.0,

      // Procedural Mode
      clickRandomize: true,

      // View & Navigation
      zoom: 1.0,
      panX: 0,
      panY: 0
    };

    let p5Instance = null;
    let pg = null;
    let stalagmites = [];

    class Stalagmite {
      constructor(x, y, p, direction = 'up', isAccent = false) {
        this.p = p;
        this.min_size = p.random(params.minSize * 0.7, params.minSize * 1.3);
        this.start_size = p.random(params.startSize * 0.7, params.startSize * 1.35);
        this.size = this.start_size;
        this.position = p.createVector(x, y);
        this.dead = false;
        this.direction = direction;
        this.isAccent = isAccent;
      }

      grow(buffer) {
        if (this.size > this.min_size && !this.dead) {
          const dy = this.p.random(1.0, 3.8) * params.growthSpeed;
          if (this.direction === 'up') {
            this.position.y -= dy;
            if (this.position.y < buffer.height * 0.08) this.dead = true;
          } else {
            this.position.y += dy;
            if (this.position.y > buffer.height * 0.92) this.dead = true;
          }

          this.position.x += this.p.random(-1.2, 1.2) * params.wander;
          this.size -= this.p.random(0.12, 0.48) * params.taper;

          if (this.size <= this.min_size) {
            this.dead = true;
            return;
          }

          const t = Math.max(0, Math.min(1, (this.start_size - this.size) / Math.max(1, this.start_size - this.min_size)));
          let rgb;

          if (params.scheme === 'Original' && !params.useCustomColors) {
            const gray = Math.round(this.p.map(this.size, this.start_size, this.min_size, 255, 0));
            rgb = { r: gray, g: gray, b: gray };
          } else if (params.useCustomColors) {
            const base = hexToRgb(params.baseColor);
            const mid = hexToRgb(params.midColor);
            const tip = hexToRgb(params.tipColor);
            if (t < 0.5) {
              rgb = lerpColorRgb(base, mid, t * 2);
            } else {
              rgb = lerpColorRgb(mid, tip, (t - 0.5) * 2);
            }
            if (this.isAccent) {
              const accent = hexToRgb(params.accentColor);
              rgb = lerpColorRgb(rgb, accent, 0.75);
            }
          } else {
            const activeScheme = COLOR_SCHEMES[params.scheme];
            let colorList = activeScheme.colors;
            if (params.invertAchromatic && activeScheme.invertColors) {
              colorList = activeScheme.invertColors;
            }
            rgb = getPaletteRgb(colorList, t);
            if (this.isAccent && activeScheme.accent) {
              const accent = hexToRgb(activeScheme.accent);
              rgb = lerpColorRgb(rgb, accent, 0.75);
            }
          }

          buffer.noStroke();
          buffer.fill(rgb.r, rgb.g, rgb.b, params.alpha * 255);
          buffer.ellipse(this.position.x, this.position.y, this.size, this.size);
        } else {
          this.dead = true;
        }
      }
    }

    function spawnStalagmite(p, buffer, targetX = null) {
      const spreadWidth = Math.max(p.width * 1.05, 2000) * params.spawnSpread;
      const cx = buffer.width / 2;
      const cy = buffer.height / 2;

      let dir = params.direction;
      if (dir === 'Both') {
        dir = Math.random() < 0.5 ? 'up' : 'down';
      } else if (dir === 'Downwards') {
        dir = 'down';
      } else {
        dir = 'up';
      }

      let x, y;
      if (params.spawnMode === 'Radial Cluster') {
        const radius = 220;
        const randomRadius = Math.sqrt(p.random(0.0, 1.0)) * radius;
        const randomAngle = p.random(0, p.TWO_PI);
        const baseY = dir === 'up' ? cy + 120 : cy - 120;
        x = cx + p.cos(randomAngle) * randomRadius;
        y = baseY + p.sin(randomAngle) * (randomRadius * 0.35);
      } else {
        // Full Screen spread across the entire viewport
        if (targetX !== null) {
          x = targetX + p.random(-35, 35);
        } else {
          x = cx + p.random(-0.5, 0.5) * spreadWidth;
        }
        const floorOffset = Math.min(p.height * 0.42, 520) * params.floorLevel;
        const baseY = dir === 'up' ? cy + floorOffset : cy - floorOffset;
        y = baseY + p.random(-45, 45);
      }

      const isAccent = Math.random() < 0.3;
      return new Stalagmite(x, y, p, dir, isAccent);
    }

    function initStalagmites(p, buffer, prewarm = true) {
      stalagmites = [];
      const spreadWidth = Math.max(p.width * 1.05, 2000) * params.spawnSpread;
      const cx = buffer.width / 2;
      const count = params.stalagmiteCount;

      for (let i = 0; i < count; i++) {
        let targetX = null;
        if (params.spawnMode === 'Full Screen') {
          const frac = (i + 0.5) / count;
          targetX = cx + (frac - 0.5) * spreadWidth;
        }
        stalagmites.push(spawnStalagmite(p, buffer, targetX));
      }

      if (prewarm) {
        for (let step = 0; step < 130; step++) {
          for (let s of stalagmites) {
            s.grow(buffer);
          }
          if (params.infiniteAnimation) {
            stalagmites = stalagmites.filter(s => !s.dead);
            while (stalagmites.length < count) {
              stalagmites.push(spawnStalagmite(p, buffer));
            }
          }
        }
      }
    }

    function applyScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;
      if (params.invertAchromatic && scheme.invertBackground) {
        params.backgroundColor = scheme.invertBackground;
      } else {
        params.backgroundColor = scheme.background;
      }
      params.baseColor = scheme.colors[0];
      params.midColor = scheme.colors[Math.floor(scheme.colors.length / 2)];
      params.tipColor = scheme.colors[scheme.colors.length - 1];
      params.accentColor = scheme.accent || scheme.colors[0];

      gui.controllersRecursive().forEach(c => {
        if (['backgroundColor', 'baseColor', 'midColor', 'tipColor', 'accentColor'].includes(c.property)) {
          c.updateDisplay();
        }
      });
    }

    function randomizeScene() {
      if (!p5Instance || !pg) return;
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.scheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyScheme(params.scheme);

      params.stalagmiteCount = Math.floor(Math.random() * 24) + 24;
      params.spawnSpread = +(Math.random() * 0.4 + 0.9).toFixed(2);
      params.startSize = Math.floor(Math.random() * 50) + 50;
      params.minSize = Math.floor(Math.random() * 6) + 4;
      params.growthSpeed = +(Math.random() * 1.4 + 1.0).toFixed(2);
      params.wander = +(Math.random() * 1.2 + 0.7).toFixed(2);
      params.taper = +(Math.random() * 0.6 + 0.5).toFixed(2);
      params.alpha = +(Math.random() * 0.2 + 0.8).toFixed(2);

      const dirs = ['Upwards', 'Upwards', 'Both'];
      params.direction = dirs[Math.floor(Math.random() * dirs.length)];

      gui.controllersRecursive().forEach(c => c.updateDisplay());

      pg.clear();
      initStalagmites(p5Instance, pg, true);
    }

    // Initialize lil-gui
    const gui = new GUI({ title: 'Stalagmite Controls' });

    const themeFolder = gui.addFolder('Color & Themes');
    themeFolder.add(params, 'scheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(val => {
      applyScheme(val);
      if (pg) {
        pg.clear();
        initStalagmites(p5Instance, pg, true);
      }
    });
    themeFolder.add(params, 'greenScreen').name('Green Screen (#00ff00)');
    themeFolder.addColor(params, 'backgroundColor').name('Background Color').listen();
    themeFolder.add(params, 'useCustomColors').name('Use Custom Colors');
    themeFolder.addColor(params, 'baseColor').name('Base Color').listen();
    themeFolder.addColor(params, 'midColor').name('Mid Color').listen();
    themeFolder.addColor(params, 'tipColor').name('Tip Color').listen();
    themeFolder.addColor(params, 'accentColor').name('Accent Color').listen();
    themeFolder.add(params, 'invertAchromatic').name('Invert B&W / Variant').onChange(() => {
      applyScheme(params.scheme);
      if (pg) {
        pg.clear();
        initStalagmites(p5Instance, pg, true);
      }
    });
    themeFolder.add(params, 'alpha', 0.1, 1.0, 0.01).name('Opacity');

    const geomFolder = gui.addFolder('Geometry & Motion');
    geomFolder.add(params, 'stalagmiteCount', 5, 80, 1).name('Count').listen();
    geomFolder.add(params, 'spawnMode', ['Full Screen', 'Radial Cluster']).name('Spawn Mode').onChange(() => {
      if (pg) {
        pg.clear();
        initStalagmites(p5Instance, pg, true);
      }
    });
    geomFolder.add(params, 'spawnSpread', 0.3, 2.5, 0.05).name('Spread Width').listen();
    geomFolder.add(params, 'floorLevel', 0.5, 1.3, 0.05).name('Floor Level').listen();
    geomFolder.add(params, 'startSize', 10, 180, 1).name('Start Size').listen();
    geomFolder.add(params, 'minSize', 1, 20, 1).name('Min Size').listen();
    geomFolder.add(params, 'growthSpeed', 0.2, 5.0, 0.1).name('Growth Speed').listen();
    geomFolder.add(params, 'wander', 0.1, 4.0, 0.1).name('Wander (Drift)').listen();
    geomFolder.add(params, 'taper', 0.1, 3.0, 0.1).name('Taper Rate').listen();
    geomFolder.add(params, 'direction', ['Upwards', 'Downwards', 'Both']).name('Direction').listen();

    const animFolder = gui.addFolder('Infinite Animation');
    animFolder.add(params, 'infiniteAnimation').name('Infinite Animation');
    animFolder.add(params, 'trailPersistence', 0.0, 0.04, 0.001).name('Trail Fade (Decay)');
    animFolder.add({ clear: () => { if (pg) pg.clear(); } }, 'clear').name('Clear Canvas');

    const proceduralFolder = gui.addFolder('Procedural Click Mode');
    proceduralFolder.add(params, 'clickRandomize').name('Click to Randomize');
    proceduralFolder.add({ randomize: randomizeScene }, 'randomize').name('Randomize Now');

    const viewFolder = gui.addFolder('View (Pan & Zoom)');
    viewFolder.add(params, 'zoom', 0.1, 8.0, 0.01).name('Zoom').listen();
    viewFolder.add(params, 'panX', -2000, 2000, 1).name('Pan X').listen();
    viewFolder.add(params, 'panY', -2000, 2000, 1).name('Pan Y').listen();
    viewFolder.add({ reset: () => { params.zoom = 1.0; params.panX = 0; params.panY = 0; } }, 'reset').name('Reset View');

    // Press 'H' to toggle UI visibility
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Zoom with wheel
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();

      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const oldZoom = params.zoom;
      const newZoom = Math.min(Math.max(params.zoom * zoomFactor, 0.1), 8.0);

      const mx = e.clientX - window.innerWidth / 2;
      const my = e.clientY - window.innerHeight / 2;

      params.panX = mx - (mx - params.panX) * (newZoom / oldZoom);
      params.panY = my - (my - params.panY) * (newZoom / oldZoom);
      params.zoom = newZoom;
    }, { passive: false });

    // Drag object across screen
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let initialPanX = 0, initialPanY = 0;
    let movedDistance = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initialPanX = params.panX;
      initialPanY = params.panY;
      movedDistance = 0;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      movedDistance = Math.hypot(dx, dy);
      if (movedDistance > 3) {
        params.panX = initialPanX + dx;
        params.panY = initialPanY + dy;
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (movedDistance <= 3 && !e.target.closest('.lil-gui')) {
        if (params.clickRandomize) {
          randomizeScene();
        }
      }
    });

    // p5.js Sketch
    const sketch = (p) => {
      p5Instance = p;

      p.setup = () => {
        p.createCanvas(p.windowWidth, p.windowHeight);
        pg = p.createGraphics(3600, 2400);
        pg.clear();
        p.noStroke();
        applyScheme(params.scheme);
        initStalagmites(p, pg, true);
      };

      p.windowResized = () => {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
      };

      p.draw = () => {
        const bg = params.greenScreen ? '#00ff00' : params.backgroundColor;
        p.background(bg);

        // Optional trail decay
        if (params.trailPersistence > 0) {
          const ctx = pg.drawingContext;
          ctx.save();
          ctx.globalCompositeOperation = 'destination-out';
          ctx.fillStyle = `rgba(0, 0, 0, ${params.trailPersistence})`;
          ctx.fillRect(0, 0, pg.width, pg.height);
          ctx.restore();
        }

        // Grow active stalagmites
        for (let S of stalagmites) {
          S.grow(pg);
        }

        // Infinite animation replenishment
        if (params.infiniteAnimation) {
          stalagmites = stalagmites.filter(s => !s.dead);
          while (stalagmites.length < params.stalagmiteCount) {
            stalagmites.push(spawnStalagmite(p, pg));
          }
        }

        // Render buffer centered with pan and zoom
        p.push();
        p.translate(p.width / 2 + params.panX, p.height / 2 + params.panY);
        p.scale(params.zoom);
        p.translate(-pg.width / 2, -pg.height / 2);
        p.image(pg, 0, 0);
        p.pop();
      };
    };

    new window.p5(sketch);
  </script>
</body>
</html>
