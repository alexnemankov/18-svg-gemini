<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Hearts Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      background: #000;
    }

    canvas#canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas#canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="canvas">Canvas not supported.</canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 19 Preconfigured Color Schemes
    const SCHEMES = {
      'Original': {
        useGradient: true,
        bgBottom: '#ffdde1',
        bgTop: '#ee9ca7',
        bg: '#ee9ca7',
        colors: ['#ffffff', '#fff5f7', '#ffebef', '#ffffff', '#fff0f3']
      },
      'Monochromatic': {
        useGradient: false,
        bg: '#2b0914',
        colors: ['#ff4d6d', '#ff758f', '#ff8fa3', '#c9184a', '#800f2f']
      },
      'Analogous': {
        useGradient: false,
        bg: '#1c0b24',
        colors: ['#ff4d6d', '#f72585', '#b5179e', '#7209b7', '#ff758f']
      },
      'Complementary': {
        useGradient: false,
        bg: '#0a1a1f',
        colors: ['#ff4d6d', '#2ec4b6', '#ff85a1', '#06d6a0', '#e71d36']
      },
      'Split-complementary': {
        useGradient: false,
        bg: '#130a21',
        colors: ['#ff007f', '#00f0ff', '#ffb703', '#8338ec', '#06d6a0']
      },
      'Triadic': {
        useGradient: false,
        bg: '#0c1021',
        colors: ['#ff3366', '#ffbe0b', '#3a86ff', '#ff5c8a', '#00bbf9']
      },
      'Tetradic': {
        useGradient: false,
        bg: '#0d0d1e',
        colors: ['#ff006e', '#3a86ff', '#fb5607', '#8338ec', '#06d6a0']
      },
      'Double split-complementary': {
        useGradient: false,
        bg: '#160c1d',
        colors: ['#f94144', '#f3722c', '#90be6d', '#43aa8b', '#577590']
      },
      'Achromatic (black and white version, white and black)': {
        useGradient: false,
        bg: '#111111',
        colors: ['#ffffff', '#e0e0e0', '#aaaaaa', '#777777', '#cccccc']
      },
      'Achromatic + Accent (black and white + red, white and black + red)': {
        useGradient: false,
        bg: '#0d0d0d',
        colors: ['#ffffff', '#d6d6d6', '#ff0033', '#888888', '#ff2a55']
      },
      'Neutral + accent': {
        useGradient: false,
        bg: '#1c1917',
        colors: ['#d7c4b7', '#a39b8b', '#ff6b6b', '#f3ede2', '#8c8275']
      },
      'Palette: (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        useGradient: false,
        bg: '#220901',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#FFD166']
      },
      'Palette: (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        useGradient: false,
        bg: '#0B132B',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#80E5DF', '#3A8F82']
      },
      'Palette: (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        useGradient: false,
        bg: '#0D001D',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#E8C5EA']
      },
      'Palette: (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        useGradient: false,
        bg: '#061210',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#FFE580']
      },
      'Palette: (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        useGradient: false,
        bg: '#05140A',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#55EFC4', '#98FB98']
      },
      'Palette: (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        useGradient: false,
        bg: '#0E0618',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#FFA94D', '#E8590C']
      },
      'Palette: (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        useGradient: false,
        bg: '#090612',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#CBB2FE', '#9370DB']
      },
      'Palette: (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        useGradient: false,
        bg: '#05020F',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#FF1493', '#79FFE1']
      }
    };

    const SCHEME_KEYS = Object.keys(SCHEMES);

    class Tool {
      static randomNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
      }
      static randomColorRGB() {
        return (
          "rgb(" +
          this.randomNumber(0, 255) +
          ", " +
          this.randomNumber(0, 255) +
          ", " +
          this.randomNumber(0, 255) +
          ")"
        );
      }
      static randomColorHSL(saturation, lightness) {
        return (
          "hsl(" +
          this.randomNumber(0, 360) +
          ", " +
          saturation +
          "%, " +
          lightness +
          "%)"
        );
      }
    }

    class Angle {
      constructor(a) {
        this.a = a;
        this.rad = (this.a * Math.PI) / 180;
      }
      incDec(num) {
        this.a += num;
        this.rad = (this.a * Math.PI) / 180;
      }
    }

    // Configurable parameters
    const params = {
      // Greenscreen & Background
      greenscreen: false,
      bgColor: SCHEMES['Original'].bg,
      useGradient: true,
      bgGradientBottom: SCHEMES['Original'].bgBottom,
      bgGradientTop: SCHEMES['Original'].bgTop,

      // Color Theme
      colorScheme: 'Original',
      overrideColor: false,
      customHeartColor: '#ffffff',
      blendMode: 'source-over',

      // Geometry & Counts
      heartNum: window.innerWidth < 768 ? 50 : 100,
      minRadius: 10,
      maxRadius: 80,
      stretchFactor: 0.1,
      stretchDamping: 0.9,

      // Motion & Dynamics
      upwardAcc: 0.001,
      floatSpeed: 1.0,
      driftSpeed: 1.0,
      maxAlpha: 1.0,

      // Procedural Variation
      clickToRandomize: true
    };

    // Zoom & Pan transformation state
    const transform = {
      scale: 1.0,
      x: 0,
      y: 0
    };

    function getHeartColor(index) {
      if (params.overrideColor) {
        return params.customHeartColor;
      }
      const scheme = SCHEMES[params.colorScheme];
      if (!scheme || !scheme.colors || scheme.colors.length === 0) {
        return '#ffffff';
      }
      return scheme.colors[Math.floor(Math.random() * scheme.colors.length)];
    }

    let canvas;
    let gui;
    const controllers = {};

    function refreshColors() {
      if (!canvas || !canvas.hearts) return;
      for (let i = 0; i < canvas.hearts.length; i++) {
        canvas.hearts[i].c = getHeartColor(i);
      }
    }

    function reinitAllHearts() {
      if (!canvas || !canvas.hearts) return;
      for (let i = 0; i < canvas.hearts.length; i++) {
        canvas.hearts[i].init(
          Tool.randomNumber(0, canvas.width),
          Tool.randomNumber(canvas.height - canvas.height / 2, canvas.height),
          Tool.randomNumber(params.minRadius, params.maxRadius)
        );
      }
    }

    function updateHeartCount() {
      if (!canvas) return;
      while (canvas.hearts.length < params.heartNum) {
        const s = new Heart(
          canvas.ctx,
          Tool.randomNumber(0, canvas.width),
          Tool.randomNumber(canvas.height - canvas.height / 2, canvas.height),
          Tool.randomNumber(params.minRadius, params.maxRadius)
        );
        canvas.hearts.push(s);
      }
      if (canvas.hearts.length > params.heartNum) {
        canvas.hearts.length = params.heartNum;
      }
    }

    function applyScheme(schemeName) {
      const scheme = SCHEMES[schemeName];
      if (!scheme) return;
      params.colorScheme = schemeName;
      params.bgColor = scheme.bg;
      params.useGradient = !!scheme.useGradient;
      if (scheme.bgBottom && scheme.bgTop) {
        params.bgGradientBottom = scheme.bgBottom;
        params.bgGradientTop = scheme.bgTop;
      }
      refreshColors();
      controllers.bgColor?.updateDisplay();
      controllers.useGradient?.updateDisplay();
      controllers.bgGradientBottom?.updateDisplay();
      controllers.bgGradientTop?.updateDisplay();
    }

    function resetView() {
      transform.scale = 1.0;
      transform.x = 0;
      transform.y = 0;
      controllers.scale?.updateDisplay();
      controllers.panX?.updateDisplay();
      controllers.panY?.updateDisplay();
    }

    function randomizeScene() {
      const randomSchemeKey = SCHEME_KEYS[Math.floor(Math.random() * SCHEME_KEYS.length)];
      const scheme = SCHEMES[randomSchemeKey];
      params.colorScheme = randomSchemeKey;
      params.bgColor = scheme.bg;
      params.useGradient = !!scheme.useGradient;
      if (scheme.bgBottom && scheme.bgTop) {
        params.bgGradientBottom = scheme.bgBottom;
        params.bgGradientTop = scheme.bgTop;
      }

      // Re-roll geometric & motion parameters
      params.heartNum = Tool.randomNumber(40, 160);
      params.minRadius = Tool.randomNumber(6, 20);
      params.maxRadius = Tool.randomNumber(35, 95);
      params.stretchFactor = +(Math.random() * 0.18 + 0.05).toFixed(3);
      params.stretchDamping = +(Math.random() * 0.15 + 0.82).toFixed(3);
      params.upwardAcc = +(Math.random() * 0.003 + 0.0005).toFixed(4);
      params.floatSpeed = +(Math.random() * 1.8 + 0.5).toFixed(2);
      params.driftSpeed = +(Math.random() * 1.6 + 0.4).toFixed(2);
      params.maxAlpha = +(Math.random() * 0.4 + 0.6).toFixed(2);
      params.overrideColor = false;

      updateHeartCount();
      reinitAllHearts();

      if (gui) {
        gui.controllersRecursive().forEach((c) => c.updateDisplay());
      }
    }

    class Canvas {
      constructor() {
        this.canvas = document.getElementById("canvas");
        this.ctx = this.canvas.getContext("2d");
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
        this.mouseX = null;
        this.mouseY = null;
        this.hearts = [];
      }

      init() {
        this.hearts = [];
        for (let i = 0; i < params.heartNum; i++) {
          const s = new Heart(
            this.ctx,
            Tool.randomNumber(0, this.width),
            Tool.randomNumber(this.height - this.height / 2, this.height),
            Tool.randomNumber(params.minRadius, params.maxRadius)
          );
          this.hearts.push(s);
        }
      }

      render() {
        // Draw background
        this.ctx.globalCompositeOperation = 'source-over';
        if (params.greenscreen) {
          this.ctx.fillStyle = '#00ff00';
          this.ctx.fillRect(0, 0, this.width, this.height);
        } else if (params.useGradient) {
          const grad = this.ctx.createLinearGradient(0, this.height, 0, 0);
          grad.addColorStop(0, params.bgGradientBottom);
          grad.addColorStop(1, params.bgGradientTop);
          this.ctx.fillStyle = grad;
          this.ctx.fillRect(0, 0, this.width, this.height);
        } else {
          this.ctx.fillStyle = params.bgColor;
          this.ctx.fillRect(0, 0, this.width, this.height);
        }

        // Apply pan & zoom transformations for objects
        this.ctx.save();
        this.ctx.translate(transform.x, transform.y);
        this.ctx.scale(transform.scale, transform.scale);
        this.ctx.globalCompositeOperation = params.blendMode;

        for (let i = 0; i < this.hearts.length; i++) {
          this.hearts[i].render(i);
        }

        this.ctx.restore();
        this.ctx.globalCompositeOperation = 'source-over';
      }

      resize() {
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
      }
    }

    class Heart {
      constructor(ctx, x, y, r) {
        this.ctx = ctx;
        this.init(x, y, r);
      }

      init(x, y, r) {
        this.x = x;
        this.y = y;
        this.r = r * 0.8;
        this.maxR = r;
        this.c = getHeartColor();
        this.ga = Math.random();
        this.l = Tool.randomNumber(50, 500);
        this.sl = this.l;
        this.v = {
          r: 0,
          x: Tool.randomNumber(-1, 1) * Math.random(),
          y: -Math.random()
        };
      }

      draw() {
        const ctx = this.ctx;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, this.ga * params.maxAlpha));
        ctx.fillStyle = this.c;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y + this.r);
        ctx.bezierCurveTo(
          this.x - this.r - this.r / 5,
          this.y + this.r / 1.5,
          this.x - this.r,
          this.y - this.r,
          this.x,
          this.y - this.r / 3
        );
        ctx.bezierCurveTo(
          this.x + this.r,
          this.y - this.r,
          this.x + this.r + this.r / 5,
          this.y + this.r / 1.5,
          this.x,
          this.y + this.r
        );
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      stretch() {
        this.v.r += (this.maxR - this.r) * params.stretchFactor;
        this.v.r *= params.stretchDamping;
        this.r += this.v.r;

        // Respawn when life expires or when heart travels far above viewport
        if (this.l < 0 || this.y < -this.maxR * 2.5) {
          this.l = Tool.randomNumber(50, 200);
          this.init(
            Tool.randomNumber(0, canvas.width),
            Tool.randomNumber(canvas.height - canvas.height / 2, canvas.height + 40),
            Tool.randomNumber(params.minRadius, params.maxRadius)
          );
        }
      }

      updatePosition() {
        this.v.y -= params.upwardAcc;
        this.y += this.v.y * params.floatSpeed;
        this.x += this.v.x * params.driftSpeed;
      }

      updateParams() {
        const ratio = this.l / this.sl / 2;
        this.ga = ratio;
        this.l -= 1;
      }

      render() {
        this.updatePosition();
        this.updateParams();
        this.stretch();
        this.draw();
      }
    }

    function setupGUI() {
      gui = new GUI({ title: 'Scene Controls' });

      // Background & Greenscreen folder
      const folderBg = gui.addFolder('Background & Greenscreen');
      controllers.greenscreen = folderBg.add(params, 'greenscreen').name('Greenscreen (#00ff00)');
      controllers.bgColor = folderBg.addColor(params, 'bgColor').name('Background Color');
      controllers.useGradient = folderBg.add(params, 'useGradient').name('Use Gradient');
      controllers.bgGradientBottom = folderBg.addColor(params, 'bgGradientBottom').name('Gradient Bottom');
      controllers.bgGradientTop = folderBg.addColor(params, 'bgGradientTop').name('Gradient Top');

      // Color Schemes & Custom Colors folder
      const folderColors = gui.addFolder('Color Schemes');
      controllers.colorScheme = folderColors.add(params, 'colorScheme', SCHEME_KEYS).name('Color Scheme').onChange(applyScheme);
      controllers.overrideColor = folderColors.add(params, 'overrideColor').name('Single Heart Color').onChange(refreshColors);
      controllers.customHeartColor = folderColors.addColor(params, 'customHeartColor').name('Heart Color').onChange(refreshColors);
      controllers.blendMode = folderColors.add(params, 'blendMode', ['source-over', 'lighter', 'screen']).name('Blend Mode');

      // Zoom & Drag folder
      const folderTransform = gui.addFolder('Zoom & Pan');
      controllers.scale = folderTransform.add(transform, 'scale', 0.1, 8.0, 0.01).name('Zoom (Scale)').listen();
      controllers.panX = folderTransform.add(transform, 'x', -window.innerWidth * 2, window.innerWidth * 2, 1).name('Pan X').listen();
      controllers.panY = folderTransform.add(transform, 'y', -window.innerHeight * 2, window.innerHeight * 2, 1).name('Pan Y').listen();
      folderTransform.add({ reset: resetView }, 'reset').name('Reset View');

      // Geometry & Particle Counts
      const folderGeo = gui.addFolder('Geometry & Counts');
      controllers.heartNum = folderGeo.add(params, 'heartNum', 10, 300, 1).name('Heart Count').onChange(updateHeartCount);
      controllers.minRadius = folderGeo.add(params, 'minRadius', 5, 50, 1).name('Min Radius');
      controllers.maxRadius = folderGeo.add(params, 'maxRadius', 20, 150, 1).name('Max Radius');
      controllers.stretchFactor = folderGeo.add(params, 'stretchFactor', 0.02, 0.3, 0.01).name('Stretch Elasticity');
      controllers.stretchDamping = folderGeo.add(params, 'stretchDamping', 0.7, 0.98, 0.01).name('Stretch Damping');

      // Motion & Dynamics
      const folderMotion = gui.addFolder('Motion & Dynamics');
      controllers.upwardAcc = folderMotion.add(params, 'upwardAcc', 0.0002, 0.008, 0.0002).name('Upward Acceleration');
      controllers.floatSpeed = folderMotion.add(params, 'floatSpeed', 0.2, 3.0, 0.1).name('Rise Speed');
      controllers.driftSpeed = folderMotion.add(params, 'driftSpeed', 0.0, 3.0, 0.1).name('Drift Speed');
      controllers.maxAlpha = folderMotion.add(params, 'maxAlpha', 0.1, 1.0, 0.05).name('Max Opacity');

      // Procedural Variation
      const folderProcedural = gui.addFolder('Procedural Variation');
      controllers.clickToRandomize = folderProcedural.add(params, 'clickToRandomize').name('Click Scene to Re-roll');
      folderProcedural.add({ randomize: randomizeScene }, 'randomize').name('Generate Variation');

      // Keybinding 'H' to toggle GUI visibility
      let isGuiVisible = true;
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          isGuiVisible = !isGuiVisible;
          if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
            isGuiVisible ? gui.show() : gui.hide();
          } else {
            gui.domElement.style.display = isGuiVisible ? '' : 'none';
          }
        }
      });
    }

    function setupInteractions() {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let startTransformX = 0;
      let startTransformY = 0;
      let dragDist = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startTransformX = transform.x;
        startTransformY = transform.y;
        dragDist = 0;
        document.body.style.cursor = 'grabbing';
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        dragDist = Math.hypot(dx, dy);
        transform.x = startTransformX + dx;
        transform.y = startTransformY + dy;
        controllers.panX?.updateDisplay();
        controllers.panY?.updateDisplay();
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        document.body.style.cursor = '';

        // Click detection without dragging
        if (dragDist < 6 && (!e.target || !e.target.closest || !e.target.closest('.lil-gui'))) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
      });

      // Mouse wheel zoom centered at cursor position
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const newScale = Math.min(Math.max(transform.scale * zoomFactor, 0.1), 10.0);
        transform.x = mouseX - (mouseX - transform.x) * (newScale / transform.scale);
        transform.y = mouseY - (mouseY - transform.y) * (newScale / transform.scale);
        transform.scale = newScale;

        controllers.scale?.updateDisplay();
        controllers.panX?.updateDisplay();
        controllers.panY?.updateDisplay();
      }, { passive: false });
    }

    (function () {
      "use strict";
      window.addEventListener("load", function () {
        canvas = new Canvas();
        canvas.init();

        setupGUI();
        setupInteractions();

        function render() {
          window.requestAnimationFrame(function () {
            canvas.render();
            render();
          });
        }

        render();

        window.addEventListener(
          "resize",
          function () {
            canvas.resize();
            canvas.init();
          },
          false
        );
      });
    })();
  </script>
</body>
</html>
