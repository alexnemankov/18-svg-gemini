<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efd4e0">
  <meta name="description" content="A living mosaic of softly folded, pastel holographic crystals. Procedural Three.js and GLSL, with a seamless 40-second loop.">
  <link rel="icon" href="data:,">
  <title>Opaline — Pastel Crystal Mosaic</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #efd4e0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .unavailable { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; color: #806b7a; font: 15px/1.7 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
<script>
/*
 * OPALINE
 * All geometry, color, reflections and edges are procedural. No image assets.
 * Open this file directly in a modern browser. Only Three.js needs a network
 * connection; its version is pinned and a second CDN is available as fallback.
 * Tune CONFIG below, or use window.crystalMosaic for playback / frame export.
 */
(async () => {
  'use strict';

  const CONFIG = Object.freeze({
    triangleDensity: 320,         // Approximate number visible, at any aspect ratio.
    displacementAmplitude: 0.26, // Breathing height in world units; folds stay planar.
    lateralMotionAmplitude: 0.18, // Visible, gentle drift of the connected facets.
    animationSpeed: 1,           // 0 freezes; 0.5 doubles the effective loop duration.
    loopDuration: 40,            // Seconds per cycle at animationSpeed = 1.
    iridescenceIntensity: 0.72,
    specularStrength: 0.52,
    edgeHighlightIntensity: 0.72,
    pastelSaturation: 0.88,
    seed: 645021,
    maxPixelRatio: 2
  });

  const settings = {
    ...CONFIG,
    scheme: 'Original', invert: false, tint: '#ffffff', tintAmount: 0,
    background: '#efd4e0', greenscreen: false,
    pixelRatio: Math.min(devicePixelRatio || 1, CONFIG.maxPixelRatio),
    animation: 'Crystal breathing', cameraMotion: 1,
    zoom: 1, angle: 0, azimuth: 0, roll: 0, panX: 0, panY: 0,
    surfaceScale: 1, foldDepth: 0.9, irregularity: 0.95,
    randomizeOnClick: true
  };
  const ANIMATIONS = [
    'Crystal breathing', 'Pearl tide', 'Prismatic drift', 'Orbit',
    'Pendulum', 'Slow roll', 'Floating focus', 'Static'
  ];
  // The two achromatic schemes each have a reversible black/white variant.
  // This keeps exactly 19 schemes while providing both requested polarities.
  const SCHEMES = {
    'Original': ['F5B8D0', 'F2A9C8', 'D9B5EA', 'E7C8EE', 'F6D8C9', 'FFF3E8'],
    'Monochromatic': ['FAEAF2', 'E9B8CF', 'C783A4', '9C5277', '622B4C', '301326'],
    'Analogous': ['F6C4B7', 'F2A9C8', 'DC9DDD', 'B493DC', '7F71B1', '43365F'],
    'Complementary': ['F6C4DC', 'D777A7', '8D4269', 'C9F0DC', '70AB91', '244F43'],
    'Split-complementary': ['F5B8D0', 'B85F8E', 'FFF4B5', 'B5D785', 'A6E5DF', '315C64'],
    'Triadic': ['F5B8D0', 'C75F93', 'C8EDC0', '79A976', 'C5D6FA', '697CB2'],
    'Tetradic': ['F4B6D0', 'BC6B95', 'FFE7AC', 'B9E8D2', 'B7C9F4', '65558E'],
    'Double split-complementary': ['E8A4CB', 'F5C2AB', 'EEE4AC', 'B3DEC7', 'AACEE4', 'B7A2D6'],
    'Achromatic': ['080808', '282828', '555555', '929292', 'D5D5D5', 'FAFAFA'],
    'Achromatic + Accent': ['080808', '333333', '777777', 'D2D2D2', 'FAFAFA', 'E32636'],
    'Neutral + accent': ['E9E3D8', 'BDB7AC', '8B8D84', '535C55', '252E29', 'E8AD41'],
    'Amber / Oxblood': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
    'Lagoon / Ink': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
    'Orchid / Aubergine': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
    'Saffron / Deep teal': ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
    'Chartreuse / Forest': ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
    'Apricot / Violet': ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
    'Lavender / Midnight': ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
    'Cyan / Magenta': ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']
  };
  const paletteSettings = {};
  let paletteEdited = false, paletteCount = 6, staticPhase = 0;
  let renderer, mesh, material, gui, frame = 0;
  let disposed = false, paused = false, contextLost = false;
  let elapsed = 0, previousTime = null, resizePending = true;
  let worldWidth = 16, worldHeight = 10, uiVisible = true;
  const TAU = Math.PI * 2;

  function showError(error) {
    console.error('Opaline:', error);
    cancelAnimationFrame(frame);
    renderer?.domElement.remove();
    const message = document.createElement('div');
    message.className = 'unavailable';
    message.setAttribute('role', 'status');
    message.textContent = 'The crystal mosaic could not start. Please check your connection and enable WebGL in a current browser.';
    document.body.append(message);
  }

  try {
    let THREE;
    try {
      THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
    } catch {
      THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
    }
    let GUI;
    try {
      ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    } catch {
      ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    }

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'low-power' });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    // The shader works in linear light and rolls off highlights before output.
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setClearColor('#efd4e0');
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'Slowly breathing, iridescent pastel crystal mosaic');
    document.body.append(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
    camera.position.set(0, 0, 16);
    camera.lookAt(0, 0, 0);

    function seededRandom(seed) {
      return () => {
        seed |= 0;
        seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // Bowyer-Watson Delaunay triangulation. The padded grid keeps the viewport
    // well inside the convex hull; all triangles use the same source vertices.
    function triangulate(points) {
      const count = points.length;
      const span = Math.max(...points.map(p => Math.max(Math.abs(p.x), Math.abs(p.y)))) * 8;
      const vertices = points.concat([
        { x: -span, y: -span }, { x: span, y: -span }, { x: 0, y: span }
      ]);
      function triangle(a, b, c) {
        const A = vertices[a], B = vertices[b], C = vertices[c];
        const d = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
        if (Math.abs(d) < 1e-10) return null;
        const aa = A.x * A.x + A.y * A.y, bb = B.x * B.x + B.y * B.y, cc = C.x * C.x + C.y * C.y;
        const x = (aa * (B.y - C.y) + bb * (C.y - A.y) + cc * (A.y - B.y)) / d;
        const y = (aa * (C.x - B.x) + bb * (A.x - C.x) + cc * (B.x - A.x)) / d;
        return { a, b, c, x, y, r2: (x - A.x) ** 2 + (y - A.y) ** 2 };
      }
      let triangles = [triangle(count, count + 1, count + 2)];
      for (let i = 0; i < count; i++) {
        const p = vertices[i], boundary = new Map(), keep = [];
        for (const t of triangles) {
          if ((p.x - t.x) ** 2 + (p.y - t.y) ** 2 <= t.r2 + 1e-9) {
            for (const [a, b] of [[t.a, t.b], [t.b, t.c], [t.c, t.a]]) {
              const key = a < b ? a + ':' + b : b + ':' + a;
              if (boundary.has(key)) boundary.delete(key);
              else boundary.set(key, [a, b]);
            }
          } else keep.push(t);
        }
        for (const [a, b] of boundary.values()) {
          const t = triangle(a, b, i);
          if (t) keep.push(t);
        }
        triangles = keep;
      }
      return triangles.filter(t => t.a < count && t.b < count && t.c < count);
    }

    function makeGeometry(width, height) {
      const random = seededRandom(settings.seed);
      // Mild anisotropy produces the long, folded slivers in the reference.
      const spacing = Math.sqrt(width * height * 2 / settings.triangleDensity);
      const dx = spacing * 0.83, dy = spacing / 0.83;
      const columns = Math.ceil(width / dx), rows = Math.ceil(height / dy);
      const points = [];
      for (let row = -2; row <= rows + 2; row++) {
        for (let col = -2; col <= columns + 2; col++) {
          points.push({
            x: (col + (random() - 0.5) * settings.irregularity) * dx - width / 2,
            y: (row + (random() - 0.5) * settings.irregularity) * dy - height / 2,
            z: (random() - 0.5) * spacing * settings.foldDepth
          });
        }
      }
      const faces = triangulate(points);
      const positions = [], barycentrics = [], faceSeeds = [], centers = [];
      const bary = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
      for (const face of faces) {
        let indices = [face.a, face.b, face.c];
        const [a, b, c] = indices.map(i => points[i]);
        if ((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x) < 0) {
          indices = [face.a, face.c, face.b];
        }
        const seed = random();
        for (let j = 0; j < 3; j++) {
          const p = points[indices[j]];
          positions.push(p.x, p.y, p.z);
          barycentrics.push(...bary[j]);
          faceSeeds.push(seed);
          centers.push((a.x + b.x + c.x) / 3, (a.y + b.y + c.y) / 3);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('aBarycentric', new THREE.Float32BufferAttribute(barycentrics, 3));
      geometry.setAttribute('aSeed', new THREE.Float32BufferAttribute(faceSeeds, 1));
      geometry.setAttribute('aCenter', new THREE.Float32BufferAttribute(centers, 2));
      geometry.computeBoundingSphere();
      return geometry;
    }

    const vertexShader = /* glsl */`
      uniform float uPhase;
      uniform float uDisplacement;
      uniform float uLateralMotion;
      attribute vec3 aBarycentric;
      attribute float aSeed;
      attribute vec2 aCenter;
      varying vec3 vBarycentric;
      varying vec3 vPosition;
      varying float vSeed;
      varying vec2 vCenter;

      // Smooth spatial harmonics with integer temporal frequencies: each term
      // returns exactly to its starting value after one complete phase cycle.
      float breathing(vec2 p) {
        float a = sin(p.x * 0.63 + p.y * 0.38 + uPhase);
        float b = cos(p.y * 0.82 - p.x * 0.27 - uPhase);
        float c = sin(p.x * 1.31 - p.y * 0.91 + 2.0 * uPhase);
        float d = cos(p.x * 0.41 + p.y * 1.17 - uPhase + 1.9);
        return a * 0.43 + b * 0.30 + c * 0.12 + d * 0.15;
      }

      vec2 drift(vec2 p) {
        return uLateralMotion * vec2(
          0.70 * sin(p.y * 0.61 + p.x * 0.23 + uPhase)
            + 0.30 * cos(p.x * 0.87 - p.y * 0.31 - uPhase),
          0.65 * cos(p.x * 0.54 - p.y * 0.19 + uPhase)
            + 0.35 * sin(p.y * 0.78 + p.x * 0.37 - uPhase)
        );
      }

      void main() {
        vec3 p = position;
        // Evaluated only from shared position, never from per-face attributes.
        // Duplicated vertices consequently remain perfectly connected.
        p.z += uDisplacement * breathing(p.xy);
        // Height alone is nearly invisible through an overhead orthographic
        // camera. A smooth shared XY field makes the membrane visibly breathe.
        p.xy += drift(position.xy);
        vBarycentric = aBarycentric;
        vSeed = aSeed;
        vCenter = aCenter + drift(aCenter);
        vPosition = p;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `;

    const fragmentShader = /* glsl */`
      precision highp float;
      uniform float uPhase;
      uniform float uIridescence;
      uniform float uSpecular;
      uniform float uEdges;
      uniform float uSaturation;
      uniform vec3 uPalette[6];
      uniform float uPaletteCount;
      uniform float uOriginal;
      uniform float uGrayMode;
      uniform vec3 uTint;
      uniform float uTintAmount;
      uniform vec3 uViewDirection;
      varying vec3 vBarycentric;
      varying vec3 vPosition;
      varying float vSeed;
      varying vec2 vCenter;
      const float TAU = 6.283185307179586;

      float hash(float x) { return fract(sin(x * 127.1 + 311.7) * 43758.5453); }
      vec3 linearColor(vec3 c) {
        return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), c));
      }
      vec3 pastel(float t) {
        vec3 blush = vec3(0.961, 0.722, 0.816);
        vec3 rose = vec3(0.949, 0.663, 0.784);
        vec3 lavender = vec3(0.851, 0.710, 0.918);
        vec3 lilac = vec3(0.906, 0.784, 0.933);
        vec3 peach = vec3(0.965, 0.847, 0.788);
        vec3 ivory = vec3(1.000, 0.953, 0.910);
        if (t < 0.24) return mix(blush, rose, t / 0.24);
        if (t < 0.45) return mix(lavender, lilac, (t - 0.24) / 0.21);
        if (t < 0.72) return mix(peach, blush, (t - 0.45) / 0.27);
        return mix(ivory, lilac, (t - 0.72) / 0.28);
      }
      vec3 spectrum(float t) {
        // A broad, white-filled spectrum; never a saturated rainbow stripe.
        vec3 wave = 0.5 + 0.5 * cos(TAU * (t + vec3(0.02, 0.35, 0.67)));
        return mix(vec3(0.98, 0.97, 0.91), 0.48 + wave * 0.52, 0.88);
      }
      vec3 paletteColor(float t) {
        int index = int(clamp(floor(t * uPaletteCount), 0.0, uPaletteCount - 1.0));
        return uPalette[index];
      }
      vec3 flowingPalette(float t) {
        float x = fract(t) * uPaletteCount;
        float index = floor(x);
        vec3 a = paletteColor((index + 0.5) / uPaletteCount);
        vec3 b = paletteColor((mod(index + 1.0, uPaletteCount) + 0.5) / uPaletteCount);
        return mix(a, b, smoothstep(0.0, 1.0, fract(x)));
      }

      void main() {
        vec2 p = vPosition.xy;
        float id = vSeed;
        float r1 = hash(id * 71.0), r2 = hash(id * 113.0), r3 = hash(id * 193.0);
        // Derivatives give a truly flat normal for every animated triangle.
        vec3 n = normalize(cross(dFdx(vPosition), dFdy(vPosition)));
        if (n.z < 0.0) n = -n;
        vec3 view = uViewDirection;
        float phase = uPhase;
        vec3 light = normalize(vec3(-0.48 + 0.20 * cos(phase), 0.65 + 0.16 * sin(phase), 1.5));
        vec3 light2 = normalize(vec3(0.75, -0.35 + 0.22 * cos(phase), 1.15));
        float diffuse = dot(n, light);
        float fresnel = pow(1.0 - clamp(dot(n, view), 0.0, 1.0), 1.5);

        vec3 base = mix(paletteColor(id), pastel(id), uOriginal);
        // A translucent ivory underlayer softens the material without alpha.
        base = mix(base, vec3(0.98, 0.93, 0.90), (0.09 + 0.10 * r2) * uOriginal);
        float luminance = dot(base, vec3(0.2126, 0.7152, 0.0722));
        base = mix(vec3(luminance), base, uSaturation);
        vec3 color = linearColor(base);
        color *= 0.87 + 0.16 * diffuse + 0.05 * r1;

        // Reflection coordinates bend gently inside each face, while its normal
        // offsets the field sharply at folds. All motion is cyclic.
        vec2 local = p - vCenter;
        float optical = 0.16 * sin(p.x * 0.49 + p.y * 0.37 + 0.60 * sin(phase))
                      + 0.11 * cos(p.y * 0.64 - p.x * 0.18 + 0.58 * cos(phase));
        float film = dot(n.xy, vec2(0.85, -0.65)) + dot(local, vec2(0.30, 0.16));
        film += 0.16 * sin(local.x * 2.0 + local.y + id * 8.0) + optical;
        film += 0.10 * sin(phase + id * TAU);
        float pocket = smoothstep(0.59, 0.88, r1);
        float reflection = exp(-pow((film - 0.15 * sin(phase + r3 * TAU)) * 2.4, 2.0));
        float iridescence = uIridescence * pocket * (0.60 + 0.40 * reflection);
        vec3 customReflection = mix(base, flowingPalette(id + 0.11 + 0.03 * sin(phase)), 0.32);
        vec3 holo = linearColor(mix(customReflection, spectrum(film * 1.35 + r2 * 0.65), uOriginal));
        color = mix(color, holo, clamp(iridescence * (0.78 + fresnel), 0.0, 0.82));

        // Softbox lobes and a second translucent reflection create pearl depth.
        vec3 halfVector = normalize(light + view);
        float softbox = pow(max(dot(n, halfVector), 0.0), 18.0);
        float secondBox = pow(max(dot(n, normalize(light2 + view)), 0.0), 42.0);
        float ribbonPosition = dot(local, normalize(vec2(0.4 + r2, 1.0)))
                             + 0.22 * sin(phase + r1 * TAU) - (r3 - 0.5) * 0.9;
        float ribbon = exp(-pow(ribbonPosition / (0.035 + 0.07 * r2), 2.0));
        float gloss = uSpecular * (0.13 * softbox + 0.075 * secondBox
                    + 0.85 * ribbon * smoothstep(0.26, 0.85, r2));
        color = mix(color, linearColor(vec3(1.0, 0.988, 0.967)), gloss);

        // Reflected rectangular studio panels stretched into folded foil.
        // Their width and taper vary along each face, avoiding painted stripes.
        float panelCoordinate = dot(local, vec2(0.7 + r1, -0.5 + r3));
        panelCoordinate += 0.15 * sin(local.y * 1.7 + r2 * TAU)
                         + 0.12 * sin(phase + id * TAU);
        float panel = exp(-pow((panelCoordinate - (r1 - 0.5) * 0.7) / (0.09 + 0.06 * r3), 2.0));
        float panelMask = smoothstep(0.3, 0.85, r3) * (0.4 + 0.6 * softbox);
        color = mix(color, linearColor(vec3(1.0, 0.988, 0.96)), panel * panelMask * uSpecular * 0.62);

        // Pixel-sized pearl seams plus a wider, very faint folded-edge bevel.
        vec3 bary = vBarycentric;
        vec3 fw = max(fwidth(bary), vec3(0.00001));
        vec3 distancePx = bary / fw;
        float edgeDistance = min(distancePx.x, min(distancePx.y, distancePx.z));
        float edge = 1.0 - smoothstep(0.10, 1.10, edgeDistance);
        vec3 edgeWeights = vec3(0.35 + 0.65 * r1, 0.40 + 0.60 * r2, 0.30 + 0.70 * r3);
        vec3 nearEdge = 1.0 - smoothstep(vec3(0.5), vec3(2.1), distancePx);
        float selected = max(nearEdge.x * edgeWeights.x, max(nearEdge.y * edgeWeights.y, nearEdge.z * edgeWeights.z));
        float nearestBary = min(bary.x, min(bary.y, bary.z));
        float bevel = exp(-nearestBary * (35.0 + r1 * 35.0));
        float ridge = uEdges * (edge * (0.20 + 0.45 * selected) + bevel * 0.12 * (0.4 + diffuse));
        vec3 pearl = linearColor(mix(vec3(0.985), mix(vec3(1.0, 0.985, 0.950), vec3(1.0, 0.94, 0.97), r3), uOriginal));
        color = mix(color, pearl, clamp(ridge, 0.0, 0.90));

        // A bevel catches a tapered white reflection along one selected fold.
        // The adjacent face keeps its own normal and responds independently.
        float foldDistance = r2 < 0.33 ? bary.x : (r2 < 0.66 ? bary.y : bary.z);
        float foldAlong = r2 < 0.33 ? bary.y : (r2 < 0.66 ? bary.z : bary.x);
        float foldWidth = 0.008 + 0.062 * pow(max(foldAlong, 0.0), 1.6);
        float fold = exp(-pow(max(foldDistance, 0.0) / foldWidth, 1.3));
        float foldMask = smoothstep(0.15, 0.85, r1) * (0.5 + 0.5 * diffuse);
        color = mix(color, pearl, fold * foldMask * uEdges * 0.88);

        // A rare tapered reflection at a junction, attached to the mesh.
        float junction = exp(-bary.x * 65.0 - pow((bary.y - 0.085) * 28.0, 2.0));
        color = mix(color, vec3(1.0), junction * smoothstep(0.75, 0.98, r1) * uSpecular);
        // Preserve neutral facets in both black/white schemes, including under
        // colored reflections; the accent occupies only its assigned faces.
        if (uGrayMode > 0.5 && (uGrayMode < 1.5 || id < 5.0 / 6.0)) {
          color = vec3(dot(color, vec3(0.2126, 0.7152, 0.0722)));
        }
        color *= mix(vec3(1.0), uTint, uTintAmount);
        gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
        #include <colorspace_fragment>
      }
    `;

    material = new THREE.ShaderMaterial({
      uniforms: {
        uPhase: { value: 0 },
        uDisplacement: { value: CONFIG.displacementAmplitude },
        uLateralMotion: { value: CONFIG.lateralMotionAmplitude },
        uIridescence: { value: CONFIG.iridescenceIntensity },
        uSpecular: { value: CONFIG.specularStrength },
        uEdges: { value: CONFIG.edgeHighlightIntensity },
        uSaturation: { value: CONFIG.pastelSaturation },
        uPalette: { value: Array.from({ length: 6 }, () => new THREE.Vector3(1, 1, 1)) },
        uPaletteCount: { value: 6 },
        uOriginal: { value: 1 },
        uGrayMode: { value: 0 },
        uTint: { value: new THREE.Color(1, 1, 1) },
        uTintAmount: { value: 0 },
        uViewDirection: { value: new THREE.Vector3(0, 0, 1) }
      },
      vertexShader, fragmentShader,
      side: THREE.DoubleSide,
      depthTest: false, depthWrite: false
    });
    mesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
    mesh.frustumCulled = false;
    scene.add(mesh);

    function refreshPanel() {
      gui?.controllersRecursive().forEach(controller => controller.updateDisplay());
    }

    function applyPalette(loadScheme = true) {
      if (loadScheme) {
        const colors = SCHEMES[settings.scheme];
        paletteCount = colors.length;
        for (let i = 0; i < 6; i++) {
          let hex = colors[Math.min(i, colors.length - 1)];
          if (settings.invert) {
            if (settings.scheme.startsWith('Achromatic')) {
              if (!(settings.scheme === 'Achromatic + Accent' && i === 5)) {
                hex = (0xffffff ^ parseInt(hex, 16)).toString(16).padStart(6, '0');
              }
            } else hex = colors[Math.max(0, colors.length - 1 - i)];
          }
          paletteSettings['color' + (i + 1)] = '#' + hex;
        }
        paletteEdited = false;
      }
      for (let i = 0; i < 6; i++) {
        const hex = parseInt(paletteSettings['color' + (i + 1)].slice(1), 16);
        // Palette values remain sRGB until the fragment shader converts them.
        material.uniforms.uPalette.value[i].set((hex >> 16 & 255) / 255, (hex >> 8 & 255) / 255, (hex & 255) / 255);
      }
      material.uniforms.uPaletteCount.value = paletteCount;
      material.uniforms.uOriginal.value = settings.scheme === 'Original' && !settings.invert && !paletteEdited ? 1 : 0;
      material.uniforms.uGrayMode.value = settings.scheme === 'Achromatic' ? 1 : (settings.scheme === 'Achromatic + Accent' ? 2 : 0);
      refreshPanel();
      wake();
    }

    function selectScheme(name) {
      if (!Object.hasOwn(SCHEMES, name)) throw new RangeError('Unknown color scheme.');
      settings.scheme = name;
      settings.pastelSaturation = name === 'Original' ? 0.88 : 1;
      settings.tint = '#ffffff'; settings.tintAmount = 0;
      applyPalette();
    }

    function selectAnimation(name) {
      if (!ANIMATIONS.includes(name)) throw new RangeError('Unknown animation.');
      if (name === 'Static') staticPhase = material.uniforms.uPhase.value;
      settings.animation = name;
      refreshPanel(); wake();
    }

    function applyBackground() {
      const color = settings.greenscreen ? '#00ff00' : settings.background;
      renderer.setClearColor(color, 1);
      document.body.style.background = color;
      wake();
    }

    function resizeBuffer() {
      // Explicit DPR is honored; the user can lower it on slower devices.
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(Math.max(1, innerWidth), Math.max(1, innerHeight));
      wake();
    }

    function rebuildGeometry() {
      const old = mesh.geometry;
      mesh.geometry = makeGeometry(worldWidth, worldHeight);
      old.dispose();
      wake();
    }

    function resize() {
      resizePending = false;
      resizeBuffer();
      worldHeight = 10;
      worldWidth = worldHeight * Math.max(1, innerWidth) / Math.max(1, innerHeight);
      camera.left = -worldWidth / 2; camera.right = worldWidth / 2;
      camera.top = worldHeight / 2; camera.bottom = -worldHeight / 2;
      camera.updateProjectionMatrix();
      rebuildGeometry();
    }

    const cameraTarget = new THREE.Vector3();
    const screenRight = new THREE.Vector3(), screenUp = new THREE.Vector3();
    const radians = THREE.MathUtils.degToRad;
    const clamp = THREE.MathUtils.clamp;

    function updateCamera(phase) {
      const mode = settings.animation, amount = settings.cameraMotion;
      let tilt = radians(settings.angle), yaw = radians(settings.azimuth);
      let roll = radians(settings.roll), focus = 1;
      cameraTarget.set(0, 0, 0);
      if (mode === 'Orbit') {
        yaw += phase;
        tilt += radians(22) * amount;
      } else if (mode === 'Pendulum') {
        yaw += 0.28 * Math.sin(phase) * amount;
        tilt += (0.18 + 0.12 * Math.sin(phase)) * amount;
      } else if (mode === 'Slow roll') {
        roll += 0.10 * Math.sin(phase) * amount;
      } else if (mode === 'Prismatic drift') {
        cameraTarget.set(0.35 * Math.sin(phase) * amount, 0.22 * Math.cos(phase) * amount, 0);
      } else if (mode === 'Floating focus') {
        focus = Math.exp(0.09 * Math.sin(phase) * amount);
        tilt += 0.06 * Math.sin(phase) * amount;
      }
      tilt = clamp(tilt, radians(-70), radians(70));
      camera.position.set(
        16 * Math.sin(tilt) * Math.cos(yaw),
        16 * Math.sin(tilt) * Math.sin(yaw),
        16 * Math.cos(tilt)
      ).add(cameraTarget);
      camera.up.set(0, 1, 0);
      camera.lookAt(cameraTarget);
      camera.rotateZ(roll);
      // Zoom is a persistent user multiplier, including during camera animation.
      camera.zoom = settings.zoom * focus;
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
      screenRight.setFromMatrixColumn(camera.matrixWorld, 0);
      screenUp.setFromMatrixColumn(camera.matrixWorld, 1);
      mesh.position.copy(screenRight).multiplyScalar(settings.panX).addScaledVector(screenUp, settings.panY);
      mesh.scale.setScalar(settings.surfaceScale);
      camera.getWorldDirection(material.uniforms.uViewDirection.value).negate();
    }

    function renderAt(seconds) {
      if (disposed || contextLost) return;
      if (resizePending) resize();
      const cycles = seconds / settings.loopDuration;
      const phase = settings.animation === 'Static' ? staticPhase : ((cycles % 1 + 1) % 1) * TAU;
      const tide = settings.animation === 'Pearl tide' ? 1.45 : 1;
      const u = material.uniforms;
      u.uPhase.value = phase;
      u.uDisplacement.value = settings.displacementAmplitude * tide;
      u.uLateralMotion.value = settings.lateralMotionAmplitude * tide;
      u.uIridescence.value = settings.iridescenceIntensity;
      u.uSpecular.value = settings.specularStrength;
      u.uEdges.value = settings.edgeHighlightIntensity;
      u.uSaturation.value = settings.pastelSaturation;
      u.uTint.value.set(settings.tint);
      u.uTintAmount.value = settings.tintAmount;
      updateCamera(phase);
      renderer.render(scene, camera);
    }

    function tick(now) {
      frame = 0;
      if (disposed || document.hidden || contextLost) return;
      // Integrating speed, rather than multiplying total time, avoids jumps when
      // the speed slider changes. Camera and material share the same timeline.
      if (previousTime !== null && !paused) elapsed += (now - previousTime) * 0.001 * settings.animationSpeed;
      previousTime = now;
      renderAt(elapsed);
      if (!paused && !frame) frame = requestAnimationFrame(tick);
    }
    function wake() {
      if (!frame && !disposed && !document.hidden && !contextLost) {
        previousTime = null;
        frame = requestAnimationFrame(tick);
      }
    }
    function onResize() { resizePending = true; wake(); }
    function onVisibility() {
      cancelAnimationFrame(frame); frame = 0; previousTime = null;
      if (!document.hidden) wake();
    }
    function onContextLost(event) {
      event.preventDefault(); contextLost = true;
      cancelAnimationFrame(frame); frame = 0;
    }
    function onContextRestored() { contextLost = false; resizePending = true; wake(); }

    function resetView() {
      Object.assign(settings, { zoom: 1, angle: 0, azimuth: 0, roll: 0, panX: 0, panY: 0, surfaceScale: 1 });
      refreshPanel(); wake();
    }

    function randomize() {
      const seed = crypto.getRandomValues(new Uint32Array(1))[0];
      const random = seededRandom(seed);
      const names = Object.keys(SCHEMES);
      Object.assign(settings, {
        seed,
        triangleDensity: Math.round(180 + random() * 300),
        irregularity: 0.62 + random() * 0.36,
        foldDepth: 0.45 + random() * 0.75,
        displacementAmplitude: 0.14 + random() * 0.24,
        lateralMotionAmplitude: 0.09 + random() * 0.16,
        animationSpeed: 0.55 + random() * 0.65,
        cameraMotion: 0.4 + random() * 0.65,
        iridescenceIntensity: 0.4 + random() * 0.55,
        specularStrength: 0.3 + random() * 0.45,
        edgeHighlightIntensity: 0.4 + random() * 0.5,
        invert: false
      });
      for (const key of ['irregularity', 'foldDepth', 'displacementAmplitude', 'lateralMotionAmplitude',
        'animationSpeed', 'cameraMotion', 'iridescenceIntensity', 'specularStrength', 'edgeHighlightIntensity']) {
        settings[key] = Math.round(settings[key] * 100) / 100;
      }
      selectScheme(names[Math.floor(random() * names.length)]);
      selectAnimation(ANIMATIONS[Math.floor(random() * (ANIMATIONS.length - 1))]);
      settings.background = settings.scheme === 'Original' ? '#efd4e0' :
        (settings.scheme === 'Neutral + accent' ? '#202620' : '#' + SCHEMES[settings.scheme][0]);
      applyBackground(); rebuildGeometry(); refreshPanel();
    }

    const canvas = renderer.domElement;
    let pointer = null;
    function onPointerDown(event) {
      if (pointer || (event.button !== 0 && event.button !== 2)) return;
      pointer = { id: event.pointerId, x: event.clientX, y: event.clientY,
        startX: event.clientX, startY: event.clientY, moved: false,
        rotate: event.button === 2 || event.shiftKey };
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
    }
    function onPointerMove(event) {
      if (!pointer || event.pointerId !== pointer.id) return;
      const dx = event.clientX - pointer.x, dy = event.clientY - pointer.y;
      if (Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) > 5) pointer.moved = true;
      if (pointer.moved) {
        if (pointer.rotate) {
          settings.azimuth = ((settings.azimuth + dx * 0.35 + 540) % 360) - 180;
          settings.angle = clamp(settings.angle + dy * 0.25, 0, 65);
        } else {
          settings.panX += dx * worldWidth / (Math.max(1, innerWidth) * camera.zoom);
          settings.panY -= dy * worldHeight / (Math.max(1, innerHeight) * camera.zoom);
        }
        refreshPanel(); wake();
      }
      pointer.x = event.clientX; pointer.y = event.clientY;
    }
    function finishPointer(event, cancelled = false) {
      if (!pointer || event.pointerId !== pointer.id) return;
      const click = !cancelled && !pointer.moved && !pointer.rotate;
      pointer = null;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      canvas.classList.remove('dragging');
      if (click && settings.randomizeOnClick) randomize();
    }
    function onPointerUp(event) { finishPointer(event); }
    function onPointerCancel(event) { finishPointer(event, true); }
    function onWheel(event) {
      event.preventDefault();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
      const oldZoom = settings.zoom, oldEffectiveZoom = camera.zoom;
      settings.zoom = clamp(oldZoom * Math.exp(-clamp(delta, -500, 500) * 0.0012), 0.2, 5);
      const newEffectiveZoom = oldEffectiveZoom * settings.zoom / oldZoom;
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * 2 - 1;
      const y = 1 - (event.clientY - rect.top) / rect.height * 2;
      settings.panX += x * worldWidth * 0.5 * (1 / newEffectiveZoom - 1 / oldEffectiveZoom);
      settings.panY += y * worldHeight * 0.5 * (1 / newEffectiveZoom - 1 / oldEffectiveZoom);
      refreshPanel(); wake();
    }
    function onContextMenu(event) { event.preventDefault(); }
    function onKeyDown(event) {
      if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      const target = event.target;
      if (target instanceof HTMLElement && (target.isContentEditable || target.tagName === 'TEXTAREA' ||
        (target instanceof HTMLInputElement && ['text', 'number', 'color'].includes(target.type)))) return;
      uiVisible = !uiVisible;
      gui.show(uiVisible);
    }

    // Stock lil-gui appearance; only settings are displayed over the artwork.
    gui = new GUI({ title: 'Opaline', width: 280 });
    const appearance = gui.addFolder('Appearance');
    appearance.add(settings, 'scheme', Object.keys(SCHEMES)).name('Color scheme').onChange(selectScheme);
    appearance.add(settings, 'invert').name('Reverse light / dark').onChange(() => applyPalette());
    appearance.addColor(settings, 'background').name('Background').onChange(applyBackground);
    appearance.add(settings, 'greenscreen').name('Greenscreen').onChange(applyBackground);
    appearance.addColor(settings, 'tint').name('Color tint').onChange(() => {
      if (settings.tintAmount === 0) settings.tintAmount = 0.4;
      refreshPanel(); wake();
    });
    appearance.add(settings, 'tintAmount', 0, 1, 0.01).name('Tint amount').onChange(wake);
    const paletteFolder = appearance.addFolder('Palette colors').close();
    applyPalette();
    for (let i = 1; i <= 6; i++) {
      paletteFolder.addColor(paletteSettings, 'color' + i).name('Color ' + i).onChange(() => {
        paletteEdited = true;
        if (i > paletteCount) paletteCount = i;
        applyPalette(false);
      });
    }
    const animation = gui.addFolder('Animation');
    animation.add(settings, 'animation', ANIMATIONS).name('Motion').onChange(selectAnimation);
    animation.add(settings, 'animationSpeed', 0, 2, 0.01).name('Speed').onChange(wake);
    animation.add(settings, 'cameraMotion', 0, 1.5, 0.01).name('Camera motion').onChange(wake);
    animation.add(settings, 'loopDuration', 20, 120, 1).name('Loop duration').onChange(wake);
    const view = gui.addFolder('View').close();
    view.add(settings, 'zoom', 0.2, 5, 0.01).name('Zoom').onChange(wake);
    view.add(settings, 'angle', 0, 65, 0.1).name('Camera angle').onChange(wake);
    view.add(settings, 'azimuth', -180, 180, 0.1).name('Orbit angle').onChange(wake);
    view.add(settings, 'roll', -180, 180, 0.1).name('Roll').onChange(wake);
    view.add(settings, 'panX', -30, 30, 0.01).name('Position X').onChange(wake);
    view.add(settings, 'panY', -30, 30, 0.01).name('Position Y').onChange(wake);
    view.add(settings, 'surfaceScale', 0.2, 1.6, 0.01).name('Surface scale').onChange(wake);
    view.add({ resetView }, 'resetView').name('Reset view');
    const surface = gui.addFolder('Crystal surface').close();
    surface.add(settings, 'triangleDensity', 80, 650, 1).name('Triangle density').onFinishChange(rebuildGeometry);
    surface.add(settings, 'foldDepth', 0.1, 1.4, 0.01).name('Fold depth').onFinishChange(rebuildGeometry);
    surface.add(settings, 'irregularity', 0.3, 0.99, 0.01).name('Irregularity').onFinishChange(rebuildGeometry);
    surface.add(settings, 'displacementAmplitude', 0, 0.6, 0.01).name('Breathing').onChange(wake);
    surface.add(settings, 'lateralMotionAmplitude', 0, 0.35, 0.01).name('Facet drift').onChange(wake);
    surface.add(settings, 'iridescenceIntensity', 0, 1.2, 0.01).name('Iridescence').onChange(wake);
    surface.add(settings, 'specularStrength', 0, 1, 0.01).name('Pearl reflections').onChange(wake);
    surface.add(settings, 'edgeHighlightIntensity', 0, 1, 0.01).name('Luminous edges').onChange(wake);
    surface.add(settings, 'pastelSaturation', 0, 1.5, 0.01).name('Saturation').onChange(wake);
    const rendering = gui.addFolder('Rendering').close();
    rendering.add(settings, 'pixelRatio', { '0.5': 0.5, '0.75': 0.75, '1': 1, '1.25': 1.25, '1.5': 1.5, '2': 2, '2.5': 2.5, '3': 3 }).name('DPR / Pixel ratio').onChange(resizeBuffer);
    const variation = gui.addFolder('Variation');
    variation.add(settings, 'randomizeOnClick').name('Randomize on click');
    variation.add({ randomize }, 'randomize').name('New variation');

    function dispose() {
      if (disposed) return;
      disposed = true;
      cancelAnimationFrame(frame);
      removeEventListener('resize', onResize);
      removeEventListener('keydown', onKeyDown, true);
      document.removeEventListener('visibilitychange', onVisibility);
      canvas.removeEventListener('webglcontextlost', onContextLost);
      canvas.removeEventListener('webglcontextrestored', onContextRestored);
      canvas.removeEventListener('pointerdown', onPointerDown);
      canvas.removeEventListener('pointermove', onPointerMove);
      canvas.removeEventListener('pointerup', onPointerUp);
      canvas.removeEventListener('pointercancel', onPointerCancel);
      canvas.removeEventListener('lostpointercapture', onPointerCancel);
      canvas.removeEventListener('wheel', onWheel);
      canvas.removeEventListener('contextmenu', onContextMenu);
      gui.destroy();
      mesh.geometry.dispose(); material.dispose(); renderer.dispose(); canvas.remove();
      delete window.crystalMosaic;
    }

    addEventListener('resize', onResize, { passive: true });
    addEventListener('keydown', onKeyDown, true);
    document.addEventListener('visibilitychange', onVisibility);
    canvas.addEventListener('webglcontextlost', onContextLost);
    canvas.addEventListener('webglcontextrestored', onContextRestored);
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerCancel);
    canvas.addEventListener('lostpointercapture', onPointerCancel);
    canvas.addEventListener('wheel', onWheel, { passive: false });
    canvas.addEventListener('contextmenu', onContextMenu);

    window.crystalMosaic = Object.freeze({
      config: settings,
      schemes: Object.freeze(Object.keys(SCHEMES)),
      animations: Object.freeze([...ANIMATIONS]),
      pause() { paused = true; cancelAnimationFrame(frame); frame = 0; previousTime = null; },
      play() { paused = false; wake(); },
      renderAt(seconds) {
        if (!Number.isFinite(seconds)) throw new TypeError('Time must be finite.');
        elapsed = seconds; previousTime = null; renderAt(seconds);
      },
      selectScheme, selectAnimation, randomize, resetView,
      get triangleCount() { return mesh.geometry.getAttribute('position').count / 3; },
      get view() { return { zoom: camera.zoom, angle: settings.angle, azimuth: settings.azimuth, panX: settings.panX, panY: settings.panY }; },
      dispose
    });
    applyBackground();
    renderAt(0);
    wake();
  } catch (error) {
    gui?.destroy();
    mesh?.geometry.dispose();
    material?.dispose();
    renderer?.dispose();
    showError(error);
  }
})();
</script>
</body>
</html>
