        smokeHighlight: '#E0FBFF',
        coolLight: '#00F0FF',
        warmLight: '#D40078',
        rimLight: '#E0FBFF',
        ambient: '#100520',
        background: '#05020F'
      }
    };

    // =========================================================================
    // 4. GLOBAL PARAMETERS & APPLICATION STATE
    // =========================================================================
    const initialScheme = colorSchemes['Original (Blue & Amber)'];

    const params = {
      // Color & Theme
      colorScheme: 'Original (Blue & Amber)',
      greenScreen: false,
      backgroundColor: initialScheme.background,

      // Smoke Tone & Appearance
      smokeTone: 'Natural / Default',
      smokeBaseColor: initialScheme.smokeBase,
      smokeHighlightColor: initialScheme.smokeHighlight,
      smokeDensity: 1.0,
      lowerBedDensity: 1.25,
      wispOpacity: 0.9,
      turbulence: 1.0,
      swirlVorticity: 1.0,
      plumeSpread: 1.0,
      riseSpeed: 1.0,

      // Lighting & Exposure
      exposure: 1.1,
      masterIntensity: 1.0,
      coolLightColor: initialScheme.coolLight,
      coolLightIntensity: 1.8,
      warmLightColor: initialScheme.warmLight,
      warmLightIntensity: 1.8,
      rimLightColor: initialScheme.rimLight,
      rimLightIntensity: 1.2,
      ambientColor: initialScheme.ambient,
      ambientIntensity: 0.45,

      // Camera & Animation
      cameraAnimation: 'Slow Orbit',
      animationSpeed: 1.0,

      // Renderer & System
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true,
      randomizeOnClick: true
    };

    // =========================================================================
    // 5. THREE.JS SCENE SETUP & SHADERS
    // =========================================================================
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.8, 7.5);

    let renderer = new THREE.WebGLRenderer({
      antialias: params.antialias,
      powerPreference: 'high-performance',
      alpha: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    container.appendChild(renderer.domElement);

    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.2, 0);
    controls.minDistance = 1.5;
    controls.maxDistance = 25.0;

    // --- PostProcessor Suite Instance ---
    let postProcessor = new PostProcessor(renderer, {
      enabled: true,
      bloomEnabled: true,
      bloomStrength: 1.15,
      bloomRadius: 0.65,
      bloomThreshold: 0.22,
      raysEnabled: true,
      raysStrength: 0.65,
      raysThreshold: 0.18,
      anamorphicEnabled: false, // Default is strictly OFF as requested
      anamorphicIntensity: 4.0,
      anamorphicThreshold: 0.3,
      chromaticAberration: 0.012,
      vignetteBoost: 1.08,
      vignetteReduction: 0.5,
      noiseIntensity: 0.012,
      gamma: 1.0
    });
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

    // Light Positions in 3D Space
    const coolLightPos = new THREE.Vector3(-5.5, 1.8, 2.2);
    const warmLightPos = new THREE.Vector3(5.5, 1.2, 2.2);
    const rimLightPos = new THREE.Vector3(0.0, 3.5, -5.0);

    // =========================================================================
    // 6. CUSTOM SHADER MATERIAL FOR VOLUMETRIC SMOKE BILLOWS
    // =========================================================================
    const smokeVertexShader = `
      attribute float aScale;
      attribute float aRotation;
      attribute float aAlpha;
      attribute float aType;

      varying vec2 vUv;
      varying float vAlpha;
      varying float vType;
      varying vec3 vWorldPos;
      varying vec3 vNormal;

      void main() {
        vUv = uv;
        vAlpha = aAlpha;
        vType = aType;

        // Camera billboard orientation vectors
        vec3 camRight = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 camUp = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        vec3 camForward = vec3(viewMatrix[0][2], viewMatrix[1][2], viewMatrix[2][2]);

        // Billboard 2D rotation
        float c = cos(aRotation);
        float s = sin(aRotation);
        vec2 centeredUv = uv - 0.5;
        vec2 rotUv = vec2(
          centeredUv.x * c - centeredUv.y * s,
          centeredUv.x * s + centeredUv.y * c
        );

        vec3 worldOffset = (camRight * rotUv.x + camUp * rotUv.y) * aScale;
        vec3 worldPos = position + worldOffset;
        vWorldPos = worldPos;

        // Approximate spherical surface normal for 3D volumetric lighting
        vec2 norm2D = rotUv * 2.0;
        float normZ = sqrt(max(0.01, 1.0 - dot(norm2D, norm2D)));
        vNormal = normalize(camRight * norm2D.x + camUp * norm2D.y + camForward * normZ);

        gl_Position = projectionMatrix * viewMatrix * vec4(worldPos, 1.0);
      }
    `;

    const smokeFragmentShader = `
      uniform sampler2D uTexPuff;
      uniform sampler2D uTexVortex;
      uniform sampler2D uTexTendril;
      uniform sampler2D uTexAiry;

      uniform vec3 uCoolLightColor;
      uniform vec3 uCoolLightPos;
      uniform float uCoolLightIntensity;

      uniform vec3 uWarmLightColor;
      uniform vec3 uWarmLightPos;
      uniform float uWarmLightIntensity;

      uniform vec3 uRimLightColor;
      uniform vec3 uRimLightPos;
      uniform float uRimLightIntensity;

      uniform vec3 uAmbientColor;
      uniform float uAmbientIntensity;

      uniform vec3 uSmokeBaseColor;
      uniform vec3 uSmokeHighlightColor;
      uniform float uSmokeDensity;
      uniform float uMasterIntensity;

      varying vec2 vUv;
      varying float vAlpha;
      varying float vType;
      varying vec3 vWorldPos;
      varying vec3 vNormal;

      void main() {
        vec4 texSample;
        if (vType < 0.5) {
          texSample = texture2D(uTexPuff, vUv);
        } else if (vType < 1.5) {
          texSample = texture2D(uTexVortex, vUv);
        } else if (vType < 2.5) {
          texSample = texture2D(uTexTendril, vUv);
        } else {
          texSample = texture2D(uTexAiry, vUv);
        }

        if (texSample.a < 0.005) discard;

        vec3 N = normalize(vNormal);
        vec3 V = normalize(cameraPosition - vWorldPos);

        // Light directions
        vec3 L_cool = normalize(uCoolLightPos - vWorldPos);
        vec3 L_warm = normalize(uWarmLightPos - vWorldPos);
        vec3 L_rim = normalize(uRimLightPos - vWorldPos);

        // Volumetric Subsurface Half-Lambert scattering
        float diffCool = pow(max(0.0, dot(N, L_cool) * 0.55 + 0.45), 1.6);
        float diffWarm = pow(max(0.0, dot(N, L_warm) * 0.55 + 0.45), 1.6);

        // Forward and translucent Fresnel scattering
        float fresnel = pow(1.0 - max(0.0, dot(N, V)), 2.2);
        float rimCool = fresnel * max(0.0, dot(-L_cool, V) * 0.6 + 0.4) * 1.5;
        float rimWarm = fresnel * max(0.0, dot(-L_warm, V) * 0.6 + 0.4) * 1.5;
        float backScatter = pow(max(0.0, dot(V, -L_rim)), 3.5) * 2.0;

        // Base smoke color blended by density texture
        vec3 smokeAlbedo = mix(uSmokeBaseColor, uSmokeHighlightColor, texSample.r);

        // Lighting composition: soft side blue + warm amber + rim
        vec3 ambient = uAmbientColor * uAmbientIntensity;
        vec3 coolLight = uCoolLightColor * uCoolLightIntensity * (diffCool + rimCool);
        vec3 warmLight = uWarmLightColor * uWarmLightIntensity * (diffWarm + rimWarm);
        vec3 rimLight = uRimLightColor * uRimLightIntensity * (backScatter + fresnel * 0.6);

        vec3 finalColor = smokeAlbedo * (ambient + coolLight + warmLight + rimLight) * uMasterIntensity;

        float finalAlpha = texSample.a * vAlpha * uSmokeDensity;
        finalAlpha = clamp(finalAlpha, 0.0, 0.98);

        gl_FragColor = vec4(finalColor, finalAlpha);
      }
    `;

    const smokeUniforms = {
      uTexPuff: { value: texPuff },
      uTexVortex: { value: texVortex },
      uTexTendril: { value: texTendril },
      uTexAiry: { value: texAiry },

      uCoolLightColor: { value: new THREE.Color(params.coolLightColor) },
      uCoolLightPos: { value: coolLightPos },
      uCoolLightIntensity: { value: params.coolLightIntensity },

      uWarmLightColor: { value: new THREE.Color(params.warmLightColor) },
      uWarmLightPos: { value: warmLightPos },
      uWarmLightIntensity: { value: params.warmLightIntensity },

      uRimLightColor: { value: new THREE.Color(params.rimLightColor) },
      uRimLightPos: { value: rimLightPos },
      uRimLightIntensity: { value: params.rimLightIntensity },

      uAmbientColor: { value: new THREE.Color(params.ambientColor) },
      uAmbientIntensity: { value: params.ambientIntensity },

      uSmokeBaseColor: { value: new THREE.Color(params.smokeBaseColor) },
      uSmokeHighlightColor: { value: new THREE.Color(params.smokeHighlightColor) },
      uSmokeDensity: { value: params.smokeDensity },
      uMasterIntensity: { value: params.masterIntensity }
    };

    const smokeMaterial = new THREE.ShaderMaterial({
      vertexShader: smokeVertexShader,
      fragmentShader: smokeFragmentShader,
      uniforms: smokeUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending
    });

    // =========================================================================
    // 7. PARTICLES DYNAMICS SYSTEM (VOLUMETRIC PUFFS, VORTICES, CLUMPS)
    // =========================================================================
    const PARTICLE_COUNT = 300;

    const baseQuad = new THREE.PlaneGeometry(1, 1);
    const instancedSmokeGeometry = new THREE.InstancedBufferGeometry();
    instancedSmokeGeometry.index = baseQuad.index;
    instancedSmokeGeometry.attributes.position = baseQuad.attributes.position;
    instancedSmokeGeometry.attributes.uv = baseQuad.attributes.uv;

    const instPos = new Float32Array(PARTICLE_COUNT * 3);
    const instScale = new Float32Array(PARTICLE_COUNT);
    const instRotation = new Float32Array(PARTICLE_COUNT);
    const instAlpha = new Float32Array(PARTICLE_COUNT);
    const instType = new Float32Array(PARTICLE_COUNT);

    const aPosAttr = new THREE.InstancedBufferAttribute(instPos, 3);
    const aScaleAttr = new THREE.InstancedBufferAttribute(instScale, 1);
    const aRotAttr = new THREE.InstancedBufferAttribute(instRotation, 1);
    const aAlphaAttr = new THREE.InstancedBufferAttribute(instAlpha, 1);
    const aTypeAttr = new THREE.InstancedBufferAttribute(instType, 1);

    instancedSmokeGeometry.setAttribute('position', baseQuad.attributes.position);
    instancedSmokeGeometry.setAttribute('aScale', aScaleAttr);
    instancedSmokeGeometry.setAttribute('aRotation', aRotAttr);
    instancedSmokeGeometry.setAttribute('aAlpha', aAlphaAttr);
    instancedSmokeGeometry.setAttribute('aType', aTypeAttr);

    class SmokeParticle {
      constructor(id) {
        this.id = id;
        this.reset(true);
      }

      reset(initialSetup = false) {
        const rnd = Math.random();
        if (rnd < 0.42) this.type = 0; // 42% Dense billowed puffs
        else if (rnd < 0.68) this.type = 1; // 26% Swirling vortex clumps
        else if (rnd < 0.88) this.type = 2; // 20% Tendril streamers
        else this.type = 3; // 12% Airy dispersing wisps

        if (initialSetup) {
          // Distribute across vertical plume immediately so scene starts fully active
          const hBias = Math.pow(Math.random(), 1.6);
          this.y = -2.8 + hBias * 6.5;
        } else {
          this.y = -2.8 + Math.random() * 0.7;
        }

        this.vortexAngle = Math.random() * Math.PI * 2;
        this.vortexRadius = 0.2 + Math.random() * 1.5;
        this.vortexSpeed = (Math.random() - 0.5) * 1.1;

        this.x = Math.cos(this.vortexAngle) * this.vortexRadius;
        this.z = Math.sin(this.vortexAngle) * this.vortexRadius;

        this.baseRiseSpeed = 0.35 + Math.random() * 0.45;
        this.baseScale = (this.type === 0 ? 2.6 + Math.random() * 2.2 :
                          this.type === 1 ? 2.0 + Math.random() * 1.6 :
                          this.type === 2 ? 1.5 + Math.random() * 1.5 :
                                            1.1 + Math.random() * 1.3);

        this.scale = this.baseScale;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.25;

        this.life = initialSetup ? Math.random() : 0.0;
        this.maxLife = 8.0 + Math.random() * 6.0;
        this.alpha = 0.0;

        // Detaching puff logic: some clumps peel off and float laterally
        this.isDetaching = (Math.random() < 0.28);
        this.detachAngle = Math.random() * Math.PI * 2;
        this.detachSpeed = 0.2 + Math.random() * 0.45;
      }

      update(dt, time) {
        this.life += dt / this.maxLife;

        // Upward ascent: smoke accelerates in convective core then eases
        const riseMultiplier = (this.y < 0 ? 1.0 : (this.y < 2.5 ? 1.25 : 0.85)) * params.riseSpeed;
        this.y += this.baseRiseSpeed * riseMultiplier * dt;

        // Rotation of billboard
        this.rotation += this.rotSpeed * params.animationSpeed * dt;

        // Swirling vortices around vertical convection axis
        const swirlFactor = params.swirlVorticity * (1.0 + Math.max(0, this.y) * 0.2);
        this.vortexAngle += (this.vortexSpeed * 0.6 + 0.35) * swirlFactor * dt;

        // Curl noise lateral turbulence
        const curlX = Math.sin(this.y * 1.2 + time * 0.85 + this.id) * 0.28 * params.turbulence;
        const curlZ = Math.cos(this.y * 1.1 + time * 0.75 + this.id * 1.3) * 0.28 * params.turbulence;

        // Detaching puffs peeling away from the central column
        let detachX = 0, detachZ = 0;
        if (this.isDetaching && this.y > 0.1) {
          const detachAmount = Math.min(1.8, (this.y - 0.1) * this.detachSpeed);
          detachX = Math.cos(this.detachAngle) * detachAmount * params.plumeSpread;
          detachZ = Math.sin(this.detachAngle) * detachAmount * params.plumeSpread;
        }

        // Plume spread expanding with height
        const radiusGrowth = 1.0 + Math.max(0, this.y + 2.0) * 0.38 * params.plumeSpread;
        const curRadius = this.vortexRadius * radiusGrowth;

        this.x = Math.cos(this.vortexAngle) * curRadius + curlX + detachX;
        this.z = Math.sin(this.vortexAngle) * curRadius + curlZ + detachZ;

        // Scale expansion as pressure drops
        this.scale = this.baseScale * (1.0 + Math.max(0, this.y + 2.0) * 0.35);

        // Alpha calculation:
        // - Lower third (y < 0): dense smoke filling the lower third
        // - Middle third (y in 0 to 2.8): swirling ribbons and detaching clumps
        // - Upper half (y > 2.8): dissipates completely; upper half is clean
        let heightAlpha;
        if (this.y < -1.4) {
          heightAlpha = 0.95 * params.lowerBedDensity;
        } else if (this.y < 0.4) {
          heightAlpha = 0.82 * params.lowerBedDensity;
        } else if (this.y < 2.6) {
          const t = (this.y - 0.4) / 2.2;
          heightAlpha = THREE.MathUtils.lerp(0.72, 0.22, t) * params.wispOpacity;
        } else {
          // Fades out into thin air; top half remains clear
          const t = Math.min(1.0, (this.y - 2.6) / 2.0);
          heightAlpha = Math.pow(1.0 - t, 2.8) * 0.22 * params.wispOpacity;
        }

        const fadeIn = Math.min(1.0, Math.max(0.0, (this.y - (-2.8)) / 0.5));
        this.alpha = heightAlpha * fadeIn;

        // Recycle when cycle completes or past ceiling
        if (this.y > 5.0 || this.life >= 1.0) {
          this.reset(false);
        }
      }
    }

    const particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new SmokeParticle(i));
    }

    const smokeMesh = new THREE.Mesh(instancedSmokeGeometry, smokeMaterial);
    smokeMesh.frustumCulled = false;
    scene.add(smokeMesh);

    // (Tendril ribbons removed to eliminate unnatural line artifacts; wisps are rendered as soft volumetric particles)


    // =========================================================================
    // 9. ATMOSPHERIC DUST MOTES
    // =========================================================================
    const MOTE_COUNT = 180;
    const moteGeom = new THREE.BufferGeometry();
    const motePos = new Float32Array(MOTE_COUNT * 3);
    const moteSeeds = [];

    for (let i = 0; i < MOTE_COUNT; i++) {
      motePos[i * 3] = (Math.random() - 0.5) * 4.5;
      motePos[i * 3 + 1] = -2.5 + Math.random() * 6.5;
      motePos[i * 3 + 2] = (Math.random() - 0.5) * 4.5;
      moteSeeds.push({
        baseX: motePos[i * 3],
        baseZ: motePos[i * 3 + 2],
        speed: 0.15 + Math.random() * 0.25,
        phase: Math.random() * Math.PI * 2
      });
    }

    moteGeom.setAttribute('position', new THREE.BufferAttribute(motePos, 3));

    // Circular Particle Texture for round, soft glowing motes
    function createCircleParticleTexture(size = 64) {
      const cvs = document.createElement('canvas');
      cvs.width = size;
      cvs.height = size;
      const ctx = cvs.getContext('2d');
      const center = size / 2;
      const grad = ctx.createRadialGradient(center, center, 0, center, center, center);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.25, 'rgba(255, 255, 255, 0.85)');
      grad.addColorStop(0.65, 'rgba(255, 255, 255, 0.25)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    const circleParticleTexture = createCircleParticleTexture(64);

    const moteMaterial = new THREE.PointsMaterial({
      map: circleParticleTexture,
      color: new THREE.Color(params.coolLightColor).lerp(new THREE.Color(params.warmLightColor), 0.5),
      size: 0.12,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const motePoints = new THREE.Points(moteGeom, moteMaterial);
    scene.add(motePoints);

    function updateMotes(dt, time) {
      const pos = moteGeom.attributes.position;
      for (let i = 0; i < MOTE_COUNT; i++) {
        const s = moteSeeds[i];
        let y = pos.getY(i) + s.speed * dt * params.riseSpeed;
        if (y > 4.5) y = -2.5;
        const x = s.baseX + Math.sin(y * 1.5 + time + s.phase) * 0.3;
        const z = s.baseZ + Math.cos(y * 1.3 + time + s.phase) * 0.3;
        pos.setXYZ(i, x, y, z);
      }
      pos.needsUpdate = true;
    }

    // =========================================================================
    // 10. COLOR SCHEME & THEME TRANSITION CONTROLLER
    // =========================================================================
    function applyColorScheme(schemeName, animate = true) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.smokeBaseColor = scheme.smokeBase;
      params.smokeHighlightColor = scheme.smokeHighlight;
      params.coolLightColor = scheme.coolLight;
      params.warmLightColor = scheme.warmLight;
      params.rimLightColor = scheme.rimLight;
      params.ambientColor = scheme.ambient;
      if (!params.greenScreen) {
        params.backgroundColor = scheme.background;
      }

      if (animate && window.gsap) {
        const dur = 1.0;
        gsap.to(smokeUniforms.uSmokeBaseColor.value, { ...new THREE.Color(scheme.smokeBase), duration: dur });
        gsap.to(smokeUniforms.uSmokeHighlightColor.value, { ...new THREE.Color(scheme.smokeHighlight), duration: dur });
        gsap.to(smokeUniforms.uCoolLightColor.value, { ...new THREE.Color(scheme.coolLight), duration: dur });
        gsap.to(smokeUniforms.uWarmLightColor.value, { ...new THREE.Color(scheme.warmLight), duration: dur });
        gsap.to(smokeUniforms.uRimLightColor.value, { ...new THREE.Color(scheme.rimLight), duration: dur });
        gsap.to(smokeUniforms.uAmbientColor.value, { ...new THREE.Color(scheme.ambient), duration: dur });

        if (!params.greenScreen) {
          gsap.to(scene.background, { ...new THREE.Color(scheme.background), duration: dur });
        }
      } else {
        smokeUniforms.uSmokeBaseColor.value.set(scheme.smokeBase);
        smokeUniforms.uSmokeHighlightColor.value.set(scheme.smokeHighlight);
        smokeUniforms.uCoolLightColor.value.set(scheme.coolLight);
        smokeUniforms.uWarmLightColor.value.set(scheme.warmLight);
        smokeUniforms.uRimLightColor.value.set(scheme.rimLight);
        smokeUniforms.uAmbientColor.value.set(scheme.ambient);

        if (!params.greenScreen) {
          scene.background.set(scheme.background);
        }
      }

      moteMaterial.color.set(scheme.coolLight).lerp(new THREE.Color(scheme.warmLight), 0.5);

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function applySmokeTone(tone) {
      params.smokeTone = tone;
      if (tone === 'White Smoke') {
        params.smokeBaseColor = '#c5cbd3';
        params.smokeHighlightColor = '#ffffff';
        params.smokeDensity = 1.15;
      } else if (tone === 'Gray Smoke') {
        params.smokeBaseColor = '#64686e';
        params.smokeHighlightColor = '#cbd2dc';
        params.smokeDensity = 1.0;
      } else if (tone === 'Dark / Charcoal Smoke') {
        params.smokeBaseColor = '#141619';
        params.smokeHighlightColor = '#3e434b';
        params.smokeDensity = 1.35;
      } else if (tone === 'Inverted') {
        params.smokeBaseColor = '#ffffff';
        params.smokeHighlightColor = '#1a1a1a';
        params.smokeDensity = 1.0;
      } else {
        // Natural / Default: restore to current color scheme
        const scheme = colorSchemes[params.colorScheme] || initialScheme;
        params.smokeBaseColor = scheme.smokeBase;
        params.smokeHighlightColor = scheme.smokeHighlight;
      }

      smokeUniforms.uSmokeBaseColor.value.set(params.smokeBaseColor);
      smokeUniforms.uSmokeHighlightColor.value.set(params.smokeHighlightColor);
      smokeUniforms.uSmokeDensity.value = params.smokeDensity;

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // =========================================================================
    // 11. PROCEDURAL VARIATION ON SCENE CLICK
    // =========================================================================
    function randomizeScene() {
      // Re-roll scheme
      const schemeKeys = Object.keys(colorSchemes);
      const chosenSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      params.turbulence = THREE.MathUtils.randFloat(0.5, 2.2);
      params.swirlVorticity = THREE.MathUtils.randFloat(0.5, 2.2);
      params.plumeSpread = THREE.MathUtils.randFloat(0.65, 1.6);
      params.smokeDensity = THREE.MathUtils.randFloat(0.7, 1.35);
      params.lowerBedDensity = THREE.MathUtils.randFloat(0.85, 1.8);
      params.wispOpacity = THREE.MathUtils.randFloat(0.5, 1.3);
      params.riseSpeed = THREE.MathUtils.randFloat(0.7, 1.6);
      params.coolLightIntensity = THREE.MathUtils.randFloat(1.2, 2.8);
      params.warmLightIntensity = THREE.MathUtils.randFloat(1.2, 2.8);
      params.exposure = THREE.MathUtils.randFloat(0.95, 1.35);

      renderer.toneMappingExposure = params.exposure;
      smokeUniforms.uCoolLightIntensity.value = params.coolLightIntensity;
      smokeUniforms.uWarmLightIntensity.value = params.warmLightIntensity;
      smokeUniforms.uSmokeDensity.value = params.smokeDensity;

      applyColorScheme(chosenSchemeKey, true);
    }

    // =========================================================================
    // 12. CAMERA ANIMATION RIG & PERSISTENT USER ZOOM / ANGLE HANDLING
    // =========================================================================
    let cameraAnimTime = 0;
    const baseTarget = new THREE.Vector3(0, 1.2, 0);

    function updateCameraRig(delta) {
      cameraAnimTime += delta * params.animationSpeed;
      const t = cameraAnimTime;

      switch (params.cameraAnimation) {
        case 'Static':
          controls.autoRotate = false;
          break;

        case 'Slow Orbit':
          // OrbitControls autoRotate automatically maintains user's distance and angle offsets
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.5 * params.animationSpeed;
          break;

        case 'Cinematic Drift':
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.18 * params.animationSpeed;
          controls.target.x = baseTarget.x + Math.sin(t * 0.22) * 0.45;
          controls.target.z = baseTarget.z + Math.cos(t * 0.18) * 0.35;
          controls.target.y = baseTarget.y + Math.sin(t * 0.28) * 0.25;
          break;

        case 'Vertical Rise':
          controls.autoRotate = false;
          // Smooth vertical crane that tracks ascending plumes
          controls.target.y = baseTarget.y + Math.sin(t * 0.32) * 1.3;
          break;

        case 'Breathing Spiral':
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.35 * params.animationSpeed;
          controls.target.y = baseTarget.y + Math.sin(t * 0.38) * 0.85;
          break;

        case 'Low-Angle Plume':
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.25 * params.animationSpeed;
          controls.target.y = baseTarget.y + 1.2 + Math.sin(t * 0.22) * 0.3;
          break;

        case 'Tendril Focus':
          controls.autoRotate = false;
          controls.target.x = baseTarget.x + 0.9 + Math.sin(t * 0.28) * 0.3;
          controls.target.y = baseTarget.y + 0.85 + Math.cos(t * 0.22) * 0.35;
          break;

        case 'Atmospheric Sway':
          controls.autoRotate = true;
          controls.autoRotateSpeed = -0.25 * params.animationSpeed;
          controls.target.x = baseTarget.x + Math.sin(t * 0.38) * 0.35;
          controls.target.y = baseTarget.y + Math.cos(t * 0.3) * 0.2;
          break;
      }

      controls.update();
    }

    function resetCamera() {
      if (window.gsap) {
        gsap.to(camera.position, {
          x: 0,
          y: 1.8,
          z: 7.5,
          duration: 1.2,
          ease: "power2.inOut",
          onUpdate: () => controls.update()
        });
        gsap.to(controls.target, {
          x: 0,
          y: 1.2,
          z: 0,
          duration: 1.2,
          ease: "power2.inOut",
          onUpdate: () => controls.update()
        });
      } else {
        camera.position.set(0, 1.8, 7.5);
        controls.target.set(0, 1.2, 0);
        controls.update();
      }
    }

    // =========================================================================
    // 13. SEAMLESS HARDWARE ANTIALIAS RECONFIGURATION
    // =========================================================================
    function updateAntialias(enabled) {
      params.antialias = enabled;
      const oldCanvas = renderer.domElement;
      const camPos = camera.position.clone();
      const targetPos = controls.target.clone();

      renderer.dispose();
      if (oldCanvas && oldCanvas.parentNode) {
        oldCanvas.parentNode.removeChild(oldCanvas);
      }

      renderer = new THREE.WebGLRenderer({
        antialias: enabled,
        powerPreference: 'high-performance',
        alpha: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      container.appendChild(renderer.domElement);

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.copy(targetPos);
      camera.position.copy(camPos);

      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setAntialias(enabled);
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }

      setupPointerEvents(renderer.domElement);
    }

    // =========================================================================
    // 14. INTERACTION & POINTER EVENTS (DRAG VS CLICK DISCRIMINATION)
    // =========================================================================
    let pointerDownTime = 0;
    let pointerDownX = 0;
    let pointerDownY = 0;

    function setupPointerEvents(domElement) {
      domElement.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        pointerDownTime = performance.now();
        pointerDownX = e.clientX;
        pointerDownY = e.clientY;
      });

      domElement.addEventListener('pointerup', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
        const elapsed = performance.now() - pointerDownTime;

        // Discrimination: only trigger click randomize if mouse barely moved (< 5px) and short tap (< 300ms)
        if (dist < 5 && elapsed < 300) {
          if (params.randomizeOnClick) {
            randomizeScene();
          }
        }
      });
    }

    setupPointerEvents(renderer.domElement);

    // =========================================================================
    // 15. KEYBOARD SHORTCUTS ('H' TO HIDE/SHOW LIL-GUI)
    // =========================================================================
    let gui = null;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui) {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      }
    });

    // =========================================================================
    // 16. LIL-GUI CONTROL PANEL INITIALIZATION
    // =========================================================================
    gui = new GUI({ title: 'Smoke Streams & Plumes' });

    // --- Color & Theme Folder ---
    const themeFolder = gui.addFolder('Color Schemes & Background');
    themeFolder.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange(name => {
      applyColorScheme(name, true);
    });

    themeFolder.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(val => {
      if (val) {
        scene.background = new THREE.Color(0x00ff00);
      } else {
        scene.background = new THREE.Color(params.backgroundColor);
      }
    });

    themeFolder.addColor(params, 'backgroundColor').name('Background Color').onChange(hex => {
      if (!params.greenScreen) {
        scene.background = new THREE.Color(hex);
      }
    });

    // --- Smoke Appearance Folder ---
    const smokeFolder = gui.addFolder('Smoke Dynamics & Appearance');
    smokeFolder.add(params, 'smokeTone', ['Natural / Default', 'White Smoke', 'Gray Smoke', 'Dark / Charcoal Smoke', 'Inverted']).name('Smoke Tone Preset').onChange(applySmokeTone);

    smokeFolder.addColor(params, 'smokeBaseColor').name('Smoke Base Color').onChange(hex => {
      smokeUniforms.uSmokeBaseColor.value.set(hex);
    });

    smokeFolder.addColor(params, 'smokeHighlightColor').name('Highlight Color').onChange(hex => {
      smokeUniforms.uSmokeHighlightColor.value.set(hex);
    });

    smokeFolder.add(params, 'smokeDensity', 0.1, 2.5, 0.05).name('Overall Density').onChange(v => {
      smokeUniforms.uSmokeDensity.value = v;
    });

    smokeFolder.add(params, 'lowerBedDensity', 0.2, 3.0, 0.05).name('Lower Bed Density');
    smokeFolder.add(params, 'wispOpacity', 0.1, 2.0, 0.05).name('Wisp Opacity');

    smokeFolder.add(params, 'turbulence', 0.1, 3.0, 0.05).name('Turbulence Strength');
    smokeFolder.add(params, 'swirlVorticity', 0.1, 3.0, 0.05).name('Swirl Vorticity');
    smokeFolder.add(params, 'plumeSpread', 0.3, 2.5, 0.05).name('Plume Spread');
    smokeFolder.add(params, 'riseSpeed', 0.2, 3.0, 0.05).name('Rise Speed');

    // --- Lighting & Exposure Folder ---
    const lightFolder = gui.addFolder('Lighting & Exposure');
    lightFolder.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });

    lightFolder.add(params, 'masterIntensity', 0.2, 3.0, 0.05).name('Master Light Intensity').onChange(v => {
      smokeUniforms.uMasterIntensity.value = v;
    });

    lightFolder.addColor(params, 'coolLightColor').name('Cool Light Color').onChange(hex => {
      smokeUniforms.uCoolLightColor.value.set(hex);
      moteMaterial.color.set(hex).lerp(new THREE.Color(params.warmLightColor), 0.5);
    });
    lightFolder.add(params, 'coolLightIntensity', 0.0, 5.0, 0.1).name('Cool Light Intensity').onChange(v => {
      smokeUniforms.uCoolLightIntensity.value = v;
    });

    lightFolder.addColor(params, 'warmLightColor').name('Warm Light Color').onChange(hex => {
      smokeUniforms.uWarmLightColor.value.set(hex);
      moteMaterial.color.set(new THREE.Color(params.coolLightColor)).lerp(new THREE.Color(hex), 0.5);
    });
    lightFolder.add(params, 'warmLightIntensity', 0.0, 5.0, 0.1).name('Warm Light Intensity').onChange(v => {
      smokeUniforms.uWarmLightIntensity.value = v;
    });

    lightFolder.addColor(params, 'rimLightColor').name('Rim / Backlight Color').onChange(hex => {
      smokeUniforms.uRimLightColor.value.set(hex);
    });
    lightFolder.add(params, 'rimLightIntensity', 0.0, 4.0, 0.1).name('Rim Light Intensity').onChange(v => {
      smokeUniforms.uRimLightIntensity.value = v;
    });

    lightFolder.addColor(params, 'ambientColor').name('Ambient Fill Color').onChange(hex => {
      smokeUniforms.uAmbientColor.value.set(hex);
    });
    lightFolder.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(v => {
      smokeUniforms.uAmbientIntensity.value = v;
    });

    // --- Camera & Animation Folder ---
    const animFolder = gui.addFolder('Camera & Animation');
    animFolder.add(params, 'cameraAnimation', [
      'Static',
      'Slow Orbit',
      'Cinematic Drift',
      'Vertical Rise',
      'Breathing Spiral',
      'Low-Angle Plume',
      'Tendril Focus',
      'Atmospheric Sway'
    ]).name('Camera Animation');

    animFolder.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    animFolder.add({ reset: resetCamera }, 'reset').name('Reset Camera View');

    // --- Renderer & System Folder ---
    const systemFolder = gui.addFolder('System & Performance');
    systemFolder.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      }
    });

    // Attach PostProcessor Suite controls into lil-gui
    if (postProcessor) {
      postProcessor.attachGUI(gui, "Post-Processing Suite");
    }

    systemFolder.add(params, 'antialias').name('Antialiasing').onChange(updateAntialias);
    systemFolder.add(params, 'randomizeOnClick').name('Randomize on Click');
    systemFolder.add({ rand: randomizeScene }, 'rand').name('🎲 Randomize Scene Now');

    // =========================================================================
    // 17. MAIN ANIMATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime() * params.animationSpeed;
      const simDelta = Math.min(delta, 0.1) * params.animationSpeed;

      // Update Smoke Particles
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        p.update(simDelta, time);

        const i3 = i * 3;
        instPos[i3] = p.x;
        instPos[i3 + 1] = p.y;
        instPos[i3 + 2] = p.z;

        instScale[i] = p.scale;
        instRotation[i] = p.rotation;
        instAlpha[i] = p.alpha;
        instType[i] = p.type;
      }

      aPosAttr.needsUpdate = true;
      aScaleAttr.needsUpdate = true;
      aRotAttr.needsUpdate = true;
      aAlphaAttr.needsUpdate = true;
      aTypeAttr.needsUpdate = true;

      // Update Atmospheric Dust Motes
      updateMotes(simDelta, time);

      // Update Camera Animation Rig (preserves user zoom and angle offsets)
      updateCameraRig(delta);

      // Update sun/light position for godrays
      if (postProcessor && postProcessor.settings && postProcessor.settings.raysEnabled) {
        postProcessor.setMoonScreenPosition(camera, warmLightPos);
      }

      // Render through PostProcessor pipeline
      if (postProcessor) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();

    // =========================================================================
    // 18. RESIZE LISTENER
    // =========================================================================
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      if (postProcessor) {
        postProcessor.setSize(width, height, params.dpr);
      }
    });
  </script>
</body>
</html>
