<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Data Network Globe - Holographic 3D Earth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #02040a;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone usage)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = max(vec2(textureSize(image, 0)), vec2(1.0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    // Stable float PRNG without 32-bit uint overflow
    float filmNoise(vec2 coord, float t) {
      vec2 p = coord * 0.75 + vec2(sin(t * 0.1), cos(t * 0.1)) * 10.0;
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * (filmNoise(gl_FragCoord.xy, time) - 0.5);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d < 0.00001 || d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      color = max(color, vec3(0.0));
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        return vec3(pow(heat, 0.85));
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
        if (crtIntensity > 0.0001) {
          float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
          finalCol -= scanline;
        }
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    // 1x1 Black dummy texture to guarantee all sampler uniforms are always bound
    const blackDummyTexture = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1, THREE.RGBAFormat);
    blackDummyTexture.needsUpdate = true;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: 0, // Samples must be 0 to prevent D3D11 ANGLE multisample blit resolve black quadrant bugs
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoQuad.frustumCulled = false;
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoQuad.frustumCulled = false;
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: blackDummyTexture },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: blackDummyTexture },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture || blackDummyTexture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: false,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.95,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.6,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x00f0ff),
          raysColorHex: params.raysColorHex || '#00f0ff',
          // Anamorphic is OFF by default as required
          anamorphicEnabled: false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x00d4ff),
          anamorphicColorHex: params.anamorphicColorHex || '#00d4ff',
          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.005,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.15,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 1.25,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.05,
        };

        // Solid single-sampled target: zero samples eliminates the blinking black square bug
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: 0 });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: blackDummyTexture },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: blackDummyTexture },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: blackDummyTexture },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: blackDummyTexture },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: blackDummyTexture },
            blur0Texture: { value: blackDummyTexture },
            blur1Texture: { value: blackDummyTexture },
            blur2Texture: { value: blackDummyTexture },
            blur3Texture: { value: blackDummyTexture },
            blur4Texture: { value: blackDummyTexture },
            raysTexture: { value: blackDummyTexture },
            anamorphicTexture: { value: blackDummyTexture },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: blackDummyTexture },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture || blackDummyTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture || blackDummyTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture || blackDummyTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture || blackDummyTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = this.settings.raysDensity;
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalShader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysTexture.value = blackDummyTexture;
          this.finalShader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture || blackDummyTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicTexture.value = blackDummyTexture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const anamorphic = root.addFolder("Three.js Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        const rays = root.addFolder("Three.js Godrays");
        rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysThreshold", 0.0, 0.8, 0.01).name("Threshold").onChange(() => this.updateSettings());
        rays.addColor(this.settings, "raysColorHex").name("Ray Tint").onChange((v) => {
          this.settings.raysColor.set(v);
          this.updateSettings();
        });

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "chromaticAberration", 0, 0.05, 0.001).name("Chromatic Aberr").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.05, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());

        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Amplification").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sens").onChange(() => this.updateSettings());

        return root;
      }
    }

    function decodeLandPolygons(topo) {
      const scale = topo.transform.scale;
      const translate = topo.transform.translate;

      const decodedArcs = topo.arcs.map(arc => {
        let x = 0, y = 0;
        return arc.map(([dx, dy]) => {
          x += dx;
          y += dy;
          return [x * scale[0] + translate[0], y * scale[1] + translate[1]];
        });
      });

      function getRing(arcIndices) {
        const ring = [];
        arcIndices.forEach(idx => {
          let coords;
          if (idx >= 0) {
            coords = decodedArcs[idx];
          } else {
            coords = [...decodedArcs[~idx]].reverse();
          }
          if (ring.length > 0) {
            ring.push(...coords.slice(1));
          } else {
            ring.push(...coords);
          }
        });
        return ring;
      }

      const polygons = [];
      topo.objects.land.geometries.forEach(geom => {
        if (geom.type === 'Polygon') {
          polygons.push(getRing(geom.arcs[0]));
        } else if (geom.type === 'MultiPolygon') {
          geom.arcs.forEach(polyArcs => {
            polygons.push(getRing(polyArcs[0]));
          });
        }
      });
      return polygons;
    }

    const LAND_POLYGONS = decodeLandPolygons(LAND_TOPO);

    function createLandMaskData(polygons, width = 1024, height = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#ffffff';

      polygons.forEach(ring => {
        if (!ring || ring.length < 3) return;
        ctx.beginPath();
        for (let i = 0; i < ring.length; i++) {
          const lon = ring[i][0];
          const lat = ring[i][1];
          const x = ((lon + 180) / 360) * width;
          const y = ((90 - lat) / 180) * height;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      });

      return ctx.getImageData(0, 0, width, height);
    }

      let l = lon;
      while (l < -180) l += 360;

      const px = Math.min(1023, Math.max(0, Math.floor(((l + 180) / 360) * 1024)));
      const py = Math.min(511, Math.max(0, Math.floor(((90 - lat) / 180) * 512)));
      return WORLD_MASK.data[(py * 1024 + px) * 4] > 120;

    function buildRenderer(antialias) {
      if (renderer) {
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: "high-performance",
        alpha: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.setClearColor(scene ? scene.background : 0x02040a, 1.0);

      container.appendChild(renderer.domElement);

      // Initialize or preserve PostProcessor Suite
      if (!postProcessor) {
        postProcessor = new PostProcessor(renderer, {
          enabled: true,
          bloomEnabled: true,
          bloomStrength: 0.95,
          bloomRadius: 0.5,
          bloomThreshold: 0.22,
          anamorphicEnabled: false,
          raysEnabled: false,
          chromaticAberration: 0.005,
          vignetteBoost: 1.15,
          vignetteReduction: 1.25,
          noiseIntensity: 0.012,
          exposure: 1.05
        });
      } else {
        postProcessor.renderer = renderer;
      }
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

      if (controls) controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.0;
      controls.enablePan = true;
      controls.panSpeed = 1.0;
      controls.screenSpacePanning = true;
      controls.minDistance = 14;
      controls.maxDistance = 75;
      controls.target.set(params.globePosX, params.globePosY, params.globePosZ);

      updateMouseButtons();

      // Dynamic wheel zoom during orbit and static camera
      renderer.domElement.addEventListener('wheel', (e) => {
        const factor = e.deltaY > 0 ? 1.06 : 0.94;
        params.orbitDistance = THREE.MathUtils.clamp(
          params.orbitDistance * factor,
          controls.minDistance,
          controls.maxDistance
        );
        if (guiOrbitDistCtrl) guiOrbitDistCtrl.updateDisplay();
        if (params.animation === "Static (No Cam Move)" && globeGroup) {
          const dir = camera.position.clone().sub(globeGroup.position).normalize();
          camera.position.copy(globeGroup.position).addScaledVector(dir, params.orbitDistance);
        }
      }, { passive: true });

      controls.addEventListener('start', () => {
        isUserInteracting = true;
        if (userInteractionTimeout) clearTimeout(userInteractionTimeout);
      });

      controls.addEventListener('change', () => {
        if (isUserInteracting && globeGroup) {
          // When user pans across screen, synchronize globeGroup position to controls.target
          // so the globe is placed where dragged and always rotates around its own center!
          globeGroup.position.copy(controls.target);
          params.globePosX = globeGroup.position.x;
          params.globePosY = globeGroup.position.y;
          params.globePosZ = globeGroup.position.z;
          params.orbitDistance = THREE.MathUtils.clamp(
            camera.position.distanceTo(controls.target),
            controls.minDistance,
            controls.maxDistance
          );
          if (guiPosXCtrl) guiPosXCtrl.updateDisplay();
          if (guiPosYCtrl) guiPosYCtrl.updateDisplay();
          if (guiPosZCtrl) guiPosZCtrl.updateDisplay();
          if (guiOrbitDistCtrl) guiOrbitDistCtrl.updateDisplay();
        }
      });

      controls.addEventListener('end', () => {
        if (globeGroup) {
          const dx = camera.position.x - globeGroup.position.x;
          const dz = camera.position.z - globeGroup.position.z;
          animAngleOffset = Math.atan2(dx, dz) - (animClockTime * 0.15);
          params.orbitDistance = THREE.MathUtils.clamp(
            camera.position.distanceTo(globeGroup.position),
            controls.minDistance,
            controls.maxDistance
          );
          if (guiOrbitDistCtrl) guiOrbitDistCtrl.updateDisplay();
        }
        if (userInteractionTimeout) clearTimeout(userInteractionTimeout);
        userInteractionTimeout = setTimeout(() => {
          isUserInteracting = false;
        }, 800);
      });

      setupPointerEvents();
    }

          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      globeGroup.add(landPoints);

      // Subtle Cyber Grid for Oceans
      const oceanGeo = new THREE.BufferGeometry();
      oceanGeo.setAttribute('position', new THREE.Float32BufferAttribute(oceanPos, 3));
      oceanGeo.setAttribute('aPhase', new THREE.Float32BufferAttribute(oceanPhases, 1));

      const oceanShader = {
        uniforms: {
          uTime: { value: 0 },
          uColor: { value: new THREE.Color(params.oceanColor) },
          uSizeMultiplier: { value: params.pointSize * 6.0 }
        },
        vertexShader: `
          uniform float uTime;
          uniform float uSizeMultiplier;
          attribute float aPhase;
          varying float vPulse;
          void main() {
            vPulse = 0.6 + 0.4 * sin(uTime * 1.5 + aPhase);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pSize = uSizeMultiplier * (9.0 / -mvPosition.z) * vPulse;
            gl_PointSize = clamp(pSize, 0.8, 2.6);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          varying float vPulse;
          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;
            float alpha = (1.0 - dist * 2.0) * 0.16 * vPulse;
            gl_FragColor = vec4(uColor, alpha);
          }
        `
      };

      oceanPoints = new THREE.Points(
        oceanGeo,
        new THREE.ShaderMaterial({
          ...oceanShader,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      globeGroup.add(oceanPoints);

      // 4. Data Routes & Arcs
      buildDataRoutes(R);

      // 5. Hub Cities Markers & Radar Beacons
      buildHubMarkers(R);

      // 6. Smooth Horizon Atmosphere Rim (No harsh cutoffs)
      const atmoGeo = new THREE.SphereGeometry(R * 1.05, 64, 64);
      const atmoShader = {
        uniforms: {
          uColor: { value: new THREE.Color(params.haloColor) }
        },
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vViewDir;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewDir = normalize(-mvPos.xyz);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          void main() {
            float fresnel = 1.0 - max(0.0, dot(vNormal, vViewDir));
            float intensity = pow(fresnel, 4.8) * 0.85;
            gl_FragColor = vec4(uColor, intensity);
          }
        `
      };
      atmosphereMesh = new THREE.Mesh(
        atmoGeo,
        new THREE.ShaderMaterial({
          ...atmoShader,
          transparent: true,
          blending: THREE.AdditiveBlending,
          side: THREE.FrontSide,
          depthWrite: false
        })
      );
      globeGroup.add(atmosphereMesh);
    }

    // -------------------------------------------------------------
    // Build Data Routes & Animated Data Packets
    // -------------------------------------------------------------
    function buildDataRoutes(R) {
      if (arcsGroup) globeGroup.remove(arcsGroup);
      if (packetsMesh) globeGroup.remove(packetsMesh);

      arcsGroup = new THREE.Group();
      globeGroup.add(arcsGroup);

      arcCurves = [];
      packetData = [];

      const arcMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(params.arcsColor),
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending
      });

      HUB_CONNECTIONS.forEach((conn, index) => {
        const hubA = HUBS[conn[0]];
        const hubB = HUBS[conn[1]];
        if (!hubA || !hubB) return;

        const pA = latLonToVector3(hubA.lat, hubA.lon, R);
        const pB = latLonToVector3(hubB.lat, hubB.lon, R);

        const dist = pA.distanceTo(pB);
        const mid = pA.clone().add(pB).multiplyScalar(0.5);
        const altitude = R + dist * 0.24 * params.arcHeight;
        const ctrl = mid.normalize().multiplyScalar(altitude);

        const curve = new THREE.QuadraticBezierCurve3(pA, ctrl, pB);
        arcCurves.push(curve);

        const points = curve.getPoints(48);
        const arcGeo = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(arcGeo, arcMat);
        arcsGroup.add(line);

        packetData.push({
          curveIndex: arcCurves.length - 1,
          progress: Math.random(),
          speed: 0.18 + Math.random() * 0.28,
          offset: index * 0.05
        });

        if (index % 2 === 0) {
          packetData.push({
            curveIndex: arcCurves.length - 1,
            progress: (Math.random() + 0.5) % 1.0,
            speed: 0.22 + Math.random() * 0.25,
            offset: index * 0.08
          });
        }
      });

      // Data Packets Particle Cloud
      const packetCount = packetData.length;
      const packetPositions = new Float32Array(packetCount * 3);
      const packetGeo = new THREE.BufferGeometry();
      packetGeo.setAttribute('position', new THREE.BufferAttribute(packetPositions, 3));

      const packetShader = {
        uniforms: {
          uColor: { value: new THREE.Color(params.packetsColor) },
          uSizeMultiplier: { value: params.pointSize * 22.0 }
        },
        vertexShader: `
          uniform float uSizeMultiplier;
          void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pSize = uSizeMultiplier * (18.0 / -mvPosition.z);
            gl_PointSize = clamp(pSize, 2.0, 7.0);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;
            float core = 1.0 - smoothstep(0.0, 0.4, dist);
            float glow = exp(-dist * 5.0);
            float alpha = core * 0.9 + glow * 0.7;
            gl_FragColor = vec4(uColor, alpha);
          }
        `
      };

      packetsMesh = new THREE.Points(
        packetGeo,
        new THREE.ShaderMaterial({
          ...packetShader,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      globeGroup.add(packetsMesh);
    }

    // -------------------------------------------------------------
    // Build Minimalistic Hub City Markers & Beacons
    // -------------------------------------------------------------
    function buildHubMarkers(R) {
      if (hubsGroup) globeGroup.remove(hubsGroup);
      hubsGroup = new THREE.Group();
      globeGroup.add(hubsGroup);

      const hubMarkerGeo = new THREE.RingGeometry(0.04, 0.12, 24);
      const hubMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.hubsColor),
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });

      const beaconMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(params.hubsColor),
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });

      HUBS.forEach(hub => {
        const pos = latLonToVector3(hub.lat, hub.lon, R);
        const norm = pos.clone().normalize();

        const ring = new THREE.Mesh(hubMarkerGeo, hubMat);
        ring.position.copy(pos.clone().multiplyScalar(1.002));
        ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), norm);
        hubsGroup.add(ring);

        const topPos = pos.clone().add(norm.clone().multiplyScalar(0.7));
        const pillarGeo = new THREE.BufferGeometry().setFromPoints([pos, topPos]);
        const pillar = new THREE.Line(pillarGeo, beaconMat);
        hubsGroup.add(pillar);
      });
    }

    // -------------------------------------------------------------
    // Deep Bokeh & Ambient Dust ("с глубоким боке")
    // -------------------------------------------------------------
    function buildBokehSystem() {
      if (bokehPoints) scene.remove(bokehPoints);

      const bokehCount = 140;
      const positions = [];
      const seeds = [];
      const sizes = [];

      for (let i = 0; i < bokehCount; i++) {
        const r = 16.0 + Math.random() * 32.0;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        positions.push(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.sin(phi) * Math.sin(theta),
          r * Math.cos(phi)
        );
        seeds.push(Math.random());
        sizes.push(8.0 + Math.random() * 22.0);
      }

      const bokehGeo = new THREE.BufferGeometry();
      bokehGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      bokehGeo.setAttribute('aSeed', new THREE.Float32BufferAttribute(seeds, 1));
      bokehGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));

      const bokehShader = {
        uniforms: {
          uTime: { value: 0 },
          uColor: { value: new THREE.Color(params.bokehColor) },
          uIntensity: { value: params.bokehIntensity }
        },
        vertexShader: `
          uniform float uTime;
          attribute float aSeed;
          attribute float aSize;
          varying float vSeed;
          void main() {
            vSeed = aSeed;
            vec3 pos = position;
            pos.x += sin(uTime * 0.18 + aSeed * 6.28) * 1.2;
            pos.y += cos(uTime * 0.15 + aSeed * 6.28) * 1.2;
            pos.z += sin(uTime * 0.19 + aSeed * 3.14) * 1.2;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float pSize = aSize * (24.0 / -mvPosition.z);
            gl_PointSize = clamp(pSize, 3.0, 65.0);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uIntensity;
          varying float vSeed;
          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;

            float core = smoothstep(0.5, 0.0, dist);
            float soft = exp(-dist * dist * 8.0);
            float alpha = (core * 0.5 + soft * 0.5) * 0.28 * uIntensity;

            vec3 col = uColor;
            col.r += sin(vSeed * 6.28) * 0.08;
            col.b += cos(vSeed * 6.28) * 0.08;

            gl_FragColor = vec4(col, alpha);
          }
        `
      };

      bokehPoints = new THREE.Points(
        bokehGeo,
        new THREE.ShaderMaterial({
          ...bokehShader,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      scene.add(bokehPoints);
    }

    // -------------------------------------------------------------
    // Apply Color Scheme
    // -------------------------------------------------------------
    function applyColorScheme(name) {
      const p = COLOR_SCHEMES[name];
      if (!p) return;

      params.colorScheme = name;
      params.landColor = p.land;
      params.oceanColor = p.ocean;
      params.arcsColor = p.arcs;
      params.packetsColor = p.packets;
      params.hubsColor = p.hubs;
      params.bokehColor = p.bokeh;
      params.haloColor = p.halo;
      params.innerCoreColor = p.core;
      params.ambientColor = p.ambient;
      params.keyColor = p.keyLight;
      params.rimColor = p.rimLight;
      params.coreLightColor = p.coreLight;

      updateSceneColors();
      updateGUI();
    }

    function updateSceneColors() {
      if (params.greenScreen) {
        scene.background = new THREE.Color("#00ff00");
        renderer.setClearColor(0x00ff00, 1.0);
        if (bokehPoints) bokehPoints.visible = false;
      } else {
        const p = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES["Original"];
        scene.background = new THREE.Color(p.bg);
        renderer.setClearColor(scene.background, 1.0);
        if (bokehPoints) bokehPoints.visible = true;
      }

      if (landPoints) landPoints.material.uniforms.uColor.value.set(params.landColor);
      if (coastlinesMesh) coastlinesMesh.material.color.set(params.landColor);
      if (oceanPoints) oceanPoints.material.uniforms.uColor.value.set(params.oceanColor);
      if (packetsMesh) packetsMesh.material.uniforms.uColor.value.set(params.packetsColor);
      if (bokehPoints) bokehPoints.material.uniforms.uColor.value.set(params.bokehColor);
      if (atmosphereMesh) atmosphereMesh.material.uniforms.uColor.value.set(params.haloColor);
      if (coreSphere) coreSphere.material.color.set(params.innerCoreColor);

      if (arcsGroup) {
        arcsGroup.children.forEach(line => {
          line.material.color.set(params.arcsColor);
        });
      }

      if (hubsGroup) {
        hubsGroup.children.forEach(obj => {
          obj.material.color.set(params.hubsColor);
        });
      }

      if (ambientLight) {
        ambientLight.color.set(params.ambientColor);
        ambientLight.intensity = params.ambientIntensity;
      }
      if (keyLight) {
        keyLight.color.set(params.keyColor);
        keyLight.intensity = params.keyIntensity;
      }
      if (rimLight) {
        rimLight.color.set(params.rimColor);
        rimLight.intensity = params.rimIntensity;
      }
      if (coreLight) {
        coreLight.color.set(params.coreLightColor);
        coreLight.intensity = params.coreIntensity;
      }
    }

    // -------------------------------------------------------------
    // Randomize Theme & Parameters (Do NOT Touch PostProcessor!)
    // -------------------------------------------------------------
    function randomizeScene() {
      const keys = Object.keys(COLOR_SCHEMES);
      const randomScheme = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randomScheme);

      const anims = ANIMATIONS;
      params.animation = anims[Math.floor(Math.random() * anims.length)];

      params.animationSpeed = THREE.MathUtils.lerp(0.6, 1.6, Math.random());
      params.packetSpeed = THREE.MathUtils.lerp(0.7, 1.8, Math.random());
      params.pointSize = THREE.MathUtils.lerp(0.85, 1.25, Math.random());
      params.bokehIntensity = THREE.MathUtils.lerp(0.4, 0.9, Math.random());
      params.exposure = THREE.MathUtils.lerp(0.95, 1.25, Math.random());
      params.keyIntensity = THREE.MathUtils.lerp(1.2, 2.5, Math.random());
      params.rimIntensity = THREE.MathUtils.lerp(1.5, 3.0, Math.random());
      params.coreIntensity = THREE.MathUtils.lerp(1.0, 2.2, Math.random());

      if (landPoints) landPoints.material.uniforms.uSizeMultiplier.value = params.pointSize * 11.0;
      if (oceanPoints) oceanPoints.material.uniforms.uSizeMultiplier.value = params.pointSize * 6.0;
      if (packetsMesh) packetsMesh.material.uniforms.uSizeMultiplier.value = params.pointSize * 22.0;
      if (bokehPoints) bokehPoints.material.uniforms.uIntensity.value = params.bokehIntensity;
      if (renderer) renderer.toneMappingExposure = params.exposure;

      updateSceneColors();
      updateGUI();
    }

    // -------------------------------------------------------------
    // Setup Pointer Events (Distinguish Click from Orbit/Pan Drag)
    // -------------------------------------------------------------
    let pointerDownPos = { x: 0, y: 0, time: 0 };

    function setupPointerEvents() {
      const el = renderer.domElement;

      el.addEventListener('pointerdown', (e) => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownPos.time = Date.now();
      });

      el.addEventListener('pointerup', (e) => {
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.hypot(dx, dy);
        const elapsed = Date.now() - pointerDownPos.time;

        if (dist < 6 && elapsed < 320) {
          if (params.clickToRandomize && !e.target.closest('.lil-gui')) {
            randomizeScene();
          }
        }
      });
    }

    // lil-gui Setup (Native Unstyled lil-gui)

      });
      guiPosXCtrl = fPos.add(params, "globePosX", -30, 30, 0.5).name("Globe Position X").onChange(updateGlobePosition);
      guiPosYCtrl = fPos.add(params, "globePosY", -30, 30, 0.5).name("Globe Position Y").onChange(updateGlobePosition);
      guiPosZCtrl = fPos.add(params, "globePosZ", -30, 30, 0.5).name("Globe Position Z").onChange(updateGlobePosition);
      fPos.add({ resetGlobe: () => {
        params.globePosX = 0;
        params.globePosY = 0;
        params.globePosZ = 0;
        params.orbitDistance = 32.0;
        if (globeGroup) globeGroup.position.set(0, 0, 0);
        controls.target.set(0, 0, 0);
        camera.position.set(0, 10, 32);
        isUserInteracting = false;
        animAngleOffset = 0;
        updateGUI();
      }}, "resetGlobe").name("Center Globe (Reset)");

      // Folder 3: Geometry & Density
      const fGeom = gui.addFolder("Geometry & Particles");
      fGeom.add(params, "pointSize", 0.4, 2.5, 0.05).name("Point Size").onChange(v => {
        if (landPoints) landPoints.material.uniforms.uSizeMultiplier.value = v * 11.0;
        if (oceanPoints) oceanPoints.material.uniforms.uSizeMultiplier.value = v * 6.0;
        if (packetsMesh) packetsMesh.material.uniforms.uSizeMultiplier.value = v * 22.0;
      });
      fGeom.add(params, "bokehIntensity", 0.0, 2.0, 0.05).name("Bokeh Glow").onChange(v => {
        if (bokehPoints) bokehPoints.material.uniforms.uIntensity.value = v;
      });
      fGeom.add(params, "arcHeight", 0.5, 2.5, 0.1).name("Arc Height").onChange(() => {
        buildDataRoutes(params.globeRadius);
      });

      // Folder 4: Lighting & Exposure
      const fLight = gui.addFolder("Lighting & Exposure");
      fLight.add(params, "exposure", 0.1, 3.0, 0.05).name("Tone Exposure").onChange(v => {
        renderer.toneMappingExposure = v;
      });
      fLight.add(params, "ambientIntensity", 0.0, 3.0, 0.1).name("Ambient Intensity").onChange(updateSceneColors);
      fLight.addColor(params, "ambientColor").name("Ambient Color").onChange(updateSceneColors);
      fLight.add(params, "keyIntensity", 0.0, 5.0, 0.1).name("Key Light").onChange(updateSceneColors);
      fLight.addColor(params, "keyColor").name("Key Color").onChange(updateSceneColors);
      fLight.add(params, "rimIntensity", 0.0, 5.0, 0.1).name("Rim Light").onChange(updateSceneColors);
      fLight.addColor(params, "rimColor").name("Rim Color").onChange(updateSceneColors);
      fLight.add(params, "coreIntensity", 0.0, 5.0, 0.1).name("Core Light").onChange(updateSceneColors);
      fLight.addColor(params, "coreLightColor").name("Core Light Color").onChange(updateSceneColors);

      // Folder 5: PostProcessor Suite Integration
      if (postProcessor) {
        postProcessor.attachGUI(gui, "Post-Processing (PostProcessor.js)");
      }

      // Folder 6: System & Interaction
      const fSys = gui.addFolder("System & Controls");
      fSys.add(params, "dragMode", ["Rotate (Right-click to Pan)", "Pan (Right-click to Rotate)"]).name("Drag Mode").onChange(updateMouseButtons);
      fSys.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange(v => {
        renderer.setPixelRatio(v);
        if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      });
      fSys.add(params, "antialias").name("Antialiasing").onChange(v => {
        buildRenderer(v);
      });
      fSys.add(params, "clickToRandomize").name("Click Scene to Re-roll");
      fSys.add({ randomize: randomizeScene }, "randomize").name("Randomize Theme Now");
      fSys.add({ resetCam: () => {
        params.globePosX = 0;
        params.globePosY = 0;
        params.globePosZ = 0;
        params.orbitDistance = 32.0;
        if (globeGroup) globeGroup.position.set(0, 0, 0);
        controls.reset();
        camera.position.set(0, 10, 32);
        controls.target.set(0, 0, 0);
        isUserInteracting = false;
        animAngleOffset = 0;
        updateGUI();
      }}, "resetCam").name("Reset Camera");
    }

    function updateGlobePosition() {
      if (!globeGroup) return;
      const oldPos = globeGroup.position.clone();
      globeGroup.position.set(params.globePosX, params.globePosY, params.globePosZ);
      const delta = globeGroup.position.clone().sub(oldPos);
      controls.target.copy(globeGroup.position);
      camera.position.add(delta);
    }

    function updateGUI() {
      if (!gui) return;
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    // -------------------------------------------------------------
    // Keyboard Handler (Hide/Show UI with 'H' key)
    // -------------------------------------------------------------
    function onKeyDown(e) {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    }

    // -------------------------------------------------------------
    // Window Resize Handler
    // -------------------------------------------------------------
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    }

    // -------------------------------------------------------------
    // Main Animation Loop
    // -------------------------------------------------------------
    let animClockTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const speed = params.animationSpeed;
      animClockTime += delta * speed;

      // 1. Globe & Data Rotation
      if (params.globeRotation && globeGroup) {
        globeGroup.rotation.y += delta * 0.12 * speed;
      }

      // 2. Shader Uniform Updates (Time)
      if (landPoints) landPoints.material.uniforms.uTime.value = animClockTime;
      if (oceanPoints) oceanPoints.material.uniforms.uTime.value = animClockTime;
      if (bokehPoints) bokehPoints.material.uniforms.uTime.value = animClockTime;

      // 3. Update Flowing Data Packets
      if (packetData.length > 0 && packetsMesh) {
        const positions = packetsMesh.geometry.attributes.position.array;
        packetData.forEach((packet, idx) => {
          packet.progress += delta * packet.speed * params.packetSpeed * speed;
          if (packet.progress > 1.0) packet.progress -= 1.0;

          const curve = arcCurves[packet.curveIndex];
          if (curve) {
            const pt = curve.getPointAt(packet.progress);
            positions[idx * 3] = pt.x;
            positions[idx * 3 + 1] = pt.y;
            positions[idx * 3 + 2] = pt.z;
          }
        });
        packetsMesh.geometry.attributes.position.needsUpdate = true;
      }

      // 4. Preconfigured Camera Animations
      applyCameraAnimation(animClockTime, speed);

      if (params.animation === "Static (No Cam Move)" || isUserInteracting) {
        controls.update();
      }

      // 5. Render Scene via PostProcessor Pipeline or Direct WebGL
      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.finalPass.shader.uniforms.time.value = animClockTime;
        postProcessor.rgbPass.shader.uniforms.time.value = animClockTime;
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // -------------------------------------------------------------
    // Camera Animation Evaluation (Always Orbits Around Globe's Own Center)
    // -------------------------------------------------------------
    function applyCameraAnimation(time, speed) {
      if (params.animation === "Static (No Cam Move)") {
        return;
      }

      if (isUserInteracting) {
        return;
      }

      const center = globeGroup ? globeGroup.position : controls.target;
      const r = params.orbitDistance;
      controls.target.copy(center);

      switch (params.animation) {
        case "Orbital Glide": {
          const angle = time * 0.15 + animAngleOffset;
          const relX = r * Math.sin(angle);
          const relZ = r * Math.cos(angle);
          const relY = (r * 0.25) + (r * 0.09) * Math.sin(angle * 0.6);
          camera.position.set(center.x + relX, center.y + relY, center.z + relZ);
          camera.lookAt(center);
          break;
        }

        case "Polar Drift": {
          const pitch = Math.sin(time * 0.22) * 1.05;
          const yaw = time * 0.09 + animAngleOffset;
          const relX = r * Math.cos(pitch) * Math.sin(yaw);
          const relY = r * Math.sin(pitch);
          const relZ = r * Math.cos(pitch) * Math.cos(yaw);
          camera.position.set(center.x + relX, center.y + relY, center.z + relZ);
          camera.lookAt(center);
          break;
        }

        case "Breathing Zoom": {
          const dist = r * (1.0 + 0.25 * Math.sin(time * 0.35));
          const yaw = time * 0.12 + animAngleOffset;
          const relX = dist * Math.sin(yaw);
          const relZ = dist * Math.cos(yaw);
          const relY = (r * 0.18) + (r * 0.08) * Math.cos(time * 0.35);
          camera.position.set(center.x + relX, center.y + relY, center.z + relZ);
          camera.lookAt(center);
          break;
        }

        case "Figure Eight": {
          const t = time * 0.18 + animAngleOffset;
          const relX = r * Math.sin(t);
          const relZ = r * Math.cos(t);
          const relY = (r * 0.35) * Math.sin(2.0 * t);
          camera.position.set(center.x + relX, center.y + relY, center.z + relZ);
          camera.lookAt(center);
          break;
        }

        case "Data Flyby": {
          const t = time * 0.25 + animAngleOffset;
          const flybyR = r * 0.65;
          const dist = flybyR + (flybyR * 0.18) * Math.sin(t * 1.2);
          const relX = dist * Math.sin(t);
          const relZ = dist * Math.cos(t);
          const relY = (flybyR * 0.22) + (flybyR * 0.15) * Math.sin(t * 0.8);
          camera.position.set(center.x + relX, center.y + relY, center.z + relZ);
          camera.lookAt(center);
          break;
        }

        case "Satellite Pan": {
          const t = time * 0.14 + animAngleOffset;
          const relX = r * Math.sin(t);
          const relZ = r * Math.cos(t * 0.9);
          const relY = (r * 0.4) + (r * 0.12) * Math.sin(t * 0.4);
          camera.position.set(center.x + relX, center.y + relY, center.z + relZ);
          camera.lookAt(center);
          break;
        }

        case "Zen Horizon": {
          const t = time * 0.11 + animAngleOffset;
          const relX = r * Math.sin(t * 0.5);
          const relZ = r * Math.cos(t * 0.5);
          const relY = (r * 0.08) + (r * 0.06) * Math.sin(t * 0.7);
          camera.position.set(center.x + relX, center.y + relY, center.z + relZ);
          camera.lookAt(center);
          break;
        }
      }
    }

    // Launch application
    init();
  </script>
</body>
</html>
