<!DOCTYPE html>

  <style>
    /* Reset & Fullscreen Viewport UX */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000000;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fullscreen Canvas Container - Zero Margins, Zero Borders */
    #canvas-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: block;
    }

    #canvas-wrapper canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      display: block;
      margin: 0;
      padding: 0;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      outline: none !important;
      cursor: crosshair;
    }

    /* Glassmorphism Heads-Up Display (HUD) */
    #hud {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 14px 18px;
      background: rgba(12, 15, 24, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 380px;
    }

    #hud.hidden-ui {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(0.96);
    }

    .hud-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    .hud-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .hud-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .hud-details {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      color: #94a3b8;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hud-row strong {
      color: #f1f5f9;
      font-weight: 500;
    }

    .progress-bar-container {
      width: 100px;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      transition: width 0.15s ease-out;
    }

    .hud-hints {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hint-pill {
      font-size: 10.5px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .hint-pill kbd {
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: inherit;
      font-weight: 600;
      font-size: 9.5px;
    }

    /* Floating Quick Action Buttons */
    #action-bar {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #action-bar.hidden-ui {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(0.96);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      background: rgba(15, 18, 30, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: #e2e8f0;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-btn:hover {
      background: rgba(30, 36, 56, 0.9);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
    }

    .action-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      z-index: 100;
      background: rgba(17, 22, 38, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* lil-gui Custom Clean Dark Theme */
    .lil-gui {
      --background-color: rgba(14, 17, 27, 0.82) !important;
      --text-color: #e2e8f0 !important;
      --title-background-color: rgba(22, 27, 44, 0.92) !important;
      --widget-color: rgba(255, 255, 255, 0.08) !important;
      --hover-color: rgba(255, 255, 255, 0.16) !important;
      --focus-color: #f59e0b !important;
      --number-color: #38bdf8 !important;
      --string-color: #f472b6 !important;
      border-radius: 14px !important;
      overflow: hidden !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65) !important;

      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;

    .lil-gui.hidden-ui {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(-10px) scale(0.96) !important;
    }

    .lil-gui .title {
      font-weight: 700 !important;
      letter-spacing: 0.04em !important;
      text-transform: uppercase !important;
      font-size: 11px !important;
      color: #f8fafc !important;
    }

</head>

      <span>Fullscreen</span>

  </div>

  <!-- Toast Element -->

  <script>

// Global Simulation & Interactive Parameters
const params = {
  // Mode: 0 (Horizon), 1 (Swirl), 2 (Rays), 3 (Mountains), 4 (Forest), 5 (Waterfall)
  mode: 0,
  
  // Palette settings
  palettePreset: 'Original',
  colorA: '#000080',
  colorB: '#FFC0CB',
  colorC: '#000000',
  colorD: '#87CEEB',
  colorE: '#FFA600CC',
  colorF: '#FF0000CC',
  background: '#000000',

  // Dynamics & Motion Controls
  sunSpeedMult: 1.0,
  speedMult: 1.0,
  noiseScale: 1.0,
  noiseSpeed: 1.0,
  strokeWeightMult: 1.0,
  sunRadiusScale: 1.0,
  
  // UX & Randomization
  randomizeOnClick: true,
  autoAdvance: true,
  isPaused: false,
  hideUI: false
};

// Mode metadata for HUD display
const MODE_NAMES = [
  'Mode 0: Ocean Horizon',
  'Mode 1: Polar Swirl Vortex',
  'Mode 2: Solar Ray Flare',
  'Mode 3: Misty Mountains',
  'Mode 4: Twilight Forest',
  'Mode 5: Cascading Waterfall'
];

// Active State Variables
let brushes = [];
let colorA = params.colorA;
let colorB = params.colorB;
let colorC = params.colorC;
let colorD = params.colorD;
let colorE = params.colorE;
let colorF = params.colorF;
let suny = 0;
let suncolor;
let mode = 0;
let canvasElement;
let gui;
let autoAdvanceTimer = 0;

// Safe color parsing helper for p5.Color conversion
function parseCol(c) {
  if (c && typeof c === 'object' && c.levels) return c;
  return color(c);
}

// =============================================================================
// p5.js Core Lifecycle (100% Fullscreen Viewport)
// =============================================================================
function setup() {
  canvasElement = createCanvas(windowWidth, windowHeight);
  canvasElement.parent('canvas-wrapper');

  // Prevent default context menu on right click
  canvasElement.elt.oncontextmenu = (e) => e.preventDefault();

  initGUI();
  applyPalette(params.palettePreset, false);
  makeBrushes();
}

function makeBrushes() {
  background(params.background);
  brushes = [];
  autoAdvanceTimer = 0;
  
  // Sync local colors with params
  colorA = params.colorA;
  colorB = params.colorB;
  colorC = params.colorC;
  colorD = params.colorD;
  colorE = params.colorE;
  colorF = params.colorF;

  switch (mode) {
    case 0:
      // Mode 0: Ocean Horizon (Original)
      suny = 0;
      for (let y = 0; y < height; y += 1) {
        let pos = createVector(random(-width, 0), y);
        let startColor = y < height / 2 ? color(colorA) : color(colorC);
        let endColor = y < height / 2 ? color(colorB) : color(colorD);
        let blendIndex = y < height / 2 ? map(y, 0, height / 2, 0, 1, true) : map(y, height / 2, height, 0, 1, true);
        let f = lerpColor(startColor, endColor, blendIndex);
        let b = new Brush0(pos, f);
        brushes.push(b);
      }
      break;

    case 1:
      // Mode 1: Polar Swirl Vortex (Original)
      suny = -height / 2;
      for (let r = 0; r < width / 2; r += 1) {
        let sc = lerpColor(color(colorB), color(colorA), map(r, 0, width / 2, 0, 1));
        let wc = lerpColor(color(colorC), color(colorD), map(r, 0, width / 2, 0, 1));
        let b = new Brush1(r, sc, wc);
        brushes.push(b);
      }
      break;

    case 2:
      // Mode 2: Solar Ray Flare (Original)
      suny = -height / 2;
      for (let ang = 0; ang < TAU; ang += TAU / 600) {
        let b = new Brush2(ang);
        brushes.push(b);
      }
      break;

    case 3:
      // Mode 3: Misty Mountains (New Variant)
      suny = height * 0.08;
      // 1. Sky atmosphere brushes
      for (let y = 0; y < height * 0.55; y += 2) {
        let pos = createVector(random(-width, 0), y);
        let f = lerpColor(parseCol(colorA), parseCol(colorB), map(y, 0, height * 0.55, 0, 1));
        brushes.push(new BrushMountainSky(pos, f));
      }
      // 2. Layered Mountain Ridges (4 depth tiers)
      const numRidges = 4;
      for (let ridgeIdx = 0; ridgeIdx < numRidges; ridgeIdx++) {
        const ridgeSeed = ridgeIdx * 257.31 + 42.1;
        const baseY = map(ridgeIdx, 0, numRidges - 1, height * 0.35, height * 0.76);
        const amp = map(ridgeIdx, 0, numRidges - 1, height * 0.16, height * 0.12);
        const numRidgeBrushes = Math.floor(width / 3.2);

        for (let i = 0; i < numRidgeBrushes; i++) {
          let rx = random(-width * 0.2, width * 1.2);
          let b = new BrushMountainRidge(ridgeIdx, rx, baseY, amp, ridgeSeed);
          brushes.push(b);
        }
      }
      // 3. Valley Mist drifts
      for (let m = 0; m < 70; m++) {
        brushes.push(new BrushMountainMist());
      }
      break;

    case 4:
      // Mode 4: Twilight Forest (New Variant)
      suny = height * 0.12;
      // 1. Forest sky brushes
      for (let y = 0; y < height * 0.6; y += 2.5) {
        let pos = createVector(random(-width, 0), y);
        let f = lerpColor(parseCol(colorA), parseCol(colorB), map(y, 0, height * 0.6, 0, 1));
        brushes.push(new BrushForestSky(pos, f));
      }
      // 2. Crepuscular God Rays streaming down through canopy
      for (let ang = -PI * 0.35; ang <= PI * 0.35; ang += PI / 45) {
        brushes.push(new BrushGodRay(ang));
      }
      // 3. Pine Trees with textured trunks & tiered branches
      const treeCount = Math.floor(map(width, 600, 2560, 12, 22));
      for (let t = 0; t < treeCount; t++) {
        const tx = map(t, 0, treeCount - 1, width * 0.04, width * 0.96) + random(-30, 30);
        const apexY = random(height * 0.22, height * 0.48);
        const baseW = map(apexY, height * 0.22, height * 0.48, 12, 6);
        
        // Trunk brushes
        for (let tb = 0; tb < 6; tb++) {
          brushes.push(new BrushTreeTrunk(tx + (tb - 2.5) * 1.5, apexY, baseW, t));
        }
        
        // Pine branch clusters
        const tiers = Math.floor(random(8, 14));
        for (let tier = 0; tier < tiers; tier++) {
          const tierY = map(tier, 0, tiers - 1, apexY + 25, height * 0.88);
          const branchSpan = map(tier, 0, tiers - 1, 15, map(apexY, height * 0.2, height * 0.5, 90, 45));
          for (let side of [-1, 1]) {
            for (let b = 0; b < 3; b++) {
              brushes.push(new BrushPineNeedles(tx, tierY, side, branchSpan, tier));
            }
          }
        }
      }
      // 4. Forest floor undergrowth
      for (let x = 0; x < width; x += 3) {
        brushes.push(new BrushForestFloor(x));
      }
      // 5. Twilight fireflies
      for (let ff = 0; ff < 45; ff++) {
        brushes.push(new BrushFirefly());
      }
      break;

    case 5:
      // Mode 5: Cascading Waterfall (New Variant)
      suny = height * 0.08;
      // 1. Canyon Sky
      for (let y = 0; y < height * 0.4; y += 2) {
        let pos = createVector(random(-width, 0), y);
        let f = lerpColor(parseCol(colorA), parseCol(colorB), map(y, 0, height * 0.4, 0, 1));
        brushes.push(new BrushCanyonSky(pos, f));
      }
      // 2. Canyon Cliffs (Left & Right basalt canyon walls)
      const cliffStep = 3;
      for (let y = height * 0.15; y < height; y += cliffStep) {
        // Left cliff
        brushes.push(new BrushCanyonCliff(random(0, width * 0.32), y, -1));
        // Right cliff
        brushes.push(new BrushCanyonCliff(random(width * 0.68, width), y, 1));
      }
      // 3. River approach above falls
      for (let i = 0; i < 90; i++) {
        brushes.push(new BrushWaterfallRiver());
      }
      // 4. Falling Waterfall Torrents
      for (let i = 0; i < 280; i++) {
        brushes.push(new BrushWaterfallTorrent());
      }
      // 5. Plunge Pool ripples & swirling foam
      for (let i = 0; i < 110; i++) {
        brushes.push(new BrushWaterfallBasin());
      }
      // 6. Ascending Twilight Mist
      for (let i = 0; i < 85; i++) {
        brushes.push(new BrushWaterfallMist());
      }
      break;
  }

  updateHUD();
}

function draw() {
  if (params.isPaused) return;

  switch (mode) {
    case 0:
      suncolor = lerpColor(parseCol(colorE), parseCol(colorF), constrain(map(suny, 0, height / 2, 0, 1), 0, 1));
      brushes = brushes.filter(b => b.alive);
      for (let b of brushes) {
        b.move();
        b.show();
      }
      break;

    case 1:
      suncolor = lerpColor(parseCol(colorE), parseCol(colorF), constrain(map(suny, -height / 2, 0, 0, 1), 0, 1));
      brushes = brushes.filter(b => b.alive);
      push();
      translate(width / 2, height / 2);
      for (let b of brushes) {
        b.move();
        b.show();
      }
      pop();
      break;

    case 2:
      suncolor = lerpColor(parseCol(colorE), parseCol(colorF), constrain(map(suny, -height / 2, 0, 0, 1), 0, 1));
      brushes = brushes.filter(b => b.alive);
      push();
      translate(width / 2, height / 2);
      for (let b of brushes) {
        b.move();
        b.show();
      }
      pop();
      break;

    case 3:
      // Mode 3: Mountains
      suncolor = lerpColor(parseCol(colorE), parseCol(colorF), constrain(map(suny, height * 0.08, height * 0.6, 0, 1), 0, 1));
      brushes = brushes.filter(b => b.alive);
      for (let b of brushes) {
        b.move();
        b.show();
      }
      break;

    case 4:
      // Mode 4: Forest
      suncolor = lerpColor(parseCol(colorE), parseCol(colorF), constrain(map(suny, height * 0.12, height * 0.65, 0, 1), 0, 1));
      brushes = brushes.filter(b => b.alive);
      for (let b of brushes) {
        b.move();
        b.show();
      }
      break;

    case 5:
      // Mode 5: Waterfall
      suncolor = lerpColor(parseCol(colorE), parseCol(colorF), constrain(map(suny, height * 0.08, height * 0.68, 0, 1), 0, 1));
      brushes = brushes.filter(b => b.alive);
      for (let b of brushes) {
        b.move();
        b.show();
      }
      break;
  }

  suny += 0.2 * (height / 690) * params.sunSpeedMult;

  // Periodic HUD update for smooth performance
  if (frameCount % 6 === 0) {
    updateHUDProgress();
  }

  // Auto-advance checking when all brushes conclude
  if (brushes.length === 0 && params.autoAdvance) {
    autoAdvanceTimer++;
    if (autoAdvanceTimer > 90) { // ~1.5 seconds pause after completion
      advanceMode();
    }
  }
}

// =============================================================================
// BRUSH CLASSES: MODES 0, 1, 2 (PRESERVING ORIGINAL MATHEMATICS)
// =============================================================================
class Brush0 {
  constructor(pos, f) {
    this.pos = pos;
    this.lpos = createVector(pos.x, pos.y);
    this.oy = pos.y;
    this.f = f;
    this.of = f;
    this.alive = true;
    this.type = floor(random(3));
    this.speed = random(2, 8);
    this.sw = map(this.pos.y, 0, height, 2, 1);
  }

  move() {
    this.pos.x += this.speed * params.speedMult;
    let bump = map(this.pos.y, -height / 2, 3 * height / 2, -8, 8, true);
    this.pos.y += bump * (0.45 - noise(
      this.pos.x / (100 * params.noiseScale),
      height + this.pos.y / (120 * params.noiseScale),
      (frameCount / 1000) * params.noiseSpeed
    ));

    let sdiv = Math.max(0.1, map(suny, 0, height / 2 + 160, 40, 1));
    let sunDist = dist(this.pos.x, this.pos.y, width / 2, suny);

    if (this.pos.y < height / 2 && sunDist < (height / 8) * params.sunRadiusScale) {
      this.f = suncolor;
    } else if (suny < height / 2 + height / 16 && this.pos.y > height / 2 && floor(random(1 + Math.abs(this.pos.x - width / 2) / sdiv)) === 0) {
      this.f = suncolor;
    } else {
      this.f = this.of;
    }
  }

  show() {
    push();
    if (this.type === 0) blendMode(MULTIPLY);
    else if (this.type === 1) blendMode(HARD_LIGHT);
    else blendMode(BLEND);

    stroke(this.f);
    strokeWeight(this.sw * params.strokeWeightMult);
    line(this.pos.x, this.pos.y, this.lpos.x, this.lpos.y);

    if (this.pos.x > width) {
      this.pos.x = random(-width / 2, 0);
      this.f = this.of;
      this.pos.y = this.oy;
      if (suny > height / 2 + 160) this.alive = false;
    }

    this.lpos.x = this.pos.x;
    this.lpos.y = this.pos.y;
    pop();
  }
}

class Brush1 {
  constructor(r, sc, wc) {
    this.ang = random(TAU);
    this.pos = createVector(r * cos(this.ang), r * sin(this.ang));
    this.lpos = createVector(this.pos.x, this.pos.y);
    this.r = r;
    this.sc = sc;
    this.wc = wc;
    this.osc = sc;
    this.owc = wc;
    this.alive = true;
    this.type = floor(random(3));
    this.speed = map(r, 0, width / 2, PI / 90, PI / 360);
    this.sw = 2;
  }

  move() {
    this.ang += this.speed * params.speedMult;
    let bump = map(this.r, 0, height / 2, 1, 6, true);
    this.r += (0.48 - noise(
      this.r / (200 * params.noiseScale),
      this.ang * 10,
      (frameCount / 1000) * params.noiseSpeed
    )) * bump;

    this.pos.x = this.r * cos(this.ang);
    this.pos.y = this.r * sin(this.ang);

    let sdiv = Math.max(0.1, map(suny, 0, height / 2 + 80, 40, 1));
    let sc = lerpColor(parseCol(colorA), parseCol(colorB), constrain(map(this.pos.y, -height / 2, 0, 0, 1), 0, 1));
    let wc = lerpColor(parseCol(colorC), parseCol(colorD), constrain(map(this.pos.y, 0, height / 2, 0, 1), 0, 1));

    if (this.pos.y < 0) this.f = sc;
    else this.f = wc;

    if (this.pos.y < 0 && dist(this.pos.x, this.pos.y, 0, suny) < (height / 8) * params.sunRadiusScale) {
      this.f = suncolor;
    }
    if (suny < 0 && this.pos.y > 0 && floor(random(1 + Math.abs(this.pos.x) / sdiv)) === 0) {
      this.f = suncolor;
    }
  }

  show() {
    push();
    if (this.type === 0) blendMode(MULTIPLY);
    else if (this.type === 1) blendMode(HARD_LIGHT);
    else blendMode(BLEND);

    stroke(this.f);
    strokeWeight(this.sw * params.strokeWeightMult);
    line(this.pos.x, this.pos.y, this.lpos.x, this.lpos.y);

    if (suny > 160 && Math.abs(sin(this.ang)) < 0.02) {
      this.alive = false;
    }

    this.lpos.x = this.pos.x;
    this.lpos.y = this.pos.y;
    pop();
  }
}

class Brush2 {
  constructor(ang) {
    this.ang = ang;
    this.oang = ang;
    this.pos = createVector(0, suny);
    this.lpos = createVector(0, suny);
    this.r = 0;
    this.alive = true;
    this.type = floor(random(3));
    this.speed = random(2, 2.2);
    this.sw = 2;
  }

  move() {
    this.r += 2 * params.speedMult; // this.speed
    this.ang += (0.48 - noise(
      height + this.pos.y / (120 * params.noiseScale),
      width + this.pos.x / (120 * params.noiseScale),
      (frameCount / 1000) * params.noiseSpeed
    )) / 100;

    this.pos.x = this.r * cos(this.ang);
    this.pos.y = suny + this.r * sin(this.ang);

    let sdiv = Math.max(0.1, map(suny, 0, height / 2 + 80, 40, 1));
    let sc = lerpColor(parseCol(colorA), parseCol(colorB), constrain(map(this.pos.y, -height / 2, 0, 0, 1), 0, 1));
    let wc = lerpColor(parseCol(colorC), parseCol(colorD), constrain(map(this.pos.y, 0, height / 2, 0, 1), 0, 1));

    if (this.pos.y < 0) this.f = sc;
    else this.f = wc;

    if (this.pos.y < 0 && dist(this.pos.x, this.pos.y, 0, suny) < (height / 8) * params.sunRadiusScale) {
      this.f = suncolor;
    }
    if (suny < 80 && this.pos.y > 0 && floor(random(1 + Math.abs(this.pos.x) / sdiv)) === 0) {
      this.f = suncolor;
    }
  }

  show() {
    push();
    if (this.type === 0) blendMode(MULTIPLY);
    else if (this.type === 1) blendMode(HARD_LIGHT);
    else blendMode(BLEND);

    stroke(this.f);
    strokeWeight(this.sw * params.strokeWeightMult);
    line(this.pos.x, this.pos.y, this.lpos.x, this.lpos.y);

    if (suny > height / 4 && this.r > width / 2) {
      this.alive = false;
    }

    this.lpos.x = this.pos.x;
    this.lpos.y = this.pos.y;

    if (this.r > width / 2) {
      this.pos.x = 0;
      this.pos.y = suny;
      this.lpos.x = 0;
      this.lpos.y = suny;
      this.r = 0;
      this.ang = this.oang;
    }
    pop();
  }
}

class BrushMountainRidge {
  constructor(tier, x, baseY, amp, seed) {
    this.tier = tier;
    this.baseY = baseY;
    this.amp = amp;
    this.seed = seed;
    this.rx = x;
    this.ry = this.getRidgeHeight(x);
    this.pos = createVector(this.rx, this.ry + random(0, 15));
    this.lpos = createVector(this.pos.x, this.pos.y);
    this.alive = true;
    this.type = floor(random(3));
    this.speed = random(1.8, 3.8);
    this.sw = map(tier, 0, 3, 1.5, 2.8);

    // Color gradient from hazy distance to foreground rock
    let c1 = lerpColor(parseCol(colorB), parseCol(colorC), map(tier, 0, 3, 0.2, 0.8));
    let c2 = lerpColor(parseCol(colorC), parseCol(colorD), map(tier, 0, 3, 0.1, 0.9));
    this.baseCol = lerpColor(c1, c2, random(0.2, 0.8));
    this.f = this.baseCol;
  }

  getRidgeHeight(x) {
    let n1 = noise(x * 0.0028 + this.seed, this.tier * 10);
    let n2 = noise(x * 0.0075 + this.seed, 50);
    return this.baseY - (n1 * this.amp + n2 * (this.amp * 0.45));
  }

  move() {
    // Flow down the mountain slope facets
    let slope = (this.getRidgeHeight(this.pos.x + 10) - this.getRidgeHeight(this.pos.x - 10)) / 20;
    this.pos.x += (slope * 2.2 + 0.8) * this.speed * params.speedMult;
    this.pos.y += (1.4 + abs(slope) * 1.8) * this.speed * params.speedMult;
    this.pos.y += (0.47 - noise(this.pos.x / (90 * params.noiseScale), this.pos.y / (90 * params.noiseScale), frameCount / 800)) * 3;

    // Alpenglow & Rim lighting: slope facing the sun catches sunset glow
    let sunDist = dist(this.pos.x, this.pos.y, width * 0.5, suny);
    let nearCrest = abs(this.pos.y - this.getRidgeHeight(this.pos.x)) < 22;
    if (nearCrest && (sunDist < (height * 0.35) * params.sunRadiusScale || slope * (width * 0.5 - this.pos.x) > 0)) {
      this.f = suncolor;
    } else {
      this.f = this.baseCol;
    }
  }

  show() {
    push();
    if (this.type === 0) blendMode(MULTIPLY);
    else if (this.type === 1) blendMode(HARD_LIGHT);
    else blendMode(BLEND);

    stroke(this.f);
    strokeWeight(this.sw * params.strokeWeightMult);
    line(this.pos.x, this.pos.y, this.lpos.x, this.lpos.y);

    // Reset when slope flows into lower valley
    if (this.pos.y > this.baseY + this.amp * 1.5 || this.pos.x > width + 50 || this.pos.x < -50) {
      this.pos.x = random(-width * 0.1, width * 1.1);
      this.pos.y = this.getRidgeHeight(this.pos.x) + random(0, 8);
      this.lpos.set(this.pos.x, this.pos.y);
      if (suny > height * 0.65) this.alive = false;
    }
    this.lpos.set(this.pos.x, this.pos.y);
    pop();
  }
}

class BrushMountainMist {
  constructor() {
    this.pos = createVector(random(0, width), random(height * 0.45, height * 0.9));
    this.lpos = createVector(this.pos.x, this.pos.y);

  move() {
    this.pos.x += this.speed * params.speedMult;

  show() {

    strokeWeight(this.sw * params.strokeWeightMult);

}

class BrushGodRay {
  constructor(ang) {

    this.r += this.speed * params.speedMult;

    this.pos.x = width * 0.5 + this.r * cos(rayAngle);

    line(this.pos.x, this.pos.y, this.lpos.x, this.lpos.y);

      this.lpos.set(this.pos.x, this.pos.y);

class BrushTreeTrunk {

    this.speed = random(2.2, 4.2);
    this.type = floor(random(3));
    this.baseCol = lerpColor(parseCol(colorC), parseCol('#100804'), random(0.2, 0.7));
  }

  move() {
    this.pos.y -= this.speed * params.speedMult;
    this.pos.x = this.tx + (noise(this.pos.y / 45, this.treeIdx * 10) - 0.49) * 8;
    this.sw = map(this.pos.y, height, this.apexY, this.baseW, 1.2, true);

    // Trunk rim catch when sun is low
    if (dist(this.pos.x, this.pos.y, width * 0.5, suny) < (height / 6) * params.sunRadiusScale) {
      this.f = suncolor;
    } else {
      this.f = this.baseCol;
    }
  }

  show() {
    push();
    if (this.type === 0) blendMode(MULTIPLY);
    else blendMode(BLEND);

    stroke(this.f);
    strokeWeight(this.sw * params.strokeWeightMult);
    line(this.pos.x, this.pos.y, this.lpos.x, this.lpos.y);

    if (this.pos.y < this.apexY) {
      this.pos.y = height + random(0, 10);
      this.lpos.set(this.pos.x, this.pos.y);
      if (suny > height * 0.7) this.alive = false;
    }
    this.lpos.set(this.pos.x, this.pos.y);
    pop();
  }
}

class BrushPineNeedles {
  constructor(tx, tierY, side, span, tierIdx) {
    this.tx = tx;
    this.tierY = tierY;
    this.side = side; // -1 for left, 1 for right
    this.span = span;
    this.tierIdx = tierIdx;
    this.r = 0;
    this.pos = createVector(tx, tierY);
    this.lpos = createVector(this.pos.x, this.pos.y);
    this.alive = true;
    this.speed = random(1.6, 3.2);
    this.type = floor(random(3));
    this.baseAng = side === 1 ? random(0.05, 0.35) : random(PI - 0.35, PI - 0.05);

    let c1 = parseCol(colorC);
    let c2 = parseCol(colorD);
    this.baseCol = lerpColor(c1, c2, random(0.2, 0.8));
    this.f = this.baseCol;
  }

  move() {
    this.r += this.speed * params.speedMult;
    let sway = (0.48 - noise(this.pos.x / 60, this.pos.y / 60, frameCount / 800)) * 0.12;
    // Slight drooping curve as branch extends
    let droop = map(this.r, 0, this.span, 0, 0.25);
    let curAng = this.baseAng + sway + (this.side === 1 ? droop : -droop);

    this.pos.x = this.tx + this.r * cos(curAng);
    this.pos.y = this.tierY + this.r * sin(curAng) + pow(this.r / this.span, 1.8) * 12;

    // Outer needle tips catch golden sunset sparkle
    if (this.r > this.span * 0.75 && (dist(this.pos.x, this.pos.y, width * 0.5, suny) < (height * 0.4) * params.sunRadiusScale)) {
      this.f = suncolor;
    } else {
      this.f = this.baseCol;
    }
  }

  show() {
    push();
    if (this.type === 0) blendMode(MULTIPLY);
    else if (this.type === 1) blendMode(HARD_LIGHT);
    else blendMode(BLEND);

    stroke(this.f);
    strokeWeight(random(1.2, 2.2) * params.strokeWeightMult);
    line(this.pos.x, this.pos.y, this.lpos.x, this.lpos.y);

    if (this.r > this.span) {
      this.r = 0;
      this.pos.set(this.tx, this.tierY);
      this.lpos.set(this.pos.x, this.pos.y);
      if (suny > height * 0.7) this.alive = false;
    }
    this.lpos.set(this.pos.x, this.pos.y);
    pop();
  }
}

class BrushCanyonSky {
  constructor(pos, f) {
    this.pos = pos;
    this.lpos = createVector(pos.x, pos.y);
    this.f = f;
    this.of = f;
    this.speed = random(2.5, 6);
    this.alive = true;
    this.sw = 2;
  }

  move() {
    this.pos.x += this.speed * params.speedMult;
    let bump = map(this.pos.y, 0, height * 0.4, -3, 3, true);
    this.pos.y += bump * (0.47 - noise(this.pos.x / 120, this.pos.y / 120, frameCount / 900));

    if (dist(this.pos.x, this.pos.y, width * 0.5, suny) < (height / 7) * params.sunRadiusScale) {
      this.f = suncolor;
    } else {
      this.f = this.of;
    }
  }

  show() {
    push();
    blendMode(BLEND);
    stroke(this.f);
    strokeWeight(this.sw * params.strokeWeightMult);
    line(this.pos.x, this.pos.y, this.lpos.x, this.lpos.y);

    if (this.pos.x > width) {
      this.pos.x = random(-width * 0.3, 0);
      this.lpos.x = this.pos.x;
      if (suny > height * 0.68) this.alive = false;
    }
    this.lpos.set(this.pos.x, this.pos.y);
    pop();
  }
}

class BrushCanyonCliff {
  constructor(x, y, side) {
    this.side = side; // -1 for left cliff, 1 for right cliff
    this.ox = x;
    this.oy = y;
    this.pos = createVector(x, y);
    this.lpos = createVector(this.pos.x, this.pos.y);
    this.alive = true;
    this.type = floor(random(3));
    this.speed = random(1.5, 3.5);
    this.sw = random(1.8, 3.2);

    let rockBase = lerpColor(parseCol(colorC), parseCol('#0c0705'), random(0.3, 0.8));
    this.baseCol = rockBase;
    this.f = this.baseCol;
  }

  move() {
    // Horizontal and vertical basalt/granite striations
    this.pos.x += (this.side * 0.6 + (noise(this.pos.y / 35, frameCount / 800) - 0.5) * 1.5) * this.speed * params.speedMult;
    this.pos.y += (0.48 - noise(this.pos.x / 40, this.pos.y / 40, frameCount / 800)) * 2;

    // Canyon rim caught by setting sun
    let nearEdge = (this.side === -1 && this.pos.x > width * 0.28) || (this.side === 1 && this.pos.x < width * 0.72);
    if (nearEdge && dist(this.pos.x, this.pos.y, width * 0.5, suny) < (height * 0.4) * params.sunRadiusScale) {
      this.f = suncolor;
    } else {
      this.f = this.baseCol;
    }
  }

  show() {
    push();
    if (this.type === 0) blendMode(MULTIPLY);
    else if (this.type === 1) blendMode(HARD_LIGHT);
    else blendMode(BLEND);

    stroke(this.f);
    strokeWeight(this.sw * params.strokeWeightMult);
    line(this.pos.x, this.pos.y, this.lpos.x, this.lpos.y);

    let outOfBounds = (this.side === -1 && (this.pos.x > width * 0.33 || this.pos.x < -20)) ||
                      (this.side === 1 && (this.pos.x < width * 0.67 || this.pos.x > width + 20));
    if (outOfBounds) {
      this.pos.set(this.ox, this.oy);
      this.lpos.set(this.pos.x, this.pos.y);
      if (suny > height * 0.68) this.alive = false;
    }
    this.lpos.set(this.pos.x, this.pos.y);
    pop();
  }
}

class BrushWaterfallRiver {

    this.pos.y += this.vy;
    this.pos.x += (noise(this.pos.y / 45, this.seed, (frameCount / 700) * params.noiseSpeed) - 0.49) * 3.5;

    // Catch sunset light through the falling mist
    if (dist(this.pos.x, this.pos.y, width * 0.5, suny) < (height * 0.4) * params.sunRadiusScale) {

      this.f = this.baseCol;

class BrushWaterfallBasin {

    this.pos.x += cos(this.ang) * this.speed * params.speedMult;
    this.pos.y += (0.48 - noise(this.pos.x / 50, this.pos.y / 50, frameCount / 600)) * 2;

    let sdiv = Math.max(0.1, map(suny, 0, height * 0.7, 40, 1));
    if (floor(random(1 + Math.abs(this.pos.x - width * 0.5) / sdiv)) === 0) {
      this.f = suncolor;
    } else {
      this.f = lerpColor(parseCol(colorD), parseCol('#ffffff'), random(0.1, 0.5));

  show() {

    blendMode(HARD_LIGHT);

    strokeWeight(this.sw * params.strokeWeightMult);

    if (this.pos.x < width * 0.1 || this.pos.x > width * 0.9 || this.pos.y > height) {
      this.pos.set(random(width * 0.35, width * 0.65), random(height * 0.82, height * 0.88));
      this.lpos.set(this.pos.x, this.pos.y);
      this.ang = random(TAU);
      if (suny > height * 0.68) this.alive = false;

// =============================================================================
// INTERACTIVE CONTROL & PROCEDURAL RANDOMIZATION
// =============================================================================
function mousePressed(event) {
  // Check if click was on HUD, buttons, or GUI
  if (event && event.target) {
    if (
      event.target.closest('#hud') ||
      event.target.closest('#action-bar') ||
      event.target.closest('.lil-gui') ||
      event.target.closest('#toast')
    ) {
      return;
    }
  }

  // Ignore clicks outside canvas bounds
  if (mouseX < 0 || mouseX > width || mouseY < 0 || mouseY > height) {
    return;
  }

  // Requirement 6: Randomization on user click
  if (params.randomizeOnClick) {
    randomizeProcedural();
  } else {
    advanceMode();
  }
}

function advanceMode() {
  mode = (mode + 1) % 6;
  params.mode = mode;
  frameCount = 0;
  makeBrushes();
  syncGUIControllers();
}

function randomizeProcedural() {
  // 1. Pick a random palette from 19 schemes
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  applyPalette(randomKey, false);

  // 2. Re-roll geometric and motion parameters within aesthetic bounds
  params.sunSpeedMult = +(0.65 + Math.random() * 1.1).toFixed(2);
  params.speedMult = +(0.7 + Math.random() * 0.9).toFixed(2);
  params.noiseScale = +(0.7 + Math.random() * 0.9).toFixed(2);
  params.noiseSpeed = +(0.7 + Math.random() * 0.8).toFixed(2);
  params.strokeWeightMult = +(0.8 + Math.random() * 0.9).toFixed(2);
  params.sunRadiusScale = +(0.8 + Math.random() * 0.7).toFixed(2);

  // 3. Advance mode across all 6 scene variants
  mode = (mode + 1) % 6;
  params.mode = mode;

  // 4. Update control panel & regenerate silently (no toast)
  syncGUIControllers();
  frameCount = 0;
  makeBrushes();
}

function applyPalette(key, redrawNow = true) {
  const scheme = COLOR_SCHEMES[key];
  if (!scheme) return;

  params.palettePreset = key;
  params.colorA = scheme.colorA;
  params.colorB = scheme.colorB;
  params.colorC = scheme.colorC;
  params.colorD = scheme.colorD;
  params.colorE = scheme.colorE;
  params.colorF = scheme.colorF;
  params.background = scheme.background;

  colorA = params.colorA;
  colorB = params.colorB;
  colorC = params.colorC;
  colorD = params.colorD;
  colorE = params.colorE;
  colorF = params.colorF;

  syncGUIControllers();
  if (redrawNow) {
    frameCount = 0;
    makeBrushes();
  }
}

function keyPressed() {
  if (key === ' ' || keyCode === 32) {
    // Spacebar to restart current scene
    frameCount = 0;
    makeBrushes();
    showToast('Canvas Restarted');
    return false;
  }
  if (key === 'm' || key === 'M') {
    advanceMode();
  }
  if (key === 'r' || key === 'R') {
    randomizeProcedural();
  }
  if (key === 'p' || key === 'P') {
    togglePause();
  }
  if (key === 's' || key === 'S') {
    exportCanvas();
  }
  if (key === 'f' || key === 'F') {
    toggleFullscreen();
  }
  if (key === 'h' || key === 'H') {
    toggleUI();
  }
}

function windowResized() {
  // Seamless edge-to-edge resize
  resizeCanvas(windowWidth, windowHeight);
  frameCount = 0;
  makeBrushes();
}

// =============================================================================
// UI, HUD & ACTION BAR CONTROLLERS
// =============================================================================
function initGUI() {
  const GUIClass = window.lil ? window.lil.GUI : null;
  if (!GUIClass) return;

  gui = new GUIClass({ title: 'Sunset Brushes Controls', width: 310 });
  gui.domElement.style.position = 'fixed';
  gui.domElement.style.top = '24px';
  gui.domElement.style.right = '24px';
  gui.domElement.style.zIndex = '50';

  // Folder: Scene & Mode
  const fMode = gui.addFolder('Scene & Composition');
  fMode.add(params, 'mode', {
    'Mode 0: Ocean Horizon': 0,
    'Mode 1: Swirl Vortex': 1,
    'Mode 2: Solar Rays': 2,
    'Mode 3: Misty Mountains': 3,
    'Mode 4: Twilight Forest': 4,
    'Mode 5: Cascading Waterfall': 5
  }).name('Sunset Scene').listen().onChange(val => {
    mode = parseInt(val, 10);
    frameCount = 0;
    makeBrushes();
  });
  
  fMode.add(params, 'randomizeOnClick').name('Randomize on Click');
  fMode.add(params, 'autoAdvance').name('Auto Next on Finish');

  // Folder: Palettes & Colors
  const fColors = gui.addFolder('19 Color Schemes & Hues');
  const paletteOptions = {};
  for (let k in COLOR_SCHEMES) {
    paletteOptions[COLOR_SCHEMES[k].name] = k;
  }
  fColors.add(params, 'palettePreset', paletteOptions).name('Preset').listen().onChange(k => {
    applyPalette(k, true);
  });

  fColors.addColor(params, 'colorA').name('Upper Sky (colorA)').listen().onChange(v => { colorA = v; });
  fColors.addColor(params, 'colorB').name('Horizon Sky (colorB)').listen().onChange(v => { colorB = v; });
  fColors.addColor(params, 'colorC').name('Silhouettes/Rock (colorC)').listen().onChange(v => { colorC = v; });
  fColors.addColor(params, 'colorD').name('Water/Foliage (colorD)').listen().onChange(v => { colorD = v; });
  fColors.addColor(params, 'colorE').name('Sun Core (colorE)').listen().onChange(v => { colorE = v; });
  fColors.addColor(params, 'colorF').name('Sun Flare (colorF)').listen().onChange(v => { colorF = v; });
  fColors.addColor(params, 'background').name('Background').listen().onChange(v => {
    background(v);
    makeBrushes();
  });

  // Folder: Dynamics & Turbulence
  const fDynamics = gui.addFolder('Dynamics & Speed');
  fDynamics.add(params, 'sunSpeedMult', 0.2, 3.0, 0.05).name('Sun Descent Speed').listen();
  fDynamics.add(params, 'speedMult', 0.2, 3.0, 0.05).name('Brush Speed').listen();
  fDynamics.add(params, 'noiseScale', 0.3, 3.0, 0.05).name('Noise Scale').listen();
  fDynamics.add(params, 'noiseSpeed', 0.2, 3.0, 0.05).name('Wave Flow Speed').listen();
  fDynamics.add(params, 'strokeWeightMult', 0.4, 3.5, 0.1).name('Stroke Weight').listen();
  fDynamics.add(params, 'sunRadiusScale', 0.4, 2.5, 0.1).name('Sun Halo Radius').listen();

  // Folder: Actions
  const fActions = gui.addFolder('Actions');
  fActions.add({ randomize: randomizeProcedural }, 'randomize').name('🎲 Randomize Scene');
  fActions.add({ advance: advanceMode }, 'advance').name('⏩ Next Mode');
  fActions.add({ restart: () => { frameCount = 0; makeBrushes(); showToast('Canvas Restarted'); } }, 'restart').name('🔄 Restart Mode');
  fActions.add({ pause: togglePause }, 'pause').name('⏸️ Pause / Play');
  fActions.add({ toggleFS: toggleFullscreen }, 'toggleFS').name('⛶ Fullscreen (F)');
  fActions.add({ exportImg: exportCanvas }, 'exportImg').name('📸 Save PNG (S)');

  // Collapsed by default on small viewports
  if (window.innerWidth < 768) {
    gui.close();
  }
}

function syncGUIControllers() {
  if (!gui) return;
  if (typeof gui.controllersRecursive === 'function') {
    gui.controllersRecursive().forEach(c => c.updateDisplay());
  } else if (gui.controllers) {
    gui.controllers.forEach(c => c.updateDisplay());
    if (gui.folders) {
      gui.folders.forEach(f => {
        if (f.controllers) f.controllers.forEach(c => c.updateDisplay());
      });
    }
  }
}

function updateHUD() {
  const badge = document.getElementById('hud-mode-badge');
  const paletteName = document.getElementById('hud-palette-name');
  if (badge) {
    const shortNames = ['Horizon', 'Swirl', 'Solar Rays', 'Mountains', 'Forest', 'Waterfall'];
    badge.innerText = `Mode ${mode}: ${shortNames[mode] || 'Sunset'}`;
  }
  if (paletteName) {
    const curScheme = COLOR_SCHEMES[params.palettePreset];
    paletteName.innerText = curScheme ? curScheme.name : params.palettePreset;
  }
}

function updateHUDProgress() {
  let progress = 0;
  if (mode === 0) {
    progress = constrain(map(suny, 0, height / 2 + 160, 0, 100), 0, 100);
  } else if (mode === 1) {
    progress = constrain(map(suny, -height / 2, 160, 0, 100), 0, 100);
  } else if (mode === 2) {
    progress = constrain(map(suny, -height / 2, height / 4, 0, 100), 0, 100);
  } else if (mode === 3) {
    progress = constrain(map(suny, height * 0.08, height * 0.6, 0, 100), 0, 100);
  } else if (mode === 4) {
    progress = constrain(map(suny, height * 0.12, height * 0.65, 0, 100), 0, 100);
  } else if (mode === 5) {
    progress = constrain(map(suny, height * 0.08, height * 0.68, 0, 100), 0, 100);
  }

  const fill = document.getElementById('hud-progress-fill');
  const num = document.getElementById('hud-progress-num');
  const brushSpan = document.getElementById('hud-brush-count');
  const fpsSpan = document.getElementById('hud-fps');

  if (fill) fill.style.width = `${progress.toFixed(0)}%`;
  if (num) num.innerText = `${progress.toFixed(0)}%`;
  if (brushSpan) brushSpan.innerText = brushes.length;
  if (fpsSpan) fpsSpan.innerText = Math.round(frameRate() || 60);
}

function togglePause() {
  params.isPaused = !params.isPaused;
  const btnLabel = document.getElementById('pause-text');
  if (btnLabel) btnLabel.innerText = params.isPaused ? 'Resume' : 'Pause';
  showToast(params.isPaused ? 'Animation Paused' : 'Animation Resumed');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    showToast('Fullscreen Enabled (F)');
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
      showToast('Fullscreen Exited');
    }
  }
}

function toggleUI() {
  params.hideUI = !params.hideUI;
  const hud = document.getElementById('hud');
  const bar = document.getElementById('action-bar');
  if (hud) hud.classList.toggle('hidden-ui', params.hideUI);
  if (bar) bar.classList.toggle('hidden-ui', params.hideUI);
  if (gui && gui.domElement) gui.domElement.classList.toggle('hidden-ui', params.hideUI);
  showToast(params.hideUI ? 'UI Hidden (Press H to restore)' : 'UI Restored');
}

function exportCanvas() {
  const timeStamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const fileName = `sunset_brushes_mode${mode}_${timeStamp}.png`;
  saveCanvas(fileName);
  showToast(`📸 Saved: ${fileName}`);
}

// Toast notification helper
let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.innerText = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2300);
}

// Connect action bar buttons
window.addEventListener('DOMContentLoaded', () => {
  const btnMode = document.getElementById('btn-mode');
  const btnRandom = document.getElementById('btn-random');
  const btnPause = document.getElementById('btn-pause');
  const btnSave = document.getElementById('btn-save');
  const btnFullscreen = document.getElementById('btn-fullscreen');

  if (btnMode) btnMode.addEventListener('click', advanceMode);
  if (btnRandom) btnRandom.addEventListener('click', randomizeProcedural);
  if (btnPause) btnPause.addEventListener('click', togglePause);
  if (btnSave) btnSave.addEventListener('click', exportCanvas);
  if (btnFullscreen) btnFullscreen.addEventListener('click', toggleFullscreen);
});

// Explicit p5 bootstrap fallback in case of delayed DOM load
if (typeof p5 !== 'undefined' && !p5.instance) {
  new p5();
}
  </script>
</body>
