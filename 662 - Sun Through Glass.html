<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b7bdc1">
  <meta name="description" content="A vermilion sun and ink-wash mountains, slowly breathing behind fluted glass. A procedural, seamless Three.js study.">
  <link rel="icon" href="data:,">
  <title>Vermilion / Through Glass</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #b7bdc1; }
    body { background: radial-gradient(circle at 50% 35%, #d90b05 0 10%, transparent 23%), #b7bdc1; }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .error { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; background: #b7bdc1; color: #4d5963; font: 14px/1.7 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
<script type="module">
/*
 * VERMILION / THROUGH GLASS
 * Four passes: procedural landscape -> horizontal diffusion -> vertical
 * diffusion -> optical refraction. No image, texture, font, or build assets.
 * Open this file directly; pinned Three.js and lil-gui need the network.
 * Every animated input derives from a circular 30-second time domain.
 */
let renderer;
try {
  let THREE;
  try {
    THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  } catch {
    THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
  }
  let GUI;
  try {
    ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
  } catch {
    ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
  }

  const LOOP_DURATION = 30;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  // Sun, halo, mist, far ink, near ink, background. Both achromatic presets
  // have an independent polarity toggle, retaining exactly nineteen schemes.
  const palettes = {
    'Original': ['e10600', 'c22b21', 'cad1d4', '7a878f', '4a5963', 'b7bdc1'],
    'Monochromatic': ['446277', '617b8d', 'd0dce3', '7d96a7', '334a5a', 'b7c5cf'],
    'Analogous': ['e87240', 'c94442', 'e5d5cc', '9d7f8e', '5c536a', 'c9bec6'],
    'Complementary': ['ee4c32', 'be452c', 'd7dfdd', '648e95', '345765', 'b8cbd0'],
    'Split-complementary': ['ec6339', 'c74330', 'e2e0ce', '7e9c82', '4c6279', 'c3cecb'],
    'Triadic': ['e65347', 'c94149', 'dddacb', '8d9980', '575c88', 'c7cbd5'],
    'Tetradic': ['e86138', 'c64750', 'dfd9bd', '719b8e', '60517c', 'becbc8'],
    'Double split-complementary': ['ef7a3e', 'b84452', 'e4d8c6', '91a388', '546b87', 'c4cdd1'],
    'Achromatic': ['ffffff', 'bcbcbc', 'e4e4e4', '8a8a8a', '454545', '171717'],
    'Achromatic + Accent': ['ef2417', 'a31812', 'e4e4e4', '929292', '404040', '151515'],
    'Neutral + accent': ['df431d', 'ad3724', 'eee7d8', 'aa9d8e', '5c5750', 'd4cdbf'],
    'Amber / Ember': ['F6AA1C', 'BC3908', 'F6AA1C', '941B0C', '220901', '220901'],
    'Turquoise / Midnight': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
    'Orchid / Plum': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
    'Saffron / Lagoon': ['FEF1BE', 'FFBA00', 'FEF1BE', '008189', '00474D', '061210'],
    'Lime / Forest': ['D4FFB0', '7FFF00', 'D4FFB0', '00B894', '0A3322', '05140A'],
    'Tangerine / Aubergine': ['FFE8CC', 'FF8C00', 'FFE8CC', 'C7501A', '3D1050', '0E0618'],
    'Lavender / Indigo': ['E8E0FF', 'B38FFF', 'E8E0FF', '6A3DE8', '1A1250', '090612'],
    'Cyan / Magenta': ['E0FBFF', '00F0FF', 'E0FBFF', 'D40078', '1E0A3D', '05020F']
  };
  const animations = ['Static', 'Liquid breathing', 'Mist drift', 'Tidal ink',
                      'Sun reverie', 'Lens breathing', 'Gentle orbit', 'Slow passage'];
  const settings = {
    palette: 'Original', invertAchromatic: false,
    sun: '#e10600', halo: '#c22b21', mist: '#cad1d4',
    farInk: '#7a878f', nearInk: '#4a5963', background: '#b7bdc1',
    greenscreen: false, pixelRatio: Math.min(devicePixelRatio || 1, 1.75),
    animation: reducedMotion.matches ? 'Static' : 'Liquid breathing',
    speed: 1, motionAmount: 1, zoom: 1, panX: 0, panY: 0,
    angle: 0, orbitTilt: 25, cameraAmount: 1,
    sunRadius: 0.305, sunIntensity: 1, fogDensity: 0.64,
    glassChannels: Math.max(12, Math.min(20, innerWidth / 48)),
    refraction: 1, softness: 1, mountainHeight: 1, seed: 0,
    clickRandomize: true
  };
  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0xb7bdc1, 1);
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.domElement.setAttribute('role', 'img');
  renderer.domElement.setAttribute('aria-label', 'A glowing vermilion sun above misty ink-wash mountains, refracted through vertical translucent glass.');
  document.body.appendChild(renderer.domElement);

  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const scene = new THREE.Scene();
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
  const vertexShader = /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `;
  const common = {
    uTime: { value: 0 },
    uResolution: { value: new THREE.Vector2() },
    uAspect: { value: 1 },
    uLoopDuration: { value: LOOP_DURATION },
    uMotion: { value: 1 },
    uAnimation: { value: 1 },
    uSeed: { value: 0 }
  };
  const landscape = new THREE.ShaderMaterial({
    vertexShader,
    depthTest: false, depthWrite: false,
    uniforms: {
      ...common,
      uFogDensity: { value: 0.64 },
      uSunRadius: { value: 0.305 },
      uSunIntensity: { value: 1.0 },
      uMountainHeight: { value: 1 },
      uSun: { value: new THREE.Vector3() },
      uHalo: { value: new THREE.Vector3() },
      uMist: { value: new THREE.Vector3() },
      uFarInk: { value: new THREE.Vector3() },
      uNearInk: { value: new THREE.Vector3() }
    },
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform float uTime, uAspect, uLoopDuration;
      uniform float uFogDensity, uSunRadius, uSunIntensity;
      uniform float uMotion, uAnimation, uSeed, uMountainHeight;
      uniform vec3 uSun, uHalo, uMist, uFarInk, uNearInk;
      const float TAU = 6.28318530718;

      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float noise(vec2 p) {
        p += vec2(uSeed * 0.73, uSeed * 0.37);
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
                   mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
      }
      float fbm(vec2 p) {
        float value = 0.0, amplitude = 0.5;
        mat2 turn = mat2(0.80, -0.60, 0.60, 0.80);
        for (int i = 0; i < 4; i++) {
          value += amplitude * noise(p);
          p = turn * p * 2.03 + 13.7;
          amplitude *= 0.5;
        }
        return value;
      }
      float bell(float x) { return exp(-x * x); }
      void over(inout vec4 field, vec3 pigment, float opacity) {
        opacity = clamp(opacity, 0.0, 1.0);
        field.rgb = mix(field.rgb, pigment, opacity);
        field.a = opacity + field.a * (1.0 - opacity);
      }

      void main() {
        float phase = TAU * mod(uTime, uLoopDuration) / uLoopDuration;
        vec2 loopTime = vec2(1.0, 0.0) + (vec2(cos(phase), sin(phase)) - vec2(1.0, 0.0)) * uMotion;
        float mistMotion = uAnimation == 2.0 ? 2.0 : 1.0;
        float inkMotion = uAnimation == 3.0 ? 2.2 : 1.0;
        float sunMotion = uAnimation == 4.0 ? 2.3 : 1.0;
        float framing = min(uAspect, 0.82);
        vec2 p = vec2((vUv.x - 0.5) * uAspect, vUv.y);
        float x = p.x / framing;
        // Premultiplied pigment and coverage travel together through every pass.
        // The backdrop is composited last, so green never bleeds into the blur.
        vec4 color = vec4(0.0);

        // A softly displaced distance field, with a restrained red scattering halo.
        vec2 sun = vec2(p.x, p.y - 0.652);
        float radius = uSunRadius * framing * (1.0 + 0.009 * loopTime.x * sunMotion);
        float edgeNoise = noise(sun * 13.0 / framing + loopTime * 0.10) - 0.5;
        float d = length(sun) - radius + edgeNoise * framing * 0.013;
        float softness = framing * 0.033;
        float disk = 1.0 - smoothstep(-softness, softness * 1.65, d);
        float halo = exp(-max(d, 0.0) * max(d, 0.0) / (softness * softness * 7.0));
        over(color, uHalo, halo * 0.13 * uSunIntensity);
        vec3 scarlet = uSun * mix(0.94, 1.035, smoothstep(-radius, 0.0, sun.y));
        over(color, scarlet, disk * 0.985 * uSunIntensity);

        // Broad ink deposits rather than hard terrain. Each layer vanishes into fog.
        for (int i = 0; i < 3; i++) {
          float layer = float(i);
          vec2 drift = loopTime * vec2(0.040, 0.065) * inkMotion;
          float n = fbm(vec2(x * (6.0 + layer * 1.9) + 7.3 * layer, layer * 5.7) + drift);
          float peak = 0.095 * bell((x + 0.035 + layer * 0.10) / 0.16)
                     + 0.041 * bell((x - 0.31) / 0.13)
                     + 0.030 * bell((x + 0.38) / 0.20);
          float ridge = 0.475 - layer * 0.071 + (peak + (n - 0.47) * (0.19 - layer * 0.018)) * uMountainHeight;
          float edge = 1.0 - smoothstep(ridge - 0.025, ridge + 0.030, p.y);
          float dissolve = smoothstep(0.235 - layer * 0.025, ridge - 0.020, p.y);
          float ink = edge * dissolve * (0.73 - layer * 0.10);
          vec3 charcoal = mix(uNearInk, uFarInk, layer * 0.34);
          over(color, charcoal, ink);
        }

        float fogNoise = fbm(vec2(x * 3.8, p.y * 13.0) + loopTime * vec2(0.15, 0.09) * mistMotion);
        float fog = bell((p.y - 0.325 - (fogNoise - 0.45) * 0.13) / 0.105);
        color.rgb = mix(color.rgb, uMist * color.a, fog * uFogDensity);
        // Fog thins the ink instead of adding an opaque rectangle to the matte.
        color *= 1.0 - fog * uFogDensity * 0.23;
        float lowMist = bell((p.y - 0.20) / 0.13);
        color.rgb = mix(color.rgb, uMist * color.a, lowMist * 0.29);
        gl_FragColor = color;
      }
    `
  });

  // Separable Gaussian diffusion. Bilinear filtering combines pairs of taps.
  const blur = new THREE.ShaderMaterial({
    vertexShader, depthTest: false, depthWrite: false,
    uniforms: {
      uTexture: { value: null },
      uDirection: { value: new THREE.Vector2() },
      uBlurAmount: { value: 1.0 }
    },
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTexture;
      uniform vec2 uDirection;
      uniform float uBlurAmount;
      void main() {
        vec2 stepSize = uDirection * uBlurAmount;
        vec4 c = texture2D(uTexture, vUv) * 0.2270270270;
        c += texture2D(uTexture, vUv + stepSize * 1.3846153846) * 0.3162162162;
        c += texture2D(uTexture, vUv - stepSize * 1.3846153846) * 0.3162162162;
        c += texture2D(uTexture, vUv + stepSize * 3.2307692308) * 0.0702702703;
        c += texture2D(uTexture, vUv - stepSize * 3.2307692308) * 0.0702702703;
        gl_FragColor = c;
      }
    `
  });

  const glass = new THREE.ShaderMaterial({
    vertexShader, depthTest: false, depthWrite: false,
    uniforms: {
      ...common,
      uTexture: { value: null },
      uGlassFrequency: { value: 14 },
      uRefractionStrength: { value: 1.0 },
      uBackground: { value: new THREE.Vector3() },
      uGreenscreen: { value: false },
      uZoom: { value: 1 },
      uPan: { value: new THREE.Vector2() },
      uAngle: { value: 0 },
      uTilt: { value: 0 }
    },
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uTime, uLoopDuration, uGlassFrequency, uRefractionStrength;
      uniform float uAspect, uMotion, uAnimation, uSeed, uZoom, uAngle, uTilt;
      uniform vec2 uPan;
      uniform vec3 uBackground;
      uniform bool uGreenscreen;
      const float TAU = 6.28318530718;
      float hash(float n) { return fract(sin(n * 127.1) * 43758.5453); }
      vec4 image(vec2 uv) {
        vec2 p = (uv - 0.5) * vec2(uAspect, 1.0) - uPan;
        float c = cos(uAngle), s = sin(uAngle);
        p = mat2(c, -s, s, c) * p;
        p.x /= max(cos(uTilt), 0.40);
        p /= uZoom;
        uv = p / vec2(uAspect, 1.0) + 0.5;
        vec2 fade = smoothstep(vec2(0.0), vec2(0.025), uv)
                  * (1.0 - smoothstep(vec2(0.975), vec2(1.0), uv));
        return texture2D(uTexture, clamp(uv, 0.001, 0.999)) * fade.x * fade.y;
      }
      void main() {
        float phase = TAU * mod(uTime, uLoopDuration) / uLoopDuration;
        float rib = vUv.x * uGlassFrequency + 0.27;
        float index = floor(rib);
        float f = fract(rib);
        float center = f - 0.5;
        float variation = hash(index + 6.0 + uSeed);
        float lensMotion = uAnimation == 5.0 ? 3.5 : 1.0;
        float breathing = 1.0 + 0.024 * sin(phase + variation * TAU) * uMotion * lensMotion;

        // A rounded cylindrical lens with a steep return at each glass join.
        float curve = sin(center * 3.14159265);
        float edge = exp(-pow((f - 0.965) / 0.055, 2.0));
        float shoulder = exp(-pow((f - 0.075) / 0.095, 2.0));
        vec2 uv = vUv;
        uv.x += (curve * (0.25 + variation * 0.11) + sin(f * TAU) * 0.045)
              / uGlassFrequency * uRefractionStrength * breathing;
        // Stronger vertical shear at the narrow joins stretches the red into slivers.
        uv.y += ((variation - 0.48) * 0.033 * sin(f * 3.14159265)
              + edge * (0.038 + variation * 0.029)
              - shoulder * (0.020 + variation * 0.023)) * uRefractionStrength * breathing;
        uv.y += sin(f * TAU + variation * 2.0) * 0.005;

        vec2 diffusion = vec2(0.0015, 0.0035);
        vec4 pigment = image(uv) * 0.6;
        pigment += image(uv + diffusion) * 0.2;
        pigment += image(uv - diffusion) * 0.2;
        vec3 background = uGreenscreen ? vec3(0.0, 1.0, 0.0)
          : uBackground - vUv.y * 0.026 + 0.022 * exp(-pow((vUv.y - 0.32) / 0.22, 2.0));
        vec3 color = pigment.rgb + background * (1.0 - pigment.a);
        float finishMask = uGreenscreen ? pigment.a : 1.0;

        // Subpixel antialiasing for the stationary, hairline specular seams.
        float aa = max(fwidth(rib), 0.0001);
        float highlight = 1.0 - smoothstep(0.0, aa * 0.86, abs(f - 0.045));
        float shadow = exp(-pow((f - 0.990) / 0.034, 2.0));
        float secondary = exp(-pow((f - 0.10) / 0.030, 2.0));
        color *= 1.0 - shadow * 0.060 * finishMask;
        color += highlight * vec3(0.14) * (0.64 + variation * 0.20) * finishMask;
        color += secondary * 0.010 * finishMask;
        color += (cos(f * TAU - 0.4) * 0.005) * finishMask;

        // Static fine grain: no temporal sparkle and no discontinuity at the loop.
        vec2 pixel = floor(vUv * uResolution);
        float grain = fract(52.9829189 * fract(dot(pixel, vec2(0.06711056, 0.00583715))));
        color += (grain - 0.5) * 0.0030 * finishMask;
        float vignette = smoothstep(0.20, 0.78, length((vUv - 0.5) * vec2(0.70, 0.95)));
        color -= vignette * 0.018 * finishMask;
        gl_FragColor = vec4(color, 1.0);
      }
    `
  });

  const targetOptions = {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: false, stencilBuffer: false,
    type: THREE.HalfFloatType, format: THREE.RGBAFormat
  };
  // Unsigned bytes remain a working fallback on devices without half-float targets.
  if (!renderer.extensions.has('EXT_color_buffer_float')) targetOptions.type = THREE.UnsignedByteType;
  const field = new THREE.WebGLRenderTarget(1, 1, targetOptions);
  const horizontal = new THREE.WebGLRenderTarget(1, 1, targetOptions);
  const diffused = new THREE.WebGLRenderTarget(1, 1, targetOptions);
  const mesh = new THREE.Mesh(geometry, landscape);
  mesh.frustumCulled = false;
  scene.add(mesh);
  let blurX = 0, blurY = 0;

  const gui = new GUI({ title: 'Vermilion / Through Glass' });
  const colors = gui.addFolder('Colors');
  const colorRoles = ['sun', 'halo', 'mist', 'farInk', 'nearInk', 'background'];
  function applyPalette() {
    const scheme = [...palettes[settings.palette]];
    if (settings.invertAchromatic && settings.palette.startsWith('Achromatic')) {
      for (let i = 0; i < scheme.length; i++) {
        if (settings.palette === 'Achromatic + Accent' && i < 2) continue;
        const value = parseInt(scheme[i], 16);
        scheme[i] = (0xffffff ^ value).toString(16).padStart(6, '0');
      }
    }
    colorRoles.forEach((role, i) => { settings[role] = '#' + scheme[i]; });
    refreshPanel();
  }
  function refreshPanel() {
    gui.controllersRecursive().forEach(controller => controller.updateDisplay());
  }
  colors.add(settings, 'palette', Object.keys(palettes)).name('Color scheme').onChange(applyPalette);
  colors.add(settings, 'invertAchromatic').name('Invert achromatic').onChange(applyPalette);
  const labels = ['Sun', 'Sun halo', 'Mist', 'Distant ink', 'Near ink', 'Background'];
  colorRoles.forEach((role, i) => colors.addColor(settings, role).name(labels[i]));
  colors.add(settings, 'greenscreen').name('Greenscreen');

  const motion = gui.addFolder('Animation');
  motion.add(settings, 'animation', animations).name('Animation');
  motion.add(settings, 'speed', 0, 3, 0.01).name('Speed');
  motion.add(settings, 'motionAmount', 0, 2, 0.01).name('Motion amount');
  motion.add(settings, 'cameraAmount', 0, 2, 0.01).name('Camera motion');

  const view = gui.addFolder('Camera');
  view.add(settings, 'zoom', 0.25, 5, 0.01).name('Zoom');
  view.add(settings, 'panX', -4, 4, 0.001).name('Horizontal position');
  view.add(settings, 'panY', -3, 3, 0.001).name('Vertical position');
  view.add(settings, 'angle', -180, 180, 0.1).name('Camera angle');
  view.add(settings, 'orbitTilt', 0, 60, 0.1).name('Orbit angle');
  const actions = {
    resetView() {
      Object.assign(settings, { zoom: 1, panX: 0, panY: 0, angle: 0, orbitTilt: 25 });
      refreshPanel();
      syncSettings();
      restart();
    },
    randomize() {
      const keys = Object.keys(palettes).filter(name => name !== settings.palette);
      const between = (min, max) => min + Math.random() * (max - min);
      settings.palette = keys[Math.floor(Math.random() * keys.length)];
      settings.invertAchromatic = Math.random() < 0.5;
      settings.seed = Math.floor(between(1, 1000));
      settings.sunRadius = between(0.245, 0.365);
      settings.sunIntensity = between(0.87, 1.06);
      settings.mountainHeight = between(0.7, 1.35);
      settings.fogDensity = between(0.38, 0.82);
      settings.glassChannels = Math.round(between(12, 24));
      settings.refraction = between(0.65, 1.55);
      settings.softness = between(0.7, 1.45);
      settings.motionAmount = between(0.6, 1.35);
      settings.speed = between(0.4, 1.15);
      settings.animation = animations[1 + Math.floor(Math.random() * (animations.length - 1))];
      applyPalette();
      syncSettings();
      restart();
    }
  };
  view.add(actions, 'resetView').name('Reset camera');
  const optics = gui.addFolder('Landscape & glass');
  optics.add(settings, 'sunRadius', 0.12, 0.48, 0.001).name('Sun size');
  optics.add(settings, 'sunIntensity', 0.2, 1.3, 0.01).name('Sun intensity');
  optics.add(settings, 'mountainHeight', 0.35, 1.6, 0.01).name('Mountain height');
  optics.add(settings, 'fogDensity', 0, 1, 0.01).name('Fog density');
  optics.add(settings, 'glassChannels', 8, 36, 1).name('Glass channels');
  optics.add(settings, 'refraction', 0, 2.5, 0.01).name('Refraction');
  optics.add(settings, 'softness', 0.1, 2.5, 0.01).name('Diffusion');
  optics.add(settings, 'seed', 0, 1000, 1).name('Landscape seed');
  const output = gui.addFolder('Rendering & variation');
  output.add(settings, 'pixelRatio', 0.5, 3, 0.05).name('DPR (Pixel Ratio)').onChange(resize);
  output.add(settings, 'clickRandomize').name('Randomize on click');
  output.add(actions, 'randomize').name('New variation');
  motion.close();
  view.close();
  optics.close();
  output.close();

  // These shaders work in display RGB; avoid Three.Color's linear conversion.
  function setColor(uniform, hex) {
    const rgb = parseInt(hex.replace('#', ''), 16);
    uniform.value.set((rgb >> 16 & 255) / 255, (rgb >> 8 & 255) / 255, (rgb & 255) / 255);
  }
  function syncSettings() {
    for (const [role, uniform] of [
      ['sun', 'uSun'], ['halo', 'uHalo'], ['mist', 'uMist'],
      ['farInk', 'uFarInk'], ['nearInk', 'uNearInk']
    ]) setColor(landscape.uniforms[uniform], settings[role]);
    setColor(glass.uniforms.uBackground, settings.background);
    glass.uniforms.uGreenscreen.value = settings.greenscreen;
    glass.uniforms.uGlassFrequency.value = settings.glassChannels;
    glass.uniforms.uRefractionStrength.value = settings.refraction;
    landscape.uniforms.uSunRadius.value = settings.sunRadius;
    landscape.uniforms.uSunIntensity.value = settings.sunIntensity;
    landscape.uniforms.uMountainHeight.value = settings.mountainHeight;
    landscape.uniforms.uFogDensity.value = settings.fogDensity;
    blur.uniforms.uBlurAmount.value = settings.softness;
    common.uSeed.value = settings.seed;
    document.body.style.background = settings.greenscreen ? '#00ff00' : settings.background;
  }
  gui.onChange(() => { syncSettings(); restart(); });

  let uiVisible = true;
  window.addEventListener('keydown', event => {
    if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.target instanceof HTMLElement && (event.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName))) return;
    uiVisible = !uiVisible;
    gui.show(uiVisible);
  });

  const canvas = renderer.domElement;
  let gesture = null;
  canvas.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0 || gesture) return;
    gesture = { id: event.pointerId, x: event.clientX, y: event.clientY,
      originX: event.clientX, originY: event.clientY, distance: 0, started: performance.now() };
    canvas.setPointerCapture(event.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', event => {
    if (!gesture || event.pointerId !== gesture.id) return;
    gesture.distance = Math.max(gesture.distance, Math.hypot(event.clientX - gesture.originX, event.clientY - gesture.originY));
    const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
    if (gesture.distance > 4) {
      settings.panX = THREE.MathUtils.clamp(settings.panX + dx / innerHeight, -4, 4);
      settings.panY = THREE.MathUtils.clamp(settings.panY - dy / innerHeight, -3, 3);
      refreshPanel();
      restart();
    }
    gesture.x = event.clientX;
    gesture.y = event.clientY;
  });
  function finishGesture(event, cancelled = false) {
    if (!gesture || event.pointerId !== gesture.id) return;
    const click = !cancelled && gesture.distance <= 4
      && Math.hypot(event.clientX - gesture.originX, event.clientY - gesture.originY) <= 4
      && performance.now() - gesture.started < 650;
    gesture = null;
    canvas.classList.remove('dragging');
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    if (click && settings.clickRandomize) actions.randomize();
  }
  canvas.addEventListener('pointerup', event => finishGesture(event));
  canvas.addEventListener('pointercancel', event => finishGesture(event, true));
  canvas.addEventListener('lostpointercapture', event => finishGesture(event, true));
  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const pixels = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
    const oldZoom = settings.zoom;
    settings.zoom = THREE.MathUtils.clamp(oldZoom * Math.exp(-pixels * 0.0012), 0.25, 5);
    const ratio = settings.zoom / oldZoom;
    // Cursor anchoring works in screen space even while orbiting or rolling.
    const x = (event.clientX - innerWidth * 0.5) / innerHeight;
    const y = 0.5 - event.clientY / innerHeight;
    const cameraOffset = cameraMotion();
    settings.panX = THREE.MathUtils.clamp(x - (x - settings.panX - cameraOffset.x) * ratio - cameraOffset.x, -4, 4);
    settings.panY = THREE.MathUtils.clamp(y - (y - settings.panY - cameraOffset.y) * ratio - cameraOffset.y, -3, 3);
    refreshPanel();
    restart();
  }, { passive: false });

  function resize() {
    const width = window.innerWidth, height = window.innerHeight;
    const dpr = settings.pixelRatio;
    renderer.setPixelRatio(dpr);
    renderer.setSize(width, height);
    common.uResolution.value.set(width * dpr, height * dpr);
    common.uAspect.value = width / height;
    const scale = Math.min(1, 1100 / height, 1700 / width);
    const w = Math.max(1, Math.round(width * scale)), h = Math.max(1, Math.round(height * scale));
    for (const target of [field, horizontal, diffused]) target.setSize(w, h);
    blurX = height * 0.0025 / width;
    blurY = 0.0034;
  }

  function pass(material, target) {
    mesh.material = material;
    renderer.setRenderTarget(target);
    renderer.render(scene, camera);
  }
  let elapsed = 0, previous = null, frame = 0, contextLost = false;
  function cameraMotion() {
    const phase = Math.PI * 2 * (elapsed % LOOP_DURATION) / LOOP_DURATION;
    const amount = settings.cameraAmount;
    const mode = animations.indexOf(settings.animation);
    let x = 0, y = 0, angle = settings.angle * Math.PI / 180, tilt = 0, zoom = settings.zoom;
    if (mode === 6) {
      x = Math.sin(phase) * 0.025 * amount;
      y = (Math.cos(phase) - 1) * 0.008 * amount;
      angle += Math.sin(phase) * 0.035 * amount;
      tilt = Math.sin(phase) * settings.orbitTilt * Math.PI / 180 * Math.min(amount, 1.4);
      zoom *= 1 + (Math.cos(phase) - 1) * 0.018 * amount;
    } else if (mode === 7) {
      x = Math.sin(phase) * 0.045 * amount;
      y = Math.sin(phase * 2) * 0.009 * amount;
      zoom *= 1 + Math.sin(phase) * 0.025 * amount;
    }
    return { x, y, angle, tilt, zoom };
  }
  function draw(now) {
    if (contextLost) return;
    const mode = animations.indexOf(settings.animation);
    if (previous !== null && mode !== 0) elapsed += (now - previous) / 1000 * settings.speed;
    previous = now;
    common.uTime.value = mode === 0 ? 0 : elapsed % LOOP_DURATION;
    common.uAnimation.value = mode;
    common.uMotion.value = mode === 0 ? 0 : settings.motionAmount;
    const pose = cameraMotion();
    glass.uniforms.uPan.value.set(settings.panX + pose.x, settings.panY + pose.y);
    glass.uniforms.uZoom.value = pose.zoom;
    glass.uniforms.uAngle.value = pose.angle;
    glass.uniforms.uTilt.value = pose.tilt;
    pass(landscape, field);
    blur.uniforms.uTexture.value = field.texture;
    blur.uniforms.uDirection.value.set(blurX, 0);
    pass(blur, horizontal);
    blur.uniforms.uTexture.value = horizontal.texture;
    blur.uniforms.uDirection.value.set(0, blurY);
    pass(blur, diffused);
    glass.uniforms.uTexture.value = diffused.texture;
    pass(glass, null);
    if (mode !== 0 && settings.speed > 0) frame = requestAnimationFrame(draw);
    else previous = null;
  }
  function restart() {
    cancelAnimationFrame(frame);
    if (document.hidden) previous = null;
    if (!document.hidden && !contextLost) frame = requestAnimationFrame(draw);
  }
  window.addEventListener('resize', () => { resize(); restart(); });
  document.addEventListener('visibilitychange', restart);
  reducedMotion.addEventListener('change', () => {
    settings.animation = reducedMotion.matches ? 'Static' : 'Liquid breathing';
    refreshPanel();
    restart();
  });
  renderer.domElement.addEventListener('webglcontextlost', event => {
    event.preventDefault();
    contextLost = true;
    previous = null;
    cancelAnimationFrame(frame);
  });
  renderer.domElement.addEventListener('webglcontextrestored', () => {
    contextLost = false;
    resize();
    restart();
  });
  window.addEventListener('pagehide', event => {
    cancelAnimationFrame(frame);
    if (event.persisted) return;
    for (const item of [field, horizontal, diffused, geometry, landscape, blur, glass]) item.dispose();
    gui.destroy();
    renderer.dispose();
  });
  window.addEventListener('pageshow', event => { if (event.persisted) restart(); });
  syncSettings();
  resize();
  restart();
} catch (error) {
  console.error(error);
  renderer?.domElement.remove();
  const message = document.createElement('div');
  message.className = 'error';
  message.setAttribute('role', 'alert');
  message.textContent = 'This study needs WebGL 2 and an internet connection to load Three.js. Please enable hardware acceleration and reload.';
  document.body.appendChild(message);
}
</script>
</body>
</html>
