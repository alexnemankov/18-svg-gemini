        // --- PROCEDURAL RE-ROLL (DOES NOT TOUCH POSTPROCESSING SETTINGS) ---
        function randomizeScene() {
            // Pick a random color scheme from all 21 preconfigured schemes
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomSchemeKey);

            // Re-roll geometric & motion parameters
            params.burstIntensity = THREE.MathUtils.randFloat(0.85, 1.45);
            params.ribbonTwist = THREE.MathUtils.randFloat(3.5, 7.5);
            params.ribbonLength = THREE.MathUtils.randFloat(5.0, 8.5);
            params.ribbonWidth = THREE.MathUtils.randFloat(0.08, 0.15);
            params.confettiFlutter = THREE.MathUtils.randFloat(0.8, 1.8);
            params.gravity = THREE.MathUtils.randFloat(0.16, 0.34);
            params.dragCoeff = THREE.MathUtils.randFloat(0.975, 0.988);

            // Re-init ribbons, confetti, and sparks
            initRibbons();
            initConfetti();
            initSparks();
            updateSceneColors();

            // NOTE: Postprocessing settings are preserved intact and never shuffled/changed on click!

            // Trigger burst instant explosion
            cycleClock = 0.0;
            refreshGUI();
        }

        // --- RENDERER & POSTPROCESSOR INITIALIZATION ---
        function initRenderer(antialiasEnabled) {
            const oldCanvas = renderer ? renderer.domElement : null;
            if (oldCanvas) {
                unbindInteractionEvents(oldCanvas);
                if (oldCanvas.parentElement) {
                    oldCanvas.parentElement.removeChild(oldCanvas);
                }
                renderer.dispose();
            }

            renderer = new THREE.WebGLRenderer({
                antialias: antialiasEnabled,
                alpha: true,
                powerPreference: 'high-performance'
            });

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(params.dpr);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = params.exposure;
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enableZoom = true;
            controls.zoomSpeed = 1.0;
            controls.enablePan = true;
            controls.panSpeed = 1.0;
            controls.screenSpacePanning = true;

            if (envMapTexture) envMapTexture.dispose();
            envMapTexture = generateMetallicEnvMap(renderer);
            scene.environment = envMapTexture;

            // Preserve existing post-processor settings across renderer re-creations
            const savedSettings = postProcessor ? Object.assign({}, postProcessor.settings) : null;
            postProcessor = new PostProcessor(renderer, savedSettings || {
                antialias: params.antialias,
                anamorphicEnabled: false // Explicitly default OFF
            });
            postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

            updateBackground();
            bindInteractionEvents(renderer.domElement);
        }

        // --- INTERACTION & CLICK-TO-RANDOMIZE (DIFFERENTIATES DRAG FROM CLICK) ---
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        function onPointerDown(e) {
            pointerDownPos.x = e.clientX;
            pointerDownPos.y = e.clientY;
            pointerDownTime = performance.now();
        }

        function onPointerUp(e) {
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            const duration = performance.now() - pointerDownTime;

            if (dist < 6 && duration < 350) {
                if (params.clickRandomize) {
                    randomizeScene();
                }
            }
        }

        function bindInteractionEvents(element) {
            element.addEventListener('pointerdown', onPointerDown);
            element.addEventListener('pointerup', onPointerUp);
        }

        function unbindInteractionEvents(element) {
            element.removeEventListener('pointerdown', onPointerDown);
            element.removeEventListener('pointerup', onPointerUp);
        }

        // Initialize with default parameters
        initRenderer(params.antialias);
        initRibbons();
        initConfetti();
        initSparks();
        updateSceneColors();

        // --- RESIZE HANDLING ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            if (postProcessor) {
                postProcessor.setSize(width, height, params.dpr);
            }
        });

        // --- KEYBOARD LISTENER ('H' KEY TO TOGGLE GUI) ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyH' || e.key.toLowerCase() === 'h') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // --- LIL-GUI SETUP ---
        const gui = new GUI({ title: 'Golden Confetti & Ribbon Burst' });
        let controllers = {};

        function buildGUI() {
            // System & Performance
            const fSystem = gui.addFolder('System & Performance');
            controllers.antialias = fSystem.add(params, 'antialias').name('Antialiasing').onChange((val) => {
                initRenderer(val);
                initRibbons();
                initConfetti();
                initSparks();
                updateSceneColors();
            });
            controllers.dpr = fSystem.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
                renderer.setPixelRatio(val);
                if (postProcessor) {
                    postProcessor.setSize(window.innerWidth, window.innerHeight, val);
                }
            });
            controllers.animSpeed = fSystem.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
            controllers.clickRandomize = fSystem.add(params, 'clickRandomize').name('Click Scene to Re-roll');
            fSystem.add({ reRoll: randomizeScene }, 'reRoll').name('⚡ Randomize Scene Now');

            // Background & Greenscreen
            const fBg = gui.addFolder('Background & Greenscreen');
            controllers.greenScreen = fBg.add(params, 'greenScreen').name('Greenscreen (#00ff00)').onChange(() => {
                updateBackground();
            });
            controllers.transparentBg = fBg.add(params, 'transparentBg').name('Transparent Background').onChange(() => {
                updateBackground();
            });
            controllers.customBgColor = fBg.addColor(params, 'customBgColor').name('Custom BG Color').onChange(() => {
                updateBackground();
            });

            // Camera & Motion Mode
            const fAnim = gui.addFolder('Camera & Motion Mode');
            controllers.animation = fAnim.add(params, 'animation', ANIMATION_MODES).name('Animation Preset');
            controllers.zoom = fAnim.add(params, 'zoom', 0.3, 3.0, 0.05).name('Zoom Factor').onChange((z) => {
                camera.zoom = z;
                camera.updateProjectionMatrix();
            });
            controllers.panX = fAnim.add(params, 'panX', -10, 10, 0.1).name('Pan X').onChange((px) => {
                controls.target.x = px;
            });
            controllers.panY = fAnim.add(params, 'panY', -10, 10, 0.1).name('Pan Y').onChange((py) => {
                controls.target.y = py;
            });
            fAnim.add({ resetView: () => {
                camera.position.set(0, 1.8, 12.0);
                controls.target.set(0, 0, 0);
                params.panX = 0;
                params.panY = 0;
                params.zoom = 0.95;
                camera.zoom = 0.95;
                camera.updateProjectionMatrix();
                refreshGUI();
            }}, 'resetView').name('Reset Camera View');

            // Color Schemes & Palettes
            const fColors = gui.addFolder('Color Schemes & Palettes');
            controllers.colorScheme = fColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
            controllers.ribbonColor1 = fColors.addColor(params, 'ribbonColor1').name('Ribbon Color 1').onChange(updateSceneColors);
            controllers.ribbonColor2 = fColors.addColor(params, 'ribbonColor2').name('Ribbon Color 2').onChange(updateSceneColors);
            controllers.confettiColor1 = fColors.addColor(params, 'confettiColor1').name('Confetti Color 1').onChange(updateSceneColors);
            controllers.confettiColor2 = fColors.addColor(params, 'confettiColor2').name('Confetti Color 2').onChange(updateSceneColors);
            controllers.confettiColor3 = fColors.addColor(params, 'confettiColor3').name('Confetti Color 3').onChange(updateSceneColors);
            controllers.sparkColor = fColors.addColor(params, 'sparkColor').name('Spark Color').onChange(updateSceneColors);

            // Burst Dynamics & Slow-Mo
            const fPhysics = gui.addFolder('Burst Dynamics & Slow-Mo');
            controllers.burstIntensity = fPhysics.add(params, 'burstIntensity', 0.5, 2.5, 0.05).name('Burst Force').onChange(randomizeScene);
            controllers.gravity = fPhysics.add(params, 'gravity', 0.05, 0.8, 0.01).name('Slow-Mo Gravity');
            controllers.dragCoeff = fPhysics.add(params, 'dragCoeff', 0.95, 0.999, 0.001).name('Air Drag');
            controllers.loopDuration = fPhysics.add(params, 'loopDuration', 4.0, 16.0, 0.5).name('Burst Cycle Period (s)');
            controllers.autoLoop = fPhysics.add(params, 'autoLoop').name('Auto Infinite Burst');
            fPhysics.add({ triggerBurst: () => { cycleClock = 0; } }, 'triggerBurst').name('🎆 Trigger Burst Explosion');

            // Ribbons & Confetti Geometry
            const fGeom = gui.addFolder('Ribbons & Confetti Geometry');
            controllers.ribbonCount = fGeom.add(params, 'ribbonCount', 5, 80, 1).name('Ribbon Count').onFinishChange(initRibbons);
            controllers.ribbonWidth = fGeom.add(params, 'ribbonWidth', 0.04, 0.3, 0.005).name('Ribbon Width').onFinishChange(initRibbons);
            controllers.ribbonLength = fGeom.add(params, 'ribbonLength', 2.0, 14.0, 0.1).name('Ribbon Length').onFinishChange(initRibbons);
            controllers.ribbonTwist = fGeom.add(params, 'ribbonTwist', 1.0, 14.0, 0.1).name('Spiral Coils').onFinishChange(initRibbons);
            controllers.confettiCount = fGeom.add(params, 'confettiCount', 200, 5000, 50).name('Confetti Count').onFinishChange(initConfetti);
            controllers.confettiSize = fGeom.add(params, 'confettiSize', 0.04, 0.4, 0.01).name('Confetti Size').onFinishChange(initConfetti);
            controllers.confettiFlutter = fGeom.add(params, 'confettiFlutter', 0.2, 3.0, 0.1).name('Aerodynamic Flutter');

            // Lighting & Exposure
            const fLight = gui.addFolder('Lighting & Exposure');
            controllers.exposure = fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(updateLights);
            controllers.sceneLightIntensity = fLight.add(params, 'sceneLightIntensity', 0.1, 3.0, 0.05).name('Master Light Intensity').onChange(updateLights);

            // Ambient
            const fAmb = fLight.addFolder('Ambient Light');
            controllers.ambientIntensity = fAmb.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateLights);
            controllers.ambientColor = fAmb.addColor(params, 'ambientColor').name('Color').onChange(updateLights);

            // Key Directional Light
            const fKey = fLight.addFolder('Key Light (Sun)');
            controllers.keyLightIntensity = fKey.add(params, 'keyLightIntensity', 0.0, 4.0, 0.1).name('Intensity').onChange(updateLights);
            controllers.keyLightColor = fKey.addColor(params, 'keyLightColor').name('Color').onChange(updateLights);
            controllers.keyLightPosX = fKey.add(params, 'keyLightPosX', -25, 25, 0.5).name('Pos X').onChange(updateLights);
            controllers.keyLightPosY = fKey.add(params, 'keyLightPosY', -25, 25, 0.5).name('Pos Y').onChange(updateLights);
            controllers.keyLightPosZ = fKey.add(params, 'keyLightPosZ', -25, 25, 0.5).name('Pos Z').onChange(updateLights);

            // Fill Light
            const fFill = fLight.addFolder('Fill Light');
            controllers.fillLightIntensity = fFill.add(params, 'fillLightIntensity', 0.0, 3.0, 0.1).name('Intensity').onChange(updateLights);
            controllers.fillLightColor = fFill.addColor(params, 'fillLightColor').name('Color').onChange(updateLights);

            // Rim Light / Burst Core
            const fRim = fLight.addFolder('Rim / Flash Light');
            controllers.rimLightIntensity = fRim.add(params, 'rimLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateLights);
            controllers.rimLightColor = fRim.addColor(params, 'rimLightColor').name('Color').onChange(updateLights);
            controllers.rimLightDistance = fRim.add(params, 'rimLightDistance', 5.0, 60.0, 1.0).name('Distance').onChange(updateLights);

            // Hemisphere Light
            const fHemi = fLight.addFolder('Hemisphere Light');
            controllers.hemiIntensity = fHemi.add(params, 'hemiIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateLights);
            controllers.hemiSkyColor = fHemi.addColor(params, 'hemiSkyColor').name('Sky Color').onChange(updateLights);
            controllers.hemiGroundColor = fHemi.addColor(params, 'hemiGroundColor').name('Ground Color').onChange(updateLights);

            // Attach PostProcessor suite controls to GUI
            postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');
        }

        function refreshGUI() {
            for (const key in controllers) {
                if (controllers[key] && typeof controllers[key].updateDisplay === 'function') {
                    controllers[key].updateDisplay();
                }
            }
        }

        buildGUI();

        // --- ANIMATION & PHYSICS ENGINE ---
        const clock = new THREE.Clock();
        let cycleClock = 0.0;
        let globalTime = 0.0;

        const dummyMatrix = new THREE.Matrix4();
        const dummyPos = new THREE.Vector3();
        const dummyQuat = new THREE.Quaternion();
        const dummyEuler = new THREE.Euler();
        const dummyScale = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const effectiveDelta = delta * params.animSpeed;
            globalTime += effectiveDelta;

            if (params.autoLoop) {
                cycleClock += effectiveDelta;
                if (cycleClock >= params.loopDuration) {
                    cycleClock = cycleClock % params.loopDuration;
                }
            } else {
                cycleClock += effectiveDelta;
            }

            const t = cycleClock;
            const burstProgress = Math.min(t / params.loopDuration, 1.0);

            const gravityFall = Math.max(0, t - 0.4);
            const yDrop = 0.5 * params.gravity * gravityFall * gravityFall;

            // --- UPDATE RIBBONS ---
            const rCount = ribbonData.length;
            for (let i = 0; i < rCount; i++) {
                const r = ribbonData[i];
                const geom = r.mesh.geometry;
                const posAttr = geom.attributes.position;
                const posArray = posAttr.array;

                const travelDist = r.speed * (1.0 - Math.exp(-t * 1.6)) * 1.8;
                const rootX = r.dir.x * travelDist;
                const rootY = r.dir.y * travelDist - yDrop;
                const rootZ = r.dir.z * travelDist;

                const unfurl = Math.min(1.0, 0.15 + 0.85 * (1.0 - Math.exp(-t * r.unfurlRate)));
                const currentLength = r.length * unfurl;

                const trailDir = r.dir.clone().multiplyScalar(-1).add(new THREE.Vector3(0, 0.2, 0)).normalize();

                const upRef = new THREE.Vector3(0, 1, 0);
                if (Math.abs(trailDir.dot(upRef)) > 0.92) {
                    upRef.set(1, 0, 0);
                }
                const sideRef = new THREE.Vector3().crossVectors(trailDir, upRef).normalize();
                const normalRef = new THREE.Vector3().crossVectors(sideRef, trailDir).normalize();

                const tumbleAngle = t * r.tumbleSpeed + r.tumblePhase;
                const cosT = Math.cos(tumbleAngle);
                const sinT = Math.sin(tumbleAngle);

                const effSide = sideRef.clone().multiplyScalar(cosT).add(normalRef.clone().multiplyScalar(sinT));
                const effNorm = sideRef.clone().multiplyScalar(-sinT).add(normalRef.clone().multiplyScalar(cosT));

                for (let seg = 0; seg <= RIBBON_SEGMENTS; seg++) {
                    const u = seg / RIBBON_SEGMENTS;
                    const segDist = u * currentLength;

                    const spiralAngle = u * r.turns * Math.PI * 2 + t * 1.2;
                    const coilR = r.coilRadius * Math.sin(u * Math.PI) * (1.0 + 0.25 * Math.sin(t * 2.0 + u * 6.0));
                    const wave = Math.sin(t * r.waveFreq + u * 8.0 + r.wavePhase) * 0.06;

                    const bX = rootX + trailDir.x * segDist + effSide.x * Math.cos(spiralAngle) * coilR + effNorm.x * (Math.sin(spiralAngle) * coilR + wave);
                    const bY = rootY + trailDir.y * segDist + effSide.y * Math.cos(spiralAngle) * coilR + effNorm.y * (Math.sin(spiralAngle) * coilR + wave);
                    const bZ = rootZ + trailDir.z * segDist + effSide.z * Math.cos(spiralAngle) * coilR + effNorm.z * (Math.sin(spiralAngle) * coilR + wave);

                    const halfW = (r.width * (0.8 + 0.4 * Math.sin(u * Math.PI))) * 0.5;
                    const wX = effSide.x * Math.sin(spiralAngle) * halfW - effNorm.x * Math.cos(spiralAngle) * halfW;
                    const wY = effSide.y * Math.sin(spiralAngle) * halfW - effNorm.y * Math.cos(spiralAngle) * halfW;
                    const wZ = effSide.z * Math.sin(spiralAngle) * halfW - effNorm.z * Math.cos(spiralAngle) * halfW;

                    const idxL = seg * 6;
                    posArray[idxL] = bX - wX;
                    posArray[idxL + 1] = bY - wY;
                    posArray[idxL + 2] = bZ - wZ;

                    const idxR = idxL + 3;
                    posArray[idxR] = bX + wX;
                    posArray[idxR + 1] = bY + wY;
                    posArray[idxR + 2] = bZ + wZ;
                }

                posAttr.needsUpdate = true;
                geom.computeVertexNormals();
            }

            // --- UPDATE CONFETTI FLAKES ---
            if (confettiMesh) {
                const cCount = confettiData.length;

                for (let i = 0; i < cCount; i++) {
                    const c = confettiData[i];

                    const burstDist = c.speed * (1.0 - Math.exp(-t * 2.0)) * 1.5;
                    const cFall = 0.5 * params.gravity * Math.pow(Math.max(0, t - 0.25), 1.85);

                    const flutter = Math.sin(t * c.flutterFreq + c.flutterPhase) * params.confettiFlutter * 0.25;
                    const swayX = c.swayDir.x * Math.sin(t * 3.0 + c.flutterPhase) * 0.35 * Math.min(t, 2.0);
                    const swayZ = c.swayDir.z * Math.cos(t * 2.5 + c.flutterPhase) * 0.35 * Math.min(t, 2.0);

                    dummyPos.set(
                        c.dir.x * burstDist + swayX,
                        c.dir.y * burstDist - cFall + flutter,
                        c.dir.z * burstDist + swayZ
                    );

                    const rotAngle = t * c.tumbleSpeed + c.flutterPhase;
                    dummyQuat.setFromAxisAngle(c.rotAxis, rotAngle);

                    dummyEuler.set(
                        Math.sin(t * c.flutterFreq) * 0.6,
                        rotAngle * 0.5,
                        Math.cos(t * (c.flutterFreq * 0.8)) * 0.6
                    );
                    dummyQuat.multiply(new THREE.Quaternion().setFromEuler(dummyEuler));

                    let scale = c.scaleRatio;
                    if (burstProgress > 0.9) {
                        scale *= (1.0 - (burstProgress - 0.9) / 0.1);
                    } else if (t < 0.2) {
                        scale *= (t / 0.2);
                    }
                    dummyScale.set(scale, scale, scale);

                    dummyMatrix.compose(dummyPos, dummyQuat, dummyScale);
                    confettiMesh.setMatrixAt(i, dummyMatrix);
                }

                confettiMesh.instanceMatrix.needsUpdate = true;
            }

            // --- UPDATE SPARKS / GLITTER ---
            if (sparkPoints && sparkPositions) {
                const sCount = sparkData.length;
                for (let i = 0; i < sCount; i++) {
                    const s = sparkData[i];
                    const dist = s.speed * (1.0 - Math.exp(-t * 3.5)) * 1.8;
                    const fall = 0.35 * params.gravity * t * t;

                    const idx = i * 3;
                    sparkPositions[idx] = s.dir.x * dist;
                    sparkPositions[idx + 1] = s.dir.y * dist - fall;
                    sparkPositions[idx + 2] = s.dir.z * dist;
                }
                sparkPoints.geometry.attributes.position.needsUpdate = true;

                const fade = Math.max(0.0, 1.0 - Math.pow(burstProgress, 1.2));
                const shimmer = 0.7 + 0.3 * Math.sin(globalTime * 18.0);
                sparkPoints.material.opacity = fade * shimmer;
            }

            rimLight.position.set(0, Math.sin(t * 0.5) * 0.5, 0);
            const flash = Math.exp(-t * 3.0) * 3.0;
            rimLight.intensity = (params.rimLightIntensity + flash) * params.sceneLightIntensity;

            // --- CAMERA ANIMATION TRAJECTORIES ---
            const gT = globalTime;
            const defaultTarget = new THREE.Vector3(params.panX, params.panY, 0);
            controls.target.lerp(defaultTarget, 0.05);

            switch (params.animation) {
                case 'Static Elegance (No Camera Movement)':
                    break;

                case 'Slow Orbit 360 (Cinematic Turntable)': {
                    const angle = gT * 0.16;
                    const radius = 11.5;
                    const targetX = Math.sin(angle) * radius;
                    const targetZ = Math.cos(angle) * radius;
                    const targetY = 1.6 + Math.sin(gT * 0.12) * 0.8;
                    camera.position.lerp(new THREE.Vector3(targetX + params.panX, targetY + params.panY, targetZ), 0.04);
                    break;
                }

                case 'Slow-Mo Bullet Time (Dramatic Arc)': {
                    const arc = Math.sin(gT * 0.22) * 1.5;
                    const radius = 10.5;
                    const targetX = Math.sin(arc) * radius;
                    const targetZ = Math.cos(arc) * radius;
                    const targetY = 1.2 + Math.cos(arc * 0.6) * 0.6;
                    camera.position.lerp(new THREE.Vector3(targetX + params.panX, targetY + params.panY, targetZ), 0.04);
                    break;
                }

                case 'Floating Rise (Ascending Pedestal)': {
                    const angle = gT * 0.09;
                    const rise = Math.sin(gT * 0.2) * 2.6;
                    const targetX = Math.sin(angle) * 11.0;
                    const targetZ = Math.cos(angle) * 11.0;
                    camera.position.lerp(new THREE.Vector3(targetX + params.panX, 1.2 + rise + params.panY, targetZ), 0.04);
                    break;
                }

                case 'Gentle Sway (Pendulum Drift)': {
                    const swayX = Math.sin(gT * 0.25) * 2.8;
                    const swayY = Math.cos(gT * 0.18) * 1.4;
                    camera.position.lerp(new THREE.Vector3(swayX + params.panX, 1.4 + swayY + params.panY, 11.0), 0.04);
                    break;
                }

                case 'Dolly Pulse (Slow Zoom Breath)': {
                    const dist = 11.2 + Math.sin(gT * 0.28) * 3.2;
                    const angle = gT * 0.06;
                    const targetX = Math.sin(angle) * 1.2;
                    const targetZ = dist;
                    camera.position.lerp(new THREE.Vector3(targetX + params.panX, 1.4 + params.panY, targetZ), 0.04);
                    break;
                }

                case 'Zenith Spiral (Top-Down Vortex)': {
                    const angle = gT * 0.15;
                    const radius = 6.8 + Math.sin(gT * 0.1) * 1.6;
                    const targetX = Math.sin(angle) * radius;
                    const targetZ = Math.cos(angle) * radius;
                    camera.position.lerp(new THREE.Vector3(targetX + params.panX, 9.8 + params.panY, targetZ), 0.04);
                    break;
                }

                case 'Cinematic Fly-Through (Soft Ribbon Weave)': {
                    const pathT = gT * 0.14;
                    const targetX = Math.sin(pathT) * 3.8;
                    const targetY = 0.8 + Math.sin(pathT * 2.0) * 1.4;
                    const targetZ = 7.8 + Math.cos(pathT) * 4.2;
                    camera.position.lerp(new THREE.Vector3(targetX + params.panX, targetY + params.panY, targetZ), 0.04);
                    break;
                }
            }

            controls.update();

            // Render through PostProcessor pipeline
            if (postProcessor) {
                postProcessor.setMoonScreenPosition(camera, new THREE.Vector3(0, 0, 0));
                postProcessor.renderScene(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }

        // Global API export for programmatic automation
        window.confettiScene = {
            triggerBurst: () => { cycleClock = 0; },
            randomize: randomizeScene,
            setColorScheme: applyColorScheme,
            setGreenScreen: (enabled) => {
                params.greenScreen = enabled;
                updateBackground();
                refreshGUI();
            },
            getParams: () => params,
            getPostProcessor: () => postProcessor
        };

        animate();
    </script>
</body>
