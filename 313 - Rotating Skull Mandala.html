    // --- 8 PRECONFIGURED ANIMATION PRESETS ---
    const ANIMATION_PRESETS = [
      'Hypnotic Mandala Loop',
      'Kaleidoscope Mirror',
      'Vortex Depth Spiral',
      'Sacred Geometry Pulse',
      'Celestial Float',
      'Zenith Precession',
      'Echoes of Eternity',

    // --- APPLICATION PARAMETERS ---
    const params = {
      // Color & Theme
      colorScheme: 'Palette 8 (E0FBFF, 00F0FF...)',
      greenscreen: false,
      skullPrimary: COLOR_SCHEMES['Palette 8 (E0FBFF, 00F0FF...)'].skullPrimary,
      skullSecondary: COLOR_SCHEMES['Palette 8 (E0FBFF, 00F0FF...)'].skullSecondary,
      accent: COLOR_SCHEMES['Palette 8 (E0FBFF, 00F0FF...)'].accent,

      bgColor: COLOR_SCHEMES['Palette 8 (E0FBFF, 00F0FF...)'].bg,
      lightColor: COLOR_SCHEMES['Palette 8 (E0FBFF, 00F0FF...)'].light,
      rimColor: COLOR_SCHEMES['Palette 8 (E0FBFF, 00F0FF...)'].rimLight,

      // Animation
      animation: 'Hypnotic Mandala Loop',
      speed: 1.0,
      pulseIntensity: 1.0,

      // Geometry & Mandala
      ringSpacing: 1.0,
      skullScale: 1.0,

      // Rendering
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      roughness: 0.35,
      metalness: 0.2,
      lightIntensity: 1.5,

      // Interaction
      clickRandomize: true,
      leftMouseAction: 'Rotate',
      resetCamera: () => resetCameraView()
    };

    // --- SETUP THREE.JS SCENE, CAMERA, RENDERER ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    const defaultCameraPos = new THREE.Vector3(0, 0, 32);
    camera.position.copy(defaultCameraPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.minDistance = 6;
    controls.maxDistance = 80;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.PAN
    };

    function resetCameraView() {
      camera.position.copy(defaultCameraPos);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(params.lightColor, params.lightIntensity);
    dirLight1.position.set(16, 20, 24);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(params.rimColor, params.lightIntensity * 0.7);
    dirLight2.position.set(-16, -14, 18);
    scene.add(dirLight2);

    const coreLight = new THREE.PointLight(params.accent, 2.0, 35, 1.2);
    coreLight.position.set(0, 0, 3);
    scene.add(coreLight);

    // --- SHARED MATERIALS ---
    const skullMatPrimary = new THREE.MeshStandardMaterial({
      color: params.skullPrimary,
      roughness: params.roughness,
      metalness: params.metalness,
      flatShading: true
    });

    const skullMatSecondary = new THREE.MeshStandardMaterial({
      color: params.skullSecondary,
      roughness: params.roughness,
      metalness: params.metalness,
      flatShading: true
    });

    const accentMat = new THREE.MeshStandardMaterial({
      color: params.accent,
      roughness: 0.25,
      metalness: 0.6,
      flatShading: true
    });

    const cavityMat = new THREE.MeshStandardMaterial({
      color: params.eyeCavity,
      roughness: 0.9,
      metalness: 0.1,
      flatShading: true
    });

    // --- ANATOMICALLY SCULPTED PROCEDURAL LOW-POLY SKULL GEOMETRY ---
    function createLowPolySkullGeometry() {
      // Precise anatomical skull landmarks
      const P = {
        // Midline vertices (x = 0)
        topCrown:      [0.00,  0.95, -0.12], // Vertex/apex of cranial vault
        topFront:      [0.00,  0.84,  0.22], // Frontal bone upper curve
        midForehead:   [0.00,  0.55,  0.42], // Mid frontal bone
        glabella:      [0.00,  0.24,  0.48], // Brow center between eye orbits
        nasion:        [0.00,  0.12,  0.44], // Top of nasal aperture
        nasalSpine:    [0.00, -0.16,  0.44], // Anterior nasal spine (bottom of nose)
        maxillaMid:    [0.00, -0.28,  0.42], // Upper jaw bone above front teeth
        teethUpMid:    [0.00, -0.42,  0.40], // Upper incisors midline
        mouthCleftMid: [0.00, -0.45,  0.30], // Deep dark slot between upper and lower teeth
        teethDnMid:    [0.00, -0.48,  0.38], // Lower incisors midline
        chinTop:       [0.00, -0.62,  0.36], // Upper chin indent (mental crease)
        chinTip:       [0.00, -0.84,  0.32], // Mental protuberance (sharp chin tip)
        chinBot:       [0.00, -0.88,  0.14], // Base under chin
        jawFloor:      [0.00, -0.72, -0.12], // Floor of mouth / inner mandible
        foramenBase:   [0.00, -0.32, -0.22], // Cranial base / occipital condyle
        occiputBot:    [0.00,  0.02, -0.62], // Inion (lower back of skull)
        occiputMid:    [0.00,  0.42, -0.74], // Rear skull occipital bulge
        occiputTop:    [0.00,  0.78, -0.54], // Upper rear skull

        // Cranium Lateral & Temples (x > 0)
        foreheadLat:   [0.34,  0.74,  0.18], // Upper lateral forehead corner
        parietalTop:   [0.46,  0.86, -0.14], // Parietal upper ridge
        parietalWide:  [0.56,  0.52, -0.26], // Parietal eminence (widest cranium bulge)
        occiputLatT:   [0.44,  0.72, -0.46], // Upper lateral rear skull
        occiputLatM:   [0.46,  0.36, -0.58], // Mid lateral rear skull
        occiputLatB:   [0.36,  0.08, -0.52], // Lower lateral rear skull
        mastoid:       [0.44, -0.14, -0.28], // Mastoid process behind ear
        baseLat:       [0.26, -0.25, -0.14], // Lateral cranial base
        templeIndent:  [0.38,  0.32,  0.04], // TEMPORAL FOSSA (pinched inward!)

        // Brow Ridge & Cavernous Eye Orbit Rim
        browMid:       [0.20,  0.26,  0.47], // Supraorbital brow arch
        browLat:       [0.46,  0.20,  0.36], // Outer brow ridge corner
        orbitTopIn:    [0.10,  0.17,  0.44], // Orbit rim top-inner
        orbitTopOut:   [0.34,  0.19,  0.39], // Orbit rim top-outer
        orbitMidOut:   [0.44, -0.01,  0.31], // Orbit rim outer lateral
        orbitBotOut:   [0.32, -0.16,  0.28], // Orbit rim bottom-outer
        orbitBotIn:    [0.10, -0.15,  0.34], // Orbit rim bottom-inner
        orbitDeep:     [0.22,  0.02,  0.06], // Deep recessed eye socket center (black void)

        // Nasal Aperture
        nasalLat:      [0.11, -0.04,  0.41], // Outer margin of piriform aperture
        nasalDeep:     [0.00, -0.06,  0.18], // Deep recessed nasal cavity center

        // Flared Zygomatic Arches (Cheekbones)
        cheekPeak:     [0.55, -0.06,  0.24], // Iconic flared sharp cheekbone crest
        cheekArch:     [0.52, -0.09,  0.00], // Zygomatic arch bar extending to ear
        cheekUnder:    [0.40, -0.24,  0.12], // Underside of cheekbone
        canineHollow:  [0.26, -0.20,  0.20], // Sub-zygomatic sunken hollow (canine fossa)

        // Maxilla & Upper Dental Arcade
        maxillaLat:    [0.24, -0.29,  0.32], // Lateral upper jaw
        teethUpLat1:   [0.10, -0.42,  0.39], // Upper lateral incisor
        teethUpLat2:   [0.20, -0.42,  0.31], // Upper canine / premolar
        teethUpLat3:   [0.24, -0.42,  0.20], // Upper molar
        mouthCleftL1:  [0.10, -0.45,  0.26], // Dark horizontal separation lat1
        mouthCleftL2:  [0.20, -0.45,  0.18], // Dark horizontal separation lat2

        // Mandible (Lower Jawbone)
        condyle:       [0.44, -0.12, -0.14], // Temporomandibular joint
        ramusMid:      [0.45, -0.36, -0.07], // Ascending ramus
        gonion:        [0.43, -0.58, -0.05], // Gonial angle (back corner of jaw)
        jawBody:       [0.32, -0.68,  0.12], // Mandible body lower rim
        chinLat:       [0.16, -0.78,  0.28], // Lateral mental tubercle
        teethDnLat1:   [0.09, -0.48,  0.37], // Lower lateral incisor
        teethDnLat2:   [0.18, -0.48,  0.29], // Lower canine / premolar
        teethDnLat3:   [0.23, -0.48,  0.18]  // Lower molar
      };

      // Triangles for the bone structure (half side, mirrored automatically)
      const boneFaces = [
        // Forehead & Cranium Vault
        ['topCrown', 'topFront', 'foreheadLat'],
        ['topCrown', 'foreheadLat', 'parietalTop'],
        ['topFront', 'midForehead', 'foreheadLat'],
        ['midForehead', 'glabella', 'browMid'],
        ['midForehead', 'browMid', 'foreheadLat'],
        ['foreheadLat', 'browMid', 'browLat'],
        ['foreheadLat', 'browLat', 'templeIndent'],
        ['foreheadLat', 'templeIndent', 'parietalTop'],
        ['parietalTop', 'templeIndent', 'parietalWide'],

        // Cranium Lateral & Posterior Dome
        ['topCrown', 'parietalTop', 'occiputLatT'],
        ['topCrown', 'occiputLatT', 'occiputTop'],
        ['occiputTop', 'occiputLatT', 'occiputMid'],
        ['occiputLatT', 'parietalTop', 'parietalWide'],
        ['occiputLatT', 'parietalWide', 'occiputLatM'],
        ['occiputMid', 'occiputLatT', 'occiputLatM'],
        ['occiputMid', 'occiputLatM', 'occiputBot'],
        ['occiputBot', 'occiputLatM', 'occiputLatB'],
        ['occiputLatM', 'parietalWide', 'mastoid'],
        ['occiputLatM', 'mastoid', 'occiputLatB'],
        ['parietalWide', 'templeIndent', 'cheekArch'],
        ['parietalWide', 'cheekArch', 'mastoid'],
        ['occiputLatB', 'mastoid', 'baseLat'],
        ['occiputBot', 'occiputLatB', 'foramenBase'],
        ['occiputLatB', 'baseLat', 'foramenBase'],

        // Brow Ridge to Eye Orbit Margin
        ['glabella', 'nasion', 'orbitTopIn'],
        ['glabella', 'orbitTopIn', 'browMid'],
        ['browMid', 'orbitTopIn', 'orbitTopOut'],
        ['browMid', 'orbitTopOut', 'browLat'],
        ['browLat', 'orbitTopOut', 'orbitMidOut'],
        ['browLat', 'orbitMidOut', 'cheekPeak'],
        ['browLat', 'cheekPeak', 'templeIndent'],
        ['templeIndent', 'cheekPeak', 'cheekArch'],

        // Cheekbones & Sunken Cheeks
        ['orbitMidOut', 'orbitBotOut', 'cheekPeak'],
        ['cheekPeak', 'orbitBotOut', 'cheekUnder'],
        ['cheekPeak', 'cheekUnder', 'cheekArch'],
        ['orbitBotOut', 'orbitBotIn', 'canineHollow'],
        ['orbitBotOut', 'canineHollow', 'cheekUnder'],
        ['nasion', 'nasalLat', 'orbitTopIn'],
        ['orbitTopIn', 'nasalLat', 'orbitBotIn'],

        // Nasal Margin & Upper Jaw
        ['nasalLat', 'nasalSpine', 'maxillaMid'],
        ['nasalLat', 'maxillaMid', 'orbitBotIn'],
        ['orbitBotIn', 'maxillaMid', 'maxillaLat'],
        ['orbitBotIn', 'maxillaLat', 'canineHollow'],
        ['canineHollow', 'maxillaLat', 'teethUpLat3'],
        ['cheekUnder', 'canineHollow', 'teethUpLat3'],

        // Upper Teeth Facets
        ['maxillaMid', 'teethUpMid', 'teethUpLat1'],
        ['maxillaMid', 'teethUpLat1', 'maxillaLat'],
        ['maxillaLat', 'teethUpLat1', 'teethUpLat2'],
        ['maxillaLat', 'teethUpLat2', 'teethUpLat3'],

        // Mandible (Lower Jaw & Joint)
        ['cheekArch', 'condyle', 'mastoid'],
        ['condyle', 'baseLat', 'mastoid'],
        ['cheekArch', 'ramusMid', 'condyle'],
        ['cheekUnder', 'ramusMid', 'cheekArch'],
        ['ramusMid', 'gonion', 'condyle'],
        ['teethUpLat3', 'jawBody', 'cheekUnder'],
        ['cheekUnder', 'jawBody', 'ramusMid'],
        ['ramusMid', 'jawBody', 'gonion'],
        ['gonion', 'jawBody', 'jawFloor'],
        ['jawFloor', 'jawBody', 'chinBot'],
        ['jawBody', 'chinLat', 'chinBot'],
        ['chinBot', 'chinLat', 'chinTip'],
        ['chinTip', 'chinLat', 'chinTop'],

        // Lower Teeth Facets
        ['chinTop', 'teethDnMid', 'teethDnLat1'],
        ['chinTop', 'teethDnLat1', 'chinLat'],
        ['chinLat', 'teethDnLat1', 'teethDnLat2'],
        ['chinLat', 'teethDnLat2', 'jawBody'],
        ['jawBody', 'teethDnLat2', 'teethDnLat3']
      ];

      // Triangles for deep cavity features (Material Index 1: Eye Sockets, Nasal Aperture, Mouth Slit)
      const cavityFaces = [
        // Cavernous Eye Sockets (Deep black funnel)
        ['orbitTopIn', 'orbitDeep', 'orbitTopOut'],
        ['orbitTopOut', 'orbitDeep', 'orbitMidOut'],
        ['orbitMidOut', 'orbitDeep', 'orbitBotOut'],
        ['orbitBotOut', 'orbitDeep', 'orbitBotIn'],
        ['orbitBotIn', 'orbitDeep', 'orbitTopIn'],

        // Triangular Nasal Aperture (Deep cavity)
        ['nasion', 'nasalDeep', 'nasalLat'],
        ['nasalLat', 'nasalDeep', 'nasalSpine'],

        // Dark Mouth Gap between Dental Arches
        ['teethUpMid', 'mouthCleftMid', 'teethUpLat1'],
        ['teethUpLat1', 'mouthCleftMid', 'mouthCleftL1'],
        ['teethUpLat1', 'mouthCleftL1', 'teethUpLat2'],
        ['teethUpLat2', 'mouthCleftL1', 'mouthCleftL2'],
        ['teethUpLat2', 'mouthCleftL2', 'teethUpLat3'],

        ['teethDnMid', 'teethDnLat1', 'mouthCleftMid'],
        ['teethDnLat1', 'mouthCleftL1', 'mouthCleftMid'],
        ['teethDnLat1', 'teethDnLat2', 'mouthCleftL1'],
        ['teethDnLat2', 'mouthCleftL2', 'mouthCleftL1'],
        ['teethDnLat2', 'teethDnLat3', 'mouthCleftL2']
      ];

      const bonePositions = [];
      const cavityPositions = [];

      function addTriangle(targetArray, p1, p2, p3) {
        // Original half (x >= 0)
        targetArray.push(p1[0], p1[1], p1[2]);
        targetArray.push(p2[0], p2[1], p2[2]);
        targetArray.push(p3[0], p3[1], p3[2]);

        // Mirrored half (x <= 0) with inverted winding for correct outward normals
        targetArray.push(-p1[0], p1[1], p1[2]);
        targetArray.push(-p3[0], p3[1], p3[2]);
        targetArray.push(-p2[0], p2[1], p2[2]);
      }

      boneFaces.forEach(f => {
        addTriangle(bonePositions, P[f[0]], P[f[1]], P[f[2]]);
      });

      cavityFaces.forEach(f => {
        addTriangle(cavityPositions, P[f[0]], P[f[1]], P[f[2]]);
      });

      const totalBoneVerts = bonePositions.length / 3;
      const totalCavityVerts = cavityPositions.length / 3;
      const totalVerts = totalBoneVerts + totalCavityVerts;

      const positions = new Float32Array(totalVerts * 3);
      positions.set(bonePositions, 0);
      positions.set(cavityPositions, bonePositions.length);

      const skullGeo = new THREE.BufferGeometry();
      skullGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      skullGeo.addGroup(0, totalBoneVerts, 0); // Material 0: Bone
      skullGeo.addGroup(totalBoneVerts, totalCavityVerts, 1); // Material 1: Cavity Black Void

      // Center geometry pivot near anatomical center
      skullGeo.translate(0, 0, 0.08);
      skullGeo.computeVertexNormals();

      return skullGeo;
    }

    const skullGeometry = createLowPolySkullGeometry();

    // --- MANDALA SCENE STRUCTURE ---
    const mandalaRoot = new THREE.Group();
    scene.add(mandalaRoot);

    // Configuration for the 5 Concentric Mandala Rings (Ring 0 to Ring 4)
    const RING_CONFIGS = [
      { radius: 0.0, skullCount: 1, baseScale: 1.35, speedFactor: 0.003, primaryMat: true },
      { radius: 4.0, skullCount: 8, baseScale: 0.95, speedFactor: -0.005, primaryMat: false },
      { radius: 7.5, skullCount: 14, baseScale: 0.82, speedFactor: 0.0035, primaryMat: true },
      { radius: 11.2, skullCount: 20, baseScale: 0.70, speedFactor: -0.0025, primaryMat: false },
      { radius: 15.0, skullCount: 28, baseScale: 0.58, speedFactor: 0.0018, primaryMat: true }
    ];

    const ringGroups = [];
    const skullObjects = [];
    const filigreeObjects = [];

    function buildMandala() {
      // Clear existing children
      while (mandalaRoot.children.length > 0) {
        mandalaRoot.remove(mandalaRoot.children[0]);
      }
      ringGroups.length = 0;
      skullObjects.length = 0;
      filigreeObjects.length = 0;

      RING_CONFIGS.forEach((config, ringIdx) => {
        const ringGroup = new THREE.Group();
        ringGroup.userData = {
          ringIdx,
          baseRadius: config.radius,
          speedFactor: config.speedFactor
        };
        mandalaRoot.add(ringGroup);
        ringGroups.push(ringGroup);

        const currentMat = config.primaryMat ? skullMatPrimary : skullMatSecondary;

        if (ringIdx === 0) {
          // Centerpiece: Master Center Skull
          const centerSkull = new THREE.Mesh(skullGeometry, [currentMat, cavityMat]);
          centerSkull.scale.setScalar(config.baseScale * params.skullScale);
          centerSkull.userData = { ringIdx: 0, indexInRing: 0, baseScale: config.baseScale };
          ringGroup.add(centerSkull);
          skullObjects.push(centerSkull);

          // Center 4 Cardinal Micro Skulls
          for (let c = 0; c < 4; c++) {
            const angle = c * (Math.PI / 2);
            const microSkull = new THREE.Mesh(skullGeometry, [skullMatSecondary, cavityMat]);
            microSkull.scale.setScalar(config.baseScale * 0.45 * params.skullScale);
            const dist = 1.6;
            microSkull.position.set(Math.cos(angle) * dist, Math.sin(angle) * dist, 0);
            microSkull.rotation.z = angle - Math.PI / 2;
            microSkull.userData = { ringIdx: 0, indexInRing: c + 1, baseScale: config.baseScale * 0.45, radialDist: dist, angle };
            ringGroup.add(microSkull);
            skullObjects.push(microSkull);
          }

          // Center Sacred Star Medallion
          const starGeo = new THREE.OctahedronGeometry(1.6, 0);
          const centerStar = new THREE.Mesh(starGeo, accentMat);
          centerStar.position.z = -0.3;
          ringGroup.add(centerStar);
          filigreeObjects.push(centerStar);

          const innerTorus = new THREE.Mesh(new THREE.TorusGeometry(2.3, 0.08, 4, 32), accentMat);
          innerTorus.position.z = -0.2;
          ringGroup.add(innerTorus);
          filigreeObjects.push(innerTorus);

        } else {
          // Radial Concentric Skulls
          const count = config.skullCount;
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const skull = new THREE.Mesh(skullGeometry, [currentMat, cavityMat]);
            skull.scale.setScalar(config.baseScale * params.skullScale);

            const r = config.radius * params.ringSpacing;
            skull.position.set(Math.cos(angle) * r, Math.sin(angle) * r, 0);
            skull.rotation.z = angle - Math.PI / 2;

            // Subtle alternating tilt for organic kaleidoscopic 3D depth
            skull.rotation.x = (i % 2 === 0 ? 0.08 : -0.08);

            skull.userData = {
              ringIdx,
              indexInRing: i,
              baseScale: config.baseScale,
              baseRadius: config.radius,
              angle
            };

            ringGroup.add(skull);
            skullObjects.push(skull);

            // Sacred Geometry Filigree: Petal / Diamond Shards between skulls
            const halfAngle = angle + (Math.PI / count);
            const shardGeo = (ringIdx % 2 === 1)
              ? new THREE.OctahedronGeometry(0.45, 0)
              : new THREE.ConeGeometry(0.35, 1.1, 4);
            const shard = new THREE.Mesh(shardGeo, accentMat);

            shard.scale.set(0.35, 1.1, 0.35);
            shard.position.set(Math.cos(halfAngle) * r, Math.sin(halfAngle) * r, -0.1);
            shard.rotation.z = halfAngle - Math.PI / 2;
            shard.userData = { ringIdx, halfAngle, baseRadius: config.radius };
            ringGroup.add(shard);
            filigreeObjects.push(shard);
          }

          // Concentric Faceted Boundary Ring Torus
          const torusTube = 0.08 + ringIdx * 0.02;
          const torusSegments = 32 + ringIdx * 16;
          const torus = new THREE.Mesh(
            new THREE.TorusGeometry(config.radius * params.ringSpacing, torusTube, 5, torusSegments),
            accentMat
          );
          torus.position.z = -0.15;
          torus.userData = { ringIdx, baseRadius: config.radius };
          ringGroup.add(torus);
          filigreeObjects.push(torus);

          // Outer Ring 4 Sacred Sunburst Halo Spikes
          if (ringIdx === 4) {
            const outerHalo = new THREE.Mesh(
              new THREE.TorusGeometry(config.radius * params.ringSpacing * 1.06, 0.06, 4, 96),
              accentMat
            );
            outerHalo.position.z = -0.2;
            outerHalo.userData = { ringIdx, baseRadius: config.radius * 1.06 };
            ringGroup.add(outerHalo);
            filigreeObjects.push(outerHalo);

            const rayCount = 56;
            for (let k = 0; k < rayCount; k++) {
              const rayAngle = (k / rayCount) * Math.PI * 2;
              const rayGeo = new THREE.ConeGeometry(0.18, 0.9, 3);
              const ray = new THREE.Mesh(rayGeo, accentMat);
              const rayRadius = config.radius * params.ringSpacing * 1.1;
              ray.position.set(Math.cos(rayAngle) * rayRadius, Math.sin(rayAngle) * rayRadius, -0.2);
              ray.rotation.z = rayAngle - Math.PI / 2;
              ray.userData = { ringIdx, rayAngle, baseRadius: config.radius * 1.1 };
              ringGroup.add(ray);
              filigreeObjects.push(ray);
            }
          }
        }
      });
    }

    buildMandala();

    // --- TRANSFORMS AND VISIBILITY UPDATES ---
    function updateGeometryTransforms() {
      // Update skull scales and radial spacing
      skullObjects.forEach(skull => {
        const u = skull.userData;
        skull.scale.setScalar(u.baseScale * params.skullScale);
        if (u.baseRadius !== undefined && u.angle !== undefined) {
          const r = u.baseRadius * params.ringSpacing;
          skull.position.x = Math.cos(u.angle) * r;
          skull.position.y = Math.sin(u.angle) * r;
        } else if (u.radialDist !== undefined && u.angle !== undefined) {
          const r = u.radialDist * params.ringSpacing;
          skull.position.x = Math.cos(u.angle) * r;
          skull.position.y = Math.sin(u.angle) * r;
        }
      });

      // Update filigree positions
      filigreeObjects.forEach(item => {
        item.visible = params.showFiligree;
        const u = item.userData;
        if (u && u.baseRadius !== undefined) {
          if (u.halfAngle !== undefined) {
            const r = u.baseRadius * params.ringSpacing;
            item.position.x = Math.cos(u.halfAngle) * r;
            item.position.y = Math.sin(u.halfAngle) * r;
          } else if (u.rayAngle !== undefined) {
            const r = u.baseRadius * params.ringSpacing;
            item.position.x = Math.cos(u.rayAngle) * r;
            item.position.y = Math.sin(u.rayAngle) * r;
          }
        }
      });
    }

    function updateMaterials() {
      skullMatPrimary.color.set(params.skullPrimary);
      skullMatPrimary.roughness = params.roughness;
      skullMatPrimary.metalness = params.metalness;

      skullMatSecondary.color.set(params.skullSecondary);
      skullMatSecondary.roughness = params.roughness;
      skullMatSecondary.metalness = params.metalness;

      accentMat.color.set(params.accent);
      accentMat.roughness = 0.25;
      accentMat.metalness = params.metalness;

      cavityMat.color.set(params.eyeCavity);

      dirLight1.color.set(params.lightColor);
      dirLight1.intensity = params.lightIntensity;

      dirLight2.color.set(params.rimColor);
      dirLight2.intensity = params.lightIntensity * 0.7;

      coreLight.color.set(params.accent);

      updateBackground();
    }

    function updateBackground() {
      if (params.greenscreen) {
        scene.background.set(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        scene.background.set(params.bgColor);
        renderer.setClearColor(params.bgColor, 1.0);
      }
    }

    function applyScheme(schemeName) {
      const s = COLOR_SCHEMES[schemeName];
      if (!s) return;
      params.colorScheme = schemeName;
      params.bgColor = s.bg;
      params.skullPrimary = s.skullPrimary;
      params.skullSecondary = s.skullSecondary;
      params.accent = s.accent;
      params.eyeCavity = s.eyeCavity;
      params.lightColor = s.light;
      params.rimColor = s.rimLight;
      updateMaterials();
    }

    // --- PROCEDURAL RANDOMIZATION ON SCENE CLICK ---
    function randomizeScene() {
      // 1. Pick a random color scheme from the 18 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyScheme(chosenScheme);

      // 2. Pick a random animation preset
      params.animation = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];

      // 3. Re-roll geometric and motion parameters
      params.speed = Number((0.6 + Math.random() * 1.4).toFixed(2));
      params.pulseIntensity = Number((0.5 + Math.random() * 1.2).toFixed(2));
      params.ringSpacing = Number((0.85 + Math.random() * 0.35).toFixed(2));
      params.skullScale = Number((0.8 + Math.random() * 0.35).toFixed(2));
      params.mandalaDepth = Number((-1.2 + Math.random() * 2.4).toFixed(2));
      params.metalness = Number((0.05 + Math.random() * 0.55).toFixed(2));
      params.roughness = Number((0.2 + Math.random() * 0.55).toFixed(2));
      params.lightIntensity = Number((1.1 + Math.random() * 1.2).toFixed(2));

      // 4. Update scene
      updateMaterials();
      updateGeometryTransforms();

      // 5. Update lil-gui control panel
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Click detector: differentiates genuine click from drag/orbit
    let pointerDownPos = { x: 0, y: 0, time: 0 };
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownPos.time = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (!params.clickRandomize) return;
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownPos.time;
      if (dist < 5 && elapsed < 350) {
        randomizeScene();
      }
    });

    // --- LIL-GUI CONTROL PANEL (DEFAULT STYLING, NO CUSTOM OVERRIDES) ---
    const gui = new GUI({ title: 'Skull Mandala Controls' });

    const fTheme = gui.addFolder('Theme & Colors');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Color Scheme')
      .onChange(val => {
        applyScheme(val);
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      });
    fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => updateBackground());
    fTheme.addColor(params, 'skullPrimary').name('Skull Primary').onChange(() => updateMaterials());
    fTheme.addColor(params, 'skullSecondary').name('Skull Secondary').onChange(() => updateMaterials());
    fTheme.addColor(params, 'accent').name('Rings & Accent').onChange(() => updateMaterials());
    fTheme.addColor(params, 'eyeCavity').name('Eye Socket Void').onChange(() => updateMaterials());
    fTheme.addColor(params, 'bgColor').name('Background Color').onChange(() => updateMaterials());
    fTheme.addColor(params, 'lightColor').name('Key Light').onChange(() => updateMaterials());
    fTheme.addColor(params, 'rimColor').name('Rim Light').onChange(() => updateMaterials());

    const fAnim = gui.addFolder('Animation');
    fAnim.add(params, 'animation', ANIMATION_PRESETS).name('Motion Preset');
    fAnim.add(params, 'speed', 0.0, 3.0, 0.05).name('Speed');
    fAnim.add(params, 'pulseIntensity', 0.0, 2.5, 0.05).name('Pulse Amplitude');

    const fGeo = gui.addFolder('Mandala Geometry');
    fGeo.add(params, 'ringSpacing', 0.7, 1.5, 0.02).name('Ring Spacing').onChange(() => updateGeometryTransforms());
    fGeo.add(params, 'skullScale', 0.5, 1.6, 0.02).name('Skull Scale').onChange(() => updateGeometryTransforms());
    fGeo.add(params, 'mandalaDepth', -2.5, 2.5, 0.05).name('Dish / Cone Depth');
    fGeo.add(params, 'showFiligree').name('Sacred Filigree').onChange(() => updateGeometryTransforms());

    const fRender = gui.addFolder('Rendering & Shading');
    fRender.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => renderer.setPixelRatio(v));
    fRender.add(params, 'roughness', 0.0, 1.0, 0.02).name('Roughness').onChange(() => updateMaterials());
    fRender.add(params, 'metalness', 0.0, 1.0, 0.02).name('Metalness').onChange(() => updateMaterials());
    fRender.add(params, 'lightIntensity', 0.2, 3.5, 0.1).name('Light Intensity').onChange(() => updateMaterials());

    const fInteract = gui.addFolder('Interaction & View');
    fInteract.add(params, 'clickRandomize').name('Click to Randomize');
    fInteract.add(params, 'leftMouseAction', ['Rotate', 'Pan / Drag']).name('Left Mouse Action').onChange(v => {
      controls.mouseButtons.LEFT = (v === 'Rotate') ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
    });
    fInteract.add(params, 'resetCamera').name('Reset Camera');

    // Hide / Show all UI with "H" key
    let guiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'h' || e.key === 'H') {
        guiVisible = !guiVisible;
        gui.show(guiVisible);
      }
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let simTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const effectiveSpeed = params.speed;
      simTime += delta * effectiveSpeed;

      const animPreset = params.animation;
      const isStaticNoCam = (animPreset === 'Static Contemplation (No Camera)');

      // 1. Concentric Ring Rotations & Z-Depth Concavity
      ringGroups.forEach((group, idx) => {
        const u = group.userData;
        // Base counter-rotations
        group.rotation.z += u.speedFactor * effectiveSpeed * 1.5;

        // Base 3D Dish depth
        const depthOffset = (idx / 4.0) * params.mandalaDepth * 2.5;

        switch (animPreset) {
          case 'Hypnotic Mandala Loop': {
            // Harmonic radial breathing ripple
            const breath = Math.sin(simTime * 1.2 + idx * 0.75) * 0.4 * params.pulseIntensity;
            group.position.z = depthOffset + breath;
            break;
          }
          case 'Kaleidoscope Mirror': {
            // Undulating alternating pitch
            const fold = Math.sin(simTime * 1.5 + idx * 1.1) * 0.5 * params.pulseIntensity;
            group.position.z = depthOffset + fold;
            break;
          }
          case 'Vortex Depth Spiral': {
            // Conical spiral depth expansion
            const spiralDepth = Math.sin(simTime * 0.8) * 0.6 * params.pulseIntensity;
            group.position.z = depthOffset - idx * 0.6 + spiralDepth;
            break;
          }
          case 'Sacred Geometry Pulse': {
            // Radial scaling pulse
            const pulse = 1.0 + Math.sin(simTime * 1.0 - idx * 0.6) * 0.07 * params.pulseIntensity;
            group.scale.set(pulse, pulse, 1.0);
            group.position.z = depthOffset;
            break;
          }
          case 'Celestial Float': {
            // Disk pitch-roll wave
            group.position.z = depthOffset + Math.sin(simTime * 0.9 + idx * 0.5) * 0.3 * params.pulseIntensity;
            break;
          }
          case 'Zenith Precession': {
            group.position.z = depthOffset;
            break;
          }
          case 'Echoes of Eternity': {
            // Outward ripple wave
            const wavePhase = (simTime * 2.0 - idx * 1.2);
            const wave = Math.sin(wavePhase);
            const lift = Math.max(0, wave) * 0.9 * params.pulseIntensity;
            group.position.z = depthOffset + lift;
            break;
          }
          case 'Static Contemplation (No Camera)':
          default: {
            group.position.z = depthOffset;
            group.scale.set(1, 1, 1);
            break;
          }
        }
      });

      // 2. Skull Individual Articulations
      if (animPreset === 'Kaleidoscope Mirror') {
        skullObjects.forEach(skull => {
          const u = skull.userData;
          const nod = Math.sin(simTime * 1.8 + u.indexInRing * 0.5) * 0.18 * params.pulseIntensity;
          skull.rotation.x = nod + (u.indexInRing % 2 === 0 ? 0.08 : -0.08);
        });
      } else if (animPreset === 'Celestial Float') {
        skullObjects.forEach(skull => {
          const u = skull.userData;
          skull.rotation.y = Math.sin(simTime * 1.2 + u.ringIdx) * 0.12 * params.pulseIntensity;
        });
      } else {
        skullObjects.forEach(skull => {
          const u = skull.userData;
          skull.rotation.x = (u.indexInRing % 2 === 0 ? 0.08 : -0.08);
          skull.rotation.y = 0;
        });
      }

      // 3. Whole Mandala Motion
      if (animPreset === 'Zenith Precession') {
        mandalaRoot.rotation.x = Math.sin(simTime * 0.7) * 0.28 * params.pulseIntensity;
        mandalaRoot.rotation.y = Math.cos(simTime * 0.7) * 0.28 * params.pulseIntensity;
      } else if (animPreset === 'Celestial Float') {
        mandalaRoot.rotation.x = Math.sin(simTime * 0.45) * 0.15 * params.pulseIntensity;
        mandalaRoot.rotation.y = Math.cos(simTime * 0.35) * 0.15 * params.pulseIntensity;
      } else {
        mandalaRoot.rotation.x = 0;
        mandalaRoot.rotation.y = 0;
      }

      // 4. Camera Dynamics (strictly disabled in Static mode)
      if (!isStaticNoCam && effectiveSpeed > 0) {
        if (animPreset === 'Hypnotic Mandala Loop') {
          const driftX = Math.sin(simTime * 0.25) * 0.8 * params.pulseIntensity;
          const driftY = Math.cos(simTime * 0.25) * 0.8 * params.pulseIntensity;
          camera.position.x = defaultCameraPos.x + driftX;
          camera.position.y = defaultCameraPos.y + driftY;
        } else if (animPreset === 'Vortex Depth Spiral') {
          const driftZ = Math.sin(simTime * 0.4) * 2.0 * params.pulseIntensity;
          camera.position.z = defaultCameraPos.z + driftZ;
        }
      }

      // Core PointLight gentle pulse
      coreLight.intensity = 1.6 + Math.sin(simTime * 1.5) * 0.6;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- WINDOW RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
