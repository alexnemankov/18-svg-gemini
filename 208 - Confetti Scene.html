<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Procedural Confetti Scene</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Asap&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      background: radial-gradient(
        circle farthest-corner,
        hsl(270deg, 100%, 14%),
        hsl(260deg, 100%, 2%) 100%
      );
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      font-family: "Asap", sans-serif;
      position: relative;
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      transition: background 0.4s ease;
    }
    canvas {
      -moz-user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      z-index: 0;
    }
  </style>

  <!-- Import Map to resolve bare module specifiers in browser -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import GUI from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";

    console.clear();

    (function () {
      const worldRadius = 5;
      const confettiSize = 0.07;
      const confettiNum = 3000;
      const rotateRange_x = Math.PI / 30;
      const rotateRange_y = Math.PI / 50;

      let camera, scene, renderer, controls, gui;
      let confettiMesh;
      let confettiInitialData = [];

      const clock = new THREE.Clock();
      const dummy = new THREE.Object3D();
      const matrix = new THREE.Matrix4();
      const tempColor = new THREE.Color();

      // Curated 5 Popular & Original Color Schemes + Custom Option
      const COLOR_SCHEMES = {
        "Neon Cyberpunk": [
          "#00f0ff", "#ff007f", "#7b00ff", "#ffe600", "#00ff66", "#ff0055"
        ],
        "Luxurious Gold & Emerald": [
          "#d4af37", "#ffd700", "#004b23", "#008000", "#f4e04d", "#1b4332", "#e6c200"
        ],
        "Pastel Dreamscape": [
          "#ffb7b2", "#ffdac1", "#e2f0cb", "#b5ead7", "#c7ceea", "#ff9aa2"
        ],
        "Sunset Aurora": [
          "#ff4e50", "#fc913a", "#f9d423", "#ede580", "#e1f5c4", "#ff6b6b"
        ],
        "Rainbow Festival": [
          "hsl(0, 100%, 50%)", "hsl(30, 100%, 50%)", "hsl(60, 100%, 50%)",
          "hsl(90, 100%, 50%)", "hsl(120, 100%, 50%)", "hsl(150, 100%, 50%)",
          "hsl(180, 100%, 50%)", "hsl(210, 100%, 50%)", "hsl(240, 100%, 50%)",
          "hsl(270, 100%, 50%)", "hsl(300, 100%, 50%)", "hsl(330, 100%, 50%)"
        ],
        "Custom Palette": null
      };

      // Preset Background Gradients matching each preset theme
      const PRESET_BACKGROUNDS = {
        "Neon Cyberpunk": `radial-gradient(circle farthest-corner, hsl(270deg, 100%, 14%), hsl(260deg, 100%, 2%) 100%)`,
        "Luxurious Gold & Emerald": `radial-gradient(circle farthest-corner, hsl(160deg, 90%, 11%), hsl(160deg, 100%, 2%) 100%)`,
        "Pastel Dreamscape": `radial-gradient(circle farthest-corner, hsl(240deg, 40%, 18%), hsl(250deg, 50%, 5%) 100%)`,
        "Sunset Aurora": `radial-gradient(circle farthest-corner, hsl(350deg, 85%, 14%), hsl(340deg, 100%, 3%) 100%)`,
        "Rainbow Festival": `radial-gradient(circle farthest-corner, hsl(320deg, 100%, 15%), hsl(320deg, 100%, 2%) 100%)`
      };

      // 5 Presetupped Animations
      const ANIMATION_PRESETS = {
        "Classic Gentle Drift": "drift",
        "Spiral Vortex": "vortex",
        "Upward Zero-G Float": "float",
        "Sinusoidal Wave Flutter": "wave",
        "Static View (No Orbit)": "static"
      };

      // Helper function to convert HSL to Hex
      function hslToHex(h, s, l) {
        l /= 100;
        const a = (s * Math.min(l, 1 - l)) / 100;
        const f = n => {
          const k = (n + h / 30) % 12;
          const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
          return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
      }

      // Parameters Object for Settings (Default Speed: FAST = 2.5)
      const params = {
        greenScreen: false,
        dpr: Math.min(window.devicePixelRatio, 2),
        colorScheme: "Neon Cyberpunk",
        customColor1: "#00f0ff",
        customColor2: "#ff007f",
        customColor3: "#7b00ff",
        customColor4: "#ffe600",
        customColor5: "#00ff66",
        randomizePalette: () => generateHarmonizedPalette(),
        animPreset: "Classic Gentle Drift",
        animSpeed: 0.5, // Default set to 2x slower (0.5)
        clickToRandomize: true,
        randomizeNow: () => triggerProceduralRandomization()
      };

      init();

      function init() {
        // Camera setup
        camera = new THREE.PerspectiveCamera(
          35,
          window.innerWidth / window.innerHeight,
          1,
          worldRadius * 4
        );
        camera.position.z = worldRadius * Math.sqrt(2);

        // Scene setup
        scene = new THREE.Scene();

        // Confetti InstancedMesh Setup
        const confettiGeometry = new THREE.PlaneGeometry(
          confettiSize / 2,
          confettiSize
        );
        const confettiMaterial = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          side: THREE.DoubleSide
        });
        confettiMesh = new THREE.InstancedMesh(
          confettiGeometry,
          confettiMaterial,
          confettiNum
        );

        // Store initial particle transform & random properties
        for (let i = 0; i < confettiNum; i++) {
          const rx = Math.random() * Math.PI;
          const ry = Math.random() * Math.PI;
          const rz = Math.random() * Math.PI;

          const px = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
          const py = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
          const pz = THREE.MathUtils.randFloat(-worldRadius, worldRadius);

          const rotSpeedX = THREE.MathUtils.randFloat(0, rotateRange_x);
          const rotSpeedZ = THREE.MathUtils.randFloat(0, rotateRange_y);
          const phase = Math.random() * Math.PI * 2;
          const speedMult = (i % 4) + 1;

          confettiInitialData.push({
            pos: new THREE.Vector3(px, py, pz),
            rot: new THREE.Euler(rx, ry, rz),
            rotSpeedX,
            rotSpeedZ,
            phase,
            speedMult
          });

          matrix.makeRotationFromEuler(confettiInitialData[i].rot);
          matrix.setPosition(confettiInitialData[i].pos);
          confettiMesh.setMatrixAt(i, matrix);
        }

        applyColorScheme(params.colorScheme);
        scene.add(confettiMesh);

        // Renderer setup
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(params.dpr);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);

        // OrbitControls setup with zoom & drag across screen
        controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.5, 0);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;  // Opportunity to zoom with wheel
        controls.enablePan = true;   // Opportunity to drag object/camera across screen
        controls.panSpeed = 1.0;
        controls.zoomSpeed = 1.0;
        controls.minDistance = 0.5;
        controls.maxDistance = worldRadius * 3;
        controls.minPolarAngle = 0;
        controls.maxPolarAngle = Math.PI;
        controls.update();

        // Setup lil-gui
        setupGUI();

        // Event listeners
        window.addEventListener("resize", onWindowResize);
        window.addEventListener("keydown", onKeyDown);
        setupPointerInteraction();

        // Start render loop
        animate();
      }

      function updateBackgroundForScheme(schemeName, customBaseHue) {
        if (params.greenScreen) {
          document.body.style.background = "#00ff00";
          scene.background = new THREE.Color(0x00ff00);
          return;
        }

        scene.background = null;

        if (PRESET_BACKGROUNDS[schemeName]) {
          document.body.style.background = PRESET_BACKGROUNDS[schemeName];
        } else {
          let bgHue;
          if (typeof customBaseHue === "number") {
            bgHue = customBaseHue;
          } else {
            const c1 = new THREE.Color(params.customColor1);
            const hsl = {};
            c1.getHSL(hsl);
            bgHue = Math.round(hsl.h * 360);
          }

          document.body.style.background = `radial-gradient(
            circle farthest-corner,
            hsl(${bgHue}deg, 90%, 13%),
            hsl(${bgHue}deg, 100%, 2%) 100%
          )`;
        }
      }

      function getActivePalette(schemeName) {
        if (schemeName === "Custom Palette") {
          return [
            params.customColor1,
            params.customColor2,
            params.customColor3,
            params.customColor4,
            params.customColor5
          ];
        }
        return COLOR_SCHEMES[schemeName] || COLOR_SCHEMES["Neon Cyberpunk"];
      }

      function applyColorScheme(schemeName, customBaseHue) {
        const palette = getActivePalette(schemeName);
        for (let i = 0; i < confettiNum; i++) {
          const chosenColor = palette[Math.floor(Math.random() * palette.length)];
          tempColor.set(chosenColor);
          confettiMesh.setColorAt(i, tempColor);
        }
        confettiMesh.instanceColor.needsUpdate = true;
        updateBackgroundForScheme(schemeName, customBaseHue);
      }

      function generateHarmonizedPalette() {
        const baseHue = Math.floor(Math.random() * 360);
        const harmonyMode = Math.floor(Math.random() * 5);
        const colors = [];

        for (let i = 0; i < 5; i++) {
          let h, s, l;
          if (harmonyMode === 0) {
            // Analogous
            h = (baseHue + i * 25 - 50 + 360) % 360;
            s = THREE.MathUtils.randInt(75, 95);
            l = THREE.MathUtils.randInt(45, 65);
          } else if (harmonyMode === 1) {
            // Triadic & Accents
            const offsets = [0, 30, 120, 150, 240];
            h = (baseHue + offsets[i]) % 360;
            s = THREE.MathUtils.randInt(80, 100);
            l = THREE.MathUtils.randInt(50, 60);
          } else if (harmonyMode === 2) {
            // Golden Ratio Distribution
            h = (baseHue + i * 137.5) % 360;
            s = THREE.MathUtils.randInt(85, 100);
            l = THREE.MathUtils.randInt(45, 60);
          } else if (harmonyMode === 3) {
            // Soft Glow Pastel
            h = (baseHue + i * 50) % 360;
            s = THREE.MathUtils.randInt(55, 75);
            l = THREE.MathUtils.randInt(70, 85);
          } else {
            // Cyber Neon
            h = (baseHue + i * 72) % 360;
            s = THREE.MathUtils.randInt(90, 100);
            l = THREE.MathUtils.randInt(50, 55);
          }
          colors.push(hslToHex(h, s, l));
        }

        params.customColor1 = colors[0];
        params.customColor2 = colors[1];
        params.customColor3 = colors[2];
        params.customColor4 = colors[3];
        params.customColor5 = colors[4];

        params.colorScheme = "Custom Palette";
        applyColorScheme("Custom Palette", baseHue);
        syncGUI();
      }

      function setupGUI() {
        gui = new GUI({ title: "Scene Controls" });

        // Background & View Settings
        const envFolder = gui.addFolder("Display & View");
        envFolder.add(params, "greenScreen").name("Green Screen (#00ff00)").onChange(v => {
          updateBackgroundForScheme(params.colorScheme);
        });

        envFolder.add(params, "dpr", 0.5, 2.5, 0.1).name("Pixel Ratio (DPR)").onChange(v => {
          renderer.setPixelRatio(v);
        });

        // Color Schemes Settings
        const colorFolder = gui.addFolder("Color Schemes");
        colorFolder.add(params, "colorScheme", Object.keys(COLOR_SCHEMES)).name("Preset Scheme").onChange(v => {
          applyColorScheme(v);
        });

        colorFolder.add(params, "randomizePalette").name("🎨 Randomize Harmonized Palette");

        const customFolder = colorFolder.addFolder("Custom Colors");
        const onCustomChange = () => {
          params.colorScheme = "Custom Palette";
          applyColorScheme("Custom Palette");
          syncGUI();
        };

        customFolder.addColor(params, "customColor1").name("Color 1").onChange(onCustomChange);
        customFolder.addColor(params, "customColor2").name("Color 2").onChange(onCustomChange);
        customFolder.addColor(params, "customColor3").name("Color 3").onChange(onCustomChange);
        customFolder.addColor(params, "customColor4").name("Color 4").onChange(onCustomChange);
        customFolder.addColor(params, "customColor5").name("Color 5").onChange(onCustomChange);

        // Motion & Animation Settings
        const animFolder = gui.addFolder("Animation Controls");
        animFolder.add(params, "animPreset", Object.keys(ANIMATION_PRESETS)).name("Animation Preset");
        animFolder.add(params, "animSpeed", 0.1, 4.0, 0.1).name("Speed Multiplier");

        // Random Procedural Generator Settings
        const procFolder = gui.addFolder("Procedural Click Mode");
        procFolder.add(params, "clickToRandomize").name("Click Scene to Re-roll");
        procFolder.add(params, "randomizeNow").name("⚡ Randomize Now");

        // Open folders by default
        envFolder.open();
        colorFolder.open();
        customFolder.open();
        animFolder.open();
        procFolder.open();
      }

      function syncGUI() {
        if (!gui) return;
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      function triggerProceduralRandomization() {
        // 50% chance to pick preset, 50% chance to generate a brand new harmonized palette
        if (Math.random() > 0.5) {
          generateHarmonizedPalette();
        } else {
          const presetsOnly = Object.keys(COLOR_SCHEMES).filter(k => k !== "Custom Palette");
          params.colorScheme = presetsOnly[Math.floor(Math.random() * presetsOnly.length)];
          applyColorScheme(params.colorScheme);
        }

        // Randomly pick an animation preset
        const presets = Object.keys(ANIMATION_PRESETS);
        params.animPreset = presets[Math.floor(Math.random() * presets.length)];

        // Randomize speed in the slow range (0.3 to 0.7)
        params.animSpeed = parseFloat(THREE.MathUtils.randFloat(0.3, 0.7).toFixed(1));

        // Update GUI controls to display new state
        syncGUI();
      }

      function setupPointerInteraction() {
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        renderer.domElement.addEventListener("pointerdown", (e) => {
          pointerDownPos = { x: e.clientX, y: e.clientY };
          pointerDownTime = performance.now();
        });

        renderer.domElement.addEventListener("pointerup", (e) => {
          const dx = e.clientX - pointerDownPos.x;
          const dy = e.clientY - pointerDownPos.y;
          const dist = Math.hypot(dx, dy);
          const duration = performance.now() - pointerDownTime;

          // If click was short and without significant drag, trigger procedural re-roll
          if (dist < 6 && duration < 300 && params.clickToRandomize) {
            triggerProceduralRandomization();
          }
        });
      }

      function onKeyDown(e) {
        // Toggle GUI visibility with 'H' or 'h' key
        if (e.key === "h" || e.key === "H") {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const elapsedTime = clock.getElapsedTime();
        const speed = params.animSpeed;
        const currentMode = ANIMATION_PRESETS[params.animPreset] || "drift";

        // Handle Orbit Camera Controls Auto-Rotation based on preset
        if (currentMode === "static") {
          controls.autoRotate = false;
        } else {
          controls.autoRotate = true;
          if (currentMode === "vortex") {
            controls.autoRotateSpeed = 0.8 * speed;
          } else if (currentMode === "wave") {
            controls.autoRotateSpeed = 2.5 * speed;
          } else if (currentMode === "float") {
            controls.autoRotateSpeed = -1.2 * speed;
          } else {
            controls.autoRotateSpeed = 2.0 * speed;
          }
        }
        controls.update();

        // Animate Confetti Particles
        if (confettiMesh) {
          const baseSpeedY = 0.01 * speed;
          const baseSpeedX = 0.003 * speed;
          const baseSpeedZ = 0.005 * speed;

          for (let i = 0; i < confettiNum; i++) {
            const data = confettiInitialData[i];
            confettiMesh.getMatrixAt(i, matrix);
            matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);

            if (currentMode === "float") {
              // Upward zero-g floating animation
              dummy.position.y += baseSpeedY * data.speedMult * 0.7;
              dummy.position.x += Math.sin(elapsedTime * speed + data.phase) * 0.002 * speed;
              dummy.position.z += Math.cos(elapsedTime * speed + data.phase) * 0.002 * speed;

              if (dummy.position.y > worldRadius) {
                dummy.position.y = -worldRadius;
                dummy.position.x = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
                dummy.position.z = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
              }
            } else if (currentMode === "vortex") {
              // Spiral vortex movement around Y axis
              dummy.position.y -= baseSpeedY * data.speedMult;
              const angle = 0.01 * speed * (i % 2 === 0 ? 1 : -1);
              const cosA = Math.cos(angle);
              const sinA = Math.sin(angle);
              const nx = dummy.position.x * cosA - dummy.position.z * sinA;
              const nz = dummy.position.x * sinA + dummy.position.z * cosA;
              dummy.position.x = nx;
              dummy.position.z = nz;

              if (dummy.position.y < -worldRadius) {
                dummy.position.y = worldRadius;
                dummy.position.x = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
                dummy.position.z = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
              }
            } else if (currentMode === "wave") {
              // Sinusoidal flutter animation
              dummy.position.y -= baseSpeedY * data.speedMult;
              dummy.position.x += Math.sin(elapsedTime * 3 * speed + data.phase) * 0.005 * speed;
              dummy.position.z += Math.cos(elapsedTime * 3 * speed + data.phase) * 0.005 * speed;

              if (dummy.position.y < -worldRadius) {
                dummy.position.y = worldRadius;
                dummy.position.x = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
                dummy.position.z = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
              }
            } else {
              // Default / Static / Drift fall
              dummy.position.y -= baseSpeedY * data.speedMult;

              if (i % 4 === 1) {
                dummy.position.x += baseSpeedX;
                dummy.position.z += baseSpeedZ;
              } else if (i % 4 === 2) {
                dummy.position.x += baseSpeedX;
                dummy.position.z -= baseSpeedZ;
              } else if (i % 4 === 3) {
                dummy.position.x -= baseSpeedX;
                dummy.position.z += baseSpeedZ;
              } else {
                dummy.position.x -= baseSpeedX;
                dummy.position.z -= baseSpeedZ;
              }

              if (dummy.position.y < -worldRadius) {
                dummy.position.y = worldRadius;
                dummy.position.x = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
                dummy.position.z = THREE.MathUtils.randFloat(-worldRadius, worldRadius);
              }
            }

            // Rotations
            dummy.rotation.x += data.rotSpeedX * speed;
            dummy.rotation.z += data.rotSpeedZ * speed;

            dummy.updateMatrix();
            confettiMesh.setMatrixAt(i, dummy.matrix);
          }

          confettiMesh.instanceMatrix.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }
    })();
  </script>
</body>
</html>
