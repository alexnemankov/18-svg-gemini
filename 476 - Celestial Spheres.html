<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nested Celestial Spheres - 476</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    #canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    #canvas:active {
      cursor: grabbing;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================
    // 19 PRECONFIGURED COLOR SCHEMES
    // =========================================================================
    const COLOR_SCHEMES = {
      'Original': {
        background: '#000000',
        colors: ['#00e1ff', '#0077ff', '#e0f7ff', '#0044aa', '#ffffff'],
        accent: '#00ffff'
      },
      'Monochromatic': {
        background: '#06101e',
        colors: ['#1e6091', '#184e77', '#52b69a', '#76c893', '#b5e2fa'],
        accent: '#99d98c'
      },
      'Analogous': {
        background: '#021118',
        colors: ['#00c2b2', '#2deaa2', '#38b0be', '#008b8b', '#d0ffff'],
        accent: '#52ffb8'
      },
      'Complementary': {
        background: '#070d18',
        colors: ['#ff7b00', '#00d4ff', '#ffaa40', '#6698d0', '#ffe4c2'],
        accent: '#ff9233'
      },
      'Split-complementary': {
        background: '#060814',
        colors: ['#ff9d00', '#ff3366', '#00c3ff', '#627ab5', '#fff0d8'],
        accent: '#ff5c8a'
      },
      'Triadic': {
        background: '#0a0814',
        colors: ['#00f0ff', '#ff1a60', '#fff29e', '#9d6ee0', '#ffffff'],
        accent: '#ffcc00'
      },
      'Tetradic': {
        background: '#0a0a14',
        colors: ['#b53df5', '#00f5c4', '#f55d14', '#80e800', '#ffd166'],
        accent: '#00f5c4'
      },
      'Double split-complementary': {
        background: '#070912',
        colors: ['#f0388c', '#5eead4', '#fbbf24', '#818cf8', '#e2e8f0'],
        accent: '#f0388c'
      },
      'Achromatic (black and white)': {
        background: '#000000',
        colors: ['#ffffff', '#cccccc', '#888888', '#444444', '#f5f5f5'],
        accent: '#ffffff'
      },
      'Achromatic (white and black)': {
        background: '#ffffff',
        colors: ['#000000', '#222222', '#555555', '#888888', '#111111'],
        accent: '#111111'
      },
      'Achromatic + Accent (black and white + red)': {
        background: '#050505',
        colors: ['#ffffff', '#7f7f7f', '#ff1e1e', '#ff4444', '#cccccc'],
        accent: '#ff1e1e'
      },
      'Achromatic + Accent (white and black + red)': {
        background: '#f5f5f5',
        colors: ['#111111', '#555555', '#ff0033', '#cc0029', '#222222'],
        accent: '#ff0033'
      },
      'Neutral + accent': {
        background: '#141518',
        colors: ['#8d939e', '#4b5563', '#ff9e00', '#00e5ff', '#fff0c8'],
        accent: '#ff9e00'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        background: '#220901',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#BC3908'],
        accent: '#F6AA1C'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        background: '#000000',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B'],
        accent: '#63D1CF'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        background: '#0D001D',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#D69ADE'],
        accent: '#AA60C8'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        background: '#061210',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#FEF1BE'],
        accent: '#FFBA00'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        background: '#05140A',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#7FFF00'],
        accent: '#D4FFB0'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        background: '#0E0618',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#FFE8CC'],
        accent: '#FF8C00'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        background: '#090612',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#B38FFF'],
        accent: '#6A3DE8'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        background: '#05020F',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#00F0FF'],
        accent: '#D40078'
      }
    };

    // 8 PRECONFIGURED CAMERA ANIMATIONS
    const ANIMATION_PRESETS = [
      'Static (No Camera Motion)',
      'Slow Celestial Orbit',
      'Floating Figure-8',
      'Harmonic Pendulum Sway',
      'Cosmic Spiral Ascend',
      'Breathing Orbital Drift',
      'Cinematic Horizon Glide',
      'Dynamic Polar Wave'
    ];

    const GEOMETRY_SHAPES = {
      'Spheres (CodePen Classic)': 'sphere',
      'Radiant Orbs (Icosahedra)': 'icosahedron',
      'Crystal Octahedra': 'octahedron',
      'Starlight Tetrahedra': 'tetrahedron',
      'Cosmic Cubes': 'box',
      'Nested Torus Rings': 'torus'
    };

    // =========================================================================
    // PARAMETERS & INITIAL STATE
    // =========================================================================
    const params = {
      // Background & Greenscreen
      greenscreen: false,
      bgColor: '#000000',

      // Camera Animation & Interaction
      currentAnimation: 'Slow Celestial Orbit',
      animationSpeed: 1.0,
      dragMode: 'Drag Object (Left) / Orbit (Right or Shift)',
      userZoom: 1.0,
      orbitPitch: 0.0,
      orbitYaw: 0.0,
      panX: 0.0,
      panY: 0.0,

      // Geometry & Spheres
      shape: 'Spheres (CodePen Classic)',
      outerRadius: 4.5,
      innerRadius: 2.25,
      ballScale: 1.0,
      outerCount: 1000,
      innerCount: 1000,
      innerCounterRot: -1.35,

      // Material & Appearance
      roughness: 0.25,
      metalness: 0.35,
      glowIntensity: 0.85,

      // Colors & Theme
      colorScheme: 'Original',
      color1: '#00e1ff',
      color2: '#0077ff',
      color3: '#e0f7ff',
      color4: '#0044aa',
      color5: '#ffffff',
      accentColor: '#00ffff',

      // Lighting & Exposure
      exposure: 1.15,
      sceneLightIntensity: 1.0,

      // Key Light (Light 1)
      light1Enabled: true,
      light1Color: '#ffffff',
      light1Intensity: 1.8,
      light1AutoOrbit: true,
      light1OrbitSpeed: 0.6,
      light1PosX: 4.0,
      light1PosY: 5.0,
      light1PosZ: 6.0,

      // Fill Light (Light 2)
      light2Enabled: true,
      light2Color: '#88ccff',
      light2Intensity: 1.2,
      light2PosX: -6.0,
      light2PosY: 3.0,
      light2PosZ: -4.0,

      // Rim Light (Light 3)
      light3Enabled: true,
      light3Color: '#ff99dd',
      light3Intensity: 1.5,
      light3PosX: 0.0,
      light3PosY: -5.0,
      light3PosZ: -7.0,

      // Ambient Light
      ambientColor: '#222833',
      ambientIntensity: 0.45,

      // Display & Renderer
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      randomizeOnClick: true
    };

    // =========================================================================
    // INITIALIZE THREE.JS SCENE, CAMERA, RENDERER & STATS
    // =========================================================================
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 14);

    let renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: params.antialias,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(params.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;

    // Stats.js
    let stats = null;
    if (typeof Stats !== 'undefined') {
      stats = new Stats();
      stats.showPanel(0);
      document.body.appendChild(stats.dom);
      stats.dom.style.position = 'absolute';
      stats.dom.style.top = '10px';
      stats.dom.style.left = '10px';
    }

    // Scene Graph Groups
    const objectGroup = new THREE.Group(); // Handles screen dragging
    const nestedSpheresGroup = new THREE.Group();
    const outerGroup = new THREE.Group();
    const innerGroup = new THREE.Group();

    nestedSpheresGroup.add(outerGroup);
    nestedSpheresGroup.add(innerGroup);
    objectGroup.add(nestedSpheresGroup);
    scene.add(objectGroup);

    // Light objects
    const keyLight = new THREE.DirectionalLight(params.light1Color, params.light1Intensity);
    const fillLight = new THREE.PointLight(params.light2Color, params.light2Intensity, 50);
    const rimLight = new THREE.PointLight(params.light3Color, params.light3Intensity, 50);
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);

    scene.add(keyLight);
    scene.add(fillLight);
    scene.add(rimLight);
    scene.add(ambientLight);

    // =========================================================================
    // INSTANCED MESH GENERATION (NESTED CONCENTRIC SPHERES)
    // =========================================================================
    let outerMesh = null;
    let innerMesh = null;
    let sphereMaterial = null;

    // Uniform random sphere point generator matching original CodePen algorithm
    function spherePointPicking(R) {
      const u1 = Math.random();
      const u2 = Math.random();
      const s = Math.acos(2 * u1 - 1) - Math.PI / 2;
      const t = 2 * Math.PI * u2;
      return new THREE.Vector3(
        R * Math.cos(s) * Math.cos(t),
        R * Math.cos(s) * Math.sin(t),
        R * Math.sin(s)
      );
    }

    function createGeometryForShape(shapeType, baseRadius) {
      switch (shapeType) {
        case 'sphere':
          return new THREE.SphereGeometry(baseRadius, 16, 12);
        case 'icosahedron':
          return new THREE.IcosahedronGeometry(baseRadius, 1);
        case 'octahedron':
          return new THREE.OctahedronGeometry(baseRadius);
        case 'tetrahedron':
          return new THREE.TetrahedronGeometry(baseRadius);
        case 'box':
          return new THREE.BoxGeometry(baseRadius * 1.5, baseRadius * 1.5, baseRadius * 1.5);
        case 'torus':
          return new THREE.TorusGeometry(baseRadius * 1.2, baseRadius * 0.4, 8, 16);
        default:
          return new THREE.SphereGeometry(baseRadius, 16, 12);
      }
    }

    function rebuildSpheres() {
      // Remove old meshes
      if (outerMesh) {
        outerGroup.remove(outerMesh);
        outerMesh.geometry.dispose();
      }
      if (innerMesh) {
        innerGroup.remove(innerMesh);
        innerMesh.geometry.dispose();
      }
      if (sphereMaterial) {
        sphereMaterial.dispose();
      }

      // Shared Physical Material with glow & metallic reflections
      sphereMaterial = new THREE.MeshPhysicalMaterial({
        roughness: params.roughness,
        metalness: params.metalness,
        clearcoat: 0.8,
        clearcoatRoughness: 0.15,
        emissive: new THREE.Color(0x222222),
        emissiveIntensity: params.glowIntensity
      });

      const shapeType = GEOMETRY_SHAPES[params.shape] || 'sphere';

      // Outer Sphere (radius R1 = 4.5, particle radius 0.04 * R1 * ballScale)
      const outerPartRadius = 0.04 * params.outerRadius * params.ballScale;
      const outerGeom = createGeometryForShape(shapeType, outerPartRadius);
      outerMesh = new THREE.InstancedMesh(outerGeom, sphereMaterial, params.outerCount);

      // Inner Sphere (radius R2 = 2.25, particle radius 0.04 * R2 * ballScale)
      const innerPartRadius = 0.04 * params.innerRadius * params.ballScale;
      const innerGeom = createGeometryForShape(shapeType, innerPartRadius);
      innerMesh = new THREE.InstancedMesh(innerGeom, sphereMaterial, params.innerCount);

      const dummy = new THREE.Object3D();

      // Populate Outer Sphere Instances
      for (let i = 0; i < params.outerCount; i++) {
        const pos = spherePointPicking(params.outerRadius);
        dummy.position.copy(pos);
        dummy.lookAt(0, 0, 0);
        dummy.updateMatrix();
        outerMesh.setMatrixAt(i, dummy.matrix);
      }

      // Populate Inner Sphere Instances
      for (let i = 0; i < params.innerCount; i++) {
        const pos = spherePointPicking(params.innerRadius);
        dummy.position.copy(pos);
        dummy.lookAt(0, 0, 0);
        dummy.updateMatrix();
        innerMesh.setMatrixAt(i, dummy.matrix);
      }

      outerMesh.instanceMatrix.needsUpdate = true;
      innerMesh.instanceMatrix.needsUpdate = true;

      outerGroup.add(outerMesh);
      innerGroup.add(innerMesh);

      updateInstanceColors();
    }

    function updateInstanceColors() {
      if (!outerMesh || !innerMesh) return;

      const c1 = new THREE.Color(params.color1);
      const c2 = new THREE.Color(params.color2);
      const c3 = new THREE.Color(params.color3);
      const c4 = new THREE.Color(params.color4);
      const c5 = new THREE.Color(params.color5);
      const accent = new THREE.Color(params.accentColor);

      const tempColor = new THREE.Color();

      // Outer Sphere: Radiant spectrum between c1, c2, c3
      for (let i = 0; i < params.outerCount; i++) {
        const t = i / params.outerCount;
        if (t < 0.5) {
          tempColor.copy(c1).lerp(c2, t * 2.0);
        } else {
          tempColor.copy(c2).lerp(c3, (t - 0.5) * 2.0);
        }
        // Subtle variance per instance
        tempColor.offsetHSL((Math.random() - 0.5) * 0.05, (Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.08);
        outerMesh.setColorAt(i, tempColor);
      }

      // Inner Sphere: Core brilliance between c3, c4, c5 and accent
      for (let i = 0; i < params.innerCount; i++) {
        const t = i / params.innerCount;
        if (t < 0.4) {
          tempColor.copy(c3).lerp(c4, t * 2.5);
        } else if (t < 0.8) {
          tempColor.copy(c4).lerp(c5, (t - 0.4) * 2.5);
        } else {
          tempColor.copy(c5).lerp(accent, (t - 0.8) * 5.0);
        }
        tempColor.offsetHSL((Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.06, (Math.random() - 0.5) * 0.06);
        innerMesh.setColorAt(i, tempColor);
      }

      if (outerMesh.instanceColor) outerMesh.instanceColor.needsUpdate = true;
      if (innerMesh.instanceColor) innerMesh.instanceColor.needsUpdate = true;

      // Update material emissive glow based on primary color
      if (sphereMaterial) {
        sphereMaterial.roughness = params.roughness;
        sphereMaterial.metalness = params.metalness;
        sphereMaterial.emissive.copy(accent).multiplyScalar(0.4);
        sphereMaterial.emissiveIntensity = params.glowIntensity;
      }
    }

    function updateLights() {
      renderer.toneMappingExposure = params.exposure;

      // Master intensity scaling
      const master = params.sceneLightIntensity;

      keyLight.visible = params.light1Enabled;
      keyLight.color.set(params.light1Color);
      keyLight.intensity = params.light1Intensity * master;
      keyLight.position.set(params.light1PosX, params.light1PosY, params.light1PosZ);

      fillLight.visible = params.light2Enabled;
      fillLight.color.set(params.light2Color);
      fillLight.intensity = params.light2Intensity * master;
      fillLight.position.set(params.light2PosX, params.light2PosY, params.light2PosZ);

      rimLight.visible = params.light3Enabled;
      rimLight.color.set(params.light3Color);
      rimLight.intensity = params.light3Intensity * master;
      rimLight.position.set(params.light3PosX, params.light3PosY, params.light3PosZ);

      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity * master;
    }

    function updateBackground() {
      if (params.greenscreen) {
        scene.background = new THREE.Color(0x00ff00);
        document.body.style.backgroundColor = '#00ff00';
      } else {
        scene.background = new THREE.Color(params.bgColor);
        document.body.style.backgroundColor = params.bgColor;
      }
    }

    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.bgColor = scheme.background;
      params.color1 = scheme.colors[0];
      params.color2 = scheme.colors[1];
      params.color3 = scheme.colors[2];
      params.color4 = scheme.colors[3];
      params.color5 = scheme.colors[4] || scheme.colors[3];
      params.accentColor = scheme.accent;

      updateBackground();
      updateInstanceColors();
      updateGuiDisplay();
    }

    function rebuildRenderer(antialias) {
      const oldCanvas = renderer.domElement;
      const parent = oldCanvas.parentNode;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        canvas: oldCanvas,
        antialias: antialias,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      updateBackground();
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZATION ON CLICK
    // =========================================================================
    function randomizeThemeAndParameters() {
      // 1. Pick a random color scheme from the 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // 2. Re-roll geometric parameters
      params.outerRadius = +(3.5 + Math.random() * 2.5).toFixed(2);
      params.innerRadius = +(params.outerRadius * (0.35 + Math.random() * 0.3)).toFixed(2);
      params.ballScale = +(0.65 + Math.random() * 0.9).toFixed(2);
      params.innerCounterRot = +(-2.0 + Math.random() * 4.0).toFixed(2);

      const shapeKeys = Object.keys(GEOMETRY_SHAPES);
      params.shape = shapeKeys[Math.floor(Math.random() * shapeKeys.length)];

      params.roughness = +(0.1 + Math.random() * 0.6).toFixed(2);
      params.metalness = +(0.1 + Math.random() * 0.8).toFixed(2);
      params.glowIntensity = +(0.4 + Math.random() * 1.2).toFixed(2);

      // 3. Re-roll motion parameters
      params.animationSpeed = +(0.6 + Math.random() * 1.2).toFixed(2);
      params.currentAnimation = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];

      // 4. Re-roll lighting parameters
      params.exposure = +(0.85 + Math.random() * 0.6).toFixed(2);
      params.sceneLightIntensity = +(0.8 + Math.random() * 0.6).toFixed(2);
      params.light1Intensity = +(1.2 + Math.random() * 1.5).toFixed(2);
      params.light2Intensity = +(0.8 + Math.random() * 1.2).toFixed(2);
      params.light3Intensity = +(1.0 + Math.random() * 1.5).toFixed(2);

      // Complementary light hues
      const baseHue = Math.random();
      const col1 = new THREE.Color().setHSL(baseHue, 0.7, 0.8);
      const col2 = new THREE.Color().setHSL((baseHue + 0.35) % 1.0, 0.75, 0.65);
      const col3 = new THREE.Color().setHSL((baseHue + 0.65) % 1.0, 0.8, 0.7);
      params.light1Color = '#' + col1.getHexString();
      params.light2Color = '#' + col2.getHexString();
      params.light3Color = '#' + col3.getHexString();

      rebuildSpheres();
      updateLights();
      updateGuiDisplay();
    }

    // =========================================================================
    // INTERACTION HANDLERS: DRAGGING, ZOOM & PERSISTENT CAMERA ANGLE
    // =========================================================================
    let isPointerDown = false;
    let startX = 0, startY = 0;
    let startPanX = 0, startPanY = 0;
    let startPitch = 0, startYaw = 0;
    let hasDragged = false;
    let pointerButton = 0;

    canvas.addEventListener('pointerdown', (e) => {
      if (e.target.closest && (e.target.closest('.lil-gui') || e.target.closest('#stats'))) return;

      isPointerDown = true;
      hasDragged = false;
      startX = e.clientX;
      startY = e.clientY;
      startPanX = params.panX;
      startPanY = params.panY;
      startPitch = params.orbitPitch;
      startYaw = params.orbitYaw;
      pointerButton = e.button;

      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (Math.hypot(dx, dy) > 4) {
        hasDragged = true;
      }

      // Calculate world units per screen pixel at current camera depth
      const dist = camera.position.length();
      const fovRad = (camera.fov * Math.PI) / 360.0;
      const worldPerPixel = (2.0 * Math.tan(fovRad) * dist) / window.innerHeight;

      const isDragObjectMode = params.dragMode.startsWith('Drag Object');

      if ((isDragObjectMode && pointerButton === 0 && !e.shiftKey) ||
          (!isDragObjectMode && (pointerButton === 2 || (pointerButton === 0 && e.shiftKey)))) {
        // Drag object across screen
        params.panX = startPanX + dx * worldPerPixel;
        params.panY = startPanY - dy * worldPerPixel;
        objectGroup.position.set(params.panX, params.panY, 0);
      } else {
        // Rotate camera angle during orbit
        params.orbitYaw = startYaw + dx * 0.35;
        params.orbitPitch = Math.max(-85, Math.min(85, startPitch - dy * 0.35));
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}

      // Click on scene generates procedural variation
      if (!hasDragged && pointerButton === 0) {
        if (params.randomizeOnClick) {
          randomizeThemeAndParameters();
        }
      }
    });

    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // Zoom with wheel: permanently alters userZoom multiplier and NEVER resets during animation
    window.addEventListener('wheel', (e) => {
      if (e.target.closest && (e.target.closest('.lil-gui') || e.target.closest('#stats'))) return;
      e.preventDefault();

      const zoomFactor = e.deltaY > 0 ? 1.08 : 0.92;
      params.userZoom = Math.max(0.15, Math.min(8.0, params.userZoom * zoomFactor));
    }, { passive: false });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Toggle GUI & Stats with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
          if (stats && stats.dom) stats.dom.style.display = '';
        } else {
          gui.hide();
          if (stats && stats.dom) stats.dom.style.display = 'none';
        }
      }
    });

    // =========================================================================
    // LIL-GUI CONTROL PANEL
    // =========================================================================
    let gui = new GUI({ title: 'Nested Celestial Spheres' });

    function buildGUI() {
      // 1. Environment & Background
      const envFolder = gui.addFolder('Environment & Background');
      envFolder.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);
      envFolder.addColor(params, 'bgColor').name('Background Color').onChange(updateBackground);
      envFolder.add(params, 'randomizeOnClick').name('Randomize On Click');

      // 2. Camera & Animation
      const animFolder = gui.addFolder('Camera & Animation');
      animFolder.add(params, 'currentAnimation', ANIMATION_PRESETS).name('Camera Preset');
      animFolder.add(params, 'animationSpeed', 0.0, 4.0, 0.05).name('Animation Speed');
      animFolder.add(params, 'dragMode', [
        'Drag Object (Left) / Orbit (Right or Shift)',
        'Orbit (Left) / Drag Object (Right or Shift)'
      ]).name('Drag Mode');
      animFolder.add(params, 'userZoom', 0.2, 5.0, 0.05).name('Zoom Multiplier');
      animFolder.add(params, 'orbitPitch', -85, 85, 1).name('Pitch Angle (deg)');
      animFolder.add(params, 'orbitYaw', -180, 180, 1).name('Yaw Angle (deg)');
      animFolder.add(params, 'panX', -10.0, 10.0, 0.05).name('Pan X').onChange(v => { objectGroup.position.x = v; });
      animFolder.add(params, 'panY', -10.0, 10.0, 0.05).name('Pan Y').onChange(v => { objectGroup.position.y = v; });
      animFolder.add({ resetCamera: () => {
        params.userZoom = 1.0;
        params.orbitPitch = 0.0;
        params.orbitYaw = 0.0;
        params.panX = 0.0;
        params.panY = 0.0;
        objectGroup.position.set(0, 0, 0);
        updateGuiDisplay();
      }}, 'resetCamera').name('Reset Camera & Pan');

      // 3. Color Schemes & Custom Colors
      const colorFolder = gui.addFolder('Color Themes (19 Schemes)');
      colorFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange(applyColorScheme);
      colorFolder.addColor(params, 'color1').name('Color 1 (Outer Deep)').onChange(updateInstanceColors);
      colorFolder.addColor(params, 'color2').name('Color 2 (Outer Mid)').onChange(updateInstanceColors);
      colorFolder.addColor(params, 'color3').name('Color 3 (Outer Bright)').onChange(updateInstanceColors);
      colorFolder.addColor(params, 'color4').name('Color 4 (Inner Mid)').onChange(updateInstanceColors);
      colorFolder.addColor(params, 'color5').name('Color 5 (Inner Core)').onChange(updateInstanceColors);
      colorFolder.addColor(params, 'accentColor').name('Accent Core Color').onChange(updateInstanceColors);

      // 4. Geometry & Spheres
      const geoFolder = gui.addFolder('Geometry & Dynamics');
      geoFolder.add(params, 'shape', Object.keys(GEOMETRY_SHAPES)).name('Particle Shape').onChange(rebuildSpheres);
      geoFolder.add(params, 'outerRadius', 2.0, 9.0, 0.1).name('Outer Radius (R1)').onChange(rebuildSpheres);
      geoFolder.add(params, 'innerRadius', 1.0, 6.0, 0.1).name('Inner Radius (R2)').onChange(rebuildSpheres);
      geoFolder.add(params, 'ballScale', 0.2, 3.0, 0.05).name('Ball Size Scale').onChange(rebuildSpheres);
      geoFolder.add(params, 'outerCount', 200, 2500, 50).name('Outer Count').onChange(rebuildSpheres);
      geoFolder.add(params, 'innerCount', 200, 2500, 50).name('Inner Count').onChange(rebuildSpheres);
      geoFolder.add(params, 'innerCounterRot', -3.0, 3.0, 0.05).name('Counter-Rotation Ratio');
      geoFolder.add(params, 'glowIntensity', 0.0, 3.0, 0.05).name('Emissive Glow').onChange(updateInstanceColors);
      geoFolder.add(params, 'roughness', 0.0, 1.0, 0.02).name('Roughness').onChange(updateInstanceColors);
      geoFolder.add(params, 'metalness', 0.0, 1.0, 0.02).name('Metalness').onChange(updateInstanceColors);

      // 5. Lighting & Exposure
      const lightFolder = gui.addFolder('Lighting & Exposure');
      lightFolder.add(params, 'exposure', 0.1, 3.0, 0.05).name('Master Exposure').onChange(v => {
        renderer.toneMappingExposure = v;
      });
      lightFolder.add(params, 'sceneLightIntensity', 0.0, 3.0, 0.05).name('Master Light Intensity').onChange(updateLights);

      // Key Light (Light 1)
      const l1 = lightFolder.addFolder('Key Light (Light 1)');
      l1.add(params, 'light1Enabled').name('Enabled').onChange(updateLights);
      l1.addColor(params, 'light1Color').name('Color').onChange(updateLights);
      l1.add(params, 'light1Intensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateLights);
      l1.add(params, 'light1AutoOrbit').name('Auto Orbit');
      l1.add(params, 'light1OrbitSpeed', 0.0, 3.0, 0.1).name('Orbit Speed');
      l1.add(params, 'light1PosX', -15.0, 15.0, 0.5).name('Pos X').onChange(updateLights);
      l1.add(params, 'light1PosY', -15.0, 15.0, 0.5).name('Pos Y').onChange(updateLights);
      l1.add(params, 'light1PosZ', -15.0, 15.0, 0.5).name('Pos Z').onChange(updateLights);

      // Fill Light (Light 2)
      const l2 = lightFolder.addFolder('Fill Light (Light 2)');
      l2.add(params, 'light2Enabled').name('Enabled').onChange(updateLights);
      l2.addColor(params, 'light2Color').name('Color').onChange(updateLights);
      l2.add(params, 'light2Intensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateLights);
      l2.add(params, 'light2PosX', -15.0, 15.0, 0.5).name('Pos X').onChange(updateLights);
      l2.add(params, 'light2PosY', -15.0, 15.0, 0.5).name('Pos Y').onChange(updateLights);
      l2.add(params, 'light2PosZ', -15.0, 15.0, 0.5).name('Pos Z').onChange(updateLights);

      // Rim Light (Light 3)
      const l3 = lightFolder.addFolder('Rim Light (Light 3)');
      l3.add(params, 'light3Enabled').name('Enabled').onChange(updateLights);
      l3.addColor(params, 'light3Color').name('Color').onChange(updateLights);
      l3.add(params, 'light3Intensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateLights);
      l3.add(params, 'light3PosX', -15.0, 15.0, 0.5).name('Pos X').onChange(updateLights);
      l3.add(params, 'light3PosY', -15.0, 15.0, 0.5).name('Pos Y').onChange(updateLights);
      l3.add(params, 'light3PosZ', -15.0, 15.0, 0.5).name('Pos Z').onChange(updateLights);

      // Ambient Light
      const lAmb = lightFolder.addFolder('Ambient Light');
      lAmb.addColor(params, 'ambientColor').name('Color').onChange(updateLights);
      lAmb.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateLights);

      // 6. Display & Renderer
      const displayFolder = gui.addFolder('Display Settings');
      displayFolder.add(params, 'antialias').name('Antialias (Default ON)').onChange(v => {
        rebuildRenderer(v);
      });
      displayFolder.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
        renderer.setPixelRatio(v);
      });
    }

    function updateGuiDisplay() {
      function traverse(target) {
        if (target.controllers) {
          target.controllers.forEach(c => c.updateDisplay());
        }
        if (target.folders) {
          target.folders.forEach(child => traverse(child));
        }
      }
      traverse(gui);
    }

    // =========================================================================
    // INITIALIZATION & ANIMATION RENDER LOOP
    // =========================================================================
    rebuildSpheres();
    updateLights();
    buildGUI();

    let prevTime = performance.now();
    let animTime = 0;
    let harmonicFrames = 0;
    let harmonicT = 0;

    // Harmonic rotation smoothing variables matching CodePen physics
    let rotVelX = 0;
    let rotVelY = 0;
    const harmonicSpeed = 0.00065;
    const harmonicEasing = 0.90;

    function animate(currentTime) {
      requestAnimationFrame(animate);

      if (stats) stats.begin();

      const delta = Math.min((currentTime - prevTime) / 1000, 0.1);
      prevTime = currentTime;

      const spd = params.animationSpeed;

      // 1. HARMONIC KINEMATICS (Exact Lissajous dual-axis rotation from CodePen)
      harmonicFrames += 0.1 * spd;
      harmonicT += (delta * 1000 / 127) * spd;

      // Harmonic target angular offsets
      const mx = Math.cos(harmonicT / 43 + Math.cos(harmonicT / 47 + harmonicFrames)) * 8;
      const my = Math.sin(harmonicT / 31 + Math.cos(harmonicT / 37 + harmonicFrames)) * 8;

      const targetX = my * harmonicSpeed * spd;
      const targetY = mx * harmonicSpeed * spd;

      rotVelX = (rotVelX + targetX) * harmonicEasing;
      rotVelY = (rotVelY + targetY) * harmonicEasing;

      // Outer Sphere rotation
      outerGroup.rotation.x += rotVelX;
      outerGroup.rotation.y += rotVelY;

      // Inner Sphere counter-rotation / differential motion
      innerGroup.rotation.x += rotVelX * params.innerCounterRot;
      innerGroup.rotation.y -= rotVelY * params.innerCounterRot;

      // Subtle differential Z spin
      outerGroup.rotation.z += 0.001 * spd;
      innerGroup.rotation.z -= 0.0015 * spd;

      // 2. KEY LIGHT AUTO ORBIT
      if (params.light1Enabled && params.light1AutoOrbit) {
        const lAngle = currentTime * 0.0008 * params.light1OrbitSpeed * spd;
        keyLight.position.x = Math.cos(lAngle) * 8.0;
        keyLight.position.z = Math.sin(lAngle) * 8.0;
        keyLight.position.y = params.light1PosY + Math.sin(lAngle * 0.5) * 2.0;
      }

      // 3. CAMERA ANIMATIONS (8 PRESETS) WITH PERSISTENT USER ZOOM & PERSISTENT ANGLE
      if (params.currentAnimation !== 'Static (No Camera Motion)') {
        animTime += delta * spd;
      }

      let animPitch = 0.0;
      let animYaw = 0.0;
      let animZoomMod = 1.0;

      switch (params.currentAnimation) {
        case 'Static (No Camera Motion)':
          animPitch = 0.0;
          animYaw = 0.0;
          animZoomMod = 1.0;
          break;
        case 'Slow Celestial Orbit':
          animYaw = animTime * 0.16;
          animPitch = Math.sin(animTime * 0.08) * 0.12;
          break;
        case 'Floating Figure-8':
          animYaw = Math.sin(animTime * 0.22) * 0.45;
          animPitch = Math.cos(animTime * 0.44) * 0.22;
          break;
        case 'Harmonic Pendulum Sway':
          animYaw = Math.sin(animTime * 0.26) * 0.55;
          animPitch = Math.abs(Math.sin(animTime * 0.26)) * 0.14;
          break;
        case 'Cosmic Spiral Ascend':
          animYaw = animTime * 0.2;
          animPitch = Math.sin(animTime * 0.16) * 0.38;
          animZoomMod = 1.0 + 0.12 * Math.cos(animTime * 0.16);
          break;
        case 'Breathing Orbital Drift':
          animYaw = animTime * 0.12;
          animPitch = Math.cos(animTime * 0.14) * 0.14;
          animZoomMod = 1.0 + 0.2 * Math.sin(animTime * 0.22);
          break;
        case 'Cinematic Horizon Glide':
          animYaw = (Math.sin(animTime * 0.1) + Math.cos(animTime * 0.17)) * 0.32;
          animPitch = -0.18 + Math.sin(animTime * 0.12) * 0.15;
          break;
        case 'Dynamic Polar Wave':
          animYaw = Math.sin(animTime * 0.3) * 0.42;
          animPitch = Math.cos(animTime * 0.3) * 0.35;
          break;
      }

      // Combine user manual angle offsets and animation trajectory
      const totalPitch = (params.orbitPitch * Math.PI / 180.0) + animPitch;
      const totalYaw = (params.orbitYaw * Math.PI / 180.0) + animYaw;

      // Base camera distance scaled permanently by persistent user wheel zoom
      const baseDistance = 14.0;
      const currentDistance = baseDistance * params.userZoom * animZoomMod;

      const cosP = Math.cos(totalPitch);
      const sinP = Math.sin(totalPitch);
      const cosY = Math.cos(totalYaw);
      const sinY = Math.sin(totalYaw);

      camera.position.set(
        currentDistance * cosP * sinY,
        currentDistance * sinP,
        currentDistance * cosP * cosY
      );
      camera.lookAt(0, 0, 0);

      // Render Scene
      renderer.render(scene, camera);

      if (stats) stats.end();
    }

    requestAnimationFrame(animate);
  </script>
</body>
