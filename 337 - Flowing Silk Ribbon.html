<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowing Silk Ribbon Fabric Waves</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050e1f;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewport-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }
    #viewport-wrapper.grabbing {
      cursor: grabbing;
    }
    svg#silk-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: none;
    }
    canvas#webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      mix-blend-mode: screen;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewport-wrapper">
    <!-- SVG Layer for Multi-layered Stacked Bézier Silk Ribbons -->
    <svg id="silk-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" shape-rendering="geometricPrecision">
      <defs id="svg-defs">
        <!-- Soft Specular Glow Filter for Silk Crest Sheen -->
        <filter id="silk-crest-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Ambient Backdrop Vignette Gradient -->
        <radialGradient id="bg-ambient-grad" cx="50%" cy="50%" r="70%">
          <stop offset="0%" stop-color="#12254a" stop-opacity="0.6" id="bg-grad-stop-0" />
          <stop offset="55%" stop-color="#071329" stop-opacity="0.85" id="bg-grad-stop-1" />
          <stop offset="100%" stop-color="#02060f" stop-opacity="1" id="bg-grad-stop-2" />
        </radialGradient>
      </defs>

      <!-- Infinite Background Surface Plane -->
      <rect id="bg-rect" x="-4000" y="-4000" width="10000" height="10000" fill="url(#bg-ambient-grad)" />

      <!-- World Rig Container (Pan & Zoom Transformation Rig) -->
      <g id="world-rig">
        <!-- Silk Ribbons Group -->
        <g id="ribbons-container"></g>
      </g>
    </svg>

    <!-- Three.js Overlay Canvas for Antialiased Atmospheric Particles, Shimmer & PostProcessor -->
    <canvas id="webgl-canvas"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (postprocessing/PostProcessor.js)
    // Inlined for full file:// compatibility without CORS restrictions
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.03,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.4,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, {
          type: THREE.HalfFloatType,
          samples: this.settings.antialias ? 4 : 0
        });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      setAntialias(enabled) {
        this.settings.antialias = enabled;
        const w = this.sceneTarget.width;
        const h = this.sceneTarget.height;
        this.sceneTarget.dispose();
        this.sceneTarget = createFBO(w, h, {
          type: THREE.HalfFloatType,
          samples: enabled ? 4 : 0
        });
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens & Camera Optics");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());

    function buildRibbonGradients() {

        grad.setAttribute('x1', '0%');
        grad.setAttribute('y1', '0%');
        grad.setAttribute('x2', '100%');
        grad.setAttribute('y2', '80%');

        const ratio = i / Math.max(1, count - 1);
        const colIdx1 = Math.floor(ratio * (stops.length - 1));
        const colIdx2 = Math.min(stops.length - 1, colIdx1 + 1);

        const stop0 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        stop0.setAttribute('offset', '0%');
        stop0.setAttribute('stop-color', stops[colIdx1]);
        stop0.setAttribute('stop-opacity', '0.92');

        const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        stop1.setAttribute('offset', '28%');

        stop3.setAttribute('offset', '76%');

    function createRibbonElements() {
      ribbonsContainer.innerHTML = '';

        const baseY = verticalPadding + (i / Math.max(1, count - 1)) * verticalSpan;

        ribbons.push({
          index: i,

          bodyPath,
          crestPath,
          baseY,
          speedMult: 0.85 + 0.3 * Math.sin(i * 1.2),

          phaseOffset: i * 0.45,
          harmonicPhase: i * 0.8
        });

    // Convert an array of 2D points into smooth Cubic Bézier SVG path segments using Catmull-Rom tangents
    function generateCubicBezierPath(points, tension) {
      if (points.length < 2) return '';
      let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;

      const t = tension * 0.5;
      const len = points.length;

      for (let i = 0; i < len - 1; i++) {
        const p0 = i > 0 ? points[i - 1] : points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = i < len - 2 ? points[i + 2] : p2;

        const cp1x = p1.x + ((p2.x - p0.x) / 3) * t;
        const cp1y = p1.y + ((p2.y - p0.y) / 3) * t;

        const cp2x = p2.x - ((p3.x - p1.x) / 3) * t;
        const cp2y = p2.y - ((p3.y - p1.y) / 3) * t;

        d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }
      return d;
    }

    // =========================================================================
    // PROCEDURAL WAVE MORPHING LOGIC
    // =========================================================================
    function updateRibbonGeometries(time) {
      const tension = params.curveTension;
      const count = ribbons.length;
      const stepX = (SPAN_MAX_X - SPAN_MIN_X) / (NUM_CONTROL_POINTS - 1);
      const mode = params.animationPreset;
      const isStatic = (mode === 'Static Silk Stillness');

      const effectiveTime = isStatic ? 0 : time * params.animationSpeed;

      for (let i = 0; i < count; i++) {
        const r = ribbons[i];
        const topPoints = [];
        const bottomPoints = [];

        // Dynamic ribbon height calculation for fabric fold / twist effect
        const foldCycle = Math.sin(effectiveTime * 0.7 * r.speedMult + r.phaseOffset);
        const ribbonThickness = params.ribbonHeight * (0.65 + 0.35 * foldCycle);

        for (let j = 0; j < NUM_CONTROL_POINTS; j++) {
          const x = SPAN_MIN_X + j * stepX;
          const xNorm = j / (NUM_CONTROL_POINTS - 1);

          let offsetY = 0;

          // Mode-specific harmonic formulation
          switch (mode) {
            case 'Laminar Silk Drift': {
              const primary = Math.sin(effectiveTime * 1.1 + xNorm * Math.PI * 2 * params.waveFrequency + r.phaseOffset);
              const secondary = Math.cos(effectiveTime * 0.7 - xNorm * Math.PI * 1.5 + r.harmonicPhase) * 0.38;
              offsetY = (primary + secondary) * params.waveAmplitude;
              break;
            }

            case 'Oceanic Ribbon Swell': {
              const surge = Math.sin(effectiveTime * 0.85 + xNorm * Math.PI * 1.8 * params.waveFrequency + r.phaseOffset);
              const crest = Math.pow(Math.max(0, surge), 1.6) * 1.3 - Math.pow(Math.max(0, -surge), 1.2) * 0.7;
              const undertow = Math.cos(effectiveTime * 0.5 + r.phaseOffset * 1.2) * 0.4;
              offsetY = (crest + undertow) * params.waveAmplitude * 1.25;
              break;
            }

            case 'Harmonic Braid Twist': {
              // Alternating opposing phase ribbons
              const sign = (i % 2 === 0) ? 1.0 : -1.0;
              const twist = Math.sin(effectiveTime * 1.2 * sign + xNorm * Math.PI * 2.5 * params.waveFrequency + r.phaseOffset);
              const crossWave = Math.cos(effectiveTime * 0.9 * sign + xNorm * Math.PI * 1.2) * 0.45;
              offsetY = (twist + crossWave) * params.waveAmplitude;
              break;
            }

            case 'Ethereal Zephyr Ripple': {
              const broadSway = Math.sin(effectiveTime * 0.6 + xNorm * Math.PI * 1.2 * params.waveFrequency + r.phaseOffset);
              const microFlutter = Math.sin(effectiveTime * 2.8 + xNorm * Math.PI * 6.0 + r.harmonicPhase * 2.0) * 0.22;
              offsetY = (broadSway + microFlutter) * params.waveAmplitude * 0.9;
              break;
            }

            case 'Cascading Satin Falls': {
              // Progressive vertical delay cascade downwards
              const fallPhase = effectiveTime * 1.3 - (i / count) * 4.0 + xNorm * Math.PI * 2.0 * params.waveFrequency;
              const drop = Math.sin(fallPhase) + 0.3 * Math.sin(fallPhase * 2.0);
              offsetY = drop * params.waveAmplitude * 1.1;
              break;
            }

            case 'Orbital Silk Vortex': {
              const vortexAngle = effectiveTime * 0.9 + (i / count) * Math.PI * 2.0;
              const orbit = Math.sin(vortexAngle + xNorm * Math.PI * 2.0 * params.waveFrequency);
              const lateralShear = Math.cos(vortexAngle * 0.8 + xNorm * Math.PI) * 0.35;
              offsetY = (orbit + lateralShear) * params.waveAmplitude * 1.05;
              break;
            }

            case 'Resonant Fabric Pulse': {
              const breath = Math.sin(effectiveTime * 0.9 + r.phaseOffset * 0.5);
              const wave = Math.sin(xNorm * Math.PI * 2.2 * params.waveFrequency + r.harmonicPhase);
              offsetY = wave * (params.waveAmplitude * (0.6 + 0.7 * Math.abs(breath)));
              break;
            }

            case 'Static Silk Stillness':
            default: {
              const s1 = Math.sin(xNorm * Math.PI * 2.2 * params.waveFrequency + r.phaseOffset);
              const s2 = Math.cos(xNorm * Math.PI * 1.4 + r.harmonicPhase) * 0.35;
              offsetY = (s1 + s2) * params.waveAmplitude;
              break;
            }
          }

          const curTopY = r.baseY + offsetY;
          const curBotY = curTopY + ribbonThickness;

          topPoints.push({ x, y: curTopY });
          bottomPoints.push({ x, y: curBotY });
        }

        // Build top Bézier curve
        const topD = generateCubicBezierPath(topPoints, tension);

        // Build reverse bottom Bézier curve
        const reversedBottom = [...bottomPoints].reverse();
        const bottomD = generateCubicBezierPath(reversedBottom, tension);

        // Combine into closed ribbon envelope path: Top Forward -> Line to Bot Start -> Bot Backward -> Close
        const firstBot = reversedBottom[0];
        const bodyD = `${topD} L ${firstBot.x.toFixed(1)} ${firstBot.y.toFixed(1)} ${bottomD.substring(bottomD.indexOf('C'))} Z`;

        r.bodyPath.setAttribute('d', bodyD);
        r.crestPath.setAttribute('d', topD);
      }
    }

    // =========================================================================
    // COLOR SCHEME APPLICATOR
    // =========================================================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Monochromatic'];
      params.colorScheme = schemeName;
      params.bgColor = scheme.bg;
      params.colorStop1 = scheme.stops[0];
      params.colorStop2 = scheme.stops[1];
      params.colorStop3 = scheme.stops[2];
      params.colorStop4 = scheme.stops[3];
      params.colorStop5 = scheme.stops[4] || scheme.stops[scheme.stops.length - 1];
      params.accentColor = scheme.accent;
      params.sheenColor = scheme.sheen;

      updateBackground();
      buildRibbonGradients();

      // Update crest paths and blend mode
      ribbons.forEach((r) => {
        r.crestPath.setAttribute('stroke', params.accentColor);
        r.bodyPath.setAttribute('fill-opacity', params.ribbonOpacity.toFixed(2));
        r.crestPath.setAttribute('stroke-opacity', params.edgeGlowIntensity.toFixed(2));
        r.bodyPath.style.mixBlendMode = params.blendMode;
      });

      // Update Three.js particle color
      if (particleMat) {
        particleMat.color.set(scheme.particle || params.accentColor);
      }
    }

    function updateBackground() {
      if (params.greenscreen) {
        document.body.style.backgroundColor = '#00ff00';
        bgRect.setAttribute('fill', '#00ff00');
        if (renderer) renderer.setClearColor(0x00ff00, 1.0);
      } else {
        document.body.style.backgroundColor = params.bgColor;
        const scheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Monochromatic'];
        const stop0 = document.getElementById('bg-grad-stop-0');
        const stop1 = document.getElementById('bg-grad-stop-1');
        const stop2 = document.getElementById('bg-grad-stop-2');
        if (stop0 && stop1 && stop2) {
          stop0.setAttribute('stop-color', scheme.bgCenter || params.colorStop2);
          stop1.setAttribute('stop-color', params.bgColor);
          stop2.setAttribute('stop-color', params.colorStop1);
        }
        bgRect.setAttribute('fill', 'url(#bg-ambient-grad)');
        if (renderer) renderer.setClearColor(0x000000, 0.0);
      }
    }

    function updateLightingAndExposure() {
      const combinedBrightness = (params.exposure * params.lightIntensity).toFixed(3);
      const combinedContrast = (1.0 + (params.lightIntensity - 1.0) * 0.35).toFixed(3);
      svgEl.style.filter = `brightness(${combinedBrightness}) contrast(${combinedContrast})`;

      if (particleMat) {
        particleMat.opacity = Math.min(1.0, 0.75 * params.lightIntensity);
      }
    }

    // =========================================================================
    // RANDOM PROCEDURAL GENERATOR (Click-to-Randomize)
    // =========================================================================
    function randomizeScene() {
      // 1. Pick a random color scheme from the 18 preconfigured presets
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // 2. Pick a random animated preset (excluding static unless selected)
      const dynamicPresets = [
        'Laminar Silk Drift',
        'Oceanic Ribbon Swell',
        'Harmonic Braid Twist',
        'Ethereal Zephyr Ripple',
        'Cascading Satin Falls',
        'Orbital Silk Vortex',
        'Resonant Fabric Pulse'
      ];
      params.animationPreset = dynamicPresets[Math.floor(Math.random() * dynamicPresets.length)];

      // 3. Re-roll geometric and motion parameters
      params.ribbonCount = Math.floor(8 + Math.random() * 10);
      params.ribbonHeight = Math.round(55 + Math.random() * 95);
      params.waveAmplitude = Math.round(45 + Math.random() * 70);
      params.waveFrequency = +(0.5 + Math.random() * 1.3).toFixed(2);
      params.curveTension = +(0.8 + Math.random() * 0.6).toFixed(2);
      params.ribbonOpacity = +(0.65 + Math.random() * 0.3).toFixed(2);
      params.edgeGlowIntensity = +(0.45 + Math.random() * 0.5).toFixed(2);
      params.animationSpeed = +(0.45 + Math.random() * 0.65).toFixed(2);
      params.lightIntensity = +(0.9 + Math.random() * 0.7).toFixed(2);
      params.exposure = +(0.85 + Math.random() * 0.45).toFixed(2);

      // Rebuild ribbons with new counts and styles
      createRibbonElements();
      updateLightingAndExposure();

      // Sync GUI display controllers
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    // =========================================================================
    // USER INTERFACE: LIL-GUI INITIALIZATION
    // =========================================================================
    const gui = new GUI({ title: 'Silk Waves Controls' });

    // 1. Color Palette Folder
    const fColor = gui.addFolder('Colors & Theme');
    fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
    fColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
      updateBackground();
    });
    fColor.addColor(params, 'bgColor').name('Background Color').onChange(() => {
      updateBackground();
    });
    fColor.addColor(params, 'colorStop1').name('Shadow Depth').onChange(buildRibbonGradients);
    fColor.addColor(params, 'colorStop2').name('Base Silk').onChange(buildRibbonGradients);
    fColor.addColor(params, 'colorStop3').name('Midtone Sheen').onChange(buildRibbonGradients);
    fColor.addColor(params, 'colorStop4').name('Lustre Crest').onChange(buildRibbonGradients);
    fColor.addColor(params, 'colorStop5').name('Trailing Edge').onChange(buildRibbonGradients);
    fColor.addColor(params, 'accentColor').name('Edge Stroke').onChange(applyColorScheme);
    fColor.addColor(params, 'sheenColor').name('Specular Highlight').onChange(buildRibbonGradients);
    fColor.add(params, 'blendMode', ['normal', 'screen', 'plus-lighter', 'soft-light', 'overlay']).name('Blend Mode').onChange(() => {
      ribbons.forEach(r => r.bodyPath.style.mixBlendMode = params.blendMode);
    });

    // 2. Fabric Waves & Geometry Folder
    const fFabric = gui.addFolder('Fabric Geometry');
    fFabric.add(params, 'ribbonCount', 4, 24, 1).name('Ribbon Layers').onChange(createRibbonElements);
    fFabric.add(params, 'ribbonHeight', 30, 220, 1).name('Ribbon Width');
    fFabric.add(params, 'waveAmplitude', 15, 180, 1).name('Wave Amplitude');
    fFabric.add(params, 'waveFrequency', 0.2, 2.5, 0.05).name('Wave Frequency');
    fFabric.add(params, 'curveTension', 0.3, 2.0, 0.05).name('Bézier Tension');
    fFabric.add(params, 'ribbonOpacity', 0.15, 1.0, 0.02).name('Ribbon Opacity').onChange(() => {
      ribbons.forEach(r => r.bodyPath.setAttribute('fill-opacity', params.ribbonOpacity.toFixed(2)));
    });
    fFabric.add(params, 'edgeGlowIntensity', 0.0, 1.0, 0.05).name('Crest Glow').onChange(() => {
      ribbons.forEach(r => r.crestPath.setAttribute('stroke-opacity', params.edgeGlowIntensity.toFixed(2)));
    });

    // 3. Animation Modes Folder (8 Preconfigured animations including Static)
    const fAnim = gui.addFolder('Animation & Motion');
    fAnim.add(params, 'animationPreset', [
      'Laminar Silk Drift',
      'Oceanic Ribbon Swell',
      'Harmonic Braid Twist',
      'Ethereal Zephyr Ripple',
      'Cascading Satin Falls',
      'Orbital Silk Vortex',
      'Resonant Fabric Pulse',
      'Static Silk Stillness'
    ]).name('Motion Preset');
    fAnim.add(params, 'animationSpeed', 0.0, 3.0, 0.02).name('Animation Speed');

    // 4. Lighting, Exposure & Display Controls
    const fLight = gui.addFolder('Scene Lighting & Display');
    fLight.add(params, 'exposure', 0.2, 2.5, 0.05).name('Exposure').onChange(updateLightingAndExposure);
    fLight.add(params, 'lightIntensity', 0.2, 2.5, 0.05).name('Light Intensity').onChange(updateLightingAndExposure);
    fLight.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange((val) => {
      renderer.setPixelRatio(val);
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, val);
      }
    });
    fLight.add(params, 'antialias').name('Three.js Antialias').onChange((val) => {
      params.antialias = val;
      if (postProcessor) {
        postProcessor.setAntialias(val);
      }
      initThreeScene(val);
    });
    fLight.add(params, 'particlesEnabled').name('Silk Sparkles').onChange((val) => {
      if (particlePoints) particlePoints.visible = val;
    });

    // 5. Attach Modular PostProcessor.js Suite GUI
    if (postProcessor) {
      postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');
    }

    // 6. Interaction & Camera Folder
    const fInteract = gui.addFolder('Interaction & View');
    fInteract.add(params, 'randomizeOnClick').name('Click to Randomize');
    const zoomCtrl = fInteract.add(params, 'zoom', 0.2, 5.0, 0.05).name('Zoom Factor');
    const panXCtrl = fInteract.add(params, 'panX', -1000, 1000, 1).name('Pan X');
    const panYCtrl = fInteract.add(params, 'panY', -1000, 1000, 1).name('Pan Y');
    fInteract.add({ resetCamera: () => {
      params.panX = 0;
      params.panY = 0;
      params.zoom = 1.0;
      zoomCtrl.updateDisplay();
      panXCtrl.updateDisplay();
      panYCtrl.updateDisplay();
    }}, 'resetCamera').name('Reset View');

    // Toggle UI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // =========================================================================
    // INTERACTIVE PAN, ZOOM & CLICK-TO-RANDOMIZE ENGINE
    // =========================================================================
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPanX = 0;
    let initialPanY = 0;
    let pointerDownTime = 0;
    let hasMovedSignificantly = false;

    viewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isDragging = true;
      hasMovedSignificantly = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initialPanX = params.panX;
      initialPanY = params.panY;
      pointerDownTime = performance.now();
      viewport.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.hypot(dx, dy) > 6) {
        hasMovedSignificantly = true;
      }
      params.panX = initialPanX + dx;
      params.panY = initialPanY + dy;
      panXCtrl.updateDisplay();
      panYCtrl.updateDisplay();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      viewport.classList.remove('grabbing');

      const clickDuration = performance.now() - pointerDownTime;
      // Trigger random procedural variation if this was a clean click on scene
      if (!hasMovedSignificantly && clickDuration < 320) {
        if (params.randomizeOnClick && !e.target.closest('.lil-gui')) {
          randomizeScene();
        }
      }
    });

    // Zoom with mouse wheel
    viewport.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      params.zoom = Math.min(Math.max(params.zoom * zoomFactor, 0.15), 6.0);
      zoomCtrl.updateDisplay();
    }, { passive: false });

    // =========================================================================
    // RESIZE & RENDER LOOP
    // =========================================================================
    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (renderer) {
        renderer.setSize(w, h);
      }
      if (postProcessor) {
        postProcessor.setSize(w, h, params.dpr);
      }
    }
    window.addEventListener('resize', onResize);

    function animate(now) {
      requestAnimationFrame(animate);

      const delta = Math.min((now - lastTimestamp) / 1000, 0.1);
      lastTimestamp = now;

      const isStatic = (params.animationPreset === 'Static Silk Stillness');
      if (!isStatic) {
        globalTime += delta;
      }

      // 1. Camera Sway according to mode
      let camOffsetX = 0;
      let camOffsetY = 0;
      let camZoomMult = 1.0;
      let camRot = 0;

      if (!isStatic) {
        switch (params.animationPreset) {
          case 'Laminar Silk Drift':
            camOffsetX = 18 * Math.sin(globalTime * 0.35);
            camOffsetY = 12 * Math.cos(globalTime * 0.28);
            break;
          case 'Oceanic Ribbon Swell':
            camOffsetY = 24 * Math.sin(globalTime * 0.45);
            camZoomMult = 1.0 + 0.03 * Math.sin(globalTime * 0.3);
            break;
          case 'Harmonic Braid Twist':
            camRot = 0.8 * Math.sin(globalTime * 0.5);
            camOffsetY = 10 * Math.sin(globalTime * 0.4);
            break;
          case 'Ethereal Zephyr Ripple':
            camOffsetX = 12 * Math.cos(globalTime * 0.3);
            break;
          case 'Cascading Satin Falls':
            camOffsetY = 28 * Math.sin(globalTime * 0.4);
            break;
          case 'Orbital Silk Vortex':
            camOffsetX = 18 * Math.cos(globalTime * 0.4);
            camOffsetY = 14 * Math.sin(globalTime * 0.4);
            camRot = 0.6 * Math.sin(globalTime * 0.3);
            break;
          case 'Resonant Fabric Pulse':
            camZoomMult = 1.0 + 0.04 * Math.sin(globalTime * 0.6);
            break;
        }
      }

      // Apply Combined Transform to SVG World Rig
      const finalPanX = params.panX + camOffsetX;
      const finalPanY = params.panY + camOffsetY;
      const finalZoom = params.zoom * camZoomMult;

      worldRig.setAttribute(
        'transform',
        `translate(${CENTER_X + finalPanX}, ${CENTER_Y + finalPanY}) scale(${finalZoom}) rotate(${camRot.toFixed(2)}) translate(${-CENTER_X}, ${-CENTER_Y})`
      );

      // 2. Morph Bézier Ribbon Geometries
      updateRibbonGeometries(globalTime);

      // 3. Update Three.js Silk Sparkles & Run PostProcessor Pipeline
      if (particleGeo) {
        if (params.particlesEnabled) {
          const positions = particleGeo.attributes.position.array;
          const speed = isStatic ? 0 : params.animationSpeed;

          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const idx = i * 3;
            positions[idx + 0] += particleVelocities[idx + 0] * 60 * delta * speed;
            positions[idx + 1] += Math.sin(globalTime * 1.5 + particlePhases[i]) * 18 * delta * speed;

            // Wrap particles smoothly within bounds
            if (positions[idx + 0] > SVG_WIDTH * 0.7) {
              positions[idx + 0] = -SVG_WIDTH * 0.7;
            }
          }
          particleGeo.attributes.position.needsUpdate = true;
        }

        // Synchronize Three.js camera with SVG pan and zoom
        camera.position.x = -finalPanX;
        camera.position.y = finalPanY;
        camera.zoom = finalZoom;
        camera.rotation.z = (camRot * Math.PI) / 180;
        camera.updateProjectionMatrix();

        if (postProcessor) {
          postProcessor.renderScene(scene, camera);
        } else {
          renderer.render(scene, camera);
        }
      }
    }

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    createRibbonElements();
    applyColorScheme('Monochromatic');
    updateLightingAndExposure();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
