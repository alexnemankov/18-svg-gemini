    <!-- Import Maps for Three.js and lil-gui -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        body:active {

        body.greenscreen {

        canvas {
            display: block;

        }

</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // =========================================================================
        // POST PROCESSOR SUITE (Three.js Shader Post-Processing Pipeline)
        // =========================================================================
        const postOrthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
            vUv = position.xy * 0.5 + 0.5;
            gl_Position = vec4(position, 1.0);
        }
        `;

        const postBrightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
            vec4 color = texture(inputTexture, vUv);
            float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
            float knee = 0.1;
            float soft = luminance - bloomThreshold + knee;
            soft = clamp(soft, 0.0, 2.0 * knee);
            soft = (soft * soft) / (4.0 * knee + 0.00001);
            float contribution = max(soft, luminance - bloomThreshold);
            contribution /= max(luminance, 0.00001);
            fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const postBlur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
            vec2 resolution = vec2(textureSize(image, 0));
            vec4 color = vec4(0.0);
            vec2 off1 = vec2(1.411764705882353) * direction;
            vec2 off2 = vec2(3.2941176470588234) * direction;
            vec2 off3 = vec2(5.176470588235294) * direction;
            color += texture(image, uv) * 0.1964825501511404;
            color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
            color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
            color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
            color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
            color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
            color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
            return color;
        }
        `;

        const postBlurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${postBlur13ShaderChunk}
        void main() {
            color = blur13(inputTexture, vUv, direction);
        }
        `;

        const postFinalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
            vec2 position = vUv - 0.5;
            return boost - length(position) * reduction;
        }

        float hash1(uint n) {
            n = (n << 13U) ^ n;
            n = n * (n * n * 15731U + 789221U) + 1376312589U;
            return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
            uvec2 p = uvec2(uv);
            return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
            vec4 color = texture(inputTexture, vUv);

            if (bloomEnabled && bloomStrength > 0.001) {
                vec4 b0 = texture(blur0Texture, vUv);
                vec4 b1 = texture(blur1Texture, vUv);
                vec4 b2 = texture(blur2Texture, vUv);
                vec4 b3 = texture(blur3Texture, vUv);
                vec4 b4 = texture(blur4Texture, vUv);

                vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
                color += bloomSum * bloomStrength;
            }

            color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
            if (noiseIntensity > 0.0001) {
                color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
            }
            fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const postChromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
            vec2 cc = coord - 0.5;
            float dist = dot(cc, cc);
            return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
            float lo = step(t, 0.5);
            float hi = 1.0 - lo;
            float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
            vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
            return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
            vec4 sumcol = vec4(0.0);
            vec4 sumw = vec4(0.0);
            for (int i = 0; i < num_iter; ++i) {
                float t = float(i) * reci_num_iter_f;
                vec4 w = spectrum_offset(t);
                sumw += w;
                sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
            }
            return sumcol / sumw;
        }
        `;

        const postColorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${postChromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
            if (abs(strength) < 0.0001) return uv;
            vec2 p = uv - 0.5;
            float d = length(p);
            if (d > radius * 1.5) return uv;
            float r = d / max(radius, 0.001);
            float theta = atan(p.y, p.x);
            float rDist = r + strength * (r * r * r);
            return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
            return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
            return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
            return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
            vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
            fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
            fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
            fragColor.a = 1.0;
        }
        `;

        const postCopyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
            fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
            return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
                wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
                wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
                minFilter: options.minFilter || THREE.LinearFilter,
                magFilter: options.magFilter || THREE.LinearFilter,
                format: options.format || THREE.RGBAFormat,
                type: options.type || THREE.HalfFloatType,
                stencilBuffer: options.stencilBuffer || false,
                depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
                samples: options.samples || 0,
            });
        }

        class PostShaderPass {
            constructor(shader, options = {}) {
                this.shader = shader;
                this.orthoScene = new THREE.Scene();
                this.fbo = createFBO(1, 1, options);
                this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
                this.orthoScene.add(this.orthoQuad);
                this.texture = this.fbo.texture;
            }
            render(renderer, toScreen = false) {
                if (!toScreen) {
                    renderer.setRenderTarget(this.fbo);
                }
                renderer.render(this.orthoScene, this.orthoCamera);
                if (!toScreen) {
                    renderer.setRenderTarget(null);
                }
            }
            setSize(width, height) {
                this.fbo.setSize(Math.max(1, width), Math.max(1, height));
                this.orthoQuad.scale.set(width, height, 1);
            }
        }

        class PostShaderPingPongPass {
            constructor(shader, options = {}) {
                this.shader = shader;
                this.orthoScene = new THREE.Scene();
                this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
                this.currentFBO = 0;
                this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
                this.orthoScene.add(this.orthoQuad);
            }
            render(renderer) {
                renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
                renderer.render(this.orthoScene, this.orthoCamera);
                renderer.setRenderTarget(null);
                this.currentFBO = 1 - this.currentFBO;
            }
            get current() { return this.fbos[this.currentFBO]; }
            get texture() { return this.current.texture; }
            setSize(width, height) {
                const w = Math.max(1, width);
                const h = Math.max(1, height);
                this.orthoQuad.scale.set(w, h, 1);
                this.fbos[0].setSize(w, h);
                this.fbos[1].setSize(w, h);
            }
        }

        class PostBloomPass {
            constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
                this.strength = strength;
                this.radius = radius;
                this.threshold = threshold;
                this.enabled = true;
                this.levels = levels;

                this.brightShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        inputTexture: { value: null },
                        bloomThreshold: { value: this.threshold },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postBrightFragmentShader,
                    glslVersion: THREE.GLSL3,
                });
                this.brightPass = new PostShaderPass(this.brightShader, {
                    format: THREE.RGBAFormat,
                    type: THREE.HalfFloatType,
                });

                this.blurShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        inputTexture: { value: null },
                        direction: { value: new THREE.Vector2(0, 1) },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postBlurFragmentShader,
                    glslVersion: THREE.GLSL3,
                });

                this.blurPasses = [];
                for (let i = 0; i < this.levels; i++) {
                    this.blurPasses.push(new PostShaderPingPongPass(this.blurShader, {
                        format: THREE.RGBAFormat,
                        type: THREE.HalfFloatType,
                    }));
                }
            }

            setSize(w, h) {
                let tw = Math.max(1, w);
                let th = Math.max(1, h);
                this.brightPass.setSize(tw, th);
                for (let i = 0; i < this.levels; i++) {
                    tw = Math.max(1, Math.round(tw / 2));
                    th = Math.max(1, Math.round(th / 2));
                    this.blurPasses[i].setSize(tw, th);
                }
            }

            set source(texture) {
                this.brightShader.uniforms.inputTexture.value = texture;
            }

            render(renderer) {
                if (!this.enabled || this.strength <= 0.001) return;

                this.brightShader.uniforms.bloomThreshold.value = this.threshold;
                this.brightPass.render(renderer);

                const baseOffset = Math.max(0.1, this.radius * 2.0);
                const u = this.blurShader.uniforms;

                for (let j = 0; j < this.levels; j++) {
                    const blurPass = this.blurPasses[j];
                    const stepOffset = baseOffset * (1.0 + j * 0.5);

                    u.direction.value.set(stepOffset, 0);
                    u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
                    blurPass.render(renderer);

                    u.direction.value.set(0, stepOffset * 0.5);
                    u.inputTexture.value = blurPass.current.texture;
                    blurPass.render(renderer);
                }
            }
        }

        class PostProcessor {
            constructor(renderer, params = {}) {
                this.renderer = renderer;

                this.settings = {
                    enabled: params.enabled !== undefined ? params.enabled : true,
                    bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
                    bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.75,
                    bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
                    bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,
                    fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
                    fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
                    chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.02,
                    vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
                    vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.35,
                    noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.0,
                    gamma: params.gamma !== undefined ? params.gamma : 1.0,
                    minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
                    maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
                };

                this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

                this.bloomPass = new PostBloomPass(
                    this.settings.bloomStrength,
                    this.settings.bloomRadius,
                    this.settings.bloomThreshold,
                    5
                );

                this.finalShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        resolution: { value: new THREE.Vector2(1, 1) },
                        bloomEnabled: { value: this.settings.bloomEnabled },
                        bloomStrength: { value: this.settings.bloomStrength },
                        vignetteBoost: { value: this.settings.vignetteBoost },
                        vignetteReduction: { value: this.settings.vignetteReduction },
                        noiseIntensity: { value: this.settings.noiseIntensity },
                        inputTexture: { value: null },
                        blur0Texture: { value: null },
                        blur1Texture: { value: null },
                        blur2Texture: { value: null },
                        blur3Texture: { value: null },
                        blur4Texture: { value: null },
                        time: { value: 0 },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postFinalFragmentShader,
                    glslVersion: THREE.GLSL3,
                });
                this.finalPass = new PostShaderPass(this.finalShader);

                this.rgbShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        inputTexture: { value: this.finalPass.texture },
                        fisheyeStrength: { value: this.settings.fisheyeStrength },
                        fisheyeRadius: { value: this.settings.fisheyeRadius },
                        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                        minInputLevel: { value: this.settings.minInputLevel },
                        maxInputLevel: { value: this.settings.maxInputLevel },
                        gammaLevel: { value: this.settings.gamma },
                        time: { value: 0 },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postColorFragmentShader,
                    glslVersion: THREE.GLSL3,
                });
                this.rgbPass = new PostShaderPass(this.rgbShader);

                this.copyShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        inputTexture: { value: null },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postCopyFragmentShader,
                    glslVersion: THREE.GLSL3,
                });
                this.copyPass = new PostShaderPass(this.copyShader);
            }

            updateSettings() {
                this.bloomPass.enabled = this.settings.bloomEnabled;
                this.bloomPass.strength = this.settings.bloomStrength;
                this.bloomPass.radius = this.settings.bloomRadius;
                this.bloomPass.threshold = this.settings.bloomThreshold;

                this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
                this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
                this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
                this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
                this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

                this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
                this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
                this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
                this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
                this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
                this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
            }

            setSize(w0, h0, dpr = 1) {
                const w = Math.max(1, Math.floor(w0 * dpr));
                const h = Math.max(1, Math.floor(h0 * dpr));
                this.sceneTarget.setSize(w, h);
                this.finalPass.setSize(w, h);
                this.finalShader.uniforms.resolution.value.set(w, h);
                this.bloomPass.setSize(w, h);
                this.rgbPass.setSize(w, h);
                this.copyPass.setSize(w, h);
            }

            renderScene(scene, camera) {
                if (!this.settings.enabled) {
                    this.renderer.render(scene, camera);
                    return;
                }
                this.renderer.setRenderTarget(this.sceneTarget);
                this.renderer.render(scene, camera);
                this.renderer.setRenderTarget(null);
                this.render(this.sceneTarget.texture);
            }

            render(sourceTexture) {
                if (!this.settings.enabled) {
                    this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
                    this.copyPass.render(this.renderer, true);
                    return;
                }

                this.updateSettings();

                this.bloomPass.source = sourceTexture;
                this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
                this.bloomPass.render(this.renderer);

                this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
                this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
                this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
                this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
                this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

                const randomTime = Math.random() * 100000;
                this.finalPass.shader.uniforms.time.value = randomTime;
                this.rgbPass.shader.uniforms.time.value = randomTime;

                this.finalPass.render(this.renderer);
                this.rgbPass.render(this.renderer, true);
            }

            attachGUI(gui, title = "Post-Processing Suite") {
                const root = gui.addFolder(title);
                root.add(this.settings, "enabled").name("Enable Suite");

                const bloom = root.addFolder("Bloom");
                bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
                bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
                bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
                bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

                const lens = root.addFolder("Lens, Optics & Fisheye");
                lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
                lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
                lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
                lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
                lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
                lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
                lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
                lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
                lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

                return root;
            }
        }

        // --- 10 Preconfigured Color Schemes ---
        const colorSchemes = {
            'Monochromatic': {
                base: '#021626',
                accent: '#00b4d8',
                spark: '#90e0ef',
                shaft: '#0077b6',
                phaseR: 3.7,
                phaseG: 1.5,
                phaseB: 1.0
            },
            'Analogous': {
                base: '#032535',
                accent: '#06d6a0',
                spark: '#118ab2',
                shaft: '#48cae4',
                phaseR: 1.2,
                phaseG: 4.5,
                phaseB: 3.1
            },
            'Complementary': {
                base: '#051923',
                accent: '#ff6b35',
                spark: '#00f5d4',
                shaft: '#f77f00',
                phaseR: 5.2,
                phaseG: 2.0,
                phaseB: 1.1
            },
            'Split-complementary': {

                accent: '#ff007f',
                spark: '#00f5d4',
                shaft: '#ffbe0b',
                phaseR: 2.8,
                phaseG: 6.1,
                phaseB: 4.4
            },
            'Triadic': {
                base: '#10002b',
                accent: '#7209b7',
                spark: '#00f5d4',
                shaft: '#ff0054',
                phaseR: 6.0,
                phaseG: 1.2,
                phaseB: 4.8
            },
            'Tetradic': {
                base: '#081c24',
                accent: '#ff0055',
                spark: '#00f0ff',
                shaft: '#ffe600',
                phaseR: 1.8,
                phaseG: 3.9,
                phaseB: 5.5
            },
            'Double split-complementary': {
                base: '#04151f',
                accent: '#d90429',
                spark: '#2ec4b6',
                shaft: '#ff9f1c',
                phaseR: 4.5,
                phaseG: 0.8,
                phaseB: 2.7
            },
            'Achromatic (Black & White)': {
                base: '#050505',
                accent: '#444444',
                spark: '#ffffff',
                shaft: '#999999',
                phaseR: 0.0,
                phaseG: 0.0,
                phaseB: 0.0
            },
            'Achromatic (White & Black)': {
                base: '#ffffff',
                accent: '#cccccc',
                spark: '#222222',
                shaft: '#777777',
                phaseR: 3.14,
                phaseG: 3.14,
                phaseB: 3.14
            },
            'Neutral + accent': {
                base: '#1a202c',
                accent: '#00f5d4',
                spark: '#ff3366',
                shaft: '#718096',
                phaseR: 2.1,
                phaseG: 5.3,
                phaseB: 1.8
            }
        };

        // --- 8 Preconfigured Smooth Animations ---
        const animationPresets = {
            'Static Descent (Freeze Camera)': (t, spd) => ({
                rotX: 0,
                rotY: 0,
                panX: 0,
                panY: 0,
                zoomOffset: 0

            }),

            }),
            'ROV Submersible Scan': (t, spd) => ({
                rotX: Math.sin(t * 0.35 * spd) * 0.45,
                rotY: Math.sin(t * 0.18 * spd) * 0.28,
                panX: Math.cos(t * 0.2 * spd) * 0.12,
                panY: Math.sin(t * 0.3 * spd) * 0.08,

            }),
            'Bioluminescent Respiration': (t, spd) => ({

                rotY: Math.cos(t * 0.12 * spd) * 0.12,
                panX: 0,
                panY: 0,
                zoomOffset: Math.sin(t * 0.35 * spd) * 0.2
            }),
            'Figure-8 Abyssal Search': (t, spd) => ({
                rotX: Math.sin(t * 0.3 * spd) * 0.35,
                rotY: Math.sin(t * 0.6 * spd) * 0.2,
                panX: Math.cos(t * 0.3 * spd) * 0.2,
                panY: Math.sin(t * 0.6 * spd) * 0.1,
                zoomOffset: 0
            }),
            'Deep Pelagic Float': (t, spd) => ({
                rotX: Math.sin(t * 0.15 * spd) * 0.2,
                rotY: Math.cos(t * 0.22 * spd) * 0.2,
                panX: Math.sin(t * 0.2 * spd) * 0.15,
                panY: Math.cos(t * 0.18 * spd) * 0.12,

            }),
            'Cinematic Trench Dive': (t, spd) => ({
                rotX: Math.sin(t * 0.28 * spd) * 0.4,
                rotY: -0.15 + Math.cos(t * 0.22 * spd) * 0.2,
                panX: Math.sin(t * 0.28 * spd) * 0.22,
                panY: 0,
                zoomOffset: Math.sin(t * 0.2 * spd) * 0.12
            })
        };

        // --- Application State & Parameters ---
        const initialScheme = colorSchemes['Monochromatic'];
        const params = {
            dpr: 1.0,
            animationSpeed: 1.0,
            animationPreset: 'Gentle Ocean Current',
            colorScheme: 'Monochromatic',
            greenScreen: false,
            greenThreshold: 0.035,
            clickToRandomize: true,

            // Noise & Grain controls (Disabled by default for clean, smooth rendering)
            ditherStrength: 0.0,
            rayJitter: 0.0,

            // Trench & SDF parameters
            speed: 1.8,
            trenchRadius: 1.4,
            trenchWarp: 1.0,
            fogStepSize: 1.85,
            noiseFreq: 1.4,
            noiseAmp: 0.45,

            // Bioluminescent sparks
            sparkFreq: 2.8,
            sparkIntensity: 1.5,
            sparkSpeed: 1.2,

            // Henyey-Greenstein Light Shafts
            hgPhaseG: 0.72,
            lightShaftIntensity: 1.4,
            lightAngle: 0.78,

            // Colors
            colorBase: initialScheme.base,
            colorAccent: initialScheme.accent,
            colorSpark: initialScheme.spark,
            colorShaft: initialScheme.shaft,
            phaseR: initialScheme.phaseR,
            phaseG: initialScheme.phaseG,
            phaseB: initialScheme.phaseB,

            // Navigation & Camera
            zoom: 1.0,
            panX: 0.0,
            panY: 0.0,
            resetView: () => {
                targetRotation.x = 0;
                targetRotation.y = 0;
                targetPan.x = 0;
                targetPan.y = 0;
                targetZoom = 1.0;
                params.zoom = 1.0;
                params.panX = 0;
                params.panY = 0;
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        };

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(params.dpr);
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        // --- Initialize PostProcessor Suite ---
        const postProcessor = new PostProcessor(renderer, { noiseIntensity: 0.0 });

        // --- Shader Material ---
        const geometry = new THREE.PlaneGeometry(2, 2);

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float iTime;
            uniform vec2 iResolution;

            // Navigation & Interaction
            uniform vec2 uMouseRot;
            uniform vec2 uPan;
            uniform float uZoom;

            // Noise & Dither Controls
            uniform float uDitherStrength;
            uniform float uRayJitter;

            // Trench Cave Wall SDF
            uniform float uSpeed;
            uniform float uTrenchRadius;
            uniform float uTrenchWarp;
            uniform float uFogStepSize;
            uniform float uNoiseFreq;
            uniform float uNoiseAmp;

            // Bioluminescent Sparks
            uniform float uSparkFreq;
            uniform float uSparkIntensity;
            uniform float uSparkSpeed;

            // Light Shafts
            uniform float uHGPhaseG;
            uniform float uLightShaftIntensity;
            uniform float uLightAngle;

            // Colors
            uniform vec3 uColorBase;
            uniform vec3 uColorAccent;
            uniform vec3 uColorSpark;
            uniform vec3 uColorShaft;
            uniform vec3 uColorPhase;

            // Green Screen
            uniform bool uGreenScreen;
            uniform float uGreenThreshold;

            // Hash without Sine - perfectly random, no diagonal lines or precision issues
            float hash12(vec2 p) {
                vec3 p3  = fract(vec3(p.xyx) * .1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            float hash(float n) {
                return fract(sin(n) * 43758.5453123);
            }

            vec2 rotate(vec2 v, float t) {
                float s = sin(t), c = cos(t);
                return mat2(c, -s, s, c) * v;
            }

            // Cinematic tone mapping
            vec3 toneMap(vec3 c) {
                mat3 m1 = mat3(0.59719, 0.17600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
                mat3 m2 = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
                vec3 v = m1 * c;
                vec3 a = v * (v + -0.3254214) - 0.000090537;
                vec3 b = v * (0.973729 * v + 0.3429510) + 0.018081;
                return m2 * (a / b);
            }

            // Classic 3D Value Noise for organic cave wall textures
            float valueNoise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);

                float n = p.x + p.y * 157.0 + 113.0 * p.z;

                return mix(
                    mix(mix(hash(n +   0.0), hash(n +   1.0), f.x),
                        mix(hash(n + 157.0), hash(n + 158.0), f.x), f.y),
                    mix(mix(hash(n + 113.0), hash(n + 114.0), f.x),
                        mix(hash(n + 270.0), hash(n + 271.0), f.x), f.y),
                    f.z
                );
            }

            // Winding Trench Center Path as a function of depth (Y)
            vec2 getTrenchPath(float y) {
                return vec2(
                    sin(y * 0.12) * 2.2 + sin(y * 0.05 + 1.2) * 2.6,
                    cos(y * 0.09) * 1.8 + cos(y * 0.035 + 2.1) * 2.2
                ) * uTrenchWarp;
            }

            // FBM (Fractal Brownian Motion) for craggy cave walls
            float fbmCaveWall(vec3 p) {
                float value = 0.0;
                float amplitude = uNoiseAmp;
                vec3 q = p * uNoiseFreq;

                for (int i = 0; i < 4; i++) {
                    value += amplitude * (valueNoise(q) * 2.0 - 1.0);
                    q *= 2.05;
                    amplitude *= 0.52;
                }
                return value;
            }

            // Cheap Henyey-Greenstein-style phase approximation
            float henyeyGreenstein(float cosTheta, float g) {
                float g2 = g * g;
                return (1.0 - g2) / (4.0 * 3.14159265 * pow(max(1.0 + g2 - 2.0 * g * cosTheta, 0.001), 1.5));
            }

            // Sparser noise octave for bioluminescent particles & pulse bursts
            float sparkNoise(vec3 p, float time) {
                vec3 sp = p * uSparkFreq;
                sp.y += time * uSparkSpeed * 0.4;
                float n1 = valueNoise(sp);
                float n2 = valueNoise(sp * 2.2 + vec3(5.3, 1.7, 8.1));
                float combined = n1 * 0.65 + n2 * 0.35;
                
                // Sparse trigger for glowing particles
                float spark = smoothstep(0.70, 0.96, combined);
                
                // Subtle shimmer pulsing
                float pulse = 0.6 + 0.4 * sin(time * 3.5 + dot(p, vec3(13.7, 29.1, 47.3)));
                return spark * pulse;
            }

            void main() {
                vec2 fragCoord = gl_FragCoord.xy;
                float time = iTime;

                // Aspect-corrected UV with Zoom and Pan
                vec2 uv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;
                uv = (uv - uPan) / max(uZoom, 0.05);

                // Flip Gravity: Camera continuously descends down the trench (along -Y)
                float currentDepth = -time * uSpeed * 2.0;
                vec2 currentCenter = getTrenchPath(currentDepth);
                vec3 camPos = vec3(currentCenter.x, currentDepth, currentCenter.y);

                // Aim camera downwards following the trench curve ahead
                float lookAheadDepth = currentDepth - 3.2;
                vec2 lookTargetCenter = getTrenchPath(lookAheadDepth);
                vec3 lookTarget = vec3(lookTargetCenter.x, lookAheadDepth, lookTargetCenter.y);

                vec3 forward = normalize(lookTarget - camPos);
                vec3 worldUp = vec3(0.0, 0.0, 1.0);
                vec3 right = normalize(cross(forward, worldUp));
                vec3 up = cross(right, forward);

                // Generate ray direction
                vec3 rayDir = normalize(forward + right * uv.x + up * uv.y);

                // Apply interactive Pitch & Yaw rotation
                rayDir.xz = rotate(rayDir.xz, uMouseRot.x);
                rayDir.yz = rotate(rayDir.yz, uMouseRot.y);

                // Ray jittering dither (controlled via GUI slider)
                float dither = hash12(fragCoord);
                vec3 rayPos = camPos + rayDir * (dither * uRayJitter);

                // Horizontal light shaft source direction
                vec3 lightDir = normalize(vec3(cos(uLightAngle), -0.12, sin(uLightAngle)));
                float cosTheta = dot(rayDir, lightDir);
                float hgPhase = henyeyGreenstein(cosTheta, uHGPhaseG);

                vec3 accumulatedLight = vec3(0.0);

                // Volumetric marching loop through the canyon
                for (float i = 0.0; i < 54.0; i += 1.0) {
                    // Center of the trench at current ray depth
                    vec2 tCenter = getTrenchPath(rayPos.y);
                    vec2 offset = rayPos.xz - tCenter;
                    float distToCenter = length(offset);

                    // Cave wall SDF: noisy tube radius
                    float wallNoise = fbmCaveWall(rayPos);
                    float tubeRadius = uTrenchRadius + wallNoise;

                    // Distance to the cave wall surface
                    float sDist = tubeRadius - distToCenter;
                    float dist = abs(sDist);

                    // Soft bounding to prevent stepping stalls
                    dist = max(dist, 0.22);

                    // Step the ray forward
                    rayPos += rayDir * dist * uFogStepSize;

                    // Proximity to rocky canyon wall
                    float wallProx = smoothstep(1.7, 0.0, dist);

                    // 1. Base trench wall color accumulation with harmonic depth wave
                    vec3 colorWave = 0.5 + 0.5 * sin(i * 0.12 + rayPos.y * 0.08 + uColorPhase);
                    vec3 baseTone = mix(uColorBase, uColorAccent, colorWave.r);

                    // 2. Bioluminescent sparks / plankton pulses keyed to second sparser noise octave
                    float spark = sparkNoise(rayPos, time);
                    vec3 sparkCol = mix(uColorSpark, uColorAccent, spark * 0.45) * (spark * uSparkIntensity * 12.5);

                    // 3. Faint horizontal light shafts using Henyey-Greenstein phase approximation
                    float shaftBeams = pow(clamp(sin(rayPos.y * 0.45 + rayPos.x * 0.3) * sin(rayPos.z * 0.35 + 1.1) * 0.5 + 0.5, 0.0, 1.0), 3.0);
                    vec3 shaftCol = uColorShaft * (hgPhase * shaftBeams * uLightShaftIntensity);

                    // Accumulate volumetric lighting
                    vec3 sliceColor = (baseTone * (0.35 + wallProx * 1.9) + sparkCol + shaftCol) / (dist * dist * 0.85 + 0.28);
                    accumulatedLight += sliceColor;
                }

                // Balance iteration density and exposure
                vec3 finalColor = (accumulatedLight * accumulatedLight) / 2900.0;

                // Color dithering / film grain (only added when enabled in GUI)
                if (uDitherStrength > 0.0001) {
                    finalColor += (dither - 0.5) * uDitherStrength;
                }

                // Tone mapping
                vec3 mappedColor = toneMap(finalColor);

                // Green screen support
                if (uGreenScreen) {
                    float brightness = max(max(mappedColor.r, mappedColor.g), mappedColor.b);
                    mappedColor = mix(vec3(0.0, 1.0, 0.0), mappedColor, smoothstep(uGreenThreshold, uGreenThreshold + 0.08, brightness));
                }

                gl_FragColor = vec4(mappedColor, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },
                uMouseRot: { value: new THREE.Vector2(0, 0) },
                uPan: { value: new THREE.Vector2(0, 0) },
                uZoom: { value: params.zoom },
                uDitherStrength: { value: params.ditherStrength },
                uRayJitter: { value: params.rayJitter },
                uSpeed: { value: params.speed },
                uTrenchRadius: { value: params.trenchRadius },
                uTrenchWarp: { value: params.trenchWarp },
                uFogStepSize: { value: params.fogStepSize },
                uNoiseFreq: { value: params.noiseFreq },
                uNoiseAmp: { value: params.noiseAmp },
                uSparkFreq: { value: params.sparkFreq },
                uSparkIntensity: { value: params.sparkIntensity },
                uSparkSpeed: { value: params.sparkSpeed },
                uHGPhaseG: { value: params.hgPhaseG },
                uLightShaftIntensity: { value: params.lightShaftIntensity },
                uLightAngle: { value: params.lightAngle },
                uColorBase: { value: new THREE.Color(params.colorBase) },
                uColorAccent: { value: new THREE.Color(params.colorAccent) },
                uColorSpark: { value: new THREE.Color(params.colorSpark) },
                uColorShaft: { value: new THREE.Color(params.colorShaft) },
                uColorPhase: { value: new THREE.Vector3(params.phaseR, params.phaseG, params.phaseB) },
                uGreenScreen: { value: params.greenScreen },
                uGreenThreshold: { value: params.greenThreshold }
            }
        });

        const quad = new THREE.Mesh(geometry, material);
        scene.add(quad);

        // --- Color Scheme Application Helper ---
        function applyColorScheme(schemeName) {
            const scheme = colorSchemes[schemeName];
            if (!scheme) return;
            params.colorBase = scheme.base;
            params.colorAccent = scheme.accent;
            params.colorSpark = scheme.spark;
            params.colorShaft = scheme.shaft;
            params.phaseR = scheme.phaseR;
            params.phaseG = scheme.phaseG;
            params.phaseB = scheme.phaseB;

            material.uniforms.uColorBase.value.set(params.colorBase);
            material.uniforms.uColorAccent.value.set(params.colorAccent);
            material.uniforms.uColorSpark.value.set(params.colorSpark);
            material.uniforms.uColorShaft.value.set(params.colorShaft);
            material.uniforms.uColorPhase.value.set(params.phaseR, params.phaseG, params.phaseB);

            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        // --- Green Screen Helper ---
        function setGreenScreen(enabled) {
            params.greenScreen = enabled;
            document.body.classList.toggle('greenscreen', enabled);
            renderer.setClearColor(enabled ? 0x00ff00 : 0x000000, 1);
            material.uniforms.uGreenScreen.value = enabled;
        }

        // --- Procedural Randomization on Scene Click ---
        function randomizeScene() {
            const schemeKeys = Object.keys(colorSchemes);
            params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(params.colorScheme);

            const animKeys = Object.keys(animationPresets);
            params.animationPreset = animKeys[Math.floor(Math.random() * animKeys.length)];

            params.speed = Number((0.8 + Math.random() * 2.2).toFixed(2));
            params.trenchRadius = Number((0.9 + Math.random() * 1.2).toFixed(2));
            params.trenchWarp = Number((0.5 + Math.random() * 1.0).toFixed(2));
            params.fogStepSize = Number((1.2 + Math.random() * 1.2).toFixed(2));
            params.noiseFreq = Number((0.8 + Math.random() * 1.4).toFixed(2));
            params.noiseAmp = Number((0.25 + Math.random() * 0.45).toFixed(2));

            params.sparkFreq = Number((1.8 + Math.random() * 2.5).toFixed(2));
            params.sparkIntensity = Number((0.8 + Math.random() * 1.8).toFixed(2));
            params.sparkSpeed = Number((0.6 + Math.random() * 1.5).toFixed(2));

            params.hgPhaseG = Number((0.5 + Math.random() * 0.35).toFixed(2));
            params.lightShaftIntensity = Number((0.6 + Math.random() * 1.6).toFixed(2));
            params.lightAngle = Number((Math.random() * Math.PI * 2).toFixed(2));

            material.uniforms.uSpeed.value = params.speed;
            material.uniforms.uTrenchRadius.value = params.trenchRadius;
            material.uniforms.uTrenchWarp.value = params.trenchWarp;
            material.uniforms.uFogStepSize.value = params.fogStepSize;
            material.uniforms.uNoiseFreq.value = params.noiseFreq;
            material.uniforms.uNoiseAmp.value = params.noiseAmp;
            material.uniforms.uSparkFreq.value = params.sparkFreq;
            material.uniforms.uSparkIntensity.value = params.sparkIntensity;
            material.uniforms.uSparkSpeed.value = params.sparkSpeed;
            material.uniforms.uHGPhaseG.value = params.hgPhaseG;
            material.uniforms.uLightShaftIntensity.value = params.lightShaftIntensity;
            material.uniforms.uLightAngle.value = params.lightAngle;

            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        // --- Interaction & Motion State ---
        let isPointerDown = false;
        let isRightOrShiftDragging = false;
        let pointerStart = { x: 0, y: 0 };
        let previousPointerPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        let targetRotation = { x: 0, y: 0 };
        let targetPan = { x: 0, y: 0 };
        let targetZoom = 1.0;

        const rotationSensitivity = 0.005;
        const panSensitivity = 0.002;

        // --- Mouse & Touch Event Listeners ---
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.lil-gui')) return;
            isPointerDown = true;
            isRightOrShiftDragging = (e.button === 2 || e.button === 1 || e.shiftKey);
            pointerStart = { x: e.clientX, y: e.clientY };
            previousPointerPos = { x: e.clientX, y: e.clientY };
            pointerDownTime = performance.now();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPointerDown) return;
            const deltaX = e.clientX - previousPointerPos.x;
            const deltaY = e.clientY - previousPointerPos.y;

            if (isRightOrShiftDragging) {
                targetPan.x += deltaX * panSensitivity * (1.0 / params.zoom);
                targetPan.y -= deltaY * panSensitivity * (1.0 / params.zoom);
                params.panX = targetPan.x;
                params.panY = targetPan.y;
            } else {
                targetRotation.x -= deltaX * rotationSensitivity;
                targetRotation.y += deltaY * rotationSensitivity;
            }

            previousPointerPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if (!isPointerDown) return;
            isPointerDown = false;

            const dragDistance = Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y);
            const clickDuration = performance.now() - pointerDownTime;

            if (dragDistance < 6 && clickDuration < 350 && e.button === 0 && !e.shiftKey) {
                if (params.clickToRandomize) {
                    randomizeScene();
                }
            }
        });

        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.lil-gui')) return;
            e.preventDefault();
            const zoomDelta = -e.deltaY * 0.0015;
            params.zoom = THREE.MathUtils.clamp(params.zoom + zoomDelta, 0.25, 4.0);
            targetZoom = params.zoom;
            gui.controllersRecursive().forEach(c => {
                if (c.property === 'zoom') c.updateDisplay();
            });
        }, { passive: false });

        // Touch Interaction
        let initialPinchDistance = null;
        let initialZoom = 1.0;

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('.lil-gui')) return;
            if (e.touches.length === 1) {
                isPointerDown = true;
                isRightOrShiftDragging = false;
                pointerStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                previousPointerPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                pointerDownTime = performance.now();
            } else if (e.touches.length === 2) {
                isPointerDown = false;
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialZoom = params.zoom;
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.target.closest('.lil-gui')) return;
            if (e.touches.length === 1 && isPointerDown) {
                const deltaX = e.touches[0].clientX - previousPointerPos.x;
                const deltaY = e.touches[0].clientY - previousPointerPos.y;
                targetRotation.x -= deltaX * rotationSensitivity;
                targetRotation.y += deltaY * rotationSensitivity;
                previousPointerPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = currentDist / initialPinchDistance;
                params.zoom = THREE.MathUtils.clamp(initialZoom * zoomFactor, 0.25, 4.0);
                targetZoom = params.zoom;
                gui.controllersRecursive().forEach(c => {
                    if (c.property === 'zoom') c.updateDisplay();
                });
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (isPointerDown && e.changedTouches.length > 0) {
                isPointerDown = false;
                const touch = e.changedTouches[0];
                const dragDistance = Math.hypot(touch.clientX - pointerStart.x, touch.clientY - pointerStart.y);
                const clickDuration = performance.now() - pointerDownTime;
                if (dragDistance < 8 && clickDuration < 350 && params.clickToRandomize) {
                    randomizeScene();
                }
            }
            initialPinchDistance = null;
        });

        // Hide/Show UI with "H" key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui.show(gui._hidden);
            }
        });

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            postProcessor.setSize(w, h, params.dpr);
            const dpr = renderer.getPixelRatio();
            material.uniforms.iResolution.value.set(w * dpr, h * dpr);
        });

        // --- GUI Setup ---
        const gui = new GUI({ title: 'Trench Settings' });

        // Display & General
        const fDisplay = gui.addFolder('Display & Render');
        fDisplay.add(params, 'dpr', 0.25, 2.5, 0.05).name('Pixel Ratio (DPR)').onChange(val => {
            renderer.setPixelRatio(val);
            postProcessor.setSize(window.innerWidth, window.innerHeight, val);
            const w = window.innerWidth;
            const h = window.innerHeight;
            material.uniforms.iResolution.value.set(w * val, h * val);
        });
        fDisplay.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(setGreenScreen);
        fDisplay.add(params, 'greenThreshold', 0.0, 0.25, 0.001).name('Green Threshold').onChange(v => {
            material.uniforms.uGreenThreshold.value = v;
        });
        fDisplay.add(params, 'clickToRandomize').name('Click to Randomize');

        // Noise & Grain Settings
        const fNoise = gui.addFolder('Noise & Grain Controls');
        fNoise.add(params, 'ditherStrength', 0.0, 0.05, 0.001).name('Film Grain / Dither').onChange(v => {
            material.uniforms.uDitherStrength.value = v;
        });
        fNoise.add(params, 'rayJitter', 0.0, 0.5, 0.01).name('Ray Step Jitter').onChange(v => {
            material.uniforms.uRayJitter.value = v;
        });

        // Animation Controls
        const fAnim = gui.addFolder('Animation');
        fAnim.add(params, 'animationPreset', Object.keys(animationPresets)).name('Motion Preset');
        fAnim.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
        fAnim.add(params, 'speed', 0.0, 6.0, 0.1).name('Descent Speed').onChange(v => material.uniforms.uSpeed.value = v);

        // Trench Canyon SDF & Wall Noise
        const fTrench = gui.addFolder('Trench & Cave Walls');
        fTrench.add(params, 'trenchRadius', 0.5, 3.5, 0.05).name('Trench Width').onChange(v => material.uniforms.uTrenchRadius.value = v);
        fTrench.add(params, 'trenchWarp', 0.0, 3.0, 0.05).name('Canyon Winding').onChange(v => material.uniforms.uTrenchWarp.value = v);
        fTrench.add(params, 'fogStepSize', 0.5, 4.0, 0.05).name('Step Size / Density').onChange(v => material.uniforms.uFogStepSize.value = v);
        fTrench.add(params, 'noiseFreq', 0.2, 4.0, 0.05).name('Wall Roughness Freq').onChange(v => material.uniforms.uNoiseFreq.value = v);
        fTrench.add(params, 'noiseAmp', 0.0, 1.2, 0.02).name('Wall Roughness Amp').onChange(v => material.uniforms.uNoiseAmp.value = v);

        // Bioluminescent Sparks
        const fSparks = gui.addFolder('Bioluminescent Sparks');
        fSparks.add(params, 'sparkFreq', 0.5, 6.0, 0.1).name('Spark Density').onChange(v => material.uniforms.uSparkFreq.value = v);
        fSparks.add(params, 'sparkIntensity', 0.0, 4.0, 0.05).name('Spark Pulse Glow').onChange(v => material.uniforms.uSparkIntensity.value = v);
        fSparks.add(params, 'sparkSpeed', 0.0, 4.0, 0.1).name('Spark Shimmer Speed').onChange(v => material.uniforms.uSparkSpeed.value = v);

        // Henyey-Greenstein Light Shafts
        const fShafts = gui.addFolder('Horizontal Light Shafts');
        fShafts.add(params, 'lightShaftIntensity', 0.0, 4.0, 0.05).name('Shaft Intensity').onChange(v => material.uniforms.uLightShaftIntensity.value = v);
        fShafts.add(params, 'hgPhaseG', 0.1, 0.95, 0.01).name('Henyey-Greenstein g').onChange(v => material.uniforms.uHGPhaseG.value = v);
        fShafts.add(params, 'lightAngle', 0.0, Math.PI * 2, 0.05).name('Shaft Angle').onChange(v => material.uniforms.uLightAngle.value = v);

        // Color Harmonization (10 Preconfigured Palettes)
        const fColors = gui.addFolder('Color Harmonization');
        fColors.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange(applyColorScheme);
        fColors.addColor(params, 'colorBase').name('Trench Base Color').onChange(v => material.uniforms.uColorBase.value.set(v));
        fColors.addColor(params, 'colorAccent').name('Biolum Accent Color').onChange(v => material.uniforms.uColorAccent.value.set(v));
        fColors.addColor(params, 'colorSpark').name('Spark Pulse Color').onChange(v => material.uniforms.uColorSpark.value.set(v));
        fColors.addColor(params, 'colorShaft').name('Light Shaft Color').onChange(v => material.uniforms.uColorShaft.value.set(v));
        fColors.add(params, 'phaseR', 0.0, 10.0, 0.1).name('Color Phase R').onChange(v => material.uniforms.uColorPhase.value.x = v);
        fColors.add(params, 'phaseG', 0.0, 10.0, 0.1).name('Color Phase G').onChange(v => material.uniforms.uColorPhase.value.y = v);
        fColors.add(params, 'phaseB', 0.0, 10.0, 0.1).name('Color Phase B').onChange(v => material.uniforms.uColorPhase.value.z = v);

        // Navigation & Camera
        const fNav = gui.addFolder('Navigation & Camera');
        fNav.add(params, 'zoom', 0.25, 4.0, 0.05).name('Zoom (Wheel)').onChange(v => targetZoom = v);
        fNav.add(params, 'panX', -2.0, 2.0, 0.02).name('Pan X (Right Drag)').onChange(v => targetPan.x = v);
        fNav.add(params, 'panY', -2.0, 2.0, 0.02).name('Pan Y (Right Drag)').onChange(v => targetPan.y = v);
        fNav.add(params, 'resetView').name('Reset View');

        // Post-Processing Suite Controls
        postProcessor.attachGUI(gui, 'Post-Processing Suite');

        // Initial setup
        renderer.setPixelRatio(params.dpr);
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        setGreenScreen(params.greenScreen);

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const currentSpeed = params.animationSpeed;

            // Calculate active procedural animation offset
            const animFunc = animationPresets[params.animationPreset] || animationPresets['Gentle Ocean Current'];
            const animOffset = animFunc(elapsedTime, currentSpeed);

            // Smooth damping for mouse rotation and pan
            material.uniforms.uMouseRot.value.x += (targetRotation.x + animOffset.rotX - material.uniforms.uMouseRot.value.x) * 0.08;
            material.uniforms.uMouseRot.value.y += (targetRotation.y + animOffset.rotY - material.uniforms.uMouseRot.value.y) * 0.08;
            material.uniforms.uPan.value.x += (targetPan.x + animOffset.panX - material.uniforms.uPan.value.x) * 0.08;
            material.uniforms.uPan.value.y += (targetPan.y + animOffset.panY - material.uniforms.uPan.value.y) * 0.08;

            const effectiveTargetZoom = Math.max(0.2, targetZoom + animOffset.zoomOffset);
            material.uniforms.uZoom.value += (effectiveTargetZoom - material.uniforms.uZoom.value) * 0.08;

            material.uniforms.iTime.value = elapsedTime * currentSpeed;

            // Render through PostProcessor pipeline
            postProcessor.renderScene(scene, camera);
        }

        animate();
    </script>
</body>
</html>
