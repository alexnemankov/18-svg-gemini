<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>448</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222222;
        }
        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .rect {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #FFFFFF;
            mix-blend-mode: difference;
            pointer-events: none;
            animation: fadeIn 10s ease-in-out infinite alternate;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            45% {
                opacity: 0;
            }
            55% {
                opacity: 1;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
    <script src="https://dl.dropbox.com/s/3b4vvy3jq3cvqap/three.min.js?dl=0"></script>
</head>
<body>
    <div id="container"></div>
    <div class="rect" id="diffOverlay"></div>

    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;

        void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPos = worldPos.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
    </script>

    <script id="fragment_shader4" type="x-shader/x-fragment">
        uniform float time;
        uniform int isOriginal;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        uniform vec3 uColor4;
        uniform vec3 uColor5;
        uniform float waveFreq;

        uniform float exposure;
        uniform float masterLightIntensity;
        uniform vec3 ambientColor;
        uniform float ambientIntensity;
        uniform vec3 dir1Color;
        uniform float dir1Intensity;
        uniform vec3 dir1Dir;
        uniform vec3 dir2Color;
        uniform float dir2Intensity;
        uniform vec3 dir2Dir;
        uniform vec3 pointColor;
        uniform float pointIntensity;
        uniform vec3 pointPos;

        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;

        void main( void ) {
            vec2 position = 3.0 * vUv * waveFreq;
            float red   = abs( sin( position.x * position.y + time / 5.0 ) );
            float green = abs( sin( position.x * position.y + time / 4.0 ) );
            float blue  = abs( sin( position.x * position.y + time / 3.0 ) );

            vec3 baseCol;
            if ( isOriginal == 1 ) {
                baseCol = vec3( red, green, blue );
            } else {
                float t = clamp((red * 0.45 + green * 0.35 + blue * 0.2), 0.0, 1.0);
                if (t < 0.25) {
                    baseCol = mix(uColor1, uColor2, t / 0.25);
                } else if (t < 0.5) {
                    baseCol = mix(uColor2, uColor3, (t - 0.25) / 0.25);
                } else if (t < 0.75) {
                    baseCol = mix(uColor3, uColor4, (t - 0.5) / 0.25);
                } else {
                    baseCol = mix(uColor4, uColor5, (t - 0.75) / 0.25);
                }
                baseCol = mix(baseCol, uColor1, red * 0.12);
                baseCol = mix(baseCol, uColor5, blue * 0.08);
            }

            // Normal-based 3D lighting
            vec3 norm = normalize(vNormal);

            // Ambient
            vec3 lightTotal = ambientColor * ambientIntensity;

            // Key Directional Light
            vec3 l1 = normalize(dir1Dir);
            float diff1 = max(dot(norm, l1), 0.0);
            lightTotal += dir1Color * (dir1Intensity * diff1);

            // Fill Directional Light
            vec3 l2 = normalize(dir2Dir);
            float diff2 = max(dot(norm, l2), 0.0);
            lightTotal += dir2Color * (dir2Intensity * diff2);

            // Point Light
            vec3 pVec = pointPos - vWorldPos;
            float pDist = length(pVec);
            vec3 pDir = normalize(pVec);
            float pAtten = 1.0 / (1.0 + 0.00004 * pDist * pDist);
            float diffP = max(dot(norm, pDir), 0.0);
            lightTotal += pointColor * (pointIntensity * diffP * pAtten);

            // Apply master scene light intensity and exposure
            vec3 finalCol = baseCol * lightTotal * masterLightIntensity * exposure;

            gl_FragColor = vec4( finalCol, 1.0 );
        }
    </script>

    <script type="module">
        import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

        // --- 19 Preconfigured Color Schemes ---
        const COLOR_SCHEMES = [
            {
                name: "Original",
                c1: "#ff0055", c2: "#00ffcc", c3: "#ffdd00", c4: "#0066ff", c5: "#ff00aa",
                bg: "#222222"
            },
            {
                name: "Monochromatic",
                c1: "#0a2540", c2: "#195180", c3: "#2e78b8", c4: "#56a2e8", c5: "#a3d2ff",
                bg: "#05101a"
            },
            {
                name: "Analogous",
                c1: "#e63946", c2: "#f77f00", c3: "#fcbf49", c4: "#d62828", c5: "#ff9e00",
                bg: "#1a0808"
            },
            {
                name: "Complementary",
                c1: "#00b4d8", c2: "#0077b6", c3: "#ff7b00", c4: "#ff9e00", c5: "#90e0ef",
                bg: "#051520"
            },
            {
                name: "Split-complementary",
                c1: "#7209b7", c2: "#3a0ca3", c3: "#4cc9f0", c4: "#ffb703", c5: "#fb8500",
                bg: "#100520"
            },
            {
                name: "Triadic",
                c1: "#e63946", c2: "#ffb703", c3: "#2a9d8f", c4: "#457b9d", c5: "#1d3557",
                bg: "#0f141d"
            },
            {
                name: "Tetradic",
                c1: "#f72585", c2: "#ffb703", c3: "#4cc9f0", c4: "#70e000", c5: "#7209b7",
                bg: "#11081a"
            },
            {
                name: "Double split-complementary",
                c1: "#d00000", c2: "#ff6000", c3: "#00a896", c4: "#028090", c5: "#80ed99",
                bg: "#071518"
            },
            {
                name: "Achromatic (Black & White)",
                c1: "#000000", c2: "#333333", c3: "#777777", c4: "#cccccc", c5: "#ffffff",
                bg: "#000000"
            },
            {
                name: "Achromatic + Accent",
                c1: "#000000", c2: "#444444", c3: "#ffffff", c4: "#ff0033", c5: "#990011",
                bg: "#0a0a0a"
            },
            {
                name: "Neutral + Accent",
                c1: "#1c1917", c2: "#44403c", c3: "#78716c", c4: "#d6d3d1", c5: "#10b981",
                bg: "#141210"
            },
            {
                name: "Palette 1: Warm Flame",
                c1: "#F6AA1C", c2: "#BC3908", c3: "#941B0C", c4: "#F6AA1C", c5: "#220901",
                bg: "#120401"
            },
            {
                name: "Palette 2: Teal Wave",
                c1: "#63D1CF", c2: "#5BC0BE", c3: "#4BAD9E", c4: "#4BAD9E", c5: "#0B132B",
                bg: "#000000"
            },
            {
                name: "Palette 3: Lavender Mist",
                c1: "#AA60C8", c2: "#D69ADE", c3: "#C9A3C6", c4: "#CFB5C2", c5: "#0D001D",
                bg: "#120A12"
            },
            {
                name: "Palette 4: Golden Emerald",
                c1: "#FEF1BE", c2: "#FFBA00", c3: "#008189", c4: "#00474D", c5: "#061210",
                bg: "#061210"
            },
            {
                name: "Palette 5: Neon Forest",
                c1: "#D4FFB0", c2: "#7FFF00", c3: "#00B894", c4: "#0A3322", c5: "#05140A",
                bg: "#05140A"
            },
            {
                name: "Palette 6: Sunset Orange",
                c1: "#FFE8CC", c2: "#FF8C00", c3: "#C7501A", c4: "#3D1050", c5: "#0E0618",
                bg: "#0E0618"
            },
            {
                name: "Palette 7: Mystic Violet",
                c1: "#E8E0FF", c2: "#B38FFF", c3: "#6A3DE8", c4: "#1A1250", c5: "#090612",
                bg: "#090612"
            },
            {
                name: "Palette 8: Cyber Neon",
                c1: "#E0FBFF", c2: "#00F0FF", c3: "#D40078", c4: "#1E0A3D", c5: "#05020F",
                bg: "#05020F"
            }
        ];

        // --- 8 Preconfigured Animations ---
        const ANIMATION_NAMES = [
            "Static (No Movement)",
            "Gentle Orbit",
            "Infinity Figure-8",
            "Breathing Dolly",
            "Spiral Drift",
            "Pendulum Sway",
            "Axial Roll",
            "Horizon Arc"
        ];

        // --- App Parameters ---
        const params = {
            // Display & Background
            greenScreen: false,
            bgColor: "#222222",
            showDifferenceOverlay: true,
            dpr: Math.min(window.devicePixelRatio || 1, 2),
            antialias: true,

            // Procedural Random
            randomOnClick: true,

            // Color Theme
            colorScheme: COLOR_SCHEMES[0].name,
            isOriginal: true,
            color1: COLOR_SCHEMES[0].c1,
            color2: COLOR_SCHEMES[0].c2,
            color3: COLOR_SCHEMES[0].c3,
            color4: COLOR_SCHEMES[0].c4,
            color5: COLOR_SCHEMES[0].c5,

            // Animation
            cameraAnimation: ANIMATION_NAMES[1], // default Gentle Orbit
            animationSpeed: 1.0,
            waveSpeed: 1.0,
            waveFreq: 1.0,
            meshRotSpeed: 1.0,

            // Camera Controls & Persistence
            zoom: 1.0,
            cameraPitch: 0.0,
            cameraYaw: 0.0,

            // Object Position & Geometry
            objectPosX: 0,
            objectPosY: 0,
            objectPosZ: 0,
            boxLength: 320,
            boxThickness: 1.0,
            spacing: 4.0,
            twistRate: 0.01,

            // Lighting & Exposure
            exposure: 1.0,
            masterLightIntensity: 1.0,

            ambientColor: "#ffffff",
            ambientIntensity: 0.8,

            dir1Color: "#ffffff",
            dir1Intensity: 0.7,
            dir1X: 50,
            dir1Y: 80,
            dir1Z: 50,

            dir2Color: "#60a5fa",
            dir2Intensity: 0.35,
            dir2X: -60,
            dir2Y: -40,
            dir2Z: -50,

            pointColor: "#ffaa44",
            pointIntensity: 0.5,
            pointX: 0,
            pointY: 50,
            pointZ: 0
        };

        // --- Global Variables ---
        let container, camera, scene, renderer, clock;
        let meshGroup, meshes = [];
        let uniforms1;
        let diffOverlay;
        let animTime = 0;
        let gui;
        const controllers = {};

        // Track Pointer for Drag vs Click
        let isPointerDown = false;
        let pointerDownX = 0, pointerDownY = 0;
        let lastPointerX = 0, lastPointerY = 0;
        let totalPointerMove = 0;
        let pointerButton = 0;

        init();
        initGUI();
        animate();

        function init() {
            container = document.getElementById('container');
            diffOverlay = document.getElementById('diffOverlay');
            clock = new THREE.Clock();

            scene = new THREE.Scene();

            const aspect = window.innerWidth / window.innerHeight;
            const viewSize = window.innerHeight;
            camera = new THREE.OrthographicCamera(
                -aspect * viewSize / 2,
                aspect * viewSize / 2,
                viewSize / 2,
                -viewSize / 2,
                -10000,
                10000
            );
            camera.position.set(30, 30, 30);
            camera.zoom = params.zoom;
            camera.updateProjectionMatrix();
            camera.lookAt(0, 0, 0);

            // Container group for all 2,000 meshes
            meshGroup = new THREE.Group();
            scene.add(meshGroup);

            // Shader Material & Uniforms
            uniforms1 = {
                time: { value: 1.0 },
                isOriginal: { value: 1 },
                uColor1: { value: new THREE.Color(params.color1) },
                uColor2: { value: new THREE.Color(params.color2) },
                uColor3: { value: new THREE.Color(params.color3) },
                uColor4: { value: new THREE.Color(params.color4) },
                uColor5: { value: new THREE.Color(params.color5) },
                waveFreq: { value: params.waveFreq },

                exposure: { value: params.exposure },
                masterLightIntensity: { value: params.masterLightIntensity },

                ambientColor: { value: new THREE.Color(params.ambientColor) },
                ambientIntensity: { value: params.ambientIntensity },

                dir1Color: { value: new THREE.Color(params.dir1Color) },
                dir1Intensity: { value: params.dir1Intensity },
                dir1Dir: { value: new THREE.Vector3(params.dir1X, params.dir1Y, params.dir1Z).normalize() },

                dir2Color: { value: new THREE.Color(params.dir2Color) },
                dir2Intensity: { value: params.dir2Intensity },
                dir2Dir: { value: new THREE.Vector3(params.dir2X, params.dir2Y, params.dir2Z).normalize() },

                pointColor: { value: new THREE.Color(params.pointColor) },
                pointIntensity: { value: params.pointIntensity },
                pointPos: { value: new THREE.Vector3(params.pointX, params.pointY, params.pointZ) }
            };

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms1,
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragment_shader4').textContent
            });

            // Base Unit Box Geometry (scaled individually via params)
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            meshes = [];
            for (let i = 0; i < 2000; i++) {
                const mesh = new THREE.Mesh(geometry, material);
                meshGroup.add(mesh);
                meshes.push(mesh);
            }
            updateGeometryParameters();

            // WebGL Renderer with antialias setting
            renderer = new THREE.WebGLRenderer({ antialias: params.antialias });
            renderer.setPixelRatio(params.dpr);
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateBackground();
            container.appendChild(renderer.domElement);

            // Window Resize
            window.addEventListener('resize', onWindowResize, false);

            // Mouse Wheel Zoom
            window.addEventListener('wheel', onWheel, { passive: false });

            // Pointer Interactions (Drag & Procedural Click)
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('contextmenu', (e) => e.preventDefault());

            // Keyboard Toggle for GUI ("H" key)
            window.addEventListener('keydown', onKeyDown);
        }

        function updateBackground() {
            if (params.greenScreen) {
                renderer.setClearColor(0x00ff00, 1);
                document.body.style.backgroundColor = '#00ff00';
                if (diffOverlay) diffOverlay.style.display = 'none';
            } else {
                const col = new THREE.Color(params.bgColor);
                renderer.setClearColor(col, 1);
                document.body.style.backgroundColor = params.bgColor;
                if (diffOverlay) {
                    diffOverlay.style.display = params.showDifferenceOverlay ? 'block' : 'none';
                }
            }
        }

        function updateShaderColors() {
            uniforms1.isOriginal.value = params.isOriginal ? 1 : 0;
            uniforms1.uColor1.value.set(params.color1);
            uniforms1.uColor2.value.set(params.color2);
            uniforms1.uColor3.value.set(params.color3);
            uniforms1.uColor4.value.set(params.color4);
            uniforms1.uColor5.value.set(params.color5);
            uniforms1.waveFreq.value = params.waveFreq;

            uniforms1.exposure.value = params.exposure;
            uniforms1.masterLightIntensity.value = params.masterLightIntensity;

            uniforms1.ambientColor.value.set(params.ambientColor);
            uniforms1.ambientIntensity.value = params.ambientIntensity;

            uniforms1.dir1Color.value.set(params.dir1Color);
            uniforms1.dir1Intensity.value = params.dir1Intensity;
            uniforms1.dir1Dir.value.set(params.dir1X, params.dir1Y, params.dir1Z).normalize();

            uniforms1.dir2Color.value.set(params.dir2Color);
            uniforms1.dir2Intensity.value = params.dir2Intensity;
            uniforms1.dir2Dir.value.set(params.dir2X, params.dir2Y, params.dir2Z).normalize();

            uniforms1.pointColor.value.set(params.pointColor);
            uniforms1.pointIntensity.value = params.pointIntensity;
            uniforms1.pointPos.value.set(params.pointX, params.pointY, params.pointZ);
        }

        function updateGeometryParameters() {
            const count = meshes.length;
            const halfSpan = (params.spacing * count) * 0.5;
            for (let i = 0; i < count; i++) {
                const mesh = meshes[i];
                mesh.scale.set(params.boxThickness, params.boxLength, params.boxThickness);
                mesh.position.z = (i * params.spacing) - halfSpan;
                mesh.rotation.z = i * params.twistRate;
            }
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const viewSize = window.innerHeight;
            camera.left = -aspect * viewSize / 2;
            camera.right = aspect * viewSize / 2;
            camera.top = viewSize / 2;
            camera.bottom = -viewSize / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onWheel(e) {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.08 : 0.925;
            params.zoom = Math.max(0.05, Math.min(25.0, params.zoom * factor));
            camera.zoom = params.zoom;
            camera.updateProjectionMatrix();
            if (controllers.zoom) controllers.zoom.updateDisplay();
        }

        function onPointerDown(e) {
            // Ignore clicks directly inside lil-gui
            if (e.target.closest('.lil-gui')) return;

            isPointerDown = true;
            pointerButton = e.button;
            pointerDownX = e.clientX;
            pointerDownY = e.clientY;
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            totalPointerMove = 0;
        }

        function onPointerMove(e) {
            if (!isPointerDown) return;

            const dx = e.clientX - lastPointerX;
            const dy = e.clientY - lastPointerY;
            totalPointerMove += Math.hypot(dx, dy);
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;

            if (pointerButton === 2 || (pointerButton === 0 && e.shiftKey)) {
                // Right-Click (or Shift+Left Click) Drag: Adjust Camera Orbit Angle
                params.cameraYaw += dx * 0.008;
                params.cameraPitch = Math.max(-1.5, Math.min(1.5, params.cameraPitch + dy * 0.008));
                if (controllers.cameraYaw) controllers.cameraYaw.updateDisplay();
                if (controllers.cameraPitch) controllers.cameraPitch.updateDisplay();
            } else if (pointerButton === 0) {
                // Left-Click Drag: Drag Object across Screen in Camera Plane
                const worldScale = 1.0 / camera.zoom;
                const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

                meshGroup.position.addScaledVector(camRight, dx * worldScale);
                meshGroup.position.addScaledVector(camUp, -dy * worldScale);

                params.objectPosX = meshGroup.position.x;
                params.objectPosY = meshGroup.position.y;
                params.objectPosZ = meshGroup.position.z;

                if (controllers.objectPosX) controllers.objectPosX.updateDisplay();
                if (controllers.objectPosY) controllers.objectPosY.updateDisplay();
                if (controllers.objectPosZ) controllers.objectPosZ.updateDisplay();
            }
        }

        function onPointerUp(e) {
            if (!isPointerDown) return;
            isPointerDown = false;

            // Detect Click (Distance moved < 6px and not inside GUI)
            if (totalPointerMove < 6 && pointerButton === 0 && params.randomOnClick) {
                if (!e.target.closest('.lil-gui')) {
                    triggerProceduralRandom();
                }
            }
        }

        function onKeyDown(e) {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden = !gui._hidden;
                if (gui.domElement) {
                    gui.domElement.style.display = gui._hidden ? 'none' : '';
                }
            }
        }

        function rebuildRenderer(antialias) {
            const oldDom = renderer.domElement;
            renderer.dispose();
            if (oldDom && oldDom.parentNode) {
                oldDom.parentNode.removeChild(oldDom);
            }
            renderer = new THREE.WebGLRenderer({ antialias: antialias });
            renderer.setPixelRatio(params.dpr);
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateBackground();
            container.appendChild(renderer.domElement);
        }

        function applyColorScheme(schemeName) {
            const scheme = COLOR_SCHEMES.find(s => s.name === schemeName) || COLOR_SCHEMES[0];
            params.colorScheme = scheme.name;
            params.isOriginal = (scheme.name === "Original");
            params.color1 = scheme.c1;
            params.color2 = scheme.c2;
            params.color3 = scheme.c3;
            params.color4 = scheme.c4;
            params.color5 = scheme.c5;
            if (!params.greenScreen) {
                params.bgColor = scheme.bg;
                updateBackground();
            }
            updateShaderColors();
            updateAllGui();
        }

        function triggerProceduralRandom() {
            // Pick a random color scheme from the 19 preconfigured schemes
            const randomScheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
            params.colorScheme = randomScheme.name;
            params.isOriginal = (randomScheme.name === "Original");
            params.color1 = randomScheme.c1;
            params.color2 = randomScheme.c2;
            params.color3 = randomScheme.c3;
            params.color4 = randomScheme.c4;
            params.color5 = randomScheme.c5;
            if (!params.greenScreen) {
                params.bgColor = randomScheme.bg;
                updateBackground();
            }

            // Re-roll geometric parameters
            params.boxLength = Math.round(150 + Math.random() * 320);
            params.boxThickness = parseFloat((0.5 + Math.random() * 2.5).toFixed(2));
            params.spacing = parseFloat((2.0 + Math.random() * 5.0).toFixed(2));
            params.twistRate = parseFloat((0.005 + Math.random() * 0.02).toFixed(4));
            updateGeometryParameters();

            // Re-roll motion parameters
            params.animationSpeed = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));
            params.waveSpeed = parseFloat((0.6 + Math.random() * 1.8).toFixed(2));
            params.waveFreq = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));
            params.meshRotSpeed = parseFloat((0.6 + Math.random() * 1.4).toFixed(2));

            // Re-roll camera animation & angles
            params.cameraAnimation = ANIMATION_NAMES[Math.floor(Math.random() * ANIMATION_NAMES.length)];
            params.cameraYaw = parseFloat(((Math.random() - 0.5) * Math.PI).toFixed(3));
            params.cameraPitch = parseFloat(((Math.random() - 0.5) * 1.0).toFixed(3));

            // Re-roll lighting
            params.exposure = parseFloat((0.75 + Math.random() * 0.6).toFixed(2));
            params.masterLightIntensity = parseFloat((0.8 + Math.random() * 0.5).toFixed(2));
            params.ambientIntensity = parseFloat((0.5 + Math.random() * 0.5).toFixed(2));
            params.dir1Intensity = parseFloat((0.4 + Math.random() * 0.8).toFixed(2));
            params.dir2Intensity = parseFloat((0.2 + Math.random() * 0.6).toFixed(2));
            params.pointIntensity = parseFloat((0.3 + Math.random() * 0.7).toFixed(2));

            updateShaderColors();
            updateAllGui();
        }

        function updateAllGui() {
            for (const key in controllers) {
                if (controllers[key] && typeof controllers[key].updateDisplay === 'function') {
                    controllers[key].updateDisplay();
                }
            }
        }

        // --- Initialize lil-gui Control Panel ---
        function initGUI() {
            gui = new GUI({ title: 'Scene Controls' });

            // Folder: Display & Canvas
            const fDisplay = gui.addFolder('Display & View');
            controllers.greenScreen = fDisplay.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(updateBackground);
            controllers.bgColor = fDisplay.addColor(params, 'bgColor').name('Background Color').onChange(updateBackground);
            controllers.showDifferenceOverlay = fDisplay.add(params, 'showDifferenceOverlay').name('Difference Overlay').onChange(updateBackground);
            controllers.dpr = fDisplay.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
                renderer.setPixelRatio(v);
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            controllers.antialias = fDisplay.add(params, 'antialias').name('Antialias').onChange(v => rebuildRenderer(v));
            controllers.randomOnClick = fDisplay.add(params, 'randomOnClick').name('Random On Click');
            fDisplay.add({ randomize: triggerProceduralRandom }, 'randomize').name('Randomize Scene Now');

            // Folder: Color Schemes & Custom Colors
            const fColors = gui.addFolder('Colors & Themes');
            controllers.colorScheme = fColors.add(params, 'colorScheme', COLOR_SCHEMES.map(s => s.name)).name('Preset Scheme').onChange(applyColorScheme);
            controllers.isOriginal = fColors.add(params, 'isOriginal').name('Use Original Math').onChange(updateShaderColors);
            controllers.color1 = fColors.addColor(params, 'color1').name('Color 1').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });
            controllers.color2 = fColors.addColor(params, 'color2').name('Color 2').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });
            controllers.color3 = fColors.addColor(params, 'color3').name('Color 3').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });
            controllers.color4 = fColors.addColor(params, 'color4').name('Color 4').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });
            controllers.color5 = fColors.addColor(params, 'color5').name('Color 5').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });

            // Folder: Camera & Animations
            const fAnim = gui.addFolder('Camera & Animation');
            controllers.cameraAnimation = fAnim.add(params, 'cameraAnimation', ANIMATION_NAMES).name('Animation Mode');
            controllers.animationSpeed = fAnim.add(params, 'animationSpeed', 0.0, 5.0, 0.05).name('Anim Speed');
            controllers.waveSpeed = fAnim.add(params, 'waveSpeed', 0.1, 4.0, 0.05).name('Wave Speed');
            controllers.waveFreq = fAnim.add(params, 'waveFreq', 0.2, 4.0, 0.05).name('Wave Frequency').onChange(updateShaderColors);
            controllers.meshRotSpeed = fAnim.add(params, 'meshRotSpeed', 0.0, 4.0, 0.05).name('Mesh Rot Speed');
            controllers.zoom = fAnim.add(params, 'zoom', 0.05, 10.0, 0.05).name('Zoom').onChange(v => {
                camera.zoom = v;
                camera.updateProjectionMatrix();
            });
            controllers.cameraPitch = fAnim.add(params, 'cameraPitch', -1.5, 1.5, 0.01).name('Camera Pitch');
            controllers.cameraYaw = fAnim.add(params, 'cameraYaw', -Math.PI, Math.PI, 0.01).name('Camera Yaw');
            fAnim.add({
                resetCam: () => {
                    params.zoom = 1.0;
                    params.cameraPitch = 0.0;
                    params.cameraYaw = 0.0;
                    camera.zoom = 1.0;
                    camera.updateProjectionMatrix();
                    updateAllGui();
                }
            }, 'resetCam').name('Reset Camera');

            // Folder: Object Transform & Geometry
            const fObject = gui.addFolder('Object Geometry & Drag');
            controllers.objectPosX = fObject.add(params, 'objectPosX', -1500, 1500, 1).name('Pos X').onChange(v => { meshGroup.position.x = v; });
            controllers.objectPosY = fObject.add(params, 'objectPosY', -1500, 1500, 1).name('Pos Y').onChange(v => { meshGroup.position.y = v; });
            controllers.objectPosZ = fObject.add(params, 'objectPosZ', -3000, 3000, 1).name('Pos Z').onChange(v => { meshGroup.position.z = v; });
            fObject.add({
                resetPos: () => {
                    meshGroup.position.set(0, 0, 0);
                    params.objectPosX = 0;
                    params.objectPosY = 0;
                    params.objectPosZ = 0;
                    updateAllGui();
                }
            }, 'resetPos').name('Reset Position');
            controllers.boxLength = fObject.add(params, 'boxLength', 50, 800, 5).name('Box Length').onChange(updateGeometryParameters);
            controllers.boxThickness = fObject.add(params, 'boxThickness', 0.2, 5.0, 0.1).name('Box Thickness').onChange(updateGeometryParameters);
            controllers.spacing = fObject.add(params, 'spacing', 0.5, 15.0, 0.2).name('Spacing').onChange(updateGeometryParameters);
            controllers.twistRate = fObject.add(params, 'twistRate', 0.001, 0.05, 0.001).name('Twist Rate').onChange(updateGeometryParameters);

            // Folder: Lighting & Exposure
            const fLight = gui.addFolder('Lighting & Exposure');
            controllers.exposure = fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Exposure').onChange(updateShaderColors);
            controllers.masterLightIntensity = fLight.add(params, 'masterLightIntensity', 0.0, 3.0, 0.05).name('Scene Light Intensity').onChange(updateShaderColors);

            // Subfolder: Ambient Light
            const fAmb = fLight.addFolder('Ambient Light');
            controllers.ambientColor = fAmb.addColor(params, 'ambientColor').name('Color').onChange(updateShaderColors);
            controllers.ambientIntensity = fAmb.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateShaderColors);

            // Subfolder: Key Directional Light
            const fDir1 = fLight.addFolder('Key Light (Dir 1)');
            controllers.dir1Color = fDir1.addColor(params, 'dir1Color').name('Color').onChange(updateShaderColors);
            controllers.dir1Intensity = fDir1.add(params, 'dir1Intensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateShaderColors);
            controllers.dir1X = fDir1.add(params, 'dir1X', -200, 200, 1).name('Dir X').onChange(updateShaderColors);
            controllers.dir1Y = fDir1.add(params, 'dir1Y', -200, 200, 1).name('Dir Y').onChange(updateShaderColors);
            controllers.dir1Z = fDir1.add(params, 'dir1Z', -200, 200, 1).name('Dir Z').onChange(updateShaderColors);

            // Subfolder: Fill Directional Light
            const fDir2 = fLight.addFolder('Fill Light (Dir 2)');
            controllers.dir2Color = fDir2.addColor(params, 'dir2Color').name('Color').onChange(updateShaderColors);
            controllers.dir2Intensity = fDir2.add(params, 'dir2Intensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateShaderColors);
            controllers.dir2X = fDir2.add(params, 'dir2X', -200, 200, 1).name('Dir X').onChange(updateShaderColors);
            controllers.dir2Y = fDir2.add(params, 'dir2Y', -200, 200, 1).name('Dir Y').onChange(updateShaderColors);
            controllers.dir2Z = fDir2.add(params, 'dir2Z', -200, 200, 1).name('Dir Z').onChange(updateShaderColors);

            // Subfolder: Point Light
            const fPoint = fLight.addFolder('Point Light');
            controllers.pointColor = fPoint.addColor(params, 'pointColor').name('Color').onChange(updateShaderColors);
            controllers.pointIntensity = fPoint.add(params, 'pointIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateShaderColors);
            controllers.pointX = fPoint.add(params, 'pointX', -1000, 1000, 10).name('Pos X').onChange(updateShaderColors);
            controllers.pointY = fPoint.add(params, 'pointY', -1000, 1000, 10).name('Pos Y').onChange(updateShaderColors);
            controllers.pointZ = fPoint.add(params, 'pointZ', -1000, 1000, 10).name('Pos Z').onChange(updateShaderColors);

            fLight.close();
            fObject.close();
        }

        // --- Main Animation & Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            render();
        }

        function render() {
            const delta = clock.getDelta();
            const effectiveDelta = delta * params.animationSpeed;
            animTime += effectiveDelta;

            // Update shader wave time
            uniforms1.time.value += effectiveDelta * 5 * params.waveSpeed;

            // Rotate each of the 2,000 meshes based on animation speed
            const rotStep = effectiveDelta * 60 * params.meshRotSpeed;
            for (let i = 0; i < meshes.length; i++) {
                const mesh = meshes[i];
                mesh.rotation.x += 0.04 * rotStep;
                mesh.rotation.z += 0.04 * rotStep;
                mesh.rotation.y += effectiveDelta * 0.8 * (i % 2 ? 1 : -1) * params.meshRotSpeed;
            }

            // --- 8 Preconfigured Camera Animations ---
            // Base diagonal radius ~ 52 (isometric view distance for 30, 30, 30)
            const baseR = 52.0;
            const lookTarget = new THREE.Vector3(0, 0, 0);

            camera.up.set(0, 1, 0);

            switch (params.cameraAnimation) {
                case "Static (No Movement)": {
                    const p = 0.615 + params.cameraPitch;
                    const y = 0.785 + params.cameraYaw;
                    camera.position.set(
                        baseR * Math.cos(p) * Math.sin(y),
                        baseR * Math.sin(p),
                        baseR * Math.cos(p) * Math.cos(y)
                    );
                    camera.lookAt(lookTarget);
                    break;
                }

                case "Gentle Orbit": {
                    const theta = animTime * 0.15 + params.cameraYaw;
                    const p = 0.615 + params.cameraPitch;
                    camera.position.set(
                        baseR * Math.cos(p) * Math.sin(theta),
                        baseR * Math.sin(p),
                        baseR * Math.cos(p) * Math.cos(theta)
                    );
                    camera.lookAt(lookTarget);
                    break;
                }

                case "Infinity Figure-8": {
                    const theta = Math.sin(animTime * 0.12) * 0.75 + params.cameraYaw + 0.785;
                    const p = 0.615 + Math.sin(animTime * 0.24) * 0.25 + params.cameraPitch;
                    camera.position.set(
                        baseR * Math.cos(p) * Math.sin(theta),
                        baseR * Math.sin(p),
                        baseR * Math.cos(p) * Math.cos(theta)
                    );
                    camera.lookAt(lookTarget);
                    break;
                }

                case "Breathing Dolly": {
                    const r = baseR * (1.0 + 0.2 * Math.sin(animTime * 0.2));
                    const theta = params.cameraYaw + 0.785;
                    const p = 0.615 + params.cameraPitch;
                    camera.position.set(
                        r * Math.cos(p) * Math.sin(theta),
                        r * Math.sin(p),
                        r * Math.cos(p) * Math.cos(theta)
                    );
                    camera.lookAt(lookTarget);
                    break;
                }

                case "Spiral Drift": {
                    const theta = animTime * 0.12 + params.cameraYaw;
                    const yOffset = Math.sin(animTime * 0.15) * 20.0;
                    const p = 0.55 + params.cameraPitch;
                    camera.position.set(
                        baseR * Math.cos(p) * Math.sin(theta),
                        baseR * Math.sin(p) + yOffset,
                        baseR * Math.cos(p) * Math.cos(theta)
                    );
                    camera.lookAt(lookTarget);
                    break;
                }

                case "Pendulum Sway": {
                    const theta = Math.sin(animTime * 0.18) * 0.65 + params.cameraYaw + 0.785;
                    const p = 0.615 + Math.cos(animTime * 0.12) * 0.15 + params.cameraPitch;
                    camera.position.set(
                        baseR * Math.cos(p) * Math.sin(theta),
                        baseR * Math.sin(p),
                        baseR * Math.cos(p) * Math.cos(theta)
                    );
                    camera.lookAt(lookTarget);
                    break;
                }

                case "Axial Roll": {
                    const theta = params.cameraYaw + 0.785;
                    const p = 0.615 + params.cameraPitch;
                    camera.position.set(
                        baseR * Math.cos(p) * Math.sin(theta),
                        baseR * Math.sin(p),
                        baseR * Math.cos(p) * Math.cos(theta)
                    );
                    const roll = Math.sin(animTime * 0.2) * 0.35;
                    camera.up.set(Math.sin(roll), Math.cos(roll), 0);
                    camera.lookAt(lookTarget);
                    break;
                }

                case "Horizon Arc": {
                    const p = 0.65 + Math.sin(animTime * 0.15) * 0.45 + params.cameraPitch;
                    const theta = animTime * 0.08 + params.cameraYaw;
                    camera.position.set(
                        baseR * Math.cos(p) * Math.sin(theta),
                        baseR * Math.sin(p),
                        baseR * Math.cos(p) * Math.cos(theta)
                    );
                    camera.lookAt(lookTarget);
                    break;
                }
            }

            // CRITICAL: Maintain user's zoom factor without resetting during camera animations
            camera.zoom = params.zoom;
            camera.updateProjectionMatrix();

            renderer.render(scene, camera);
        }
    </script>
