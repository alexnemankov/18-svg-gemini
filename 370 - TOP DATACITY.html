const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {

const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;

}

const godRaysDepthMaskShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);

const godRaysGenerateShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec3 vSunPositionScreenSpace;
uniform float fStepSize;
uniform float distanceAttenuation;
uniform float maxDensity;
in vec2 vUv;
out vec4 fragColor;

#define TAPS_PER_PASS 6.0

void main() {
  vec2 delta = (vSunPositionScreenSpace.xy - vUv);
  float dist = length(delta);
  vec2 stepv = fStepSize * delta / dist;
  float iters = dist / fStepSize;
  vec2 uv = vUv;
  float col = 0.0;
  float atten = pow(clamp(1.0 - dist, 0.0, 1.0), distanceAttenuation) * vSunPositionScreenSpace.z;
  float f = 1.0;

  if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

  float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
  fragColor = vec4(vec3(finalVal), 1.0);
}
`;

const anamorphicBrightShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
uniform float smoothWidth;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float alpha = smoothstep(threshold, threshold + smoothWidth, v);
  fragColor = mix(vec4(0.0), color, alpha);
}
`;

const anamorphicBlurShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 resolution;
uniform float samples;
uniform float intensity;
uniform vec3 tintColor;
uniform float bloomRadius;
in vec2 vUv;
out vec4 fragColor;

void main() {
  int halfSamples = max(1, int(samples) / 2);
  float fHalfSamples = float(halfSamples);
  vec2 invSize = 1.0 / resolution;
  vec4 total = vec4(0.0);

  for (int i = -64; i <= 64; i++) {
    if (i < -halfSamples || i > halfSamples) continue;
    float softness = 1.0 - abs(float(i)) / fHalfSamples;
    softness = pow(softness, 2.0);
    vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
    shiftedUV = clamp(shiftedUV, 0.001, 0.999);
    total += texture(inputTexture, shiftedUV) * softness;
  }

  fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
}
`;

const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform sampler2D raysTexture;
uniform sampler2D anamorphicTexture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform bool raysEnabled;
uniform float raysStrength;
uniform vec3 raysColor;
uniform bool anamorphicEnabled;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);
    vec4 totalBloom = (b0 + b1 + b2 + b3 + b4) * 0.2;
    color.rgb += totalBloom.rgb * bloomStrength;
  }

  if (raysEnabled) {
    vec4 rays = texture(raysTexture, vUv);
    color.rgb += rays.rgb * raysStrength * raysColor;
  }

  if (anamorphicEnabled) {
    vec4 ana = texture(anamorphicTexture, vUv);
    color.rgb += ana.rgb;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);

  if (noiseIntensity > 0.0001) {
    float n = noise(gl_FragCoord.xy, time);
    color.rgb += (n - 0.5) * noiseIntensity;
  }

  fragColor = color;
}
`;

const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float exposure;
uniform int visionMode;
uniform float thermalSensitivity;
uniform float nightVisionGain;
uniform float nightVisionNoise;
uniform float crtIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  vec2 coord = uv - 0.5;
  float dist = length(coord);
  if (dist < radius && strength != 0.0) {
    float percent = dist / radius;
    if (strength > 0.0) {
      coord *= mix(1.0, smoothstep(0.0, radius / dist, percent), strength * 0.75);
    } else {
      coord *= mix(1.0, pow(percent, 1.0 + abs(strength)), abs(strength) * 0.75);
    }
  }
  return coord + 0.5;
}

vec3 ironbow(float t) {
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3(0.05, 0.0, 0.15);
  vec3 c1 = vec3(0.0, 0.2, 0.8);
  vec3 c2 = vec3(0.9, 0.1, 0.4);
  vec3 c3 = vec3(1.0, 0.8, 0.0);
  vec3 c4 = vec3(1.0, 1.0, 0.95);
  if (t < 0.25) return mix(c0, c1, t * 4.0);
  if (t < 0.55) return mix(c1, c2, (t - 0.25) * 3.333);
  if (t < 0.85) return mix(c2, c3, (t - 0.55) * 3.333);
  return mix(c3, c4, (t - 0.85) * 6.666);
}

float randomNoise(vec2 p, float t) {
  return fract(sin(dot(p + mod(t, 100.0) * 0.1, vec2(12.9898, 78.233))) * 43758.5453);
}

void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  vec4 color;

  if (chromaticAberrationAmount > 0.0001) {
    vec2 toCenter = uv - 0.5;
    float dist = length(toCenter);
    vec2 offset = normalize(toCenter + 0.0001) * pow(dist, 1.5) * chromaticAberrationAmount;
    color.r = texture(inputTexture, uv - offset).r;
    color.g = texture(inputTexture, uv).g;
    color.b = texture(inputTexture, uv + offset).b;
    color.a = texture(inputTexture, uv).a;
  } else {
    color = texture(inputTexture, uv);
  }

  color.rgb = clamp((color.rgb - vec3(minInputLevel)) / (vec3(maxInputLevel) - vec3(minInputLevel)), 0.0, 1.0);
  color.rgb = pow(color.rgb, vec3(1.0 / max(gammaLevel, 0.0001)));
  color.rgb *= exposure;

  if (visionMode == 1) {
    float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));
    float boosted = lum * nightVisionGain;
    float nvgNoise = (randomNoise(gl_FragCoord.xy, time) - 0.5) * nightVisionNoise;
    vec3 phosphorColor = vec3(0.2, 1.0, 0.35);
    color.rgb = phosphorColor * clamp(boosted + nvgNoise, 0.0, 1.3);
  } else if (visionMode == 2) {
    float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));
    float heat = clamp(pow(lum, 1.0 / thermalSensitivity), 0.0, 1.0);
    color.rgb = ironbow(heat);
  } else if (visionMode == 3) {
    float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));
    float heat = clamp(pow(lum, 1.0 / thermalSensitivity), 0.0, 1.0);
    color.rgb = vec3(heat);
  }

  if (crtIntensity > 0.0001) {
    float scanline = sin(gl_FragCoord.y * 1.5) * 0.5 + 0.5;
    color.rgb -= scanline * crtIntensity;
  }

  fragColor = color;
}
`;

function createFBO(w, h, options = {}) {
  return new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    type: THREE.HalfFloatType,
    stencilBuffer: false,
    depthBuffer: false,
    ...options
  });
}

class ShaderPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbo = createFBO(1, 1, options);
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer, toScreen = false) {
    renderer.setRenderTarget(toScreen ? null : this.fbo);
    renderer.render(this.orthoScene, this.orthoCamera);
    if (toScreen) renderer.setRenderTarget(null);
  }
  get texture() { return this.fbo.texture; }
  setSize(width, height) {
    this.fbo.setSize(Math.max(1, width), Math.max(1, height));
    this.orthoQuad.scale.set(width, height, 1);
  }
}

class ShaderPingPongPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
    this.currentFBO = 0;
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer) {
    renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
    renderer.render(this.orthoScene, this.orthoCamera);
    renderer.setRenderTarget(null);
    this.currentFBO = 1 - this.currentFBO;
  }
  get current() { return this.fbos[this.currentFBO]; }
  get texture() { return this.current.texture; }
  setSize(width, height) {
    const w = Math.max(1, width), h = Math.max(1, height);
    this.orthoQuad.scale.set(w, h, 1);
    this.fbos[0].setSize(w, h);
    this.fbos[1].setSize(w, h);
  }
}

class BloomPass {
  constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
    this.strength = strength;
    this.radius = radius;
    this.threshold = threshold;
    this.enabled = true;
    this.levels = levels;

    this.brightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        bloomThreshold: { value: this.threshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: brightFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.brightPass = new ShaderPass(this.brightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

    this.blurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        direction: { value: new THREE.Vector2(0, 1) },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: blurFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.blurPasses = [];
    for (let i = 0; i < this.levels; i++) {
      this.blurPasses.push(new ShaderPingPongPass(this.blurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType }));
    }
  }

  setSize(w, h) {
    let tw = Math.max(1, w), th = Math.max(1, h);
    this.brightPass.setSize(tw, th);
    for (let i = 0; i < this.levels; i++) {
      tw = Math.max(1, Math.round(tw / 2));
      th = Math.max(1, Math.round(th / 2));
      this.blurPasses[i].setSize(tw, th);
    }
  }

  set source(texture) {
    this.brightShader.uniforms.inputTexture.value = texture;
  }

  render(renderer) {
    if (!this.enabled || this.strength <= 0.001) return;
    this.brightShader.uniforms.bloomThreshold.value = this.threshold;
    this.brightPass.render(renderer);

    const baseOffset = Math.max(0.1, this.radius * 2.0);
    const u = this.blurShader.uniforms;

    for (let j = 0; j < this.levels; j++) {
      const blurPass = this.blurPasses[j];
      const stepOffset = baseOffset * (1.0 + j * 0.5);

      u.direction.value.set(stepOffset, 0);
      u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
      blurPass.render(renderer);

      u.direction.value.set(0, stepOffset * 0.5);
      u.inputTexture.value = blurPass.current.texture;
      blurPass.render(renderer);
    }
  }
}

const VISION_MODE_MAP = {
  'Normal (Cinematic)': 0,
  'Night Vision (Phosphor)': 1,
  'Thermal (Ironbow)': 2,
  'Thermal (White-Hot)': 3,
};

class PostProcessor {
  constructor(renderer, params = {}) {
    this.renderer = renderer;

    this.settings = {
      enabled: params.enabled !== undefined ? params.enabled : true,
      bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
      bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.2,
      bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
      bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.15,

      raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
      raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
      raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
      raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
      raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
      raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
      raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x3aa0ff),
      raysColorHex: params.raysColorHex || '#3aa0ff',

      anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
      anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 2.5,
      anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
      anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
      anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.1,
      anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
      anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x7dffc4),
      anamorphicColorHex: params.anamorphicColorHex || '#7dffc4',

      visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
      thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
      nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
      nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
      crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

      fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
      fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
      chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.006,
      vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.1,
      vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
      noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.008,

      gamma: params.gamma !== undefined ? params.gamma : 1.0,
      minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
      maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
      exposure: params.exposure !== undefined ? params.exposure : 1.0,
    };

    this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
    this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);

    this.sunScreenPos = new THREE.Vector3(0.5, 0.5, 1.0);
    this.sunInFront = true;

    this.godRaysMaskShader = new THREE.RawShaderMaterial({
      uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.raysThreshold } },
      vertexShader: orthoVertexShader, fragmentShader: godRaysDepthMaskShader, glslVersion: THREE.GLSL3,
    });
    this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

    this.godRaysGenShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        vSunPositionScreenSpace: { value: this.sunScreenPos },
        fStepSize: { value: 1.0 },
        distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
        maxDensity: { value: this.settings.raysMaxDensity },
      },
      vertexShader: orthoVertexShader, fragmentShader: godRaysGenerateShader, glslVersion: THREE.GLSL3,
    });
    this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

    this.anamorphicBrightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        threshold: { value: this.settings.anamorphicThreshold },
        smoothWidth: { value: this.settings.anamorphicSmoothWidth },
      },
      vertexShader: orthoVertexShader, fragmentShader: anamorphicBrightShader, glslVersion: THREE.GLSL3,
    });
    this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

    this.anamorphicBlurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        resolution: { value: new THREE.Vector2(1, 1) },
        samples: { value: this.settings.anamorphicSamples },
        intensity: { value: this.settings.anamorphicIntensity },
        tintColor: { value: this.settings.anamorphicColor },
        bloomRadius: { value: this.settings.anamorphicRadius },
      },
      vertexShader: orthoVertexShader, fragmentShader: anamorphicBlurShader, glslVersion: THREE.GLSL3,
    });
    this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

    this.finalShader = new THREE.RawShaderMaterial({
      uniforms: {
        resolution: { value: new THREE.Vector2(1, 1) },
        bloomEnabled: { value: this.settings.bloomEnabled },
        bloomStrength: { value: this.settings.bloomStrength },
        raysEnabled: { value: this.settings.raysEnabled },
        raysStrength: { value: this.settings.raysStrength },
        raysColor: { value: this.settings.raysColor },
        anamorphicEnabled: { value: this.settings.anamorphicEnabled },
        vignetteBoost: { value: this.settings.vignetteBoost },
        vignetteReduction: { value: this.settings.vignetteReduction },
        noiseIntensity: { value: this.settings.noiseIntensity },
        inputTexture: { value: null },
        blur0Texture: { value: null },
        blur1Texture: { value: null },
        blur2Texture: { value: null },
        blur3Texture: { value: null },
        blur4Texture: { value: null },
        raysTexture: { value: null },
        anamorphicTexture: { value: null },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader, fragmentShader: finalFragmentShader, glslVersion: THREE.GLSL3,
    });
    this.finalPass = new ShaderPass(this.finalShader);

    this.rgbShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: this.finalPass.texture },
        fisheyeStrength: { value: this.settings.fisheyeStrength },
        fisheyeRadius: { value: this.settings.fisheyeRadius },
        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
        minInputLevel: { value: this.settings.minInputLevel },
        maxInputLevel: { value: this.settings.maxInputLevel },
        gammaLevel: { value: this.settings.gamma },
        exposure: { value: this.settings.exposure },
        visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
        thermalSensitivity: { value: this.settings.thermalSensitivity },
        nightVisionGain: { value: this.settings.nightVisionGain },
        nightVisionNoise: { value: this.settings.nightVisionNoise },
        crtIntensity: { value: this.settings.crtIntensity },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader, fragmentShader: colorFragmentShader, glslVersion: THREE.GLSL3,
    });
    this.rgbPass = new ShaderPass(this.rgbShader);

    this.copyShader = new THREE.RawShaderMaterial({
      uniforms: { inputTexture: { value: null } },
      vertexShader: orthoVertexShader, fragmentShader: copyFragmentShader, glslVersion: THREE.GLSL3,
    });
    this.copyPass = new ShaderPass(this.copyShader);
  }

  updateSettings() {
    this.bloomPass.enabled = this.settings.bloomEnabled;
    this.bloomPass.strength = this.settings.bloomStrength;
    this.bloomPass.radius = this.settings.bloomRadius;
    this.bloomPass.threshold = this.settings.bloomThreshold;

    this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
    this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
    this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

    this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
    this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
    this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
    this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
    this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
    this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

    this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
    this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
    this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.sunInFront;
    this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
    this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
    this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
    this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
    this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
    this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

    this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
    this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
    this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
    this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
    this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
    this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
    this.rgbShader.uniforms.exposure.value = this.settings.exposure;
    this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
    this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
    this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
    this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
    this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
  }

  setSize(w0, h0, dpr = 1) {
    const w = Math.max(1, Math.floor(w0 * dpr));
    const h = Math.max(1, Math.floor(h0 * dpr));
    this.sceneTarget.setSize(w, h);
    this.finalPass.setSize(w, h);
    this.finalShader.uniforms.resolution.value.set(w, h);
    this.bloomPass.setSize(w, h);

    const grW = Math.max(1, Math.round(w / 2));
    const grH = Math.max(1, Math.round(h / 2));
    this.godRaysMaskPass.setSize(grW, grH);
    this.godRaysPingPong.setSize(grW, grH);

    const anW = Math.max(1, Math.round(w / 4));
    const anH = Math.max(1, Math.round(h / 4));
    this.anamorphicBrightPass.setSize(anW, anH);
    this.anamorphicBlurPass.setSize(anW, anH);
    this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

    this.rgbPass.setSize(w, h);
    this.copyPass.setSize(w, h);
  }

  setSunScreenPosition(camera, sunWorldPos) {
    if (!this._camDir) {
      this._camDir = new THREE.Vector3();
      this._toSun = new THREE.Vector3();
      this._ndc = new THREE.Vector3();
    }
    camera.getWorldDirection(this._camDir);
    this._toSun.copy(sunWorldPos).sub(camera.position).normalize();
    const dot = this._camDir.dot(this._toSun);

    if (dot <= 0.02) {
      this.sunInFront = false;
      this.finalShader.uniforms.raysEnabled.value = false;
      return;
    }

    this.sunInFront = true;
    const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);
    this._ndc.copy(sunWorldPos).project(camera);
    const screenX = this._ndc.x * 0.5 + 0.5;
    const screenY = this._ndc.y * 0.5 + 0.5;
    const screenZ = fade;

    this.sunScreenPos.set(screenX, screenY, screenZ);
    this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
  }

  renderScene(scene, camera) {
    if (!this.settings.enabled) {
      this.renderer.render(scene, camera);
      return;
    }
    this.renderer.setRenderTarget(this.sceneTarget);
    this.renderer.render(scene, camera);
    this.renderer.setRenderTarget(null);
    this.render(this.sceneTarget.texture);
  }

  render(sourceTexture) {
    if (!this.settings.enabled) {
      this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
      this.copyPass.render(this.renderer, true);
      return;
    }

    this.updateSettings();

    // 1. Atmospheric Bloom
    this.bloomPass.source = sourceTexture;
    this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
    this.bloomPass.render(this.renderer);

    this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
    this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
    this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
    this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
    this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

    // 2. Godrays
    if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.sunInFront) {
      this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
      this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
      this.godRaysMaskPass.render(this.renderer);

      const filterLen = this.settings.raysDensity;
      const tapsPerPass = 6.0;

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
      this.godRaysPingPong.render(this.renderer);

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
      this.finalPass.shader.uniforms.raysEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.raysEnabled.value = false;
    }

    // 3. Anamorphic Flare
    if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
      this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
      this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
      this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
      this.anamorphicBrightPass.render(this.renderer);

      this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
      this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
      this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
      this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
      this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
      this.anamorphicBlurPass.render(this.renderer);

      this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
      this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
    }

    const randomTime = Math.random() * 100000;
    this.finalPass.shader.uniforms.time.value = randomTime;
    this.rgbPass.shader.uniforms.time.value = randomTime;

    this.finalPass.render(this.renderer);
    this.rgbPass.render(this.renderer, true);
  }

  attachGUI(gui, title = "Post-Processing Pipeline") {
    const root = gui.addFolder(title);
    root.add(this.settings, "enabled").name("Enable Post-Process");

    const vision = root.addFolder("Thermal & Night Vision");
    vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
    vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Gain").onChange(() => this.updateSettings());
    vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
    vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
    vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());
    vision.close();

    const rays = root.addFolder("Atmospheric Godrays");
    rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Density (Spread)").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysDistanceAttenuation", 0.5, 4.0, 0.1).name("Distance Atten").onChange(() => this.updateSettings());
    rays.addColor(this.settings, "raysColorHex").name("Ray Color").onChange((v) => {
      this.settings.raysColor.set(v);
      this.updateSettings();
    });
    rays.close();

    const anamorphic = root.addFolder("Anamorphic Horizontal Streak");
    anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Flare").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
    anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
      this.settings.anamorphicColor.set(v);
      this.updateSettings();
    });
    anamorphic.close();

    const bloom = root.addFolder("Atmospheric Bloom");
    bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());
    bloom.close();

    const lens = root.addFolder("Lens & Camera Optics");
    lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
    lens.add(this.settings, "chromaticAberration", 0, 0.05, 0.001).name("Chromatic Aberr").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
    lens.add(this.settings, "noiseIntensity", 0, 0.08, 0.002).name("Film Grain").onChange(() => this.updateSettings());
    lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
    lens.close();

    root.close();
    return root;
  }
}

// =========================================================================================
// 19+ PRECONFIGURED COLOR SCHEMES
// =========================================================================================

// Base preset coordinates & persistent user offset vectors
const basePos = new THREE.Vector3(0, 40, 500);
const baseTarget = new THREE.Vector3(0, 35, 0);
const userOffsetPos = new THREE.Vector3(0, 0, 0);
const userOffsetTarget = new THREE.Vector3(0, 0, 0);
const effCamPos = new THREE.Vector3();
const effCamTarget = new THREE.Vector3();

let isUserInteracting = false;
let interactionTimeout = null;

function markUserInteracting() {
  isUserInteracting = true;
  userOffsetPos.subVectors(camera.position, basePos);
  userOffsetTarget.subVectors(controls.target, baseTarget);
  if (interactionTimeout) clearTimeout(interactionTimeout);
  interactionTimeout = setTimeout(() => {
    userOffsetPos.subVectors(camera.position, basePos);
    userOffsetTarget.subVectors(controls.target, baseTarget);
    isUserInteracting = false;
  }, 220);
}

controls.addEventListener('start', () => {
  markUserInteracting();
});

controls.addEventListener('change', () => {
  if (isUserInteracting) {
    userOffsetPos.subVectors(camera.position, basePos);
    userOffsetTarget.subVectors(controls.target, baseTarget);
  }
});

controls.addEventListener('end', () => {
  userOffsetPos.subVectors(camera.position, basePos);
  userOffsetTarget.subVectors(controls.target, baseTarget);
  if (interactionTimeout) clearTimeout(interactionTimeout);
  interactionTimeout = setTimeout(() => {
    userOffsetPos.subVectors(camera.position, basePos);
    userOffsetTarget.subVectors(controls.target, baseTarget);
    isUserInteracting = false;
  }, 220);
});

renderer.domElement.addEventListener('wheel', () => {
  markUserInteracting();
}, { passive: true });

renderer.domElement.addEventListener('pointerdown', () => {
  markUserInteracting();
});

// Maglev car geometry
function maglevGeo(len, w, h, noseF, noseB){
  const P = [], seg = (a,b) => P.push(a,b), half = len/2;
  const rect = (z,ww,hh,y0) => [[-ww/2,y0,z],[ww/2,y0,z],[ww/2,y0+hh,z],[-ww/2,y0+hh,z]];
  const loop = r => { for (let i=0;i<4;i++) seg(r[i], r[(i+1)%4]); };
  const join = (a,b) => { for (let i=0;i<4;i++) seg(a[i], b[i]); };
  const A = rect(-half,w,h,0), B = rect(half,w,h,0); loop(A); loop(B); join(A,B);
  for (const [sgn,on] of [[1,noseF],[-1,noseB]]){
    if (!on) continue;
    const r1 = rect(sgn*(half+2.2), w*.82, h*.78, h*.08), r2 = rect(sgn*(half+4.2), w*.5, h*.42, h*.26), tip = [0, h*.42, sgn*(half+5.8)];
    const base = sgn>0 ? B : A; loop(r1); loop(r2); join(base,r1); join(r1,r2); r2.forEach(v => seg(v, tip));
    seg([0,h*.42,sgn*(half+4.2)], [0,h*.08,sgn*(half+3.0)]);
  }
  for (const x of [-w/2, w/2]){ seg([x,h*.62,-half],[x,h*.62,half]); seg([x,h*.72,-half],[x,h*.72,half]); seg([x,h*.18,-half],[x,h*.18,half]); }
  for (let z=-half+1.5; z<half; z+=2.2) for (const x of [-w/2,w/2]) seg([x,h*.62,z],[x,h*.72,z]);
  seg([0,h,-half],[0,h,half]);
  return segGeo(P);
}

// Subway box geometry
function boxTrainGeo(len, w, h, head, tail){
  const P = [], seg = (a,b) => P.push(a,b), hl = len/2, x = w/2, y0 = .3, c = .34;
  const oct = (z, sx=1, sy=1, yo=0) => { const xx = x*sx, hh = h*sy, cc = c*Math.min(sx,sy), yb = y0+yo;
    return [[-xx+cc,yb,z],[xx-cc,yb,z],[xx,yb+cc,z],[xx,yb+hh-cc,z],[xx-cc,yb+hh,z],[-xx+cc,yb+hh,z],[-xx,yb+hh-cc,z],[-xx,yb+cc,z]]; };
  const loop = r => { for (let i=0;i<8;i++) seg(r[i], r[(i+1)%8]); }, join = (a,b) => { for (let i=0;i<8;i++) seg(a[i], b[i]); };
  const A = oct(-hl), B = oct(hl); loop(A); loop(B); join(A,B);
  const wb = y0 + h*.42, wt = y0 + h*.82, dz = hl*.48, dw = .5;
  for (const sd of [-1,1]){
    seg([sd*x,wb,-hl],[sd*x,wb,hl]); seg([sd*x,wt,-hl],[sd*x,wt,hl]);
    for (let z=-hl+2.2; z<hl-1; z+=2.8){ seg([sd*x,wb,z],[sd*x,wt,z]); seg([sd*x,wb,z+.12],[sd*x,wt,z+.12]); }
    for (const zc of [-dz, dz]){ seg([sd*x,y0+.06,zc-dw],[sd*x,wt+.15,zc-dw]); seg([sd*x,y0+.06,zc+dw],[sd*x,wt+.15,zc+dw]); seg([sd*x,wt+.15,zc-dw],[sd*x,wt+.15,zc+dw]); seg([sd*x,wb-.3,zc-dw],[sd*x,wb-.3,zc+dw]); }
    seg([sd*(x-.05),y0+.12,-hl+.3],[sd*(x-.05),y0+.12,hl-.3]);
    seg([sd*(x-c*.5),y0+h,-hl+1],[sd*(x-c*.5),y0+h,hl-1]);
  }
  seg([0,y0+h+.02,-hl+.8],[0,y0+h+.02,hl-.8]);
  const pod = [[-.5,y0+h,-hl*.55],[.5,y0+h,-hl*.55],[.5,y0+h+.16,-hl*.55+.3],[-.5,y0+h+.16,-hl*.55+.3],[-.5,y0+h,hl*.55],[.5,y0+h,hl*.55],[.5,y0+h+.16,hl*.55-.3],[-.5,y0+h+.16,hl*.55-.3]];
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([i,j]) => seg(pod[i],pod[j]));
  for (const [sg,on] of [[1,head],[-1,tail]]){
    if (on){
      const R1 = oct(sg*(hl+1.3), .86, .84, .05), R2 = oct(sg*(hl+2.1), .62, .55, .12);

function walkPathOpen(y, legs){
  const pts = []; let x = ri(1,N-1), z = ri(1,N-1), last = [0,0];
  const push = (xx, zz) => pts.push(new THREE.Vector3(RP(xx), y, RP(zz)));
  push(x, z);
  for (let s=0;s<legs;s++){
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]].filter(d => !(d[0]===-last[0] && d[1]===-last[1]));
    const d = dirs[ri(0,dirs.length-1)], st = ri(2,4);
    const nx = Math.min(N, Math.max(0, x + d[0]*st)), nz = Math.min(N, Math.max(0, z + d[1]*st));
    if (nx===x && nz===z) continue;
    const dx = Math.sign(nx-x), dz = Math.sign(nz-z), n = Math.abs(nx-x)+Math.abs(nz-z);
    for (let k=1;k<=n;k++) push(x+dx*k, z+dz*k);
    x = nx; z = nz; last = d;
  }
  if (pts.length < 4 && (walkPathOpen.tries = (walkPathOpen.tries||0)+1) < 12) return walkPathOpen(y, legs);
  walkPathOpen.tries = 0;
  const c = new THREE.CatmullRomCurve3(pts, false, 'centripetal'); c.arcLengthDivisions = 800; return c;
}

    quad.forEach((q,i) => { const r = quad[(i+1)%4]; seg([q[0],q[1],4],[r[0],r[1],4]); seg([q[0],q[1],-PL],[r[0],r[1],-PL]); seg([q[0],q[1],4],[q[0],q[1],-PL]); });

function runCameraPreset(name, dt, delta, t) {
  if (name === 'Static (Zero Camera Movement)' || params.cameraFollowMode === 'Stationary / Hold Position') {
    controls.update();
    basePos.copy(camera.position);
    baseTarget.copy(controls.target);
    userOffsetPos.set(0, 0, 0);
    userOffsetTarget.set(0, 0, 0);
    return;
  }

  // 1. Calculate nominal preset trajectory
  if (name === 'Autopilot City Spline (Default)') {
    const st = tour[sIdx];
    cruise += (st.spd * params.animationSpeed - cruise) * Math.min(1, dt * 1.1);
    sU += dt * cruise / st.len;
    if (sU >= 1) { sIdx = (sIdx + 1) % tour.length; sU = 0; }
    st.curve.getPointAt(Math.min(sU, 1), basePos);
    st.curve.getPointAt(Math.min(1, sU + 0.02), baseTarget);
  } else if (name === 'Slow Rooftop Panoramic Orbit') {
    const r = 360, ang = t * 0.06 * params.animationSpeed;
    const camX = Math.cos(ang) * r, camZ = Math.sin(ang) * r;
    const camY = 160 + Math.sin(t * 0.08) * 20;
    basePos.set(camX, camY, camZ);
    baseTarget.set(0, 35, 0);
  } else if (name === 'Low-Altitude Boulevard Glide') {
    const pathZ = ((t * 22 * params.animationSpeed) % (EXT * 2)) - EXT;
    const pathX = RP(Math.floor(N / 2));
    const camY = 16 + Math.sin(t * 0.4) * 2;
    basePos.set(pathX + 2, camY, pathZ);
    baseTarget.set(pathX, camY + 2, pathZ + 60);
  } else if (name === 'Skyline Lissajous Figure') {
    const lx = Math.sin(t * 0.07 * params.animationSpeed) * 320;
    const lz = Math.cos(t * 0.05 * params.animationSpeed) * 320;
    const ly = 240 + Math.sin(t * 0.1) * 70;
    basePos.set(lx, ly, lz);
    baseTarget.set(0, 30, 0);
  } else if (name === 'Subway to Stratosphere Elevator') {
    const cycle = (Math.sin(t * 0.08 * params.animationSpeed) * 0.5 + 0.5);
    const elevY = -30 + Math.pow(cycle, 1.4) * 480;
    const elevX = RP(3) + Math.cos(t * 0.04) * 60;
    const elevZ = RP(3) + Math.sin(t * 0.04) * 60;
    basePos.set(elevX, elevY, elevZ);
    baseTarget.set(RP(3) + 20, Math.max(0, elevY - 30), RP(3) + 20);
  } else if (name === 'Hypnotic Spiral Descent') {
    const spiralPhase = (t * 0.05 * params.animationSpeed) % (Math.PI * 4);
    const progress = (Math.sin(t * 0.06 * params.animationSpeed) * 0.5 + 0.5);
    const spiralR = 150 + progress * 260;
    const spiralY = 60 + progress * 280;
    basePos.set(Math.cos(spiralPhase) * spiralR, spiralY, Math.sin(spiralPhase) * spiralR);
    baseTarget.set(0, 45, 0);
  } else if (name === 'Patrol Walker Escort') {
    const wq = mechCurve.getPointAt(mU);
    const camX = wq.x + 40 * Math.cos(t * 0.1);
    const camZ = wq.z + 40 * Math.sin(t * 0.1);
    const camY = 32 + Math.sin(t * 0.2) * 5;
    basePos.set(camX, camY, camZ);
    baseTarget.set(wq.x, 14, wq.z);
  }

  // 2. While user is actively dragging / zooming, let OrbitControls handle it and update offset
  if (isUserInteracting) {
    controls.update();
    userOffsetPos.subVectors(camera.position, basePos);
    userOffsetTarget.subVectors(controls.target, baseTarget);
    return;
  }

  // 3. Autonomous camera flight: smoothly apply base trajectory + user's persistent offset
  effCamPos.copy(basePos).add(userOffsetPos);
  effCamTarget.copy(baseTarget).add(userOffsetTarget);

  const lerpAlpha = Math.min(1, delta * 7.5);
  camera.position.lerp(effCamPos, lerpAlpha);
  controls.target.lerp(effCamTarget, lerpAlpha);
  controls.update();
}

  planes.forEach(pl => {
    pl.g.traverse(o => {
      if (o.isLine || o.isLineSegments) o.material.color.copy(accent1Col);
    });
    if (pl.trail && pl.trail.material) pl.trail.material.color.copy(accent1Col);
  });
  mechGroup.traverse(o => {
    if (o.isLine || o.isLineSegments) o.material.color.copy(accent1Col);
  });
}

function applyColorScheme(name) {
  const sc = COLOR_SCHEMES[name] || COLOR_SCHEMES['Original'];
  params.colorScheme = name;
  params.primaryColor = sc.primary;
  params.secondaryColor = sc.secondary;
  params.accent1Color = sc.accent1;
  params.accent2Color = sc.accent2;
  params.accent3Color = sc.accent3;
  params.bgColor = sc.bg;

  updateCityColors();
}

  applyColorScheme(randomScheme);

  // Randomize motion & animation
  params.animationSpeed = +(0.6 + Math.random() * 1.6).toFixed(2);
  params.animationPreset = ANIMATION_PRESETS[ri(0, ANIMATION_PRESETS.length - 1)];
  userOffsetPos.set(0, 0, 0);

  params.exposure = +(0.75 + Math.random() * 0.7).toFixed(2);
  params.sceneLightIntensity = +(0.8 + Math.random() * 0.8).toFixed(2);
  params.keyLightIntensity = +(0.8 + Math.random() * 1.5).toFixed(2);
  params.fillLightIntensity = +(0.4 + Math.random() * 0.9).toFixed(2);
  params.rimLightIntensity = +(0.5 + Math.random() * 1.2).toFixed(2);

  // Update light objects
  updateLights();

  // IMPORTANT: DO NOT TOUCH postProcessor.settings!
  // Refresh GUI controllers display
  if (gui) {
    gui.controllersRecursive().forEach(c => {
      if (c.parent && c.parent._title === "Post-Processing Pipeline") return;
      c.updateDisplay();
    });
  }
}

// =========================================================================================
// MAIN ANIMATION LOOP
// =========================================================================================
const clock = new THREE.Clock();
let t = 0;

function frame() {
  requestAnimationFrame(frame);
  const delta = Math.min(0.05, clock.getDelta());
  const dt = delta * params.animationSpeed;
  t += dt;

  // 1. Camera Movement
  runCameraPreset(params.animationPreset, dt, delta, t);

  // 2. Tower Shaders
  for (const n of nodes) {
    const u = n.u; if (!u) continue;
    u.uT.value = t; u.uOff.value.x += n.sh * dt; u.uOff.value.y -= n.sv * dt;
    let br = n.bright, gl = 0, sw = 0, sc = 0, rv = 0, stVal = 0;
    switch (n.kind){
      case 'strobe': br *= (Math.sin(t*n.rate*4 + n.phase) > 0) ? 1.3 : .12; break;
      case 'pulse': br *= .45 + .55*(.5 + .5*Math.sin(t*n.rate + n.phase)); break;
      case 'flicker': br *= (Math.random() < .06) ? .1 : 1; break;
      case 'glitch': { const ph = (t + n.phase) % n.period; if (ph < .35){ gl = .5 + .5*Math.random(); br *= 1.3; } break; }
      case 'swap': sw = n.rate; break;
      case 'scan': sc = n.rate*.12; break;
      case 'reveal': rv = n.rate*.06; break;
      case 'static': stVal = .8; break;
    }
    if (n.red){ gl = Math.max(gl, .35 + .35*Math.random()); stVal = .5; }
    u.uA.value.set(br, gl, sw, sc);
    u.uB.value.set(rv, n.solid, stVal, 0);
  }

  // 3. Cars
  for (let i=0;i<CN;i++){
    const c = carData[i]; c.s += c.v * c.dir * dt; if (c.s > EXT) c.s = -EXT; if (c.s < -EXT) c.s = EXT;
    const x = c.axis===0 ? c.s : c.p + c.lane, z = c.axis===0 ? c.p + c.lane : c.s;
    c.obj.position.set(x, .15 + Math.sin(t*3+i)*.08, z); c.obj.rotation.y = c.axis===0 ? (c.dir>0 ? Math.PI/2 : -Math.PI/2) : (c.dir>0 ? 0 : Math.PI);
    const fx = c.axis===0 ? c.dir : 0, fz = c.axis===0 ? 0 : c.dir, lx = -fz, lz = fx;
    const y = c.obj.position.y, [Fw,Fy,Fz] = c.veh.front, [Rw,Ry,Rz] = c.veh.rear;
    lightPos.set([
      x+fx*Fz+lx*Fw, y+Fy, z+fz*Fz+lz*Fw, x+fx*Fz-lx*Fw, y+Fy, z+fz*Fz-lz*Fw,
      x+fx*Rz+lx*Rw, y+Ry, z+fz*Rz+lz*Rw, x+fx*Rz-lx*Rw, y+Ry, z+fz*Rz-lz*Rw ], i*12);
  }
  lightGeo.attributes.position.needsUpdate = true;

  // 4. Monorails
  for (const tr of trains){
    if (tr.wait > 0) tr.wait -= dt;
    else { tr.t += tr.v*tr.dir*dt; if (tr.t >= tr.hi){ tr.t = tr.hi; tr.dir = -1; tr.wait = rr(2.5,5); } if (tr.t <= tr.lo){ tr.t = tr.lo; tr.dir = 1; tr.wait = rr(2.5,5); } }
    tr.cars.forEach((c, i) => {
      const u = tr.t - i*tr.gap, u2 = Math.min(1, u + .002);
      tr.curve.getPointAt(u, q1); tr.curve.getPointAt(u2, q2); q1.y += .5; q2.y += .5;
      const nx = -(q2.z-q1.z), nz = (q2.x-q1.x), nl = Math.hypot(nx,nz)||1;
      q1.x += nx/nl*tr.off; q1.z += nz/nl*tr.off; q2.x += nx/nl*tr.off; q2.z += nz/nl*tr.off; c.position.copy(q1); c.lookAt(q2);
    });
  }

  // 5. Subways
  for (const sb of subways){
    sb.s += sb.v*dt; if (sb.s > EXT+40) sb.s = -EXT-40; if (sb.s < -EXT-40) sb.s = EXT+40;
    sb.cars.forEach((c, i) => {
      const s = sb.s - Math.sign(sb.v)*i*8.3;
      const fw = sb.v > 0;
      if (sb.axis===0){ c.position.set(s, sb.y-2.2, sb.p+sb.o); c.rotation.y = fw ? Math.PI/2 : -Math.PI/2; } else { c.position.set(sb.p+sb.o, sb.y-2.2, s); c.rotation.y = fw ? 0 : Math.PI; }
    });
  }
  for (const tr of curvedSubs){
    if (tr.wait > 0) tr.wait -= dt;
    else { tr.t += tr.v*tr.dir*dt; if (tr.t >= tr.hi){ tr.t = tr.hi; tr.dir = -1; tr.wait = rr(2,5); } if (tr.t <= tr.lo){ tr.t = tr.lo; tr.dir = 1; tr.wait = rr(2,5); } }
    tr.cars.forEach((c2, i) => {
      const u = Math.max(0, tr.t - i*(8.2/tr.len)), u2 = Math.min(1, u + .002);
      tr.curve.getPointAt(u, q1); tr.curve.getPointAt(u2, q2); q1.y -= 1.2; q2.y -= 1.2;
      const nx = -(q2.z-q1.z), nz = (q2.x-q1.x), nl = Math.hypot(nx,nz) || 1;
      q1.x += nx/nl*tr.off; q1.z += nz/nl*tr.off; q2.x += nx/nl*tr.off; q2.z += nz/nl*tr.off;
      c2.position.copy(q1); c2.lookAt(q2);
    });
  }

  // 6. Aircraft
  for (const pl of planes){
    pl.pos.addScaledVector(pl.dir, pl.v*dt); pl.g.position.copy(pl.pos);
    if (Math.abs(pl.pos.x) > 1000 || Math.abs(pl.pos.z) > 1000) spawnPlane(pl, false);
    for (let k=TRAIL-1;k>0;k--) pl.tp.copyWithin(k*3, (k-1)*3, k*3);
    pl.tp.set([pl.pos.x - pl.dir.x*16*pl.sc, pl.pos.y - 1.5*pl.sc, pl.pos.z - pl.dir.z*16*pl.sc], 0);
    pl.trail.geometry.attributes.position.needsUpdate = true;
    pl.navPts.material.opacity = ((t + pl.blink) % 1.2) < .12 ? 1 : .45;
  }

  // 7. Lifts
  for (const L of lifts){
    if (L.wait > 0) L.wait -= dt;
    else {
      L.y += L.v*dt;
      if (L.y >= L.y1){ L.y = L.y1; L.v = -Math.abs(L.v); L.wait = rr(1, 2.2); }
      if (L.y <= L.y0){ L.y = L.y0; L.v = Math.abs(L.v); L.wait = rr(1, 2.2); }
    }
    L.cab.position.y = L.y + L.ch/2;
    L.cable.geometry.attributes.position.setY(1, L.y + L.ch);
    L.cable.geometry.attributes.position.needsUpdate = true;
  }

  // 8. Drones & Flashing Lights
  for (const d of drones){
    const a = t*d.w + d.ph;
    d.g.position.set(d.cx + Math.cos(a)*d.r, d.y + Math.sin(t*1.3+d.ph)*1.5, d.cz + Math.sin(a)*d.r);
    d.g.rotation.y = t*3; d.lt.material.opacity = ((t + d.bl) % .9) < .1 ? 1 : .2;
  }
  avLights.material.opacity = (t % 1.6) < .15 ? 1 : .25;

  // 9. Patrol Mech
  mU = (mU + dt*MECH_SPD/mechLen) % 1; mPhase += dt*MECH_SPD/STRIDE*Math.PI;
  mechCurve.getPointAt(mU, q1); mechCurve.getPointAt((mU+.004)%1, q2);
  mechGroup.position.set(q1.x, 0, q1.z); mechGroup.lookAt(q2.x, 0, q2.z);
  hips.position.y = 11.2 + Math.abs(Math.sin(mPhase))*.35 - .15;
  for (let i=0;i<2;i++){
    const p = mPhase + i*Math.PI, hip = Math.sin(p)*.4, kb = Math.max(0, Math.cos(p))*.8;
    legPivots[i].rotation.x = -.45 - hip;
    kneePivots[i].rotation.x = 1.05 + kb;
    anklePivots[i].rotation.x = -.95 - kb*.6 + hip*.5;
    footPivots[i].rotation.x = .35 - hip*.4 - kb*.3;
    armPivots[i].rotation.x = Math.sin(p)*.18; forePivots[i].rotation.x = (i===1 ? .12 : -.55) - Math.max(0,Math.sin(p))*.1;
  }

  // 10. Pedestrians
  for (let i=0;i<PED_N;i++){
    const pd = peds[i]; pd.s += pd.v*pd.dir*dt;
    if (pd.mode === 'platform'){
      if (pd.s > pd.smax || pd.s < pd.smin){ pd.dir *= -1; pd.s = Math.max(pd.smin, Math.min(pd.smax, pd.s)); pedDir.set(pd.axis===0 ? [pd.dir,0] : [0,pd.dir], i*2); pedGeo.attributes.aDir.needsUpdate = true; }
      pedPos[i*3] = pd.axis===0 ? pd.s : pd.p; pedPos[i*3+1] = pd.y; pedPos[i*3+2] = pd.axis===0 ? pd.p : pd.s; continue;
    }
    if (pd.s > EXT) pd.s = -EXT; if (pd.s < -EXT) pd.s = EXT;
    pedPos[i*3] = pd.axis===0 ? pd.s : pd.p; pedPos[i*3+1] = .12; pedPos[i*3+2] = pd.axis===0 ? pd.p : pd.s;
  }
  pedGeo.attributes.aPos.needsUpdate = true;
  pedMat.uniforms.uT.value = t;
  pedMat.uniforms.uFog.value.copy(scene.fog.color);

  // 11. Fog Adjustment
  scene.fog.density = .0052*(1 - .86*Math.min(1, Math.max(0, (camera.position.y-60)/300)));

  // Render Scene through PostProcessor Suite
  postProcessor.renderScene(scene, camera);
}

// Initial theme application
applyColorScheme('Original');
updateLights();

// Start Loop
frame();
</script>
