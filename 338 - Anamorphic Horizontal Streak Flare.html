<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anamorphic Horizontal Streak Flare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl-canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #webgl-canvas-container:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="webgl-canvas-container"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =============================================================
    // POST PROCESSOR SUITE (from postprocessing/PostProcessor.js)
    // =============================================================
    const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

    const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

    const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

    const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

    const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

    const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

    const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.0001) return uv;
  vec2 p = uv - 0.5;
  float d = length(p);
  if (d > radius * 1.5) return uv;
  float r = d / max(radius, 0.001);
  float theta = atan(p.y, p.x);
  float rDist = r + strength * (r * r * r);
  return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / gamma);
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}
void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
  fragColor.a = 1.0;
}
`;

    const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.75,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.45,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.25,
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Fisheye");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

        glow: '#888888',
        ghost: '#555555',
        bg: '#141414'
      },
      'Neutral + accent': {
        core: '#ffffff',
        streak: '#ff5400',
        glow: '#4a5b68',
        ghost: '#8fa4b2',
        bg: '#0a0e14'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C)': {
        core: '#ffffff',
        streak: '#F6AA1C',
        glow: '#BC3908',
        ghost: '#941B0C',
        bg: '#220901'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E)': {
        core: '#ffffff',
        streak: '#63D1CF',
        glow: '#5BC0BE',
        ghost: '#4BAD9E',
        bg: '#0B132B'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6)': {
        core: '#ffffff',
        streak: '#AA60C8',
        glow: '#D69ADE',
        ghost: '#C9A3C6',
        bg: '#0D001D'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189)': {
        core: '#ffffff',
        streak: '#FEF1BE',
        glow: '#FFBA00',
        ghost: '#008189',
        bg: '#061210'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894)': {
        core: '#ffffff',
        streak: '#D4FFB0',
        glow: '#7FFF00',
        ghost: '#00B894',
        bg: '#05140A'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A)': {
        core: '#ffffff',
        streak: '#FFE8CC',
        glow: '#FF8C00',
        ghost: '#C7501A',
        bg: '#0E0618'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8)': {
        core: '#ffffff',
        streak: '#E8E0FF',
        glow: '#B38FFF',
        ghost: '#6A3DE8',
        bg: '#090612'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078)': {
        core: '#ffffff',
        streak: '#E0FBFF',
        glow: '#00F0FF',
        ghost: '#D40078',
        bg: '#05020F'
      }
    };

    // --- 8 PRECONFIGURED ANIMATIONS ---
    const ANIMATIONS = [
      'Static (No Movement)',
      'Gentle Orbit',
      'Cosmic Wobble / Breathing',
      'Horizontal Sweep',
      'Figure-8 Infinity Drift',
      'Deep Pulse & Roll',
      'Elliptical Float',
      'Light Ray Precession'
    ];

    // Master settings object
    const params = {
      colorScheme: 'Monochromatic',
      animation: 'Gentle Orbit',
      animSpeed: 1.0,
      randomizeOnClick: true,
      greenscreen: false,
      exposure: 1.2,
      dpr: Math.min(window.devicePixelRatio, 2.0),
      antialias: true,

      // Optical flare parameters
      streakSharpness: 1100.0,
      streakLength: 1.0,
      streakBrightness: 1.5,
      edgeRollOff: 0.16,
      chromaticDispersion: 1.2,
      coreStarburst: 1.0,
      ghostIntensity: 0.85,
      dustIntensity: 1.0,

      // Active color overrides
      coreColor: COLOR_SCHEMES['Monochromatic'].core,
      streakColor: COLOR_SCHEMES['Monochromatic'].streak,
      glowColor: COLOR_SCHEMES['Monochromatic'].glow,
      ghostColor: COLOR_SCHEMES['Monochromatic'].ghost,
      bgColor: COLOR_SCHEMES['Monochromatic'].bg
    };

    const container = document.getElementById('webgl-canvas-container');

    // Scene & Camera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8.5);

    // Renderer
    let renderer;
    let controls;
    let postProcessor;

    function initRenderer(antialias) {
      if (renderer) {
        const oldCanvas = renderer.domElement;
        if (oldCanvas && oldCanvas.parentNode) {
          oldCanvas.parentNode.removeChild(oldCanvas);
        }
        renderer.dispose();
      }

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      container.appendChild(renderer.domElement);

      if (controls) controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.enablePan = true;
      controls.screenSpacePanning = true;
      controls.minDistance = 2.0;
      controls.maxDistance = 30.0;

      setupInteractionListeners(renderer.domElement);

      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    }

    // --- 3D SCENE OBJECTS ---
    // Centralized point source group
    const flareAnchor = new THREE.Group();
    scene.add(flareAnchor);

    // Invisible grab mesh for raycaster interaction (allows dragging the flare across the screen)
    const grabGeom = new THREE.SphereGeometry(0.8, 16, 16);
    const grabMat = new THREE.MeshBasicMaterial({ visible: false });
    const grabMesh = new THREE.Mesh(grabGeom, grabMat);
    flareAnchor.add(grabMesh);

    // 3. Floating 3D Anamorphic Bokeh Dust Particles
    const dustCount = 350;
    const dustPositions = new Float32Array(dustCount * 3);
    const dustScales = new Float32Array(dustCount);
    for (let i = 0; i < dustCount; i++) {
      const radius = 0.5 + Math.random() * 3.8;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      dustPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      dustPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.75;
      dustPositions[i * 3 + 2] = radius * Math.cos(phi);
      dustScales[i] = 0.5 + Math.random() * 1.5;
    }

    const dustGeometry = new THREE.BufferGeometry();
    dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    dustGeometry.setAttribute('aScale', new THREE.BufferAttribute(dustScales, 1));

    const dustShaderMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uColor: { value: new THREE.Color(params.streakColor) },
        uOpacity: { value: params.dustIntensity * 0.65 }
      },
      vertexShader: `
        attribute float aScale;
        varying float vDistance;
        void main() {
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          vDistance = length(position);
          gl_PointSize = (18.0 * aScale / -mvPosition.z) * (1.0 + 0.5 * sin(position.x * 2.0));
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform float uOpacity;
        varying float vDistance;
        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          // Anamorphic horizontal oval bokeh:
          coord.y *= 2.1;
          float r = length(coord);
          if (r > 0.5) discard;
          float glow = smoothstep(0.5, 0.0, r);
          gl_FragColor = vec4(uColor, glow * uOpacity / (1.0 + vDistance * 0.4));
        }
      `
    });
    const dustParticles = new THREE.Points(dustGeometry, dustShaderMaterial);
    flareAnchor.add(dustParticles);

    // --- THE HERO ANAMORPHIC HORIZONTAL STREAK & OPTICAL FLARE SHADER ---
    // A fullscreen composite pass executed right in the scene attached to camera
    const flareQuadGeom = new THREE.PlaneGeometry(2, 2);
    const flareShaderMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uLightScreenPos: { value: new THREE.Vector2(0.5, 0.5) },
        uLightInFront: { value: 1.0 },
        uLightDistance: { value: 8.5 },
        uCoreColor: { value: new THREE.Color(params.coreColor) },
        uStreakColor: { value: new THREE.Color(params.streakColor) },
        uGlowColor: { value: new THREE.Color(params.glowColor) },
        uGhostColor: { value: new THREE.Color(params.ghostColor) },
        uStreakSharpness: { value: params.streakSharpness },
        uStreakLength: { value: params.streakLength },
        uStreakBrightness: { value: params.streakBrightness },
        uEdgeRollOff: { value: params.edgeRollOff },
        uChromaticDispersion: { value: params.chromaticDispersion },
        uCoreStarburst: { value: params.coreStarburst },
        uGhostIntensity: { value: params.ghostIntensity },
        uExposure: { value: params.exposure },
        uTime: { value: 0.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;

        uniform vec2 uResolution;
        uniform vec2 uLightScreenPos;
        uniform float uLightInFront;
        uniform float uLightDistance;
        uniform vec3 uCoreColor;
        uniform vec3 uStreakColor;
        uniform vec3 uGlowColor;
        uniform vec3 uGhostColor;
        uniform float uStreakSharpness;
        uniform float uStreakLength;
        uniform float uStreakBrightness;
        uniform float uEdgeRollOff;
        uniform float uChromaticDispersion;
        uniform float uCoreStarburst;
        uniform float uGhostIntensity;
        uniform float uExposure;
        uniform float uTime;

        // Subtle pseudo-noise striations for vintage anamorphic cylindrical glass
        float glassStriation(float x, float seed) {
          return 0.94 + 0.06 * sin(x * 1200.0 + seed) * sin(x * 340.0);
        }

        // Anamorphic oval ghost artifact function
        float anamorphicGhost(vec2 uv, vec2 center, vec2 size) {
          vec2 d = (uv - center) / size;
          float r = length(d);
          return smoothstep(1.0, 0.0, r) * exp(-r * 2.8);
        }

        void main() {
          if (uLightInFront < 0.0) {
            discard;
          }

          float aspect = uResolution.x / uResolution.y;
          vec2 uv = vUv;
          vec2 lightPos = uLightScreenPos;

          // Distance falloff from light to camera
          float distFactor = clamp(12.0 / (uLightDistance + 3.0), 0.35, 2.5);

          // 1. NEEDLE-SHARP ANAMORPHIC HORIZONTAL STREAK
          // Vertical distance from light's horizontal beam line
          float dy = (uv.y - lightPos.y) * aspect;
          float dx = abs(uv.x - lightPos.x);

          // Edge roll-off: gentle roll-off at the left and right screen borders
          float rollMargin = max(0.01, uEdgeRollOff);
          float edgeRoll = smoothstep(0.0, rollMargin, uv.x) * smoothstep(1.0, 1.0 - rollMargin, uv.x);

          // Horizontal beam extension across the entire field of view
          float hDecay = 1.0 / (1.0 + (dx / max(0.01, uStreakLength)) * 0.45);
          float glassLines = glassStriation(uv.x, uTime * 0.5);

          // Chromatic dispersion offsets (RGB split at streak edges)
          float disp = (uChromaticDispersion * 0.0018) / aspect;

          // Red, Green, Blue channel needle profiles
          float dyR = abs((uv.y - lightPos.y + disp) * aspect);
          float dyG = abs(dy);
          float dyB = abs((uv.y - lightPos.y - disp) * aspect);

          // High-precision razor-sharp core falloff
          float sR_core = exp(-dyR * uStreakSharpness) * 2.2;
          float sG_core = exp(-dyG * uStreakSharpness) * 2.2;
          float sB_core = exp(-dyB * uStreakSharpness) * 2.2;

          // Secondary softer horizontal glow ribbon
          float sR_soft = exp(-dyR * (uStreakSharpness * 0.12)) * 0.55;
          float sG_soft = exp(-dyG * (uStreakSharpness * 0.12)) * 0.55;
          float sB_soft = exp(-dyB * (uStreakSharpness * 0.12)) * 0.55;

          // Diffuse anamorphic bloom bar
          float s_wide = exp(-abs(dy) * (uStreakSharpness * 0.025)) * 0.22;

          vec3 streakRGB;
          streakRGB.r = (sR_core + sR_soft) * uStreakColor.r;
          streakRGB.g = (sG_core + sG_soft) * uStreakColor.g;
          streakRGB.b = (sB_core + sB_soft) * uStreakColor.b;
          streakRGB += s_wide * uGlowColor;

          vec3 finalStreak = streakRGB * hDecay * edgeRoll * glassLines * uStreakBrightness * distFactor;

          // 2. CENTRAL POINT SOURCE STARBURST & CORONA
          vec2 toPoint = (uv - lightPos);
          toPoint.y *= aspect;
          float pointDist = length(toPoint);

          // Brilliant optical pinpoint core & smooth corona bloom
          float pointCore = exp(-pointDist * 65.0) * 3.2;
          float pointGlow = exp(-pointDist * 16.0) * 0.95;
          float pointHalo = (0.016 / (pointDist + 0.007)) * 0.45;

          // Micro diffraction spikes
          float spikeAngle = atan(toPoint.y, toPoint.x);
          float spikes = pow(abs(cos(spikeAngle * 2.0)), 40.0) +
                        0.55 * pow(abs(sin((spikeAngle + 0.785) * 2.0)), 30.0);
          float starburst = spikes * exp(-pointDist * 18.0) * uCoreStarburst;

          vec3 centralLight = (pointCore * uCoreColor + (pointGlow + pointHalo + starburst) * uStreakColor) * distFactor;

          // 3. ANAMORPHIC OPTICAL GHOSTS
          // Ghosts reflect through the optical center (0.5, 0.5)
          vec2 screenCenter = vec2(0.5, 0.5);
          vec2 ghostVec = screenCenter - lightPos;
          vec3 ghostColorTotal = vec3(0.0);

          if (uGhostIntensity > 0.01) {
            // Oval ghost 1
            vec2 g1Pos = lightPos + ghostVec * 0.45;
            float g1 = anamorphicGhost(uv, g1Pos, vec2(0.08, 0.035 * aspect));
            ghostColorTotal += g1 * uGhostColor * 0.35;

            // Oval ghost 2 (opposite side)
            vec2 g2Pos = lightPos + ghostVec * 1.35;
            float g2 = anamorphicGhost(uv, g2Pos, vec2(0.14, 0.06 * aspect));
            ghostColorTotal += g2 * uGlowColor * 0.4;

            // Micro ring ghost 3
            vec2 g3Pos = lightPos + ghostVec * 0.85;
            float g3 = anamorphicGhost(uv, g3Pos, vec2(0.04, 0.018 * aspect));
            ghostColorTotal += g3 * uStreakColor * 0.5;

            // Soft wide iris ghost 4
            vec2 g4Pos = lightPos + ghostVec * 1.8;
            float g4 = anamorphicGhost(uv, g4Pos, vec2(0.22, 0.09 * aspect));
            ghostColorTotal += g4 * uGhostColor * 0.25;

            ghostColorTotal *= uGhostIntensity * distFactor;
          }

          // Composite total flare
          vec3 finalFlare = (finalStreak + centralLight + ghostColorTotal) * uExposure;

          // Soft clamp to prevent harsh burnouts
          gl_FragColor = vec4(finalFlare, clamp(length(finalFlare) * 0.5, 0.0, 1.0));
        }
      `
    });

    const flareQuad = new THREE.Mesh(flareQuadGeom, flareShaderMaterial);
    flareQuad.frustumCulled = false;

    // Camera rig for post quad to keep it locked to view
    const cameraRig = new THREE.Scene();
    const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    cameraRig.add(flareQuad);

    // --- APPLY COLOR SCHEME ---
    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;

      params.coreColor = scheme.core;
      params.streakColor = scheme.streak;
      params.glowColor = scheme.glow;
      params.ghostColor = scheme.ghost;
      params.bgColor = scheme.bg;

      updateMaterialColors();
      updateBackgroundColor();
    }

    function updateMaterialColors() {
      const coreCol = new THREE.Color(params.coreColor);
      const streakCol = new THREE.Color(params.streakColor);
      const glowCol = new THREE.Color(params.glowColor);
      const ghostCol = new THREE.Color(params.ghostColor);

      dustShaderMaterial.uniforms.uColor.value.copy(streakCol);

      flareShaderMaterial.uniforms.uCoreColor.value.copy(coreCol);
      flareShaderMaterial.uniforms.uStreakColor.value.copy(streakCol);
      flareShaderMaterial.uniforms.uGlowColor.value.copy(glowCol);
      flareShaderMaterial.uniforms.uGhostColor.value.copy(ghostCol);
    }

    function updateBackgroundColor() {
      if (params.greenscreen) {
        document.body.style.backgroundColor = '#00ff00';
        scene.background = new THREE.Color(0x00ff00);
      } else {
        document.body.style.backgroundColor = params.bgColor;
        scene.background = new THREE.Color(params.bgColor);
      }
    }

    // --- PROCEDURAL RANDOMIZATION ON CLICK ---
    function randomizeThemeAndParameters() {
      // Pick random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = randomScheme;
      applyColorScheme(randomScheme);

      // Randomize optical flare parameters
      params.streakSharpness = 600.0 + Math.random() * 1400.0;
      params.streakLength = 0.6 + Math.random() * 0.8;
      params.streakBrightness = 0.9 + Math.random() * 1.5;
      params.edgeRollOff = 0.08 + Math.random() * 0.25;
      params.chromaticDispersion = 0.4 + Math.random() * 2.2;
      params.coreStarburst = 0.4 + Math.random() * 1.4;
      params.ghostIntensity = 0.3 + Math.random() * 1.2;
      params.dustIntensity = 0.4 + Math.random() * 1.2;

      // Randomize motion speed & animation (excluding static)
      const animsWithoutStatic = ANIMATIONS.filter(a => !a.startsWith('Static'));
      params.animation = animsWithoutStatic[Math.floor(Math.random() * animsWithoutStatic.length)];
      params.animSpeed = 0.5 + Math.random() * 1.2;

      // Update shader uniforms
      flareShaderMaterial.uniforms.uStreakSharpness.value = params.streakSharpness;
      flareShaderMaterial.uniforms.uStreakLength.value = params.streakLength;
      flareShaderMaterial.uniforms.uStreakBrightness.value = params.streakBrightness;
      flareShaderMaterial.uniforms.uEdgeRollOff.value = params.edgeRollOff;
      flareShaderMaterial.uniforms.uChromaticDispersion.value = params.chromaticDispersion;
      flareShaderMaterial.uniforms.uCoreStarburst.value = params.coreStarburst;
      flareShaderMaterial.uniforms.uGhostIntensity.value = params.ghostIntensity;
      dustShaderMaterial.uniforms.uOpacity.value = params.dustIntensity * 0.65;

      // Refresh lil-gui displays
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- INTERACTION & DRAG HANDLING ---
    // Raycasting to allow dragging the light source directly across the screen
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const planeIntersect = new THREE.Vector3();

    let isDraggingObject = false;
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    function setupInteractionListeners(domElement) {
      domElement.addEventListener('pointerdown', onPointerDown);
      domElement.addEventListener('pointermove', onPointerMove);
      domElement.addEventListener('pointerup', onPointerUp);
    }

    function onPointerDown(e) {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(grabMesh, false);

      if (hits.length > 0) {
        isDraggingObject = true;
        controls.enabled = false;
        // Construct plane parallel to camera screen passing through flare
        const cameraDir = new THREE.Vector3();
        camera.getWorldDirection(cameraDir);
        dragPlane.setFromNormalAndCoplanarPoint(cameraDir.negate(), flareAnchor.position);
      }
    }

    function onPointerMove(e) {
      if (isDraggingObject) {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
          flareAnchor.position.copy(planeIntersect);
        }
      }
    }

    function onPointerUp(e) {
      if (isDraggingObject) {
        isDraggingObject = false;
        controls.enabled = true;
      }

      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const duration = performance.now() - pointerDownTime;

      // Click detected if mouse moved less than 6px and released within 400ms
      if (dist < 6 && duration < 400) {
        if (params.randomizeOnClick) {
          randomizeThemeAndParameters();
        }
      }
    }

    // --- LIL-GUI INITIALIZATION ---
    const gui = new GUI({ title: 'Anamorphic Flare Studio' });

    // 1. Presets & Themes
    const folderPresets = gui.addFolder('Presets & Animations');
    folderPresets.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(val => {
      applyColorScheme(val);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    folderPresets.add(params, 'animation', ANIMATIONS).name('Animation Mode');
    folderPresets.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    folderPresets.add(params, 'randomizeOnClick').name('Randomize on Click');

    // 2. Flare & Beam Optical Optics
    const folderOptics = gui.addFolder('Anamorphic Flare Optics');
    folderOptics.add(params, 'streakSharpness', 300.0, 2500.0, 10.0).name('Needle Sharpness').onChange(v => {
      flareShaderMaterial.uniforms.uStreakSharpness.value = v;
    });
    folderOptics.add(params, 'streakLength', 0.2, 2.0, 0.05).name('Streak Length').onChange(v => {
      flareShaderMaterial.uniforms.uStreakLength.value = v;
    });
    folderOptics.add(params, 'streakBrightness', 0.2, 3.5, 0.05).name('Streak Brightness').onChange(v => {
      flareShaderMaterial.uniforms.uStreakBrightness.value = v;
    });
    folderOptics.add(params, 'edgeRollOff', 0.02, 0.5, 0.01).name('Edge Roll-Off').onChange(v => {
      flareShaderMaterial.uniforms.uEdgeRollOff.value = v;
    });
    folderOptics.add(params, 'chromaticDispersion', 0.0, 3.0, 0.05).name('Chromatic Fringe').onChange(v => {
      flareShaderMaterial.uniforms.uChromaticDispersion.value = v;
    });
    folderOptics.add(params, 'coreStarburst', 0.0, 2.5, 0.05).name('Core Starburst').onChange(v => {
      flareShaderMaterial.uniforms.uCoreStarburst.value = v;
    });
    folderOptics.add(params, 'ghostIntensity', 0.0, 2.5, 0.05).name('Optical Ghosts').onChange(v => {
      flareShaderMaterial.uniforms.uGhostIntensity.value = v;
    });
    folderOptics.add(params, 'dustIntensity', 0.0, 2.5, 0.05).name('Bokeh Motes').onChange(v => {
      dustShaderMaterial.uniforms.uOpacity.value = v * 0.65;
    });

    // 3. Color Customization
    const folderColors = gui.addFolder('Color Settings');
    folderColors.addColor(params, 'coreColor').name('Core Color').onChange(updateMaterialColors);
    folderColors.addColor(params, 'streakColor').name('Streak Color').onChange(updateMaterialColors);
    folderColors.addColor(params, 'glowColor').name('Glow Color').onChange(updateMaterialColors);
    folderColors.addColor(params, 'ghostColor').name('Ghost Color').onChange(updateMaterialColors);
    folderColors.addColor(params, 'bgColor').name('Background').onChange(updateBackgroundColor);
    folderColors.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackgroundColor);

    // 4. Renderer & Scene Settings
    const folderRender = gui.addFolder('Render & Scene Settings');
    folderRender.add(params, 'exposure', 0.1, 4.0, 0.05).name('Exposure / Light').onChange(v => {
      if (renderer) renderer.toneMappingExposure = v;
      flareShaderMaterial.uniforms.uExposure.value = v;
    });
    folderRender.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => {
      if (renderer) renderer.setPixelRatio(v);
      if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    folderRender.add(params, 'antialias').name('Antialias').onChange(v => {
      initRenderer(v);
      updateBackgroundColor();
    });

    // Hide/Show UI with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Handle Window Resize
    window.addEventListener('resize', onWindowResize);
    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      if (renderer) {
        renderer.setSize(width, height);
      }
      flareShaderMaterial.uniforms.uResolution.value.set(width, height);
      if (postProcessor) {
        postProcessor.setSize(width, height, params.dpr);
      }
    }

    // --- INITIALIZATION ---
    initRenderer(params.antialias);

    // Initialize Post-Processing Suite from PostProcessor.js
    postProcessor = new PostProcessor(renderer, {
      bloomStrength: 0.65,
      bloomRadius: 0.4,
      bloomThreshold: 0.25,
      noiseIntensity: 0.012,
      vignetteBoost: 1.0,
      vignetteReduction: 0.4,
      chromaticAberration: 0.015
    });
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    postProcessor.attachGUI(gui);

    applyColorScheme(params.colorScheme);
    onWindowResize();

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    const lightWorldPos = new THREE.Vector3();
    const lightScreenNDC = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime() * params.animSpeed;

      // Update Controls
      if (controls) controls.update();

      // Floating dust particles gentle rotation
      dustParticles.rotation.y += delta * 0.15 * params.animSpeed;

      // Evaluate selected animation
      if (!isDraggingObject) {
        switch (params.animation) {
          case 'Static (No Movement)':
            // Static - stays anchored where placed
            break;

          case 'Gentle Orbit':
            // Smooth circular motion around origin
            flareAnchor.position.x = Math.sin(elapsed * 0.65) * 1.8;
            flareAnchor.position.y = Math.cos(elapsed * 0.45) * 0.55;
            flareAnchor.position.z = Math.cos(elapsed * 0.65) * 1.2;
            break;

          case 'Cosmic Wobble / Breathing':
            // Breathing oscillation in breadth and spatial pulsation
            flareAnchor.position.x = Math.sin(elapsed * 0.8) * 0.8;
            flareAnchor.position.y = Math.cos(elapsed * 1.1) * 0.45;
            flareAnchor.position.z = Math.sin(elapsed * 0.5) * 0.6;
            flareShaderMaterial.uniforms.uStreakBrightness.value =
              params.streakBrightness * (1.0 + 0.18 * Math.sin(elapsed * 2.2));
            break;

          case 'Horizontal Sweep':
            // Classic cinematic anamorphic camera pan across FOV
            flareAnchor.position.x = Math.sin(elapsed * 0.5) * 3.4;
            flareAnchor.position.y = Math.sin(elapsed * 0.25) * 0.3;
            flareAnchor.position.z = 0.0;
            break;

          case 'Figure-8 Infinity Drift':
            // Elegant Lissajous trajectory
            flareAnchor.position.x = Math.sin(elapsed * 0.6) * 2.4;
            flareAnchor.position.y = Math.sin(elapsed * 1.2) * 0.85;
            flareAnchor.position.z = Math.cos(elapsed * 0.6) * 0.9;
            break;

          case 'Deep Pulse & Roll':
            // Depth breathing with subtle roll
            flareAnchor.position.x = Math.sin(elapsed * 0.4) * 0.7;
            flareAnchor.position.y = Math.cos(elapsed * 0.6) * 0.5;
            flareAnchor.position.z = Math.sin(elapsed * 0.75) * 2.6;
            break;

          case 'Elliptical Float':
            // Wide elliptical glide
            flareAnchor.position.x = Math.cos(elapsed * 0.55) * 2.8;
            flareAnchor.position.y = Math.sin(elapsed * 0.35) * 0.75;
            flareAnchor.position.z = Math.sin(elapsed * 0.55) * 1.8;
            break;

          case 'Light Ray Precession':
            // Flare axial rotation and precession
            flareAnchor.position.x = Math.sin(elapsed * 0.5) * 1.2;
            flareAnchor.position.y = Math.sin(elapsed * 0.7) * 0.6;
            flareAnchor.position.z = Math.cos(elapsed * 0.4) * 0.5;
            flareShaderMaterial.uniforms.uStreakSharpness.value =
              params.streakSharpness * (1.0 + 0.12 * Math.sin(elapsed * 1.5));
            break;
        }
      }

      // Project 3D light beacon position to screen coordinates
      flareAnchor.getWorldPosition(lightWorldPos);
      lightScreenNDC.copy(lightWorldPos).project(camera);

      // Check if light is in front of camera
      const toLightCam = lightWorldPos.clone().sub(camera.position);
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      const isFront = toLightCam.dot(camDir) > 0 ? 1.0 : -1.0;

      const screenX = (lightScreenNDC.x + 1.0) * 0.5;
      const screenY = (lightScreenNDC.y + 1.0) * 0.5;

      flareShaderMaterial.uniforms.uLightScreenPos.value.set(screenX, screenY);
      flareShaderMaterial.uniforms.uLightInFront.value = isFront;
      flareShaderMaterial.uniforms.uLightDistance.value = camera.position.distanceTo(lightWorldPos);
      flareShaderMaterial.uniforms.uTime.value = elapsed;

      // Render 3D Scene followed by additive optical flare quad into postProcessor sceneTarget
      if (postProcessor) {
        renderer.setRenderTarget(postProcessor.sceneTarget);
        renderer.autoClear = true;
        renderer.render(scene, camera);

        renderer.autoClear = false;
        renderer.render(cameraRig, orthoCam);
        renderer.setRenderTarget(null);

        // Run Post-Processing Suite
        postProcessor.render(postProcessor.sceneTarget.texture);
      } else {
        renderer.autoClear = true;
        renderer.render(scene, camera);

        renderer.autoClear = false;
        renderer.render(cameraRig, orthoCam);
      }
    }

    animate();
  </script>
</body>
</html>
