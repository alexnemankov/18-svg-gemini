        // --- PROCEDURAL GENERATOR (CLICK-TO-MUTATE) ---
        function randomizeScene() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            
            settings.colorScheme = randomScheme;
            const scheme = COLOR_SCHEMES[randomScheme];
            settings.backgroundColor = scheme.bg;
            settings.starCoreColor = scheme.starCore;
            settings.starGlowColor = scheme.starGlow;
            settings.rimLightColor = scheme.rim;
            settings.trailColor = scheme.trail;
            settings.bokehColor = scheme.bokeh;

            settings.planetCount = Math.floor(4 + Math.random() * 5);
            settings.orbitEccentricity = parseFloat((0.1 + Math.random() * 0.35).toFixed(2));
            settings.orbitTilt = parseFloat((0.08 + Math.random() * 0.3).toFixed(2));
            settings.rimPower = parseFloat((1.8 + Math.random() * 1.8).toFixed(1));
            settings.rimIntensity = parseFloat((1.5 + Math.random() * 1.5).toFixed(1));
            settings.animationSpeed = parseFloat((0.7 + Math.random() * 0.7).toFixed(2));

            postProcessor.settings.bloomStrength = parseFloat((0.9 + Math.random() * 0.8).toFixed(2));
            postProcessor.updateSettings();

            updateSceneTheme();
            createOrbitalSystem();
            createStarfield();
            createCosmicDust();
            createBokehField();
            createComets();
            syncGuiDisplay();
        }

        // --- 8 PRECONFIGURED CAMERA ANIMATION MODES ---
        let simTime = 0;
        let globalTime = 0;

        function updateCameraMotion(delta) {
            const t = globalTime * 0.15 * settings.animationSpeed;
            const mode = settings.cameraAnimation;

            if (mode === 'Slow Dolly-In') {
                const dollyCycle = (Math.sin(t * 0.18) * 0.5 + 0.5);
                const currentDist = 280 - dollyCycle * 110;
                const azimuth = t * 0.08;
                camera.position.x = Math.sin(azimuth) * currentDist;
                camera.position.z = Math.cos(azimuth) * currentDist;
                camera.position.y = 80 + Math.sin(t * 0.1) * 35;
                camera.lookAt(0, 0, 0);
            }
            else if (mode === 'Ecliptic Drift') {
                const currentDist = 220 + Math.sin(t * 0.25) * 40;
                const azimuth = t * 0.18;
                camera.position.x = Math.sin(azimuth) * currentDist;
                camera.position.z = Math.cos(azimuth) * currentDist;
                camera.position.y = 20 + Math.sin(t * 0.3) * 15;
                camera.lookAt(0, 0, 0);
            }
            else if (mode === 'Zenith Descent') {
                const glide = Math.sin(t * 0.2) * 0.5 + 0.5;
                const currentDist = 210 + (1.0 - glide) * 70;
                const azimuth = t * 0.12;
                camera.position.x = Math.sin(azimuth) * currentDist;
                camera.position.z = Math.cos(azimuth) * currentDist;
                camera.position.y = 40 + glide * 160;
                camera.lookAt(0, 0, 0);
            }
            else if (mode === 'Orbital Resonance') {
                const R = 230;
                camera.position.x = Math.sin(t * 0.22) * R;
                camera.position.y = Math.cos(t * 0.16) * (R * 0.45) + 45;
                camera.position.z = Math.cos(t * 0.22) * R;
                camera.lookAt(0, 0, 0);
            }
            else if (mode === 'Solar Embrace') {
                const R = 150 + Math.sin(t * 0.2) * 25;
                const azimuth = t * 0.25;
                camera.position.x = Math.cos(azimuth) * R;
                camera.position.z = Math.sin(azimuth) * R;
                camera.position.y = 45 + Math.cos(t * 0.25) * 20;
                camera.lookAt(0, 0, 0);
            }
            else if (mode === 'Cosmic Breathing') {
                const breathe = Math.sin(t * 0.35);
                const currentDist = 240 + breathe * 90;
                const azimuth = t * 0.05;
                camera.position.x = Math.sin(azimuth) * currentDist;
                camera.position.z = Math.cos(azimuth) * currentDist;
                camera.position.y = 70 + breathe * 25;
                camera.lookAt(0, 0, 0);
            }
            else if (mode === 'Ascending Horizon') {
                const climb = Math.sin(t * 0.22) * 0.5 + 0.5;
                const currentDist = 250 - climb * 50;
                const azimuth = t * 0.14;
                camera.position.x = Math.sin(azimuth) * currentDist;
                camera.position.z = Math.cos(azimuth) * currentDist;
                camera.position.y = 30 + climb * 130;
                camera.lookAt(0, 0, 0);
            }
            else if (mode === 'Static (Manual Observation)') {
                // Static
            }
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const effectiveDelta = delta * settings.animationSpeed;
            simTime += effectiveDelta;
            globalTime += delta;

            updateCameraMotion(delta);
            controls.update();

            // Central Star
            if (starMaterial) starMaterial.uniforms.uTime.value = simTime;
            if (coronaMaterial) coronaMaterial.uniforms.uTime.value = simTime;

            // Starfield, Dust & Bokeh
            if (starfieldMaterial) starfieldMaterial.uniforms.uTime.value = simTime;
            if (cosmicDustMaterial) cosmicDustMaterial.uniforms.uTime.value = simTime;
            if (bokehMaterial) bokehMaterial.uniforms.uTime.value = simTime;

            // Planets & Moons
            for (let i = 0; i < planetObjects.length; i++) {
                const p = planetObjects[i];
                p.material.uniforms.uTime.value = simTime;

                const currentAngle = p.phase + simTime * p.speed;

                const xLocal = p.a * Math.cos(currentAngle) - p.a * p.e;
                const zLocal = p.b * Math.sin(currentAngle);

                const yPos = xLocal * Math.sin(p.tiltZ) + zLocal * Math.sin(p.tiltX);
                const xPos = xLocal * Math.cos(p.tiltZ);
                const zPos = zLocal * Math.cos(p.tiltX);

                p.mesh.position.set(xPos, yPos, zPos);
                p.mesh.rotation.y += effectiveDelta * 0.6;

                if (p.moon) {
                    p.moon.angle += effectiveDelta * p.moon.speed;
                    const mx = xPos + Math.cos(p.moon.angle) * p.moon.distance;
                    const mz = zPos + Math.sin(p.moon.angle) * p.moon.distance;
                    const my = yPos + Math.sin(p.moon.angle * 1.5) * (p.moon.distance * 0.3);
                    p.moon.mesh.position.set(mx, my, mz);
                }

                p.history.unshift({ x: xPos, y: yPos, z: zPos });
                if (p.history.length > p.maxHistory) {
                    p.history.pop();
                }

                const posAttr = p.trailGeo.attributes.position;
                const arr = posAttr.array;
                for (let k = 0; k < p.maxHistory; k++) {
                    if (k < p.history.length) {
                        arr[k * 3 + 0] = p.history[k].x;
                        arr[k * 3 + 1] = p.history[k].y;
                        arr[k * 3 + 2] = p.history[k].z;
                    } else if (p.history.length > 0) {
                        const last = p.history[p.history.length - 1];
                        arr[k * 3 + 0] = last.x;
                        arr[k * 3 + 1] = last.y;
                        arr[k * 3 + 2] = last.z;
                    }
                }
                posAttr.needsUpdate = true;
            }

            // Comets Motion & Dynamic Sweeping Tails
            for (let i = 0; i < cometInstances.length; i++) {
                const c = cometInstances[i];
                const angle = c.phase + simTime * c.speed * settings.cometSpeed;

                const xLocal = c.a * Math.cos(angle) - c.a * c.e;
                const zLocal = c.b * Math.sin(angle);

                let cx = xLocal * Math.cos(c.tiltZ) - zLocal * Math.sin(c.tiltZ);
                let cy = xLocal * Math.sin(c.tiltZ) + zLocal * Math.cos(c.tiltZ);
                let cz = zLocal * Math.cos(c.tiltX) - cy * Math.sin(c.tiltX);
                cy = zLocal * Math.sin(c.tiltX) + cy * Math.cos(c.tiltX);

                const finalX = cx * Math.cos(c.tiltY) - cz * Math.sin(c.tiltY);
                const finalZ = cx * Math.sin(c.tiltY) + cz * Math.cos(c.tiltY);
                const finalY = cy;

                c.headMesh.position.set(finalX, finalY, finalZ);
                c.glowMesh.position.set(finalX, finalY, finalZ);

                const distToStar = Math.hypot(finalX, finalY, finalZ);
                const proximityScale = Math.max(0.3, Math.min(2.2, 380.0 / (distToStar + 40.0)));
                c.glowMesh.scale.setScalar(proximityScale * 1.5);
                c.glowMesh.material.uniforms.uOpacity.value = Math.min(1.0, proximityScale * 0.9);

                const sunRepelX = (finalX / (distToStar + 0.001));
                const sunRepelY = (finalY / (distToStar + 0.001));
                const sunRepelZ = (finalZ / (distToStar + 0.001));

                c.history.unshift({
                    x: finalX,
                    y: finalY,
                    z: finalZ,
                    rx: sunRepelX,
                    ry: sunRepelY,
                    rz: sunRepelZ,
                    proximity: proximityScale
                });

                if (c.history.length > c.maxTail) {
                    c.history.pop();
                }

                const posAttr = c.tailGeo.attributes.position;
                const arr = posAttr.array;
                for (let k = 0; k < c.maxTail; k++) {
                    if (k < c.history.length) {
                        const h = c.history[k];
                        const offsetFactor = k * 0.35 * h.proximity;
                        arr[k * 3 + 0] = h.x + h.rx * offsetFactor;
                        arr[k * 3 + 1] = h.y + h.ry * offsetFactor;
                        arr[k * 3 + 2] = h.z + h.rz * offsetFactor;
                    } else if (c.history.length > 0) {
                        const last = c.history[c.history.length - 1];
                        arr[k * 3 + 0] = last.x;
                        arr[k * 3 + 1] = last.y;
                        arr[k * 3 + 2] = last.z;
                    }
                }
                posAttr.needsUpdate = true;
            }

            postProcessor.renderScene(scene, camera);
        }

        // --- LIL-GUI CONTROL PANEL SETUP ---
        const gui = new GUI({ title: 'Orbital Stillness' });
        const guiControllers = [];

        function buildGUI() {
            // 🎨 COLOR & THEME FOLDER
            const fTheme = gui.addFolder('🎨 Color & Theme');
            guiControllers.push(
                fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange(val => applyScheme(val)),
                fTheme.add(settings, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => updateSceneTheme()),
                fTheme.addColor(settings, 'backgroundColor').name('Background').onChange(() => updateSceneTheme()),
                fTheme.addColor(settings, 'starCoreColor').name('Star Core').onChange(() => updateSceneTheme()),
                fTheme.addColor(settings, 'starGlowColor').name('Star Glow').onChange(() => updateSceneTheme()),
                fTheme.addColor(settings, 'rimLightColor').name('Rim Light').onChange(() => updateSceneTheme()),
                fTheme.addColor(settings, 'trailColor').name('Trail Glow').onChange(() => updateSceneTheme()),
                fTheme.addColor(settings, 'bokehColor').name('Bokeh Hue').onChange(() => updateSceneTheme())
            );

            // 🎬 CAMERA & ANIMATION FOLDER
            const fCam = gui.addFolder('🎬 Camera & Motion');
            const animOptions = [
                'Slow Dolly-In',
                'Ecliptic Drift',
                'Zenith Descent',
                'Orbital Resonance',
                'Solar Embrace',
                'Cosmic Breathing',
                'Ascending Horizon',
                'Static (Manual Observation)'
            ];
            guiControllers.push(
                fCam.add(settings, 'cameraAnimation', animOptions).name('Camera Mode'),
                fCam.add(settings, 'animationSpeed', 0.0, 3.0, 0.01).name('Animation Speed')
            );

            // 🪐 ORBITAL MECHANICS FOLDER
            const fOrbits = gui.addFolder('🪐 Orbital Mechanics');
            guiControllers.push(
                fOrbits.add(settings, 'planetCount', 3, 9, 1).name('Planet Count').onChange(() => createOrbitalSystem()),
                fOrbits.add(settings, 'systemRadius', 100, 350, 10).name('System Radius').onChange(() => createOrbitalSystem()),
                fOrbits.add(settings, 'orbitEccentricity', 0.0, 0.6, 0.01).name('Eccentricity').onChange(() => createOrbitalSystem()),
                fOrbits.add(settings, 'orbitTilt', 0.0, 0.5, 0.01).name('Orbit Tilt').onChange(() => createOrbitalSystem()),
                fOrbits.add(settings, 'rimPower', 1.0, 5.0, 0.1).name('Rim Sharpness').onChange(() => updateSceneTheme()),
                fOrbits.add(settings, 'rimIntensity', 0.5, 4.0, 0.1).name('Rim Intensity').onChange(() => updateSceneTheme()),
                fOrbits.add(settings, 'showOrbitGuides').name('Show Orbit Paths').onChange(v => {
                    planetObjects.forEach(p => { if (p.guideLine) p.guideLine.material.opacity = v && !settings.greenscreen ? 0.12 : 0.0; });
                }),
                fOrbits.add(settings, 'trailOpacity', 0.0, 1.0, 0.05).name('Trail Opacity').onChange(v => {
                    planetObjects.forEach(p => { if (p.trailMat) p.trailMat.uniforms.uGlobalOpacity.value = settings.greenscreen ? 0.0 : v; });
                })
            );

            // ✨ BOKEH ATMOSPHERE FOLDER
            const fBokeh = gui.addFolder('✨ Bokeh Atmosphere');
            guiControllers.push(
                fBokeh.add(settings, 'bokehCount', 50, 600, 1).name('Bokeh Count').onChange(() => createBokehField()),
                fBokeh.add(settings, 'bokehSize', 10.0, 70.0, 1.0).name('Bokeh Size').onChange(v => {
                    if (bokehMaterial) bokehMaterial.uniforms.uBaseSize.value = v;
                })
            );

            // 📽️ POST PROCESSOR ATTACHED FOLDER
            postProcessor.attachGUI(gui, '✨ Post-Processing Suite');

            // ⚙️ SYSTEM & INTERACTION
            const fSys = gui.addFolder('⚙️ System & Controls');
            guiControllers.push(
                fSys.add(settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
                    renderer.setPixelRatio(v);
                    postProcessor.setSize(window.innerWidth, window.innerHeight, v);
                    if (bokehMaterial) bokehMaterial.uniforms.uPixelRatio.value = v;
                    if (starfieldMaterial) starfieldMaterial.uniforms.uPixelRatio.value = v;
                    if (cosmicDustMaterial) cosmicDustMaterial.uniforms.uPixelRatio.value = v;
                }),
                fSys.add(settings, 'clickToRandomize').name('Click Scene: Mutate'),
                fSys.add({ randomize: () => randomizeScene() }, 'randomize').name('🎲 Randomize Now!'),
                fSys.add({ reset: () => resetToDefaults() }, 'reset').name('↺ Reset Defaults')
            );
        }

        function syncGuiDisplay() {
            guiControllers.forEach(controller => {
                if (controller && typeof controller.updateDisplay === 'function') {
                    controller.updateDisplay();
                }
            });
        }

        // --- KEYBOARD LISTENER (TOGGLE UI WITH "H") ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                if (gui._hidden) {
                    gui.show();
                } else {
                    gui.hide();
                }
            }
        });

        // --- POINTER CLICK LISTENER (CLICK SCENE TO RANDOMIZE) ---
        let pointerDownPos = { x: 0, y: 0, time: 0 };

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;
            pointerDownPos = { x: e.clientX, y: e.clientY, time: performance.now() };
        });

        window.addEventListener('pointerup', (e) => {
            if (e.target.closest('.lil-gui')) return;
            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            const dt = performance.now() - pointerDownPos.time;
            const dist = Math.hypot(dx, dy);

            if (dist < 6 && dt < 350 && settings.clickToRandomize) {
                randomizeScene();
            }
        });

        // --- WINDOW RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            postProcessor.setSize(width, height, settings.dpr);
        });

        // --- INITIALIZATION ---
        createCentralStar();
        createStarfield();
        createCosmicDust();
        createBokehField();
        createComets();
        createOrbitalSystem();
        updateSceneTheme();
        buildGUI();
        animate();
    </script>
</body>
</html>
