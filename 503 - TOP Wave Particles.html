<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tan Wave Particles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-size: 62.5%;
      background: #000;
      overflow: hidden;
      color: #FFF;
      font-family: serif;
      overscroll-behavior: none;
    }

    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
    }

    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }

    #loading.loaded {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #container .box {
      color: white;
      font-size: 3.2rem;
      position: fixed;
      z-index: 1;
      top: 50%;
      left: 10%;
      transform: translateY(-50%);
      overflow: hidden;
    }

    #container .box h1 {
      letter-spacing: 0.4rem;
      padding-bottom: 0.8rem;
    }

    #container .box h1::after {
      content: '';
      position: absolute;
      height: 4px;
      width: 100%;
      background: #fff;
      bottom: 0.8rem;
      left: 0;
    }

    #container .box p {
      font-size: 0.8rem;
    }

    #container .box .expansion {
      font-size: 6.4rem;
    }

    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="circle"></div>
  </div>
  <div id="container">
    <div class="box">
      <!-- h1 <span class="expansion">A</span>FR<span class="expansion">A</span>ID -->
    </div>
  </div>

  <script type="module">

    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.121.1/examples/jsm/controls/OrbitControls.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

      },

      },

      'Palette: (FEF1BE, FFBA00, 008189, 00474D, 061210)': {

      },
      'Palette: (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {

        blending: 'Additive'
      },
      'Palette: (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        usePal: false,
        c1: '#E8E0FF',
        c2: '#B38FFF',
        c3: '#6A3DE8',
        c4: '#1A1250',
        c5: '#9370DB',
        bg: '#090612',
        blending: 'Additive'
      },
      'Palette: (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        usePal: false,
        c1: '#E0FBFF',
        c2: '#00F0FF',

        c4: '#1E0A3D',
        c5: '#FF007F',
        bg: '#05020F',
        blending: 'Additive'
      }
    };

    // vertex shader source
    const vertexParticleShader = `
    uniform float uTime;
    uniform float uTimeScale;
    uniform float uPointSize;
    uniform float uRadiusScale;
    uniform float uWaveFreq;
    uniform float uWaveHeight;

    varying vec3 vPos;
    varying float vLen;

    float PI = 3.14159265359;
    float radian = 0.017453292519944;

    attribute float number;

    void main(){
      vec3 pos = position;
      
      float r = (radian * pos.z) * 0.1 * uRadiusScale;
      pos.x = cos(radian * pos.z * abs(120.0 + uTime * uTimeScale)) * r;
      pos.y = sin(radian * pos.z * abs(120.0 + uTime * uTimeScale)) * r;
      
      pos.z = tan(length(pos) * uWaveFreq - uTime * 0.5) * uWaveHeight;
      
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      
      vPos = pos;
      vLen = length(pos);
      
      float pSize = uPointSize * (20.0 / max(0.1, -mvPosition.z));
      gl_PointSize = clamp(pSize, 0.5, 80.0);
      gl_Position = projectionMatrix * mvPosition;
    }
    `;

    // fragment shader source
    const fragmentParticleShader = `
    uniform float uTime;
    uniform float uColorSpeed;
    uniform float uColorFreq;
    uniform float uOpacity;
    uniform float uPointRadius;
    uniform int uUsePal;

    uniform vec3 uPalA;
    uniform vec3 uPalB;
    uniform vec3 uPalC;
    uniform vec3 uPalD;

    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    uniform vec3 uColor4;
    uniform vec3 uColor5;

    varying vec3 vPos;
    varying float vLen;

    vec3 pal( in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d ) {
      return a + b * cos( 6.28318530718 * (c * t + d) );
    }

    vec3 getGradient(float t) {
      float f = fract(t);
      if (f < 0.25) {
        return mix(uColor1, uColor2, f / 0.25);
      } else if (f < 0.5) {
        return mix(uColor2, uColor3, (f - 0.25) / 0.25);
      } else if (f < 0.75) {
        return mix(uColor3, uColor4, (f - 0.5) / 0.25);
      } else {
        return mix(uColor4, uColor5, (f - 0.75) / 0.25);
      }
    }

    void main () {
      float f = length(gl_PointCoord - vec2(0.5, 0.5));
      
      if (f > uPointRadius) discard;
      
      float len = length(vPos) * 0.1;
      float tVal = length(len - uTime * uColorSpeed) * uColorFreq;
      
      vec3 color;
      if (uUsePal == 1) {
        color = pal(tVal, uPalA, uPalB, uPalC, uPalD);
      } else {
        color = getGradient(tVal);
      }
      
      float alpha = smoothstep(uPointRadius, uPointRadius * 0.3, f) * uOpacity;
      
      gl_FragColor = vec4(color, alpha);
    }
    `;

    /**
     * Shape class
     */
    class Shape {
      constructor(sketch) {
        this.sketch = sketch;
        this.initialize();
      }
      
      initialize() {
        this.number = this.sketch.params.number;
        this.buildGeometry();
        
        const p = this.sketch.params;
        this.particleMaterial = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uTimeScale: { value: p.uTimeScale },
            uPointSize: { value: p.pointSize },
            uPointRadius: { value: p.pointRadius },
            uOpacity: { value: p.opacity },
            uRadiusScale: { value: p.radiusScale },
            uWaveFreq: { value: p.waveFreq },
            uWaveHeight: { value: p.waveHeight },
            uColorSpeed: { value: p.colorSpeed },
            uColorFreq: { value: p.colorFreq },
            uUsePal: { value: p.usePal ? 1 : 0 },
            uPalA: { value: new THREE.Vector3(...p.palA) },
            uPalB: { value: new THREE.Vector3(...p.palB) },
            uPalC: { value: new THREE.Vector3(...p.palC) },
            uPalD: { value: new THREE.Vector3(...p.palD) },
            uColor1: { value: new THREE.Color(p.color1) },
            uColor2: { value: new THREE.Color(p.color2) },
            uColor3: { value: new THREE.Color(p.color3) },
            uColor4: { value: new THREE.Color(p.color4) },
            uColor5: { value: new THREE.Color(p.color5) },
            uResolution: { value: new THREE.Vector2(this.sketch.width, this.sketch.height) }
          },
          blending: p.blending === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending,
          transparent: true,
          depthWrite: false,
          vertexShader: vertexParticleShader,
          fragmentShader: fragmentParticleShader
        });
        
        this.particlePoint = new THREE.Points(this.particleGeometry, this.particleMaterial);
        this.particlePoint.rotation.x = -90 * Math.PI / 180;
        this.sketch.scene.add(this.particlePoint);
      }

      buildGeometry() {
        this.particleGeometry = new THREE.BufferGeometry();
        this.positions = new Float32Array(this.number * 3);
        this.numbers = new Float32Array(this.number);
        
        for (let i = 0; i < this.number; i++) {
          this.positions.set([0, 0, i], i * 3);
          this.numbers[i] = Math.random() * 2 - 1;
        }
        
        this.particleGeometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
        this.particleGeometry.setAttribute('number', new THREE.BufferAttribute(this.numbers, 1));
      }

      rebuildGeometry(newCount) {
        if (this.particlePoint) {
          this.sketch.scene.remove(this.particlePoint);
          if (this.particleGeometry) this.particleGeometry.dispose();
        }
        this.number = newCount;
        this.buildGeometry();
        this.particlePoint = new THREE.Points(this.particleGeometry, this.particleMaterial);
        this.particlePoint.rotation.x = -90 * Math.PI / 180;
        this.sketch.scene.add(this.particlePoint);
      }
      
      updateParameters(time) {
        if (!this.particleMaterial) return;
        const u = this.particleMaterial.uniforms;
        const p = this.sketch.params;
        u.uTime.value = time;
        u.uTimeScale.value = p.uTimeScale;
        u.uPointSize.value = p.pointSize;
        u.uPointRadius.value = p.pointRadius;
        u.uOpacity.value = p.opacity;
        u.uRadiusScale.value = p.radiusScale;
        u.uWaveFreq.value = p.waveFreq;
        u.uWaveHeight.value = p.waveHeight;
        u.uColorSpeed.value = p.colorSpeed;
        u.uColorFreq.value = p.colorFreq;
      }
      
      render(time) {
        this.updateParameters(time);
      }
    }

    /**
     * class Sketch
     */
    class Sketch {
      constructor() {
        this.width = Math.ceil(window.innerWidth);
        this.height = Math.ceil(window.innerHeight);

        this.initParams();
        this.createCanvas();
        this.setupScene();
        this.setupCamera();
        this.setupLights();
        this.setupShape();
        this.setupGui();
        this.setupInteractions();

        this.time = new THREE.Clock(true);
        this.draw();
      }

      initParams() {
        this.params = {
          // Color Theme
          colorScheme: 'Original',
          greenscreen: false,
          bgColor: '#000000',
          color1: '#ff0055',
          color2: '#00ffcc',
          color3: '#0066ff',
          color4: '#ffcc00',
          color5: '#ff00aa',
          invertAchromatic: false,
          blending: 'Additive',
          usePal: true,
          palA: [0.5, 0.5, 0.5],
          palB: [0.5, 0.5, 0.5],
          palC: [1.0, 1.0, 1.0],
          palD: [0.0, 0.10, 0.20],

          // Geometry
          number: 6000,
          pointSize: 10.0,
          pointRadius: 0.1,
          opacity: 1.0,
          radiusScale: 1.0,
          waveFreq: 1.0,
          waveHeight: 5.0,

          // Motion
          uTimeScale: 0.01,
          colorSpeed: 0.5,
          colorFreq: 1.0,

          // Camera & Interaction
          dragMode: 'Rotate (Right-click pan)',
          autoRotate: false,
          autoRotateSpeed: 1.0,
          randomizeOnClick: true
        };
      }
      
      createCanvas() {
        this.renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });
        
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.setClearColor(new THREE.Color(this.params.bgColor), 1.0);
        
        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.width = '100%';
        this.renderer.domElement.style.height = '100%';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';

        document.getElementById('container').appendChild(this.renderer.domElement);
      }

      setupScene() {
        this.scene = new THREE.Scene();
      }
      
      setupCamera() {
        const fov = 70;
        const fovRadian = (fov / 2) * (Math.PI / 180);
        this.dist = (this.height / 2) / Math.tan(fovRadian);
        
        this.camera = new THREE.PerspectiveCamera(
          fov,
          this.width / this.height,
          0.01,
          this.dist * 5
        );
        
        this.camera.position.set(0, 0, this.dist * 0.02);
        this.camera.lookAt(new THREE.Vector3(0, 0, 0));
        this.scene.add(this.camera);
        
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.enableZoom = true;
        this.controls.zoomSpeed = 1.2;
        this.controls.enablePan = true;
        this.controls.panSpeed = 1.0;
        this.controls.screenSpacePanning = true;
        this.controls.minDistance = 0.1;
        this.controls.maxDistance = 2500.0;
        this.updateDragMode();
      }

      resetCamera() {
        const fovRadian = (70 / 2) * (Math.PI / 180);
        const dist = (this.height / 2) / Math.tan(fovRadian);
        this.camera.position.set(0, 0, dist * 0.02);
        this.camera.lookAt(0, 0, 0);
        this.controls.target.set(0, 0, 0);
        this.controls.update();
      }

      updateDragMode() {
        if (!this.controls) return;
        if (this.params.dragMode === 'Pan across screen (Left-click)') {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
          this.controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
        } else {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
          this.controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
        }
      }
      
      setupLights() {
        this.directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        this.directionalLight.position.set(10, 20, 15);
        this.scene.add(this.directionalLight);

        this.spotLight = new THREE.SpotLight(0xffffff, 0.5);
        this.spotLight.position.set(this.dist, this.dist, this.dist);
        this.scene.add(this.spotLight);
      }
      
      setupShape() {
        this.shapes = [];
        this.shape = new Shape(this);
        this.shapes.push(this.shape);
      }

      updateBackground() {
        const effectiveBg = this.params.greenscreen ? '#00ff00' : this.params.bgColor;
        this.renderer.setClearColor(new THREE.Color(effectiveBg), 1.0);
        document.body.style.background = effectiveBg;

        if (this.params.greenscreen && this.params.blending === 'Additive') {
          this.params.blending = 'Normal';
          this.updateBlending();
        }
      }

      updateColors() {
        if (!this.shape || !this.shape.particleMaterial) return;
        const u = this.shape.particleMaterial.uniforms;
        u.uUsePal.value = this.params.usePal ? 1 : 0;
        u.uColor1.value.set(this.params.color1);
        u.uColor2.value.set(this.params.color2);
        u.uColor3.value.set(this.params.color3);
        u.uColor4.value.set(this.params.color4);
        u.uColor5.value.set(this.params.color5);

        if (this.params.palA) {
          u.uPalA.value.set(this.params.palA[0], this.params.palA[1], this.params.palA[2]);
          u.uPalB.value.set(this.params.palB[0], this.params.palB[1], this.params.palB[2]);
          u.uPalC.value.set(this.params.palC[0], this.params.palC[1], this.params.palC[2]);
          u.uPalD.value.set(this.params.palD[0], this.params.palD[1], this.params.palD[2]);
        }
      }

      updateBlending() {
        if (!this.shape || !this.shape.particleMaterial) return;
        this.shape.particleMaterial.blending = this.params.blending === 'Additive'
          ? THREE.AdditiveBlending
          : THREE.NormalBlending;
        this.shape.particleMaterial.needsUpdate = true;
      }

      applyScheme(name) {
        const scheme = COLOR_SCHEMES[name];
        if (!scheme) return;
        this.params.colorScheme = name;

        if (name === 'Achromatic (black and white version, white and black)') {
          if (this.params.invertAchromatic) {
            this.params.bgColor = '#ffffff';
            this.params.color1 = '#000000';
            this.params.color2 = '#222222';
            this.params.color3 = '#444444';
            this.params.color4 = '#666666';
            this.params.color5 = '#888888';
            this.params.blending = 'Normal';
          } else {
            this.params.bgColor = '#000000';
            this.params.color1 = '#ffffff';
            this.params.color2 = '#d8d8d8';
            this.params.color3 = '#aaaaaa';
            this.params.color4 = '#777777';
            this.params.color5 = '#444444';
            this.params.blending = 'Additive';
          }
          this.params.usePal = false;
        } else if (name === 'Achromatic + Accent (black and white + red, white and black + red)') {
          if (this.params.invertAchromatic) {
            this.params.bgColor = '#ffffff';
            this.params.color1 = '#000000';
            this.params.color2 = '#333333';
            this.params.color3 = '#ff0033';
            this.params.color4 = '#cc0029';
            this.params.color5 = '#666666';
            this.params.blending = 'Normal';
          } else {
            this.params.bgColor = '#000000';
            this.params.color1 = '#ffffff';
            this.params.color2 = '#cccccc';
            this.params.color3 = '#ff0033';
            this.params.color4 = '#cc0029';
            this.params.color5 = '#888888';
            this.params.blending = 'Additive';
          }
          this.params.usePal = false;
        } else {
          this.params.bgColor = scheme.bg;
          this.params.color1 = scheme.c1;
          this.params.color2 = scheme.c2;
          this.params.color3 = scheme.c3;
          this.params.color4 = scheme.c4;
          this.params.color5 = scheme.c5;
          this.params.usePal = !!scheme.usePal;
          this.params.blending = scheme.blending || 'Additive';

          if (scheme.usePal) {
            this.params.palA = [...scheme.palA];
            this.params.palB = [...scheme.palB];
            this.params.palC = [...scheme.palC];
            this.params.palD = [...scheme.palD];
          }
        }

        this.updateBackground();
        this.updateColors();
        this.updateBlending();
        this.updateGuiDisplay();
      }

      randomizeProcedural() {
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        this.applyScheme(randomScheme);

        // Re-roll geometric and motion parameters
        this.params.number = Math.floor(Math.random() * 8000 + 3000);
        this.shape.rebuildGeometry(this.params.number);

        this.params.uTimeScale = parseFloat((Math.random() * 0.035 + 0.005).toFixed(4));
        this.params.pointSize = parseFloat((Math.random() * 14.0 + 5.0).toFixed(1));
        this.params.pointRadius = parseFloat((Math.random() * 0.3 + 0.08).toFixed(2));
        this.params.radiusScale = parseFloat((Math.random() * 1.6 + 0.5).toFixed(2));
        this.params.waveFreq = parseFloat((Math.random() * 1.8 + 0.4).toFixed(2));
        this.params.waveHeight = parseFloat((Math.random() * 8.0 + 2.0).toFixed(1));
        this.params.colorSpeed = parseFloat((Math.random() * 0.9 + 0.2).toFixed(2));
        this.params.colorFreq = parseFloat((Math.random() * 1.5 + 0.5).toFixed(2));
        this.params.opacity = parseFloat((Math.random() * 0.4 + 0.6).toFixed(2));

        this.params.autoRotate = Math.random() > 0.4;
        this.params.autoRotateSpeed = parseFloat((Math.random() * 4.0 - 2.0).toFixed(2));

        this.updateColors();
        this.updateGuiDisplay();
      }

      updateGuiDisplay() {
        if (!this.gui) return;
        if (typeof this.gui.controllersRecursive === 'function') {
          this.gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (this.gui.controllers) {
          this.gui.controllers.forEach(c => c.updateDisplay());
          if (this.gui.folders) {
            this.gui.folders.forEach(f => {
              if (f.controllers) f.controllers.forEach(c => c.updateDisplay());
            });
          }
        }
      }

      setupGui() {
        this.gui = new GUI({ title: 'Scene Controls' });

        // Color Theme Folder
        const fTheme = this.gui.addFolder('Color Theme');
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        fTheme.add(this.params, 'colorScheme', schemeKeys).name('Preset Scheme').onChange(v => this.applyScheme(v));
        fTheme.add(this.params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
          this.updateBackground();
          this.updateGuiDisplay();
        });
        fTheme.addColor(this.params, 'bgColor').name('Background Color').onChange(() => {
          if (this.params.greenscreen) {
            this.params.greenscreen = false;
          }
          this.updateBackground();
          this.updateGuiDisplay();
        });
        fTheme.addColor(this.params, 'color1').name('Particle Color 1').onChange(() => {
          this.params.usePal = false;
          this.updateColors();
        });
        fTheme.addColor(this.params, 'color2').name('Particle Color 2').onChange(() => {
          this.params.usePal = false;
          this.updateColors();
        });
        fTheme.addColor(this.params, 'color3').name('Particle Color 3').onChange(() => {
          this.params.usePal = false;
          this.updateColors();
        });
        fTheme.addColor(this.params, 'color4').name('Particle Color 4').onChange(() => {
          this.params.usePal = false;
          this.updateColors();
        });
        fTheme.addColor(this.params, 'color5').name('Particle Color 5').onChange(() => {
          this.params.usePal = false;
          this.updateColors();
        });
        fTheme.add(this.params, 'invertAchromatic').name('Invert B&W (White BG)').onChange(() => {
          if (this.params.colorScheme.includes('Achromatic')) {
            this.applyScheme(this.params.colorScheme);
          }
        });
        fTheme.add(this.params, 'blending', ['Additive', 'Normal']).name('Blending').onChange(() => {
          this.updateBlending();
        });

        // Geometry & Wave Folder
        const fGeo = this.gui.addFolder('Geometry & Wave');
        fGeo.add(this.params, 'number', 500, 30000, 100).name('Particle Count').onChange(v => {
          this.shape.rebuildGeometry(v);
        });
        fGeo.add(this.params, 'pointSize', 1.0, 40.0, 0.5).name('Point Size');
        fGeo.add(this.params, 'pointRadius', 0.05, 0.5, 0.01).name('Point Radius');
        fGeo.add(this.params, 'opacity', 0.1, 1.0, 0.05).name('Opacity');
        fGeo.add(this.params, 'radiusScale', 0.2, 5.0, 0.1).name('Spiral Radius');
        fGeo.add(this.params, 'waveFreq', 0.1, 5.0, 0.1).name('Tan Wave Freq');
        fGeo.add(this.params, 'waveHeight', 0.5, 25.0, 0.5).name('Tan Wave Height');

        // Motion & Time Folder
        const fMotion = this.gui.addFolder('Motion & Simulation');
        fMotion.add(this.params, 'uTimeScale', 0.001, 0.08, 0.001).name('Spiral Speed');
        fMotion.add(this.params, 'colorSpeed', 0.0, 3.0, 0.05).name('Color Cycle Speed');
        fMotion.add(this.params, 'colorFreq', 0.1, 5.0, 0.1).name('Color Frequency');

        // Camera & Interaction Folder
        const fCam = this.gui.addFolder('Camera & Interaction');
        fCam.add(this.params, 'dragMode', ['Rotate (Right-click pan)', 'Pan across screen (Left-click)']).name('Drag Action').onChange(() => {
          this.updateDragMode();
        });
        fCam.add(this.params, 'autoRotate').name('Auto Rotate');
        fCam.add(this.params, 'autoRotateSpeed', -5.0, 5.0, 0.1).name('Rotate Speed');
        fCam.add({ reset: () => this.resetCamera() }, 'reset').name('Reset Camera');

        // Procedural Variation Folder
        const fVariation = this.gui.addFolder('Procedural Variation');
        fVariation.add(this.params, 'randomizeOnClick').name('Randomize on Click');
        fVariation.add({ randomize: () => this.randomizeProcedural() }, 'randomize').name('⚡ Randomize Scene');

        // Keybinding 'H' to toggle GUI visibility
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
            const isHidden = this.gui._hidden || this.gui.domElement.style.display === 'none';
            if (isHidden) {
              if (typeof this.gui.show === 'function') this.gui.show();
              this.gui.domElement.style.display = '';
            } else {
              if (typeof this.gui.hide === 'function') this.gui.hide();
              this.gui.domElement.style.display = 'none';
            }
          }
        });
      }

      setupInteractions() {
        window.addEventListener('resize', this.onResize.bind(this), false);

        // Click detection on scene to trigger procedural randomize
        let isPointerDown = false;
        let startX = 0;
        let startY = 0;
        let startTime = 0;

        window.addEventListener('pointerdown', (e) => {
          if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
          if (e.button === 0) {
            isPointerDown = true;
            startX = e.clientX;
            startY = e.clientY;
            startTime = performance.now();
          }
        });

        window.addEventListener('pointerup', (e) => {
          if (!isPointerDown) return;
          isPointerDown = false;
          if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          const dist = Math.hypot(dx, dy);
          const duration = performance.now() - startTime;

          // Pure click threshold without dragging
          if (dist < 6 && duration < 400) {
            if (this.params.randomizeOnClick) {
              this.randomizeProcedural();
            }
          }
        });
      }

      onResize() {
        this.width = Math.ceil(window.innerWidth);
        this.height = Math.ceil(window.innerHeight);
        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.width, this.height);
        if (this.shape && this.shape.particleMaterial) {
          this.shape.particleMaterial.uniforms.uResolution.value.set(this.width, this.height);
        }
      }
      
      draw() {
        const time = this.time.getElapsedTime();

        if (this.controls) {
          this.controls.autoRotate = this.params.autoRotate;
          this.controls.autoRotateSpeed = this.params.autoRotateSpeed;
          this.controls.update();
        }
        
        for (let i = 0; i < this.shapes.length; i++) {
          this.shapes[i].render(time);
        }
        
        this.renderer.render(this.scene, this.camera);
        this.animationId = requestAnimationFrame(this.draw.bind(this));
      }
    }

    (() => {
      window.addEventListener('load', () => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.classList.add('loaded');
        }

        new Sketch();
      });
    })();
  </script>
</body>
</html>
