<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phyllotaxis Golden Spiral 3D</title>
  <style>
    body {
      overflow: hidden;
      margin: 0;
      background-color: #dcdcdc;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.5.1/dist/es-module-shims.js" crossorigin="anonymous"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";

    // General setup
    console.clear();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('gainsboro');

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(0, 0, 300);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setAnimationLoop(animationLoop);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Golden Spiral Setup (3000 items)
    const COUNT = 3000;
    const geometry = new THREE.CircleGeometry(1, 16);
    const material = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
    const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
    
    const spiralGroup = new THREE.Group();
    spiralGroup.add(instancedMesh);
    scene.add(spiralGroup);

    const dummy = new THREE.Object3D();
    const goldenAngle = 2 * Math.PI * (1 - 2 / (1 + Math.sqrt(5)));

    // Preset Color Schemes
    const colorSchemes = {
      'Gainsboro Monochromatic (Original)': {
        bgColor: '#dcdcdc',
        primaryColor: '#000000',
        secondaryColor: '#444444'
      },
      'Obsidian & Gold': {
        bgColor: '#0a0a10',
        primaryColor: '#ffd700',
        secondaryColor: '#ff4500'
      },
      'Neon Cyber Spiral': {
        bgColor: '#05021a',
        primaryColor: '#00f5d4',
        secondaryColor: '#7b2cbf'
      },
      'Bioluminescent Lotus': {
        bgColor: '#011627',
        primaryColor: '#2ec4b6',
        secondaryColor: '#e71d36'
      },
      'Solar Flare Radiance': {
        bgColor: '#1a0005',
        primaryColor: '#ff5400',
        secondaryColor: '#ff0054'
      }
    };

    // Preset Animations
    const animationPresets = [
      'Breathing Zoom (Original Classic)',
      'Static Camera (No Movement)',
      'Orbiting Spiral Vortex',
      'Pulsing Spiral Wave',
      'Hypnotic Cosmic Rotation'
    ];

    // Control parameters
    const params = {
      // Greenscreen & Render
      greenScreen: false,
      bgColor: colorSchemes['Gainsboro Monochromatic (Original)'].bgColor,
      dpr: Math.min(window.devicePixelRatio, 2),

      // Color Scheme
      colorScheme: 'Gainsboro Monochromatic (Original)',
      primaryColor: colorSchemes['Gainsboro Monochromatic (Original)'].primaryColor,
      secondaryColor: colorSchemes['Gainsboro Monochromatic (Original)'].secondaryColor,

      // Geometry & Spiral
      circleScale: 1.0,
      spiralFactor: 1.001,

      // Motion & Animation
      animationPreset: 'Breathing Zoom (Original Classic)',
      animSpeed: 1.0,
      waveAmplitude: 0,

      // Interactive Modes
      randomizerOnClick: false
    };

    // Update Spiral Geometry & Particle Colors
    function updateSpiral(time = 0) {
      const c1 = new THREE.Color(params.primaryColor);
      const c2 = new THREE.Color(params.secondaryColor);
      const tempColor = new THREE.Color();

      for (let i = 0; i < COUNT; i++) {
        const idx = i + 0.1;
        const r = Math.pow(idx, 0.5) * Math.pow(params.spiralFactor, idx);
        const a = idx * goldenAngle;

        let z = 0;
        if (params.waveAmplitude > 0) {
          z = Math.sin(r * 0.02 - time * 0.002) * params.waveAmplitude;
        }

        dummy.position.set(r * Math.cos(a), r * Math.sin(a), z);
        dummy.scale.setScalar(params.circleScale);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);

        const t = i / COUNT;
        tempColor.copy(c1).lerp(c2, t);
        instancedMesh.setColorAt(i, tempColor);
      }

      instancedMesh.instanceMatrix.needsUpdate = true;
      if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
    }

    function updateColors() {
      if (params.greenScreen) {
        scene.background.set('#00ff00');
      } else {
        scene.background.set(params.bgColor);
      }
      updateSpiral();
    }

    function applyColorScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;
      params.bgColor = scheme.bgColor;
      params.primaryColor = scheme.primaryColor;
      params.secondaryColor = scheme.secondaryColor;

      updateColors();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // GUI Controls Setup
    const gui = new GUI({ title: 'Spiral Settings' });

    // Display & Greenscreen
    const fDisplay = gui.addFolder('Display & Greenscreen');
    fDisplay.add(params, 'greenScreen').name('Greenscreen (#00ff00)').onChange(updateColors);
    fDisplay.addColor(params, 'bgColor').name('Background Color').onChange(updateColors);
    fDisplay.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(val => {
      renderer.setPixelRatio(val);
    });

    // Color Schemes
    const fColors = gui.addFolder('Presets & Colors');
    fColors.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange(applyColorScheme);
    fColors.addColor(params, 'primaryColor').name('Center Color').onChange(updateColors);
    fColors.addColor(params, 'secondaryColor').name('Outer Color').onChange(updateColors);

    // Geometry & Spiral
    const fGeom = gui.addFolder('Spiral Geometry');
    fGeom.add(params, 'circleScale', 0.2, 5.0, 0.1).name('Circle Scale').onChange(() => updateSpiral());
    fGeom.add(params, 'spiralFactor', 1.0001, 1.003, 0.0001).name('Spiral Expansion').onChange(() => updateSpiral());

    // Animation & Motion
    const fAnim = gui.addFolder('Animation & Motion');
    fAnim.add(params, 'animationPreset', animationPresets).name('Animation Preset');
    fAnim.add(params, 'animSpeed', 0.0, 3.0, 0.1).name('Speed Multiplier');
    fAnim.add(params, 'waveAmplitude', 0, 50, 1).name('Wave Amplitude').onChange(() => updateSpiral());

    // Interactive Modes
    const fMode = gui.addFolder('Interactive Mode');
    fMode.add(params, 'randomizerOnClick').name('Click Randomizer Mode');

    // Initial color & spiral build
    updateColors();

    // Toggle UI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Randomize scene on click
    function randomizeScene() {
      const randomHex = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');

      params.bgColor = randomHex();
      params.primaryColor = randomHex();
      params.secondaryColor = randomHex();
      params.circleScale = parseFloat((0.5 + Math.random() * 2.0).toFixed(1));
      params.spiralFactor = parseFloat((1.0003 + Math.random() * 0.0017).toFixed(4));
      params.animSpeed = parseFloat((0.5 + Math.random() * 1.5).toFixed(1));
      params.waveAmplitude = Math.random() > 0.5 ? Math.floor(Math.random() * 35) : 0;

      updateColors();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    let pointerDownTime = 0;
    let pointerDownPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      if (gui.domElement.contains(e.target)) return;
      pointerDownTime = performance.now();
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', (e) => {
      if (gui.domElement.contains(e.target)) return;
      const duration = performance.now() - pointerDownTime;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);

      if (params.randomizerOnClick && duration < 300 && dist < 6) {
        randomizeScene();
      }
    });

    // Animation Loop
    let accumulatedTime = 0;
    let lastT = 0;

    function animationLoop(t) {
      const delta = (t - lastT) * 0.001;
      lastT = t;
      accumulatedTime += (delta > 0.1 ? 0.016 : delta) * params.animSpeed * 1000;

      const time = accumulatedTime;

      // Handle Wave motion in geometry if active
      if (params.waveAmplitude > 0 || params.animationPreset === 'Pulsing Spiral Wave') {
        const amp = params.animationPreset === 'Pulsing Spiral Wave' ? Math.max(params.waveAmplitude, 20) : params.waveAmplitude;
        for (let i = 0; i < COUNT; i++) {
          const idx = i + 0.1;
          const r = Math.pow(idx, 0.5) * Math.pow(params.spiralFactor, idx);
          const a = idx * goldenAngle;
          const z = Math.sin(r * 0.015 - time * 0.0015) * amp;

          dummy.position.set(r * Math.cos(a), r * Math.sin(a), z);
          dummy.scale.setScalar(params.circleScale);
          dummy.updateMatrix();
          instancedMesh.setMatrixAt(i, dummy.matrix);
        }
        instancedMesh.instanceMatrix.needsUpdate = true;
      }

      // Handle Animation Presets
      if (params.animationPreset === 'Breathing Zoom (Original Classic)') {
        spiralGroup.rotation.set(0, 0, 0);
        const camDist = 600 + 500 * Math.sin(time / 2700);
        const dir = camera.position.clone().sub(controls.target);
        if (dir.lengthSq() < 0.0001) dir.set(0, 0, 1);
        dir.normalize();
        camera.position.copy(controls.target).add(dir.multiplyScalar(camDist));
      } else if (params.animationPreset === 'Static Camera (No Movement)') {
        spiralGroup.rotation.set(0, 0, 0);
      } else if (params.animationPreset === 'Orbiting Spiral Vortex') {
        spiralGroup.rotation.set(0, 0, 0);
        const radius = 650 + 150 * Math.sin(time / 3000);
        const angle = time * 0.0002;
        const camX = controls.target.x + radius * Math.sin(angle);
        const camY = controls.target.y + radius * Math.sin(angle * 0.5) * 0.3;
        const camZ = controls.target.z + radius * Math.cos(angle);
        camera.position.set(camX, camY, camZ);
      } else if (params.animationPreset === 'Pulsing Spiral Wave') {
        spiralGroup.rotation.set(0, 0, 0);
      } else if (params.animationPreset === 'Hypnotic Cosmic Rotation') {
        spiralGroup.rotation.z = time * 0.00015;
        spiralGroup.rotation.x = Math.sin(time * 0.00025) * 0.25;
      }

      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
