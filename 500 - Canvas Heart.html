<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      overflow: hidden;
      background: #FFF;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas#canvas {
      display: block;
      background: #FFF;
    }
  </style>
</head>
<body>
  <canvas id="canvas">Canvas not supported.</canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    class Tool {
      static randomNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
      }

      static randomColorRGB() {
        return (
          "rgb(" +
          this.randomNumber(0, 255) +
          ", " +
          this.randomNumber(0, 255) +
          ", " +
          this.randomNumber(0, 255) +
          ")"
        );
      }

      static randomColorHSL(saturation, lightness) {
        return (
          "hsl(" +
          this.randomNumber(0, 360) +
          ", " +
          saturation +
          "%, " +
          lightness +
          "%)"
        );
      }
    }

    const PALETTES = {
      'Palette: F6AA1C': ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
      'Palette: 63D1CF': ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'],
      'Palette: AA60C8': ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'],
      'Palette: FEF1BE': ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
      'Palette: D4FFB0': ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
      'Palette: FFE8CC': ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
      'Palette: E8E0FF': ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
      'Palette: E0FBFF': ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
    };

    const COLOR_SCHEMES = [
      'Original',
      'Monochromatic',
      'Analogous',
      'Complementary',
      'Split-complementary',
      'Triadic',
      'Tetradic',
      'Double split-complementary',
      'Achromatic',
      'Achromatic + Accent',
      'Neutral + accent',
      'Palette: F6AA1C',
      'Palette: 63D1CF',
      'Palette: AA60C8',
      'Palette: FEF1BE',
      'Palette: D4FFB0',
      'Palette: FFE8CC',
      'Palette: E8E0FF',
      'Palette: E0FBFF'
    ];

    class ColorHelper {
      static hslToHex(h, s, l) {
        l /= 100;
        const a = (s * Math.min(l, 1 - l)) / 100;
        const f = n => {
          const k = (n + h / 30) % 12;
          const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
          return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
      }

      static toHex(color) {
        if (!color) return '#ffffff';
        if (typeof color === 'string' && color.startsWith('#')) return color;
        const hslMatch = color.match(/hsl\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)/i);
        if (hslMatch) {
          return ColorHelper.hslToHex(parseFloat(hslMatch[1]), parseFloat(hslMatch[2]), parseFloat(hslMatch[3]));
        }
        const rgbMatch = color.match(/rgb\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*\)/i);
        if (rgbMatch) {
          const r = Math.round(parseFloat(rgbMatch[1])).toString(16).padStart(2, '0');
          const g = Math.round(parseFloat(rgbMatch[2])).toString(16).padStart(2, '0');
          const b = Math.round(parseFloat(rgbMatch[3])).toString(16).padStart(2, '0');
          return `#${r}${g}${b}`;
        }
        return color;
      }

      static getColor(scheme, baseHue) {
        if (PALETTES[scheme]) {
          const p = PALETTES[scheme];
          return p[Math.floor(Math.random() * p.length)];
        }

        switch (scheme) {
          case 'Original':
            return Tool.randomColorHSL(80, 60);

          case 'Monochromatic': {
            const sat = Tool.randomNumber(45, 95);
            const lit = Tool.randomNumber(35, 75);
            return `hsl(${baseHue}, ${sat}%, ${lit}%)`;
          }

          case 'Analogous': {
            const hueOffset = Tool.randomNumber(-35, 35);
            const hue = (baseHue + hueOffset + 360) % 360;
            return `hsl(${hue}, ${Tool.randomNumber(70, 95)}%, ${Tool.randomNumber(45, 70)}%)`;
          }

          case 'Complementary': {
            const hue = (baseHue + (Math.random() < 0.5 ? 0 : 180)) % 360;
            return `hsl(${hue}, ${Tool.randomNumber(75, 95)}%, ${Tool.randomNumber(45, 65)}%)`;
          }

          case 'Split-complementary': {
            const offsets = [0, 150, 210];
            const hue = (baseHue + offsets[Math.floor(Math.random() * offsets.length)]) % 360;
            return `hsl(${hue}, ${Tool.randomNumber(75, 95)}%, ${Tool.randomNumber(45, 65)}%)`;
          }

          case 'Triadic': {
            const offsets = [0, 120, 240];
            const hue = (baseHue + offsets[Math.floor(Math.random() * offsets.length)]) % 360;
            return `hsl(${hue}, ${Tool.randomNumber(75, 95)}%, ${Tool.randomNumber(45, 65)}%)`;
          }

          case 'Tetradic': {
            const offsets = [0, 90, 180, 270];
            const hue = (baseHue + offsets[Math.floor(Math.random() * offsets.length)]) % 360;
            return `hsl(${hue}, ${Tool.randomNumber(75, 95)}%, ${Tool.randomNumber(45, 65)}%)`;
          }

          case 'Double split-complementary': {
            const offsets = [-30, 30, 150, 210];
            const hue = (baseHue + offsets[Math.floor(Math.random() * offsets.length)] + 360) % 360;
            return `hsl(${hue}, ${Tool.randomNumber(75, 95)}%, ${Tool.randomNumber(45, 65)}%)`;
          }

          case 'Achromatic': {
            const shades = ['#080808', '#1a1a1a', '#333333', '#555555', '#777777', '#999999', '#bbbbbb', '#dddddd', '#ffffff'];
            return shades[Math.floor(Math.random() * shades.length)];
          }

          case 'Achromatic + Accent': {
            if (Math.random() < 0.35) {
              const reds = ['#ff0033', '#e50914', '#ff1744', '#b3001b'];
              return reds[Math.floor(Math.random() * reds.length)];
            }
            const shades = ['#080808', '#202020', '#444444', '#707070', '#aaaaaa', '#e0e0e0', '#ffffff'];
            return shades[Math.floor(Math.random() * shades.length)];
          }

          case 'Neutral + accent': {
            if (Math.random() < 0.35) {
              return `hsl(${baseHue}, 95%, 55%)`;
            }
            const neutrals = ['#25211e', '#3a3430', '#564d47', '#7b6f65', '#a4978c', '#c9bfb5', '#ebe4dc'];
            return neutrals[Math.floor(Math.random() * neutrals.length)];
          }

          default:
            return Tool.randomColorHSL(80, 60);
        }
      }
    }

    const settings = {
      // Background & Colors
      greenScreen: false,
      backgroundColor: '#ffffff',
      colorScheme: 'Original',
      baseHue: 0,
      customColor: false,
      heartColor: '#ff2d55',

      // Zoom & Drag
      zoom: 1.0,
      heartX: window.innerWidth / 2,
      heartY: window.innerHeight / 2,
      resetTransform: () => {},

      // Geometry
      startSize: window.innerWidth < 768 ? 75 : 150,
      stretchElasticity: 0.1,
      stretchDamping: 0.9,
      particleCountMin: 12,
      particleCountMax: 36,
      particleInitialSize: 1.0,
      particleGrowth: 0.1,

      // Motion
      pulseInterval: 50,
      rotationSpeed: 5,
      particleSpeed: 10,
      particleGravity: 0.05,

      // Procedural Variation
      clickToRandomize: true,
      randomizeNow: () => {}
    };

    let canvas;
    let gui;
    const controllers = {};

    class Canvas {
      constructor() {
        this.canvas = document.getElementById("canvas");
        this.ctx = this.canvas.getContext("2d");
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
        this.hearts = [];
        this.particles = [];
        this.heartNum = 1;
        this.mouseX = null;
        this.mouseY = null;
      }

      init() {
        this.hearts = [];
        for (let i = 0; i < this.heartNum; i++) {
          const s = new Heart(
            this.ctx,
            settings.heartX,
            settings.heartY,
            settings.startSize
          );
          this.hearts.push(s);
        }
        this.updateBackground();
      }

      updateBackground() {
        const bg = settings.greenScreen ? '#00ff00' : settings.backgroundColor;
        this.canvas.style.backgroundColor = bg;
        document.body.style.backgroundColor = bg;
      }

      render() {
        const bg = settings.greenScreen ? '#00ff00' : settings.backgroundColor;
        this.ctx.fillStyle = bg;
        this.ctx.fillRect(0, 0, this.width, this.height);

        const cx = this.width / 2;
        const cy = this.height / 2;

        this.ctx.save();
        this.ctx.translate(cx, cy);
        this.ctx.scale(settings.zoom, settings.zoom);
        this.ctx.translate(-cx, -cy);

        for (let i = 0; i < this.hearts.length; i++) {
          this.hearts[i].render(i);
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
          this.particles[i].render(i);
        }

        this.ctx.restore();
      }

      resize() {
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
        if (controllers.heartX) controllers.heartX.max(this.width);
        if (controllers.heartY) controllers.heartY.max(this.height);
      }
    }

    class Heart {
      constructor(ctx, x, y, r) {
        this.ctx = ctx;
        this.init(x, y, r);
      }

      init(x, y, r) {
        this.x = x;
        this.y = y;
        this.r = r * 0.8;
        this.maxR = r;
        this.c = settings.customColor
          ? settings.heartColor
          : ColorHelper.getColor(settings.colorScheme, settings.baseHue);
        settings.heartColor = ColorHelper.toHex(this.c);
        if (controllers.heartColor) controllers.heartColor.updateDisplay();

        this.a = 0;
        this.rad = (this.a * Math.PI) / 180;
        this.v = {
          r: 0
        };
        this.l = settings.pulseInterval;
        this.hover = false;
      }

      draw() {
        const ctx = this.ctx;
        ctx.save();
        ctx.fillStyle = this.c;
        if (this.hover === true) {
          ctx.translate(this.x, this.y);
          ctx.rotate(Math.sin(this.rad) * 0.25);
          ctx.translate(-this.x, -this.y);
        }
        ctx.beginPath();
        ctx.moveTo(this.x, this.y + this.r);
        ctx.bezierCurveTo(
          this.x - this.r - this.r / 5,
          this.y + this.r / 1.5,
          this.x - this.r,
          this.y - this.r,
          this.x,
          this.y - this.r / 3
        );
        ctx.bezierCurveTo(
          this.x + this.r,
          this.y - this.r,
          this.x + this.r + this.r / 5,
          this.y + this.r / 1.5,
          this.x,
          this.y + this.r
        );
        ctx.closePath();
        ctx.fill();

        if (canvas.mouseX !== null && canvas.mouseY !== null && ctx.isPointInPath(canvas.mouseX, canvas.mouseY)) {
          this.hover = true;
        } else {
          this.hover = false;
        }
        ctx.restore();
      }

      stretch() {
        this.v.r += (this.maxR - this.r) * settings.stretchElasticity;
        this.v.r *= settings.stretchDamping;
        this.r += this.v.r;

        if (this.l < 0) {
          this.l = settings.pulseInterval;
          this.r = this.r * 0.8;

          if (settings.customColor) {
            this.c = settings.heartColor;
          } else {
            this.c = ColorHelper.getColor(settings.colorScheme, settings.baseHue);
            settings.heartColor = ColorHelper.toHex(this.c);
            if (controllers.heartColor) controllers.heartColor.updateDisplay();
          }

          const num = Tool.randomNumber(settings.particleCountMin, settings.particleCountMax);
          for (let i = 0; i < num; i++) {
            const pColor = settings.customColor
              ? this.c
              : ColorHelper.getColor(settings.colorScheme, settings.baseHue);
            const p = new Particle(this.ctx, this.x, this.y, pColor);
            canvas.particles.push(p);
          }
        }
      }

      updateParams() {
        this.a += settings.rotationSpeed;
        this.rad = (this.a * Math.PI) / 180;
        this.l -= 1;
      }

      render() {
        this.updateParams();
        this.stretch();
        this.draw();
      }
    }

    class Particle {
      constructor(ctx, x, y, c) {
        this.ctx = ctx;
        this.init(x, y, c);
      }

      init(x, y, c) {
        this.x = x;
        this.y = y;
        this.c = c;
        this.r = settings.particleInitialSize;
        const angle = (Tool.randomNumber(0, 360) * Math.PI) / 180;
        const speed = settings.particleSpeed * Math.random();
        this.v = {
          x: Math.cos(angle) * speed,
          y: Math.sin(angle) * speed
        };
        this.ga = Math.random();
        this.growth = settings.particleGrowth;
        this.gravity = settings.particleGravity;
      }

      draw() {
        const ctx = this.ctx;
        ctx.save();
        ctx.fillStyle = this.c;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2, false);
        ctx.fill();
        ctx.restore();
      }

      updatePosition() {
        this.v.y += this.gravity;
        this.x += this.v.x;
        this.y += this.v.y;
        this.r += this.growth;
      }

      deleteParticle(i) {
        if (
          this.y > canvas.height + 400 ||
          this.y < -500 ||
          this.x < -500 ||
          this.x > canvas.width + 500 ||
          this.r > 80
        ) {
          canvas.particles.splice(i, 1);
        }
      }

      render(i) {
        this.updatePosition();
        this.deleteParticle(i);
        this.draw();
      }
    }

    function randomizeScene() {
      settings.colorScheme = COLOR_SCHEMES[Tool.randomNumber(0, COLOR_SCHEMES.length - 1)];
      settings.baseHue = Tool.randomNumber(0, 360);
      settings.customColor = false;

      if (!settings.greenScreen) {
        if (PALETTES[settings.colorScheme]) {
          const pal = PALETTES[settings.colorScheme];
          const usePalBg = Math.random() < 0.6;
          settings.backgroundColor = usePalBg ? pal[pal.length - 1] : (Math.random() < 0.5 ? '#ffffff' : '#090612');
        } else if (settings.colorScheme === 'Achromatic') {
          settings.backgroundColor = Math.random() < 0.5 ? '#000000' : '#ffffff';
        } else if (settings.colorScheme === 'Achromatic + Accent') {
          settings.backgroundColor = Math.random() < 0.5 ? '#101010' : '#f8f8f8';
        } else {
          settings.backgroundColor = Math.random() < 0.5 ? '#ffffff' : '#0a0a0f';
        }
        canvas.updateBackground();
      }

      settings.startSize = Tool.randomNumber(80, 220);
      settings.stretchElasticity = Math.round(Tool.randomNumber(5, 22)) / 100;
      settings.stretchDamping = Math.round(Tool.randomNumber(82, 95)) / 100;
      settings.particleCountMin = Tool.randomNumber(8, 25);
      settings.particleCountMax = Tool.randomNumber(30, 75);
      settings.particleInitialSize = Math.round(Tool.randomNumber(8, 25)) / 10;
      settings.particleGrowth = Math.round(Tool.randomNumber(5, 25)) / 100;

      settings.pulseInterval = Tool.randomNumber(25, 75);
      settings.rotationSpeed = Tool.randomNumber(2, 10);
      settings.particleSpeed = Tool.randomNumber(6, 18);
      settings.particleGravity = Math.round(Tool.randomNumber(1, 15)) / 100;

      if (canvas.hearts[0]) {
        canvas.hearts[0].maxR = settings.startSize;
        canvas.hearts[0].r = settings.startSize * 0.8;
        canvas.hearts[0].c = ColorHelper.getColor(settings.colorScheme, settings.baseHue);
        settings.heartColor = ColorHelper.toHex(canvas.hearts[0].c);

        const burstCount = Tool.randomNumber(settings.particleCountMin, settings.particleCountMax);
        for (let i = 0; i < burstCount; i++) {
          const pColor = ColorHelper.getColor(settings.colorScheme, settings.baseHue);
          canvas.particles.push(new Particle(canvas.ctx, canvas.hearts[0].x, canvas.hearts[0].y, pColor));
        }
      }

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    settings.randomizeNow = randomizeScene;

    settings.resetTransform = () => {
      settings.zoom = 1.0;
      settings.heartX = canvas.width / 2;
      settings.heartY = canvas.height / 2;
      if (canvas.hearts[0]) {
        canvas.hearts[0].x = settings.heartX;
        canvas.hearts[0].y = settings.heartY;
      }
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    };

    function initGUI() {
      gui = new GUI({ title: 'Scene Controls' });

      // Color & Theme Folder
      const fColor = gui.addFolder('Colors & Themes');
      controllers.colorScheme = fColor.add(settings, 'colorScheme', COLOR_SCHEMES).name('Color Scheme').onChange(val => {
        if (!settings.customColor && canvas.hearts[0]) {
          canvas.hearts[0].c = ColorHelper.getColor(val, settings.baseHue);
          settings.heartColor = ColorHelper.toHex(canvas.hearts[0].c);
          controllers.heartColor.updateDisplay();
        }
      });
      controllers.customColor = fColor.add(settings, 'customColor').name('Custom Color Override').onChange(val => {
        if (val && canvas.hearts[0]) {
          canvas.hearts[0].c = settings.heartColor;
        }
      });
      controllers.heartColor = fColor.addColor(settings, 'heartColor').name('Heart Color').onChange(val => {
        settings.customColor = true;
        controllers.customColor.updateDisplay();
        if (canvas.hearts[0]) {
          canvas.hearts[0].c = val;
        }
      });
      controllers.backgroundColor = fColor.addColor(settings, 'backgroundColor').name('Background Color').onChange(() => {
        canvas.updateBackground();
      });
      controllers.greenScreen = fColor.add(settings, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => {
        canvas.updateBackground();
      });

      // Transform & Navigation Folder
      const fTransform = gui.addFolder('Zoom & Position');
      controllers.zoom = fTransform.add(settings, 'zoom', 0.2, 5.0, 0.01).name('Zoom Scale');
      controllers.heartX = fTransform.add(settings, 'heartX', 0, window.innerWidth, 1).name('Position X').onChange(val => {
        if (canvas.hearts[0]) canvas.hearts[0].x = val;
      });
      controllers.heartY = fTransform.add(settings, 'heartY', 0, window.innerHeight, 1).name('Position Y').onChange(val => {
        if (canvas.hearts[0]) canvas.hearts[0].y = val;
      });
      fTransform.add(settings, 'resetTransform').name('Reset Transform');

      // Geometry Parameters
      const fGeom = gui.addFolder('Geometry');
      controllers.startSize = fGeom.add(settings, 'startSize', 30, 300, 1).name('Heart Radius').onChange(val => {
        if (canvas.hearts[0]) {
          canvas.hearts[0].maxR = val;
          canvas.hearts[0].r = val * 0.8;
        }
      });
      controllers.stretchElasticity = fGeom.add(settings, 'stretchElasticity', 0.02, 0.3, 0.01).name('Elasticity');
      controllers.stretchDamping = fGeom.add(settings, 'stretchDamping', 0.7, 0.98, 0.01).name('Damping');
      controllers.particleCountMin = fGeom.add(settings, 'particleCountMin', 5, 50, 1).name('Min Particles');
      controllers.particleCountMax = fGeom.add(settings, 'particleCountMax', 15, 120, 1).name('Max Particles');
      controllers.particleInitialSize = fGeom.add(settings, 'particleInitialSize', 0.5, 5.0, 0.1).name('Particle Size');
      controllers.particleGrowth = fGeom.add(settings, 'particleGrowth', 0.01, 0.4, 0.01).name('Particle Growth');

      // Motion & Dynamics
      const fMotion = gui.addFolder('Motion & Dynamics');
      controllers.pulseInterval = fMotion.add(settings, 'pulseInterval', 15, 120, 1).name('Pulse Interval');
      controllers.rotationSpeed = fMotion.add(settings, 'rotationSpeed', 1, 20, 1).name('Wobble Speed');
      controllers.particleSpeed = fMotion.add(settings, 'particleSpeed', 2, 25, 1).name('Burst Speed');
      controllers.particleGravity = fMotion.add(settings, 'particleGravity', -0.1, 0.4, 0.01).name('Gravity');

      // Procedural Variation
      const fProc = gui.addFolder('Procedural Variations');
      controllers.clickToRandomize = fProc.add(settings, 'clickToRandomize').name('Click Scene to Re-roll');
      fProc.add(settings, 'randomizeNow').name('Randomize Now');
    }

    window.addEventListener('load', () => {
      canvas = new Canvas();
      canvas.init();
      initGUI();

      function renderLoop() {
        window.requestAnimationFrame(() => {
          canvas.render();
          renderLoop();
        });
      }
      renderLoop();

      // Window resize
      window.addEventListener('resize', () => {
        canvas.resize();
        if (canvas.hearts[0]) {
          settings.heartX = canvas.hearts[0].x;
          settings.heartY = canvas.hearts[0].y;
          controllers.heartX?.updateDisplay();
          controllers.heartY?.updateDisplay();
        }
      }, false);

      // Mouse wheel zoom
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) {
          return;
        }
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        let newZoom = settings.zoom * factor;
        newZoom = Math.max(0.2, Math.min(5.0, newZoom));
        settings.zoom = Math.round(newZoom * 100) / 100;
        controllers.zoom?.updateDisplay();
      }, { passive: false });

      // Dragging and Click-to-randomize
      let isPointerDown = false;
      let isDragging = false;
      let startClientX = 0;
      let startClientY = 0;
      let startHeartX = 0;
      let startHeartY = 0;

      canvas.canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;

        isPointerDown = true;
        isDragging = false;
        startClientX = e.clientX;
        startClientY = e.clientY;

        if (canvas.hearts[0]) {
          startHeartX = canvas.hearts[0].x;
          startHeartY = canvas.hearts[0].y;
        }

        try {
          canvas.canvas.setPointerCapture(e.pointerId);
        } catch (err) {}
      });

      canvas.canvas.addEventListener('pointermove', (e) => {
        canvas.mouseX = e.clientX;
        canvas.mouseY = e.clientY;

        if (isPointerDown && canvas.hearts[0]) {
          const dx = e.clientX - startClientX;
          const dy = e.clientY - startClientY;

          if (!isDragging && Math.hypot(dx, dy) > 5) {
            isDragging = true;
            canvas.canvas.style.cursor = 'grabbing';
            document.body.style.cursor = 'grabbing';
          }

          if (isDragging) {
            canvas.hearts[0].x = startHeartX + dx / settings.zoom;
            canvas.hearts[0].y = startHeartY + dy / settings.zoom;
            settings.heartX = Math.round(canvas.hearts[0].x);
            settings.heartY = Math.round(canvas.hearts[0].y);
            controllers.heartX?.updateDisplay();
            controllers.heartY?.updateDisplay();
          }
        } else {
          if (canvas.hearts[0] && canvas.hearts[0].hover) {
            canvas.canvas.style.cursor = 'grab';
          } else {
            canvas.canvas.style.cursor = 'default';
          }
        }
      });

      const handlePointerUp = (e) => {
        if (isPointerDown) {
          if (!isDragging) {
            if (settings.clickToRandomize) {
              randomizeScene();
            }
          }
        }
        isPointerDown = false;
        isDragging = false;
        canvas.canvas.style.cursor = (canvas.hearts[0] && canvas.hearts[0].hover) ? 'grab' : 'default';
        document.body.style.cursor = 'default';

        try {
          canvas.canvas.releasePointerCapture(e.pointerId);
        } catch (err) {}
      };

      canvas.canvas.addEventListener('pointerup', handlePointerUp);
      canvas.canvas.addEventListener('pointercancel', handlePointerUp);

      // Pinch zoom for touch devices
      let initialPinchDist = null;
      let initialPinchZoom = 1;

      canvas.canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          initialPinchDist = Math.hypot(dx, dy);
          initialPinchZoom = settings.zoom;
        }
      }, { passive: true });

      canvas.canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDist) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          let newZoom = initialPinchZoom * (dist / initialPinchDist);
          newZoom = Math.max(0.2, Math.min(5.0, newZoom));
          settings.zoom = Math.round(newZoom * 100) / 100;
          controllers.zoom?.updateDisplay();
        }
      }, { passive: true });

      canvas.canvas.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialPinchDist = null;
        }
      }, { passive: true });

      // Toggle UI with "H" key
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) {
          return;
        }
        if (e.key === 'h' || e.key === 'H') {
          if (gui) {
            if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
              if (gui._hidden) {
                gui.show();
              } else {
                gui.hide();
              }
            } else {
              gui.domElement.style.display = gui.domElement.style.display === 'none' ? '' : 'none';
            }
          }
        }
      });
    });
  </script>
</body>
</html>
