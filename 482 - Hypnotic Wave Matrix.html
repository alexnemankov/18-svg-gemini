<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypnotic Wave Matrix - 482</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 19 Preconfigured Color Schemes
    const colorSchemes = {
      'Original': {
        colors: ['#FF0000', '#00FF00', '#0000FF'],
        bg: '#000000'
      },
      'Monochromatic': {
        colors: ['#00e5ff', '#0099ff', '#0044ff'],
        bg: '#020814'
      },
      'Analogous': {
        colors: ['#00f5d4', '#00bbf9', '#4361ee'],
        bg: '#040718'
      },
      'Complementary': {
        colors: ['#00f0ff', '#ff5400', '#00a6fb'],
        bg: '#060612'
      },
      'Split-complementary': {
        colors: ['#ff6b35', '#04e762', '#0077b6'],
        bg: '#080812'
      },
      'Triadic': {
        colors: ['#ff007f', '#00f5d4', '#ffe600'],
        bg: '#0a0614'
      },
      'Tetradic': {
        colors: ['#ff0055', '#00f5d4', '#ffbe0b', '#7b2cbf'],
        bg: '#050410'
      },
      'Double split-complementary': {
        colors: ['#ff006e', '#8338ec', '#3a86ff', '#00f5d4'],
        bg: '#04020c'
      },
      'Achromatic (B&W)': {
        colors: ['#ffffff', '#cccccc', '#777777'],
        bg: '#000000'
      },
      'Achromatic + Accent (B&W + Red)': {
        colors: ['#ffffff', '#888888', '#ff0033'],
        bg: '#000000'
      },
      'Neutral + Accent': {
        colors: ['#d4c5b9', '#8c8275', '#ff5500'],
        bg: '#181513'
      },
      'Palette 1 (F6AA1C)': {
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C'],
        bg: '#220901'
      },
      'Palette 2 (63D1CF)': {
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B'],
        bg: '#000000'
      },
      'Palette 3 (AA60C8)': {
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D'],
        bg: '#120A12'
      },
      'Palette 4 (FEF1BE)': {
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D'],
        bg: '#061210'
      },
      'Palette 5 (D4FFB0)': {
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322'],
        bg: '#05140A'
      },
      'Palette 6 (FFE8CC)': {
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050'],
        bg: '#0E0618'
      },
      'Palette 7 (E8E0FF)': {
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250'],
        bg: '#090612'
      },
      'Palette 8 (E0FBFF)': {
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D'],
        bg: '#05020F'
      }
    };

    // Parameters state
    const params = {
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: '#000000',
      color1: '#FF0000',
      color2: '#00FF00',
      color3: '#0000FF',
      color4: '#FFFFFF',
      color5: '#FFAA00',
      layers: 3,
      blendMode: 'lighter',

      // Camera / Transform
      zoom: 1.0,
      panX: 0,
      panY: 0,

      // Geometry & Motion
      speed: 1.0,
      diameter: 20,
      sizeMultiplier: 1.0,
      tanFreq: 1.0,
      sinFreq: 0.01,

      // Interactivity
      clickToRandomize: true
    };

    let w = window;
    let m = Math;
    let c, C, W, H, HW, HH, r;
    let lastTimestamp = 0;
    let simTime = 0;

    // Canvas initialization
    const a = function () {
      c = document.createElement('canvas');
      document.body.appendChild(c);
      c.style.background = params.backgroundColor;
      C = c.getContext('2d');
    };

    // Canvas resize
    const b = function () {
      W = c.width = w.innerWidth;
      H = c.height = w.innerHeight;
      HW = W / 2;
      HH = H / 2;
    };

    // Update background according to greenscreen and background color
    function updateBackground() {
      const bg = params.greenscreen ? '#00ff00' : params.backgroundColor;
      if (c) c.style.background = bg;
      document.body.style.background = bg;
    }

    // Apply color scheme
    function applyColorScheme(name) {
      const scheme = colorSchemes[name];
      if (!scheme) return;
      params.colorScheme = name;
      params.backgroundColor = scheme.bg;
      params.layers = scheme.colors.length;

      if (scheme.colors[0]) params.color1 = scheme.colors[0];
      if (scheme.colors[1]) params.color2 = scheme.colors[1];
      if (scheme.colors[2]) params.color3 = scheme.colors[2];
      if (scheme.colors[3]) params.color4 = scheme.colors[3];
      if (scheme.colors[4]) params.color5 = scheme.colors[4];

      updateBackground();
      updateAllControllers(gui);
    }

    // Recursive update of all GUI controls
    function updateAllControllers(folder) {
      if (!folder) return;
      if (folder.controllers) {
        folder.controllers.forEach(controller => controller.updateDisplay());
      }
      if (folder.folders) {
        folder.folders.forEach(subFolder => updateAllControllers(subFolder));
      }
    }

    // Procedural randomization on click
    function randomizeScene() {
      const schemeNames = Object.keys(colorSchemes);
      const chosenScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
      applyColorScheme(chosenScheme);

      const dir = Math.random() < 0.25 ? -1 : 1;
      params.speed = +(dir * (0.4 + Math.random() * 2.0)).toFixed(2);
      params.diameter = Math.floor(12 + Math.random() * 26);
      params.sizeMultiplier = +(0.5 + Math.random() * 1.5).toFixed(2);
      params.tanFreq = +(0.5 + Math.random() * 1.5).toFixed(2);
      params.sinFreq = +(0.005 + Math.random() * 0.025).toFixed(4);

      updateAllControllers(gui);
    }

    // Render loop
    const f = function (timestamp) {
      if (typeof timestamp !== 'number') timestamp = performance.now();
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      simTime += (dt * params.speed) / 3000;
      const t = simTime;

      C.clearRect(0, 0, W, H);
      C.save();
      C.globalCompositeOperation = params.blendMode;

      // Pan and zoom transform
      C.translate(HW + params.panX, HH + params.panY);
      C.scale(params.zoom, params.zoom);
      C.translate(-HW, -HH);

      const diam = params.diameter;
      const sizeMul = params.sizeMultiplier;
      const sinF = params.sinFreq;
      const tanF = params.tanFreq;

      const activeColors = [params.color1, params.color2, params.color3, params.color4, params.color5].slice(0, params.layers);
      const layerCount = activeColors.length;

      for (let k = 0; k < layerCount; k++) {
        C.fillStyle = activeColors[k];
        for (let i = 0; i < H; i += diam) {
          for (let j = 0; j < W / 2; j += diam) {
            const index = i * W + j;
            C.globalAlpha = m.tan((index * index - t) * tanF);
            C.fillRect(
              m.tan(i * j - m.sin(index + k * sinF) + t) * j + HW - diam / 2,
              i,
              (m.tan(index + i / j + t + k * sinF) / 2 * diam / 2) * sizeMul,
              (m.tan((index * index - t) * tanF) * diam / 2) * sizeMul
            );
          }
        }
      }

      C.restore();
      r = requestAnimationFrame(f);
    };

    // Setup GUI
    const gui = new GUI({ title: 'Scene Controls' });

    const fTheme = gui.addFolder('Color Schemes & Background');
    fTheme.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Scheme').onChange(applyColorScheme);
    fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);
    fTheme.addColor(params, 'backgroundColor').name('Background Color').onChange(updateBackground);
    fTheme.addColor(params, 'color1').name('Color 1');
    fTheme.addColor(params, 'color2').name('Color 2');
    fTheme.addColor(params, 'color3').name('Color 3');
    fTheme.addColor(params, 'color4').name('Color 4');
    fTheme.addColor(params, 'color5').name('Color 5');
    fTheme.add(params, 'layers', 1, 5, 1).name('Active Layers');
    fTheme.add(params, 'blendMode', ['lighter', 'source-over', 'screen', 'difference']).name('Blend Mode');

    const fCamera = gui.addFolder('Camera / Navigation');
    const zoomCtrl = fCamera.add(params, 'zoom', 0.1, 10, 0.01).name('Zoom');
    const panXCtrl = fCamera.add(params, 'panX', -2000, 2000, 1).name('Pan X');
    const panYCtrl = fCamera.add(params, 'panY', -2000, 2000, 1).name('Pan Y');
    fCamera.add({
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        zoomCtrl.updateDisplay();
        panXCtrl.updateDisplay();
        panYCtrl.updateDisplay();
      }
    }, 'resetView').name('Reset View');

    const fMotion = gui.addFolder('Geometry & Motion');
    fMotion.add(params, 'speed', -3, 3, 0.05).name('Speed');
    fMotion.add(params, 'diameter', 10, 50, 1).name('Diameter (Grid)');
    fMotion.add(params, 'sizeMultiplier', 0.2, 3, 0.05).name('Size Multiplier');
    fMotion.add(params, 'tanFreq', 0.2, 3, 0.05).name('Tan Frequency');
    fMotion.add(params, 'sinFreq', 0.001, 0.05, 0.001).name('Sin Frequency');

    const fInteraction = gui.addFolder('Procedural Randomization');
    fInteraction.add(params, 'clickToRandomize').name('Click to Randomize');
    fInteraction.add({ randomizeNow: randomizeScene }, 'randomizeNow').name('Randomize Now');

    // Pan and Zoom with Mouse Wheel & Drag
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let originPanX = 0, originPanY = 0;
    let hasMoved = false;

    window.addEventListener('wheel', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      e.preventDefault();

      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const oldZoom = params.zoom;
      const newZoom = Math.min(Math.max(oldZoom * zoomFactor, 0.1), 10.0);

      // Keep point under cursor fixed in world space
      params.panX = (mouseX - HW) - (mouseX - HW - params.panX) * (newZoom / oldZoom);
      params.panY = (mouseY - HH) - (mouseY - HH - params.panY) * (newZoom / oldZoom);
      params.zoom = newZoom;

      zoomCtrl.updateDisplay();
      panXCtrl.updateDisplay();
      panYCtrl.updateDisplay();
    }, { passive: false });

    window.addEventListener('mousedown', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      if (e.button !== 0) return;

      isDragging = true;
      hasMoved = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      originPanX = params.panX;
      originPanY = params.panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.hypot(dx, dy) > 5) {
        hasMoved = true;
      }
      params.panX = originPanX + dx;
      params.panY = originPanY + dy;
      panXCtrl.updateDisplay();
      panYCtrl.updateDisplay();
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

      if (!hasMoved) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // Touch support for mobile / tablets
    let isTouchDragging = false;
    let touchMoved = false;
    let touchStartX = 0, touchStartY = 0;
    let touchOriginPanX = 0, touchOriginPanY = 0;
    let touchStartDist = 0;
    let touchStartZoom = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      if (e.touches.length === 1) {
        isTouchDragging = true;
        touchMoved = false;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchOriginPanX = params.panX;
        touchOriginPanY = params.panY;
      } else if (e.touches.length === 2) {
        isTouchDragging = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        touchStartZoom = params.zoom;
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      if (e.touches.length === 1 && isTouchDragging) {
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        if (Math.hypot(dx, dy) > 5) touchMoved = true;
        params.panX = touchOriginPanX + dx;
        params.panY = touchOriginPanY + dy;
        panXCtrl.updateDisplay();
        panYCtrl.updateDisplay();
      } else if (e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (touchStartDist > 0) {
          params.zoom = Math.min(Math.max(touchStartZoom * (dist / touchStartDist), 0.1), 10.0);
          zoomCtrl.updateDisplay();
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (isTouchDragging && !touchMoved && e.touches.length === 0) {
        if (!e.target.closest || !e.target.closest('.lil-gui')) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
      }
      if (e.touches.length === 0) {
        isTouchDragging = false;
      }
    });

    // Keyboard shortcut: H key to toggle UI
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) {
        return;
      }
      if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Bootstrap
    function init() {
      a();
      b();
      updateBackground();
      r = requestAnimationFrame(f);
      w.addEventListener('resize', () => {
        cancelAnimationFrame(r);
        b();
        r = requestAnimationFrame(f);
      });
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    } else {
      window.addEventListener('DOMContentLoaded', init);
    }
  </script>
</body>
</html>
