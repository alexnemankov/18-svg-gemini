<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low Poly Planet</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-image: radial-gradient(circle, #73aad6, #003962, #000);
      transition: background 0.3s ease;
    }

    body.greenscreen {
      background: #00ff00 !important;
      background-image: none !important;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r124/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.124.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    function App() {
      const conf = {
        el: 'canvas',
        fov: 50,
        cameraZ: 400,
      };

      const { WebGLRenderer, PerspectiveCamera, OrbitControls, AmbientLight, DirectionalLight, Scene } = THREE;
      const { Object3D, CylinderGeometry, IcosahedronGeometry, SphereGeometry, MeshLambertMaterial, Mesh, Vector3 } = THREE;
      const { randFloat: rnd, randFloatSpread: rndFS } = THREE.Math;
      const { random, PI } = Math;
      const simplex = new SimplexNoise();
      const clock = new THREE.Clock();

      let renderer, scene, camera, cameraCtrl;
      let width, height;
      let planet, planetMesh;
      let objects = [];
      let treeData = [];
      let rockData = [];
      let noises = [];

      // Procedural Noise & Geometric Parameters
      const noiseWaterTreshold = 0.4;
      const noiseWaterLevel = 0.2;

      let currentNoiseF = 0.015;
      let currentNoiseD = 15;
      let currentTreeDensity = 0.3;
      let currentPointsCount = 800;

      // Color Presets
      const colorPresets = {
        'Lush Earth': {
          land: '#417B2B',
          water: '#2080D0',
          foliage: ['#509A36', '#FF5A36', '#509A36', '#FFC236', '#509A36'],
          trunk: '#764114',
          rock: '#808080',
          bgInner: '#73aad6',
          bgMid: '#003962',
          bgOuter: '#000000'
        },
        'Autumn Harvest': {
          land: '#8B4513',
          water: '#2A4B7C',
          foliage: ['#D97706', '#EF4444', '#F59E0B', '#B91C1C', '#D97706'],
          trunk: '#3E2723',
          rock: '#52525B',
          bgInner: '#d97706',
          bgMid: '#451a03',
          bgOuter: '#0f0500'
        },
        'Cyberpunk Synthwave': {
          land: '#4C1D95',
          water: '#06B6D4',
          foliage: ['#EC4899', '#8B5CF6', '#3B82F6', '#14B8A6', '#EC4899'],
          trunk: '#1E1B4B',
          rock: '#475569',
          bgInner: '#831843',
          bgMid: '#31103f',
          bgOuter: '#090514'
        },
        'Alien Crystal Cosmos': {
          land: '#0F766E',
          water: '#4C1D95',
          foliage: ['#84CC16', '#10B981', '#06B6D4', '#E11D48', '#84CC16'],
          trunk: '#132e35',
          rock: '#94A3B8',
          bgInner: '#0f766e',
          bgMid: '#092e38',
          bgOuter: '#020d12'
        },
        'Volcanic Magma': {
          land: '#18181B',
          water: '#DC2626',
          foliage: ['#F97316', '#EAB308', '#EF4444', '#F97316', '#EAB308'],
          trunk: '#27272A',
          rock: '#3F3F46',
          bgInner: '#991b1b',
          bgMid: '#450a0a',
          bgOuter: '#0a0000'
        }
      };

      // Control Parameters
      const params = {
        clickToRegenerate: true,
        greenscreen: false,
        colorPreset: 'Lush Earth',
        landColor: colorPresets['Lush Earth'].land,
        waterColor: colorPresets['Lush Earth'].water,
        trunkColor: colorPresets['Lush Earth'].trunk,
        rockColor: colorPresets['Lush Earth'].rock,
        bgInner: colorPresets['Lush Earth'].bgInner,
        bgMid: colorPresets['Lush Earth'].bgMid,
        bgOuter: colorPresets['Lush Earth'].bgOuter,
        foliageColors: [...colorPresets['Lush Earth'].foliage],
        animPreset: 'Orbit & Gentle Float',
        animSpeed: 1.0,
        dpr: Math.min(window.devicePixelRatio, 2)
      };

      let gui;

      init();

      function init() {
        renderer = new WebGLRenderer({ canvas: document.getElementById(conf.el), antialias: true, alpha: true });
        renderer.setPixelRatio(params.dpr);

        camera = new PerspectiveCamera(conf.fov);
        camera.position.z = conf.cameraZ;

        cameraCtrl = new OrbitControls(camera, renderer.domElement);
        cameraCtrl.enableDamping = true;
        cameraCtrl.dampingFactor = 0.1;
        cameraCtrl.rotateSpeed = 0.5;
        cameraCtrl.zoomSpeed = 1.0;
        cameraCtrl.panSpeed = 0.8;
        cameraCtrl.enableZoom = true;
        cameraCtrl.enablePan = true;
        cameraCtrl.enableRotate = true;
        cameraCtrl.autoRotate = true;
        cameraCtrl.autoRotateSpeed = 0.5;

        updateSize();
        window.addEventListener('resize', updateSize, false);

        initScene();
        initGUI();
        initClickInteraction();
        animate();
      }

      function initClickInteraction() {
        let pointerDownPos = { x: 0, y: 0 };
        window.addEventListener('pointerdown', (e) => {
          if (e.target.closest && e.target.closest('.lil-gui')) return;
          pointerDownPos.x = e.clientX;
          pointerDownPos.y = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
          if (e.target.closest && e.target.closest('.lil-gui')) return;
          const dx = e.clientX - pointerDownPos.x;
          const dy = e.clientY - pointerDownPos.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 5 && params.clickToRegenerate) {
            regenerateScene();
          }
        });
      }

      function regenerateScene() {
        // Randomly pick color scheme
        const presetKeys = Object.keys(colorPresets);
        const randomPreset = presetKeys[Math.floor(Math.random() * presetKeys.length)];
        params.colorPreset = randomPreset;
        const p = colorPresets[randomPreset];
        params.landColor = p.land;
        params.waterColor = p.water;
        params.trunkColor = p.trunk;
        params.rockColor = p.rock;
        params.bgInner = p.bgInner;
        params.bgMid = p.bgMid;
        params.bgOuter = p.bgOuter;
        params.foliageColors = [...p.foliage];

        // Randomly pick animation preset
        const animPresets = ['Orbit & Gentle Float', 'Breath & Pulse', 'Cosmic Wobble', 'Cinematic Flyby', 'Static (No Motion)'];
        params.animPreset = animPresets[Math.floor(Math.random() * animPresets.length)];

        // Randomize speed multiplier
        params.animSpeed = parseFloat((0.5 + Math.random() * 1.5).toFixed(1));

        // Randomize geometric parameters
        currentNoiseF = parseFloat((0.01 + Math.random() * 0.015).toFixed(4));
        currentNoiseD = Math.floor(8 + Math.random() * 14);
        currentTreeDensity = parseFloat((0.2 + Math.random() * 0.3).toFixed(2));
        currentPointsCount = Math.floor(500 + Math.random() * 500);

        // Remove existing planet mesh and children from scene
        if (planet) {
          scene.remove(planet);
          planet.traverse(child => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
              if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
              else child.material.dispose();
            }
          });
        }

        buildPlanet();

        // Update GUI display
        if (gui) {
          gui.controllers.concat(gui.folders.flatMap(f => f.controllers)).forEach(c => c.updateDisplay());
        }
      }

      function initGUI() {
        gui = new GUI({ title: 'Scene Settings' });

        // Click to Regenerate Mode Toggle & Button
        gui.add(params, 'clickToRegenerate').name('Click to Regenerate');
        gui.add({ regenerate: () => regenerateScene() }, 'regenerate').name('⚡ Regenerate Now');

        // Greenscreen
        gui.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);

        // Color Presets Dropdown
        gui.add(params, 'colorPreset', Object.keys(colorPresets)).name('Color Scheme').onChange(applyColorScheme);

        // Individual Colors Folder
        const fColors = gui.addFolder('Custom Colors');
        fColors.addColor(params, 'landColor').name('Land Color').onChange(updateColors);
        fColors.addColor(params, 'waterColor').name('Water Color').onChange(updateColors);
        fColors.addColor(params, 'trunkColor').name('Trunk Color').onChange(updateColors);
        fColors.addColor(params, 'rockColor').name('Rock Color').onChange(updateColors);
        fColors.addColor(params, 'bgInner').name('BG Radial Inner').onChange(updateBackground);
        fColors.addColor(params, 'bgMid').name('BG Radial Mid').onChange(updateBackground);
        fColors.addColor(params, 'bgOuter').name('BG Radial Outer').onChange(updateBackground);

        // Animation Settings Folder
        const fAnim = gui.addFolder('Animation');
        fAnim.add(params, 'animPreset', [
          'Orbit & Gentle Float',
          'Breath & Pulse',
          'Cosmic Wobble',
          'Cinematic Flyby',
          'Static (No Motion)'
        ]).name('Preset Animation');
        fAnim.add(params, 'animSpeed', 0.0, 3.0, 0.1).name('Speed Multiplier');

        // Render Settings Folder
        const fRender = gui.addFolder('Rendering');
        fRender.add(params, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange(v => renderer.setPixelRatio(v));

        // Keyboard Shortcut to Hide UI with 'H'
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            gui._hidden ? gui.show() : gui.hide();
          }
        });
      }

      function applyColorScheme(presetName) {
        const p = colorPresets[presetName];
        if (!p) return;

        params.landColor = p.land;
        params.waterColor = p.water;
        params.trunkColor = p.trunk;
        params.rockColor = p.rock;
        params.bgInner = p.bgInner;
        params.bgMid = p.bgMid;
        params.bgOuter = p.bgOuter;
        params.foliageColors = [...p.foliage];

        gui.controllers.concat(gui.folders.flatMap(f => f.controllers)).forEach(c => c.updateDisplay());

        updateColors();
      }

      function updateBackground() {
        if (params.greenscreen) {
          document.body.classList.add('greenscreen');
          renderer.setClearColor(0x00ff00, 1);
        } else {
          document.body.classList.remove('greenscreen');
          document.body.style.backgroundImage = `radial-gradient(circle, ${params.bgInner}, ${params.bgMid}, ${params.bgOuter})`;
          renderer.setClearColor(0x000000, 0);
        }
      }

      function updateColors() {
        if (!planetMesh) return;

        // Update Planet Face Colors
        const geo = planetMesh.geometry;
        for (let i = 0; i < geo.faces.length; i++) {
          let f = geo.faces[i];
          if (noises[f.a] === noiseWaterLevel && noises[f.b] === noiseWaterLevel && noises[f.c] === noiseWaterLevel) {
            f.color.set(params.waterColor);
          } else {
            f.color.set(params.landColor);
          }
        }
        geo.colorsNeedUpdate = true;

        // Update Tree Materials
        const cscale = chroma.scale(params.foliageColors);
        treeData.forEach(item => {
          item.tmaterial.color.set(params.trunkColor);
          item.bmaterial.color.set(cscale(item.vn2).hex());
        });

        // Update Rock Materials
        rockData.forEach(item => {
          item.material.color.set(params.rockColor);
        });

        updateBackground();
      }

      function initScene() {
        scene = new Scene();
        scene.add(new AmbientLight(0xcccccc));

        const light = new DirectionalLight(0xffffff);
        light.position.x = 200;
        light.position.z = 100;
        scene.add(light);

        buildPlanet();
      }

      function buildPlanet() {
        // Planet Container
        planet = new Object3D();
        scene.add(planet);

        noises = [];

        // Noise function
        const vNoise = (v, f, i) => {
          const nv = new Vector3(v.x, v.y, v.z).multiplyScalar(f);
          let noise = (simplex.noise3D(nv.x, nv.y, nv.z) + 1) / 2;
          noise = (noise > noiseWaterTreshold) ? noise : noiseWaterLevel;
          if (Number.isInteger(i)) noises[i] = noise;
          return noise;
        };

        // Displacement function
        const dispV = (v, i) => {
          const dv = new Vector3(v.x, v.y, v.z);
          dv.add(dv.clone().normalize().multiplyScalar(vNoise(dv, currentNoiseF, i) * currentNoiseD));
          v.x = dv.x; v.y = dv.y; v.z = dv.z;
        };

        // Planet geometry
        let geometry = new IcosahedronGeometry(100, 4);
        for (let i = 0; i < geometry.vertices.length; i++) dispV(geometry.vertices[i], i);
        geometry.computeFlatVertexNormals();

        // Planet geometry - face colors
        for (let i = 0; i < geometry.faces.length; i++) {
          let f = geometry.faces[i];
          f.color.set(params.landColor);
          if (noises[f.a] === noiseWaterLevel && noises[f.b] === noiseWaterLevel && noises[f.c] === noiseWaterLevel) {
            f.color.set(params.waterColor);
          }
        }

        // Planet mesh
        const material = new MeshLambertMaterial({ flatShading: true, vertexColors: THREE.VertexColors });
        planetMesh = new Mesh(geometry, material);
        planet.add(planetMesh);

        // Scale animation start
        planet.scale.set(0.1, 0.1, 0.1);
        TweenMax.to(planet.scale, rnd(1.5, 3), { x: 1, y: 1, z: 1, ease: Elastic.easeOut.config(1, 0.3) });

        // Add trees & rocks
        objects = [];
        treeData = [];
        rockData = [];

        const cscale = chroma.scale(params.foliageColors);
        const points = getFibonacciSpherePoints(currentPointsCount, 100);
        let p, obj;
        for (let i = 0; i < points.length; i++) {
          p = points[i];
          dispV(p);
          if (vNoise(p, currentNoiseF) === noiseWaterLevel) continue;
          if (random() > currentTreeDensity) {
            const tsize = rnd(5, 15);
            const bsize = tsize * rnd(0.5, 0.7);
            const vn2 = vNoise(p, 0.01);
            const treeRes = createTree(tsize, bsize, params.trunkColor, cscale(vn2).hex(), vn2);
            obj = treeRes.tree;
            obj.position.set(p.x, p.y, p.z);
            obj.lookAt(0, 0, 0);
          } else {
            const rockRes = createRock(rnd(2, 4), params.rockColor);
            obj = rockRes.mesh;
            obj.position.set(p.x, p.y, p.z);
          }
          objects.push(obj);
          obj.scale.set(0.01, 0.01, 0.01);
          obj.tween = TweenMax.to(obj.scale, rnd(1.5, 4), { x: 1, y: 1, z: 1, ease: Elastic.easeOut.config(1, 0.2), delay: rnd(0, 1.5) });
          planet.add(obj);
        }

        // Interactivity
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const onMouseMove = e => {
          mouse.x = (e.clientX / width) * 2 - 1;
          mouse.y = - (e.clientY / height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(objects, true);
          if (intersects.length > 0) {
            let obj = intersects[0].object;
            obj = obj.tween ? obj : obj.parent;
            if (obj && obj.tween && !obj.tween.isActive()) {
              obj.scale.set(0.5, 0.5, 0.5);
              obj.tween = TweenMax.to(obj.scale, 1.5, { x: 1, y: 1, z: 1, ease: Elastic.easeOut.config(1, 0.2) });
            }
          }
        };
        renderer.domElement.addEventListener('mousemove', onMouseMove);

        updateBackground();
      }

      // Low poly tree
      function createTree(tsize, bsize, tcolor, bcolor, vn2) {
        const tradius = tsize * 0.1;
        const t1size = tsize / 2, t1radius = tradius * 0.7;

        const tmaterial = new MeshLambertMaterial({ color: tcolor, flatShading: true });
        const bmaterial = new MeshLambertMaterial({ color: bcolor, flatShading: true });

        const tree = new Object3D();

        // Trunk
        const tgeometry = new CylinderGeometry(tradius * 0.7, tradius, tsize, 5, 3, true);
        tgeometry.translate(0, tsize / 2, 0);
        tgeometry.rotateX(-PI / 2);
        rdnGeo(tgeometry, tradius * 0.2);
        const tmesh = new Mesh(tgeometry, tmaterial);
        tree.add(tmesh);

        // Body
        const bgeometry = new SphereGeometry(bsize, 4, 4);
        bgeometry.translate(0, tsize + bsize * 0.7, 0);
        bgeometry.rotateX(-PI / 2);
        rdnGeo(bgeometry, bsize * 0.2);
        const bmesh = new Mesh(bgeometry, bmaterial);
        tree.add(bmesh);

        if (random() > 0.5) {
          // Trunk 1
          const t1geometry = new CylinderGeometry(t1radius * 0.5, t1radius, t1size, 4, 2, true);
          t1geometry.translate(0, t1size / 2, 0);
          t1geometry.rotateZ(PI / 3 + rnd(0, 0.2));
          t1geometry.rotateY(rndFS(PI / 2));
          t1geometry.translate(0, tsize * rnd(0.2, 0.7), 0);
          t1geometry.rotateX(-PI / 2);
          rdnGeo(t1geometry, tradius * 0.1);
          tgeometry.merge(t1geometry);

          // Body 1
          const b1size = bsize * rnd(0.5, 0.8);
          const t1bp = getTrunkBodyPosition(t1geometry, b1size);
          const b1geometry = new SphereGeometry(b1size, 4, 4);
          b1geometry.translate(t1bp.x, t1bp.y, t1bp.z);
          rdnGeo(b1geometry, b1size * 0.2);
          bgeometry.merge(b1geometry);
        }

        if (random() > 0.5) {
          // Trunk 2
          const t2geometry = new CylinderGeometry(t1radius * 0.5, t1radius, t1size, 4, 2, true);
          t2geometry.translate(0, t1size / 2, 0);
          t2geometry.rotateZ(-PI / 3 + rnd(0, 0.2));
          t2geometry.rotateY(rndFS(PI / 2));
          t2geometry.translate(0, tsize * rnd(0.2, 0.7), 0);
          t2geometry.rotateX(-PI / 2);
          rdnGeo(t2geometry, tradius * 0.1);
          tgeometry.merge(t2geometry);

          // Body 2
          const b2size = bsize * rnd(0.5, 0.8);
          const t2bp = getTrunkBodyPosition(t2geometry, b2size);
          const b2geometry = new SphereGeometry(b2size, 4, 4);
          b2geometry.translate(t2bp.x, t2bp.y, t2bp.z);
          rdnGeo(b2geometry, b2size * 0.2);
          bgeometry.merge(b2geometry);
        }

        treeData.push({ tmaterial, bmaterial, vn2 });
        return { tree };
      }

      // Low poly rock
      function createRock(size, rcolor) {
        const material = new MeshLambertMaterial({ color: rcolor, flatShading: true });
        const geometry = new SphereGeometry(size, 5, 4);
        rdnGeo(geometry, size * 0.2);
        const mesh = new Mesh(geometry, material);
        rockData.push({ material });
        return { mesh };
      }

      // Trunk helper
      function getTrunkBodyPosition(geo, bsize) {
        let v1 = geo.vertices[0], v2 = geo.vertices[geo.vertices.length - 1];
        v1 = new Vector3(v1.x, v1.y, v1.z);
        v2 = new Vector3(v2.x, v2.y, v2.z);
        const dv = v1.clone().sub(v2).normalize().multiplyScalar(bsize * 0.5);
        return v1.add(dv);
      }

      // Randomize geometry
      function rdnGeo(geo, d) {
        let v;
        for (let i = 0; i < geo.vertices.length; i++) {
          v = geo.vertices[i];
          v.x += rndFS(2 * d);
          v.y += rndFS(2 * d);
          v.z += rndFS(2 * d);
        }
        geo.computeFlatVertexNormals();
      }

      function animate() {
        requestAnimationFrame(animate);

        const elapsedTime = clock.getElapsedTime() * params.animSpeed;

        if (params.animPreset === 'Static (No Motion)') {
          cameraCtrl.autoRotate = false;
          planet.position.set(0, 0, 0);
          planet.rotation.set(0, 0, 0);
          planet.scale.set(1, 1, 1);
        } else if (params.animPreset === 'Orbit & Gentle Float') {
          cameraCtrl.autoRotate = true;
          cameraCtrl.autoRotateSpeed = 0.5 * params.animSpeed;
          planet.position.y = Math.sin(elapsedTime * 0.8) * 8;
          planet.rotation.y += 0.002 * params.animSpeed;
          planet.scale.set(1, 1, 1);
        } else if (params.animPreset === 'Breath & Pulse') {
          cameraCtrl.autoRotate = true;
          cameraCtrl.autoRotateSpeed = 0.3 * params.animSpeed;
          const pulse = 1 + Math.sin(elapsedTime * 1.2) * 0.06;
          planet.scale.set(pulse, pulse, pulse);
          planet.position.set(0, 0, 0);
          planet.rotation.y += 0.002 * params.animSpeed;
        } else if (params.animPreset === 'Cosmic Wobble') {
          cameraCtrl.autoRotate = true;
          cameraCtrl.autoRotateSpeed = 0.4 * params.animSpeed;
          planet.rotation.x = Math.sin(elapsedTime * 0.6) * 0.15;
          planet.rotation.z = Math.cos(elapsedTime * 0.5) * 0.15;
          planet.rotation.y += 0.003 * params.animSpeed;
          planet.position.set(0, 0, 0);
          planet.scale.set(1, 1, 1);
        } else if (params.animPreset === 'Cinematic Flyby') {
          cameraCtrl.autoRotate = true;
          cameraCtrl.autoRotateSpeed = 0.8 * params.animSpeed;
          const dist = conf.cameraZ + Math.sin(elapsedTime * 0.4) * 100;
          camera.position.setLength(dist);
          planet.position.y = Math.cos(elapsedTime * 0.6) * 5;
          planet.scale.set(1, 1, 1);
        }

        if (cameraCtrl) cameraCtrl.update();
        renderer.render(scene, camera);
      }

      function updateSize() {
        width = window.innerWidth;
        height = window.innerHeight;
        renderer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
    }

    function getFibonacciSpherePoints(samples, radius, randomize) {
      samples = samples || 1;
      radius = radius || 1;
      randomize = randomize || true;
      let random = 1;
      if (randomize) {
        random = Math.random() * samples;
      }
      let points = []
      let offset = 2 / samples
      let increment = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < samples; i++) {
        let y = ((i * offset) - 1) + (offset / 2);
        let distance = Math.sqrt(1 - Math.pow(y, 2));
        let phi = ((i + random) % samples) * increment;
        let x = Math.cos(phi) * distance;
        let z = Math.sin(phi) * distance;
        x = x * radius;
        y = y * radius;
        z = z * radius;
        points.push({ x, y, z });
      }
      return points;
    }

    App();
  </script>
</body>
</html>
