<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voronoi Organic Surface</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0e14;
      user-select: none;
      -webkit-user-select: none;
    }
    #container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Vertex Shader -->
  <script id="vertexShader" type="x-shader/x-vertex">
    varying vec2 vUv;
    varying vec3 vWorldPosition;

    void main() {
      vUv = uv;
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPos.xyz;
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  </script>

  <!-- Fragment Shader -->
  <script id="fragmentShader" type="x-shader/x-fragment">
    precision highp float;

    varying vec2 vUv;
    varying vec3 vWorldPosition;

    uniform vec2 u_resolution;
    uniform vec2 u_mouse;
    uniform float u_time;
    uniform sampler2D u_noise;

    // Appearance & Color Schemes
    uniform int u_colorSchemeIndex;
    uniform int u_numColors;
    uniform vec3 u_color1;
    uniform vec3 u_color2;
    uniform vec3 u_color3;
    uniform vec3 u_color4;
    uniform vec3 u_color5;
    uniform vec3 u_color6;
    uniform float u_brightness;

    // Object Geometry & Shape
    uniform int u_objectShape;
    uniform float u_voronoiScale;
    uniform float u_voronoiSpeed;
    uniform float u_bumpDepth;

    // Lighting & Material
    uniform float u_exposure;
    uniform float u_scene_light_intensity;

    uniform vec3 u_light1_pos;
    uniform vec3 u_light1_color;
    uniform float u_light1_intensity;

    uniform vec3 u_light2_pos;
    uniform vec3 u_light2_color;
    uniform float u_light2_intensity;

    uniform vec3 u_ambient_color;
    uniform float u_ambient_intensity;

    uniform float u_shininess;
    uniform float u_specular_strength;

    vec2 hash2(vec2 p) {
      vec2 o = texture2D(u_noise, (p + 0.5) / 256.0, -100.0).xy;
      return o;
    }

    // Smooth minimum
    float smin(float a, float b, float k) {
      float res = exp(-k * a) + exp(-k * b);
      return -log(res) / k;
    }

    float voronoi(
      vec2 uv,
      inout vec2 min_point,
      inout vec2 s_min_point,
      inout float s_min_dist,
      inout vec3 cell_colour) {

      float dist = 4.0;
      float res = 0.0;
      s_min_dist = 4.0;

      vec2 grid_id = floor(uv);
      vec2 grid_uv = fract(uv);

      for(float j = -1.0; j < 2.0; j++) {
        for(float i = -1.0; i < 2.0; i++) {
          vec2 offset = vec2(i, j);
          vec2 grid_test_id = grid_id + offset;

          vec2 rand = hash2(grid_test_id);
          vec2 point_pos = offset + rand - grid_uv;

          rand = hash2(grid_test_id + 1000.0);
          rand = 0.4 + 0.3 * sin(u_time * u_voronoiSpeed + 6.283185 * rand);
          point_pos = offset + rand - grid_uv;

          float len = dot(point_pos, point_pos);
          res += exp(-10.0 * len);

          if(len < dist) {
            s_min_dist = dist;
            dist = len;
            min_point = point_pos;
          } else if(len < s_min_dist) {
            s_min_dist = len;
          }
        }
      }

      return -(1.0 / 10.0) * log(res);
    }

    float bumpMap(vec2 uv, inout vec2 q, inout vec2 r) {
      uv *= u_voronoiScale;
      uv.x -= u_time * (5.0 * u_voronoiSpeed);

      vec3 cell_colour;
      vec2 min_point;
      vec2 s_min_point;
      float s_min_dist;
      float _dist = voronoi(uv + vec2(u_time * (2.0 * u_voronoiSpeed), 0.0), min_point, s_min_point, s_min_dist, cell_colour);

      float dist = 0.0;
      dist = smin(_dist, voronoi(uv * 2.0 - 0.5 + vec2(2000.0) * _dist / 2000.0, min_point, s_min_point, s_min_dist, cell_colour), 20.0);
      dist = smin(dist, voronoi(uv - 0.5 + vec2(1000.0) * _dist / 500.0, min_point, s_min_point, s_min_dist, cell_colour), 10.0);

      q = vec2(_dist, 1.0 - clamp(_dist, 0.0, 1.0));

      return 1.0 - dist * (0.6 * u_bumpDepth);
    }

    vec3 getPaletteColor(float t) {
      t = clamp(t, 0.0, 1.0);
      if (u_numColors == 6) {
        float s = t * 5.0;
        if (s < 1.0) return mix(u_color1, u_color2, s);
        if (s < 2.0) return mix(u_color2, u_color3, s - 1.0);
        if (s < 3.0) return mix(u_color3, u_color4, s - 2.0);
        if (s < 4.0) return mix(u_color4, u_color5, s - 3.0);
        return mix(u_color5, u_color6, s - 4.0);
      } else {
        float s = t * 4.0;
        if (s < 1.0) return mix(u_color1, u_color2, s);
        if (s < 2.0) return mix(u_color2, u_color3, s - 1.0);
        if (s < 3.0) return mix(u_color3, u_color4, s - 2.0);
        return mix(u_color4, u_color5, s - 3.0);
      }
    }

    float sdRoundedBox(vec2 p, vec2 b, float r) {
      vec2 q = abs(p) - b + vec2(r);
      return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
    }

    vec4 renderPass(vec2 uv, vec2 uvoffset) {
      vec3 surfacePos = vec3(uv, 0.0);
      vec3 ray = normalize(vec3(uv, 1.0));
      vec3 normal = vec3(0.0, 0.0, -1.0);

      vec2 sampleDistance = vec2(0.002, 0.0);

      vec2 q = vec2(0.0, 0.0);
      vec2 r = vec2(0.0, 0.0);

      float fx = bumpMap(surfacePos.xy - sampleDistance.xy + uvoffset, q, r);
      float fy = bumpMap(surfacePos.xy - sampleDistance.yx + uvoffset, q, r);
      float f = bumpMap(surfacePos.xy + uvoffset, q, r);
      fx = (fx - f) / sampleDistance.x;
      fy = (fy - f) / sampleDistance.x;
      normal = normalize(normal + vec3(fx, fy, 0.0) * (0.2 * u_bumpDepth));

      // Key light (Light 1)
      vec3 lightV1 = u_light1_pos - surfacePos;
      float lightDist1 = max(length(lightV1), 0.01);
      lightV1 /= lightDist1;
      float atten1 = 1.0 / (1.0 + lightDist1 * lightDist1 * 0.4);
      float diff1 = max(dot(normal, lightV1), 0.0);
      float spec1 = pow(max(dot(reflect(-lightV1, normal), -ray), 0.0), u_shininess) * u_specular_strength;

      // Fill light (Light 2)
      vec3 lightV2 = u_light2_pos - surfacePos;
      float lightDist2 = max(length(lightV2), 0.01);
      lightV2 /= lightDist2;
      float atten2 = 1.0 / (1.0 + lightDist2 * lightDist2 * 0.4);
      float diff2 = max(dot(normal, lightV2), 0.0);
      float spec2 = pow(max(dot(reflect(-lightV2, normal), -ray), 0.0), u_shininess * 0.7) * (u_specular_strength * 0.6);

      // Base texture / palette color
      vec3 texCol;
      if (u_colorSchemeIndex == 0) {
        texCol = (vec3(q.y / 2.0 - q.x / 3.0 + 0.6, q.y / 2.2 + 0.2, 0.5) - 0.5) * u_brightness;
      } else {
        float rampT = clamp(q.y * 0.65 + f * 0.35, 0.0, 1.0);
        texCol = getPaletteColor(rampT) * u_brightness;
      }

      // Diffuse & Specular sums
      vec3 ambient = u_ambient_color * u_ambient_intensity;
      vec3 light1Diff = u_light1_color * (diff1 * 2.0 * u_light1_intensity) * atten1;
      vec3 light2Diff = u_light2_color * (diff2 * 1.5 * u_light2_intensity) * atten2;
      vec3 totalDiffuse = (ambient + light1Diff + light2Diff) * u_scene_light_intensity;

      vec3 spec1Contrib = u_light1_color * (spec1 * f * 2.0 * u_light1_intensity) * atten1;
      vec3 spec2Contrib = u_light2_color * (spec2 * f * 1.5 * u_light2_intensity) * atten2;
      vec3 totalSpecular = (spec1Contrib + spec2Contrib) * u_scene_light_intensity;

      vec3 colour = (texCol * (totalDiffuse + 0.5) + totalSpecular) * u_exposure;

      return vec4(colour, 1.0);
    }

    void main() {
      vec2 uv = (vUv - 0.5) * 2.0;

      // Shape clipping
      if (u_objectShape == 0) {
        // Rounded Floating Slab
        float d = sdRoundedBox(uv, vec2(0.92, 0.92), 0.14);
        if (d > 0.0) {
          discard;
        }
        vec4 render = renderPass(uv, vec2(1.0));
        // Soft border bevel rim
        if (d > -0.04) {
          float rimFactor = smoothstep(-0.04, 0.0, d);
          render.rgb = mix(render.rgb, render.rgb * 0.3 + vec3(0.12), rimFactor * 0.75);
        }
        gl_FragColor = render;
      } else if (u_objectShape == 1) {
        // Circular Portal
        float dist = length(uv);
        if (dist > 0.96) {
          discard;
        }
        vec4 render = renderPass(uv, vec2(1.0));
        if (dist > 0.92) {
          float rim = smoothstep(0.92, 0.96, dist);
          render.rgb = mix(render.rgb, render.rgb * 0.3 + vec3(0.15), rim * 0.7);
        }
        gl_FragColor = render;
      } else {
        // Full Quad Surface
        vec4 render = renderPass(uv, vec2(1.0));
        gl_FragColor = render;
      }
    }
  </script>

  <!-- Application Logic with lil-gui -->
  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 19 PRECONFIGURED COLOR SCHEMES
    const COLOR_SCHEMES = {
      'Original': {
        index: 0,
        colors: ['#3a506b', '#5bc0be', '#6fffe9', '#f2c94c', '#e0e1dd']
      },
      'Monochromatic': {
        index: 1,
        colors: ['#0d2b45', '#203c56', '#547b99', '#8cbcd0', '#d2ecf9']
      },
      'Analogous': {
        index: 2,
        colors: ['#2b0938', '#7b1e7a', '#b33f62', '#ee8959', '#f3c68f']
      },

      },
      'Tetradic': {
        index: 6,
        colors: ['#003049', '#d62828', '#f77f00', '#fcbf49', '#eae2b7']
      },
      'Double split-complementary': {
        index: 7,
        colors: ['#2e1c46', '#5c2a9d', '#e84a5f', '#45b649', '#ffd166']
      },
      'Achromatic (B&W)': {
        index: 8,
        colors: ['#050505', '#242424', '#666666', '#b0b0b0', '#ffffff']
      },
      'Achromatic + Accent': {
        index: 9,
        colors: ['#080808', '#383838', '#e60026', '#cccccc', '#ffffff']
      },
      'Neutral + accent': {
        index: 10,
        colors: ['#1a1d20', '#343a40', '#6c757d', '#00e5ff', '#f8f9fa']
      },
      'Palette 1 (F6AA1C, BC3908...)': {
        index: 11,
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
      },
      'Palette 2 (63D1CF, 5BC0BE...)': {
        index: 12,
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000']
      },
      'Palette 3 (AA60C8, D69ADE...)': {
        index: 13,
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12']
      },
      'Palette 4 (FEF1BE, FFBA00...)': {
        index: 14,
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
      },
      'Palette 5 (D4FFB0, 7FFF00...)': {
        index: 15,
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
      },
      'Palette 6 (FFE8CC, FF8C00...)': {
        index: 16,
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
      },
      'Palette 7 (E8E0FF, B38FFF...)': {
        index: 17,
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
      },
      'Palette 8 (E0FBFF, 00F0FF...)': {
        index: 18,
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      }
    };

    // 8 PRECONFIGURED CAMERA ANIMATIONS
    const ANIMATION_PRESETS = [
      'Static (No Camera Motion)',
      'Gentle Orbit',
      'Floating Figure-8',
      'Slow Dolly & Breathe',
      'Pendulum Swing',
      'Spiral Rise & Fall',
      'Cinematic Drift',
      'Dynamic Wave Tilt'
    ];

    const OBJECT_SHAPES = {
      'Rounded Slab': 0,
      'Circular Portal': 1,
      'Full Surface': 2
    };

    // Application State & Parameters
    const params = {
      // Background & Greenscreen
      greenscreen: false,
      bgColor: '#0b0e14',

      // Procedural Click Variation
      randomizeOnClick: true,

      // Display & Renderer
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),

      // Animation & Camera
      currentAnimation: 'Gentle Orbit',
      animationSpeed: 1.0,
      userZoom: 1.0,
      orbitPitch: 0.0,
      orbitYaw: 0.0,
      panX: 0.0,
      panY: 0.0,

      // Object & Geometry
      objectShape: 'Rounded Slab',
      voronoiScale: 7.0,
      voronoiSpeed: 1.0,
      bumpDepth: 1.0,

      // Colors & Theme
      colorScheme: 'Original',
      brightness: 6.0,
      color1: '#3a506b',
      color2: '#5bc0be',
      color3: '#6fffe9',
      color4: '#f2c94c',
      color5: '#e0e1dd',
      color6: '#000000',

      // Lighting & Exposure
      exposure: 1.0,
      sceneLightIntensity: 1.0,

      // Key Light (Light 1)
      light1Enabled: true,
      light1Color: '#ffea9f',
      light1Intensity: 1.2,
      light1AutoOrbit: true,
      light1OrbitSpeed: 0.7,
      light1PosX: 2.0,
      light1PosY: 2.0,
      light1PosZ: -3.0,

      // Fill Light (Light 2)
      light2Enabled: true,
      light2Color: '#88ccff',
      light2Intensity: 0.8,
      light2PosX: -2.5,
      light2PosY: 1.5,
      light2PosZ: -2.5,

      // Ambient Light
      ambientColor: '#ffffff',
      ambientIntensity: 0.35,

      // Material properties
      shininess: 52.0,
      specularStrength: 4.1
    };

    let container;
    let camera, scene, renderer;
    let uniforms;
    let objectGroup, mesh;
    let gui;
    const guiControllers = {};

    let animTime = 0.0;
    let lastTimestamp = performance.now();

    // Procedural Fallback Noise Texture (works instantly offline)
    function createProceduralNoiseTexture() {
      const size = 256;
      const data = new Uint8Array(size * size * 4);
      for (let i = 0; i < size * size * 4; i += 4) {
        data[i] = Math.floor(Math.random() * 256);
        data[i + 1] = Math.floor(Math.random() * 256);
        data[i + 2] = Math.floor(Math.random() * 256);
        data[i + 3] = 255;
      }
      const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.needsUpdate = true;
      return tex;
    }

    // Initialize Scene
    function init() {
      container = document.getElementById('container');

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 3.6);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(params.bgColor);

      const noiseTex = createProceduralNoiseTexture();

      uniforms = {
        u_time: { type: 'f', value: 1.0 },
        u_resolution: { type: 'v2', value: new THREE.Vector2() },
        u_noise: { type: 't', value: noiseTex },
        u_mouse: { type: 'v2', value: new THREE.Vector2(0, 0) },

        u_colorSchemeIndex: { type: 'i', value: 0 },
        u_numColors: { type: 'i', value: 5 },
        u_color1: { type: 'v3', value: new THREE.Vector3() },
        u_color2: { type: 'v3', value: new THREE.Vector3() },
        u_color3: { type: 'v3', value: new THREE.Vector3() },
        u_color4: { type: 'v3', value: new THREE.Vector3() },
        u_color5: { type: 'v3', value: new THREE.Vector3() },
        u_color6: { type: 'v3', value: new THREE.Vector3() },
        u_brightness: { type: 'f', value: params.brightness },

        u_objectShape: { type: 'i', value: OBJECT_SHAPES[params.objectShape] },
        u_voronoiScale: { type: 'f', value: params.voronoiScale },
        u_voronoiSpeed: { type: 'f', value: params.voronoiSpeed },
        u_bumpDepth: { type: 'f', value: params.bumpDepth },

        u_exposure: { type: 'f', value: params.exposure },
        u_scene_light_intensity: { type: 'f', value: params.sceneLightIntensity },

        u_light1_pos: { type: 'v3', value: new THREE.Vector3() },
        u_light1_color: { type: 'v3', value: new THREE.Vector3() },
        u_light1_intensity: { type: 'f', value: params.light1Intensity },

        u_light2_pos: { type: 'v3', value: new THREE.Vector3() },
        u_light2_color: { type: 'v3', value: new THREE.Vector3() },
        u_light2_intensity: { type: 'f', value: params.light2Intensity },

        u_ambient_color: { type: 'v3', value: new THREE.Vector3() },
        u_ambient_intensity: { type: 'f', value: params.ambientIntensity },

        u_shininess: { type: 'f', value: params.shininess },
        u_specular_strength: { type: 'f', value: params.specularStrength }
      };

      const material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: document.getElementById('vertexShader').textContent,
        fragmentShader: document.getElementById('fragmentShader').textContent,
        transparent: true,
        side: THREE.DoubleSide
      });
      material.extensions.derivatives = true;

      const geometry = new THREE.PlaneGeometry(2.7, 2.7, 64, 64);
      mesh = new THREE.Mesh(geometry, material);

      objectGroup = new THREE.Group();
      objectGroup.add(mesh);
      scene.add(objectGroup);

      // WebGL Renderer with antialias
      renderer = new THREE.WebGLRenderer({ antialias: params.antialias, alpha: true });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Async load external texture if available
      const loader = new THREE.TextureLoader();
      loader.setCrossOrigin('anonymous');
      loader.load(
        'https://s3-us-west-2.amazonaws.com/s.cdpn.io/982762/noise.png',
        (tex) => {
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.RepeatWrapping;
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          uniforms.u_noise.value = tex;
        },
        undefined,
        () => {
          // Graceful fallback to procedural noise already active
        }
      );

      applyColorScheme(params.colorScheme);
      updateAllUniforms();
      setupInteractions(renderer.domElement);
      buildGUI();

      onWindowResize();
      window.addEventListener('resize', onWindowResize, false);

      // 'H' key toggles lil-gui visibility
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      });

      requestAnimationFrame(animate);
    }

    // Apply preconfigured color scheme
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      uniforms.u_colorSchemeIndex.value = scheme.index;

      const cols = scheme.colors;
      params.color1 = cols[0];
      params.color2 = cols[1];
      params.color3 = cols[2];
      params.color4 = cols[3];
      params.color5 = cols[4];
      params.color6 = cols[5] || cols[4];

      uniforms.u_numColors.value = cols.length;
      updateColorUniforms();

      for (const key of ['colorScheme', 'color1', 'color2', 'color3', 'color4', 'color5', 'color6']) {
        if (guiControllers[key]) guiControllers[key].updateDisplay();
      }
    }

    function updateColorUniforms() {
      const c1 = new THREE.Color(params.color1);
      const c2 = new THREE.Color(params.color2);
      const c3 = new THREE.Color(params.color3);
      const c4 = new THREE.Color(params.color4);
      const c5 = new THREE.Color(params.color5);
      const c6 = new THREE.Color(params.color6);

      uniforms.u_color1.value.set(c1.r, c1.g, c1.b);
      uniforms.u_color2.value.set(c2.r, c2.g, c2.b);
      uniforms.u_color3.value.set(c3.r, c3.g, c3.b);
      uniforms.u_color4.value.set(c4.r, c4.g, c4.b);
      uniforms.u_color5.value.set(c5.r, c5.g, c5.b);
      uniforms.u_color6.value.set(c6.r, c6.g, c6.b);
    }

    function onSingleColorChange() {
      // If user manually modifies colors, switch to custom ramp mode
      if (uniforms.u_colorSchemeIndex.value === 0) {
        uniforms.u_colorSchemeIndex.value = 1;
      }
      updateColorUniforms();
    }

    function updateBackground() {
      if (params.greenscreen) {
        scene.background = new THREE.Color(0x00ff00);
      } else {
        scene.background = new THREE.Color(params.bgColor);
      }
    }

    function updateAllUniforms() {
      uniforms.u_objectShape.value = OBJECT_SHAPES[params.objectShape];
      uniforms.u_voronoiScale.value = params.voronoiScale;
      uniforms.u_voronoiSpeed.value = params.voronoiSpeed;
      uniforms.u_bumpDepth.value = params.bumpDepth;
      uniforms.u_brightness.value = params.brightness;

      uniforms.u_exposure.value = params.exposure;
      uniforms.u_scene_light_intensity.value = params.sceneLightIntensity;

      const col1 = new THREE.Color(params.light1Color);
      uniforms.u_light1_color.value.set(col1.r, col1.g, col1.b);
      uniforms.u_light1_intensity.value = params.light1Enabled ? params.light1Intensity : 0.0;

      const col2 = new THREE.Color(params.light2Color);
      uniforms.u_light2_color.value.set(col2.r, col2.g, col2.b);
      uniforms.u_light2_intensity.value = params.light2Enabled ? params.light2Intensity : 0.0;
      uniforms.u_light2_pos.value.set(params.light2PosX, params.light2PosY, params.light2PosZ);

      const colAmb = new THREE.Color(params.ambientColor);
      uniforms.u_ambient_color.value.set(colAmb.r, colAmb.g, colAmb.b);
      uniforms.u_ambient_intensity.value = params.ambientIntensity;

      uniforms.u_shininess.value = params.shininess;
      uniforms.u_specular_strength.value = params.specularStrength;

      updateColorUniforms();
      updateBackground();

      objectGroup.position.set(params.panX, params.panY, 0);
    }

    // Rebuild WebGLRenderer if Antialias is changed
    function rebuildRenderer(antialias) {
      const oldCanvas = renderer.domElement;
      const parent = oldCanvas.parentNode;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({ antialias: antialias, alpha: true });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      parent.replaceChild(renderer.domElement, oldCanvas);

      setupInteractions(renderer.domElement);
      onWindowResize();
    }

    // Setup Drag, Zoom & Angle Interactions
    function setupInteractions(canvas) {
      let isPointerDown = false;
      let startX = 0, startY = 0;
      let startPanX = 0, startPanY = 0;
      let startPitch = 0, startYaw = 0;
      let hasDragged = false;
      let pointerButton = 0;

      canvas.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;

        isPointerDown = true;
        hasDragged = false;
        startX = e.clientX;
        startY = e.clientY;
        startPanX = params.panX;
        startPanY = params.panY;
        startPitch = params.orbitPitch;
        startYaw = params.orbitYaw;
        pointerButton = e.button;

        try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      });

      canvas.addEventListener('pointermove', (e) => {
        const ratio = window.innerHeight / window.innerWidth;
        uniforms.u_mouse.value.x = (e.pageX - window.innerWidth / 2) / window.innerWidth / ratio;
        uniforms.u_mouse.value.y = (e.pageY - window.innerHeight / 2) / window.innerHeight * -1;

        if (!isPointerDown) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (Math.hypot(dx, dy) > 5) {
          hasDragged = true;
        }

        if (pointerButton === 0 && !e.shiftKey) {
          // Drag object across screen in world units
          const dist = camera.position.length();
          const fovRad = (camera.fov * Math.PI) / 360.0;
          const worldPerPixel = (2.0 * Math.tan(fovRad) * dist) / window.innerHeight;

          params.panX = startPanX + dx * worldPerPixel;
          params.panY = startPanY - dy * worldPerPixel;
          objectGroup.position.set(params.panX, params.panY, 0);

          if (guiControllers.panX) guiControllers.panX.updateDisplay();
          if (guiControllers.panY) guiControllers.panY.updateDisplay();
        } else if (pointerButton === 2 || (pointerButton === 0 && e.shiftKey)) {
          // Adjust camera angle during orbit
          params.orbitYaw = startYaw + dx * 0.35;
          params.orbitPitch = Math.max(-85, Math.min(85, startPitch - dy * 0.35));

          if (guiControllers.orbitYaw) guiControllers.orbitYaw.updateDisplay();
          if (guiControllers.orbitPitch) guiControllers.orbitPitch.updateDisplay();
        }
      });

      canvas.addEventListener('pointerup', (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}

        // Click on scene generates procedural variation
        if (!hasDragged && pointerButton === 0) {
          if (params.randomizeOnClick) {
            randomizeThemeAndParameters();
          }
        }
      });

      canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });
    }

    // Wheel Zoom: alters userZoom multiplier and never resets during animation
    window.addEventListener('wheel', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      e.preventDefault();

      const zoomFactor = e.deltaY > 0 ? 1.08 : 0.92;
      params.userZoom = Math.max(0.15, Math.min(8.0, params.userZoom * zoomFactor));

      if (guiControllers.userZoom) guiControllers.userZoom.updateDisplay();
    }, { passive: false });

    // Procedural variation on user click
    function randomizeThemeAndParameters() {
      // 1. Pick a random color scheme from the 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      if (randomScheme !== 'Original') {
        params.brightness = +(4.0 + Math.random() * 4.0).toFixed(2);
      }

      // 2. Re-roll geometric parameters
      params.voronoiScale = +(3.5 + Math.random() * 9.0).toFixed(1);
      params.bumpDepth = +(0.5 + Math.random() * 1.5).toFixed(2);
      params.voronoiSpeed = +(0.6 + Math.random() * 1.4).toFixed(2);
      const shapes = Object.keys(OBJECT_SHAPES);
      params.objectShape = shapes[Math.floor(Math.random() * shapes.length)];

      // 3. Re-roll motion parameters
      params.animationSpeed = +(0.6 + Math.random() * 1.2).toFixed(2);
      const randomAnim = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.currentAnimation = randomAnim;

      // 4. Re-roll lighting parameters
      params.exposure = +(0.75 + Math.random() * 0.6).toFixed(2);
      params.sceneLightIntensity = +(0.7 + Math.random() * 0.8).toFixed(2);
      params.shininess = +(25.0 + Math.random() * 65.0).toFixed(1);
      params.specularStrength = +(2.5 + Math.random() * 4.0).toFixed(1);

      const hue1 = Math.random();
      const c1 = new THREE.Color().setHSL(hue1, 0.75, 0.7);
      params.light1Color = '#' + c1.getHexString();
      const c2 = new THREE.Color().setHSL((hue1 + 0.5) % 1.0, 0.65, 0.6);
      params.light2Color = '#' + c2.getHexString();
      params.light1Intensity = +(0.8 + Math.random() * 1.0).toFixed(2);
      params.light2Intensity = +(0.5 + Math.random() * 0.8).toFixed(2);

      updateAllUniforms();

      // Update control panel displays
      for (const key in guiControllers) {
        if (guiControllers[key]) guiControllers[key].updateDisplay();
      }
    }

    // Build lil-gui settings interface
    function buildGUI() {
      gui = new GUI({ title: 'Scene Controls' });

      // Environment & Background Folder
      const envFolder = gui.addFolder('Environment & Background');
      guiControllers.greenscreen = envFolder.add(params, 'greenscreen')
        .name('Greenscreen (#00ff00)')
        .onChange(updateBackground);

      guiControllers.bgColor = envFolder.addColor(params, 'bgColor')
        .name('Background Color')
        .onChange(updateBackground);

      guiControllers.randomizeOnClick = envFolder.add(params, 'randomizeOnClick')
        .name('Click Scene to Randomize');

      // Camera & Animation Folder
      const animFolder = gui.addFolder('Camera & Animation');
      guiControllers.currentAnimation = animFolder.add(params, 'currentAnimation', ANIMATION_PRESETS)
        .name('Camera Animation');

      guiControllers.animationSpeed = animFolder.add(params, 'animationSpeed', 0.0, 3.0, 0.05)
        .name('Animation Speed');

      guiControllers.userZoom = animFolder.add(params, 'userZoom', 0.2, 5.0, 0.05)
        .name('Zoom Level');

      guiControllers.orbitPitch = animFolder.add(params, 'orbitPitch', -85, 85, 1)
        .name('Orbit Pitch Angle');

      guiControllers.orbitYaw = animFolder.add(params, 'orbitYaw', -180, 180, 1)
        .name('Orbit Yaw Angle');

      guiControllers.panX = animFolder.add(params, 'panX', -5.0, 5.0, 0.05)
        .name('Pan Position X')
        .onChange(val => { objectGroup.position.x = val; });

      guiControllers.panY = animFolder.add(params, 'panY', -5.0, 5.0, 0.05)
        .name('Pan Position Y')
        .onChange(val => { objectGroup.position.y = val; });

      animFolder.add({ resetCamera: () => {
        params.userZoom = 1.0;
        params.orbitPitch = 0.0;
        params.orbitYaw = 0.0;
        params.panX = 0.0;
        params.panY = 0.0;
        objectGroup.position.set(0, 0, 0);
        animFolder.controllersRecursive().forEach(c => c.updateDisplay());
      }}, 'resetCamera').name('Reset Camera & Pan');

      // Color Themes & Custom Colors Folder
      const colorFolder = gui.addFolder('Color Themes (19 Schemes)');
      guiControllers.colorScheme = colorFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Color Scheme')
        .onChange(applyColorScheme);

      guiControllers.brightness = colorFolder.add(params, 'brightness', 1.0, 12.0, 0.1)
        .name('Brightness')
        .onChange(val => { uniforms.u_brightness.value = val; });

      guiControllers.color1 = colorFolder.addColor(params, 'color1').name('Color 1').onChange(onSingleColorChange);
      guiControllers.color2 = colorFolder.addColor(params, 'color2').name('Color 2').onChange(onSingleColorChange);
      guiControllers.color3 = colorFolder.addColor(params, 'color3').name('Color 3').onChange(onSingleColorChange);
      guiControllers.color4 = colorFolder.addColor(params, 'color4').name('Color 4').onChange(onSingleColorChange);
      guiControllers.color5 = colorFolder.addColor(params, 'color5').name('Color 5').onChange(onSingleColorChange);
      guiControllers.color6 = colorFolder.addColor(params, 'color6').name('Color 6').onChange(onSingleColorChange);

      // Object & Geometry Folder
      const geoFolder = gui.addFolder('Object & Geometry');
      guiControllers.objectShape = geoFolder.add(params, 'objectShape', Object.keys(OBJECT_SHAPES))
        .name('Object Shape')
        .onChange(val => { uniforms.u_objectShape.value = OBJECT_SHAPES[val]; });

      guiControllers.voronoiScale = geoFolder.add(params, 'voronoiScale', 2.0, 18.0, 0.2)
        .name('Voronoi Scale')
        .onChange(val => { uniforms.u_voronoiScale.value = val; });

      guiControllers.voronoiSpeed = geoFolder.add(params, 'voronoiSpeed', 0.0, 4.0, 0.1)
        .name('Voronoi Flow Speed')
        .onChange(val => { uniforms.u_voronoiSpeed.value = val; });

      guiControllers.bumpDepth = geoFolder.add(params, 'bumpDepth', 0.1, 3.0, 0.05)
        .name('Bump Depth')
        .onChange(val => { uniforms.u_bumpDepth.value = val; });

      // Lighting & Exposure Folder
      const lightFolder = gui.addFolder('Lighting & Exposure');
      guiControllers.exposure = lightFolder.add(params, 'exposure', 0.1, 3.0, 0.05)
        .name('Exposure')
        .onChange(val => { uniforms.u_exposure.value = val; });

      guiControllers.sceneLightIntensity = lightFolder.add(params, 'sceneLightIntensity', 0.0, 3.0, 0.05)
        .name('Master Light Intensity')
        .onChange(val => { uniforms.u_scene_light_intensity.value = val; });

      // Key Light (Light 1) Subfolder
      const l1Folder = lightFolder.addFolder('Key Light (Light 1)');
      guiControllers.light1Enabled = l1Folder.add(params, 'light1Enabled').name('Enable Light 1').onChange(updateAllUniforms);
      guiControllers.light1Color = l1Folder.addColor(params, 'light1Color').name('Light 1 Color').onChange(updateAllUniforms);
      guiControllers.light1Intensity = l1Folder.add(params, 'light1Intensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateAllUniforms);
      guiControllers.light1AutoOrbit = l1Folder.add(params, 'light1AutoOrbit').name('Auto Orbit');
      guiControllers.light1OrbitSpeed = l1Folder.add(params, 'light1OrbitSpeed', 0.0, 3.0, 0.1).name('Orbit Speed');
      guiControllers.light1PosX = l1Folder.add(params, 'light1PosX', -6.0, 6.0, 0.1).name('Pos X');
      guiControllers.light1PosY = l1Folder.add(params, 'light1PosY', -6.0, 6.0, 0.1).name('Pos Y');
      guiControllers.light1PosZ = l1Folder.add(params, 'light1PosZ', -8.0, 0.0, 0.1).name('Pos Z');

      // Fill Light (Light 2) Subfolder
      const l2Folder = lightFolder.addFolder('Fill Light (Light 2)');
      guiControllers.light2Enabled = l2Folder.add(params, 'light2Enabled').name('Enable Light 2').onChange(updateAllUniforms);
      guiControllers.light2Color = l2Folder.addColor(params, 'light2Color').name('Light 2 Color').onChange(updateAllUniforms);
      guiControllers.light2Intensity = l2Folder.add(params, 'light2Intensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateAllUniforms);
      guiControllers.light2PosX = l2Folder.add(params, 'light2PosX', -6.0, 6.0, 0.1).name('Pos X').onChange(updateAllUniforms);
      guiControllers.light2PosY = l2Folder.add(params, 'light2PosY', -6.0, 6.0, 0.1).name('Pos Y').onChange(updateAllUniforms);
      guiControllers.light2PosZ = l2Folder.add(params, 'light2PosZ', -8.0, 0.0, 0.1).name('Pos Z').onChange(updateAllUniforms);

      // Ambient Light & Specular Subfolder
      const ambFolder = lightFolder.addFolder('Ambient & Specular');
      guiControllers.ambientColor = ambFolder.addColor(params, 'ambientColor').name('Ambient Color').onChange(updateAllUniforms);
      guiControllers.ambientIntensity = ambFolder.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(updateAllUniforms);
      guiControllers.shininess = ambFolder.add(params, 'shininess', 5.0, 120.0, 1.0).name('Shininess').onChange(val => { uniforms.u_shininess.value = val; });
      guiControllers.specularStrength = ambFolder.add(params, 'specularStrength', 0.0, 10.0, 0.1).name('Specular Strength').onChange(val => { uniforms.u_specular_strength.value = val; });

      // Renderer Settings Folder
      const renderFolder = gui.addFolder('Renderer & Display');
      guiControllers.antialias = renderFolder.add(params, 'antialias').name('Antialias').onChange(val => {
        rebuildRenderer(val);
      });

      guiControllers.dpr = renderFolder.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
        renderer.setPixelRatio(val);
        onWindowResize();
      });
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      uniforms.u_resolution.value.x = renderer.domElement.width;
      uniforms.u_resolution.value.y = renderer.domElement.height;
    }

    // Animation & Camera Orbit Logic
    function updateCameraMotion(delta) {
      if (params.currentAnimation !== 'Static (No Camera Motion)') {
        animTime += delta * params.animationSpeed;
      }

      let animPitch = 0.0;
      let animYaw = 0.0;
      let animZoomMod = 1.0;

      switch (params.currentAnimation) {
        case 'Static (No Camera Motion)':
          animPitch = 0.0;
          animYaw = 0.0;
          animZoomMod = 1.0;
          break;
        case 'Gentle Orbit':
          animYaw = animTime * 0.18;
          animPitch = Math.sin(animTime * 0.09) * 0.12;
          break;
        case 'Floating Figure-8':
          animYaw = Math.sin(animTime * 0.22) * 0.45;
          animPitch = Math.cos(animTime * 0.44) * 0.25;
          break;
        case 'Slow Dolly & Breathe':
          animZoomMod = 1.0 + 0.22 * Math.sin(animTime * 0.25);
          animYaw = Math.sin(animTime * 0.12) * 0.15;
          animPitch = Math.cos(animTime * 0.15) * 0.08;
          break;
        case 'Pendulum Swing':
          animYaw = Math.sin(animTime * 0.28) * 0.55;
          animPitch = Math.abs(Math.sin(animTime * 0.28)) * 0.15;
          break;
        case 'Spiral Rise & Fall':
          animYaw = animTime * 0.22;
          animPitch = Math.sin(animTime * 0.16) * 0.4;
          animZoomMod = 1.0 + 0.15 * Math.cos(animTime * 0.16);
          break;
        case 'Cinematic Drift':
          animYaw = (Math.sin(animTime * 0.1) + Math.cos(animTime * 0.17)) * 0.28;
          animPitch = (Math.cos(animTime * 0.12) + Math.sin(animTime * 0.08)) * 0.2;
          break;
        case 'Dynamic Wave Tilt':
          animYaw = Math.sin(animTime * 0.32) * 0.38;
          animPitch = Math.cos(animTime * 0.32) * 0.32;
          break;
      }

      // Merge animation offsets with persistent user angles and persistent user zoom
      const totalPitch = (params.orbitPitch * Math.PI / 180.0) + animPitch;
      const totalYaw = (params.orbitYaw * Math.PI / 180.0) + animYaw;
      const baseDistance = 3.6;
      const currentDistance = baseDistance * params.userZoom * animZoomMod;

      const cosP = Math.cos(totalPitch);
      const sinP = Math.sin(totalPitch);
      const cosY = Math.cos(totalYaw);
      const sinY = Math.sin(totalYaw);

      camera.position.set(
        currentDistance * cosP * sinY,
        currentDistance * sinP,
        currentDistance * cosP * cosY
      );
      camera.lookAt(0, 0, 0);

      // Key light orbit calculation
      if (params.light1AutoOrbit && params.light1Enabled) {
        const lightAngle = uniforms.u_time.value * 0.5 * params.light1OrbitSpeed;
        uniforms.u_light1_pos.value.set(
          Math.cos(lightAngle) * 2.5,
          Math.sin(lightAngle) * 2.5,
          params.light1PosZ
        );
      } else {
        uniforms.u_light1_pos.value.set(params.light1PosX, params.light1PosY, params.light1PosZ);
      }
    }

    // Auto infinite animation loop
    function animate(now) {
      requestAnimationFrame(animate);

      const delta = Math.min((now - lastTimestamp) / 1000.0, 0.1);
      lastTimestamp = now;

      uniforms.u_time.value += delta * params.animationSpeed;

      updateCameraMotion(delta);

      renderer.render(scene, camera);
    }

    // Initialize application
    init();
  </script>
</body>
