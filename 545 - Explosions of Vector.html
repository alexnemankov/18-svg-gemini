<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>545</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // Preconfigured Color Schemes (Exactly 19 Schemes)
    const colorSchemes = {
      'Original': {
        colors: ['#FF0000', '#00FF00', '#0000FF'],
        background: '#000000',
        blendMode: 'lighter'
      },
      'Monochromatic': {
        colors: ['#00f0ff', '#00b4d8', '#0077b6', '#90e0ef', '#caf0f8'],
        background: '#020b14',
        blendMode: 'lighter'
      },
      'Analogous': {
        colors: ['#ff0055', '#ff5400', '#ff9e00', '#ffbe0b', '#d00000'],
        background: '#140306',
        blendMode: 'lighter'
      },
      'Complementary': {
        colors: ['#00f5d4', '#ff0055', '#00bbf9', '#f15bb5', '#fee440'],
        background: '#060d14',
        blendMode: 'lighter'
      },
      'Split-complementary': {
        colors: ['#7928ca', '#ff0080', '#00dfd8', '#ff4d4d', '#7000ff'],
        background: '#0d0417',
        blendMode: 'lighter'
      },
      'Triadic': {
        colors: ['#ff007f', '#7fff00', '#007fff', '#ff0055', '#00ffaa'],
        background: '#060913',
        blendMode: 'lighter'
      },
      'Tetradic': {
        colors: ['#ff0055', '#00e5ff', '#ffbe0b', '#8338ec', '#06d6a0'],
        background: '#090514',
        blendMode: 'lighter'
      },
      'Double split-complementary': {
        colors: ['#ff1493', '#00f5d4', '#ff9e00', '#7b2cbf', '#00b4d8'],
        background: '#0a0514',
        blendMode: 'lighter'
      },
      'Achromatic (black and white version, white and black)': {
        colors: ['#ffffff', '#cccccc', '#888888', '#ffffff', '#aaaaaa'],
        background: '#000000',
        blendMode: 'lighter'
      },
      'Achromatic + Accent (black and white + red, white and black + red)': {
        colors: ['#ffffff', '#ff0033', '#888888', '#ff1744', '#dddddd'],
        background: '#000000',
        blendMode: 'lighter'
      },
      'Neutral + accent': {
        colors: ['#e3dac9', '#b5a698', '#ff5722', '#70655c', '#ff8a50'],
        background: '#1a1614',
        blendMode: 'lighter'
      },
      '(F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#BC3908'],
        background: '#220901',
        blendMode: 'lighter'
      },
      '(63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#63D1CF'],
        background: '#0B132B',
        blendMode: 'lighter'
      },
      '(AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#AA60C8'],
        background: '#0D001D',
        blendMode: 'lighter'
      },
      '(FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#FFBA00'],
        background: '#061210',
        blendMode: 'lighter'
      },
      '(D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#7FFF00'],
        background: '#05140A',
        blendMode: 'lighter'
      },
      '(FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#FF8C00'],
        background: '#0E0618',
        blendMode: 'lighter'
      },
      '(E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#B38FFF'],
        background: '#090612',
        blendMode: 'lighter'
      },
      '(E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#00F0FF'],
        background: '#05020F',
        blendMode: 'lighter'
      }
    };

    // State & Parameters
    const params = {
      // Color & Theme
      scheme: 'Original',
      color1: '#FF0000',
      color2: '#00FF00',
      color3: '#0000FF',
      color4: '#FF0000',
      color5: '#00FF00',
      layers: 3,
      blendMode: 'lighter',

      // Background
      greenScreen: false,
      backgroundColor: '#000000',

      // Transform & View
      zoom: 1.0,
      panX: 0,
      panY: 0,

      // Geometry & Motion
      radius: 20,
      rings: 24,
      speed: 1.0,
      waveFrequency: 5.0,
      scaleMultiplier: 0.5,
      tanIntensity: 0.5,
      phaseOffset: 0.05,

      // Procedural
      clickToRandomize: true
    };

    // Setup Canvas
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const C = canvas.getContext('2d');
    const m = Math;

    let W, H, HW, HH;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      HW = W / 2;
      HH = H / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Background Management
    function getActiveBackgroundColor() {
      return params.greenScreen ? '#00ff00' : params.backgroundColor;
    }

    function updateBackground() {
      const bg = getActiveBackgroundColor();
      document.body.style.backgroundColor = bg;
      canvas.style.backgroundColor = bg;
    }
    updateBackground();

    // Scheme Application
    function applyScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;
      params.scheme = schemeName;
      params.color1 = scheme.colors[0] || '#ffffff';
      params.color2 = scheme.colors[1] || '#ffffff';
      params.color3 = scheme.colors[2] || '#ffffff';
      params.color4 = scheme.colors[3] || '#ffffff';
      params.color5 = scheme.colors[4] || '#ffffff';
      params.layers = scheme.colors.length;
      params.backgroundColor = scheme.background;
      if (scheme.blendMode) {
        params.blendMode = scheme.blendMode;
      }
      updateBackground();
      updateAllControllers();
    }

    // Procedural Scene Randomization
    function randomizeScene() {
      const schemeKeys = Object.keys(colorSchemes);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyScheme(chosenScheme);

      // Re-roll geometric & motion parameters
      params.radius = Math.round(10 + Math.random() * 25);
      params.rings = Math.round(14 + Math.random() * 18);
      params.speed = parseFloat((0.4 + Math.random() * 1.6).toFixed(2));
      params.waveFrequency = parseFloat((2.0 + Math.random() * 8.0).toFixed(1));
      params.scaleMultiplier = parseFloat((0.2 + Math.random() * 0.8).toFixed(2));
      params.tanIntensity = parseFloat((0.2 + Math.random() * 0.8).toFixed(2));
      params.phaseOffset = parseFloat((0.02 + Math.random() * 0.08).toFixed(3));

      updateAllControllers();
    }

    // GUI Initialization
    const gui = new GUI({ title: 'Scene Settings' });
    const controllers = {};

    function updateAllControllers() {
      if (typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else {
        Object.values(controllers).forEach(c => {
          if (c && typeof c.updateDisplay === 'function') c.updateDisplay();
        });
      }
    }

    // Theme Folder
    const themeFolder = gui.addFolder('Color Schemes');
    controllers.scheme = themeFolder.add(params, 'scheme', Object.keys(colorSchemes))
      .name('Preconfigured (19)')
      .onChange(applyScheme);

    // Custom Colors Folder
    const colorsFolder = gui.addFolder('Custom Colors');
    controllers.color1 = colorsFolder.addColor(params, 'color1').name('Color 1');
    controllers.color2 = colorsFolder.addColor(params, 'color2').name('Color 2');
    controllers.color3 = colorsFolder.addColor(params, 'color3').name('Color 3');
    controllers.color4 = colorsFolder.addColor(params, 'color4').name('Color 4');
    controllers.color5 = colorsFolder.addColor(params, 'color5').name('Color 5');
    controllers.layers = colorsFolder.add(params, 'layers', 1, 5, 1).name('Active Layers');
    controllers.blendMode = colorsFolder.add(params, 'blendMode', [
      'lighter',
      'source-over',
      'screen',
      'difference',
      'multiply',
      'overlay'
    ]).name('Blend Mode');

    // Background Folder
    const bgFolder = gui.addFolder('Background');
    controllers.greenScreen = bgFolder.add(params, 'greenScreen')
      .name('Greenscreen #00ff00')
      .onChange(updateBackground);
    controllers.backgroundColor = bgFolder.addColor(params, 'backgroundColor')
      .name('Background Color')
      .onChange(updateBackground);

    // View & Transform Folder
    const viewFolder = gui.addFolder('Zoom & Pan');
    controllers.zoom = viewFolder.add(params, 'zoom', 0.1, 10.0, 0.05).name('Zoom');
    controllers.panX = viewFolder.add(params, 'panX', -1500, 1500, 1).name('Pan X');
    controllers.panY = viewFolder.add(params, 'panY', -1500, 1500, 1).name('Pan Y');
    viewFolder.add({
      reset: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        controllers.zoom.updateDisplay();
        controllers.panX.updateDisplay();
        controllers.panY.updateDisplay();
      }
    }, 'reset').name('Reset View');

    // Geometry & Motion Folder
    const geoFolder = gui.addFolder('Geometry & Motion');
    controllers.radius = geoFolder.add(params, 'radius', 4, 60, 1).name('Radius');
    controllers.rings = geoFolder.add(params, 'rings', 4, 40, 1).name('Rings');
    controllers.speed = geoFolder.add(params, 'speed', -3.0, 3.0, 0.05).name('Speed');
    controllers.waveFrequency = geoFolder.add(params, 'waveFrequency', 0.5, 15.0, 0.1).name('Wave Freq');
    controllers.scaleMultiplier = geoFolder.add(params, 'scaleMultiplier', 0.0, 2.0, 0.05).name('Scale Multiplier');
    controllers.tanIntensity = geoFolder.add(params, 'tanIntensity', 0.0, 2.0, 0.05).name('Tan Intensity');
    controllers.phaseOffset = geoFolder.add(params, 'phaseOffset', 0.005, 0.2, 0.005).name('Phase Offset');

    // Procedural Generation Folder
    const procFolder = gui.addFolder('Procedural Mode');
    controllers.clickToRandomize = procFolder.add(params, 'clickToRandomize').name('Randomize on Click');
    procFolder.add({ randomize: randomizeScene }, 'randomize').name('Randomize Now');

    // Hide/Show GUI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (activeTag === 'INPUT' || activeTag === 'SELECT' || activeTag === 'TEXTAREA') {
          return;
        }
        if (gui) {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      }
    });

    // Zoom Interaction (Mouse Wheel)
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      params.zoom = Math.max(0.1, Math.min(10.0, params.zoom * zoomFactor));
      controllers.zoom.updateDisplay();
    }, { passive: false });

    // Drag Interaction (Mouse)
    let isMouseDown = false;
    let startX = 0, startY = 0;
    let startPanX = 0, startPanY = 0;

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isMouseDown = true;
      startX = e.clientX;
      startY = e.clientY;
      startPanX = params.panX;
      startPanY = params.panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      params.panX = startPanX + dx;
      params.panY = startPanY + dy;
      controllers.panX.updateDisplay();
      controllers.panY.updateDisplay();
    });

    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;
      const totalMoved = Math.hypot(e.clientX - startX, e.clientY - startY);
      // If movement is under 6px, treat as click to trigger procedural variation
      if (totalMoved < 6 && params.clickToRandomize) {
        randomizeScene();
      }
    });

    // Touch Support for Pan, Zoom, and Click
    let initialTouchDist = null;
    let touchStartX = 0, touchStartY = 0;
    let startTouchPanX = 0, startTouchPanY = 0;
    let touchMoved = 0;

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        startTouchPanX = params.panX;
        startTouchPanY = params.panY;
        touchMoved = 0;
      } else if (e.touches.length === 2) {
        initialTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && initialTouchDist === null) {
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        touchMoved += Math.hypot(dx, dy);
        params.panX = startTouchPanX + dx;
        params.panY = startTouchPanY + dy;
        controllers.panX.updateDisplay();
        controllers.panY.updateDisplay();
      } else if (e.touches.length === 2 && initialTouchDist !== null) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDist / initialTouchDist;
        params.zoom = Math.max(0.1, Math.min(10.0, params.zoom * factor));
        initialTouchDist = currentDist;
        controllers.zoom.updateDisplay();
      }
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        initialTouchDist = null;
        if (touchMoved < 6 && params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // Animation Render Loop
    let lastTime = 0;
    let animTime = 0;

    function render(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const deltaTime = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      animTime += deltaTime * params.speed;
      const t = animTime;

      C.clearRect(0, 0, W, H);
      C.globalCompositeOperation = params.blendMode;

      // Apply Pan & Zoom Transform
      C.save();
      C.translate(HW + params.panX, HH + params.panY);
      C.scale(params.zoom, params.zoom);
      C.translate(-HW, -HH);

      const activeColors = [
        params.color1,
        params.color2,
        params.color3,
        params.color4,
        params.color5
      ].slice(0, params.layers);

      const numLayers = activeColors.length;
      const radius = params.radius;

      for (let k = 0; k < numLayers; k++) {
        C.fillStyle = activeColors[k];
        for (let i = 0; i < params.rings; i++) {
          const index = i * m.sin(t) * params.waveFrequency;
          C.save();
          C.translate(W / 2, H / 2);
          if (i > 0) {
            C.rotate(t / i);
          }
          C.scale(
            m.sin(index * m.PI / 180 + t + k * params.phaseOffset) * params.scaleMultiplier + 1,
            m.tan(index * m.PI / 180 + t + k * params.phaseOffset) * params.tanIntensity + 1
          );
          C.translate(-W / 2, -H / 2);

          if (i === 0) {
            C.fillRect(HW - radius / 2, HH - radius / 2, radius, radius);
          }
          const stepCount = i * 6;
          for (let j = 0; j < stepCount; j++) {
            C.fillRect(
              m.cos(m.PI * 2 / stepCount * j) * radius * 2 * i + HW - radius / 2,
              m.sin(m.PI * 2 / stepCount * j) * radius * 2 * i + HH - radius / 2,
              radius,
              radius
            );
          }
          C.restore();
        }
      }

      C.restore(); // Restore Pan & Zoom

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
