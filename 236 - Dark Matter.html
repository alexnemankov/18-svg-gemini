<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Matter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        /* Custom UI position if needed */
        .lil-gui {
            --background-color: #1a1a1a;
            --text-color: #eee;
            --title-background-color: #333;
            --widget-color: #444;
            --hover-color: #555;
            --focus-color: #666;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <canvas id="webgl"></canvas>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // =========================================================================================
        // POST PROCESSOR SUITE (Three.js Shader Post-Processing Pipeline)
        // =========================================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = mix(vUv, 0.8 * (vUv - 0.5) + 0.5, clamp(chromaticAberrationAmount * 10.0, 0.0, 1.0));
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (vUv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) {
              renderer.setRenderTarget(this.fbo);
            }
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) {
              renderer.setRenderTarget(null);
            }
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class ShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class BloomPass {
          constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              // Horizontal blur pass
              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              // Vertical blur pass
              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.65,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.25,

              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.0,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.0,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.0,

              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader);

            this.copyShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.copyPass = new ShaderPass(this.copyShader);
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post-Processing Suite") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            const bloom = root.addFolder("Bloom");
            bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

            const lens = root.addFolder("Lens & Color");
            lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            return root;
          }
        }

        // =========================================================================================
        // SCENE & SHADER SETUP
        // =========================================================================================

        // 5 Curated, Distinct Color Schemes
        const COLOR_SCHEMES = {
            'Inferno Nebula': {
                colorPink: '#ff941a',   // Outer Color
                colorCyan: '#4b70b9',   // Mid Color
                colorPurple: '#cc0000', // Deep Color
                colorOrange: '#fff957'  // Core Bleed
            },
            'Cyberpunk Neon': {
                colorPink: '#ff007f',
                colorCyan: '#00f0ff',
                colorPurple: '#2a0845',
                colorOrange: '#ffe600'
            },
            'Emerald Aurora': {
                colorPink: '#00ff88',
                colorCyan: '#0088ff',
                colorPurple: '#0a3d24',
                colorOrange: '#d4ff70'
            },
            'Cosmic Amethyst': {
                colorPink: '#d946ef',
                colorCyan: '#8b5cf6',
                colorPurple: '#3b0764',
                colorOrange: '#fde047'
            },
            'Frozen Supernova': {
                colorPink: '#38bdf8',
                colorCyan: '#818cf8',
                colorPurple: '#0f172a',
                colorOrange: '#e0f2fe'
            }
        };

        // State holds all values that UI will tweak
        const params = {
            // Presets & Modes
            colorScheme: 'Inferno Nebula',
            animationPreset: 'Slow Orbital Drift',
            greenScreen: false,
            clickRandomize: true,

            // Noise Reduction & Quality
            ditherStrength: 0.0,       // 0.0 = smooth/noise-free, higher = dither grain
            coreSmoothness: 0.35,      // Softens the inner core edge and prevents turbulent noise
            innerHoleRadius: 0.22,     // Core void radius preventing inner singularity noise
            noiseSmoothness: 1.0,      // Fractal noise softness factor

            // Speeds & Shape
            globalSpeed: 1.0,
            rotationSpeed: 0.25,
            noiseAnimSpeed: 1.1,
            densityMultiplier: 2.8,
            fbmScale: 1.5,

            // Color Palette
            colorPink: COLOR_SCHEMES['Inferno Nebula'].colorPink,
            colorCyan: COLOR_SCHEMES['Inferno Nebula'].colorCyan,
            colorPurple: COLOR_SCHEMES['Inferno Nebula'].colorPurple,
            colorOrange: COLOR_SCHEMES['Inferno Nebula'].colorOrange,

            // Camera (Spherical coords + target)
            camDistance: 5.37,
            camAzimuth: Math.PI,
            camElevation: 0.42,
            camTargetX: 0.0,
            camTargetY: -0.3,
            camTargetZ: 0.0,

            // System
            dpr: 1
        };

        const canvas = document.getElementById('webgl');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
        
        // Post-Processing Pipeline
        const postProcessor = new PostProcessor(renderer);

        // Setup Fullscreen Orthographic Camera to render a flat plane
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;
        const scene = new THREE.Scene();

        // Standard Three.js GLSL
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec2 uResolution;
            uniform float uTime;
            
            // UI Controls variables
            uniform float uRotationSpeed;
            uniform float uAnimationSpeed;
            uniform float uDensity;
            uniform float uFbmScale;
            uniform bool uGreenScreen;
            
            // Noise reduction uniforms
            uniform float uDitherStrength;
            uniform float uCoreSmoothness;
            uniform float uInnerHoleRadius;
            uniform float uNoiseSmoothness;

            uniform vec3 uColorPink;
            uniform vec3 uColorCyan;
            uniform vec3 uColorPurple;
            uniform vec3 uColorOrange;
            
            uniform vec3 uCamPos;
            uniform vec3 uCamTarget;

            varying vec2 vUv;

            // 2D Rotation Matrix
            mat2 rot(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            // Fast 3D Hash function
            float hash(vec3 p) {
                p = fract(p * 0.3183099 + 0.1);
                p *= 17.0;
                return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }

            // 3D Value Noise with C2-continuous Quintic Interpolation (smoother, avoids grid artifacts)
            float noise3D(vec3 x) {
                vec3 i = floor(x);
                vec3 f = fract(x);
                // Quintic smootherstep curve: 6f^5 - 15f^4 + 10f^3
                f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
                
                return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                               mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                           mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                               mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
            }

            // 3D Fractional Brownian Motion (Main detail - 3 octaves with smooth weighting)
            float fbm(vec3 p) {
                float v = 0.0;
                float a = 0.5;
                vec3 shift = vec3(100.0);
                for (int i = 0; i < 3; ++i) {
                    v += a * noise3D(p);
                    p = p * 3.5 + shift;
                    a *= 0.5 * uNoiseSmoothness;
                }
                return v;
            }

            // Faster 3D FBM for domain warping (Only 2 octaves)
            float fbmFast(vec3 p) {
                float v = 0.0;
                float a = 0.4;
                vec3 shift = vec3(100.0);
                for (int i = 0; i < 2; ++i) {
                    v += a * noise3D(p);
                    p = p * 2.0 + shift;
                    a *= -0.1 * uNoiseSmoothness;
                }
                return v;
            }

            // Camera Setup
            mat3 setCamera(vec3 ro, vec3 ta, float cr) {
                vec3 cw = normalize(ta - ro);
                vec3 cp = vec3(sin(cr), cos(cr), 0.0);
                vec3 cu = normalize(cross(cw, cp));
                vec3 cv = normalize(cross(cu, cw));
                return mat3(cu, cv, cw);
            }

            void main() {
                // Map Three.js UV space back to ShaderToy fragCoord space
                vec2 fragCoord = vUv * uResolution;
                vec2 uv = (fragCoord - 0.5 * uResolution.xy) / uResolution.y;
                
                // 1. Setup 3D Camera (Variables controlled by UI / Orbit / Animation)
                vec3 ro = uCamPos; 
                vec3 ta = uCamTarget;
                mat3 ca = setCamera(ro, ta, 0.0);
                vec3 rd = ca * normalize(vec3(uv, 1.5)); // Ray direction
                
                // 2. Background base
                vec3 col = vec3(0.0);
                
                // 3. True Volumetric Raymarching for the Fluid/Galaxy
                vec3 volCol = vec3(0.0);
                float transmittance = 1.0;
                
                // Smooth raymarch parameters
                float stepSize = 0.09; 
                float dither = fract(sin(dot(fragCoord, vec2(12.9898, 78.233))) * 43758.5453);
                float t = 1.0 + (dither - 0.5) * stepSize * uDitherStrength;
                float tMax = 8.0; 
                
                // 65 volumetric sampling steps for smooth density integration
                for(int i = 0; i < 65; i++) {
                    vec3 p = ro + rd * t;
                    
                    // Bounds Optimization
                    if(abs(p.y) > 1.2 || length(p.xz) > 3.0) {
                        t += stepSize;
                        if(t > tMax) break;
                        continue;
                    }
                    
                    float r = length(p.xz);
                    float a = atan(p.z, p.x);
                    
                    // Swirling vortex logic (Softened near core to prevent singularity noise)
                    float swirl = -uTime * uRotationSpeed - 2.5 / (r + 0.5 + uCoreSmoothness * 0.4);
                    a += swirl;
                    
                    // Swirled 3D Coordinates
                    vec3 sp = vec3(cos(a) * r, p.y * 2.0, sin(a) * r);
                    
                    // 3D Domain Warping for fluid dynamics
                    vec3 q = vec3(0.0);
                    q.x = fbmFast(sp + uTime * 0.2 * uAnimationSpeed);
                    q.y = fbmFast(sp + vec3(1.0, -uTime * 0.15 * uAnimationSpeed, 1.0));
                    q.z = fbmFast(sp + vec3(2.0, 2.0, uTime * 0.1 * uAnimationSpeed));
                    
                    // Final noise evaluation
                    float n = fbm(sp * uFbmScale + q * uFbmScale);
                    
                    // Density shaping (Smooth outer and inner hole falloffs)
                    float density = smoothstep(0.3, 0.8, n);
                    float outerMask = smoothstep(2.5, 0.5, r) * smoothstep(1.0, 0.1, abs(p.y));
                    float innerMask = smoothstep(uInnerHoleRadius, uInnerHoleRadius + uCoreSmoothness, r);
                    density *= outerMask * innerMask * uDensity;
                    
                    if(density > 0.005) {
                        // Map colors based on radius and noise warping (Colors injected via Uniforms)
                        vec3 vCol = mix(uColorPurple, uColorPink, smoothstep(0.2, 0.7, n));
                        vCol = mix(vCol, uColorCyan, smoothstep(0.5, 1.5, r + q.x * 0.5));
                        vCol = mix(uColorOrange, vCol, smoothstep(0.1, 0.5, r)); // Core bleeds orange
                        
                        // Self-illumination
                        vCol += vec3(0.5) * smoothstep(0.6, 0.9, n);
                        
                        // Volumetric integration (Beer-Lambert law)
                        float alpha = 1.0 - exp(-density * stepSize * 5.0);
                        volCol += transmittance * alpha * vCol * 2.0;
                        transmittance *= (1.0 - alpha);
                    }
                    
                    // Early exit if light is fully blocked
                    if(transmittance < 0.01) break;
                    t += stepSize;
                }
                
                // 4. True 3D Spherical Core Glow
                float tClosest = max(0.0, -dot(ro, rd));
                vec3 pClosest = ro + rd * tClosest;
                float coreDist3D = length(pClosest);
                
                float coreGlow3D = -0.125 / (coreDist3D * coreDist3D + 0.01);
                coreGlow3D *= smoothstep(1.5, 0.0, coreDist3D); // Falloff
                coreGlow3D *= 1.0 + 0.1 * sin(uTime * 2.5 * uAnimationSpeed);
                
                vec3 coreColor3D = vec3(1.0, 0.9, 0.5) * coreGlow3D;
                vec3 innerWhite3D = vec3(1.0) * smoothstep(0.15, 0.0, coreDist3D) * 1.5;
                
                if (uGreenScreen) {
                    // Greenscreen (#00ff00) background compositing for easy chroma keying
                    vec3 greenBg = vec3(0.0, 1.0, 0.0);
                    vec3 fluid = volCol + coreColor3D + innerWhite3D;
                    vec3 fluidTonemapped = 1.0 - exp(-max(vec3(0.0), fluid) * 1.2);
                    
                    float fluidOpacity = clamp(1.0 - transmittance + length(max(vec3(0.0), coreColor3D + innerWhite3D)) * 0.5, 0.0, 1.0);
                    col = mix(greenBg, fluidTonemapped, fluidOpacity);
                } else {
                    // Classic Deep Space Dark Matter background with tone mapping and vignette
                    col = mix(vec3(0.0), volCol, 1.0 - transmittance);
                    col += coreColor3D;
                    col += innerWhite3D;
                    
                    // Tone mapping
                    col = 1.0 - exp(-col * 1.2);
                    col *= 1.0 - dot(uv, uv) * 0.3; // Vignette
                }
                
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        // Uniforms mapped to parameters
        const uniforms = {
            uTime: { value: 0.0 },
            uResolution: { value: new THREE.Vector2() },
            
            uRotationSpeed: { value: params.rotationSpeed },
            uAnimationSpeed: { value: params.noiseAnimSpeed },
            uDensity: { value: params.densityMultiplier },
            uFbmScale: { value: params.fbmScale },
            uGreenScreen: { value: params.greenScreen },

            uDitherStrength: { value: params.ditherStrength },
            uCoreSmoothness: { value: params.coreSmoothness },
            uInnerHoleRadius: { value: params.innerHoleRadius },
            uNoiseSmoothness: { value: params.noiseSmoothness },
            
            uColorPink: { value: new THREE.Color(params.colorPink) },
            uColorCyan: { value: new THREE.Color(params.colorCyan) },
            uColorPurple: { value: new THREE.Color(params.colorPurple) },
            uColorOrange: { value: new THREE.Color(params.colorOrange) },
            
            uCamPos: { value: new THREE.Vector3() },
            uCamTarget: { value: new THREE.Vector3() }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms
        });

        // Add fullscreen plane
        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Setup GUI
        const gui = new GUI({ title: 'Dark Matter Controls' });
        const controllers = {};

        // 1. Presets & Mode Folder
        const presetFolder = gui.addFolder('Presets & Modes');
        
        controllers.colorScheme = presetFolder.add(params, 'colorScheme', [
            'Inferno Nebula',
            'Cyberpunk Neon',
            'Emerald Aurora',
            'Cosmic Amethyst',
            'Frozen Supernova',
            'Custom'
        ]).name('Color Theme').onChange(v => {
            if (COLOR_SCHEMES[v]) {
                applyColorScheme(COLOR_SCHEMES[v]);
            }
        });

        controllers.animationPreset = presetFolder.add(params, 'animationPreset', [
            'Static Horizon',
            'Slow Orbital Drift',
            'Vertical Breathing',
            'Deep Space Flyby',
            'Vortex Oscillation'
        ]).name('Camera Motion');

        controllers.greenScreen = presetFolder.add(params, 'greenScreen').name('Greenscreen (#00ff00)').onChange(v => {
            uniforms.uGreenScreen.value = v;
        });

        controllers.clickRandomize = presetFolder.add(params, 'clickRandomize').name('Click to Randomize');

        presetFolder.add({ randomize: () => randomizeScene() }, 'randomize').name('🎲 Randomize Scene');

        // 2. Post-Processing Suite Folder
        postProcessor.attachGUI(gui, 'Post-Processing Suite');

        // 3. Noise Reduction & Smoothness Folder
        const qualityFolder = gui.addFolder('Noise Reduction & Smoothness');
        controllers.ditherStrength = qualityFolder.add(params, 'ditherStrength', 0.0, 1.0, 0.05).name('Dither Grain (Noise)').onChange(v => {
            uniforms.uDitherStrength.value = v;
        });
        controllers.coreSmoothness = qualityFolder.add(params, 'coreSmoothness', 0.05, 1.0, 0.05).name('Core Edge Smoothness').onChange(v => {
            uniforms.uCoreSmoothness.value = v;
        });
        controllers.innerHoleRadius = qualityFolder.add(params, 'innerHoleRadius', 0.0, 0.6, 0.02).name('Core Hole Size').onChange(v => {
            uniforms.uInnerHoleRadius.value = v;
        });
        controllers.noiseSmoothness = qualityFolder.add(params, 'noiseSmoothness', 0.3, 1.5, 0.05).name('Noise Softness').onChange(v => {
            uniforms.uNoiseSmoothness.value = v;
        });

        // 4. Animation & Speed Folder
        const animFolder = gui.addFolder('Animation & Speed');
        controllers.globalSpeed = animFolder.add(params, 'globalSpeed', 0.0, 4.0, 0.05).name('Global Speed');
        controllers.rotationSpeed = animFolder.add(params, 'rotationSpeed', -3.0, 3.0, 0.05).name('Swirl Speed').onChange(v => {
            uniforms.uRotationSpeed.value = v;
        });
        controllers.noiseAnimSpeed = animFolder.add(params, 'noiseAnimSpeed', 0.0, 5.0, 0.1).name('Noise Speed').onChange(v => {
            uniforms.uAnimationSpeed.value = v;
        });

        // 5. Fluid & Geometry Folder
        const geoFolder = gui.addFolder('Geometry & Fluid');
        controllers.densityMultiplier = geoFolder.add(params, 'densityMultiplier', 0.1, 5.0, 0.1).name('Cloud Density').onChange(v => {
            uniforms.uDensity.value = v;
        });
        controllers.fbmScale = geoFolder.add(params, 'fbmScale', 0.5, 3.0, 0.05).name('Fractal Scale').onChange(v => {
            uniforms.uFbmScale.value = v;
        });

        // 6. Color Palette Folder
        const colorFolder = gui.addFolder('Color Palette');
        function onManualColorChange() {
            params.colorScheme = 'Custom';
            controllers.colorScheme.updateDisplay();
        }

        controllers.colorPink = colorFolder.addColor(params, 'colorPink').name('Outer Color').onChange(v => {
            uniforms.uColorPink.value.set(v);
            onManualColorChange();
        });
        controllers.colorCyan = colorFolder.addColor(params, 'colorCyan').name('Mid Color').onChange(v => {
            uniforms.uColorCyan.value.set(v);
            onManualColorChange();
        });
        controllers.colorPurple = colorFolder.addColor(params, 'colorPurple').name('Deep Color').onChange(v => {
            uniforms.uColorPurple.value.set(v);
            onManualColorChange();
        });
        controllers.colorOrange = colorFolder.addColor(params, 'colorOrange').name('Core Bleed').onChange(v => {
            uniforms.uColorOrange.value.set(v);
            onManualColorChange();
        });

        // 7. Camera & System Folder
        const camFolder = gui.addFolder('Camera & View');
        controllers.camDistance = camFolder.add(params, 'camDistance', 1.5, 15.0, 0.05).name('Distance (Zoom)');
        controllers.camAzimuth = camFolder.add(params, 'camAzimuth', -Math.PI, Math.PI, 0.02).name('Azimuth (Orbit)');
        controllers.camElevation = camFolder.add(params, 'camElevation', -1.4, 1.4, 0.02).name('Elevation (Pitch)');
        controllers.camTargetX = camFolder.add(params, 'camTargetX', -5.0, 5.0, 0.05).name('Target X (Pan)');
        controllers.camTargetY = camFolder.add(params, 'camTargetY', -5.0, 5.0, 0.05).name('Target Y (Pan)');
        controllers.camTargetZ = camFolder.add(params, 'camTargetZ', -5.0, 5.0, 0.05).name('Target Z (Pan)');
        
        controllers.dpr = camFolder.add(params, 'dpr', [0.5, 0.75, 1, 1.5, 2]).name('DPR / Resolution').onChange(() => {
            updateRendererSize();
        });

        camFolder.add({ resetCam: () => resetCamera() }, 'resetCam').name('Reset Camera');

        function applyColorScheme(scheme) {
            params.colorPink = scheme.colorPink;
            params.colorCyan = scheme.colorCyan;
            params.colorPurple = scheme.colorPurple;
            params.colorOrange = scheme.colorOrange;

            uniforms.uColorPink.value.set(params.colorPink);
            uniforms.uColorCyan.value.set(params.colorCyan);
            uniforms.uColorPurple.value.set(params.colorPurple);
            uniforms.uColorOrange.value.set(params.colorOrange);

            controllers.colorPink.updateDisplay();
            controllers.colorCyan.updateDisplay();
            controllers.colorPurple.updateDisplay();
            controllers.colorOrange.updateDisplay();
        }

        function resetCamera() {
            params.camDistance = 5.37;
            params.camAzimuth = Math.PI;
            params.camElevation = 0.42;
            params.camTargetX = 0.0;
            params.camTargetY = -0.3;
            params.camTargetZ = 0.0;
            controllers.camDistance.updateDisplay();
            controllers.camAzimuth.updateDisplay();
            controllers.camElevation.updateDisplay();
            controllers.camTargetX.updateDisplay();
            controllers.camTargetY.updateDisplay();
            controllers.camTargetZ.updateDisplay();
        }

        // Procedural Variation Generator upon Scene Click
        function randomizeScene() {
            // Procedural vibrant color palette generation
            const baseHue = Math.random();
            const c1 = new THREE.Color().setHSL(baseHue, 0.95, 0.55);
            const c2 = new THREE.Color().setHSL((baseHue + 0.3 + Math.random() * 0.15) % 1.0, 0.9, 0.55);
            const c3 = new THREE.Color().setHSL((baseHue + 0.6 + Math.random() * 0.2) % 1.0, 0.85, 0.3);
            const c4 = new THREE.Color().setHSL((baseHue + 0.15 + Math.random() * 0.1) % 1.0, 1.0, 0.7);

            params.colorPink = '#' + c1.getHexString();
            params.colorCyan = '#' + c2.getHexString();
            params.colorPurple = '#' + c3.getHexString();
            params.colorOrange = '#' + c4.getHexString();
            params.colorScheme = 'Custom';

            // Randomize motion & geometry within aesthetic bounds
            const sign = Math.random() > 0.5 ? 1 : -1;
            params.rotationSpeed = parseFloat((sign * (0.15 + Math.random() * 0.75)).toFixed(2));
            params.noiseAnimSpeed = parseFloat((0.6 + Math.random() * 1.6).toFixed(2));
            params.densityMultiplier = parseFloat((1.8 + Math.random() * 2.2).toFixed(1));
            params.fbmScale = parseFloat((1.0 + Math.random() * 1.2).toFixed(2));

            // Camera subtle re-roll
            params.camDistance = parseFloat((4.0 + Math.random() * 2.8).toFixed(2));
            params.camElevation = parseFloat((-0.3 + Math.random() * 0.9).toFixed(2));
            params.camAzimuth = parseFloat(((Math.random() * 2 - 1) * Math.PI).toFixed(2));

            // Pick a random animation preset
            const animPresets = [
                'Static Horizon',
                'Slow Orbital Drift',
                'Vertical Breathing',
                'Deep Space Flyby',
                'Vortex Oscillation'
            ];
            params.animationPreset = animPresets[Math.floor(Math.random() * animPresets.length)];

            // Sync uniforms
            uniforms.uColorPink.value.set(params.colorPink);
            uniforms.uColorCyan.value.set(params.colorCyan);
            uniforms.uColorPurple.value.set(params.colorPurple);
            uniforms.uColorOrange.value.set(params.colorOrange);
            uniforms.uRotationSpeed.value = params.rotationSpeed;
            uniforms.uAnimationSpeed.value = params.noiseAnimSpeed;
            uniforms.uDensity.value = params.densityMultiplier;
            uniforms.uFbmScale.value = params.fbmScale;

            // Sync all GUI controls
            Object.values(controllers).forEach(c => c.updateDisplay());
        }

        // Interactive Drag & Zoom Controls
        let isPointerDown = false;
        let pointerStartX = 0;
        let pointerStartY = 0;
        let hasDragged = false;
        let isPanning = false;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;
            isPointerDown = true;
            pointerStartX = e.clientX;
            pointerStartY = e.clientY;
            hasDragged = false;
            isPanning = (e.button === 2 || e.shiftKey);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPointerDown) return;
            const dx = e.clientX - pointerStartX;
            const dy = e.clientY - pointerStartY;
            if (Math.hypot(dx, dy) > 5) {
                hasDragged = true;
            }
            if (!hasDragged) return;

            if (isPanning) {
                // Drag object / Pan target across screen
                const panFactor = 0.0035 * (params.camDistance / 5.0);
                const cosA = Math.cos(params.camAzimuth);
                const sinA = Math.sin(params.camAzimuth);
                
                params.camTargetX -= (e.movementX * cosA) * panFactor;
                params.camTargetZ += (e.movementX * sinA) * panFactor;
                params.camTargetY += e.movementY * panFactor;

                controllers.camTargetX.updateDisplay();
                controllers.camTargetY.updateDisplay();
                controllers.camTargetZ.updateDisplay();
            } else {
                // Orbit rotation across screen
                params.camAzimuth -= e.movementX * 0.005;
                if (params.camAzimuth > Math.PI) params.camAzimuth -= Math.PI * 2;
                if (params.camAzimuth < -Math.PI) params.camAzimuth += Math.PI * 2;

                params.camElevation += e.movementY * 0.005;
                params.camElevation = Math.max(-1.42, Math.min(1.42, params.camElevation));

                controllers.camAzimuth.updateDisplay();
                controllers.camElevation.updateDisplay();
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (isPointerDown && !hasDragged && e.button === 0) {
                if (!e.target.closest('.lil-gui')) {
                    if (params.clickRandomize) {
                        randomizeScene();
                    }
                }
            }
            isPointerDown = false;
            isPanning = false;
        });

        window.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('.lil-gui')) {
                e.preventDefault();
            }
        });

        // Zoom with mouse wheel
        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.lil-gui')) return;
            params.camDistance += e.deltaY * 0.004;
            params.camDistance = Math.max(1.5, Math.min(15.0, params.camDistance));
            controllers.camDistance.updateDisplay();
        }, { passive: true });

        // Hide/Show GUI with 'H' key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
                    return;
                }
                const isHidden = gui._hidden || gui.domElement.style.display === 'none';
                if (isHidden) {
                    gui.show();
                    gui.domElement.style.display = '';
                } else {
                    gui.hide();
                    gui.domElement.style.display = 'none';
                }
            }
        });

        // Resize handler
        function updateRendererSize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setPixelRatio(params.dpr);
            renderer.setSize(w, h);
            uniforms.uResolution.value.set(w * params.dpr, h * params.dpr);
            postProcessor.setSize(w, h, params.dpr);
        }
        
        window.addEventListener('resize', updateRendererSize);
        updateRendererSize();

        // Animation loop
        const clock = new THREE.Clock();
        let accumulatedTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            accumulatedTime += delta * params.globalSpeed;

            // Update Shader Time
            uniforms.uTime.value = accumulatedTime;

            // Compute Camera Motion Presets
            let curAzimuth = params.camAzimuth;
            let curElevation = params.camElevation;
            let curDistance = params.camDistance;

            const t = accumulatedTime;

            if (params.animationPreset === 'Slow Orbital Drift') {
                curAzimuth += t * 0.12;
            } else if (params.animationPreset === 'Vertical Breathing') {
                curElevation += Math.sin(t * 0.28) * 0.3;
            } else if (params.animationPreset === 'Deep Space Flyby') {
                curDistance += Math.sin(t * 0.18) * 1.2;
                curAzimuth += Math.cos(t * 0.12) * 0.35;
            } else if (params.animationPreset === 'Vortex Oscillation') {
                curAzimuth += Math.sin(t * 0.22) * 0.45;
                curElevation += Math.cos(t * 0.18) * 0.22;
            }
            // 'Static Horizon': keeps base camera without motion

            // Spherical to Cartesian Camera Position
            const cx = params.camTargetX + curDistance * Math.cos(curElevation) * Math.sin(curAzimuth);
            const cy = params.camTargetY + curDistance * Math.sin(curElevation);
            const cz = params.camTargetZ + curDistance * Math.cos(curElevation) * Math.cos(curAzimuth);

            uniforms.uCamPos.value.set(cx, cy, cz);
            uniforms.uCamTarget.value.set(params.camTargetX, params.camTargetY, params.camTargetZ);

            // Render through Post-Processing Pipeline
            postProcessor.renderScene(scene, camera);
        }

        animate();
    </script>
</body>
