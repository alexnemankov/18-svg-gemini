<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anamorphic Horizontal Streak Flare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020611;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewport-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }
    #viewport-wrapper.grabbing {
      cursor: grabbing;
    }
    svg#flare-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: none;
    }
    canvas#webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      mix-blend-mode: screen;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewport-wrapper">
    <!-- SVG Vector Layer for the Anamorphic Horizontal Streak Flare -->
    <svg id="flare-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision">
      <defs id="svg-defs">
        <!-- Central Hot Core Radial Gradient -->
        <radialGradient id="core-glow-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" id="core-stop-0" />
          <stop offset="16%" stop-color="#ffffff" stop-opacity="0.92" id="core-stop-1" />
          <stop offset="42%" stop-color="#00f0ff" stop-opacity="0.65" id="core-stop-2" />
          <stop offset="75%" stop-color="#0088cc" stop-opacity="0.18" id="core-stop-3" />
          <stop offset="100%" stop-color="#003366" stop-opacity="0.0" id="core-stop-4" />
        </radialGradient>

        <!-- Broad Atmospheric Soft Radial Halo Gradient -->
        <radialGradient id="ambient-halo-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45" id="halo-stop-0" />
          <stop offset="30%" stop-color="#0088cc" stop-opacity="0.22" id="halo-stop-1" />
          <stop offset="65%" stop-color="#004488" stop-opacity="0.06" id="halo-stop-2" />
          <stop offset="100%" stop-color="#001133" stop-opacity="0.0" id="halo-stop-3" />
        </radialGradient>

        <!-- Anamorphic Horizontal Razor Streak Linear Gradient -->
        <linearGradient id="streak-razor-grad" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#0088cc" stop-opacity="0.0" id="razor-stop-0" />
          <stop offset="22%" stop-color="#00b4d8" stop-opacity="0.20" id="razor-stop-1" />
          <stop offset="44%" stop-color="#00f0ff" stop-opacity="0.75" id="razor-stop-2" />
          <stop offset="50%" stop-color="#ffffff" stop-opacity="1.0" id="razor-stop-3" />
          <stop offset="56%" stop-color="#00f0ff" stop-opacity="0.75" id="razor-stop-4" />
          <stop offset="78%" stop-color="#00b4d8" stop-opacity="0.20" id="razor-stop-5" />
          <stop offset="100%" stop-color="#0088cc" stop-opacity="0.0" id="razor-stop-6" />
        </linearGradient>

        <!-- Anamorphic Wide Horizontal Soft Bloom Gradient -->
        <linearGradient id="streak-bloom-grad" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#003366" stop-opacity="0.0" id="bloom-stop-0" />
          <stop offset="18%" stop-color="#0077b6" stop-opacity="0.14" id="bloom-stop-1" />
          <stop offset="40%" stop-color="#00b4d8" stop-opacity="0.45" id="bloom-stop-2" />
          <stop offset="50%" stop-color="#b3f7ff" stop-opacity="0.80" id="bloom-stop-3" />
          <stop offset="60%" stop-color="#00b4d8" stop-opacity="0.45" id="bloom-stop-4" />
          <stop offset="82%" stop-color="#0077b6" stop-opacity="0.14" id="bloom-stop-5" />
          <stop offset="100%" stop-color="#003366" stop-opacity="0.0" id="bloom-stop-6" />
        </linearGradient>

        <!-- Anamorphic Chromatic Dispersion Cyan Gradient -->
        <linearGradient id="streak-cyan-grad" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.0" />
          <stop offset="32%" stop-color="#00f0ff" stop-opacity="0.30" id="cyan-stop-1" />
          <stop offset="50%" stop-color="#ffffff" stop-opacity="0.70" />
          <stop offset="68%" stop-color="#00f0ff" stop-opacity="0.30" id="cyan-stop-2" />
          <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0" />
        </linearGradient>

        <!-- Anamorphic Chromatic Dispersion Magenta Gradient -->
        <linearGradient id="streak-magenta-grad" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#ff007f" stop-opacity="0.0" />
          <stop offset="32%" stop-color="#ff007f" stop-opacity="0.30" id="magenta-stop-1" />
          <stop offset="50%" stop-color="#ffffff" stop-opacity="0.70" />
          <stop offset="68%" stop-color="#ff007f" stop-opacity="0.30" id="magenta-stop-2" />
          <stop offset="100%" stop-color="#ff007f" stop-opacity="0.0" />
        </linearGradient>

        <!-- Optical Iris Ghost Discs Radial Gradient -->
        <radialGradient id="ghost-disc-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.0" />
          <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.22" id="ghost-stop-1" />
          <stop offset="90%" stop-color="#ffffff" stop-opacity="0.55" id="ghost-stop-2" />
          <stop offset="100%" stop-color="#0088cc" stop-opacity="0.0" id="ghost-stop-3" />
        </radialGradient>

        <!-- Background Ambient Vignette Gradient -->
        <radialGradient id="bg-ambient-grad" cx="50%" cy="50%" r="70%">
          <stop offset="0%" stop-color="#09182b" stop-opacity="0.7" id="bg-stop-0" />
          <stop offset="50%" stop-color="#040b15" stop-opacity="0.9" id="bg-stop-1" />
          <stop offset="100%" stop-color="#010408" stop-opacity="1.0" id="bg-stop-2" />
        </radialGradient>

        <!-- ========================================================================= -->
        <!-- SVG FILTERS WITH FULL USERSPACE BOUNDS (ELIMINATES SQUARE CLIPPING BOXES)  -->
        <!-- ========================================================================= -->
        <filter id="core-intense-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
          <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur2" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="55" result="blur3" />
          <feMerge>
            <feMergeNode in="blur3" />
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="streak-razor-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
          <feGaussianBlur in="SourceGraphic" stdDeviation="16 1.0" result="rBlur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="40 2.2" result="rBlur2" />
          <feMerge>
            <feMergeNode in="rBlur2" />
            <feMergeNode in="rBlur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="streak-h-diffusion" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
          <feGaussianBlur in="SourceGraphic" stdDeviation="45 2.0" result="hBlur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="110 3.5" result="hBlur2" />
          <feMerge>
            <feMergeNode in="hBlur2" />
            <feMergeNode in="hBlur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="micro-glint-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glintBlur" />
          <feMerge>
            <feMergeNode in="glintBlur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Infinite Backdrop Surface -->
      <rect id="bg-rect" x="-4000" y="-4000" width="10000" height="10000" fill="url(#bg-ambient-grad)" />

      <!-- World Rig Container (Pan & Zoom Transformation Rig) -->
      <g id="world-rig">

        <!-- UNIFIED OPTICAL FLARE ASSEMBLY (Streak and Core are strictly concentric) -->
        <g id="flare-optical-assembly">

          <!-- 1. Ambient Background Halo & Broad Atmosphere -->
          <g id="halo-layer">
            <circle id="ambient-halo-outer" cx="960" cy="540" r="480" fill="url(#ambient-halo-grad)" opacity="0.65" />
            <circle id="ambient-halo-mid" cx="960" cy="540" r="260" fill="url(#ambient-halo-grad)" opacity="0.85" />
          </g>

          <!-- 2. Anamorphic Optical Ghost Flare Discs & Rings -->
          <g id="ghost-flares-layer" opacity="0.7">
            <circle id="ghost-ring-1" cx="720" cy="540" r="68" fill="none" stroke="url(#streak-bloom-grad)" stroke-width="1.4" opacity="0.45" />
            <circle id="ghost-ring-2" cx="1240" cy="540" r="95" fill="none" stroke="url(#streak-bloom-grad)" stroke-width="1.8" opacity="0.38" />
            <circle id="ghost-disc-1" cx="610" cy="540" r="42" fill="url(#ghost-disc-grad)" opacity="0.5" />
            <circle id="ghost-disc-2" cx="1380" cy="540" r="54" fill="url(#ghost-disc-grad)" opacity="0.42" />
            <circle id="ghost-disc-3" cx="440" cy="540" r="28" fill="url(#ghost-disc-grad)" opacity="0.3" />
            <circle id="ghost-disc-4" cx="1560" cy="540" r="36" fill="url(#ghost-disc-grad)" opacity="0.32" />
          </g>

          <!-- 3. Starlight Diffraction Rays (Subtle Aperture Spikes) -->
          <g id="diffraction-spikes-group" opacity="0.45" filter="url(#micro-glint-glow)">
            <!-- Diagonal Subtle Spikes -->
            <line id="spike-diag-1" x1="780" y1="360" x2="1140" y2="720" stroke="#ffffff" stroke-width="0.8" opacity="0.35" />
            <line id="spike-diag-2" x1="780" y1="720" x2="1140" y2="360" stroke="#ffffff" stroke-width="0.8" opacity="0.35" />
            <!-- Vertical Aperture Spike -->
            <line id="spike-vertical" x1="960" y1="280" x2="960" y2="800" stroke="url(#streak-razor-grad)" stroke-width="1.4" opacity="0.6" />
          </g>

          <!-- 4. MASTER ANAMORPHIC HORIZONTAL STREAK GROUP -->
          <g id="streak-flare-master-group">
            <!-- Wide Atmospheric Horizontal Diffused Bloom Streak -->
            <ellipse id="streak-diffuse-bloom" cx="960" cy="540" rx="920" ry="7" fill="url(#streak-bloom-grad)" opacity="0.45" filter="url(#streak-h-diffusion)" />

            <!-- Mid-layer Horizontal Anamorphic Flare -->
            <ellipse id="streak-mid-bloom" cx="960" cy="540" rx="720" ry="4" fill="url(#streak-bloom-grad)" opacity="0.75" filter="url(#streak-h-diffusion)" />

            <!-- Chromatic Dispersion Fringe Streaks -->
            <g id="chromatic-dispersion-group" opacity="0.65">
              <ellipse id="streak-cyan-fringe" cx="960" cy="539.0" rx="650" ry="1.8" fill="url(#streak-cyan-grad)" opacity="0.6" filter="url(#streak-h-diffusion)" />
              <ellipse id="streak-magenta-fringe" cx="960" cy="541.0" rx="650" ry="1.8" fill="url(#streak-magenta-grad)" opacity="0.6" filter="url(#streak-h-diffusion)" />
            </g>

            <!-- Core Secondary Streak Envelope -->
            <ellipse id="streak-secondary" cx="960" cy="540" rx="620" ry="2.8" fill="url(#streak-razor-grad)" opacity="0.85" filter="url(#streak-razor-glow)" />

            <!-- ========================================================================= -->
            <!-- PRIMARY ULTRA-WIDE FLATTENED HORIZONTAL ELLIPSE (rx="500" ry="2")        -->
            <!-- Centered directly over the soft circular radial gradient core             -->
            <!-- ========================================================================= -->
            <ellipse id="primary-horizontal-streak" cx="960" cy="540" rx="500" ry="2" fill="url(#streak-razor-grad)" opacity="0.95" filter="url(#streak-razor-glow)" />

            <!-- Micro Razor Line Hot Filament through Streak Center -->
            <line id="streak-center-filament" x1="460" y1="540" x2="1460" y2="540" stroke="#ffffff" stroke-width="1.3" opacity="0.9" filter="url(#micro-glint-glow)" />

            <!-- Subtle Flanking Horizontal Filaments -->
            <line id="streak-flank-top" x1="660" y1="538.2" x2="1260" y2="538.2" stroke="url(#streak-razor-grad)" stroke-width="0.7" stroke-dasharray="32 8 8 8" opacity="0.4" />
            <line id="streak-flank-bot" x1="660" y1="541.8" x2="1260" y2="541.8" stroke="url(#streak-razor-grad)" stroke-width="0.7" stroke-dasharray="32 8 8 8" opacity="0.4" />
          </g>

          <!-- 5. SOFT CIRCULAR RADIAL GRADIENT CORE -->
          <g id="core-master-group">
            <!-- Outer Soft Radial Corona Halo -->
            <circle id="core-outer-halo" cx="960" cy="540" r="150" fill="url(#ambient-halo-grad)" opacity="0.7" />

            <!-- Main Soft Circular Radial Gradient Core -->
            <circle id="core-radial-body" cx="960" cy="540" r="68" fill="url(#core-glow-grad)" opacity="0.9" filter="url(#core-intense-glow)" />

            <!-- Intense White Specular Core Center -->
            <circle id="core-hot-center" cx="960" cy="540" r="24" fill="#ffffff" opacity="0.98" filter="url(#core-intense-glow)" />

            <!-- Pinpoint Singularity Center -->
            <circle id="core-pinpoint" cx="960" cy="540" r="8.5" fill="#ffffff" opacity="1.0" />
          </g>

          <!-- 6. Optical Glint & Micro Diffraction Starlets -->
          <g id="starlets-container" pointer-events="none"></g>

        </g>
      </g>
    </svg>

    <!-- Three.js Canvas Layer for Floating Cinematic Anamorphic Particles -->
    <canvas id="webgl-canvas"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================
    // 18 PRECONFIGURED COLOR SCHEMES
    // Exactly matching all requested color palettes and schemes:
    // - Monochromatic, Analogous, Complementary, Split-complementary, Triadic,
    //   Tetradic, Double split-complementary, Achromatic (B&W), Achromatic (W&B),
    //   Neutral + accent (important!), and the 8 custom specified hex palettes
    // =========================================================================
    const COLOR_SCHEMES = {
      'Monochromatic': {
        primary: '#00f0ff',
        secondary: '#0088cc',
        accent: '#b3f7ff',
        core: '#ffffff',
        background: '#020914',
        particle: '#00e5ff'
      },
      'Analogous': {
        primary: '#00f0ff',
        secondary: '#3a86ff',
        accent: '#00ffc8',
        core: '#ffffff',
        background: '#020713',
        particle: '#3a86ff'
      },
      'Complementary': {
        primary: '#00f0ff',
        secondary: '#ff7700',
        accent: '#ffb703',
        core: '#ffffff',
        background: '#080512',
        particle: '#ff9e00'
      },
      'Split-complementary': {
        primary: '#00f0ff',
        secondary: '#ff0055',
        accent: '#ffaa00',
        core: '#ffffff',
        background: '#0a0312',
        particle: '#ff0055'
      },
      'Triadic': {
        primary: '#00f5d4',
        secondary: '#d90429',
        accent: '#fee440',
        core: '#ffffff',
        background: '#08020e',
        particle: '#fee440'
      },
      'Tetradic': {
        primary: '#00b4d8',
        secondary: '#e01a4f',
        accent: '#06d6a0',
        core: '#ffffff',
        background: '#06030e',
        particle: '#e01a4f'
      },
      'Double split-complementary': {
        primary: '#4cc9f0',
        secondary: '#7209b7',
        accent: '#f72585',
        core: '#ffffff',
        background: '#050212',
        particle: '#f72585'
      },
      'Achromatic (black and white)': {
        primary: '#ffffff',
        secondary: '#9ca3af',
        accent: '#e5e7eb',
        core: '#ffffff',
        background: '#000000',
        particle: '#ffffff'
      },
      'Achromatic (white and black)': {
        primary: '#111827',
        secondary: '#4b5563',
        accent: '#000000',
        core: '#000000',
        background: '#f3f4f6',
        particle: '#374151'
      },
      'Neutral + accent': {
        primary: '#00f0ff',     // High-tech vibrant electric accent
        secondary: '#64748b',   // Neutral slate
        accent: '#38bdf8',      // Radiant accent highlight
        core: '#ffffff',
        background: '#090d16',  // Deep neutral titanium
        particle: '#00f0ff'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        primary: '#F6AA1C',
        secondary: '#BC3908',
        accent: '#F6AA1C',
        core: '#FFE8A3',
        background: '#220901',
        particle: '#F6AA1C'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        primary: '#63D1CF',
        secondary: '#5BC0BE',
        accent: '#4BAD9E',
        core: '#E0FBFF',
        background: '#0B132B',
        particle: '#5BC0BE'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        primary: '#AA60C8',
        secondary: '#D69ADE',
        accent: '#CFB5C2',
        core: '#FFFFFF',
        background: '#0D001D',
        particle: '#D69ADE'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        primary: '#FFBA00',
        secondary: '#008189',
        accent: '#FEF1BE',
        core: '#FFFFFF',
        background: '#061210',
        particle: '#FEF1BE'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        primary: '#7FFF00',
        secondary: '#00B894',
        accent: '#D4FFB0',
        core: '#FFFFFF',
        background: '#05140A',
        particle: '#7FFF00'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        primary: '#FF8C00',
        secondary: '#C7501A',
        accent: '#FFE8CC',
        core: '#FFF4E5',
        background: '#0E0618',
        particle: '#FF8C00'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        primary: '#B38FFF',
        secondary: '#6A3DE8',
        accent: '#E8E0FF',
        core: '#FFFFFF',
        background: '#090612',
        particle: '#B38FFF'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        primary: '#00F0FF',
        secondary: '#D40078',
        accent: '#E0FBFF',
        core: '#FFFFFF',
        background: '#05020F',
        particle: '#00F0FF'
      }
    };

    // =========================================================================
    // 8 PRECONFIGURED ANIMATION PRESETS
    // Smooth, slow, elegant cinematic animations + Static animation
    // =========================================================================
    const ANIMATION_PRESETS = [
      'Subtle Harmonic Pulse',
      'Anamorphic Drift & Shear',
      'Cinematic Breathing Flare',
      'Prismatic Spectral Flutter',
      'Orbital Flare Precession',
      'Starlight Surge & Resonate',
      'Solar Flare Wind Ripple',
      'Static Flare Stillness'
    ];

    // =========================================================================
    // MASTER CONFIGURATION PARAMETERS
    // =========================================================================
    const defaultDpr = Math.min(window.devicePixelRatio || 1, 2.0);

    const params = {
      // Color & Palette
      colorScheme: 'Monochromatic',
      primaryColor: COLOR_SCHEMES['Monochromatic'].primary,
      secondaryColor: COLOR_SCHEMES['Monochromatic'].secondary,
      accentColor: COLOR_SCHEMES['Monochromatic'].accent,
      coreColor: COLOR_SCHEMES['Monochromatic'].core,
      backgroundColor: COLOR_SCHEMES['Monochromatic'].background,
      greenscreen: false,

      // Anamorphic Flare Optics
      streakRx: 500,               // Base rx for the requested ultra-wide flattened ellipse
      streakRy: 2.0,               // Base ry="2"
      widthScalingFactor: 0.16,    // Subtle width scaling amplitude
      streakOpacity: 0.95,
      coreRadius: 68,
      coreGlowOpacity: 0.9,
      flareAngle: 0.0,             // Flare rotation angle in degrees (default horizontal)
      ghostDiscsVisible: true,
      diffractionSpikesVisible: true,

      // Motion & Dynamics
      animationMode: 'Subtle Harmonic Pulse',
      animationSpeed: 1.0,
      pulseRate: 1.1,

      // Lighting, Exposure & Scene Display
      exposure: 1.0,
      sceneLightIntensity: 1.15,
      antialias: true,             // Default on as specified
      dpr: defaultDpr,
      dustParticlesEnabled: true,
      dustCount: 240,

      // Interactive System Controls
      clickToRandomize: true,
      panX: 0,
      panY: 0,
      zoom: 1.0,
      resetCamera: () => resetCameraTransform()
    };

    // =========================================================================
    // DOM REFERENCES
    // =========================================================================
    const viewport = document.getElementById('viewport-wrapper');
    const svgEl = document.getElementById('flare-svg');
    const bgRect = document.getElementById('bg-rect');
    const worldRig = document.getElementById('world-rig');
    const flareAssembly = document.getElementById('flare-optical-assembly');
    const primaryStreak = document.getElementById('primary-horizontal-streak');
    const streakDiffuseBloom = document.getElementById('streak-diffuse-bloom');
    const streakMidBloom = document.getElementById('streak-mid-bloom');
    const streakSecondary = document.getElementById('streak-secondary');
    const streakCyanFringe = document.getElementById('streak-cyan-fringe');
    const streakMagentaFringe = document.getElementById('streak-magenta-fringe');
    const streakFilament = document.getElementById('streak-center-filament');
    const streakFlankTop = document.getElementById('streak-flank-top');
    const streakFlankBot = document.getElementById('streak-flank-bot');

    const coreRadialBody = document.getElementById('core-radial-body');
    const coreOuterHalo = document.getElementById('core-outer-halo');
    const coreHotCenter = document.getElementById('core-hot-center');
    const corePinpoint = document.getElementById('core-pinpoint');

    const ghostFlaresLayer = document.getElementById('ghost-flares-layer');
    const diffractionSpikesGroup = document.getElementById('diffraction-spikes-group');
    const starletsContainer = document.getElementById('starlets-container');
    const webglCanvas = document.getElementById('webgl-canvas');

    const SVG_CENTER_X = 960;
    const SVG_CENTER_Y = 540;

    let globalTime = 0;
    let lastTimestamp = performance.now();

    // =========================================================================
    // THREE.JS SETUP: ATMOSPHERIC ANAMORPHIC DUST MOTES
    // =========================================================================
    let renderer, scene, camera, particleGeo, particleMat, particlePoints;
    let particlePositions, particleVelocities, particlePhases;

    function initThreeScene(antialiasEnabled) {
      if (renderer) {
        renderer.dispose();
      }

      renderer = new THREE.WebGLRenderer({
        canvas: webglCanvas,
        antialias: antialiasEnabled,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0.0);

      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(
        -SVG_CENTER_X, SVG_CENTER_X,
        SVG_CENTER_Y, -SVG_CENTER_Y,
        0.1, 1000
      );
      camera.position.z = 10;

      // Soft circular bokeh particle sprite (zero-margin border ensures no square clipping)
      const spriteCanvas = document.createElement('canvas');
      spriteCanvas.width = 64;
      spriteCanvas.height = 64;
      const sctx = spriteCanvas.getContext('2d');
      sctx.clearRect(0, 0, 64, 64);
      const grad = sctx.createRadialGradient(32, 32, 0, 32, 32, 28);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.75)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.15)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
      sctx.beginPath();
      sctx.arc(32, 32, 28, 0, Math.PI * 2);
      sctx.fillStyle = grad;
      sctx.fill();

      const spriteTexture = new THREE.CanvasTexture(spriteCanvas);
      spriteTexture.wrapS = THREE.ClampToEdgeWrapping;
      spriteTexture.wrapT = THREE.ClampToEdgeWrapping;

      const count = params.dustCount;
      particlePositions = new Float32Array(count * 3);
      particleVelocities = new Float32Array(count * 3);
      particlePhases = new Float32Array(count);

      particleGeo = new THREE.BufferGeometry();
      for (let i = 0; i < count; i++) {
        const spreadX = (Math.random() - 0.5) * 1920 * 1.3;
        const normDist = (Math.random() - 0.5);
        const spreadY = Math.sign(normDist) * Math.pow(Math.abs(normDist), 2.2) * 450;
        const spreadZ = (Math.random() - 0.5) * 40;

        particlePositions[i * 3 + 0] = spreadX;
        particlePositions[i * 3 + 1] = spreadY;
        particlePositions[i * 3 + 2] = spreadZ;

        particleVelocities[i * 3 + 0] = (Math.random() - 0.5) * 0.45;
        particleVelocities[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
        particleVelocities[i * 3 + 2] = 0;

        particlePhases[i] = Math.random() * Math.PI * 2;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

      const activeScheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Monochromatic'];
      particleMat = new THREE.PointsMaterial({
        size: 11.0,
        map: spriteTexture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        color: new THREE.Color(activeScheme.particle || params.primaryColor),
        opacity: 0.65
      });

      particlePoints = new THREE.Points(particleGeo, particleMat);
      scene.add(particlePoints);

      svgEl.setAttribute('shape-rendering', antialiasEnabled ? 'geometricPrecision' : 'crispEdges');
    }

    // =========================================================================
    // COLOR APPLICATION & GRADIENT UPDATE ENGINE
    // =========================================================================
    function hexToRgba(hex, alpha = 1.0) {
      let c = hex.replace('#', '');
      if (c.length === 3) {
        c = c.split('').map(x => x + x).join('');
      }
      const num = parseInt(c, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function updateColors() {
      // 1. Update Core Radial Gradient
      const coreStop0 = document.getElementById('core-stop-0');
      const coreStop1 = document.getElementById('core-stop-1');
      const coreStop2 = document.getElementById('core-stop-2');
      const coreStop3 = document.getElementById('core-stop-3');
      const coreStop4 = document.getElementById('core-stop-4');
      if (coreStop0) coreStop0.setAttribute('stop-color', params.coreColor);
      if (coreStop1) coreStop1.setAttribute('stop-color', params.coreColor);
      if (coreStop2) coreStop2.setAttribute('stop-color', params.primaryColor);
      if (coreStop3) coreStop3.setAttribute('stop-color', params.secondaryColor);
      if (coreStop4) coreStop4.setAttribute('stop-color', params.secondaryColor);

      // 2. Update Ambient Halo Gradient
      const haloStop0 = document.getElementById('halo-stop-0');
      const haloStop1 = document.getElementById('halo-stop-1');
      const haloStop2 = document.getElementById('halo-stop-2');
      const haloStop3 = document.getElementById('halo-stop-3');
      if (haloStop0) haloStop0.setAttribute('stop-color', params.primaryColor);
      if (haloStop1) haloStop1.setAttribute('stop-color', params.secondaryColor);
      if (haloStop2) haloStop2.setAttribute('stop-color', params.secondaryColor);
      if (haloStop3) haloStop3.setAttribute('stop-color', params.backgroundColor);

      // 3. Update Streak Razor Gradient
      const razorStop0 = document.getElementById('razor-stop-0');
      const razorStop1 = document.getElementById('razor-stop-1');
      const razorStop2 = document.getElementById('razor-stop-2');
      const razorStop3 = document.getElementById('razor-stop-3');
      const razorStop4 = document.getElementById('razor-stop-4');
      const razorStop5 = document.getElementById('razor-stop-5');
      const razorStop6 = document.getElementById('razor-stop-6');
      if (razorStop0) razorStop0.setAttribute('stop-color', params.secondaryColor);
      if (razorStop1) razorStop1.setAttribute('stop-color', params.secondaryColor);
      if (razorStop2) razorStop2.setAttribute('stop-color', params.primaryColor);
      if (razorStop3) razorStop3.setAttribute('stop-color', params.coreColor);
      if (razorStop4) razorStop4.setAttribute('stop-color', params.primaryColor);
      if (razorStop5) razorStop5.setAttribute('stop-color', params.secondaryColor);
      if (razorStop6) razorStop6.setAttribute('stop-color', params.secondaryColor);

      // 4. Update Streak Bloom Gradient
      const bloomStop0 = document.getElementById('bloom-stop-0');
      const bloomStop1 = document.getElementById('bloom-stop-1');
      const bloomStop2 = document.getElementById('bloom-stop-2');
      const bloomStop3 = document.getElementById('bloom-stop-3');
      const bloomStop4 = document.getElementById('bloom-stop-4');
      const bloomStop5 = document.getElementById('bloom-stop-5');
      const bloomStop6 = document.getElementById('bloom-stop-6');
      if (bloomStop0) bloomStop0.setAttribute('stop-color', params.secondaryColor);
      if (bloomStop1) bloomStop1.setAttribute('stop-color', params.secondaryColor);
      if (bloomStop2) bloomStop2.setAttribute('stop-color', params.primaryColor);
      if (bloomStop3) bloomStop3.setAttribute('stop-color', params.accentColor);
      if (bloomStop4) bloomStop4.setAttribute('stop-color', params.primaryColor);
      if (bloomStop5) bloomStop5.setAttribute('stop-color', params.secondaryColor);
      if (bloomStop6) bloomStop6.setAttribute('stop-color', params.secondaryColor);

      // 5. Update Ghost Discs Gradient
      const ghostStop1 = document.getElementById('ghost-stop-1');
      const ghostStop2 = document.getElementById('ghost-stop-2');
      const ghostStop3 = document.getElementById('ghost-stop-3');
      if (ghostStop1) ghostStop1.setAttribute('stop-color', params.primaryColor);
      if (ghostStop2) ghostStop2.setAttribute('stop-color', params.accentColor);
      if (ghostStop3) ghostStop3.setAttribute('stop-color', params.secondaryColor);

      // 6. Update Background & Greenscreen
      updateBackground();

      // 7. Update Three.js Particle Colors
      if (particleMat) {
        const scheme = COLOR_SCHEMES[params.colorScheme];
        particleMat.color.set(scheme ? scheme.particle : params.primaryColor);
      }

      // 8. Update Elements Opacities & Geometry
      updateGeometryAndOptics();
    }

    function updateBackground() {
      if (params.greenscreen) {
        document.body.style.backgroundColor = '#00ff00';
        bgRect.setAttribute('fill', '#00ff00');
        if (renderer) renderer.setClearColor(0x00ff00, 1.0);
      } else {
        document.body.style.backgroundColor = params.backgroundColor;
        const bgStop0 = document.getElementById('bg-stop-0');
        const bgStop1 = document.getElementById('bg-stop-1');
        const bgStop2 = document.getElementById('bg-stop-2');
        if (bgStop0) bgStop0.setAttribute('stop-color', hexToRgba(params.secondaryColor, 0.45));
        if (bgStop1) bgStop1.setAttribute('stop-color', hexToRgba(params.backgroundColor, 0.85));
        if (bgStop2) bgStop2.setAttribute('stop-color', params.backgroundColor);
        bgRect.setAttribute('fill', 'url(#bg-ambient-grad)');
        if (renderer) renderer.setClearColor(0x000000, 0.0);
      }
    }

    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Monochromatic'];
      params.colorScheme = schemeName;
      params.primaryColor = scheme.primary;
      params.secondaryColor = scheme.secondary;
      params.accentColor = scheme.accent;
      params.coreColor = scheme.core;
      params.backgroundColor = scheme.background;

      updateColors();

      // Sync GUI controllers
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    function updateGeometryAndOptics() {
      // Set core radius and opacities
      coreRadialBody.setAttribute('r', params.coreRadius.toFixed(1));
      coreOuterHalo.setAttribute('r', (params.coreRadius * 2.3).toFixed(1));
      coreRadialBody.setAttribute('opacity', params.coreGlowOpacity.toFixed(2));
      coreHotCenter.setAttribute('opacity', Math.min(1.0, params.coreGlowOpacity * 1.1).toFixed(2));

      // Layer visibilities
      ghostFlaresLayer.style.display = params.ghostDiscsVisible ? 'inline' : 'none';
      diffractionSpikesGroup.style.display = params.diffractionSpikesVisible ? 'inline' : 'none';
      if (particlePoints) particlePoints.visible = params.dustParticlesEnabled;

      // Flare and exposure filters
      updateExposureAndLighting();
    }

    function updateExposureAndLighting() {
      const combinedBrightness = (params.exposure * params.sceneLightIntensity).toFixed(3);
      const combinedContrast = (1.0 + (params.sceneLightIntensity - 1.0) * 0.4).toFixed(3);
      svgEl.style.filter = `brightness(${combinedBrightness}) contrast(${combinedContrast})`;

      if (particleMat) {
        particleMat.opacity = Math.min(1.0, 0.65 * params.sceneLightIntensity);
      }
    }

    // Populate Micro-Diffraction Starlets along streak
    function buildStarlets() {
      starletsContainer.innerHTML = '';
      const offsets = [-420, -250, -110, 110, 250, 420];
      offsets.forEach((ox) => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${SVG_CENTER_X + ox}, ${SVG_CENTER_Y})`);
        g.setAttribute('opacity', (0.35 + Math.random() * 0.35).toFixed(2));

        const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        hLine.setAttribute('x1', '-14');
        hLine.setAttribute('y1', '0');
        hLine.setAttribute('x2', '14');
        hLine.setAttribute('y2', '0');
        hLine.setAttribute('stroke', params.accentColor);
        hLine.setAttribute('stroke-width', '0.9');

        const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        vLine.setAttribute('x1', '0');
        vLine.setAttribute('y1', '-8');
        vLine.setAttribute('x2', '0');
        vLine.setAttribute('y2', '8');
        vLine.setAttribute('stroke', '#ffffff');
        vLine.setAttribute('stroke-width', '0.7');

        const centerPoint = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        centerPoint.setAttribute('cx', '0');
        centerPoint.setAttribute('cy', '0');
        centerPoint.setAttribute('r', '1.6');
        centerPoint.setAttribute('fill', '#ffffff');

        g.appendChild(hLine);
        g.appendChild(vLine);
        g.appendChild(centerPoint);
        starletsContainer.appendChild(g);
      });
    }

    // =========================================================================
    // RANDOM PROCEDURAL GENERATOR (Click-to-Randomize)
    // Upon user click on scene, generates a new visual theme, re-rolls
    // geometric and motion parameters, and updates lil-gui
    // =========================================================================
    function randomizeScene() {
      // 1. Pick a random color scheme from the 18 preconfigured presets
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // 2. Pick a random dynamic animation preset
      const dynamicPresets = ANIMATION_PRESETS.filter(p => p !== 'Static Flare Stillness');
      params.animationMode = dynamicPresets[Math.floor(Math.random() * dynamicPresets.length)];

      // 3. Re-roll geometric, optical and motion parameters
      // Keep streakRy = 2.0 and flareAngle = 0.0 to strictly preserve horizontal anamorphic alignment
      params.streakRx = Math.round(440 + Math.random() * 120);
      params.streakRy = 2.0;
      params.widthScalingFactor = +(0.12 + Math.random() * 0.12).toFixed(2);
      params.coreRadius = Math.round(55 + Math.random() * 25);
      params.coreGlowOpacity = +(0.80 + Math.random() * 0.20).toFixed(2);
      params.flareAngle = 0.0;
      params.animationSpeed = +(0.70 + Math.random() * 0.65).toFixed(2);
      params.pulseRate = +(0.85 + Math.random() * 0.60).toFixed(2);
      params.sceneLightIntensity = +(0.95 + Math.random() * 0.40).toFixed(2);
      params.exposure = +(0.92 + Math.random() * 0.30).toFixed(2);

      updateGeometryAndOptics();
      buildStarlets();

      // Sync GUI controllers
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    function resetCameraTransform() {
      params.panX = 0;
      params.panY = 0;
      params.zoom = 1.0;
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    // =========================================================================
    // USER INTERFACE: LIL-GUI (Unmodified styles, cleanly structured)

    fColor.addColor(params, 'secondaryColor').name('Secondary Bloom').onChange(updateColors);
    fColor.addColor(params, 'accentColor').name('Accent Glint').onChange(updateColors);
    fColor.addColor(params, 'coreColor').name('Core Specular').onChange(updateColors);
    fColor.addColor(params, 'backgroundColor').name('Background Color').onChange(() => {
      if (!params.greenscreen) updateBackground();

    // 2. Anamorphic Optics & Geometry Folder

    fOptics.add(params, 'streakRy', 0.5, 6.0, 0.1).name('Streak Height (ry)');
    fOptics.add(params, 'widthScalingFactor', 0.0, 0.40, 0.01).name('Width Scale Range');

    fOptics.add(params, 'ghostDiscsVisible').name('Ghost Reflections').onChange(updateGeometryAndOptics);
    fOptics.add(params, 'diffractionSpikesVisible').name('Aperture Spikes').onChange(updateGeometryAndOptics);

    // 3. Motion & Dynamics Folder (8 preconfigured animations)
    const fMotion = gui.addFolder('Motion & Dynamics');
    fMotion.add(params, 'animationMode', ANIMATION_PRESETS).name('Animation Preset');
    fMotion.add(params, 'animationSpeed', 0.0, 3.0, 0.02).name('Animation Speed');

    // 4. Lighting & Display Folder

    fLighting.add(params, 'sceneLightIntensity', 0.2, 2.5, 0.05).name('Scene Light Intensity').onChange(updateExposureAndLighting);
    fLighting.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange((val) => {
      params.dpr = val;
      renderer.setPixelRatio(val);
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    fLighting.add(params, 'antialias').name('Three.js Antialias').onChange((val) => {

      if (particlePoints) particlePoints.visible = val;

    // 5. Interactive Navigation & Camera Folder
    const fCamera = gui.addFolder('Interactive View & Camera');
    fCamera.add(params, 'clickToRandomize').name('Click Scene to Randomize');
    fCamera.add(params, 'zoom', 0.2, 6.0, 0.05).name('Zoom Factor').listen();
    fCamera.add(params, 'panX', -1200, 1200, 1).name('Pan X').listen();
    fCamera.add(params, 'panY', -800, 800, 1).name('Pan Y').listen();
    fCamera.add(params, 'resetCamera').name('Reset View');

    // Toggle UI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // =========================================================================
    // INTERACTIVE PAN, ZOOM & CLICK DETECTION
    // =========================================================================
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPanX = 0;
    let initialPanY = 0;
    let pointerDownTime = 0;
    let hasMovedSignificantly = false;

    viewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isDragging = true;
      hasMovedSignificantly = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initialPanX = params.panX;
      initialPanY = params.panY;
      pointerDownTime = performance.now();
      viewport.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.hypot(dx, dy) > 5) {
        hasMovedSignificantly = true;
      }
      params.panX = initialPanX + dx;
      params.panY = initialPanY + dy;
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      viewport.classList.remove('grabbing');

      const clickDuration = performance.now() - pointerDownTime;
      // Trigger random procedural variation if this was a clean click on scene
      if (!hasMovedSignificantly && clickDuration < 320) {
        if (params.clickToRandomize && !e.target.closest('.lil-gui')) {
          randomizeScene();
        }
      }
    });

    // Zoom with mouse wheel
    viewport.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      params.zoom = Math.min(Math.max(params.zoom * zoomFactor, 0.15), 8.0);
    }, { passive: false });

    // Window Resize Handler
    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (renderer) {
        renderer.setSize(w, h);
      }
    }
    window.addEventListener('resize', onResize);

    // =========================================================================
    // MAIN ANIMATION & RENDERING LOOP
    // =========================================================================
    function animate(now) {
      requestAnimationFrame(animate);

      const delta = Math.min((now - lastTimestamp) / 1000, 0.1);
      lastTimestamp = now;

      const isStatic = (params.animationMode === 'Static Flare Stillness');
      if (!isStatic) {
        globalTime += delta * params.animationSpeed;
      }

      const t = globalTime;
      const pulseSpeed = params.pulseRate;

      // 1. Calculate subtle width scaling & dynamic motion formulation based on preset
      let widthScale = 1.0;
      let coreScale = 1.0;
      let camOffsetX = 0;
      let camOffsetY = 0;
      let camRot = 0;
      let ghostShift = 0;

      if (!isStatic) {
        switch (params.animationMode) {
          case 'Subtle Harmonic Pulse': {
            // Elegant rhythmic expansion and contraction of width
            const pulse = Math.sin(t * 1.6 * pulseSpeed);
            const harmonic = Math.sin(t * 3.2 * pulseSpeed) * 0.25;
            widthScale = 1.0 + (pulse + harmonic) * params.widthScalingFactor;
            coreScale = 1.0 + Math.sin(t * 1.8 * pulseSpeed) * 0.08;
            break;
          }

          case 'Anamorphic Drift & Shear': {
            // Slow horizontal glide with delicate anamorphic lateral stretch
            widthScale = 1.0 + Math.sin(t * 1.1 * pulseSpeed) * params.widthScalingFactor * 1.25;
            camOffsetX = 24 * Math.sin(t * 0.45 * pulseSpeed);
            camOffsetY = 12 * Math.cos(t * 0.35 * pulseSpeed);
            ghostShift = 18 * Math.sin(t * 0.5 * pulseSpeed);
            break;
          }

          case 'Cinematic Breathing Flare': {
            // Deep, majestic Hollywood anamorphic lens breathing
            const breath = Math.pow(Math.sin(t * 0.9 * pulseSpeed) * 0.5 + 0.5, 1.8);
            widthScale = 1.0 + (breath * 2.0 - 1.0) * params.widthScalingFactor * 1.4;
            coreScale = 1.0 + breath * 0.14;
            camOffsetX = 10 * Math.sin(t * 0.4 * pulseSpeed);
            break;
          }

          case 'Prismatic Spectral Flutter': {
            // Chromatic dispersion shimmer and micro-undulations
            widthScale = 1.0 + Math.sin(t * 2.2 * pulseSpeed) * params.widthScalingFactor * 0.85;
            const flutter = Math.sin(t * 4.5 * pulseSpeed) * 0.04;
            widthScale += flutter;
            coreScale = 1.0 + Math.cos(t * 2.0 * pulseSpeed) * 0.06;
            ghostShift = 12 * Math.cos(t * 1.4 * pulseSpeed);
            break;
          }

          case 'Orbital Flare Precession': {
            // Slow majestic micro-tilt rotation and orbital float
            widthScale = 1.0 + Math.sin(t * 1.4 * pulseSpeed) * params.widthScalingFactor;
            camRot = 0.8 * Math.sin(t * 0.55 * pulseSpeed);
            camOffsetX = 18 * Math.cos(t * 0.4 * pulseSpeed);
            camOffsetY = 14 * Math.sin(t * 0.4 * pulseSpeed);
            break;
          }

          case 'Starlight Surge & Resonate': {
            // Smooth cyclical surge with harmonic width dilation
            const surge = Math.sin(t * 1.3 * pulseSpeed);
            widthScale = 1.0 + Math.sign(surge) * Math.pow(Math.abs(surge), 1.4) * params.widthScalingFactor * 1.35;
            coreScale = 1.0 + surge * 0.12;
            break;
          }

          case 'Solar Flare Wind Ripple': {
            // Flare filament ripple with progressive horizontal drift
            const wave1 = Math.sin(t * 1.8 * pulseSpeed);
            const wave2 = Math.cos(t * 2.7 * pulseSpeed) * 0.3;
            widthScale = 1.0 + (wave1 + wave2) * params.widthScalingFactor;
            camOffsetX = 14 * Math.sin(t * 0.6 * pulseSpeed);
            camOffsetY = 8 * Math.sin(t * 0.9 * pulseSpeed);
            break;
          }

          case 'Static Flare Stillness':
          default: {
            widthScale = 1.0;
            coreScale = 1.0;
            camOffsetX = 0;
            camOffsetY = 0;
            camRot = 0;
            ghostShift = 0;
            break;
          }
        }
      }

      // 2. Apply Subtle Width Scaling to Anamorphic Flare Elements
      const currentRx = params.streakRx * widthScale;
      const baseRy = params.streakRy;

      // Update primary requested ellipse: rx="500" ry="2" scaled dynamically in width
      primaryStreak.setAttribute('rx', currentRx.toFixed(1));
      primaryStreak.setAttribute('ry', baseRy.toFixed(2));

      // Synchronize secondary and diffuse bloom streaks (smooth optical thickness)
      streakSecondary.setAttribute('rx', (currentRx * 1.25).toFixed(1));
      streakSecondary.setAttribute('ry', (baseRy * 1.4).toFixed(2));

      streakMidBloom.setAttribute('rx', (currentRx * 1.45).toFixed(1));
      streakMidBloom.setAttribute('ry', (baseRy * 2.0).toFixed(2));

      streakDiffuseBloom.setAttribute('rx', (currentRx * 1.85).toFixed(1));
      streakDiffuseBloom.setAttribute('ry', (baseRy * 3.5).toFixed(2));

      // Synchronize chromatic dispersion fringes
      streakCyanFringe.setAttribute('rx', (currentRx * 1.3).toFixed(1));
      streakCyanFringe.setAttribute('ry', (baseRy * 0.9).toFixed(2));
      streakMagentaFringe.setAttribute('rx', (currentRx * 1.3).toFixed(1));
      streakMagentaFringe.setAttribute('ry', (baseRy * 0.9).toFixed(2));

      // Synchronize core radial gradient body
      const curCoreR = params.coreRadius * coreScale;
      coreRadialBody.setAttribute('r', curCoreR.toFixed(1));
      coreOuterHalo.setAttribute('r', (curCoreR * 2.3).toFixed(1));

      // Dynamic tilt rotation on the ENTIRE optical assembly (Streak + Core locked together)
      const totalAngle = params.flareAngle;
      flareAssembly.setAttribute('transform', `rotate(${totalAngle.toFixed(2)}, ${SVG_CENTER_X}, ${SVG_CENTER_Y})`);

      // Dynamic ghost flare discs shift along optical axis
      if (params.ghostDiscsVisible) {
        document.getElementById('ghost-ring-1').setAttribute('cx', (720 - ghostShift * 1.2).toFixed(1));
        document.getElementById('ghost-ring-2').setAttribute('cx', (1240 + ghostShift * 1.2).toFixed(1));
        document.getElementById('ghost-disc-1').setAttribute('cx', (610 - ghostShift * 1.8).toFixed(1));
        document.getElementById('ghost-disc-2').setAttribute('cx', (1380 + ghostShift * 1.8).toFixed(1));
        document.getElementById('ghost-disc-3').setAttribute('cx', (440 - ghostShift * 2.4).toFixed(1));
        document.getElementById('ghost-disc-4').setAttribute('cx', (1560 + ghostShift * 2.4).toFixed(1));
      }

      // 3. Apply Camera & World Rig Transformation (Pan & Zoom)
      const finalPanX = params.panX + camOffsetX;
      const finalPanY = params.panY + camOffsetY;
      const finalZoom = params.zoom;
      const finalRot = camRot;

      worldRig.setAttribute(
        'transform',
        `translate(${SVG_CENTER_X + finalPanX}, ${SVG_CENTER_Y + finalPanY}) scale(${finalZoom}) rotate(${finalRot.toFixed(2)}) translate(${-SVG_CENTER_X}, ${-SVG_CENTER_Y})`
      );

      // 4. Update Three.js Atmospheric Motes & Render
      if (particleGeo && particlePoints) {
        if (params.dustParticlesEnabled) {
          const positions = particleGeo.attributes.position.array;
          const speed = isStatic ? 0 : params.animationSpeed;
          const count = params.dustCount;

          for (let i = 0; i < count; i++) {
            const idx = i * 3;
            positions[idx + 0] += particleVelocities[idx + 0] * 35 * delta * speed;
            positions[idx + 1] += Math.sin(t * 1.4 + particlePhases[i]) * 10 * delta * speed;

            // Wrap motes smoothly
            if (positions[idx + 0] > 1100) positions[idx + 0] = -1100;
            if (positions[idx + 0] < -1100) positions[idx + 0] = 1100;
            if (positions[idx + 1] > 600) positions[idx + 1] = -600;
            if (positions[idx + 1] < -600) positions[idx + 1] = 600;
          }
          particleGeo.attributes.position.needsUpdate = true;
        }

        // Synchronize Three.js Camera with SVG Pan and Zoom
        camera.position.x = -finalPanX;
        camera.position.y = finalPanY;
        camera.zoom = finalZoom;
        camera.rotation.z = (finalRot * Math.PI) / 180;
        camera.updateProjectionMatrix();

        renderer.render(scene, camera);
      }
    }

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    initThreeScene(params.antialias);
    applyColorScheme('Monochromatic');
    buildStarlets();
    updateColors();
    updateExposureAndLighting();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
