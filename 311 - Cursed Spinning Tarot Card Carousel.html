        // --- 8 PRECONFIGURED ANIMATION MODES ---
        const ANIMATION_MODES = [
            'Cursed Carousel',
            'Static (Still Carousel)',
            'Mystic Pendulum',
            'Ascending Séance',
            'Eclipse Convergence',
            'Floating Vortex',
            'Ritual Chamber Orbit',
            'Witching Hour'
        ];

        // --- APP STATE & PARAMETERS ---
        const params = {
            colorScheme: 'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
            animationMode: 'Cursed Carousel',
            speed: 1.0,
            greenscreen: false,
            clickToRandomize: true,
            dpr: Math.min(window.devicePixelRatio || 1, 2),
            cardCurvature: 0.26,
            carouselRadius: 3.5,
            exposure: 1.35,
            flameBrightness: 3.6,
            ambientLight: 1.6,
            keyLight: 2.6,
            fillLight: 1.6,
            rimLight: 2.2,
            bloomGlow: 0.65,
            chromaticAberration: 0.0055,
            tiltShiftBlur: 0.24
        };

        // --- SCENE, RENDERER, CAMERA SETUP ---
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3.2, 7.8);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(params.dpr);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = params.exposure;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // --- ORBIT CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.1;
        controls.enablePan = true;
        controls.panSpeed = 1.0;
        controls.screenSpacePanning = true;
        controls.target.set(0, 1.8, 0);
        controls.minDistance = 2.0;
        controls.maxDistance = 22.0;
        controls.maxPolarAngle = Math.PI / 2 + 0.15;
        controls.update();

        // =========================================================================================
        // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone usage)
        // =========================================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class PostShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) {
              renderer.setRenderTarget(this.fbo);
            }
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) {
              renderer.setRenderTarget(null);
            }
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class PostShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class PostBloomPass {
          constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new PostShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new PostShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              // Horizontal blur pass
              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              // Vertical blur pass
              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,
              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.04,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.02,
              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new PostBloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new PostShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new PostShaderPass(this.rgbShader);

            this.copyShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.copyPass = new PostShaderPass(this.copyShader);
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
            lens.add(this.settings, "chromaticAberration", 0, 0.08, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.08, 0.002).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            return root;
          }
        }

        // Initialize PostProcessor Suite
        const postProcessor = new PostProcessor(renderer, {
            enabled: true,
            bloomEnabled: true,
            bloomStrength: 1.1,
            bloomRadius: 0.55,
            bloomThreshold: 0.25,
            fisheyeStrength: 0.0,
            fisheyeRadius: 1.0,
            chromaticAberration: 0.008,
            vignetteBoost: 1.0,
            vignetteReduction: 0.25,
            noiseIntensity: 0.012,
            gamma: 1.0,
            minInputLevel: 0.0,
            maxInputLevel: 1.0
        });
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

        // --- PROCEDURAL TEXTURE GENERATOR ---
        const CARD_W = 1024;
        const CARD_H = 1600;
        const MAP_W = 512;
        const MAP_H = 800;

        // Color canvases
        const canvasMoon = document.createElement('canvas');
        canvasMoon.width = CARD_W; canvasMoon.height = CARD_H;

        const canvasDeath = document.createElement('canvas');
        canvasDeath.width = CARD_W; canvasDeath.height = CARD_H;

        const canvasTower = document.createElement('canvas');
        canvasTower.width = CARD_W; canvasTower.height = CARD_H;

        const canvasBack = document.createElement('canvas');
        canvasBack.width = CARD_W; canvasBack.height = CARD_H;

        // Floor Canvas
        const canvasFloor = document.createElement('canvas');
        canvasFloor.width = 1024; canvasFloor.height = 1024;

        // Normal & Roughness canvases
        const normMoon = document.createElement('canvas'); normMoon.width = MAP_W; normMoon.height = MAP_H;
        const roughMoon = document.createElement('canvas'); roughMoon.width = MAP_W; roughMoon.height = MAP_H;

        const normDeath = document.createElement('canvas'); normDeath.width = MAP_W; normDeath.height = MAP_H;
        const roughDeath = document.createElement('canvas'); roughDeath.width = MAP_W; roughDeath.height = MAP_H;

        const normTower = document.createElement('canvas'); normTower.width = MAP_W; normTower.height = MAP_H;
        const roughTower = document.createElement('canvas'); roughTower.width = MAP_W; roughTower.height = MAP_H;

        const normBack = document.createElement('canvas'); normBack.width = MAP_W; normBack.height = MAP_H;
        const roughBack = document.createElement('canvas'); roughBack.width = MAP_W; roughBack.height = MAP_H;

        // Three.js Textures
        function makeCanvasTex(cvs, isColor = true) {
            const tex = new THREE.CanvasTexture(cvs);
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.generateMipmaps = true;
            if (isColor) tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const texMoon = makeCanvasTex(canvasMoon, true);
        const texDeath = makeCanvasTex(canvasDeath, true);
        const texTower = makeCanvasTex(canvasTower, true);
        const texBack = makeCanvasTex(canvasBack, true);

        const texNormMoon = makeCanvasTex(normMoon, false);
        const texRoughMoon = makeCanvasTex(roughMoon, false);

        const texNormDeath = makeCanvasTex(normDeath, false);
        const texRoughDeath = makeCanvasTex(roughDeath, false);

        const texNormTower = makeCanvasTex(normTower, false);
        const texRoughTower = makeCanvasTex(roughTower, false);

        const texNormBack = makeCanvasTex(normBack, false);
        const texRoughBack = makeCanvasTex(roughBack, false);

        const texFloor = makeCanvasTex(canvasFloor, true);

        // Texture Normal & Roughness Generator using Sobel filter on luminance
        function updateNormalAndRoughness(srcCanvas, targetNorm, targetRough) {
            const ctxT = targetNorm.getContext('2d');
            ctxT.drawImage(srcCanvas, 0, 0, MAP_W, MAP_H);
            const imgData = ctxT.getImageData(0, 0, MAP_W, MAP_H);
            const d = imgData.data;

            const nCtx = targetNorm.getContext('2d');
            const nImg = nCtx.createImageData(MAP_W, MAP_H);
            const nd = nImg.data;

            const rCtx = targetRough.getContext('2d');
            const rImg = rCtx.createImageData(MAP_W, MAP_H);
            const rd = rImg.data;

            const lum = new Float32Array(MAP_W * MAP_H);
            for (let i = 0; i < MAP_W * MAP_H; i++) {
                const idx = i * 4;
                lum[i] = (d[idx] * 0.299 + d[idx + 1] * 0.587 + d[idx + 2] * 0.114) / 255.0;
            }

            const bump = 3.6;
            for (let y = 0; y < MAP_H; y++) {
                const y0 = y > 0 ? y - 1 : 0;
                const y1 = y < MAP_H - 1 ? y + 1 : MAP_H - 1;
                const yw = y * MAP_W;
                const y0w = y0 * MAP_W;
                const y1w = y1 * MAP_W;

                for (let x = 0; x < MAP_W; x++) {
                    const x0 = x > 0 ? x - 1 : 0;
                    const x1 = x < MAP_W - 1 ? x + 1 : MAP_W - 1;
                    const idx = yw + x;
                    const pIdx = idx * 4;

                    const l = lum[yw + x0];
                    const r = lum[yw + x1];
                    const u = lum[y0w + x];
                    const dn = lum[y1w + x];

                    let dx = (l - r) * bump;
                    let dy = (u - dn) * bump;
                    let dz = 1.0;
                    const invLen = 1.0 / Math.sqrt(dx * dx + dy * dy + dz * dz);
                    dx *= invLen; dy *= invLen; dz *= invLen;

                    nd[pIdx]     = Math.floor((dx * 0.5 + 0.5) * 255);
                    nd[pIdx + 1] = Math.floor((dy * 0.5 + 0.5) * 255);
                    nd[pIdx + 2] = Math.floor((dz * 0.5 + 0.5) * 255);
                    nd[pIdx + 3] = 255;

                    // High luminance = metallic gold foil (very low roughness)
                    // Low luminance = dark cardstock (high velvet matte roughness)
                    const val = lum[idx];
                    const roughness = val > 0.45 ? 0.18 + (1.0 - val) * 0.22 : 0.84;
                    const rByte = Math.floor(roughness * 255);
                    rd[pIdx]     = rByte;
                    rd[pIdx + 1] = rByte;
                    rd[pIdx + 2] = rByte;
                    rd[pIdx + 3] = 255;
                }
            }
            nCtx.putImageData(nImg, 0, 0);
            rCtx.putImageData(rImg, 0, 0);
        }

        // --- GOTHIC ARTWORK DRAWING ROUTINES ---
        function drawCardFrame(ctx, w, h, p, numeral, title) {
            // Base background
            ctx.fillStyle = p.bg;
            ctx.fillRect(0, 0, w, h);

            // Subtle aged paper vignette
            const radGrad = ctx.createRadialGradient(w / 2, h / 2, 100, w / 2, h / 2, h * 0.7);
            radGrad.addColorStop(0, 'rgba(255,255,255,0.04)');
            radGrad.addColorStop(1, 'rgba(0,0,0,0.45)');
            ctx.fillStyle = radGrad;
            ctx.fillRect(0, 0, w, h);

            // Outer border
            ctx.strokeStyle = p.gold;
            ctx.lineWidth = 14;
            ctx.strokeRect(36, 36, w - 72, h - 72);

            // Inner ornate border
            ctx.strokeStyle = p.primary;
            ctx.lineWidth = 4;
            ctx.strokeRect(54, 54, w - 108, h - 108);

            // Thin gold hairline
            ctx.strokeStyle = p.gold;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(66, 66, w - 132, h - 132);

            // Corner rosettes
            const corners = [
                [76, 76], [w - 76, 76],
                [76, h - 76], [w - 76, h - 76]
            ];
            corners.forEach(([cx, cy]) => {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.strokeStyle = p.gold;
                ctx.fillStyle = p.accent;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = p.primary;
                ctx.lineWidth = 2;
                for (let i = 0; i < 4; i++) {
                    ctx.rotate(Math.PI / 4);
                    ctx.strokeRect(-4, -4, 8, 8);
                }
                ctx.restore();
            });

            // Gothic Top Banner (Roman Numeral)
            ctx.save();
            ctx.fillStyle = p.secondary;
            ctx.strokeStyle = p.gold;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.rect(w / 2 - 130, 78, 260, 68);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = p.gold;
            ctx.font = 'bold 44px "Cinzel", "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(numeral, w / 2, 114);
            ctx.restore();

            // Gothic Bottom Banner (Card Title)
            ctx.save();
            ctx.fillStyle = p.secondary;
            ctx.strokeStyle = p.gold;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.rect(w / 2 - 270, h - 160, 540, 78);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = p.primary;
            ctx.font = 'bold 46px "Cinzel", "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(title, w / 2, h - 120);

            // Golden filigree accents on title banner
            ctx.fillStyle = p.gold;
            ctx.beginPath();
            ctx.arc(w / 2 - 250, h - 120, 8, 0, Math.PI * 2);
            ctx.arc(w / 2 + 250, h - 120, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Draw Card 1: THE MOON (XVIII)
        function renderMoonCard(canvas, p) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            drawCardFrame(ctx, w, h, p, "XVIII", "THE MOON");

            // Sky stars
            ctx.save();
            ctx.fillStyle = p.gold;
            const starCoords = [
                [200, 220], [320, 180], [700, 210], [820, 240],
                [180, 360], [840, 370], [260, 480], [780, 500],
                [380, 270], [640, 260], [490, 200]
            ];
            starCoords.forEach(([sx, sy]) => {
                ctx.beginPath();
                ctx.arc(sx, sy, 3.5, 0, Math.PI * 2);
                ctx.fill();
                // 4-point sparkle
                ctx.strokeStyle = p.primary;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(sx - 10, sy); ctx.lineTo(sx + 10, sy);
                ctx.moveTo(sx, sy - 10); ctx.lineTo(sx, sy + 10);
                ctx.stroke();
            });
            ctx.restore();

            // The Towering Moon & Halo
            const mx = w / 2;
            const my = 420;
            const mRadius = 150;

            ctx.save();
            // Radiating Solar/Lunar Rays (16 rays)
            ctx.strokeStyle = p.gold;
            ctx.lineWidth = 4;
            for (let i = 0; i < 24; i++) {
                const ang = (i / 24) * Math.PI * 2;
                const r0 = mRadius + 20;
                const r1 = mRadius + (i % 2 === 0 ? 90 : 55);
                ctx.beginPath();
                if (i % 2 === 0) {
                    ctx.moveTo(mx + Math.cos(ang) * r0, my + Math.sin(ang) * r0);
                    ctx.lineTo(mx + Math.cos(ang) * r1, my + Math.sin(ang) * r1);
                } else {
                    // Wavy flame ray
                    const cpAng = ang + 0.08;
                    const rMid = (r0 + r1) * 0.5;
                    ctx.moveTo(mx + Math.cos(ang) * r0, my + Math.sin(ang) * r0);
                    ctx.quadraticCurveTo(
                        mx + Math.cos(cpAng) * rMid, my + Math.sin(cpAng) * rMid,
                        mx + Math.cos(ang) * r1, my + Math.sin(ang) * r1
                    );
                }
                ctx.stroke();
            }

            // Moon Disc & Glowing Face
            ctx.fillStyle = p.secondary;
            ctx.strokeStyle = p.primary;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(mx, my, mRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Crescent profile silhouette
            ctx.fillStyle = p.gold;
            ctx.beginPath();
            ctx.arc(mx, my, mRadius, -Math.PI / 2, Math.PI / 2, false);
            ctx.bezierCurveTo(mx - 40, my + 80, mx - 40, my - 80, mx, my - mRadius);
            ctx.fill();

            // Profile Face (Mystical eye and profile on crescent)
            ctx.strokeStyle = p.bg;
            ctx.lineWidth = 4;
            ctx.beginPath();
            // Sleeping serene eye
            ctx.arc(mx + 45, my - 25, 18, 0.2, Math.PI - 0.2);
            ctx.stroke();
            // Nose and lips curve
            ctx.beginPath();
            ctx.moveTo(mx + 90, my - 50);
            ctx.lineTo(mx + 110, my - 10);
            ctx.lineTo(mx + 85, my + 10);
            ctx.lineTo(mx + 100, my + 30);
            ctx.lineTo(mx + 80, my + 60);
            ctx.stroke();
            ctx.restore();

            // 15 Golden Yod Drops (Falling divine dew)
            ctx.save();
            ctx.fillStyle = p.gold;
            const yods = [
                [310, 620], [360, 690], [420, 600], [512, 650], [600, 590], [660, 670], [710, 610],
                [330, 780], [460, 750], [560, 760], [690, 790], [400, 850], [620, 840],
                [480, 890], [540, 890]
            ];
            yods.forEach(([yx, yy]) => {
                ctx.beginPath();
                ctx.moveTo(yx, yy - 14);
                ctx.bezierCurveTo(yx + 10, yy - 5, yx + 10, yy + 12, yx, yy + 14);
                ctx.bezierCurveTo(yx - 10, yy + 12, yx - 10, yy - 5, yx, yy - 14);
                ctx.fill();
            });
            ctx.restore();

            // Gothic Twin Towers on the crags
            function drawTower(tx, ty, isLeft) {
                ctx.save();
                ctx.fillStyle = p.secondary;
                ctx.strokeStyle = p.gold;
                ctx.lineWidth = 5;
                // Main tower shaft
                ctx.fillRect(tx - 65, ty, 130, 320);
                ctx.strokeRect(tx - 65, ty, 130, 320);

                // Crenellated Battlements
                ctx.fillRect(tx - 78, ty - 45, 156, 45);
                ctx.strokeRect(tx - 78, ty - 45, 156, 45);
                ctx.clearRect(tx - 35, ty - 45, 25, 22);
                ctx.clearRect(tx + 10, ty - 45, 25, 22);
                ctx.strokeRect(tx - 78, ty - 45, 156, 45);

                // Arched Windows
                ctx.fillStyle = p.accent;
                ctx.strokeStyle = p.primary;
                ctx.lineWidth = 3;
                [ty + 40, ty + 150].forEach(wy => {
                    ctx.beginPath();
                    ctx.arc(tx, wy, 20, Math.PI, 0);
                    ctx.lineTo(tx + 20, wy + 55);
                    ctx.lineTo(tx - 20, wy + 55);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                });
                ctx.restore();
            }
            drawTower(190, 720, true);
            drawTower(w - 190, 720, false);

            // Two Howling Beasts (Wolf and Jackal)
            function drawHowlingBeast(bx, by, facingRight) {
                ctx.save();
                ctx.translate(bx, by);
                if (!facingRight) ctx.scale(-1, 1);
                ctx.fillStyle = p.primary;
                ctx.strokeStyle = p.gold;
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Head howling upward
                ctx.moveTo(0, 0);
                ctx.lineTo(40, -55);
                ctx.lineTo(60, -50); // open muzzle
                ctx.lineTo(48, -40);
                ctx.lineTo(70, -25); // neck
                ctx.lineTo(75, 45);  // back
                ctx.lineTo(100, 110);// hind leg
                ctx.lineTo(50, 110);
                ctx.lineTo(35, 65);  // belly
                ctx.lineTo(10, 110); // front leg
                ctx.lineTo(-10, 110);
                ctx.lineTo(15, 30);  // chest
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
            drawHowlingBeast(310, 950, true);
            drawHowlingBeast(w - 310, 950, false);

            // Mystical Pool & Shore
            ctx.save();
            ctx.fillStyle = p.secondary;
            ctx.strokeStyle = p.gold;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.ellipse(w / 2, h - 290, 360, 130, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Water ripple waves
            ctx.strokeStyle = p.primary;
            ctx.lineWidth = 2.5;
            for (let r = 60; r <= 280; r += 55) {
                ctx.beginPath();
                ctx.ellipse(w / 2, h - 290, r, r * 0.35, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // The Mythical Crustacean / Crayfish crawling upward
            const cx = w / 2;
            const cy = h - 300;
            ctx.fillStyle = p.accent;
            ctx.strokeStyle = p.gold;
            ctx.lineWidth = 4;

            // Carapace body
            ctx.beginPath();
            ctx.ellipse(cx, cy, 32, 55, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Tail segments
            for (let seg = 1; seg <= 4; seg++) {
                ctx.beginPath();
                ctx.ellipse(cx, cy + 45 + seg * 16, 26 - seg * 4, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // Claws reaching upward
            [-1, 1].forEach(side => {
                ctx.beginPath();
                ctx.moveTo(cx + side * 20, cy - 25);
                ctx.quadraticCurveTo(cx + side * 70, cy - 65, cx + side * 50, cy - 105);
                ctx.stroke();
                // Pincher claw
                ctx.beginPath();

        // Draw Card 3: THE TOWER (XVI)

        // Draw Alchemical Summoning Circle on Ritual Floor
        function renderFloorCircle(canvas, p) {

            const cx = w / 2;
            const cy = h / 2;

            ctx.fillStyle = p.bg;
            ctx.fillRect(0, 0, w, h);

            ctx.save();
            ctx.strokeStyle = p.gold;
            ctx.lineWidth = 4;
            [160, 280, 380, 460].forEach(r => {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);

            });

            // 7-Pointed Heptagram Star
            ctx.strokeStyle = p.accent;

            for (let i = 0; i < 7; i++) {

        // --- BENT / CURVED BOX CARD GEOMETRY ---
        function createCurvedCardGeometry(w = 2.2, h = 3.5, d = 0.024, curve = 0.26, segsX = 32) {
            const geo = new THREE.BoxGeometry(w, h, d, segsX, 1, 1);
            const pos = geo.attributes.position;
            const halfW = w / 2;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                const nx = x / halfW;
                // Graceful arch bend along the X-axis
                const bendZ = (1.0 - Math.cos(nx * Math.PI * 0.5)) * curve;
                pos.setZ(i, z - bendZ);
            }
            geo.computeVertexNormals();
            return geo;
        }

        // --- CANDLESTICK & SPECTRAL FLAME ---
        const candleGroup = new THREE.Group();

        // Candlestick Pedestal (Lathe Geometry)
        const lathePoints = [
            new THREE.Vector2(0.85, 0),
            new THREE.Vector2(0.80, 0.1),
            new THREE.Vector2(0.48, 0.25),
            new THREE.Vector2(0.35, 0.4),
            new THREE.Vector2(0.45, 0.55),
            new THREE.Vector2(0.24, 0.8),
            new THREE.Vector2(0.32, 1.1),
            new THREE.Vector2(0.22, 1.3),
            new THREE.Vector2(0.42, 1.5),
            new THREE.Vector2(0.45, 1.65),
            new THREE.Vector2(0.38, 1.7),
            new THREE.Vector2(0.18, 1.7),
            new THREE.Vector2(0.18, 1.55)
        ];
        const standGeo = new THREE.LatheGeometry(lathePoints, 36);
        const standMat = new THREE.MeshStandardMaterial({
            color: 0x423d38,
            metalness: 0.75,
            roughness: 0.36
        });
        const standMesh = new THREE.Mesh(standGeo, standMat);
        standMesh.castShadow = true;
        standMesh.receiveShadow = true;
        candleGroup.add(standMesh);

        // Candle Cylinder
        const candleGeo = new THREE.CylinderGeometry(0.16, 0.18, 1.2, 32);
        const candleMat = new THREE.MeshStandardMaterial({
            color: 0xf5f1e4,
            roughness: 0.52,
            metalness: 0.05
        });
        const candleMesh = new THREE.Mesh(candleGeo, candleMat);
        candleMesh.position.y = 2.25;
        candleMesh.castShadow = true;
        candleGroup.add(candleMesh);

        // Melted Wax Drips
        for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2 + 0.35;
            const dripGeo = new THREE.ConeGeometry(0.04, 0.2 + (i % 3) * 0.08, 12);
            dripGeo.rotateX(Math.PI);
            const drip = new THREE.Mesh(dripGeo, candleMat);
            drip.position.set(Math.cos(a) * 0.165, 2.76 - (i % 3) * 0.035, Math.sin(a) * 0.165);
            candleGroup.add(drip);
        }

        // Candle Wick
        const wickGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.14, 8);
        const wickMat = new THREE.MeshBasicMaterial({ color: 0x151515 });
        const wick = new THREE.Mesh(wickGeo, wickMat);
        wick.position.y = 2.92;
        candleGroup.add(wick);

        // Procedural Spectral Flame Shader
        const FlameShader = {
            uniforms: {
                uTime: { value: 0 },
                uColorCore: { value: new THREE.Color(0xffffff) },
                uColorOuter: { value: new THREE.Color(0xf6aa1c) }
            },
            vertexShader: `
                uniform float uTime;
                varying vec2 vUv;
                varying vec3 vPos;
                void main() {
                    vec3 p = position;
                    float h = p.y / 0.5;
                    float sway = sin(uTime * 7.0 + p.y * 8.0) * 0.03 * h;
                    float flutter = sin(uTime * 17.0 + p.y * 14.0) * 0.02 * h;
                    p.x += sway + flutter;
                    p.z += cos(uTime * 9.0 + p.y * 10.0) * 0.025 * h;
                    p.x *= (1.0 - smoothstep(0.3, 0.5, p.y) * 0.4);
                    p.z *= (1.0 - smoothstep(0.3, 0.5, p.y) * 0.4);
                    vUv = uv;
                    vPos = p;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColorCore;
                uniform vec3 uColorOuter;
                varying vec2 vUv;
                varying vec3 vPos;
                void main() {
                    float y = vPos.y / 0.5;
                    float d = length(vPos.xz) * 7.0;
                    float core = clamp(1.0 - d, 0.0, 1.0);
                    vec3 col = mix(uColorOuter, uColorCore, pow(core, 1.8));
                    col = mix(col, vec3(1.0), pow(core, 3.5) * (1.0 - y * 0.6));
                    float alpha = smoothstep(0.0, 0.08, y) * smoothstep(1.0, 0.65, y) * (0.85 + core * 0.25);
                    gl_FragColor = vec4(col * 2.0, alpha);
                }
            `
        };

        const flameGeo = new THREE.ConeGeometry(0.14, 0.5, 32, 32);
        flameGeo.translate(0, 0.25, 0);
        const flameMat = new THREE.ShaderMaterial({
            uniforms: FlameShader.uniforms,
            vertexShader: FlameShader.vertexShader,
            fragmentShader: FlameShader.fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const flameMesh = new THREE.Mesh(flameGeo, flameMat);
        flameMesh.position.y = 2.98;
        candleGroup.add(flameMesh);

        // Core White Hot Point
        const coreGeo = new THREE.ConeGeometry(0.05, 0.22, 16);
        coreGeo.translate(0, 0.11, 0);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.position.y = 2.99;
        candleGroup.add(coreMesh);

        // Spectral Point Light (Primary Flame Light)
        const candleLight = new THREE.PointLight(0xf6aa1c, params.flameBrightness * 3.5, 30, 1.15);
        candleLight.position.set(0, 3.2, 0);
        candleLight.castShadow = true;
        candleLight.shadow.bias = -0.002;
        candleLight.shadow.mapSize.width = 1024;
        candleLight.shadow.mapSize.height = 1024;
        candleGroup.add(candleLight);

        // Candle Fill Light (Lower warm candlestick & card base glow)
        const candleFillLight = new THREE.PointLight(0xf6aa1c, params.flameBrightness * 2.2, 18, 1.0);
        candleFillLight.position.set(0, 2.1, 0);
        candleGroup.add(candleFillLight);

        scene.add(candleGroup);

        // Hemisphere Sky/Ground Ambient Light
        const hemiLight = new THREE.HemisphereLight(0xffeedd, 0x221a28, params.ambientLight);
        scene.add(hemiLight);

        // Soft Base Ambient
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // Front Key Directional Light (Illuminates tarot illustrations clearly)
        const keyLight = new THREE.DirectionalLight(0xfff5e6, params.keyLight);
        keyLight.position.set(4.5, 7.5, 7.5);
        keyLight.castShadow = true;
        keyLight.shadow.bias = -0.001;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);

        // Soft Counter Fill Light
        const fillLight = new THREE.DirectionalLight(0xdbe9ff, params.fillLight);
        fillLight.position.set(-6, 5, 5);
        scene.add(fillLight);

        // Gilded Rim Light
        const rimLight = new THREE.DirectionalLight(0xffd58a, params.rimLight);
        rimLight.position.set(0, 8, -6);
        scene.add(rimLight);

        // --- RISING SPIRIT EMBERS / PARTICLES ---
        const EMBER_COUNT = 140;
        const emberGeo = new THREE.BufferGeometry();
        const emberPos = new Float32Array(EMBER_COUNT * 3);
        const emberVel = new Float32Array(EMBER_COUNT * 3);
        const emberLife = new Float32Array(EMBER_COUNT);

        for (let i = 0; i < EMBER_COUNT; i++) {
            emberPos[i * 3] = (Math.random() - 0.5) * 0.3;
            emberPos[i * 3 + 1] = 3.0 + Math.random() * 3.5;
            emberPos[i * 3 + 2] = (Math.random() - 0.5) * 0.3;

            emberVel[i * 3] = (Math.random() - 0.5) * 0.008;
            emberVel[i * 3 + 1] = 0.008 + Math.random() * 0.016;
            emberVel[i * 3 + 2] = (Math.random() - 0.5) * 0.008;

            emberLife[i] = Math.random();
        }
        emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
        const emberMat = new THREE.PointsMaterial({
            color: 0xf6aa1c,
            size: 0.07,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const emberPoints = new THREE.Points(emberGeo, emberMat);
        scene.add(emberPoints);

        // --- RITUAL FLOOR ---
        const floorGeo = new THREE.CircleGeometry(7.5, 64);
        floorGeo.rotateX(-Math.PI / 2);
        const floorMat = new THREE.MeshStandardMaterial({
            map: texFloor,
            roughness: 0.55,
            metalness: 0.2
        });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.position.y = 0.0;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // --- THREE TOWERING TAROT CARDS ---
        const edgeMaterial = new THREE.MeshStandardMaterial({
            color: 0xf6aa1c,
            metalness: 0.92,
            roughness: 0.22
        });

        const matMoonFront = new THREE.MeshStandardMaterial({
            map: texMoon,
            normalMap: texNormMoon,
            roughnessMap: texRoughMoon,
            metalness: 0.18,
            roughness: 0.42
        });

        const matDeathFront = new THREE.MeshStandardMaterial({
            map: texDeath,
            normalMap: texNormDeath,
            roughnessMap: texRoughDeath,
            metalness: 0.18,
            roughness: 0.42
        });

        const matTowerFront = new THREE.MeshStandardMaterial({
            map: texTower,
            normalMap: texNormTower,
            roughnessMap: texRoughTower,
            metalness: 0.18,
            roughness: 0.42
        });

        const matCardBack = new THREE.MeshStandardMaterial({
            map: texBack,
            normalMap: texNormBack,
            roughnessMap: texRoughBack,
            metalness: 0.18,
            roughness: 0.42
        });

        const cardMaterials = [
            [edgeMaterial, edgeMaterial, edgeMaterial, edgeMaterial, matMoonFront, matCardBack],
            [edgeMaterial, edgeMaterial, edgeMaterial, edgeMaterial, matDeathFront, matCardBack],
            [edgeMaterial, edgeMaterial, edgeMaterial, edgeMaterial, matTowerFront, matCardBack]
        ];

        const cardMeshes = [];
        const cardInitialAngles = [0, (Math.PI * 2) / 3, (Math.PI * 4) / 3];

        for (let i = 0; i < 3; i++) {
            const geo = createCurvedCardGeometry(2.2, 3.5, 0.024, params.cardCurvature, 32);
            const mesh = new THREE.Mesh(geo, cardMaterials[i]);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            cardMeshes.push(mesh);
        }

        // --- APPLY COLOR SCHEME & REBUILD TEXTURES ---
        function applyColorScheme(schemeName) {
            const p = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Monochromatic'];

            // Render 4 canvases
            renderMoonCard(canvasMoon, p);
            renderDeathCard(canvasDeath, p);
            renderTowerCard(canvasTower, p);
            renderCardBack(canvasBack, p);
            renderFloorCircle(canvasFloor, p);

            // Update normal and roughness maps
            updateNormalAndRoughness(canvasMoon, normMoon, roughMoon);
            updateNormalAndRoughness(canvasDeath, normDeath, roughDeath);
            updateNormalAndRoughness(canvasTower, normTower, roughTower);
            updateNormalAndRoughness(canvasBack, normBack, roughBack);

            // Flag textures for GPU upload
            texMoon.needsUpdate = true;
            texDeath.needsUpdate = true;
            texTower.needsUpdate = true;
            texBack.needsUpdate = true;
            texFloor.needsUpdate = true;

            texNormMoon.needsUpdate = true;
            texRoughMoon.needsUpdate = true;
            texNormDeath.needsUpdate = true;
            texRoughDeath.needsUpdate = true;
            texNormTower.needsUpdate = true;
            texRoughTower.needsUpdate = true;
            texNormBack.needsUpdate = true;
            texRoughBack.needsUpdate = true;

            // Update edge materials
            edgeMaterial.color.set(p.gold);

            // Candle flame & light colors
            FlameShader.uniforms.uColorOuter.value.set(p.flame);
            candleLight.color.set(p.flame);
            candleFillLight.color.set(p.flame);
            keyLight.color.set(p.primary);
            fillLight.color.set(p.secondary);
            rimLight.color.set(p.gold);
            hemiLight.color.set(p.primary);
            hemiLight.groundColor.set(p.bg);
            ambientLight.color.set(p.ambient);
            emberMat.color.set(p.flame);

            updateBackground();
        }

        function updateBackground() {
            const p = COLOR_SCHEMES[params.colorScheme];
            if (params.greenscreen) {
                scene.background = new THREE.Color(0x00ff00);
                scene.fog = null;
                floorMesh.visible = false;
                if (postProcessor) {
                    postProcessor.settings.vignetteReduction = 0.0;
                    postProcessor.settings.noiseIntensity = 0.0;
                    postProcessor.updateSettings();
                }
            } else {
                scene.background = new THREE.Color(p.fog);
                scene.fog = new THREE.FogExp2(p.fog, 0.038);
                floorMesh.visible = true;
                if (postProcessor) {
                    postProcessor.settings.vignetteReduction = 0.25;
                    postProcessor.settings.noiseIntensity = 0.012;
                    postProcessor.updateSettings();
                }
            }
        }

        function updateCardGeometries() {
            cardMeshes.forEach(mesh => {
                mesh.geometry.dispose();
                mesh.geometry = createCurvedCardGeometry(2.2, 3.5, 0.024, params.cardCurvature, 32);
            });
        }

        // Initialize textures
        applyColorScheme(params.colorScheme);

        // --- LIL-GUI CONTROL PANEL ---
        const gui = new GUI({ title: 'Cursed Tarot Carousel' });

        gui.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(val => {
            applyColorScheme(val);
        });

        gui.add(params, 'animationMode', ANIMATION_MODES).name('Animation Mode');
        gui.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
        gui.add(params, 'greenscreen').name('Green Screen (#00ff00)').onChange(updateBackground);
        gui.add(params, 'clickToRandomize').name('Click to Randomize');

        gui.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
            renderer.setPixelRatio(val);
            if (postProcessor) {
                postProcessor.setSize(window.innerWidth, window.innerHeight, val);
            }
        });

        const lightFolder = gui.addFolder('Lighting & Atmosphere');
        lightFolder.add(params, 'exposure', 0.5, 3.0, 0.05).name('Exposure').onChange(val => {
            renderer.toneMappingExposure = val;
        });
        lightFolder.add(params, 'flameBrightness', 0.5, 8.0, 0.1).name('Candle Flame Light').onChange(val => {
            candleLight.intensity = val * 3.5;
            candleFillLight.intensity = val * 2.2;
        });
        lightFolder.add(params, 'ambientLight', 0.0, 4.0, 0.1).name('Ambient Light').onChange(val => {
            hemiLight.intensity = val;
            ambientLight.intensity = val * 0.3;
        });
        lightFolder.add(params, 'keyLight', 0.0, 6.0, 0.1).name('Front Key Light').onChange(val => {
            keyLight.intensity = val;
        });
        lightFolder.add(params, 'fillLight', 0.0, 4.0, 0.1).name('Side Fill Light').onChange(val => {
            fillLight.intensity = val;
        });
        lightFolder.add(params, 'rimLight', 0.0, 5.0, 0.1).name('Top/Rim Light').onChange(val => {
            rimLight.intensity = val;
        });

        if (postProcessor) {
            postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');
        }

        const carouselFolder = gui.addFolder('Carousel Geometry');
        carouselFolder.add(params, 'cardCurvature', 0.05, 0.5, 0.01).name('Card Curvature').onChange(updateCardGeometries);
        carouselFolder.add(params, 'carouselRadius', 2.2, 5.2, 0.1).name('Carousel Radius');
        carouselFolder.close();

        // Procedural Randomizer Function
        function randomizeScene() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

            // Choose among the dynamic animations
            const activeModes = ANIMATION_MODES.filter(m => m !== 'Static (Still Carousel)');
            params.animationMode = activeModes[Math.floor(Math.random() * activeModes.length)];

            params.speed = THREE.MathUtils.randFloat(0.65, 1.55);
            params.cardCurvature = THREE.MathUtils.randFloat(0.12, 0.44);
            params.carouselRadius = THREE.MathUtils.randFloat(2.8, 4.4);
            params.exposure = THREE.MathUtils.randFloat(1.2, 1.6);
            params.flameBrightness = THREE.MathUtils.randFloat(2.8, 4.8);
            params.ambientLight = THREE.MathUtils.randFloat(1.3, 2.2);
            params.keyLight = THREE.MathUtils.randFloat(2.0, 3.6);
            params.fillLight = THREE.MathUtils.randFloat(1.2, 2.2);
            params.rimLight = THREE.MathUtils.randFloat(1.6, 2.8);

            // Apply updates
            applyColorScheme(params.colorScheme);
            updateCardGeometries();
            renderer.toneMappingExposure = params.exposure;
            candleLight.intensity = params.flameBrightness * 3.5;
            candleFillLight.intensity = params.flameBrightness * 2.2;
            hemiLight.intensity = params.ambientLight;
            ambientLight.intensity = params.ambientLight * 0.3;
            keyLight.intensity = params.keyLight;
            fillLight.intensity = params.fillLight;
            rimLight.intensity = params.rimLight;

            if (postProcessor) {
                postProcessor.settings.bloomStrength = THREE.MathUtils.randFloat(0.8, 2.0);
                postProcessor.settings.chromaticAberration = THREE.MathUtils.randFloat(0.005, 0.02);
                postProcessor.settings.vignetteReduction = THREE.MathUtils.randFloat(0.15, 0.38);
                postProcessor.settings.noiseIntensity = THREE.MathUtils.randFloat(0.008, 0.02);
                postProcessor.updateSettings();
            }

            // Sync control panel UI
            gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
        }

        gui.add({ randomize: randomizeScene }, 'randomize').name('⚡ Randomize Scene');

        // --- INTERACTIVE CLICK TO RANDOMIZE (DISTINGUISHING DRAG VS CLICK) ---
        let pointerDownX = 0;
        let pointerDownY = 0;
        let pointerDownTime = 0;

        window.addEventListener('pointerdown', (e) => {
            pointerDownX = e.clientX;
            pointerDownY = e.clientY;
            pointerDownTime = performance.now();
        });

        window.addEventListener('pointerup', (e) => {
            const dx = e.clientX - pointerDownX;
            const dy = e.clientY - pointerDownY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const duration = performance.now() - pointerDownTime;

            // If released within 6px and < 350ms, and not inside GUI, it's a click!
            if (dist < 6 && duration < 350 && !e.target.closest('.lil-gui')) {
                if (params.clickToRandomize) {
                    randomizeScene();
                }
            }
        });

        // --- KEYBOARD LISTENER (TOGGLE UI WITH "H") ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                if (gui._hidden) {
                    gui.show();
                } else {
                    gui.hide();
                }
            }
        });

        // --- WINDOW RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            if (postProcessor) {
                postProcessor.setSize(w, h, params.dpr);
            }
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        let simTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            simTime += dt * params.speed;
            const t = simTime;

            // Spectral Flame flickering & light pulsation
            FlameShader.uniforms.uTime.value = t;
            const flicker = Math.sin(t * 14.0) * 0.15 + Math.sin(t * 27.0) * 0.08 + Math.cos(t * 43.0) * 0.05;
            candleLight.intensity = params.flameBrightness * (3.5 + flicker * 0.9);
            candleFillLight.intensity = params.flameBrightness * (2.2 + flicker * 0.5);
            candleLight.position.x = Math.sin(t * 6.0) * 0.025;
            candleLight.position.z = Math.cos(t * 7.5) * 0.025;

            // Rising Spirit Embers animation
            const posAttr = emberGeo.attributes.position;
            const pArr = posAttr.array;
            for (let i = 0; i < EMBER_COUNT; i++) {
                pArr[i * 3 + 1] += emberVel[i * 3 + 1] * params.speed;
                pArr[i * 3] += Math.sin(t * 2.0 + i) * 0.003 * params.speed;
                pArr[i * 3 + 2] += Math.cos(t * 2.0 + i) * 0.003 * params.speed;

                if (pArr[i * 3 + 1] > 6.0) {
                    pArr[i * 3 + 1] = 3.0 + Math.random() * 0.2;
                    pArr[i * 3] = (Math.random() - 0.5) * 0.25;
                    pArr[i * 3 + 2] = (Math.random() - 0.5) * 0.25;
                }
            }
            posAttr.needsUpdate = true;

            // 8 Preconfigured Animation Behaviors
            const mode = params.animationMode;
            const radius = params.carouselRadius;

            cardMeshes.forEach((card, i) => {
                const baseAngle = cardInitialAngles[i];

                if (mode === 'Static (Still Carousel)') {
                    // Stationary carousel with cards poised in solemn contemplation
                    const x = Math.cos(baseAngle) * radius;
                    const z = Math.sin(baseAngle) * radius;
                    card.position.set(x, 1.8, z);
                    card.rotation.set(0, -baseAngle + Math.PI / 2 + 0.3, 0);
                } else if (mode === 'Mystic Pendulum') {
                    // Cards sway back and forth in orbit arc like ritual pendulums
                    const sway = Math.sin(t * 0.8) * 0.55;
                    const angle = baseAngle + sway;
                    card.position.x = Math.cos(angle) * radius;
                    card.position.z = Math.sin(angle) * radius;
                    card.position.y = 1.8 + Math.sin(t * 1.6 + i * 2.09) * 0.15;
                    card.rotation.y = -angle + Math.PI / 2 + Math.sin(t * 0.8) * 0.4;
                    card.rotation.z = Math.cos(t * 0.8) * 0.18;
                    card.rotation.x = Math.sin(t * 0.8) * 0.08;
                } else if (mode === 'Ascending Séance') {
                    // Cards spiral vertically in a majestic floating levitation wave
                    const angle = t * 0.26 + baseAngle;
                    card.position.x = Math.cos(angle) * radius;
                    card.position.z = Math.sin(angle) * radius;
                    card.position.y = 1.8 + Math.sin(t * 0.9 + i * 2.09) * 0.65;
                    card.rotation.y = -angle + Math.PI / 2 + t * 0.35;
                    card.rotation.x = 0.08 * Math.sin(t * 1.2 + i);
                    card.rotation.z = 0.05 * Math.cos(t * 1.2 + i);
                } else if (mode === 'Eclipse Convergence') {
                    // Orbit radius contracts and expands like a cursed pulsating heartbeat
                    const breatheR = radius * (0.65 + 0.35 * Math.sin(t * 0.65));
                    const angle = t * 0.3 + baseAngle;
                    card.position.x = Math.cos(angle) * breatheR;
                    card.position.z = Math.sin(angle) * breatheR;
                    card.position.y = 1.8 + Math.sin(t * 1.1 + i) * 0.15;
                    // Lean outward when expanded, lean inward when near candle
                    const lean = (breatheR - radius * 0.65) / (radius * 0.35) * 0.25 - 0.12;
                    card.rotation.y = -angle + Math.PI / 2 + t * 0.4;
                    card.rotation.x = lean;
                    card.rotation.z = 0;
                } else if (mode === 'Floating Vortex') {
                    // Rapid card axis spin with steady deliberate orbit and inward tilt
                    const angle = t * 0.16 + baseAngle;
                    card.position.x = Math.cos(angle) * radius;
                    card.position.z = Math.sin(angle) * radius;
                    card.position.y = 1.8 + Math.sin(t * 1.4 + i) * 0.12;
                    card.rotation.y = t * 1.35 + i * 2.1;
                    card.rotation.x = 0.18;
                    card.rotation.z = Math.sin(t * 0.8) * 0.06;
                } else if (mode === 'Ritual Chamber Orbit') {
                    // Cards revolve smoothly while camera executes a panoramic 360 orbit
                    const angle = t * 0.28 + baseAngle;
                    card.position.x = Math.cos(angle) * radius;
                    card.position.z = Math.sin(angle) * radius;
                    card.position.y = 1.8 + Math.sin(t * 1.2 + i * 2.09) * 0.18;
                    card.rotation.y = -angle + Math.PI / 2 + t * 0.45;
                    card.rotation.z = Math.sin(t * 1.5 + i) * 0.06;
                    card.rotation.x = Math.cos(t * 1.1 + i) * 0.05;

                    // Cinematic camera orbit if user isn't actively dragging
                    if (!controls.state || controls.state === -1) {
                        const camDist = 8.2;
                        camera.position.x = Math.cos(t * 0.14) * camDist;
                        camera.position.z = Math.sin(t * 0.14) * camDist;
                        camera.position.y = 3.0 + Math.sin(t * 0.1) * 1.2;
                    }
                } else if (mode === 'Witching Hour') {
                    // Out-of-phase harmonic undulation with banking into turns
                    const angle = t * 0.34 + baseAngle;
                    card.position.x = Math.cos(angle) * radius;
                    card.position.z = Math.sin(angle) * radius;
                    card.position.y = 1.8 + Math.sin(t * 1.8 + i * 2.09) * 0.38;
                    card.rotation.y = -angle + Math.PI / 2 + Math.sin(t * 0.75 + i) * 0.6;
                    card.rotation.z = Math.sin(t * 1.4 + i) * 0.14;
                    card.rotation.x = Math.cos(t * 1.2 + i) * 0.1;
                } else {
                    // Default: 'Cursed Carousel'
                    const angle = t * 0.32 + baseAngle;
                    card.position.x = Math.cos(angle) * radius;
                    card.position.z = Math.sin(angle) * radius;
                    card.position.y = 1.8 + Math.sin(t * 1.2 + i * 2.09) * 0.18;
                    // Orbit around candle while slowly spinning on their own axes
                    card.rotation.y = -angle + Math.PI / 2 + t * 0.45;
                    card.rotation.z = Math.sin(t * 1.5 + i) * 0.06;
                    card.rotation.x = Math.cos(t * 1.1 + i) * 0.05;
                }
            });

            controls.update();
            if (postProcessor) {
                postProcessor.renderScene(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }

        animate();
    </script>
</body>
</html>
