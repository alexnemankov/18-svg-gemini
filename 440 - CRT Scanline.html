<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CRT Scanline Raster & Horizontal Roll</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background-color: #070b10;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // Inlined for direct standalone file:// compatibility and cross-origin security
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);
      float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.0001);
      vec3 result = color * contribution;
      fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}

    vec4 sanitize(vec4 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
      return clamp(v, vec4(0.0), vec4(65000.0));
    }

    void main() {
      color = sanitize(blur13(inputTexture, vUv, direction));
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
        vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
        vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
        vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
        vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);

        vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec3 r = sanitize(texture(raysTexture, vUv).rgb);
        color += r * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
        color += a;
      }

      float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
      color *= vig;
      color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
      fragColor = vec4(sanitize(color), 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      color = max(vec3(0.0), color);
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      vec3 denom = max(color * (c * color + d) + e, vec3(0.0001));
      return clamp((color * (a * color + b)) / denom, 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        return vec3(pow(heat, 0.85));
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
      if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
      if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
      finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));
      
      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
        if (crtIntensity > 0.0001) {
          float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
          finalCol -= scanline;
        }
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function getSupportedMsaaSamples(renderer, internalFormat = 0x881A) {
      try {
        const gl = (renderer && typeof renderer.getContext === 'function') ? renderer.getContext() : null;
        if (!gl || typeof gl.getInternalformatParameter !== 'function') return 0;
        const samples = gl.getInternalformatParameter(gl.RENDERBUFFER, internalFormat, gl.SAMPLES);
        if (!samples || samples.length === 0) return 0;
        return samples[0] || 0;
      } catch (e) {
        return 0;
      }
    }

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : false,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.shader.side = THREE.DoubleSide;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      get texture() {
        return this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        renderer.setRenderTarget(toScreen ? null : this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.shader.side = THREE.DoubleSide;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,

          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.1,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.22,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xf6aa1c),
          raysColorHex: params.raysColorHex || '#f6aa1c',

          // Explicitly default anamorphic flare to OFF
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.5,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x7a8aff),
          anamorphicColorHex: params.anamorphicColorHex || '#7a8aff',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.008,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.25,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const supportedMsaa = getSupportedMsaaSamples(this.renderer, 0x881A);
        const safeMax = supportedMsaa > 0 ? Math.min(maxSamples, supportedMsaa) : 0;
        const targetSamples = this.settings.antialias ? safeMax : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples, depthBuffer: true });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.6, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor.clone() },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        const dummyTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1);
        dummyTex.needsUpdate = true;
        this.dummyTex = dummyTex;

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            inputTexture: { value: dummyTex },
            blur0Texture: { value: dummyTex },
            blur1Texture: { value: dummyTex },
            blur2Texture: { value: dummyTex },
            blur3Texture: { value: dummyTex },
            blur4Texture: { value: dummyTex },
            raysTexture: { value: dummyTex },
            anamorphicTexture: { value: dummyTex },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            time: { value: 0 },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] || 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            nightVisionGain: { value: this.settings.nightVisionGain },
            crtIntensity: { value: this.settings.crtIntensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: dummyTex } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);

        this._camDir = new THREE.Vector3();
        this._moonDir = new THREE.Vector3();
        this._ndc = new THREE.Vector3();
      }

      setAntialias(enabled) {
        this.settings.antialias = enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const supportedMsaa = getSupportedMsaaSamples(this.renderer, 0x881A);
        const safeMax = supportedMsaa > 0 ? Math.min(maxSamples, supportedMsaa) : 0;
        const targetSamples = enabled ? safeMax : 0;
        const oldTarget = this.sceneTarget;
        this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
          type: THREE.HalfFloatType,
          samples: targetSamples,
          depthBuffer: true,
        });
        oldTarget.dispose();
      }

      updateSettings() {
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;
        this.bloomPass.enabled = this.settings.bloomEnabled;

        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = Math.max(0.001, this.settings.anamorphicSmoothWidth);
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] || 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(width, height, dpr = 1) {
        const w = Math.max(1, Math.round(width * dpr));
        const h = Math.max(1, Math.round(height * dpr));

        this.sceneTarget.setSize(w, h);
        this.bloomPass.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);

        const rayW = Math.max(1, Math.round(w / 4));
        const rayH = Math.max(1, Math.round(h / 4));
        this.godRaysMaskPass.setSize(rayW, rayH);
        this.godRaysPingPong.setSize(rayW, rayH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setMoonScreenPosition(camera, moonWorldPos) {
        if (!moonWorldPos) return;
        camera.getWorldDirection(this._camDir);
        this._moonDir.subVectors(moonWorldPos, camera.position).normalize();
        const dot = this._camDir.dot(this._moonDir);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);
        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(null);
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) return;

        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        if (this.settings.bloomEnabled && this.settings.bloomStrength > 0.001) {
          this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
          this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
          this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
          this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
          this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;
        } else {
          this.finalPass.shader.uniforms.blur0Texture.value = this.dummyTex;
          this.finalPass.shader.uniforms.blur1Texture.value = this.dummyTex;
          this.finalPass.shader.uniforms.blur2Texture.value = this.dummyTex;
          this.finalPass.shader.uniforms.blur3Texture.value = this.dummyTex;
          this.finalPass.shader.uniforms.blur4Texture.value = this.dummyTex;
        }

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysTexture.value = this.dummyTex;
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicTexture.value = this.dummyTex;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.shader.uniforms.inputTexture.value = this.finalPass.texture;
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Amplification").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
        vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());

        const rays = root.addFolder("Three.js Godrays");
        rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Density (Spread)").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysMaxDensity", 0.1, 1.0, 0.05).name("Max Density").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDistanceAttenuation", 0.5, 4.0, 0.1).name("Distance Atten").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysThreshold", 0.0, 0.8, 0.01).name("Light Threshold").onChange(() => this.updateSettings());
        rays.addColor(this.settings, "raysColorHex").name("Ray Tint").onChange((v) => {
          this.settings.raysColor.set(v);
          this.updateSettings();
        });

        // Three.js Anamorphic Flare (Explicitly default is OFF)
        const anamorphic = root.addFolder("Three.js Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());

    const crtVertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vUv = uv;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * mvPosition;
      }

    const crtFragmentShader = `
      precision highp float;

      uniform float uTime;
      uniform vec3 uPhosphorColor;
      uniform vec3 uPhosphorSecColor;
      uniform vec3 uBeamColor;
      uniform vec3 uGlowColor;
      uniform vec3 uBgColor;

      uniform float uRefreshBarSpeed;
      uniform float uRefreshBarIntensity;
      uniform float uRefreshBarWidth;
      uniform float uDecayPersistence;
      uniform float uHorizontalRollSpeed;
      uniform float uHorizontalRollAmount;
      uniform float uScanlineCount;
      uniform float uScanlineIntensity;
      uniform float uCurvature;
      uniform float uAberration;
      uniform float uFlicker;
      uniform float uApertureGrille;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      vec2 curveCoords(vec2 uv, float k) {
        vec2 p = uv * 2.0 - 1.0;
        vec2 offset = p.yx / vec2(4.5, 4.5);
        p = p + p * offset * offset * k;
        return p * 0.5 + 0.5;
      }

      float getProceduralContent(vec2 uv, float t) {
        float val = 0.0;

        // ZONE 1: TOP STATUS HEADER
        if (uv.y > 0.82 && uv.y < 0.94) {
          float line = smoothstep(0.004, 0.0, abs(uv.y - 0.83));
          val += line * 0.65;
          float segment = floor(uv.x * 22.0);
          float fracX = fract(uv.x * 22.0);
          float fracY = (uv.y - 0.84) / 0.08;
          if (fracX < 0.75 && fracY > 0.15 && fracY < 0.85) {
            float hash = sin(segment * 13.5 + 4.2);
            if (hash > -0.3) {
              val += 0.85;
            }
          }
        }

        // ZONE 2: OSCILLOSCOPE DUAL WAVEFORM (Strictly LEFT HALF)
        if (uv.x > 0.05 && uv.x < 0.52 && uv.y > 0.36 && uv.y < 0.80) {
          float fadeEdge = smoothstep(0.05, 0.10, uv.x) * smoothstep(0.52, 0.47, uv.x);
          float w1 = 0.58 + sin(uv.x * 32.0 + t * 4.5) * 0.09 * sin(uv.x * 12.0) +
                            sin(uv.x * 70.0 - t * 6.0) * 0.025;
          float d1 = abs(uv.y - w1);
          float waveGlow1 = exp(-d1 * 130.0) * 1.8;

          float w2 = 0.58 + cos(uv.x * 20.0 - t * 3.2) * 0.06;
          float d2 = abs(uv.y - w2);
          float waveGlow2 = exp(-d2 * 160.0) * 1.3;

          val += (waveGlow1 + waveGlow2) * fadeEdge;

          float gridX = smoothstep(0.008, 0.0, abs(fract(uv.x * 16.0) - 0.5));
          float gridY = smoothstep(0.008, 0.0, abs(fract((uv.y - 0.58) * 14.0) - 0.5));
          val += (gridX + gridY) * 0.07 * fadeEdge;
        }

        // ZONE 3: ROTATING VECTOR RADAR RETICLE (Strictly RIGHT HALF)
        vec2 radarCenter = vec2(0.74, 0.58);
        vec2 rDelta = uv - radarCenter;
        float rDist = length(rDelta);
        if (rDist < 0.19) {
          float r1 = smoothstep(0.005, 0.0, abs(rDist - 0.06));
          float r2 = smoothstep(0.005, 0.0, abs(rDist - 0.12));
          float r3 = smoothstep(0.005, 0.0, abs(rDist - 0.18));
          val += (r1 + r2 + r3) * 0.85;

          float crossX = smoothstep(0.0035, 0.0, abs(rDelta.y)) * step(rDist, 0.18);
          float crossY = smoothstep(0.0035, 0.0, abs(rDelta.x)) * step(rDist, 0.18);
          val += (crossX + crossY) * 0.65;

          float angle = atan(rDelta.y, rDelta.x);
          float sweepAngle = fract((angle - t * 2.5) / 6.2831853);
          val += pow(sweepAngle, 5.0) * 1.6;

          vec2 blip1 = radarCenter + vec2(cos(t * 0.35) * 0.09, sin(t * 0.35) * 0.09);
          vec2 blip2 = radarCenter + vec2(cos(2.4) * 0.14, sin(2.4) * 0.14);
          val += exp(-length(uv - blip1) * 80.0) * 1.8;
          val += exp(-length(uv - blip2) * 80.0) * 1.5;
        }

        // ZONE 4: AUDIO SPECTRUM ANALYZER BARS (Strictly BOTTOM LEFT)
        if (uv.x > 0.08 && uv.x < 0.48 && uv.y > 0.10 && uv.y < 0.32) {
          float barIndex = floor((uv.x - 0.08) / 0.028);
          float barFrac = fract((uv.x - 0.08) / 0.028);
          float barMax = 0.12 + 0.18 * (sin(barIndex * 1.4 + t * 4.2) * 0.5 + 0.5) *
                                       (cos(barIndex * 0.9 - t * 2.5) * 0.4 + 0.6);
          if (uv.y < barMax && barFrac < 0.72) {
            val += 0.8;
          }
        }

        // ZONE 5: HEX DATA MATRIX STREAM (Strictly BOTTOM RIGHT)
        if (uv.x > 0.55 && uv.x < 0.92 && uv.y > 0.10 && uv.y < 0.32) {
          float col = floor((uv.x - 0.55) / 0.035);
          float row = floor((uv.y - 0.10) / 0.035);
          float fX = fract((uv.x - 0.55) / 0.035);
          float fY = fract((uv.y - 0.10) / 0.035);
          float pattern = sin(col * 9.2 + row * 17.5 + floor(t * 3.0) * 0.4);
          if (fX < 0.65 && fY < 0.65 && pattern > -0.15) {
            val += 0.7;
          }
        }

        return val;
      }

      void main() {
        vec2 cuv = curveCoords(vUv, uCurvature);

        float borderMask = smoothstep(0.005, 0.03, cuv.x) * smoothstep(0.995, 0.97, cuv.x) *
                           smoothstep(0.005, 0.03, cuv.y) * smoothstep(0.995, 0.97, cuv.y);
        if (borderMask <= 0.0001) {
          discard;
        }

        float rollPhase = fract(uTime * uHorizontalRollSpeed);
        vec2 rolledUv = cuv;
        rolledUv.y = fract(rolledUv.y + rollPhase);

        float rollBarDist = abs(cuv.y - fract(uTime * uRefreshBarSpeed));
        float rollJitter = sin(rolledUv.y * 70.0 + uTime * 35.0) * exp(-rollBarDist * 16.0) * uHorizontalRollAmount;
        rolledUv.x += rollJitter;

        vec2 caDir = (cuv - 0.5) * uAberration;
        float rContent = getProceduralContent(rolledUv + caDir, uTime);
        float gContent = getProceduralContent(rolledUv, uTime);
        float bContent = getProceduralContent(rolledUv - caDir, uTime);

        vec3 signalColor = vec3(
          rContent * (uPhosphorColor.r * 0.9 + uPhosphorSecColor.r * 0.25),
          gContent * (uPhosphorColor.g * 0.95 + uPhosphorSecColor.g * 0.15),
          bContent * (uPhosphorColor.b * 0.9 + uPhosphorSecColor.b * 0.35)
        );

        float sweepY = 1.0 - fract(uTime * uRefreshBarSpeed);
        float distBehind = sweepY - cuv.y;
        if (distBehind < 0.0) distBehind += 1.0;

        float barDist = abs(cuv.y - sweepY);
        float barHead = exp(-barDist * barDist / (uRefreshBarWidth * uRefreshBarWidth * 0.22)) * uRefreshBarIntensity;
        float decayTrail = exp(-distBehind * uDecayPersistence * 4.2) * (uRefreshBarIntensity * 0.45);
        float refreshSweep = barHead + decayTrail;

        float scanlinePhase = rolledUv.y * uScanlineCount * 6.2831853;
        float scanline = sin(scanlinePhase) * 0.5 + 0.5;
        scanline = mix(1.0, pow(scanline, 1.35), uScanlineIntensity);

        float triad = mod(cuv.x * uScanlineCount * 1.333, 3.0);
        vec3 triadMask = vec3(
          smoothstep(0.0, 0.4, triad) * smoothstep(1.3, 0.9, triad),
          smoothstep(1.0, 1.4, triad) * smoothstep(2.3, 1.9, triad),
          smoothstep(2.0, 2.4, triad) * smoothstep(3.3, 2.9, triad)
        );
        triadMask = mix(vec3(1.0), triadMask * 1.4, uApertureGrille);

        float flickerVal = 1.0 - sin(uTime * 120.0 * 3.14159) * uFlicker;

        vec3 basePhosphor = uBgColor * 0.25 + uGlowColor * 0.12;
        vec3 beamGlow = uBeamColor * barHead * 1.25;
        vec3 totalScreen = basePhosphor + signalColor * (1.0 + refreshSweep * 0.9) + beamGlow;

        totalScreen *= scanline;
        totalScreen *= triadMask;
        totalScreen *= flickerVal;

        float vig = cuv.x * (1.0 - cuv.x) * cuv.y * (1.0 - cuv.y) * 16.0;
        vig = clamp(pow(vig, 0.26), 0.0, 1.0);
        totalScreen *= vig;

        vec3 N = normalize(vNormal);
        vec3 V = normalize(vViewPosition);
        vec3 L = normalize(vec3(2.5, 3.5, 4.0));
        vec3 H = normalize(L + V);
        float spec = pow(max(dot(N, H), 0.0), 38.0) * 0.35;
        float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0) * 0.22;

        totalScreen += vec3(spec + fresnel);
        totalScreen *= borderMask;

        gl_FragColor = vec4(totalScreen, borderMask);
      }
    `;

    // --- CRT MESH WITH MICRO-RIBBED HORIZONTAL GEO LINES ---
    let screenMesh = null;
    let screenMaterial = null;

    function buildCurvedCRTGeometry(width, height, segX, segY, curvature, ribDepth) {
      const geo = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      const ribCount = params.scanlineCount * 0.5;

      for (let j = 0; j <= segY; j++) {
        const v = j / segY;
        const y = (v - 0.5) * height;

        for (let i = 0; i <= segX; i++) {
          const u = i / segX;
          const x = (u - 0.5) * width;

          const nx = (u - 0.5) * 2.0;
          const ny = (v - 0.5) * 2.0;

          const r2 = nx * nx * 0.35 + ny * ny * 0.28 + (nx * nx * ny * ny) * 0.15;
          let z = (1.0 - r2) * curvature;

          const ribWave = Math.sin(v * Math.PI * ribCount);
          z += ribWave * ribDepth;

          positions.push(x, y, z);
          uvs.push(u, v);
        }
      }

      for (let j = 0; j < segY; j++) {
        for (let i = 0; i < segX; i++) {
          const a = j * (segX + 1) + i;
          const b = j * (segX + 1) + (i + 1);
          const c = (j + 1) * (segX + 1) + i;
          const d = (j + 1) * (segX + 1) + (i + 1);

          indices.push(a, b, c);
          indices.push(b, d, c);
        }
      }

      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      return geo;
    }

    function createScreenMesh() {
      if (screenMesh) {
        scene.remove(screenMesh);
        screenMesh.geometry.dispose();
      }

      const geo = buildCurvedCRTGeometry(4.10, 3.08, 120, 240, params.glassCurvature, params.microRibDepth);

      if (!screenMaterial) {
        screenMaterial = new THREE.ShaderMaterial({
          vertexShader: crtVertexShader,
          fragmentShader: crtFragmentShader,
          uniforms: {
            uTime: { value: 0 },
            uPhosphorColor: { value: new THREE.Color(params.phosphorColor) },
            uPhosphorSecColor: { value: new THREE.Color(params.phosphorSecColor) },
            uBeamColor: { value: new THREE.Color(params.beamColor) },
            uGlowColor: { value: new THREE.Color(params.glowColor) },
            uBgColor: { value: new THREE.Color(params.bgColor) },

            uRefreshBarSpeed: { value: params.refreshBarSpeed },
            uRefreshBarIntensity: { value: params.refreshBarIntensity },
            uRefreshBarWidth: { value: params.refreshBarWidth },
            uDecayPersistence: { value: params.decayPersistence },
            uHorizontalRollSpeed: { value: params.horizontalRollSpeed },
            uHorizontalRollAmount: { value: params.horizontalRollAmount },
            uScanlineCount: { value: params.scanlineCount },
            uScanlineIntensity: { value: params.scanlineIntensity },
            uCurvature: { value: params.glassCurvature },
            uAberration: { value: params.aberration },
            uFlicker: { value: params.flicker },
            uApertureGrille: { value: params.apertureGrille }
          },
          transparent: true,
          side: THREE.FrontSide
        });
      }

      screenMesh = new THREE.Mesh(geo, screenMaterial);
      screenMesh.position.set(0, 0.22, -0.02);
      scene.add(screenMesh);
    }

    createScreenMesh();

    // --- CRT MONITOR HOUSING ---
    const monitorGroup = new THREE.Group();
    scene.add(monitorGroup);

    let chassisMat, bezelMat, metalDialMat, powerBtnMat, ledMat, panelMat;

    function createRoundedRectShape(w, h, r) {
      const shape = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      shape.moveTo(x + r, y);
      shape.lineTo(x + w - r, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + r);
      shape.lineTo(x + w, y + h - r);
      shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      shape.lineTo(x + r, y + h);
      shape.quadraticCurveTo(x, y + h, x, y + h - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      return shape;
    }

    function buildMonitorHousing() {
      while (monitorGroup.children.length > 0) {
        const obj = monitorGroup.children[0];
        monitorGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }

      chassisMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.chassisColor),
        roughness: 0.60,
        metalness: 0.20
      });

      bezelMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.bezelColor),
        roughness: 0.50,
        metalness: 0.28
      });

      panelMat = new THREE.MeshStandardMaterial({
        color: 0x161a20,
        roughness: 0.40,
        metalness: 0.55
      });

      metalDialMat = new THREE.MeshStandardMaterial({
        color: 0x8a929e,
        roughness: 0.30,
        metalness: 0.85
      });

      powerBtnMat = new THREE.MeshStandardMaterial({
        color: 0xc82a2a,
        roughness: 0.40,
        metalness: 0.25
      });

      ledMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.ledColor)
      });

      // 1. Unified seamless front bezel with screen aperture hole
      const bezelOuterShape = createRoundedRectShape(5.4, 4.35, 0.35);
      const hw = 4.05 / 2, hh = 3.05 / 2, hr = 0.22, hy = 0.22;
      const screenHole = new THREE.Path();
      screenHole.moveTo(-hw + hr, -hh + hy);
      screenHole.lineTo(hw - hr, -hh + hy);
      screenHole.quadraticCurveTo(hw, -hh + hy, hw, -hh + hy + hr);
      screenHole.lineTo(hw, hh + hy - hr);
      screenHole.quadraticCurveTo(hw, hh + hy, hw - hr, hh + hy);
      screenHole.lineTo(-hw + hr, hh + hy);
      screenHole.quadraticCurveTo(-hw, hh + hy, -hw, hh + hy - hr);
      screenHole.lineTo(-hw, -hh + hy + hr);
      screenHole.quadraticCurveTo(-hw, -hh + hy, -hw + hr, -hh + hy);
      bezelOuterShape.holes.push(screenHole);

      const bezelGeo = new THREE.ExtrudeGeometry(bezelOuterShape, {
        depth: 0.32,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 1,
        bevelSize: 0.06,
        bevelThickness: 0.06
      });
      const bezelMesh = new THREE.Mesh(bezelGeo, bezelMat);
      bezelMesh.position.set(0, 0, -0.06);
      bezelMesh.castShadow = true;
      bezelMesh.receiveShadow = true;
      monitorGroup.add(bezelMesh);

      // 2. Main cabinet body
      const cabinetShape = createRoundedRectShape(5.32, 4.28, 0.32);
      const cabinetGeo = new THREE.ExtrudeGeometry(cabinetShape, {
        depth: 3.5,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.05,
        bevelThickness: 0.05
      });
      const cabinetMesh = new THREE.Mesh(cabinetGeo, chassisMat);
      cabinetMesh.position.set(0, 0, -3.58);
      cabinetMesh.castShadow = true;
      cabinetMesh.receiveShadow = true;
      monitorGroup.add(cabinetMesh);

      // 3. Rear cathode neck extension
      const rearShape = createRoundedRectShape(3.5, 2.9, 0.25);
      const rearGeo = new THREE.ExtrudeGeometry(rearShape, {
        depth: 1.4,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.04,
        bevelThickness: 0.04
      });
      const rearMesh = new THREE.Mesh(rearGeo, chassisMat);
      rearMesh.position.set(0, 0.08, -4.98);
      rearMesh.castShadow = true;
      monitorGroup.add(rearMesh);

      // 4. Recessed control panel bay
      const panelPlateGeo = new THREE.BoxGeometry(4.75, 0.72, 0.05);
      const panelPlate = new THREE.Mesh(panelPlateGeo, panelMat);
      panelPlate.position.set(0, -1.54, 0.28);
      panelPlate.receiveShadow = true;
      monitorGroup.add(panelPlate);

      const badgePlate = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.20, 0.04), metalDialMat);
      badgePlate.position.set(-1.55, -1.54, 0.32);
      monitorGroup.add(badgePlate);

      const knobX = [-0.65, -0.15, 0.35, 0.85];
      knobX.forEach((px) => {
        const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.04, 24), bezelMat);
        collar.rotation.x = Math.PI / 2;
        collar.position.set(px, -1.54, 0.31);
        monitorGroup.add(collar);

        const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.14, 24), metalDialMat);
        knob.rotation.x = Math.PI / 2;
        knob.position.set(px, -1.54, 0.38);
        knob.castShadow = true;
        monitorGroup.add(knob);

        const tick = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.07, 0.15), panelMat);
        tick.position.set(px, -1.50, 0.39);
        monitorGroup.add(tick);
      });

      const rockerBezel = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.36, 0.06), bezelMat);
      rockerBezel.position.set(2.05, -1.54, 0.31);
      monitorGroup.add(rockerBezel);

      const rockerBtn = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.26, 0.12), powerBtnMat);
      rockerBtn.position.set(2.05, -1.54, 0.37);
      rockerBtn.castShadow = true;
      monitorGroup.add(rockerBtn);

      const ledSocket = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.06, 20), metalDialMat);
      ledSocket.rotation.x = Math.PI / 2;
      ledSocket.position.set(1.58, -1.54, 0.31);
      monitorGroup.add(ledSocket);

      const ledDome = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), ledMat);
      ledDome.position.set(1.58, -1.54, 0.35);
      monitorGroup.add(ledDome);

      for (let s = -1.6; s <= 1.6; s += 0.28) {
        const vent = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.04, 1.8), bezelMat);
        vent.position.set(s, 2.22, -1.8);
        monitorGroup.add(vent);
      }

      // Stable pedestal base
      const swivelNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.85, 0.32, 28), chassisMat);
      swivelNeck.position.set(0, -2.14, -1.5);
      swivelNeck.castShadow = true;
      monitorGroup.add(swivelNeck);

      const basePlate = new THREE.Mesh(new THREE.CylinderGeometry(1.65, 1.8, 0.12, 36), chassisMat);
      basePlate.position.set(0, -2.26, -1.5);
      basePlate.castShadow = true;
      basePlate.receiveShadow = true;
      monitorGroup.add(basePlate);

      const footAngles = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
      footAngles.forEach(ang => {
        const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.20, 0.03, 16), panelMat);
        foot.position.set(Math.cos(ang) * 1.45, -2.31, -1.5 + Math.sin(ang) * 1.45);
        monitorGroup.add(foot);
      });

      monitorGroup.visible = params.chassisVisible;
    }

    buildMonitorHousing();

    // --- APPLY COLOR SCHEME ---
    function applyColorScheme(themeName) {
      params.theme = themeName;
      const t = PALETTES[themeName];
      if (!t) return;

      params.bgColor = t.bg;
      params.phosphorColor = t.phosphor;
      params.phosphorSecColor = t.phosphorSec;
      params.beamColor = t.beam;
      params.glowColor = t.glow;
      params.chassisColor = t.chassis;
      params.bezelColor = t.bezel;
      params.ledColor = t.led;

      if (!params.greenScreen) {
        scene.background.set(params.bgColor);
        renderer.setClearColor(params.bgColor, 1);
        if (floorMesh) floorMesh.visible = true;
      }

      if (screenMaterial) {
        screenMaterial.uniforms.uPhosphorColor.value.set(params.phosphorColor);
        screenMaterial.uniforms.uPhosphorSecColor.value.set(params.phosphorSecColor);
        screenMaterial.uniforms.uBeamColor.value.set(params.beamColor);
        screenMaterial.uniforms.uGlowColor.value.set(params.glowColor);
        screenMaterial.uniforms.uBgColor.value.set(params.bgColor);
      }

      screenPointLight.color.set(params.phosphorColor);
      ledPointLight.color.set(params.ledColor);

      if (chassisMat) chassisMat.color.set(params.chassisColor);
      if (bezelMat) bezelMat.color.set(params.bezelColor);
      if (ledMat) ledMat.color.set(params.ledColor);

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- GREENSCREEN TOGGLE ---
    function setGreenScreen(enabled) {
      params.greenScreen = enabled;
      if (enabled) {
        scene.background.set('#00ff00');
        renderer.setClearColor('#00ff00', 1);
        if (floorMesh) floorMesh.visible = false;
      } else {
        scene.background.set(params.bgColor);
        renderer.setClearColor(params.bgColor, 1);
        if (floorMesh) floorMesh.visible = true;
      }
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- RECREATE RENDERER (Antialias Toggle) ---
    function updateAntialias(val) {
      params.antialias = val;
      const oldCanvas = renderer.domElement;
      renderer.dispose();
      container.removeChild(oldCanvas);

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance',
        alpha: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.toneMappingExposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls.domElement = renderer.domElement;

      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setAntialias(params.antialias);
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.pixelRatio);
      }

      if (params.greenScreen) {
        scene.background.set('#00ff00');
        renderer.setClearColor('#00ff00', 1);
      } else {
        scene.background.set(params.bgColor);
        renderer.setClearColor(params.bgColor, 1);
      }
    }

    // --- PROCEDURAL RE-ROLL (Upon User Click) ---
    // NOTE: Does NOT shuffle or change Postprocessing settings!
    function randomizeScene() {
      const keys = Object.keys(PALETTES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randomKey);

      // Re-roll geometric and motion parameters
      params.refreshBarSpeed = 0.4 + Math.random() * 1.1;
      params.refreshBarIntensity = 1.1 + Math.random() * 1.2;
      params.refreshBarWidth = 0.07 + Math.random() * 0.12;
      params.decayPersistence = 0.6 + Math.random() * 1.2;

      params.horizontalRollSpeed = Math.random() < 0.35 ? (0.03 + Math.random() * 0.18) : 0.0;
      params.horizontalRollAmount = 0.015 + Math.random() * 0.04;

      params.scanlineCount = Math.floor(220 + Math.random() * 180);
      params.scanlineIntensity = 0.40 + Math.random() * 0.40;
      params.microRibDepth = 0.012 + Math.random() * 0.018;
      params.glassCurvature = 0.28 + Math.random() * 0.24;
      params.aberration = 0.005 + Math.random() * 0.012;

      params.toneMappingExposure = 1.05 + Math.random() * 0.45;
      renderer.toneMappingExposure = params.toneMappingExposure;
      params.keyLightIntensity = 1.8 + Math.random() * 1.2;
      keyLight.intensity = params.keyLightIntensity;
      params.screenLightIntensity = 1.8 + Math.random() * 1.5;
      screenPointLight.intensity = params.screenLightIntensity;

      createScreenMesh();

      if (screenMaterial) {
        screenMaterial.uniforms.uRefreshBarSpeed.value = params.refreshBarSpeed;
        screenMaterial.uniforms.uRefreshBarIntensity.value = params.refreshBarIntensity;
        screenMaterial.uniforms.uRefreshBarWidth.value = params.refreshBarWidth;
        screenMaterial.uniforms.uDecayPersistence.value = params.decayPersistence;
        screenMaterial.uniforms.uHorizontalRollSpeed.value = params.horizontalRollSpeed;
        screenMaterial.uniforms.uHorizontalRollAmount.value = params.horizontalRollAmount;
        screenMaterial.uniforms.uScanlineCount.value = params.scanlineCount;
        screenMaterial.uniforms.uScanlineIntensity.value = params.scanlineIntensity;
        screenMaterial.uniforms.uCurvature.value = params.glassCurvature;
        screenMaterial.uniforms.uAberration.value = params.aberration;
      }

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Distinguish click from OrbitControls drag
    let pointerDownPos = { x: 0, y: 0 };
    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist < 6 && params.clickToRandomize) {
        randomizeScene();
      }
    });

      screenPointLight.color.set(c);

    fColor.addColor(params, 'phosphorSecColor').name('Phosphor Accent').onChange(c => {
      if (screenMaterial) screenMaterial.uniforms.uPhosphorSecColor.value.set(c);
    });
    fColor.addColor(params, 'beamColor').name('Refresh Bar Color').onChange(c => {
      if (screenMaterial) screenMaterial.uniforms.uBeamColor.value.set(c);
    });
    fColor.addColor(params, 'glowColor').name('Phosphor Glow').onChange(c => {

      if (chassisMat) chassisMat.color.set(c);
    });
    fColor.addColor(params, 'bezelColor').name('Bezel Frame Color').onChange(c => {
      if (bezelMat) bezelMat.color.set(c);

      if (ledMat) ledMat.color.set(c);

    // 2. CRT Scanline Raster & Roll
    const fRaster = gui.addFolder('📺 CRT Raster & Roll Bar');
    fRaster.add(params, 'refreshBarSpeed', 0.1, 3.0, 0.05).name('Sweep Speed (Down)').onChange(v => {
      if (screenMaterial) screenMaterial.uniforms.uRefreshBarSpeed.value = v;

    fRaster.add(params, 'refreshBarIntensity', 0.2, 4.0, 0.05).name('Sweep Intensity').onChange(v => {
      if (screenMaterial) screenMaterial.uniforms.uRefreshBarIntensity.value = v;
    });
    fRaster.add(params, 'refreshBarWidth', 0.02, 0.35, 0.01).name('Sweep Bar Width').onChange(v => {
      if (screenMaterial) screenMaterial.uniforms.uRefreshBarWidth.value = v;

      if (screenMaterial) screenMaterial.uniforms.uDecayPersistence.value = v;

      if (screenMaterial) screenMaterial.uniforms.uScanlineIntensity.value = v;

    // 3. Camera & Motion

      camera.position.set(0, 0.25, 7.6);
      controls.target.set(0, 0, 0);
      controls.update();

    // --- CAMERA MOTION CONTROLLER ---
    let animClock = 0;

    function updateCamera(delta) {
      if (params.animationMode === 'Static View (No Movement)') {
        return;
      }

      const speedFactor = params.animSpeed * params.autoOrbitSpeed;
      const dt = delta * speedFactor;
      animClock += dt;

      const offset = camera.position.clone().sub(controls.target);
      const currentDist = offset.length();
      if (currentDist < 0.001) return;

      const up = new THREE.Vector3(0, 1, 0);

      if (params.animationMode === 'Slow Orbital Drift') {
        offset.applyAxisAngle(up, dt * 0.25);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Gentle CRT Breathing') {
        const yawDelta = Math.sin(animClock * 0.45) * 0.0018;
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        const pitchDelta = Math.cos(animClock * 0.35) * 0.0012;

        offset.applyAxisAngle(up, yawDelta);
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, pitchDelta);
        }
        offset.normalize().multiplyScalar(currentDist);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Subtle Horizontal Scan') {
        const yawRate = Math.cos(animClock * 0.3) * dt * 0.22;
        offset.applyAxisAngle(up, yawRate);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Low-Angle Phosphor Sweep') {
        offset.applyAxisAngle(up, dt * 0.2);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Cinematic Glass Glint') {
        const yawDelta = Math.sin(animClock * 0.5) * 0.0022;
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        const pitchDelta = Math.sin(animClock * 1.0) * 0.0016;

        offset.applyAxisAngle(up, yawDelta);
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, pitchDelta);
        }
        offset.normalize().multiplyScalar(currentDist);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Vertical Raster Tracking') {
        const sweepPhase = 1.0 - ((animClock * params.refreshBarSpeed * 0.4) % 1.0);
        const targetY = (sweepPhase - 0.5) * 0.35;
        controls.target.y = THREE.MathUtils.lerp(controls.target.y, targetY, dt * 2.2);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Smooth Figure-8 Glide') {
        const figYaw = Math.sin(animClock * 0.32) * 0.0028;
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        const figPitch = Math.cos(animClock * 0.64) * 0.002;

        offset.applyAxisAngle(up, figYaw);
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, figPitch);
        }
        offset.normalize().multiplyScalar(currentDist);
        camera.position.copy(controls.target).add(offset);
      }
    }

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const effectiveDt = delta * params.animSpeed;

      // 1. Update Camera
      updateCamera(delta);
      controls.update();

      // 2. Update Shader Uniforms
      if (screenMaterial) {
        screenMaterial.uniforms.uTime.value += effectiveDt;
      }

      // 3. Dynamic Screen Glow Light Modulation
      if (screenMaterial) {
        const sweepT = screenMaterial.uniforms.uTime.value * params.refreshBarSpeed;
        const sweepPhase = 1.0 - (sweepT % 1.0);
        const flicker = 1.0 + Math.sin(sweepPhase * Math.PI * 2.0) * 0.12;
        screenPointLight.intensity = params.screenLightIntensity * flicker;
      }

      // 4. Render through PostProcessor Suite
      if (postProcessor) {
        postProcessor.setMoonScreenPosition(camera, screenPointLight.position);
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();
  </script>
</body>
